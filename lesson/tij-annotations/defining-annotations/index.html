fining-annotations/tij-annotations-database-constraints\",\"tij-annotations/defining-annotations/tij-annotations-database-sqlstring\",\"tij-annotations/defining-annotations/tij-annotations-database-sqlinteger\",\"tij-annotations/defining-annotations/tij-annotations-database-uniqueness\",\"tij-annotations/defining-annotations/tij-annotations-database-member\",\"tij-annotations/defining-annotations/tij-annotations-database-tablecreator\"],\"exercises\":[\"tij-annotations/defining-annotations/tij-annotations-usecase\",\"tij-annotations/defining-annotations/tij-annotations-passwordutils\",\"tij-annotations/defining-annotations/tij-annotations-usecasetracker\",\"tij-annotations/defining-annotations/tij-annotations-simulatingnull\",\"tij-annotations/defining-annotations/tij-annotations-testable\",\"tij-annotations/defining-annotations/tij-annotations-database-dbtable\",\"tij-annotations/defining-annotations/tij-annotations-database-constraints\",\"tij-annotations/defining-annotations/tij-annotations-database-sqlstring\",\"tij-annotations/defining-annotations/tij-annotations-database-sqlinteger\",\"tij-annotations/defining-annotations/tij-annotations-database-uniqueness\",\"tij-annotations/defining-annotations/tij-annotations-database-member\",\"tij-annotations/defining-annotations/tij-annotations-database-tablecreator\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-annotations/defining-annotations/step-1\",\"title\":\"Defining annotations\",\"body\":\"\u003cp\u003e\u003ccode\u003e@interface UseCase { int id(); String description() default \u0026quot;no description\u0026quot;; }\u003c/code\u003e declares an annotation with two elements.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e@Target\u003c/code\u003e says where it may appear (methods, fields, types…); \u003ccode\u003e@Retention(RUNTIME)\u003c/code\u003e keeps it in the class file for reflection.\u003c/p\u003e\\n\u003cp\u003eAn element named \u003ccode\u003evalue\u003c/code\u003e can be set without its name: \u003ccode\u003e@SQLString(30)\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-annotations/defining-annotations/step-2\",\"title\":\"Reading them\",\"body\":\"\u003cp\u003eWith \u003ccode\u003eRUNTIME\u003c/code\u003e retention, \u003ccode\u003emethod.getAnnotation(UseCase.class)\u003c/code\u003e returns the annotation (or \u003ccode\u003enull\u003c/code\u003e), and you call its elements like methods.\u003c/p\u003e\\n\u003cp\u003eElements can\u0026#39;t be \u003ccode\u003enull\u003c/code\u003e: defaults like \u003ccode\u003e\u0026quot;\u0026quot;\u003c/code\u003e or \u003ccode\u003e-1\u003c/code\u003e stand for \u0026quot;not set\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eAnnotations can nest: \u003ccode\u003econstraints = @Constraints(primaryKey = true)\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-annotations-usecase\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-usecase\",\"prompt\":\"\u003cp\u003e\u003ccode\u003e@UseCase(id = 48)\u003c/code\u003e leaves out \u003ccode\u003edescription\u003c/code\u003e. What does \u003ccode\u003euc.description()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u0026quot;no description\u0026quot; — the default\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile — every element must be given\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly elements without defaults are required.\u003c/p\u003e\\n\"},{\"html\":\"null\",\"correct\":false,\"feedback\":\"\u003cp\u003eElements with defaults return the default.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-annotations-passwordutils\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-passwordutils\",\"prompt\":\"\u003cp\u003eDo the \u003ccode\u003e@UseCase\u003c/code\u003e annotations change what these methods do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Yes — they validate the methods\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing happens unless something processes them.\u003c/p\u003e\\n\"},{\"html\":\"No — annotations are data about the code; a tool must read them to have any effect\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-annotations-usecasetracker\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-usecasetracker\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePasswordUtils\u003c/code\u003e has methods annotated with use cases 47 (with a description), 48 (no description) and 49 (with a description). What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003egetDeclaredMethods()\u003c/code\u003e doesn\u0026#39;t promise any order, so the found lines can come out in a different order on other JVMs.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eFound Use Case:47 Passwords must contain at least one numeric\\nFound Use Case:48 no description\\nFound Use Case:49 New passwords can't equal previously used ones\\nWarning: Missing use case-50\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eFound Use Case:47 Passwords must contain at least one numeric\\nFound Use Case:48 no description\\nFound Use Case:49 New passwords can't equal previously used ones\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eUse case 50 is in the list but no method has it.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eFound Use Case:47 Passwords must contain at least one numeric\\nFound Use Case:48 null\\nFound Use Case:49 New passwords can't equal previously used ones\\nWarning: Missing use case-50\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eUse case 48 gets the default description.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-annotations-simulatingnull\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-simulatingnull\",\"prompt\":\"\u003cp\u003eWhy give \u003ccode\u003eid\u003c/code\u003e a default of −1 rather than leaving it null?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"Annotation elements can never be \u003ccode\u003enull\u003c/code\u003e; a sentinel like −1 stands for \u0026quot;absent\u0026quot;\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"For speed\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s a language restriction.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-annotations-testable\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-testable\",\"prompt\":\"\u003cp\u003e\u003ccode\u003e@Test\u003c/code\u003e here is AtUnit\u0026#39;s annotation. What does marking \u003ccode\u003etestExecute()\u003c/code\u003e with it do on its own?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Nothing at run time until a tool like AtUnit finds and runs it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It runs the method when the class loads\",\"correct\":false,\"feedback\":\"\u003cp\u003eAnnotations don\u0026#39;t execute anything.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-annotations-database-dbtable\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-database-dbtable\",\"prompt\":\"\u003cp\u003eWhere can \u003ccode\u003e@DBTable\u003c/code\u003e be used?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"On classes (and interfaces/enums) — \u003ccode\u003e@Target(ElementType.TYPE)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Anywhere\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e@Target\u003c/code\u003e restricts it.\u003c/p\u003e\\n\"},{\"html\":\"On fields\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would need \u003ccode\u003eElementType.FIELD\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-annotations-database-constraints\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-database-constraints\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003e@Constraints\u003c/code\u003e with no elements mean?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery element has a default, so \u003ccode\u003e@Constraints\u003c/code\u003e alone is fine.\u003c/p\u003e\\n\"},{\"html\":\"Not a primary key, nulls allowed, not unique — all the defaults\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-annotations-database-sqlstring\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-database-sqlstring\",\"prompt\":\"\u003cp\u003eWhy can \u003ccode\u003eMember\u003c/code\u003e write \u003ccode\u003e@SQLString(30)\u003c/code\u003e instead of \u003ccode\u003e@SQLString(value = 30)\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"An element named \u003ccode\u003evalue\u003c/code\u003e can be given positionally when it\u0026#39;s the only one set\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The first element is always positional\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly an element named \u003ccode\u003evalue\u003c/code\u003e gets the shortcut.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-annotations-database-sqlinteger\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-database-sqlinteger\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the default for \u003ccode\u003econstraints()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"null\",\"correct\":false,\"feedback\":\"\u003cp\u003eElements can\u0026#39;t be null.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e@Constraints\u003c/code\u003e with its own defaults — an annotation can be an element\u0026#39;s type and default\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-annotations-database-uniqueness\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-database-uniqueness\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003e@Uniqueness\u003c/code\u003e mean when used with no arguments?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1c\",\"options\":[{\"html\":\"Nothing — it has no elements\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt has a \u003ccode\u003econstraints\u003c/code\u003e element with a nested default.\u003c/p\u003e\\n\"},{\"html\":\"Its \u003ccode\u003econstraints\u003c/code\u003e is \u003ccode\u003e@Constraints(unique=true)\u003c/code\u003e — a nested annotation with one element changed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-annotations-database-member\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-database-member\",\"prompt\":\"\u003cp\u003eWhy isn\u0026#39;t \u003ccode\u003ememberCount\u003c/code\u003e a column?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1d\",\"options\":[{\"html\":\"Because it\u0026#39;s static\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe tool checks annotations, not modifiers.\u003c/p\u003e\\n\"},{\"html\":\"It has no SQL annotation, so the table creator skips it\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-annotations-database-tablecreator\",\"key\":\"tij-annotations/defining-annotations/tij-annotations-database-tablecreator\",\"prompt\":\"\u003cp\u003eRun with \u003ccode\u003eannotations.database.Member\u003c/code\u003e. What\u0026#39;s odd about the output?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1e\",\"options\":[{\"html\":\"It prints the SQL once\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003eStringBuilder\u003c/code\u003e and \u003ccode\u003eprintln\u003c/code\u003e are inside the \u003ccode\u003efor\u003c/code\u003e loop over fields — a slip in the book.\u003c/p\u003e\\n\"},{\"html\":\"It prints nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eMember\u003c/code\u003e has \u003ccode\u003e@DBTable\u003c/code\u003e and annotated fields.\u003c/p\u003e\\n\"},{\"html\":\"It prints a growing \u003ccode\u003eCREATE TABLE MEMBER(…)\u003c/code\u003e after every annotated field — the print is inside the field loop\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Annotations\",\"next\":{\"id\":\"compile-time-processing\",\"courseId\":\"tij-annotations\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-annotations/compile-time-processing\",\"title\":\"Processing annotations at compile time\",\"summary\":\"SOURCE-retention annotations and processors that generate code — the Java 5 apt tool, and what replaced it.\",\"duration\":8,\"tags\":[\"java\",\"annotations\",\"annotation processing\",\"apt\",\"code generation\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 20, Using apt to process annotations; Using the Visitor pattern with apt\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"tij-annotations/compile-time-processing/step-1\",\"tij-annotations/compile-time-processing/step-2\",\"tij-annotations/compile-time-processing/tij-annotations-extractinterface\",\"tij-annotations/compile-time-processing/tij-annotations-multiplier\",\"tij-annotations/compile-time-processing/tij-annotations-interfaceextractorprocessor\",\"tij-annotations/compile-time-processing/tij-annotations-interfaceextractorprocessorfactory\",\"tij-annotations/compile-time-processing/tij-annotations-database-tablecreationprocessorfactory\"],\"exercises\":[\"tij-annotations/compile-time-processing/t
