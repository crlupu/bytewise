 own methods synchronize on the list.\u003c/p\u003e\\n\u003cp\u003eTwo different locks don\u0026#39;t exclude each other, so another thread can call \u003ccode\u003elist.add(x)\u003c/code\u003e between \u003ccode\u003econtains\u003c/code\u003e and \u003ccode\u003eadd\u003c/code\u003e here.\u003c/p\u003e\\n\u003cp\u003eThe method looks atomic but isn\u0026#39;t. To join the list\u0026#39;s own locking, the helper must synchronize on the list itself, as \u003ccode\u003eCollections.synchronizedList\u003c/code\u003e documents.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"No — it locks the \u003ccode\u003eListHelper\u003c/code\u003e, but the list\u0026#39;s other methods lock the list itself\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes — the method is synchronized\",\"correct\":false,\"feedback\":\"\u003cp\u003eSynchronized on the wrong lock. Another thread calling \u003ccode\u003elist.add\u003c/code\u003e doesn\u0026#39;t take the \u003ccode\u003eListHelper\u003c/code\u003e lock.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-composing-objects/adding-functionality/step-3\",\"title\":\"Use the right lock\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Client-side locking\\\" data-def=\\\"A caller guarding compound actions on an object with the same lock the object itself uses. Fragile — depends on knowing that lock.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eClient-side locking\u003c/button\u003e must use the object\u0026#39;s own lock.\u003c/p\u003e\\n\u003cp\u003eLocking your helper instead protects nothing.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-composing-objects/adding-functionality/step-4\",\"prompt\":\"\u003cp\u003e\u003cc
