ar\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"0\\\" y=\\\"13\\\" width=\\\"104.6\\\" height=\\\"34\\\" rx=\\\"8\\\"/\u003e\u003ctext class=\\\"dg-member dg-member--name\\\" x=\\\"9\\\" y=\\\"35\\\"\u003eShape s\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M72.6 13 V47\\\"/\u003e\u003ccircle class=\\\"dg-dot\\\" cx=\\\"88.6\\\" cy=\\\"30\\\" r=\\\"4.5\\\"/\u003e\u003c/g\u003e\u003cpath class=\\\"dg-edge\\\" d=\\\"M88.6 30 C138.6 30 138.6 15 186.6 15\\\"/\u003e\u003cpolygon class=\\\"dg-head dg-head--solid\\\" points=\\\"188.6,15 178.6,20 178.6,10\\\"/\u003e\u003cg class=\\\"dg-node\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"188.6\\\" y=\\\"0\\\" width=\\\"120\\\" height=\\\"60\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"200.6\\\" y=\\\"20\\\"\u003eCircle\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M188.6 30 H308.6\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"200.6\\\" y=\\\"49\\\"\u003eradius = 2.0\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003cfigcaption\u003eThe variable's type is Shape; the object is a Circle.\u003c/figcaption\u003e\u003c/figure\u003e\"},{\"id\":\"step-3\",\"key\":\"tij-polymorphism/upcasting/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eShape s = new Square(); s.draw();\u003c/code\u003e — tap the class whose \u003ccode\u003edraw()\u003c/code\u003e runs.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Late binding\\\" data-def=\\\"Choosing which method body to run at run time, from the object\u0026amp;#39;s actual class, rather than at compile time from the variable\u0026amp;#39;s type.\\\" data-book=\\\"Thinking in Java\\\"\u003eLate binding\u003c/button\u003e uses the object\u0026#39;s class, \u003ccode\u003eSquare\u003c/code\u003e, whatever type the variable has.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Shape\",\"methods\":[\"+ draw()\"]},{\"name\":\"Circle\",\"methods\":[\"+ draw()\"]},{\"name\":\"Square\",\"methods\":[\"+ draw()\"]},{\"name\":\"Triangle\",\"methods\":[\"+ draw()\"]}],\"relations\":[{\"from\":\"Circle\",\"to\":\"Shape\",\"type\":\"extends\"},{\"from\":\"Square\",\"to\":\"Shape\",\"type\":\"extends\"},{\"from\":\"Triangle\",\"to\":\"Shape\",\"type\":\"extends\"}]},\"feedback\":{\"Shape\":\"The variable's type is Shape, but the call goes to the object's own class.\",\"Circle\":\"The object is a Square.\",\"Triangle\":\"The object is a Square.\"}},\"goal\":{\"select\":\"Square\"},\"question\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"tij-polymorphism/upcasting/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eTriangle\u003c/code\u003e doesn\u0026#39;t override \u003ccode\u003eerase()\u003c/code\u003e. \u003ccode\u003eShape s = new Triangle(); s.erase();\u003c/code\u003e — whose \u003ccode\u003eerase()\u003c/code\u003e runs?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe JVM starts at the object\u0026#39;s class and walks up until it finds the method — here, in \u003ccode\u003eShape\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Shape\",\"methods\":[\"+ draw()\",\"+ erase()\"]},{\"name\":\"Circle\",\"methods\":[\"+ draw()\",\"+ erase()\"]},{\"name\":\"Triangle\",\"methods\":[\"+ draw()\"]}],\"relations\":[{\"from\":\"Circle\",\"to\":\"Shape\",\"type\":\"extends\"},{\"from\":\"Triangle\",\"to\":\"Shape\",\"type\":\"extends\"}]},\"feedback\":{\"Triangle\":\"`Triangle` has no `erase()` of its own, so the search continues upwards.\",\"Circle\":\"Circle is a sibling, not an ancestor — it's never searched.\"}},\"goal\":{\"select\":\"Shape\"},\"question\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"tij-polymorphism/upcasting/step-5\",\"title\":\"Code that talks to the base class\",\"body\":\"\u003cp\u003eWrite methods against \u003ccode\u003eShape\u003c/code\u003e, not each subclass.\u003c/p\u003e\\n\u003cp\u003eThen adding a \u003ccode\u003eHexagon\u003c/code\u003e needs no change to them.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s the payoff: new types plug into old code.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"tij-polymorphism/upcasting/step-6\",\"prompt\":\"\u003cp\u003eWhich method keeps working, unchanged, when you add a new \u003ccode\u003eHexagon\u003c/code\u003e subclass?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003evoid render(Object o) { if (o instanceof Circle) ((Circle) o).draw(); else if (o instanceof Square) ((Square) o).draw(); }\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery new shape needs another branch — the switch polymorphism removes.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003evoid render(Circle c) { c.draw(); }\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt only accepts circles; a Hexagon can\u0026#39;t be passed in.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003evoid render(Shape s) { s.draw(); }\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-polymorphism-shapes\",\"key\":\"tij-polymorphism/upcasting/tij-polymorphism-shapes\",\"prompt\":\"\u003cp\u003e\u003ccode\u003egen.next()\u003c/code\u003e returns a random \u003ccode\u003eCircle\u003c/code\u003e, \u003ccode\u003eSquare\u003c/code\u003e or \u003ccode\u003eTriangle\u003c/code\u003e, \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Upcasting\\\" data-def=\\\"Treating an object as an instance of one of its supertypes — a \u0026lt;code\u0026gt;Circle\u0026lt;/code\u0026gt; as a \u0026lt;code\u0026gt;Shape\u0026lt;/code\u0026gt;. Always safe, and done automatically.\\\" data-book=\\\"Thinking in Java\\\"\u003eupcast\u003c/button\u003e to \u003ccode\u003eShape\u003c/code\u003e. Each subclass overrides \u003ccode\u003edraw()\u003c/code\u003e to print its own name. What does the second loop print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Each shape\u0026#39;s own \u003ccode\u003edraw()\u003c/code\u003e, like \u003ccode\u003eTriangle.draw()\u003c/code\u003e or \u003ccode\u003eCircle.draw()\u003c/code\u003e, chosen at run time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eShape.draw()\u003c/code\u003e nine times — the array\u0026#39;s type is \u003ccode\u003eShape\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eCalls are bound late, to the actual object\u0026#39;s method.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile — \u003ccode\u003egen.next()\u003c/code\u003e returns a \u003ccode\u003eShape\u003c/code\u003e, not a specific shape\",\"correct\":false,\"feedback\":\"\u003cp\u003eStoring subclasses as \u003ccode\u003eShape\u003c/code\u003e is the point of upcasting.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-polymorphism-transmogrify\",\"key\":\"tij-polymorphism/upcasting/tij-polymorphism-transmogrify\",\"prompt\":\"\u003cp\u003eWhat does thi
