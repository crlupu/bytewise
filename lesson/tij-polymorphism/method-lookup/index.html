xt class=\"dg-name\" x=\"170\" y=\"399\" text-anchor=\"middle\"\u003eSaxophone\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003c/figure\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"method-lookup\",\"courseId\":\"tij-polymorphism\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-polymorphism/method-lookup\",\"title\":\"Finding the method in a deep hierarchy\",\"summary\":\"The JVM starts at the object's own class and walks up until it finds a method with the right signature.\",\"duration\":5,\"tags\":[\"java\",\"thinking in java\",\"polymorphism\",\"overriding\",\"dynamic dispatch\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 8, Polymorphism — The twist: extensibility\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"tij-polymorphism/method-lookup/step-1\",\"tij-polymorphism/method-lookup/step-2\",\"tij-polymorphism/method-lookup/step-3\",\"tij-polymorphism/method-lookup/step-4\",\"tij-polymorphism/method-lookup/step-5\",\"tij-polymorphism/method-lookup/step-6\"],\"exercises\":[\"tij-polymorphism/method-lookup/step-3\",\"tij-polymorphism/method-lookup/step-4\",\"tij-polymorphism/method-lookup/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-polymorphism/method-lookup/step-1\",\"title\":\"The orchestra\",\"body\":\"\u003cp\u003eEvery instrument can \u003ccode\u003eplay()\u003c/code\u003e a note and \u003ccode\u003eadjust()\u003c/code\u003e itself.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eWind\u003c/code\u003e overrides \u003ccode\u003eplay()\u003c/code\u003e; \u003ccode\u003eBrass\u003c/code\u003e overrides only \u003ccode\u003eadjust()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eMusic.tune(Instrument i)\u003c/code\u003e calls \u003ccode\u003ei.play()\u003c/code\u003e without knowing which instrument it has.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-polymorphism/method-lookup/step-2\",\"title\":\"Start at the object, walk up\",\"body\":\"\u003cp\u003eA call goes to the object\u0026#39;s real class first.\u003c/p\u003e\\n\u003cp\u003eIf that class doesn\u0026#39;t define the method, the JVM looks in its parent, and so on.\u003c/p\u003e\\n\u003cp\u003eThe first match wins.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"tij-polymorphism/method-lookup/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eInstrument i = new Brass(); i.play(Note.C);\u003c/code\u003e — tap the class whose \u003ccode\u003eplay\u003c/code\u003e runs.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBrass\u003c/code\u003e has no \u003ccode\u003eplay\u003c/code\u003e, so the JVM moves up to \u003ccode\u003eWind\u003c/code\u003e, which has one.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA call like \u003ccode\u003ei.play(...)\u003c/code\u003e is late-bound: at run time, the JVM looks at the object\u0026#39;s real class, \u003ccode\u003eBrass\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eBrass\u003c/code\u003e doesn\u0026#39;t define \u003ccode\u003eplay\u003c/code\u003e, so the lookup moves up to its superclass \u003ccode\u003eWind\u003c/code\u003e, which does.\u003c/p\u003e\\n\u003cp\u003eThe declared type, \u003ccode\u003eInstrument\u003c/code\u003e, only decides whether the call compiles; it plays no part in choosing which code runs.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Instrument\",\"methods\":[\"+ play(Note)\",\"+ adjust()\"]},{\"name\":\"Wind\",\"methods\":[\"+ play(Note)\"]},{\"name\":\"Percussion\",\"methods\":[\"+ play(Note)\"]},{\"name\":\"Brass\",\"methods\":[\"+ adjust()\"]},{\"name\":\"Woodwind\",\"methods\":[\"+ play(Note)\"]}],\"relations\":[{\"from\":\"Wind\",\"to\":\"Instrument\",\"type\":\"extends\"},{\"from\":\"Percussion\",\"to\":\"Instrument\",\"type\":\"extends\"},{\"from\":\"Brass\",\"to\":\"Wind\",\"type\":\"extends\"},{\"from\":\"Woodwind\",\"to\":\"Wind\",\"type\":\"extends\"}]},\"feedback\":{\"Brass\":\"`Brass` doesn't define `play`, so the search moves up to its parent.\",\"Instrument\":\"The search stops at the first class that defines `play` — before reaching `Instrument`.\",\"Woodwind\":\"Woodwind is a sibling of Brass, not an ancestor.\",\"Percussion\":\"Percussion isn't on Brass's path to the root.\"}},\"goal\":{\"select\":\"Wind\"},\"question\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"tij-polymorphism/method-lookup/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eInstrument i = new Brass(); i.adjust();\u003c/code\u003e — whose \u003ccode\u003eadjust\u003c/code\u003e runs?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe object\u0026#39;s own class defines \u003ccode\u003eadjust\u003c/code\u003e, so that one runs.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Instrument\",\"methods\":[\"+ play(Note)\",\"+ adjust()\"]},{\"name\":\"Wind\",\"methods\":[\"+ play(Note)\"]},{\"name\":\"Brass\",\"methods\":[\"+ adjust()\"]},{\"name\":\"Woodwind\",\"methods\":[\"+ play(Note)\"]}],\"relations\":[{\"from\":\"Wind\",\"to\":\"Instrument\",\"type\":\"extends\"},{\"from\":\"Brass\",\"to\":\"Wind\",\"type\":\"extends\"},{\"from\":\"Woodwind\",\"to\":\"Wind\",\"type\":\"extends\"}]},\"feedback\":{\"Instrument\":\"`Brass` overrides `adjust` itself, so the search never gets this far.\",\"Wind\":\"`Wind` doesn't define `adjust` — and `Brass`, below it, does.\"}},\"goal\":{\"select\":\"Brass\"},\"question\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"tij-polymorphism/method-lookup/step-5\",\"title\":\"Adding a class changes nothing else\",\"body\":\"\u003cp\u003eAdd \u003ccode\u003eStringed\u003c/code\u003e, or a new \u003ccode\u003eSaxophone extends Woodwind\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eMusic.tune\u003c/code\u003e works with them unchanged.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s the extensibility polymorphism buys.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"tij-polymorphism/method-lookup/step-6\",\"prompt\":\"\u003cp\u003eYou add \u003ccode\u003eclass Saxophone extends Woodwind\u003c/code\u003e that overrides nothing. What does \u003ccode\u003etune(new Saxophone())\u003c/code\u003e play?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$14\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile until Saxophone overrides \u003ccode\u003eplay\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eplay\u003c/code\u003e isn\u0026#39;t abstract, so Saxophone inherits a working version.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eWoodwind.play\u003c/code\u003e, the nearest definition above it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eInstrument.play\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe search stops at the first class up the chain that defines \u003ccode\u003eplay\u003c/code\u003e — \u003ccode\u003eWoodwind\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Polymorphism\",\"next\":{\"id\":\"not-polymorphic\",\"courseId\":\"tij-polymorphism\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-polymorphism/not-polymorphic\",\"title\":\"What isn't polymorphic\",\"summary\":\"Private methods, fields and static methods are chosen by the declared type, at compile time — only overridable instance methods use late binding.\",\"duration\":6,\"tags\":[\"java\",\"thinking in java\",\"polymorphism\",\"private\",\"fields\",\"static\",\"hiding\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"C
