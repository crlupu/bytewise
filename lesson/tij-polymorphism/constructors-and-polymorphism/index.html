nstructors and polymorphism\",\"summary\":\"A polymorphic call from a base-class constructor reaches the subclass before the subclass is initialized — and downcasting is checked at run time.\",\"duration\":6,\"tags\":[\"java\",\"thinking in java\",\"polymorphism\",\"constructors\",\"downcasting\",\"classcastexception\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 8, Polymorphism — Behavior of polymorphic methods inside constructors\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"tij-polymorphism/constructors-and-polymorphism/step-1\",\"tij-polymorphism/constructors-and-polymorphism/step-2\",\"tij-polymorphism/constructors-and-polymorphism/step-3\",\"tij-polymorphism/constructors-and-polymorphism/step-4\",\"tij-polymorphism/constructors-and-polymorphism/step-5\"],\"exercises\":[\"tij-polymorphism/constructors-and-polymorphism/step-2\",\"tij-polymorphism/constructors-and-polymorphism/step-3\",\"tij-polymorphism/constructors-and-polymorphism/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-polymorphism/constructors-and-polymorphism/step-1\",\"title\":\"The Glyph trap\",\"body\":\"\u003cp\u003e\u003ccode\u003eGlyph\u003c/code\u003e\u0026#39;s constructor calls \u003ccode\u003edraw()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eRoundGlyph\u003c/code\u003e overrides \u003ccode\u003edraw()\u003c/code\u003e to print its \u003ccode\u003eradius\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe override runs during \u003ccode\u003eGlyph()\u003c/code\u003e — before \u003ccode\u003eRoundGlyph\u003c/code\u003e\u0026#39;s fields are initialized.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-polymorphism/constructors-and-polymorphism/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003enew RoundGlyph(5)\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe rule — do as little as possible in a constructor, and call only \u003ccode\u003efinal\u003c/code\u003e or \u003ccode\u003eprivate\u003c/code\u003e methods there.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBefore any constructor runs, the whole object\u0026#39;s memory is zeroed, so \u003ccode\u003eradius\u003c/code\u003e already exists with the value 0.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eGlyph()\u003c/code\u003e runs first and calls \u003ccode\u003edraw()\u003c/code\u003e, which is late-bound like any other call, so it reaches \u003ccode\u003eRoundGlyph.draw\u003c/code\u003e even though \u003ccode\u003eRoundGlyph\u003c/code\u003e\u0026#39;s part isn\u0026#39;t initialized yet.\u003c/p\u003e\\n\u003cp\u003eOnly after \u003ccode\u003eGlyph()\u003c/code\u003e returns do \u003ccode\u003eRoundGlyph\u003c/code\u003e\u0026#39;s field initializers and constructor body run, setting \u003ccode\u003eradius\u003c/code\u003e to 5.\u003c/p\u003e\\n\u003cp\u003eA base-class constructor that calls an overridable method lets a subclass see itself half-built — a bug the compiler won\u0026#39;t warn you about.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ebefore RoundGlyph.draw radius=0 after RoundGlyph radius=5\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ebefore RoundGlyph.draw radius=1 after RoundGlyph radius=5\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eradius = 1\u003c/code\u003e is a field initializer of \u003ccode\u003eRoundGlyph\u003c/code\u003e; it runs after \u003ccode\u003eGlyph()\u003c/code\u003e returns. During \u003ccode\u003eGlyph()\u003c/code\u003e, radius is still the default, 0.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ebefore Glyph.draw after RoundGlyph radius=5\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003edraw()\u003c/code\u003e is late-bound even inside a constructor, so \u003ccode\u003eRoundGlyph.draw\u003c/code\u003e runs.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"tij-polymorphism/constructors-and-polymorphism/step-3\",\"prompt\":\"$15\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The object\u0026#39;s memory is zeroed — \u003ccode\u003eradius\u003c/code\u003e is 0\",\"\u003ccode\u003eGlyph()\u003c/code\u003e runs and calls the overridden \u003ccode\u003edraw()\u003c/code\u003e\",\"\u003ccode\u003eRoundGlyph\u003c/code\u003e\u0026#39;s field initializer sets \u003ccode\u003eradius = 1\u003c/code\u003e\",\"The \u003ccode\u003eRoundGlyph\u003c/code\u003e constructor body sets \u003ccode\u003eradius = 5\u003c/code\u003e\"],\"start\":[0,1,3,2]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tij-polymorphism/constructors-and-polymorphism/step-4\",\"title\":\"Downcasting is checked\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Upcasting\\\" data-def=\\\"Treating an object as an instance of one of its supertypes — a \u0026lt;code\u0026gt;Circle\u0026lt;/code\u0026gt; as a \u0026lt;code\u0026gt;Shape\u0026lt;/code\u0026gt;. Always safe, and done automatically.\\\" data-book=\\\"Thinking in Java\\\"\u003eUpcasting\u003c/button\u003e is always safe; \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Downcasting\\\" data-def=\\\"Casting a reference down the hierarchy, like \u0026lt;code\u0026gt;(Circle) shape\u0026lt;/code\u0026gt;. Checked at run time; throws \u0026lt;code\u0026gt;ClassCastException\u0026lt;/code\u0026gt; if the object isn\u0026amp;#39;t really that type.\\\" data-book=\\\"Thinking in Java\\\"\u003edowncasting\u003c/button\u003e is a claim.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e(MoreUseful) x\u003c/code\u003e only works if \u003ccode\u003ex\u003c/code\
