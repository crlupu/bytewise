an style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003eprintln\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(sup.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003edynamicGet\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e());\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"not-polymorphic\",\"courseId\":\"tij-polymorphism\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-polymorphism/not-polymorphic\",\"title\":\"What isn't polymorphic\",\"summary\":\"Private methods, fields and static methods are chosen by the declared type, at compile time — only overridable instance methods use late binding.\",\"duration\":6,\"tags\":[\"java\",\"thinking in java\",\"polymorphism\",\"private\",\"fields\",\"static\",\"hiding\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 8, Polymorphism — Pitfalls: overriding private methods, fields and static methods\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"tij-polymorphism/not-polymorphic/step-1\",\"tij-polymorphism/not-polymorphic/step-2\",\"tij-polymorphism/not-polymorphic/step-3\",\"tij-polymorphism/not-polymorphic/step-4\",\"tij-polymorphism/not-polymorphic/step-5\",\"tij-polymorphism/not-polymorphic/step-6\",\"tij-polymorphism/not-polymorphic/step-7\"],\"exercises\":[\"tij-polymorphism/not-polymorphic/step-2\",\"tij-polymorphism/not-polymorphic/step-4\",\"tij-polymorphism/not-polymorphic/step-6\",\"tij-polymorphism/not-polymorphic/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-polymorphism/not-polymorphic/step-1\",\"title\":\"Private methods can't be overridden\",\"body\":\"\u003cp\u003eA private method is invisible to subclasses.\u003c/p\u003e\\n\u003cp\u003eA subclass method with the same name is a brand-new method.\u003c/p\u003e\\n\u003cp\u003eCalls inside the base class still reach the private one.\u003c/p\u003e\\n\",\"diagram\":\"\u003cfigure class=\\\"diagram\\\"\u003e\u003csvg class=\\\"dg\\\" viewBox=\\\"-8 -8 159 196\\\" width=\\\"159\\\" style=\\\"width:100%;max-width:159px;min-width:103px;height:auto\\\" role=\\\"img\\\" aria-label=\\\"Diagram\\\"\u003e\u003cpath class=\\\"dg-edge\\\" d=\\\"M71.5 120 V86\\\"/\u003e\u003cpath class=\\\"dg-edge\\\" d=\\\"M71.5 86 H71.5 M71.5 86 V73\\\"/\u003e\u003cpolygon class=\\\"dg-head dg-head--open\\\" points=\\\"71.5,60 64.5,73 78.5,73\\\"/\u003e\u003cg class=\\\"dg-node dg-node--class\\\" data-node=\\\"PrivateOverride\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"0\\\" y=\\\"0\\\" width=\\\"143\\\" height=\\\"60\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"71.5\\\" y=\\\"21\\\" text-anchor=\\\"middle\\\"\u003ePrivateOverride\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M0 32 H143\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"50\\\"\u003e- f()\u003c/text\u003e\u003c/g\u003e\u003cg class=\\\"dg-node dg-node--class\\\" data-node=\\\"Derived\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"31.5\\\" y=\\\"120\\\" width=\\\"80\\\" height=\\\"60\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"71.5\\\" y=\\\"141\\\" text-anchor=\\\"middle\\\"\u003eDerived\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M31.5 152 H111.5\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"43.5\\\" y=\\\"170\\\"\u003e+ f()\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003c/figure\u003e\"},{\"id\":\"step-2\",\"key\":\"tij-polymorphism/not-polymorphic/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003emain\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGive subclass methods different names from private base methods, and use \u003ccode\u003e@Override\u003c/code\u003e to catch the mistake.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA \u003ccode\u003eprivate\u003c/code\u003e method is invisible outside its class, so a method with the same name in a subclass doesn\u0026#39;t override it — it\u0026#39;s a brand-new, unrelated method.\u003c/p\u003e\\n\u003cp\u003eThe call \u003ccode\u003epo.f()\u003c/code\u003e is compiled inside \u003ccode\u003ePrivateOverride\u003c/code\u003e, where the variable\u0026#39;s type is \u003ccode\u003ePrivateOverride\u003c/code\u003e, so it binds to the private \u003ccode\u003ef()\u003c/code\u003e directly, with no \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Late binding\\\" data-def=\\\"Choosing which method body to run at run time, from the object\u0026amp;#39;s actual class, rather than at compile time from the variable\u0026amp;#39;s type.\\\" data-book=\\\"Thinking in Java\\\"\u003elate binding\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eAdding \u003ccode\u003e@Override\u003c/code\u003e to the subclass method would make the compiler reject it, which is exactly why the annotation is worth writing.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eprivate f()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003epublic f()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eDerived.f\u003c/code\u003e doesn\u0026#39;t override a private method — it can\u0026#39;t see it. The call through \u003ccode\u003ePrivateOverride\u003c/code\u003e binds to the private \u003ccode\u003ef\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-polymorphism/not-polymorphic/step-3\",\"title\":\"Fields are chosen by the declared type\",\"body\":\"\u003cp\u003eA field in a subclass with the same name hides the base field.\u003c/p\u003e\\n\u003cp\u003eBoth exist in the object.\u003c/p\u003e\\n\u003cp\u003eWhich one you get depends on the variable\u0026#39;s type, not the object\u0026#39;s.\u003c/p\u003e\\n\",\"diagram\":\"\u003cfigure class=\\\"diagram\\\"\u003e\u003csvg class=\\\"dg\\\" viewBox=\\\"-8 -8 361.2 98\\\" width=\\\"361\\\" style=\\\"width:100%;max-width:361px;min-width:235px;height:auto\\\" role=\\\"img\\\" aria-label=\\\"A Sub object holds both fields.\\\"\u003e\u003cg class=\\\"dg-var\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"0\\\" y=\\\"24\\\" width=\\\"120.2\\\" height=\\\"34\\\" rx=\\\"8\\\"/\u003e\u003ctext class=\\\"dg-member dg-member--name\\\" x=\\\"9\\\" y=\\\"46\\\"\u003eSuper sup\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M88.2 24 V58\\\"/\u003e\u003ccircle class=\\\"dg-dot\\\" cx=\\\"104.2\\\" cy=\\\"41\\\" r=\\\"4.5\\\"/\u003e\u003c/g\u003e\u003cpath class=\\\"dg-edge\\\" d=\\\"M104.2 41 C154.2 41 154.2 15 202.2 15\\\"/\u003e\u003cpolygon class=\\\"dg-head dg-head--solid\\\" points=\\\"204.2,15 194.2,20 194.2,10\\\"/\u003e\u003cg class=\\\"dg-node\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"204.2\\\" y=\\\"0\\\" width=\\\"141\\\" height=\\\"82\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"216.2\\\" y=\\\"20\\\"\u003eSub\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M204.2 30 H345.2\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"216.2\\\" y=\\\"49\\\"\u003eSuper.field = 0\u003c/text\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"216.2\\\" y=\\\"71\\\"\u003eSub.field = 1\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003cfigcaption\u003eA Sub object holds both fields.\u003c/figcaption\u003e\u003c/figure\u003e\"},{\"id\":\"step-4\",\"key\":\"tij-polymorphism/not-polymorphic/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eSuper\u003c/code\u003e has \u003ccode\u003efield = 0\u003c/code\u003e and \u003ccode\u003egetField()\u003c/code\u003e; \u003ccode\u003eSub\u003c/code\u003e has its own \u003ccode\u003efield = 1\u003c/code\u003e and overrides \u003ccode\u003egetField()\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eFields are never polymorphic: \u003ccode\u003esup.field\u003c/code\u003e is resolved at compile time from the variable\u0026#39;s declared type, \u003ccode\u003eSuper\u003c/code\u003e, so it reads \u003ccode\u003eSuper\u003c/code\u003e\u0026#39;s field, which is 0.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eSub\u003c/code\u003e object actually holds two fields named \u003ccode\u003efield\u003c/code\u003e, one from each class, and the subclass one only hides the other.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003egetField()\u003c/code\u003e is an instance method, so \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Late binding\\\" data-def=\\\"Choosing which method body to run at run time, from the object\u0026amp;#39;s actual class, rather than at compile time from the variable\u0026amp;#39;s type.\\\" data-book=\\\"Thinking in Java\\\"\u003elate binding\u003c/button\u003e picks \u003ccode\u003eSub.getField()\u003c/code\u003e, which returns \u003ccode\u003eSub\u003c/code\u003e\u0026#39;s field, 1.\u003c/p\u003e\\n\u003cp\u003eKeep fields private and expose them through methods, and this confusion can\u0026#39;t arise.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1 1\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe field access uses the declared type, \u003ccode\u003eSuper\u003c/code\u003e; only the method call is late-bound.\u003c/p\u003e\\n\"},{\"html\":\"0 1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"0 0\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003egetField()\u003c/code\u003e is overridden, so \u003ccode\u003eSub\u003c/code\u003e\u0026#39;s version runs and returns its own field.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"tij-polymorphism/not-polymorphic/step-5\",\"title\":\"Static methods belong to classes\",\"body\":\"\u003cp\u003eStatic methods aren\u0026#39;t associated with an object, so there\u0026#39;s nothing to dispatch on.\u003c/p\u003e\\n\u003cp\u003eThe declared type decides.\u003c/p\u003e\\n\u003cp\u003eCall them through the class name to avoid confusion.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"tij-polymorphism/not-polymorphic/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eStatic methods belong to the class, not to an object, so a call through a variable is resolved at compile time from its declared type, \u003ccode\u003eStaticSuper\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe static method in the subclass hides the base one rather than \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overriding\\\" data-def=\\\"A subclass redefining an inherited method. Which one runs is decided at run time from the object\u0026amp;#39;s actual class.\\\" data-book=\\\"Effective Java\\\"\u003eoverriding\u003c/button\u003e it, so \u003ccode\u003estaticGet()\u003c/code\u003e gives the base version.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003edynamicGet()\u003c/code\u003e is an ordinary instance method, so it\u0026#39;s late-bound to the object\u0026#39;s real class and gives the derived version.\u003c/p\u003e\\n\u003cp\u003eCall static methods through the class name, never through a reference, so the code says what actually happens.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eBase staticGet()\u003c/code\u003e, then \u003ccode\u003eDerived dynamicGet()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eDerived staticGet()\u003c/code\u003e, then \u003ccode\u003eDerived dynamicGet()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eStatic methods are bound to the declared type, \u003ccode\u003eStaticSuper\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-7\",\"key\":\"tij-polymorphism/not-polymorphic/step-7\",\"prompt\":\"\u003cp\u003eMatch each member with how a call to it is resolved.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Public instance method\",\"Private method\",\"Field\",\"Static method\"],\"right\":[\"The object\u0026#39;s class, at run time\",\"The class that declares it — never overridden\",\"The variable\u0026#39;s declared type\",\"The declared type, at compile time\"],\"rightOrder\":[3,1,0,2]}]},\"courseTitle\":\"Polymorphism\",\"next\":{\"id\":\"constructors-and-polymorphism\",\"courseId\":\"tij-polymorphism\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-polymorphism/constructors-and-polymorphism\",\"title\":\"Constructors and polymorphism\",\"summary\":\"A polymorphic call from a base-class constructor reaches the subclass before the subclass is initialized — and downcasting is checked at run time.\",\"duration\":6,\"tags\":[\"java\",\"thinking in java\",\"polymorphism\",\"constructors\",\"downcasting\",\"classcastexception\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 8, Polymorphism — Behavior of polymorphic methods inside constructors\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"tij-polymorphism/constructors-and-polymorphism/step-1\",\"tij-polymorphism/constructors-and-polymorphism/step-2\",\"tij-polymorphism/constructors-and-polymorphism/step-3\",\"tij-polymorphism/constructors-and-polymorphism/step-4\",\"tij-polymorphism/constructors-and-polymorphism/step-5\"],\"exercises\":[\"tij-polymorphism/constructors-and-polymorphism/step-2\",\"t
