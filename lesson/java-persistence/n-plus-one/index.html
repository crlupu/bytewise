ce/n-plus-one/step-1\",\"java-persistence/n-plus-one/step-2\",\"java-persistence/n-plus-one/step-3\",\"java-persistence/n-plus-one/step-4\",\"java-persistence/n-plus-one/step-5\",\"java-persistence/n-plus-one/step-6\",\"java-persistence/n-plus-one/step-7\",\"java-persistence/n-plus-one/step-8\",\"java-persistence/n-plus-one/step-9\"],\"exercises\":[\"java-persistence/n-plus-one/step-2\",\"java-persistence/n-plus-one/step-3\",\"java-persistence/n-plus-one/step-5\",\"java-persistence/n-plus-one/step-7\",\"java-persistence/n-plus-one/step-8\",\"java-persistence/n-plus-one/step-9\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"java-persistence/n-plus-one/step-1\",\"title\":\"One query per row\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"java-persistence/n-plus-one/step-2\",\"prompt\":\"\u003cp\u003eHow many SQL queries does that code run, if there are 50 posts?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1 + 50 = 51 — hence the name \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"N+1 query problem\\\" data-def=\\\"Loading a list with one query, then running one more query per item to fetch its related data — N extra round trips where one join would do.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eN+1\u003c/button\u003e\u003c/strong\u003e. Each is a network round trip, so the cost grows with the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epage\u003c/button\u003e size.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe first query loads the 50 posts. Their \u003ccode\u003ecomments\u003c/code\u003e collections are lazy, so each is a proxy that hasn\u0026#39;t been loaded.\u003c/p\u003e\\n\u003cp\u003eAs the loop touches \u003ccode\u003epost.getComments()\u003c/code\u003e for each post, Hibernate runs a separate query to load that post\u0026#39;s comments — 50 more.\u003c/p\u003e\\n\u003cp\u003e51 round trips where 1 or 2 would do; with a page of 500 posts, it\u0026#39;s 501.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eOne for the list, then one each time \u003ccode\u003egetComments()\u003c/code\u003e is used.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first query loads only the posts. The comments are lazy.\u003c/p\u003e\\n\"},{\"html\":\"2\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what a well-fetched version would do. \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lazy loading\\\" data-def=\\\"An ORM fetching related data only when it\u0026amp;#39;s first accessed. Convenient, but triggers hidden queries — the source of N+1 problems.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eLazy loading\u003c/button\u003e goes post by post.\u003c/p\u003e\\n\"},{\"html\":\"50\",\"correct\":false,\"feedback\":\"\u003cp\u003eDon\u0026#39;t forget the query that loaded the posts in the first place.\u003c/p\u003e\\n\"},{\"html\":\"51\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"java-persistence/n-plus-one/step-3\",\"prompt\":\"\u003cp\u003eWhy is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"N+1 query problem\\\" data-def=\\\"Loading a list with one query, then running one more query per item to fetch its related data — N extra round trips where one join would do.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eN+1\u003c/button\u003e so easy to miss?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith small test data it\u0026#39;s invisible. Log SQL in development, and consider asserting statement counts in\\nintegration tests.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"JDBC drivers hide it from the logs\",\"correct\":false,\"feedback\":\"\u003cp\u003eLogging SQL (or counting statements in tests) shows it clearly.\u003c/p\u003e\\n\"},{\"html\":\"It only happens in production databases\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt happens everywhere — but a test with three rows doesn\u0026#39;t make it slow.\u003c/p\u003e\\n\"},{\"html\":\"The code looks like plain object navigation; the queries are hidden behind getters\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"java-persistence/n-plus-one/step-4\",\"title\":\"Fetch what you need up front\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Join fetch\\\" data-def=\\\"Telling the ORM to load an association in the same query with a SQL join, avoiding extra queries.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003e\u003ccode\u003ejoin fetch\u003c/code\u003e\u003c/button\u003e loads posts and comments in one query.\u003c/p\u003e\\n\u003cp\u003eBatch fetching loads many collections with one \u003ccode\u003eIN (...)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA DTO projection selects just the needed columns.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"java-persistence/n-plus-one/step-5\",\"prompt\":\"\u003cp\u003eMatch each fix to what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eJOIN FETCH\u003c/code\u003e\",\"Batch fetching\",\"DTO projection\",\"Entity graph\"],\"right\":[\"Loads the parents and their children in the same query\",\"Loads children for many parents at once with \u003ccode\u003eIN (...)\u003c/code\u003e\",\"Selects just the needed columns into a read-only object\",\"Declares per use case which associations to load eagerly\"],\"rightOrder\":[0,1,3,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Join fetch\\\" data-def=\\\"Telling the ORM to load an association in the same query with a SQL join, avoiding extra queries.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eJoin fetch\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"java-persistence/n-plus-one/step-6\",\"title\":\"Lazy by default\",\"body\":\"\u003cp\u003eDon\u0026#39;t switch associations to \u003ccode\u003eEAGER\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThen every query pays for data it may not need.\u003c/p\u003e\\n\u003cp\u003eKeep them lazy, and fetch per use case.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"java-persistence/n-plus-one/step-7\",\"prompt\":\"\u003cp\u003eShould you fix \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"N+1 query problem\\\" data-def=\\\"Loading a list with one query, then running one more query per item to fetch its related data — N extra round trips where one join would do.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eN+1\u003c/button\u003e by mapping the association as \u003ccode\u003eFetchType.EAGER\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eMihalcea\u0026#39;s advice: keep associations \u003cstrong\u003elazy\u003c/strong\u003e in the mapping, and decide what to fetch \u003cstrong\u003eper query\u003c/strong\u003e.\\nFetching is a query-time decision.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — then every query that loads a post pays for its comments, needed or not\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes — eager loading always uses a join\",\"correct\":false,\"feedback\":\"\u003cp\u003eEager associations are often loaded with extra secondary queries — a new N+1 in every query.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-8\",\"key\":\"java-persistence/n-plus-one/step-8\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Map associations as \",\"html\":\"Map associations as \"},{\"answers\":[\"LAZY\",\"lazy\"],\"size\":4,\"choices\":[\"query\",\"LAZY\",\"leading\",\"last\"]},{\"text\":\", and fetch what a use case needs in the \",\"html\":\", and fetch what a use case needs in the \"},{\"answers\":[\"query\"],\"size\":5,\"choices\":[\"query\",\"LAZY\",\"last\",\"leading\"]},{\"text\":\" itself.\",\"html\":\" itself.\"}],\"code\":false,\"caseSensitive\":false},{\"id\":\"step-9\",\"key\":\"java-persistence/n-plus-one/step-9\",\"prompt\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Join fetch\\\" data-def=\\\"Telling the ORM to load an association in the same query with a SQL join, avoiding extra queries.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003e\u003ccode\u003ejoin fetch\u003c/code\u003e\u003c/button\u003e of a one-to-many plus pagination (\u003ccode\u003esetMaxResults\u003c/code\u003e) is a known trap. Why?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eHibernate warns about it (\u0026quot;firstResult/maxResults specified with collection fetch; applying in memory\u0026quot;).\\nPage over the parent ids first, then fetch their children for just those ids.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eFetching posts with their comments in one join returns one row per comment, not per post.\u003c/p\u003e\\n\u003cp\u003eA SQL \u003ccode\u003eLIMIT 10\u003c/code\u003e would cut off rows partway through a post\u0026#39;s comments, giving incomplete collections, so Hibernate fetches the whole result and paginates in memory.\u003c/p\u003e\\n\u003cp\u003eOn a large table that means loading everything to show ten posts. Paginate over posts first, then fetch the comments for just those posts.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The join multiplies parent rows, so the limit can\u0026#39;t be applied in SQL — Hibernate fetches everything and pages in memory\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Pagination makes lazy loading eager\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ejoin fetch\u003c/code\u003e doesn\u0026#39;t support \u003ccode\u003ewhere\u003c/code\u003e clauses\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003ePage\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lazy loading\\\" data-def=\\\"An ORM fetching related data only when it\u0026amp;#39;s first accessed. Convenient, but triggers hidden queries — the source of N+1 problems.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eLazy loading\u003c/button\u003e\"]}]},\"courseTitle\":\"Java persistence performance\",\"next\":{\"id\":\"jdbc-batching\",\"courseId\":\"java-persistence\",\"topicId\":\"databases\",\"key\":\"java-persistence/jdbc-batching\",\"title\":\"Batching writes\",\"summary\":\"Sendi
