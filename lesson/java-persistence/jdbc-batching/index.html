-batching/step-6\",\"java-persistence/jdbc-batching/step-7\",\"java-persistence/jdbc-batching/step-8\"],\"exercises\":[\"java-persistence/jdbc-batching/step-2\",\"java-persistence/jdbc-batching/step-4\",\"java-persistence/jdbc-batching/step-5\",\"java-persistence/jdbc-batching/step-6\",\"java-persistence/jdbc-batching/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"java-persistence/jdbc-batching/step-1\",\"title\":\"Round trips are the cost\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"java-persistence/jdbc-batching/step-2\",\"prompt\":\"\u003cp\u003eYou insert 1,000 rows with a batch size of 50. About how many round trips to the database does that take?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1,000 ÷ 50 = 20 round trips instead of 1,000.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e1,000 ÷ 50.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach batch is one round trip, and 1,000 rows need 20 batches of 50.\u003c/p\u003e\\n\"},{\"html\":\"20\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"50\",\"correct\":false,\"feedback\":\"\u003cp\u003e50 is the size of each batch, not the number of them.\u003c/p\u003e\\n\"},{\"html\":\"1000\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s without \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Batching\\\" data-def=\\\"Sending many statements to the database in one round trip instead of one each.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003ebatching\u003c/button\u003e. Each batch carries 50 statements.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"java-persistence/jdbc-batching/step-3\",\"title\":\"Batching in Hibernate\",\"body\":\"\u003cp\u003eSet \u003ccode\u003ehibernate.jdbc.batch_size\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eTurn on ordering of inserts and updates.\u003c/p\u003e\\n\u003cp\u003eAvoid \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Identity\\\" data-def=\\\"Whether two references point to the very same object — what \u0026lt;code\u0026gt;==\u0026lt;/code\u0026gt; compares for objects.\\\"\u003e\u003ccode\u003eIDENTITY\u003c/code\u003e\u003c/button\u003e ids: they force one insert at a time.\u003c/p\u003e\\n\u003cp\u003eUse a pooled sequence instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"java-persistence/jdbc-batching/step-4\",\"prompt\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Batching\\\" data-def=\\\"Sending many statements to the database in one round trip instead of one each.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eBatching\u003c/button\u003e is configured, but entities use \u003ccode\u003e@GeneratedValue(strategy = IDENTITY)\u003c/code\u003e. The SQL log still shows one\\ninsert per round trip. Why?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Persistence context\\\" data-def=\\\"The ORM\u0026amp;#39;s in-memory set of entities loaded in this unit of work; it tracks their changes and writes them back on flush.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003epersistence context\u003c/button\u003e identifies entities by id, so with IDENTITY each \u003ccode\u003epersist\u003c/code\u003e forces an insert.\\nUse a \u003cstrong\u003esequence\u003c/strong\u003e (with an optimizer like \u003ccode\u003epooled\u003c/code\u003e) to get ids ahead of time and keep batching.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eHibernate tracks entities in the persistence context by their id.\u003c/p\u003e\\n\u003cp\u003eWith \u003ccode\u003eIDENTITY\u003c/code\u003e, the database assigns the id when the row is inserted, so Hibernate must run each insert immediately to learn the id — it can\u0026#39;t hold several and send them together.\u003c/p\u003e\\n\u003cp\u003eA sequence lets Hibernate fetch ids in advance, often a block at a time with a pooled optimizer, so inserts can wait and be batched at flush.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"With IDENTITY, the id is only known after the row is inserted, so Hibernate must execute each insert immediately\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Batching only works for updates\",\"correct\":false,\"feedback\":\"\u003cp\u003eInserts batch well — with an id strategy that allows it.\u003c/p\u003e\\n\"},{\"html\":\"IDENTITY columns can\u0026#39;t be inserted with prepared statements\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can — but Hibernate needs each generated id back right away to manage the entity.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Identity\\\" data-def=\\\"Whether two references point to the very same object — what \u0026lt;code\u0026gt;==\u0026lt;/code\u0026gt; compares for objects.\\\"\u003eIdentity\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"java-persistence/jdbc-batching/step-5\",\"prompt\":\"\u003cp\u003eMatch each id strategy to how it interacts with \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Batching\\\" data-def=\\\"Sending many statements to the database in one round trip instead of one each.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003ebatching\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eIDENTITY\u003c/code\u003e\",\"\u003ccode\u003eSEQUENCE\u003c/code\u003e with a pooled optimizer\",\"\u003ccode\u003eTABLE\u003c/code\u003e\",\"Assigned (app-generated, e.g. UUID)\"],\"right\":[\"Disables insert batching — the id comes back from each insert\",\"Batches well — ids are allocated in blocks ahead of time\",\"Works anywhere, but contends on a row lock — the slowest option\",\"Batches, since the id is known before insert\"],\"rightOrder\":[0,3,1,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Identity\\\" data-def=\\\"Whether two references point to the very same object — what \u0026lt;code\u0026gt;==\u0026lt;/code\u0026gt; compares for objects.\\\"\u003eIdentity\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"java-persistence/jdbc-batching/step-6\",\"prompt\":\"\u003cp\u003ePut the steps of a batched flush in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Entities are persisted; Hibernate assigns ids from the sequence pool\",\"At flush, inserts are sorted so statements for one table sit together\",\"Each table\u0026#39;s inserts are added to a JDBC batch\",\"The batch is sent when it reaches the batch size, or at the end of the flush\"],\"start\":[0,3,1,2]},{\"type\":\"explanation\",\"id\":\"step-7\",\"key\":\"java-persistence/jdbc-batching/step-7\",\"title\":\"Large jobs need clearing\",\"body\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Persistence context\\\" data-def=\\\"The ORM\u0026amp;#39;s in-memory set of entities loaded in this unit of work; it tracks their changes and writes them back on flush.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003epersistence context\u003c/button\u003e keeps every loaded entity.\u003c/p\u003e\\n\u003cp\u003eFlush and clear it every batch.\u003c/p\u003e\\n\u003cp\u003eOtherwise memory grows without limit.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-8\",\"key\":\"java-persistence/jdbc-batching/step-8\",\"prompt\":\"\u003cp\u003eYou must load and update 100,000 rows in one job. Besides \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Batching\\\" data-def=\\\"Sending many statements to the database in one round trip instead of one each.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003ebatching\u003c/button\u003e, what keeps memory in check?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eem.flush(); em.clear();\u003c/code\u003e every N entities sends the batch and lets the processed entities be garbage collected.\\nFor bulk changes that need no entity logic, a single \u003ccode\u003eUPDATE ... WHERE\u003c/code\u003e is better still.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Increase the batch size to 100,000\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe persistence context still holds every entity in memory — and a giant batch is slow too.\u003c/p\u003e\\n\"},{\"html\":\"Use \u003ccode\u003eFetchType.EAGER\u003c/code\u003e\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Flush and clear the persistence context every batch-size entities\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Persistence context\\\" data-def=\\\"The ORM\u0026amp;#39;s in-memory set of entities loaded in this unit of work; it tracks their changes and writes them back on flush.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003ePersistence context\u003c/button\u003e\"]}]},\"courseTitle\":\"Java persistence performance\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approach\",\"authors\":\"James F. Kurose \u0026 Keith W. Ross\",\"edition\":\"8th ed.\",\"year\":2021},\"fosa\":{\"id\":\"fosa\",\"title\":\"Fundamentals of Software Architecture\",\"authors\":\"Mark Richards \u0026 Neal Ford\",\"year\":2020},\"release-it\":{\"id\":\"release-it\",\"title\":\"Release It!\",\"authors\":\"Michael T. Nygard\",\"edition\":\"2nd ed.\",\"year\":2018},\"learning-ddd\":{\"id\":\"learning-ddd\",\"title\":\"Learning Domain-Driven Design\",\"authors\":\"Vlad Khononov\",\"year\":2021},\"java-puzzlers\":{\"id\":\"java-puzzlers\",\"title\":\"Java Puzzlers\",\"authors\":\"Joshua Bloch \u0026 Neal Gafter\",\"year\":2005},\"modern-java-in-action\":{\"id\":\"modern-java-in-action\",\"title\":\"Modern Java in Action\",\"authors\":\"Raoul-Gabriel Urma, Mario Fusco \u0026 Alan Mycroft\",\"edition\":
