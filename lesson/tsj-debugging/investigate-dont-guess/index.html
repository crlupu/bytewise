lly take?\",\"Why is this endpoint slow in production?\",\"What happened overnight when the job failed?\",\"Why are all threads stuck?\"],\"right\":[\"A debugger with a breakpoint\",\"A profiler\",\"The logs\",\"A thread dump\"],\"rightOrder\":[1,2,0,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Breakpoint\\\" data-def=\\\"A marker on a line of code that pauses a thread when it gets there, so you can inspect variables and the call stack.\\\" data-book=\\\"Troubleshooting Java\\\"\u003eBreakpoint\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread dump\\\" data-def=\\\"A snapshot of every thread in a JVM — its state, its stack, the locks it holds and the lock it\u0026amp;#39;s waiting for.\\\" data-book=\\\"Troubleshooting Java\\\"\u003eThread dump\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tsj-debugging/investigate-dont-guess/step-3\",\"title\":\"Find the root cause\",\"body\":\"\u003cp\u003eThe place an exception appears is often not where the bug is.\u003c/p\u003e\\n\u003cp\u003eA null may have been stored long before it was read.\u003c/p\u003e\\n\u003cp\u003eTrace back to where the wrong state was created.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"tsj-debugging/investigate-dont-guess/step-4\",\"prompt\":\"\u003cp\u003eA \u003ccode\u003eNullPointerException\u003c/code\u003e is thrown in \u003ccode\u003eformatAddress(customer)\u003c/code\u003e. What\u0026#39;s the first thing to find out?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe exception tells you where null was used, not where it came from.\u003c/p\u003e\\n\u003cp\u003eAdding a null check in \u003ccode\u003eformatAddress\u003c/code\u003e hides the symptom, and the missing address may break something else — an invoice, a shipment — later.\u003c/p\u003e\\n\u003cp\u003eTrace back: find where the customer was created or loaded, and why the address wasn\u0026#39;t set. Fix that, and add a test that would have caught it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"How to add a null check in \u003ccode\u003eformatAddress\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat hides the symptom; the bad data may break something else next.\u003c/p\u003e\\n\"},{\"html\":\"Where the customer\u0026#39;s address was set to null — the code that created that state\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"tsj-debugging/investigate-dont-guess/step-5\",\"title\":\"Reproduce first\",\"body\":\"\u003cp\u003eA bug you can trigger on demand is half fixed.\u003c/p\u003e\\n\u003cp\u003eNarrow the input or steps until it happens every time.\u003c/p\u003e\\n\u003cp\u003eThen a test can prove the fix.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"tsj-debugging/investigate-dont-guess/step-6\",\"prompt\":\"\u003cp\u003ePut the steps of an investigation in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Reproduce the problem reliably\",\"Observe what the code actually does\",\"Trace back to the root cause\",\"Fix it and add a test that would have caught it\"],\"start\":[3,1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Root cause\\\" data-def=\\\"The original mistake behind a failure — often far from where the error appears, like the code that stored a null rather than the line that read it.\\\" data-book=\\\"Troubleshooting Java\\\"\u003eRoot cause\u003c/button\u003e\"]}]},\"courseTitle\":\"Debugging techniques\",\"next\":{\"id\":\
