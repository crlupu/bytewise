\"\u003cp\u003eA Null Object stands in for \u0026quot;nothing\u0026quot; and answers every call safely, so callers don\u0026#39;t need \u003ccode\u003enull\u003c/code\u003e checks.\u003c/p\u003e\\n\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Marker interface\\\" data-def=\\\"An interface with no methods that marks a class as having a property, like \u0026lt;code\u0026gt;Serializable\u0026lt;/code\u0026gt;. Unlike an annotation, it defines a type the compiler can check.\\\" data-book=\\\"Effective Java\\\"\u003emarker interface\u003c/button\u003e \u003ccode\u003eNull\u003c/code\u003e lets you still detect one with \u003ccode\u003einstanceof Null\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-type-information/null-objects/step-2\",\"title\":\"Making them\",\"body\":\"\u003cp\u003eA class can provide its own \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003esingleton\u003c/button\u003e, such as \u003ccode\u003ePerson.NULL\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eFor an interface, a dynamic proxy can produce a Null Object for any implementing type.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-typeinfo-person\",\"key\":\"tij-type-information/null-objects/tij-typeinfo-person\",\"prompt\":\"\u003cp\u003eWhy is \u003ccode\u003eNullPerson\u003c/code\u003e\u0026#39;s constructor private?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" ta
