E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003eString\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e[] \u003c/span\u003e\u003cspan style=\"--shiki-light:#E36209;--shiki-dark:#FFAB70\"\u003eargs\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e) {\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e        System.out.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003eprintln\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(ready);\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"thread-puzzlers\",\"courseId\":\"jp-threads-and-generics\",\"topicId\":\"java-puzzlers\",\"key\":\"jp-threads-and-generics/thread-puzzlers\",\"title\":\"Thread traps\",\"summary\":\"`run()` doesn't start a thread, `Thread.interrupted()` clears the flag it reads, and a background thread can deadlock class initialization.\",\"duration\":6,\"tags\":[\"java\",\"puzzlers\",\"threads\",\"interrupts\",\"class initialization\",\"deadlock\"],\"sources\":[{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 76, Ping Pong\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 84, Rudely Interrupted\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 85, Lazy Initialization\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 77, The Lock Mess Monster\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 79, It's a Dog's Life\"}],\"requires\":[],\"steps\":12,\"stepKeys\":[\"jp-threads-and-generics/thread-puzzlers/step-1\",\"jp-threads-and-generics/thread-puzzlers/step-2\",\"jp-threads-and-generics/thread-puzzlers/step-3\",\"jp-threads-and-generics/thread-puzzlers/step-4\",\"jp-threads-and-generics/thread-puzzlers/step-5\",\"jp-threads-and-generics/thread-puzzlers/step-6\",\"jp-threads-and-generics/thread-puzzlers/step-7\",\"jp-threads-and-generics/thread-puzzlers/jpz-76\",\"jp-threads-and-generics/thread-puzzlers/jpz-77\",\"jp-threads-and-generics/thread-puzzlers/jpz-79\",\"jp-threads-and-generics/thread-puzzlers/jpz-84\",\"jp-threads-and-generics/thread-puzzlers/jpz-85\"],\"exercises\":[\"jp-threads-and-generics/thread-puzzlers/step-2\",\"jp-threads-and-generics/thread-puzzlers/step-4\",\"jp-threads-and-generics/thread-puzzlers/step-6\",\"jp-threads-and-generics/thread-puzzlers/step-7\",\"jp-threads-and-generics/thread-puzzlers/jpz-76\",\"jp-threads-and-generics/thread-puzzlers/jpz-77\",\"jp-threads-and-generics/thread-puzzlers/jpz-79\",\"jp-threads-and-generics/thread-puzzlers/jpz-84\",\"jp-threads-and-generics/thread-puzzlers/jpz-85\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-1\",\"title\":\"run() is just a method call\",\"body\":\"\u003cp\u003e\u003ccode\u003estart()\u003c/code\u003e creates a new thread that calls \u003ccode\u003erun()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCalling \u003ccode\u003erun()\u003c/code\u003e yourself runs it in the current thread.\u003c/p\u003e\\n\u003cp\u003eNothing is concurrent, and it finishes before the next line.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003et.run()\u003c/code\u003e is an ordinary method call: no thread is started, and \u003ccode\u003erun()\u003c/code\u003e executes on the main thread.\u003c/p\u003e\\n\u003cp\u003eThe main thread already holds the class\u0026#39;s lock (both methods are \u003ccode\u003estatic synchronized\u003c/code\u003e), and locks are reentrant, so \u003ccode\u003epong()\u003c/code\u003e runs immediately and prints \u0026quot;Pong\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eThen \u0026quot;Ping\u0026quot; is printed. Only \u003ccode\u003estart()\u003c/code\u003e creates a new thread.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Either, depending on scheduling\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s only one thread here. \u003ccode\u003erun()\u003c/code\u003e doesn\u0026#39;t start one.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ePongPing\u003c/code\u003e, every time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ePingPong\u003c/code\u003e, every time\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith \u003ccode\u003estart()\u003c/code\u003e, the new thread would wait for main\u0026#39;s lock and print second. But \u003ccode\u003erun()\u003c/code\u003e is a plain call in the main thread.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-3\",\"title\":\"interrupted() clears the flag\",\"body\":\"\u003cp\u003e\u003ccode\u003eThread.interrupted()\u003c/code\u003e is static and resets the current thread\u0026#39;s flag.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eisInterrupted()\u003c/code\u003e only reads it.\u003c/p\u003e\\n\u003cp\u003eCalling \u003ccode\u003einterrupted()\u003c/code\u003e twice gives \u003ccode\u003etrue\u003c/code\u003e, then \u003ccode\u003efalse\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eThread.currentThread().isInterrupted()\u003c/code\u003e to check without clearing.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eInterrupted: true\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first call returned \u003ccode\u003etrue\u003c/code\u003e and cleared the flag.\u003c/p\u003e\\n\"},{\"html\":\"Nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first call sees the interrupt, so the block runs.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eInterrupted: false\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-5\",\"title\":\"Class initialization takes a lock\",\"body\":\"\u003cp\u003eA class is initialized once, under a lock.\u003c/p\u003e\\n\u003cp\u003eIf its static initializer starts a thread and waits for it, and that thread uses the class, it waits too.\u003c/p\u003e\\n\u003cp\u003eNeither can finish.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-6\",\"prompt\":\"\u003cp\u003eA static initializer starts a thread that sets a static field of the same class, then calls \u003ccode\u003ejoin()\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eKeep static initializers simple, and never wait on other threads in them.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe main thread holds the class-initialization lock while running the static initializer.\u003c/p\u003e\\n\u003cp\u003eThe new thread touches a static field of that class, which requires the class to be initialized, so it waits for the lock.\u003c/p\u003e\\n\u003cp\u003eThe main thread then calls \u003ccode\u003ejoin()\u003c/code\u003e, waiting for the new thread to finish — and neither can proceed.\u003c/p\u003e\\n\u003cp\u003eClass initialization is a hidden lock, and static initializers shouldn\u0026#39;t wait for other threads.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It deadlocks — the thread waits for initialization to finish, and initialization waits for the thread\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It works; the thread just sets the field\",\"correct\":false,\"feedback\":\"\u003cp\u003eTouching the class from another thread blocks until initialization completes.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-7\",\"prompt\":\"\u003cp\u003eMatch each call with what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003et.start()\u003c/code\u003e\",\"\u003ccode\u003et.run()\u003c/code\u003e\",\"\u003ccode\u003eThread.interrupted()\u003c/code\u003e\",\"\u003ccode\u003et.isInterrupted()\u003c/code\u003e\"],\"right\":[\"Runs \u003ccode\u003erun()\u003c/code\u003e in a new thread\",\"Runs \u003ccode\u003erun()\u003c/code\u003e in the caller\u0026#39;s thread\",\"Reads and clears the current thread\u0026#39;s flag\",\"Reads \u003ccode\u003et\u003c/code\u003e\u0026#39;s flag without clearing it\"],\"rightOrder\":[2,0,3,1]},{\"id\":\"jpz-76\",\"key\":\"jp-threads-and-generics/thread-puzzlers/jpz-76\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCall \u003ccode\u003estart()\u003c/code\u003e to run a task on a new thread.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 76, Ping Pong in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003ePing\\nPong\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003et.run()\u003c/code\u003e doesn\u0026#39;t start a thread: \u003ccode\u003epong()\u003c/code\u003e runs right away, on the main thread (which already holds the lock).\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003ePong\\nPing\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-77\",\"key\":\"jp-threads-and-generics/thread-puzzlers/jpz-77\",\"prompt\":\"\u003cp\u003e\u003ccode\u003emain\u003c/code\u003e locks a \u003ccode\u003eThread\u003c/code\u003e object and waits on it, with no \u003ccode\u003enotify\u003c/code\u003e anywhere in the code. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNever use a \u003ccode\u003eThread\u003c/code\u003e object as a lock or condition: the library uses it for \u003ccode\u003ejoin\u003c/code\u003e. Lock a private \u003ccode\u003eObject\u003c/code\u003e instead.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 77, The Lock Mess Monster in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"It prints \u003ccode\u003eworking\u003c/code\u003e, then \u003ccode\u003ewoken up\u003c/code\u003e: when a thread ends, the JVM calls \u003ccode\u003enotifyAll()\u003c/code\u003e on its \u003ccode\u003eThread\u003c/code\u003e object (that\u0026#39;s how \u003ccode\u003ejoin()\u003c/code\u003e works)\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It hangs forever after \u003ccode\u003eworking\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe library itself notifies on the \u003ccode\u003eThread\u003c/code\u003e object.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"jpz-79\",\"key\":\"jp-threads-and-generics/thread-puzzlers/jpz-79\",\"prompt\":\"\u003cp\u003eInside the anonymous \u003ccode\u003eThread\u003c/code\u003e, \u003ccode\u003erest()\u003c/code\u003e is meant to call \u003ccode\u003ePet.rest()\u003c/code\u003e, and \u003ccode\u003esleep()\u003c/code\u003e to call \u003ccode\u003ePet.sleep()\u003c/code\u003e. Does this compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003ePass a \u003ccode\u003eRunnable\u003c/code\u003e (a lambda) to \u003ccode\u003enew Thread(...)\u003c/code\u003e instead of subclassing it, or write \u003ccode\u003ePet.this.sleep()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 79, It\u0026#39;s a Dog\u0026#39;s Life in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Yes, and it prints \u003ccode\u003eRex: Zzz\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eInherited members take precedence over the enclosing class\u0026#39;s.\u003c/p\u003e\\n\"},{\"html\":\"No: inside the \u003ccode\u003eThread\u003c/code\u003e subclass, \u003ccode\u003esleep\u003c/code\u003e means the inherited \u003ccode\u003eThread.sleep(long)\u003c/code\u003e, which shadows \u003ccode\u003ePet.sleep()\u003c/code\u003e and needs an argument\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Shadowing\\\" data-def=\\\"A declaration that makes an outer one with the same name unreachable by its simple name — a local variable over a field, or your own \u0026lt;code\u0026gt;String\u0026lt;/code\u0026gt; class over \u0026lt;code\u0026gt;java.lang.String\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Puzzlers\\\"\u003eShadowing\u003c/button\u003e\"]},{\"id\":\"jpz-84\",\"key\":\"jp-threads-and-generics/thread-puzzlers/jpz-84\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eThread.currentThread().isInterrupted()\u003c/code\u003e to test without clearing.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 84, Rudely Interrupted in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$18\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Interrupted: false\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Interrupted: true\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eThread.interrupted()\u003c/code\u003e clears the flag as it reads it; the second call sees \u003ccode\u003efalse\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-85\",\"key\":\"jp-threads-and-generics/thread-puzzlers/jpz-85\",\"prompt\":\"\u003cp\u003eThe static initializer starts a thread that reads a static field, and waits for it. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDon\u0026#39;t start threads from static initializers.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 85, \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lazy initialization\\\" data-def=\\\"Delaying computing a field until it is first needed. Saves work if it\u0026amp;#39;s never used, but needs care with threads.\\\" data-book=\\\"Effective Java\\\"\u003eLazy Initialization\u003c/button\u003e in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"It prints \u003ccode\u003etrue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe thread can\u0026#39;t touch the class until its initialization is complete.\u003c/p\u003e\\n\"},{\"html\":\"It prints \u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt never gets to print.\u003c/p\u003e\\n\"},{\"html\":\"Deadlock: the new thread must wait for \u003ccode\u003eLazy\u003c/code\u003e\u0026#39;s initialization to finish before touching \u003ccode\u003eready\u003c/code\u003e, while the initializer waits for the thread\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Threads and generics puzzlers\",\"next\":{\"id\":\"raw-types-erase-everything\",\"courseId\":\"jp-threads-and-generics\",\"topicId\":\"java-puzzlers\",\"key\":\"jp-threads-and-generics/raw-types-erase-everything\",\"title\":\"A raw type loses all its generics\",\"summary\":\"Use a generic class raw and every generic type in its members is erased — even ones unrelated to the missing type argument.\",\"duration\":4,\"tags\":[\"java\",\"puzzlers\",\"generics\",\"raw types\",\"erasure\"],\"sources\":[{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 88, Raw Deal\"},{\"book\":\"effective-java\",\"ref\":\"Item 26\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 89, Generic Drugs\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 90, It's Absurd, It's a Pain, It's Superclass!\"}],\"requires\":[],\"steps\":8,\"stepKeys\":[\"jp-threads-and-generics/raw-types-erase-everything/step-1\",\"jp-threads-and-generics/raw-t
