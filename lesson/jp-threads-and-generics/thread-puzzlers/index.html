title\":\"run() is just a method call\",\"body\":\"\u003cp\u003e\u003ccode\u003estart()\u003c/code\u003e creates a new thread that calls \u003ccode\u003erun()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCalling \u003ccode\u003erun()\u003c/code\u003e yourself runs it in the current thread.\u003c/p\u003e\\n\u003cp\u003eNothing is concurrent, and it finishes before the next line.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003et.run()\u003c/code\u003e is an ordinary method call: no thread is started, and \u003ccode\u003erun()\u003c/code\u003e executes on the main thread.\u003c/p\u003e\\n\u003cp\u003eThe main thread already holds the class\u0026#39;s lock (both methods are \u003ccode\u003estatic synchronized\u003c/code\u003e), and locks are reentrant, so \u003ccode\u003epong()\u003c/code\u003e runs immediately and prints \u0026quot;Pong\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eThen \u0026quot;Ping\u0026quot; is printed. Only \u003ccode\u003estart()\u003c/code\u003e creates a new thread.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Either, depending on scheduling\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s only one thread here. \u003ccode\u003erun()\u003c/code\u003e doesn\u0026#39;t start one.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ePongPing\u003c/code\u003e, every time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ePingPong\u003c/code\u003e, every time\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith \u003ccode\u003estart()\u003c/code\u003e, the new thread would wait for main\u0026#39;s lock and print second. But \u003ccode\u003erun()\u003c/code\u003e is a plain call in the main thread.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-3\",\"title\":\"interrupted() clears the flag\",\"body\":\"\u003cp\u003e\u003ccode\u003eThread.interrupted()\u003c/code\u003e is static and resets the current thread\u0026#39;s flag.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eisInterrupted()\u003c/code\u003e only reads it.\u003c/p\u003e\\n\u003cp\u003eCalling \u003ccode\u003einterrupted()\u003c/code\u003e twice gives \u003ccode\u003etrue\u003c/code\u003e, then \u003ccode\u003efalse\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eThread.currentThread().isInterrupted()\u003c/code\u003e to check without clearing.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eInterrupted: true\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first call returned \u003ccode\u003etrue\u003c/code\u003e and cleared the flag.\u003c/p\u003e\\n\"},{\"html\":\"Nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first call sees the interrupt, so the block runs.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eInterrupted: false\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-5\",\"title\":\"Class initialization takes a lock\",\"body\":\"\u003cp\u003eA class is initialized once, under a lock.\u003c/p\u003e\\n\u003cp\u003eIf its static initializer starts a thread and waits for it, and that thread uses the class, it waits too.\u003c/p\u003e\\n\u003cp\u003eNeither can finish.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-6\",\"prompt\":\"\u003cp\u003eA static initializer starts a thread that sets a static field of the same class, then calls \u003ccode\u003ejoin()\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eKeep static initializers simple, and never wait on other threads in them.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe main thread holds the class-initialization lock while running the static initializer.\u003c/p\u003e\\n\u003cp\u003eThe new thread touches a static field of that class, which requires the class to be initialized, so it waits for the lock.\u003c/p\u003e\\n\u003cp\u003eThe main thread then calls \u003ccode\u003ejoin()\u003c/code\u003e, waiting for the new thread to finish — and neither can proceed.\u003c/p\u003e\\n\u003cp\u003eClass initialization is a hidden lock, and static initializers shouldn\u0026#39;t wait for other threads.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It deadlocks — the thread waits for initialization to finish, and initialization waits for the thread\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It works; the thread just sets the field\",\"correct\":false,\"feedback\":\"\u003cp\u003eTouching the class from another thread blocks until initialization completes.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-7\",\"prompt\":\"\u003cp\u003eMatch each call with what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003et.start()\u003c/code\u003e\",\"\u003ccode\u003et.run()\u003c/code\u003e\",\"\u003ccode\u003eThread.interrupted()\u003c/code\u003e\",\"\u003ccode\u003et.isInterrupted()\u003c/code\u003e\"],\"right\":[\"Runs \u003ccode\u003erun()\u003c/code\u003e in a new thread\",\"Runs \u003ccode\u003erun()\u003c/code\u003e in the caller\u0026#39;s thread\",\"Reads and clears the current thread\u0026#39;s flag\",\"Reads \u003ccode\u003et\u003c/code\u003e\u0026#39;s flag without clearing it\"],\"rightOrder\":[2,0,3,1]}]},\"courseTitle\":\"Threads and generics puzzlers\",\"next\":{\"id\":\"raw-types-erase-everything\",\"courseId\":\"jp-threads-and-generics\",\"topicId\":\"java-puzzlers\",\"key\":\"jp-threads-and-generics/raw-types-erase-everything\",\"title\":\"A raw type loses all its generics\",\"summary\":\"Use a generic class raw and every generic type in its members is erased — even ones unrelated to the missing type argument.\",\"duration\":4,\"tags\":[\"java\",\"puzzlers\",\"generics\",\"raw types\",\"erasure\"],\"sources\":[{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 88, Raw Deal\"},{\"book\":\"effective-java\",\"ref\":\"Item 26\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jp-threads-and-generics/raw-types-erase-everything/step-1\",\"jp-threads-and-generics/raw-types-erase-everything/step-2\",\"jp-threads-and-generics/raw-types-erase-everything/step-3\",\"jp-threads-and-generics/raw-types-erase-everything/step-4\",\"jp-threads-and-generics/raw-types-erase-everything/step-5\"],\"exercises\":[\"jp-threads-and-generics/raw-types-erase-everything/step-2\",\"jp-threads-and-generics/raw-types-erase-everything/step-4\",\"jp-threads-and-generics/raw-types-erase-everything/step-5\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"i
