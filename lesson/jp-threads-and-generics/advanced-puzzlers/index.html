the classes that use them; recompiling only the defining class leaves stale copies.\u003c/p\u003e\\n\u003cp\u003eA shuffle that swaps each element with any random position is biased; swap with a random position from the part not yet shuffled (Fisher–Yates), or call \u003ccode\u003eCollections.shuffle\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jpz-86\",\"key\":\"jp-threads-and-generics/advanced-puzzlers/jpz-86\",\"prompt\":\"\u003cp\u003eWhich line stops this from compiling?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eParentheses around a literal can change whether it compiles. Prefer \u003ccode\u003eInteger.MIN_VALUE\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 86, Poison-Paren Litter in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"\u003ccode\u003eint b = -(2147483648);\u003c/code\u003e — 2147483648 is only legal as the operand of a unary minus, and the parentheses separate them\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Neither: it prints \u003ccode\u003e0\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe parenthesized form doesn\u0026#39;t compile.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eint a = -2147483648;\u003c/code\u003e — the literal is too large\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e-2147483648\u003c/code\u003e is allowed: it\u0026#39;s \u003ccode\u003eInteger.MIN_VALUE\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"jpz-87a\",\"key\":\"jp-threads-and-generics/advanced-puzzlers/jpz-87a\",\"prompt\":\"\u003cp\u003eIs \u003ccode\u003e==\u003c/code\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reflexive\\\" data-def=\\\"Every value is equal to itself — \u0026lt;code\u0026gt;x.equals(x)\u0026lt;/code\u0026gt; is true.\\\" data-book=\\\"Effective Java\\\"\u003ereflexive\u003c/button\u003e? What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 87, Strained Relations in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"true\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"NaN\\\" data-def=\\\"\u0026amp;quot;Not a Number\u0026amp;quot;: the \u0026lt;code\u0026gt;double\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;float\u0026lt;/code\u0026gt; result of things like \u0026lt;code\u0026gt;0.0 / 0.0\u0026lt;/code\u0026gt;. It isn\u0026amp;#39;t equal to anything, itself included.\\\" data-book=\\\"Java Puzzlers\\\"\u003eNaN\u003c/button\u003e is the one value not equal to itself.\u003c/p\u003e\\n\"},{\"html\":\"false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-87b\",\"key\":\"jp-threads-and-generics/advanced-puzzlers/jpz-87b\",\"prompt\":\"\u003cp\u003eIs \u003ccode\u003e==\u003c/code\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transitive\\\" data-def=\\\"If \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003etransitive\u003c/button\u003e across numeric types? What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eMixed-type comparisons widen to \u003ccode\u003edouble\u003c/code\u003e, which loses precision for large \u003ccode\u003elong\u003c/code\u003e values.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 87, Strained Relations in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"true false false\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth \u003ccode\u003ex\u003c/code\u003e and \u003ccode\u003ez\u003c/code\u003e convert to the same \u003ccode\u003edouble\u003c/code\u003e (2⁶³), so both compare equal to \u003ccode\u003ey\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"true true false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-87c\",\"key\":\"jp-threads-and-generics/advanced-puzzlers/jpz-87c\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 87, Strained Relations in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"true true true\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ea == c\u003c/code\u003e compares two references to different \u003ccode\u003eInteger\u003c/code\u003e objects.\u003c/p\u003e\\n\"},{\"html\":\"true true false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-91\",\"key\":\"jp-threads-and-generics/advanced-puzzlers/jpz-91\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eSub\u003c/code\u003e\u0026#39;s constructor adds the object to its own set. After a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eserialization\u003c/button\u003e round trip, does the set still contain it?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDon\u0026#39;t let \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e depend on subclass state in a class that serializes a hash set containing itself.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 91, Serial Killer in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Yes — \u003ccode\u003etrue true\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eSuperclass fields deserialize before subclass fields, so the hash was taken too early.\u003c/p\u003e\\n\"},{\"html\":\"No — it prints \u003ccode\u003etrue false\u003c/code\u003e: \u003ccode\u003eBase\u003c/code\u003e\u0026#39;s set is rebuilt first, hashing \u003ccode\u003ecopy\u003c/code\u003e while its \u003ccode\u003eid\u003c/code\u003e is still 0\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\
