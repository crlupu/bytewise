eRaw types\u003c/button\u003e were kept so pre-Java-5 code still compiles.\u003c/p\u003e\\n\u003cp\u003eThey switch off type checking.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003e\u0026lt;?\u0026gt;\u003c/code\u003e when you don\u0026#39;t know or care about the type.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jp-threads-and-generics/raw-types-erase-everything/step-4\",\"prompt\":\"\u003cp\u003eYou need a method that accepts any \u003ccode\u003eSet\u003c/code\u003e, whatever its element type. Which signature?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003evoid f(Set\u0026lt;Object\u0026gt; s)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA \u003ccode\u003eSet\u0026lt;String\u0026gt;\u003c/code\u003e is not a \u003ccode\u003eSet\u0026lt;Object\u0026gt;\u003c/code\u003e, so callers couldn\u0026#39;t pass one.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003evoid f(Set\u0026lt;?\u0026gt; s)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003evoid f(Set s)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Raw type\\\" data-def=\\\"A generic type used without type arguments, like \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt; instead of \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt;. Exists only for compatibility; loses all type safety.\\\" data-book=\\\"Effective Java\\\"\u003eraw type\u003c/button\u003e — it compiles, but you lose type safety and can insert anything.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"jp-threads-and-generics/raw-types-erase-everything/step-5\",\"prompt\":\"\u003cp\u003eAccept a l
