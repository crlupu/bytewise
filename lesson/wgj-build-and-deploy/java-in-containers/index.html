-java\",\"ref\":\"Chapter 12, Running Java in containers\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"wgj-build-and-deploy/java-in-containers/step-1\",\"wgj-build-and-deploy/java-in-containers/step-2\",\"wgj-build-and-deploy/java-in-containers/step-3\",\"wgj-build-and-deploy/java-in-containers/step-4\",\"wgj-build-and-deploy/java-in-containers/step-5\",\"wgj-build-and-deploy/java-in-containers/step-6\"],\"exercises\":[\"wgj-build-and-deploy/java-in-containers/step-3\",\"wgj-build-and-deploy/java-in-containers/step-4\",\"wgj-build-and-deploy/java-in-containers/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"wgj-build-and-deploy/java-in-containers/step-1\",\"title\":\"The JVM sees the container\",\"body\":\"\u003cp\u003eOld JVMs read the host\u0026#39;s memory and CPUs, not the container\u0026#39;s.\u003c/p\u003e\\n\u003cp\u003eThey sized heaps and thread pools far too big, and got killed.\u003c/p\u003e\\n\u003cp\u003eSince Java 10, the JVM reads container limits.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"wgj-build-and-deploy/java-in-containers/step-2\",\"title\":\"Heap is only part of the memory\",\"body\":\"\u003cp\u003eBeyond the heap, the JVM needs metaspace, thread stacks, code \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e and native buffers.\u003c/p\u003e\\n\u003cp\u003eSet the heap with \u003ccode\u003e-XX:MaxRAMPercentage\u003c/code\u003e, say 75%.\u003c/p\u003e\\n\u003cp\u003eIf the process exceeds the container limit, the kernel kills it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"wgj-build-and-deploy/java-in-containers/step-3\",\"prompt\":\"\u003cp\u003eA container has a 1 GB limit, and the JVM runs with \u003ccode\u003e-Xmx1g\u003c/code\u003e. Wha
