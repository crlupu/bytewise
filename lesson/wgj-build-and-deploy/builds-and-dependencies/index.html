e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"\u003ccode\u003ecompile\u003c/code\u003e\",\"\u003ccode\u003etest\u003c/code\u003e\",\"\u003ccode\u003epackage\u003c/code\u003e\",\"\u003ccode\u003einstall\u003c/code\u003e\",\"\u003ccode\u003edeploy\u003c/code\u003e\"],\"start\":[4,1,0,3,2]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"wgj-build-and-deploy/builds-and-dependencies/step-3\",\"title\":\"Transitive dependencies\",\"body\":\"\u003cp\u003eYour dependencies have dependencies of their own.\u003c/p\u003e\\n\u003cp\u003eThe build tool pulls them all in.\u003c/p\u003e\\n\u003cp\u003eWhen two paths need different versions of one library, it must pick one.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"wgj-build-and-deploy/builds-and-dependencies/step-4\",\"prompt\":\"\u003cp\u003eMatch each tool with how it picks between conflicting versions.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Maven\",\"Gradle\"],\"right\":[\"The nearest to your project in the dependency tree\",\"The highest version requested\"],\"rightOrder\":[1,0]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"wgj-build-and-deploy/builds-and-dependencies/step-5\",\"title\":\"Pin what matters\",\"body\":\"\u003cp\u003eA surprise version can bring \u003ccode\u003eNoSuchMethodError\u003c/code\u003e at run time.\u003c/p\u003e\\n\u003cp\u003eInspect the tree with \u003ccode\u003emvn dependency:tree\u003c/code\u003e or \u003ccode\u003egradle dependencies\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003ePin versions with a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"BOM\\\" data-def=\\\"A Maven \u0026amp;quot;bill of materials\u0026amp;quot; that fixes the versions of a fa
