\"type\":\"match\",\"left\":[\"\u003ccode\u003eadd(e)\u003c/code\u003e\",\"\u003ccode\u003eremove()\u003c/code\u003e\",\"\u003ccode\u003eelement()\u003c/code\u003e\"],\"right\":[\"\u003ccode\u003eoffer(e)\u003c/code\u003e\",\"\u003ccode\u003epoll()\u003c/code\u003e\",\"\u003ccode\u003epeek()\u003c/code\u003e\"],\"rightOrder\":[2,1,0]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jgc-sets-queues/queues-and-deques/step-3\",\"title\":\"Priority order\",\"body\":\"\u003cp\u003eA \u003ccode\u003ePriorityQueue\u003c/code\u003e is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Binary heap\\\" data-def=\\\"A tree stored in an array where each parent is no larger than its children, so the smallest element is always at the front. \u0026lt;code\u0026gt;PriorityQueue\u0026lt;/code\u0026gt; is one.\\\" data-book=\\\"Java Generics and Collections\\\"\u003ebinary heap\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003epoll\u003c/code\u003e always returns the smallest element, by natural order or a comparator.\u003c/p\u003e\\n\u003cp\u003eIterating it does not give sorted order.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jgc-sets-queues/queues-and-deques/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA \u003ccode\u003ePriorityQueue\u003c/code\u003e is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Binary heap\\\" data-def=\\\"A tree stored in an array where each parent is no larger than its children, so the smallest element is always at the front. \u0026lt;code\u0026gt;PriorityQueue\u0026lt;/code\u0026gt; is one.\\\" data-book=\\\"Java Generics and Collections\\\"\u003ebinary heap\u003c/button\u003e: each \u003ccode\u003epoll\u003c/code\u003e removes the smallest remaining element by natural order, here 1, then 4, then 5.\u003c/p\u003e\\n\u003cp ing concatenation evaluates \u003ccode\u003ed\u003c/code\u003e first, printing that.\u003c/p\u003e\\n\u003cp\u003eThen \u003ccode\u003epop\u003c/code\u003e removes and returns the front element, 2. \u003ccode\u003eArrayDeque\u003c/code\u003e thus serves as both a stack and a queue.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e[2, 1, 3] 2\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e[1, 2, 3] 1\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003epush\u003c/code\u003e adds to the front, so 2 goes before 1.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]}]},\"courseTitle\":\"Sets and queues\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approach\",\"authors\":\"James F. Kurose \u0026 Keith W. Ross\",\"e
