ncurrency in Practice\\\"\u003enotify\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"notifyAll\\\" data-def=\\\"Wakes every thread waiting on this object\u0026amp;#39;s condition queue. Safer than \u0026lt;code\u0026gt;notify\u0026lt;/code\u0026gt; when threads wait for different conditions.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003enotifyAll\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"jcip-custom-synchronizers/explicit-conditions/step-5\",\"prompt\":\"$17\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s an alias for await\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s a completely different mechanism; be careful to use \u003ccode\u003eawait\u003c/code\u003e and \u003ccode\u003esignal\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"It uses the Condition object\u0026#39;s own intrinsic queue — not the one tied to the Lock — and almost certainly misbehaves\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"jcip-custom-synchronizers/explicit-conditions/step-6\",\"prompt\":\"\u003cp\u003eWait on an explicit condition.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"while (count == 0) notEmpty.\"},{\"answers\":[\"await\"],\"size\":5,\"choices\":[\"await\",\"availableProcessors\",\"wait\",\"list\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"listing-14-10\",\"key\":\"jcip-custom-synchronizers/explicit-conditions/listing-14-10\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 14.10\u003c/strong\u003e · What\u0026#39;s the advantage of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Condition\\\" data-def=\\\"An explicit condition queue tied to a \u0026lt;code\u0026gt;Lock\u0026lt;/code\u0026gt;, created with \u0026lt;code\u0026gt;lock.newCondition()\u0026lt;/code\u0026gt;. A lock can have several, one per condition predicate.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eCondition\u003c/code\u003e\u003c/button\u003e over \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003ewait\u003c/code\u003e\u003c/button\u003e/\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"notify\\\" data-def=\\\"Wakes one arbitrary thread waiting on this object\u0026amp;#39;s condition queue. Can wake the wrong one if waiters wait for different things.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003enotify\u003c/code\u003e\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCareful: \u003ccode\u003eCondition\u003c/code\u003e objects also have \u003ccode\u003ewait\u003c/code\u003e/\u003ccode\u003enotify\u003c/code\u003e from \u003ccode\u003eObject\u003c/code\u003e — calling those by mistake is a classic bug.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"A lock can have several conditions, so each kind of waiter gets its own queue\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eawait\u003c/code\u003e doesn\u0026#39;t need the lock\",\"correct\":false,\"feedback\":\"\u003cp\u003eYou must hold the associated lock.\u003c/p\u003e\\n\"},{\"html\":\"No spurious wakeups\",\"correct\":false,\"feedback\":\"\u003cp
