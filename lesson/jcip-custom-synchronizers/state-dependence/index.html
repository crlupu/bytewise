dition queue (\u003ccode\u003ewait\u003c/code\u003e and \u003ccode\u003enotifyAll\u003c/code\u003e)\"],\"right\":[\"The caller has to retry — busy-waiting, or sleeping, in their own code\",\"Too short a sleep wastes CPU; too long adds latency\",\"The thread sleeps until woken — efficient and responsive\"],\"rightOrder\":[0,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Condition queue\\\" data-def=\\\"A set of threads waiting for some condition to become true. Each object\u0026amp;#39;s intrinsic lock has one, used by \u0026lt;code\u0026gt;wait\u0026lt;/code\u0026gt;/\u0026lt;code\u0026gt;notify\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCondition queue\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ewait\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"notifyAll\\\" data-def=\\\"Wakes every thread waiting on this object\u0026amp;#39;s condition queue. Safer than \u0026lt;code\u0026gt;notify\u0026lt;/code\u0026gt; when threads wait for different conditions.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003enotifyAll\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLatency\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jcip-custom-synchronizers/state-dependence/step-4\",\"prompt\":\"\u003cp\u003eWhy must \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" da arded by\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"jcip-custom-synchronizers/state-dependence/step-5\",\"prompt\":\"\u003cp\u003eWait for a condition properly.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"while (isEmpty()) \"},{\"answers\":[\"wait\"],\"size\":4,\"choices\":[\"wait\",\"await\",\"newVirtualThreadPerTaskExecutor\",\"putIfAbsent\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Building custom synchronizers\",\"next\":{\"id\":\"condition-queues\",\"courseId\":\"jcip-custom-synchronizers\",\"topicId\":\"jcip\",\"key\":\"jcip-custom-synchronizers/condition-queues\",\"title\":\"Using condition queues\",\"summary\":\"Condition predicates, waiting in a loop, missed signals, and notifyAll versus notify.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"condition queues\",\"wait\",\"notifyall\",\"missed signals\",\"spurious wakeup\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§14.2, Using Condition Queues\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-custom-synchronizers/condition-queues/step-1\",\"jcip-custom-synchronizers/condition-queues/step-2\",\"jcip-custom-synchronizers/condition-queues/step-3\",\"jcip-custom-synchronizers/condition-queues/step-4\",\"jcip-custom-synchronizers/condition-queues/step-5\",\"jcip-custom-synchronizers/condition-queues/step-6\",\"jcip-custom-synchronizers/condition-queues/step-7\"],\"exercises\":[\"jcip-custom-synchronizers/condition-queues/step-3\",\"jcip-custom-synchronizers/condition-queues/step-4\",\"jcip-custom-synchronizers/condit
