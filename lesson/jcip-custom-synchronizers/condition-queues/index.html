\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Condition queue\\\" data-def=\\\"A set of threads waiting for some condition to become true. Each object\u0026amp;#39;s intrinsic lock has one, used by \u0026lt;code\u0026gt;wait\u0026lt;/code\u0026gt;/\u0026lt;code\u0026gt;notify\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econdition queue\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-custom-synchronizers/condition-queues/step-2\",\"title\":\"Always wait in a loop\",\"body\":\"\u003cp\u003eCheck the predicate before waiting.\u003c/p\u003e\\n\u003cp\u003eCheck it again after waking.\u003c/p\u003e\\n\u003cp\u003eHold the lock throughout.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-custom-synchronizers/condition-queues/step-3\",\"prompt\":\"\u003cp\u003eWhy must you test the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Condition predicate\\\" data-def=\\\"The test a thread waits on, like \u0026amp;quot;the queue is not empty\u0026amp;quot;. Always re-check it in a loop after waking.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econdition predicate\u003c/button\u003e in a \u003ccode\u003ewhile\u003c/code\u003e loop, not an \u003ccode\u003eif\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eReturning from \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003ewait\u003c/code\u003e\u003c/button\u003e is a hint that something changed, not a guarantee the predicate holds.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ewait\u003c/code\u003e can return for several reasons: the condition you wanted became true, another condition sharing the same queue changed, another thread already consumed what you were waiting for, or a spurious wakeup with no notification at all.\u003c/p\u003e\\n\u003cp\u003eSo waking up only means \u0026quot;something may have changed\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eRe-testing in a \u003ccode\u003ewhile\u003c/code\u003e loop makes the thread go back to waiting if the condition still isn\u0026#39;t true.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A woken thread may find the predicate false — another thread got there first, notifyAll woke everyone, or a spurious wakeup occurred\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Loops are faster than if statements\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Spurious wakeup\\\" data-def=\\\"A thread returns from \u0026lt;code\u0026gt;wait\u0026lt;/code\u0026gt; without being notified. That\u0026amp;#39;s allowed, so \u0026lt;code\u0026gt;wait\u0026lt;/code\u0026gt; must be called in a loop that re-checks the condition.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eSpurious wakeup\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jcip-custom-synchronizers/condition-queues/step-4\",\"prompt\":\"\u003cp\u003eMatch each rule for using \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003ewait\u003c/code\u003e\u003c/button\u003e to the bug it prevents.\u003c/p\u003e\\n\",\"explanation\
