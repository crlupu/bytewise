step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-interfaces/strategy-and-adapter/step-1\",\"title\":\"One method, many strategies\",\"body\":\"\u003cp\u003e\u003ccode\u003eApply.process(Processor p, Object s)\u003c/code\u003e runs any processor on its input.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eUpcase\u003c/code\u003e, \u003ccode\u003eDowncase\u003c/code\u003e and \u003ccode\u003eSplitter\u003c/code\u003e are strategies — interchangeable algorithms.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eApply\u003c/code\u003e depends only on the interface.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-interfaces/strategy-and-adapter/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eApply.process(Processor p, Object s)\u003c/code\u003e runs any \u003ccode\u003eProcessor\u003c/code\u003e on its input. You write a new \u003ccode\u003eReverser implements Processor\u003c/code\u003e. What must change in \u003ccode\u003eApply\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nothing — it already works with any \u003ccode\u003eProcessor\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"A new overload, \u003ccode\u003eprocess(Reverser, Object)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eApply\u003c/code\u003e takes the interface type, so every implementation fits.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-interfaces/strategy-and-adapter/step-3\",\"title\":\"Adapting a class you can't change\",\"body\":\"\u003cp\u003e\u003ccode\u003eFilter\u003c/code\u003e comes from a library and doesn\u0026#39;t implement \u003ccode\u003eProcessor\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eFilterAdapter\u003c/code\u003e implements \u003ccode\u003eProcessor\u003c/code\u003e and holds a \u003ccode\u003eFilter\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEach call is translated to the filter — an adapter.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-4\",\"key\":\"tij-interfaces/strategy-and-adapter/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eApply.process(new FilterAdapter(new LowPass()), w)\u003c/code\u003e — tap the class whose method actually transforms the waveform.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe adapter forwards to the wrapped filter, whose real class is \u003ccode\u003eLowPass\u003c/code\u003e — \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Late binding\\\" data-def=\\\"Choosing which method body to run at run time, from the object\u0026amp;#39;s actual class, rather than at compile time from the variable\u0026amp;#39;s type.\\\" data-book=\\\"Thinking in Java\\\"\u003elate binding\u003c/button\u003e picks its \u003ccode\u003eprocess\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Processor\",\"kind\":\"interface\",\"methods\":[\"process(Object)\"]},{\"name\":\"FilterAdapter\",\"methods\":[\"+ process(Object)\"]},{\"name\":\"Filter\",\"methods\":[\"+ process(Waveform)\"]},{\"name\":\"LowPass\",\"methods\":[\"+ process(Waveform)\"]}],\"relations\":[{\"from\":\"FilterAdapter\",\"to\":\"Processor\",\"type\":\"implements\"},{\"from\":\"FilterAdapter\",\"to\":\"Filter\",\"type\":\"has\",\"label\":\"wraps\"},{\"from\":\"LowPass\",\"to\":\"Filter\",\"type\":\"extends\"}]},\"feedback\":{\"FilterAdapter\":\"The adapter only forwards the call to the filter it wraps.\",\"Processor\":\"An interface has no implementation.\",\"Filter\":\"The wrapped object is a LowPass, which overrides process.\"}},\"goal\":{\"select\":\"LowPass\"},\"question\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-interfaces/strategy-and-adapter/step-5\",\"prompt\":\"\u003cp\u003eMatch each role with its class.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"The interface clients depend on\",\"The class you can\u0026#39;t change\",\"Translates one interface to the other\"],\"right\":[\"\u003ccode\u003eProcessor\u003c/code\u003e\",\"\u003ccode\u003eFilter\u003c/code\u003e\",\"\u003ccode\u003eFilterAdapter\u003c/code\u003e\"],\"rightOrder\":[0,2,1]}]},\"courseTitle\":\"Interfaces\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approach\",\"authors\":\"James F. Kurose \u0026 Keith W. Ross\",\"edition\":\"8th ed.\",\"year\":2021},\"fosa\":{\"id\":\"fosa\",\"title\":\"Fundamentals of Software Architecture\",\"authors\":\"Mark Richards \u0026 Neal Ford\",\
