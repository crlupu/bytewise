"\u003e  }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"strategy-and-adapter\",\"courseId\":\"tij-interfaces\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-interfaces/strategy-and-adapter\",\"title\":\"Strategies and adapters\",\"summary\":\"Code written against an interface accepts any implementation — and an adapter lets a class you can't change join in.\",\"duration\":6,\"tags\":[\"java\",\"thinking in java\",\"interfaces\",\"strategy\",\"adapter\",\"decoupling\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 9, Interfaces — Complete decoupling\"}],\"requires\":[],\"steps\":12,\"stepKeys\":[\"tij-interfaces/strategy-and-adapter/step-1\",\"tij-interfaces/strategy-and-adapter/step-2\",\"tij-interfaces/strategy-and-adapter/step-3\",\"tij-interfaces/strategy-and-adapter/step-4\",\"tij-interfaces/strategy-and-adapter/step-5\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-classprocessor-apply\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-interfaceprocessor-stringprocessor\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-interfaceprocessor-filterprocessor\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-filters-filter\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-randomdoubles\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-randomwords\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-adaptedrandomdoubles\"],\"exercises\":[\"tij-interfaces/strategy-and-adapter/step-2\",\"tij-interfaces/strategy-and-adapter/step-4\",\"tij-interfaces/strategy-and-adapter/step-5\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-classprocessor-apply\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-interfaceprocessor-stringprocessor\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-interfaceprocessor-filterprocessor\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-filters-filter\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-randomdoubles\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-randomwords\",\"tij-interfaces/strategy-and-adapter/tij-interfaces-adaptedrandomdoubles\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-interfaces/strategy-and-adapter/step-1\",\"title\":\"One method, many strategies\",\"body\":\"\u003cp\u003e\u003ccode\u003eApply.process(Processor p, Object s)\u003c/code\u003e runs any processor on its input.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eUpcase\u003c/code\u003e, \u003ccode\u003eDowncase\u003c/code\u003e and \u003ccode\u003eSplitter\u003c/code\u003e are strategies — interchangeable algorithms.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eApply\u003c/code\u003e depends only on the interface.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-interfaces/strategy-and-adapter/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eApply.process(Processor p, Object s)\u003c/code\u003e runs any \u003ccode\u003eProcessor\u003c/code\u003e on its input. You write a new \u003ccode\u003eReverser implements Processor\u003c/code\u003e. What must change in \u003ccode\u003eApply\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nothing — it already works with any \u003ccode\u003eProcessor\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"A new overload, \u003ccode\u003eprocess(Reverser, Object)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eApply\u003c/code\u003e takes the interface type, so every implementation fits.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-interfaces/strategy-and-adapter/step-3\",\"title\":\"Adapting a class you can't change\",\"body\":\"\u003cp\u003e\u003ccode\u003eFilter\u003c/code\u003e comes from a library and doesn\u0026#39;t implement \u003ccode\u003eProcessor\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eFilterAdapter\u003c/code\u003e implements \u003ccode\u003eProcessor\u003c/code\u003e and holds a \u003ccode\u003eFilter\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEach call is translated to the filter — an adapter.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-4\",\"key\":\"tij-interfaces/strategy-and-adapter/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eApply.process(new FilterAdapter(new LowPass()), w)\u003c/code\u003e — tap the class whose method actually transforms the waveform.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe adapter forwards to the wrapped filter, whose real class is \u003ccode\u003eLowPass\u003c/code\u003e — \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Late binding\\\" data-def=\\\"Choosing which method body to run at run time, from the object\u0026amp;#39;s actual class, rather than at compile time from the variable\u0026amp;#39;s type.\\\" data-book=\\\"Thinking in Java\\\"\u003elate binding\u003c/button\u003e picks its \u003ccode\u003eprocess\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Processor\",\"kind\":\"interface\",\"methods\":[\"process(Object)\"]},{\"name\":\"FilterAdapter\",\"methods\":[\"+ process(Object)\"]},{\"name\":\"Filter\",\"methods\":[\"+ process(Waveform)\"]},{\"name\":\"LowPass\",\"methods\":[\"+ process(Waveform)\"]}],\"relations\":[{\"from\":\"FilterAdapter\",\"to\":\"Processor\",\"type\":\"implements\"},{\"from\":\"FilterAdapter\",\"to\":\"Filter\",\"type\":\"has\",\"label\":\"wraps\"},{\"from\":\"LowPass\",\"to\":\"Filter\",\"type\":\"extends\"}]},\"feedback\":{\"FilterAdapter\":\"The adapter only forwards the call to the filter it wraps.\",\"Processor\":\"An interface has no implementation.\",\"Filter\":\"The wrapped object is a LowPass, which overrides process.\"}},\"goal\":{\"select\":\"LowPass\"},\"question\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-interfaces/strategy-and-adapter/step-5\",\"prompt\":\"\u003cp\u003eMatch each role with its class.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"The interface clients depend on\",\"The class you can\u0026#39;t change\",\"Translates one interface to the other\"],\"right\":[\"\u003ccode\u003eProcessor\u003c/code\u003e\",\"\u003ccode\u003eFilter\u003c/code\u003e\",\"\u003ccode\u003eFilterAdapter\u003c/code\u003e\"],\"rightOrder\":[0,2,1]},{\"id\":\"tij-interfaces-classprocessor-apply\",\"key\":\"tij-interfaces/strategy-and-adapter/tij-interfaces-classprocessor-apply\",\"prompt\":\"\u003cp\u003eWhat are the last two lines printed? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eApply.process\u003c/code\u003e is a Strategy: the behavior varies with the \u003ccode\u003eProcessor\u003c/code\u003e passed in. But because \u003ccode\u003eProcessor\u003c/code\u003e is a class, only its subclasses can be used.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefin
