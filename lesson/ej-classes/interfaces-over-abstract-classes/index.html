es-over-abstract-classes/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-1\",\"title\":\"Interfaces are more flexible\",\"body\":\"\u003cp\u003eA class can extend only one abstract class.\u003c/p\u003e\\n\u003cp\u003eIt can implement any number of interfaces.\u003c/p\u003e\\n\u003cp\u003eSo existing classes are easy to retrofit with an interface.\u003c/p\u003e\\n\u003cp\u003eInterfaces are ideal for \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Mixin\\\" data-def=\\\"A type a class implements in addition to its primary type, to declare an optional behavior — \u0026lt;code\u0026gt;Comparable\u0026lt;/code\u0026gt; is a mixin.\\\" data-book=\\\"Effective Java\\\"\u003emixins\u003c/button\u003e like \u003ccode\u003eComparable\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-2\",\"prompt\":\"\u003cp\u003eWhich are advantages of interfaces over abstract classes?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They can hold instance fields\",\"correct\":false,\"feedback\":\"\u003cp\u003eInterfaces can\u0026#39;t have instance fields; that\u0026#39;s an abstract class\u0026#39;s advantage.\u003c/p\u003e\\n\"},{\"html\":\"They\u0026#39;re ideal for mixins — optional behaviour like \u003ccode\u003eComparable\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They allow non-hierarchical types, such as a \u003ccode\u003eSingerSongwriter\u003c/code\u003e that is both a \u003ccode\u003eSinger\u003c/code\u003e and a \u003ccode\u003eSongwriter\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Existing classes can be retrofitted to implement them\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Mixin\\\" data-def=\\\"A type a class implements in addition to its primary type, to declare an optional behavior — \u0026lt;code\u0026gt;Comparable\u0026lt;/code\u0026gt; is a mixin.\\\" data-book=\\\"Effective Java\\\"\u003eMixin\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-3\",\"title\":\"Add a skeletal implementation\",\"body\":\"$14\",\"diagram\":\"$15\"},{\"id\":\"step-4\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-4\",\"prompt\":\"\u003cp\u003eMatch each interface to its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Skeletal implementation\\\" data-def=\\\"An abstract class that implements most of an interface in terms of a few primitive methods, like \u0026lt;code\u0026gt;AbstractList\u0026lt;/code\u0026gt;. Combines the flexibility of interfaces with code reuse.\\\" data-book=\\\"Effective Java\\\"\u003eskeletal implementation\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eList\u003c/code\u003e\",\"\u003ccode\u003eSet\u003c/code\u003e\",\"\u003ccode\u003eMap\u003c/code\u003e\",\"\u003ccode\u003eCollection\u003c/code\u003e\"],\"right\":[\"\u003ccode\u003eAbstractList\u003c/code\u003e\",\"\u003ccode\u003eAbstractSet\u003c/code\u003e\",\"\u003ccode\u003eAbstractMap\u003c/code\u003e\",\"\u003ccode\u003eAbstractCollection\u003c/code\u003e\"],\"rightOrder\":[3,2,0,1]},{\"id\":\"step-5\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-5\",\"prompt\":\"\u003cp\u003eWhy not just put all the shared code into \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003edefault methods\u003c/button\u003e on the interface?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDefaults help, but the skeletal class can hold fields and override \u003ccode\u003eObject\u003c/code\u003e\u0026#39;s methods.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInterfaces can\u0026#39;t declare instance fields, so any shared behaviour needing state has to live elsewhere.\u003c/p\u003e\\n\u003cp\u003eAnd an interface may not provide default implementations of \u003ccode\u003eequals\u003c/code\u003e, \u003ccode\u003ehashCode\u003c/code\u003e or \u003ccode\u003etoString\u003c/code\u003e — \u003ccode\u003eObject\u003c/code\u003e\u0026#39;s versions always win.\u003c/p\u003e\\n\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Skeletal implementation\\\" data-def=\\\"An abstract class that implements most of an interface in terms of a few primitive methods, like \u0026lt;code\u0026gt;AbstractList\u0026lt;/code\u0026gt;. Combines the flexibility of interfaces with code reuse.\\\" data-book=\\\"Effective Java\\\"\u003eskeletal implementation\u003c/button\u003e class like \u003ccode\u003eAbstractList\u003c/code\u003e fills that gap: implementers extend it to get state and the \u003ccode\u003eObject\u003c/code\u003e methods for free, while the interface still defines the type.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Interfaces can\u0026#39;t have method bodies\",\"correct\":false,\"feedback\":\"\u003cp\u003eSince Java 8 they can — default and static methods.\u003c/p\u003e\\n\"},{\"html\":\"Default methods can\u0026#39;t have state, and can\u0026#39;t provide \u003ccode\u003eequals\u003c/code\u003e, \u003ccode\u003ehashCode\u003c/code\u003e or \u003ccode\u003etoString\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003eHash code\u003c/button\u003e\"]}]},\"courseTitle\":\"Classes and interfaces\",\"next\":{\"id\":\"interfaces-for-posterity\",\"courseId\":\"ej-classes\",\"topicId\":\"effective-java\",\"key\":\"ej-classes/interfaces-for-posterity\",\"title\":\"Design interfaces for posterity\",\"summary\":\"Default methods let you add to an interface — but not without risk to every existing implementation.\",\"duration\":4,\"tags\":[\"java\",\"effective java\",\"interfaces\",\"default methods\",\"api evolution\",\"compatibility\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 21\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-classes/interfaces-for-posterity/step-1\",\"ej-classes/interfaces-for-posterity/step-2\",\"ej-classes/interfaces-for-posterity/step-3\",\"ej-classes/interfaces-for-posterity/step-4\",\"ej-classes/interfaces-for-posterity/step-5\",\"ej-classes/interfaces-for-posterity/step-6\"],\"exercises\":[\"ej-classes/interfaces-for-posterity/step-2\",\"ej-classes/interfaces-for-posterity/step-4\",\"ej-classes/interfaces-for-posterity/step-5\",\"ej-classes/interfaces-for-posterity/step-6\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch,
