t\":true,\"feedback\":\"$undefined\"},{\"html\":\"Subtract \u003ccode\u003ec.size()\u003c/code\u003e in \u003ccode\u003eaddAll\u003c/code\u003e after calling \u003ccode\u003esuper\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eSame fragility, in reverse.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overriding\\\" data-def=\\\"A subclass redefining an inherited method. Which one runs is decided at run time from the object\u0026amp;#39;s actual class.\\\" data-book=\\\"Effective Java\\\"\u003eOverriding\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"ej-classes/composition-over-inheritance/step-4\",\"title\":\"Wrap and forward instead\",\"body\":\"\u003cp\u003eKeep the existing object in a private field.\u003c/p\u003e\\n\u003cp\u003eEach method forwards the call to it.\u003c/p\u003e\\n\u003cp\u003eThe inner object\u0026#39;s own calls never reach your code.\u003c/p\u003e\\n\u003cp\u003eAnd the wrapper works with any implementation of the interface.\u003c/p\u003e\\n\",\"diagram\":\"$17\"},{\"id\":\"step-5\",\"key\":\"ej-classes/composition-over-inheritance/step-5\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Composition\",\"Forwarding\",\"Wrapper (decorator)\",\"Fragile base class\"],\"right\":[\"The new class holds an instance of the existing one in a field\",\"Each method calls the same method on the held instance\",\"A class that adds behavior around another instance of the same interface\",\"A superclass change silently breaking subclasses\"],\"rightOrder\":[2,1,0,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003eComposition\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Forwarding\\\" data-def=\\\"A method that simply calls the same method on a contained object and returns its result.\\\" data-book=\\\"Effective Java\\\"\u003eForwarding\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eDecorator\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fragile base class\\\" data-def=\\\"When a subclass breaks because its superclass changes internally — e.g. one of its methods starts calling another overridable method.\\\" data-book=\\\"Effective Java\\\"\u003eFragile base class\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"ej-classes/composition-over-inheritance/step-6\",\"title\":\"When inheritance fits\",\"body\":\"\u003cp\u003eExtend only when B truly \u003cem\u003eis an\u003c/em\u003e A.\u003c/p\u003e\\n\u003cp\u003eAnd only when A was designed and documented for it.\u003c/p\u003e\\n\u003cp\u003eOtherwise, prefer \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003ecomposition\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"ej-classes/composition-over-inheritance/step-7\",\"prompt\":\"\u003cp\u003eWhen is inheritance the right tool?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eInheritance is safe inside a package under one team\u0026#39;s control, or for classes explicitly designed for it.\\nAcross package boundaries, prefer \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003ecomposition\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInheritance creates the tightest possible coupling: the subclass depends on how the superclass is implemented, not just on what it promises.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s acceptable when one team controls both classes and evolves them together, or when the superclass documents its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Self-use\\\" data-def=\\\"A class calling its own overridable methods. Subclasses that override them can be surprised, so it must be documented.\\\" data-book=\\\"Effective Java\\\"\u003eself-use\u003c/button\u003e precisely and is designed for extension.\u003c/p\u003e\\n\u003cp\u003eFor everything else — especially extending classes from another library — composition gives you the same reuse while depending only on the public API.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Whenever it saves code\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe saved lines are paid back later in fragility.\u003c/p\u003e\\n\"},{\"html\":\"Whenever B needs most of A\u0026#39;s methods\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Forwarding\\\" data-def=\\\"A method that simply calls the same method on a contained object and returns its result.\\\" data-book=\\\"Effective Java\\\"\u003eforwarding\u003c/button\u003e gives you, without inheriting A\u0026#39;s implementation details.\u003c/p\u003e\\n\"},{\"html\":\"When B truly \u003cem\u003eis an\u003c/em\u003e A, and A was designed and documented for extension\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Classes and interfaces\",\"next\":{\"id\":\"design-for-inheritance\",\"courseId\":\"ej-classes\",\"topicId\":\"effective-java\",\"key\":\"ej-classes/design-for-inheritance\",\"title\":\"Design for inheritance, or prohibit it\",\"summary\":\"A class meant to be extended must document its self-use and never call overridable methods from its constructor.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"inheritance\",\"final\",\"constructors\",\"documentation\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 19\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"ej-classes/design-for-inheritance/step-1\",\"ej-classes/design-for-inheritance/step-2\",\"ej-classes/design-for-inheritance/step-3\",\"ej-classes/design-for-inheritance/step-4\",\"ej-classes/design-for-inheritance/step-5\",\"ej-classes/design-for-inheritance/step-6\",\"ej-classes/design-for-inheritance/step-7\"],\"exercises\":[\"ej-classes/design-for-inheritance/step-3\",\"ej-classes/design-for-inheritance/step-4\",\"ej-classes/design-for-inheritance/step-6\",\"ej-classes/design-for-inheritance/step-7\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":
