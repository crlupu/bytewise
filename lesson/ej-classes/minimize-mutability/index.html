u003efinal\u003c/code\u003e stops the field pointing elsewhere. Does it stop the \u003ccode\u003eDate\u003c/code\u003e itself changing?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It throws an exception\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing checks the dates again after the constructor.\u003c/p\u003e\\n\"},{\"html\":\"0\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"1000\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e kept a reference to the caller\u0026#39;s \u003ccode\u003eDate\u003c/code\u003e — and \u003ccode\u003eDate\u003c/code\u003e is mutable.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"ej-classes/minimize-mutability/step-5\",\"title\":\"Copy mutable parts\",\"body\":\"\u003cp\u003eA caller may keep a reference to a \u003ccode\u003eDate\u003c/code\u003e it gave you.\u003c/p\u003e\\n\u003cp\u003eCopy mutable inputs before validating them.\u003c/p\u003e\\n\u003cp\u003eCopy mutable outputs before returning them.\u003c/p\u003e\\n\u003cp\u003eFor long builds, use a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Companion class\\\" data-def=\\\"A mutable helper for an immutable class, used when building a value in many steps — \u0026lt;code\u0026gt;StringBuilder\u0026lt;/code\u0026gt; for \u0026lt;code\u0026gt;String\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003emutable companion\u003c/button\u003e like \u003ccode\u003eStringBuilder\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"ej-classes/minimize-mutability/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e\u0026#39;s constructor stores \u003ccode\u003ethis.end = end;\u003c/code\u003e, so a caller can still change the \u003ccode\u003eDate\u003c/code\u003e it passed in. Fix it with a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Defensive copy\\\" data-def=\\\"Copying a mutable argument when it comes in, or a mutable field when it goes out, so callers can\u0026amp;#39;t change your object\u0026amp;#39;s internals behind your back.\\\" data-book=\\\"Effective Java\\\"\u003edefensive copy\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCopy first, then validate the copy — and in an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessor\u003c/button\u003e return \u003ccode\u003enew Date(end.getTime())\u003c/code\u003e too.\\nBetter still in modern Java: use \u003ccode\u003eInstant\u003c/code\u003e, which is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eMake a fresh object from the incoming value.\u003c/p\u003e\\n\"],\"type\":\"blank\",\"parts\":[{\"text\":\"this.end = new \"},{\"answers\":[\"Date\"],\"size\":4,\"choices\":[\"Date\",\"final\",\"record\",\"static\"]},{\"text\":\"(end.getTime());\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-7\",\"key\":\"ej-classes/minimize-mutability/step-7\",\"prompt\":\"\u003cp\u003ePut a defensive constructor\u0026#39;s work in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eValidating the copies closes the window in which another thread could change an original after it was checked.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Copy each mutable parameter\",\"Validate the copies, not the originals\",\"Assign the copies to the private final fields\"],\"start\":[0,2,1]},{\"id\":\"step-8\",\"key\":\"ej-classes/minimize-mutability/step-8\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eString\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e, so building a long string with \u003ccode\u003e+=\u003c/code\u003e in a loop is slow. What\u0026#39;s the standard remedy?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA \u003cstrong\u003emutable companion\u003c/strong\u003e for multi-step work is the usual answer to immutability\u0026#39;s performance cost.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Make \u003ccode\u003eString\u003c/code\u003e mutable\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery map key and cached constant would become unsafe.\u003c/p\u003e\\n\"},{\"html\":\"Use the mutable companion class, \u003ccode\u003eStringBuilder\u003c/code\u003e, then call \u003ccode\u003etoString()\u003c/code\u003e once\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Use \u003ccode\u003eString.concat\u003
