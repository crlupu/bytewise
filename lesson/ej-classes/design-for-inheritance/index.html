03e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D\"\u003e// main: new Sub();\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"design-for-inheritance\",\"courseId\":\"ej-classes\",\"topicId\":\"effective-java\",\"key\":\"ej-classes/design-for-inheritance\",\"title\":\"Design for inheritance, or prohibit it\",\"summary\":\"A class meant to be extended must document its self-use and never call overridable methods from its constructor.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"inheritance\",\"final\",\"constructors\",\"documentation\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 19\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"ej-classes/design-for-inheritance/step-1\",\"ej-classes/design-for-inheritance/step-2\",\"ej-classes/design-for-inheritance/step-3\",\"ej-classes/design-for-inheritance/step-4\",\"ej-classes/design-for-inheritance/step-5\",\"ej-classes/design-for-inheritance/step-6\",\"ej-classes/design-for-inheritance/step-7\"],\"exercises\":[\"ej-classes/design-for-inheritance/step-3\",\"ej-classes/design-for-inheritance/step-4\",\"ej-classes/design-for-inheritance/step-6\",\"ej-classes/design-for-inheritance/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-classes/design-for-inheritance/step-1\",\"title\":\"Document self-use\",\"body\":\"\u003cp\u003eA class meant for subclassing must document its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Self-use\\\" data-def=\\\"A class calling its own overridable methods. Subclasses that override them can be surprised, so it must be documented.\\\" data-book=\\\"Effective Java\\\"\u003eself-use\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eWhich overridable methods does it call on itself, and when?\u003c/p\u003e\\n\u003cp\u003eThat becomes a permanent part of its API.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"ej-classes/design-for-inheritance/step-2\",\"title\":\"Constructors must not call overridable methods\",\"body\":\"\u003cp\u003eThe superclass constructor runs first.\u003c/p\u003e\\n\u003cp\u003eIf it calls an overridden method, the subclass isn\u0026#39;t set up yet.\u003c/p\u003e\\n\u003cp\u003eIts fields are still \u003ccode\u003enull\u003c/code\u003e or zero.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"ej-classes/design-for-inheritance/step-3\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eConstructors must not call overridable methods — directly or indirectly. The same goes for \u003ccode\u003eclone\u003c/code\u003e and \u003ccode\u003ereadObject\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eJava runs constructors from the top of the hierarchy down, and fields of \u003ccode\u003eSub\u003c/code\u003e are only assigned after \u003ccode\u003esuper()\u003c/code\u003e returns.\u003c/p\u003e\\n\u003cp\u003eBut virtual method calls dispatch to the subclass even during construction, so \u003ccode\u003eSuper()\u003c/code\u003e runs \u003ccode\u003eSub.overrideMe()\u003c/code\u003e while \u003ccode\u003einstant\u003c/code\u003e is still \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIt prints \u003ccode\u003enull\u003c/code\u003e once, then the real instant after construction; if \u003ccode\u003eoverrideMe\u003c/code\u003e called a method on \u003ccode\u003einstant\u003c/code\u003e, it would throw \u003ccode\u003eNullPointerException\u003c/code\u003e instead.\u003c/p\u003e\\n\u003cp\u003eA constructor may only call methods that are private, final or static — those can\u0026#39;t be overridden.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003enull\u003c/code\u003e — the superclass constructor calls the override before \u003ccode\u003eSub\u003c/code\u003e\u0026#39;s fields are set\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"The current time\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eSub\u003c/code\u003e\u0026#39;s constructor body hasn\u0026#39;t run yet when \u003ccode\u003eSuper()\u003c/code\u003e calls \u003ccode\u003eoverrideMe\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-4\",\"key\":\"ej-classes/design-for-inheritance/step-4\",\"prompt\":\"\u003cp\u003eHow should you test a class designed for inheritance?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWriting subclasses reveals missing protected hooks — and hooks nobody needs.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Write several subclasses before releasing it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Unit-test the class on its own\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat checks behaviour, not whether the protected hooks you chose are the right ones.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"ej-classes/design-for-inheritance/step-5\",\"title\":\"Otherwise, prohibit subclassing\",\"body\":\"\u003cp\u003eDesigning for inheritance is real work.\u003c/p\u003e\\n\u003cp\u003eTest it by writing several subclasses before release.\u003c/p\u003e\\n\u003cp\u003eIf you won\u0026#39;t do that, make the class \u003ccode\u003efinal\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"ej-classes/design-for-inheritance/step-6\",\"prompt\":\"\u003cp\u003eA class isn\u0026#39;t designed or documented for subclassing. What should you do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eProhibiting inheritance for ordinary concrete classes is the safe default.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Prohibit it — declare the class \u003ccode\u003efinal\u003c/code\u003e, or make constructors private with static factories\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Leave it open just in case\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery subclass then depends on undocumented internals.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003eStatic factory method\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"ej-classes/design-for-inheritance/step-7\",\"prompt\":\"\u003cp\u003eProhibit subclassing.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"public \"},{\"answers\":[\"final\"],\"size\":5,\"choices\":[\"permits\",\"record\",\"Date\",\"final\"]},{\"text\":\" class Money { ... }\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Classes and interfaces\",\"next\":{\"id\":\"interfaces-over-abstract-classes\",\"courseId\":\"ej-classes\",\"topicId\":\"effective-java\",\"k
