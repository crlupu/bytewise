n/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"accessor-methods\",\"courseId\":\"ej-classes\",\"topicId\":\"effective-java\",\"key\":\"ej-classes/accessor-methods\",\"title\":\"Accessors, not public fields\",\"summary\":\"Public classes should expose data through methods, keeping the freedom to change the representation.\",\"duration\":4,\"tags\":[\"java\",\"effective java\",\"encapsulation\",\"getters\",\"records\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 16\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-classes/accessor-methods/step-1\",\"ej-classes/accessor-methods/step-2\",\"ej-classes/accessor-methods/step-3\",\"ej-classes/accessor-methods/step-4\",\"ej-classes/accessor-methods/step-5\",\"ej-classes/accessor-methods/step-6\"],\"exercises\":[\"ej-classes/accessor-methods/step-2\",\"ej-classes/accessor-methods/step-4\",\"ej-classes/accessor-methods/step-5\",\"ej-classes/accessor-methods/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-classes/accessor-methods/step-1\",\"title\":\"Public fields freeze your design\",\"body\":\"\u003cp\u003eA class with public fields lets clients touch them directly.\u003c/p\u003e\\n\u003cp\u003eYou can\u0026#39;t change how the data is stored.\u003c/p\u003e\\n\u003cp\u003eYou can\u0026#39;t enforce rules on the values.\u003c/p\u003e\\n\u003cp\u003eYou can\u0026#39;t react when a field is read or written.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-classes/accessor-methods/step-2\",\"prompt\":\"\u003cp\u003eWhich problems do public fields cause in a \u003cstrong\u003epublic\u003c/strong\u003e class?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA public field is part of the class\u0026#39;s contract forever: every client reads and writes it directly, so you can\u0026#39;t later store the value differently, compute it on demand or validate a new value.\u003c/p\u003e\\n\u003cp\u003eWith an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessor\u003c/button\u003e, the field is an implementation detail behind a method, so you can change the representation, add checks, log access or make it lazy without breaking anyone.\u003c/p\u003e\\n\u003cp\u003eThis only matters where clients outside your control exist — that is, in public classes. Inside a package or a private nested class, you can fix every user yourself.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No action can be taken when a field is accessed\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The representation can never change without breaking clients\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Invariants can\u0026#39;t be enforced\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They make the class slower\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eAccessors\u003c/button\u003e are inlined by the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e; speed isn\u0026#39;t the issue.\u003c/p\u003e\\n\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-classes/accessor-methods/step-3\",\"title\":\"Hide fields behind methods\",\"body\":\"\u003cp\u003eMake fields private and expose \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessors\u003c/button\u003e instead.\u003c/p\u003e\\n\u003cp\u003eIn private or package-private classes, public fields are fine.\u003c/p\u003e\\n\u003cp\u003eThere, every client is your own code.\u003c/p\u003e\\n\u003cp\u003eRecords give you a small \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e carrier with accessors built in.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-classes/accessor-methods/step-4\",\"prompt\":\"\u003cp\u003eWhen is exposing fields directly acceptable?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eChanges then stay within the package, so you can fix every client at once.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"In package-private or private nested classes, where all clients are under your control\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Never\",\"correct\":false,\"feedback\":\"\u003cp\u003eInside a package or a nested class, it can be the clearest code.\u003c/p\u003e\\n\"},{\"html\":\"Whenever the fields are \u003ccode\u003efinal\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e public fields are less harmful, but still fix the representation forever.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"ej-classes/accessor-methods/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ejava.awt.Point\u003c/code\u003e and \u003ccode\u003eDimension\u003c/code\u003e expose public fields. What\u0026#39;s the lasting consequence?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThey\u0026#39;re cautionary examples in the platform itself.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Nothing, since they\u0026#39;re simple\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Their representation is frozen in the public API, and the performance problems they cause can\u0026#39;t be fixed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-6\",\"key\":\"ej-classes/accessor-methods/step-6\",\"prompt\":\"\u003cp\u003eModern Java offers a concise \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026
