 alive.\u003c/figcaption\u003e\u003c/figure\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"static-member-classes\",\"courseId\":\"ej-classes\",\"topicId\":\"effective-java\",\"key\":\"ej-classes/static-member-classes\",\"title\":\"Static member classes over inner classes\",\"summary\":\"A nested class that doesn't need its enclosing instance should be static — otherwise it carries a hidden reference.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"nested classes\",\"inner classes\",\"memory leak\",\"static\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 24\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-classes/static-member-classes/step-1\",\"ej-classes/static-member-classes/step-2\",\"ej-classes/static-member-classes/step-3\",\"ej-classes/static-member-classes/step-4\",\"ej-classes/static-member-classes/step-5\",\"ej-classes/static-member-classes/step-6\"],\"exercises\":[\"ej-classes/static-member-classes/step-2\",\"ej-classes/static-member-classes/step-4\",\"ej-classes/static-member-classes/step-5\",\"ej-classes/static-member-classes/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-classes/static-member-classes/step-1\",\"title\":\"Four kinds of nested class\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static member class\\\" data-def=\\\"A nested class declared \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt; — an ordinary class that happens to live inside another. Doesn\u0026amp;#39;t hold a reference to an outer instance.\\\" data-book=\\\"Effective Java\\\"\u003eStatic member classes\u003c/button\u003e are ordinary classes, nested for grouping.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003eInner classes\u003c/button\u003e are tied to an instance of the outer class.\u003c/p\u003e\\n\u003cp\u003eAnonymous and local classes live inside methods.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-classes/static-member-classes/step-2\",\"prompt\":\"\u003cp\u003eMatch each kind of nested class to its description.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Static member class\",\"Nonstatic member class (inner class)\",\"Anonymous class\",\"Local class\"],\"right\":[\"Declared with \u003ccode\u003estatic\u003c/code\u003e inside another class; no link to an enclosing instance\",\"Each instance is tied to an instance of the enclosing class\",\"Declared and instantiated at one point in an expression, without a name\",\"Declared inside a method body, with a name\"],\"rightOrder\":[0,3,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static member class\\\" data-def=\\\"A nested class declared \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt; — an ordinary class that happens to live inside another. Doesn\u0026amp;#39;t hold a reference to an outer instance.\\\" data-book=\\\"Effective Java\\\"\u003eStatic member class\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003eInner class\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Anonymous class\\\" data-def=\\\"A class declared and instantiated in one expression, without a name. Mostly replaced by lambdas.\\\" data-book=\\\"Effective Java\\\"\u003eAnonymous class\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-classes/static-member-classes/step-3\",\"title\":\"Inner classes hold a hidden reference\",\"body\":\"\u003cp\u003eEvery \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003einner class\u003c/button\u003e instance points to its outer instance.\u003c/p\u003e\\n\u003cp\u003eThat costs memory.\u003c/p\u003e\\n\u003cp\u003eIt also keeps the outer object alive.\u003c/p\u003e\\n\u003cp\u003eIf you don\u0026#39;t need the outer instance, add \u003ccode\u003estatic\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-4\",\"key\":\"ej-classes/static-member-classes/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eMap\u003c/code\u003e implementations keep one \u003ccode\u003eEntry\u003c/code\u003e object per key. Should \u003ccode\u003eEntry\u003c/code\u003e be static or nonstatic?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe rule — \u003cstrong\u003eif a member class doesn\u0026#39;t need access to an enclosing instance, always make it static.\u003c/strong\u003e\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nonstatic — entries belong to the map\",\"correct\":false,\"feedback\":\"\u003cp\u003eBelonging isn\u0026#39;t the test; needing the enclosing \u003cem\u003einstance\u003c/em\u003e is.\u003c/p\u003e\\n\"},{\"html\":\"Static — entries never use the enclosing map, and a reference per entry would waste space\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"ej-classes/static-member-classes/step-5\",\"prompt\":\"\u003cp\u003eAn inner (nonstatic) class instance is stored in a long-lived \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e after its enclosing object is otherwise unused.\\nWhat happens to the enclosing object?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA classic \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Memory leak\\\" data-def=\\\"In Java, objects that are no longer needed but stay reachable — from a cache, a listener list, or a stale array slot — so the garbage collector can never free them.\\\" data-book=\\\"Effective Java\\\"\u003ememory leak\u003c/button\u003e — and an invisible one, since the reference doesn\u0026#39;t appear in the source.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEvery instance of a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003enonstatic member class\u003c/button\u003e carries a hidden reference to its enclosing instance, so it can call the outer object\u0026#39;s methods.\u003c/p\u003e\\n\u003cp\u003eAs long as the inner object is reachable — say, from a long-lived cache — the outer object stays reachable too, along with everything it holds.\u003c/p\u003e\\n\u003cp\u003eNothing in the source shows this reference, which makes the leak hard to spot in a heap dump.\u003c/p\u003e\\n\u003cp\u003eIf the nested class doesn\u0026#39;t need the outer instance, declaring it \u003ccode\u003estatic\u003c/code\u003e removes the reference and the leak.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It can\u0026#39;t be garbage collected, because the inner instance references it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s collected normally\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe hidden reference keeps it reachable.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-6\",\"key\":\"ej-classes/static-member-classes/step-6\",\"prompt\":\"\u003cp\u003eDeclare a nested class with no link to the outer instance.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"private \"},{\"answers\":[\"static\"],\"size\":6,\"choices\":[\"static\",\"record\",\"final\",\"Date\"]},{\"text\":\" class Node\u003cE\u003e { E item; Node\u003cE\u003e next; }\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Classes and interfaces\",\"next\":{\"id\":\"one-top-level-class\",\"courseId\":\"ej-classes\",\"topicId\":\"effective-java\",\"key\":\"ej-classes/one-top-level-class\",\"title\":\"One top-level class per source file\",\"summary\":\"Several top-level classes in one file can make the program's behaviour depend on compile order.\",\"duration\":4,\"tags\":[\"java\",\"effective java\",\"source files\",\"compilation\",\"nested classes\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 25\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-classes/one-top-level-class/step-1\",\"ej-classes/one-top-level-class/step-2\",\"ej-classes/one-top-level-class/step-3\",\"ej-classes/one-top-level-class/step-4\",\"ej-classes/one-top-level-class/step-5\",\"ej-classe
