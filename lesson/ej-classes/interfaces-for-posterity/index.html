u003c/code\u003e doesn\u0026#39;t know about a wrapper\u0026#39;s lock.\u003c/p\u003e\\n\u003cp\u003eSo it can break a synchronized collection.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-classes/interfaces-for-posterity/step-2\",\"prompt\":\"\u003cp\u003eA synchronized collection wrapper locks a mutex in every method. What happens when someone calls the inherited \u003ccode\u003eremoveIf\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe default can\u0026#39;t preserve invariants it didn\u0026#39;t know existed. Apache Commons\u0026#39; \u003ccode\u003eSynchronizedCollection\u003c/code\u003e was a real victim.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003eDefault methods\u003c/button\u003e are written without knowledge of the classes that will inherit them.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eremoveIf\u003c/code\u003e iterates and removes using the collection\u0026#39;s own methods, but the synchronized wrapper\u0026#39;s invariant is \u0026quot;every access holds the mutex\u0026quot; — and the default doesn\u0026#39;t take it.\u003c/p\u003e\\n\u003cp\u003eSo the wrapper silently becomes thread-unsafe for one method, with no compile error and no test failure until a race happens in production.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why adding a default method to a widely implemented interface is risky: each existing implementation must be checked, and you can\u0026#39;t check implementations you don\u0026#39;t know about.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles fine — that\u0026#39;s what makes it dangerous.\u003c/p\u003e\\n\"},{\"html\":\"It takes the lock automatically\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003edefault method\u003c/button\u003e knows nothing about the wrapper\u0026#39;s locking.\u003c/p\u003e\\n\"},{\"html\":\"It runs without taking the lock, so concurrent use can corrupt the collection\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-classes/interfaces-for-posterity/step-3\",\"title\":\"Get interfaces right first\",\"body\":\"\u003cp\u003eAfter release, an interface is hard to change.\u003c/p\u003e\\n\u003cp\u003eWrite several implementations and clients before publishing.\u003c/p\u003e\\n\u003cp\u003eDefaults are safest in brand-new interfaces.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-classes/interfaces-for-posterity/step-4\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the lesson for designing an interface?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Get it right before release — write several implementations and clients; you may not be able to fix it later\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Ship quickly, and add default methods to fix it later\",\"correct\":false,\"feedback\":\"
