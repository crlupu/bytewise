fer.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e first.\u003c/p\u003e\\n\u003cp\u003eOnly then does it call \u003ccode\u003eequals\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOverride \u003ccode\u003eequals\u003c/code\u003e without \u003ccode\u003ehashCode\u003c/code\u003e, and lookups miss.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-common-methods/hashcode/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePoint\u003c/code\u003e overrides \u003ccode\u003eequals\u003c/code\u003e to compare \u003ccode\u003ex\u003c/code\u003e and \u003ccode\u003ey\u003c/code\u003e, but not \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAlmost certainly \u003ccode\u003enull\u003c/code\u003e. (Occasionally the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Identity\\\" data-def=\\\"Whether two references point to the very same object — what \u0026lt;code\u0026gt;==\u0026lt;/code\u0026gt; compares for objects.\\\"\u003eidentity\u003c/button\u003e hashes collide — making the bug intermittent, which is worse.)\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eHashMap.get\u003c/code\u003e first computes the key\u0026#39;s hash code to pick a bucket, and only then calls \u003ccode\u003eequals\u003c/code\u003e on keys in that bucket.\u003c/p\u003e\\n\u003cp\u003eWithout an override, \u003ccode\u003ehashCode\u003c/code\u003e comes from \u003ccode\u003eObject\u003c/code\u003e and is based on identity, so two equal points almost always get different codes and land in different buckets.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eget\u003c/code\u003e looks in the wrong bucket, never calls \u003ccode\u003eequals\u003c/code\u003e, and returns \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWhenever you override \u003ccode\u003eequals\u003c/code\u003e, override \u003ccode\u003ehashCode\u003c/code\u003e from the same fields.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhich method does \u003ccode\u003eHashMap.get\u003c/code\u003e call first?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"null\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"home\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe two \u003ccode\u003ePoint\u003c/code\u003es are equal, but their inherited hash codes differ, so \u003ccode\u003eget\u003c/code\u003e searches another bucket.\u003c/p\u003e\\n\"},{\"html\":\"A \u003ccode\u003eNullPointerException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eget\u003c/code\u003e returns null for a missing key; it doesn\u0026#39;t throw.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-common-methods/hashcode/step-3\",\"title\":\"Writing hashCode\",\"body\":\"\u003cp\u003e\u003ccode\u003eObjects.hash(x, y)\u003c/code\u003e is the easy way.\u003c/p\u003e\\n\u003cp\u003eUse exactly the fields that \u003ccode\u003eequals\u003c/code\u003e uses.\u003c/p\u003e\\n\u003cp\u003eAnd don\u0026#39;t change those fields while the object is in a set or map.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-common-methods/hashcode/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePoint\u003c/code\u003e has \u003ccode\u003eint\u003c/code\u003e fields \u003ccode\u003ex\u003c/code\u003e and \u003ccode\u003ey\u003c/code\u003e, and \u003ccode\u003eequals\u003c/code\u003e compares both. Which \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e implementations are legal?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003ereturn 42\u003c/code\u003e is \u003cem\u003elegal\u003c/em\u003e but every point lands in one bucket and the map degrades into a list. \u003ccode\u003eObjects.hash\u003c/code\u003e is\\nconcise but allocates an array per call; the hand-written form is fastest.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe only hard rule is that equal objects must return equal hash codes, so even \u003ccode\u003ereturn 42\u003c/code\u003e is legal — it just sends every point to one bucket and turns lookups from constant time into a linear scan.\u003c/p\u003e\\n\u003cp\u003eA good hash spreads unequal objects across many values. Multiplying by 31 mixes the fields so that \u003ccode\u003e(1, 2)\u003c/code\u003e and \u003ccode\u003e(2, 1)\u003c/code\u003e usually differ.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eObjects.hash(x, y)\u003c/code\u003e gives the same quality in one line, at the cost of an array allocation and boxing per call — fine unless the method is very hot.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ereturn System.identityHashCode(this);\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eTwo equal points would get different values — exactly the bug we just saw.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ereturn Objects.hash(x, y);\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ereturn 31 * Integer.hashCode(x) + Integer.hashCode(y);\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ereturn 42;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"id\":\"step-5\",\"key\":\"ej-common-methods/hashcode/step-5\",\"prompt\":\"\u003cp\u003eComplete the contract.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUnequal objects \u003cem\u003emay\u003c/em\u003e share a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003ehash code\u003c/button\u003e — that\u0026#39;s a collision, and costs only performance.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"If two objects are \",\"html\":\"If two objects are \"},{\"answers\":[\"equal\"],\"size\":5,\"choices\":[\"fail\",\"hashCode\",\"persistent\",\"equal\"]},{\"text\":\" according to `equals`, they must have the same \",\"html\":\" according to \u003ccode\u003eequals\u003c/code\u003e, they must have the same \"},{\"answers\":[\"hashCode\",\"hash code\"],\"size\":9,\"choices\":[\"danger\",\"equal\",\"hashCode\",\"source\"]},{\"text\":\". The reverse need not hold.\",\"html\":\". The reverse need not hold.\"}],\"code\":false,\"caseSensitive\":false},{\"id\":\"step-6\",\"key\":\"ej-common-methods/hashcode/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePerson\u003c/code\u003e uses \u003ccode\u003ename\u003c/code\u003e in both \u003ccode\u003eequals\u003c/code\u003e and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e, and has a setter for \u003ccode\u003ename\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eMutating a field \u003ccode\u003ehashCode\u003c/code\u003e uses, while the object sits in a hash collection, strands it in the wrong bucket.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen \u003ccode\u003ep\u003c/code\u003e was added, the set stored it in the bucket for the hash code of \u0026quot;Ada\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eChanging the name changes the hash code, so \u003ccode\u003econtains(p)\u003c/code\u003e looks in the bucket for \u0026quot;Grace\u0026quot;, finds nothing and returns \u003ccode\u003efalse\u003c/code\u003e — even though the very same object is in the set.\u003c/p\u003e\\n\u003cp\u003eThe object is stranded: it can\u0026#39;t be found or removed, and iterating still shows it.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t mutate fields used by \u003ccode\u003eequals\u003c/code\u003e and \u003ccode\u003ehashCode\u003c/code\u003e while an object is a key or element of a hash-based collection; \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e keys avoid this entirely.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ep\u003c/code\u003e is still in the set — but filed in the bucket for its \u003cem\u003eold\u003c/em\u003e hash code.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-7\",\"key\":\"ej-common-methods/hashcode/step-7\",\"prompt\":\"\u003cp\u003eMay you leave a significant field out of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e to make it faster?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFields excluded from \u003ccode\u003eequals\u003c/code\u003e \u003cem\u003emust\u003c/em\u003e be excluded from \u003ccode\u003ehashCode\u003c/code\u003e, or equal objects could hash differently.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, always — fewer fields means a faster hash\",\"correct\":false,\"feedback\":\"\u003cp\u003eLeaving out important fields can make hash tables unusably slow.\u003c/p\u003e\\n\"},{\"html\":\"Only if you accept more collisions — and never include a field that \u003ccode\u003eequals\u003c/code\u003e ignores\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Methods common to all objects\",\"next\":{\"id\":\"tostring\",\"courseId\":\"ej-common-methods\",\"topicId\":\"effective-java\",\"key\":\"ej-common-methods/tostring\",
