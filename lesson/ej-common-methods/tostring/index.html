ocus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"tostring\",\"courseId\":\"ej-common-methods\",\"topicId\":\"effective-java\",\"key\":\"ej-common-methods/tostring\",\"title\":\"Always override toString\",\"summary\":\"A useful string representation pays off every time an object is logged, printed or shown in a debugger.\",\"duration\":4,\"tags\":[\"java\",\"effective java\",\"tostring\",\"debugging\",\"logging\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 12\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-common-methods/tostring/step-1\",\"ej-common-methods/tostring/step-2\",\"ej-common-methods/tostring/step-3\",\"ej-common-methods/tostring/step-4\",\"ej-common-methods/tostring/step-5\",\"ej-common-methods/tostring/step-6\"],\"exercises\":[\"ej-common-methods/tostring/step-2\",\"ej-common-methods/tostring/step-4\",\"ej-common-methods/tostring/step-5\",\"ej-common-methods/tostring/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-common-methods/tostring/step-1\",\"title\":\"The default toString is useless\",\"body\":\"\u003cp\u003eBy default you get the class name and a hex hash.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ePhoneNumber@163b91\u003c/code\u003e tells you nothing.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-common-methods/tostring/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePhoneNumber\u003c/code\u003e doesn\u0026#39;t override \u003ccode\u003etoString\u003c/code\u003e. What does \u003ccode\u003eSystem.out.println(new PhoneNumber(707, 867, 5309))\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eObject.toString\u003c/code\u003e gives the class name, \u003ccode\u003e@\u003c/code\u003e, and the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003ehash code\u003c/button\u003e in hex — rarely useful.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Something like \u003ccode\u003ePhoneNumber@163b91\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e707-867-5309\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what you\u0026#39;d want — but \u003ccode\u003eObject.toString\u003c/code\u003e doesn\u0026#39;t know your fields.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — it fails to compile\",\"correct\":false,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-common-methods/tostring/step-3\",\"title\":\"Show the interesting state\",\"body\":\"\u003cp\u003e\u003ccode\u003etoString\u003c/code\u003e appears in logs, debuggers and error messages.\u003c/p\u003e\\n\u003cp\u003eReturn the object\u0026#39;s important values, concisely.\u003c/p\u003e\\n\u003cp\u003eAlso provide \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003egetters\u003c/button\u003e for those values.\u003c/p\u003e\\n\u003cp\u003eOtherwise clients will parse your string.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-common-methods/tostring/step-4\",\"prompt\":\"\u003cp\u003eShould you document the exact format of \u003ccode\u003etoString\u003c/code\u003e\u0026#39;s output?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEither way, say in the docs whether the format is guaranteed, and offer \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessors\u003c/button\u003e so no one has to parse the string.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eSpecifying the format turns \u003ccode\u003etoString\u003c/code\u003e into a parsing contract: clients will write code that reads it, and you can never change it without breaking them.\u003c/p\u003e\\n\u003cp\u003eFor value classes like phone numbers, a standard, documented format is useful and often paired with a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003estatic factory\u003c/button\u003e that parses it.\u003c/p\u003e\\n\u003cp\u003eFor other classes, leave it unspecified and say so in the docs.\u003c/p\u003e\\n\u003cp\u003eEither way, provide accessors for every value in the string, so no one needs to parse it to get them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Never — it\u0026#39;s for debugging only\",\"correct\":false,\"feedback\":\"\u003cp\u003eEither choice is reasonable; what matters is stating the intent clearly.\u003c/p\u003e\\n\"},{\"html\":\"For value classes it can help — but once specified, you\u0026#39;re stuck with that format forever\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Value class\\\" data-def=\\\"A class whose instances represent a value, like \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;LocalDate\u0026lt;/code\u0026gt;, where two instances with the same contents should be equal.\\\" data-book=\\\"Effective Java\\\"\u003eValue class\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"ej-common-methods/tostring/step-5\",\"prompt\":\"\u003cp\u003eWhy provide \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003egetters\u003c/button\u003e for the values that appear in \u003ccode\u003etoString\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Because \u003ccode\u003etoString\u003c/code\u003e can\u0026#39;t access private fields\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s inside the class, so it can.\u003c/p\u003e\\n\"},{\"html\":\"Otherwise clients parse the string to get them, making the format a de facto API\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"ej-common-methods/tostring/step-6\",\"prompt\":\"\u003cp\u003eComplete the override.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"@Override public \"},{\"answers\":[\"String\"],\"size\":6,\"choices\":[\"comparingInt\",\"String\",\"thenComparingInt\",\"toString\"]},{\"text\":\" \"},{\"answ
