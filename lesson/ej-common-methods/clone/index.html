-1\",\"ej-common-methods/clone/step-2\",\"ej-common-methods/clone/step-3\",\"ej-common-methods/clone/step-4\",\"ej-common-methods/clone/step-5\"],\"exercises\":[\"ej-common-methods/clone/step-2\",\"ej-common-methods/clone/step-4\",\"ej-common-methods/clone/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-common-methods/clone/step-1\",\"title\":\"clone is a strange mechanism\",\"body\":\"\u003cp\u003e\u003ccode\u003eCloneable\u003c/code\u003e has no methods.\u003c/p\u003e\\n\u003cp\u003eIt just changes what \u003ccode\u003eObject.clone\u003c/code\u003e does.\u003c/p\u003e\\n\u003cp\u003eThe copy is shallow: references are shared, not copied.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"ej-common-methods/clone/step-2\",\"prompt\":\"\u003cp\u003eA \u003ccode\u003eStack\u003c/code\u003e with an \u003ccode\u003eObject[] elements\u003c/code\u003e field overrides \u003ccode\u003eclone\u003c/code\u003e as just \u003ccode\u003ereturn (Stack) super.clone();\u003c/code\u003e. What\u0026#39;s wrong?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe fix is \u003ccode\u003eresult.elements = elements.clone();\u003c/code\u003e — and mutable fields must not be \u003ccode\u003efinal\u003c/code\u003e, or you can\u0026#39;t reassign them.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eObject.clone\u003c/code\u003e makes a shallow, field-by-field copy, so the clone\u0026#39;s \u003ccode\u003eelements\u003c/code\u003e field points to the very same array as the original.\u003c/p\u003e\\n\u003cp\u003ePush onto the clone and you overwrite the original\u0026#39;s slots; pop from one and the other\u0026#39;s \u003ccode\u003esize\u003c/code\u003e no longer matches its contents.\u003c/p\u003e\\n\u003cp\u003eA correct \u003ccode\u003eclone\u003c/code\u003e must deep-copy mutable state: \u003ccode\u003eresult.elements = elements.clone()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThis is one of the many traps that make copy
