26gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eTransitive\u003c/button\u003e: equality carries across a chain.\u003c/p\u003e\\n\u003cp\u003eConsistent, and \u003ccode\u003ex.equals(null)\u003c/code\u003e is false.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"ej-common-methods/equals-contract/step-3\",\"prompt\":\"\u003cp\u003eMatch each property to an example of it being broken.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Symmetry\",\"Transitivity\",\"Consistency\",\"Non-nullity\"],\"right\":[\"\u003ccode\u003ea.equals(b)\u003c/code\u003e is true but \u003ccode\u003eb.equals(a)\u003c/code\u003e is false\",\"\u003ccode\u003ea\u003c/code\u003e equals \u003ccode\u003eb\u003c/code\u003e, \u003ccode\u003eb\u003c/code\u003e equals \u003ccode\u003ec\u003c/code\u003e, but \u003ccode\u003ea\u003c/code\u003e doesn\u0026#39;t equal \u003ccode\u003ec\u003c/code\u003e\",\"The answer changes because \u003ccode\u003eequals\u003c/code\u003e reads a remote resource\",\"\u003ccode\u003ex.equals(null)\u003c/code\u003e throws a \u003ccode\u003eNullPointerException\u003c/code\u003e\"],\"rightOrder\":[1,0,2,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Symmetric\\\" data-def=\\\"If \u0026lt;code\u0026gt;x.equals(y)\u0026lt;/code\u0026gt; then \u0026lt;code\u0026gt;y.equals(x)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eSymmetric\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transitive\\\" data-def=\\\"If \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eTransitive\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"ej-common-methods/equals-contract/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eCaseInsensitiveString.equals\u003c/code\u003e returns true for an ordinary \u003ccode\u003eString\u003c/code\u003e with the same letters in any case.\\nWhat\u0026#39;s wrong with that?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDon\u0026#39;t try to make \u003ccode\u003eequals\u003c/code\u003e interoperate with a class you don\u0026#39;t control.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ecis.equals(s)\u003c/code\u003e is true because \u003ccode\u003eCaseInsensitiveString\u003c/code\u003e knows about \u003ccode\u003eString\u003c/code\u003e, but \u003ccode\u003eString.equals\u003c/code\u003e only accepts other \u003ccode\u003eString\u003c/code\u003es, so \u003ccode\u003es.equals(cis)\u003c/code\u003e is false.\u003c/p\u003e\\n\u003cp\u003eAsymmetric \u003ccode\u003eequals\u003c/code\u003e breaks collections in unpredictable ways: whether \u003ccode\u003elist.contains(cis)\u003c/code\u003e is true depends on which object\u0026#39;s \u003ccode\u003eequals\u003c/code\u003e the implementation happens to call.\u003c/p\u003e\\n\u003cp\u003eThe fix is to compare only with other \u003ccode\u003eCaseInsensitiveString\u003c/code\u003es — one class can\u0026#39;t unilaterally declare itself equal to a type it doesn\u0026#39;t control.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"It breaks reflexivity\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ecis.equals(cis)\u003c/code\u003e is still true. The problem appears between two different classes.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — it\u0026#39;s a sensible convenience\",\"correct\":false,\"feedback\":\"\u003cp\u003ePut both in a \u003ccode\u003eList\u003c/code\u003e and \u003ccode\u003econtains\u003c/code\u003e could answer either way depending on the implementation.\u003c/p\u003e\\n\"},{\"html\":\"It breaks symmetry — \u003ccode\u003eString.equals\u003c/code\u003e knows nothing about the new class and returns false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Symmetric\\\" data-def=\\\"If \u0026lt;code\u0026gt;x.equals(y)\u0026lt;/code\u0026gt; then \u0026lt;code\u0026gt;y.equals(x)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eSymmetric\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"ej-common-methods/equals-contract/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eColorPoint extends Point\u003c/code\u003e adds a color, and you want \u003ccode\u003eequals\u003c/code\u003e to compare it too. What\u0026#39;s the catch?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGive \u003ccode\u003eColorPoint\u003c/code\u003e a private \u003ccode\u003ePoint\u003c/code\u003e field and an \u003ccode\u003easPoint()\u003c/code\u003e view, rather than extending \u003ccode\u003ePoint\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$14\",\"diagram\":\"$15\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Just compare \u003ccode\u003egetClass()\u003c/code\u003e instead of using \u003ccode\u003einstanceof\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat keeps the contract but breaks substitutability — a \u003ccode\u003ePoint\u003c/code\u003e subclass could never equal a \u003ccode\u003ePoint\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"There\u0026#39;s no way to extend an instantiable class with a value field and keep the equals contract — use composition instead\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Ignore the color in \u003ccode\u003eColorPoint.equals\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen two points of different colors are \u0026quot;equal\u0026quot;, which isn\u0026#39;t what you wanted.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003eComposition\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"ej-common-methods/equals-contract/step-6\",\"title\":\"A reliable recipe\",\"body\":\"\u003cp\u003eCheck \u003ccode\u003ethis\u003c/code\u003e first, as a shortcut.\u003c/p\u003e\\n\u003cp\u003eCheck the type with \u003ccode\u003einstanceof\u003c/code\u003e, then cast.\u003c/p\u003e\\n\u003cp\u003eCompare each significant field.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003eDouble.compare\u003c/code\u003e for \u003ccode\u003edouble\u003c/code\u003e fields.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"ej-common-methods/equals-contract/step-7\",\"prompt\":\"\u003cp\u003ePut the steps of a high-quality \u003ccode\u003eequals\u003c/code\u003e in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eif (!(o instanceof Point p)) return false;\u003c/code\u003e does the check and cast in one line with pattern matching.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Return true if the argument is \u003ccode\u003ethis\u003c/code\u003e (a cheap
