le.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-memory-model/publication-and-the-jmm/step-3\",\"title\":\"Double-checked locking\",\"body\":\"\u003cp\u003eIt checks without a lock, then again with one.\u003c/p\u003e\\n\u003cp\u003eThe first check can see a half-built object.\u003c/p\u003e\\n\u003cp\u003eIt\u0026#39;s broken unless the field is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003evolatile\u003c/code\u003e\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-memory-model/publication-and-the-jmm/step-4\",\"prompt\":\"\u003cp\u003eHow do you fix this \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Double-checked locking\\\" data-def=\\\"Checking a lazily initialized field without a lock, then again with the lock. Broken unless the field is \u0026lt;code\u0026gt;volatile\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edouble-checked locking\u003c/button\u003e under the Java 5 \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Java Memory Model\\\" data-def=\\\"The rules saying when a write by one thread is guaranteed to be visible to another, built on the happens-before relation.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ememory model\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIt works — but the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lazy initialization holder class\\\" data-def=\\\"Putting a lazily in
