\":{\"id\":\"resolution-rules\",\"courseId\":\"mja-default-methods-and-modules\",\"topicId\":\"modern-java\",\"key\":\"mja-default-methods-and-modules/resolution-rules\",\"title\":\"When defaults clash\",\"summary\":\"Classes win over interfaces, more specific interfaces win over less specific ones, and otherwise you must choose explicitly.\",\"duration\":5,\"tags\":[\"java\",\"modern java\",\"default methods\",\"diamond problem\",\"inheritance\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§13.4, Resolution rules\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"mja-default-methods-and-modules/resolution-rules/step-1\",\"mja-default-methods-and-modules/resolution-rules/step-2\",\"mja-default-methods-and-modules/resolution-rules/step-3\",\"mja-default-methods-and-modules/resolution-rules/step-4\",\"mja-default-methods-and-modules/resolution-rules/step-5\",\"mja-default-methods-and-modules/resolution-rules/step-6\"],\"exercises\":[\"mja-default-methods-and-modules/resolution-rules/step-2\",\"mja-default-methods-and-modules/resolution-rules/step-3\",\"mja-default-methods-and-modules/resolution-rules/step-5\",\"mja-default-methods-and-modules/resolution-rules/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"mja-default-methods-and-modules/resolution-rules/step-1\",\"title\":\"Three rules\",\"body\":\"\u003cp\u003eFirst, a method in a class or superclass beats any default.\u003c/p\u003e\\n\u003cp\u003eSecond, a default in a more specific interface wins, so \u003ccode\u003eB extends A\u003c/code\u003e beats \u003ccode\u003eA\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOtherwise, the class must override and choose.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"mja-default-methods-and-modules/resolution-rules/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003enew C().hello()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eC\
