{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jperf-threads/thread-pool-sizing/step-2\",\"title\":\"Work that waits\",\"body\":\"\u003cp\u003eThreads waiting on I/O don\u0026#39;t use the CPU.\u003c/p\u003e\\n\u003cp\u003eSo more threads than cores can keep the cores busy.\u003c/p\u003e\\n\u003cp\u003eBut only until the thing they wait on, like the database, is saturated.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jperf-threads/thread-pool-sizing/step-3\",\"prompt\":\"\u003cp\u003eEvery request queries a database that can handle 20 queries at once. The service has 200 threads. What happens under heavy load?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"180 threads wait on the database; adding more only adds contention\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Throughput is ten times higher than with 20 threads\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe database is the bottleneck, so throughput can\u0026#39;t exceed what it handles.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Throughput\\\" data-def=\\\"How much work gets done per unit of time.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThroughput\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jperf-threads/thread-pool-sizing/step-4\",\"title\":\"Queues and limits\",\"body\":\"\u003cp\u003e\u003ccode\u003eThreadPoolExecutor\u003c/code\u003e has a core size, a maximum and a queue.\u003c/p\u003e\\n\u003cp\u003eExtra threads start only when the queue is full.\u003c/p\u003e\\n\u003cp\u003eAn unbounded queue means the maximum is never reached.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jperf-threads/thread-pool-sizing/step-5\",\"prompt\":\"\u003cp\u003eA pool has core size 4, maximum 16, and an unbounded \u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e. How many threads does it ever run?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eThreadPoolExecutor\u003c/code\u003e starts threads up to the core size, queues further tasks, and adds threads beyond the core only when the queue rejects a task.\u003c/p\u003e\\n\u003cp\u003eAn unbounded \u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e never rejects anything, so the pool stays at 4 threads however many tasks pile up.\u003c/p\u003e\\n\u003cp\u003eTo grow to 16, use a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ebounded queue\u003c/button\u003e — or simply set the core size to the number of threads you want.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"4\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"16\",\"correct\":false,\"feedback\":\"\u003cp\u003eThreads beyond the core size are added only when the queue is full — and an unbounded queue never is.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"jperf-threads/thread-pool-sizing/step-6\",\"prompt\":\"\u003cp\u003eGet the number of cores at run time.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"int cores = Runtime.getRuntime().\"},{\"answers\":[\"availableProcessors\"],\"size\":19,\"choices\":[\"Xlog\",\"PrintCompilation\",\"availableProcessors\",\"JFR.start\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Threading and synchronization performance\",\"next\":{\"id\":\"synchronization-costs\",\"courseId\":\"jperf-threads\",\"topicId\":\"java-performance\",\"key\":\"jperf-threads/synchronization-costs\",\"title\":\"The cost of synchronization\",\"summary\":\"An uncontended lock is cheap; contention is what's expensive. And threads writing to neighbouring fields can slow each other down without sharing anything.\",\"duration\":6,\"tags\":[\"java\",\"performance\",\"synchronization\",\"contention\",\"false sharing\",\"cas\"],\"sources\":[{\"book\":\"java-performance\",\"ref\":\"§9.3, Thread Synchronization\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jperf-threads/synchronization-costs/step-1\",\"jperf-threads/synchronization-costs/step-2\",\"jperf-threads/synchronization-costs/step-3\",\"jperf-threads/synchronization-costs/step-4\",\"jperf-threads/synchronization-costs/step-5\",\"jperf-threads/synchronization-costs/step-6\"],\"exercises\":[\"jperf-threads/synchronization-costs/step-3\",\"jperf-threads/synchronization-costs/step-5\",\"jperf-threads/synchronization-costs/step-6\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"}
