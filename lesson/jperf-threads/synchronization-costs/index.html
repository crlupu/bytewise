on\",\"false sharing\",\"cas\"],\"sources\":[{\"book\":\"java-performance\",\"ref\":\"§9.3, Thread Synchronization\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jperf-threads/synchronization-costs/step-1\",\"jperf-threads/synchronization-costs/step-2\",\"jperf-threads/synchronization-costs/step-3\",\"jperf-threads/synchronization-costs/step-4\",\"jperf-threads/synchronization-costs/step-5\",\"jperf-threads/synchronization-costs/step-6\"],\"exercises\":[\"jperf-threads/synchronization-costs/step-3\",\"jperf-threads/synchronization-costs/step-5\",\"jperf-threads/synchronization-costs/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jperf-threads/synchronization-costs/step-1\",\"title\":\"Uncontended locks are cheap\",\"body\":\"\u003cp\u003eTaking a lock no one else wants costs a few nanoseconds.\u003c/p\u003e\\n\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e can even remove locks that can\u0026#39;t be contended.\u003c/p\u003e\\n\u003cp\u003eThe cost comes when threads wait for each other.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jperf-threads/synchronization-costs/step-2\",\"title\":\"Contention serializes work\",\"body\":\"\u003cp\u003eUnder \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtention\u003c/button\u003e, threads queue for the lock and the OS may park them.\u003c/p\u003e\\n\u003cp\u003eWork inside the lock happens one thread at a time.\u003c/p\u003e\\n\u003cp\u003eShorten critical sections, split locks, or use CAS-based classes.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jperf-threads/synchronization-costs/step-3\",\"prompt\":\"\u003cp\u003eMany threads increment one shared counter. Which scales best?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eAtomicLong\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eBetter than a lock, but every thread still fights over one memory location.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eLongAdder\u003c/code\u003e, which spreads increments over several cells\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"A \u003ccode\u003esynchronized\u003c/code\u003e method\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery increment waits for the lock.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic variable\\\" data-def=\\\"\u0026amp;quot;Better volatiles\u0026amp;quot;: classes like \u0026lt;code\u0026gt;AtomicInteger\u0026lt;/code\u0026gt; with atomic compound operations such as \u0026lt;code\u0026gt;incrementAndGet\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;compareAndSet\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic variable\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"LongAdder\\\" data-def=\\\"A counter that spreads updates over several cells to avoid contention, and adds them up when read.\\\" data-book=\\\"Java Performance\\\"\u003eLongAdder\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jperf-threads/synchronization-costs/step-4\",\"title\":\"False sharing\",\"body\":\"\u003cp\u003eCPUs \u003cbutton type=\\\"button\\\" class=\\\
