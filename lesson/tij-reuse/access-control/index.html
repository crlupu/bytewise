:#24292E;--shiki-dark:#E1E4E8\"\u003e);\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e    print\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(orc);\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e  }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"access-control\",\"courseId\":\"tij-reuse\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-reuse/access-control\",\"title\":\"Access control\",\"summary\":\"UML marks each member's access: + public, # protected, ~ package-private, - private. Hide everything you can.\",\"duration\":5,\"tags\":[\"java\",\"thinking in java\",\"access control\",\"encapsulation\",\"packages\",\"uml\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 6, Access Control\"}],\"requires\":[],\"steps\":12,\"stepKeys\":[\"tij-reuse/access-control/step-1\",\"tij-reuse/access-control/step-2\",\"tij-reuse/access-control/step-3\",\"tij-reuse/access-control/step-4\",\"tij-reuse/access-control/step-5\",\"tij-reuse/access-control/tij-access-dinner\",\"tij-reuse/access-control/tij-access-chocolatechip\",\"tij-reuse/access-control/tij-access-chocolatechip2\",\"tij-reuse/access-control/tij-access-icecream\",\"tij-reuse/access-control/tij-access-lunch\",\"tij-reuse/access-control/tij-access-organizedbyaccess\",\"tij-reuse/access-control/tij-reusing-orc\"],\"exercises\":[\"tij-reuse/access-control/step-2\",\"tij-reuse/access-control/step-4\",\"tij-reuse/access-control/step-5\",\"tij-reuse/access-control/tij-access-dinner\",\"tij-reuse/access-control/tij-access-chocolatechip\",\"tij-reuse/access-control/tij-access-chocolatechip2\",\"tij-reuse/access-control/tij-access-icecream\",\"tij-reuse/access-control/tij-access-lunch\",\"tij-reuse/access-control/tij-access-organizedbyaccess\",\"tij-reuse/access-control/tij-reusing-orc\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-reuse/access-control/step-1\",\"title\":\"Four levels, four symbols\",\"body\":\"\u003cp\u003e\u003ccode\u003epublic\u003c/code\u003e (+) is visible everywhere.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eprotected\u003c/code\u003e (#) is visible in the package and to subclasses anywhere.\u003c/p\u003e\\n\u003cp\u003eNo modifier (~) means package only; \u003ccode\u003eprivate\u003c/code\u003e (-) means this class only.\u003c/p\u003e\\n\",\"diagram\":\"\u003cfigure class=\\\"diagram\\\"\u003e\u003csvg class=\\\"dg\\\" viewBox=\\\"-8 -8 165 158\\\" width=\\\"165\\\" style=\\\"width:100%;max-width:165px;min-width:107px;height:auto\\\" role=\\\"img\\\" aria-label=\\\"Diagram\\\"\u003e\u003cg class=\\\"dg-node dg-node--class\\\" data-node=\\\"Cookie\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"0\\\" y=\\\"0\\\" width=\\\"149\\\" height=\\\"142\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"74.5\\\" y=\\\"21\\\" text-anchor=\\\"middle\\\"\u003eCookie\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M0 32 H149\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"50\\\"\u003e- recipe: String\u003c/text\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"68\\\"\u003e~ batch: int\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M0 78 H149\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"96\\\"\u003e+ Cookie()\u003c/text\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"114\\\"\u003e+ eat(): void\u003c/text\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"132\\\"\u003e# bite(): void\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003c/figure\u003e\"},{\"id\":\"step-2\",\"key\":\"tij-reuse/access-control/step-2\",\"prompt\":\"\u003cp\u003eMatch each modifier with who can use the member.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003epublic\u003c/code\u003e\",\"\u003ccode\u003eprotected\u003c/code\u003e\",\"(none)\",\"\u003ccode\u003eprivate\u003c/code\u003e\"],\"right\":[\"Any class, in any package\",\"Same package, plus subclasses in other packages\",\"Classes in the same package only\",\"Only the class itself\"],\"rightOrder\":[2,3,1,0]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-reuse/access-control/step-3\",\"title\":\"Hide the implementation\",\"body\":\"\u003cp\u003eEverything a client can reach becomes a promise you must keep.\u003c/p\u003e\\n\u003cp\u003eKeep fields private and expose behaviour through methods.\u003c/p\u003e\\n\u003cp\u003eThen you can change the inside without breaking anyone.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"tij-reuse/access-control/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eChocolateChip extends Cookie\u003c/code\u003e and lives in another package. Which \u003ccode\u003eCookie\u003c/code\u003e members can its methods use?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$13\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003erecipe\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003ePrivate members are visible only inside \u003ccode\u003eCookie\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ebite()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ebatch\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003ePackage access doesn\u0026#39;t reach other packages, even for subclasses.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eeat()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"id\":\"step-5\",\"key\":\"tij-reuse/access-control/step-5\",\"prompt\":\"\u003cp\u003eA class needs a helper method that only it uses. What access should it have?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003epublic\u003c/code\u003e, in case others need it\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery public method is a commitment. You can always widen access later; narrowing it breaks clients.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eprivate\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-access-dinner\",\"key\":\"tij-reuse/access-control/tij-access-dinner\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eCookie\u003c/code\u003e (shown below the program) is in another package. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe constructor and class are public.\u003c/p\u003e\\n\"},{\"html\":\"Cookie constructor\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eCookie constructor\\nbite\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003ex.bite()\u003c/code\u003e line is commented out with \u003ccode\u003e//!\u003c/code\u003e — \u003ccode\u003ebite\u003c/code\u003e has package access, so it wouldn\u0026#39;t compile.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-access-chocolatechip\",\"key\":\"tij-reuse/access-control/tij-access-chocolatechip\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eChocolateChip\u003c/code\u003e extends \u003ccode\u003eCookie\u003c/code\u003e (shown below) from another package. Why can\u0026#39;t \u003ccode\u003echomp()\u003c/code\u003e call \u003ccode\u003ebite()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIt prints \u003ccode\u003eCookie constructor\u003c/code\u003e then \u003ccode\u003eChocolateChip constructor\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"\u003ccode\u003ebite\u003c/code\u003e is private\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt has no modifier: package access.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ebite\u003c/code\u003e has package access, and a subclass in another package doesn\u0026#39;t get package access\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Subclasses can never call inherited methods directly\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can call public and protected ones.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-access-chocolatechip2\",\"key\":\"tij-reuse/access-control/tij-access-chocolatechip2\",\"prompt\":\"\u003cp\u003eThis \u003ccode\u003eCookie\u003c/code\u003e (shown below) is in another package, and \u003ccode\u003ebite\u003c/code\u003e is \u003ccode\u003eprotected\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eChocolateChip2 constructor\\nCookie constructor\\nbite\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe base-class constructor runs first.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eCookie constructor\\nChocolateChip2 constructor\\nbite\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eprotected\u003c/code\u003e gives subclasses access, even in other packages.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-access-icecream\",\"key\":\"tij-reuse/access-control/tij-access-icecream\",\"prompt\":\"\u003cp\u003eWhy does \u003ccode\u003emain\u003c/code\u003e call \u003ccode\u003eSundae.makeASundae()\u003c/code\u003e instead of \u003ccode\u003enew Sundae()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"The constructor is private; only code inside \u003ccode\u003eSundae\u003c/code\u003e can call it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Static factories are required for package-access classes\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe private constructor is the reason.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003enew Sundae()\u003c/code\u003e would work too; it\u0026#39;s a style choice\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003e//!\u003c/code\u003e line wouldn\u0026#39;t compile.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003eStatic factory method\u003c/button\u003e\"]},{\"id\":\"tij-access-lunch\",\"key\":\"tij-reuse/access-control/tij-access-lunch\",\"prompt\":\"\u003cp\u003eHow many \u003ccode\u003eSoup2\u003c/code\u003e objects can ever exist?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003eSingleton\u003c/button\u003e pattern.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"None — a private constructor can\u0026#39;t be called\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s called once, inside the class, to initialize \u003ccode\u003eps1\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"One — the constructor is private and \u003ccode\u003eaccess()\u003c/code\u003e always returns the same static instance\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"One per call to \u003ccode\u003eaccess()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eaccess\u003c/code\u003e returns the existing \u003ccode\u003eps1\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-access-organizedbyaccess\",\"key\":\"tij-reuse/access-control/tij-access-organizedbyaccess\",\"prompt\":\"\u003cp\u003eWhich members can code in another class call?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefin
