se of objects in the right order.\",\"duration\":8,\"tags\":[\"java\",\"final\",\"blank final\",\"private methods\",\"cleanup\",\"dispose\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 7, The final keyword; Guaranteeing proper cleanup\"}],\"requires\":[],\"steps\":8,\"stepKeys\":[\"tij-reuse/final-and-cleanup/step-1\",\"tij-reuse/final-and-cleanup/step-2\",\"tij-reuse/final-and-cleanup/tij-reusing-cadsystem\",\"tij-reuse/final-and-cleanup/tij-reusing-finaldata\",\"tij-reuse/final-and-cleanup/tij-reusing-blankfinal\",\"tij-reuse/final-and-cleanup/tij-reusing-finalarguments\",\"tij-reuse/final-and-cleanup/tij-reusing-finaloverridingillusion\",\"tij-reuse/final-and-cleanup/tij-reusing-jurassic\"],\"exercises\":[\"tij-reuse/final-and-cleanup/tij-reusing-cadsystem\",\"tij-reuse/final-and-cleanup/tij-reusing-finaldata\",\"tij-reuse/final-and-cleanup/tij-reusing-blankfinal\",\"tij-reuse/final-and-cleanup/tij-reusing-finalarguments\",\"tij-reuse/final-and-cleanup/tij-reusing-finaloverridingillusion\",\"tij-reuse/final-and-cleanup/tij-reusing-jurassic\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-reuse/final-and-cleanup/step-1\",\"title\":\"final\",\"body\":\"\u003cp\u003eA \u003ccode\u003efinal\u003c/code\u003e field can be assigned only once — at its declaration or in every constructor (a blank final).\u003c/p\u003e\\n\u003cp\u003eFor a reference, only the reference is fixed; the object it points to can still change.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003efinal\u003c/code\u003e class can\u0026#39;t be extended, and a \u003ccode\u003efinal\u003c/code\u003e method can\u0026#39;t be overridden.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-reuse/final-and-cleanup/step-2\",\"title\":\"private methods aren't overridden\",\"body\":\"\u003cp\u003eA \u003ccode\u003eprivate\u003c/code\u003e method is invisible to subclasses, so it\u0026#39;s implicitly \u003ccode\u003efinal\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA subclass method with the same name is a brand-new method, not an override.\u003c/p\u003e\\n\u003cp\u003eFor cleanup, write your own \u003ccode\u003edispose()\u003c/code\u003e and call it in \u003ccode\u003efinally\u003c/code\u003e, in the reverse order of creation.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-reusing-cadsystem\",\"key\":\"tij-reuse/final-and-cleanup/tij-reusing-cadsystem\",\"prompt\":\"\u003cp\u003eWhat are the first five lines printed by \u003ccode\u003edispose()\u003c/code\u003e? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eCADSystem.dispose()\\nErasing Triangle\\nShape dispose\\nErasing Circle\\nShape dispose\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eCADSystem.dispose()\\nErasing Line: 0, 0\\nShape dispose\\nErasing Line: 1, 1\\nShape dispose\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eCleanup runs in the reverse order of creation: the triangle was created last.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eCADSystem.dispose()\\nShape dispose\\nErasing Triangle\\nShape dispose\\nErasing Circle\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach \u003ccode\u
