archy down.\",\"duration\":6,\"tags\":[\"java\",\"thinking in java\",\"inheritance\",\"constructors\",\"super\",\"initialization order\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 7, Reusing Classes — Inheritance syntax and initializing the base class\"}],\"requires\":[],\"steps\":13,\"stepKeys\":[\"tij-reuse/inheritance-and-construction/step-1\",\"tij-reuse/inheritance-and-construction/step-2\",\"tij-reuse/inheritance-and-construction/step-3\",\"tij-reuse/inheritance-and-construction/step-4\",\"tij-reuse/inheritance-and-construction/step-5\",\"tij-reuse/inheritance-and-construction/step-6\",\"tij-reuse/inheritance-and-construction/tij-reusing-cartoon\",\"tij-reuse/inheritance-and-construction/tij-reusing-chess\",\"tij-reuse/inheritance-and-construction/tij-reusing-detergent\",\"tij-reuse/inheritance-and-construction/tij-reusing-beetle\",\"tij-reuse/inheritance-and-construction/tij-reusing-placesetting\",\"tij-reuse/inheritance-and-construction/tij-reusing-hide\",\"tij-reuse/inheritance-and-construction/tij-reusing-lisa\"],\"exercises\":[\"tij-reuse/inheritance-and-construction/step-3\",\"tij-reuse/inheritance-and-construction/step-5\",\"tij-reuse/inheritance-and-construction/step-6\",\"tij-reuse/inheritance-and-construction/tij-reusing-cartoon\",\"tij-reuse/inheritance-and-construction/tij-reusing-chess\",\"tij-reuse/inheritance-and-construction/tij-reusing-detergent\",\"tij-reuse/inheritance-and-construction/tij-reusing-beetle\",\"tij-reuse/inheritance-and-construction/tij-reusing-placesetting\",\"tij-reuse/inheritance-and-construction/tij-reusing-hide\",\"tij-reuse/inheritance-and-construction/tij-reusing-lisa\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-reuse/inheritance-and-construction/step-1\",\"title\":\"Is-a\",\"body\":\"\u003cp\u003e\u003ccode\u003eCartoon extends Drawing\u003c/code\u003e, and \u003ccode\u003eDrawing extends Art\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eCartoon\u003c/code\u003e gets every member of \u003ccode\u003eDrawing\u003c/code\u003e and \u003ccode\u003eArt\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe hollow triangle in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"UML\\\" data-def=\\\"The Unified Modeling Language — the boxes-and-arrows notation for classes. A hollow triangle means inheritance, a dashed line implements, a diamond has-a.\\\" data-book=\\\"Thinking in Java\\\"\u003eUML\u003c/button\u003e points to the base class.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-reuse/inheritance-and-construction/step-2\",\"title\":\"The base part is built first\",\"body\":\"\u003cp\u003eEvery constructor first calls its base-class constructor, with \u003ccode\u003esuper(...)\u003c/code\u003e or implicitly.\u003c/p\u003e\\n\u003cp\u003eSo construction starts at the root and works down.\u003c/p\u003e\\n\u003cp\u003eBy the time \u003ccode\u003eCartoon()\u003c/code\u003e runs, the \u003ccode\u003eArt\u003c/code\u003e and \u003ccode\u003eDrawing\u003c/code\u003e parts are ready.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"tij-reuse/inheritance-and-construction/step-3\",\"prompt\":\"\u003cp\u003eEach constructor prints its class name. What does \u003ccode\u003enew Cartoon()\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eCartoon\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe base constructors run too — implicitly, as \u003ccode\u003esuper()\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eCartoon Drawing Art\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach constructor calls its base constructor before its own body, so the root prints first.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eArt Drawing Cartoon\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tij-reuse/inheritance-and-construction/step-4\",\"title\":\"Members come next\",\"body\":\"\u003cp\u003eAfter the base constructor returns, the class\u0026#39;s own field initializers run.\u003c/p\u003e\\n\u003cp\u003eThen its constructor body.\u003c/p\u003e\\n\u003cp\u003eSo member objects are built after the base parts, before the body.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-reuse/inheritance-and-construction/step-5\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003enew Sandwich()\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA constructor first calls its base-class constructor, so the chain \u003ccode\u003eMeal\u003c/code\u003e, \u003ccode\u003eLunch\u003c/code\u003e runs before anything in \u003ccode\u003eSandwich\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThen \u003ccode\u003eSandwich\u003c/code\u003e\u0026#39;s field initializers run in the order they\u0026#39;re declared, creating \u003ccode\u003eBread\u003c/code\u003e and then \u003ccode\u003eCheese\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOnly then does the \u003ccode\u003eSandwich\u003c/code\u003e constructor body run and print its own name.\u003c/p\u003e\\n\u003cp\u003eSo the order is: base classes from the root down, then this class\u0026#39;s fields top to bottom, then this class\u0026#39;s constructor body.\u003c/p\u003e\\n\",\"diagram\":\"$15\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eMeal Lunch Bread Cheese Sandwich\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eBread Cheese Meal Lunch Sandwich\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe base constructors run first; field initializers come after \u003ccode\u003esuper()\u003c/code\u003e returns.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eMeal Lunch Sandwich Bread Cheese\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eField initializers run before the constructor body, not after it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-6\",\"key\":\"tij-reuse/inheritance-and-construction/step-6\",\"prompt\":\"\u003cp\u003eCall a base-class constructor that takes an argument.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Chess(int moves) { \"},{\"answers\":[\"super\"],\"size\":5,\"choices\":[\"valueOf\",\"entrySet\",\"super\",\"new\"]},{\"text\":\"(moves); }\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"tij-reusing-cartoon\",\"key\":\"tij-reuse/inheritance-and-construction/tij-reusing-cartoon\",\"prompt\":\"\u003cp\u003eWhat does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eArt constructor\\nDrawing constructor\\nCartoon constructor\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\"
