i-light:#6F42C1;--shiki-dark:#B392F0\"\u003eprintln\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(s.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003esubstring\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(start));\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"loops\",\"courseId\":\"jm-program-structure\",\"topicId\":\"java-mistakes\",\"key\":\"jm-program-structure/loops\",\"title\":\"Loops\",\"summary\":\"Off-by-one bounds, the wrong loop variable, the wrong direction, overflow, and bodies that do the same thing every time.\",\"duration\":5,\"tags\":[\"java\",\"mistakes\",\"loops\",\"off-by-one\"],\"sources\":[{\"book\":\"java-mistakes\",\"ref\":\"Chapter 3, Program structure\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 3, Program structure — a malformed for loop\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 3, Program structure — not using the loop variable\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 3, Program structure — wrong loop direction\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 3, Program structure — loop overflow\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 3, Program structure — an idempotent loop body\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jm-program-structure/loops/step-1\",\"jm-program-structure/loops/step-2\",\"jm-program-structure/loops/jm-018\",\"jm-program-structure/loops/jm-019\",\"jm-program-structure/loops/jm-020\",\"jm-program-structure/loops/jm-021\",\"jm-program-structure/loops/jm-022\"],\"exercises\":[\"jm-program-structure/loops/jm-018\",\"jm-program-structure/loops/jm-019\",\"jm-program-structure/loops/jm-020\",\"jm-program-structure/loops/jm-021\",\"jm-program-structure/loops/jm-022\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jm-program-structure/loops/step-1\",\"title\":\"Classic for-loop slips\",\"body\":\"\u003cp\u003e\u003ccode\u003e\u0026lt;=\u003c/code\u003e instead of \u003ccode\u003e\u0026lt;\u003c/code\u003e runs one step too many; an inner loop that increments the outer variable never ends or skips work.\u003c/p\u003e\\n\u003cp\u003eCounting down needs \u003ccode\u003ei--\u003c/code\u003e and \u003ccode\u003ei \u0026gt;= 0\u003c/code\u003e; copying the header of an upward loop gives a loop that never runs.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jm-program-structure/loops/step-2\",\"title\":\"Loops that don't progress\",\"body\":\"\u003cp\u003eA loop variable near \u003ccode\u003eInteger.MAX_VALUE\u003c/code\u003e overflows instead of ending.\u003c/p\u003e\\n\u003cp\u003eA body that doesn\u0026#39;t use the loop variable does the same work every time — usually a sign of a typo.\u003c/p\u003e\\n\u003cp\u003ePrefer for-each and streams, which have no index to get wrong.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-018\",\"key\":\"jm-program-structure/loops/jm-018\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003ei \u0026lt; xs.length\u003c/code\u003e, or a for-each loop that has no index at all.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 3, Program structure — a malformed for loop.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003eArrayIndexOutOfBoundsException: Index 4 out of bounds for length 4\u003c/code\u003e — \u003ccode\u003e\u0026lt;=\u003c/code\u003e runs one step too many\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It prints \u003ccode\u003e43\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe last iteration reads \u003ccode\u003exs[4]\u003c/code\u003e, which doesn\u0026#39;t exist.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"jm-019\",\"key\":\"jm-program-structure/loops/jm-019\",\"prompt\":\"\u003cp\u003ePrint a 3×3 multiplication table. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 3, Program structure — not using the loop variable.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e1 1 1\\n4 4 4\\n9 9 9\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e1 2 3\\n2 4 6\\n3 6 9\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe inner loop multiplies \u003ccode\u003ei * i\u003c/code\u003e and never uses \u003ccode\u003ej\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-020\",\"key\":\"jm-program-structure/loops/jm-020\",\"prompt\":\"\u003cp\u003ePrint the array backwards. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 3, Program structure — wrong loop direction.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Nothing: after \u003ccode\u003ec\u003c/code\u003e, \u003ccode\u003ei++\u003c/code\u003e moves to index 3 and the loop throws \u003ccode\u003eArrayIndexOutOfBoundsException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"[cba]\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe loop counts up, not down: \u003ccode\u003ei++\u003c/code\u003e should be \u003ccode\u003ei--\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"[c]\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt never reaches the \u003ccode\u003eprintln\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-021\",\"key\":\"jm-program-structure/loops/jm-021\",\"prompt\":\"\u003cp\u003eCount the multiples of 1,000,000 up to \u003ccode\u003eInteger.MAX_VALUE\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse a \u003ccode\u003elong\u003c/code\u003e counter, or write the bound so the step can\u0026#39;t overshoot (\u003ccode\u003ei \u0026lt; limit - step\u003c/code\u003e).\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 3, Program structure — loop overflow.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"Prints \u003ccode\u003e2148\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe loop doesn\u0026#39;t stop once \u003ccode\u003ei\u003c/code\u003e passes \u003ccode\u003eMAX_VALUE - 1\u003c/code\u003e; it wraps around.\u003c/p\u003e\\n\"},{\"html\":\"It never ends: \u003ccode\u003ei += 1_000_000\u003c/code\u003e jumps past the limit and overflows to a negative number, which is still \u003ccode\u003e\u0026lt;=\u003c/code\u003e the bound\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"jm-022\",\"key\":\"jm-program-structure/loops/jm-022\",\"prompt\":\"\u003cp\u003eRemove the leading zeros. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWrite \u003ccode\u003estart++\u003c/code\u003e in the body. A loop whose body has no effect on its condition never ends.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 3, Program structure — an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Idempotent\\\" data-def=\\\"Doing it twice has the same effect as doing it once — what makes retries safe.\\\"\u003eidempotent\u003c/button\u003e loop body.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"It loops forever: the body neither changes \u003ccode\u003estart\u003c/code\u003e nor uses the result of \u003ccode\u003esubstring\u003c/code\u003e, so every pass does exactly the same thing\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Prints \u003ccode\u003e123\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing in the loop changes the condition.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Program structure\",\"next\":{\"id\":\"initialization\",\"courseId\":\"jm-program-structure\",\"topicId\":\"java-mistakes\",\"key\":\"jm-program-structure/initialization\",\"title\":\"Classes and initialization\",\"summary\":\"Static initialization order, overridden methods that forget super, and fields that are accidentally static.\",\"duration\":5,\"tags\":[\"java\",\"mistakes\",\"initialization\",\"static\",\"inheritance\"],\"sources\":[{\"book\":\"java-mistakes\",\"ref\":
