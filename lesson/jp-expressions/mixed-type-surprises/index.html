e numbers stay negative. \u0026lt;code\u0026gt;(long) -1\u0026lt;/code\u0026gt; is all ones.\\\" data-book=\\\"Java Puzzlers\\\"\u003esign-extended\u003c/button\u003e to 16 bits on its way to \u003ccode\u003echar\u003c/code\u003e, so all 16 bits are set.\u003c/p\u003e\\n\"},{\"html\":\"65535\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jp-expressions/mixed-type-surprises/step-5\",\"title\":\"The conditional operator picks one type\",\"body\":\"\u003cp\u003e\u003ccode\u003econd ? a : b\u003c/code\u003e has a single type for both branches.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003echar\u003c/code\u003e and a constant \u003ccode\u003eint\u003c/code\u003e that fits gives \u003ccode\u003echar\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003echar\u003c/code\u003e and an \u003ccode\u003eint\u003c/code\u003e variable gives \u003ccode\u003eint\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jp-expressions/mixed-type-surprises/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGive both branches of a conditional the same type.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA conditional expression has one type for both branches.\u003c/p\u003e\\n\u003cp\u003eIn \u003ccode\u003etrue ? x : 0\u003c/code\u003e, one operand is \u003ccode\u003echar\u003c/code\u003e and the other a constant \u003ccode\u003eint\u003c/code\u003e that fits in a \u003ccode\u003echar\u003c/code\u003e, so the result type is \u003ccode\u003echar\u003c/code\u003e and prints \u003ccode\u003eX\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIn \u003ccode\u003efalse ? i : x\u003c/code\u003e, \u003ccode\u003ei\u003c/code\u003e is an \u003ccode\u003eint\u003c/code\u003e variable, not a constant, so the result is promoted to \u003ccode\u003eint\u003c/code\u003e, and \u003ccode\u003e\u0026#39;X\u0026#39;\u
