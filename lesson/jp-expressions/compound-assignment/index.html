ludes a cast\",\"body\":\"\u003cp\u003e\u003ccode\u003ex += i\u003c/code\u003e means \u003ccode\u003ex = (T) (x + i)\u003c/code\u003e, where \u003ccode\u003eT\u003c/code\u003e is the type of \u003ccode\u003ex\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIf \u003ccode\u003ex\u003c/code\u003e is a \u003ccode\u003eshort\u003c/code\u003e, the result is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Narrowing conversion\\\" data-def=\\\"Converting to a type with fewer bits, like \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; to \u0026lt;code\u0026gt;short\u0026lt;/code\u0026gt;. The high bits are thrown away, so the value can change completely.\\\" data-book=\\\"Java Puzzlers\\\"\u003enarrowed\u003c/button\u003e without a word.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ex = x + i\u003c/code\u003e would not compile.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-expressions/compound-assignment/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDon\u0026#39;t use \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compound assignment\\\" data-def=\\\"\u0026lt;code\u0026gt;+=\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;-=\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;*=\u0026lt;/code\u0026gt; and friends. \u0026lt;code\u0026gt;x += y\u0026lt;/code\u0026gt; means \u0026lt;code\u0026gt;x = (T) (x + y)\u0026lt;/code\u0026gt;, with a hidden cast to \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt;\u0026amp;#39;s type.\\\" data-book=\\\"Java Puzzlers\\\"\u003ecompound assignment\u003c/button\u003e on \u003ccode\u003ebyte\u003c/code\u003e, \u003ccode\u003eshort\u003c/code\u003e or \u003ccode\u003echar\u003c/code\u003e with a wider right-hand side.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ex += i\u003c/code\u003e is defined as \u003ccode\u003ex = (short) (x + i)\u003c/code\u003e: the sum 123,456 is computed as an \u003ccode\u003eint\u003c/code\u003e, then cast back to \u003ccode\u003eshort\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eshort\u003c/code\u003e holds only 16 bits, so the cast keeps the low 16 bits of 123,456 — 0x1E240 → 0xE240 — which, read as a signed 16-bit number, is -7,616.\u003c/p\u003e\\n\u003cp\u003eThe plain \u003ccode\u003ex = x + i\u003c/code\u003e would refuse to compile without an explicit cast, which is why compound assignment hides the bug.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"123456\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat doesn\u0026#39;t fit in a \u003ccode\u003eshort\u003c/code\u003e. The compound assignment casts the sum down to 16 bits.\u003c/p\u003e\\n\"},{\"html\":\"-7616\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ex = x + i\u003c/code\u003e wouldn\u0026#39;t. \u003ccode\u003ex += i\u003c/code\u003e compiles, because it includes a cast.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"jp-expressions/compound-assignment/step-3\",\"prompt\":\"\u003cp\u003eWhich line fails to compile?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003eshort\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e x \u003c/span\u003e\u003cspan style=
