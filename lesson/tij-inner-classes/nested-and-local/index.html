-inner-classes/nested-and-local/tij-innerclasses-classininterface\",\"tij-inner-classes/nested-and-local/tij-innerclasses-testbed\",\"tij-inner-classes/nested-and-local/tij-innerclasses-localinnerclass\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-inner-classes/nested-and-local/step-1\",\"title\":\"Static nested classes\",\"body\":\"\u003cp\u003eA \u003ccode\u003estatic\u003c/code\u003e nested class has no link to an outer object.\u003c/p\u003e\\n\u003cp\u003eYou create it without an outer instance, and it can\u0026#39;t touch the outer class\u0026#39;s instance fields.\u003c/p\u003e\\n\u003cp\u003eIt can hold static members of its own, and can even live inside an interface.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-inner-classes/nested-and-local/step-2\",\"title\":\"Local classes\",\"body\":\"\u003cp\u003eA class defined inside a method or a block exists only in that scope.\u003c/p\u003e\\n\u003cp\u003eIt can use the enclosing method\u0026#39;s effectively final locals.\u003c/p\u003e\\n\u003cp\u003eUnlike an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Anonymous class\\\" data-def=\\\"A class declared and instantiated in one expression, without a name. Mostly replaced by lambdas.\\\" data-book=\\\"Effective Java\\\"\u003eanonymous class\u003c/button\u003e, it has a name and can have constructors.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-innerclasses-parcel5\",\"key\":\"tij-inner-classes/nested-and-local/tij-innerclasses-parcel5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eDestination\u003c/code\u003e is an interface. Where can \u003ccode\u003ePDestination\u003c/code\u003e be used by name?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer it works because nothing needs one.\u003c/p\u003e\\n\"},{\"html\":\"It can\u0026#39;t — this doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles and runs, printing nothing.\u003c/p\u003e\\n\"},{\"html\":\"The nested classes are static, so they need no outer object, and the factory methods are static\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-innerclasses-classininterface\",\"key\":\"tij-inner-classes/nested-and-local/tij-innerclasses-classininterface\",\"prompt\":\"\u003cp\u003eRun with the nested class as the main class (\u003ccode\u003ejava ClassInInterface$Test\u003c/code\u003e), what happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"It prints \u003ccode\u003eHowdy!\u003c/code\u003e — a class inside an interface is implicitly public and static\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It can\u0026#39;t be run — the interface has no \u003ccode\u003emain\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe nested class has its own \u003ccode\u003emain\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile — interfaces can\u0026#39;t contain classes\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can; the class is implicitly \u003ccode\u003estatic\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-innerclasses-testbed\",\"key\":\"tij-inner-classes/nested-and-local/tij-inn
