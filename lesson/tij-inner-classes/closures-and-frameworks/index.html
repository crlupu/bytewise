ed methods alongside abstract ones.\\\" data-book=\\\"Thinking in Java\\\"\u003eabstract class\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-inner-classes/closures-and-frameworks/step-2\",\"title\":\"Inner classes and inheritance\",\"body\":\"\u003cp\u003eAn \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003einner class\u003c/button\u003e isn\u0026#39;t overridden like a method: same-named inner classes in base and subclass are separate classes.\u003c/p\u003e\\n\u003cp\u003eTo extend an inner class from outside, the constructor must call \u003ccode\u003eouter.super()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIn a control framework, each event is an inner class that can change the outer system\u0026#39;s state.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-innerclasses-callbacks\",\"key\":\"tij-inner-classes/closures-and-frameworks/tij-innerclasses-callbacks\",\"prompt\":\"\u003cp\u003eWhat does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\" currentModificationException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-innerclasses-greenhousecontrols\",\"key\":\"tij-inner-classes/closures-and-frameworks/tij-innerclasses-greenhousecontrols\",\"prompt\":\"\u003cp\u003eHow does \u003ccode\u003eLightOn.action()\u003c/code\u003e change the greenhouse\u0026#39;s \u003ccode\u003elight\u003c/code\u003e field?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBell\u003c/code\u003e re-adds itself in \u003ccode\u003eaction()\u003c/code\u003e, and \u003ccode\u003eRestart\u003c/code\u003e re-adds every event and itself — so the system runs forever unless a \u003ccode\u003eTerminate\u003c/code\u003e event calls \u003ccode\u003eSystem.exit\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"It can\u0026#39;t — \u003ccode\u003elight\u003c/code\u003e is private\",\"correct\":false,\"feedback\":\"\u003cp\u003ePrivate members are visible to inner classes.\u003c/p\u003e\\n\"},{\"html\":\"Through a setter in \u003ccode\u003eController\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s no setter; inner classes access outer fields directly.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eLightOn\u003c/code\u003e is an inner class, so it can set the outer object\u0026#39;s private \u003ccode\u003elight\u003c/code\u003e directly\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":
