\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003einner class\u003c/button\u003e \u003ccode\u003eSequenceSelector\u003c/code\u003e walks through them.\u003c/p\u003e\\n\u003cp\u003eThe selector reads \u003ccode\u003eitems\u003c/code\u003e directly, as if it were its own field.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-inner-classes/inner-objects/step-2\",\"title\":\"The hidden reference\",\"body\":\"\u003cp\u003eEach selector stores a secret reference to the \u003ccode\u003eSequence\u003c/code\u003e that made it.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s how it reaches \u003ccode\u003eitems\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIn code you can name it \u003ccode\u003eSequence.this\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-3\",\"key\":\"tij-inner-classes/inner-objects/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eSequenceSelector\u003c/code\u003e is an inner (non-static) class of \u003ccode\u003eSequence\u003c/code\u003e, and \u003ccode\u003eseq\u003c/code\u003e is a \u003ccode\u003eSequence\u003c/code\u003e. How do you create a \u003ccode\u003eSequenceSelector\u003c/code\u003e from outside \u003ccode\u003eSequence\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eSequence.SequenceSelector sel = seq.new SequenceSelector();\u003c/code\u003e — through an outer object\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003enew Sequence.SequenceSelector()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn inner object needs an outer object to link to, so there\u0026#39;s nothing to attach it to here.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tij-inner-classes/inner-objects/step-4\",\"title\":\"Static nested classes have no link\",\"body\":\"\u003cp\u003eMark the nested class \u003ccode\u003estatic\u003c/code\u003e, and the hidden reference disappears.\u003c/p\u003e\\n\u003cp\u003eIt can\u0026#39;t touch the outer object\u0026#39;s instance fields.\u003c/p\u003e\\n\u003cp\u003eIt\u0026#39;s created on its own: \u003ccode\u003enew Outer.Nested()\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-inner-classes/inner-objects/step-5\",\"prompt\":\"\u003cp\u003eMatch each kind of nested class with what it can reach.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Inner class\",\"Static nested class\",\"Local class in a method\"],\"right\":[\"The outer object\u0026#39;s fields, through \u003ccode\u003eOuter.this\u003c/code\u003e\",\"Only static members of the outer class\",\"Outer fields, plus effectively final locals of the method\"],\"rightOrder\":[1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003eInner class\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static member class\\\" data-def=\\\"A nested class declared \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt; — an ordinary class that happens to live inside another. Doesn\u0026amp;#39;t hold a reference to an outer instance.\\\" data-book=\\\"Effective Java\\\"\u003eStatic member class\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"tij-inner-classes/inner-objects/step-6\",\"prompt\":\"\u003cp\u003eA long-lived \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e holds inner-class objects. Their outer objects are otherwise unused. What happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eEvery non-static inner object holds a hidden reference to the outer object that created it.\u003c/p\u003e\\n\u003cp\u003eWhile the cache keeps the inner objects reachable, that hidden reference keeps each outer object reachable too, along with everything it holds.\u003c/p\u003e\\n\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003egarbage collector\u003c/button\u003e only frees unreachable objects, so the memory stays in use for as long as the cache does.\u003c/p\u003e\\n\u003cp\u003eIf a nested class doesn\u0026#39;t need the outer object, make it \u003ccode\u003estatic\u003c/code\u003e, so it carries no hidden reference.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The outer objects are collected; inner objects survive on their own\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe hidden reference counts like any other.\u003c/p\u003e\\n\"},{\"html\":\"The outer objects can\u0026#39;t be garbage collected — each inner object\u0026#39;s hidden reference keeps them alive\",\"correct\":true,\"feedback\":
