ach group\u0026#39;s list with its size, as a \u003ccode\u003eLong\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe result is a \u003ccode\u003eMap\u0026lt;Character, Long\u0026gt;\u003c/code\u003e. Its iteration order isn\u0026#39;t guaranteed — pass a \u003ccode\u003eTreeMap::new\u003c/code\u003e map factory if you need sorted keys.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e{a=[apple, avocado], b=[banana], c=[cherry]}\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s plain \u003ccode\u003egroupingBy\u003c/code\u003e. With \u003ccode\u003ecounting()\u003c/code\u003e, each group becomes its size.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e4\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe result is a map from first letter to count.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e{a=2, b=1, c=1}\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"mja-collectors/grouping-and-partitioning/step-5\",\"title\":\"partitioningBy splits in two\",\"body\":\"\u003cp\u003e\u003ccode\u003epartitioningBy\u003c/code\u003e takes a predicate.\u003c/p\u003e\\n\u003cp\u003eIt always returns a map with both \u003ccode\u003etrue\u003c/code\u003e and \u003ccode\u003efalse\u003c/code\u003e keys.\u003c/p\u003e\\n\u003cp\u003eEven an empty side is present.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"mja-collectors/grouping-and-partitioning/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003epartitioningBy\u003c/code\u003e always produces a map with exactly two keys, \u003ccode\u003efalse\u003c/code\u003e and \u003ccode\u003etrue\u003c/code\u003e, even if one side is empty.\u003c/p\u003e\\n\u003cp\u003eEach element goes to the key the predicate returns: odd numbers to \u003ccode\u003efalse\u003c/code\u003e, even numbers to \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIt\u0026#39;s like \u003ccode\u003egroupingBy\u003c/code\u003e with a boolean classifier, but guarantees both keys exist, so you never need to handle a missing group.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e{false=[1, 3, 5], true=[2, 4]}\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e[2, 4]\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s \u003ccode\u003efilter\u003c/code\u003e. Partitioning keeps both sides.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-7\",\"key\":\"mja-collectors/grouping-and-partitioning/step-7\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Collector\\\" data-def=\\\"A recipe for gathering stream elements into a result — \u0026lt;code\u0026gt;toList()\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;toMap(...)\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;groupingBy(...)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003ecollector\u003c/button\u003e with what you get per group.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003egroupingBy(f)\u003c/code\u003e\",\"\u003ccode\u003egroupingBy(f, counting())\u003c/code\u003e\",\"\u003ccode\u003egroupingBy(f, mapping(g, toSet()))\u003c/code\u003e\",\"\u003ccode\u003egroupingBy(f, maxBy(cmp))\u003c/code\u003e\"],\"right\":[\"A list of the elements\",\"How many there are\",\"A se
