bet the profile will stay true.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jperf-jit/deoptimization-and-code-cache/step-2\",\"title\":\"When the bet fails\",\"body\":\"\u003cp\u003eA new class shows up at that call site.\u003c/p\u003e\\n\u003cp\u003eThe compiled code is marked \u0026quot;not entrant\u0026quot; and new calls go back to the interpreter.\u003c/p\u003e\\n\u003cp\u003eLater the method is recompiled with the new profile.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jperf-jit/deoptimization-and-code-cache/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePrintCompilation\u003c/code\u003e shows a method \u0026quot;made not entrant\u0026quot; after a new plugin is loaded. What happened?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"C2\\\" data-def=\\\"The JVM\u0026amp;#39;s optimizing \u0026amp;quot;server\u0026amp;quot; JIT compiler, which uses the run-time profile for aggressive optimization.\\\" data-book=\\\"Java Performance\\\"\u003eC2\u003c/button\u003e optimizes based on what it has seen. If a call site has only ever met one implementation of an interface, it calls that implementation directly and may inline it.\u003c/p\u003e\\n\u003cp\u003eWhen a plugin loads a second implementation, that assumption is no longer true, so the JVM marks the compiled method \u0026quot;not entrant\u0026quot;: new calls go back to the interpreter.\u003c/p\u003e\\n\u003cp\u003eAfter gathering a fresh profile, it recompiles with a type check for both implementations.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The method threw an exception\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeoptimization is about broken compile-time assumptions, not exceptions.\u003c/p\u003e\\n\"},{\"html\":\"The plugin added a new implementation at a call site the JIT had assumed had only one, so it deoptimized\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deoptimization\\\" data-def=\\\"Throwing away compiled code whose assumptions no longer hold, falling back to the interpreter until it\u0026amp;#39;s recompiled.\\\" data-book=\\\"Java Performance\\\"\u003eDeoptimization\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jperf-jit/deoptimization-and-code-cache/step-4\",\"prompt\":\"\u003cp\u003eMatch each call site with how \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"C2\\\" data-def=\\\"The JVM\u0026amp;#39;s optimizing \u0026amp;quot;server\u0026amp;quot; JIT compiler, which uses the run-time profile for aggressive optimization.\\\" data-book=\\\"Java Performance\\\"\u003eC2\u003c/button\u003e can handle it.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Monomorphic — one class seen\",\"Bimorphic — two classes seen\",\"Megamorphic — many classes seen\"],\"right\":[\"Direct call, often inlined\",\"A type check, then two inlined paths\",\"A virtual call through the method table\"],\"rightOrder\":[1,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Megamorphic\\\" data-def=\\\"How many classes a call site has seen — one (monomorphic), two (bimorphic) or many (megamorphic). Fewer means more opti
