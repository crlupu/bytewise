\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-methods/overloading/step-2\",\"prompt\":\"\u003cp\u003eWhat does it print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003ec\u003c/code\u003e is declared as \u003ccode\u003eCollection\u0026lt;?\u0026gt;\u003c/code\u003e, so the compiler picks \u003ccode\u003eclassify(Collection\u0026lt;?\u0026gt;)\u003c/code\u003e every time.\u003c/p\u003e\\n\",\"details\":\"$14\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eSet\u003c/code\u003e, \u003ccode\u003eList\u003c/code\u003e, \u003ccode\u003eUnknown Collection\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what the author hoped. But which overload runs is decided by the \u003cem\u003ecompile-time\u003c/em\u003e type of \u003ccode\u003ec\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eUnknown Collection\u003c/code\u003e, three times\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-methods/overloading/step-3\",\"title\":\"Chosen at compile time\",\"body\":\"\u003cp\u003eOverloads are picked from the declared types.\u003c/p\u003e\\n\u003cp\u003eOverrides are picked from the actual object.\u003c/p\u003e\\n\u003cp\u003eSo \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overloading\\\" data-def=\\\"Several methods with the same name but different parameter types. Which one runs is decided at compile time from the static types.\\\" data-book=\\\"Effective Java\\\"\u003eoverloading\u003c/button\u003e can surprise you.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-methods/overloading/step-4\",\"prompt\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overloading\\\" data-def=\\\"Several methods with the same name but different parameter types. Which one runs is decided at compile time from the static types.\\\" data-book=\\\"Effective Java\\\"\u003eOverloading\u003c/button\u003e or \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overriding\\\" data-def=\\\"A subclass redefining an inherited method. Which one runs is decided at run time from the object\u0026amp;#39;s actual class.\\\" data-book=\\\"Effective Java\\\"\u003eoverriding\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Which method runs is chosen at compile time, from the declared types of the arguments\",\"Which method runs is chosen at run time, from the actual class of the object\"],\"right\":[\"Overloading\",\"Overriding\"],\"rightOrder\":[1,0]},{\"id\":\"step-5\",\"key\":\"ej-methods/overloading/step-5\",\"prompt\":\"\u003cp\u003eWhat do the set and the list contain afterwards?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFix it with \u003ccode\u003elist.remove((Integer) i)\u003c/code\u003e — and the confusion came from \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Autoboxing\\\" data-def=\\\"The compiler converting automatically between primitives and their boxed types — \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; ↔ \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eautoboxing\u003c/button\u003e plus an overload.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eSet\u003c/code\u003e has only \u003ccode\u003eremove(Object)\u003c/code\u003e, so \u003ccode\u003ei\u003c/code\u003e is boxed and the set removes the values 0, 1 and 2, leaving \u003ccode\u003e[-3, -2, -1]\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eList\u003c/code\u003e has
