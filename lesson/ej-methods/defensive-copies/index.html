urseId\":\"ej-methods\",\"topicId\":\"effective-java\",\"key\":\"ej-methods/defensive-copies\",\"title\":\"Make defensive copies\",\"summary\":\"Assume clients will try to break your invariants — copy mutable inputs and outputs.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"defensive copy\",\"immutability\",\"security\",\"date\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 50\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"ej-methods/defensive-copies/step-1\",\"ej-methods/defensive-copies/step-2\",\"ej-methods/defensive-copies/step-3\",\"ej-methods/defensive-copies/step-4\",\"ej-methods/defensive-copies/step-5\",\"ej-methods/defensive-copies/step-6\",\"ej-methods/defensive-copies/step-7\"],\"exercises\":[\"ej-methods/defensive-copies/step-2\",\"ej-methods/defensive-copies/step-4\",\"ej-methods/defensive-copies/step-5\",\"ej-methods/defensive-copies/step-6\",\"ej-methods/defensive-copies/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-methods/defensive-copies/step-1\",\"title\":\"Callers can change your objects\",\"body\":\"\u003cp\u003eA caller may keep a reference to a mutable object it passed in.\u003c/p\u003e\\n\u003cp\u003eLater, it can change your internal state through it.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"ej-methods/defensive-copies/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e stores the two \u003ccode\u003eDate\u003c/code\u003es it was given in \u003ccode\u003eprivate final\u003c/code\u003e fields and checks \u003ccode\u003estart\u003c/code\u003e is before \u003ccode\u003eend\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe caller changed the period\u0026#39;s internals — and now \u003ccode\u003eend\u003c/code\u003e isn\u0026#39;t after \u003ccode\u003estart\u003c/code\u003e, breaking the invariant.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e\u003ccode\u003efinal\u003c/code\u003e stops the field pointing elsewhere. Does it stop the \u003ccode\u003eDate\u003c/code\u003e itself changing?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1000\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e kept a reference to the caller\u0026#39;s \u003ccode\u003eDate\u003c/code\u003e — and \u003ccode\u003eDate\u003c/code\u003e is mutable.\u003c/p\u003e\\n\"},{\"html\":\"0\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws \u003ccode\u003eIllegalArgumentException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe constructor checked the dates before the caller changed one — nothing checks again.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-methods/defensive-copies/step-3\",\"title\":\"Copy in, copy out\",\"body\":\"\u003cp\u003eCopy mutable parameters before checking them.\u003c/p\u003e\\n\u003cp\u003eReturn copies from \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003egetters\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t use \u003ccode\u003eclone\u003c/code\u003e on types that can be subclassed.\u003c/p\u003e\\n\u003cp\u003eBetter still, use \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e types like \u003ccode\u003eInstant\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$15\"},{\"id\":\"step-4\",\"key\":\"ej-methods/defensive-copies/step-4\",\"prompt\":\"\u003cp\u003ePut a defensive constructor\u0026#39;s work in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eValidating the originals leaves a window in which another thread can change them after the check — a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TOCTOU\\\" data-def=\\\"Time-of-check/time-of-use — another thread changes a value between when you validate it and when you use it. Defensive copies must be made before checking.\\\" data-book=\\\"Effective Java\\\"\u003etime-of-check/time-of-use\u003c/button\u003e attack.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eSuppose you check \u003ccode\u003estart\u003c/code\u003e and \u003ccode\u003eend\u003c/code\u003e first, then copy them.\u003c/p\u003e\\n\u003cp\u003eBetween the check and the copy, another thread holding the originals can change them — a time-of-check to time-of-use (TOCTOU) attack.\u003c/p\u003e\\n\u003cp\u003eYour copies then hold values that never passed validation. Copying first and validating the copies leaves no such window, because only your code can reach the copies.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Copy each mutable parameter\",\"Validate the copies, not the originals\",\"Assign the copies to the fields\"],\"start\":[1,0,2]},{\"id\":\"step-5\",\"key\":\"ej-methods/defensive-copies/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e\u0026#39;s constructor takes two \u003ccode\u003ejava.util.Date\u003c/code\u003es and stores copies of them. Why not make the copy with \u003ccode\u003estart.clone()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDon\u0026#39;t use \u003ccode\u003eclone\u003c/code\u003e to copy a parameter whose type can be subclassed by untrusted parties.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eDate\u003c/code\u003e isn\u0026#39;t final, so the argument might be a subclass written by an attacker.\u003c/p\u003e\\n\u003cp\u003eIts \u003ccode\u003eclone\u003c/code\u003e could return an instance of that subclass that records a reference to itself in a static list, letting the attacker mutate your \u0026quot;copy\u0026quot; later.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003enew Date(start.getTime())\u003c/code\u003e creates an instance of exactly \u003ccode\u003eDate\u003c/code\u003e, whatever was passed in.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003eclone\u003c/code\u003e only on types you trust, such as arrays or final classes.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eDate\u003c/code\u003e isn\u0026#39;t final, so the argument could be a malicious subclass whose \u003ccode\u003eclone\u003c/code\u003e returns an instance it still controls\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eclone\u003c/code\u003e is too slow\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"ej-methods/defensive-copies/step-6\",\"prompt\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessor\u003c/button\u003e must not leak the internal object either.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"public Date end() { return new \"},{\"answers\":[\"Date\"],\"size\":4,\"choices\":[\"requireNonNull\",\"firstArg\",\"Date\",\"emptyList\"]},{\"text\":\"(end.getTime()); }\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-7\",\"key\":\"ej-methods/defensive-copies/step-7\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the best fix of all?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDefensive copying has a cost; immutable components make it unnecessary.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Document that callers mustn\u0026#39;t modify the dates\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat can be acceptable between trusted components, but immutability removes the problem.\u003c/p\u003e\\n\"},{\"html\":\"Use an immutable type such as \u003ccode\u003eInstant\u003c/code\u003e or \u003ccode\u003eLocalDateTime\u003c/code\u003e, so no copies are needed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]}]},\"courseTitle\":\"Methods\",\"next\":{\"id\":\"method-signatures\",\"courseId\":\"ej-methods\",\"topicId\":\"effective-java\",\"key\":\"ej-methods/method-signatures\",\"title\":\"Design method signatures carefully\",\"summary\":\"Good names, short parameter lists, interface types and enums instead of booleans.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"api design\",\"parameters\",\"naming\",\"enums\"],\"sources\":[{\"b
