;\u0026amp;\u003c/code\u003e binds more tightly than \u003ccode\u003e||\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jm-expressions/precedence/step-2\",\"title\":\"Strings and plus\",\"body\":\"\u003cp\u003e\u003ccode\u003e\u0026quot;Sum: \u0026quot; + a + b\u003c/code\u003e concatenates left to right: once a string is involved, every \u003ccode\u003e+\u003c/code\u003e after it concatenates.\u003c/p\u003e\\n\u003cp\u003eAdjacent string pieces split across lines need explicit spaces.\u003c/p\u003e\\n\u003cp\u003eWhen in doubt, add parentheses: they cost nothing.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-001\",\"key\":\"jm-expressions/precedence/jm-001\",\"prompt\":\"\u003cp\u003ePack red, green and blue (each 0–255) into one \u003ccode\u003eint\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWrite \u003ccode\u003e(r \u0026lt;\u0026lt; 16) + (g \u0026lt;\u0026lt; 8) + b\u003c/code\u003e, or better \u003ccode\u003e(r \u0026lt;\u0026lt; 16) | (g \u0026lt;\u0026lt; 8) | b\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Mistake 1 (operator precedence).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"10203\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e+\u003c/code\u003e binds tighter than \u003ccode\u003e\u0026lt;\u0026lt;\u003c/code\u003e: it\u0026#39;s \u003ccode\u003er \u0026lt;\u0026lt; (16 + g) \u0026lt;\u0026lt; (8 + b)\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"20000000\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-002\",\"key\":\"jm-expression
