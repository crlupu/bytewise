-term=\\\"Page table\\\" data-def=\\\"The per-process map from virtual page numbers to physical frame numbers.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003epage table\u003c/button\u003e maps each page to a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Frame\\\" data-def=\\\"A fixed-size slot of physical memory that holds one page.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003ephysical frame\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eAn address is a page number plus an offset.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"virtual-memory/pages-and-frames/step-2\",\"prompt\":\"\u003cp\u003ePages are 4 KiB (4,096 bytes). Which page number holds \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Virtual memory\\\" data-def=\\\"Each process sees its own private address space; the OS and hardware translate these addresses to physical memory.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003evirtual address\u003c/button\u003e \u003cstrong\u003e9,000\u003c/strong\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e9,000 ÷ 4,096 = 2 remainder 808, so it\u0026#39;s page 2.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA virtual address is split into a page number and an offset within the page.\u003c/p\u003e\\n\u003cp\u003eWith 4,096-byte pages, the page number is the address divided by 4,096, and the offset is the remainder.\u003c/p\u003e\\n\u003cp\u003e9,000 / 4,096 is 2, remainder 808, so the address is 808 bytes into page 2. In binary, that\u0026#39;s just taking the high bits as the page number and the low 12 bits as the offset.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eDivide the address by the page size and drop the remainder.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"2\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"2.19\",\"correct\":false,\"feedback\":\"\u003cp\u003ePage numbers are whole — take the integer part of the division.\u003c/p\u003e\\n\"},{\"html\":\"3\",\"correct\":false,\"feedback\":\"\u003cp\u003ePages are numbered from 0. Page 0 covers 0–4,095, page 1 covers 4,096–8,191…\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"virtual-memory/pages-and-frames/step-3\",\"prompt\":\"\u003cp\u003eFill in both parts of the address.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe offset passes through translation unchanged; only the page number is swapped for a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Frame\\\" data-def=\\\"A fixed-size slot of physical memory that holds one page.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eframe\u003c/button\u003e number.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe offset is what\u0026#39;s left after removing whole pages — 9,000 − 2 × 4,096.\u003c/p\u003e\\n\"],\"type\":\"blank\",\"parts\":[{\"text\":\"Address 9,000 is in page \",\"html\":\"Address 9,000 is in page \"},{\"answers\":[\"2\"],\"size\":3,\"choices\":[\"past\",\"808\",\"completes\",\"2\"]},{\"text\":\", at offset \",\"html\":\", at offset \"},{\"answers\":[\"808\"],\"size\":3,\"choices\":[\"future\",\"arrived\",\"808\",\"2\"]},{\"text\":\" within it.\",\"html\":\" within it.\"}],\"code\":false,\"caseSensitive\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"virtual-memory/pages-and-frames/step-4\",\"title\":\"Page faults\",\"body\":\"\u003cp\u003eIf a page isn\u0026#39;t in memory, the access faults.\u003c/p\u003e\\n\u003cp\u003eThe OS loads it from disk, then retries the instruction.\u003c/p\u003e\\n\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TLB\\\" data-def=\\\"A small hardware cache of recent address translations, so most memory accesses don\u0026amp;#39;t need to read the page table.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eTLB\u003c/button\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecaches\u003c/button\u003e recent translations.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"virtual-memory/pages-and-frames/step-5\",\"prompt\":\"\u003cp\u003eA program touches a page whose page-table entry says \u0026quot;not in memory\u0026quot;. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s a \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page fault\\\" data-def=\\\"The program touches a page that isn\u0026amp;#39;t in physical memory, so the OS must load it from disk — thousands of times slower than a normal access.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003epage fault\u003c/button\u003e\u003c/strong\u003e. It\u0026#39;s invisible to the program, apart from the time it takes.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The OS loads the page from disk into a frame — evicting another page if none is free — updates the page table, and re-runs the instruction\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The program crashes with a segmentation fault\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s for an address the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Process\\\" data-def=\\\"A running program — its memory, registers and open files — that the
