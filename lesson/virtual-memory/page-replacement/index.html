rogram touches a page that isn\u0026amp;#39;t in physical memory, so the OS must load it from disk — thousands of times slower than a normal access.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003epage faults\u003c/button\u003e did FIFO have?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"7\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"9\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"10\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"13\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would mean every access faulted. Look for the ✓ hits in the bottom row.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"id\":\"step-3\",\"key\":\"virtual-memory/page-replacement/step-3\",\"prompt\":\"\u003cp\u003eSwitch to \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"LRU\\\" data-def=\\\"Evict the page that hasn\u0026amp;#39;t been used for the longest time. A good approximation of the optimal policy.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eLRU\u003c/button\u003e\u003c/strong\u003e and step through the reference string.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eLRU: 9. Try OPT too — it gets 7, the fewest any policy could manage on this string.\\nLRU lands between \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e and the ideal.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"paging\",\"config\":{\"reference\":[7,0,1,2,0,3,0,4,2,3,0,3,2],\"frames\":3,\"algorithms\":[\"FIFO\",\"LRU\",\"OPT\"]},\"goal\":{\"algorithm\":\"LRU\"},\"question\":{\"prompt\":\"\u003cp\u003eHow many faults with LRU?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"7 t predicts the near future.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It needs to know which pages the program will access in the future\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s too slow to compute\",\"correct\":false,\"feedback\":\"\u003cp\u003eSpeed isn\u0026#39;t the obstacle. The information it needs simply doesn\u0026#39;t exist yet.\u003c/p\u003e\\n\"},{\"html\":\"It suffers from Bélády\u0026#39;s anomaly\",\"correct\":false,\"feedback\":\"\u003cp\u003eOPT never does. You\u0026#39;ll meet the anomaly in a moment.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"virtual-memory/page-replacement/step-6\",\"prompt\":\"\u003cp\u003eMore memory should mean fewer faults. Run \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e on this string with \u003cstrong\u003e3 \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Frame\\\" data-def=\\\"A fixed-size slot of physical memory that holds one page.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eframes\u003c/button\u003e\u003c/strong\u003e, then with \u003cstrong\u003e4 frames\u003c/strong\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e9 faults with 3 frames, 10 with 4. That\u0026#39;s \u003cstrong\u003eBélády\u0026#39;s anomaly\u003c/strong\u003e: under FIFO, adding memory can make things worse.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003ePlay to the end with each setting and compare the fault counts in the bar.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"paging\",\"config\":{\"reference\":[1,2
