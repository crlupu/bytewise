on/interruption/step-6\",\"jcip-cancellation/interruption/step-7\",\"jcip-cancellation/interruption/listing-7-3\",\"jcip-cancellation/interruption/listing-7-4\",\"jcip-cancellation/interruption/listing-7-5\",\"jcip-cancellation/interruption/listing-7-6\",\"jcip-cancellation/interruption/listing-7-7\"],\"exercises\":[\"jcip-cancellation/interruption/step-2\",\"jcip-cancellation/interruption/step-4\",\"jcip-cancellation/interruption/step-6\",\"jcip-cancellation/interruption/step-7\",\"jcip-cancellation/interruption/listing-7-3\",\"jcip-cancellation/interruption/listing-7-4\",\"jcip-cancellation/interruption/listing-7-5\",\"jcip-cancellation/interruption/listing-7-6\",\"jcip-cancellation/interruption/listing-7-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-cancellation/interruption/step-1\",\"title\":\"A flag works until the task blocks\",\"body\":\"\u003cp\u003eThe simplest way to cancel: a \u003ccode\u003evolatile boolean cancelled\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe task checks it in its loop.\u003c/p\u003e\\n\u003cp\u003eBut a task stuck in a blocking call never gets back to check.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-cancellation/interruption/step-2\",\"prompt\":\"\u003cp\u003eA producer checks a \u003ccode\u003ecancelled\u003c/code\u003e flag in its loop, but spends its time blocked in \u003ccode\u003equeue.put(p)\u003c/code\u003e because the queue is full and the consumer has stopped. You set \u003ccode\u003ecancelled = true\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s why \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einterruption\u003c/button\u003e is a better mechanism — blocking library methods respond to it.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cancellation\\\" data-def=\\\"Stopping a task before it finishes. In Java it\u0026amp;#39;s cooperative — the task must check and respond.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecancellation\u003c/button\u003e flag only works if the thread gets back to the code that checks it.\u003c/p\u003e\\n\u003cp\u003eThe producer is stuck inside \u003ccode\u003equeue.put\u003c/code\u003e, waiting for space that will never appear because the consumer stopped taking.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eput\u003c/code\u003e doesn\u0026#39;t know about your flag, so it waits forever. It does, however, respond to interruption — \u003ccode\u003einterrupt()\u003c/code\u003e makes it throw \u003ccode\u003eInterruptedException\u003c/code\u003e — which is why interruption is the right way to cancel threads that may block.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It notices the flag immediately\",\"correct\":false,\"feedback\":\"\u003cp\u003eA thread blocked in \u003ccode\u003eput\u003c/code\u003e isn\u0026#39;t checking anything.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — the producer stays blocked in \u003ccode\u003eput\u003c/code\u003e and never gets back to the flag check\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-cancellation/interruption/step-3\",\"title\":\"Interruption reaches blocked threads\",\"body\":\"\u003cp\u003e\u003ccode\u003et.interrupt()\u003c/code\u003e sets the thread\u0026#39;s interrupted flag.\u003c/p\u003e\\n\u003cp\u003eBlocking methods notice, and throw \u003ccode\u003eInterruptedException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIt\u0026#39;s a polite request to stop, not a forced kill.\u003c/p\u003e\\n\u003cp\u003eIt\u0026#39;s the best way to cancel.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-cancellation/interruption/step-4\",\"prompt\":\"\u003cp\u003eMatch each \u003ccode\u003eThread\u003c/code\u003e method to what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003et.interrupt()\u003c/code\u003e\",\"\u003ccode\u003et.isInterrupted()\u003c/code\u003e\",\"\u003ccode\u003eThread.interrupted()\u003c/code\u003e\"],\"right\":[\"Sets thread t\u0026#39;s interrupted status\",\"Reads thread t\u0026#39;s status without changing it\",\"Reads \u003cstrong\u003eand clears\u003c/strong\u003e the current thread\u0026#39;s status\"],\"rightOrder\":[2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eInterruption\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-cancellation/interruption/step-5\",\"title\":\"Respect the owner's policy\",\"body\":\"\u003cp\u003eYour task doesn\u0026#39;t own the pool thread it runs on.\u003c/p\u003e\\n\u003cp\u003eSo never swallow an interrupt.\u003c/p\u003e\\n\u003cp\u003ePropagate it, or restore the flag.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-cancellation/interruption/step-6\",\"prompt\":\"\u003cp\u003eYour task runs in a pool thread it doesn\u0026#39;t own. It catches \u003ccode\u003eInterruptedException\u003c/code\u003e. What must it do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOnly code that implements a thread\u0026#39;s \u003cstrong\u003einterruption policy\u003c/strong\u003e — usually its owner — may swallow an interrupt.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Propagate it, or restore the status — the pool\u0026#39;s interruption policy needs to see it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Swallow it and carry on — the task is the one being interrupted\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe interrupt might be for the \u003cem\u003ethread\u003c/em\u003e, for instance to shut the pool down.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption policy\\\" data-def=\\\"How a thread responds to an interrupt. Only the code that owns the thread should swallow one; everyone else should restore or propagate it.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eInterruption policy\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"jcip-cancellation/interruption/step-7\",\"prompt\":\"\u003cp\u003eLoop until interrupted.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"while (!Thread.currentThread().\"},{\"answers\":[\"isInterrupted\"],\"size\":13,\"choices\":[\"list\",\"isInterrupted\",\"setUncaughtExceptionHandler\",\"true\"]},{\"text\":\"()) queue.put(p = p.nextProbablePrime());\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"listing-7-3\",\"key\":\"jcip-cancellation/interruption/listing-7-3\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.3\u003c/strong\u003e · The queue is bounded and the consumer has stopped taking from it. The consumer then calls \u003ccode\u003ecancel()\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003eput()\u003c/code\u003e throws \u003ccode\u003eInterruptedException\u003c/code\u003e and the producer exits\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing interrupts the thread; setting a flag isn\u0026#39;t an interrupt.\u003c/p\u003e\\n\"},{\"html\":\"The producer may never stop — it is blocked in \u003ccode\u003eput()\u003c/code\u003e and never rechecks \u003ccode\u003ecancelled\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The producer stops at once — \u003ccode\u003ecancelled\u003c/code\u003e is \u003ccode\u003evolatile\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Visibility\\\" data-def=\\\"Whether a write by one thread is seen by another. Without synchronization there\u0026amp;#39;s no guarantee it ever will be.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eVisibility\u003c/button\u003e doesn\u0026#39;t help a thread that is blocked and never reads the flag.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\"]},{\"id\":\"listing-7-4\",\"key\":\"jcip-cancellation/interruption/listing-7-4\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.4\u003c/strong\u003e · What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eisInterrupted()\u003c/code\u003e only reads the status; the static \u003ccode\u003eThread.interrupted()\u003c/code\u003e reads and clears it — the only way to clear it.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"true, true, true\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe static \u003ccode\u003eThread.interrupted()\u003c/code\u003e clears the status as it reads it.\u003c/p\u003e\\n\"},{\"html\":\"true, true, false\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"false, true, false\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003einterrupt()\u003c/code\u003e sets the status straight away on the current thread.\u003c/p\u003e\\n\"},{\"html\":\"true, false, false\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eisInterrupted()\u003c/code\u003e doesn\u0026#39;t clear the flag, so the first \u003ccode\u003einterrupted()\u003c/code\u003e still sees it.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-7-5\",\"key\":\"jcip-cancellation/interruption/listing-7-5\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.5\u003c/strong\u003e · Another thread calls \u003ccode\u003ecancel()\u003c/code\u003e while the producer is blocked in \u003ccode\u003equeue.put(...)\u003c/code\u003e on a full queue. What happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"The producer stays blocked until the queue has room\",\"correct\":false,\"feedback\":\"\u003cp\u003eBlocking library methods like \u003ccode\u003eput\u003c/code\u003e respond to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einterruption\u003c/button\u003e by throwing.\u003c/p\u003e\\n\"},{\"html\":\"The loop checks \u003ccode\u003eisInterrupted()\u003c/code\u003e and exits without exceptions\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe thread is inside \u003ccode\u003eput\u003c/code\u003e, not at the loop test; \u003ccode\u003eput\u003c/code\u003e throws.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eput\u003c/code\u003e throws \u003ccode\u003eInterruptedException\u003c/code\u003e and the thread exits\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"listing-7-6\",\"key\":\"jcip-cancellation/interruption/listing-7-6\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.6\u003c/strong\u003e · A library method can\u0026#39;t handle \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einterruption\u003c/button\u003e itself. Which version is right?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"B — it keeps callers free of a checked exception\",\"correct\":false,\"feedback\":\"\u003cp\u003eB swallows the interrupt: the code up the stack never learns it was asked to stop.\u003c/p\u003e\\n\"},{\"html\":\"A — propagate \u003ccode\u003eInterruptedException\u003c/code\u003e to the caller\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Both are fine\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly code that owns the thread may swallow an interrupt.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-7-7\",\"key\":\"jcip-cancellation/interruption/listing-7-7\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.7\u003c/strong\u003e · The thread is interrupted while waiting in \u003ccode\u003etake()\u003c/code\u003e. What does \u003ccode\u003egetNextTask\u003c/code\u003e do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRestoring the interrupt inside the loop would make \u003ccode\u003etake()\u003c/code\u003e throw at once every time — a spin. So it\u0026#39;s saved and restored at the end.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Loses the interrupt\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e block calls \u003ccode\u003einterrupt()\u003c/code\u003e again.\u003c/p\u003e\\n\"},{\"html\":\"Spins at 100% CPU forever\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt records the interrupt and retries; the interrupt is only restored on the way out, so \u003ccode\u003etake()\u003c/code\u003e blocks normally.\u003c/p\u003e\\n\"},{\"html\":\"Keeps waiting for a task, then re-sets the interrupt status before returning\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Returns \u003ccode\u003enull\u003c/code\u003e straight away\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt retries \u003ccode\u003etake()\u003c/code\u003e until it gets a task.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eInterruption\u003c/button\u003e\"]}]},\"courseTitle\":\"Cancellation and shutdown\",\"next\":{\"id\":\"cancelling-tasks\",\"courseId\":\"jcip-cancellation\",\"topicId\":\"jcip\",\"key\":\"jcip-cancellation/cancelling-tasks\",\"title\":\"Cancelling tasks\",\"summary\":\"Cancel through a Future, handle blocking that ignores interruption, and never interrupt threads you don't own.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"future\",\"cancel\",\"timeouts\",\"non-interruptible blocking\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§7.1.4–7.1.7, Example: Timed Run; Cancellation via Future\"}],\"requires\":[],\"steps\":14,\"stepKeys\":[\"jcip-cancellation/cancelling-tasks/step-1\",\"jcip-cancellation/cancelling-tasks/step-2\",\"jcip-cancellation/cancelling-tasks/step-3\",\"jcip-cancellation/cancelling-tasks/step-4\",\"jcip-cancellation/cancelling-tasks/step-5\",\"jcip-cancellation/cancelling-tasks/step-6\",\"jcip-cancellation/cancelling-tasks/step-7\",\"jcip-cancellation/cancelling-tasks/listing-7-1\",\"jcip-cancellation/cancelling-tasks/listing-7-2\",\"jcip-cancellation/cancelling-tasks/listing-7-8\",\"jcip-cancellation/cancelling-tasks/listing-7-9\",\"jcip-cancellation/cancelling-tasks/listing-7-10\",\"jcip-cancellation/cancelling-tasks/listing-7-11\",\"jcip-cancellation/cancelling-tasks/listing-7-12\"],\"exercises\":[\"jcip-cancellation/cancelling-tasks/step-3\",\"jcip-cancellation/cancelling-tasks/step-5\",\"jcip-cancellation/cancelling-tasks/step-6\",\"jcip-cancellation/cancelling-tasks/step-7\",\"jcip-cancellation/cancelling-tasks/listing-7-1\",\"jcip-cancellation/cancelling-tasks/listing-7-2\",\"jcip-cancellation/cancelling-tasks/listing-7-8\",\"jcip-cancellation/cancelling-tasks/listing-7-9\",\"jcip-cancellation/cancelling-tasks/listing-7-10\",\"jcip-cancellation/cancelling-tasks/listing-7-11\",
