n/jvm-shutdown\",\"title\":\"JVM shutdown\",\"summary\":\"Shutdown hooks, daemon threads and finalizers — what runs, and what doesn't, when the JVM exits.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"shutdown hooks\",\"daemon threads\",\"finalizers\",\"jvm\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§7.4, JVM Shutdown\"}],\"requires\":[],\"steps\":8,\"stepKeys\":[\"jcip-cancellation/jvm-shutdown/step-1\",\"jcip-cancellation/jvm-shutdown/step-2\",\"jcip-cancellation/jvm-shutdown/step-3\",\"jcip-cancellation/jvm-shutdown/step-4\",\"jcip-cancellation/jvm-shutdown/step-5\",\"jcip-cancellation/jvm-shutdown/step-6\",\"jcip-cancellation/jvm-shutdown/step-7\",\"jcip-cancellation/jvm-shutdown/listing-7-26\"],\"exercises\":[\"jcip-cancellation/jvm-shutdown/step-2\",\"jcip-cancellation/jvm-shutdown/step-4\",\"jcip-cancellation/jvm-shutdown/step-6\",\"jcip-cancellation/jvm-shutdown/step-7\",\"jcip-cancellation/jvm-shutdown/listing-7-26\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-cancellation/jvm-shutdown/step-1\",\"title\":\"Orderly or abrupt\",\"body\":\"\u003cp\u003eOrderly: the last normal thread ends, \u003ccode\u003eSystem.exit\u003c/code\u003e, or Ctrl-C.\u003c/p\u003e\\n\u003cp\u003eAbrupt: \u003ccode\u003ehalt\u003c/code\u003e, or the OS kills the process.\u003c/p\u003e\\n\u003cp\u003eOnly orderly shutdowns run cleanup.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-cancellation/jvm-shutdown/step-2\",\"prompt\":\"\u003cp\u003eMatch each way the JVM can stop.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Orderly shutdown\",\"Abrupt shutdown\"],\"right\":[\"The last non-daemon thread ends, \u003ccode\u003eSystem.exit\u003c/code\u003e is called, or the process receives SIGINT (Ctrl-C)\",\"\u003ccode\u003eRuntime.halt\u003c/code\u003e is called, or the OS kills the process — no hooks run\"],\"rightOrder\":[1,0]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-cancellation/jvm-shutdown/step-3\",\"title\":\"Shutdown hooks\",\"body\":\"\u003cp\u003eHooks are threads the JVM starts during orderly shutdown.\u003c/p\u003e\\n\u003cp\u003eThey all run at the same time, in no order.\u003c/p\u003e\\n\u003cp\u003eKeep them \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread-safe\u003c/button\u003e and quick.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-cancellation/jvm-shutdown/step-4\",\"prompt\":\"\u003cp\u003eTwo independent services each register a hook. One hook closes a log file the other hook writes to. What\u0026#39;s the risk?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA common fix is a single hook that shuts services down in a deliberate order.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"None — hooks run in registration order\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s no ordering guarantee between hooks.\u003c/p\u003e\\n\"},{\"html\":\"Hooks run concurrently, so one may close the file while the other still needs it\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-cancellation/jvm-shutdown/step-5\",\"title\":\"Daemon threads are abandoned\",\"body\":\"\u003cp\u003eWhen the JVM exits, \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Daemon thread\\\" data-def=\\\"A thread that doesn\u0026amp;#39;t stop the JVM from exiting. When only daemon threads remain, the JVM exits without running their \u0026lt;code\u0026gt;finally\u0026lt;/code\u0026gt; blocks.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edaemon threads\u003c/button\u003e just stop.\u003c/p\u003e\\n\u003cp\u003eTheir \u003ccode\u003efinally\u003c/code\u003e blocks never run.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t rely on finalizers either.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-cancellation/jvm-shutdown/step-6\",\"prompt\":\"\u003cp\u003eWhat happens to \u003cstrong\u003edaemon\u003c/strong\u003e threads when the JVM exits?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Daemon thread\\\" data-def=\\\"A thread that doesn\u0026amp;#39;t stop the JVM from exiting. When only daemon threads remain, the JVM exits without running their \u0026lt;code\u0026gt;finally\u0026lt;/code\u0026gt; blocks.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edaemon threads\u003c/button\u003e sparingly, and never for tasks that perform I/O or must clean up.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They\u0026#39;re abandoned — no \u003ccode\u003efinally\u003c/code\u003e blocks run, and stacks aren\u0026#39;t unwound\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They finish their current task first\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe JVM doesn\u0026#39;t wait for daemon threads at all.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"jcip-cancellation/jvm-shutdown/step-7\",\"prompt\":\"\u003cp\u003eComplete the advice on finalizers.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Avoid \",\"html\":\"Avoid \"},{\"answers\":[\"finalizers\"],\"size\":10,\"choices\":[\"resource\",\"current\",\"finalizers\",\"notification\"]},{\"text\":\": in most cases `finally` blocks and explicit close methods manage resources better.\",\"html\":\": in most \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecases\u003c/button\u003e \u003ccode\u003efinally\u003c/code\u003e blocks and explicit close methods manage resources better.\"}],\"code\":false,\"caseSensitive\":false},{\"id\":\"listing-7-26\",\"key\":\"jcip-cancellation/jvm-shutdown/listing-7-26\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.26\u003c/strong\u003e · When does this hook run?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eHooks run concurrently with each other and with any live threads — so they must be \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread-safe\u003c/button\u003e and quick.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"Only on \u003ccode\u003eSystem.exit\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eNormal exit and SIGINT also run hooks.\u003c/p\u003e\\n\"},{\"html\":\"On any shutdown, including \u003ccode\u003eRuntime.halt\u003c/code\u003e and \u003ccode\u003ekill -9\u003c/code\u003e\",\"correct\":false,\"feed
