,\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"stopping-services\",\"courseId\":\"jcip-cancellation\",\"topicId\":\"jcip\",\"key\":\"jcip-cancellation/stopping-services\",\"title\":\"Stopping thread-based services\",\"summary\":\"A service that owns threads must offer lifecycle methods — and shut down without losing or hanging on work.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"shutdown\",\"poison pill\",\"logging service\",\"lifecycle\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§7.2, Stopping a Thread-based Service\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jcip-cancellation/stopping-services/step-1\",\"jcip-cancellation/stopping-services/step-2\",\"jcip-cancellation/stopping-services/step-3\",\"jcip-cancellation/stopping-services/step-4\",\"jcip-cancellation/stopping-services/step-5\",\"jcip-cancellation/stopping-services/step-6\"],\"exercises\":[\"jcip-cancellation/stopping-services/step-3\",\"jcip-cancellation/stopping-services/step-5\",\"jcip-cancellation/stopping-services/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-cancellation/stopping-services/step-1\",\"title\":\"Services own their threads\",\"body\":\"\u003cp\u003eWhoever creates a thread owns it.\u003c/p\u003e\\n\u003cp\u003eYour app owns the service, not its threads.\u003c/p\u003e\\n\u003cp\u003eSo services need methods to start and stop them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-cancellation/stopping-services/step-2\",\"title\":\"Stopping a logger cleanly\",\"body\":\"\u003cp\u003eA logger queues messages; a background thread writes them.\u003c/p\u003e\\n\u003cp\u003eStopping it means: refuse new messages.\u003c/p\u003e\\n\u003cp\u003eFinish the queued ones.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t leave anyone blocked on a full queue.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-cancellation/stopping-services/step-3\",\"prompt\":\"\u003cp\u003eThe stop method just interrupts the writer thread. What goes wrong?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe fix is a shutdown flag plus a count of reservations, checked atomically when logging — or simply delegating to an \u003ccode\u003eExecutorService\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInterrupting the writer stops it, but messages already queued are never written, and producers blocked in \u003ccode\u003eput\u003c/code\u003e because the queue is full stay blocked forever.\u003c/p\u003e\\n\u003cp\u003eAnd producers that call \u003ccode\u003elog\u003c/code\u003e after shutdown keep adding to a queue nobody reads.\u003c/p\u003e\\n\u003cp\u003eA correct shutdown refuses new messages, lets the writer drain what\u0026#39;s already queued, and then stops — which is precisely what delegating to an \u003ccode\u003eExecutorService\u003c/code\u003e with \u003ccode\u003eshutdown()\u003c/code\u003e gives you.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003eShutdown must also deal with work in flight and with producers.\u003c/p\u003e\\n\"},{\"html\":\"Messages still in the queue are lost, and producers blocked in \u003ccode\u003eput\u003c/code\u003e on a full queue hang forever\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jcip-cancellation/stopping-services/step-4\",\"title\":\"Poison pills and shutdown\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Poison pill\\\" data-def=\\\"A special object placed on a queue meaning \u0026amp;quot;stop when you get to this\u0026amp;quot;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003epoison pill\u003c/button\u003e is a special item that means \u0026quot;stop here\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eConsumers finish everything before it.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutors\u003c/button\u003e offer \u003ccode\u003eshutdown()\u003c/code\u003e, then \u003ccode\u003eawaitTermination\u003c/code\u003e, then \u003ccode\u003eshutdownNow()\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jcip-cancellation/stopping-services/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eshutdownNow\u003c/code\u003e returns the tasks that never started. What about tasks that were \u003cem\u003erunning\u003c/em\u003e when it was called?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA tracking \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eexecutor\u003c/button\u003e can record the tasks that were cancelled mid-run, so they can be retried later.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They\u0026#39;re returned too\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly never-started tasks are returned; running ones are just interrupted.\u003c/p\u003e\\n\"},{\"html\":\"They\u0026#39;re interrupted, and there\u0026#39;s no general way to know which ones were — you need extra tracking if it matters\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"jcip-cancellation/stopping-services/step-6\",\"prompt\":\"\u003cp\u003ePut a clean shutdown of an \u003ccode\u003eExecutorService\u003c/code\u003e-based service in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Call \u003ccode\u003eshutdown()\u003c/code\u003e so no new tasks are accepted\",\"Call \u003ccode\u003eawaitTermination\u003c/code\u003e to let queued and running tasks finish within a time limit\",\"If they don\u0026#39;t finish in time, call \u003ccode\u003eshutdownNow()\u003c/code\u003e to interrupt them\"],\"start\":[1,0,2]}]},\"courseTitle\":\"Cancellation and shutdown\",\"next\":{\"id\":\"abnormal-termination\",\"courseId\":\"jcip-cancellation\",\"topicId\":\"jcip\",\"key\":\"jcip-cancellation/abnormal-termination\",\"title\":\"Handling abnormal thread termination\",\"summary\":\"A RuntimeException silently kills the thread it's thrown in — unless something is watching.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"exceptions\",\"uncaughtexceptionhandler\",\"thread pools\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§7.3, Handling Abnormal Thread Termination\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jcip-cancellation/abnormal-termination/step-1\",\"jcip-cancellation/abnormal-termination/step-2\",\"jcip-cancellation/abnormal-termination/step-3\",\"jcip-cancellation/abnormal-termination/step-4\",\"jcip-cancellation/abnormal-termination/step-5\",\"jcip-cancellation/abnormal-termination/step-6\"],\"exercises\":[\"jcip-cancellation/abnormal-termination/step-3\",\"jcip-cancellation/abnormal-termination/step-4\",\"jcip-cancellation/abnormal-termination/step-5\",\"jcip
