ce that owns threads must offer lifecycle methods — and shut down without losing or hanging on work.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"shutdown\",\"poison pill\",\"logging service\",\"lifecycle\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§7.2, Stopping a Thread-based Service\"}],\"requires\":[],\"steps\":13,\"stepKeys\":[\"jcip-cancellation/stopping-services/step-1\",\"jcip-cancellation/stopping-services/step-2\",\"jcip-cancellation/stopping-services/step-3\",\"jcip-cancellation/stopping-services/step-4\",\"jcip-cancellation/stopping-services/step-5\",\"jcip-cancellation/stopping-services/step-6\",\"jcip-cancellation/stopping-services/listing-7-13\",\"jcip-cancellation/stopping-services/listing-7-14\",\"jcip-cancellation/stopping-services/listing-7-15\",\"jcip-cancellation/stopping-services/listing-7-16\",\"jcip-cancellation/stopping-services/listing-7-17\",\"jcip-cancellation/stopping-services/listing-7-18\",\"jcip-cancellation/stopping-services/listing-7-19\"],\"exercises\":[\"jcip-cancellation/stopping-services/step-3\",\"jcip-cancellation/stopping-services/step-5\",\"jcip-cancellation/stopping-services/step-6\",\"jcip-cancellation/stopping-services/listing-7-13\",\"jcip-cancellation/stopping-services/listing-7-14\",\"jcip-cancellation/stopping-services/listing-7-15\",\"jcip-cancellation/stopping-services/listing-7-16\",\"jcip-cancellation/stopping-services/listing-7-17\",\"jcip-cancellation/stopping-services/listing-7-18\",\"jcip-cancellation/stopping-services/listing-7-19\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-cancellation/stopping-services/step-1\",\"title\":\"Services own their threads\",\"body\":\"\u003cp\u003eWhoever creates a thread owns it.\u003c/p\u003e\\n\u003cp\u003eYour app owns the service, not its threads.\u003c/p\u003e\\n\u003cp\u003eSo services need methods to start and stop them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-cancellation/stopping-services/step-2\",\"title\":\"Stopping a logger cleanly\",\"body\":\"\u003cp\u003eA logger queues messages; a background thread writes them.\u003c/p\u003e\\n\u003cp\u003eStopping it means: refuse new messages.\u003c/p\u003e\\n\u003cp\u003eFinish the queued ones.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t leave anyone blocked on a full queue.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-cancellation/stopping-services/step-3\",\"prompt\":\"\u003cp\u003eThe stop method just interrupts the writer thread. What goes wrong?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe fix is a shutdown flag plus a count of reservations, checked atomically when logging — or simply delegating to an \u003ccode\u003eExecutorService\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInterrupting the writer stops it, but messages already queued are never written, and producers blocked in \u003ccode\u003eput\u003c/code\u003e because the queue is full stay blocked forever.\u003c/p\u003e\\n\u003cp\u003eAnd producers that call \u003ccode\u003elog\u003c/code\u003e after shutdown keep adding to a queue nobody reads.\u003c/p\u003e\\n\u003cp\u003eA correct shutdown refuses new messages, lets the writer drain what\u0026#39;s already queued, and then stops — which is precisely what delegating to an \u003ccode\u003eExecutorService\u003c/code\u003e with \u003ccode\u003eshutdown()\u003c/code\u003e gives you.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003eShutdown must also deal with work in flight and with producers.\u003c/p\u003e\\n\"},{\"html\":\"Messages still in the queue are lost, and producers blocked in \u003ccode\u003eput\u003c/code\u003e on a full queue hang forever\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jcip-cancellation/stopping-services/step-4\",\"title\":\"Poison pills and shutdown\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Poison pill\\\" data-def=\\\"A special object placed on a queue meaning \u0026amp;quot;stop when you get to this\u0026amp;quot;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003epoison pill\u003c/button\u003e is a special item that means \u0026quot;stop here\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eConsumers finish everything before it.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutors\u003c/button\u003e offer \u003ccode\u003eshutdown()\u003c/code\u003e, then \u003ccode\u003eawaitTermination\u003c/code\u003e, then \u003ccode\u003eshutdownNow()\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jcip-cancellation/stopping-services/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eshutdownNow\u003c/code\u003e returns the tasks that never started. What about tasks that were \u003cem\u003erunning\u003c/em\u003e when it was called?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA tracking \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eexecutor\u003c/button\u003e can record the tasks that were cancelled mid-run, so they can be retried later.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They\u0026#39;re returned too\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly never-started tasks are returned; running ones are just interrupted.\u003c/p\u003e\\n\"},{\"html\":\"They\u0026#39;re interrupted, and there\u0026#39;s no general way to know which ones were — you need extra tracking if it matters\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"jcip-cancellation/stopping-services/step-6\",\"prompt\":\"\u003cp\u003ePut a clean shutdown of an \u003ccode\u003eExecutorService\u003c/code\u003e-based service in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Call \u003ccode\u003eshutdown()\u003c/code\u003e so no new tasks are accepted\",\"Call \u003ccode\u003eawaitTermination\u003c/code\u003e to let queued and running tasks finish within a time limit\",\"If they don\u0026#39;t finish in time, call \u003ccode\u003eshutdownNow()\u003c/code\u003e to interrupt them\"],\"start\":[1,0,2]},{\"id\":\"listing-7-13\",\"key\":\"jcip-cancellation/stopping-services/listing-7-13\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.13\u003c/strong\u003e · How do you stop this logging service?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"You can\u0026#39;t cleanly — interrupting the logger loses queued messages and leaves \u003ccode\u003elog\u003c/code\u003e callers blocked on a full queue\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It stops by itself when the queue is empty\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003etake()\u003c/code\u003e just waits for more.\u003c/p\u003e\\n\"},{\"html\":\"Interrupt the logger thread; everything queued is written first\",\"correct\":false,\"feedback\":\"\u003cp\u003eOn interrupt \u003ccode\u003erun()\u003c/code\u003e exits, dropping the queue.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-7-14\",\"key\":\"jcip-cancellation/stopping-services/listing-7-14\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.14\u003c/strong\u003e · \u003ccode\u003eLogWriter\u003c/code\u003e writes queued messages from a logger thread; \u003ccode\u003eshutdownRequested\u003c/code\u003e is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003evolatile\u003c/code\u003e\u003c/button\u003e flag set on shutdown. What\u0026#39;s the problem?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"\u003ccode\u003eIllegalStateException\u003c/code\u003e is the wrong exception type\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe type is fine; the race is the issue.\u003c/p\u003e\\n\"},{\"html\":\"Check-then-act race: a message can be put after the logger exits, and \u003ccode\u003eput\u003c/code\u003e may block forever\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"No problem — the flag is \u003ccode\u003evolatile\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Visibility\\\" data-def=\\\"Whether a write by one thread is seen by another. Without synchronization there\u0026amp;#39;s no guarantee it ever will be.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eVisibility\u003c/button\u003e isn\u0026#39;t \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomicity\u003c/button\u003e; the check and \u003ccode\u003eput\u003c/code\u003e can be split by shutdown.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Check-then-act\\\" data-def=\\\"A race where you check a condition and then act on it, but the condition may change in between — e.g. \u0026lt;code\u0026gt;if (!map.containsKey(k)) map.put(k, v)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCheck-then-act\u003c/button\u003e\"]},{\"id\":\"listing-7-15\",\"key\":\"jcip-cancellation/stopping-services/listing-7-15\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.15\u003c/strong\u003e · \u003ccode\u003estop()\u003c/code\u003e is called while 3 messages are queued. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe interrupt only wakes \u003ccode\u003etake()\u003c/code\u003e; the reservation count decides when it\u0026#39;s safe to stop.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"All 3 are written, then the logger exits; later \u003ccode\u003elog\u003c/code\u003e calls throw\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The logger keeps running forever\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnce reservations drain to zero it breaks out.\u003c/p\u003e\\n\"},{\"html\":\"The queued messages are dropped\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe logger exits only when \u003ccode\u003eisShutdown \u0026amp;\u0026amp; reservations == 0\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-7-16\",\"key\":\"jcip-cancellation/stopping-services/listing-7-16\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.16\u003c/strong\u003e · What does \u003ccode\u003estop()\u003c/code\u003e guarantee?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"Pending messages are discarded\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eshutdown()\u003c/code\u003e lets queued tasks run; \u003ccode\u003eshutdownNow()\u003c/code\u003e would drain them.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003elog\u003c/code\u003e after \u003ccode\u003estop\u003c/code\u003e throws to the caller\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003eRejectedExecutionException\u003c/code\u003e is caught and ignored.\u003c/p\u003e\\n\"},{\"html\":\"Already-submitted messages are written (up to the timeout); new ones are silently rejected\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003eTimeout\u003c/button\u003e\"]},{\"id\":\"listing-7-17\",\"key\":\"jcip-cancellation/stopping-services/listing-7-17\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.17\u003c/strong\u003e · \u003ccode\u003eIndexingService\u003c/code\u003e has one crawler (producer) and one indexer (consumer) sharing a \u003ccode\u003eBlockingQueue\u0026lt;File\u0026gt;\u003c/code\u003e. \u003ccode\u003estop()\u003c/code\u003e interrupts the crawler. How does the indexer know to stop?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Poison pill\\\" data-def=\\\"A special object placed on a queue meaning \u0026amp;quot;stop when you get to this\u0026amp;quot;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003epoison pill\u003c/button\u003e works only when the number of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Producer-consumer\\\" data-def=\\\"Producers put work in a queue, consumers take it out — decoupling the rate of producing from the rate of consuming.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eproducers and consumers\u003c/button\u003e is known.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"The indexer is interrupted too\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly the producer is interrupted; the poison pill reaches the consumer in order.\u003c/p\u003e\\n\"},{\"html\":\"The indexer stops when the queue is empty\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn empty queue just means it waits.\u003c/p\u003e\\n\"},{\"html\":\"The crawler puts \u003ccode\u003ePOISON\u003c/code\u003e on the queue when it finishes; the indexer stops when it takes it\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"listing-7-18\",\"key\":\"jcip-cancellation/stopping-services/listing-7-18\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.18\u003c/strong\u003e · The crawler is interrupted while \u003ccode\u003eput(POISON)\u003c/code\u003e is blocked on a full queue. What happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"The pill is lost and the indexer never stops\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe loop only breaks after a successful \u003ccode\u003eput\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"It retries until the pill is on the queue\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws \u003ccode\u003eInterruptedException\u003c/code\u003e out of \u003ccode\u003erun\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s caught and the \u003ccode\u003eput\u003c/code\u003e is retried.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-7-19\",\"key\":\"jcip-cancellation/stopping-services/listing-7-19\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.19\u003c/strong\u003e · Files A and B are queued before \u003ccode\u003ePOISON\u003c/code\u003e. What does the indexer do?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"Stops immediately, skipping A and B\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe queue is FIFO; the pill comes after them.\u003c/p\u003e\\n\"},{\"html\":\"Indexes A and B, then stops\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Stops only if a file named \u0026quot;\u0026quot; is found\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compares \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Identity\\\" data-def=\\\"Whether two references point to the very same object — what \u0026lt;code\u0026gt;==\u0026lt;/code\u0026gt; compares for objects.\\\"\u003eidentity\u003c/button\u003e (\u003ccode\u003e==\u003c/code\u003e) with the one \u003ccode\u003ePOISON\u003c/code\u003e instance, not names.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Cancellation and shutdown\",\"next\":{\"id\":\"stopping-services-code\",\"courseId\":\"jcip-cancellation\",\"topicId\":\"jcip\",\"key\":\"jcip-cancella
