sting-7-22\"],\"exercises\":[\"jcip-cancellation/stopping-services-code/listing-7-20\",\"jcip-cancellation/stopping-services-code/listing-7-21\",\"jcip-cancellation/stopping-services-code/listing-7-22\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-cancellation/stopping-services-code/step-1\",\"title\":\"Recap: Services own their threads\",\"body\":\"\u003cp\u003eWhoever creates a thread owns it.\u003c/p\u003e\\n\u003cp\u003eYour app owns the service, not its threads.\u003c/p\u003e\\n\u003cp\u003eSo services need methods to start and stop them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-cancellation/stopping-services-code/step-2\",\"title\":\"Recap: Stopping a logger cleanly\",\"body\":\"\u003cp\u003eA logger queues messages; a background thread writes them.\u003c/p\u003e\\n\u003cp\u003eStopping it means: refuse new messages.\u003c/p\u003e\\n\u003cp\u003eFinish the queued ones.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t leave anyone blocked on a full queue.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"listing-7-20\",\"key\":\"jcip-cancellation/stopping-services-code/listing-7-20\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.20\u003c/strong\u003e · Why use an \u003ccode\u003eAtomicBoolean\u003c/code\u003e instead of a local \u003ccode\u003eboolean\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eexecutor\u003c/button\u003e\u0026#39;s lifetime is bounded by the method: \u003ccode\u003eshutdown\u003c/code\u003e + \u003ccode\u003eawaitTermination\u003c/code\u003e in \u003ccode\u003efinally\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"The anonymous tasks can only capture final locals, and the flag is written from several threads\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s not needed — a local would work\",\"correct\":false,\"feedback\":\"\u003cp\u003eA local can\u0026#39;t be assigned from inside an inner class.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eAtomicBoolean\u003c/code\u003e makes \u003ccode\u003echeckMail\u003c/code\u003e faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s for capture and thread-safety, not speed.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-7-21\",\"key\":\"jcip-cancellation/stopping-services-code/listing-7-21\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.21\u003c/strong\u003e · When is a task added to \u003ccode\u003etasksCancelledAtShutdown\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThere\u0026#39;s an unavoidable race: a task that finished just as shutdown happened can be counted as cancelled — so tasks must be \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Idempotent\\\" data-def=\\\"Doing it twice has the same effect as doing it once — what makes retries safe.\\\"\u003eidempotent\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"When it ends while the executor is shut down and its thread is interrupted\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Whenever it throws an exception\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe condition checks shutdown and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einterruption\u003c/button\u003e, not exceptions.\u003c/p\u003e\\n\"},{\"html\":\"When it was never started\",\"correct\":false,\"feedback\":\"\u003cp\u003eNever-started tasks come back from \u003ccode\u003eshutdownNow()\u003c/code\u003e, not this set.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor\u003c/button\u003e\"]},{\"id\":\"listing-7-22\",\"key\":\"jcip-cancellation/stopping-services-code/listing-7-22\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.22\u003c/strong\u003e · Which URLs does \u003ccode\u003estop()\u003c/code\u003e save for the next run?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Only tasks that never started\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt also adds \u003ccode\u003eexec.getCancelledTasks()\u003c/code\u003e once terminated.\u003c/p\u003e\\n\"},{\"html\":\"Tasks that never started (from \u003ccode\u003eshutdownNow\u003c/code\u003e) and tasks interrupted mid-run\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"None — URLs are discarded on stop\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003esaveUncrawled\u003c/code\u003e puts them back into \u003ccode\u003eurlsToCrawl\u003c/code\u003e for \u003ccode\u003estart()\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Cancellation and shutdown\",\"next\":{\"id\":\"abnormal-termination\",\"courseId\":\"jcip-cancellation\",\"topicId\":\"jcip\",\"key\":\"jcip-cancellation/abnormal-termination\",\"title\":\"Handling abnormal thread termination\",\"summary\":\"A RuntimeException silently kills the thread it's thrown in — unless something is watching.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"exceptions\",\"uncaughtexceptionhandler\",\"thread pools\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§7.3, Handling Abnormal Thread Termination\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"jcip-cancellation/abnormal-termination/step-1\",\"jcip-cancellation/abnormal-termination/step-2\",\"jcip-cancellation/abnormal-termination/step-3\",\"jcip-cancellation/abnormal-termination/step-4\",\"jcip-cancellation/abnormal-termination/step-5\",\"jcip-cancellation/abnormal-termination/step-6\",\"jcip-cancellation/abnormal-termination/listing-7-23\",\"jcip-cancellation/abnormal-termination/listing-7-24\",\"jcip-cancellation/abnormal-termination/listing-7-25\"],\"exercises\":[\"jcip-cancellation/abnormal-termination/step-3\",\"jcip-cancellation/abnormal-termination/step-4\",\"jcip-cancellation/abnormal-termination/step-5\",\"jcip-cancellation/abnormal-termination/step-6\",\"jcip-cancellation/abnormal-termination/listing-7-23\",\"jcip-cancellation/abnormal-termination/listing-7-24\",\"jcip-cancellation/abnormal-termination/listing-7-25\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"au
