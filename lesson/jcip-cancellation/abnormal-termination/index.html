aughtExceptionHandler\u003c/code\u003e can log dying threads.\u003c/p\u003e\\n\u003cp\u003eWith \u003ccode\u003esubmit\u003c/code\u003e, the exception goes into the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eFuture\u003c/code\u003e\u003c/button\u003e instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-cancellation/abnormal-termination/step-3\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003eThread.UncaughtExceptionHandler\u003c/code\u003e provide?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSet a handler via a \u003ccode\u003eThreadFactory\u003c/code\u003e so every pool thread has one.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A way to stop exceptions from killing the thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe thread still dies; the handler just gets to report it.\u003c/p\u003e\\n\"},{\"html\":\"A hook that\u0026#39;s called when a thread is about to die from an uncaught exception — typically to log it\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-4\",\"key\":\"jcip-cancellation/abnormal-termination/step-4\",\"prompt\":\"\u003cp\u003eA task submitted with \u003ccode\u003eexecutor.submit(task)\u003c/code\u003e throws a \u003ccode\u003eRuntimeException\u003c/code\u003e. Does the uncaught exception handler see it?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIf nobody ever calls \u003ccode\u003eget\u003c/code\u003e, the exception disappears without a trace.\u003c/p\u003e\\n\",\"details\":\"\
