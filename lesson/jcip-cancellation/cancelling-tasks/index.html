ncy\",\"future\",\"cancel\",\"timeouts\",\"non-interruptible blocking\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§7.1.4–7.1.7, Example: Timed Run; Cancellation via Future\"}],\"requires\":[],\"steps\":14,\"stepKeys\":[\"jcip-cancellation/cancelling-tasks/step-1\",\"jcip-cancellation/cancelling-tasks/step-2\",\"jcip-cancellation/cancelling-tasks/step-3\",\"jcip-cancellation/cancelling-tasks/step-4\",\"jcip-cancellation/cancelling-tasks/step-5\",\"jcip-cancellation/cancelling-tasks/step-6\",\"jcip-cancellation/cancelling-tasks/step-7\",\"jcip-cancellation/cancelling-tasks/listing-7-1\",\"jcip-cancellation/cancelling-tasks/listing-7-2\",\"jcip-cancellation/cancelling-tasks/listing-7-8\",\"jcip-cancellation/cancelling-tasks/listing-7-9\",\"jcip-cancellation/cancelling-tasks/listing-7-10\",\"jcip-cancellation/cancelling-tasks/listing-7-11\",\"jcip-cancellation/cancelling-tasks/listing-7-12\"],\"exercises\":[\"jcip-cancellation/cancelling-tasks/step-3\",\"jcip-cancellation/cancelling-tasks/step-5\",\"jcip-cancellation/cancelling-tasks/step-6\",\"jcip-cancellation/cancelling-tasks/step-7\",\"jcip-cancellation/cancelling-tasks/listing-7-1\",\"jcip-cancellation/cancelling-tasks/listing-7-2\",\"jcip-cancellation/cancelling-tasks/listing-7-8\",\"jcip-cancellation/cancelling-tasks/listing-7-9\",\"jcip-cancellation/cancelling-tasks/listing-7-10\",\"jcip-cancellation/cancelling-tasks/listing-7-11\",\"jcip-cancellation/cancelling-tasks/listing-7-12\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-cancellation/cancelling-tasks/step-1\",\"title\":\"Cancel through the Future\",\"body\":\"\u003cp\u003eDon\u0026#39;t interrupt a pool thread directly.\u003c/p\u003e\\n\u003cp\u003eIt may be running some other task by then.\u003c/p\u003e\\n\u003cp\u003eCall \u003ccode\u003efuture.cancel(true)\u003c/code\u003e instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-cancellation/cancelling-tasks/step-2\",\"title\":\"A timed run\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-cancellation/cancelling-tasks/step-3\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003ecancel(true)\u003c/code\u003e do if the task is running?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe executor owns its worker threads, and its policy is that interrupting one means \u0026quot;cancel what you\u0026#39;re running\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003ecancel(true)\u003c/code\u003e can interrupt the thread safely: the task is expected to stop, and the pool knows how to handle an interrupted worker.\u003c/p\u003e\\n\u003cp\u003eYou shouldn\u0026#39;t interrupt a thread you don\u0026#39;t own this way, because you don\u0026#39;t know what its interruption policy is.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Stops the thread immediately\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing stops a thread immediately; it delivers an interrupt.\u003c/p\u003e\\n\"},{\"html\":\"Interrupts the thread running it — appropriate because the executor\u0026#39;s threads use an interruption policy that permits it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ecancel(false)\u003c/code\u003e does nothing to a running task; \u003ccode\u003ecancel(true)\u003c/code\u003e interrupts it.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption policy\\\" data-def=\\\"How a thread responds to an interrupt. Only the code that owns the thread should swallow one; everyone else should restore or propagate it.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eInterruption policy\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jcip-cancellation/cancelling-tasks/step-4\",\"title\":\"Some blocking ignores interrupts\",\"body\":\"\u003cp\u003eSocket reads ignore interrupts. Close the socket instead.\u003c/p\u003e\\n\u003cp\u003eWaiting for a \u003ccode\u003esynchronized\u003c/code\u003e lock can\u0026#39;t be interrupted.\u003c/p\u003e\\n\u003cp\u003eA custom \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eFuture\u003c/code\u003e\u003c/button\u003e can wrap the right kind of cancel.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jcip-cancellation/cancelling-tasks/step-5\",\"prompt\":\"\u003cp\u003eSome blocking doesn\u0026#39;t respond to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einterruption\u003c/button\u003e. Match each to the workaround.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Synchronous socket I/O in \u003ccode\u003ejava.io\u003c/code\u003e\",\"Waiting for an intrinsic lock\",\"Interruptible NIO channels\",\"\u003ccode\u003eSelector.select\u003c/code\u003e\"],\"right\":[\"Close the socket — blocked reads and writes throw \u003ccode\u003eSocketException\u003c/code\u003e\",\"No workaround — use explicit \u003ccode\u003eLock.lockInterruptibly\u003c/code\u003e instead\",\"Interruption itself closes the channel and throws \u003ccode\u003eClosedByInterruptException\u003c/code\u003e\",\"Call \u003ccode\u003ewakeup\u003c/code\u003e or close the selector\"],\"rightOrder\":[1,0,2,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eIntrinsic lock\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"jcip-cancellation/cancelling-tasks/step-6\",\"prompt\":\"\u003cp\u003eWhy does \u003ccode\u003etimedRun\u003c/code\u003e cancel the task in \u003ccode\u003efinally\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCleaning up in \u003ccode\u003efinally\u003c/code\u003e is a standard way to avoid leaving tasks running that nobody cares about any more.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Java requires it\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"So the task is cancelled however \u003ccode\u003eget\u003c/code\u003e ended — timeout or interruption — and cancelling a finished task is harmless\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" ari 6#39;s required for \u003ccode\u003evolatile\u003c/code\u003e writes to be visible\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Visibility\\\" data-def=\\\"Whether a write by one thread is seen by another. Without synchronization there\u0026amp;#39;s no guarantee it ever will be.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eVisibility\u003c/button\u003e doesn\u0026#39;t depend on \u003ccode\u003efinally\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"So the generator is stopped even if \u003ccode\u003esleep\u003c/code\u003e is interrupted — otherwise it would run forever\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"So \u003ccode\u003eget()\u003c/code\u003e returns an empty list on interrupt\",\"correct\":false,\"feedback\":\"\u003cp\u003eIf \u003ccode\u003esleep\u003c/code\u003e throws, \u003ccode\u003eget()\u003c/code\u003e isn\u0026#39;t reached at all; \u003ccode\u003efinally\u003c/code\u003e only guarantees the cancel.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\"]},{\"id\":\"listing-7-8\",\"key\":\"jcip-cancellation/cancelling-tasks/listing-7-8\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 7.8\u003c/strong\u003e · \u003ccode\u003etimedRun\u003c/code\u003e is called from an arbitrary caller\u0026#39;s thread. What\u0026#39;s wrong with it?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAnd if \u003ccode\u003er\u003c/code\u003e ignores \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data
