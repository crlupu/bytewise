3\",\"title\":\"instanceof needs reifiable types\",\"body\":\"\u003cp\u003e\u003ccode\u003eo instanceof List\u0026lt;String\u0026gt;\u003c/code\u003e can\u0026#39;t be checked at run time.\u003c/p\u003e\\n\u003cp\u003eThe compiler rejects it, unless the static type already guarantees it.\u003c/p\u003e\\n\u003cp\u003eTest \u003ccode\u003eo instanceof List\u0026lt;?\u0026gt;\u003c/code\u003e instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jgc-reification/reifiable-types/step-4\",\"prompt\":\"\u003cp\u003eWith \u003ccode\u003eObject o\u003c/code\u003e, which test compiles?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eo instanceof List\u0026lt;String\u0026gt;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe run time can\u0026#39;t tell a \u003ccode\u003eList\u0026lt;String\u0026gt;\u003c/code\u003e from a \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eo instanceof List\u0026lt;?\u0026gt;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jgc-reification/reifiable-types/step-5\",\"title\":\"Unchecked casts lie\",\"body\":\"\u003cp\u003e\u003ccode\u003e(List\u0026lt;String\u0026gt;) obj\u003c/code\u003e compiles with a warning.\u003c/p\u003e\\n\u003cp\u003eAt run time, it only checks that \u003ccode\u003eobj\u003c/code\u003e is a \u003ccode\u003eList\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA wrong element type slips through.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jgc-reification/reifiable-types/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;String\u0026gt; l = (List\u0026lt;String\u0026gt;) obj;\u003c/code\u003e where \u003
