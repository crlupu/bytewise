figcaption\u003eThe types say it — a car may be missing; an insurer's name may not.\u003c/figcaption\u003e\u003c/figure\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"optional-basics\",\"courseId\":\"mja-optional\",\"topicId\":\"modern-java\",\"key\":\"mja-optional/optional-basics\",\"title\":\"Optional instead of null\",\"summary\":\"`Optional\u003cT\u003e` makes \\\"there may be no value\\\" part of the type, so callers can't forget to handle it.\",\"duration\":5,\"tags\":[\"java\",\"modern java\",\"optional\",\"null\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§11.1–11.3, Optional\"},{\"book\":\"effective-java\",\"ref\":\"Item 55\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"mja-optional/optional-basics/step-1\",\"mja-optional/optional-basics/step-2\",\"mja-optional/optional-basics/step-3\",\"mja-optional/optional-basics/step-4\",\"mja-optional/optional-basics/step-5\",\"mja-optional/optional-basics/step-6\"],\"exercises\":[\"mja-optional/optional-basics/step-3\",\"mja-optional/optional-basics/step-5\",\"mja-optional/optional-basics/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"mja-optional/optional-basics/step-1\",\"title\":\"Null hides in every type\",\"body\":\"\u003cp\u003eAny reference can be null, and the type doesn\u0026#39;t say so.\u003c/p\u003e\\n\u003cp\u003eForgetting a check gives a \u003ccode\u003eNullPointerException\u003c/code\u003e far from the cause.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eOptional\u0026lt;Car\u0026gt;\u003c/code\u003e says outright that there may be no car.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"mja-optional/optional-basics/step-2\",\"title\":\"Three ways to make one\",\"body\":\"\u003cp\u003e\u003ccode\u003eOptional.of(x)\u003c/code\u003e requires a non-null \u003ccode\u003ex\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eOptional.ofNullable(x)\u003c/code\u003e adDefault)\u003c/code\u003e passes a supplier, which is called only when the optional is empty.\u003c/p\u003e\\n\u003cp\u003eFor constants it doesn\u0026#39;t matter; for anything expensive or with \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Side effect\\\" data-def=\\\"A function doing something besides computing its result — modifying state, printing, writing a field.\\\" data-book=\\\"Effective Java\\\"\u003eside effects\u003c/button\u003e, use \u003ccode\u003eorElseGet\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eorElse\u003c/code\u003e can\u0026#39;t take a method call\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt can — and that call always runs, which is the problem.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eorElse\u003c/code\u003e evaluates its argument every time, even when a value is present\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"mja-optional/optional-basics/step-6\",\"prompt\":\"\u003cp\u003eWhere is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Optional\\\" data-def=\\\"A container that holds either one value or nothing. Use as a return type for \u0026amp;quot;might be absent\u0026amp;quot; instead of \u0026lt;code\u0026gt;null\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003eOptional\u003c/code\u003e\u003c/button\u003e meant to be used?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"As a method\u0026#39;s return type when there may be no result\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"As a method parameter\",\"correct\":false,\"feed
