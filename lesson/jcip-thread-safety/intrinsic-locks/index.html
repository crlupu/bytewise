8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003esynchronized\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e void\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003e increment\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e() { count\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e++\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e; }\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eOnly one thread can hold it at a time.\u003c/p\u003e\\n\u003cp\u003eOthers block until it\u0026#39;s released.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-2\",\"prompt\":\"\u003cp\u003eTwo threads each run \u003ccode\u003ecount++\u003c/code\u003e, now inside \u003ccode\u003esynchronized\u003c/code\u003e. \u003cstrong\u003eTry to lose an update\u003c/strong\u003e — then run both threads to the end.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhile T1 holds the lock, T2 can\u0026#39;t start its read. By the time T2 reads, T1 has written —\\nso no interleaving can lose an update.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eRun T1 until it holds the lock, then try T2.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":2,\"increments\":1,\"synchronized\":true},\"goal\":{\"count\":2},\"question\":{\"prompt\":\"\u003cp\u003eWhat happens when one thread reaches \u003cem\u003eacquire lock\u003c/em\u003e while the other holds it?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"It skips the lock and carries on\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen the lock wouldn\u0026#39;t protect anything.\u003c/p\u003e\\n\"},{\"html\":\"It waits until the lock is released\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws an exception\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e for a lock is normal; the thread just blocks.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-3\",\"prompt\":\"\u003cp\u003eIn an instance method declared \u003ccode\u003esynchronized\u003c/code\u003e, which lock does the thread take?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The lock of \u003ccode\u003ethis\u003c/code\u003e — the object the method was called on\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"One global lock shared by all synchronized code\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere is no global lock — that would make every program single-threaded.\u003c/p\u003e\\n\"},{\"html\":\"A lock belonging to the method itself\",\"correct\":false,\"feedback\":\"\u003cp\u003eMethods don\u0026#39;t have locks; objects do.\u003c/p\u003e\\n\"},{\"html\":\"The lock of the class\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what a \u003ccode\u003estatic synchronized\u003c/code\u003e method takes.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-4\",\"title\":\"The lock belongs to the object\",\"body\":\"\u003cp\u003eTwo different objects have two different locks.\u003c/p\u003e\\n\u003cp\u003eThreads using them don\u0026#39;t block each other.\u003c/p\u003e\\n\u003cp\u003eShared static data needs a shared lock, like \u003ccode\u003eCounter.class\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-5\",\"prompt\":\"\u003cp\u003eAn \u003ccode\u003eAccount\u003c/code\u003e has \u003ccode\u003esynchronized void withdraw(int amt) { if (balance \u0026gt;= amt) balance -= amt; }\u003c/code\u003e\\nand a balance of 100. Two threads call \u003ccode\u003ewithdraw(80)\u003c/code\u003e on it at the same moment. What\u0026#39;s the final balance?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Check-then-act\\\" data-def=\\\"A race where you check a condition and then act on it, but the condition may change in between — e.g. \u0026lt;code\u0026gt;if (!map.containsKey(k)) map.put(k, v)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCheck-then-act\u003c/button\u003e\u003c/strong\u003e is another classic race. Holding the lock across both the check and the act\\nmakes them \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e together.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBecause \u003ccode\u003ewithdraw\u003c/code\u003e is synchronized, the check and the subtraction happen together under the lock.\u003c/p\u003e\\n\u003cp\u003eThe first thread checks 100 \u0026gt;= 80, withdraws, and leaves 20; the second then checks 20 \u0026gt;= 80, which fails, so nothing happens.\u003c/p\u003e\\n\u003cp\u003eWithout the lock, both could check 100 before either subtracts, leaving -60.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"20\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"−60\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat needs both threads to pass the \u003ccode\u003ebalance \u0026gt;= amt\u003c/code\u003e check before either subtracts. The lock makes\\ncheck and subtract one step, so the second thread sees 20 and does nothing.\u003c/p\u003e\\n\"},{\"html\":\"Either 20 or −60, depending on timing\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout \u003ccode\u003esynchronized\u003c/code\u003e that would be right — it\u0026#39;s a check-then-act race. The lock removes it.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-6\",\"title\":\"Atomics need no lock\",\"body\":\"\u003cp\u003e\u003ccode\u003eAtomicInteger.incrementAndGet()\u003c/code\u003e updates one value safely.\u003c/p\u003e\\n\u003cp\u003eIt uses the CPU\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecompare-and-swap\u003c/button\u003e instruction.\u003c/p\u003e\\n\u003cp\u003eUse locks when several fields must change together.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-7\",\"prompt\":\"\u003cp\u003eComplete the sentence.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eJava releases \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eintrinsic locks\u003c/button\u003e on every exit path, so an exception can\u0026#39;t leave a lock held.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe opposite of acquiring.\u003c/p\u003e\\n\"],\"type\":\"blank\",\"parts\":[{\"text\":\"A thread that leaves a synchronized block \",\"html\":\"A thread that leaves a synchronized block \"},{\"answers\":[\"releases\"],\"size\":8,\"choices\":[\"I/O\",\"exception\",\"modify\",\"releases\"]},{\"text\":\" the lock — even if it leaves by throwing an \",\"html\":\" the lock — even if it leaves by throwing an \"},{\"answers\":[\"exception\"],\"size\":9,\"choices\":[\"modify\",\"exception\",\"atomic\",\"liveness\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},{\"id\":\"step-8\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-8\",\"prompt\":\"\u003cp\u003eMatch each tool to when it fits best.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eAtomicInteger\u003c/code\u003e\",\"\u003ccode\u003esynchronized\u003c/code\u003e method\",\"\u003ccode\u003esynchronized (Counter.class)\u003c/code\u003e\",\"\u003ccode\u003evolatile\u003c/code\u003e\"],\"right\":[\"One counter, updated very often\",\"Several fields of one object that must change together\",\"A static field shared by every instance\",\"A flag one thread sets and others only read\"],\"rightOrder\":[3,0,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic variable\\\" data-def=\\\"\u0026amp;quot;Better volatiles\u0026amp;quot;: classes like \u0026lt;code\u0026gt;AtomicInteger\u0026lt;/code\u0026gt; with atomic compound operations such as \u0026lt;code\u0026gt;incrementAndGet\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;compareAndSet\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic variable\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\"]},{\"id\":\"step-9\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-9\",\"prompt\":\"\u003cp\u003eA subclass overrides a \u003ccode\u003esynchronized\u003c/code\u003e method and calls the superclass version. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reentrancy\\\" data-def=\\\"A thread can reacquire a lock it already holds. Java\u0026amp;#39;s intrinsic locks and \u0026lt;code\u0026gt;ReentrantLock\u0026lt;/code\u0026gt; are reentrant, so a synchronized method can call another one.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eReentrancy\u003c/button\u003e\u003c/strong\u003e means locks are acquired per thread, not per call. The JVM keeps an owner and a count; the lock is\\nreleased when the count returns to zero.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eCalling \u003ccode\u003esuper.doSomething()\u003c/code\u003e from the subclass\u0026#39;s synchronized method needs the same lock — \u003ccode\u003ethis\u003c/code\u003e — that the thread already holds.\u003c/p\u003e\\n\u003cp\u003eIntrinsic locks are reentrant: the JVM records the owning thread and a count, so the owner can acquire the lock again and it\u0026#39;s released only when the count returns to zero.\u003c/p\u003e\\n\u003cp\u003eWithout reentrancy, this ordinary pattern would deadlock against itself.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It deadlocks — the thread waits for a lock it already holds\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would happen if Java\u0026#39;s locks weren\u0026#39;t reentrant. They count acquisitions per owning thread instead.\u003c/p\u003e\\n\"},{\"html\":\"It works — intrinsic locks are reentrant, so a thread can take a lock it already holds\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eIntrinsic lock\u003c/button\u003e\"]}]},\"courseTitle\":\"Thread safety\",\"next\":{\"id\":\"guarding-state\",\"courseId\":\"jcip-thread-safety\",\"topicId\":\"jcip\",\"key\":\"jcip-thread-safety/guarding-state\",\"title\":\"Guarding state with locks\",\"summary\":\"Every shared variable needs one lock, held on every access — and related variables need the same lock.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"locks\",\"invariants\",\"guardedby\",\"synchronized\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§2.4, Guarding State with Locks\"}]
