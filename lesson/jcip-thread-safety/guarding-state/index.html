":[\"jcip-thread-safety/guarding-state/step-1\",\"jcip-thread-safety/guarding-state/step-2\",\"jcip-thread-safety/guarding-state/step-3\",\"jcip-thread-safety/guarding-state/step-4\",\"jcip-thread-safety/guarding-state/step-5\",\"jcip-thread-safety/guarding-state/step-6\",\"jcip-thread-safety/guarding-state/step-7\",\"jcip-thread-safety/guarding-state/step-8\"],\"exercises\":[\"jcip-thread-safety/guarding-state/step-2\",\"jcip-thread-safety/guarding-state/step-4\",\"jcip-thread-safety/guarding-state/step-5\",\"jcip-thread-safety/guarding-state/step-7\",\"jcip-thread-safety/guarding-state/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-thread-safety/guarding-state/step-1\",\"title\":\"Same lock, every access\",\"body\":\"\u003cp\u003eEach shared mutable variable needs one lock.\u003c/p\u003e\\n\u003cp\u003eEvery read and every write must hold that lock.\u003c/p\u003e\\n\u003cp\u003eLocking only the writes isn\u0026#39;t enough.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-thread-safety/guarding-state/step-2\",\"prompt\":\"$13\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Invariant\\\" data-def=\\\"A condition that must always hold for an object to be valid, e.g. \u0026lt;code\u0026gt;lower \u0026amp;lt;= upper\u0026lt;/code\u0026gt;. Variables in the same invariant must be updated atomically.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einvariant\u003c/button\u003e \u0026quot;\u003ccode\u003elastFactors\u003c/code\u003e are the factors of \u003ccode\u003elastNumber\u003c/code\u003e\u0026quot; spans both fields.\\n\u003cstrong\u003eTo preserve state consistency, update related state variables in a single atomic operation.\u003c/strong\u003e\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach \u003ccode\u003eAtomicReference\u003c/code\u003e update is atomic on its own, but the servlet updates two of them in sequence.\u003c/p\u003e\\n\u003cp\u003eBetween \u003ccode\u003elastNumber.set\u003c/code\u003e and \u003ccode\u003elastFactors.set\u003c/code\u003e, another thread can read the new number with the old factors and return wrong results.\u003c/p\u003e\\n\u003cp\u003eThe invariant spans both variables, so both must be read and written under one lock — or combined into one immutable object behind a single reference.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Yes — each field is atomic\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach update is atomic on its own, but the pair isn\u0026#39;t updated atomically together.\u003c/p\u003e\\n\"},{\"html\":\"No — another thread can see the new number with the old factors, between the two \u003ccode\u003eset\u003c/code\u003e calls\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-thread-safety/guarding-state/step-3\",\"title\":\"Invariants need one lock\",\"body\":\"\u003cp\u003eSome variables must stay consistent with each other.\u003c/p\u003e\\n\u003cp\u003eGuard all of them with the same lock.\u003c/p\u003e\\n\u003cp\u003eTwo separately safe fields can still be inconsistent together.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-thread-safety/guarding-state/step-4\",\"prompt\":\"\u003cp\u003eComplete the rule for \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Invariant\\\" data-def=\\\"A condition that must always hold for an object to be valid, e.g. \u0026lt;code\u0026gt;lower \u0026amp;lt;= upper\u0026lt;/code\u0026gt;. Variables in the same invariant must be updated atomically.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einvariants\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"For every invariant that involves more than one variable, all the variables in it must be guarded by the \",\"html\":\"For every invariant that involves more than one variable, all the variables in it must be \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Guarded by\\\" data-def=\\\"The lock that must be held to access a variable. Every access — read or write — must hold the same lock.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eguarded by\u003c/button\u003e the \"},{\"answers\":[\"same\"],\"size\":4,\"choices\":[\"modify\",\"same\",\"liveness\",\"I/O\"]},{\"text\":\" lock.\",\"html\":\" lock.\"}],\"code\":false,\"caseSensitive\":false},{\"id\":\"step-5\",\"key\":\"jcip-thread-safety/guarding-state/step-5\",\"prompt\":\"\u003cp\u003eCan you make a class \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread-safe\u003c/button\u003e by declaring every method \u003ccode\u003esynchronized\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIt may also hurt performance badly. Synchronization has to match the operations that must be \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Not necessarily — compound actions that call several methods, like check-then-act across calls, still race\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, always\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eif (!vector.contains(e)) vector.add(e);\u003c/code\u003e is a race even though both methods are synchronized.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compound action\\\" data-def=\\\"A sequence of operations that must execute atomically to be correct, like check-then-act or read-modify-write.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompound action\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Check-then-act\\\" data-def=\\\"A race where you check a condition and then act on it, but the condition may change in between — e.g. \u0026lt;code\u0026gt;if (!map.containsKey(k)) map.put(k, v)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCheck-then-act\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"jcip-thread-safety/guarding-state/step-6\",\"title\":\"Locks are agreements\",\"body\":\"\u003cp\u003eHolding a lock doesn\u0026#39;t block access to fields.\u003c/p\u003e\\n\u003cp\u003eIt only blocks others taking the same lock.\u003c/p\u003e\\n\u003cp\u003eDocument the rule with \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Guarded by\\\" data-def=\\\"The lock that must be held to access a variable. Every access — read or write — must hold the same lock.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003e@GuardedBy\u003c/code\u003e\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/guarding-state/step-7\",\"prompt\":\"\u003cp\u003eMatch each practice to its purpose.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Annotating a field \u003ccode\u003e@GuardedBy(\u0026quot;this\u0026quot;)\u003c/code\u003e\",\"Keeping state private\",\"Holding the lock across read and write\"],\"right\":[\"Documents which lock protects it, for maintainers and tools\",\"Ensures only your code — which follows the locking rules — can touch it\",\"Makes a compound action atomic\"],\"rightOrder\":[1,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compound action\\\" data-def=\\\"A sequence of operations that must execute atomically to be correct, like check-then-act or read-modify-write.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompound action\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},{\"id\":\"step-8\",\"key\":\"jcip-thread-safety/guarding-state/step-8\",\"prompt\":\"\u003cp\u003eDoes acquiring an object\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eintrinsic lock\u003c/button\u003e stop other threads from accessing that object\u0026#39;s fields?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eIntrinsic locks are purely cooperative: holding an object\u0026#39;s lock only stops other threads from acquiring that same lock.\u003c/p\u003e\\n\u003cp\u003eCode that reads or writes the fields without synchronizing isn\u0026#39;t affected at all.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread safety\u003c/button\u003e comes from every access to shared state using the same lock, consistently — which is why documenting the guarding lock matters.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — it only stops other threads from acquiring the same lock; fields are protected only if everyone agrees to take it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes — the object becomes inaccessible to other threads\",\"correct\":false,\"feedback\":\"\u003cp\u003eLocks are a convention. Unsynchronized code can still read and write the fields.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Thread safety\",\"next\":{\"id\":\"liveness-and-performance\",\"courseId\":\"jcip-thread-safety\",\"topicId\":\"jcip\",\"key\":\"jcip-thread-safety/liveness-and-performance\",\"title\":\"Liveness and performance of locking\",\"summary\":\"Synchronizing a whole method serialises everyone — narrow the lock to what must be atomic, and never hold it during slow work.\",\"duration\":5,\"tags\":[\"java\",\"
