-conditions/step-9\",\"jcip-thread-safety/race-conditions/step-10\",\"jcip-thread-safety/race-conditions/step-11\"],\"exercises\":[\"jcip-thread-safety/race-conditions/step-2\",\"jcip-thread-safety/race-conditions/step-3\",\"jcip-thread-safety/race-conditions/step-4\",\"jcip-thread-safety/race-conditions/step-5\",\"jcip-thread-safety/race-conditions/step-7\",\"jcip-thread-safety/race-conditions/step-8\",\"jcip-thread-safety/race-conditions/step-9\",\"jcip-thread-safety/race-conditions/step-11\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-thread-safety/race-conditions/step-1\",\"title\":\"One line, three steps\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-thread-safety/race-conditions/step-2\",\"prompt\":\"\u003cp\u003ePut the steps of \u003ccode\u003ecount++\u003c/code\u003e in the order a thread performs them.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRead, modify, write. Each step is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e on its own; the sequence as a whole is not.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Read: \u003ccode\u003etmp = count\u003c/code\u003e\",\"Add: \u003ccode\u003etmp = tmp + 1\u003c/code\u003e\",\"Write: \u003ccode\u003ecount = tmp\u003c/code\u003e\"],\"start\":[1,0,2]},{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/race-conditions/step-3\",\"prompt\":\"\u003cp\u003eTwo threads each call \u003ccode\u003eincrement()\u003c/code\u003e once on a shared counter that starts at 0. Which final values of \u003ccode\u003ecount\u003c/code\u003e are possible?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e2 when the threads take turns. 1 when both read 0 before either writes — then both write 1,\\nand one update is lost. Let\u0026#39;s make that happen.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach \u003ccode\u003ecount++\u003c/code\u003e is read, add, write.\u003c/p\u003e\\n\u003cp\u003eIf one thread finishes before the other starts, the second reads 1 and writes 2.\u003c/p\u003e\\n\u003cp\u003eIf both read 0 before either writes, both compute 1 and both write 1: one increment is lost.\u003c/p\u003e\\n\u003cp\u003eNo other result is possible from two increments of 0, so the answers are 1 or 2.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhat if both threads read \u003ccode\u003ecount\u003c/code\u003e before either writes?\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"0\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach thread writes at least once, and every write stores a value of 1 or more.\u003c/p\u003e\\n\"},{\"html\":\"1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"2\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"3\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere are only two increments in total, so the value can\u0026#39;t exceed 2.\u003c/p\u003e\\n\"}],\"multiple\":true},{\"id\":\"step-4\",\"key\":\"jcip-thread-safety/race-conditions/step-4\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eLose an update.\u003c/strong\u003e Run the threads one instruction at a time, in any order, so that both finish\\nbut \u003ccode\u003ecount\u003c/code\u003e ends at \u003cstrong\u003e1\u003c/strong\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eBoth threads read 0, both computed 1, both wrote 1. The second write overwrote the first:\\na \u003cstrong\u003elost update\u003c/strong\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet T1 read \u003ccode\u003ecount\u003c/code\u003e first.\u003c/p\u003e\\n\",\"\u003cp\u003eBefore T1 writes, let T2 read \u003ccode\u003ecount\u003c/code\u003e too. Both now hold 0.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":2,\"increments\":1},\"goal\":{\"count\":1},\"question\":{\"prompt\":\"\u003cp\u003eWhat had to happen for the update to be lost?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Both threads wrote at exactly the same instant\",\"correct\":false,\"feedback\":\"\u003cp\u003eWrites take turns; the problem is that both wrote a value based on the same old read.\u003c/p\u003e\\n\"},{\"html\":\"One thread ran completely before the other started\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen the second thread reads 1 and writes 2 — nothing is lost.\u003c/p\u003e\\n\"},{\"html\":\"Both threads read \u003ccode\u003ecount\u003c/code\u003e before either wrote it back\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},{\"id\":\"step-5\",\"key\":\"jcip-thread-safety/race-conditions/step-5\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eThree threads.\u003c/strong\u003e Each increments once, so the right answer is 3. Can you make it end at \u003cstrong\u003e1\u003c/strong\u003e —\\nlosing two updates?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith \u003cem\u003en\u003c/em\u003e threads you can lose up to \u003cem\u003en − 1\u003c/em\u003e updates. Real programs increment millions of times,\\nso the final count can be far off — and different on every run.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eGet all three threads to read before any of them writes.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":3,\"increments\":1},\"goal\":{\"count\":1},\"question\":{\"prompt\":\"\u003cp\u003eFor \u003ccode\u003ecount\u003c/code\u003e to end at 1, what must be true of the last thread to write?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"It was the first thread to start\",\"correct\":false,\"feedback\":\"\u003cp\u003eStart order doesn\u0026#39;t matter — what matters is the value it read.\u003c/p\u003e\\n\"},{\"html\":\"It read \u003ccode\u003ecount\u003c/code\u003e as 0\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It ran after the other two had finished\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen it would read 2 and write 3.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"jcip-thread-safety/race-conditions/step-6\",\"title\":\"Race conditions\",\"body\":\"\u003cp\u003eWhen the result depends on timing, it\u0026#39;s a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Race condition\\\" data-def=\\\"When the correctness of a result depends on the lucky timing or interleaving of threads.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003erace condition\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eCode that must not interleave is a critical section.\u003c/p\u003e\\n\u003cp\u003eRaces are rare and hard to reproduce in tests.\u003c/p\u003e\\n\u003cp\u003eSo design them out instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/race-conditions/step-7\",\"prompt\":\"\u003cp\u003eWhich of these make \u003ccode\u003eincrement()\u003c/code\u003e safe for many threads?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eBoth fixes make the three steps behave as one: \u003ccode\u003esynchronized\u003c/code\u003e with a lock, \u003ccode\u003eAtomicInteger\u003c/code\u003e with\\na single hardware \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecompare-and-swap\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Declare \u003ccode\u003ecount\u003c/code\u003e as \u003ccode\u003evolatile\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e makes each read and write visible to other threads, but the read-add-write is\\nstill three separate steps. Two threads can still read the same value.\u003c/p\u003e\\n\"},{\"html\":\"Use an \u003ccode\u003eAtomicInteger\u003c/code\u003e and call \u003ccode\u003eincrementAndGet()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Run the program on a single-core machine\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe scheduler can still pause a thread between the read and the write, and switch to another.\u003c/p\u003e\\n\"},{\"html\":\"Declare the method \u003ccode\u003esynchronized\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic variable\\\" data-def=\\\"\u0026amp;quot;Better volatiles\u0026amp;quot;: classes like \u0026lt;code\u0026gt;AtomicInteger\u0026lt;/code\u0026gt; with atomic compound operations such as \u0026lt;code\u0026gt;incrementAndGet\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;compareAndSet\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic variable\u003c/button\u003e\"]},{\"id\":\"step-8\",\"key\":\"jcip-thread-safety/race-conditions/step-8\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Race condition\",\"Atomic\",\"Critical section\",\"Lost update\"],\"right\":[\"The result depends on the timing of threads\",\"Happens all at once; no other thread sees it half-done\",\"Code that must not run in two threads at the same time\",\"One thread\u0026#39;s write silently overwrites another\u0026#39;s\"],\"rightOrder\":[1,3,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Race condition\\\" data-def=\\\"When the correctness of a result depends on the lucky timing or interleaving of threads.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eRace condition\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},{\"id\":\"step-9\",\"key\":\"jcip-thread-safety/race-conditions/step-9\",\"prompt\":\"\u003cp\u003eComplete the sentence.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe middle step changes the value.\u003c/p\u003e\\n\"],\"type\":\"blank\",\"parts\":[{\"text\":\"`count++` is a read-\",\"html\":\"\u003ccode\u003ecount++\u003c/code\u003e is a read-\"},{\"answers\":[\"modify\"],\"size\":6,\"choices\":[\"I/O\",\"modify\",\"liveness\",\"releases\"]},{\"text\":\"-write sequence, so it is not \",\"html\":\"-write sequence, so it is not \"},{\"answers\":[\"atomic\"],\"size\":6,\"choices\":[\"liveness\",\"modify\",\"same\",\"atomic\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},{\"type\":\"explanation\",\"id\":\"step-10\",\"key\":\"jcip-thread-safety/race-conditions/step-10\",\"title\":\"Check-then-act races too\",\"body\":\"\u003cp\u003e\u0026quot;If it\u0026#39;s null, create it\u0026quot; is two steps.\u003c/p\u003e\\n\u003cp\u003eTwo threads can both see \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThen both create an object.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-11\",\"key\":\"jcip-thread-safety/race-conditions/step-11\",\"prompt\":\"\u003cp\u003eTwo threads call \u003ccode\u003egetInstance()\u003c/code\u003e at the same moment on an object that\u0026#39;s not yet created. What can happen?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Check-then-act\\\" data-def=\\\"A race where you check a condition and then act on it, but the condition may change in between — e.g. \u0026lt;code\u0026gt;if (!map.containsKey(k)) map.put(k, v)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003echeck-then-act\u003c/button\u003e\u003c/strong\u003e, the other common race: you observe something (it\u0026#39;s null), then act on it — but the\\nobservation may be stale by the time you act.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBoth threads check \u003ccode\u003einstance == null\u003c/code\u003e before either assigns, so both create an \u003ccode\u003eExpensiveObject\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEach caller gets a different object, which matters when it\u0026#39;s meant to be a singleton — a registry, a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e, a connection.\u003c/p\u003e\\n\u003cp\u003eThis is check-then-act: the decision is based on an observation that may be out of date by the time you act. Synchronizing the method makes check and act \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"Nothing — the second thread always sees the first one\u0026#39;s object\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing makes the check and the assignment one step.\u003c/p\u003e\\n\"},{\"html\":\"Both see \u003ccode\u003enull\u003c/code\u003e, both create an object, and the callers end up with two different instances\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Thread safety\",\"next\":{\"id\":\"intrinsic-locks\",\"courseId\":\"jcip-thread-safety\",\"topicId\":\"jcip\",\"key\":\"jcip-thread-safety/intrinsic-locks\",\"title\":\"Intrinsic locks\",\"summary\":\"How an intrinsic lock turns read-add-write into one step, and what it does and doesn't protect.\",\"duration\":8,\"tags\":[\"java\",\"threads\",\"synchronized\",\"locks\",\"monitor\",\"atomic\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§2.3, Locking\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"jcip-thread-safety/intrinsic-locks/step-1\",\"jcip-thread-safety/intrinsic-locks/step-2\",\"jcip-thread-safety/intrinsic-locks/step-3\",\"jcip-thread-safety/intrinsic-locks/step-4\",\"jcip-thread-safety/intrinsic-locks/step-5\",\"jcip-thread-safety/intrinsic-locks/step-6\",\"jcip-thread-safety/intrinsic-locks/step-7\",\"jcip-thread-safety/intrinsic-locks/step-8\",\"jcip-thread-safety/intrinsic-locks
