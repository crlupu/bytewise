span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"why-concurrency\",\"courseId\":\"jcip-thread-safety\",\"topicId\":\"jcip\",\"key\":\"jcip-thread-safety/why-concurrency\",\"title\":\"Why concurrency — and why it's hard\",\"summary\":\"Threads buy responsiveness and throughput, and bring three kinds of risk with them.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"threads\",\"safety\",\"liveness\",\"performance\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"Chapter 1, Introduction\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"jcip-thread-safety/why-concurrency/step-1\",\"jcip-thread-safety/why-concurrency/step-2\",\"jcip-thread-safety/why-concurrency/step-3\",\"jcip-thread-safety/why-concurrency/step-4\",\"jcip-thread-safety/why-concurrency/step-5\",\"jcip-thread-safety/why-concurrency/step-6\",\"jcip-thread-safety/why-concurrency/step-7\",\"jcip-thread-safety/why-concurrency/listing-1-1\",\"jcip-thread-safety/why-concurrency/listing-1-2\"],\"exercises\":[\"jcip-thread-safety/why-concurrency/step-3\",\"jcip-thread-safety/why-concurrency/step-4\",\"jcip-thread-safety/why-concurrency/step-6\",\"jcip-thread-safety/why-concurrency/step-7\",\"jcip-thread-safety/why-concurrency/listing-1-1\",\"jcip-thread-safety/why-concurrency/listing-1-2\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-thread-safety/why-concurrency/step-1\",\"title\":\"Your code is already concurrent\",\"body\":\"\u003cp\u003eServlets, timers and GUI frameworks call your code from their own threads.\u003c/p\u003e\\n\u003cp\u003eSo any state you touch may be reached by several threads at once.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-thread-safety/why-concurrency/step-2\",\"title\":\"Threads help, and threads hurt\",\"body\":\"\u003cp\u003eThreads use every CPU core and keep UIs responsive.\u003c/p\u003e\\n\u003cp\u003eBut they bring three risks.\u003c/p\u003e\\n\u003cp\u003eSafety: wrong results.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Liveness\\\" data-def=\\\"\u0026amp;quot;Something good eventually happens.\u0026amp;quot; Deadlock, livelock and starvation are liveness failures.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLiveness\u003c/button\u003e: something never happens.\u003c/p\u003e\\n\u003cp\u003ePerformance: everything gets slow.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/why-concurrency/step-3\",\"prompt\":\"\u003cp\u003eMatch each kind of risk to what goes wrong.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Safety hazard\",\"Liveness hazard\",\"Performance hazard\"],\"right\":[\"Something bad happens — data is corrupted or a wrong result is returned\",\"Something good never happens — a thread waits forever, as in deadlock\",\"It happens, but too slowly — context switches, lock contention, poor scaling\"],\"rightOrder\":[1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Liveness\\\" data-def=\\\"\u0026amp;quot;Something good eventually happens.\u0026amp;quot; Deadlock, livelock and starvation are liveness failures.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLiveness\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Context switch\\\" data-def=\\\"The CPU stops one thread and starts another, saving and restoring registers and disturbing caches. Costs thousands of cycles.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContext switch\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jcip-thread-safety/why-concurrency/step-4\",\"prompt\":\"\u003cp\u003eA web framework calls your servlet\u0026#39;s \u003ccode\u003eservice\u003c/code\u003e method. How many threads might call it at the same time?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s why a servlet\u0026#39;s fields are shared mutable state, and why frameworks make your code concurrent whether you planned it or not.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Many — the container serves concurrent requests on different threads, through the same servlet instance\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"One — each servlet runs on its own thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe container shares one servlet instance between all request threads.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-thread-safety/why-concurrency/step-5\",\"title\":\"Concurrency bugs hide\",\"body\":\"\u003cp\u003eThey depend on exact timing.\u003c/p\u003e\\n\u003cp\u003eThey appear rarely, and often only under real load.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why they\u0026#39;re so costly.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-thread-safety/why-concurrency/step-6\",\"prompt\":\"\u003cp\u003eWhich is the real reason concurrency bugs are so costly?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They depend on timing, so they appear rarely, unpredictably and often only under production load\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Compilers report them as warnings that people ignore\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe compiler can\u0026#39;t detect most of them at all.\u003c/p\u003e\\n\"},{\"html\":\"They only happen in old versions of Java\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Java Memory Model\\\" data-def=\\\"The rules saying when a write by one thread is guaranteed to be visible to another, built on the happens-before relation.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eJava memory model\u003c/button\u003e makes them well-defined, but they still happen in every version.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/why-concurrency/step-7\",\"prompt\":\"\u003cp\u003eComplete the summary of the risks.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Safety means nothing bad ever happens; \",\"html\":\"Safety means nothing bad ever happens; \"},{\"answers\":[\"liveness\"],\"size\":8,\"choices\":[\"modify\",\"liveness\",\"exception\",\"I/O\"]},{\"text\":\" means something good eventually happens.\",\"html\":\" means something good eventually happens.\"}],\"code\":false,\"caseSensitive\":false},{\"id\":\"listing-1-1\",\"key\":\"jcip-thread-safety/why-concurrency/listing-1-1\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 1.1\u0
