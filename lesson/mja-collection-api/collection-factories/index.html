_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"collection-factories\",\"courseId\":\"mja-collection-api\",\"topicId\":\"modern-java\",\"key\":\"mja-collection-api/collection-factories\",\"title\":\"List.of, Set.of and Map.of\",\"summary\":\"The factory methods make small immutable collections that reject nulls and, for sets and maps, duplicates.\",\"duration\":5,\"tags\":[\"java\",\"modern java\",\"collections\",\"immutable\",\"list of\",\"map of\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§8.1, Collection factories\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"mja-collection-api/collection-factories/step-1\",\"mja-collection-api/collection-factories/step-2\",\"mja-collection-api/collection-factories/step-3\",\"mja-collection-api/collection-factories/step-4\",\"mja-collection-api/collection-factories/step-5\",\"mja-collection-api/collection-factories/step-6\",\"mja-collection-api/collection-factories/step-7\"],\"exercises\":[\"mja-collection-api/collection-factories/step-2\",\"mja-collection-api/collection-factories/step-4\",\"mja-collection-api/collection-factories/step-6\",\"mja-collection-api/collection-factories/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"mja-collection-api/collection-factories/step-1\",\"title\":\"Small collections in one line\",\"body\":\"\u003cp\u003e\u003ccode\u003eList.of(\u0026quot;a\u0026quot;, \u0026quot;b\u0026quot;)\u003c/code\u003e, \u003ccode\u003eSet.of(1, 2)\u003c/code\u003e and \u003ccode\u003eMap.of(\u0026quot;k\u0026quot;, 1)\u003c/code\u003e create collections directly.\u003c/p\u003e\\n\u003cp\u003eThey\u0026#39;re \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e: \u003ccode\u003eadd\u003c/code\u003e, \u003ccode\u003eremove\u003c/code\u003e and \u003ccode\u003eset\u003c/code\u003e throw.\u003c/p\u003e\\n\u003cp\u003eFor more than ten map entries, use \u003ccode\u003eMap.ofEntries\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"mja-collection-api/collection-factories/step-2\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eUnsupportedOperationException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003elist\u003c/code\u003e becomes \u003ccode\u003e[1, 2, 3]\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eList.of\u003c/code\u003e lists are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eadd\u003c/code\u003e is part of the \u003ccode\u003eList\u003c/code\u003e interface, so the call compiles; it fails at run time.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"mja-collection-api/collection-factories/step-3\",\"title\":\"No nulls, no duplicates\",\"body\":\"\u003cp\u003eThe factories throw \u003ccode\u003eNullPointerException\u003c/code\u003e for a null element.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eSet.of\u003c/code\u003e and \u003ccode\u003eMap.of\u003c/code\u003e throw \u003ccode\u003eIllegalArgumentException\u003c/code\u003e for duplicates.\u003c/p\u003e\\n\u003cp\u003eEven \u003ccode\u003econtains(null)\u003c/code\u003e throws on these lists.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"mja-collection-api/collection-factories/step-4\",\"prompt\":\"\u003cp\u003eMatch each call with what happens.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e collections from \u003ccode\u003eList.of\u003c/code\u003e and friends reject \u003ccode\u003enull\u003c/code\u003e entirely: a null element or key throws \u003ccode\u003eNullPointerException\u003c/code\u003e, and so does even asking \u003ccode\u003econtains(null)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eSet.of\u003c/code\u003e and \u003ccode\u003eMap.of\u003c/code\u003e also reject duplicates at creation with \u003ccode\u003eIllegalArgumentException\u003c/code\u003e, since a duplicate there almost always signals a bug.\u003c/p\u003e\\n\u003cp\u003eLists may contain duplicates, so \u003ccode\u003eList.of(1, 1)\u003c/code\u003e is fine.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eList.of(1, null)\u003c/code\u003e\",\"\u003ccode\u003eMap.of(\u0026quot;a\u0026quot;, 1, \u0026quot;a\u0026quot;, 2)\u003c/code\u003e\",\"\u003ccode\u003eList.of(1).contains(null)\u003c/code\u003e\",\"\u003ccode\u003eList.of(1, 1)\u003c/code\u003e\"],\"right\":[\"\u003ccode\u003eNullPointerException\u003c/code\u003e\",\"\u003ccode\u003eIllegalArgumentException\u003c/code\u003e\",\"\u003ccode\u003eNullPointerException\u003c/code\u003e, too\",\"\u003ccode\u003e[1, 1]\u003c/code\u003e — lists allow duplicates\"],\"rightOrder\":[2,1,3,0]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"mja-collection-api/collection-factories/step-5\",\"title\":\"Arrays.asList is different\",\"body\":\"\u003cp\u003e\u003ccode\u003eArrays.asList\u003c/code\u003e is a fixed-size view of an array.\u003c/p\u003e\\n\u003cp\u003eYou can \u003ccode\u003eset\u003c/code\u003e elements, which writes through to the array.\u003c/p\u003e\\n\u003cp\u003eYou can\u0026#39;t \u003ccode\u003eadd\u003c/code\u003e or \u003ccode\u003eremove\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"mja-collection-api/collection-factories/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; l = Arrays.asList(1, 2, 3);\u003c/code\u003e Which calls work?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eArrays.asList\u003c/code\u003e returns a fixed-size list backed by the array you pass in.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eset\u003c/code\u003e writes straight through to the array, so it works; \u003ccode\u003eadd\u003c/code\u003e and \u003ccode\u003eremove\u003c/code\u003e would need to change the array\u0026#39;s length, which is impossible, so they throw \u003ccode\u003eUnsupportedOperationException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eFor a resizable list, copy it: \u003ccode\u003enew ArrayList\u0026lt;\u0026gt;(Arrays.asList(...))\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003el.add(4)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe list is fixed-size.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003el.set(0, 9)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003el.remove(0)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe list is fixed-size.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"mja-collection-api/collection-factories/step-7\",\"prompt\":\"\u003cp\u003eMake a mutable copy you can add to.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"List\u003cString\u003e names = new \"},{\"answers\":[\"ArrayList\"],\"size\":9,\"choices\":[\"BinaryOperator\",\"super\",\"computeIfAbsent\",\"ArrayList\"]},{\"text\":\"\u003c\u003e(List.of(\\\"Ann\\\", \\\"Bo\\\"));\"}],\"code\":true,\"caseSensitive\":true}]},\"courseTitle\":\"Collection API enhancements\",\"next\":{\"id\":\"list-and-map-methods\",\"courseId\":\"mja-collection-api\",\"topicId\":\"modern-java\",\"key\":\"mja-collection-api/list-and-map-methods\",\"title\":\"removeIf, replaceAll, compute and merge\",\"summary\":\"Collections gained methods that replace error-prone loops — removing while iterating, and updating map entries in one call.\",\"duration\":6,\"tags\":[\"java\",\"modern java\",\"collections\",\"removeif\",\"map\",\"merge\",\"computeifabsent\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§8.2–8.3, Working with List, Set and Map\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"mja-collection-api/list-and-map-methods/step-1\",\"mja-collection-api/list-and-map-methods/step-2\",\"mja-collection-api/list-and-map-methods/step-3\",\"mja-collection-api/list-and-map-methods/step-4\",\"mja-col
