=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\"]}]},\"courseTitle\":\"Garbage collection\",\"next\":{\"id\":\"choosing-a-collector\",\"courseId\":\"jperf-gc\",\"topicId\":\"java-performance\",\"key\":\"jperf-gc/choosing-a-collector\",\"title\":\"Choosing a collector\",\"summary\":\"Parallel GC maximizes throughput, G1 balances throughput with pause targets, and ZGC and Shenandoah keep pauses under a few milliseconds.\",\"duration\":6,\"tags\":[\"java\",\"performance\",\"garbage collection\",\"g1\",\"zgc\",\"shenandoah\",\"parallel gc\"],\"sources\":[{\"book\":\"java-performance\",\"ref\":\"§5.2, GC Algorithms\"},{\"book\":\"java-performance\",\"ref\":\"Chapter 6, Garbage Collection Algorithms\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jperf-gc/choosing-a-collector/step-1\",\"jperf-gc/choosing-a-collector/step-2\",\"jperf-gc/choosing-a-collector/step-3\",\"jperf-gc/choosing-a-collector/step-4\",\"jperf-gc/choosing-a-collector/step-5\",\"jperf-gc/choosing-a-collector/step-6\"],\"exercises\":[\"jperf-gc/choosing-a-collector/step-4\",\"jperf-gc/choosing-a-collector/step-5\",\"jperf-gc/choosing-a-collector/step-6\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-intern
