\u003eforEach\u003c/code\u003e, and the real work — updating the map — happens as a side effect inside the lambda.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s a loop in disguise: harder to read than a loop, and unsafe if anyone adds \u003ccode\u003e.parallel()\u003c/code\u003e, because \u003ccode\u003eHashMap.merge\u003c/code\u003e isn\u0026#39;t thread-safe.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ecollect(groupingBy(..., counting()))\u003c/code\u003e describes the result directly and lets the library build the map safely.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles and works. It just doesn\u0026#39;t use streams the way they\u0026#39;re designed to be used.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003emerge\u003c/code\u003e isn\u0026#39;t allowed in streams\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s iterative code in disguise — all the work happens as a side effect in \u003ccode\u003eforEach\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Side effect\\\" data-def=\\\"A function doing something besides computing its result — modifying state, printing, writing a field.\\\" data-book=\\\"Effective Java\\\"\u003eSide effect\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-lambdas/side-effect-free-streams/step-3\",\"title\":\"Collectors build results\",\"body\":\"\u003cp\u003e\u003ccode\u003etoList()\u003c/code\u003e, \u003ccode\u003etoMap()\u003c/code\u003e and \u003ccode\u003egroupingBy()\u003c/code\u003e gather results.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ejoining()\u003c/code\u003e builds a string.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003eforEach\u0
