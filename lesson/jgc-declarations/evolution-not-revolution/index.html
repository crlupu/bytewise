ations/evolution-not-revolution/step-1\",\"jgc-declarations/evolution-not-revolution/step-2\",\"jgc-declarations/evolution-not-revolution/step-3\",\"jgc-declarations/evolution-not-revolution/step-4\",\"jgc-declarations/evolution-not-revolution/step-5\"],\"exercises\":[\"jgc-declarations/evolution-not-revolution/step-2\",\"jgc-declarations/evolution-not-revolution/step-4\",\"jgc-declarations/evolution-not-revolution/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jgc-declarations/evolution-not-revolution/step-1\",\"title\":\"Erasure keeps old code working\",\"body\":\"\u003cp\u003eGeneric types exist only at compile time.\u003c/p\u003e\\n\u003cp\u003eThe compiler erases \u003ccode\u003eList\u0026lt;String\u0026gt;\u003c/code\u003e to \u003ccode\u003eList\u003c/code\u003e in the bytecode.\u003c/p\u003e\\n\u003cp\u003eSo a pre-generics library and generic code can call each other.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jgc-declarations/evolution-not-revolution/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eGeneric type arguments are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eerased\u003c/button\u003e during compilation, so at run time both lists are instances of the same class, \u003ccode\u003ejava.util.ArrayList\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThere\u0026#39;s no \u003ccode\u003eArrayList\u0026lt;String\u0026gt;.class\u003c/code\u003e — only \u003ccode\u003eArrayList.class\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThis is what let generic code interoperate with pre-generics libraries without recompiling them, but it\u0026#39;s also why the JVM can\u0026#39;t check generic types for you at run time.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAfter \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eerasure\u003c/button\u003e, both are plain \u003ccode\u003eArrayList\u003c/code\u003e at run time.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jgc-declarations/evolution-not-revolution/step-3\",\"title\":\"Unchecked warnings mark the gaps\",\"body\":\"\u003cp\u003ePassing a raw \u003ccode\u003eList\u003c/code\u003e where a \u003ccode\u003eList\u0026lt;String\u0026gt;\u003c/code\u003e is expected compiles with an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked warning\\\" data-def=\\\"The compiler saying it can\u0026amp;#39;t verify type safety at this point. Eliminate them, or prove safety and suppress with \u0026lt;code\u0026gt;@SuppressWarnings(\u0026amp;quot;unchecked\u0026amp;quot;)\u0026lt;/code\u0026gt; on the smallest scope.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked warning\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eThe compiler can\u0026#39;t prove the types are right.\u003c/p\u003e\\n\u003cp\u003eIf they\u0026#39;re wrong, the error comes later, somewhere else.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jgc-declarations/evolution-not-revolution/step-4\",\"prompt\":\"\u003cp\u003eWhere does this fail?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThis is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Heap pollution\\\" data-def=\\\"A variable of a parameterized type refers to an object of a different type — possible with generic varargs, and causes a surprise \u0026lt;code\u0026gt;ClassCastException\u0026lt;/code\u0026gt; later.\\\" data-book=\\\"Effective Java\\\"\u003eheap pollution\u003c/button\u003e. The failure shows up far from the bug.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eLine 2 assigns to a raw \u003ccode\u003eList\u003c/code\u003e, which turns off generic checks, and line 3 adds an \u003ccode\u003eInteger\u003c/code\u003e with only an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked warning\\\" data-def=\\\"The compiler saying it can\u0026amp;#39;t verify type safety at this point. Eliminate them, or prove safety and suppress with \u0026lt;code\u0026gt;@SuppressWarnings(\u0026amp;quot;unchecked\u0026amp;quot;)\u0026lt;/code\u0026gt; on the smallest scope.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked warning\u003c/button\u003e — the list has no idea its elements should be strings.\u003c/p\u003e\\n\u003cp\u003eLine 4 calls \u003ccode\u003eget(0)\u003c/code\u003e, and the compiler has inserted a cast to \u003ccode\u003eString\u003c/code\u003e there, which fails with \u003ccode\u003eClassCastException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe error is reported far from the real mistake. That\u0026#39;s heap pollution, and why unchecked warnings deserve attention.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles — with an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked warning\\\" data-def=\\\"The compiler saying it can\u0026amp;#39;t verify type safety at this point. Eliminate them, or prove safety and suppress with \u0026lt;code\u0026gt;@SuppressWarnings(\u0026amp;quot;unchecked\u0026amp;quot;)\u0026lt;/code\u0026gt; on the smallest scope.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked warning\u003c/button\u003e at line 3.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eClassCastException\u003c/code\u003e at line 3\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe raw list has no idea its elements should be strings, so the add succeeds.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eClassCastException\u003c/code\u003e at line 4\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"jgc-declarations/evolution-not-revolution/step-5\",\"prompt\":\"\u003cp\u003eWhen is it fine to suppress an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked warning\\\" data-def=\\\"The compiler saying it can\u0026amp;#39;t verify type safety at this point. Eliminate them, or prove safety and suppress with \u0026lt;code\u0026gt;@SuppressWarnings(\u0026amp;quot;unchecked\u0026amp;quot;)\u0026lt;/code\u0026gt; on the smallest scope.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked warning\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Whenever the code works in tests\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe point of the warning is that tests may not hit the bad case.\u003c/p\u003e\\n\"},{\"html\":\"On the whole class, to keep the build quiet\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat hides future warnings too.\u003c/p\u003e\\n\"},{\"html\":\"When you\u0026#39;ve proven the cast is safe, with \u003ccode\u003e@SuppressWarnings(\u0026quot;unchecked\u0026quot;)\u003c/code\u003e on the smallest possible scope and a comment saying why\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Declarations and evolution\",\"next\":{\"id\":\"checked-collections\",\"courseId\":\"jgc-declarations\",\"topicId\":\"generics-collections\",\"key\":\"jgc-declarations/checked-collections\",\"title\":\"Checked collections and honest generics\",\"summary\":\"`Collections.checkedList` checks every insert at run time, catching heap pollution where it starts.\",\"duration\":4,\"tags\":[\"java\",\"generics\",\"checked collections\",\"heap pollution\",\"debugging\"],\"sources\":[{\"book\":\"java-generics-collections\",\"ref\":\"Chapter 8, Effective Generics\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jgc-declarations/checked-collections/step-1\",\"jgc-declarations/checked-collections/step-2\",\"jgc-declarations/checked-collections/step-3\",\"jgc-declarations/checked-collections/step-4\",\"jgc-declarations/checked-collections/step-5\"],\"exercises\":[\"jgc-declarations/checked-collections/step-2\",\"jgc-declarations/checked-collections/step-4\",\"jgc-declarations/checked-collections/step-5\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance J
