rator\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 11, Foreach and iterators; The Adapter Method idiom; Collection vs. Iterator\"}],\"requires\":[],\"steps\":11,\"stepKeys\":[\"tij-collections/iterable-and-foreach/step-1\",\"tij-collections/iterable-and-foreach/step-2\",\"tij-collections/iterable-and-foreach/tij-holding-foreachcollections\",\"tij-collections/iterable-and-foreach/tij-holding-iterableclass\",\"tij-collections/iterable-and-foreach/tij-holding-multiiterableclass\",\"tij-collections/iterable-and-foreach/tij-holding-adaptermethodidiom\",\"tij-collections/iterable-and-foreach/tij-holding-arrayisnotiterable\",\"tij-collections/iterable-and-foreach/tij-holding-interfacevsiterator\",\"tij-collections/iterable-and-foreach/tij-holding-collectionsequence\",\"tij-collections/iterable-and-foreach/tij-holding-noncollectionsequence\",\"tij-collections/iterable-and-foreach/tij-holding-environmentvariables\"],\"exercises\":[\"tij-collections/iterable-and-foreach/tij-holding-foreachcollections\",\"tij-collections/iterable-and-foreach/tij-holding-iterableclass\",\"tij-collections/iterable-and-foreach/tij-holding-multiiterableclass\",\"tij-collections/iterable-and-foreach/tij-holding-adaptermethodidiom\",\"tij-collections/iterable-and-foreach/tij-holding-arrayisnotiterable\",\"tij-collections/iterable-and-foreach/tij-holding-interfacevsiterator\",\"tij-collections/iterable-and-foreach/tij-holding-collectionsequence\",\"tij-collections/iterable-and-foreach/tij-holding-noncollectionsequence\",\"tij-collections/iterable-and-foreach/tij-holding-environmentvariables\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-collections/iterable-and-foreach/step-1\",\"title\":\"Iterable\",\"body\":\"\u003cp\u003eForeach works with arrays and with any \u003ccode\u003eIterable\u003c/code\u003e — a type with an \u003ccode\u003eiterator()\u003c/code\u003e method.\u003c/p\u003e\\n\u003cp\u003eAn array is not itself an \u003ccode\u003eIterable\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eTo iterate a different way, add a method that returns another \u003ccode\u003eIterable\u003c/code\u003e (an adapter method).\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-collections/iterable-and-foreach/step-2\",\"title\":\"Collection or Iterator?\",\"body\":\"\u003cp\u003eTaking an \u003ccode\u003eIterator\u003c/code\u003e asks the least of your caller: any class can produce one.\u003c/p\u003e\\n\u003cp\u003eTaking a \u003ccode\u003eCollection\u003c/code\u003e (or extending \u003ccode\u003eAbstractCollection\u003c/code\u003e) gives foreach and more, but requires more to implement.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-holding-foreachcollections\",\"key\":\"tij-collections/iterable-and-foreach/tij-holding-foreachcollections\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u0026#39;Take\u0026#39; \u0026#39;the\u0026#39; \u0026#39;long\u0026#39; \u0026#39;way\u0026#39; \u0026#39;home\u0026#39;\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u0026#39;Take the long way home\u0026#39;\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003esplit(\u0026quot; \u0026quot;)\u003c/code\u003e breaks it into five words.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-holding-iterableclass\",\"key\":\"t $15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"And that is how we know the Earth to be banana-shaped.\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ereversed()\u003c/code\u003e returns an \u003ccode\u003eIterable\u003c/code\u003e that walks backward.\u003c/p\u003e\\n\"},{\"html\":\"banana-shaped. be to Earth the know we how is that And\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\".depahs-ananab eb ot htraE eht wonk ew woh si taht dnA\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt reverses the word order, not the characters.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-holding-adaptermethodidiom\",\"key\":\"tij-collections/iterable-and-foreach/tij-holding-adaptermethodidiom\",\"prompt\":\"\u003cp\u003eThis compiled on Java 5–20. What happens on Java 21?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eJava 21\u0026#39;s sequenced collections (JEP 431) added \u003ccode\u003ereversed()\u003c/code\u003e to \u003ccode\u003eList\u003c/code\u003e. Renaming the adapter method, say to \u003ccode\u003ebackwards()\u003c/code\u003e, fixes it.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"It compiles and prints the words, then reversed\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat was the output up to Java 20.\u003c/p\u003e\\n\"},{\"html\":\"It compiles, but \u003ccode\u003ereversed()\u003c/code\u003e now calls the JDK\u0026#39;s version\",\"correct\":false,\"feedback\":\"\u003cp\u0
