ng Your Objects — Map\"}],\"requires\":[],\"steps\":8,\"stepKeys\":[\"tij-collections/maps-and-views/step-1\",\"tij-collections/maps-and-views/step-2\",\"tij-collections/maps-and-views/step-3\",\"tij-collections/maps-and-views/step-4\",\"tij-collections/maps-and-views/step-5\",\"tij-collections/maps-and-views/tij-holding-petmap\",\"tij-collections/maps-and-views/tij-holding-statistics\",\"tij-collections/maps-and-views/tij-holding-mapoflist\"],\"exercises\":[\"tij-collections/maps-and-views/step-2\",\"tij-collections/maps-and-views/step-4\",\"tij-collections/maps-and-views/step-5\",\"tij-collections/maps-and-views/tij-holding-petmap\",\"tij-collections/maps-and-views/tij-holding-statistics\",\"tij-collections/maps-and-views/tij-holding-mapoflist\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-collections/maps-and-views/step-1\",\"title\":\"Map stands apart\",\"body\":\"\u003cp\u003eA \u003ccode\u003eMap\u003c/code\u003e links keys to values; it isn\u0026#39;t a \u003ccode\u003eCollection\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eHashMap\u003c/code\u003e has no order, \u003ccode\u003eLinkedHashMap\u003c/code\u003e keeps insertion order, \u003ccode\u003eTreeMap\u003c/code\u003e sorts its keys.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-collections/maps-and-views/step-2\",\"prompt\":\"\u003cp\u003eCan you write \u003ccode\u003efor (String k : map)\u003c/code\u003e with a \u003ccode\u003eMap\u0026lt;String, Integer\u0026gt; map\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, it loops over the keys\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eMap\u003c/code\u003e doesn\u0026#39;t extend \u003ccode\u003eIterable\u003c/code\u003e or \u003ccode\u003eCollection\u003c/code\u003e.\u003c/p\u003e\\n\"}
