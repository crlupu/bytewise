 attacker can forge a broken or shared object.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-serialization/defensive-readobject/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e, holds two \u003ccode\u003eDate\u003c/code\u003es and checks in its constructor that start is before end. Which attacks become possible if it\u0026#39;s serializable with no \u003ccode\u003ereadObject\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003ereadObject\u003c/code\u003e acts as a public constructor that takes a byte stream, and attackers can write any bytes they like.\u003c/p\u003e\\n\u003cp\u003eA crafted stream can produce a \u003ccode\u003ePeriod\u003c/code\u003e whose end is before its start, because no constructor checks run.\u003c/p\u003e\\n\u003cp\u003eWorse, an attacker can add extra references to the private \u003ccode\u003eDate\u003c/code\u003e fields in the stream and use them to mutate the deserialized period afterwards.\u003c/p\u003e\\n\u003cp\u003eA defensive \u003ccode\u003ereadObject\u003c/code\u003e copies the dates and validates the copies, like a constructor would.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"An attacker appends references to the private \u003ccode\u003eDate\u003c/code\u003e fields, then mutates them through those references\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"None, since the fields are private and final\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eSerialization\u003c/button\u003e bypasses constructors and access control.\u003c/p\u003e\\n\"},{\"html\":\"A hand-crafted byte stream produces a \u003ccode\u003ePeriod\u003c/code\u003e whose end is before its start\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-serialization/defensive-readobject/step-3\",\"title\":\"Copy, then check\",\"body\":\"\u003cp\u003eCall \u003ccode\u003edefaultReadObject()\u003c/code\u003e first.\u003c/p\u003e\\n\u003cp\u003eCopy mutable fields defensively.\u003c/p\u003e\\n\u003cp\u003eCheck invariants on the copies.\u003c/p\u003e\\n\u003cp\u003eThrow \u003ccode\u003eInvalidObjectException\u003c/code\u003e if they fail.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-serialization/defensive-readobject/step-4\",\"prompt\":\"\u003cp\u003ePut a defensive \u003ccode\u003ereadObject\u003c/code\u003e in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCopy before checking, for the same reason as in constructors.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Call \u003ccode\u003es.defaultReadObject()\u003c/code\u003e\",\"Make defensive copies of the mutable fields\",\"Check the invariants on the copies, throwing \u003ccode\u003eInvalidObjectException\u003c/code\u003e if they fail\"],\"start\":[1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Defensive copy\\\" data-def=\\\"Copying a mutable argument when it comes in, or a mutable field when it goes out, so callers can\u0026amp;#39;t change your object\u0026amp;#39;s internals behind your back.\\\" data-book=\\\"Effective Java\\\"\u003eDefensive copy\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"ej-serialization/defensive-readobject/step-5\",\"prompt\":\"\u003cp\u003eReport a broken invariant during \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deserialization\\\" data-def=\\\"Turning a byte stream back into objects. Acts as a hidden constructor that attackers can feed any bytes to.\\\" data-book=\\\"Effective Java\\\"\u003edeserialization\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"if (start.compareTo(end) \u003e 0) throw new \"},{\"answers\":[\"InvalidObjectException\"],\"size\":22,\"choices\":[\"InvalidObjectException\",\"enum\",\"transient\",\"serialVersionUID\"]},{\"text\":\"(start + \\\" after \\\" + end);\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-6\",\"key\":\"ej-serialization/defensive-readobject/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e holds two \u003ccode\u003eDate\u003c/code\u003e fields, \u003ccode\u003estart\u003c/code\u003e and \u003ccode\u003eend\u003c/code\u003e. A defensive \u003ccode\u003ereadObject\u003c/code\u003e calls \u003ccode\u003edefaultReadObject()\u003c/code\u003e, then copies both dates. Why can \u003ccode\u003estart\u003c/code\u003e and \u003ccode\u003eend\u003c/code\u003e no longer be \u003ccode\u003efinal\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAn unfortunate trade-off — or use a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization proxy\\\" data-def=\\\"Serializing a simple pr
