s\",\"390\",\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"serialization-alternatives\",\"courseId\":\"ej-serialization\",\"topicId\":\"effective-java\",\"key\":\"ej-serialization/serialization-alternatives\",\"title\":\"Prefer alternatives to Java serialization\",\"summary\":\"Deserializing untrusted bytes can run attacker-chosen code paths — the safest serialization is none at all.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"serialization\",\"security\",\"deserialization\",\"json\",\"protobuf\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 85\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-serialization/serialization-alternatives/step-1\",\"ej-serialization/serialization-alternatives/step-2\",\"ej-serialization/serialization-alternatives/step-3\",\"ej-serialization/serialization-alternatives/step-4\",\"ej-serialization/serialization-alternatives/step-5\",\"ej-serialization/serialization-alternatives/step-6\"],\"exercises\":[\"ej-serialization/serialization-alternatives/step-2\",\"ej-serialization/serialization-alternatives/step-4\",\"ej-serialization/serialization-alternatives/step-5\",\"ej-serialization/serialization-alternatives/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-serialization/serialization-alternatives/step-1\",\"title\":\"Deserialization is dangerous\",\"body\":\"\u003cp\u003e\u003ccode\u003ereadObject\u003c/code\u003e can create almost any class on the classpath.\u003c/p\u003e\\n\u003cp\u003eAttackers chain innocent methods into exploits.\u003c/p\u003e\\n\u003cp\u003eSmall streams can even take forever to read.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-serialization/serialization-alternatives/step-2\",\"prompt\":\"\u003cp\u003eBesides \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Gadget chain\\\" data-def=\\\"A sequence of ordinary methods in available classes that deserialization can be tricked into calling, adding up to an attack.\\\" data-book=\\\"Effective Java\\\"\u003egadget chains\u003c/button\u003e, what else can a malicious stream do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA stream of about 5,700 bytes built from nested HashSets can keep \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e computations running practically forever.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eDeserializing a \u003ccode\u003eHashSet\u003c/code\u003e calls \u003ccode\u003ehashCode\u003c/code\u003e on every element to rebuild the hash table.\u003c/p\u003e\\n\u003cp\u003eA stream can describe sets nested inside each other many levels deep in very few bytes, and computing the hash code of such a structure repeats work exponentially.\u003c/p\u003e\\n\u003cp\u003eA small input can therefore keep a server\u0026#39;s CPU busy practically forever — a denial-of-service with no exploit code at all.\u003c/p\u003e\\n\u003cp\u003eThis is why the safest policy is not to deserialize untrusted data.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nothing, as long as the classes are from the JDK\",\"correct\":false,\"feedback\":\"\u003cp\u003eBombs can be built from JDK classes alone.\u003c/p\u003e\\n\"},{\"html\":\"A \u003cstrong\u003edeserialization bomb\u003c/strong\u003e — a small stream, like deeply nested \u003ccode\u003eHashSet\u003c/code\u003es, that takes effectively forever to deserialize\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deserialization\\\" data-def=\\\"Turning a byte stream back into objects. Acts as a hidden constructor that attackers can feed any bytes to.\\\" data-book=\\\"Effective Java\\\"\u003eDeserialization\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-serialization/serialization-alternatives/step-3\",\"title\":\"Use something else\",\"body\":\"\u003cp\u003eUse JSON or Protocol Buffers instead.\u003c/p\u003e\\n\u003cp\u003eNever deserialize untrusted data.\u003c/p\u003e\\n\u003cp\u003eIf you must, allow-list the classes.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-serialization/serialization-alternatives/step-4\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the best way to avoid \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eserialization\u003c/button\u003e exploits?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThose formats are much simpler, and support only data, not arbitrary object graphs and their behaviour.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Only deserialize data from your own database\",\"correct\":false,\"feedback\":\"\u003cp\u003eTrusting the source helps, but data stores can be compromised; avoiding Java serialization removes the risk.\u003c/p\u003e\\n\"},{\"html\":\"Never deserialize anything — use a cross-platform structured format such as JSON or Protocol Buffers instead\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"ej-serialization/serialization-alternatives/step-5\",\"prompt\":\"\u003cp\u003eMatch each defence to how it helps.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Use JSON or protobuf\",\"Never deserialize untrusted data\",\"\u003ccode\u003eObjectInputFilter\u003c/code\u003e (Java 9)\"],\"right\":[\"Removes the attack surface entirely\",\"Keeps attackers\u0026#39; bytes away from \u003ccode\u003ereadObject\u003c/code\u003e\",\"Allow-lists the classes a stream may contain\"],\"rightOrder\":[2,1,0]},{\"id\":\"step-6\",\"key\":\"ej-serialization/serialization-alternatives/step-6\",\"prompt\":\"\u003cp\u003eComplete the advice.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA blocklist only stops the dangers already known.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"If you can't avoid Java serialization, use an \",\"html\":\"If you can\u0026#39;t avoid Java \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eserialization\u003c/button\u003e, use an \"},{\"answers\":[\"allowlist\",\"whitelist\",\"allow-list\"],\"size\":10,\"choices\":[\"primitives\",\"reflectively\",\"annotation\",\"allowlist\"]},{\"text\":\" of classes, not a blocklist.\",\"html\":\" of classes, not a blocklist.\"}],\"code\":false,\"caseSensitive\":false}]},\"courseTitle\":\"Serialization\",\"next\":{\"id\":\"implement-serializable-cautiously\",\"courseId\":\"ej-serialization\",\"topicId\":\"effective-java\",\"key\":\"ej-serialization/implement-serializable-cauti
