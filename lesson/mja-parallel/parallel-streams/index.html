:#D73A49;--shiki-dark:#F97583\"\u003e new\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e Accumulator\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e();\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003eLongStream.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003erangeClosed\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"\u003e1\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e, n).\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003eparallel\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e().\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003eforEach\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(acc\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003e::\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003eadd);\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003ereturn\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e acc.total;\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"parallel-streams\",\"courseId\":\"mja-parallel\",\"topicId\":\"modern-java\",\"key\":\"mja-parallel/parallel-streams\",\"title\":\"When parallel streams help\",\"summary\":\"`.parallel()` splits work across cores, but boxing, hard-to-split sources and shared state can make it slower or wrong.\",\"duration\":6,\"tags\":[\"java\",\"modern java\",\"streams\",\"parallel\",\"performance\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§7.1, Parallel streams\"},{\"book\":\"effective-java\",\"ref\":\"Item 48\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"mja-parallel/parallel-streams/step-1\",\"mja-parallel/parallel-streams/step-2\",\"mja-parallel/parallel-streams/step-3\",\"mja-parallel/parallel-streams/step-4\",\"mja-parallel/parallel-streams/step-5\",\"mja-parallel/parallel-streams/step-6\"],\"exercises\":[\"mja-parallel/parallel-streams/step-3\",\"mja-parallel/parallel-streams/step-5\",\"mja-parallel/parallel-streams/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"mja-parallel/parallel-streams/step-1\",\"title\":\"One call, many threads\",\"body\":\"\u003cp\u003e\u003ccode\u003e.parallel()\u003c/code\u003e splits the source into chunks.\u003c/p\u003e\\n\u003cp\u003eEach chunk runs on the common \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fork/join\\\" data-def=\\\"Splitting a task into subtasks (fork), running them in parallel, and combining the results (join). The pool uses work stealing.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003efork/join\u003c/button\u003e pool.\u003c/p\u003e\\n\u003cp\u003eThe partial results are combined at the end.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"mja-parallel/parallel-streams/step-2\",\"title\":\"Measure before you parallelize\",\"body\":\"\u003cp\u003eSplitting and merging cost time.\u003c/p\u003e\\n\u003cp\u003eBoxing, small inputs and sources that split badly can eat the gain.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eArrayList\u003c/code\u003e and \u003ccode\u003eIntStream.range\u003c/code\u003e split well; \u003ccode\u003eLinkedList\u003c/code\u003e and \u003ccode\u003eiterate\u003c/code\u003e don\u0026#39;t.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"mja-parallel/parallel-streams/step-3\",\"prompt\":\"\u003cp\u003eMatch each source with how well it splits.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eIntStream.rangeClosed\u003c/code\u003e\",\"\u003ccode\u003eArrayList\u003c/code\u003e\",\"\u003ccode\u003eLinkedList\u003c/code\u003e\",\"\u003ccode\u003eStream.iterate\u003c/code\u003e\"],\"right\":[\"Excellent — just halve the range\",\"Excellent — index into the middle\",\"Poor — must walk to the middle\",\"Poor — each element depends on the last\"],\"rightOrder\":[3,2,1,0]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"mja-parallel/parallel-streams/step-4\",\"title\":\"Shared state breaks it\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003elambda\u003c/button\u003e that updates a shared variable races with itself.\u003c/p\u003e\\n\u003cp\u003eParallel results come out wrong, and differently each run.\u003c/p\u003e\\n\u003cp\u003eKeep pipelines free of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Side effect\\\" data-def=\\\"A function doing something besides computing its result — modifying state, printing, writing a field.\\\" data-book=\\\"Effective Java\\\"\u003eside effects\u003c/button\u003e; let \u003ccode\u003ereduce\u003c/code\u003e and \u003ccode\u003ecollect\u003c/code\u003e combine.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"mja-parallel/parallel-streams/step-5\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s wrong here?\
