",\"memory leak\",\"retained size\"],\"sources\":[{\"book\":\"java-performance\",\"ref\":\"§7.1, Heap Analysis\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jperf-memory/heap-analysis/step-1\",\"jperf-memory/heap-analysis/step-2\",\"jperf-memory/heap-analysis/step-3\",\"jperf-memory/heap-analysis/step-4\",\"jperf-memory/heap-analysis/step-5\",\"jperf-memory/heap-analysis/step-6\"],\"exercises\":[\"jperf-memory/heap-analysis/step-3\",\"jperf-memory/heap-analysis/step-4\",\"jperf-memory/heap-analysis/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jperf-memory/heap-analysis/step-1\",\"title\":\"Histograms count objects\",\"body\":\"\u003cp\u003e\u003ccode\u003ejcmd \u0026lt;pid\u0026gt; GC.class_histogram\u003c/code\u003e lists classes by instance count and bytes.\u003c/p\u003e\\n\u003cp\u003eIt\u0026#39;s quick, and shows what is taking up space.\u003c/p\u003e\\n\u003cp\u003eRun it twice; a class that keeps growing is a suspect.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jperf-memory/heap-analysis/step-2\",\"title\":\"Heap dumps explain why\",\"body\":\"\u003cp\u003e\u003ccode\u003ejcmd \u0026lt;pid\u0026gt; GC.heap_dump file.hprof\u003c/code\u003e writes every object to a file.\u003c/p\u003e\\n\u003cp\u003eA tool like Eclipse MAT shows what keeps each object alive.\u003c/p\u003e\\n\u003cp\u003eFollow the path back to a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"GC root\\\" data-def=\\\"A reference that\u0026amp;#39;s always reachable — a static field, a local variable on a thread\u0026amp;#39;s stack — from which the GC traces live objects.\\\" data-book=\\\"Java Performance\\\"\u003eGC root\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-3\",\"key\":\"jperf-memory/heap-analysis/step-3\",\"prompt\":\"\u003cp\u003eMatch each term with its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Shallow size\",\"Retained size\",\"GC root\",\"Dominator\"],\"right\":[\"Memory of the object itself\",\"Memory freed if this object were collected\",\"A starting point that\u0026#39;s always reachable, like a static field or a thread\u0026#39;s stack\",\"An object every path to another object passes through\"],\"rightOrder\":[2,3,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Retained size\\\" data-def=\\\"Retained size is the memory that would be freed if an object were collected — itself plus everything only it keeps alive. Shallow size is just the object.\\\" data-book=\\\"Java Performance\\\"\u003eRetained size\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"GC root\\\" data-def=\\\"A reference that\u0026amp;#39;s always reachable — a static field, a local variable on a thread\u0026amp;#39;s stack — from which the GC traces live objects.\\\" data-book=\\\"Java Performance\\\"\u003eGC root\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jperf-memory/heap-analysis/step-4\",\"prompt\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Heap dump\\\" data-def=\\\"A file with every object in the heap and the references between them, for finding what fills memory.\\\" data-book=\\\"Java Performance\\\"\u003eheap dump\u003c/button\u003e shows a \u003ccode\u003eHashMap\u003c/code\u003e with a small \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Retained size\\\" data-def=\\\"Retained size is the memory that would be freed if an object were collected — itself plus everything only it keeps alive. Shallow size is just the object.\\\" data-book=\\\"Java Performance\\\"\u003eshallow size\u003c/button\u003e but 3 GB retained. What does that tell you?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA \u003ccode\u003eHashMap\u003c/code\u003e\u0026#39;s own object is small — a few fields and a reference to its table.\u003c/p\u003e\\n\u003cp\u003eIts retained size counts everything that would become unreachable if the map disappeared: the table, entries, keys and values only it references.\u003c/p\u003e\\n\u003cp\u003e3 GB retained means the map is effectively holding 3 GB in memory. That\u0026#39;s the classic shape of a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e or registry that never removes entries.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The map itself is 3 GB\",\"correct\":false,\"feedback\":\"\u003cp\u003eShallow size is the map\u0026#39;s own memory; retained size counts everything it keeps alive.\u003c/p\u003e\\n\"},{\"html\":\"The map holds references to 3 GB of objects that would be freed if the map went away\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jperf-memory/heap-analysis/step-5\",\"title\":\"Out of memory\",\"body\":\"\u003cp\u003e\u003ccode\u003eOutOfMemoryError: Java heap space\u003c/code\u003e means live objects filled the heap.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e-XX:+HeapDumpOnOutOfMemoryError\u003c/code\u003e saves a dump when it happens.\u003c/p\u003e\\n\u003cp\u003eThen you can see what filled it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jperf-memory/heap-analysis/step-6\",\"prompt\":\"\u003cp\u003eDump the heap automatically when memory runs out.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"deta
