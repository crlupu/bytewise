aurant\",\"tij-concurrency/cooperation/tij-concurrency-waxomatic2-waxomatic2\",\"tij-concurrency/cooperation/tij-concurrency-testblockingqueues\",\"tij-concurrency/cooperation/tij-concurrency-toastomatic\",\"tij-concurrency/cooperation/tij-concurrency-pipedio\",\"tij-concurrency/cooperation/tij-concurrency-chopstick\",\"tij-concurrency/cooperation/tij-concurrency-philosopher\",\"tij-concurrency/cooperation/tij-concurrency-deadlockingdiningphilosophers\",\"tij-concurrency/cooperation/tij-concurrency-fixeddiningphilosophers\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-concurrency/cooperation/step-1\",\"title\":\"wait and notifyAll\",\"body\":\"\u003cp\u003e\u003ccode\u003ewait()\u003c/code\u003e releases the object\u0026#39;s lock and suspends the thread until a \u003ccode\u003enotify()\u003c/code\u003e/\u003ccode\u003enotifyAll()\u003c/code\u003e on the same object; it must be called while holding that lock.\u003c/p\u003e\\n\u003cp\u003eAlways wait in a \u003ccode\u003ewhile\u003c/code\u003e loop that rechecks the condition — another thread may have changed it, or the wakeup may be spurious.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003enotify()\u003c/code\u003e wakes one waiting thread, \u003ccode\u003enotifyAll()\u003c/code\u003e wakes all threads waiting on that object.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eLock\u003c/code\u003e\u0026#39;s \u003ccode\u003eCondition\u003c/code\u003e offers the same with \u003ccode\u003eawait()\u003c/code\u003e/\u003ccode\u003esignalAll()\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-concurrency/cooperation/step-2\",\"title\":\"Queues and deadlock\",\"body\":\"\u003cp\u003eA \u003ccode\u003eBlockingQueue\u003c/code\u003e does the waiting for you: \u003ccode\u003etake()\u003c/code\u003e blocks while it\u0026#39;s empty, \u003ccode\u003eput()\u003c/code\u003e while it\u0026#39;s full.\u003c/p\u003e\\n\u003cp\u003eA chain of tasks joined by queues needs no explicit locking.\u003c/p\u003e\\n\u003cp\u003eDeadlock needs four things at once, including a circular wait; with dining philosophers, making one philosopher pick up the chopsticks in the opposite order breaks the circle.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-concurrency-waxomatic-waxomatic\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-waxomatic-waxomatic\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eWaxOn\u003c/code\u003e waxes, then waits for buffing; \u003ccode\u003eWaxOff\u003c/code\u003e waits for waxing, then buffs. What does the first line of output look like? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003eWax On! Wax Off! Wax On! Wax Off! …\u003c/code\u003e strictly alternating, ending with \u003ccode\u003eExiting via interrupt\u003c/code\u003e after 5 s\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Random runs like \u003ccode\u003eWax On! Wax On! Wax Off!\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach task waits for the other\u0026#39;s state change, so they alternate.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — both tasks wait forever\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ewaxOn\u003c/code\u003e starts \u003ccode\u003efalse\u003c/code\u003e, so \u003ccode\u003eWaxOn\u003c/code\u003e goes first without waiting.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-notifyvsnotifyall\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-notifyvsnotifyall\",\"prompt\":\"\u003cp\u003eFive \u003ccode\u003eTask\u003c/code\u003es wait on \u003ccode\u003eTask.blocker\u003c/code\u003e; one \u003ccode\u003eTask2\u003c/code\u003e waits on a separate \u003ccode\u003eTask2.blocker\u003c/code\u003e. What do the timer\u0026#39;s \u003ccode\u003enotify()\u003c/code\u003e and \u003ccode\u003enotifyAll()\u003c/code\u003e lines show?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"\u003ccode\u003enotifyAll()\u003c/code\u003e wakes all six threads\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt wakes only threads waiting on that object; \u003ccode\u003eTask2\u003c/code\u003e waits on a different one.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003enotify()\u003c/code\u003e wakes one \u003ccode\u003eTask\u003c/code\u003e thread; \u003ccode\u003enotifyAll()\u003c/code\u003e wakes all five — and \u003ccode\u003eTask2\u003c/code\u003e wakes only when its own blocker is prodded\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003enotify()\u003c/code\u003e wakes all five, in order\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003enotify()\u003c/code\u003e wakes just one.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-restaurant\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-restaurant\",\"prompt\":\"\u003cp\u003eThe chef shuts everything down with \u003ccode\u003eshutdownNow()\u003c/code\u003e when \u003ccode\u003e++count\u003c/code\u003e reaches 10. What does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eOrder up! Waitperson got Meal 1\\nOrder up! Waitperson got Meal 2\\nOrder up! Waitperson got Meal 3\\nOrder up! Waitperson got Meal 4\\nOrder up! Waitperson got Meal 5\\nOrder up! Waitperson got Meal 6\\nOrder up! Waitperson got Meal 7\\nOrder up! Waitperson got Meal 8\\nOrder up! Waitperson got Meal 9\\nOrder up! Waitperson got Meal 10\\nOut of food, closing\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eshutdownNow()\u003c/code\u003e doesn\u0026#39;t stop the chef on the spot: it sets meal 10, then its \u003ccode\u003esleep()\u003c/code\u003e throws \u003ccode\u003eInterruptedException\u003c/code\u003e. The waitperson is interrupted in \u003ccode\u003ewait()\u003c/code\u003e before it can print meal 10.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eOrder up! Waitperson got Meal 1\\nOrder up! Waitperson got Meal 2\\nOrder up! Waitperson got Meal 3\\nOrder up! Waitperson got Meal 4\\nOrder up! Waitperson got Meal 5\\nOrder up! Waitperson got Meal 6\\nOrder up! Waitperson got Meal 7\\nOrder up! Waitperson got Meal 8\\nOrder up! Waitperson got Meal 9\\nOut of food, closing\\nOrder up! Chef interrupted\\nWaitPerson interrupted\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eOrder up! Waitperson got Meal 1\\nOrder up! Waitperson got Meal 2\\nOrder up! Waitperson got Meal 3\\nOrder up! Waitperson got Meal 4\\nOrder up! Waitperson got Meal 5\\nOrder up! Waitperson got Meal 6\\nOrder up! Waitperson got Meal 7\\nOrder up! Waitperson got Meal 8\\nOrder up! Waitperson got Meal 9\\nOut of food, closing\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAfter closing, the chef still runs to the end of the loop body: it prints \u003ccode\u003eOrder up! \u003c/code\u003e and is interrupted in \u003ccode\u003esleep()\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-concurrency-waxomatic2-waxomatic2\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-waxomatic2-waxomatic2\",\"prompt\":\"\u003cp\u003eThis is \u003ccode\u003eWaxOMatic\u003c/code\u003e rewritten with a \u003ccode\u003eReentrantLock\u003c/code\u003e and a \u003ccode\u003eCondition\u003c/code\u003e. What changes in the output? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"They can\u0026#39;t be interrupted any more\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eCondition.await()\u003c/code\u003e throws \u003ccode\u003eInterruptedException\u003c/code\u003e too.\u003c/p\u003e\\n\"},{\"html\":\"The tasks no longer alternate\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe logic is identical; only the mechanism changes.\u003c/p\u003e\\n\"},{\"html\":\"Nothing important — the same strictly alternating \u003ccode\u003eWax On! Wax Off!\u003c/code\u003e; \u003ccode\u003eawait()\u003c/code\u003e/\u003ccode\u003esignalAll()\u003c/code\u003e replace \u003ccode\u003ewait()\u003c/code\u003e/\u003ccode\u003enotifyAll()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-testblockingqueues\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-testblockingqueues\",\"prompt\":\"\u003cp\u003e\u003ccode\u003emain\u003c/code\u003e puts five \u003ccode\u003eLiftOff(5)\u003c/code\u003e rockets into each queue while a runner takes and runs them. Which \u003ccode\u003eput()\u003c/code\u003e calls can block the main thread? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s why, on a Java 21 run, the \u003ccode\u003eSynchronousQueue\u003c/code\u003e test printed four whole countdowns before its \u003ccode\u003ePress \u0026#39;Enter\u0026#39;\u003c/code\u003e line: each \u003ccode\u003eput()\u003c/code\u003e waits for the runner.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"None — \u003ccode\u003eput()\u003c/code\u003e never blocks\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eput()\u003c/code\u003e blocks when the queue is full.\u003c/p\u003e\\n\"},{\"html\":\"Only \u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s unbounded here, so it never fills.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eArrayBlockingQueue(3)\u003c/code\u003e when it holds 3, and \u003ccode\u003eSynchronousQueue\u003c/code\u003e on every \u003ccode\u003eput()\u003c/code\u003e until the runner takes it; \u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e never\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-toastomatic\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-toastomatic\",\"prompt\":\"\u003cp\u003eToaster → Butterer → Jammer → Eater, joined by three queues. The Eater checks each toast\u0026#39;s id and status. Does it ever print \u003ccode\u003e\u0026gt;\u0026gt;\u0026gt;\u0026gt; Error\u003c/code\u003e? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEach \u003ccode\u003eToast\u003c/code\u003e is touched by only one task at a time, handed over through the queues — so \u003ccode\u003eToast\u003c/code\u003e needs no locking.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Yes — without \u003ccode\u003esynchronized\u003c/code\u003e, toast arrives out of order\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach queue is FIFO and each stage is one task, so the order is kept.\u003c/p\u003e\\n\"},{\"html\":\"No — every toast arrives in order and fully jammed: \u003ccode\u003eDRY\u003c/code\u003e, \u003ccode\u003eBUTTERED\u003c/code\u003e, \u003ccode\u003eJAMMED\u003c/code\u003e, \u003ccode\u003eChomp!\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-pipedio\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-pipedio\",\"prompt\":\"\u003cp\u003eAfter 4 s, \u003ccode\u003eshutdownNow()\u003c/code\u003e interrupts the \u003ccode\u003eSender\u003c/code\u003e (in \u003ccode\u003esleep\u003c/code\u003e) and the \u003ccode\u003eReceiver\u003c/code\u003e (in \u003ccode\u003ein.read()\u003c/code\u003e). How does the \u003ccode\u003eReceiver\u003c/code\u003e end? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"It stays blocked forever\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ePipedReader.read()\u003c/code\u003e polls and checks for interruption.\u003c/p\u003e\\n\"},{\"html\":\"With \u003ccode\u003eInterruptedException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eread()\u003c/code\u003e can only throw \u003ccode\u003eIOException\u003c/code\u003e; it throws the \u003ccode\u003eInterruptedIOException\u003c/code\u003e subclass.\u003c/p\u003e\\n\"},{\"html\":\"With \u003ccode\u003ejava.io.InterruptedIOException Receiver read exception\u003c/code\u003e — unlike other stream I/O, a \u003ccode\u003ePipedReader\u003c/code\u003e read does respond to interrupts\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-chopstick\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-chopstick\",\"prompt\":\"\u003cp\u003eWhy does \u003ccode\u003etake()\u003c/code\u003e use \u003ccode\u003ewhile(taken) wait();\u003c/code\u003e rather than \u003ccode\u003eif\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"\u003ccode\u003edrop()\u003c/code\u003e calls \u003ccode\u003enotifyAll()\u003c/code\u003e, so several waiters may wake, but only one gets the chopstick — the others must check again\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eif\u003c/code\u003e doesn\u0026#39;t compile with \u003ccode\u003ewait()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles; it\u0026#39;s just wrong.\u003c/p\u003e\\n\"},{\"html\":\"To spin without releasing the lock\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ewait()\u003c/code\u003e releases the lock while waiting.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-philosopher\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-philosopher\",\"prompt\":\"\u003cp\u003eIn what order does a philosopher pick up the chopsticks, and when does it release them? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"Left, then right\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt calls \u003ccode\u003eright.take()\u003c/code\u003e first.\u003c/p\u003e\\n\"},{\"html\":\"Right, then left; it drops both after eating\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Both at once, in one atomic step\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey\u0026#39;re two separate \u003ccode\u003etake()\u003c/code\u003e calls, so it can hold one and wait for the other.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-deadlockingdiningphilosophers\",\"key\":\"tij-concurrency/cooperation/tij-concurrency-deadlockingdiningphilosophers\",\"prompt\":\"\u003cp\u003ePhilosopher i gets \u003ccode\u003esticks[i]\u003c/code\u003e as its left and \u003ccode\u003esticks[(i+1) % size]\u003c/code\u003e
