an\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e).\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003erunTask\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e();\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e  }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"tasks-and-executors\",\"courseId\":\"tij-concurrency\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-concurrency/tasks-and-executors\",\"title\":\"Tasks, threads and executors\",\"summary\":\"Runnable tasks, Thread, the three classic executors, Callable and Future, sleep, priorities and the ways to write a thread.\",\"duration\":8,\"tags\":[\"java\",\"concurrency\",\"Runnable\",\"Thread\",\"ExecutorService\",\"Callable\",\"Future\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 21, Basic threading\"}],\"requires\":[],\"steps\":15,\"stepKeys\":[\"tij-concurrency/tasks-and-executors/step-1\",\"tij-concurrency/tasks-and-executors/step-2\",\"tij-concurrency/tasks-and-executors/tij-concurrency-liftoff\",\"tij-concurrency/tasks-and-executors/tij-concurrency-mainthread\",\"tij-concurrency/tasks-and-executors/tij-concurrency-basicthreads\",\"tij-concurrency/tasks-and-executors/tij-concurrency-morebasicthreads\",\"tij-concurrency/tasks-and-executors/tij-concurrency-cachedthreadpool\",\"tij-concurrency/tasks-and-executors/tij-concurrency-fixedthreadpool\",\"tij-concurrency/tasks-and-executors/tij-concurrency-singlethreadexecutor\",\"tij-concurrency/tasks-and-executors/tij-concurrency-callabledemo\",\"tij-concurrency/tasks-and-executors/tij-concurrency-sleepingtask\",\"tij-concurrency/tasks-and-executors/tij-concurrency-simplepriorities\",\"tij-concurrency/tasks-and-executors/tij-concurrency-simplethread\",\"tij-concurrency/tasks-and-executors/tij-concurrency-selfmanaged\",\"tij-concurrency/tasks-and-executors/tij-concurrency-threadvariations\"],\"exercises\":[\"tij-concurrency/tasks-and-executors/tij-concurrency-liftoff\",\"tij-concurrency/tasks-and-executors/tij-concurrency-mainthread\",\"tij-concurrency/tasks-and-executors/tij-concurrency-basicthreads\",\"tij-concurrency/tasks-and-executors/tij-concurrency-morebasicthreads\",\"tij-concurrency/tasks-and-executors/tij-concurrency-cachedthreadpool\",\"tij-concurrency/tasks-and-executors/tij-concurrency-fixedthreadpool\",\"tij-concurrency/tasks-and-executors/tij-concurrency-singlethreadexecutor\",\"tij-concurrency/tasks-and-executors/tij-concurrency-callabledemo\",\"tij-concurrency/tasks-and-executors/tij-concurrency-sleepingtask\",\"tij-concurrency/tasks-and-executors/tij-concurrency-simplepriorities\",\"tij-concurrency/tasks-and-executors/tij-concurrency-simplethread\",\"tij-concurrency/tasks-and-executors/tij-concurrency-selfmanaged\",\"tij-concurrency/tasks-and-executors/tij-concurrency-threadvariations\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-concurrency/tasks-and-executors/step-1\",\"title\":\"Tasks and threads\",\"body\":\"\u003cp\u003eA task is a \u003ccode\u003eRunnable\u003c/code\u003e: its \u003ccode\u003erun()\u003c/code\u003e is just a method, and calling it directly runs it on the current thread.\u003c/p\u003e\\n\u003cp\u003eTo run it concurrently, hand it to a \u003ccode\u003eThread\u003c/code\u003e and call \u003ccode\u003estart()\u003c/code\u003e, which returns at once while the new thread runs \u003ccode\u003erun()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe interleaving of several threads is decided by the scheduler, so it changes from run to run.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-concurrency/tasks-and-executors/step-2\",\"title\":\"Executors\",\"body\":\"\u003cp\u003e\u003ccode\u003eExecutors.newCachedThreadPool()\u003c/code\u003e makes threads as needed; \u003ccode\u003enewFixedThreadPool(n)\u003c/code\u003e uses at most n; \u003ccode\u003enewSingleThreadExecutor()\u003c/code\u003e runs tasks one at a time, in submission order.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eshutdown()\u003c/code\u003e stops new submissions but lets queued tasks finish.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eCallable\u0026lt;T\u0026gt;\u003c/code\u003e returns a value; \u003ccode\u003esubmit()\u003c/code\u003e gives back a \u003ccode\u003eFuture\u0026lt;T\u0026gt;\u003c/code\u003e whose \u003ccode\u003eget()\u003c/code\u003e blocks until the result is ready.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-concurrency-liftoff\",\"key\":\"tij-concurrency/tasks-and-executors/tij-concurrency-liftoff\",\"prompt\":\"\u003cp\u003eEach \u003ccode\u003eLiftOff\u003c/code\u003e gets an \u003ccode\u003eid\u003c/code\u003e from the static \u003ccode\u003etaskCount\u003c/code\u003e. What does one \u003ccode\u003eLiftOff\u003c/code\u003e print as it counts down from the default 10?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003e#0(10), #0(9), … #0(1), \u003c/code\u003e — ten numbers, no \u003ccode\u003eLiftoff!\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ecountDown--\u003c/code\u003e is post-decrement: the test sees 10, then \u003ccode\u003estatus()\u003c/code\u003e sees 9; the last pass sees 0 and prints \u003ccode\u003eLiftoff!\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e#0(9), #0(8), … #0(1), #0(Liftoff!), \u003c/code\u003e — nine numbers then \u003ccode\u003eLiftoff!\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — a \u003ccode\u003eRunnable\u003c/code\u003e needs a \u003ccode\u003eThread\u003c/code\u003e to run\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt prints when someone calls \u003ccode\u003erun()\u003c/code\u003e, on whatever thread that is.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-mainthread\",\"key\":\"tij-concurrency/tasks-and-executors/tij-concurrency-mainthread\",\"prompt\":\"\u003cp\u003e\u003ccode\u003emain\u003c/code\u003e calls \u003ccode\u003erun()\u003c/code\u003e directly on a \u003ccode\u003eLiftOff\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"#0(9), #0(8), #0(7), #0(6), #0(5), #0(4), #0(3), #0(2), #0(1), #0(Liftoff!),\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — \u003ccode\u003erun()\u003c/code\u003e doesn\u0026#39;t start a thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt doesn\u0026#39;t start a thread, but it still runs — on the main thread.\u003c/p\u003e\\n\"},{\"html\":\"#0(10), #0(9), #0(8), #0(7), #0(6), #0(5), #0(4), #0(3), #0(2), #0(1),\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe decrement happens in the test, before \u003ccode\u003estatus()\u003c/code\u003e runs, and the last pass prints \u003ccode\u003eLiftoff!\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-concurrency-basicthreads\",\"key\":\"tij-concurrency/tasks-and-executors/tij-concurrency-basicthreads\",\"prompt\":\"\u003cp\u003eWhat comes out first?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run, \u003ccode\u003eWaiting for LiftOff\u003c/code\u003e came first, then the whole countdown. The order isn\u0026#39;t guaranteed.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Always the countdown — \u003ccode\u003estart()\u003c/code\u003e waits for \u003ccode\u003erun()\u003c/code\u003e to finish\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003estart()\u003c/code\u003e doesn\u0026#39;t wait; that\u0026#39;s what makes it concurrent.\u003c/p\u003e\\n\"},{\"html\":\"Usually \u003ccode\u003eWaiting for LiftOff\u003c/code\u003e — \u003ccode\u003estart()\u003c/code\u003e returns at once, before the new thread gets going\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Only \u003ccode\u003eWaiting for LiftOff\u003c/code\u003e — \u003ccode\u003emain\u003c/code\u003e ends before the thread runs\",\"correct\":false,\"feedback\":\"\u003cp\u003eA normal (non-daemon) kel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Waits for the tasks to finish before returning\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s \u003ccode\u003eawaitTermination()\u003c/code\u003e; \u003ccode\u003eshutdown()\u003c/code\u003e returns immediately.\u003c/p\u003e\\n\"},{\"html\":\"Interrupts the five tasks right away\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s \u003ccode\u003eshutdownNow()\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Stops new tasks from being submitted; the five already submitted still run to completion\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-fixedthreadpool\",\"key\":\"tij-concurrency/tasks-and-executors/tij-concurrency-fixedthreadpool\",\"prompt\":\"\u003cp\u003eHow does this differ from using \u003ccode\u003enewCachedThreadPool()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"The pool never has more than 5 threads; extra tasks would wait in a queue — with 5 tasks the output looks just as interleaved\",\"correct\":true,\" , #0(3), #1(3), #2(3), #3(3), #4(3), #0(2), #1(2), #2(2), #3(2), #4(2), #0(1), #1(1), #2(1), #3(1), #4(1), #0(Liftoff!), #1(Liftoff!), #2(Liftoff!), #3(Liftoff!), #4(Liftoff!),\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s only one thread, so each task runs to the end before the next starts.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-concurrency-callabledemo\",\"key\":\"tij-concurrency/tasks-and-executors/tij-concurrency-callabledemo\",\"prompt\":\"\u003cp\u003eTen \u003ccode\u003eTaskWithResult\u003c/code\u003e tasks are submitted to a cached pool and may finish in any order. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$1a\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"java.util.concurrent.RejectedExecutionException\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eshutdown()\u003c/code\u003e in the \u003ccode\u003efinally\u003c/code\u003e stops new submissions, but every task was already submitted before the loop.\u003c/p\u003e\\n\"},{\"html\":\"The ten results in whatever order the tasks finished\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe loop walks the \u003ccode\u003eFuture\u003c/code\u003es in submission order, and \u003ccode\u003eget()\u003c/code\u003e waits for each one.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eresult of TaskWithResult 0\\nresult of TaskWithResult 1\\nresult of TaskWithResult 2\\nresult of TaskWithResul ecutors/tij-concurrency-simplepriorities\",\"prompt\":\"\u003cp\u003eFive threads run at \u003ccode\u003eMIN_PRIORITY\u003c/code\u003e and one at \u003ccode\u003eMAX_PRIORITY\u003c/code\u003e. What can you rely on?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1c\",\"options\":[{\"html\":\"Low-priority threads never run while a high-priority one is runnable\",\"correct\":false,\"feedback\":\"\u003cp\u003eJava doesn\u0026#39;t promise strict priority scheduling.\u003c/p\u003e\\n\"},{\"html\":\"The MAX_PRIORITY thread prints all five lines before any other thread prints\",\"correct\":false,\"feedback\":\"\u003cp\u003eOn a Java 21 run, low-priority threads printed between its lines.\u003c/p\u003e\\n\"},{\"html\":\"Very little — priority is a hint to the OS scheduler; the high-priority thread may tend to finish first, but the order isn\u0026#39;t guaranteed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-simplethread\",\"key\":\"tij-concurrency/tasks-and-executors/tij-concurrency-simplethread\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s a drawback of calling \u003ccode\u003estart()\u003c/code\u003e inside the constructor, as \u003ccode\u003eSimpleThread\u003c/code\u003e does?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe book recommends executors over starting threads in constructors for exactly this reason.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. rect\":true,\"feedback\":\"$undefined\"},{\"html\":\"The object\u0026#39;s hash code\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003etoString()\u003c/code\u003e is overridden.\u003c/p\u003e\\n\"},{\"html\":\"Always \u003ccode\u003emain\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003erun()\u003c/code\u003e executes on the thread \u003ccode\u003et\u003c/code\u003e, so \u003ccode\u003ecurrentThread()\u003c/code\u003e is that thread.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003eHash code\u003c/button\u003e\"]},{\"id\":\"tij-concurrency-threadvariations\",\"key\":\"tij-concurrency/tasks-and-executors/tij-concurrency-threadvariations\",\"prompt\":\"\u003cp\u003eFive classes each create a thread that prints its name and a count from 5 down to 1, sleeping 10 ms between prints. What does the output look like? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1f\",\"options\":[{\"html\":\"\u003ccode\u003eInnerThread1\u003c/code\u003e counts down fully first, then the next class, and so on\",\"co
