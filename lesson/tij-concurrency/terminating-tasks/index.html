iki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e Thread\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003enew\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e Blocked3\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e());\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    t.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003estart\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e();\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    TimeUnit.MILLISECONDS.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003esleep\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003enew\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e Integer\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(args[\u003c/span\u003e\u003cspan style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"\u003e0\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e]));\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    t.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003einterrupt\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e();\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e  }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"terminating-tasks\",\"courseId\":\"tij-concurrency\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-concurrency/terminating-tasks\",\"title\":\"Terminating and interrupting tasks\",\"summary\":\"Stopping tasks with a cancel flag, interrupt() and Future.cancel(), which blocking calls react to it, and cleaning up afterwards.\",\"duration\":8,\"tags\":[\"java\",\"concurrency\",\"interrupt\",\"cancellation\",\"InterruptedException\",\"NIO\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 21, Terminating tasks\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"tij-concurrency/terminating-tasks/step-1\",\"tij-concurrency/terminating-tasks/step-2\",\"tij-concurrency/terminating-tasks/tij-concurrency-ornamentalgarden\",\"tij-concurrency/terminating-tasks/tij-concurrency-interrupting\",\"tij-concurrency/terminating-tasks/tij-concurrency-closeresource\",\"tij-concurrency/terminating-tasks/tij-concurrency-niointerruption\",\"tij-concurrency/terminating-tasks/tij-concurrency-multilock\",\"tij-concurrency/terminating-tasks/tij-concurrency-interrupting2\",\"tij-concurrency/terminating-tasks/tij-concurrency-interruptingidiom\"],\"exercises\":[\"tij-concurrency/terminating-tasks/tij-concurrency-ornamentalgarden\",\"tij-concurrency/terminating-tasks/tij-concurrency-interrupting\",\"tij-concurrency/terminating-tasks/tij-concurrency-closeresource\",\"tij-concurrency/terminating-tasks/tij-concurrency-niointerruption\",\"tij-concurrency/terminating-tasks/tij-concurrency-multilock\",\"tij-concurrency/terminating-tasks/tij-concurrency-interrupting2\",\"tij-concurrency/terminating-tasks/tij-concurrency-interruptingidiom\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-concurrency/terminating-tasks/step-1\",\"title\":\"What an interrupt can wake\",\"body\":\"\u003cp\u003e\u003ccode\u003einterrupt()\u003c/code\u003e (or \u003ccode\u003eshutdownNow()\u003c/code\u003e / \u003ccode\u003efuture.cancel(true)\u003c/code\u003e) sets a flag and wakes threads blocked in \u003ccode\u003esleep\u003c/code\u003e, \u003ccode\u003ewait\u003c/code\u003e, \u003ccode\u003ejoin\u003c/code\u003e, \u003ccode\u003elockInterruptibly\u003c/code\u003e or NIO channel I/O.\u003c/p\u003e\\n\u003cp\u003eIt does not wake a thread blocked on classic stream I/O or waiting to enter a \u003ccode\u003esynchronized\u003c/code\u003e block.\u003c/p\u003e\\n\u003cp\u003eClosing the stream or channel underneath releases blocked I/O.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-concurrency/terminating-tasks/step-2\",\"title\":\"The interruption idiom\",\"body\":\"\u003cp\u003eA task checks \u003ccode\u003eThread.interrupted()\u003c/code\u003e in its loop, and catches \u003ccode\u003eInterruptedException\u003c/code\u003e from blocking calls — either way it exits.\u003c/p\u003e\\n\u003cp\u003eEvery resource gets a \u003ccode\u003etry\u003c/code\u003e/\u003ccode\u003efinally\u003c/code\u003e right after it\u0026#39;s created, so it\u0026#39;s cleaned up whichever way the task leaves.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003esynchronized\u003c/code\u003e method can call another \u003ccode\u003esynchronized\u003c/code\u003e method on the same object: the lock is reentrant.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-concurrency-ornamentalgarden\",\"key\":\"tij-concurrency/terminating-tasks/tij-concurrency-ornamentalgarden\",\"prompt\":\"\u003cp\u003eFive entrances count visitors for 3 seconds, then \u003ccode\u003ecancel()\u003c/code\u003e sets the \u003ccode\u003evolatile\u003c/code\u003e flag. What do the last two lines show? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003eTotal\u003c/code\u003e and \u003ccode\u003eSum of Entrances\u003c/code\u003e are equal (150 and 150 on a Java 21 run)\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eSome tasks were not terminated!\u003c/code\u003e first\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach task sees the flag within 100 ms, well inside the 250 ms wait.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eTotal\u003c/code\u003e is lower, because updates are lost\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eCount.increment()\u003c/code\u003e is \u003ccode\u003esynchronized\u003c/code\u003e; remove that and they\u0026#39;d differ.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-interrupting\",\"key\":\"tij-concurrency/terminating-tasks/tij-concurrency-interrupting\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ef.cancel(true)\u003c/code\u003e interrupts each task in turn: one blocked in \u003ccode\u003esleep\u003c/code\u003e, one in \u003ccode\u003eSystem.in.read()\u003c/code\u003e, one waiting to enter a \u003ccode\u003esynchronized\u003c/code\u003e method. Which interrupts work? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhen we ran it, stdin was empty, so \u003ccode\u003eread()\u003c/code\u003e returned at once (\u003ccode\u003eExiting IOBlocked.run()\u003c/code\u003e); at a console it would block until you typed something.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Only the \u003ccode\u003esleep\u003c/code\u003e — blocked stream I/O and waiting for a monitor can\u0026#39;t be interrupted, so \u003ccode\u003emain\u003c/code\u003e ends with \u003ccode\u003eSystem.exit(0)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003esleep\u003c/code\u003e and \u003ccode\u003eread()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eClassic stream I/O ignores interrupts.\u003c/p\u003e\\n\"},{\"html\":\"All three\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly \u003ccode\u003esleep\u003c/code\u003e, \u003ccode\u003ewait\u003c/code\u003e and similar calls throw \u003ccode\u003eInterruptedException\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-closeresource\",\"key\":\"tij-concurrency/terminating-tasks/tij-concurrency-closeresource\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eIOBlocked\u003c/code\u003e (from \u003ccode\u003eInterrupting\u003c/code\u003e) prints \u003ccode\u003eWaiting for read():\u003c/code\u003e, calls \u003ccode\u003ein.read()\u003c/code\u003e, and on an \u003ccode\u003eIOException\u003c/code\u003e prints \u003ccode\u003eInterrupted from blocked I/O\u003c/code\u003e if its thread is interrupted. What frees the task blocked on the socket? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run, \u003ccode\u003eInterrupted from blocked I/O\u003c/code\u003e appeared right after \u003ccode\u003eClosing java.net.Socket$SocketInputStream\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Nothing; it stays blocked\",\"correct\":false,\"feedback\":\"\u003cp\u003eClosing the stream makes \u003ccode\u003eread()\u003c/code\u003e throw.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eshutdownNow()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe interrupt is recorded, but the blocked read doesn\u0026#39;t notice it.\u003c/p\u003e\\n\"},{\"html\":\"Closing \u003ccode\u003esocketInput\u003c/code\u003e — \u003ccode\u003eshutdownNow()\u003c/code\u003e alone does nothing to a blocked \u003ccode\u003eread()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-niointerruption\",\"key\":\"tij-concurrency/terminating-tasks/tij-concurrency-niointerruption\",\"prompt\":\"\u003cp\u003eOne task is cancelled with \u003ccode\u003ef.cancel(true)\u003c/code\u003e; the other\u0026#39;s channel \u003ccode\u003esc2\u003c/code\u003e is closed. Which exceptions do they get? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"\u003ccode\u003eClosedByInterruptException\u003c/code\u003e for the cancelled one, \u003ccode\u003eAsynchronousCloseException\u003c/code\u003e for the closed one\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eInterruptedException\u003c/code\u003e for both\",\"correct\":false,\"feedback\":\"\u003cp\u003eChannel reads don\u0026#39;t throw \u003ccode\u003eInterruptedException\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Neither — NIO reads, like stream reads, ignore interrupts\",\"correct\":false,\"feedback\":\"\u003cp\u003eNIO channels respond to interrupts.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-multilock\",\"key\":\"tij-concurrency/terminating-tasks/tij-concurrency-multilock\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ef1()\u003c/code\u003e and \u003ccode\u003ef2()\u003c/code\u003e are both \u003ccode\u003esynchronized\u003c/code\u003e and call each other. What does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undef
