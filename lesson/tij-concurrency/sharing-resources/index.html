step-2\",\"tij-concurrency/sharing-resources/tij-concurrency-intgenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-evenchecker\",\"tij-concurrency/sharing-resources/tij-concurrency-evengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-synchronizedevengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-mutexevengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-attemptlocking\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicity\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicitytest\",\"tij-concurrency/sharing-resources/tij-concurrency-serialnumbergenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-serialnumberchecker\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicintegertest\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicevengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-criticalsection\"],\"exercises\":[\"tij-concurrency/sharing-resources/tij-concurrency-intgenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-evenchecker\",\"tij-concurrency/sharing-resources/tij-concurrency-evengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-synchronizedevengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-mutexevengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-attemptlocking\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicity\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicitytest\",\"tij-concurrency/sharing-resources/tij-concurrency-serialnumbergenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-serialnumberchecker\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicintegertest\",\"tij-concurrency/sharing-resources/tij-concurrency-atomicevengenerator\",\"tij-concurrency/sharing-resources/tij-concurrency-criticalsection\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-concurrency/sharing-resources/step-1\",\"title\":\"Locks\",\"body\":\"\u003cp\u003eWhen threads share mutable state, every access — reads included — must hold the same lock.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003esynchronized\u003c/code\u003e methods lock \u003ccode\u003ethis\u003c/code\u003e; a \u003ccode\u003esynchronized(obj)\u003c/code\u003e block locks \u003ccode\u003eobj\u003c/code\u003e; a \u003ccode\u003eReentrantLock\u003c/code\u003e must be unlocked in \u003ccode\u003efinally\u003c/code\u003e, but can also \u003ccode\u003etryLock()\u003c/code\u003e and give up.\u003c/p\u003e\\n\u003cp\u003eTwo different locks protect nothing from each other.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-concurrency/sharing-resources/step-2\",\"title\":\"Atomicity and visibility\",\"body\":\"\u003cp\u003e\u003ccode\u003ei++\u003c/code\u003e is several bytecode steps (read, add, write), so two threads can lose updates.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e makes writes visible to other threads but doesn\u0026#39;t make \u003ccode\u003ei++\u003c/code\u003e atomic.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eAtomicInteger.addAndGet()\u003c/code\u003e is atomic; a \u003ccode\u003eThreadLocal\u003c/code\u003e gives each thread its own copy, so nothing is shared at all.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-concurrency-intgenerator\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-intgenerator\",\"prompt\":\"\u003cp\u003eWhy is \u003ccode\u003ecanceled\u003c/code\u003e declared \u003ccode\u003evolatile\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"To make \u003ccode\u003enext()\u003c/code\u003e atomic\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e affects only the \u003ccode\u003ecanceled\u003c/code\u003e field, and only visibility.\u003c/p\u003e\\n\"},{\"html\":\"So a \u003ccode\u003ecancel()\u003c/code\u003e on one thread is seen by the other threads checking \u003ccode\u003eisCanceled()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s required for \u003ccode\u003eabstract\u003c/code\u003e classes\",\"correct\":false,\"feedback\":\"\u003cp\u003eNo such rule.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-evenchecker\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-evenchecker\",\"prompt\":\"\u003cp\u003e\u003ccode\u003etest(gp)\u003c/code\u003e starts ten \u003ccode\u003eEvenChecker\u003c/code\u003es. What do they share?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Only the \u003ccode\u003eid\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach has its own \u003ccode\u003eid\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"The single generator \u003ccode\u003egp\u003c/code\u003e — all ten call \u003ccode\u003enext()\u003c/code\u003e on it concurrently\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing; each checker makes its own generator\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey\u0026#39;re all given the same \u003ccode\u003egp\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-evengenerator\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-evengenerator\",\"prompt\":\"\u003cp\u003eTen threads call \u003ccode\u003enext()\u003c/code\u003e at the same time. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run ten checkers each reported an odd value, like \u003ccode\u003e26875 not even!\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Exactly one \u003ccode\u003enot even!\u003c/code\u003e line\",\"correct\":false,\"feedback\":\"\u003cp\u003eOther checkers may also find odd values before they see \u003ccode\u003ecanceled\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ePress Control-C to exit\u003c/code\u003e, then quickly some \u003ccode\u003eN not even!\u003c/code\u003e lines, and the checkers stop\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It runs forever; \u003ccode\u003enext()\u003c/code\u003e always adds 2\",\"correct\":false,\"feedback\":\"\u003cp\u003eOne thread can read the value between another thread\u0026#39;s two increments.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-synchronizedevengenerator\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-synchronizedevengenerator\",\"prompt\":\"\u003cp\u003e\u003ccode\u003enext()\u003c/code\u003e is now \u003ccode\u003esynchronized\u003c/code\u003e, even with a \u003ccode\u003eyield()\u003c/code\u003e between the increments. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"It never reports an odd value — it runs until you stop it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It still prints \u003ccode\u003enot even!\u003c/code\u003e, because of the \u003ccode\u003eyield()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eyield()\u003c/code\u003e doesn\u0026#39;t release the lock, so no other thread can enter \u003ccode\u003enext()\u003c/code\u003e in between.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-mutexevengenerator\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-mutexevengenerator\",\"prompt\":\"\u003cp\u003eWhy is the \u003ccode\u003ereturn\u003c/code\u003e inside the \u003ccode\u003etry\u003c/code\u003e, before \u003ccode\u003eunlock()\u003c/code\u003e in \u003ccode\u003efinally\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Because \u003ccode\u003ereturn\u003c/code\u003e can\u0026#39;t come after a \u003ccode\u003efinally\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt could, but then it would read \u003ccode\u003ecurrentEvenValue\u003c/code\u003e without the lock.\u003c/p\u003e\\n\"},{\"html\":\"It makes no difference\",\"correct\":false,\"feedback\":\"\u003cp\u003eReading after unlocking would let another thread change the value first.\u003c/p\u003e\\n\"},{\"html\":\"So the value is read while the lock is still held — \u003ccode\u003efinally\u003c/code\u003e runs after the return value is computed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-attemptlocking\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-attemptlocking\",\"prompt\":\"\u003cp\u003eThe book expects the last two calls to print \u003ccode\u003efalse\u003c/code\u003e. What do they really print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run all four printed \u003ccode\u003etrue\u003c/code\u003e, and \u003ccode\u003eacquired\u003c/code\u003e came last — the daemon took the lock only after \u003ccode\u003emain\u003c/code\u003e was done with it.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Always \u003ccode\u003efalse\u003c/code\u003e — \u003ccode\u003eyield()\u003c/code\u003e lets the new thread run first\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eyield()\u003c/code\u003e is only a hint.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003euntimed\u003c/code\u003e prints \u003ccode\u003efalse\u003c/code\u003e, and \u003ccode\u003etimed\u003c/code\u003e waits forever\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003etryLock(2, SECONDS)\u003c/code\u003e gives up after 2 seconds.\u003c/p\u003e\\n\"},{\"html\":\"It depends on timing: if the new thread hasn\u0026#39;t called \u003ccode\u003elock()\u003c/code\u003e yet, they print \u003ccode\u003etrue\u003c/code\u003e; \u003ccode\u003eyield()\u003c/code\u003e guarantees nothing\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-atomicity\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-atomicity\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ejavap -c Atomicity\u003c/code\u003e shows \u003ccode\u003ef1()\u003c/code\u003e\u0026#39;s bytecode. Is \u003ccode\u003ei++\u003c/code\u003e atomic?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"Yes — it\u0026#39;s a single statement\",\"correct\":false,\"feedback\":\"\u003cp\u003eOne statement can be several bytecode steps.\u003c/p\u003e\\n\"},{\"html\":\"Yes, because \u003ccode\u003eint\u003c/code\u003e writes are atomic\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach read and write is atomic, but the read-add-write sequence isn\u0026#39;t.\u003c/p\u003e\\n\"},{\"html\":\"No — it\u0026#39;s a \u003ccode\u003egetfield\u003c/code\u003e, an add, and a \u003ccode\u003eputfield\u003c/code\u003e; another thread can run between them\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-atomicitytest\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-atomicitytest\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eevenIncrement()\u003c/code\u003e is \u003ccode\u003esynchronized\u003c/code\u003e, so \u003ccode\u003ei\u003c/code\u003e changes by 2 at a time. What does this program do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run it printed \u003ccode\u003e1\u003c/code\u003e straight away.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"Deadlocks\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s only one lock, and the reader never takes it.\u003c/p\u003e\\n\"},{\"html\":\"Runs forever; \u003ccode\u003ei\u003c/code\u003e is always even\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly writers hold the lock; the reader doesn\u0026#39;t.\u003c/p\u003e\\n\"},{\"html\":\"Prints an odd number and exits — \u003ccode\u003egetValue()\u003c/code\u003e isn\u0026#39;t synchronized, so it can read \u003ccode\u003ei\u003c/code\u003e between the two increments\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-serialnumbergenerator\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-serialnumbergenerator\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eserialNumber\u003c/code\u003e is \u003ccode\u003evolatile\u003c/code\u003e. Is \u003ccode\u003enextSerialNumber()\u003c/code\u003e thread-safe?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"Yes, thanks to \u003ccode\u003evolatile\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the trap the example shows.\u003c/p\u003e\\n\"},{\"html\":\"No — \u003ccode\u003evolatile\u003c/code\u003e gives visibility, but \u003ccode\u003eserialNumber++\u003c/code\u003e is still a read-modify-write that two threads can interleave\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-serialnumberchecker\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-serialnumberchecker\",\"prompt\":\"\u003cp\u003eWith no argument, ten checkers call \u003ccode\u003enextSerialNumber()\u003c/code\u003e in a loop. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run several checkers each printed a duplicate (like \u003ccode\u003eDuplicate: 4103\u003c/code\u003e) before \u003ccode\u003eSystem.exit\u003c/code\u003e took effect.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1c\",\"options\":[{\"html\":\"It runs forever: serial numbers are unique\",\"correct\":false,\"feedback\":\"\u003cp\u003eTwo threads can read the same value before either writes it back.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eNo duplicates detected\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s printed only with an argument, and only if no duplicate was found in time.\u003c/p\u003e\\n\"},{\"html\":\"Soon one or more \u003ccode\u003eDuplicate: N\u003c/code\u003e lines, then the program exits\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-atomicintegertest\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-atomicintegertest\",\"prompt\":\"\u003cp\u003eThis is \u003ccode\u003eAtomicityTest\u003c/code\u003e rewritten with an \u003ccode\u003eAtomicInteger\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1d\",\"options\":[{\"html\":\"It runs forever\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003eTimer\u003c/code\u003e calls \u003ccode\u003eSystem.exit(0)\u003c/code\u003e after 5 seconds.\u003c/p\u003e\\n\"},{\"html\":\"No odd value is ever seen; after 5 seconds the timer prints \u003ccode\u003eAborting\u003c/code\u003e to stderr and exits\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It prints an odd number, like \u003ccode\u003eAtomicityTest\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eaddAndGet(2)\u003c/code\u003e is one atomic step, so there\u0026#39;s never an in-between value.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-atomicevengenerator\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-atomicevengenerator\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1e\",\"options\":[{\"html\":\"Only \u003ccode\u003ePress Control-C to exit\u003c/code\u003e — \u003ccode\u003eaddAndGet(2)\u003c/code\u003e never exposes an odd value, so it runs until stopped\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003enot even!\u003c/code\u003e lines, since \u003ccode\u003enext()\u003c/code\u003e isn\u0026#39;t \u003ccode\u003esynchronized\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe atomic operation needs no lock.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-criticalsection\",\"key\":\"tij-concurrency/sharing-resources/tij-concurrency-criticalsection\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePairManager1\u003c/code\u003e locks the whole \u003ccode\u003eincrement()\u003c/code\u003e (including the slow \u003ccode\u003estore()\u003c/code\u003e); \u003ccode\u003ePairManager2\u003c/code\u003e locks only the updates. After 500 ms, which shows the higher \u003ccode\u003echeckCounter\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eHold a lock only as long as you must. On some runs the main thread itself can starve waiting for \u003ccode\u003epm1\u003c/code\u003e\u0026#39;s lock, so the program may print nothing for a while.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1f\",\"options\":[{\"html\":\"\u003ccode\u003epm2\u003c/code\u003e — by far: its lock is free during the 50 ms \u003ccode\u003estore()\u003c/code\u003e, so the checker gets in far more often\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003epm1\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003epm1\u003c/code\u003e\u0026#39;s checker waits for the lock almost all the time.\u003c/p\u003e\\n\"},{\"html\":\"About the same\",\"correct\":false,\"feedback\":\"\u003cp\u003eOn a Java 21 run: 823 checks for \u003ccode\u003epm1\u003c/code\u003e, 354,726,926 for \u003ccode\u003epm2\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Concurrency\",\"next\":{\"id\":\"sharing-resources-code\",\"courseId\":\"tij-concurrency\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-concurrency/sharin
