u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    exec.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003eexecute\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003enew\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e ExceptionThread\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e());\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e  }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"daemons-joining-exceptions\",\"courseId\":\"tij-concurrency\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-concurrency/daemons-joining-exceptions\",\"title\":\"Daemons, joining and exceptions\",\"summary\":\"Daemon threads, join() and interrupt(), keeping a UI responsive, and catching exceptions that escape a thread.\",\"duration\":8,\"tags\":[\"java\",\"concurrency\",\"daemon threads\",\"join\",\"UncaughtExceptionHandler\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 21, Basic threading — daemon threads, joining a thread, catching exceptions\"}],\"requires\":[],\"steps\":12,\"stepKeys\":[\"tij-concurrency/daemons-joining-exceptions/step-1\",\"tij-concurrency/daemons-joining-exceptions/step-2\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-simpledaemons\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemonfromfactory\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemons\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemonsdontrunfinally\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-joining\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-responsiveui\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-exceptionthread\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-naiveexceptionhandling\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-captureuncaughtexception\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-settingdefaulthandler\"],\"exercises\":[\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-simpledaemons\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemonfromfactory\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemons\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemonsdontrunfinally\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-joining\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-responsiveui\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-exceptionthread\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-naiveexceptionhandling\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-captureuncaughtexception\",\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-settingdefaulthandler\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-concurrency/daemons-joining-exceptions/step-1\",\"title\":\"Daemons and join\",\"body\":\"\u003cp\u003eA daemon thread doesn\u0026#39;t keep the program alive: when the last non-daemon thread ends, the JVM exits and daemons stop abruptly — even their \u003ccode\u003efinally\u003c/code\u003e blocks don\u0026#39;t run.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003esetDaemon(true)\u003c/code\u003e must come before \u003ccode\u003estart()\u003c/code\u003e, and threads a daemon creates are daemons too.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003et.join()\u003c/code\u003e waits for \u003ccode\u003et\u003c/code\u003e to finish; interrupting a sleeping thread throws \u003ccode\u003eInterruptedException\u003c/code\u003e and clears its interrupted flag.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-concurrency/daemons-joining-exceptions/step-2\",\"title\":\"Exceptions in threads\",\"body\":\"\u003cp\u003eAn exception thrown in a task can\u0026#39;t be caught by a \u003ccode\u003etry\u003c/code\u003e around \u003ccode\u003eexec.execute(...)\u003c/code\u003e — it happens on another thread.\u003c/p\u003e\\n\u003cp\u003eIt goes to the thread\u0026#39;s \u003ccode\u003eUncaughtExceptionHandler\u003c/code\u003e, which you set per thread (e.g. in a \u003ccode\u003eThreadFactory\u003c/code\u003e) or for all threads with \u003ccode\u003eThread.setDefaultUncaughtExceptionHandler\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWithout one, the stack trace is printed to \u003ccode\u003eSystem.err\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-concurrency-simpledaemons\",\"key\":\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-simpledaemons\",\"prompt\":\"\u003cp\u003eEach daemon prints every 100 ms in an endless loop, and \u003ccode\u003emain\u003c/code\u003e sleeps 175 ms. What happens? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"It runs forever\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly non-daemon threads keep the JVM running.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eAll daemons started\u003c/code\u003e, then about one round of daemon lines, then the program ends — daemons don\u0026#39;t keep it alive\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003esleep() interrupted\u003c/code\u003e ten times at the end\",\"correct\":false,\"feedback\":\"\u003cp\u003eDaemons are stopped without any interrupt or cleanup.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-daemonfromfactory\",\"key\":\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemonfromfactory\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eDaemonThreadFactory\u003c/code\u003e (from \u003ccode\u003enet.mindview.util\u003c/code\u003e) makes each new thread with \u003ccode\u003esetDaemon(true)\u003c/code\u003e. What ends this program? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Nothing; it loops forever\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith a normal factory it would; the daemon factory changes that.\u003c/p\u003e\\n\"},{\"html\":\"Each task being interrupted\",\"correct\":false,\"feedback\":\"\u003cp\u003eNo \u003ccode\u003eInterrupted\u003c/code\u003e line is printed — daemons just stop.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003emain\u003c/code\u003e returning after 500 ms — every pool thread is a daemon, so nothing keeps the JVM alive\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-daemons\",\"key\":\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemons\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eDaemon\u003c/code\u003e never calls \u003ccode\u003esetDaemon\u003c/code\u003e on the ten threads it creates. What does \u003ccode\u003et[i].isDaemon()\u003c/code\u003e print for them? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn Java 21 all ten printed \u003ccode\u003etrue\u003c/code\u003e, and the program ended when \u003ccode\u003emain\u003c/code\u003e finished its one-second sleep.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e — a new thread inherits daemon status from the thread that creates it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e — threads are non-daemon unless you say otherwise\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe default is copied from the creating thread, which is a daemon here.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-daemonsdontrunfinally\",\"key\":\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-daemonsdontrunfinally\",\"prompt\":\"\u003cp\u003eWhat does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe daemon may not even get to print before \u003ccode\u003emain\u003c/code\u003e returns, so in principle the output could be empty.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eStarting ADaemon\\nExiting via InterruptedException\\nThis should always run?\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eDaemons aren\u0026#39;t interrupted; they\u0026#39;re simply abandoned.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eStarting ADaemon\\nThis should always run?\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eWhen \u003ccode\u003emain\u003c/code\u003e ends, the JVM stops the daemon in the middle of its sleep — the \u003ccode\u003efinally\u003c/code\u003e never runs.\u003c/p\u003e\\n\"},{\"html\":\"Starting ADaemon\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-concurrency-joining\",\"key\":\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-joining\",\"prompt\":\"\u003cp\u003eSleepy and Grumpy each sleep 1.5 s; Dopey joins Sleepy and Doc joins Grumpy; then \u003ccode\u003emain\u003c/code\u003e interrupts Grumpy. What does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eSleepy has awakened\\nDopey join completed\\nGrumpy was interrupted. isInterrupted(): false\\nDoc join completed\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eGrumpy is interrupted at once; Sleepy wakes 1.5 s later.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eGrumpy was interrupted. isInterrupted(): false\\nDoc join completed\\nSleepy has awakened\\nDopey join completed\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eGrumpy was interrupted. isInterrupted(): true\\nDoc join completed\\nSleepy has awakened\\nDopey join completed\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eWhen \u003ccode\u003eInterruptedException\u003c/code\u003e is thrown, the interrupted flag is cleared, so \u003ccode\u003eisInterrupted()\u003c/code\u003e is \u003ccode\u003efalse\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-concurrency-responsiveui\",\"key\":\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-responsiveui\",\"prompt\":\"\u003cp\u003eWhy would \u003ccode\u003enew UnresponsiveUI()\u003c/code\u003e (commented out) make the program hang, while \u003ccode\u003eResponsiveUI\u003c/code\u003e reacts to Enter?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"\u003ccode\u003eUnresponsiveUI\u003c/code\u003e throws an exception\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ed\u003c/code\u003e grows forever and stays positive; the loop never ends.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eUnresponsiveUI\u003c/code\u003e computes forever on the main thread and never reaches \u003ccode\u003eread()\u003c/code\u003e; \u003ccode\u003eResponsiveUI\u003c/code\u003e computes on a separate daemon thread, so \u003ccode\u003emain\u003c/code\u003e can wait for input\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eResponsiveUI\u003c/code\u003e stops computing when Enter is pressed\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt keeps computing; \u003ccode\u003emain\u003c/code\u003e prints \u003ccode\u003ed\u003c/code\u003e and returns, and the daemon dies with the JVM.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-exceptionthread\",\"key\":\"tij-concurrency/daemons-joining-exceptions/tij-concurrency-exceptionthread\",\"prompt\":\"\u003cp\u003eWhat happens when this runs?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn Java 21 the program then lingers for about a minute: the cached pool keeps idle threads alive 60 s, and nobody called \u003ccode\u003eshutdown()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\
