ue, PriorityBlockingQueue, scheduled executors, Semaphore and Exchanger.\",\"duration\":8,\"tags\":[\"java\",\"concurrency\",\"CountDownLatch\",\"CyclicBarrier\",\"DelayQueue\",\"Semaphore\",\"Exchanger\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 21, New library components\"}],\"requires\":[],\"steps\":11,\"stepKeys\":[\"tij-concurrency/library-components/step-1\",\"tij-concurrency/library-components/step-2\",\"tij-concurrency/library-components/tij-concurrency-countdownlatchdemo\",\"tij-concurrency/library-components/tij-concurrency-horserace\",\"tij-concurrency/library-components/tij-concurrency-delayqueuedemo\",\"tij-concurrency/library-components/tij-concurrency-priorityblockingqueuedemo\",\"tij-concurrency/library-components/tij-concurrency-greenhousescheduler\",\"tij-concurrency/library-components/tij-concurrency-pool\",\"tij-concurrency/library-components/tij-concurrency-semaphoredemo\",\"tij-concurrency/library-components/tij-concurrency-fat\",\"tij-concurrency/library-components/tij-concurrency-exchangerdemo\"],\"exercises\":[\"tij-concurrency/library-components/tij-concurrency-countdownlatchdemo\",\"tij-concurrency/library-components/tij-concurrency-horserace\",\"tij-concurrency/library-components/tij-concurrency-delayqueuedemo\",\"tij-concurrency/library-components/tij-concurrency-priorityblockingqueuedemo\",\"tij-concurrency/library-components/tij-concurrency-greenhousescheduler\",\"tij-concurrency/library-components/tij-concurrency-pool\",\"tij-concurrency/library-components/tij-concurrency-semaphoredemo\",\"tij-concurrency/library-components/tij-concurrency-fat\",\"tij-concurrency/library-components/tij-concurrency-exchangerdemo\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-concurrency/library-components/step-1\",\"title\":\"Synchronizers\",\"body\":\"\u003cp\u003eA \u003ccode\u003eCountDownLatch(n)\u003c/code\u003e lets tasks \u003ccode\u003eawait()\u003c/code\u003e until \u003ccode\u003ecountDown()\u003c/code\u003e has been called n times; it can\u0026#39;t be reset.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eCyclicBarrier(n, action)\u003c/code\u003e makes n tasks wait for each other, runs the action, then resets for the next round.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eSemaphore(n)\u003c/code\u003e hands out n permits; \u003ccode\u003eacquire()\u003c/code\u003e blocks when none are left.\u003c/p\u003e\\n\u003cp\u003eAn \u003ccode\u003eExchanger\u003c/code\u003e swaps objects between two tasks.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-concurrency/library-components/step-2\",\"title\":\"Special queues and scheduling\",\"body\":\"\u003cp\u003eA \u003ccode\u003eDelayQueue\u003c/code\u003e hands out an element only after its delay has expired, soonest first.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003ePriorityBlockingQueue\u003c/code\u003e hands out the element that \u003ccode\u003ecompareTo\u003c/code\u003e puts first.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eScheduledThreadPoolExecutor\u003c/code\u003e runs tasks once after a delay (\u003ccode\u003eschedule\u003c/code\u003e) or repeatedly (\u003ccode\u003escheduleAtFixedRate\u003c/code\u003e).\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-concurrency-countdownlatchdemo\",\"key\":\"tij-concurrency/library-components/tij-concurrency-countdownlatchdemo\",\"prompt\":\"\u003cp\u003eTen \u003ccode\u003eWaitingTask\u003c/code\u003es \u003ccode\u003eawait()\u003c/code\u003e a latch of 100; each of 100 \u003ccode\u003eTaskPortion\u003c/code\u003es sleeps randomly, prints \u003ccode\u003ecompleted\u003c/code\u003e, and counts down. When do the \u003ccode\u003eLatch barrier passed\u003c/code\u003e lines appear? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca hr \":\"After each horse\u0026#39;s step\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe action runs once, when the last of the 7 arrives.\u003c/p\u003e\\n\"},{\"html\":\"Only at the end of the race\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe barrier resets and its action runs every round.\u003c/p\u003e\\n\"},{\"html\":\"Each time all seven horses have reached \u003ccode\u003eawait()\u003c/code\u003e — once per round, before any of them takes the next step\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-delayqueuedemo\",\"key\":\"tij-concurrency/library-components/tij-concurrency-delayqueuedemo\",\"prompt\":\"\u003cp\u003eTwenty tasks are queued with random delays, plus an \u003ccode\u003eEndSentinel\u003c/code\u003e at 5000 ms. In what order does the consumer run them? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"In the order they were added, Task 0 first\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003etake()\u003c/code\u003e returns only expired elements, soonest-expiring first.\u003c/p\u003e\\n\"},{\"html\":\"Longest delay first\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ecompareTo\u003c/code\u003e puts the earliest trigger time first.\u003c/p\u003e\\n\"},{\"html\":\"By delay, shortest first — \u003ccode\u003e[128 ] Task 11\u003c/code\u003e, \u003ccode\u003e[200 ] Task 7\u003c/code\u003e, … — and the sentinel runs last and calls \u003ccode\u003eshutdownNow()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-priorityblockingqueuedemo\",\"key\":\"tij-concurrency/library-components/tij-concurrency-priorityblockingqueuedemo\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ecompareTo\u003c/code\u003e returns 1 when this task\u0026#39;s priority is lower. Which task does \u003ccode\u003etake()\u003c/code\u003e hand out? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"The highest priority waiting at that moment — 9s before 8s, the 10s as they trickle in, and the −1 sentinel last\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Strictly in priority order across the whole run\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly what\u0026#39;s in the queue at the moment counts: on a Java 21 run, a 0 ran before the later 10s arrived.\u003c/p\u003e\\n\"},{\"html\":\"The lowest priority first\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe comparison is reversed, so higher priority comes first.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-greenhousescheduler\",\"key\":\"tij-concurrency/library-components/tij-concurrency-greenhousescheduler\",\"prompt\":\"\u003cp\u003eWhy does \u003ccode\u003eTerminate\u003c/code\u003e start a new \u003ccode\u003eThread\u003c/code\u003e to print the collected data?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run, the nine data points printed after \u003ccode\u003eTerminating\u003c/code\u003e, half an hour apart, starting from the run\u0026#39;s own date.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Printing is not allowed on scheduler threads\",\"correct\":false,\"feedback\":\"\u003cp\u003eAny thread can print.\u003c/p\u003e\\n\"},{\"html\":\"It has just called \u003ccode\u003escheduler.shutdownNow()\u003c/code\u003e, so it can\u0026#39;t hand more work to the scheduler\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"To make the data printing faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s about the scheduler being shut down.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-pool\",\"key\":\"tij-concurrency/library-components/tij-concurrency-pool\",\"prompt\":\"\u003cp\u003eWhat does the \u003ccode\u003eSemaphore\u003c/code\u003e add on top of the \u003ccode\u003esynchronized\u003c/code\u003e \u003ccode\u003egetItem()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Nothing; it\u0026#39;s redundant\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout it, \u003ccode\u003egetItem()\u003c/code\u003e would return \u003ccode\u003enull\u003c/code\u003e when the pool is empty.\u003c/p\u003e\\n\"},{\"html\":\"It makes \u003ccode\u003echeckOut()\u003c/code\u003e block when every item is checked out, until one is checked back in\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Mutual exclusion inside \u003ccode\u003egetItem()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003esynchronized\u003c/code\u003e already provides that; the semaphore counts free items.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-semaphoredemo\",\"key\":\"tij-concurrency/library-components/tij-concurrency-semaphoredemo\",\"prompt\":\"\u003cp\u003e\u003ccode\u003emain\u003c/code\u003e checks out all 25 \u003ccode\u003eFat\u003c/code\u003e objects, then a task calls \u003ccode\u003epool.checkOut()\u003c/code\u003e once more. What happens to that task? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e, \u003ccode\u003eprintnb\u003c/code\u003e is \u003ccode\u003eprint\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe second loop of \u003ccode\u003echeckIn\u003c/code\u003e calls is ignored: \u003ccode\u003ereleaseItem\u003c/code\u003e returns \u003ccode\u003efalse\u003c/code\u003e for items that aren\u0026#39;t checked out, so no extra permits are released.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"It gets a second reference to a checked-out object\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003echeckedOut[]\u003c/code\u003e prevents that.\u003c/p\u003e\\n\"},{\"html\":\"It blocks in \u003ccode\u003eacquire()\u003c/code\u003e until \u003ccode\u003ecancel(true)\u003c/code\u003e interrupts it — \u003ccode\u003echeckOut() Interrupted\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It gets \u003ccode\u003enull\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe semaphore blocks before \u003ccode\u003egetItem()\u003c/code\u003e is reached.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-fat\",\"key\":\"tij-concurrency/library-components/tij-concurrency-fat\",\"prompt\":\"\u003cp\u003eWhy is \u003ccode\u003ed\u003c/code\u003e declared \u003ccode\u003evolatile\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"Because several threads update \u003ccode\u003ed\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach \u003ccode\u003eFat\u003c/code\u003e is used by one thread; \u003ccode\u003evolatile\u003c/code\u003e here just stops optimisation.\u003c/p\u003e\\n\"},{\"html\":\"So the compiler can\u0026#39;t optimise away the expensive loop whose result is never used\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-exchangerdemo\",\"key\":\"tij-concurrency/library-components/tij-concurrency-exchangerdemo\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eBasicGenerator.create(Fat.class)\u003c/code\u003e makes new \u003ccode\u003eFat\u003c/code\u003e objects with the no-argument constructor. Why are the lists \u003ccode\u003eCopyOnWriteArrayList\u003c/code\u003es?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn a Java 21 run with the default 5-second delay, it printed \u003ccode\u003eFinal value: Fat id: 55019\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"The consumer removes items while iterating with for-each; a copy-on-write list iterates over a snapshot, so there\u0026#39;s no \u003ccode\u003eConcurrentModificationException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Because the two tasks use the same list at the same time\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003eExchanger\u003c/code\u003e swaps the lists; each is used by one task at a time.\u003c/p\u003e\\n\"},
