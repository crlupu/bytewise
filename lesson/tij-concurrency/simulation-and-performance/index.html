u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e  }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"simulation-and-performance\",\"courseId\":\"tij-concurrency\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-concurrency/simulation-and-performance\",\"title\":\"Simulations and performance\",\"summary\":\"A bank teller, a restaurant and a car assembly line built from tasks and queues; comparing locks, atomics and concurrent containers; active objects.\",\"duration\":8,\"tags\":[\"java\",\"concurrency\",\"simulation\",\"performance\",\"CopyOnWriteArrayList\",\"ConcurrentHashMap\",\"ReadWriteLock\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 21, Simulation; Performance tuning; Active objects\"}],\"requires\":[],\"steps\":13,\"stepKeys\":[\"tij-concurrency/simulation-and-performance/step-1\",\"tij-concurrency/simulation-and-performance/step-2\",\"tij-concurrency/simulation-and-performance/tij-concurrency-banktellersimulation\",\"tij-concurrency/simulation-and-performance/tij-concurrency-restaurant2-restaurantwithqueues\",\"tij-concurrency/simulation-and-performance/tij-concurrency-carbuilder\",\"tij-concurrency/simulation-and-performance/tij-concurrency-simplemicrobenchmark\",\"tij-concurrency/simulation-and-performance/tij-concurrency-synchronizationcomparisons\",\"tij-concurrency/simulation-and-performance/tij-concurrency-tester\",\"tij-concurrency/simulation-and-performance/tij-concurrency-listcomparisons\",\"tij-concurrency/simulation-and-performance/tij-concurrency-mapcomparisons\",\"tij-concurrency/simulation-and-performance/tij-concurrency-fastsimulation\",\"tij-concurrency/simulation-and-performance/tij-concurrency-readerwriterlist\",\"tij-concurrency/simulation-and-performance/tij-concurrency-activeobjectdemo\"],\"exercises\":[\"tij-concurrency/simulation-and-performance/tij-concurrency-banktellersimulation\",\"tij-concurrency/simulation-and-performance/tij-concurrency-restaurant2-restaurantwithqueues\",\"tij-concurrency/simulation-and-performance/tij-concurrency-carbuilder\",\"tij-concurrency/simulation-and-performance/tij-concurrency-simplemicrobenchmark\",\"tij-concurrency/simulation-and-performance/tij-concurrency-synchronizationcomparisons\",\"tij-concurrency/simulation-and-performance/tij-concurrency-tester\",\"tij-concurrency/simulation-and-performance/tij-concurrency-listcomparisons\",\"tij-concurrency/simulation-and-performance/tij-concurrency-mapcomparisons\",\"tij-concurrency/simulation-and-performance/tij-concurrency-fastsimulation\",\"tij-concurrency/simulation-and-performance/tij-concurrency-readerwriterlist\",\"tij-concurrency/simulation-and-performance/tij-concurrency-activeobjectdemo\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-concurrency/simulation-and-performance/step-1\",\"title\":\"Simulations\",\"body\":\"\u003cp\u003eModel each actor (teller, customer, robot) as a task, and connect them with blocking queues and barriers.\u003c/p\u003e\\n\u003cp\u003eRead-only objects can be shared freely; mutable state stays inside one task or behind a lock.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-concurrency/simulation-and-performance/step-2\",\"title\":\"Measuring\",\"body\":\"\u003cp\u003eMicrobenchmarks mislead: the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e can optimise a single-threaded loop until the lock costs nothing.\u003c/p\u003e\\n\u003cp\u003eUnder contention, \u003ccode\u003esynchronized\u003c/code\u003e, \u003ccode\u003eLock\u003c/code\u003e and atomics rank differently from run to run and JVM to JVM — measure your real workload.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eCopyOnWriteArrayList\u003c/code\u003e and \u003ccode\u003eConcurrentHashMap\u003c/code\u003e make reads cheap.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eReadWriteLock\u003c/code\u003e lets many readers in at once, but only one writer.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-concurrency-banktellersimulation\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-banktellersimulation\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eworkingTellers\u003c/code\u003e is a \u003ccode\u003ePriorityQueue\u0026lt;Teller\u0026gt;\u003c/code\u003e ordered by \u003ccode\u003ecompareTo\u003c/code\u003e on \u003ccode\u003ecustomersServed\u003c/code\u003e. When the line is short, which teller does \u003ccode\u003ereassignOneTeller()\u003c/code\u003e take away?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith no argument it waits for Enter; with \u003ccode\u003e5\u003c/code\u003e it runs five seconds and then \u003ccode\u003eshutdownNow()\u003c/code\u003e interrupts every task.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"The one who has served the fewest customers — the head of the queue\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The one who has served the most\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would be the tail of the queue.\u003c/p\u003e\\n\"},{\"html\":\"The most recently hired\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003epoll()\u003c/code\u003e takes the head, the smallest by \u003ccode\u003ecompareTo\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-restaurant2-restaurantwithqueues\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-restaurant2-restaurantwithqueues\",\"prompt\":\"\u003cp\u003eEach \u003ccode\u003eCustomer\u003c/code\u003e receives courses through a \u003ccode\u003eSynchronousQueue\u0026lt;Plate\u0026gt;\u003c/code\u003e. What does that guarantee? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Courses queue up on the table\",\"correct\":false,\"feedback\":\"\u003cp\u003eA \u003ccode\u003eSynchronousQueue\u003c/code\u003e has no capacity.\u003c/p\u003e\\n\"},{\"html\":\"The customer never blocks\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003etake()\u003c/code\u003e blocks until a plate is delivered.\u003c/p\u003e\\n\"},{\"html\":\"A waitperson\u0026#39;s \u003ccode\u003edeliver()\u003c/code\u003e blocks until the customer \u003ccode\u003etake()\u003c/code\u003es the plate — one course at a time\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-carbuilder\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-carbuilder\",\"prompt\":\"\u003cp\u003eThe engine, drive-train and wheel robots work on each car in any order. What does the \u003ccode\u003eReporter\u003c/code\u003e print for each car? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Always \u003ccode\u003eengine: true driveTrain: true wheels: true\u003c/code\u003e — the \u003ccode\u003eAssembler\u003c/code\u003e waits on a \u003ccode\u003eCyclicBarrier(4)\u003c/code\u003e until all three robots finish\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Sometimes a part is still \u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe car goes to the finishing queue only after the barrier trips.\u003c/p\u003e\\n\"},{\"html\":\"Nothing; the robots deadlock\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach robot powers down and returns to the pool after the barrier.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-simplemicrobenchmark\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-simplemicrobenchmark\",\"prompt\":\"\u003cp\u003eThis times 10 million single-threaded increments with \u003ccode\u003esynchronized\u003c/code\u003e and with a \u003ccode\u003eReentrantLock\u003c/code\u003e. What does the result tell you?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOn Java 21 it printed \u003ccode\u003eLock/synchronized = 0.763\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"Little about real code: with no contention, the JIT can optimise both, so the ratio says nothing about locks under load\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"That \u003ccode\u003eLock\u003c/code\u003e is always faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout contention, this doesn\u0026#39;t measure locking at all.\u003c/p\u003e\\n\"},{\"html\":\"That \u003ccode\u003esynchronized\u003c/code\u003e is always faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe ratio changes with JVM, hardware and contention.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e\"]},{\"id\":\"tij-concurrency-synchronizationcomparisons\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-synchronizationcomparisons\",\"prompt\":\"\u003cp\u003eFour modifiers and four readers share each accumulator. What does the \u003ccode\u003eAtomicTest\u003c/code\u003e comment admit? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe timings vary a lot by JVM. On Java 21, \u003ccode\u003esynchronized\u003c/code\u003e took about 2.6× the baseline and \u003ccode\u003eLock\u003c/code\u003e about 1.4× in the first round — the book\u0026#39;s run had \u003ccode\u003eLock\u003c/code\u003e slower.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"\u003ccode\u003eAtomicLong\u003c/code\u003e can overflow\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s not the issue.\u003c/p\u003e\\n\"},{\"html\":\"Atomics are always slower than locks\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe comment is about correctness, not speed.\u003c/p\u003e\\n\"},{\"html\":\"Using two atomics (\u003ccode\u003eindex\u003c/code\u003e and \u003ccode\u003evalue\u003c/code\u003e) together isn\u0026#39;t atomic as a whole, so the result is wrong — it\u0026#39;s kept only as a timing indicator\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-tester\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-tester\",\"prompt\":\"\u003cp\u003eHow does \u003ccode\u003erunTest()\u003c/code\u003e know when all readers and writers have finished?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"It calls \u003ccode\u003eexec.awaitTermination()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe executor is shared and stays alive between tests.\u003c/p\u003e\\n\"},{\"html\":\"Each \u003ccode\u003eTestTask\u003c/code\u003e calls \u003ccode\u003eendLatch.countDown()\u003c/code\u003e at the end; \u003ccode\u003erunTest()\u003c/code\u003e blocks in \u003ccode\u003eendLatch.await()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It sleeps for a fixed time\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt waits on the \u003ccode\u003eCountDownLatch\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-listcomparisons\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-listcomparisons\",\"prompt\":\"\u003cp\u003eReaders call \u003ccode\u003eget()\u003c/code\u003e and writers call \u003ccode\u003eset()\u003c/code\u003e. Which list is fast for readers, and when does it get slow?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"They perform the same\",\"correct\":false,\"feedback\":\"\u003cp\u003eIn the book\u0026#39;s run, synchronized reads were hundreds of times slower.\u003c/p\u003e\\n\"},{\"html\":\"The synchronized \u003ccode\u003eArrayList\u003c/code\u003e — it\u0026#39;s fastest in every case\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery read on it takes the lock.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eCopyOnWriteArrayList\u003c/code\u003e: reads take no lock, but each write copies the whole array, so it slows down with many writers\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-concurrency-mapcomparisons\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-mapcomparisons\",\"prompt\":\"\u003cp\u003eWhy does \u003ccode\u003eConcurrentHashMap\u003c/code\u003e beat \u003ccode\u003eCollections.synchronizedMap(new HashMap())\u003c/code\u003e here?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"It isn\u0026#39;t thread-safe\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt is, without one lock for the whole map.\u003c/p\u003e\\n\"},{\"html\":\"Its reads take no lock and its writes lock only a small part of the table, so threads rarely block each other\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It copies the map on every write\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the copy-on-write strategy, not \u003ccode\u003eConcurrentHashMap\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-fastsimulation\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-fastsimulation\",\"prompt\":\"\u003cp\u003eWhen does an \u003ccode\u003eEvolver\u003c/code\u003e print \u003ccode\u003eOld value changed from …\u003c/code\u003e? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith 50 threads on Java 21, it printed over 200 such lines in 5 seconds; the program just reports them and carries on.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"Never — atomics can\u0026#39;t fail\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ecompareAndSet\u003c/code\u003e returns \u003ccode\u003efalse\u003c/code\u003e when the current value isn\u0026#39;t the expected one.\u003c/p\u003e\\n\"},{\"html\":\"When \u003ccode\u003ecompareAndSet\u003c/code\u003e fails because another thread changed that cell after this one read it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Every time it updates a cell\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly when the compare-and-set fails.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-readerwriterlist\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-readerwriterlist\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eget()\u003c/code\u003e prints \u003ccode\u003egetReadLockCount()\u003c/code\u003e whenever it\u0026#39;s above 1. What do the printed numbers show? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1c\",\"options\":[{\"html\":\"That several readers hold the read lock at once — the write lock alone is exclusive\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"How many writers are waiting\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt counts read-lock holds.\u003c/p\u003e\\n\"},{\"html\":\"Nothing is printed — a read lock is exclusive\",\"correct\":false,\"feedback\":\"\u003cp\u003eRead locks are shared; on Java 21 it printed over 2,000 counts.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-concurrency-activeobjectdemo\",\"key\":\"tij-concurrency/simulation-and-performance/tij-concurrency-activeobjectdemo\",\"prompt\":\"\u003cp\u003eWhy is \u003ccode\u003eresults\u003c/code\u003e a \u003ccode\u003eCopyOnWriteArrayList\u003c/code\u003e? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAll calls run on one thread of a single-thread executor, so the calculations happen one at a time, in the order they were made. That\u0026#39;s the point of an active object.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1d\",\"options\":[{\"html\":\"To keep the results in order\",\"correct\":false,\"feedback\":\"\u003cp\u003eAny \u003ccode\u003eList\u003c/code\u003e keeps insertion order.\u003c/p\u003e\\n\"},{\"html\":\"Because the executor\u0026#39;s thread adds to it\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly \u003ccode\u003emain\u003c/code\u003e touches \u003ccode\u003eresults\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"The loop removes finished futures while iterating over the list; a copy-on-write list iterates over a snapshot, so that\u0026#39;s safe\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Concurrency\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approa
