mp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompare-and-swap\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-3\",\"title\":\"Queues are harder\",\"body\":\"\u003cp\u003eA stack changes one reference.\u003c/p\u003e\\n\u003cp\u003eA queue must change two: the last node and the tail.\u003c/p\u003e\\n\u003cp\u003eOne \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e can\u0026#39;t do both.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-4\",\"prompt\":\"\u003cp\u003eWhy is a linked queue harder than a stack?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe Michael–Scott queue handles it by letting any thread finish another thread\u0026#39;s half-done insert, helping it along.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA stack changes one reference per operation — the top — so a single CAS publishes the whole change.\u003c/p\u003e\\n\u003cp\u003eAdding to a linked queue changes two: the old tail\u0026#39;s \u003ccode\u003enext\u003c/code\u003e and the queue\u0026#39;s \u003ccode\u003etail\u003c/code\u003e pointer, and no CAS can update both at once.\u003c/p\u003e\\n\u003cp\u003eThe Michael–Scott algorithm lets the queue sit in an intermediate state where \u003ccode\u003enext\u003c/code\u003e is set but \u003ccode\u003etail\u003c/code\u003e lags; any thread that sees this state first helps finish the other thread\u0026#39;s insert by advancing \u003ccode\u003etail\u003c/code\u003e, then does its own work.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Adding a node updates two references — the old tail\u0026#39;s \u003ccode\u003enext\u003c/code\u003e and the tail pointer — which can\u0026#39;t be changed in one CAS\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Queues need locks by definition\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eConcurrentLinkedQueue\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock-free\\\" data-def=\\\"Some thread always makes progress, even though individual threads may have to retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock-free\u003c/button\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompare-and-swap\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-5\",\"title\":\"The ABA problem\",\"body\":\"\u003cp\u003eA value can change from A to B and back to A.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e can\u0026#39;t tell anything happened.\u003c/p\u003e\\n\u003cp\u003eAdd a version number, as \u003ccode\u003eAtomicStampedReference\u003c/code\u003e does.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-6\",\"prompt\":\"\u003cp\u003eWhy is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ABA problem\\\" data-def=\\\"A value changes from A to B and back to A between your read and your CAS, so the CAS succeeds even though things changed. Fixed with a version stamp.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eABA\u003c/button\u003e rarely a problem in Java\u0026#39;s own \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Nonblocking algorithm\\\" data-def=\\\"An algorithm where a thread\u0026amp;#39;s failure or suspension can\u0026amp;#39;t stop others from progressing. Built on CAS instead of locks.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003enonblocking\u003c/button\u003e collections?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIn languages where nodes are freed and recycled manually, ABA is a classic source of bugs.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eABA happens when a thread reads value A, another thread changes it to B and back to A, and the first thread\u0026#39;s CAS succeeds because it only sees A again — even though the structure changed.\u003c/p\u003e\\n\u003cp\u003eIn C, a freed node\u0026#39;s memory can be reused for a new node at the same address, which is how this arises in practice.\u003c/p\u003e\\n\u003cp\u003eIn Java, a node can\u0026#39;t be reused while any thread still holds a reference to it, because the garbage collector won\u0026#39;t free it, so the classic ABA scenario can\u0026#39;t occur for references.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Garbage collection means a node can\u0026#39;t be reused while any thread still holds a reference to it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Java\u0026#39;s CAS checks the full history\",\"correct\":false,\"feedback\":\"\u003cp\u003eCAS only compares current values.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompare-and-swap\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-7\",\"prompt\":\"\u003cp\u003eA reference paired with a version counter.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"AtomicStampedReference\u003cNode\u003e top = new \"},{\"answers\":[\"AtomicStampedReference\"],\"size\":22,\"choices\":[\"compareAndSet\",\"AtomicStampedReference\",\"withInitial\",\"threadNumber\"]},{\"text\":\"\u003c\u003e(null, 0);\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Atomic variables and nonblocking synchronization\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Ex
