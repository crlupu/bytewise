step-2\",\"key\":\"jcip-atomics/compare-and-swap/step-2\",\"title\":\"Compare-and-swap is optimistic\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e says: set it to the new value, if it still holds the old one.\u003c/p\u003e\\n\u003cp\u003eIf another thread changed it, nothing happens.\u003c/p\u003e\\n\u003cp\u003eThen you read again and retry.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-atomics/compare-and-swap/step-3\",\"prompt\":\"\u003cp\u003eTwo threads increment \u003ccode\u003ecount\u003c/code\u003e with \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e: read, add one, then \u003ccode\u003eCAS count: old → tmp\u003c/code\u003e. Interleave them so that a CAS\\n\u003cstrong\u003efails at least once\u003c/strong\u003e — and check the final count.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe losing thread wasn\u0026#39;t blocked — it was told it lost, re-read and retried. No update was lost: the count is 2,\\nwhatever the interleaving.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet both threads read 0. Let one CAS succeed; then the other\u0026#39;s CAS expects 0 but finds 1.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":2,\"increments\":1,\"cas\":true},\"goal\":{\"count\":2,\"retries\":1},\"question\":{\"prompt\":\"\u003cp\u003eWhat did the thread whose CAS failed do next?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Blocked until the other thread released a lock\",\"correct\":false,\"feedback\":\"\u003cp\u003eCAS takes no lock; nothing blocks.\u003c/p\u003e\\n\"},{\"html\":\"Gave up, so \u003ccode\u003ecount\u003c/code\u003e ended at 1\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe count still ends at 2 — a failed CAS just means try again.\u003c/p\u003e\\n\"},{\"html\":\"Read \u003ccode\u003ecount\u003c/code\u003e again and retried, so no update was lost\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},{\"id\":\"step-4\",\"key\":\"jcip-atomics/compare-and-swap/step-4\",\"prompt\":\"\u003cp\u003eComplete a CAS-based increment — retry until the swap succeeds.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s essentially what \u003ccode\u003eincrementAndGet()\u003c/code\u003e does for you.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"int v;\\ndo {\\n    v = value.get();\\n} while (!value.\"},{\"answers\":[\"compareAndSet\"],\"size\":13,\"choices\":[\"putIfAbsent\",\"AtomicStampedReference\",\"compareAndSet\",\"invokeLater\"]},{\"text\":\"(v, v + 1));\\n\"}],\"code\":true,\"caseSensitive\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-atomics/compare-and-swap/step-5\",\"title\":\"CAS usually wins\",\"body\":\"\u003cp\u003eFailed \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e attempts retry instead of sleeping.\u003c/p\u003e\\n\u003cp\u003eAt realistic \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtention\u003c/button\u003e, that beats locking.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-atomics/compare-and-swap/step-6\",\"prompt\":\"\u003cp\u003eUnder heavy \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtention\u003c/button\u003e, many threads \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e the same variable and most fail. Is that worse than locking?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eJCIP\u0026#39;s measurements found atomics scale better than locks at low and moderate contention, and locks only catch up at very high contention.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA lock makes losing threads sleep, which costs a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Context switch\\\" data-def=\\\"The CPU stops one thread and starts another, saving and restoring registers and disturbing caches. Costs thousands of cycles.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtext switch\u003c/button\u003e to suspend them and another to wake them.\u003c/p\u003e\\n\u003cp\u003eA failed CAS costs only a retry, done while the thread keeps running.\u003c/p\u003e\\n\u003cp\u003eAt moderate contention, retries are cheap and rare, so atomics win; at extreme contention, many threads burn CPU retrying the same location, and a lock\u0026#39;s queueing can catch up.\u003c/p\u003e\\n\u003cp\u003eReal programs mostly do other work between updates, which keeps contention in the range where atomics shine.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"CAS never fails\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt fails whenever another thread changed the value first.\u003c/p\u003e\\n\"},{\"html\":\"It can be at extreme contention, but at realistic levels atomics usually outperform locks — failed threads retry instead of being suspended\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"jcip-atomics/compare-and-swap/step-7\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Compare-and-swap\",\"Optimistic concurrency\",\"Pessimistic concurrency\"],\"right\":[\"Atomically set a value only if it still equals an expected value\",\"Proceed hoping for no interference; detect it and retry if there was\",\"Prevent interference up front, by locking\"],\"rightOrder\":[2,1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;qu
