s-and-memory/memory-issues/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tsj-threads-and-memory/memory-issues/step-1\",\"title\":\"Read the error's message\",\"body\":\"\u003cp\u003e\u0026quot;Java heap space\u0026quot; means live objects filled the heap.\u003c/p\u003e\\n\u003cp\u003e\u0026quot;\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Metaspace\\\" data-def=\\\"Native memory holding class metadata. It grows as classes are loaded.\\\" data-book=\\\"Java Performance\\\"\u003eMetaspace\u003c/button\u003e\u0026quot; means too many classes were loaded.\u003c/p\u003e\\n\u003cp\u003e\u0026quot;unable to create native thread\u0026quot; means the OS refused another thread.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"tsj-threads-and-memory/memory-issues/step-2\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"OutOfMemoryError\\\" data-def=\\\"Thrown when the JVM can\u0026amp;#39;t allocate memory. Its message says which area ran out — heap, metaspace, or native threads.\\\" data-book=\\\"Troubleshooting Java\\\"\u003e\u003ccode\u003eOutOfMemoryError\u003c/code\u003e\u003c/button\u003e message with a likely cause.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Java heap space\",\"Metaspace\",\"unable to create native thread\",\"GC overhead limit exceeded\"],\"right\":[\"Too many live objects — a leak, or the heap is too small\",\"Classes loaded over and over, often by redeploys or generated proxies\",\"Too many threads for the OS or the container\",\"The JVM spends almost all its time collecting and freeing almost nothing\"],\"rightOrder\":[1,2,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Metaspace\\\" data-def=\\\"Native memory holding class metadata. It grows as classes are loaded.\\\" data-book=\\\"Java Performance\\\"\u003eMetaspace\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tsj-threads-and-memory/memory-issues/step-3\",\"title\":\"Capture a heap dump\",\"body\":\"\u003cp\u003eStart the JVM with \u003ccode\u003e-XX:+HeapDumpOnOutOfMemoryError\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOr take one from a running app with \u003ccode\u003ejcmd \u0026lt;pid\u0026gt; GC.heap_dump\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe dump can be as large as the heap, and contains its data.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tsj-threads-and-memory/memory-issues/step-4\",\"title\":\"Find what holds the memory\",\"body\":\"\u003cp\u003eOpen the dump in a tool like Eclipse MAT or \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"VisualVM\\\" data-def=\\\"A free graphical tool for monitoring and profiling running JVMs — CPU, memory, threads and heap dumps.\\\" data-book=\\\"Troubleshooting Java\\\"\u003eVisualVM\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eSort by \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Retained size\\\" data-def=\\\"Retained size is the memory that would be freed if an object were collected — itself plus everything only it keeps alive. Shallow size is just the object.\\\" data-book=\\\"Java Performance\\\"\u003eretained size\u003c/button\u003e to see the biggest owners.\u003c/p\u003e\\n\u003cp\u003eFollow the path from a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"GC root\\\" data-def=\\\"A reference that\u0026amp;#39;s always reachable — a static field, a local variable on a thread\u0026amp;#39;s stack — from which the GC traces live objects.\\\" data-book=\\\"Java Performance\\\"\u003eGC root\u003c/button\u003e to see why they\u0026#39;re alive.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-5\",\"key\":\"tsj-threads-and-memory/memory-issues/step-5\",\"prompt\":\"\u003cp\u003eThe dump shows a static \u003ccode\u003eMap\u003c/code\u003e in a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e class retaining 2 GB of \u003ccode\u003eSession\u003c/code\u003e objects. What\u0026#39;s the likely bug?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA static field lives as long as its class is loaded — usually the whole run — so anything in that map stays reachable.\u003c/p\u003e\\n\u003cp\u003eIf sessions are put in but never removed when they end, the map grows with every user, and the heap eventually fills.\u003c/p\u003e\\n\u003cp\u003eThe fix is eviction: remove entries when sessions end, bound the cache with a size or expiry, or hold entries through \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Weak reference\\\" data-def=\\\"A reference that doesn\u0026amp;#39;t keep its object alive; once nothing stronger refers to it, it\u0026amp;#39;s freed at the next GC.\\\" data-book=\\\"Java Performance\\\"\u003eweak references\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The heap is too small for normal operation\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe static map keeps growing because nothing removes entries — a bigger heap only delays the crash.\u003c/p\u003e\\n\"},{\"html\":\"Sessions are added to the cache but never removed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"tsj-threads-and-memory/memory-issues/step-6\",\"prompt\":\"\u003cp\u003eWhy must \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Heap dump\\\" data-def=\\\"A file with every object in the heap and the references between them, for finding what fills memory.\\\" data-book=\\\"Java Performance\\\"\u003eheap dumps\u003c/button\u003e be handled carefully?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Opening them can crash the application\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey\u0026#39;re analysed offline; the concern is what\u0026#39;s inside them.\u003c/p\u003e\\n\"},{\"html\":\"They contain every object\u0026#39;s data — passwords, tokens and personal data included\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Threads, deadlocks and memory\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\
