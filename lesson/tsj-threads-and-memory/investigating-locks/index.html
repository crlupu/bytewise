r a \u003ccode\u003esynchronized\u003c/code\u003e block.\u003c/p\u003e\\n\u003cp\u003eWAITING and TIMED_WAITING threads wait to be woken, by \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"notify\\\" data-def=\\\"Wakes one arbitrary thread waiting on this object\u0026amp;#39;s condition queue. Can wake the wrong one if waiters wait for different things.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003enotify\u003c/code\u003e\u003c/button\u003e, \u003ccode\u003eunpark\u003c/code\u003e or a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003etimeout\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"tsj-threads-and-memory/investigating-locks/step-2\",\"prompt\":\"\u003cp\u003eMatch each situation with the thread state you\u0026#39;d see.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Waiting to enter a \u003ccode\u003esynchronized\u003c/code\u003e method another thread is in\",\"Called \u003ccode\u003equeue.take()\u003c/code\u003e on an empty queue\",\"Called \u003ccode\u003eThread.sleep(1000)\u003c/code\u003e\",\"Computing a hash\"],\"right\":[\"BLOCKED\",\"WAITING\",\"TIMED_WAITING\",\"RUNNABLE\"],\"rightOrder\":[2,3,0,1]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tsj-threads-and-memory/investigating-locks/step-3\",\"title\":\"Find the owner\",\"body\":\"\u003cp\u003eA blocked thread shows the lock it wants.\u003c/p\u003e\\n\u003cp\u003eAnother thread\u0026#39;s stack shows it holds that lock.\u003c/p\u003e\\n\u003cp\u003eWhat is the owner doing, and why so long?\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-4\",\"key\":\"tsj-threads-and-memory/investigating-locks/step-4\",\"prompt\":\"\u003cp\u003eFifty threads are BLOCKED on the same lock. The owner is RUNNABLE inside a \u003ccode\u003esynchronized\u003c/code\u003e method, calling a remote service. What\u0026#39;s the problem?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe owner isn\u0026#39;t stuck — it\u0026#39;s RUNNABLE — but it holds the lock while waiting for a slow remote service.\u003c/p\u003e\\n\u003cp\u003eEvery other thread that needs the lock is BLOCKED behind it, so the whole application runs at the speed of that one remote call.\u003c/p\u003e\\n\u003cp\u003eIt isn\u0026#39;t a deadlock, because the owner will eventually finish. The fix is to make the call outside the lock.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A deadlock\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe owner is making progress; it\u0026#39;s just slow. In a deadlock, the owners wait for each other.\u003c/p\u003e\\n\"},{\"html\":\"Slow I/O while holding a lock — everyone waits for the network call\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"tsj-threads-and-memory/investigating-locks/step-5\",\"title\":\"Profilers show lock contention\",\"body\":\"\u003cp\u003eA profiler can count how often and how long threads waited on each lock.\u003c/p\u003e\\n\u003cp\u003eThe most contended lock is the first to fix.\u003c/p\u003e\\n\u003cp\u003eShrink what\u0026#39;s inside it, or stop sharing the
