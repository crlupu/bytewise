\u003c/text\u003e\u003ccircle class=\"dg-dot\" cx=\"123.6\" cy=\"145\" r=\"4.5\"/\u003e\u003ctext class=\"dg-member\" x=\"12\" y=\"171\"\u003ewaits for\u003c/text\u003e\u003ccircle class=\"dg-dot\" cx=\"123.6\" cy=\"167\" r=\"4.5\"/\u003e\u003c/g\u003e\u003cg class=\"dg-node\"\u003e\u003crect class=\"dg-box\" x=\"0\" y=\"200\" width=\"141.6\" height=\"30\" rx=\"10\"/\u003e\u003ctext class=\"dg-name\" x=\"12\" y=\"220\"\u003eLock 1\u003c/text\u003e\u003c/g\u003e\u003cg class=\"dg-node\"\u003e\u003crect class=\"dg-box\" x=\"0\" y=\"248\" width=\"141.6\" height=\"30\" rx=\"10\"/\u003e\u003ctext class=\"dg-name\" x=\"12\" y=\"268\"\u003eLock 2\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003cfigcaption\u003eFollow the arrows and you come back where you started.\u003c/figcaption\u003e\u003c/figure\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"deadlocks-in-thread-dumps\",\"courseId\":\"tsj-threads-and-memory\",\"topicId\":\"troubleshooting-java\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps\",\"title\":\"Finding deadlocks in thread dumps\",\"summary\":\"Take a thread dump, and the JVM names the deadlocked threads and the locks in their cycle.\",\"duration\":6,\"tags\":[\"java\",\"troubleshooting\",\"deadlock\",\"thread dump\",\"jstack\"],\"sources\":[{\"book\":\"troubleshooting-java\",\"ref\":\"Chapter 10, Investigating deadlocks with thread dumps\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-1\",\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-2\",\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-3\",\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-4\",\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-5\",\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-6\"],\"exercises\":[\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-3\",\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-4\",\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-1\",\"title\":\"Get a thread dump\",\"body\":\"\u003cp\u003e\u003ccode\u003ejstack \u0026lt;pid\u0026gt;\u003c/code\u003e or \u003ccode\u003ejcmd \u0026lt;pid\u0026gt; Thread.print\u003c/code\u003e prints every thread\u0026#39;s stack.\u003c/p\u003e\\n\u003cp\u003eA profiler can also take one, and \u003ccode\u003ekill -3\u003c/code\u003e writes one to the console.\u003c/p\u003e\\n\u003cp\u003eTake two or three, seconds apart, to see what\u0026#39;s stuck.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-2\",\"title\":\"Deadlock is a cycle\",\"body\":\"\u003cp\u003eThread A holds lock 1 and wants lock 2.\u003c/p\u003e\\n\u003cp\u003eThread B holds lock 2 and wants lock 1.\u003c/p\u003e\\n\u003cp\u003eNeither can move, ever.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-3\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-3\",\"prompt\":\"\u003cp\u003eA transfer locks the source account, then the destination. T1 transfers from \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eB\u003c/strong\u003e; T2 from \u003cstrong\u003eB\u003c/strong\u003e to \u003cstrong\u003eA\u003c/strong\u003e.\\n\u003cstrong\u003eMake them \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e\u003c/strong\u003e, as they did in production.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThis is what the thread dump would show: T1 holds A and waits for B, T2 holds B and waits for A.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet each thread take its first lock before either takes its second.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock A\",\"lock B\",\"transfer\",\"unlock B\",\"unlock A\"]},{\"name\":\"T2\",\"ops\":[\"lock B\",\"lock A\",\"transfer\",\"unlock A\",\"unlock B\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhat would a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread dump\\\" data-def=\\\"A snapshot of every thread in a JVM — its state, its stack, the locks it holds and the lock it\u0026amp;#39;s waiting for.\\\" data-book=\\\"Troubleshooting Java\\\"\u003ethread dump\u003c/button\u003e report now?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"An OutOfMemoryError\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing is allocating — the threads are simply stuck.\u003c/p\u003e\\n\"},{\"html\":\"A Java-level deadlock — T1 waiting for B held by T2, and T2 waiting for A held by T1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Both threads RUNNABLE\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeadlocked threads are BLOCKED, waiting for a monitor.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"id\":\"step-4\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-4\",\"prompt\":\"\u003cp\u003eIn a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread dump\\\" data-def=\\\"A snapshot of every thread in a JVM — its state, its stack, the locks it holds and the lock it\u0026amp;#39;s waiting for.\\\" data-book=\\\"Troubleshooting Java\\\"\u003ethread dump\u003c/button\u003e, how do you find a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Look for threads that are RUNNABLE\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeadlocked threads are BLOCKED or WAITING, not running.\u003c/p\u003e\\n\"},{\"html\":\"Look for \u0026quot;Found one Java-level deadlock\u0026quot;, which lists each thread, the lock it holds and the lock it waits for\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-5\",\"title\":\"Break the cycle\",\"body\":\"\u003cp\u003eMake every thread take locks in the same order — for example, by account ID.\u003c/p\u003e\\n\u003cp\u003eOr use \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"tryLock\\\" data-def=\\\"Acquire the lock only if it\u0026amp;#39;s free (optionally waiting up to a timeout); otherwise return \u0026lt;code\u0026gt;false\u0026lt;/code\u0026gt; so you can back off.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003etryLock\u003c/code\u003e\u003c/button\u003e with a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003etimeout\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eThen the cycle can\u0026#39;t form.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-6\",\"prompt\":\"\u003cp\u003eThe fix: both transfers lock the account with the \u003cstrong\u003elower ID first\u003c/strong\u003e — here always A, then B.\\nTry to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e them, then run both to completion.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhoever gets A first also gets B; the other waits for A while holding nothing.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock A\",\"lock B\",\"transfer\",\"unlock B\",\"unlock A\"]},{\"name\":\"T2\",\"ops\":[\"lock A\",\"lock B\",\"transfer\",\"unlock B\",\"unlock A\"]}]},\"goal\":{\"finished\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhile T1 holds A, what can T2 be holding?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"B\",\"correct\":false,\"feedback\":\"\u003cp\u003eT2 can only take B after A, and A is held by T1.\u003c/p\u003e\\n\"},{\"html\":\"Both A and B\",\"correct\":false,\"feedback\":\"\u003cp\u003eA is held by T1.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — it\u0026#39;s waiting for A, the first lock both take\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}}]},\"courseTitle\":\"Threads, deadlocks and memory\",\"next\":{\"id\":\"memory-issues\",\"courseId\":\"tsj-threads-and-memory\",\"topicId\":\"troubleshooting-java\",\"key\":\"tsj-threads-and-memory/memory-issues\",\"title\":\"Diagnosing memory problems\",\"summary\":\"An OutOfMemoryError names the area that ran out; a heap dump shows which objects filled it and what keeps them alive.\",\"duration\":6,\"tags\":[\"java\",\"troubleshooting\",\"memory\",\"outofmemoryerror\",\"heap dump\",\"memory leak\"],\"sources\":[{\"book\":\"troubleshooting-java\",\"ref\":\"Chapter 11, Find
