e\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e call each other recurse until the stack overflows.\u003c/p\u003e\\n\u003cp\u003eA collection that contains itself does the same.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-044\",\"key\":\"jm-exceptions/other-exceptions/jm-044\",\"prompt\":\"\u003cp\u003eTake 3 characters starting at index 4. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 5, Common exceptions — IndexOutOfBoundsException.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003eStringIndexOutOfBoundsException\u003c/code\u003e: the second argument is an end index, and 3 is before the start (6)\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It prints \u003ccode\u003e123\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would be \u003ccode\u003esubstring(6, 6 + 3)\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"jm-045\",\"key\":\"jm-exceptions/other-exceptions/jm-045\",\"prompt\":\"\u003cp\u003eWhere does this fail?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 5, Common exceptions — ClassCastException.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"It prints \u003ccode\u003e2\u
