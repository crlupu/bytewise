.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003eOptional\u003c/code\u003e\u003c/button\u003e, not \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003egetOrDefault\u003c/code\u003e, \u003ccode\u003eObjects.requireNonNull\u003c/code\u003e at boundaries, and put constants first in \u003ccode\u003e\u0026quot;x\u0026quot;.equals(s)\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-041\",\"key\":\"jm-exceptions/null-pointers/jm-041\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003estock.getOrDefault(\u0026quot;pear\u0026quot;, 0)\u003c/code\u003e. Java 21\u0026#39;s message says exactly what was null: \u003ccode\u003ethe return value of Map.get(Object)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 5, Common exceptions — NullPointerException from \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Autoboxing\\\" data-def=\\\"The compiler converting automatically between primitives and their boxed types — \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; ↔ \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eunboxing\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003eNullPointerException\u003c/code\u003e: \u003ccode\u003eget\u003c/code\u003e returns \u003ccode\u003enull\u003c/code\u003e, and assigning it to an \u003ccode\u003eint\u003c/code\u003e unboxes it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It prints \u003ccode\u003e0\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA missing key gives \ :\"$15\",\"options\":[{\"html\":\"Only \u003ccode\u003ejava.lang.NullPointerException\u003c/code\u003e, with no detail\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat was the message before helpful NPE messages arrived in Java 14.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eCannot invoke \u0026quot;Chain$Address.city()\u0026quot; because the return value of \u0026quot;Chain$User.address()\u0026quot; is null\u003c/code\u003e — Java 14+ names the null expression\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Common exceptions\",\"next\":{\"id\":\"other-exceptions\",\"courseId\":\"jm-exceptions\",\"topicId\":\"java-mistakes\",\"key\":\"jm-exceptions/other-exceptions\",\"title\":\"Index, cast and stack-overflow errors\",\"summary\":\"substring bounds, heap pollution behind ClassCastException, and recursion through toString.\",\"duration\":5,\"tags\":[\"java\",\"mistakes\",\"IndexOutOfBoundsException\",\"ClassCastException\",\"StackOverflowError\"],\"sources\":[{\"book\":\"java-mistakes\",\"ref\":\"Chapter 5, Common exceptions\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 5, Common exceptions — IndexOutOfBoundsException\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 5, Common exceptions — ClassCastException\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 5, Common exceptions — StackOverflowError\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jm-exceptions/other-exceptions/step-1\",\"jm-exceptions/other-exceptions/step-2\",\"jm-exceptions/other-exceptions/jm-044\",\"jm-exceptions/other-exceptions/jm-045\",\"jm-exceptions/other-exceptions/jm-046\"],\"exercises\":[\"jm-exceptions/other-exceptions/jm-044\",\"jm-exceptions/other-exceptions/jm-045\",\"jm-exceptions/other-exceptions/jm-046\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"author
