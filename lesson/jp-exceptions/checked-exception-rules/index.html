es/step-6\",\"jp-exceptions/checked-exception-rules/jpz-37a\",\"jp-exceptions/checked-exception-rules/jpz-37b\",\"jp-exceptions/checked-exception-rules/jpz-37c\",\"jp-exceptions/checked-exception-rules/jpz-38\",\"jp-exceptions/checked-exception-rules/jpz-43\",\"jp-exceptions/checked-exception-rules/jpz-44a\",\"jp-exceptions/checked-exception-rules/jpz-44b\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jp-exceptions/checked-exception-rules/step-1\",\"title\":\"Catch only what can be thrown\",\"body\":\"\u003cp\u003eCatching a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003echecked exception\u003c/button\u003e the \u003ccode\u003etry\u003c/code\u003e can\u0026#39;t throw is a compile error.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eException\u003c/code\u003e and \u003ccode\u003eThrowable\u003c/code\u003e are allowed anyway.\u003c/p\u003e\\n\u003cp\u003eThey also cover \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked exception\\\" data-def=\\\"A \u0026lt;code\u0026gt;RuntimeException\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;Error\u0026lt;/code\u0026gt;, which needn\u0026amp;#39;t be declared. Signals a programming error, like a violated precondition.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked exceptions\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-exceptions/checked-exception-rules/step-2\",\"prompt\":\"\u003cp\u003eWhich of these compiles?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003ecatch (RuntimeException e)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ecatch (IOException e)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eprintln\u003c/code\u003e doesn\u0026#39;t throw \u003ccode\u003eIOException\u003c/code\u003e, so the compiler rejects the catch as unreachable.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ecatch (Exception e)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jp-exceptions/checked-exception-rules/step-3\",\"title\":\"Definite assignment is conservative\",\"body\":\"\u003cp\u003eA \u003ccode\u003efinal\u003c/code\u003e field must be assigned exactly once.\u003c/p\u003e\\n\u003cp\u003eThe compiler can\u0026#39;t tell whether \u003ccode\u003etry\u003c/code\u003e finished its assignment before throwing.\u003c/p\u003e\\n\u003cp\u003eSo assigning in both \u003ccode\u003etry\u003c/code\u003e and \u003ccode\u003ecatch\u003c/code\u003e is rejected.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jp-exceptions/checked-exception-rules/step-4\",\"prompt\":\"\u003cp\u003eDoes this compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCompute the value in a helper method that returns it from \u003ccode\u003etry\u003c/code\u003e or \u003ccode\u003ecatch\u003c/code\u003e, and assign the field once.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe compiler checks that a \u003ccode\u003efinal\u003c/code\u003e field is definitely assigned exactly once on every path.\u003c/p\u003e\\n\u003cp\u003eIf \u003ccode\u003egetUserIdFromEnvironment()\u003c/code\u003e throws after the assignment — or the compiler can\u0026#39;t rule it out — the catch block would assign a second time.\u003c/p\u003e\\n\u003cp\u003eThe compiler\u0026#39;s analysis doesn\u0026#39;t reason about where exceptions can occur, so it rejects the code. Computing the value in a helper method that returns from both branches avoids the problem.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Yes\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe compiler doesn\u0026#39;t reason about when an exception can be thrown, so it assumes the \u003ccode\u003etry\u003c/code\u003e may have assigned it.\u003c/p\u003e\\n\"},{\"html\":\"No — \u0026quot;variable USER_ID might already have been assigned\u0026quot;\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"jp-exceptions/checked-exception-rules/step-5\",\"prompt\":\"\u003cp\u003eAssign the final field once, from a helper.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"private static final long USER_ID = \"},{\"answers\":[\"getUserIdOrGuest\"],\"size\":16,\"choices\":[\"getUserIdOrGuest\",\"!=\",\"try\",\"compare\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-6\",\"key\":\"jp-exceptions/checked-exception-rules/step-6\",\"prompt\":\"\u003cp\u003eTwo interfaces declare \u003ccode\u003evoid f()\u003c/code\u003e, one \u003ccode\u003ethrows CloneNotSupportedException\u003c/code\u003e and one \u003ccode\u003ethrows InterruptedException\u003c/code\u003e. A class implements both. What may its \u003ccode\u003ef()\u003c/code\u003e throw?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No checked exceptions — only the intersection of the two \u003ccode\u003ethrows\u003c/code\u003e clauses\",\"correct\":true,\"fe u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003eChecked exception\u003c/button\u003e\"]},{\"id\":\"jpz-37b\",\"key\":\"jp-exceptions/checked-exception-rules/jpz-37b\",\"prompt\":\"\u003cp\u003eThis catches \u003ccode\u003eException\u003c/code\u003e around an empty \u003ccode\u003etry\u003c/code\u003e. Does it compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 37, Exceptionally Arcane in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"No, for the same reason as catching \u003ccode\u003eIOException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe rule applies only to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003echecked exception\u003c/button\u003e classes that aren\u0026#39;t superclasses of \u003ccode\u003eRuntimeException\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Yes: \u003ccode\u003eException\u003c/code\u003e and \u003ccode\u003eThrowable\u003c/code\u003e can always be caught, because they include unchecked exceptions\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked exception\\\" data-def=\\\"A \u0026lt;code\u0026gt;RuntimeException\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;Error\u0026lt;/code\u0026gt;, which needn\u0026amp;#39;t be declared. Signals a programming error, like a violated precondition.\\\" data-book=\\\"Effective Java\\\"\u003eUnchecked exception\u003c/button\u003e\"]},{\"id\":\"jpz-37c\",\"key\":\"jp-exceptions/checked-exception-rules/jpz-37c\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eBoth\u003c/code\u003e inherits \u003ccode\u003ef()\u003c/code\u003e from two interfaces that declare different \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003echecked exceptions\u003c/button\u003e. Can \u003ccode\u003eb.f()\u003c/code\u003e be called without a \u003ccode\u003etry\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 37, Exceptionally Arcane in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"No: it must handle both exceptions (the union)\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn implementation must satisfy both, so it can throw neither.\u003c/p\u003e\\n\"},{\"html\":\"Yes: the inherited method may throw only exceptions that both declarations allow — the intersection, which is empty\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"jpz-38\",\"key\":\"jp-exceptions/checked-exception-rules/jpz-38\",\"prompt\":\"\u003cp\u003eDoes this compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCompute the value in a helper method that returns it, and assign the \u003 gram written for Bytewise, run on Java 21. It sets the same trap as Puzzle 43, Exceptionally Unsafe in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"It throws the checked \u003ccode\u003eException\u003c/code\u003e from \u003ccode\u003emain\u003c/code\u003e anyway: the cast to \u003ccode\u003eT\u003c/code\u003e is erased, so nothing stops it at run time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles with an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked warning\\\" data-def=\\\"The compiler saying it can\u0026amp;#39;t verify type safety at this point. Eliminate them, or prove safety and suppress with \u0026lt;code\u0026gt;@SuppressWarnings(\u0026amp;quot;unchecked\u0026amp;quot;)\u0026lt;/code\u0026gt; on the smallest scope.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked warning\u003c/button\u003e (\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Suppressed exception\\\" data-def=\\\"An exception thrown while closing a resource after another exception already happened. \u0026lt;code\u0026gt;try\u0026lt;/code\u0026gt;-with-resources keeps the first and attaches the others, retrievable with \u0026lt;code\u0026gt;getSuppressed()\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003esuppressed\u003c/button\u003e here).\u003c/p\u003e\\n\"},{\"html\":\"A \u003ccode\u003eClassCastException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe cast to a type variable is unchecked; it compiles to nothing.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\
