y-surprises/step-1\",\"title\":\"finally can override the try\",\"body\":\"\u003cp\u003e\u003ccode\u003efinally\u003c/code\u003e runs as the \u003ccode\u003etry\u003c/code\u003e block leaves, however it leaves.\u003c/p\u003e\\n\u003cp\u003eIf \u003ccode\u003efinally\u003c/code\u003e itself returns or throws, that replaces the original outcome.\u003c/p\u003e\\n\u003cp\u003eA pending return value or exception is silently discarded.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-exceptions/finally-surprises/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003edecision()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNever leave a \u003ccode\u003efinally\u003c/code\u003e block with \u003ccode\u003ereturn\u003c/code\u003e, \u003ccode\u003ebreak\u003c/code\u003e, \u003ccode\u003econtinue\u003c/code\u003e or \u003ccode\u003ethrow\u003c/code\u003e. It can also swallow an exception.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ereturn true\u003c/code\u003e evaluates its value and starts to leave the method, but \u003ccode\u003efinally\u003c/code\u003e runs first.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003ereturn\u003c/code\u003e inside \u003ccode\u003efinally\u003c/code\u003e replaces the pending return, so the method returns \u003ccode\u003efalse\u003c/code\u003e and the original \u003ccode\u003etrue\u003c/code\u003e is discarded.\u003c/p\u003e\\n\u003cp\u003eThe same happens to exceptions: a \u003ccode\u003ereturn\u003c/code\u003e in \u003ccode\u003efinally\u003c/code\u003e silently swallows any exception from the \u003ccode\u003etry\u003c/code\u003e block, which is why it\u0026#39;s considered a bug.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e block\u0026#39;s \u003ccode\u003ereturn\u003c/code\u003e replaces the pending one.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles — with a warning, in most IDEs.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"jp-exceptions/finally-surprises/step-3\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003ef()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003ereturn x\u003c/code\u003e evaluates \u003ccode\u003ex\u003c/code\u003e to 1 and saves that value before \u003ccode\u003efinally\u003c/code\u003e runs.\u003c/p\u003e\\n\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e block then changes the variable \u003ccode\u003ex\u003c/code\u003e, but the saved return value is already a copy of 1.\u003c/p\u003e\\n\u003cp\u003eHad \u003ccode\u003ex\u003c/code\u003e been a mutable object, changes to the object would be visible to the caller — but reassigning the variable never is.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e1\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e2\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ereturn x\u003c/code\u003e evaluates \u003ccode\u003ex\u003c/code\u003e before \u003ccode\u003efinally\u003c/code\u003e runs. Changing the variable afterwards doesn\u0026#39;t change the saved value.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jp-exceptions/finally-surprises/step-4\",\"title\":\"System.exit doesn't unwind\",\"body\":\"\u003cp\u003e\u003ccode\u003eSystem.exit\u003c/code\u003e stops the JVM from inside the \u003ccode\u003etry\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003ePending \u003ccode\u003efinally\u003c/code\u003e blocks never run.\u003c/p\u003e\\n\u003cp\u003eOnly shutdown hooks get a chance.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jp-exceptions/finally-surprises/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTo clean up on exit, register a shutdown hook with \u003ccode\u003eRuntime.getRuntime().addShutdownHook(...)\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Only \u003ccode\u003eHello world\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eHello world\u003c/code\u003e, then \u003ccode\u003eGoodbye world\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eSystem.exit\u003c/code\u003e doesn\u0026#39;t return, so the \u003ccode\u003etry\u003c/code\u003e block never finishes and \u003ccode\u003efinally\u003c/code\u003e never runs.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-6\",\"key\":\"jp-exceptions/finally-surprises/step-6\",\"prompt\":\"\u003cp\u003eWhich statements are safe to put in a \u003ccode\u003efinally\u003c/code\u003e block?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Closing a resource, inside its own try-catch\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ereturn result;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt would discard any exception thrown by the \u003ccode\u003etry\u003c/code\u003e block.\u003c/p\u003e\\n\"},{\"html\":\"Releasing a lock with \u003ccode\u003elock.unlock()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"id\":\"jpz-36\",\"key\":\"jp-exceptions/finally-surprises/jpz-36\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 36, Indecision in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"finally\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles (with a warning).\u003c/p\u003e\\n\"},{\"html\":\"try\",\"correct\":false,\"feedback\":\"\u003cp\u003eA \u003ccode\u003ereturn\u003c/code\u003e in \u003ccode\u003efinally\u003c/code\u003e replaces the pending return from \u003ccode\u003etry\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-39\",\"key\":\"jp-exceptions/finally-surprises/jpz-39\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTo run cleanup at exit, register a shutdown hook with \u003ccode\u003eRuntime.getRuntime().addShutdownHook(...)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 39, Hello, Goodbye in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Working\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eWorking\\nCleaning up\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eSystem.exit\u003c/code\u003e stops the JVM; it doesn\u0026#39;t return, so the \u003ccode\u003efinally\u003c/code\u003e never runs.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-42\",\"key\":\"jp-exceptions/finally-surprises/jpz-42\",\"prompt\":\"\u003cp\u003eCount the arrays whose third element is 3, stopping when the index runs off the end. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003e\u0026amp;\u0026amp;\u003c/code\u003e, and never use exceptions for ordinary loop control.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 42, Thrown for a Loop in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Prints \u003ccode\u003e2\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eTwo arrays qualify, but the loop stops early at the second test.\u003c/p\u003e\\n\"},{\"html\":\"Throws \u003ccode\u003eArrayIndexOutOfBoundsException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s caught — that\u0026#39;s the problem.\u003c/p\u003e\\n\"},{\"html\":\"Prints \u003ccode\u003e1\u003c/code\u003e: \u003ccode\u003e\u0026amp;\u003c/code\u003e doesn\u0026#39;t short-circuit, so \u003ccode\u003e{1, 2}\u003c/code\u003e throws — and the catch thinks the loop is done\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"jpz-45\",\"key\":\"jp-exceptions/finally-surprises/jpz-45\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 45, Exhausting Workout in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"It runs for practically forever: every \u003ccode\u003eStackOverflowError\u003c/code\u003e is caught by a \u003ccode\u003efinally\u003c/code\u003e that recurses again, doubling the work at each level\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eStackOverflowError\u003c/code\u003e almost at once\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overflow\\\" data-def=\\\"A result too big for its type. Java\u0026amp;#39;s integer arithmetic wraps around silently, so \u0026lt;code\u0026gt;Integer.MAX_VALUE + 1\u0026lt;/code\u0026gt; is \u0026lt;code\u0026gt;Integer.MIN_VALUE\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Puzzlers\\\"\u003eoverflow\u003c/button\u003e happens, but each \u003ccode\u003efinally\u003c/code\u003e catches it and starts over — about 2^depth calls.\u003c/p\u003e\\n\"},{\"html\":\"Prints \u003ccode\u003eNap time\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eNot in your lifetime.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Exceptional puzzlers\",\"next\":{\"id\":\"checked-exception-rules\",\"courseId\":\"jp-exceptions\",\"topicId\":\"java-puzzlers\",\"key\":\"jp-exceptions/checked-exception-rules\",\"title\":\"The compiler's exception rules\",\"summary\":\"You can't catch a checked exception the try block can't throw, and a final field can't be assigned in both try and catch.\",\"duration\":5,\"tags\":[\"java\",\"puzzlers\",\"exceptions\",\"checked exceptions\",\"final\",\"definite assignment\"],\"sources\":[{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 37, Exceptionally Arcane\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 38, The Unwelcome Guest\"},{\"book\":\"java-puzzlers
