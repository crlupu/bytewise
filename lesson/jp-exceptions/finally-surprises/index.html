\":[{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 36, Indecision\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 39, Hello, Goodbye\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jp-exceptions/finally-surprises/step-1\",\"jp-exceptions/finally-surprises/step-2\",\"jp-exceptions/finally-surprises/step-3\",\"jp-exceptions/finally-surprises/step-4\",\"jp-exceptions/finally-surprises/step-5\",\"jp-exceptions/finally-surprises/step-6\"],\"exercises\":[\"jp-exceptions/finally-surprises/step-2\",\"jp-exceptions/finally-surprises/step-3\",\"jp-exceptions/finally-surprises/step-5\",\"jp-exceptions/finally-surprises/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jp-exceptions/finally-surprises/step-1\",\"title\":\"finally can override the try\",\"body\":\"\u003cp\u003e\u003ccode\u003efinally\u003c/code\u003e runs as the \u003ccode\u003etry\u003c/code\u003e block leaves, however it leaves.\u003c/p\u003e\\n\u003cp\u003eIf \u003ccode\u003efinally\u003c/code\u003e itself returns or throws, that replaces the original outcome.\u003c/p\u003e\\n\u003cp\u003eA pending return value or exception is silently discarded.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-exceptions/finally-surprises/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003edecision()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNever leave a \u003ccode\u003efinally\u003c/code\u003e block with \u003ccode\u003ereturn\u003c/code\u003e, \u003ccode\u003ebreak\u003c/code\u003e, \u003ccode\u003econtinue\u003c/code\u003e or \u003ccode\u003ethrow\u003c/code\u003e. It can also swallow an exception.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ereturn true\u003c/code\u003e evaluates its value and starts to leave the method, but \u003ccode\u003efinally\u003c/code\u003e runs first.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003ereturn\u003c/code\u003e inside \u003ccode\u003efinally\u003c/code\u003e replaces the pending return, so the method returns \u003ccode\u003efalse\u003c/code\u003e and the original \u003ccode\u003etrue\u003c/code\u003e is discarded.\u003c/p\u003e\\n\u003cp\u003eThe same happens to exceptions: a \u003ccode\u003ereturn\u003c/code\u003e in \u003ccode\u003efinally\u003c/code\u003e silently swallows any exception from the \u003ccode\u003etry\u003c/code\u003e block, which is why it\u0026#39;s considered a bug.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e block\u0026#39;s \u003ccode\u003ereturn\u003c/code\u003e replaces the pending one.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles — with a warning, in most IDEs.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"jp-exceptions/finally-surprises/step-3\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003ef()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003ereturn x\u003c/code\u003e evaluates \u003ccode\u003ex\u003c/code\u003e to 1 and saves that value before \u003ccode\u003efinally\u003c/code\u003e runs.\u003c/p\u003e\\n\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e block then changes the variable \u003ccode\u003ex\u003c/code\u003e, but the saved return value is already a copy of 1.\u003c/p\u003e\\n\u003cp\u003eHad \u003ccode\u003ex\u003c/code\u003e been a mutable object, changes to the object would be visible to the caller — but reassigning the variable never is.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e1\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e2\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ereturn x\u003c/code\u003e evaluates \u003ccode\u003ex\u003c/code\u003e before \u003ccode\u003efinally\u003c/code\u003e runs. Changing the variable afterwards doesn\u0026#39;t change the saved value.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jp-exceptions/finally-surprises/step-4\",\"title\":\"System.exit doesn't unwind\",\"body\":\"\u003cp\u003e\u003ccode\u003eSystem.exit\u003c/code\u003e stops the JVM from inside the \u003ccode\u003etry\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003ePending \u003ccode\u003efinally\u003c/code\u003e blocks never run.\u003c/p\u003e\\n\u003cp\u003eOnly shutdown hooks get a chance.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jp-exceptions/finally-surprises/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTo clean up on exit, register a shutdown hook with \u003ccode\u003eRuntime.getRuntime().addShutdownHook(...)\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Only \u003ccode\u003eHello world\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eHello world\u003c/code\u003e, then \u003ccode\u003eGoodbye world\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eSystem.exit\u003c/code\u003e doesn\u0026#39;t return, so the \u003ccode\u003etry\u003c/code\u003e block never finishes and \u003ccode\u003efinally\u003c/code\u003e never runs.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\
