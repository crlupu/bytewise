ate by publishing and reacting to events asynchronously, rather than calling each other directly.\\\" data-book=\\\"Fundamentals of Software Architecture\\\"\u003eEvent-driven\u003c/button\u003e\"]},{\"id\":\"step-3\",\"key\":\"architecture-fundamentals/architecture-styles/step-3\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eA startup\u0026#39;s first product.\u003c/strong\u003e Four developers, little money, and a need to ship features fast.\\nRequirements: simplicity at least \u003cstrong\u003e7\u003c/strong\u003e, cost at most \u003cstrong\u003e3\u003c/strong\u003e, deployability at least \u003cstrong\u003e5\u003c/strong\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Modular monolith\\\" data-def=\\\"One deployable unit, internally split into modules with clear boundaries — usually aligned with business domains.\\\" data-book=\\\"Fundamentals of Software Architecture\\\"\u003emodular monolith\u003c/button\u003e\u003c/strong\u003e: one deployable for simplicity and cost, domain modules for clean boundaries. If the\\nproduct succeeds, the modules are natural seams to split along later.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eSeparate services blow the simplicity and cost budget.\u003c/p\u003e\\n\",\"\u003cp\u003eOf the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Monolith\\\" data-def=\\\"A system deployed as one unit.\\\" data-book=\\\"Fundamentals of Software Architecture\\\"\u003emonolithic\u003c/button\u003e options, which partitioning helps deployability?\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"tradeoff\",\"config\":{\"metrics\":[{\"id\":\"deployability\",\"label\":\"Deployability\",\"start\":4,\"better\":\"higher\"},{\"id\":\"scalability\",\"label\":\"Scalability\",\"start\":3,\"better\":\"higher\"},{\"id\":\"simplicity\",\"label\":\"Simplicity\",\"start\":8,\"better\":\"higher\"},{\"id\":\"cost\",\"label\":\"Cost\",\"start\":2,\"better\":\"lower\"}],\"decisions\":[{\"id\":\"partitioning\",\"label\":\"Partitioning\",\"options\":[{\"id\":\"layers\",\"label\":\"Technical layers\",\"consequence\":\"Easy to start. But every feature touches the UI, service and data layers at once.\"},{\"id\":\"domain\",\"label\":\"Domain modules\",\"effects\":{\"deployability\":1},\"consequence\":\"Code grouped by business capability; most changes stay inside one module.\"}]},{\"id\":\"deployment\",\"label\":\"Deployment\",\"options\":[{\"id\":\"single\",\"label\":\"One deployable\",\"consequence\":\"One build, one deploy, one database. Calls between parts are just method calls.\"},{\"id\":\"services\",\"label\":\"Separate services\",\"effects\":{\"deployability\":4,\"scalability\":3,\"simplicity\":-4,\"cost\":4},\"consequence\":\"Each part deploys and scales on its own — at the price of networks, contracts and distributed data.\"}]},{\"id\":\"communication\",\"label\":\"Communication\",\"options\":[{\"id\":\"sync\",\"label\":\"Synchronous calls\",\"consequence\":\"Easy to follow, but the caller waits — and fails — with the callee.\"},{\"id\":\"events\",\"label\":\"Asynchronous events\",\"effects\":{\"scalability\":2,\"deployability\":1,\"simplicity\":-2,\"cost\":1},\"consequence\":\"Components decouple in time and scale independently, but flows are harder to trace and debug.\"}]}]},\"goal\":{\"require\":[{\"metric\":\"simplicity\",\"min\":7},{\"metric\":\"cost\",\"max\":3},{\"metric\":\"deployability\",\"min\":5}]},\"question\":{\"prompt\":\"\u003cp\u003eWhich choice raised deployability to 5 without costing any simplicity?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Domain modules\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Separate services\",\"correct\":false,\"feedback\":\"\u003cp\u003eServices raise deployability a lot, but cost 4 points of simplicity
