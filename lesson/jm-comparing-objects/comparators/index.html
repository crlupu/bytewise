\"9a\"\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e));\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"comparators\",\"courseId\":\"jm-comparing-objects\",\"topicId\":\"java-mistakes\",\"key\":\"jm-comparing-objects/comparators\",\"title\":\"compareTo and comparators\",\"summary\":\"Relying on -1 and 1, comparators that never return 0, casts that lose differences, -0.0 and NaN, and reversed() that reverses too much.\",\"duration\":7,\"tags\":[\"java\",\"mistakes\",\"Comparator\",\"compareTo\",\"sorting\"],\"sources\":[{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects — relying on a particular compare result\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects — not returning 0 for equal objects\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects — comparing by subtraction\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects — ignoring -0.0 and NaN\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects — reversing a comparator chain\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects — compareTo inconsistent with equals\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 7, Comparing objects — a comparator that isn't transitive\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"jm-comparing-objects/comparators/step-1\",\"jm-comparing-objects/comparators/step-2\",\"jm-comparing-objects/comparators/jm-064\",\"jm-comparing-objects/comparators/jm-065\",\"jm-comparing-objects/comparators/jm-066\",\"jm-comparing-objects/comparators/jm-067\",\"jm-comparing-objects/comparators/jm-068\",\"jm-comparing-objects/comparators/jm-069\",\"jm-comparing-objects/comparators/jm-070\"],\"exercises\":[\"jm-comparing-objects/comparators/jm-064\",\"jm-comparing-objects/comparators/jm-065\",\"jm-comparing-objects/comparators/jm-066\",\"jm-comparing-objects/comparators/jm-067\",\"jm-comparing-objects/comparators/jm-068\",\"jm-comparing-objects/comparators/jm-069\",\"jm-comparing-objects/comparators/jm-070\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jm-comparing-objects/comparators/step-1\",\"title\":\"What compare promises\",\"body\":\"\u003cp\u003e\u003ccode\u003ecompare\u003c/code\u003e returns a negative number, zero or a positive number — not specifically −1 or 1.\u003c/p\u003e\\n\u003cp\u003eIt must return 0 for equal objects, or sorted sets and maps will lose or duplicate elements.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003eInteger.compare\u003c/code\u003e, \u003ccode\u003eDouble.compare\u003c/code\u003e and the \u003ccode\u003eComparator.comparing\u003c/code\u003e helpers instead of arithmetic.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jm-comparing-objects/comparators/step-2\",\"title\":\"Consistency\",\"body\":\"\u003cp\u003eA \u003ccode\u003eTreeSet\u003c/code\u003e uses \u003ccode\u003ecompareTo\u003c/code\u003e, a \u003ccode\u003eHashSet\u003c/code\u003e uses \u003ccode\u003eequals\u003c/code\u003e: if they disagree (as with \u003ccode\u003eBigDecimal\u003c/code\u003e), the two sets hold different elements.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ecomparing(a).thenComparing(b).reversed()\u003c/code\u003e reverses the whole chain; to reverse only \u003ccode\u003eb\u003c/code\u003e, pass \u003ccode\u003eComparator.reverseOrder()\u003c/code\u003e to \u003ccode\u003ethenComparing\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-064\",\"key\":\"jm-comparing-objects/comparators/jm-064\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTest the sign: \u003ccode\u003ea.compareTo(b) \u0026lt; 0\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 7, Comparing objects — relying on a particular compare result.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eapple first\\n-1\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eString.compareTo\u003c/code\u003e returns the difference between the first differing characters: \u003ccode\u003e\u0026#39;a\u0026#39; - \u0026#39;c\u0026#39;\u003c/code\u003e is −2.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003echerry first?\\n-2\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-065\",\"key\":\"jm-comparing-objects/comparators/jm-065\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eComparator.comparingInt(String::length)\u003c/code\u003e — and remember that a \u003ccode\u003eTreeSet\u003c/code\u003e with that comparator keeps only one word per length.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 7, Comparing objects — not returning 0 for equal objects.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e[cat, dog]\\ntrue\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ecat\u003c/code\u003e is added twice, and \u003ccode\u003econtains\u003c/code\u003e can never find it.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e[cat, dog, cat]\\nfalse\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e[cat]\\ntrue\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe comparator never returns 0, so the \u003ccode\u003eTreeSet\u003c/code\u003e never finds an existing element — not even the same string.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-066\",\"key\":\"jm-comparing-objects/comparators/jm-066\",\"prompt\":\"\u003cp\u003eSort products by price. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eComparator.comparingDouble(Product::price)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 7, Comparing objects — comparing by subtraction.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eeraser\\npencil\\npen\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e(int) (a - b)\u003c/code\u003e truncates every difference under 1.0 to 0, so the set treats all three as equal and keeps only the first.\u003c/p\u003e\\n\"},{\"html\":\"pen\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-067\",\"key\":\"jm-comparing-objects/comparators/jm-067\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 7, Comparing objects — ignoring -0.0 and NaN.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003etrue\\n1\\n[NaN, 1.0, 3.0]\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eDouble.equals\u003c/code\u003e (used by \u003ccode\u003edistinct\u003c/code\u003e) tells 0.0 and −0.0 apart; and \u003ccode\u003eDouble.compareTo\u003c/code\u003e puts NaN after every other value.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003etrue\\n2\\n[1.0, 3.0, NaN]\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-068\",\"key\":\"jm-comparing-objects/comparators/jm-068\",\"prompt\":\"\u003cp\u003eSort by age ascending, and within the same age by name descending. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWrite \u003ccode\u003e.thenComparing(Person::name, Comparator.reverseOrder())\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 7, Comparing objects — reversing a comparator chain.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"cy ann bob\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"bob cy ann\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ereversed()\u003c/code\u003e applies to the whole chain, so ages are descending too.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-069\",\"key\":\"jm-comparing-objects/comparators/jm-069\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 7, Comparing objects — compareTo inconsistent with equals.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$18\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e2\\n2\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eTreeSet\u003c/code\u003e uses \u003ccode\u003ecompareTo\u003c/code\u003e, which ignores scale, so it keeps one.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e2\\n1\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e1\\n1\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eHashSet\u003c/code\u003e uses \u003ccode\u003eequals\u003c/code\u003e, which compares scale, so both stay.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-070\",\"key\":\"jm-comparing-objects/comparators/jm-070\",\"prompt\":\"\u003cp\u003eVersions are compared as numbers when both parse, and as text otherwise. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA comparator that isn\u0026#39;t \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transitive\\\" data-def=\\\"If \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;, t
