:5,\"stepKeys\":[\"tij-exceptions/exception-hierarchy/step-1\",\"tij-exceptions/exception-hierarchy/step-2\",\"tij-exceptions/exception-hierarchy/step-3\",\"tij-exceptions/exception-hierarchy/step-4\",\"tij-exceptions/exception-hierarchy/step-5\"],\"exercises\":[\"tij-exceptions/exception-hierarchy/step-2\",\"tij-exceptions/exception-hierarchy/step-3\",\"tij-exceptions/exception-hierarchy/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-exceptions/exception-hierarchy/step-1\",\"title\":\"One family tree\",\"body\":\"\u003cp\u003e\u003ccode\u003eThrowable\u003c/code\u003e has two branches: \u003ccode\u003eError\u003c/code\u003e and \u003ccode\u003eException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eRuntimeException\u003c/code\u003e and its subclasses are unchecked — the compiler doesn\u0026#39;t make you handle them.\u003c/p\u003e\\n\u003cp\u003eEvery other \u003ccode\u003eException\u003c/code\u003e is checked: catch it or declare it.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-exceptions/exception-hierarchy/step-2\",\"prompt\":\"\u003cp\u003eTap the most specific class that would catch both \u003ccode\u003eNullPointerException\u003c/code\u003e and \u003ccode\u003eIllegalArgumentException\u003c/code\u003e, but no \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003echecked exceptions\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eBoth extend \u003ccode\u003eRuntimeException\u003c/code\u003e, their nearest common ancestor — and it has no checked subclasses.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Throwable\"},{\"name\":\"Exception\"},{\"name\":\"RuntimeException\"},{\"name\":\"IOException\"},{\"name\":\"NullPointerException\"},{\"name\":\"IllegalArgumentException\"}],\"relations\":[{\"from\":\"Exception\",\"to\":\"Throwable\",\"type\":\"extends\"},{\"from\":\"RuntimeException\",\"to\":\"Exception\",\"type\":\"extends\"},{\"from\":\"IOException\",\"to\":\"Exception\",\"type\":\"extends\"},{\"from\":\"NullPointerException\",\"to\":\"RuntimeException\",\"type\":\"extends\"},{\"from\":\"IllegalArgumentException\",\"to\":\"RuntimeException\",\"type\":\"extends\"}]},\"feedback\":{\"Exception\":\"That also catches checked exceptions like IOException.\",\"Throwable\":\"That catches everything, errors included.\",\"NullPointerException\":\"It misses IllegalArgumentException.\",\"IllegalArgumentException\":\"It misses NullPointerException.\",\"IOException\":\"Neither exception is an IOException.\"}},\"goal\":{\"select\":\"RuntimeException\"},\"question\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"tij-exceptions/exception-hierarchy/step-3\",\"prompt\":\"\u003cp\u003eChecked or unchecked?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eFileNotFoundException\u003c/code\u003e\",\"\u003ccode\u003eNullPointerException\u003c/code\u003e\",\"\u003ccode\u003eOutOfMemoryError\u003c/code\u003e\"],\"right\":[\"Checked — must be caught or declared\",\"Unchecked — a RuntimeException\",\"An Error — not meant to be caught\"],\"rightOrder\":[2,0,1]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tij-exceptions/exception-hierarchy/step-4\",\"title\":\"A handler catches the whole subtree\",\"body\":\"\u003cp\u003e\u003ccode\u003ecatch (IOException e)\u003c/code\u003e catches an \u003ccode\u003eIOException\u003c/code\u003e and every subclass of it.\u003c/p\u003e\\n\u003cp\u003eSo the class you name in \u003ccode\u003ecatch\u003c/code\u003e covers its branch of the tree.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-exceptions/exception-hierarchy/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003enew FileReader(\u0026quot;missing.txt\u0026quot;)\u003c/code\u003e throws \u003ccode\u003eFileNotFoundException\u003c/code\u003e. The handlers are \u003ccode\u003ecatch (IOException e)\u003c/code\u003e then \u003ccode\u003ecatch (Exception e)\u003c/code\u003e. Tap the class of the handler that runs.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eHandlers are tried in order; the first whose class is a supertype of the exception runs.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe JVM tries each handler from top to bottom and runs the first one whose class is the exception\u0026#39;s class or a superclass of it.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eFileNotFoundException\u003c/code\u003e extends \u003ccode\u003eIOException\u003c/code\u003e, so the first handler matches and the second never runs.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s also why handlers must go from specific to general: a broad handler first would make the narrower ones below unreachable, and the compiler reports that as an error.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Exception\"},{\"name\":\"IOException\"},{\"name\":\"FileNotFoundException\"}],\"relations\":[{\"from\":\"IOException\",\"to\":\"Exception\",\"type\":\"extends\"},{\"from\":\"FileNotFoundException\",\"to\":\"IOException\",\"type\":\"extends\"}]},\"feedback\":{\"Exception\":\"The first matching handler wins, and `catch (IOException e)` comes first.\",\"FileNotFoundException\":\"There's no handler for that exact class — but a superclass handler matches.\"
