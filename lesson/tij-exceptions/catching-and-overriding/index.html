292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\"\u003e\"finally\"\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e);\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"catching-and-overriding\",\"courseId\":\"tij-exceptions\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-exceptions/catching-and-overriding\",\"title\":\"Handler order, finally, and overriding\",\"summary\":\"Put specific handlers before general ones, use finally for cleanup, and never let an override throw broader checked exceptions.\",\"duration\":6,\"tags\":[\"java\",\"thinking in java\",\"exceptions\",\"catch order\",\"finally\",\"overriding\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 12, Error Handling with Exceptions — Exception restrictions and matching\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"tij-exceptions/catching-and-overriding/step-1\",\"tij-exceptions/catching-and-overriding/step-2\",\"tij-exceptions/catching-and-overriding/step-3\",\"tij-exceptions/catching-and-overriding/step-4\",\"tij-exceptions/catching-and-overriding/step-5\",\"tij-exceptions/catching-and-overriding/step-6\"],\"exercises\":[\"tij-exceptions/catching-and-overriding/step-2\",\"tij-exceptions/catching-and-overriding/step-5\",\"tij-exceptions/catching-and-overriding/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-exceptions/catching-and-overriding/step-1\",\"title\":\"Specific first\",\"body\":\"\u003cp\u003eHandlers are tried top to bottom.\u003c/p\u003e\\n\u003cp\u003eA handler for a superclass placed first would catch everything below it.\u003c/p\u003e\\n\u003cp\u003eThe compiler rejects a handler that can never be reached.\u003c/p\u003e\\n\",\"diagram\":\"\u003cfigure class=\\\"diagram\\\"\u003e\u003csvg class=\\\"dg\\\" viewBox=\\\"-8 -8 112 140\\\" width=\\\"112\\\" style=\\\"width:100%;max-width:112px;min-width:73px;height:auto\\\" role=\\\"img\\\" aria-label=\\\"Diagram\\\"\u003e\u003cpath class=\\\"dg-edge\\\" d=\\\"M48 92 V58\\\"/\u003e\u003cpath class=\\\"dg-edge\\\" d=\\\"M48 58 H48 M48 58 V45\\\"/\u003e\u003cpolygon class=\\\"dg-head dg-head--open\\\" points=\\\"48,32 41,45 55,45\\\"/\u003e\u003cg class=\\\"dg-node dg-node--class\\\" data-node=\\\"Annoyance\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"0\\\" y=\\\"0\\\" width=\\\"96\\\" height=\\\"32\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"48\\\" y=\\\"21\\\" text-anchor=\\\"middle\\\"\u003eAnnoyance\u003c/text\u003e\u003c/g\u003e\u003cg class=\\\"dg-node dg-node--class\\\" data-node=\\\"Sneeze\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"10\\\" y=\\\"92\\\" width=\\\"76\\\" height=\\\"32\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"48\\\" y=\\\"113\\\" text-anchor=\\\"middle\\\"\u003eSneeze\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003c/figure\u003e\"},{\"id\":\"step-2\",\"key\":\"tij-exceptions/catching-and-overriding/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eSneeze\u003c/code\u003e extends \u003ccode\u003eAnnoyance\u003c/code\u003e, which extends \u003ccode\u003eException\u003c/code\u003e. Which handler order compiles?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$13\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ecatch (Sneeze s) { ... } catch (Annoyance a) { ... }\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ecatch (Annoyance a) { ... } catch (Sneeze s) { ... }\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery \u003ccode\u003eSneeze\u003c/code\u003e is an \u003ccode\u003eAnnoyance\u003c/code\u003e, so the second handler is unreachable — a compile error.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-exceptions/catching-and-overriding/step-3\",\"title\":\"finally always runs\",\"body\":\"\u003cp\u003eCode in \u003ccode\u003efinally\u003c/code\u003e runs whether the \u003ccode\u003etry\u003c/code\u003e succeeds, throws, or returns.\u003c/p\u003e\\n\u003cp\u003eUse it to release locks, close files and restore state.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"try-with-resources\\\" data-def=\\\"\u0026lt;code\u0026gt;try (var in = open()) { … }\u0026lt;/code\u0026gt; — closes every resource declared in the parentheses automatically, in reverse order, even when an exception is thrown. Requires \u0026lt;code\u0026gt;AutoCloseable\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eTry-with-resources\u003c/button\u003e does the closing for you.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tij-exceptions/catching-and-overriding/step-4\",\"title\":\"Overrides can't throw more\",\"body\":\"\u003cp\u003eCode calling \u003ccode\u003eInning.atBat()\u003c/code\u003e handles only what \u003ccode\u003eInning\u003c/code\u003e declares.\u003c/p\u003e\\n\u003cp\u003eSo an override may throw fewer \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003echecked exceptions\u003c/button\u003e, or subclasses of them — never new or broader ones.\u003c/p\u003e\\n\u003cp\u003eOtherwise code written for the base class would break.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-5\",\"key\":\"tij-exceptions/catching-and-overriding/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eInning.atBat()\u003c/code\u003e declares \u003ccode\u003ethrows Strike, Foul\u003c/code\u003e, and \u003ccode\u003ePopFoul\u003c/code\u003e extends \u003ccode\u003eFoul\u003c/code\u003e. Which overrides of \u003ccode\u003eatBat()\u003c/code\u003e in \u003ccode\u003eStormyInning\u003c/code\u003e compile?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eCode that calls \u003ccode\u003eatBat()\u003c/code\u003e through an \u003ccode\u003eInning\u003c/code\u003e reference only knows to handle \u003ccode\u003eStrike\u003c/code\u003e and \u003ccode\u003eFoul\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eAn override can therefore throw those exceptions, any of their subclasses, or nothing, since none of these surprise the caller.\u003c/p\u003e\\n\u003cp\u003eThrowing a new checked exception, or a broader one, would escape the caller\u0026#39;s handlers, so the compiler rejects it.\u003c/p\u003e\\n\u003cp\u003eThe rule makes a subclass safe to use wherever its base class is expected.\u003c/p\u003e\\n\",\"diagram\":\"$15\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003evoid atBat()\u003c/code\u003e — throwing nothing is fine\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003evoid atBat() throws PopFoul\u003c/code\u003e — PopFoul is a Foul\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003evoid atBat() throws RainedOut\u003c/code\u003e — a new checked exception\",\"correct\":false,\"feedback\":\"\u003cp\u003eCallers of \u003ccode\u003eInning.atBat()\u003c/code\u003e aren\u0026#39;t prepared for RainedOut.\u003c/p\u003e\\n\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003eChecked exception\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"tij-exceptions/catching-and-overriding/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etry finally\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe handler matches, so it runs before \u003ccode\u003efinally\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etry catch\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003efinally\u003c/code\u003e runs after the handler, too.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etry catch finally\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]}]},\"courseTitle\":\"Error handling with exceptions\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-in
