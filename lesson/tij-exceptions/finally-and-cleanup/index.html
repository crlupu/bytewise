ions/finally-and-cleanup/tij-exceptions-finallyworks\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-alwaysfinally\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-multiplereturns\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-onoffswitch\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-withfinally\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-switch\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-lostmessage\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-exceptionsilencer\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-inputfile\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-cleanup\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-cleanupidiom\"],\"exercises\":[\"tij-exceptions/finally-and-cleanup/tij-exceptions-finallyworks\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-alwaysfinally\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-multiplereturns\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-onoffswitch\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-withfinally\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-switch\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-lostmessage\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-exceptionsilencer\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-inputfile\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-cleanup\",\"tij-exceptions/finally-and-cleanup/tij-exceptions-cleanupidiom\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-exceptions/finally-and-cleanup/step-1\",\"title\":\"finally always runs\",\"body\":\"\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e block runs whether the \u003ccode\u003etry\u003c/code\u003e ends normally, by \u003ccode\u003ereturn\u003c/code\u003e, \u003ccode\u003ebreak\u003c/code\u003e, or an exception.\u003c/p\u003e\\n\u003cp\u003eUse it for cleanup that must happen, like turning a switch off.\u003c/p\u003e\\n\u003cp\u003eBut a \u003ccode\u003ereturn\u003c/code\u003e in \u003ccode\u003efinally\u003c/code\u003e, or a new exception thrown there, silently replaces the original exception.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-exceptions/finally-and-cleanup/step-2\",\"title\":\"Cleanup with fallible constructors\",\"body\":\"\u003cp\u003eIf a constructor can throw, there\u0026#39;s nothing to clean up when it does.\u003c/p\u003e\\n\u003cp\u003eSo guard each creation with its own \u003ccode\u003etry\u003c/code\u003e, and dispose in \u003ccode\u003efinally\u003c/code\u003e only after construction succeeded.\u003c/p\u003e\\n\u003cp\u003eDispose in the reverse order of creation.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-exceptions-finallyworks\",\"key\":\"tij-exceptions/finally-and-cleanup/tij-exceptions-finallyworks\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eThreeException\\nIn finally clause\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe loop breaks only when \u003ccode\u003ecount\u003c/code\u003e is 2, after the second pass.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eThreeException\\nIn finally clause\\nNo exception\\nIn finally clause\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\
