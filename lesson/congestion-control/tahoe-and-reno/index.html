ow to growing it by one segment per round trip. Set to half the window on loss.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003essthresh\u003c/button\u003e — the window itself went all the way down.\u003c/p\u003e\\n\"},{\"html\":\"It dropped the window to 1 and went back to slow start\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Slow start\\\" data-def=\\\"TCP\u0026amp;#39;s start-up phase — the congestion window doubles every round trip until it reaches the threshold or a loss happens.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSlow start\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"congestion-control/tahoe-and-reno/step-4\",\"title\":\"Reno versus Tahoe\",\"body\":\"$15\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"congestion-control/tahoe-and-reno/step-5\",\"prompt\":\"\u003cp\u003eMatch each event to what \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reno\\\" data-def=\\\"TCP Reno — like Tahoe, but on three duplicate ACKs it halves its window (fast recovery) instead of dropping to 1.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eReno\u003c/button\u003e does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Every ACK in slow start\",\"A round in congestion avoidance\",\"Three duplicate ACKs\",\"Timeout\"],\"right\":[\"Window grows by one segment (doubling per RTT)\",\"Window grows by one segment\",\"ssthresh halves; window becomes ssthresh + 3; fast recovery\",\"ssthresh halves; window drops to 1; slow start again\"],\"rightOrder\":[1,0,2,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\
