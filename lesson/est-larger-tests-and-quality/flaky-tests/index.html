:\"est-larger-tests-and-quality/flaky-tests\",\"title\":\"Flaky tests\",\"summary\":\"A test that sometimes passes and sometimes fails destroys trust. Find the source — time, order, concurrency, shared state — and remove it.\",\"duration\":5,\"tags\":[\"testing\",\"effective software testing\",\"flaky tests\",\"determinism\",\"test isolation\"],\"sources\":[{\"book\":\"effective-software-testing\",\"ref\":\"§10.1.5, Flaky tests\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"est-larger-tests-and-quality/flaky-tests/step-1\",\"est-larger-tests-and-quality/flaky-tests/step-2\",\"est-larger-tests-and-quality/flaky-tests/step-3\",\"est-larger-tests-and-quality/flaky-tests/step-4\",\"est-larger-tests-and-quality/flaky-tests/step-5\"],\"exercises\":[\"est-larger-tests-and-quality/flaky-tests/step-3\",\"est-larger-tests-and-quality/flaky-tests/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"est-larger-tests-and-quality/flaky-tests/step-1\",\"title\":\"Flakiness ruins trust\",\"body\":\"\u003cp\u003eIf a red build might be noise, people stop looking at red builds.\u003c/p\u003e\\n\u003cp\u003eThen real failures slip through.\u003c/p\u003e\\n\u003cp\u003eFix or remove \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Flaky test\\\" data-def=\\\"A test that passes or fails on the same code depending on timing, order or environment.\\\" data-book=\\\"Effective Software Testing\\\"\u003eflaky tests\u003c/button\u003e quickly.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"est-larger-tests-and-quality/flaky-tests/step-2\",\"title\":\"Common causes\",\"body\":\"\u003cp\u003eDepending on the current time or a random value.\u003c/p\u003e\\n\u003cp\u003eDepending on test order or data left by another test.\u003c/p\u003e\\n\u003cp\u003eWaiting a fixed time for something asynchronous.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"est-larger-tests-and-quality/flaky-tests/step-3\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Flaky test\\\" data-def=\\\"A test that passes or fails on the same code depending on timing, order or environment.\\\" data-book=\\\"Effective Software Testing\\\"\u003eflaky test\u003c/button\u003e with its fix.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Fails on the last day of the month\",\"Passes alone, fails after another test\",\"\u003ccode\u003eThread.sleep(100)\u003c/code\u003e then checks an async result\",\"Fails when iteration order of a \u003ccode\u003eHashSet\u003c/code\u003e changes\"],\"right\":[\"Inject a fixed \u003ccode\u003eClock\u003c/code\u003e\",\"Reset shared state before each test\",\"Wait for the condition, with a timeout\",\"Don\u0026#39;t assert on an unspecified order\"],\"rightOrder\":[1,2,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003eTimeout\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"est-larger-tests-and-quality/flaky-tests/step-4\",\"title\":\"Make it deterministic\",\"body\":\"\u003cp\u003eSame code, same result, every run.\u003c/p\u003e\\n\u003cp\u003eControl time, randomness and concurrency from the test.\u003c/p\u003e\\n\u003cp\u003eIsolate each test\u0026#39;s data.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"est-larger-tests-and-quality/flaky-tests/step-5\",\"prompt\":\"\u003cp\u003eA test fails 1 time in 50 on CI. What do you do?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA test that fails occasionally teaches the team to ignore red builds, which hides real failures.\u003c/p\u003e\\n\u003cp\u003eRetrying until green hides the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Flaky test\\\" data-def=\\\"A test that passes or fails on the same code depending on timing, order or environment.\\\" data-book=\\\"Effective Software Testing\\\"\u003eflakiness\u003c/button\u003e, and if the cause is a real race condition in production code, it hides that too.\u003c/p\u003e\\n\u003cp\u003eInvestigate: run the test many times, look for time, order or concurrency dependencies, and fix the cause. Quarantine it only while you work on it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Investigate the cause and make the test deterministic, quarantining it meanwhile if it blocks everyone\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Add automatic retries until it passes\",\"correct\":false,\"feedback\":\"\u003cp\u003eRetries hide the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Flaky test\\\" data-def=\\\"A test that passes or fails on the same code depending on timing, order or environment.\\\" data-book=\\\"Effective Software Testing\\\"\u003eflakiness\u003c/button\u003e — and possibly a real race in the production code.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Larger tests and test quality\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Marku
