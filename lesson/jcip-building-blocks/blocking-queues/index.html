g queue decouples producers from consumers and pushes back when work piles up.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"blockingqueue\",\"producer-consumer\",\"bounded queue\",\"work stealing\",\"deque\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§5.3, Blocking Queues and the Producer-consumer Pattern\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-building-blocks/blocking-queues/step-1\",\"jcip-building-blocks/blocking-queues/step-2\",\"jcip-building-blocks/blocking-queues/step-3\",\"jcip-building-blocks/blocking-queues/step-4\",\"jcip-building-blocks/blocking-queues/step-5\",\"jcip-building-blocks/blocking-queues/step-6\",\"jcip-building-blocks/blocking-queues/step-7\"],\"exercises\":[\"jcip-building-blocks/blocking-queues/step-3\",\"jcip-building-blocks/blocking-queues/step-4\",\"jcip-building-blocks/blocking-queues/step-5\",\"jcip-building-blocks/blocking-queues/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-building-blocks/blocking-queues/step-1\",\"title\":\"Producers and consumers\",\"body\":\"$13\",\"diagram\":\"$14\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-building-blocks/blocking-queues/step-2\",\"title\":\"Bounded queues push back\",\"body\":\"\u003cp\u003eA full \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ebounded queue\u003c/button\u003e makes producers wait.\u003c/p\u003e\\n\u003cp\u003eThat slows them to the consumers\u0026#39; pace.\u003c/p\u003e\\n\u003cp\u003eHanding an object through a queue also hands over ownership.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-building-blocks/blocking-queues/step-3\",\"prompt\":\"\u003cp\u003eProducers suddenly generate work much faster than consumers can handle. What does a \u003cstrong\u003ebounded\u003c/strong\u003e queue do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eBounded queues\u003c/button\u003e are a powerful resource-management tool — they make overload visible early instead of exhausting memory.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWith an unbounded queue, producers keep adding work no matter how far behind consumers are; the queue grows until memory runs out, often long after the overload began.\u003c/p\u003e\\n\u003cp\u003eA bounded queue fills up and then makes \u003ccode\u003eput\u003c/code\u003e block, so producers automatically slow to the rate consumers can sustain.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s back-pressure: overload becomes visible and self-limiting, and you can choose how to handle it, for example with \u003ccode\u003eoffer\u003c/code\u003e and a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003etimeout\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Fills up, then blocks producers in \u003ccode\u003eput\u003c/code\u003e — slowing them to the consumers\u0026#39; pace\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Grows until memory runs out\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what an unbounded queue does.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-4\",\"key\":\"jcip-building-blocks/blocking-queues/step-4\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Blocking queue\\\" data-def=\\\"A queue whose \u0026lt;code\u0026gt;put\u0026lt;/code\u0026gt; waits when full and \u0026lt;code\u0026gt;take\u0026lt;/code\u0026gt; waits when empty — the backbone of producer-consumer designs.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eBlockingQueue\u003c/code\u003e\u003c/button\u003e implementation to its behaviour.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e / \u003ccode\u003eArrayBlockingQueue\u003c/code\u003e\",\"\u003ccode\u003ePriorityBlockingQueue\u003c/code\u003e\",\"\u003ccode\u003eSynchronousQueue\u003c/code\u003e\"],\"right\":[\"FIFO queues, bounded or unbounded\",\"Orders elements by priority instead of arrival\",\"No storage at all — each put waits for a take, a direct hand-off\"],\"rightOrder\":[0,2,1]},{\"id\":\"step-5\",\"key\":\"jcip-building-blocks/blocking-queues/step-5\",\"prompt\":\"\u003cp\u003eA producer puts a mutable object into a queue and never touches it again; a consumer takes it. Does the object need its own locking?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — \u003cstrong\u003eserial thread confinement\u003c/strong\u003e; the queue publishes it safely and ownership passes to the consumer\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, always\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly one thread owns it at a time, and the queue\u0026#39;s internal synchronization makes the hand-off safe.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread confinement\\\" data-def=\\\"Only one thread ever accesses the data, so it needs no synchronization.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread confinement\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"jcip-building-blocks/blocking-queues/step-6\",\"title\":\"Deques and work stealing\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deque\\\" data-def=\\\"A double-ended queue — elements can be added or removed at either end.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeque\u003c/button\u003e can be used from both ends.\u003c/p\u003e\\n\u003cp\u003eEach worker has its own.\u003c/p\u003e\\n\u003cp\u003eAn idle worker steals from the tail of another\u0026#39;s.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"jcip-building-blocks/blocking-queues/step-7\",\"prompt\":\"\u003cp\u003eThe queue method that blocks when the queue is empty.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"File next = queue.\"},{\"answers\":[\"take\"],\"size\":4,\"choices\":[\"putIfAbsent\",\"countDown\",\"interrupt\",\"take\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Building blocks\",\"next\":{\"id\":\"blocking-and-interruption\",\"courseId\":\"jcip-building-blocks\",\"topicId\":\"jcip\",\"key\":\"jcip-building-blocks/blocking-and-interruption\",\"title\":\"Blocking and interruptible methods\",\"summary\":\"When a method throws InterruptedException, you must propagate it or restore the interrupt — never swallow it.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"interruption\",\"interruptedexception\",\"blocking\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§5.4, Blockin
