\"jcip-building-blocks/semaphores-and-barriers/step-5\"],\"exercises\":[\"jcip-building-blocks/semaphores-and-barriers/step-2\",\"jcip-building-blocks/semaphores-and-barriers/step-3\",\"jcip-building-blocks/semaphores-and-barriers/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-building-blocks/semaphores-and-barriers/step-1\",\"title\":\"Semaphores hand out permits\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-building-blocks/semaphores-and-barriers/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eBoundedHashSet\u003c/code\u003e is built with a bound of 2. You add \u0026quot;a\u0026quot;, \u0026quot;b\u0026quot;, then \u0026quot;a\u0026quot; again. Does the third \u003ccode\u003eadd\u003c/code\u003e block?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe permit is taken before checking membership. If the add then fails because \u0026quot;a\u0026quot; exists, the permit is given back — but only after \u003ccode\u003eacquire\u003c/code\u003e succeeded.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eBoundedHashSet.add\u003c/code\u003e acquires a permit before it even tries to add, because it can\u0026#39;t know in advance whether the element is new.\u003c/p\u003e\\n\u003cp\u003eWith both permits taken by \u0026quot;a\u0026quot; and \u0026quot;b\u0026quot;, the third call blocks in \u003ccode\u003eacquire()\u003c/code\u003e — even though adding \u0026quot;a\u0026quot; again wouldn\u0026#39;t grow the set.\u003c/p\u003e\\n\u003cp\u003eIf it got a permit, the failed add would release it again. This conservative design keeps the bound simple and safe at the cost of an occasional unnecessary wait.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"No — \u0026quot;a\u0026quot; is already in the set, so \u003ccode\u003eadd\u003c/code\u003e just returns false\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eadd\u003c/code\u003e acquires a permit \u003cem\u003ebefore\u003c/em\u003e checking the set, and both permits are already taken.\u003c/p\u003e\\n\"},{\"html\":\"Yes — it blocks in \u003ccode\u003eacquire()\u003c/code\u003e until something is removed, even though \u0026quot;a\u0026quot; is already present\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"jcip-building-blocks/semaphores-and-barriers/step-3\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s a binary \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Semaphore\\\" data-def=\\\"Manages a fixed number of permits. \u0026lt;code\u0026gt;acquire\u0026lt;/code\u0026gt; takes one (waiting if none are left), \u0026lt;code\u0026gt;release\u0026lt;/code\u0026gt; gives one back. Used to bound how many threads use a resource.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003esemaphore\u003c/button\u003e (one permit)?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUnlike \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eintrinsic locks\u003c/button\u003e, a semaphore permit isn\u0026#39;t tied to a thread — any thread can release it.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A non-reentrant mutex — whoever holds the permit holds the lock\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"A semaphore that can only be acquired twice\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},{
