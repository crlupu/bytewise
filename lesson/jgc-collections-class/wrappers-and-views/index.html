ability\"],\"sources\":[{\"book\":\"java-generics-collections\",\"ref\":\"§17.3, Wrappers\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jgc-collections-class/wrappers-and-views/step-1\",\"jgc-collections-class/wrappers-and-views/step-2\",\"jgc-collections-class/wrappers-and-views/step-3\",\"jgc-collections-class/wrappers-and-views/step-4\",\"jgc-collections-class/wrappers-and-views/step-5\"],\"exercises\":[\"jgc-collections-class/wrappers-and-views/step-2\",\"jgc-collections-class/wrappers-and-views/step-4\",\"jgc-collections-class/wrappers-and-views/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jgc-collections-class/wrappers-and-views/step-1\",\"title\":\"Unmodifiable isn't immutable\",\"body\":\"\u003cp\u003e\u003ccode\u003eCollections.unmodifiableList(list)\u003c/code\u003e blocks changes through the view.\u003c/p\u003e\\n\u003cp\u003eBut whoever holds the original can still change it.\u003c/p\u003e\\n\u003cp\u003eThe view shows those changes.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"jgc-collections-class/wrappers-and-views/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFor a true snapshot, use \u003ccode\u003eList.copyOf(base)\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eCollections.unmodifiableList\u003c/code\u003e doesn\u0026#39;t copy anything; it wraps the original list and blocks modifications made through the wrapper.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ebase\u003c/code\u003e is still the same mutable list underneath, so adding \u0026quot;y\u0026quot; to it shows up in \u003ccode\u003eview\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s useful for handing out a read-only window onto changing data. For a snapshot that can never change, use \u003ccode\u003eList.copyOf(base)\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\" e\",\"\u003ccode\u003eList.copyOf(l)\u003c/code\u003e\",\"\u003ccode\u003eCollections.emptyList()\u003c/code\u003e\",\"\u003ccode\u003eCollections.synchronizedList(l)\u003c/code\u003e\"],\"right\":[\"A read-only view of \u003ccode\u003el\u003c/code\u003e\",\"An immutable copy\",\"A shared, immutable empty list\",\"\u003ccode\u003el\u003c/code\u003e with each call locked\"],\"rightOrder\":[3,2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unmodifiable view\\\" data-def=\\\"A wrapper that refuses changes but is backed by the original collection, so changes made through the original still show.\\\" data-book=\\\"Java Generics and Collections\\\"\u003eUnmodifiable view\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]}]},\"courseTitle\":\"The Collections class\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\"
