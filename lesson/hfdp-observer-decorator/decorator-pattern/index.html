cation.\",\"duration\":6,\"tags\":[\"design patterns\",\"head first\",\"decorator\",\"open closed principle\",\"structural\"],\"sources\":[{\"book\":\"head-first-design-patterns\",\"ref\":\"Chapter 3, The Decorator Pattern\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"hfdp-observer-decorator/decorator-pattern/step-1\",\"hfdp-observer-decorator/decorator-pattern/step-2\",\"hfdp-observer-decorator/decorator-pattern/step-3\",\"hfdp-observer-decorator/decorator-pattern/step-4\",\"hfdp-observer-decorator/decorator-pattern/step-5\",\"hfdp-observer-decorator/decorator-pattern/step-6\"],\"exercises\":[\"hfdp-observer-decorator/decorator-pattern/step-3\",\"hfdp-observer-decorator/decorator-pattern/step-5\",\"hfdp-observer-decorator/decorator-pattern/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"hfdp-observer-decorator/decorator-pattern/step-1\",\"title\":\"Class explosion\",\"body\":\"\u003cp\u003eA coffee shop has drinks and toppings: milk, mocha, soy, whip.\u003c/p\u003e\\n\u003cp\u003eA subclass per combination gives hundreds of classes.\u003c/p\u003e\\n\u003cp\u003eA price change touches many of them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"hfdp-observer-decorator/decorator-pattern/step-2\",\"title\":\"Wrap instead\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorator\u003c/button\u003e is a \u003ccode\u003eBeverage\u003c/code\u003e that holds another \u003ccode\u003eBeverage\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eMocha.cost()\u003c/code\u003e returns the wrapped drink\u0026#39;s cost plus mocha.\u003c/p\u003e\\n\u003cp\u003eWrap as many layers as you need.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-3\",\"key\":\"hfdp-observer-decorator/decorator-pattern/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eDarkRoast\u003c/code\u003e costs 0.99, \u003ccode\u003eMocha\u003c/code\u003e adds 0.20, \u003ccode\u003eWhip\u003c/code\u003e adds 0.10. What is the cost?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e0.99 + 0.20 + 0.20 + 0.10 = 1.49 — though in real money code, use \u003ccode\u003eBigDecimal\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorator\u003c/button\u003e\u0026#39;s \u003ccode\u003ecost()\u003c/code\u003e returns the wrapped beverage\u0026#39;s cost plus its own.\u003c/p\u003e\\n\u003cp\u003eThe innermost \u003ccode\u003eDarkRoast\u003c/code\u003e costs 0.99; the first \u003ccode\u003eMocha\u003c/code\u003e makes it 1.19; the second, 1.39; the \u003ccode\u003eWhip\u003c/code\u003e, 1.49.\u003c/p\u003e\\n\u003cp\u003eThe calls nest outward like layers of an onion, and new toppings need no changes to existing classes.\u003c/p\u003e\\n\",\"diagram\":\"$15\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"0.99\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorator\u003c/button\u003e adds its own cost to the wrapped drink\u0026#39;s.\u003c/p\u003e\\n\"},{\"html\":\"1.29\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere are two \u003ccode\u003eMocha\u003c/code\u003e wrappers, each adding 0.20.\u003c/p\u003e\\n\"},{\"html\":\"1.49\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"hfdp-observer-decorator/decorator-pattern/step-4\",\"title\":\"The Open-Closed Principle\",\"body\":\"\u003cp\u003eClasses should be open for extension but closed for modification.\u003c/p\u003e\\n\u003cp\u003eNew toppings are new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorators\u003c/button\u003e; existing classes don\u0026#39;t change.\u003c/p\u003e\\n\u003cp\u003eApply it where change is likely, not everywhere.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"hfdp-observer-decorator/decorator-pattern/step-5\",\"prompt\":\"\u003cp\u003eWhich Java API is built from \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorators\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ejava.lang.Math\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s a set of static functions.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ejava.io\u003c/code\u003e streams, like \u003ccode\u003enew BufferedInputStream(new FileInputStream(f))\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"hfdp-observer-decorator/decorator-pattern/step-6\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s a downside of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eDecorator\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"You can\u0026#39;t add behaviour at run time\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s exactly what it allows.\u003c/p\u003e\\n\"},{\"html\":\"Many small wrapper objects, and code that checks for a concrete type breaks\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Observer and Decorator\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"databas
