zation-orderofinitialization\",\"tij-initialization/initialization-order/tij-initialization-staticinitialization\",\"tij-initialization/initialization-order/tij-initialization-explicitstatic\",\"tij-initialization/initialization-order/tij-initialization-mugs\",\"tij-initialization/initialization-order/tij-initialization-initialvalues\",\"tij-initialization/initialization-order/tij-initialization-initialvalues2\",\"tij-initialization/initialization-order/tij-initialization-methodinit\",\"tij-initialization/initialization-order/tij-initialization-methodinit2\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-initialization/initialization-order/step-1\",\"title\":\"Static first, and only once\",\"body\":\"\u003cp\u003eA class\u0026#39;s static fields and static blocks run when the class is first used.\u003c/p\u003e\\n\u003cp\u003eThey run once, however many objects you create.\u003c/p\u003e\\n\u003cp\u003eStatic data belongs to the class, not to each object.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-initialization/initialization-order/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eCups\u003c/code\u003e creates \u003ccode\u003ec1 = new Cup(1)\u003c/code\u003e and \u003ccode\u003ec2 = new Cup(2)\u003c/code\u003e in a static block. What does \u003ccode\u003enew Cups(); new Cups();\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA static block runs once, when the class is first loaded, which happens on the first \u003ccode\u003enew Cups()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003eCup(1) Cup(2)\u003c/code\u003e is printed once, before the first constructor body, and never again.\u003c/p\u003e\\n\u003cp\u003eEach \u003ccode\u003enew Cups()\u003c/code\u003e then runs its own constructor body, which prints \u003ccode\u003eCups()\u003c/code\u003e twice in total.\u003c/p\u003e\\n\u003cp\u003eStatic state belongs to the class, so creating more objects never repeats static initialization.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eCup(1) Cup(2) Cups() Cups()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eCup(1) Cup(2) Cups() Cup(1) Cup(2) Cups()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe static block runs once, when the class is initialized — not per object.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eCups() Cups()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eCreating the first \u003ccode\u003eCups\u003c/code\u003e initializes the class, which runs the static block first.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-initialization/initialization-order/step-3\",\"title\":\"Then fields, then the constructor\",\"body\":\"\u003cp\u003eFor each new object, fields get their default values first: 0, false, null.\u003c/p\u003e\\n\u003cp\u003eThen field initializers run, in the order they\u0026#39;re written.\u003c/p\u003e\\n\u003cp\u003eOnly then does the constructor body run.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"tij-initialization/initialization-order/step-4\",\"prompt\":\"$15\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The \u003ccode\u003eCups\u003c/code\u003e class is loaded and its static block runs\",\"Memory for the object is cleared to defaults\",\"Instance field initializers run, top to bottom\",\"The constructor body runs\"],\"start\":[0,3,2,1]},{\"id\":\"step-5\",\"key\":\"tij-initialization/initialization-order/step-5\",\"prompt\":\"\u003cp\u003eA field is declared after the constructor in the source. When is it initialized?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Before the constructor body, like every field initializer — position in the file relative to methods doesn\u0026#39;t matter\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"After the constructor\",\"correct\":false,\"feedback\":\"\u003cp\u003eField initializers always run before the constructor body; only their order among themselves follows the source.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-initialization-orderofinitialization\",\"key\":\"tij-initialization/initialization-order/tij-initialization-orderofinitialization\",\"prompt\":\"\u003cp\u003eWhat does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eWindow(1)\\nWindow(2)\\nWindow(3)\\nHouse()\\nWindow(33)\\nf()\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eWindow(1)\\nHouse()\\nWindow(33)\\nWindow(2)\\nWindow(3)\\nf()\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAll field initializers run before the constructor body, wherever they appear.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eHouse()\\nWindow(1)\\nWindow(2)\\nWindow(3)\\nWindow(33)\\nf()\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eField initializers come before the constructor body.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-initialization-staticinitialization\",\"key\":\"tij-initialization/initialization-order/tij-initialization-staticinitialization\",\"prompt\":\"\u003cp\u003eWhat are the first five lines printed? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eCreating new Cupboard() in main\\nBowl(4)\\nBowl(5)\\nBowl(3)\\nCupboard()\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe static fields of \u003ccode\u003eStaticInitialization\u003c/code\u003e (\u003ccode\u003etable\u003c/code\u003e, \u003ccode\u003ecupboard\u003c/code\u003e) are initialized before \u003ccode\u003emain\u003c/code\u003e runs.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eBowl(1)\\nTable()\\nBowl(2)\\nf1(1)\\nBowl(4)\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth static \u003ccode\u003eBowl\u003c/code\u003es in \u003ccode\u003eTable\u003c/code\u003e are initialized before its constructor runs.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eBowl(1)\\nBowl(2)\\nTable()\\nf1(1)\\nBowl(4)\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-initialization-explicitstatic\",\"key\":\"tij-initialization/initialization-order/tij-initialization-explicitstatic\",\"prompt\":\"\u003cp\u003eWhat does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$18\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eInside main()\\nCup(1)\\nCup(2)\\nf(99)\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eCup(1)\\nCup(2)\\nInside main()\\nf(99)\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eCups\u003c/code\u003e is loaded only when it\u0026#39;s first used, at line (1).\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eInside main()\\nCup(1)\\nCup(2)\\nCups()\\nf(99)\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eNo \u003ccode\u003eCups\u003c/code\u003e object is created; only the static block runs.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-initialization-mugs\",\"key\":\"tij-initialization/initialization-order/tij-initialization-mugs\",\"prompt\":\"\u003cp\u003eWhat does this print? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$19\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eInside main()\\nMug(1)\\nMug(2)\\nmug1 \u0026amp; mug2 initialized\\nMugs()\\nnew Mugs() completed\\nMug(1)\\nMug(2)\\nmug1 \u0026amp; mug2 initialized\\nMugs(int)\\nnew Mugs(1) completed\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eInside main()\\nMug(1)\\nMug(2)\\nmug1 \u0026amp; mug2 initialized\\nMugs()\\nnew Mugs() completed\\nMugs(int)\\nnew Mugs(1) completed\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe instance initializer runs for every object, whichever constructor is used.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-initialization-initialvalues\",\"key\":\"tij-initialization/initialization-order/tij-initialization-initialvalues\",\"prompt\":\"\u003cp\u003eWhat does it print for the \u003ccode\u003efloat\u003c/code\u003e field and for \u003ccode\u003ereference\u003c/code\u003e? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFields get default values: \u003ccode\u003efalse\u003c/code\u003e, \u003ccode\u003e\u0026#39;\\\\u0000\u0026#39;\u003c/code\u003e, \u003ccode\u003e0\u003c/code\u003e, \u003ccode\u003e0.0\u003c/code\u003e and \u003ccode\u003enull\u003c/code\u003e. The \u003ccode\u003echar\u003c/code\u003e prints as an invisible character.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"Nothing — uninitialized fields are a compile error\",\"correct\":false,\"feedback\":\"\u003cp\u003eFields get default values; only local variables must be initialized.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e0.0\u003c/code\u003e and \u003ccode\u003enull\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e0\u003c/code\u003e and \u003ccode\u003e0\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eFloats print as \u003ccode\u003e0.0\u003c/code\u003e, and references default to \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-initialization-initialvalues2\",\"key\":\"tij-initialization/initialization-order/tij-initialization-initialvalues2\",\"prompt\":\"\u003cp\u003eDoes \u003ccode\u003eshort s = 0xff;\u003c/code\u003e compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"Yes — 0xff is 255, which fits in a \u003ccode\u003eshort\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"No — \u003ccode\u003eshort\u003c/code\u003e can\u0026#39;t hold 255\",\"correct\":false,\"feedback\":\"\u003cp\u003eA \u003ccode\u003eshort\u003c/code\u003e goes up to 32767.\u003c/p\u003e\\n\"},{\"html\":\"No — hex literals are \u003ccode\u003eint\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA constant \u003ccode\u003eint\u003c/code\u003e that fits is narrowed automatically in an initializer.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-initialization-methodinit\",\"key\":\"tij-initialization/initialization-order/tij-initialization-methodinit\",\"prompt\":\"\u003cp\u003eWhat is \u003ccode\u003ei\u003c/code\u003e in a new \u003ccode\u003eMethodInit\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1c\",\"options\":[{\"html\":\"11 — a field can be initialized by calling a method\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"0 — \u003ccode\u003ef()\u003c/code\u003e isn\u0026#39;t defined yet at that point\",\"correct\":false,\"feedback\":\"\u003cp\u003eMethods can be called regardless of where they\u0026#39;re declared.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-initialization-methodinit2\",\"key\":\"tij-initialization/initialization-order/tij-initialization-methodinit2\",\"prompt\":\"\u003cp\u003eWhat are \u003ccode\u003ei\u003c/code\u003e and \
