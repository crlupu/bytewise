atic/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"sampling-and-instrumenting\",\"courseId\":\"tsj-profiling\",\"topicId\":\"troubleshooting-java\",\"key\":\"tsj-profiling/sampling-and-instrumenting\",\"title\":\"Sampling, then profiling\",\"summary\":\"Sample first to find where to look; then instrument that part to count calls exactly — and see the SQL your app really sends.\",\"duration\":6,\"tags\":[\"java\",\"troubleshooting\",\"profiling\",\"sampling\",\"instrumentation\",\"sql\",\"n plus one\"],\"sources\":[{\"book\":\"troubleshooting-java\",\"ref\":\"Chapter 7, Finding hidden issues using profiling techniques\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"tsj-profiling/sampling-and-instrumenting/step-1\",\"tsj-profiling/sampling-and-instrumenting/step-2\",\"tsj-profiling/sampling-and-instrumenting/step-3\",\"tsj-profiling/sampling-and-instrumenting/step-4\",\"tsj-profiling/sampling-and-instrumenting/step-5\",\"tsj-profiling/sampling-and-instrumenting/step-6\"],\"exercises\":[\"tsj-profiling/sampling-and-instrumenting/step-3\",\"tsj-profiling/sampling-and-instrumenting/step-5\",\"tsj-profiling/sampling-and-instrumenting/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-1\",\"title\":\"Sampling is cheap and broad\",\"body\":\"\u003cp\u003eSampling reads the threads\u0026#39; stacks at intervals.\u003c/p\u003e\\n\u003cp\u003eIt shows where time goes across the whole app.\u003c/p\u003e\\n\u003cp\u003eIt can\u0026#39;t tell you how many times a method was called.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-2\",\"title\":\"Instrumenting is exact and narrow\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Instrumentation\\\" data-def=\\\"Adding measuring code to methods so a profiler can count every call exactly, at a cost in speed.\\\" data-book=\\\"Troubleshooting Java\\\"\u003eInstrumenting\u003c/button\u003e adds counting code to the methods you choose.\u003c/p\u003e\\n\u003cp\u003eYou get exact call counts and times.\u003c/p\u003e\\n\u003cp\u003eIt\u0026#39;s slow, so limit it to the packages you care about.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-3\",\"prompt\":\"\u003cp\u003ePut the profiling workflow in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Sample the whole app to find the slow area\",\"Instrument just the packages in that area\",\"Read exact call counts and durations\",\"Change the code and measure again\"],\"start\":[3,2,0,1]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-4\",\"title\":\"See the hidden queries\",\"body\":\"\u003cp\u003eFrameworks generate SQL you never wrote.\u003c/p\u003e\\n\u003cp\u003eProfilers can list every query with its count and time.\u003c/p\u003e\\n\u003cp\u003eOne query run a thousand times is the N+1 problem.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-5\",\"prompt\":\"\u003cp\u003eThe profiler shows \u003ccode\u003eSELECT * FROM item WHERE order_id = ?\u003c/code\u003e ran 1,000 times for one page load. What\u0026#39;s wrong?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eRunning the same query once per order means the code loaded the orders, then looped over them and fetched each order\u0026#39;s items separately — usually through a lazy association.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s 1 + N queries, each paying a network round trip.\u003c/p\u003e\\n\u003cp\u003eA join fetch, batch fetching or a single \u003ccode\u003eIN\u003c/code\u003e query loads all the items at once. Profilers that list SQL statements make this pattern obvious.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"An N+1 query — items are loaded lazily, one query per order, instead of in one query\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The database needs a bigger cache\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach query may be fast; the problem is running a thousand of them.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCache\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-6\",\"prompt\":\"\u003cp\u003eMatch each question with sampling or \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Instrumentation\\\" data-def=\\\"Adding measuring code to methods so a profiler can count every call exactly, at a cost in speed.\\\" data-book=\\\"Troubleshooting Java\\\"\u003einstrumenting\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Which part of the app is slow?\",\"How many times is \u003ccode\u003ecalculateTax\u003c/code\u003e called per request?\",\"Is it slow everywhere or in one module?\"],\"right\":[\"Sampling\",\"Instrumenting\",\"Sampling, too\"],\"rightOrder\":[1,2,0]}]},\"courseTitle\":\"Profiling\",\"next\":{\"id\":\"flame-graphs\",\"courseId\":\"tsj-profiling\",\"topicId\":\"troubleshooting-java\",\"key\":\"tsj-prof
