 width=\\\"259\\\" style=\\\"width:100%;max-width:259px;min-width:168px;height:auto\\\" role=\\\"img\\\" aria-label=\\\"The constructor is private; getInstance() is the only way in.\\\"\u003e\u003cg class=\\\"dg-node dg-node--final\\\" data-node=\\\"Singleton\\\"\u003e\u003crect class=\\\"dg-box\\\" x=\\\"0\\\" y=\\\"0\\\" width=\\\"243\\\" height=\\\"118\\\" rx=\\\"10\\\"/\u003e\u003ctext class=\\\"dg-stereo\\\" x=\\\"121.5\\\" y=\\\"16\\\" text-anchor=\\\"middle\\\"\u003e«final»\u003c/text\u003e\u003ctext class=\\\"dg-name\\\" x=\\\"121.5\\\" y=\\\"33\\\" text-anchor=\\\"middle\\\"\u003eSingleton\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M0 44 H243\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"62\\\"\u003e- static instance: Singleton\u003c/text\u003e\u003cpath class=\\\"dg-rule\\\" d=\\\"M0 72 H243\\\"/\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"90\\\"\u003e- Singleton()\u003c/text\u003e\u003ctext class=\\\"dg-member\\\" x=\\\"12\\\" y=\\\"108\\\"\u003e+ static getInstance()\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003cfigcaption\u003eThe constructor is private; getInstance() is the only way in.\u003c/figcaption\u003e\u003c/figure\u003e\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"hfdp-creational/singleton/step-2\",\"title\":\"Lazy creation can race\",\"body\":\"\u003cp\u003e\u003ccode\u003eif (instance == null) instance = new Singleton();\u003c/code\u003e isn\u0026#39;t thread-safe.\u003c/p\u003e\\n\u003cp\u003eTwo threads can both see null and both create one.\u003c/p\u003e\\n\u003cp\u003eThe fix: eager creation, a holder class, or an enum.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-3\",\"key\":\"hfdp-creational/singleton/step-3\",\"prompt\":\"\u003cp\u003eTwo threads call this at the same time on first use. What can happen?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eBoth threads can check \u003ccode\u003einstance == null\u003c/code\u003e before either assigns it, so both create a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003eSingleton\u003c/code\u003e\u003c/button\u003e and each caller gets a different object.\u003c/p\u003e\\n\u003cp\u003eWorse, without synchronization, one thread may see a partly constructed object.\u003c/p\u003e\\n\u003cp\u003eAn enum, an eagerly initialized static field, or the holder-class idiom gives thread-safe single instances without explicit locking.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Both create an instance, and callers end up with different objects\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing; static methods are synchronized\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey\u0026#39;re not, unless you declare them so.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-4\",\"key\":\"hfdp-creational/singleton/step-4\",\"prompt\":\"\u003cp\u003eThe simplest thread-safe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003esingleton\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"public \
