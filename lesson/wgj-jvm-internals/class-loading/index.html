 loader\\\" data-def=\\\"The JVM\u0026amp;#39;s built-in loader for core classes like \u0026lt;code\u0026gt;java.lang.String\u0026lt;/code\u0026gt;. It\u0026amp;#39;s shown as \u0026lt;code\u0026gt;null\u0026lt;/code\u0026gt; in Java code.\\\" data-book=\\\"The Well-Grounded Java Developer\\\"\u003ebootstrap loader\u003c/button\u003e loads the core JDK classes.\u003c/p\u003e\\n\u003cp\u003eThe platform loader loads other JDK \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Module\\\" data-def=\\\"A named group of packages with a \u0026lt;code\u0026gt;module-info.java\u0026lt;/code\u0026gt; that declares what it requires and which packages it exports. Unexported packages are hidden.\\\" data-book=\\\"Modern Java in Action\\\"\u003emodules\u003c/button\u003e, and the application loader your classes.\u003c/p\u003e\\n\u003cp\u003eEach first asks its parent, so \u003ccode\u003ejava.lang.String\u003c/code\u003e always comes from the bootstrap loader.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-4\",\"key\":\"wgj-jvm-internals/class-loading/step-4\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003eString.class.getClassLoader()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eCore classes like \u003ccode\u003eString\u003c/code\u003e are loaded by the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bootstrap class loader\\\" data-def=\\\"The JVM\u0026amp;#39;s built-in loader for core classes like \u0026lt;code\u0026gt;java.lang.String\u0026lt;/code\u0026gt;. It\u0026amp;#39;s shown as \u0026lt;code\u0026gt;null\u0026lt;/code\u0026gt; in Java code.\\\" data-book=\\\"The Well-Grounded Java Developer\\\"\u003ebootstrap class loader\u003c/button\u003e, which is part of the JVM itself and isn\u0026#39;t a Java object.\u003c/p\u003e\\n\u003cp\u003eThe API represents it as \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\ ng\":[],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Class loader\\\" data-def=\\\"The object that finds a class\u0026amp;#39;s bytes and turns them into a \u0026lt;code\u0026gt;Class\u0026lt;/code\u0026gt;. Loaders form a hierarchy and ask their parent first.\\\" data-book=\\\"The Well-Grounded Java Developer\\\"\u003eClass loader\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"wgj-jvm-internals/class-loading/step-5\",\"title\":\"A class is its name plus its loader\",\"body\":\"\u003cp\u003eThe same class file loaded by two loaders gives two different classes.\u003c/p\u003e\\n\u003cp\u003eCasting between them throws \u003ccode\u003eClassCastException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eApp servers use this to isolate applications.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"wgj-jvm-internals/class-loading/step-6\",\"prompt\":\"\u003cp\u003eAn error says \u003ccode\u003ecom.acme.Order cannot be cast to com.acme.Order\u003c/code\u003e. What\u0026#39;s the likely cause?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA class\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Identity\\\" data-def=\\\"Whether two references point to the very same object — what \u0026lt;code\u0026gt;==\u0026lt;/code\u0026gt; compares for objects.\\\"\u003eidentity\u003c/button\u003e at run time is its name plus the loader that defined it.\u003c/p\u003e\\n\u003cp\u003eIf two class loaders — say, two web applications, or a plugin and its host — each load \u003ccode\u003ecom.acme.Order\u003c/code\u003e from their own copy, the JVM sees two unrelated classes with the same name.\u003c/p\u003e\\n\u003cp\u003eAn object of one can\u0026#39;t be cast to the other, giving this baffling message. The fix is to load shared types from a common parent loader.\u003c/p\u003e\\n\",\"diagram\
