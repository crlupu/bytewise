on\":6,\"tags\":[\"java\",\"mistakes\",\"overflow\",\"integer division\",\"octal\"],\"sources\":[{\"book\":\"java-mistakes\",\"ref\":\"Chapter 4, Numbers\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 4, Numbers — an accidental octal literal\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 4, Numbers — numeric overflow\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 4, Numbers — rounding during integer division\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 4, Numbers — the absolute value of MIN_VALUE\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 4, Numbers — oddness checks and negative numbers\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jm-numbers/literals-and-overflow/step-1\",\"jm-numbers/literals-and-overflow/step-2\",\"jm-numbers/literals-and-overflow/jm-026\",\"jm-numbers/literals-and-overflow/jm-027\",\"jm-numbers/literals-and-overflow/jm-028\",\"jm-numbers/literals-and-overflow/jm-029\",\"jm-numbers/literals-and-overflow/jm-030\"],\"exercises\":[\"jm-numbers/literals-and-overflow/jm-026\",\"jm-numbers/literals-and-overflow/jm-027\",\"jm-numbers/literals-and-overflow/jm-028\",\"jm-numbers/literals-and-overflow/jm-029\",\"jm-numbers/literals-and-overflow/jm-030\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jm-numbers/literals-and-overflow/step-1\",\"title\":\"int arithmetic wraps\",\"body\":\"\u003cp\u003e\u003ccode\u003eint\u003c/code\u003e arithmetic overflows silently; so does \u003ccode\u003elong\u003c/code\u003e. Use \u003ccode\u003eMath.addExact\u003c/code\u003e/\u003ccode\u003emultiplyExact\u003c/code\u003e to get an exception instead.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eMath.abs(Integer.MIN_VALUE)\u003c/code\u003e is negative, and \u003ccode\u003e-x\u003c/code\u003e overflows too.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jm-numbers/literals-and-overflow/step-2\",\"title\":\"Division and literals\",\"body\":\"\u003cp\u003eInteger division truncates toward zero: \u003ccode\u003e1 / 2\u003c/code\u003e is 0 even when you assign it to a \u003ccode\u003edouble\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA leading \u003ccode\u003e0\u003c/code\u003e makes a literal octal: \u003ccode\u003e010\u003c/code\u003e is 8.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ex % 2 == 1\u003c/code\u003e misses negative odd numbers; test \u003ccode\u003ex % 2 != 0\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-026\",\"key\":\"jm-numbers/literals-and-overflow/jm-026\",\"prompt\":\"\u003cp\u003eThe codes are padded with zeros to line up. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNever pad numeric literals with zeros. A literal like \u003ccode\u003e09\u003c/code\u003e doesn\u0026#39;t even compile.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 4, Numbers — an accidental octal literal.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"101 42 7 10\",\"correct\":false,\"feedback\":\"\u003cp\u003eA leading \u003ccode\u003e0\u003c/code\u003e makes a literal octal: \u003ccode\u003e042\u003c/code\u003e is 34 and \u003ccode\u003e010\u003c/code\u003e is 8. (\u003ccode\u003e007\u003c/code\u003e is 7 either way, which hides the problem.)\u003c/p\u003e\\n\"},{\"html\":\"101 34 7 8\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-027\",\"key\":\"jm-numbers/literals-and-overflow/jm-027\",\"prompt\":\"\u003cp\u003eCompute the file size in bytes. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWrite \u003ccode\u003egigabytes * 1024L * 1024 * 1024\u003c/code\u003e, or use \u003ccode\u003eMath.multiplyExact\u003c/code\u003e to fail loudly.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 4, Numbers — numeric overflow.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"-1073741824\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"3221225472\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe product is computed in \u003ccode\u003eint\u003c/code\u003e and overflows before it\u0026#39;s widened to \u003ccode\u003elong\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-028\",\"key\":\"jm-numbers/literals-and-overflow/jm-028\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWrite \u003ccode\u003e(double) done / total\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 4, Numbers — rounding during integer division.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"0.0%\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"75.0%\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003edone / total\u003c/code\u003e is integer division (0) before it\u0026#39;s converted to \u003ccode\u003edouble\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-029\",\"key\":\"jm-numbers/literals-and-overflow/jm-029\",\"prompt\":\"\u003cp\u003eChoose one of 3 shards for each user id. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u
