attributes and useful interfaces\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"tij-io/io-decorators/step-1\",\"tij-io/io-decorators/step-2\",\"tij-io/io-decorators/step-3\",\"tij-io/io-decorators/step-4\",\"tij-io/io-decorators/step-5\"],\"exercises\":[\"tij-io/io-decorators/step-3\",\"tij-io/io-decorators/step-4\",\"tij-io/io-decorators/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-io/io-decorators/step-1\",\"title\":\"Sources and filters\",\"body\":\"\u003cp\u003e\u003ccode\u003eFileInputStream\u003c/code\u003e and \u003ccode\u003eByteArrayInputStream\u003c/code\u003e read from a source.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eFilterInputStream\u003c/code\u003e subclasses wrap another \u003ccode\u003eInputStream\u003c/code\u003e and add something.\u003c/p\u003e\\n\u003cp\u003eEvery one of them is an \u003ccode\u003eInputStream\u003c/code\u003e, so they plug into each other.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-io/io-decorators/step-2\",\"title\":\"Stacking them\",\"body\":\"\u003cp\u003e\u003ccode\u003enew DataInputStream(new BufferedInputStream(new FileInputStream(\u0026quot;data.bin\u0026quot;)))\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEach wrapper holds the next and adds its feature: typed reads, then buffering.\u003c/p\u003e\\n\u003cp\u003eA call to \u003ccode\u003ereadInt()\u003c/code\u003e travels down the chain to the file.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-3\",\"key\":\"tij-io/io-decorators/step-3\",\"prompt\":\"\u003cp\u003eReading one byte at a time from a file is slow. Tap the class that fixes that when you wrap the file stream in it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBufferedInputStream\u003c/code\u003e reads big blocks from the file and hands out bytes from its buffer.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"InputStream\",\"kind\":\"abstract\"},{\"name\":\"FileInputStream\"},{\"name\":\"FilterInputStream\"},{\"name\":\"BufferedInputStream\"},{\"name\":\"DataInputStream\"}],\"relations\":[{\"from\":\"FileInputStream\",\"to\":\"InputStream\",\"type\":\"extends\"},{\"from\":\"FilterInputStream\",\"to\":\"InputStream\",\"type\":\"extends\"},{\"from\":\"BufferedInputStream\",\"to\":\"FilterInputStream\",\"type\":\"extends\"},{\"from\":\"DataInputStream\",\"to\":\"FilterInputStream\",\"type\":\"extends\"}]},\"feedback\":{\"DataInputStream\":\"It reads typed values like ints, but doesn't buffer.\",\"FilterInputStream\":\"It's the base for wrappers; on its own it adds nothing.\",\"FileInputStream\":\"That's the slow source itself.\",\"InputStream\":\"That's the abstract base.\"}},\"goal\":{\"select\":\"BufferedInputStream\"},\"question\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"tij-io/io-decorators/step-4\",\"prompt\":\"\u003cp\u003ePut the wrapping in order, from the source outwards.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"\u003ccode\u003enew FileInputStream(\u0026quot;data.bin\u0026quot;)\u003c/code\u003e\",\"\u003ccode\u003enew BufferedInputStream(...)\u003c/code\u003e\",\"\u003ccode\u003enew DataInputStream(...)\u003c/code\u003e\"],\"start\":[0,2,1]},{\"id\":\"step-5\",\"key\":\"tij-io/io-decorators/step-5\",\"prompt\":\"\u003cp\u003eWhy \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorators\u003c/button\u003e, rather than one class per combination like \u003ccode\u003eBufferedDataFileInputStream\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Features combine freely — n wrappers instead of a class for every combination\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Decorators are faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe benefit is flexibility; each layer adds a small call overhead if anything.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"I/O\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approach\",\"authors\":\"James F. Kurose \u0026 Keith W. Ross\",\"edition\":\"8th ed.\",\"year\":2021},\"fosa\":{\"id\":\"fosa\",\"title\":\"Fundamentals of Software Architecture\",\"authors\":\"Mark Richards \u0026 Neal Ford\",\"year\":2020},\"release-it\":{\"id\":\"release-it\",\"t
