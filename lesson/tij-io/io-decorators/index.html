InputStream\u003c/code\u003e, so they plug into each other.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-io/io-decorators/step-2\",\"title\":\"Stacking them\",\"body\":\"\u003cp\u003e\u003ccode\u003enew DataInputStream(new BufferedInputStream(new FileInputStream(\u0026quot;data.bin\u0026quot;)))\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEach wrapper holds the next and adds its feature: typed reads, then buffering.\u003c/p\u003e\\n\u003cp\u003eA call to \u003ccode\u003ereadInt()\u003c/code\u003e travels down the chain to the file.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-3\",\"key\":\"tij-io/io-decorators/step-3\",\"prompt\":\"\u003cp\u003eReading one byte at a time from a file is slow. Tap the class that fixes that when you wrap the file stream in it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBufferedInputStream\u003c/code\u003e reads big blocks from the file and hands out bytes from its buffer.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"InputStream\",\"kind\":\"abstract\"},{\"name\":\"FileInputStream\"},{\"name\":\"FilterInputStream\"},{\"name\":\"BufferedInputStream\"},{\"name\":\"DataInputStream\"}],\"relations\":[{\"from\":\"FileInputStream\",\"to\":\"InputStream\",\"type\":\"extends\"},{\"from\":\"FilterInputStream\",\"to\":\"InputStream\",\"type\":\"extends\"},{\"from\":\"BufferedInputStream\",\"to\":\"FilterInputStream\",\"type\":\"extends\"},{\"from\":\"DataInputStream\",\"to\":\"FilterInputStream\",\"type\":\"extends\"}]},\"feedback\":{\"DataInputStream\":\"It reads typed values like ints, but doesn't buffer.\",\"FilterInputStream\":\"It's the base for wrappers; on its own it adds nothing.\",\"FileInputStream\":\"That's the slow source itself.\",\"InputStream\":\"That's the abstract base.\"}},\"goal\ ately\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Appends instead of overwriting\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s for files.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-io-redirecting\",\"key\":\"tij-io/io-decorators/tij-io-redirecting\",\"prompt\":\"\u003cp\u003eAfter \u003ccode\u003eSystem.setOut(out)\u003c/code\u003e, where does \u003ccode\u003eSystem.out.println\u003c/code\u003e write?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Still to the console\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003esetOut\u003c/code\u003e replaces the standard output stream.\u003c/p\u003e\\n\"},{\"html\":\"To \u003ccode\u003etest.out\u003c/code\u003e, until \u003ccode\u003esetOut(console)\u003c/code\u003e restores the console\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-io-osexecutedemo\",\"key\":\"tij-io/io-decorators/tij-io-osexecutedemo\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eOSExecute.command\u003c/code\u003e runs a program and copies its output. What does \u003ccode\u003ejavap OSExecuteDemo\u003c/code\u003e show?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003ejavap\u003c/code\u003e must find the class on its classpath; here it couldn\u0026#39;t, so the demo threw.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/Bru
