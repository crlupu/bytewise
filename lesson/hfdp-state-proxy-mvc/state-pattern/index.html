fdp-state-proxy-mvc\",\"topicId\":\"design-patterns\",\"key\":\"hfdp-state-proxy-mvc/state-pattern\",\"title\":\"The State pattern\",\"summary\":\"Give each state its own class, and let the object delegate to its current state — no more giant conditionals.\",\"duration\":6,\"tags\":[\"design patterns\",\"head first\",\"state\",\"state machine\",\"behavioral\"],\"sources\":[{\"book\":\"head-first-design-patterns\",\"ref\":\"Chapter 10, The State Pattern\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"hfdp-state-proxy-mvc/state-pattern/step-1\",\"hfdp-state-proxy-mvc/state-pattern/step-2\",\"hfdp-state-proxy-mvc/state-pattern/step-3\",\"hfdp-state-proxy-mvc/state-pattern/step-4\",\"hfdp-state-proxy-mvc/state-pattern/step-5\",\"hfdp-state-proxy-mvc/state-pattern/step-6\"],\"exercises\":[\"hfdp-state-proxy-mvc/state-pattern/step-3\",\"hfdp-state-proxy-mvc/state-pattern/step-4\",\"hfdp-state-proxy-mvc/state-pattern/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"hfdp-state-proxy-mvc/state-pattern/step-1\",\"title\":\"Conditionals everywhere\",\"body\":\"\u003cp\u003eA gumball machine has states: no coin, has coin, sold, sold out.\u003c/p\u003e\\n\u003cp\u003eEvery action — insert, eject, turn crank — becomes an \u003ccode\u003eif\u003c/code\u003e per state.\u003c/p\u003e\\n\u003cp\u003eAdding a state touches every method.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"hfdp-state-proxy-mvc/state-pattern/step-2\",\"title\":\"A class per state\",\"body\":\"\u003cp\u003e\u003ccode\u003eNoCoinState\u003c/code\u003e, \u003ccode\u003eHasCoinState\u003c/code\u003e and the others implement a \u003ccode\u003eState\u003c/code\u003e interface.\u003c/p\u003e\\n\u003cp\u003eThe machine holds its current state and delegates each action to it.\u003c/p\u003e\\n\u003cp\u003eStates switch the machine to the next state.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-3\",\"key\":\"hfdp-state-proxy-mvc/state-pattern/step-3\",\"prompt\":\"\u003cp\u003eThe machine is in \u003ccode\u003eNoCoinState\u003c/code\u003e. What happens on \u003ccode\u003eturnCrank()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It dispenses a gumball\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly \u003ccode\u003eHasCoinState.turnCrank()\u003c/code\u003e moves towards dispensing.\u003c/p\u003e\\n\"},{\"html\":\"It prints \u0026quot;You turned, but there\u0026#39;s no coin\u0026quot;, and the state doesn\u0026#39;t change\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-4\",\"key\":\"hfdp-state-proxy-mvc/state-pattern/step-4\",\"prompt\":\"\u003cp\u003eA gumball machine has a state object for each situation — no coin, has coin, sold. Put a successful purchase\u0026#39;s state changes in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"\u003ccode\u003eNoCoinState\u003c/code\u003e\",\"\u003ccode\u003eHasCoinState\u003c/code\u003e, after inserting a coin\",\"\u003ccode\u003eSoldState\u003c/code\u003e, after turning the crank\",\"\u003ccode\u003eNoCoinState\u003c/code\u003e again, after dispensing\"],\"start\":[1,0,3,2]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"hfdp-state-proxy-mvc/state-pattern/step-5\",\"title\":\"State versus Strategy\",\"body\":\"\u003cp\u003eBoth delegate to an object behind an interface.\u003c/p\u003e\\n\u003cp\u003eIn \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Strategy\\\" data-def=\\\"A pattern that puts each variant of an algorithm in its own class behind a shared interface, so the client can swap them.\\\" data-book=\\\"Head First Design Patterns\\\"\u003eStrategy\u003c/button\u003e, the client usually picks the behaviour.\u003c/p\u003e\\n\u003cp\u003eIn State, the states change themselves as things happen.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"hfdp-state-proxy-mvc/state-pattern/step-6\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the main difference between State and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Strategy\\\" data-def=\\\"A pattern that puts each variant of an algorithm in its own class behind a shared interface, so the client can swap them.\\\" data-book=\\\"Head First Design Patterns\\\"\u003eStrategy\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eBoth patterns delegate behaviour to an object behind an interface, so their class diagrams look identical.\u003c/p\u003e\\n\u003cp\u003eThe difference is intent: in Strategy, the client chooses the behaviour, and it rarely changes.\u003c/p\u003e\\n\u003cp\u003eIn State, the state objects themselves switch the context to the next state as events happen, encoding a state machine.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"State uses inheritance and Strategy uses composition\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth use composition.\u003c/p\u003e\\n\"},{\"html\":\"In State, the object\u0026#39;s state objects swap themselves as events occur; in Strategy, the client sets the behaviour\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003eComposition\u003c/button\u003e\"]}]},\"courseTitle\":\"State, Proxy and MVC\",\"next\":{\"id\":\"proxy-pattern\",\"courseId\":\"hfdp-state-proxy-mvc\",\"topicId\":\"design-patterns\",\"key\":\"hfdp-state-proxy-mvc/proxy-pattern\",\"title\":\"The Proxy pattern\",\"summary\":\"A proxy stands in for another object with the same interface, to reach it remotely, create it lazily, or check access.\",\"duration\":5,\"tags\":[\"design patterns\",\"head first\",\"proxy\",\"remote proxy\",\"virtual proxy\",\"protection proxy\",\"structural\"],\"sources\":[{\"book\":\"head-first-design-patterns\",\"ref\":\"Chapter 11, The Proxy Pattern\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"hfdp-state-proxy-mvc/proxy-pattern/step-1\",\"hfdp-state-proxy-mvc/proxy-pattern/step-2\",\"hfdp-state-proxy-mvc/proxy-pattern/step-3\",\"hfdp-state-proxy-mvc/proxy-pattern/step-4\",\"hfdp-state-proxy-mvc/proxy-pattern/step-5\",\"hfdp-state-proxy-mvc/proxy-pattern/step-6\"],\"exercises\":[\"hfdp-state-proxy-mvc/proxy-pattern/step-2\",\"hfdp-state-proxy-mvc/proxy-pattern/step-4\",\"hfdp-state-proxy-mvc/proxy-pattern/step-6\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H
