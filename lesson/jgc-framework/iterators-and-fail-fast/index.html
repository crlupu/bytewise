le\":\"Iterators and fail-fast behaviour\",\"summary\":\"Changing a collection while iterating over it throws `ConcurrentModificationException`, unless you go through the iterator.\",\"duration\":5,\"tags\":[\"java\",\"collections\",\"iterator\",\"fail fast\",\"concurrentmodificationexception\"],\"sources\":[{\"book\":\"java-generics-collections\",\"ref\":\"§11.1, Iterable and Iterators\"},{\"book\":\"java-generics-collections\",\"ref\":\"§11.5, Collections and Thread Safety\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jgc-framework/iterators-and-fail-fast/step-1\",\"jgc-framework/iterators-and-fail-fast/step-2\",\"jgc-framework/iterators-and-fail-fast/step-3\",\"jgc-framework/iterators-and-fail-fast/step-4\",\"jgc-framework/iterators-and-fail-fast/step-5\",\"jgc-framework/iterators-and-fail-fast/step-6\"],\"exercises\":[\"jgc-framework/iterators-and-fail-fast/step-2\",\"jgc-framework/iterators-and-fail-fast/step-4\",\"jgc-framework/iterators-and-fail-fast/step-5\",\"jgc-framework/iterators-and-fail-fast/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jgc-framework/iterators-and-fail-fast/step-1\",\"title\":\"Fail-fast iterators\",\"body\":\"\u003cp\u003eMost collections count their structural changes.\u003c/p\u003e\\n\u003cp\u003eTheir iterators check the count on every step.\u003c/p\u003e\\n\u003cp\u003eA change from outside the iterator throws \u003ccode\u003eConcurrentModificationException\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"jgc-framework/iterators-and-fail-fast/step-2\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA for-each loop uses a hidden iterator, and \u003ccode\u003eArrayList\u003c/code\u003e\u0026#39;s iterator records the list\u0026#39;s modification count when it\u0026#39;s created.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003elist.remove(i)\u003c/code\u003e changes the list directly and bumps that cou
