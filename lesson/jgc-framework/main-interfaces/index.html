:5,\"tags\":[\"java\",\"collections\",\"interfaces\",\"list\",\"set\",\"queue\",\"map\"],\"sources\":[{\"book\":\"java-generics-collections\",\"ref\":\"Chapter 10, The Main Interfaces of the Java Collections Framework\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jgc-framework/main-interfaces/step-1\",\"jgc-framework/main-interfaces/step-2\",\"jgc-framework/main-interfaces/step-3\",\"jgc-framework/main-interfaces/step-4\",\"jgc-framework/main-interfaces/step-5\",\"jgc-framework/main-interfaces/step-6\"],\"exercises\":[\"jgc-framework/main-interfaces/step-2\",\"jgc-framework/main-interfaces/step-5\",\"jgc-framework/main-interfaces/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jgc-framework/main-interfaces/step-1\",\"title\":\"Behaviour first\",\"body\":\"\u003cp\u003e\u003ccode\u003eList\u003c/code\u003e keeps order and allows duplicates.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eSet\u003c/code\u003e forbids duplicates.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eQueue\u003c/code\u003e hands elements out in a processing order; \u003ccode\u003eMap\u003c/code\u003e links keys to values.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"jgc-framework/main-interfaces/step-2\",\"prompt\":\"\u003cp\u003eMatch each need with the interface.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"A playlist, in order, songs may repeat\",\"Tags on a post, no repeats\",\"Jobs waiting to be processed\",\"Phone numbers by name\"],\"right\":[\"\u003ccode\u003eList\u003c/code\u003e\",\"\u003ccode\u003eSet\u003c/code\u003e\",\"\u003ccode\u003eQueue\u003c/code\u003e\",\"\u003ccode\u003eMap\u003c/code\u003e\"],\"rightOrder\":[3,2,0,1]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jgc-framework/main-interfaces/step-3\",\"title\":\"Declare the interface\",\"body\":\"\u003cp\u003eDeclare variables and paramet
