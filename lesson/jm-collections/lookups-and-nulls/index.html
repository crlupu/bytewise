uld return.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e, then \u003ccode\u003eNullPointerException\u003c/code\u003e: \u003ccode\u003eSet.of\u003c/code\u003e collections reject \u003ccode\u003enull\u003c/code\u003e even in \u003ccode\u003econtains\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"jm-074\",\"key\":\"jm-collections/lookups-and-nulls/jm-074\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 8, Collections and maps — null values in streams.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"\u003ccode\u003eNullPointerException\u003c/code\u003e: \u003ccode\u003eCollectors.toMap\u003c/code\u003e doesn\u0026#39;t accept \u003ccode\u003enull\u003c/code\u003e values, although \u003ccode\u003eHashMap\u003c/code\u003e does\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It prints \u003ccode\u003e{ann=ann@x.org, bob=null}\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003etoMap\u003c/code\u003e uses \u003ccode\u003emerge\u003c/code\u003e, which rejects \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"jm-075\",\"key\":\"jm-collections/lookups-and-nulls/jm-075\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWrite \u003ccode\u003eInteger n = known ? counts.get(\u0026quot;b\u0026quot;) : Integer.valueOf(0);\u003c/code\u003e — or use \u003ccode\u003egetOrDefault\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 8, Collections and maps — unexpected \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Autoboxing\\\" data-def=\\\"The compiler converting automatically between primitives and their boxed types — \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; ↔ \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eunboxing\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"It prints \u003ccode\u003enull\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe result type of \u003ccode\u003e?:\u003c/code\u003e is \u003ccode\u003eint\u003c/code\u003e here, so \u003ccode\u003enull\u003c/code\u003e is unboxed before being boxed again.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eNullPointerException\u003c/code\u003e: with an \u003ccode\u003eint\u003c/code\u003e operand, the conditional unboxes \u003ccode\u003ecounts.get(\u0026quot;b\u0026quot;)\u003c/code\u003e, which is \u003ccode\u003enull\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"jm-076\",\"key\":\"jm-collections/lookups-and-nulls/jm-076\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 8, Collections and maps — modifying an unmodifiable collection.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$18\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eadded\\nUOE\\nadded\\nUOE\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eArrays.asList\u003c/code\u003e is a fixed-size view of the array: \u003ccode\u003eset\u003c/code\u003e works, \u003ccode\u003eadd\u003c/code\u003e doesn\u0026#39;t.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eadded\\nUOE\\nUOE\\nUOE\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-077\",\"key\":\"jm-collections/lookups-and-nulls/jm-077\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eunmodifiableList\u003c/code\u003e is a read-only window, not a copy. Use \u003ccode\u003eList.copyOf\u003c/code\u003e to take a snapshot.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 8, Collections and maps — an unmodifiable view that changes.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$19\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e[a, b]\\ntrue\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eList.copyOf\u003c/code\u003e of an \u003ccode\u003eArrayList\u003c/code\u003e makes a new, unmodifiable list.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e[a, b]\\nfalse\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e[a]\\nfalse\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn unmodifiable view isn\u0026#39;t a copy: it shows later changes to the list behind it, so \u003ccode\u003ebefore\u003c/code\u003e now shows \u003ccode\u003eb\u003c/code\u003e too.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]}]},\"courseTitle\":\"Collections and maps\",\"next\":{\"id\":\"iter
