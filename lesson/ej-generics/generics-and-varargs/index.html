n object of a different type — possible with generic varargs, and causes a surprise \u0026lt;code\u0026gt;ClassCastException\u0026lt;/code\u0026gt; later.\\\" data-book=\\\"Effective Java\\\"\u003eheap pollution\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-generics/generics-and-varargs/step-2\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eStoring into a generic \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Varargs\\\" data-def=\\\"A parameter like \u0026lt;code\u0026gt;int... nums\u0026lt;/code\u0026gt; that accepts any number of arguments; the method receives them as an array.\\\" data-book=\\\"Effective Java\\\"\u003evarargs\u003c/button\u003e array is unsafe.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA varargs parameter of generic type is really an array, here a \u003ccode\u003eList\u0026lt;String\u0026gt;[]\u003c/code\u003e, and arrays of generics can\u0026#39;t enforce their element type at run time.\u003c/p\u003e\\n\u003cp\u003eAssigning it to \u003ccode\u003eObject[]\u003c/code\u003e and storing a \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e succeeds silently — that\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Heap pollution\\\" data-def=\\\"A variable of a parameterized type refers to an object of a different type — possible with generic varargs, and causes a surprise \u0026lt;code\u0026gt;ClassCastException\u0026lt;/code\u0026gt; later.\\\" data-book=\\\"Effective Java\\\"\u003eheap pollution\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eWhen code later reads \u003ccode\u003estringLists[0].get(0)\u003c/code\u003e as a \u003ccode\u003eString\u003c/code\u003e, the cast the compiler inserted fails with \u003ccode\u003eClassCastException\u003c/code\u003e, even though the method contains no visible cast.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It prints 42\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eClassCastException\u003c/code\u003e on the last line, from a cast the compiler inserted\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"A compile error\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly warnings — that\u0026#39;s why it\u0026#39;s dangerous.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-generics/generics-and-varargs/step-3\",\"title\":\"When it's safe\",\"body\":\"\u003cp\u003eDon\u0026#39;t store anything into the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Varargs\\\" data-def=\\\"A parameter like \u0026lt;code\u0026gt;int... nums\u0026lt;/code\u0026gt; that accepts any number of arguments; the method receives them as an array.\\\" data-book=\\\"Effective Java\\\"\u003evarargs\u003c/button\u003e array.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t let the array escape the method.\u003c/p\u003e\\n\u003cp\u003eThen mark the method \u003ccode\u003e@SafeVarargs\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-generics/generics-and-varargs/step-4\",\"prompt\":\"\u003cp\u003eWhen is a generic \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Varargs\\\" data-def=\\\"A parameter like \u0026lt;code\u0026gt;int... nums\u0026lt;/code\u0026gt; that accepts any number of arguments; the method receives them as an array.\\\" data-book=\\\"Effective Java\\\"\u003evarargs\u003c/button\u003e method safe?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThen annotate it \u003ccode\u003e@SafeVarargs\u003c/code\u003e — allowed on static, final and (since Java 9) private methods.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"When it\u0026#39;s \u003ccode\u003epublic\u003c/code\u003e\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t store anything into the varargs array, and doesn\u0026#39;t let a reference to the array escape\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Whenever it\u0026#39;s annotated with \u003ccode\u003e@SafeVarargs\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe annotation is a promise by the author; it doesn\u0026#39;t make anything safe.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"ej-generics/generics-and-varargs/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003estatic \u0026lt;T\u0026gt; T[] toArray(T... args) { return args; }\u003c/code\u003e is called from \u003ccode\u003e\u0026lt;T\u0026gt; T[] pickTwo(T a, T b, T c)\u003c/code\u003e as \u003ccode\u003etoArray(a, b)\u003c/code\u003e. What does \u003ccode\u003eString[] attributes = pickTwo(\u0026quot;Good\u0026quot;, \u0026quot;Fast\u0026quot;, \u0026quot;Cheap\u0026quot;);\u003c/code\u003e do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eReturning the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Varargs\\\" data-def=\\\"A parameter like \u0026lt;code\u0026gt;int... nums\u0026lt;/code\u0026gt; that accepts any number of arguments; the method receives them as an array.\\\" data-book=\\\"Effective Java\\\"\u003evarargs\u003c/button\u003e array lets \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Heap pollution\\\" data-def=\\\"A variable of a parameterized type refers to an object of a different type — possible with generic varargs, and causes a surprise \u0026lt;code\u0026gt;ClassCastException\u0026lt;/code\u0026gt; later.\\\" data-book=\\\"Effective Java\\\"\u003eheap pollution\u003c/button\u003e escape up the call stack.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInside \u003ccode\u003epickTwo\u003c/code\u003e, \u003ccode\u003eT\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eerased\u003c/button\u003e, so the compiler creates the varargs array for \u003ccode\u003etoArray(a, b)\u003c/code\u003e as an \u003ccode\u003eObject[]\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003etoArray\u003c/code\u003e returns that array, \u003ccode\u003epickTwo\u003c/code\u003e returns it as \u003ccode\u003eT[]\u003c/code\u003e, and the caller\u0026#39;s code casts it to \u003ccode\u003eString[]\u003c/code\u003e — which fails, because an \u003ccode\u003eObject[]\u003c/code\u003e isn\u0026#39;t a \u003ccode\u003eString[]\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe bug shows up two calls away from its cause. Never return a generic varargs array, or pass it to code that might.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Returns two strings\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003epickTwo\u003c/code\u003e can\u0026#39;t know T at run time, so the compiler creates an \u003ccode\u003eObject[]\u003c/code\u003e for its call to \u003ccode\u003etoArray\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Throws \u003ccode\u003eClassCastException\u003c/code\u003e — the array created in \u003ccode\u003epickTwo\u003c/code\u003e is an \u003ccode\u003eObject[]\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensi
