ucer \u003ccode\u003eextends\u003c/code\u003e: you read E\u0026#39;s from it.\u003c/p\u003e\\n\u003cp\u003eConsumer \u003ccode\u003esuper\u003c/code\u003e: you put E\u0026#39;s into it.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t use wildcards in return types.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"ej-generics/bounded-wildcards/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003epopAll\u003c/code\u003e moves elements \u003cem\u003einto\u003c/em\u003e a destination collection. Make it accept a \u003ccode\u003eCollection\u0026lt;Object\u0026gt;\u003c/code\u003e for a \u003ccode\u003eStack\u0026lt;Number\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA \u003ccode\u003eCollection\u0026lt;Object\u0026gt;\u003c/code\u003e can accept Numbers, so the destination may be of any supertype of E.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"public void popAll(Collection\u003c? \"},{\"answers\":[\"super\"],\"size\":5,\"choices\":[\"unchecked\",\"super\",\"E\",\"\u003cE\u003e\"]},{\"text\":\" E\u003e dst)\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-4\",\"key\":\"ej-generics/bounded-wildcards/step-4\",\"prompt\":\"\u003cp\u003eApply \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"PECS\\\" data-def=\\\"\u0026amp;quot;Producer-extends, consumer-super\u0026amp;quot;: use \u0026lt;code\u0026gt;? extends T\u0026lt;/code\u0026gt; for a parameter you read Ts from, \u0026lt;code\u0026gt;? super T\u0026lt;/code\u0026gt; for one you put Ts into.\\\" data-book=\\\"Effective Java\\\"\u003ePECS\u003c/button\u003e — producer-\u003ccode\u003eextends\u003c/code\u003e, consumer-\u003ccode\u003esuper\u003c/code\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003epushAll(src)\u003c/code\u003e — reads E\u0026#39;s out of src\",\"\u003ccode\u003epopAll(dst)\u003c/code\u003e — writes E\u0026#39;s into dst\",\"A \u003ccode\u003eComparator\u003c/code\u003e that consumes T\u0026#39;s to compare them\",\"A \u003ccode\u003eCollection\u003c/code\u003e you return to the caller\"],\"right\":[\"\u003ccode\u003eIterable\u0026lt;? extends E\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eCollection\u0026lt;? super E\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eComparator\u0026lt;? super T\u0026gt;\u003c/code\u003e\",\"No wildcard — \u003ccode\u003eCollection\u0026lt;E\u0026gt;\u003c/code\u003e\"],\"rightOrder\":[1,2,3,0]},{\"id\":\"step-5\",\"key\":\"ej-generics/bounded-wildcards/step-5\",\"prompt\":\"\u003cp\u003eWhy shouldn\u0026#39;t you use wildcard types as return types?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIf clients have to think about wildcards, the API is probably wrong.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles — it\u0026#39;s just bad API design.\u003c/p\u003e\\n\"},{\"html\":\"It would force wildcards on your callers\u0026#39; code instead of hiding the flexibility in your API\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"ej-generics/bounded-wildcards/step-6\",\"prompt\":\"\u003cp\u003eWhich \u003ccode\u003emax\u003c/code\u003e signature accepts the most collections?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eComparables and comparators are always consumers, so \u003ccode\u003eComparable\u0026lt;? super T\u0026gt;\u003c/code\u003e is the rule.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eComparable\u0026lt;? super T\u0026gt;\u003c/code\u003e lets \u003ccode\u003eT\u003c/code\u003e inherit its comparison from a supertype: \u003ccode\u003eScheduledFuture\u003c/code\u003e is comparable to \u003ccode\u003eDelayed\u003c/code\u003e, not to itself, so \u003ccode\u003eComparable\u0026lt;T\u0026gt;\u003c/code\u003e would reject it.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eList\u0026lt;? extends T\u0026gt;\u003c/code\u003e lets you pass a list of any subtype of \u003ccode\u003eT\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe rule of thumb is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"PECS\\\" data-def=\\\"\u0026amp;quot;Producer-extends, consumer-super\u0026amp;quot;: use \u0026lt;code\u0026gt;? extends T\u0026lt;/code\u0026gt; for a parameter you read Ts from, \u0026lt;code\u0026gt;? super T\u0026lt;/code\u0026gt; for one you put Ts into.\\\" data-book=\\\"Effective Java\\\"\u003ePECS\u003c/button\u003e — producers extend, consumers super: the list produces \u003ccode\u003eT\u003c/code\u003es for \u003ccode\u003emax\u003c/code\u003e to read, while the comparator consumes them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e\u0026lt;T extends Comparable\u0026lt;T\u0026gt;\u0026gt; T max(List\u0026lt;T\u0026gt; list)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThis rejects types like \u003ccode\u003eScheduledFuture\u003c/code\u003e, which is comparable to a supertype (\u003ccode\u003eDelayed\u003c/code\u003e) rather than to itself.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e\u0026lt;T extends Comparable\u0026lt;? super T\u0026gt;\u0026gt; T max(List\u0026lt;? extends T\u0026gt; list)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"ej-generics/bounded-wildcards/step-7\",\"prompt\":\"\u003cp\u003eChoosing between \u003ccode\u003e\u0026lt;E\u0026gt; void swap(List\u0026lt;E\u002
