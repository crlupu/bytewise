03eCollections.emptySet()\u003c/code\u003e use the same trick.\u003c/p\u003e\\n\",\"details\":\"$14\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A generic singleton factory — one object, cast to \u003ccode\u003eUnaryOperator\u0026lt;T\u0026gt;\u003c/code\u003e for any T, safe because it never touches the type\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Create a new instance per type\",\"correct\":false,\"feedback\":\"\u003cp\u003eWorks, but wasteful; \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eerasure\u003c/button\u003e lets one instance be shared.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003eSingleton\u003c/button\u003e\"]}]},\"courseTitle\":\"Generics\",\"next\":{\"id\":\"bounded-wildcards\",\"courseId\":\"ej-generics\",\"topicId\":\"effective-java\",\"key\":\"ej-generics/bounded-wildcards\",\"title\":\"Bounded wildcards — PECS\",\"summary\":\"Producer extends, consumer super — wildcards make APIs accept everything they logically should.\",\"duration\":6,\"tags\":[\"java\",\"effective java\",\"generics\",\"wildcards\",\"pecs\",\"api design\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 31\"}],\"requires\
