\",\"erasure\",\"reification\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 28\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"ej-generics/lists-over-arrays/step-1\",\"ej-generics/lists-over-arrays/step-2\",\"ej-generics/lists-over-arrays/step-3\",\"ej-generics/lists-over-arrays/step-4\",\"ej-generics/lists-over-arrays/step-5\",\"ej-generics/lists-over-arrays/step-6\",\"ej-generics/lists-over-arrays/step-7\"],\"exercises\":[\"ej-generics/lists-over-arrays/step-2\",\"ej-generics/lists-over-arrays/step-3\",\"ej-generics/lists-over-arrays/step-5\",\"ej-generics/lists-over-arrays/step-6\",\"ej-generics/lists-over-arrays/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-generics/lists-over-arrays/step-1\",\"title\":\"Arrays fail late\",\"body\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e: \u003ccode\u003eLong[]\u003c/code\u003e is an \u003ccode\u003eObject[]\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eStore a \u003ccode\u003eString\u003c/code\u003e in it, and it fails at run time.\u003c/p\u003e\\n\u003cp\u003eGenerics reject the same mistake at compile time.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"ej-generics/lists-over-arrays/step-2\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eArrays check element types at run time — they\u0026#39;re \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reified\\\" data-def=\\\"Type information that exists at run time. Arrays know their element type; generic types don\u0026amp;#39;t — it\u0026amp;#39;s erased.\\\" data-book=\\\"Effective Java\\\"\u003ereified\u003c/button\u003e\u003c/strong\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It compiles, then throws \u003ccode\u003eArrayStoreException\u003c/code\u003e at run time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It works, storing a String in a Long array\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"It fails to compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e — a \u003ccode\u003eLong[]\u003c/code\u003e is an \u003ccode\u003eObject[]\u003c/code\u003e — so the first line is legal.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"ej-generics/lists-over-arrays/step-3\",\"prompt\":\"\u003cp\u003eAnd this?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGenerics are \u003cstrong\u003einvariant\u003c/strong\u003e — a \u003ccode\u003eList\u0026lt;Long\u0026gt;\u003c/code\u003e is not a \u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e — so the mistake is caught at compile time.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eGenerics are invariant: \u003ccode\u003eList\u0026lt;Long\u0026gt;\u003c/code\u003e is not a subtype of \u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e, so the assignment on the first line doesn\u0026#39;t compile.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s the point — if it were allowed, adding a \u003ccode\u003eString\u003c/code\u003e through the \u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e view would corrupt a list of \u003ccode\u003eLong\u003c/code\u003es.\u003c/p\u003e\\n\u003cp\u003eArrays allow the equivalent assignment and catch the mistake only at run time. Generics catch it before the program runs.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It fails to compile at the first line\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws at run time\",\"correct\":false,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"ej-generics/lists-over-arrays/step-4\",\"title\":\"Arrays and generics don't mix\",\"body\":\"\u003cp\u003eArrays know their element type at run time.\u003c/p\u003e\\n\u003cp\u003eGenerics erase it.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003enew List\u0026lt;String\u0026gt;[10]\u003c/code\u003e is illegal.\u003c/p\u003e\\n\u003cp\u003ePrefer \u003ccode\u003eList\u0026lt;T\u0026gt;\u003c/code\u003e to \u003ccode\u003eT[]\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"ej-generics/lists-over-arrays/step-5\",\"prompt\":\"\u003cp\u003eMatch each property to arrays or generics.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Covariant\",\"Invariant\",\"Reified\",\"Erased\"],\"right\":[\"Arrays — \u003ccode\u003eSub[]\u003c/code\u003e is a subtype of \u003ccode\u003eSuper[]\u003c/code\u003e\",\"Generics — \u003ccode\u003eList\u0026lt;Sub\u0026gt;\u003c/code\u003e is unrelated to \u003ccode\u003eList\u0026lt;Super\u0026gt;\u003c/code\u003e\",\"Arrays — they know and check their element type at run time\",\"Generics — type arguments are checked at compile time, then discarded\"],\"rightOrder\":[0,1,3,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003eCovariant\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reified\\\" data-def=\\\"Type information that exists at run time. Arrays know their element type; generic types don\u0026amp;#39;t — it\u0026amp;#39;s erased.\\\" data-book=\\\"Effective Java\\\"\u003eReified\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eErasure\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"ej-generics/lists-over-arrays/step-6\",\"prompt\":\"\u003cp\u003eWhy is \u003ccode\u003enew List\u0026lt;String\u0026gt;[10]\u003c/code\u003e illegal?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A generic array couldn\u0026#39;t be type-safe — its reified element type would hide erased type arguments, allowing heap pollution\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Arrays can only hold primitives\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s legal\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe compiler reports \u0026quot;generic array creation\u0026quot;.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reified\\\" data-def=\\\"Type information that exists at run time. Arrays know their element type; generic types don\u0026amp;#39;t — it\u0026amp;#39;s erased.\\\" data-book=\\\"Effective Java\\\"\u003eReified\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eErasure\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Heap pollution\\\" data-def=\\\"A variable of a parameterized type refers to an object of a different type — possible with generic varargs, and causes a surprise \u0026lt;code\u0026gt;ClassCastException\u0026lt;/code\u0026gt; later.\\\" data-book=\\\"Effective Java\\\"\u003eHeap pollution\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"ej-generics/lists-over-arrays/step-7\",\"prompt\":\"\u003cp\u003eA \u003ccode\u003eChooser\u003c/code\u003e class stores choices in a \u003ccode\u003eT[]\u003c/code\u003e cast from \u003ccode\u003eObject[]\u003c/code\u003e, with an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked warning\\\" data-def=\\\"The compiler saying it can\u0026amp;#39;t verify type safety at this point. Eliminate them, or prove safety and suppress with \u0026lt;code\u0026gt;@SuppressWarnings(\u0026amp;quot;unchecked\u0026amp;quot;)\u0026lt;/code\u0026gt; on the smallest scope.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked warning\u003c/button\u003e. What\u0026#39;s the better design?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhen arrays and generics don\u0026#39;t mix well, the first instinct should be to replace the array with a list.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Store a \u003ccode\u003eList\u0026lt;T\u0026gt;\u003c/code\u003e — slightly slower, but type-safe with no warnings\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Suppress the warning on the class\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Generics\",\"next\":{\"id\":\"generic-types\",\"courseId\":\"ej-generics\",\"topicId\":\"effective-java\",\"key\":\"ej-generics/generic-types\",\"title\":\"Favor generic types\",\"summary\":\"Make your own classes generic, so clients get type safety without casts.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"generics\",\"generic class\",\"type parameters\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 29\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"ej-generics/generic-types/step-1\",\"ej-generics/generic-types/step-2\",\"ej-generics/generic-types/step-3\",\"ej-generics/generic-types/step-4\",\"ej-generics/generic-types/step-5\",\"ej-generics/generic-types/step-6\",\"ej-generics/generic-types/step-7\"],\"exercises\":[\"ej-generics/generic-types/step-3\",\"ej-generics/generic-types/step-4\",\"ej-generics/generic-types/step-6\",\"ej-generics/generic-types/step-7\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\
