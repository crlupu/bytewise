.js\",\"390\",\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"choosing-a-lock\",\"courseId\":\"jcip-explicit-locks\",\"topicId\":\"jcip\",\"key\":\"jcip-explicit-locks/choosing-a-lock\",\"title\":\"Fairness, and synchronized vs ReentrantLock\",\"summary\":\"Fair locks cost throughput; ReentrantLock is for when you need its extra features — otherwise use synchronized.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"fairness\",\"reentrantlock\",\"synchronized\",\"performance\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§13.2–13.4, Performance Considerations; Fairness; Choosing Between Synchronized and ReentrantLock\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-explicit-locks/choosing-a-lock/step-1\",\"jcip-explicit-locks/choosing-a-lock/step-2\",\"jcip-explicit-locks/choosing-a-lock/step-3\",\"jcip-explicit-locks/choosing-a-lock/step-4\",\"jcip-explicit-locks/choosing-a-lock/step-5\",\"jcip-explicit-locks/choosing-a-lock/step-6\",\"jcip-explicit-locks/choosing-a-lock/step-7\"],\"exercises\":[\"jcip-explicit-locks/choosing-a-lock/step-3\",\"jcip-explicit-locks/choosing-a-lock/step-4\",\"jcip-explicit-locks/choosing-a-lock/step-6\",\"jcip-explicit-locks/choosing-a-lock/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-1\",\"title\":\"Fair or nonfair\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fair lock\\\" data-def=\\\"A lock that grants access in the order threads asked. Nonfair locks allow barging and are much faster.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003efair lock\u003c/button\u003e serves threads in arrival order.\u003c/p\u003e\\n\u003cp\u003eA nonfair lock lets a newcomer barge in when it\u0026#39;s free.\u003c/p\u003e\\n\u003cp\u003eNonfair is the default.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-2\",\"title\":\"Nonfair is faster\",\"body\":\"\u003cp\u003eWaking a waiting thread takes time.\u003c/p\u003e\\n\u003cp\u003eA running thread can use the lock in that gap.\u003c/p\u003e\\n\u003cp\u003eChoose fairness only when \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Starvation\\\" data-def=\\\"A thread is perpetually denied access to a resource it needs, such as CPU time or a lock, so it can\u0026amp;#39;t progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003estarvation\u003c/button\u003e matters.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-3\",\"prompt\":\"\u003cp\u003eWhy is nonfair locking usually faster under \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtention\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIn JCIP\u0026#39;s benchmarks fair locks were dramatically slower — sometimes by two orders of magnitude.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen a lock is released, a fair lock hands it to the longest-waiting thread, which must first be woken by the OS — a delay of microseconds or more.\u003c/p\u003e\\n\u003cp\u003eA nonfair lock lets a thread that happens to be running and asking at that moment take it immediately, using the lock while the woken thread is still starting.\u003c/p\u003e\\n\u003cp\u003eThat barging fills the gap and greatly increases \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Throughput\\\" data-def=\\\"How much work gets done per unit of time.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethroughput\u003c/button\u003e, at the cost of no ordering guarantee.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Fair locks use more memory\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe cost is in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elatency\u003c/button\u003e between release and the next acquisition, not memory.\u003c/p\u003e\\n\"},{\"html\":\"Resuming a suspended thread takes time; letting an already-running thread barge in uses the lock during that gap\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fair lock\\\" data-def=\\\"A lock that grants access in the order threads asked. Nonfair locks allow barging and are much faster.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eFair lock\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-4\",\"prompt\":\"\u003cp\u003eWhen does fairness matter?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"When locks are held relatively long, or requests arrive slowly enough that barging rarely helps — and starvation must be avoided\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always\",\"correct\":false,\"feedback\":\"\u003cp\u003eMost programs never need fairness, and pay for it heavily if they ask for it.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Starvation\\\" data-def=\\\"A thread is perpetually denied access to a resource it needs, such as CPU time or a lock, so it can\u0026amp;#39;t progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eStarvation\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-5\",\"title\":\"Prefer synchronized\",\"body\":\"\u003cp\u003e\u003ccode\u003esynchronized\u003c/code\u003e is simpler, and can\u0026#39;t be left locked.\u003c/p\u003e\\n\u003cp\u003eUse \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ReentrantLock\\\" data-def=\\\"An explicit lock with the same semantics as \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;, plus timed and interruptible acquisition, \u0026lt;code\u0026gt;tryLock\u0026lt;/code\u0026gt;, fairness and multiple conditions. Must be unlocked in a \u0026lt;code\u0026gt;finally\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eReentrantLock\u003c/code\u003e\u003c/button\u003e only for \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003etimeouts\u003c/button\u003e, interrupts or unusual structures.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-6\",\"prompt\":\"\u003cp\u003eSynchronized or ReentrantLock?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Plain mutual exclusion around a block of code\",\"Timed or polled lock attempts\",\"Interruptible lock acquisition\",\"Non-block-structured locking, like hand-over-hand\"],\"right\":[\"\u003ccode\u003esynchronized\
