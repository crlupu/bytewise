yle=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003eunlock\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(); }\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eAlways unlock in \u003ccode\u003efinally\u003c/code\u003e.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"14:T567,"])</script><script>self.__next_f.push([1,"\u003cfigure class=\"diagram\"\u003e\u003csvg class=\"dg\" viewBox=\"-8 -8 220 298\" width=\"220\" style=\"width:100%;max-width:220px;min-width:143px;height:auto\" role=\"img\" aria-label=\"Diagram\"\u003e\u003cpath class=\"dg-edge dg-edge--dashed\" d=\"M102 222 V198\"/\u003e\u003cpath class=\"dg-edge dg-edge--dashed\" d=\"M102 198 H102 M102 198 V175\"/\u003e\u003cpolygon class=\"dg-head dg-head--open\" points=\"102,162 95,175 109,175\"/\u003e\u003cg class=\"dg-node dg-node--interface\" data-node=\"Lock\"\u003e\u003crect class=\"dg-box\" x=\"15.5\" y=\"0\" width=\"173\" height=\"162\" rx=\"10\"/\u003e\u003ctext class=\"dg-stereo\" x=\"102\" y=\"16\" text-anchor=\"middle\"\u003e«interface»\u003c/text\u003e\u003ctext class=\"dg-name\" x=\"102\" y=\"33\" text-anchor=\"middle\"\u003eLock\u003c/text\u003e\u003cpath class=\"dg-rule\" d=\"M15.5 44 H188.5\"/\u003e\u003ctext class=\"dg-member\" x=\"27.5\" y=\"62\"\u003elock()\u003c/text\u003e\u003ctext class=\"dg-member\" x=\"27.5\" y=\"80\"\u003etryLock()\u003c/text\u003e\u003ctext class=\"dg-member\" x=\"27.5\" y=\"98\"\u003etryLock(timeout)\u003c/text\u003e\u003ctext class=\"dg-member\" x=\"27.5\" y=\"116\"\u003elockInterruptibly()\u003c/text\u003e\u003ctext class=\"dg-member\" x=\"27.5\" y=\"134\"\u003eunlock()\u003c/text\u003e\u003ctext class=\"dg-member\" x=\"27.5\" y=\"152\"\u003enewCondition()\u003c/text\u003e\u003c/g\u003e\u003cg class=\"dg-node dg-node--class\" data-node=\"ReentrantLock\"\u003e\u003crect class=\"dg-box\" x=\"0\" y=\"222\" width=\"204\" height=\"60\" rx=\"10\"/\u003e\u003ctext class=\"dg-name\" x=\"102\" y=\"243\" text-anchor=\"middle\"\u003eReentrantLock\u003c/text\u003e\u003cpath class=\"dg-rule\" d=\"M0 254 H204\"/\u003e\u003ctext class=\"dg-member\" x=\"12\" y=\"272\"\u003eisHeldByCurrentThread()\u003c/text\u003e\u003c/g\u003e\u003c/svg\u003e\u003c/figure\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"reentrantlock\",\"courseId\":\"jcip-explicit-locks\",\"topicId\":\"jcip\",\"key\":\"jcip-explicit-locks/reentrantlock\",\"title\":\"Lock and ReentrantLock\",\"summary\":\"The same mutual exclusion as synchronized, plus timed, polled and interruptible acquisition — at the price of unlocking yourself.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"lock\",\"reentrantlock\",\"trylock\",\"lockinterruptibly\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§13.1, Lock and ReentrantLock\"}],\"requires\":[],\"steps\":8,\"stepKeys\":[\"jcip-explicit-locks/reentrantlock/step-1\",\"jcip-explicit-locks/reentrantlock/step-2\",\"jcip-explicit-locks/reentrantlock/step-3\",\"jcip-explicit-locks/reentrantlock/step-4\",\"jcip-explicit-locks/reentrantlock/step-5\",\"jcip-explicit-locks/reentrantlock/step-6\",\"jcip-explicit-locks/reentrantlock/step-7\",\"jcip-explicit-locks/reentrantlock/step-8\"],\"exercises\":[\"jcip-explicit-locks/reentrantlock/step-2\",\"jcip-explicit-locks/reentrantlock/step-4\",\"jcip-explicit-locks/reentrantlock/step-5\",\"jcip-explicit-locks/reentrantlock/step-6\",\"jcip-explicit-locks/reentrantlock/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-explicit-locks/reentrantlock/step-1\",\"title\":\"An explicit lock\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-explicit-locks/reentrantlock/step-2\",\"prompt\":\"\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e was forgotten. What happens if \u003ccode\u003eupdateState()\u003c/code\u003e throws?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThis is why explicit locks are more dangerous — a bug that\u0026#39;s easy to miss in review.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAn \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eintrinsic lock\u003c/button\u003e is released automatically when execution leaves the \u003ccode\u003esynchronized\u003c/code\u003e block, however it leaves.\u003c/p\u003e\\n\u003cp\u003eAn explicit \u003ccode\u003eLock\u003c/code\u003e is released only when \u003ccode\u003eunlock()\u003c/code\u003e is called. If an exception skips that call, the lock stays held forever, and every thread that later needs it blocks.\u003c/p\u003e\\n\u003cp\u003eThe program doesn\u0026#39;t crash; it hangs, often far from the cause. Always put \u003ccode\u003eunlock()\u003c/code\u003e in a \u003ccode\u003efinally\u003c/code\u003e block.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003elock.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003elock\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e();\u003c/span\u003e\u003c/span\u003e\\n\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eupdateState\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e();\u003c/span\u003e\u003c/span\u003e\\n\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003elock.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eunlock\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e();\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\",\"options\":[{\"html\":\"The JVM releases it automatically, as with synchronized\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the safety net \u003ccode\u003esynchronized\u003c/code\u003e gives you and \u003ccode\u003eLock\u003c/code\u003e doesn\u0026#39;t.\u003c/p\u003e\\n\"},{\"html\":\"The lock is never released — every later thread that needs it blocks forever\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-explicit-locks/reentrantlock/step-3\",\"title\":\"Ways to acquire\",\"body\":\"\u003cp\u003e\u003ccode\u003elock()\u003c/code\u003e waits as long as it takes.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"tryLock\\\" data-def=\\\"Acquire the lock only if it\u0026amp;#39;s free (optionally waiting up to a timeout); otherwise return \u0026lt;code\u0026gt;false\u0026lt;/code\u0026gt; so you can back off.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003etryLock()\u003c/code\u003e\u003c/button\u003e gives up at once if the lock is taken.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003etryLock(timeout)\u003c/code\u003e waits up to a limit.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003elockInterruptibly()\u003c/code\u003e can be interrupted while waiting.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-4\",\"key\":\"jcip-explicit-locks/reentrantlock/step-4\",\"prompt\":\"\u003cp\u003eMatch each acquisition method to its behaviour.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003elock()\u003c/code\u003e\",\"\u003ccode\u003etryLock()\u003c/code\u003e\",\"\u003ccode\u003etryLock(timeout, unit)\u003c/code\u003e\",\"\u003ccode\u003elockInterruptibly()\u003c/code\u003e\"],\"right\":[\"Wait as long as it takes, ignoring interrupts\",\"Take the lock if it\u0026#39;s free right now; otherwise return false at once\",\"Wait up to a time limit, then give up\",\"Wait, but stop with \u003ccode\u003eInterruptedException\u003c/code\u003e if interrupted\"],\"rightOrder\":[0,3,1,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"tryLock\\\" data-def=\\\"Acquire the lock only if it\u0026amp;#39;s free (optionally waiting up to a timeout); otherwise return \u0026lt;code\u0026gt;false\u0026lt;/code\u0026gt; so you can back off.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003etryLock\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"jcip-explicit-locks/reentrantlock/step-5\",\"prompt\":\"\u003cp\u003eAlways release in finally.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"lock.lock();\\ntry {\\n    balance -= amount;\\n} \"},{\"answers\":[\"finally\"],\"size\":7,\"choices\":[\"shutdown\",\"finally\",\"unlock\",\"readLock\"]},{\"text\":\" {\\n    lock.\"},{\"answers\":[\"unlock\"],\"size\":6,\"choices\":[\"list\",\"finally\",\"readLock\",\"unlock\"]},{\"text\":\"();\\n}\\n\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-6\",\"key\":\"jcip-explicit-locks/reentrantlock/step-6\",\"prompt\":\"\u003cp\u003eA task should give up if it can\u0026#39;t send a message within its time budget. Which method fits?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003elock()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt could wait indefinitely and blow the budget.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etryLock(timeLeft, NANOSECONDS)\u003c/code\u003e — and report failure if it returns false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-7\",\"key\":\"jcip-explicit-locks/reentrantlock/step-7\",\"title\":\"Locks across scopes\",\"body\":\"\u003cp\u003e\u003ccode\u003esynchronized\u003c/code\u003e must release in the same block.\u003c/p\u003e\\n\u003cp\u003eAn explicit lock can be released elsewhere.\u003c/p\u003e\\n\u003cp\u003eThat allows hand-over-hand locking along a list.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-8\",\"key\":\"jcip-explicit-locks/reentrantlock/step-8\",\"prompt\":\"\u003cp\u003eWhy might you need hand-over-hand (\u0026quot;chained\u0026quot;) locking, as when traversing a linked list?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eExplicit locks can be acquired and released in different scopes, which enables patterns like this.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"To make locks reentrant\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"To lock the next node before releasing the current one — impossible with block-structured synchronized\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Explicit locks\",\"next\":{\"id\":\"choosing-a-lock\",\"courseId\":\"jcip-explicit-locks\",\"topicId\":\"jcip\",\"key\":\"jcip-explicit-locks/choosing-a-lock\",\"title\":\"Fairness, and synchronized vs ReentrantLock\",\"summary\":\"Fair locks cost throughput; ReentrantLock is for when you need its extra features — otherwise use synchron
