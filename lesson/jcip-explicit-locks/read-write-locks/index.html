ite lock, then releasing the write lock — is allowed.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIf two threads each hold the read lock and both try to upgrade, each waits for the other to release its read lock before the write lock can be granted.\u003c/p\u003e\\n\u003cp\u003eNeither will, so they deadlock.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eReentrantReadWriteLock\u003c/code\u003e therefore doesn\u0026#39;t allow upgrading: release the read lock, acquire the write lock, and re-check the state, since it may have changed in between.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, call \u003ccode\u003ewriteLock().lock()\u003c/code\u003e while holding the read lock\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat deadlocks — the writer waits for all readers to leave, including itself.\u003c/p\u003e\\n\"},{\"html\":\"No — upgrading would deadlock if two readers tried it at once; release the read lock and acquire the write lock instead\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"jcip-explicit-locks/read-write-locks/step-6\",\"prompt\":\"\u003cp\u003eGet the shared lock.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Lock r = rwl.\"},{\"answers\":[\"readLock\"],\"size\":8,\"choices\":[\"readLock\",\"finally\",\"unlock\",\"true\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Expli
