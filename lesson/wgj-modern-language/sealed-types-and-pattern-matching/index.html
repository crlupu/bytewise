ded case first.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile — two cases for \u003ccode\u003eInteger\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first is guarded by \u003ccode\u003ewhen\u003c/code\u003e, so the second still matters.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"wgj-modern-language/sealed-types-and-pattern-matching/step-4\",\"title\":\"Exhaustive switches\",\"body\":\"\u003cp\u003eSwitching over a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sealed type\\\" data-def=\\\"A class or interface that lists its permitted subtypes with \u0026lt;code\u0026gt;permits\u0026lt;/code\u0026gt;, so the compiler knows all of them.\\\" data-book=\\\"The Well-Grounded Java Developer\\\"\u003esealed type\u003c/button\u003e, the compiler knows every case.\u003c/p\u003e\\n\u003cp\u003eCover them all and no \u003ccode\u003edefault\u003c/code\u003e is needed.\u003c/p\u003e\\n\u003cp\u003eAdd a new subtype and every incomplete switch fails to compile.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"wgj-modern-language/sealed-types-and-pattern-matching/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eShape\u003c/code\u003e is sealed with \u003ccode\u003eCircle\u003c/code\u003e and \u003ccode\u003eSquare\u003c/code\u003e. A switch handles both and has no \u003ccode\u003edefault\u003c/code\u003e. Someone adds \u003ccode\u003eTriangle\u003c/code\u003e to the \u003ccode\u003epermits\u003c/code\u003e list. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThis is the compiler-checked alternative to the visitor pattern.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWithout a \u003ccode\u003edefault\u003c/code\u003e, the compiler checks that the switch covers every permitted subtype of the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sealed type\\\" data-def=\\\"A class or interface that lists its permitted subtypes with \u0026lt;code\u0026gt;permits\u0026lt;/code\u0026gt;, so the compiler knows all of them.\\\" data-book=\\\"The Well-Grounded Java Developer\\\"\u003esealed interface\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eAdding \u003ccode\u003eTriangle\u003c/code\u003e to \u003ccode\u003epermits\u003c/code\u003e makes every such switch incomplete, so they fail to compile until a \u003ccode\u003ecase Triangle\u003c/code\u003e is added.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s the safety a \u003ccode\u003edefault\u003c/code\u003e branch would throw away — it would silently send triangles to whatever the default does.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The switch stops compiling until \u003ccode\u003eTriangle\u003c/code\u003e is handled\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It compiles; triangles fall through to an exception at run time\",\"correct\":false,\"feedback\":\"\u003cp\u003eExhaustiveness is checked at compile time — that\u0026#39;s the main benefit.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"wgj-modern-language/sealed-types-and-pattern-matching/step-6\",\"prompt\":\"\u003cp\u003eTest and bind in one step.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"if (o \"},{\"answers\":[\"instanceof\"],\"size\":10,\"choices\":[\"MaxRAMPercentage\",\"yield\",\"Point\",\"instanceof\"]},{\"text\":\" String s \u0026\u0026 s.length() \u003e 2) print(s.toUpperCase());\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Modern Java, the language\",\"next\":{\"id\":\"switch-expressions-and-text-blocks\",\"courseId\":\"wgj-modern-language\",\"topicId\":\"well-grounded\",\"key\":\"
