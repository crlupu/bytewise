,\"262\",\"static/chunks/262-9c3921e7fb3ba996.js\",\"390\",\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"circuit-breakers-and-bulkheads\",\"courseId\":\"stability-patterns\",\"topicId\":\"architecture\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads\",\"title\":\"Circuit breakers and bulkheads\",\"summary\":\"Timeouts, circuit breakers, bulkheads and backoff — combining them so one failure stays one failure.\",\"duration\":9,\"tags\":[\"architecture\",\"resilience\",\"circuit breaker\",\"bulkhead\",\"timeouts\",\"retries\",\"backoff\",\"stability patterns\"],\"sources\":[{\"book\":\"release-it\",\"ref\":\"Chapter 5, Stability Patterns\"}],\"requires\":[\"stability-patterns/cascading-failures\"],\"steps\":7,\"stepKeys\":[\"stability-patterns/circuit-breakers-and-bulkheads/step-1\",\"stability-patterns/circuit-breakers-and-bulkheads/step-2\",\"stability-patterns/circuit-breakers-and-bulkheads/step-3\",\"stability-patterns/circuit-breakers-and-bulkheads/step-4\",\"stability-patterns/circuit-breakers-and-bulkheads/step-5\",\"stability-patterns/circuit-breakers-and-bulkheads/step-6\",\"stability-patterns/circuit-breakers-and-bulkheads/step-7\"],\"exercises\":[\"stability-patterns/circuit-breakers-and-bulkheads/step-2\",\"stability-patterns/circuit-breakers-and-bulkheads/step-3\",\"stability-patterns/circuit-breakers-and-bulkheads/step-5\",\"stability-patterns/circuit-breakers-and-bulkheads/step-6\",\"stability-patterns/circuit-breakers-and-bulkheads/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads/step-1\",\"title\":\"Circuit breakers\",\"body\":\"\u003cp\u003eClosed: calls pass through.\u003c/p\u003e\\n\u003cp\u003eToo many failures, and it opens.\u003c/p\u003e\\n\u003cp\u003eOpen: calls fail immediately.\u003c/p\u003e\\n\u003cp\u003eHalf-open: one trial call decides whether to close.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads/step-2\",\"prompt\":\"\u003cp\u003ePut a breaker\u0026#39;s life through an outage in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFailing fast protects your threads; sending no traffic gives the dependency room to recover.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Closed — calls succeed normally\",\"Failures cross the threshold; the breaker opens\",\"Open — callers fail fast; the dependency gets no traffic\",\"The cool-down ends; the breaker goes half-open and lets a trial call through\",\"The trial call succeeds; the breaker closes again\"],\"start\":[3,0,1,2,4],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fail fast\\\" data-def=\\\"Rejecting a request right away when it can\u0026amp;#39;t succeed, rather than tying up resources waiting.\\\" data-book=\\\"Release It!\\\"\u003eFail fast\u003c/button\u003e\"]},{\"id\":\"step-3\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads/step-3\",\"prompt\":\"\u003cp\u003eWhat should callers do when the breaker is open?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAn open breaker is a design decision about \u003cstrong\u003edegraded behaviour\u003c/strong\u003e, not just an error.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Return a fallback — cached data, a default, or a clear \u0026quot;unavailable\u0026quot; — quickly\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Wait for it to close before answering\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen threads block again — the problem the breaker solves.\u003c/p\u003e\\n\"},{\"html\":\"Keep retrying until it closes\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the load the breaker exists to stop.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads/step-4\",\"title\":\"Bulkheads and backoff\",\"body\":\"\u003cp\u003eGive each dependency its own thread or connection pool.\u003c/p\u003e\\n\u003cp\u003eThen one failure stays contained.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Retry\\\" data-def=\\\"Trying a failed call again. Needs limits and backoff, or retries multiply the load on a struggling system.\\\" data-book=\\\"Release It!\\\"\u003eRetry\u003c/button\u003e only \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Idempotent\\\" data-def=\\\"Doing it twice has the same effect as doing it once — what makes retries safe.\\\"\u003eidempotent\u003c/button\u003e calls.\u003c/p\u003e\\n\u003cp\u003eBack off exponentially, with random jitter.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads/step-5\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eCheckout calls a recommendations service, which has started hanging.\u003c/strong\u003e Configure the call so that the outage\\nspreads no further than \u003cstrong\u003e2\u003c/strong\u003e, the struggling service sees load of at most \u003cstrong\u003e3\u003c/strong\u003e, and complexity stays at \u003cstrong\u003e7\u003c/strong\u003e or under.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eShort timeout + breaker + \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bulkhead\\\" data-def=\\\"Partitioning resources — thread pools, connections, servers — so a failure in one part can\u0026amp;#39;t sink the whole ship.\\\" data-book=\\\"Release It!\\\"\u003ebulkhead\u003c/button\u003e, with no retries or careful ones. Each pattern covers a gap the others\\nleave — which is why Nygard presents them together.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eSpread needs a short timeout \u003cem\u003eand\u003c/em\u003e isolation.\u003c/p\u003e\\n\",\"\u003cp\u003eLoad needs something that stops calls reaching the failing service.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"tradeoff\",\"config\":{\"metrics\":[{\"id\":\"spread\",\"label\":\"Outage spread\",\"start\":9,\"better\":\"lower\"},{\"id\":\"load\",\"label\":\"Load on failing service\",\"start\":5,\"better\":\"lower\"},{\"id\":\"recovery\",\"label\":\"Time to recover\",\"start\":8,\"better\":\"lower\"},{\"id\":\"complexity\",\"label\":\"Complexity\",\"start\":1,\"better\":\"lower\"}],\"decisions\":[{\"id\":\"timeout\",\"label\":\"Timeout\",\"options\":[{\"id\":\"none\",\"label\":\"None\",\"consequence\":\"Threads wait as long as the dependency does. The pool drains in seconds.\"},{\"id\":\"long\",\"label\":\"30 seconds\",\"effects\":{\"spread\":-1,\"recovery\":-1,\"complexity\":1},\"consequence\":\"Threads come back eventually — but 30 s per call still drains a busy pool.\"},{\"id\":\"short\",\"label\":\"2 seconds\",\"effects\":{\"spread\":-4,\"recovery\":-2,\"complexity\":1},\"consequence\":\"A hung call costs at most 2 s of a thread. Callers see a quick error instead of a hang.\"}]},{\"id\":\"breaker\",\"label\":\"Circuit breaker\",\"options\":[{\"id\":\"none\",\"label\":\"None\",\"consequence\":\"Every request still tries the broken service and waits out the timeout.\"},{\"id\":\"breaker\",\"label\":\"Breaker with fallback\",\"effects\":{\"spread\":-2,\"load\":-3,\"recovery\":-3,\"complexity\":2},\"consequence\":\"After a few failures, calls fail fast with a fallback, and the service gets breathing room.\"}]},{\"id\":\"bulkhead\",\"label\":\"Thread pools\",\"options\":[{\"id\":\"shared\",\"label\":\"One shared pool\",\"consequence\":\"A hang in recommendations can starve checkout's own work.\"},{\"id\":\"separate\",\"label\":\"A pool per dependency\",\"effects\":{\"spread\":-3,\"complexity\":2},\"consequence\":\"Recommendations can only exhaust its own pool; checkout carries on.\"}]},{\"id\":\"retries\",\"label\":\"Retries\",\"options\":[{\"id\":\"none\",\"label\":\"No retries\",\"consequence\":\"Simple. A transient blip shows up as an error.\"},{\"id\":\"immediate\",\"label\":\"3 immediate retries\",\"effects\":{\"load\":4,\"recovery\":2,\"complexity\":1},\"consequence\":\"Every failing call becomes four. The struggling service gets hammered — a retry storm.\"},{\"id\":\"backoff\",\"label\":\"3 retries, backoff + jitter\",\"effects\":{\"load\":1,\"recovery\":-1,\"complexity\":1},\"consequence\":\"Transient errors are absorbed, spaced out so retries don't arrive in waves.\"}]}]},\"goal\":{\"require\":[{\"metric\":\"spread\",\"max\":2},{\"metric\":\"load\",\"max\":3},{\"metric\":\"complexity\",\"max\":7}]},\"question\":{\"prompt\":\"\u003cp\u003eWhy are 3 immediate retries a bad idea here?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"They make each timeout longer\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe timeout doesn\u0026#39;t change; the number of calls does.\u003c/p\u003e\\n\"},{\"html\":\"Every failing call becomes four, hammering a service that\u0026#39;s already struggling\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They\u0026#39;re harder to write than retries with backoff\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth cost about the same to write. The difference is the load they create.\u003c/p\u003e\\n\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003eTimeout\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads/step-6\",\"prompt\":\"\u003cp\u003eMatch each pattern to the failure it contains.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Timeout\",\"Circuit breaker\",\"Bulkhead\",\"Backoff with jitter\"],\"right\":[\"A call that never returns holding a thread forever\",\"Repeatedly calling a dependency that is known to be down\",\"One dependency\u0026#39;s failure exhausting resources everyone shares\",\"Synchronized retries arriving in waves\"],\"rightOrder\":[2,1,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003eTimeout\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Circuit breaker\\\" data-def=\\\"Wraps calls to another system. After too many failures it \u0026amp;quot;opens\u0026amp;quot; and fails fast without calling, then periodically lets a trial call through.\\\" data-book=\\\"Release It!\\\"\u003eCircuit breaker\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bulkhead\\\" data-def=\\\"Partitioning resources — thread pools, connections, servers — so a failure in one part can\u0026amp;#39;t sink the whole ship.\\\" data-book=\\\"Release It!\\\"\u003eBulkhead\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"stability-patterns/circuit-breakers-and-bulkheads/step-7\",\"prompt\":\"\u003cp\u003eWhich calls are safe to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Retry\\\" data-def=\\\"Trying a failed call again. Needs limits and backoff, or retries multiply the load on a struggling system.\\\" data-book=\\\"Release It!\\\"\u003eretry\u003c/button\u003e automatically?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFor non-idempotent operations, use an idempotency key so the server can recognise a repeat.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003etimeout\u003c/button\u003e doesn\u0026#39;t tell you whether the operation happened — the request may have reached the server and succeeded, with only the response lost.\u003c/p\u003e\\n\u003cp\u003eRetrying an idempotent operation, like a read or \u0026quot;set price to 10\u0026quot;, is harmless, since doing it twice has the same effect as once.\u003c/p\u003e\\n\u003cp\u003eRetrying \u0026quot;charge the card\u0026quot; or \u0026quot;add 10\u0026quot; could do it twice; an idempotency key lets the server recognise and ignore the duplicate.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Idempotent ones — repeating them has the same effect as doing them once, like a GET or a PUT of a full value\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Only calls that returned 200\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Any call that timed out\",\"correct\":false,\"feedback\":\"\u003cp\u003eA timed-out \u0026quot;charge the card\u0026quot; may have succeeded. Retrying could charge twice.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Idempotent\\\" data-def=\\\"Doing it twice has the same effect as doing it once — what makes retries safe.\\\"\u003eIdempotent\u003c/button\u003e\"]}]},\"courseTitle\":\"
