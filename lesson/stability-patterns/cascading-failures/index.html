ase It!\\\"\u003eintegration point\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eA dead dependency \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fail fast\\\" data-def=\\\"Rejecting a request right away when it can\u0026amp;#39;t succeed, rather than tying up resources waiting.\\\" data-book=\\\"Release It!\\\"\u003efails fast\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eA slow one holds your threads while you wait.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"stability-patterns/cascading-failures/step-2\",\"prompt\":\"\u003cp\u003eYour service handles requests on a pool of \u003cstrong\u003e200\u003c/strong\u003e threads. A dependency starts hanging — no response, no error —\\nand your code has no \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003etimeout\u003c/button\u003e. \u003cstrong\u003e20\u003c/strong\u003e requests per second need that dependency. About how many seconds until every\\nthread is stuck?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e200 ÷ 20 = 10 seconds. After that, your service can\u0026#39;t answer \u003cem\u003eanything\u003c/em\u003e — even requests that never touch the\\nbroken dependency. Your callers then start waiting on you.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach request that calls the hanging dependency holds a thread forever, because without a timeout it never returns.\u003c/p\u003e\\n\u003cp\u003eAt 20 such requests per second, the 200 threads are used up in 200 / 20 = 10 seconds.\u003c/p\u003e\\n\u003cp\u003eAfter that, every new request waits for a thread that never frees up — including requests that don\u0026#39;t use the broken dependency at all.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e he crack spreads up.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"A downstream dependency becomes slow\",\"Your threads block waiting on it, without a timeout\",\"Your thread pool is exhausted; you stop responding to everything\",\"Your callers\u0026#39; threads block waiting on you\",\"The failure spreads up through every layer that calls you\"],\"start\":[2,4,3,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003eTimeout\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"stability-patterns/cascading-failures/step-5\",\"prompt\":\"\u003cp\u003eMatch each antipattern to its description.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Integration point\",\"Blocked threads\",\"Cascading failure\",\"Unbounded result set\"],\"right\":[\"Any call out to another system — each one a way to fail\",\"Threads stuck waiting on a resource that never answers\",\"A failure in one layer causing failures in the layers that call it\",\"A query that returns far more rows than expected and exhausts memory\"],\"rightOrder\":[0,3,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Integration point\\\" data-def=\\\"Any call to another system — a database, an API, a cache. Release It! calls them the number-one killer of systems.\\\" data-book=\\\"Release It!\\\"\u003eIntegration point\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cascading failure\\\" data-def=\\\"A failure in one system spreading to its callers, often because their th
