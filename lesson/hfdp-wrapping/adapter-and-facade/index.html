gives a complex subsystem one simple interface.\",\"duration\":6,\"tags\":[\"design patterns\",\"head first\",\"adapter\",\"facade\",\"least knowledge\",\"structural\"],\"sources\":[{\"book\":\"head-first-design-patterns\",\"ref\":\"Chapter 7, The Adapter and Facade Patterns\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"hfdp-wrapping/adapter-and-facade/step-1\",\"hfdp-wrapping/adapter-and-facade/step-2\",\"hfdp-wrapping/adapter-and-facade/step-3\",\"hfdp-wrapping/adapter-and-facade/step-4\",\"hfdp-wrapping/adapter-and-facade/step-5\",\"hfdp-wrapping/adapter-and-facade/step-6\",\"hfdp-wrapping/adapter-and-facade/step-7\"],\"exercises\":[\"hfdp-wrapping/adapter-and-facade/step-2\",\"hfdp-wrapping/adapter-and-facade/step-4\",\"hfdp-wrapping/adapter-and-facade/step-6\",\"hfdp-wrapping/adapter-and-facade/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"hfdp-wrapping/adapter-and-facade/step-1\",\"title\":\"Adapter converts\",\"body\":\"\u003cp\u003eYour code expects a \u003ccode\u003eDuck\u003c/code\u003e, but you have a \u003ccode\u003eTurkey\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eTurkeyAdapter implements Duck\u003c/code\u003e and holds a turkey.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003equack()\u003c/code\u003e calls \u003ccode\u003egobble()\u003c/code\u003e; \u003ccode\u003efly()\u003c/code\u003e calls \u003ccode\u003efly()\u003c/code\u003e a few times.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"hfdp-wrapping/adapter-and-facade/step-2\",\"prompt\":\"\u003cp\u003eAdapt a turkey to the duck interface.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"public void quack() { turkey.\"},{\"answers\":[\"gobble\"],\"size\":6,\"choices\":[\"enum\",\"undo\",\"gobble\",\"flyBehavior\"]},{\"text\":\"(); }\"}],\"code\":true,\"caseSensitive\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"hfdp-wrapping/adapter-and-facade/step-3\",\"title\":\"Facade simplifies\",\"body\":\"\u003cp\u003eWatching a movie takes the projector, amplifier, player, lights and screen.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eHomeTheaterFacade.watchMovie()\u003c/code\u003e drives them all in the right order.\u003c/p\u003e\\n\u003cp\u003eThe parts stay available for anyone who needs them.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-4\",\"key\":\"hfdp-wrapping/adapter-and-facade/step-4\",\"prompt\":\"\u003cp\u003eMatch each pattern with its intent.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Adapter\",\"Facade\",\"Decorator\"],\"right\":[\"Convert an interface into the one a client expects\",\"Give a subsystem one simpler interface\",\"Add behaviour without changing the interface\"],\"rightOrder\":[2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Facade\\\" data-def=\\\"A class that offers one simple interface to a complicated subsystem, while leaving the subsystem usable directly.\\\" data-book=\\\"Head First Design Patterns\\\"\u003eFacade\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eDecorator\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"hfdp-wrapping/adapter-and-facade/step-5\",\"title\":\"Principle of Least Knowledge\",\"body\":\"\u003cp\u003eTalk only to your immediate friends.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ea.getB().getC().doIt()\u003c/code\u003e reaches through strangers.\u003c/p\u003e\\n\u003cp\u003eAsk \u003ccode\u003ea\u003c/code\u003e to do it instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"hfdp-wrapping/adapter-and-facade/step-6\",\"prompt\":\"\u003cp\u003eWhich call follows the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Principle of Least Knowledge\\\" data-def=\\\"Talk only to your immediate friends — avoid long chains like \u0026lt;code\u0026gt;a.getB().getC().doIt()\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Head First Design Patterns\\\"\u003ePrinciple of Least Knowledge\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eorder.getCustomer().getAddress().getCountry().getShippingRate()\u003c/code\u003e makes your code depend on four classes and how they\u0026#39;re connected.\u003c/p\u003e\\n\u003cp\u003eChange how addresses are stored, and this line breaks.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eorder.shippingCost()\u003c/code\u003e asks the object you have for what you need and lets it navigate its own structure. That\u0026#39;s the Principle of Least Knowledge, also known as the Law of Demeter.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eorder.getCustomer().getAddress().getCountry().getShippingRate()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt depends on four classes\u0026#39; structure; a change to any breaks it.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eorder.shippingCost()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"hfdp-wrapping/adapter-and-facade/step-7\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eArrays.asList(array)\u003c/code\u003e lets array data be used where a \u003ccode\u003eList\u003c/code\u003e is expected. Which pattern is that?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Adapter\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Facade\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt doesn\u0026#39;t simplify a subsystem; it converts one interface to another.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Facade\\\" data-def=\\\"A class that offers one simple interface to a complicated subsystem, while leaving the subsystem usable directly.\\\" data-book=\\\"Head First Design Patterns\\\"\u003eFacade\u003c/button\u003e\"]}]},\"courseTitle\":\"Command, Adapter and Facade\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approach\",\"authors\":\"James F. Kurose \u0026 Keith W. Ross\",\"editi
