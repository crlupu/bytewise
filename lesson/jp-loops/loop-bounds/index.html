"id\":\"step-1\",\"key\":\"jp-loops/loop-bounds/step-1\",\"title\":\"Comparing byte with int\",\"body\":\"\u003cp\u003e\u003ccode\u003eb == 0x90\u003c/code\u003e compares a \u003ccode\u003ebyte\u003c/code\u003e with the \u003ccode\u003eint\u003c/code\u003e 144.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003ebyte\u003c/code\u003e only goes from -128 to 127.\u003c/p\u003e\\n\u003cp\u003eThe \u003ccode\u003ebyte\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Widening conversion\\\" data-def=\\\"Converting to a type with more bits, like \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; to \u0026lt;code\u0026gt;long\u0026lt;/code\u0026gt;. The value is kept; integers are sign- or zero-extended.\\\" data-book=\\\"Java Puzzlers\\\"\u003ewidened\u003c/button\u003e with its sign, so the test is never true.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-loops/loop-bounds/step-2\",\"prompt\":\"\u003cp\u003eHow many times does this print \u003ccode\u003eJoy!\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCompare like with like: \u003ccode\u003eb == (byte) 0x90\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003e0x90\u003c/code\u003e is the \u003ccode\u003eint\u003c/code\u003e 144. Comparing it with a \u003ccode\u003ebyte\u003c/code\u003e promotes the \u003ccode\u003ebyte\u003c/code\u003e to \u003ccode\u003eint\u003c/code\u003e with \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sign extension\\\" data-def=\\\"Widening a signed number by copying its top (sign) bit into the new bits, so negative numbers stay negative. \u0026lt;code\u0026gt;(long) -1\u0026lt;/code\u0026gt; is all ones.\\\" data-book=\\\"Java Puzzlers\\\"\u003esign extension\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003ebyte\u003c/code\u003e ranges from -128 to 127, so no \u003ccode\u003ebyte\u003c/code\u003e ever equals 144; the byte with bits \u003ccode\u003e0x90\u003c/code\u003e is -112.\u003c/p\u003e\\n\u003cp\u003eThe comparison is always false, and the loop prints nothing.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Never\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eComparing a \u003ccode\u003ebyte\u003c/code\u003e with an \u003ccode\u003eint\u003c/code\u003e is legal; the \u003ccode\u003ebyte\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Widening conversion\\\" data-def=\\\"Converting to a type with more bits, like \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; to \u0026lt;code\u0026gt;long\u0026lt;/code\u0026gt;. The value is kept; integers are sign- or zero-extended.\\\" data-book=\\\"Java Puzzlers\\\"\u003ewidened\u003c/button\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Once\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e0x90\u003c/code\u003e is the \u003ccode\u003eint\u003c/code\u003e 144. No \u003ccode\u003ebyte\u003c/code\u003e equals 144; the \u003ccode\u003ebyte\u003c/code\u003e with those bits is -112.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jp-loops/loop-bounds/step-3\",\"title\":\"i \u003c= MAX_VALUE is always true\",\"body\":\"\u003cp\u003eEvery \u003ccode\u003eint\u003c/code\u003e is less than or equal to \u003ccode\u003eInteger.MAX_VALUE\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWhen \u003ccode\u003ei\u003c/code\u003e reaches it, \u003ccode\u003ei++\u003c/code\u003e wraps to \u003ccode\u003eMIN_VALUE\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eSo a loop up to and including \u003ccode\u003eMAX_VALUE\u003c/code\u003e never ends.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jp-loops/loop-bounds/step-4\",\"prompt\":\"\u003cp\u003eWhat does this do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse a \u003ccode\u003elong\u003c/code\u003e loop variable, or test with \u003ccode\u003e\u0026lt;\u003c/code\u003e and handle the last value separately.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ei \u0026lt;= Integer.MAX_VALUE\u003c/code\u003e is true for every \u003ccode\u003eint\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWhen \u003ccode\u003ei\u003c/code\u003e reaches \u003ccode\u003eMAX_VALUE\u003c/code\u003e and the body runs, \u003ccode\u003ei++\u003c/code\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overflow\\\" data-def=\\\"A result too big for its type. Java\u0026amp;#39;s integer arithmetic wraps around silently, so \u0026lt;code\u0026gt;Integer.MAX_VALUE + 1\u0026lt;/code\u0026gt; is \u0026lt;code\u0026gt;Integer.MIN_VALUE\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Puzzlers\\\"\u003eoverflows\u003c/button\u003e to \u003ccode\u003eInteger.MIN_VALUE\u003c/code\u003e, which is still less than \u003ccode\u003eMAX_VALUE\u003c/code\u003e, so the loop continues forever.\u003c/p\u003e\\n\u003cp\u003eUse a \u003ccode\u003elong\u003c/code\u003e loop variable, or test \u003ccode\u003ei \u0026lt; MAX_VALUE\u003c/code\u003e and handle the last value after the loop.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Loops forever\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Prints \u003ccode\u003e101\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ei \u0026lt;= Integer.MAX_VALUE\u003c/code\u003e can never be false.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jp-loops/loop-bounds/step-5\",\"title\":\"Shift distances are masked\",\"body\":\"\u003cp\u003eFor an \u003ccode\u003eint\u003c/code\u003e, only the low five bits of the shift distance count.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003ex \u0026lt;\u0026lt; 32\u003c/code\u003e is \u003ccode\u003ex \u0026lt;\u0026lt; 0\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA loop waiting for \u003ccode\u003e-1 \u0026lt;\u0026lt; i\u003c/code\u003e to reach zero never ends.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jp-loops/loop-bounds/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFor a \u003ccode\u003elong\u003c/code\u003e, the low six bits count, so \u003ccode\u003e1L \u0026lt;\u0026lt; 64\u003c/code\u003e is \u003ccode\u003e1L\u003c/code\u003e too.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eFor \u003ccode\u003eint\u003c/code\u003e shifts, Java uses only the low five bits of the shift distance, so the distance is taken modulo 32.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e-1 \u0026lt;\u0026lt; 32\u003c/code\u003e is therefore \u003ccode\u003e-1 \u0026lt;\u0026lt; 0\u003c/code\u003e, which is -1.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why a loop that keeps shifting until the value becomes 0 can run forever: at a distance of 32 it starts over.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003eSystem.out.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eprintln\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e(\u003c/span\u003e\u003cspan style=
