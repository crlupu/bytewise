ual to anything, not even itself.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-loops/looper-values/step-2\",\"prompt\":\"\u003cp\u003eMatch each loop condition with a declaration of \u003ccode\u003ei\u003c/code\u003e that makes it loop forever.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFor the last one, \u003ccode\u003ei + 0\u003c/code\u003e is string concatenation: \u003ccode\u003e\u0026quot;\u0026quot; + 0\u003c/code\u003e is \u003ccode\u003e\u0026quot;0\u0026quot;\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003ewhile (i == i + 1)\u003c/code\u003e\",\"\u003ccode\u003ewhile (i != i)\u003c/code\u003e\",\"\u003ccode\u003ewhile (i != i + 0)\u003c/code\u003e\"],\"right\":[\"\u003ccode\u003edouble i = Double.POSITIVE_INFINITY;\u003c/code\u003e\",\"\u003ccode\u003edouble i = Double.NaN;\u003c/code\u003e\",\"\u003ccode\u003eString i = \u0026quot;\u0026quot;;\u003c/code\u003e\"],\"rightOrder\":[2,0,1]},{\"id\":\"step-3\",\"key\":\"jp-loops/looper-values/step-3\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA \u003ccode\u003edouble\u003c/code\u003e has 53 bits of precision. Around 10^16, that\u0026#39;s not enough to represent every integer: adjacent doubles are 2 apart.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ebig + 1\u003c/code\u003e lies exactly halfway between two representable values, and rounds to \u003ccode\u003ebig\u003c/code\u003e itself.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003ebig == big + 1\u003c/code\u003e is true, and a loop like \u003ccode\u003ewhile (i != i + 1)\u003c/code\u003e would end immediately for such values — or never, if the condition is flipped.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"false\",\"correct\":false,\"feedback\":\"\u003cp\u003eAt 10^16, neighbouring doubles are 2 apart. \u003ccode\u003ebig + 1\u003c/code\u003e rounds back to \u003ccode\u003ebig\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"true\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jp-loops/looper-values/step-4\",\"title\":\"Two's complement isn't symmetric\",\"body\":\"\u003cp\u003eThere\u0026#39;s one more negative \u003ccode\u003eint\u003c/code\u003e than positive.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e-Integer.MIN_VALUE\u003c/code\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overflow\\\" data-def=\\\"A result too big for its type. Java\u0026amp;#39;s integer arithmetic wraps around silently, so \u0026lt;code\u0026gt;Integer.MAX_VALUE + 1\u0026lt;/code\u0026gt; is \u0026lt;code\u0026gt;Integer.MIN_VALUE\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Puzzlers\\\"\u003eoverflows\u003c/button\u003e back to \u003ccode\u003eMIN_VALUE\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003eMath.abs(Integer.MIN_VALUE)\u003c/code\u003e is negative.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jp-loops/looper-values/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003eSystem.out.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u
