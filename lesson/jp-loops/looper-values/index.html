quot;0\u0026quot;\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003ewhile (i == i + 1)\u003c/code\u003e\",\"\u003ccode\u003ewhile (i != i)\u003c/code\u003e\",\"\u003ccode\u003ewhile (i != i + 0)\u003c/code\u003e\"],\"right\":[\"\u003ccode\u003edouble i = Double.POSITIVE_INFINITY;\u003c/code\u003e\",\"\u003ccode\u003edouble i = Double.NaN;\u003c/code\u003e\",\"\u003ccode\u003eString i = \u0026quot;\u0026quot;;\u003c/code\u003e\"],\"rightOrder\":[2,0,1]},{\"id\":\"step-3\",\"key\":\"jp-loops/looper-values/step-3\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA \u003ccode\u003edouble\u003c/code\u003e has 53 bits of precision. Around 10^16, that\u0026#39;s not enough to represent every integer: adjacent doubles are 2 apart.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ebig + 1\u003c/code\u003e lies exactly halfway between two representable values, and rounds to \u003ccode\u003ebig\u003c/code\u003e itself.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003ebig == big + 1\u003c/code\u003e is true, and a loop like \u003ccode\u003ewhile (i != i + 1)\u003c/code\u003e would end immediately for such values — or never, if the condition is flipped.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"false\",\"correct\":false,\"feedback\":\"\u003cp\u003eAt 10^16, neighbouring doubles are 2 apart. \u003ccode\u003ebig + 1\u003c/code\u003e rounds back to \u003ccode\u003ebig\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"true\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jp-loops/looper-values/step-4\",\"title\":\"Two's complement isn't symmetric\",\"body\":\"\u003cp\u003eThere\u0026#39;s one more negative \u003ccode\u003eint\u003c/code\u003e than positive.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e-Integer.MIN_VALUE\u003c/code\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overflow\\\" data-def=\\\"A result too big for its type. Java\u0026amp;#39;s integer arithmetic wraps around silently, so \u0026lt;code\u0026gt;Integer.MAX_VALUE + 1\u0026lt;/code\u0026gt; is \u0026lt;code\u0026gt;Integer.MIN_VALUE\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Puzzlers\\\"\u003eoverflows\u003c/button\u003e back to \u003ccode\u003eMIN_VALUE\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003eMath.abs(Integer.MIN_VALUE)\u003c/code\u003e is negative.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jp-loops/looper-values/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003eSystem.out.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eprintln\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e(Math.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eabs\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e(Integer.MIN_VALUE));\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It throws\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eMath.abs\u003c/code\u003e doesn\u0026#39;t check; \u003ccode\u003eMath.absExact\u003c/code\u003e (Java 15+) does.\u003c/p\u003e\\n\"},{\"html\":\"-2147483648\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"2147483648\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat doesn\u0026#39;t fit in an \u003ccode\u003eint\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"jp-loops/looper-values/step-6\",\"title\":\"Boxed values compare identity\",\"body\":\"\u003cp\u003e\u003ccode\u003e\u0026lt;=\u003c/code\u003e and \u003ccode\u003e\u0026gt;=\u003c/code\u003e unbox and compare values.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e==\u003c/code\u003e and \u003ccode\u003e!=\u003c/code\u003e on two \u003ccode\u003eInteger\u003c/code\u003es compare references.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003ei \u0026lt;= j \u0026amp;\u0026amp; j \u0026lt;= i \u0026amp;\u0026amp; i != j\u003c/code\u003e can be true.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"jp-loops/looper-values/step-7\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCompare boxed numbers with \u003ccode\u003eequals\u003c/code\u003e, or unbox them first.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"false false\",\"correct\":false,\"feedback\":\"\u003cp\u003eSmall values come from the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e, so \u003ccode\u003ea\u003c/code\u003e and \u003ccode\u003eb\u003c/code\u003e are the same object.\u003c/p\u003e\\n\"},{\"html\":\"true false\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"true true\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly values from -128 to 127 are cached. 128 is boxed into two different objects.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-28\",\"key\":\"jp-loops/looper-values/jpz-28\",\"prompt\":\"\u003cp\u003eCan \u003ccode\u003ex == x + 1\u003c/code\u003e ever be true? What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eDouble.POSITIVE_INFINITY\u003c/code\u003e works too: infinity plus one is infinity.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 28, Looper in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e — \u003ccode\u003ex + 1\u003c/code\u003e is always bigger\",\"correct\":false,\"feedback\":\"\u003cp\u003eFloating-point numbers have gaps; 1 is smaller than half the gap here.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e — at 10¹⁷, adjacent \u003ccode\u003edouble\u003c/code\u003e values are 16 apart, so adding 1 rounds back to \u003ccode\u003ex\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"jpz-29\",\"key\":\"jp-loops/looper-values/jpz-29\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 29, Bride of Looper in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003etrue\\nfalse\\ntrue\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003efalse\\ntrue\\ntrue\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"NaN\\\" data-def=\\\"\u0026amp;quot;Not a Number\u0026amp;quot;: the \u0026lt;code\u0026gt;double\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;float\u0026lt;/code\u0026gt; result of things like \u0026lt;code\u0026gt;0.0 / 0.0\u0026lt;/code\u0026gt;. It isn\u0026amp;#39;t equal to anything, itself included.\\\" data-book=\\\"Java Puzzlers\\\"\u003eNaN\u003c/button\u003e isn\u0026#39;t equal to anything, itself included.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-30\",\"key\":\"jp-loops/looper-values/jpz-30\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 30, Son of Looper in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003efalse\\n7\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith a \u003ccode\u003eString\u003c/code\u003e, \u003ccode\u003e+ 0\u003c/code\u003e concatenates: \u003ccode\u003e\u0026quot;70\u0026quot;\u003c/code\u003e is a new string.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003etrue\\n70\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-31\",\"key\":\"jp-loops/looper-values/jpz-31\",\"prompt\":\"\u003cp\u003eWhat does this do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 31, Ghost of Looper in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Prints \u003ccode\u003e16\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what you\u0026#39;d get with a 16-bit unsigned shift, but the shift happens on 32 bits and the cast keeps the low 16 bits, all ones.\u003c/p\u003e\\n\"},{\"html\":\"It never ends: \u003ccode\u003ex\u003c/code\u003e is widened to \u003ccode\u003eint\u003c/code\u003e, shifted, then cast back to \u003ccode\u003eshort\u003c/code\u003e — which gives \u003ccode\u003e-1\u003c/code\u003e again\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Prints \u003ccode\u003e32\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe cast back to \u003ccode\u003eshort\u003c/code\u003e undoes each shift.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Widening conversion\\\" data-def=\\\"Converting to a type with more bits, like \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; to \u0026lt;code\u0026gt;long\u0026lt;/code\u0026gt;. The value is kept; integers are sign- or zero-extended.\\\" data-book=\\\"Java Puzzlers\\\"\u003eWidening conversion\u003c/button\u003e\"]},{\"id\":\"jpz-32\",\"key\":\"jp-loops/looper-values/jpz-32\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 32, Curse of Looper in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"
