es\",\"body\":\"\u003cp\u003e\u003ccode\u003elog.debug(\u0026quot;user \u0026quot; + user)\u003c/code\u003e builds the string even when debug is off.\u003c/p\u003e\\n\u003cp\u003eUse parameters: \u003ccode\u003elog.debug(\u0026quot;user {}\u0026quot;, user)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOr pass a supplier for expensive values.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jperf-se-api/collections-logging-and-streams/step-3\",\"prompt\":\"\u003cp\u003eWhich call costs almost nothing when debug logging is off?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eIn \u003ccode\u003elog.debug(\u0026quot;Order \u0026quot; + id + \u0026quot; total \u0026quot; + computeTotal())\u003c/code\u003e, Java evaluates the argument before calling \u003ccode\u003edebug\u003c/code\u003e: it builds the string and runs \u003ccode\u003ecomputeTotal()\u003c/code\u003e, only for \u003ccode\u003edebug\u003c/code\u003e to discard it.\u003c/p\u003e\\n\u003cp\u003eWith placeholders, the arguments are passed as they are, and the logger formats the message only if debug is enabled.\u003c/p\u003e\\n\u003cp\u003eThe remaining cost is a check and, at most, a small \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Varargs\\\" data-def=\\\"A parameter like \u0026lt;code\u0026gt;int... nums\u0026lt;/code\u0026gt; that accepts any number of arguments; the method receives them as an array.\\\" data-book=\\\"Effective Java\\\"\u003evarargs\u003c/button\u003e array.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003elog.debug(\u0026quot;Order \u0026quot; + id + \u0026quot; total \u0026quot; + computeTotal());\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe string is built, and \u003ccode\u003ecomputeTotal()\u003c/code\u003e runs, before \u003ccode\u003edebug\u003c/code\u003e can check the level.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003elog.debug(\u0026quot;Order {} total {}\u0026quot;, id, total);\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jperf-se-api/collections-logging-and-streams/step-4\",\"title\":\"Lambdas and streams are cheap\",\"body\":\"\u003cp\u003eA non-capturing lambda is created once and reused.\u003c/p\u003e\\n\u003cp\u003eStreams add a little overhead per pipeline, which the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e mostly removes.\u003c/p\u003e\\n\u003cp\u003eChoose them for clarity; measure before rewriting hot loops.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jperf-se-api/collections-logging-and-streams/step-5\",\"prompt\":\"\u003cp\u003eA colleague rewrites every stream into a \u003ccode\u003efor\u003c/code\u003e loop \u0026quot;for speed\u0026quot;. What\u0026#39;s the best response?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Agree — loops use less memory\",\"correct\":false,\"feedback\":\"\u003cp\u003eNot reliably; it depends on the pipeline.\u003c/p\u003e\\n\"},{\"html\":\"Profile first; only hot code where the stream measurably costs more is worth changing\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Agree — streams are always slower\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe difference is usually small after \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e compilation.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"jperf-se-api/collections-logging-and-streams/step-6\",\"prompt\":\"\u003cp\u003eAvoid rehashing a map that will hold 1,000 entries.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Map\u003cString, Order\u003e m = HashMap.\"},{\"answers\":[\"newHashMap\"],\"size\":10,\"choices\":[\"newHashMap\",\"Blackhole\",\"BufferedInputStream\",\"PrintCompilation\"]},{\"text\":\"(1000);\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Java SE API tips\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approach\",\"authors\":\"James F. Kurose \u0026 Keith W. Ross\",\"edit
