ms/extensible-enums/step-3\",\"ej-enums/extensible-enums/step-4\",\"ej-enums/extensible-enums/step-5\",\"ej-enums/extensible-enums/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-enums/extensible-enums/step-1\",\"title\":\"Enums can't extend enums\",\"body\":\"\u003cp\u003eEvery enum already extends \u003ccode\u003ejava.lang.Enum\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eSo you can\u0026#39;t write \u003ccode\u003eExtendedOperation extends BasicOperation\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"ej-enums/extensible-enums/step-2\",\"title\":\"Share an interface instead\",\"body\":\"$13\",\"diagram\":\"$14\"},{\"id\":\"step-3\",\"key\":\"ej-enums/extensible-enums/step-3\",\"prompt\":\"\u003cp\u003eWhy can\u0026#39;t \u003ccode\u003eExtendedOperation extends BasicOperation\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eEvery enum implicitly extends \u003ccode\u003ejava.lang.Enum\u003c/code\u003e, and Java allows only one superclass, so an enum can\u0026#39;t extend another enum.\u003c/p\u003e\\n\u003cp\u003eEnum constants are also a closed set chosen at compile time; allowing extension would mean a \u003ccode\u003eBasicOperation\u003c/code\u003e variable could hold constants it doesn\u0026#39;t know about.\u003c/p\u003e\\n\u003cp\u003eThe workaround is to have both enums implement a shared interface, like \u003ccode\u003eOperation\u003c/code\u003e, and write code against the interface.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s allowed\",\"correct\":false,\"feedback\":\"\u003cp\u003eEnums can\u0026#39;t be subclassed by other enums.\u003c/p\u003e\\n\"},{\"html\":\"Enums implicitly extend \u003ccode\u003ejava.lang.Enum\u003c/code\u003e and are effectively final\",\"correct\":true,\"feedbac \u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"No, it\u0026#39;s a purely theoretical pattern\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Enums and annotations\",\"next\":{\"id\":\"annotations-not-naming-patterns\",\"courseId\":\"ej-enums\",\"topicId\":\"effective-java\",\"key\":\"ej-enums/annotations-not-naming-patterns\",\"title\":\"Annotations over naming patterns\",\"summary\":\"A misspelled method-name convention fails silently; an annotation is checked and can carry parameters.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"annotations\",\"junit\",\"reflection\",\"naming patterns\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 39\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-enums/annotations-not-naming-patterns/step-1\",\"ej-enums/annotations-not-naming-patterns/step-2\",\"ej-enums/annotations-not-naming-patterns/step-3\",\"ej-enums/annotations-not-naming-patterns/step-4\",\"ej-enums/annotations-not-naming-patterns/step-5\",\"ej-enums/annotations-not-naming-patterns/step-6\"],\"exercises\":[\"ej-enums/annotations-not-naming-patterns/step-2\",\"ej-enums/annotations-not-naming-patterns/step-4\",\"ej-enums/annotations-not-naming-patterns/step-5\",\"ej-enums/annotations-not-naming-patterns/step-6\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\
