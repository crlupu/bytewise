c/p\u003e\\n\u003cp\u003eA typo like \u003ccode\u003etsetSafetyOverride\u003c/code\u003e simply doesn\u0026#39;t match, so the method is never run — and no test failure is reported, because nothing ran.\u003c/p\u003e\\n\u003cp\u003eThe bug hides until someone notices the missing coverage. With an annotation, \u003ccode\u003e@Test\u003c/code\u003e is checked by the compiler, so a misspelled \u003ccode\u003e@Tset\u003c/code\u003e fails to compile.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The test silently never runs — and passes, by not existing\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It fails to compile\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"The framework reports a typo\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt has no way to know you meant a test.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-enums/annotations-not-naming-patterns/step-3\",\"title\":\"Annotations are checked\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-enums/annotations-not-naming-patterns/step-4\",\"prompt\":\"\u003cp\u003eMatch each meta-annotation choice to its effect.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003e@Retention(RUNTIME)\u003c/code\u003e\",\"\u003ccode\u003e@Target(METHOD)\u003c/code\u003e\",\"An annotation with \u003ccode\u003eClass\u0026lt;? extends Throwable\u0026gt; value()\u003c/code\u003e\",\"\u003ccode\u003e@Repeatable\u003c/code\u003e\"],\"right\":[\"The annotation is available through reflection while the program runs\",\"The compiler rejects the annotation anywhere but on a method\",\"Can carry a parameter, like the exception a test expects\",\"The same annotation may appear several ti
