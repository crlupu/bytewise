_next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"enums-not-int-constants\",\"courseId\":\"ej-enums\",\"topicId\":\"effective-java\",\"key\":\"ej-enums/enums-not-int-constants\",\"title\":\"Enums instead of int constants\",\"summary\":\"Enums are type-safe, printable, and full classes — with fields, methods and constant-specific behaviour.\",\"duration\":6,\"tags\":[\"java\",\"effective java\",\"enums\",\"constants\",\"strategy\",\"type safety\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 34\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"ej-enums/enums-not-int-constants/step-1\",\"ej-enums/enums-not-int-constants/step-2\",\"ej-enums/enums-not-int-constants/step-3\",\"ej-enums/enums-not-int-constants/step-4\",\"ej-enums/enums-not-int-constants/step-5\",\"ej-enums/enums-not-int-constants/step-6\",\"ej-enums/enums-not-int-constants/step-7\"],\"exercises\":[\"ej-enums/enums-not-int-constants/step-3\",\"ej-enums/enums-not-int-constants/step-5\",\"ej-enums/enums-not-int-constants/step-6\",\"ej-enums/enums-not-int-constants/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-enums/enums-not-int-constants/step-1\",\"title\":\"int constants are unsafe\",\"body\":\"\u003cp\u003e\u003ccode\u003eAPPLE_FUJI = 0\u003c/code\u003e and \u003ccode\u003eORANGE_NAVEL = 0\u003c/code\u003e are both just \u003ccode\u003eint\u003c/code\u003es.\u003c/p\u003e\\n\u003cp\u003eNothing stops you passing an orange as an apple.\u003c/p\u003e\\n\u003cp\u003eThey print as bare numbers.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"ej-enums/enums-not-int-constants/step-2\",\"title\":\"Enums are real types\",\"body\":\"\u003cp\u003eAn \u003ccode\u003eApple\u003c/code\u003e parameter accepts only \u003ccode\u003eApple\u003c/code\u003e values.\u003c/p\u003e\\n\u003cp\u003eEnums print their names.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003evalues()\u003c/code\u003e lists every constant.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"ej-enums/enums-not-int-constants/step-3\",\"prompt\":\"\u003cp\u003eWhich are advantages of a Java \u003ccode\u003eenum\u003c/code\u003e over int constants?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Readable \u003ccode\u003etoString\u003c/code\u003e output, and \u003ccode\u003evalues()\u003c/code\u003e to iterate over all constants\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They use less memory than ints\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach constant is an object; memory isn\u0026#39;t the point.\u003c/p\u003e\\n\"},{\"html\":\"Constants can be added or reordered without recompiling clients\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Compile-time type safety — an \u003ccode\u003eApple\u003c/code\u003e parameter accepts only \u003ccode\u003eApple\u003c/code\u003e values\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"ej-enums/enums-not-int-constants/step-4\",\"title\":\"Enums can carry behaviour\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"ej-enums/enums-not-int-constants/step-5\",\"prompt\":\"\u003cp\u003ePayroll: weekdays and weekends compute overtime differently. Instead of a switch in \u003ccode\u003ePayrollDay\u003c/code\u003e, what\u0026#39;s the more robust design?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe day must choose a pay type when it\u0026#39;s declared, so a new constant can\u0026#39;t forget it.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWith a switch over the day in a method, adding a new constant compiles fine even if you forget to add a case — the day silently gets the default pay.\u003c/p\u003e\\n\u003cp\u003eIn the strategy enum, each \u003ccode\u0
