-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"enummap\",\"courseId\":\"ej-enums\",\"topicId\":\"effective-java\",\"key\":\"ej-enums/enummap\",\"title\":\"EnumMap instead of ordinal indexing\",\"summary\":\"Arrays indexed by ordinal() are unchecked and fragile — EnumMap is the safe, equally fast alternative.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"enums\",\"enummap\",\"arrays\",\"ordinal\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 37\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-enums/enummap/step-1\",\"ej-enums/enummap/step-2\",\"ej-enums/enummap/step-3\",\"ej-enums/enummap/step-4\",\"ej-enums/enummap/step-5\",\"ej-enums/enummap/step-6\"],\"exercises\":[\"ej-enums/enummap/step-3\",\"ej-enums/enummap/step-4\",\"ej-enums/enummap/step-5\",\"ej-enums/enummap/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-enums/enummap/step-1\",\"title\":\"Don't index arrays by ordinal\",\"body\":\"\u003cp\u003e\u003ccode\u003earray[e.ordinal()]\u003c/code\u003e looks efficient.\u003c/p\u003e\\n\u003cp\u003eBut the compiler can\u0026#39;t check the index.\u003c/p\u003e\\n\u003cp\u003eUse the wrong one, and you silently get wrong data.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"ej-enums/enummap/step-2\",\"title\":\"EnumMap is safe and fast\",\"body\":\"\u003cp\u003e\u003ccode\u003eEnumMap\u003c/code\u003e is a map keyed by enum constants.\u003c/p\u003e\\n\u003cp\u003eInside, it\u0026#39;s an array indexed by \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0026lt;code\u0026gt;ordinal()\u0026lt;/code\u0026gt;. Don\u0026amp;#39;t store meaning in it — reorder the constants and it changes.\\\" data-book=\\\"Effective Java\\\"\u003eordinal\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eSo it\u0026#39;s just as fast — with type safety.\u003c/p\u003e\\n\u003cp\u003eFor two-level lookups, nest \u003ccode\u003eEnumMap\u003c/code\u003es.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"ej-enums/enummap/step-3\",\"prompt\":\"\u003cp\u003eThe EnumMap version.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe constructor takes the key type\u0026#39;s \u003ccode\u003eClass\u003c/code\u003e object — a bounded \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Type token\\\" data-def=\\\"A \u0026lt;code\u0026gt;Class\u0026lt;/code\u0026gt; object like \u0026lt;code\u0026gt;String.class\u0026lt;/code\u0026gt; passed around to convey type information at run time.\\\" data-book=\\\"Effective Java\\\"\u003etype token\u003c/button\u003e — so the map knows its keys at run time.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Map\u003cLifeCycle, Set\u003cPlant\u003e\u003e byLifeCycle = new \"},{\"answers\":[\"EnumMap\"],\"size\":7,\"choices\":[\"Operation\",\"values\",\"EnumMap\",\"isAnnotationPresent\"]},{\"text\":\"\u003c\u003e(LifeCycle.class);\\nfor (LifeCycle lc : LifeCycle.values()) byLifeCycle.put(lc, new HashSet\u003c\u003e());\\nfor (Plant p : garden) byLifeCycle.get(p.lifeCycle).add(p);\\n\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-4\",\"key\":\"ej-enums/enummap/step-4\",\"prompt\":\"\u003cp\u003eWhy is EnumMap about as fast as the ordinal-indexed array?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eEnumMap\u003c/code\u003e stores its values in an array indexed by each key\u0026#39;s \u003ccode\u003eordinal()\u003c/code\u003e, which is exactly what a hand-written ordinal-indexed array does.\u003c/p\u003e\\n\u003cp\u003eThe difference is safety: the map\u0026#39;s keys are typed, so you can\u0026#39;t index with the wrong enum or an arbitrary int, and you never touch \u003ccode\u003eordinal()\u003c/code\u003e yourself.\u003c/p\u003e\\n\u003cp\u003eIt also prints readably and works with the \u003ccode\u003eMap\u003c/code\u003e API. You get the speed of the array without its fragility.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Internally it \u003cem\u003eis\u003c/em\u003e an array indexed by ordinal — the danger is hidden behind a type-safe Map\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It uses hashing with perfect hash codes\",\"correct\":false,\"feedback\":\"\u003cp\u003eNo hashing at all; that\u0026#39;s part of why it\u0026#39;s fast.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0026lt;code\u0026gt;ordinal()\u0026lt;/code\u0026gt;. Don\u0026amp;#39;t store meaning in it — reorder the constants and it changes.\\\" data-book=\\\"Effective Java\\\"\u003eOrdinal\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003eHash code\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"ej-enums/enummap/step-5\",\"prompt\":\"\u003cp\u003eEach \u003ccode\u003ePlant\u003c/code\u003e has a \u003ccode\u003elifeCycle\u003c/code\u003e field of the enum \u003ccode\u003eLifeCycle\u003c/code\u003e. Grouping with streams, \u003ccode\u003eCollectors.groupingBy(p -\u0026gt; p.lifeCycle)\u003c/code\u003e returns a \u003ccode\u003eHashMap\u003c/code\u003e. How do you get an \u003ccode\u003eEnumMap\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003egroupingBy(classifier, mapFactory, downstream)\u003c/code\u003e lets you choose the map implementation.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Use the three-argument \u003ccode\u003egroupingBy\u003c/code\u003e, passing \u003ccode\u003e() -\u0026gt; new EnumMap\u0026lt;\u0026gt;(LifeCycle.class)\u003c/code\u003e as the map factory\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"You can\u0026#39;t — streams always produce HashMaps\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"ej-enums/enummap/step-6\",\"prompt\":\"\u003cp\u003ePhase transitions — SOLID to LIQUID is MELT, and so on — are stored in a 2-D array indexed by two \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0026lt;code\u0026gt;ordinal()\u0026lt;/code\u0026gt;. Don\u0026amp;#39;t store meaning in it — reorder the constants and it changes.\\\" data-book=\\\"Effective Java\\\"\u003eordinals\u003c/button\u003e. What\u0026#39;s the better representation?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAdding a new phase (PLASMA, say) then means adding a constant and its transitions — nothing else.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A bigger array\",\"correct\":false,\"feedback\":\"\u003cp\u003eAdding a phase means getting a larger, error-prone table exactly right.\u003c/p\u003e\\n\"},{\"html\":\"A nested \u003ccode\u003eEnumMap\u0026lt;Phase, EnumMap\u0026lt;Phase, Transition\u00
