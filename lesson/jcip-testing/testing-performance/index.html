ethroughput\u003c/button\u003e and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elatency\u003c/button\u003e end to end.\u003c/p\u003e\\n\u003cp\u003eSee how they change with threads and buffer sizes.\u003c/p\u003e\\n\u003cp\u003eComparing implementations is often most useful.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-testing/testing-performance/step-2\",\"title\":\"Benchmarks lie easily\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e skews single runs.\u003c/p\u003e\\n\u003cp\u003eEarly iterations run before the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e compiles.\u003c/p\u003e\\n\u003cp\u003eUnused results get optimized away entirely.\u003c/p\u003e\\n\u003cp\u003eWarm up, run long, and use every result.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-testing/testing-performance/step-3\",\"prompt\":\"\u003cp\u003eMatch each benchmarking pitfall to its effect.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Garbage collection\",\"Dynamic compilation\",\"Unrealistic contention\",\"Dead-code elimination\"],\"right\":[\"A collection that happens in one run but not another skews the timing\",\"Early iterations run interpreted, then compiled — mixing both distorts results\",\"Real tasks do other work between locks; a tight loop exaggerates contention\",\"The compiler removes computation whose result is never used, timing nothing at all\"],\"rightOrder\":[2,1,0,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jcip-testing/testing-performance/step-4\",\"prompt\":\"\u003cp\u003eA benchmark computes \u003ccode\u003efib(30)\u003c/code\u003e in a loop but never uses the results. A new JVM makes it 1,000× faster. What happened?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eMake results observable cheaply — for example, compare a hash of the result with a random value, or use \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JMH\\\" data-def=\\\"The Java Microbenchmark Harness — the standard tool for writing benchmarks that the JIT can\u0026amp;#39;t fool.\\\"\u003eJMH\u003c/button\u003e\u0026#39;s \u003ccode\u003eBlackhole\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIf the result of \u003ccode\u003efib(30)\u003c/code\u003e is never used, the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e may prove the call has no effect and delete it, so the loop measures nothing.\u003c/p\u003e\\n\u003cp\u003eA newer JVM with a smarter optimizer made the \u0026quot;benchmark\u0026quot; 1,000 times faster without the code getting faster at all.\u003c/p\u003e\\n\u003cp\u003eBenchmarks must consume their results in a way the compiler can\u0026#39;t predict, which is what JMH\u0026#39;s \u003ccode\u003eBlackhole\u003c/code\u003e is for.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"The new JVM is 1,000× faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eReal improvements are rarely that large; suspect the benchmark.\u003c/p\u003e\\n\"},{\"html\":\"The optimizer saw the result was unused and eliminated the computation\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"jcip-testing/testing-performance/step-5\",\"prompt\":\"\u003cp\u003eHow do you avoid measuring the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT compiler\u003c/button\u003e at work?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003e-XX:+PrintCompilation\u003c/code\u003e shows when compilation happens. \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JMH\\\" data-def=\\\"The Java Microbenchmark Harness — the standard tool for writing benchmarks that the JIT can\u0026amp;#39;t fool.\\\"\u003eJMH\u003c/button\u003e automates warm-up and many other pitfalls.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Run long
