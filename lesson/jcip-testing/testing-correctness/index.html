k:#F97583\"\u003e-\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e heapSize2) \u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003e\u0026#x3C;\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e THRESHOLD);\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"testing-correctness\",\"courseId\":\"jcip-testing\",\"topicId\":\"jcip\",\"key\":\"jcip-testing/testing-correctness\",\"title\":\"Testing for correctness\",\"summary\":\"Test blocking behaviour, safety under contention and resource use — and get the scheduler to explore more interleavings.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"testing\",\"safety tests\",\"interleavings\",\"bounded buffer\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§12.1, Testing for Correctness\"}],\"requires\":[],\"steps\":14,\"stepKeys\":[\"jcip-testing/testing-correctness/step-1\",\"jcip-testing/testing-correctness/step-2\",\"jcip-testing/testing-correctness/step-3\",\"jcip-testing/testing-correctness/step-4\",\"jcip-testing/testing-correctness/step-5\",\"jcip-testing/testing-correctness/step-6\",\"jcip-testing/testing-correctness/step-7\",\"jcip-testing/testing-correctness/listing-12-1\",\"jcip-testing/testing-correctness/listing-12-2\",\"jcip-testing/testing-correctness/listing-12-3\",\"jcip-testing/testing-correctness/listing-12-4\",\"jcip-testing/testing-correctness/listing-12-5\",\"jcip-testing/testing-correctness/listing-12-6\",\"jcip-testing/testing-correctness/listing-12-7\"],\"exercises\":[\"jcip-testing/testing-correctness/step-2\",\"jcip-testing/testing-correctness/step-4\",\"jcip-testing/testing-correctness/step-5\",\"jcip-testing/testing-correctness/step-6\",\"jcip-testing/testing-correctness/step-7\",\"jcip-testing/testing-correctness/listing-12-1\",\"jcip-testing/testing-correctness/listing-12-2\",\"jcip-testing/testing-correctness/listing-12-3\",\"jcip-testing/testing-correctness/listing-12-4\",\"jcip-testing/testing-correctness/listing-12-5\",\"jcip-testing/testing-correctness/listing-12-6\",\"jcip-testing/testing-correctness/listing-12-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-testing/testing-correctness/step-1\",\"title\":\"What to test\",\"body\":\"\u003cp\u003eNormal behaviour, like a full buffer reporting full.\u003c/p\u003e\\n\u003cp\u003eBlocking: \u003ccode\u003etake\u003c/code\u003e on an empty buffer really waits.\u003c/p\u003e\\n\u003cp\u003eSafety: nothing lost or duplicated under load.\u003c/p\u003e\\n\u003cp\u003eResources: nothing leaks.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-testing/testing-correctness/step-2\",\"prompt\":\"\u003cp\u003eTesting that \u003ccode\u003etake\u003c/code\u003e blocks on an empty buffer — put the steps in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSuccess is the thread finishing because it was interrupted, not because \u003ccode\u003etake\u003c/code\u003e returned.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Start a thread that calls \u003ccode\u003etake\u003c/code\u003e on the empty buffer, failing the test if \u003ccode\u003etake\u003c/code\u003e returns\",\"Sleep long enough for it to block\",\"Interrupt the thread\",\"Join it with a timeout, and assert it ended — by catching \u003ccode\u003eInterruptedException\u003c/code\u003e\"],\"start\":[3,0,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003eTimeout\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-testing/testing-correctness/step-3\",\"title\":\"Test without hiding bugs\",\"body\":\"\u003cp\u003eCompare checksums of what was put and taken.\u003c/p\u003e\\n\u003cp\u003eStart all threads together with a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latch\\\" data-def=\\\"A gate that stays closed until a count reaches zero, then opens for good. Lets threads wait until a set of events has happened.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elatch\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eUse more threads than CPUs to get more interleavings.\u003c/p\u003e\\n\u003cp\u003eRun many iterations. Bugs are rare.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-testing/testing-correctness/step-4\",\"prompt\":\"\u003cp\u003eHow can a safety test check that N \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Producer-consumer\\\" data-def=\\\"Producers put work in a queue, consumers take it out — decoupling the rate of producing from the rate of consuming.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eproducers and consumers\u003c/button\u003e lost or duplicated nothing, without a lock that would hide the bugs?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOrder-insensitive checksums let threads run fully concurrently.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Collect every item into a shared synchronized list and compare\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe synchronized list would serialise the test and could mask the race you\u0026#39;re looking for.\u003c/p\u003e\\n\"},{\"html\":\"Each producer sums a checksum of what it puts, each consumer of what it takes; compare the totals at the end\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"jcip-testing/testing-correctness/step-5\",\"prompt\":\"\u003cp\u003eHow do you make sure all test threads really run at the same time?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Start them in a loop\",\"correct\":false,\"feedback\":\"\u003cp\u003eEarly threads may finish before later ones even start — little concurrency is actually tested.\u003c/p\u003e\\n\"},{\"html\":\"Release them together with a \u003ccode\u003eCountDownLatch\u003c/code\u003e or \u003ccode\u003eCyclicBarrier\u003c/code\u003e start gate\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latch\\\" data-def=\\\"A gate that stays closed until a count reaches zero, then opens for good. Lets threads wait until a set of events has happened.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLatch\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Barrier\\\" data-def=\\\"Makes a group of threads wait until all of them arrive, then releases them together. Reusable for step-by-step computations.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eBarrier\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"jcip-testing/testing-correctness/step-6\",\"prompt\":\"\u003cp\u003eHow can a test increase the number of interleavings it explores?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eStatic analysis tools — like FindBugs/SpotBugs\u0026#39; concurrency checks — complement testing.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Run more threads than CPUs, test on multiprocessors and different systems, and occasionally call \u003ccode\u003eThread.yield()\u003c/code\u003e or \u003ccode\u003esleep(0)\u003c/code\u003e at key points\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Run the same test once on a fast machine\",\"correct\":false,\"feedback\":\"\u003cp\u003eConcurrency bugs are probabilistic; you need many varied runs.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"jcip-testing/testing-correctness/step-7\",\"prompt\":\"\u003cp\u003eComplete the advice.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Concurrency bugs are low-probability events, so tests must run many \",\"html\":\"Concurrency bugs are low-probability events, so tests must run many \"},{\"answers\":[\"iterations\"],\"size\":10,\"choices\":[\"open\",\"iterations\",\"order\",\"garbage\"]},{\"text\":\" to have a chance of finding them.\",\"html\":\" to have a chance of finding them.\"}],\"code\":false,\"caseSensitive\":false},{\"id\":\"listing-12-1\",\"key\":\"jcip-testing/testing-correctness/listing-12-1\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 12.1\u003c/strong\u003e · Capacity is 2. A thread calls \u003ccode\u003eput\u003c/code\u003e three times with no takers. What happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"The third \u003ccode\u003eput\u003c/code\u003e overwrites the first item\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Semaphore\\\" data-def=\\\"Manages a fixed number of permits. \u0026lt;code\u0026gt;acquire\u0026lt;/code\u0026gt; takes one (waiting if none are left), \u0026lt;code\u0026gt;release\u0026lt;/code\u0026gt; gives one back. Used to bound how many threads use a resource.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003esemaphore\u003c/button\u003e has no permits left.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eIllegalStateException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eBounded buffers\u003c/button\u003e block rather than throw.\u003c/p\u003e\\n\"},{\"html\":\"The third \u003ccode\u003eput\u003c/code\u003e blocks in \u003ccode\u003eavailableSpaces.acquire()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"listing-12-2\",\"key\":\"jcip-testing/testing-correctness/listing-12-2\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 12.2\u003c/strong\u003e · \u003ccode\u003eSemaphoreBoundedBuffer\u003c/code\u003e blocks \u003ccode\u003eput\u003c/code\u003e when full and \u003ccode\u003etake\u003c/code\u003e when empty. Do these tests pass?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"The first fails — a new buffer is full\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt starts with 10 free spaces.\u003c/p\u003e\\n\"},{\"html\":\"Yes, both\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The second blocks forever on the 10th \u003ccode\u003eput\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eCapacity is 10, so ten puts fit.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-12-3\",\"key\":\"jcip-testing/testing-correctness/listing-12-3\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 12.3\u003c/strong\u003e · What does this test check?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNote \u003ccode\u003efail()\u003c/code\u003e in another thread doesn\u0026#39;t fail the test by itself — the main thread\u0026#39;s \u003ccode\u003eassertFalse(taker.isAlive())\u003c/code\u003e does the real check.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"That \u003ccode\u003etake\u003c/code\u003e blocks on an empty buffer and responds to interruption\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"That \u003ccode\u003etake\u003c/code\u003e returns \u003ccode\u003enull\u003c/code\u003e when empty\",\"correct\":false,\"feedback\":\"\u003cp\u003eReturning at all would hit \u003ccode\u003efail()\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"That \u003ccode\u003etake\u003c/code\u003e is fast\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s about blocking and interruptibility, not speed.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eInterruption\u003c/button\u003e\"]},{\"id\":\"listing-12-4\",\"key\":\"jcip-testing/testing-correctness/listing-12-4\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 12.4\u003c/strong\u003e · Why use this generator in concurrent tests instead of a shared \u003ccode\u003ejava.util.Random\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"It\u0026#39;s cheap and each thread can own one, so the test doesn\u0026#39;t serialize on a shared generator\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It produces better random numbers\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s medium quality; good enough for tests.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eRandom\u003c/code\u003e isn\u0026#39;t thread-safe\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eRandom\u003c/code\u003e is thread-safe, but contended — that\u0026#39;s the problem.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread safety\u003c/button\u003e\"]},{\"id\":\"listing-12-5\",\"key\":\"jcip-testing/testing-correctness/listing-12-5\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 12.5\u003c/strong\u003e · With 10 pairs, the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Barrier\\\" data-def=\\\"Makes a group of threads wait until all of them arrive, then releases them together. Reusable for step-by-step computations.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ebarrier\u003c/button\u003e has 21 parties. Why does the main thread call \u003ccode\u003ebarrier.await()\u003c/code\u003e twice?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"First to start all workers together, second to wait until they\u0026#39;ve all finished\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"To retry if the first barrier breaks\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach await is a separate generation of the barrier.\u003c/p\u003e\\n\"},{\"html\":\"It\u0026#39;s a mistake — once is enough\",\"correct\":false,\"feedback\":\"\u003cp\u003eWorkers also await twice: before and after their loops.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-12-6\",\"key\":\"jcip-testing/testing-correctness/listing-12-6\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 12.6\u003c/strong\u003e · Producers sum what they put and consumers sum what they take. If the buffer ever dropped or duplicated an item, what would the test see?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEach thread sums locally and publishes once, so the checksum itself adds no \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtention\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Nothing — the sums can still match\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith random values, a lost or duplicated item changes the sum except by extreme coincidence.\u003c/p\u003e\\n\"},{\"html\":\"An \u003ccode\u003eArithmeticException\u003c/code\u003e on overflow\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eint\u003c/code\u003e overflow wraps silently; both sums wrap the same way.\u003c/p\u003e\\n\"},{\"html\":\"Almost certainly a mismatch between \u003ccode\u003eputSum\u003c/code\u003e and \u003ccode\u003etakeSum\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"listing-12-7\",\"key\":\"jcip-testing/testing-correctness/listing-12-7\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 12.7\u003c/strong\u003e · \u003ccode\u003eBig\u003c/code\u003e holds a 100,000-element array. If \u003ccode\u003etake\u003c/code\u003e forgot to null out the slot it read, what would this test detect?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"A \u003ccode\u003eConcurrentModificationException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s single-threaded and measures memory.\u003c/p\u003e\\n\"},{\"html\":\"A large heap growth — the empty buffer would still reference every \u003ccode\u003eBig\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — taken items are always garbage\",\"correct\":false,\"feedback\":\"\u003cp\u003eNot while the array still points at them.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Testing concurrent programs\",\"next\":{\"id\":\"testing-correctness-code\",\"courseId\":\"jcip-testing\",\"topicId\":\"jcip\",\"key\":\"jcip-testing/testing-correctness-code\",\"title\":\"Testing for correctness: in code\",\"summary\":\"More examples for testing for correctness, one question each.\",\"duration\":3,\"tags\":[\"java\",\"concurrency\",\"testing\",\"safety tests\",\"interleavings\",\"bounded buffer\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§12.1, Testing for Correctness\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jcip-testing/testing-correctness-code/step-1\",\"jcip-testing/testing-correctness-code/step-2\",\"jcip-testing/testing-correctness-code/listing-12-8\",\"jcip-testing/testing-correctness-code/listing-12-9\",\"jcip-testing/testing-correctness-code/listing-12-10\"],\"exercises\":[\"jcip-testing/testing-correctness-code/listing-12-8\",\"jcip-testing/testing-correctness-code/listing-12-9\",\"jcip-testi
