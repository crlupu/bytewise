nd-hashcode/jpz-63\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jp-library/equals-and-hashcode/step-1\",\"title\":\"Hash collections look at hashCode first\",\"body\":\"\u003cp\u003eA \u003ccode\u003eHashSet\u003c/code\u003e uses \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e to pick a bucket.\u003c/p\u003e\\n\u003cp\u003eIt only calls \u003ccode\u003eequals\u003c/code\u003e on objects in that bucket.\u003c/p\u003e\\n\u003cp\u003eEqual objects with different hash codes are never compared.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-library/equals-and-hashcode/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eName\u003c/code\u003e overrides \u003ccode\u003eequals\u003c/code\u003e to compare first and last names, but not \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhenever you override \u003ccode\u003eequals\u003c/code\u003e, override \u003ccode\u003ehashCode\u003c/code\u003e so equal objects have equal hash codes.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eHashSet.contains\u003c/code\u003e computes the hash code of the argument to choose a bucket, then compares with \u003ccode\u003eequals\u003c/code\u003e inside
