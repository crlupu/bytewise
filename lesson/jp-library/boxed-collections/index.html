r can\u0026#39;t catch this. Cast: \u003ccode\u003es.remove((short) (i - 1))\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003es.add(i)\u003c/code\u003e boxes \u003ccode\u003ei\u003c/code\u003e as a \u003ccode\u003eShort\u003c/code\u003e. But \u003ccode\u003ei - 1\u003c/code\u003e is an \u003ccode\u003eint\u003c/code\u003e expression, so \u003ccode\u003es.remove(i - 1)\u003c/code\u003e boxes it as an \u003ccode\u003eInteger\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eShort.equals\u003c/code\u003e returns false for any \u003ccode\u003eInteger\u003c/code\u003e, even with the same value, so nothing is ever removed and all 100 shorts remain.\u003c/p\u003e\\n\u003cp\u003eThe compiler can\u0026#39;t help because \u003ccode\u003eSet.remove\u003c/code\u003e takes \u003ccode\u003eObject\u003c/code\u003e. Casting to \u003ccode\u003e(short) (i - 1)\u003c/code\u003e fixes it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ei - 1\u003c/code\u003e is an \u003ccode\u003eint\u003c/code\u003e, so \u003ccode\u003eremove\u003c/code\u003e looks for an \u003ccode\u003eInteger\u003c/code\u003e and finds nothing.\u003c/p\u003e\\n\"},{\"html\":\"100\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jp-library/boxed-collections/step-3\",\"title\":\"List.remove is overloaded\",\"body\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e has \u003ccode\u003eremove(int index)\u003c/code\u003e and \u003ccode\u003eremove(Object o)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003elist.remove(1)\u003c/code\u003e removes the element at index 1.\u003c/p\u003e\\n\u003cp\u003eTo remove the value 1, pass \u003ccode\u003eInteger.valueOf(1)\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jp-library/boxed-collections/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e has two \u003ccode\u003eremove\u003c/code\u003e methods: \u003ccode\u003eremove(int index)\u003c/code\u003e and \u003ccode\u003eremove(Object o)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWith the argument \u003ccode\u003e1\u003c/code\u003e, an \u003ccode\u003eint\u003c/code\u003e, \u003ccode\u003eremove(int)\u003c/code\u003e applies without boxing, and overload resolution prefers it, so the element at index 1 — the value 2 — is removed.\u003c/p\u003e\\n\u003cp\u003eTo remove the value 1, call \u003ccode\u003elist.remove(Integer.valueOf(1))\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e[3, 2]\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eremove(int)\u003c/code\u003e is chosen over \u003ccode\u003eremove(Object)\u003c/code\u003e because it needs no boxing — so it removes index 1.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e[3, 1]\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"jp-library/boxed-collections/step-5\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t \u003ccode\u003eSet\u0026lt;E\u0026gt;.remove\u003c/code\u003e take an \u003ccode\u003eE\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Because sets can only hold objects\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat
