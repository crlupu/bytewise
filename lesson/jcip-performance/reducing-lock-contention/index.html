jcip-performance/reducing-lock-contention/listing-11-5\",\"jcip-performance/reducing-lock-contention/listing-11-6\",\"jcip-performance/reducing-lock-contention/listing-11-7\",\"jcip-performance/reducing-lock-contention/listing-11-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-performance/reducing-lock-contention/step-1\",\"title\":\"Less often, less long\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e depends on how often a lock is taken.\u003c/p\u003e\\n\u003cp\u003eAnd on how long it\u0026#39;s held.\u003c/p\u003e\\n\u003cp\u003eShrink either, or use something other than a lock.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-performance/reducing-lock-contention/step-2\",\"title\":\"Hold locks briefly\",\"body\":\"\u003cp\u003eLock only the lines that touch shared state.\u003c/p\u003e\\n\u003cp\u003eBuild strings and match patterns outside the lock.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-performance/reducing-lock-contention/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003esynchronized userLocationMatches(name, regexp)\u003c/code\u003e builds a key string, looks it up in a map, then runs a regex match. Which part needs the lock?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003eNarrowing lock scope\u003c/strong\u003e — get in, get out.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The whole method\",\"correct\":false,\"feedback\":\"\u003cp\u003eHolding the lock during the regex match makes every other
