\",\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"amdahls-law\",\"courseId\":\"jcip-performance\",\"topicId\":\"jcip\",\"key\":\"jcip-performance/amdahls-law\",\"title\":\"Performance, scalability and Amdahl's law\",\"summary\":\"The serial fraction of a program caps its speed-up, no matter how many processors you add.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"performance\",\"scalability\",\"amdahl's law\",\"speedup\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§11.1–11.2, Thinking About Performance; Amdahl's Law\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-performance/amdahls-law/step-1\",\"jcip-performance/amdahls-law/step-2\",\"jcip-performance/amdahls-law/step-3\",\"jcip-performance/amdahls-law/step-4\",\"jcip-performance/amdahls-law/step-5\",\"jcip-performance/amdahls-law/step-6\",\"jcip-performance/amdahls-law/step-7\"],\"exercises\":[\"jcip-performance/amdahls-law/step-3\",\"jcip-performance/amdahls-law/step-4\",\"jcip-performance/amdahls-law/step-6\",\"jcip-performance/amdahls-law/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-performance/amdahls-law/step-1\",\"title\":\"How fast versus how much\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLatency\u003c/button\u003e is how fast one request finishes.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Scalability\\\" data-def=\\\"How throughput improves as you add resources such as CPUs.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eScalability\u003c/button\u003e is how much more you handle with more CPUs.\u003c/p\u003e\\n\u003cp\u003eConcurrent programs usually aim for scalability.\u003c/p\u003e\\n\u003cp\u003eMake it right first. Optimize only after measuring.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-performance/amdahls-law/step-2\",\"title\":\"Amdahl's law\",\"body\":\"\u003cp\u003eSome part of every program runs serially.\u003c/p\u003e\\n\u003cp\u003eThat part limits the speed-up.\u003c/p\u003e\\n\u003cp\u003eWith serial fraction F on N CPUs: speedup ≤ 1 / (F + (1 − F) / N).\u003c/p\u003e\\n\u003cp\u003eHowever many CPUs you add, it never beats 1 / F.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-performance/amdahls-law/step-3\",\"prompt\":\"\u003cp\u003e10% of a program is serial. What\u0026#39;s the maximum speed-up on 10 processors? (Round to one decimal place.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1 / 0.19 ≈ 5.3 — barely half the ideal, with only 10% serial.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Amdahl\u0026#39;s law\\\" data-def=\\\"The speed-up from N processors is at most 1 / (F + (1 − F) / N), where F is the serial fraction. With 10% serial, you can never go more than 10× faster.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAmdahl\u0026#39;s law\u003c/button\u003e gives speed-up = 1 / (F + (1 − F) / N), where F is the serial fraction and N the number of processors.\u003c/p\u003e\\n\u003cp\u003eWith F = 0.1 and N = 10: 1 / (0.1 + 0.9 / 10) = 1 / 0.19 ≈ 5.3.\u003c/p\u003e\\n\u003cp\u003eEven a small serial part halves the benefit of ten cores, and as N grows the serial part dominates; that\u0026#39;s why reducing serialization matters more than adding processors.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e1 / (0.1 + 0.09)\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1.1\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the speed-up from the serial part alone. Use 1 / (F + (1 − F) / N).\u003c/p\u003e\\n\"},{\"html\":\"5.3\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"9\",\"correct\":false,\"feedback\":\"\u003cp\u003eUse the formula — 1 / (0.1 + 0.9 / 10).\u003c/p\u003e\\n\"},{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would need a 0% serial part.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-4\",\"key\":\"jcip-performance/amdahls-law/step-4\",\"prompt\":\"\u003cp\u003e10% of a program is serial. With unlimited processors, What\u0026#39;s the ceiling on its speed-up?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1 / F = 1 / 0.1 = 10. No number of cores beats it.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eAs N grows, (1 − F) / N approaches 0.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"10\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Unlimited\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe serial 10% never speeds up, so the ceiling is 1 / 0.1.\u003c/p\u003e\\n\"},{\"html\":\"100\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe ceiling is 1 / F.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-performance/amdahls-law/step-5\",\"title\":\"Serial parts hide in shared data\",\"body\":\"\u003cp\u003eA shared queue or counter makes threads take turns.\u003c/p\u003e\\n\u003cp\u003eA single lock turns parallel work serial.\u003c/p\u003e\\n\u003cp\u003eConcurrent data structures shrink that serial part.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-performance/amdahls-law/step-6\",\"prompt\":\"\u003cp\u003eWhere do serial fractions hide in a \u0026quot;fully parallel\u0026quot; program?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nowhere, if the tasks are independent\",\"correct\":false,\"feedback\":\"\u003cp\u003eCoordination among them — fetching tasks, merging results — is serial.\u003c/p\u003e\\n\"},{\"html\":\"Shared data structures — a single work queue, a synchronized collection, a counter every thread updates\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Synchronized collection\\\" data-def=\\\"\u0026lt;code\u0026gt;Vector\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;Hashtable\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;Collections.synchronizedXxx\u0026lt;/code\u0026gt; wrappers: every method holds one lock. Thread-safe per call, but compound actions still need client-side locking, and it doesn\u0026amp;#39;t scale.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eSynchronized collection\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"jcip-performance/amdahls-law/step-7\",\"prompt\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Synchronized collection\\\" data-def=\\\"\u0026lt;code\u0026gt;Vector\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;Hashtable\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;Collections.synchronizedXxx\u0026lt;/code\u0026gt; wrappers: every method holds one lock. Thread-safe per call, but compound actions still need client-side locking, and it doesn\u0026amp;#39;t scale.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003esynchronizedList\u003c/code\u003e\u003c/button\u003e work queue scales poorly as threads are added; a \u003ccode\u003eConcurrentLinkedQueue\u003c/code\u00
