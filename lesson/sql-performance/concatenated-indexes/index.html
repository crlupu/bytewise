one book\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"sql-performance/concatenated-indexes/step-2\",\"prompt\":\"\u003cp\u003eWith an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003e(subsidiary_id, employee_id)\u003c/code\u003e, which \u003ccode\u003eWHERE\u003c/code\u003e clauses can use it to find rows directly?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAn index serves queries on a \u003cstrong\u003eleading\u003c/strong\u003e prefix of its columns — the first column, the first two, and so on.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA two-column index sorts entries by \u003ccode\u003esubsidiary_id\u003c/code\u003e first, and by \u003ccode\u003eemployee_id\u003c/code\u003e only within each subsidiary — like a phone book sorted by surname, then first name.\u003c/p\u003e\\n\u003cp\u003eYou can quickly find a subsidiary, or a subsidiary and employee, because those are contiguous ranges.\u003c/p\u003e\\n\u003cp\u003eSearching by \u003ccode\u003eemployee_id\u003c/code\u003e alone is like finding everyone named \u0026quot;Ada\u0026quot; in a phone book: the matches are scattered, so the index can\u0026#39;t narrow the search.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eCan you find everyone called \u003cem\u003eSarah\u003c/em\u003e quickly in a phone book sorted by surname?\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eWHERE employee_id = 9\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEmployee 9 could be in any subsidiary, so the database would have to read the whole index (or the tab
