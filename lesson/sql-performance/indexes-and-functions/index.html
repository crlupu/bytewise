gs\":[\"databases\",\"sql\",\"indexes\",\"function-based index\",\"like\",\"case-insensitive\",\"sargable\"],\"sources\":[{\"book\":\"sql-performance-explained\",\"ref\":\"Chapter 2, The Where Clause — Functions and LIKE\"}],\"requires\":[\"sql-performance/concatenated-indexes\"],\"steps\":8,\"stepKeys\":[\"sql-performance/indexes-and-functions/step-1\",\"sql-performance/indexes-and-functions/step-2\",\"sql-performance/indexes-and-functions/step-3\",\"sql-performance/indexes-and-functions/step-4\",\"sql-performance/indexes-and-functions/step-5\",\"sql-performance/indexes-and-functions/step-6\",\"sql-performance/indexes-and-functions/step-7\",\"sql-performance/indexes-and-functions/step-8\"],\"exercises\":[\"sql-performance/indexes-and-functions/step-2\",\"sql-performance/indexes-and-functions/step-3\",\"sql-performance/indexes-and-functions/step-5\",\"sql-performance/indexes-and-functions/step-7\",\"sql-performance/indexes-and-functions/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"sql-performance/indexes-and-functions/step-1\",\"title\":\"Functions hide the column\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"sql-performance/indexes-and-functions/step-2\",\"prompt\":\"\u003cp\u003eThere\u0026#39;s an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003elast_name\u003c/code\u003e. How do you make case-insensitive search by \u003ccode\u003eUPPER(last_name)\u003c/code\u003e use an index?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA \u003cstrong\u003efunction-based\u003c/strong\u003e (or expression) index stores \u003ccode\u003eUPPER(last_name)\u003c/code\u003e already computed and sorted.\\nThe query must then use exactly the same expression.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Wrap the search value in \u003ccode\u003eUPPER\u003c/code\u003e too\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe search value isn\u0026#39;t the problem. The function on the \u003cem\u003ecolumn\u003c/em\u003e is.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — the optimizer will apply \u003ccode\u003eUPPER\u003c/code\u003e to the existing index\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe index is sorted by the original values; \u003ccode\u003eUPPER\u003c/code\u003e can reorder them.\u003c/p\u003e\\n\"},{\"html\":\"Create an index on the expression itself — \u003ccode\u003eCREATE INDEX ... ON employees (UPPER(last_name))\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-3\",\"key\":\"sql-performance/indexes-and-functions/step-3\",\"prompt\":\"\u003cp\u003eWhich of these can use a plain \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003esale_date\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eExpress conditions as a range on the \u003cstrong\u003ebare column\u003c/strong\u003e. That\u0026#39;s what \u0026quot;\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sargable\\\" data-def=\\\"A condition the database can use an index for. Wrapping the indexed column in a function, like \u0026lt;code\u0026gt;YEAR(date) = 2026\u0026lt;/code\u0026gt;, usually makes it non-sargable.\\\" data-book=\\\"SQL Performance Explained\\\"\u003esargable\u003c/button\u003e\u0026quot; (search-argument-able) means.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAn index on \u003ccode\u003esale_date\u003c/code\u003e is sorted by the raw column value.\u003c/p\u003e\\n\u003cp\u003eA condition like \u003ccode\u003eDATE(sale_date) = \u0026#39;2026-10-04\u0026#39;\u003c/code\u003e or \u003ccode\u003eTRUNC(sale_date)\u003c/code\u003e applies a function to every row\u0026#39;s value, and the index isn\u0026#39;t sorted by the function\u0026#39;s result, so it can\u0026#39;t be used.\u003c/p\u003e\\n\u003cp\u003eWriting the condition as a half-open range on the bare column — from midnight up to, but not including, the next midnight — reads exactly one slice of the index.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLeave the column bare, and move the work to the other side of the comparison.\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eWHERE EXTRACT(YEAR FROM sale_date) = 2026\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eRewrite it as a range on \u003ccode\u003esale_date\u003c/code\u003e itself instead.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eWHERE CAST(sale_date AS DATE) = \u0026#39;2026-10-04\u0026#39;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA function on the column hides it from the index — even a harmless-looking cast.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eWHERE sale_date \u0026gt;= \u0026#39;2026-10-04\u0026#39; AND sale_date \u0026lt; \u0026#39;2026-10-05\u0026#39;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"sql-performance/indexes-and-functions/step-4\",\"title\":\"LIKE stops at the first wildcard\",\"body\":\"\u003ctable\u003e\\n\u003cthead\u003e\\n\u003ctr\u003e\\n\u003cth\u003ePattern\u003c/th\u003e\\n\u003cth\u003eWhat the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e can do\u003c/th\u003e\\n\u003c/tr\u003e\\n\u003c/thead\u003e\\n\u003ctbody\u003e\u003ctr\u003e\\n\u003ctd\u003e\u003ccode\u003e\u0026#39;WIN%\u0026#39;\u003c/code\u003e\u003c/td\u003e\\n\u003ctd\u003eJump to \u003cem\u003eWIN\u003c/em\u003e, read until it stops matching\u003c/td\u003e\\n\u003c/tr\u003e\\n\u003ctr\u003e\\n\u003ctd\u003e\u003ccode\u003e\u0026#39;W%ND\u0026#39;\u003c/code\u003e\u003c/td\u003e\\n\u003ctd\u003eJump to \u003cem\u003eW\u003c/em\u003e, then check every W name\u003c/td\u003e\\n\u003c/tr\u003e\\n\u003ctr\u003e\\n\u003ctd\u003e\u003ccode\u003e\u0026#39;%AND\u0026#39;\u003c/code\u003e\u003c/td\u003e\\n\u003ctd\u003eNothing\u003c/td\u003e\\n\u003c/tr\u003e\\n\u003c/tbody\u003e\u003c/table\u003e\\n\u003cp\u003eOnly the characters before the wildcard narrow the search.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"sql-performance/indexes-and-functions/step-5\",\"prompt\":\"\u003cp\u003eOrder these patterns from most selective \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e use to least.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe longer the prefix before the first \u003ccode\u003e%\u003c/code\u003e, the narrower the slice of the index that has to be read.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"\u003ccode\u003eLIKE \u0026#39;WINAND%\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eLIKE \u0026#39;WIN%\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eLIKE \u0026#39;W%\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eLIKE \u0026#39;%NAND\u0026#39;\u003c/code\u003e\"],\"start\":[1,3,0,2]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"sql-performance/indexes-and-functions/step-6\",\"title\":\"Hidden conversions\",\"body\":\"\u003cp\u003eComparing a text column with a number converts every value.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s a function on the column, too.\u003c/p\u003e\\n\u003cp\u003eMatch types, and keep the column bare.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"sql-performance/indexes-and-functions/step-7\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ephone\u003c/code\u003e is a \u003ccode\u003eVARCHAR\u003c/code\u003e column with an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e. Why might \u003ccode\u003eWHERE phone = 4155550100\u003c/code\u003e (a number, no quotes) ignore the index?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAn implicit conversion is a hidden function on the column. Compare with a value of the column\u0026#39;s own type — \u003ccode\u003e\u0026#39;4155550100\u0026#39;\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen you compare a text column to a number, the database must convert one side.\u003c/p\u003e\\n\u003cp\u003eMost convert the column, effectively evaluating \u003ccode\u003eTO_NUMBER(phone)\u003c/code\u003e for every row, which hides the column inside a function and rules out the index.\u003c/p\u003e\\n\u003cp\u003eIt can also fail on values that aren\u0026#39;t numeric. Comparing with a string literal, \u003ccode\u003e\u0026#39;4155550100\u0026#39;\u003c/code\u003e, keeps the column bare.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Indexes don\u0026#39;t work on long values\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Numbers can\u0026#39;t be compared with strings\",\"correct\":false,\"feedback\":\"\u003cp\u003eMany databases allow it — by converting implicitly, which is the problem.\u003c/p\u003e\\n\"},{\"html\":\"The database converts every \u003ccode\u003ephone\u003c/code\u003e value to a number to compare it — a function on the column\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-8\",\"key\":\"sql-performance/indexes-and-functions/step-8\",\"prompt\":\"\u003cp\u003eMatch each slow condition to its index-friendly rewrite.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eUPPER(name) = \u0026#39;ADA\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eYEAR(created) = 2026\u003c/code\u003e\",\"\u003ccode\u003eprice * 1.2 \u0026gt; 100\u003c/code\u003e\",\"\u003ccode\u003ecode = 42\u003c/code\u003e on a text column\"],\"right\":[\"An index on \u003ccode\u003eUPPER(name)\u003c/code\u003e\",\"\u003ccode\u003ecreated \u0026gt;= \u0026#39;2026-01-01\u0026#39; AND created \u0026lt; \u0026#39;2027-01-01\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eprice \u0026gt; 100 / 1.2\u003c/code\u003e\",\"\u003ccode\u003ecode = \u0026#39;42\u0026#39;\u003c/code\u003e\"],\"rightOrder\":[1,0,2,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points
