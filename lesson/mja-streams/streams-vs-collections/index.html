\",\"laziness\",\"internal iteration\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"Chapter 4, Introducing streams\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"mja-streams/streams-vs-collections/step-1\",\"mja-streams/streams-vs-collections/step-2\",\"mja-streams/streams-vs-collections/step-3\",\"mja-streams/streams-vs-collections/step-4\",\"mja-streams/streams-vs-collections/step-5\",\"mja-streams/streams-vs-collections/step-6\"],\"exercises\":[\"mja-streams/streams-vs-collections/step-3\",\"mja-streams/streams-vs-collections/step-5\",\"mja-streams/streams-vs-collections/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"mja-streams/streams-vs-collections/step-1\",\"title\":\"Describe the query, not the loop\",\"body\":\"\u003cp\u003eA stream pipeline says what you want: filter, map, collect.\u003c/p\u003e\\n\u003cp\u003eThe library does the looping, called \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Internal iteration\\\" data-def=\\\"The library loops over the data for you, as streams do. You describe what to do with each element, not how to step through them.\\\" data-book=\\\"Modern Java in Action\\\"\u003einternal iteration\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eThat leaves it free to reorder, fuse or parallelize the work.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"mja-streams/streams-vs-collections/step-2\",\"title\":\"Nothing runs until the end\",\"body\":\"\u003cp\u003e\u003ccode\u003efilter\u003c/code\u003e and \u003ccode\u003emap\u003c/code\u003e are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intermediate operation\\\" data-def=\\\"A stream operation, like \u0026lt;code\u0026gt;filter\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;map\u0026lt;/code\u0026gt;, that returns another stream. It does nothing until a terminal operation runs.\\\" data-book=\\\"Modern Java in Action\\\"\u003eintermediate operations\u003c/button\u003e; they return a stream.\u003c/p\u003e\\n\u003cp\u003eThey do nothing until a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Terminal operation\\\" data-def=\\\"A stream operation, like \u0026lt;code\u0026gt;collect\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;forEach\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;findFirst\u0026lt;/code\u0026gt;, that produces a result and runs the pipeline. The stream can\u0026amp;#39;t be used again afterwards.\\\" data-book=\\\"Modern Java in Action\\\"\u003eterminal operation\u003c/button\u003e, like \u003ccode\u003ecollect\u003c/code\u003e or \u003ccode\u003efindFirst\u003c/code\u003e, asks.\u003c/p\u003e\\n\u003cp\u003eThen each element flows through the whole pipeline, one at a time.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"mja-streams/streams-vs-collections/step-3\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThis is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Short-circuiting\\\" data-def=\\\"Stopping as soon as the answer is known — \u0026lt;code\u0026gt;findFirst\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;anyMatch\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;limit\u0026lt;/code\u0026gt; don\u0026amp;#39;t process the rest of the stream.\\\" data-book=\\\"Modern Java in Action\\\"\u003eshort-circuiting\u003c/button\u003e. Laziness means a stream does only the work the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Terminal operation\\\" data-def=\\\"A stream operation, like \u0026lt;code\u0026gt;collect\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;forEach\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;findFirst\u0026lt;/code\u0026gt;, that produces a result and runs the pipeline. The stream can\u0026amp;#39;t be used again afterwards.\\\" data-book=\\\"Modern Java in Action\\\"\u003eterminal operation\u003c/button\u003e needs.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eStreams are lazy and process elements one at a time through the whole pipeline.\u003c/p\u003e\\n\u003cp\u003e\u0026quot;a\u0026quot; is filtered out, \u0026quot;bb\u0026quot; passes the filter and is mapped, and \u003ccode\u003efindFirst\u003c/code\u003e has its answer — so \u0026quot;ccc\u0026quot; is never processed at all.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why \u0026quot;fccc\u0026quot; never prints. A loop with \u003ccode\u003ebreak\u003c/code\u003e would do the same; streams get it automatically from laziness and short-circuiting.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003efa fbb mbb BB\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eBB\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003elambdas\u003c/button\u003e do print — but only for the elements actually processed.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003efa fbb fccc mbb mccc BB\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eElements go through the pipeline one at a time, and \u003ccode\u003efindFirst\u003c/code\u003e stops as soon as it has one. \u003ccode\u003eccc\u003c/code\u003e is never touched.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"mja-streams/streams-vs-collections/step-4\",\"title\":\"A stream is used once\",\"body\":\"\u003cp\u003eA stream can be traversed only once.\u003c/p\u003e\\n\u003cp\u003eA second \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Terminal operation\\\" data-def=\\\"A stream operation, like \u0026lt;code\u0026gt;collect\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;forEach\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;findFirst\u0026lt;/code\u0026gt;, that produces a result and runs the pipeline. The stream can\u0026amp;#39;t be used again afterwards.\\\" data-book=\\\"Modern Java in Action\\\"\u003eterminal operation\u003c/button\u003e throws \u003ccode\u003eIllegalStateException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eGet a new stream from the source instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"mja-streams/streams-vs-collections/step-5\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"The names print once, then \u003ccode\u003eIllegalStateException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The names print twice\",\"correct\":false,\"feedback\":\"\u003cp\u003eA stream is consumed by its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Terminal operation\\\" data-def=\\\"A stream operation, like \u0026lt;code\u0026gt;collect\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;forEach\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;findFirst\u0026lt;/code\u0026gt;, that produces a result and runs the pipeline. The stream can\u0026amp;#39;t be used again afterwards.\\\" data-book=\\\"Modern Java in Action\\\"\u003eterminal operation\u003c/button\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":fal
