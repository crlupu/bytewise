igher-order function\\\" data-def=\\\"A function that takes a function as an argument or returns one, like \u0026lt;code\u0026gt;Comparator.comparing\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;Stream.map\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Modern Java in Action\\\"\u003ehigher-order functions\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eMath.sqrt(double)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt takes and returns a number.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eComparator.comparing(Function)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eStream.map(Function)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"mja-functional/functional-techniques/step-3\",\"title\":\"Currying\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Currying\\\" data-def=\\\"Turning a function of several arguments into a chain of one-argument functions, \u0026lt;code\u0026gt;x -\u0026amp;gt; y -\u0026amp;gt; x + y\u0026lt;/code\u0026gt;, so you can fix the first argument early.\\\" data-book=\\\"Modern Java in Action\\\"\u003ecurried\u003c/button\u003e function takes its arguments one at a time.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ex -\u0026gt; y -\u0026gt; x + y\u003c/code\u003e takes \u003ccode\u003ex\u003c/code\u003e and returns a function waiting for \u003ccode\u003ey\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eFixing the first argument gives a reusable function.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"mja-functional/functional-techniques/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eadd\u003c/code\u003e is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Currying\\\" data-def=\\\"Turning a function of several arguments into a chain of one-argument functions, \u0026lt;code\u0026gt;x -\u0026amp;gt; y -\u0026amp;gt; x + y\u0026lt;/code\u0026gt;, so you can fix the first argument early.\\\" data-book=\\\"Modern Java in Action\\\"\u003ecurried\u003c/button\u003e function: given \u003ccode\u003ex\u003c/code\u003e, it returns another function waiting for \u003ccode\u003ey\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eadd.apply(3)\u003c/code\u003e returns \u003ccode\u003ey -\u0026gt; 3 + y\u003c/code\u003e, a function with 3 fixed — called partial application.\u003c/p\u003e\\n\u003cp\u003eApplying that to 4 gives 7. Curried functions make it easy to build specialized functions from general ones.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"3\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eadd.apply(3)\u003c/code\u003e is a function; applying it to 4 adds them.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003eLambdas\u003c/button\u003e can return lambdas.\u003c/p\u003e\\n\"},{\"html\":\"7\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"mja-functional/functional-techniques/step-5\",\"title\":\"Recursion and laziness\",\"body\":\"\u003cp\u003eFunctional code prefers recursion to loops over mutable counters.\u003c/p\u003e\\n\u003cp\u003eJava doesn\u0026#39;t optimize tail calls, so deep recursion can overflow the stack.\u003c/p\u003e\\n\u003cp\u003eStreams give laziness: elements are computed only when needed.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"mja-functional/functional-techniques/step-6\",\"prompt\":\"\u003cp\u003eWhy is \u003ccode\u003eIntStream.rangeClosed(1, n).reduce(1, (a, b) -\u0026gt; a * b)\u003c/code\u003e safer than a recursive factorial in Java for large \u003ccode\u003en\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eEach recursive call adds a stack frame, and the JVM doesn\u0026#39;t perform tail-call optimization, even when the recursive call is the last thing a function does.\u003c/p\u003e\\n\u003cp\u003eA recursive factorial of a large \u003ccode\u003en\u003c/code\u003e therefore throws \u003ccode\u003eStackOverflowError\u003c/code\u003e once the stack fills up, typically after some thousands of calls.\u003c/p\u003e\\n\u003cp\u003eA stream reduction or loop uses constant stack space.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Recursion uses a stack frame per call, and Java has no tail-call optimization\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Streams use less memory per multiplication\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe arithmetic is the same; the difference is the call stack.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"mja-functional/functional-techniques/step-7\",\"prompt\":\"\u003cp\u003e\u003ccode\u003econvert\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Currying\\\" data-def=\\\"Turning a function of several arguments into a chain of one-argument functions, \u0026lt;code\u0026gt;x -\u0026amp;gt; y -\u0026amp;gt; x + y\u0026lt;/code\u0026gt;, so you can fix the first argument early.\\\" data-book=\\\"Modern Java in Action\\\"\u003ecurried\u003c/button\u003e: \u003ccode\u003eFunction\u0026lt;Double, Function\u0026lt;Double, Double\u0026gt;\u0026gt; convert = factor -\u0026gt; x -\u0026gt; x * factor;\u003c/code\u003e\\nFix its first argument to get a kilometres-to-miles converter.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Function\u003cDouble, Double\u003e kmToMiles = convert.\"},{\"answers\":[\"apply\"],\"size\":5,\"choices\":[\"plusDays\",\"ArrayList\",\"0\",\"apply\"]},{\"text\":\"(0.621371);\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Functional programming in Java\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.
