le=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003egetInstance\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e() { \u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003ereturn\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e INSTANCE; } \u003c/span\u003e\u003cspan style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D\"\u003e// factory\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003epublic\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003e enum\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e Elvis\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e { \u003c/span\u003e\u003cspan style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"\u003eINSTANCE\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e; }                      \u003c/span\u003e\u003cspan style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D\"\u003e// enum\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eAll three hide or avoid a public constructor.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"singletons\",\"courseId\":\"ej-objects\",\"topicId\":\"effective-java\",\"key\":\"ej-objects/singletons\",\"title\":\"Singletons\",\"summary\":\"Three ways to guarantee one instance — and why a one-element enum is usually the best.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"singleton\",\"enum\",\"serialization\",\"reflection\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 3\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-objects/singletons/step-1\",\"ej-objects/singletons/step-2\",\"ej-objects/singletons/step-3\",\"ej-objects/singletons/step-4\",\"ej-objects/singletons/step-5\",\"ej-objects/singletons/step-6\"],\"exercises\":[\"ej-objects/singletons/step-3\",\"ej-objects/singletons/step-4\",\"ej-objects/singletons/step-5\",\"ej-objects/singletons/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-objects/singletons/step-1\",\"title\":\"Three ways to make a singleton\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"ej-objects/singletons/step-2\",\"title\":\"The enum is the safest\",\"body\":\"\u003cp\u003eReflection can call a private constructor.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deserialization\\\" data-def=\\\"Turning a byte stream back into objects. Acts as a hidden constructor that attackers can feed any bytes to.\\\" data-book=\\\"Effective Java\\\"\u003eDeserialization\u003c/button\u003e can create a second copy.\u003c/p\u003e\\n\u003cp\u003eA single-element enum is protected from both, for free.\u003c/p\u003e\\n\u003cp\u003eThe factory version keeps one option open: you can drop the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003esingleton\u003c/button\u003e later.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"ej-objects/singletons/step-3\",\"prompt\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003esingleton\u003c/button\u003e is a \u003ccode\u003epublic static final\u003c/code\u003e field (approach 1) or a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003estatic factory\u003c/button\u003e over a private field (approach 2), each with a private constructor. Which can still create a second instance?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eClass-based singletons need extra defences — a constructor that throws on a second call, and \u003ccode\u003ereadResolve\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA private constructor stops ordinary code, but reflection can call it after \u003ccode\u003esetAccessible(true)\u003c/code\u003e, creating a second instance.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eSerialization\u003c/button\u003e is another route: deserializing creates a new object without calling the constructor, so each deserialized copy is a new \u0026quot;singleton\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eClass-based singletons defend with a constructor that throws on a second call and a \u003ccode\u003ereadResolve\u003c/code\u003e that returns the real instance.\u003c/p\u003e\\n\u003cp\u003eAn enum singleton needs neither: the JVM forbids reflective creation of enum instances and deserializes enum constants to the existing ones.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Deserializing a serialized instance, unless \u003ccode\u003ereadResolve\u003c/code\u003e is added\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Calling \u003ccode\u003egetInstance()\u003c/code\u003e twice\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat returns the same instance both times.\u003c/p\u003e\\n\"},{\"html\":\"Reflection calling the private constructor with \u003ccode\u003esetAccessible(true)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"readResolve\\\" data-def=\\\"A serialization hook that lets a class replace the deserialized object with another, e.g. the one true singleton instance.\\\" data-book=\\\"Effective Java\\\"\u003ereadResolve\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"ej-objects/singletons/step-4\",\"prompt\":\"\u003cp\u003eWhy is the single-element enum usually the best approach?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe only case it doesn\u0026#39;t fit is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003esingleton\u003c/button\u003e that must extend a superclass other than \u003ccode\u003eEnum\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The JVM guarantees one instance, even against reflection and serialization, for free\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Enums are faster than classes\",\"correct\":false,\"feedback\":\"\u003cp\u003eSpeed isn\u0026#39;t the point; the guarantees are.\u003c/p\u003e\\n\"},{\"html\":\"Enums can extend any superclass\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe opposite — an enum can\u0026#39;t extend a class, which is this approach\u0026#39;s one limitation.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eSerialization\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"ej-objects/singletons/step-5\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s an advantage of the static-factory approach over the public field?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA method hides the decision; a public field commits to it forever.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s the only one that\u0026#39;s thread-safe\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth initialise in a static field, which the JVM makes thread-safe.\u003c/p\u003e\\n\"},{\"html\":\"You can later stop it being a singleton — say, one instance per thread — without changing the API\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Singleton\\\" data-def=\\\"A class that is instantiated exactly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; fie
