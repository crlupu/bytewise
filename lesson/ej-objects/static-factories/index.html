ts/static-factories/step-4\",\"ej-objects/static-factories/step-6\",\"ej-objects/static-factories/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-objects/static-factories/step-1\",\"title\":\"Constructors have fixed rules\",\"body\":\"\u003cp\u003eA constructor always has the class\u0026#39;s name.\u003c/p\u003e\\n\u003cp\u003eIt always creates a new object.\u003c/p\u003e\\n\u003cp\u003eAnd it always returns exactly that class.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"ej-objects/static-factories/step-2\",\"title\":\"Static factories are more flexible\",\"body\":\"$13\",\"diagram\":\"$14\"},{\"id\":\"step-3\",\"key\":\"ej-objects/static-factories/step-3\",\"prompt\":\"\u003cp\u003eWhich of these can a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003estatic factory method\u003c/button\u003e do that a constructor can\u0026#39;t?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNames, caching and subtypes are the big three. A factory can also choose the returned class from its arguments —\\n\u003ccode\u003eEnumSet.noneOf\u003c/code\u003e picks a small or large implementation depending on the enum\u0026#39;s size.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Be called without naming the class\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth are called through the class — \u003ccode\u003enew Foo()\u003c/code\u003e and \u003ccode\u003eFoo.of()\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Return an existing, cached instance instead of a new one\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Return an object of a subtype, even a non-public one\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Have a descriptive name, like \u003ccode\u003efromString\u003c/code\u003e or \u003ccode\u003eprobablePrime\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"id\":\"step-4\",\"key\":\"ej-objects/static-factories/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBoolean.valueOf\u003c/code\u003e returns \u003ccode\u003eBoolean.TRUE\u003c/code\u003e or \u003ccode\u003eBoolean.FALSE\u003c/code\u003e, so both variables hold the very same object.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eBoolean.valueOf(String)\u003c/code\u003e parses the string case-insensitively and returns one of two pre-made constants, \u003ccode\u003eBoolean.TRUE\u003c/code\u003e or \u003ccode\u003eBoolean.FALSE\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eBoth calls return \u003ccode\u003eBoolean.TRUE\u003c/code\u003e, so \u003ccode\u003ea\u003c/code\u003e and \u003ccode\u003eb\u003c/code\u003e refer to the same object and \u003ccode\u003e==\u003c/code\u003e is true.\u003c/p\u003e\\n\u003cp\u003eThis is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003estatic factory\u003c/button\u003e\u0026#39;s caching at work: no new objects, ever. \u003ccode\u003enew Boolean(\u0026quot;true\u0026quot;)\u003c/code\u003e — now deprecated — would have created a new object on every call.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003evalueOf\u003c/code\u003e doesn\u0026#39;t create objects — it returns one of two shared constants.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"ej-objects/static-factories/step-5\",\"title\":\"Names and costs\",\"body\":\"\u003cp\u003eFactories use conventional names: \u003ccode\u003efrom\u003c/code\u003e, \u003ccode\u003eof\u003c/code\u003e, \u003ccode\u003evalueOf\u003c/code\u003e, \u003ccode\u003egetInstance\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWithout a public constructor, the class can\u0026#39;t be subclassed.\u003c/p\u003e\\n\u003cp\u003eFactories are also harder to spot in the API docs.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"ej-objects/static-factories/step-6\",\"prompt\":\"\u003cp\u003eMatch each conventional factory name to what it signals.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003efrom\u003c/code\u003e\",\"\u003ccode\u003eof\u003c/code\u003e\",\"\u003ccode\u003egetInstance\u003c/code\u003e\",\"\u003ccode\u003enewInstance\u003c/code\u003e\"],\"right\":[\"Converts a single argument of another type\",\"Aggregates several values into one instance\",\"Returns an instance that may be shared\",\"Guarantees a fresh instance on every call\"],\"rightOrder\":[3,0,2,1]},{\"id\":\"step-7\",\"key\":\"ej-objects/static-factories/step-7\",\"prompt\":\"\u003cp\u003eWhat are the costs of providing only \u00
