=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003egarbage collector\u003c/button\u003e reclaim popped objects?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThose references are \u003cstrong\u003eobsolete\u003c/strong\u003e — they\u0026#39;ll never be dereferenced again — but the GC can\u0026#39;t know that.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe stack keeps elements in an array and tracks how many are in use with \u003ccode\u003esize\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003ePopping decrements \u003ccode\u003esize\u003c/code\u003e but leaves the reference in the array slot, so the object is still reachable from the stack and can never be collected.\u003c/p\u003e\\n\u003cp\u003eThe garbage collector can\u0026#39;t know that slots past \u003ccode\u003esize\u003c/code\u003e are logically dead — only the programmer does.\u003c/p\u003e\\n\u003cp\u003eClasses that manage their own memory, like this one, are where \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Memory leak\\\" data-def=\\\"In Java, objects that are no longer needed but stay reachable — from a cache, a listener list, or a stale array slot — so the garbage collector can never free them.\\\" data-book=\\\"Effective Java\\\"\u003ememory leaks\u003c/button\u003e hide.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"The GC never collects objects stored in arrays\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt collects anything unreachable. These are still reachable through the array.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003epop\u003c/code\u003e returns a copy, not the original\",\"correct\":false,\"feedback\":\"\u003cp\u003eJava returns the reference itself.\u003c/p\u003e\
