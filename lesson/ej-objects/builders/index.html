rt\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"ej-objects/builders/step-2\",\"title\":\"A builder names every argument\",\"body\":\"$14\",\"diagram\":\"$15\"},{\"id\":\"step-3\",\"key\":\"ej-objects/builders/step-3\",\"prompt\":\"\u003cp\u003eMatch each approach to its main weakness.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eTelescoping constructors force callers to pass values by position, so \u003ccode\u003enew NutritionFacts(240, 8, 100, 0, 35, 27)\u003c/code\u003e compiles even with two numbers swapped.\u003c/p\u003e\\n\u003cp\u003eJavaBeans setters fix readability but let the object be used before all setters are called, and rule out immutability.\u003c/p\u003e\\n\u003cp\u003eA builder gives named, optional parameters and a single \u003ccode\u003ebuild()\u003c/code\u003e that validates everything before creating an immutable object; the price is an extra class and a little more code.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Telescoping constructors\",\"JavaBeans (no-arg constructor + setters)\",\"Builder\"],\"right\":[\"Long runs of unnamed arguments that are easy to swap by mistake\",\"The object exists half-built and can\u0026#39;t be immutable\",\"Slightly more code, and one extra object per construction\"],\"rightOrder\":[2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Telescoping constructor\\\" data-def=\\\"A chain of constructors, each adding one more optional parameter — \u0026lt;code\u0026gt;Pizza(size)\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;Pizza(size, cheese)\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;Pizza(size, cheese, ham)\u0026lt;/code\u0026gt;… Hard to read and easy to call with arguments in the wrong order.\\\" data-book=\\\"Effective Java\\\"\u003eTelescoping constructor\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JavaBeans pattern\\\" data-def=\\\"Create an object with a no-argument constructor, then call a setter for each field. Readable, but the object is in an inconsistent state mid-construction and can\u0026amp;#39;t be immutable.\\\" data-book=\\\"Effective Java\\\"\u003eJavaBeans pattern\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Builder pattern\\\" data-def=\\\"A helper object that collects parameters through named, chainable methods and then calls \u0026lt;code\u0026gt;build()\u0026lt;/code\u0026gt; to create the real object. Readable like setters, safe like constructors.\\\" data-book=\\\"Effective Java\\\"\u003eBuilder pattern\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"ej-objects/builders/step-4\",\"prompt\":\"\u003cp\u003ePut the steps of using a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Builder pattern\\\" data-def=\\\"A helper object that collects parameters through named, chainable methods and then calls \u0026lt;code\u0026gt;build()\u0026lt;/code\u0026gt; to create the real object. Readable like setters, safe like constructors.\\\" data-book=\\\"Effective Java\\\"\u003ebuilder\u003c/button\u003e in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRequired values up front, optional ones by name, validation in one place.\u003c/p\u003e\\n\",\"details\":\"
