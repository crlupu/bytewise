90\",\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"mlfq\",\"courseId\":\"cpu-scheduling\",\"topicId\":\"operating-systems\",\"key\":\"cpu-scheduling/mlfq\",\"title\":\"The multi-level feedback queue\",\"summary\":\"A scheduler that learns from the past which jobs are interactive — and the rules that keep it fair.\",\"duration\":8,\"tags\":[\"operating systems\",\"scheduling\",\"mlfq\",\"priority\",\"starvation\",\"gaming\",\"priority boost\"],\"sources\":[{\"book\":\"ostep\",\"ref\":\"Chapter 8, Scheduling: The Multi-Level Feedback Queue\"}],\"requires\":[\"cpu-scheduling/round-robin\"],\"steps\":9,\"stepKeys\":[\"cpu-scheduling/mlfq/step-1\",\"cpu-scheduling/mlfq/step-2\",\"cpu-scheduling/mlfq/step-3\",\"cpu-scheduling/mlfq/step-4\",\"cpu-scheduling/mlfq/step-5\",\"cpu-scheduling/mlfq/step-6\",\"cpu-scheduling/mlfq/step-7\",\"cpu-scheduling/mlfq/step-8\",\"cpu-scheduling/mlfq/step-9\"],\"exercises\":[\"cpu-scheduling/mlfq/step-2\",\"cpu-scheduling/mlfq/step-4\",\"cpu-scheduling/mlfq/step-6\",\"cpu-scheduling/mlfq/step-7\",\"cpu-scheduling/mlfq/step-8\",\"cpu-scheduling/mlfq/step-9\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"cpu-scheduling/mlfq/step-1\",\"title\":\"Learn from behaviour\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"MLFQ\\\" data-def=\\\"Several priority queues; jobs that use their whole time slice drop to a lower priority, so interactive jobs stay high. Periodic boosts prevent starvation.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eMLFQ\u003c/button\u003e has several queues, one per priority.\u003c/p\u003e\\n\u003cp\u003eHigher queues run first.\u003c/p\u003e\\n\u003cp\u003eJobs in the same queue take turns.\u003c/p\u003e\\n\u003cp\u003eJobs move between queues as they run.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"cpu-scheduling/mlfq/step-2\",\"prompt\":\"\u003cp\u003eFollow a long, CPU-hungry job through \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"MLFQ\\\" data-def=\\\"Several priority queues; jobs that use their whole time slice drop to a lower priority, so interactive jobs stay high. Periodic boosts prevent starvation.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eMLFQ\u003c/button\u003e. Put its life in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Scheduler\\\" data-def=\\\"The part of the OS that decides which ready process runs next, and for how long.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003escheduler\u003c/button\u003e assumes every job might be short; jobs that prove otherwise drift down.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"It enters at the highest priority, like every new job\",\"It uses up its time allotment at that level\",\"It is moved down one queue\",\"It keeps sinking until it runs at the lowest priority\"],\"start\":[2,1,0,3]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"cpu-scheduling/mlfq/step-3\",\"title\":\"Demote CPU hogs\",\"body\":\"\u003cp\u003eNew jobs start at the top.\u003c/p\u003e\\n\u003cp\u003eUse up your time allotment, and you drop a level.\u003c/p\u003e\\n\u003cp\u003eInteractive jobs stay near the top.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"cpu-scheduling/mlfq/step-4\",\"prompt\":\"\u003cp\u003eAn editor waits for keystrokes, running for a millisecond each time. Where does it stay?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eInteractive jobs stay high and get the CPU quickly when they need it — good \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Response time\\\" data-def=\\\"Time from when a job arrives until it first gets to run. What makes a system feel interactive.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eresponse time\u003c/button\u003e without being told they\u0026#39;re interactive.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"At the bottom — it has been in the system the longest\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"MLFQ\\\" data-def=\\\"Several priority queues; jobs that use their whole time slice drop to a lower priority, so interactive jobs stay high. Periodic boosts prevent starvation.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eMLFQ\u003c/button\u003e judges by CPU use, not age.\u003c/p\u003e\\n\"},{\"html\":\"Near the top — it never uses up its allotment, so it isn\u0026#39;t demoted\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"cpu-scheduling/mlfq/step-5\",\"title\":\"Boost and account\",\"body\":\"\u003cp\u003eEvery so often, boost all jobs back to the top.\u003c/p\u003e\\n\u003cp\u003eThat prevents starvation.\u003c/p\u003e\\n\u003cp\u003eCount total CPU time per level, so jobs can\u0026#39;t game it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"cpu-scheduling/mlfq/step-6\",\"prompt\":\"\u003cp\u003eMatch each rule to the problem it solves.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"New jobs start at the top\",\"Demote after using the allotment\",\"Periodic priority boost\",\"Count total CPU use at a level\"],\"right\":[\"Short jobs finish quickly without being identified in advance\",\"Long CPU-bound jobs stop hogging high priority\",\"Starvation of jobs at the bottom\",\"Gaming the scheduler with well-timed I/O\"],\"rightOrder\":[3,1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Priority boost\\\" data-def=\\\"Periodically moving all jobs back to the top queue in MLFQ, so long-running jobs aren\u0026amp;#39;t starved.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003ePriority boost\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Scheduler\\\" data-def=\\\"The part of the OS that decides which ready process runs next, and for how long.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eScheduler\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"cpu-scheduling/mlfq/step-7\",\"prompt\":\"\u003cp\u003eA job does compute-heavy work for a minute, then becomes interactive. Without the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Priority boost\\\" data-def=\\\"Periodically moving all jobs back to the top queue in MLFQ, so long-running jobs aren\u0026amp;#39;t starved.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003epriority boost\u003c/button\u003e, what happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe boost also handles jobs that change behaviour, not just starvation.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eOnce a job sinks to the lowest queue, it only runs when higher queues are empty.\u003c/p\u003e\\n\u003cp\u003eIf it becomes interactive, its short bursts still sit at the bottom, waiting behind every higher-priority job — so its new phase gets poor \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Response time\\\" data-def=\\\"Time from when a job arrives until it first gets to
