steps\":10,\"stepKeys\":[\"cpu-scheduling/fifo-sjf-stcf/step-1\",\"cpu-scheduling/fifo-sjf-stcf/step-2\",\"cpu-scheduling/fifo-sjf-stcf/step-3\",\"cpu-scheduling/fifo-sjf-stcf/step-4\",\"cpu-scheduling/fifo-sjf-stcf/step-5\",\"cpu-scheduling/fifo-sjf-stcf/step-6\",\"cpu-scheduling/fifo-sjf-stcf/step-7\",\"cpu-scheduling/fifo-sjf-stcf/step-8\",\"cpu-scheduling/fifo-sjf-stcf/step-9\",\"cpu-scheduling/fifo-sjf-stcf/step-10\"],\"exercises\":[\"cpu-scheduling/fifo-sjf-stcf/step-2\",\"cpu-scheduling/fifo-sjf-stcf/step-4\",\"cpu-scheduling/fifo-sjf-stcf/step-5\",\"cpu-scheduling/fifo-sjf-stcf/step-7\",\"cpu-scheduling/fifo-sjf-stcf/step-8\",\"cpu-scheduling/fifo-sjf-stcf/step-9\",\"cpu-scheduling/fifo-sjf-stcf/step-10\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"cpu-scheduling/fifo-sjf-stcf/step-1\",\"title\":\"Measuring a scheduler\",\"body\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Scheduler\\\" data-def=\\\"The part of the OS that decides which ready process runs next, and for how long.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003escheduler\u003c/button\u003e picks which ready job runs next.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Turnaround time\\\" data-def=\\\"Time from when a job arrives until it completes.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eTurnaround time\u003c/button\u003e = completion time − arrival time.\u003c/p\u003e\\n\u003cp\u003eFor now, assume we know how long each job runs.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"cpu-scheduling/fifo-sjf-stcf/step-2\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e\u003c/strong\u003e runs jobs in arrival order. Three jobs arrive together, each needing 10 ticks.\\nPlay the schedule to the end.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e(10 + 20 + 30) ÷ 3 = 20. With equal jobs, FIFO is perfectly reasonable.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"scheduler\",\"config\":{\"jobs\":[{\"name\":\"A\",\"arrival\":0,\"burst\":10},{\"name\":\"B\",\"arrival\":0,\"burst\":10},{\"name\":\"C\",\"arrival\":0,\"burst\":10}],\"algorithms\":[\"FIFO\"]},\"goal\":{\"algorithm\":\"FIFO\"},\"question\":{\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the average \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Turnaround time\\\" data-def=\\\"Time from when a job arrives until it completes.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eturnaround\u003c/button\u003e?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s only A\u0026#39;s. B finishes at 20 and C at 30.\u003c/p\u003e\\n\"},{\"html\":\"20\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"30\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s C\u0026#39;s alone.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"cpu-scheduling/fifo-sjf-stcf/step-3\",\"title\":\"Short jobs first\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e lets a long job hold up short ones.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SJF\\\" data-def=\\\"Run the shortest job first. Minimizes average turnaround if all jobs arrive at once.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eSJF\u003c/button\u003e runs the shortest job first.\u003c/p\u003e\\n\u003cp\u003eThat minimizes average \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Turnaround time\\\" data-def=\\\"Time from when a job arrives until it completes.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eturnaround\u003c/button\u003e, if all arrive together.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"cpu-scheduling/fifo-sjf-stcf/step-4\",\"prompt\":\"\u003cp\u003eJob A is long — 30 ticks — and B and C need only 5 each. All arrive at time 0, A first.\\nCompare \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e\u003c/strong\u003e with \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SJF\\\" data-def=\\\"Run the shortest job first. Minimizes average turnaround if all jobs arrive at once.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eSJF\u003c/button\u003e\u003c/strong\u003e (shortest job first), and get the average \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Turnaround time\\\" data-def=\\\"Time from when a job arrives until it completes.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eturnaround\u003c/button\u003e to \u003cstrong\u003e20 or less\u003c/strong\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFIFO averages 35; SJF, 18.3. Short jobs stuck behind a long one is the \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Convoy effect\\\" data-def=\\\"Short jobs stuck waiting behind one long job, like cars behind a truck.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003econvoy effect\u003c/button\u003e\u003c/strong\u003e — like a queue at\\nthe till behind someone with a full trolley.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eSwitch to SJF, then play it through.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"scheduler\",\"config\":{\"jobs\":[{\"name\":\"A\",\"arrival\":0,\"burst\":30},{\"name\":\"B\",\"arrival\":0,\"burst\":5},{\"name\":\"C\",\"arrival\":0,\"burst\":5}],\"algorithms\":[\"FIFO\",\"SJF\"]},\"goal\":{\"avgTurnaroundAtMost\":20},\"question\":{\"prompt\":\"\u003cp\u003eWhy is FIFO so much worse here?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"The short jobs wait behind the long one\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"FIFO wastes CPU time between jobs\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe CPU is busy the whole time under both policies. Only the order differs.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"id\":\"step-5\",\"key\":\"cpu-scheduling/fifo-sjf-stcf/step-5\",\"prompt\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SJF\\\" data-def=\\\"Run the shortest job first. Minimizes average turnaround if all jobs arrive at once.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eSJF\u003c/button\u003e minimises average \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Turnaround time\\\" data-def=\\\"Time from when a job arrives until it completes.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eturnaround\u003c/button\u003e when all jobs arrive together. Job A needs 30 ticks and arrives at 0; jobs B and C need 5 each and arrive at 4. What happens under SJF?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u0
