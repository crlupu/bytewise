oncurrency/document-thread-safety/step-4\",\"ej-concurrency/document-thread-safety/step-5\",\"ej-concurrency/document-thread-safety/step-7\",\"ej-concurrency/document-thread-safety/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-concurrency/document-thread-safety/step-1\",\"title\":\"Thread safety comes in levels\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e: no locking needed at all.\u003c/p\u003e\\n\u003cp\u003eUnconditionally thread-safe: safe as is.\u003c/p\u003e\\n\u003cp\u003eConditionally thread-safe: some sequences need the caller\u0026#39;s lock.\u003c/p\u003e\\n\u003cp\u003eNot thread-safe: the caller must synchronize everything.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-concurrency/document-thread-safety/step-2\",\"prompt\":\"\u003cp\u003eMatch each level of thread safety to an example.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Immutable\",\"Unconditionally thread-safe\",\"Conditionally thread-safe\",\"Not thread-safe\",\"Thread-hostile\"],\"right\":[\"\u003ccode\u003eString\u003c/code\u003e, \u003ccode\u003eLong\u003c/code\u003e, \u003ccode\u003eBigInteger\u003c/code\u003e — no synchronization needed\",\"\u003ccode\u003eAtomicLong\u003c/code\u003e, \u003ccode\u003eConcurrentHashMap\u003c/code\u003e — internally synchronized\",\"\u003ccode\u003eCollections.synchronized\u003c/code\u003e wrappers — iterators need external locking\",\"\u003ccode\u003eArrayList\u003c/code\u003e, \u003ccode\u003eHashMap\u003c/code\u003e — clients must synchronize\",\"Unsafe even with external synchronization — usually by modifying static data\"],\"rightOrder\":[3,1,4,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-concurrency/document-thread-safety/step-3\",\"title\":\"Say which level in the docs\",\"body\":\"\u003cp\u003e\u003ccode\u003esynchronized\u003c/code\u003e on a method is an implementation detail.\u003c/p\u003e\\n\u003cp\u003eWrite the safety level in the class\u0026#39;s documentation.\u003c/p\u003e\\n\u003cp\u003eIf clients must lock, say which lock.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-concurrency/document-thread-safety/step-4\",\"prompt\":\"\u003cp\u003eIs the \u003ccode\u003esynchronized\u003c/code\u003e modifier in a method\u0026#39;s Javadoc enough to document thread safety?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes\",\"correct\":false,\"feedback\":\"\u003cp\u003eJavadoc doesn\u0026#39;t even include it; and thread safety isn\u0026#39;t all-or-nothing.\u003c/p\u003e\\n\"},{\"html\":\"No — it\u0026#39;s an implementation detail, not part of the API, and doesn\u0026#39;t say what level of safety the class offers\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"ej-concurrency/document-thread-safety/step-5\",\"prompt\":\"\u003cp\u003eIterating over a \u003ccode\u003eCollections.synchronizedMap\u003c/code\u003e from several threads — what must the client do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eConditionally thread-safe classes must document which lock clients should hold for which sequences.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach method of the synchronized wrapper is atomic, but iteration is many calls: \u003ccode\u003eiterator()\u003c/code\u003e, then \u003ccode\u003ehasNext()\u003c/code\u003e and \u003ccode\u003enext()\u003c/code\u003e repeatedly.\u003c/p\u003e\\n\u003cp\u003eAnother thread can modify the map between those calls, causing \u003ccode\u003eConcurrentModificationException\u003c/code\u003e or skipped elements.\u003c/p\u003e\\n\u003cp\u003eThe wrapper uses the map object itself as its lock, so clients must hold \u003ccode\u003esynchronized (m)\u003c/code\u003e for the whole loop — not on the key set view, which is a different object.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why such classes are \u0026quot;conditionally thread-safe\u0026quot;: they\u0026#39;re safe only if callers follow documented locking rules.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Wrap the loop in \u003ccode\u003esynchronized (m) { ... }\u003c/code\u003e — locking the map, not the key set\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — the wrapper handles it\",\"correct\":false,\"feedback\":\"\u003cp\u003eIteration is a compound operation across many calls; the wrapper can\u0026#39;t lock around it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"ej-concurrency/document-thread-safety/step-6\",\"title\":\"Lock a private object\",\"body\":\"\u003cp\u003eA public lock can be grabbed by anyone.\u003c/p\u003e\\n\u003cp\u003eA private final lock object can\u0026#39;t.\u003c/p\u003e\\n\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003eprivate\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e final\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e Object lock \u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e=\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e new\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003e Object\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e();\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"ej-concurrency/document-thread-safety/step-7\",\"prompt\":\"\u003cp\u003eThe private lock object idiom.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eClients can\u0026#39;t reach the lock, so they can\u0026#39;t hold it forever — a denial-of-service that\u0026#39;s possible with a publicly accessible lock.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"private final Object \"},{\"answers\":[\"lock\"],\"size\":4,\"choices\":[\"lock\",\"current\",\"FieldHolder\",\"putIfAbsent\"]},{\"text\":\" = new Object();\\npublic void foo() { synchronized (\"},{\"answers\":[\"lock\"],\"size\":4,\"choices\":[\"putIfAbsent\",\"FieldHolder\",\"lock\",\"comparingInt\"]},{\"text\":\") { ... } }\\n\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-8\",\"key\":\"ej-concurrency/document-thread-safety/step-8\",\"prompt\":\"\u003cp\u003eWhy should the lock field be \u003ccode\u003efinal\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s required by the compiler\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Changing it by accident would make different threads synchronize on different objects\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Concurrency\",\"next\":{\"id\":\"lazy-initialization\",\"courseId\":\"ej-concurrency\",\"topicId\":\"effective-java\",\"key\":\"ej-concurrency/lazy-initialization\",\"title\":\"Use lazy initialization judiciously\",\"summary\":\"Most fields should be initialized normally; when lazy initialization helps, use the right idiom.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"concurrency\",\"lazy initialization\",\"double-check\",\"holder class\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 83\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"ej-concurrency/lazy-initialization/step-1\",\"ej-concurrency/lazy-initialization/step-2\",\"ej-concurrency/lazy-initialization/step-3\",\"ej-concurrency/lazy-initialization/step-4\",\"ej-concurrency/lazy-initialization/step-5\",\"ej-concurrency/lazy-initialization/step-6\"],\"exercises\":[\"ej-concurrency/lazy-initialization/step-3\",\"ej-concurrency/lazy-initialization/step-4\",\"ej-concurrency/lazy-initialization/step-6\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug L
