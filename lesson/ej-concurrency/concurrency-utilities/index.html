ccode\u003eConcurrentHashMap\u003c/code\u003e lets reads proceed without locking and spreads writes across bins, so many threads can work at once.\u003c/p\u003e\\n\u003cp\u003eIt also provides atomic compound operations like \u003ccode\u003eputIfAbsent\u003c/code\u003e, \u003ccode\u003ecomputeIfAbsent\u003c/code\u003e and \u003ccode\u003emerge\u003c/code\u003e, which a synchronized wrapper can only offer if every client remembers to lock around the whole check-then-act.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Synchronized maps aren\u0026#39;t thread-safe\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey are, but slowly — and compound actions still need external locking.\u003c/p\u003e\\n\"},{\"html\":\"A concurrent map is much faster under contention — one global lock serialises every access\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"ej-concurrency/concurrency-utilities/step-6\",\"title\":\"If you must use wait\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"ej-concurrency/concurrency-utilities/step-7\",\"prompt\":\"\u003cp\u003eTo time an interval, which is right?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003enanoTime\u003c/code\u003e is more accurate and unaffected by adjustments to the system clock.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eSystem.currentTimeMillis()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s wall-clock time, which can jump when the clock is adjusted.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eSystem.nanoTime()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle
