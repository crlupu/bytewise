ncy\",\"topicId\":\"effective-java\",\"key\":\"ej-concurrency/synchronize-shared-data\",\"title\":\"Synchronize access to shared mutable data\",\"summary\":\"Synchronization is for visibility as well as mutual exclusion — and volatile alone doesn't make ++ atomic.\",\"duration\":6,\"tags\":[\"java\",\"effective java\",\"concurrency\",\"synchronized\",\"volatile\",\"atomic\",\"visibility\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 78\"}],\"requires\":[],\"steps\":8,\"stepKeys\":[\"ej-concurrency/synchronize-shared-data/step-1\",\"ej-concurrency/synchronize-shared-data/step-2\",\"ej-concurrency/synchronize-shared-data/step-3\",\"ej-concurrency/synchronize-shared-data/step-4\",\"ej-concurrency/synchronize-shared-data/step-5\",\"ej-concurrency/synchronize-shared-data/step-6\",\"ej-concurrency/synchronize-shared-data/step-7\",\"ej-concurrency/synchronize-shared-data/step-8\"],\"exercises\":[\"ej-concurrency/synchronize-shared-data/step-2\",\"ej-concurrency/synchronize-shared-data/step-4\",\"ej-concurrency/synchronize-shared-data/step-5\",\"ej-concurrency/synchronize-shared-data/step-6\",\"ej-concurrency/synchronize-shared-data/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"ej-concurrency/synchronize-shared-data/step-1\",\"title\":\"Threads may never see your writes\",\"body\":\"\u003cp\u003eWithout synchronization, a write in one thread may stay invisible to another.\u003c/p\u003e\\n\u003cp\u003eA loop waiting on a plain \u003ccode\u003eboolean\u003c/code\u003e flag might never stop.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"ej-concurrency/synchronize-shared-data/step-2\",\"prompt\":\"\u003cp\u003eHow long does this program run?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFix it by synchronizing both the write \u003cem\u003eand\u003c/em\u003e the read, or by declaring the field \u003ccode\u003evolatile\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWithout synchronization, nothing guarantees that the background thread ever sees the main thread\u0026#39;s write to \u003ccode\u003estopRequested\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e may even hoist the read out of the loop, turning \u003ccode\u003ewhile (!stopRequested)\u003c/code\u003e into \u003ccode\u003eif (!stopRequested) while (true)\u003c/code\u003e — a legal optimization, called hoisting, because no other thread is supposed to change a non-volatile field.\u003c/p\u003e\\n\u003cp\u003eOn many JVMs the program runs forever.\u003c/p\u003e\\n\u003cp\u003eDeclaring the field \u003ccode\u003evolatile\u003c/code\u003e, or reading and writing it inside \u003ccode\u003esynchronized\u003c/code\u003e methods, guarantees the write becomes visible.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It may never terminate\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"About one second\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout synchronization, there\u0026#39;s no guarantee the background thread ever sees the write — and the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e may hoist the read out of the loop.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"ej-concurrency/synchronize-shared-data/step-3\",\"title\":\"Synchronize reads and writes\",\"body\":\"\u003cp\u003eLocking only the writer is not enough.\u003c/p\u003e\\n\u003cp\u003eBoth sides must use the same lock.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e gives visibility, but not atomicity.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003ecount++\u003c/code\u003e on a \u003ccode\u003evolatile\u003c/code\u003e is still a race.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"ej-concurrency/synchronize-shared-data/step-4\",\"prompt\":\"\u003cp\u003eA background thread loops until a \u003ccode\u003eboolean stopRequested\u003c/code\u003e field is set. The fix synchronizes the method that writes \u003ccode\u003estopRequested\u003c/code\u003e, but not the one that reads it. Is that enough?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eVisibility needs both sides to use the same lock (or the field to be volatile).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes — the write is what matters\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"No — synchronization has no effect unless both read and write operations are synchronized\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"ej-concurrency/synchronize-shared-data/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003evolatile int nextSerialNumber\u003c/code\u003e is handed out with \u003ccode\u003ereturn nextSerialNumber++;\u003c/code\u003e. Every read is fresh — but can two\\ncallers get the \u003cstrong\u003esame\u003c/strong\u003e serial number? Run both threads so the counter ends at \u003cstrong\u003e1\u003c/strong\u003e, meaning both got 0.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e guarantees visibility, not atomicity: \u003ccode\u003e++\u003c/code\u003e is still read-add-write. Use \u003ccode\u003eAtomicLong\u003c/code\u003e and\\n\u003ccode\u003egetAndIncrement()\u003c/code\u003e, or synchronize the method.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e makes every thread see the latest value, but \u003ccode\u003enextSerialNumber++\u003c/code\u003e is still three steps: read the value, add one, write it back.\u003c/p\u003e\\n\u003cp\u003eTwo threads can both read 5, both compute 6 and both write 6, so two callers get the same serial number and one increment is lost.\u003c/p\u003e\\n\u003cp\u003eVisibility doesn\u0026#39;t make a compound operation atomic. \u003ccode\u003eAtomicLong.getAndIncrement()\u003c/code\u003e performs the read-add-write as one indivisible step using compare-and-swap.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet both threads read before either writes.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":2,\"increments\":1,\"variable\":\"nextSerialNumber\"},\"goal\":{\"count\":1},\"question\":{\"prompt\":\"\u003cp\u003eWhat makes handing out serial numbers safe?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Reading the field twice before incrementing\",\"correct\":false,\"feedback\":\"\u003cp\u003eMore reads don\u0026#39;t stop another thread slipping in between read and write.\u003c/p\u003e\\n\"},{\"html\":\"Making the field \u003ccode\u003efinal\u003c/code\u003e as well\",\"correct\":false,\"feedback\":\"\u003cp\u003eA \u003ccode\u003efinal\u003c/code\u003e field can\u0026#39;t be incremented at all.\u003c/p\u003e\\n\"},{\"html\":\"An \u003ccode\u003eAtomicInteger\u003c/code\u003e and \u003ccode\u003egetAndIncrement()\u003c/code\u003e, or a \u003ccode\u003esynchronized\u003c/code\u003e method\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},{\"id\":\"step-6\",\"key\":\"ej-concurrency/synchronize-shared-data/step-6\",\"prompt\":\"\u003cp\u003eMatch each tool to what it guarantees.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003esynchronized\u003c/code\u003e (on both reads and writes)\",\"\u003ccode\u003evolatile\u003c/code\u003e\",\"\u003ccode\u003eAtomicLong\u003c/code\u003e\"],\"right\":[\"Mutual exclusion and visibility\",\"Visibility only\",\"Visibility and atomic read-modify-write on one variable\"],\"rightOrder\":[2,0,1]},{\"type\":\"explanation\",\"id\":\"step-7\",\"key\":\"ej-concurrency/synchronize-shared-data/step-7\",\"title\":\"Better, don't share\",\"body\":\"\u003cp\u003eThe simplest fix is to avoid shared mutable data.\u003c/p\u003e\\n\u003cp\u003eKeep mutable data inside one thread.\u003c/p\u003e\\n\u003cp\u003eShare only \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable objects\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-8\",\"key\":\"ej-concurrency/synchronize-shared-data/step-8\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the best way to avoid all these problems?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eObjects modified by one thread and then safely published become \u003cem\u003eeffectively immutable\u003c/em\u003e for others.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Don\u0026#39;t share mutable data — confine it to one thread, or share only immutable data\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Use \u003ccode\u003evolatile\u003c/code\u003e everywhere\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat fixes visibility but not compound actions like \u003ccode\u003e++\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]}]},\"courseTitle\":\"Concurrency\",\"next\":{\"id\":\"excessive-synchronization\",\"courseId\":\"ej-concurrency\",\"topicId\":\"effective-java\",\"key\":\"ej-concurrency/excessive-synchronization\",\"title\":\"Avoid excessive synchronization\",\"summary\":\"Never call alien code while holding a lock — it invites exceptions, deadlocks and slowness.\",\"duration\":5,\"tags\":[\"java\",\"effective java\",\"concurrency\",\"synchronized\",\"deadlock\",\"observer\",\"copyonwritearraylist\"],\"sources\":[{\"book\":\"effective-java\",\"ref\":\"Item 79\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"ej-concurrency/excessive-synchronization/step-1\",\"ej-concurrency/excessive-synchronization/step-2\",\"ej-concurrency/excessive-synchronization/step-3\",\"ej-concurrency/excessive-synchronization/step-4\",\"ej-concurrency/excessive-synchronization/step-5\",\"ej-concurrency/excessive-synchronization/step-6\",\"ej-concurrency/excessive-synchronization/step-7\"],\"exercises\":[\"ej-concurrency/excessive-synchronization/step-2\",\"ej-concurrency/excessive-synchronization/step-3\",\"ej-concurrency/excessive-synchronization/step-5\",\"ej-concurrency/excessive-synchronization/step-7\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Jav
