6-10\",\"jcip-task-execution/callable-and-future/listing-6-11\",\"jcip-task-execution/callable-and-future/listing-6-12\",\"jcip-task-execution/callable-and-future/listing-6-13\",\"jcip-task-execution/callable-and-future/listing-6-14\",\"jcip-task-execution/callable-and-future/listing-6-15\",\"jcip-task-execution/callable-and-future/listing-6-16\",\"jcip-task-execution/callable-and-future/listing-6-17\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-task-execution/callable-and-future/step-1\",\"title\":\"Callable returns a result\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Callable\\\" data-def=\\\"Like \u0026lt;code\u0026gt;Runnable\u0026lt;/code\u0026gt;, but returns a result and can throw a checked exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eCallable\u003c/code\u003e\u003c/button\u003e returns a value and can throw.\u003c/p\u003e\\n\u003cp\u003eSubmitting one gives you a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eFuture\u003c/code\u003e\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eget()\u003c/code\u003e waits for the result only when you need it.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-task-execution/callable-and-future/step-2\",\"title\":\"Parallelism needs balanced tasks\",\"body\":\"\u003cp\u003eTwo tasks of 1 s and 10 s gain little in parallel.\u003c/p\u003e\\n\u003cp\u003eSplit the work into many similar tasks instead.\u003c/p\u003e\\n\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"CompletionService\\\" data-def=\\\"An \u0026lt;code\u0026gt;Executor\u0026lt;/code\u0026gt; plus a \u0026lt;code\u0026gt;BlockingQueue\u0026lt;/code\u0026gt; of finished tasks — take results in the order they complete.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eCompletionService\u003c/code\u003e\u003c/button\u003e hands back results as each finishes.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-task-execution/callable-and-future/step-3\",\"prompt\":\"\u003cp\u003eRendering text takes 1 s; downloading all images takes 10 s. How much does the background download save?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe real payoff comes from many independent, similar tasks — one per image, rendered as each arrives.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eRendering text (1 s) and downloading images (10 s) in parallel takes about 10 s, instead of 11 s sequentially — a saving of about 1 s.\u003c/p\u003e\\n\u003cp\u003eParallelizing two unequal tasks gains at most the shorter one\u0026#39;s time.\u003c/p\u003e\\n\u003cp\u003eThe big win comes from splitting the 10 s download into one task per image, running many at once and rendering each image as it arrives.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"About 10 s\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe page still can\u0026#39;t finish before the 10 s download does.\u003c/p\u003e\\n\"},{\"html\":\"Half the time\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"About 1 s — the tasks are very unequal, so running them in parallel gains little\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jcip-task-execution/callable-and-future/step-4\",\"title\":\"Time budgets\",\"body\":\"\u003cp\u003e\u003ccode\u003eget(timeout)\u003c/code\u003e stops waiting after a deadline.\u003c/p\u003e\\n\u003cp\u003eThen cancel the task, so it stops using resources.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jcip-task-execution/callable-and-future/step-5\",\"prompt\":\"\u003cp\u003eMatch each tool to its use.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eFuture.get()\u003c/code\u003e\",\"\u003ccode\u003eFuture.get(timeout, unit)\u003c/code\u003e\",\"\u003ccode\u003eCompletionService.take()\u003c/code\u003e\",\"\u003ccode\u003einvokeAll(tasks, timeout, unit)\u003c/code\u003e\"],\"right\":[\"Wait for one specific result\",\"Wait at most a time budget, then give up and use a default\",\"Get whichever result finishes next\",\"Run many tasks, wait for all — cancelling those still running when time is up\"],\"rightOrder\":[2,3,1,0]},{\"id\":\"step-6\",\"key\":\"jcip-task-execution/callable-and-future/step-6\",\"prompt\":\"\u003cp\u003eAn ad must appear within 2 s, or the page shows a default. What happens to the ad task after \u003ccode\u003eget\u003c/code\u003e times out?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"You should cancel it with \u003ccode\u003efuture.cancel(true)\u003c/code\u003e — otherwise it keeps using resources computing a result nobody will use\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It stops automatically\",\"correct\":false,\"feedback\":\"\u003cp\u003eA timed \u003ccode\u003eget\u003c/code\u003e only stops \u003cem\u003ewaiting\u003c/em\u003e. The task carries on unless cancelled.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-7\",\"key\":\"jcip-task-execution/callable-and-future/step-7\",\"prompt\":\"\u003cp\u003
