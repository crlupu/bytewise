static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"tasks-and-threads\",\"courseId\":\"jcip-task-execution\",\"topicId\":\"jcip\",\"key\":\"jcip-task-execution/tasks-and-threads\",\"title\":\"Executing tasks in threads\",\"summary\":\"One thread does too little; a thread per request does too much. Tasks need a policy for how they run.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"tasks\",\"threads\",\"web server\",\"resource management\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§6.1, Executing Tasks in Threads\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jcip-task-execution/tasks-and-threads/step-1\",\"jcip-task-execution/tasks-and-threads/step-2\",\"jcip-task-execution/tasks-and-threads/step-3\",\"jcip-task-execution/tasks-and-threads/step-4\",\"jcip-task-execution/tasks-and-threads/step-5\",\"jcip-task-execution/tasks-and-threads/step-6\"],\"exercises\":[\"jcip-task-execution/tasks-and-threads/step-3\",\"jcip-task-execution/tasks-and-threads/step-4\",\"jcip-task-execution/tasks-and-threads/step-5\",\"jcip-task-execution/tasks-and-threads/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-task-execution/tasks-and-threads/step-1\",\"title\":\"Work is made of tasks\",\"body\":\"\u003cp\u003eA task is an independent unit of work, like one request.\u003c/p\u003e\\n\u003cp\u003eYou could run tasks one by one.\u003c/p\u003e\\n\u003cp\u003eOr start a new thread for each.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-task-execution/tasks-and-threads/step-2\",\"title\":\"Both extremes fail\",\"body\":\"\u003cp\u003eOne at a time is slow and unresponsive.\u003c/p\u003e\\n\u003cp\u003eA thread per task costs time and memory.\u003c/p\u003e\\n\u003cp\u003eUnder heavy load, it can crash the server.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-task-execution/tasks-and-threads/step-3\",\"prompt\":\"\u003cp\u003eMatch each approach to its problem.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Sequential\",\"Thread per task, unbounded\"],\"right\":[\"Only one request at a time; the server is idle while waiting on I/O, and everyone else waits too\",\"Under heavy load, thousands of threads exhaust memory and drown the CPU in context switching\"],\"rightOrder\":[1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Context switch\\\" data-def=\\\"The CPU stops one thread and starts another, saving and restoring registers and disturbing caches. Costs thousands of cycles.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContext switch\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jcip-task-execution/tasks-and-threads/step-4\",\"prompt\":\"\u003cp\u003eWhich are real costs of unbounded thread creation?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Threads can\u0026#39;t share objects\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can; that\u0026#39;s what most of this book is about managing.\u003c/p\u003e\\n\"},{\"html\":\"There\u0026#39;s a limit on how many threads can be created; hitting it typically causes \u003ccode\u003eOutOfMemoryError\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Creating and tearing down threads takes time, adding latency to every request\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Idle threads use memory, and more runnable threads than processors means competition for CPUs\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLatency\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"jcip-task-execution/tasks-and-threads/step-5\",\"prompt\":\"\u003cp\u003eThread-per-task works fine in testing with 10 users. What happens at a sudden 10,000?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe right answer is to bound the number of threads, which is what the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor framework\u003c/button\u003e is for.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach thread needs memory for its stack — often around a megabyte reserved — and the OS can only manage so many.\u003c/p\u003e\\n\u003cp\u003eA burst of 10,000 requests creates 10,000 threads; context-switching among them slows everything, memory runs short, and eventually thread creation fails with \u003ccode\u003eOutOfMemoryError\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe failure is abrupt rather than gradual. A bounded pool with a queue degrades gracefully instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It slows down gracefully\",\"correct\":false,\"feedback\":\"\u003cp\u003eGraceful degradation needs a bound on the work in progress — exactly what thread-per-task lacks.\u003c/p\u003e\\n\"},{\"html\":\"It may crash — throughput collapses well before that, with no graceful degradation\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Throughput\\\" data-def=\\\"How much work gets done per unit of time.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThroughput\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"jcip-task-execution/tasks-and-threads/step-6\",\"prompt\":\"\u003cp\u003eComplete the summary.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Processing tasks \",\"html\":\"Processing tasks \"},{\"answers\":[\"sequentially\"],\"size\":12,\"choices\":[\"resource\",\"sequentially\",\"independent\",\"happens-before\"]},{\"text\":\" gives poor responsiveness; creating a thread per task gives poor \",\"html\":\" gives poor responsiveness; creating a thread per task gives poor \"},{\"answers\":[\"resource\"],\"size\":8,\"choices\":[\"uncontended\",\"open\",\"resource\",\"sequentially\"]},{\"text\":\" management.\",\"html\":\" management.\"}],\"code\":false,\"caseSensitive\":false}]},\"courseTitle\":\"Task execution\",\"next\":{\"id\":\"executor-framework\",\"courseId\":\"jcip-task-execution\",\"topicId\":\"jcip\",\"key\":\"jcip-task-execution/executor-framework\",\"title\":\"The Executor framework\",\"summary\":\"Separate submitting a task from executing it, and choose an execution policy to fit.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"executor\",\"thread pool\",\"executorservice\",\"shutdown\",\"scheduled\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§6.2, The Executor Framework\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jcip-task-execution/executor-framework/step-1\",\"jcip-task-execution/executor-framework/step-2\",\"jcip-task-execution/executor-framework/step-3\",\"jcip-task-execution/executor-framework/step-4\",\"jcip-task-execution/executor-framework/step-5\",\"jcip-task-execution/ex
