rservice\",\"shutdown\",\"scheduled\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§6.2, The Executor Framework\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jcip-task-execution/executor-framework/step-1\",\"jcip-task-execution/executor-framework/step-2\",\"jcip-task-execution/executor-framework/step-3\",\"jcip-task-execution/executor-framework/step-4\",\"jcip-task-execution/executor-framework/step-5\",\"jcip-task-execution/executor-framework/step-6\"],\"exercises\":[\"jcip-task-execution/executor-framework/step-2\",\"jcip-task-execution/executor-framework/step-4\",\"jcip-task-execution/executor-framework/step-5\",\"jcip-task-execution/executor-framework/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-task-execution/executor-framework/step-1\",\"title\":\"Executors separate what from how\",\"body\":\"$13\",\"diagram\":\"$14\"},{\"id\":\"step-2\",\"key\":\"jcip-task-execution/executor-framework/step-2\",\"prompt\":\"\u003cp\u003eMatch each factory to the pool it builds.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003enewFixedThreadPool(n)\u003c/code\u003e\",\"\u003ccode\u003enewCachedThreadPool()\u003c/code\u003e\",\"\u003ccode\u003enewSingleThreadExecutor()\u003c/code\u003e\",\"\u003ccode\u003enewScheduledThreadPool(n)\u003c/code\u003e\"],\"right\":[\"Up to n threads; extra tasks wait in a queue\",\"Grows without limit, reusing idle threads\",\"One thread; tasks run one at a time, in order\",\"Runs tasks after a delay or periodically\"],\"rightOrder\":[3,2,1,0]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-task-execution/executor-framework/step-3\",\"title\":\"Executors must be shut down\",\"body\":\"\u003cp\u003e\u003ccode\u003eshutdown()\u003c/code\u003e finishes queued tasks, then stops.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eshutdownNow()\u003c/code\u003e tries to cancel running ones.\u003c/p\u003e\\n\u003cp\u003eUnstopped pool threads keep the JVM alive.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-task-execution/executor-framework/step-4\",\"prompt\":\"\u003cp\u003eA program creates an \u003ccode\u003eExecutorService\u003c/code\u003e but never shuts it down. What happens when \u003ccode\u003emain\u003c/code\u003e returns?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe JVM exits only when all non-daemon threads have finished.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor\u003c/button\u003e worker threads are non-daemon by default, and an idle pool keeps them waiting for new tasks.\u003c/p\u003e\\n\u003cp\u003eSo without \u003ccode\u003eshutdown()\u003c/code\u003e, \u003ccode\u003emain\u003c/code\u003e returns but the process lives on. Always shut down executors you create.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The JVM keeps running, because the pool\u0026#39;s non-daemon threads are still alive\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The JVM exits normally\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe JVM exits only when all non-daemon threads have finished — and idle pool threads never do.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"jcip-task-execution/executor-framework/step-5\",\"prompt\":\"\u003cp\u003eWhy prefer \u003ccode\u003eScheduledThreadPoolExecutor\u003c/code\u003e over the old \u003ccode\u003ejava.util.Timer\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Timer is deprecated and removed\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s still there — it\u0026#39;s just poor at both timing accuracy and failure handling.\u003c/p\u003e\\n\"},{\"html\":\"A Timer has one thread, so a long task delays others; and an exception in one task kills the Timer for good\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"jcip-task-execution/executor-framework/step-6\",\"prompt\":\"\u003cp\u003eStart a graceful shutdown.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"exec.\"},{\"answers\":[\"shutdown\"],\"size\":8,\"choices\":[\"readLock\",\"true\",\"shutdown\",\"NANOSECONDS\"]},{\"text\":\"(); exec.awaitTermination(30, TimeUnit.SECONDS);\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"Task execution\",\"next\":{\"id\":\"callable-and-future\",\"courseId\":\"jcip-task-execution\",\"topicId\":\"jcip\",\"key\":\"jcip-task-execution/callable-and-future\",\"title\":\"Finding exploitable parallelism\",\"summary\":\"Callable and Future for results, CompletionService for results as they arrive, time limits for budgets.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"callable\",\"future\",\"completionservice\",\"invokeall\",\"timeouts\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§6.3, Finding Exploitable Parallelism\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-task-execution/callable-and-future/step-1\",\"jcip-task-execution/callable-and-future/step-2\",\"jcip-task-execution/callable-and-future/step-3\",\"jcip-task-execution/callable-and-future/step-4\",\"jcip-task-execution/callable-and-future/step-5\",\"jcip-ta
