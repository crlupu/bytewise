Publishing and escaping\",\"body\":\"\u003cp\u003ePublishing makes an object reachable by other code.\u003c/p\u003e\\n\u003cp\u003eAn object that\u0026#39;s published by mistake has escaped.\u003c/p\u003e\\n\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003epublic\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e String\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e[] \u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003egetStates\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e() { \u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003ereturn\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e states; } \u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6A737D;--shiki-dark:#6A737D\\\"\u003e// private array escapes\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"jcip-sharing-objects/publication-and-escape/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003egetStates()\u003c/code\u003e returns the private array. What\u0026#39;s the problem?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Any caller can now modify the array — the \u0026quot;private\u0026quot; state has escaped\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing, since the field is private\",\"correct\":false,\"feedback\":\"\u003cp\u003ePrivate stops code naming the field. It doesn\u0026#39;t stop code holding a reference from changing the array.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-sharing-objects/publication-and-escape/step-3\",\"title\":\"Don't let this escape\",\"body\":\"\u003cp\u003eA constructor that registers a listener publishes \u003ccode\u003ethis\u003c/code\u003e early.\u003c/p\u003e\\n\u003cp\u003eOther threads may use a half-built object.\u003c/p\u003e\\n\u003cp\u003eConstruct first, then register, in a factory method.\u003c/p\u003e\\n\u003cp\u003eCreating a thread in a constructor is fine. Starting it isn\u0026#39;t.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-sharing-objects/publication-and-escape/step-4\",\"prompt\":\"\u003cp\u003eWhy is publishing \u003ccode\u003ethis\u003c/code\u003e from a constructor dangerous?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAn object is only in a predictable, consistent state after its constructor returns.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eRegistering a listener or starting a thread in the constructor hands \u003ccode\u003ethis\u003c/code\u003e to other code before the constructor has finished.\u003c/p\u003e\\n\u003cp\u003eAnother thread can then call methods on an object whose fields aren\u0026#39;t all set yet, and even \u003ccode\u003efinal\u003c/code\u003e fields lose their \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Visibility\\\" data-def=\\\"Whether a write by one thread is seen by another. Without synchronization there\u0026amp;#39;s no guarantee it ever will be.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evisibility\u003c/button\u003e guarantee.\u003c/p\u003e\\n\u003cp\u003eThe object only becomes consistent when the constructor returns. A factory method that constructs first, then registers, avoids the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Escape\\\" data-def=\\\"An object published when it shouldn\u0026amp;#39;t be — for example before it\u0026amp;#39;s fully constructed.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eescape\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It isn\u0026#39;t dangerous if it\u0026#39;s the constructor\u0026#39;s last statement\",\"correct\":false,\"feedback\":\"\u003cp\u003eEven as the last statement, the JVM doesn\u0026#39;t guarantee other threads see a fully constructed object.\u003c/p\u003e\\n\"},{\"html\":\"Other threads may see — and call methods on — an object whose constructor hasn\u0026#39;t finished\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"jcip-sharing-objects/publication-and-escape/step-5\",\"prompt\":\"\u003cp\u003eA constructor that registers a listener with an event source lets \u003ccode\u003ethis\u003c/code\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Escape\\\" data-def=\\\"An object published when it shouldn\u0026amp;#39;t be — for example before it\u0026amp;#39;s fully constructed.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eescape\u003c/button\u003e before the object is built. Put the safe alternative — a private constructor and a factory method — in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eStarting a thread or registering a listener after construction keeps \u003ccode\u003ethis\u003c/code\u003e from escaping early.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The factory calls the private constructor, which only initialises fields\",\"The constructor returns a fully built object\",\"The factory registers the listener with the event source\",\"The factory returns the object\"],\"start\":[1,2,0,3]},{\"id\":\"step-6\",\"key\":\"jcip-sharing-objects/publication-and-escape/step-6\",\"prompt\":\"\u003cp\u003eIs it safe to \u003cem\u003ecreate\u003c/em\u003e a thread in a constructor?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eProvide a \u003ccode\u003estart()\u003c/code\u003e or \u003ccode\u003einitialize()\u003c/code\u003e method, or use a factory.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Creating is fine; starting it from the constructor isn\u0026#39;t — it can see the object before construction completes\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Neither is safe\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Both are safe\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false}]},\"courseTitle\":\"Sharing objects\",\"next\":{\"id\":\"thread-confinement\",\"courseId\":\"jcip-sharing-objects\",\"topicId\":\"jcip\",\"key\":\"jcip-sharing-objects/thread-confinement\",\"title\":\"Thread confinement\",\"summary\":\"Data that only one thread ever touches needs no synchronization — confine it on purpose.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"thread confinement\",\"threadlocal\",\"stack confinement\",\"jdbc\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§3.3, Thread Confinement\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-sharing-objects/thread-confinement/step-1\",\"jcip-sharing-objects/thread-confinement/step-2\",\"jcip-sharing-objects/thread-confinement/step-3\",\"jcip-sharing-objects/thread-confinement/step-4\",\"jcip-sharing-objects/thread-confinement/step-5\",\"jcip-sharing-objects/thread-confinement/step-6\",\"jcip-sharing-objects/thread-confinement/step-7\"],\"exercises\":[\"jcip-sharing-objects/thread-confinement/step-3\",\"jcip-sharing-objects/thread-confinement/step-4\",\"jcip-sharing-objects/thread-confinement/step-5\"
