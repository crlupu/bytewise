\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCaches\u003c/button\u003e, the compiler and the CPU may delay or reorder them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-sharing-objects/visibility/step-2\",\"prompt\":\"\u003cp\u003eWhat can this program print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSeeing \u003ccode\u003e0\u003c/code\u003e means the reader saw the write to \u003ccode\u003eready\u003c/code\u003e before the write to \u003ccode\u003enumber\u003c/code\u003e — \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reordering\\\" data-def=\\\"The compiler, JIT or CPU executing operations in a different order than written. Allowed unless synchronization forbids it.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ereordering\u003c/button\u003e\u003c/strong\u003e. Without\\nsynchronization there are no guarantees about the order in which another thread sees writes.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe reader may never see \u003ccode\u003eready\u003c/code\u003e become true, because without synchronization the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e can keep it in a register and loop forever.\u003c/p\u003e\\n\u003cp\u003eIf it does see \u003ccode\u003eready\u003c/code\u003e, it may still read \u003ccode\u003enumber\u003c/code\u003e as 0, because the two writes can be reordered or become visible in a different order.\u003c/p\u003e\\n\u003cp\u003ePrinting 42 is only the intended outcome. Proper synchronization or \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003evolatile\u003c/code\u003e\u003c/button\u003e rules out the other two.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Always \u003ccode\u003e0\u003c/code\u003e\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e42\u003c/code\u003e, or \u003ccode\u003e0\u003c/code\u003e, or nothing at all — it may loop forever\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always \u003ccode\u003e42\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe reader might never see \u003ccode\u003eready\u003c/code\u003e change, or might see it before it sees \u003ccode\u003enumber\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-sharing-objects/visibility/step-3\",\"title\":\"Stale and torn values\",\"body\":\"\u003cp\u003eA reader can see an out-of-date value.\u003c/p\u003e\\n\u003cp\u003eSome fields fresh, others stale.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003elong\u003c/code\u003e or \u003ccode\u003edouble\u003c/code\u003e can even be half-written.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-sharing-objects/visibility/step-4\",\"prompt\":\"\u003cp\u003eA getter for a field isn\u0026#39;t synchronized, but its setter is. What can a reader see?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A \u003cstrong\u003estale\u003c/strong\u003e value — out of date, possibly for a long time, and possibly stale for some fields but not others\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always the latest value, because the setter is synchronized\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Visibility\\\" data-def=\\\"Whether a write by one thread is seen by another. Without synchronization there\u0026amp;#39;s no guarantee it ever will be.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eVisibility\u003c/button\u003e needs both the writing and the reading thread to synchronize on the same lock.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"step-5\",\"key\":\"jcip-sharing-objects/visibility/step-5\",\"prompt\":\"\u003cp\u003eA non-volatile \u003ccode\u003elong\u003c/code\u003e field is written by one thread while another reads it, with no synchronization.\\nApart from staleness, what else could the reader see?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eShared mutable \u003ccode\u003elong\u003c/code\u003e and \u003ccode\u003edouble\u003c/code\u003e variables need \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003evolatile\u003c/code\u003e\u003c/button\u003e or a lock even when staleness doesn\u0026#39;t matter.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe JVM may write a 64-bit \u003ccode\u003elong\u003c/code\u003e or \u003ccode\u003edouble\u003c/code\u003e as two 32-bit halves on some platforms.\u003c/p\u003e\\n\u003cp\u003eA reader running between the two halves of a write sees the high bits of one value and the low bits of another — a number no thread ever wrote.\u003c/p\u003e\\n\u003cp\u003eDeclaring the field \u003ccode\u003evolatile\u003c/code\u003e, or guarding it with a lock, makes 64-bit reads and writes \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Only values that some thread actually wrote\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat \u0026quot;out-of-thin-air safety\u0026quot; holds for most variables, but the JVM may split 64-bit \u003ccode\u003elong\u003c/code\u003e and \u003ccode\u003edouble\u003c/code\u003e writes.\u003c/p\u003e\\n\"},{\"html\":\"A value no thread ever wrote — the high 32 bits from one write and the low 32 from another\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"jcip-sharing-objects/visibility/step-6\",\"title\":\"Locks also make writes visible\",\"body\":\"\u003cp\u003eLocking isn\u0026#39;t only about taking turns.\u003c/p\u003e\\n\u003cp\u003eIt also publishes what the previous holder wrote.\u003c/p\u003e\\n\u003cp\u003eReaders and writers must use the same lock.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"jcip-sharing-objects/visibility/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Locking is not just about mutual exclusion; it is also about memory \",\"htm
