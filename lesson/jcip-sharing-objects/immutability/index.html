cape\\\" data-def=\\\"An object published when it shouldn\u0026amp;#39;t be — for example before it\u0026amp;#39;s fully constructed.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eescapes\u003c/button\u003e while it\u0026#39;s built.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-sharing-objects/immutability/step-2\",\"prompt\":\"\u003cp\u003eThis class keeps a \u003ccode\u003eSet\u003c/code\u003e internally and the set is mutable. Can the class still be immutable?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eImmutability is about observable state, not whether internal objects could in principle change.\u003c/p\u003e\\n\u003cp\u003eThe set is filled in the constructor, the reference is \u003ccode\u003eprivate final\u003c/code\u003e, no method modifies it and it never escapes, so after construction no one can change it.\u003c/p\u003e\\n\u003cp\u003eThe \u003ccode\u003efinal\u003c/code\u003e field also guarantees that other threads see the set as constructed. That\u0026#39;s enough for the class to be immutable, and therefore \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread-safe\u003c/button\u003e without locks.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"No — it uses a mutable object\",\"correct\":false,\"feedback\":\"\u003cp\u003eImmutability is about the object\u0026#39;s observable state, not the classes it uses internally.\u003c/p\u003e\\n\"},{\"html\":\"Yes — the set is never modified after construction and never escapes\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":fals
