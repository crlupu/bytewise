"Chapter 10, Unit testing — shared state between tests\"},{\"book\":\"java-mistakes\",\"ref\":\"Chapter 10, Unit testing — comparing strings with ==\"}],\"requires\":[],\"steps\":10,\"stepKeys\":[\"jm-unit-testing/tests-that-lie/step-1\",\"jm-unit-testing/tests-that-lie/step-2\",\"jm-unit-testing/tests-that-lie/jm-093\",\"jm-unit-testing/tests-that-lie/jm-094\",\"jm-unit-testing/tests-that-lie/jm-095\",\"jm-unit-testing/tests-that-lie/jm-096\",\"jm-unit-testing/tests-that-lie/jm-097\",\"jm-unit-testing/tests-that-lie/jm-098\",\"jm-unit-testing/tests-that-lie/jm-099\",\"jm-unit-testing/tests-that-lie/jm-100\"],\"exercises\":[\"jm-unit-testing/tests-that-lie/jm-093\",\"jm-unit-testing/tests-that-lie/jm-094\",\"jm-unit-testing/tests-that-lie/jm-095\",\"jm-unit-testing/tests-that-lie/jm-096\",\"jm-unit-testing/tests-that-lie/jm-097\",\"jm-unit-testing/tests-that-lie/jm-098\",\"jm-unit-testing/tests-that-lie/jm-099\",\"jm-unit-testing/tests-that-lie/jm-100\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jm-unit-testing/tests-that-lie/step-1\",\"title\":\"A test must be able to fail\",\"body\":\"\u003cp\u003eJava\u0026#39;s \u003ccode\u003eassert\u003c/code\u003e statement is disabled unless the JVM runs with \u003ccode\u003e-ea\u003c/code\u003e, so it checks nothing in production or in most test runs.\u003c/p\u003e\\n\u003cp\u003eA test that expects an exception must fail when none is thrown — use \u003ccode\u003eassertThrows\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCompare floating-point results with a tolerance.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jm-unit-testing/tests-that-lie/step-2\",\"title\":\"Tests that fail for the wrong reason\",\"body\":\"\u003cp\u003e\u003ccode\u003eassertEquals(expected, actual)\u003c/code\u003e: swapping them makes failure messages lie.\u003c/p\u003e\\n\u003cp\u003eResults that depend on the default locale, on \u003ccode\u003eHashSet\u003c/code\u003e order or on static state left by another test pass on one machine and fail on the next.\u003c/p\u003e\\n\u003cp\u003eCompare strings with \u003ccode\u003eequals\u003c/code\u003e, never \u003ccode\u003e==\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-093\",\"key\":\"jm-unit-testing/tests-that-lie/jm-093\",\"prompt\":\"\u003cp\u003eRun with plain \u003ccode\u003ejava\u003c/code\u003e (no options). What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTests should use a test framework\u0026#39;s assertions, which always run.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — relying on the assert statement.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"An \u003ccode\u003eAssertionError: square is wrong\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eassert\u003c/code\u003e statements are skipped unless the JVM runs with \u003ccode\u003e-ea\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"all tests passed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-094\",\"key\":\"jm-unit-testing/tests-that-lie/jm-094\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eassertEquals(expected, actual)\u003c/code\u003e reports \u003ccode\u003eexpected \u0026lt;x\u0026gt; but was \u0026lt;y\u0026gt;\u003c/code\u003e. What does the failing test print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003ePut the literal expectation first: \u003ccode\u003eassertEquals(90, discount(100))\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — swapping expected and actual.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"expected \u0026lt;89\u0026gt; but was \u0026lt;90\u0026gt;\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"expected \u0026lt;90\u0026gt; but was \u0026lt;89\u0026gt;\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe arguments are swapped, so the message calls the buggy result the expectation.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-095\",\"key\":\"jm-unit-testing/tests-that-lie/jm-095\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eassertEquals(0.3, t, 1e-9)\u003c/code\u003e with a tolerance.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — exact floating-point comparison.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003epass\\npass\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e0.1 + 0.2 is 0.30000000000000004 in \u003ccode\u003edouble\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eFAIL: 0.30000000000000004\\npass\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-096\",\"key\":\"jm-unit-testing/tests-that-lie/jm-096\",\"prompt\":\"\u003cp\u003eThe test checks that \u003ccode\u003eparseAge\u003c/code\u003e rejects negative numbers. \u003ccode\u003eparseAge\u003c/code\u003e has a bug: it accepts them. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eassertThrows(IllegalArgumentException.class, () -\u0026gt; parseAge(\u0026quot;-5\u0026quot;))\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — a test that can\u0026#39;t fail.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"test passed\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"An exception, or a failure message\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing fails the test when no exception is thrown — it needs a \u003ccode\u003efail()\u003c/code\u003e after the call.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-097\",\"key\":\"jm-unit-testing/tests-that-lie/jm-097\",\"prompt\":\"\u003cp\u003eThe CI machine\u0026#39;s locale is French. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003ePass an explicit \u003ccode\u003eLocale\u003c/code\u003e to the code under test, and run tests under more than one locale.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — depending on the default locale.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"pass\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe format uses the default locale, which writes a decimal comma in French.\u003c/p\u003e\\n\"},{\"html\":\"FAIL: 9,50 €\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-098\",\"key\":\"jm-unit-testing/tests-that-lie/jm-098\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCompare as sets: \u003ccode\u003eassertEquals(Set.of(\u0026quot;java\u0026quot;, \u0026quot;jvm\u0026quot;, \u0026quot;kotlin\u0026quot;), tags(...))\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — depending on HashSet order.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$18\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"pass\",\"correct\":false,\"feedback\":\"\u003cp\u003eA \u003ccode\u003eHashSet\u003c/code\u003e\u0026#39;s order follows \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003ehash codes\u003c/button\u003e, not insertion.\u003c/p\u003e\\n\"},{\"html\":\"FAIL: [jvm, java, kotlin]\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-099\",\"key\":\"jm-unit-testing/tests-that-lie/jm-099\",\"prompt\":\"\u003cp\u003eTwo tests share a static counter. They run in the order shown. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eReset shared state before each test (\u003ccode\u003e@BeforeEach\u003c/code\u003e), or avoid static mutable state.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — shared state between tests.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$19\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003etestCreateOne pass\\ntestCreateTwo pass\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe counter isn\u0026#39;t reset, so the second test sees 3. Run alone, it would pass.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003etestCreateOne pass\\ntestCreateTwo FAIL: 3\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-100\",\"key\":\"jm-unit-testing/tests-that-lie/jm-100\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eassertTrue(a == b)\u003c/code\u003e on strings is a bug; use \u003ccode\u003eassertEquals\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 10, Unit testing — comparing strings with ==.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$1a\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003epass\\npass\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003egreet\u003c/code\u003e builds a new string at run time; \u003ccode\u003e==\u003c/code\u003e compares it with the interned literal by reference.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eFAIL\\npass\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]}]},\"courseTitl
