TP/3 exist.\",\"duration\":9,\"tags\":[\"networking\",\"http\",\"persistent connections\",\"rtt\",\"caching\",\"http2\",\"http3\",\"quic\"],\"sources\":[{\"book\":\"kurose-ross\",\"ref\":\"§2.2, The Web and HTTP\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"application-layer/http/step-1\",\"application-layer/http/step-2\",\"application-layer/http/step-3\",\"application-layer/http/step-4\",\"application-layer/http/step-5\",\"application-layer/http/step-6\",\"application-layer/http/step-7\",\"application-layer/http/step-8\",\"application-layer/http/step-9\"],\"exercises\":[\"application-layer/http/step-2\",\"application-layer/http/step-3\",\"application-layer/http/step-5\",\"application-layer/http/step-7\",\"application-layer/http/step-8\",\"application-layer/http/step-9\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"application-layer/http/step-1\",\"title\":\"Each connection costs a round trip\",\"body\":\"\u003cp\u003eHTTP is request and response, over \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eOpening a TCP connection takes one \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eround trip\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eSo one object on a new connection takes about 2 RTTs.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"application-layer/http/step-2\",\"prompt\":\"\u003cp\u003eA page is one HTML file plus 10 images, all small. With \u003cstrong\u003enon-persistent\u003c/strong\u003e connections — a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e connection\\nper object, fetched one after another — about how many \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTTs\u003c/button\u003e does it take?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e11 objects × 2 RTTs = 22.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach object needs its own TCP connection: one RTT for the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e (\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYN\u003c/button\u003e, SYN-ACK), then one RTT to send the request and receive the response.\u003c/p\u003e\\n\u003cp\u003eSo each object costs 2 RTTs, and 11 objects fetched one after another cost 22.\u003c/p\u003e\\n\u003cp\u003eTransfer time is ignored here because the objects are small; with a 100 ms RTT, that\u0026#39;s 2.2 seconds of pure waiting.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e11 objects, 2 RTTs each.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"11\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat counts one RTT per object. Each also needs its own \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e.\u003c/p\u003e\\n\"},{\"html\":\"12\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the persistent-connection answer — try it next.\u003c/p\u003e\\n\"},{\"html\":\"22\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"application-layer/http/step-3\",\"prompt\":\"\u003cp\u003eA page is one HTML file plus 10 small images, fetched over one \u003cstrong\u003epersistent\u003c/strong\u003e connection (HTTP/1.1\u0026#39;s default), requests sent one at a time. About how many \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTTs\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1 RTT for the handshake + 11 request–response round trips = 12.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eOne \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e, then one RTT per object.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"11\",\"correct\":false,\"feedback\":\"\u003cp\u003eDon\u0026#39;t forget the one handshake at the start.\u003c/p\u003e\\n\"},{\"html\":\"12\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"22\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Persistent connection\\\" data-def=\\\"Keeping a TCP connection open for several HTTP requests, saving a handshake for each.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003epersistent connection\u003c/button\u003e, the handshake happens only once.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"application-layer/http/step-4\",\"title\":\"Conditional requests\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"application-layer/http/step-5\",\"prompt\":\"\u003cp\u003eMatch each status code to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"200 OK\",\"301 Moved Permanently\",\"304 Not Modified\",\"404 Not Found\",\"503 Service Unavailable\"],\"right\":[\"Here\u0026#39;s what you asked for\",\"It\u0026#39;s at a different URL now — use that from now on\",\"Your cached copy is still good\",\"There\u0026#39;s nothing at this URL\",\"The server can\u0026#39;t handle it right now — try later\"],\"rightOrder\":[4,2,3,1,0]},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"application-layer/http/step-6\",\"title\":\"HTTP/2 and HTTP/3\",\"body\":\"\u003cp\u003eHTTP/1.1 sends one request at a time per connection.\u003c/p\u003e\\n\u003cp\u003eHTTP/2 interleaves many streams on one connection.\u003c/p\u003e\\n\u003cp\u003eHTTP/3 runs on \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"QUIC\\\" data-def=\\\"A transport protocol over UDP, used by HTTP/3. Combines connection and TLS setup, and recovers lost packets per stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eQUIC\u003c/button\u003e, so one lost packet stalls only its stream.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"application-layer/http/step-7\",\"prompt\":\"\u003cp\u003eHTTP/1.1 sends requests on a connection one at a time. A slow response blocks everything queued behind it. What did HTTP/2 change?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Multiplexing\\\" data-def=\\\"Carrying several independent streams over one connection, interleaved.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eMultiplexing\u003c/button\u003e removes HTTP-level \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Head-of-line blocking\\\" data-def=\\\"One slow or lost item at the front of a queue holding up everything behind it.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehead-of-line blocking\u003c/button\u003e. One lost TCP \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Segment\\\" data-def=\\\"A TCP packet — a header plus a piece of the byte stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003esegment\u003c/button\u003e still stalls every stream, though…\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eHTTP/1.1 sends requests one at a time on a connection, so a slow response blocks those behind it; browsers work around this with several parallel connections.\u003c/p\u003e\\n\u003cp\u003eHTTP/2 splits each request and response into frames labelled with a stream ID and interleaves them on one connection, so a slow response no longer blocks the others at the HTTP level.\u003c/p\u003e\\n\u003cp\u003eTCP still delivers bytes in order, though, so one lost packet stalls all streams until it\u0026#39;s retransmitted.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It removed headers\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compresses them (HPACK); they\u0026#39;re still there.\u003c/p\u003e\\n\"},{\"html\":\"It switched from TCP to UDP\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s HTTP/3, which runs over \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"QUIC\\\" data-def=\\\"A transport protocol over UDP, used by HTTP/3. Combines connection and TLS setup, and recovers lost packets per stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eQUIC\u003c/button\u003e on UDP.\u003c/p\u003e\\n\"},{\"html\":\"It multiplexes many requests as interleaved streams over one connection\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"UDP\\\" data-def=\\\"A minimal transport protocol — sends individual datagrams with no connection, ordering or retransmission.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eUDP\u003c/button\u003e\"]},{\"id\":\"step-8\",\"key\":\"application-layer/http/step-8\",\"prompt\":\"\u003cp\u003e…which is why HTTP/3 runs over \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"QUIC\\\" data-def=\\\"A transport protocol over UDP, used by HTTP/3. Combines connection and TLS setup, and recovers lost packets per stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eQUIC\u003c/button\u003e, on \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"UDP\\\" data-def=\\\"A minimal transport protocol — sends individual datagrams with no connection, ordering or retransmission.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eUDP\u003c/button\u003e. What does that buy?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eQUIC moves reliability up into user space, per stream, removing \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Head-of-line blocking\\\" data-def=\\\"One slow or lost item at the front of a queue holding up everything behind it.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehead-of-line blocking\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"UDP never loses packets\",\"correct\":false,\"feedback\":\"\u003cp\u003eQUIC does its own loss recovery — per stream, which is the point.\u003c/p\u003e\\n\"},{\"html\":\"A lost packet stalls only its own stream, and connection setup is combined with TLS in fewer round trips\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It removes the need for encryption\",\"correct\":false,\"feedback\":\"\u003cp\u003eQUIC always encrypts.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTT\u003c/button\u003e\"]},{\"id\":\"step-9\",\"key\":\"application-layer/http/step-9\",\"prompt\":\"\u003cp\u003eComplete the summary.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Fetching one object over a new TCP connection takes about \",\"html\":\"Fetching one object over a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e connection takes about \"},{\"answers\":[\"2\",\"two\"],\"size\":3,\"choices\":[\"2\",\"doubles\",\"1\",\"persistent\"]},{\"text\":\" RTTs; a \",\"html\":\" \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTTs\u003c/button\u003e; a \"},{\"answers\":[\"persistent\"],\"size\":10,\"choices\":[\"1\",\"persistent\",\"doubles\",\"2\"]},{\"text\":\" connection saves the handshake for every object after the first.\",\"html\":\" connection saves the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thr
