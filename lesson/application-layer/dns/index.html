 11:50.\\nUntil about when may its users still get the old address?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe cached copy expires an hour after it was fetched — 12:50.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA resolver keeps a cached answer for the record\u0026#39;s TTL, counted from when it fetched it, not from when the record changed.\u003c/p\u003e\\n\u003cp\u003eIt cached the old address at 11:50 with a TTL of 3,600 seconds, so it keeps serving it until 12:50, regardless of the change at 12:00.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why operators lower TTLs a day or so before a planned change, so \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecaches\u003c/button\u003e expire quickly when it happens.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e3,600 seconds is an hour, starting from 11:50.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"12:50\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"13:00\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe hour counts from when the resolver \u003cem\u003ecached\u003c/em\u003e the answer, not from when you changed it.\u003c/p\u003e\\n\"},{\"html\":\"12:00\",\"correct\":false,\"feedback\":\"\u003cp\u003eResolvers don\u0026#39;t learn about the change — they wait for their copy to expire.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-8\",\"key\":\"application-layer/dns/step-8\",\"prompt\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"DNS\\\" data-def=\\\"The Internet\u0026amp;#39;s distributed directory that turns names like \u0026lt;code\u0026gt;example.com\u0026lt;/code\u0026gt; into IP addresses.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eDNS\u003c/button\u003e queries usually travel over \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"UDP\\\" data-def=\\\"A minimal transport protocol — sends individual datagrams with no connection, ordering or retransmission.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eUDP\u003c/button\u003e, not \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e. Why?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOne \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eround trip\u003c/button\u003e instead of two. Encrypted DNS (DoH, DoT) trades some of that for privacy.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"UDP is more reliable than TCP\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe reverse — DNS clients simply retry if an answer doesn\u0026#39;t come.\u003c/p\u003e\\n\"},{\"html\":\"A query and its answer usually fit in one packet each, so a connection handshake would double the latency\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"TCP isn\u0026#39;t allowed on port 53\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt is, and it\u0026#39;s used for large answers and zone transfers.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eThree-way handshake\u003c/button\u003e\"]}]},\"courseTitle\":\"The application layer\",\"next\":{\"id\":\"http\",\"courseId\":\"application-layer\",\"topicId\":\"networking\",\"key\":\"application-layer/http\",\"title\":\"HTTP and round trips\",\"summary\":\"Persistent connections, conditional requests, and why HTTP/2 and HTTP/3 exist.\",\"duration\":9,\"tags\":[\"networking\",\"http\",\"persistent connections\",\"rtt\",\"caching\",\"http2\",\"http3\",\"quic\"],\"sources\":[{\"book\":\"kurose-ross\",\"ref\":\"§2.2, The Web and HTTP\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"application-layer/http/step-1\",\"application-layer/http/step-2\",\"application-layer/http/step-3\",\"application-layer/http/step-4\",\"application-layer/http/step-5\",\"application-layer/http/step-6\",\"application-layer/http/step-7\",\"application-layer/http/step-8\",\"application-layer/http/step-9\"],\"exercises\":[\"application-layer/http/step-2\",\"application-layer/http/step-3\",\"application-layer/http/step-5\",\"application-layer/http/step-7\",\"application-layer/http/step-8\",\"application-layer/http/step-9\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\
