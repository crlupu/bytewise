erics/fruit-and-wildcards/step-1\",\"title\":\"Eckel's fruit\",\"body\":\"\u003cp\u003e\u003ccode\u003eApple\u003c/code\u003e and \u003ccode\u003eOrange\u003c/code\u003e extend \u003ccode\u003eFruit\u003c/code\u003e; \u003ccode\u003eJonathan\u003c/code\u003e is a kind of \u003ccode\u003eApple\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEverything is an \u003ccode\u003eObject\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe question: what can go into a container of each?\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-generics/fruit-and-wildcards/step-2\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e: an \u003ccode\u003eApple[]\u003c/code\u003e is a subtype of \u003ccode\u003eFruit[]\u003c/code\u003e, so the first line compiles.\u003c/p\u003e\\n\u003cp\u003eThe array object still knows at run time that it\u0026#39;s really an \u003ccode\u003eApple[]\u003c/code\u003e, and every store into it is checked.\u003c/p\u003e\\n\u003cp\u003eStoring an \u003ccode\u003eOrange\u003c/code\u003e fails that check, so the JVM throws \u003ccode\u003eArrayStoreException\u003c/code\u003e — an error the compiler couldn\u0026#39;t catch.\u003c/p\u003e\\n\u003cp\u003eGeneric lists avoid this by making \u003ccode\u003eList\u0026lt;Apple\u0026gt;\u003c/code\u003e not a \u003ccode\u003eList\u0026lt;Fruit\u0026gt;\u003c/code\u003e, which moves the error to compile time.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It compiles, then the third line throws \u003ccode\u003eArrayStoreException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It works; the array now holds an Orange\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe array knows it\u0026#39;s an \u003ccode\u003eApple[]\u003c/code\u003e and refuses the Orange at run time.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e — an \u003ccode\u003eApple[]\u003c/code\u003e is a \u003ccode\u003eFruit[]\u003c/code\u003e — so the compiler accepts it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-generics/fruit-and-wildcards/step-3\",\"title\":\"Generics catch it at compile time\",\"body\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;Fruit\u0026gt; flist = new ArrayList\u0026lt;Apple\u0026gt;();\u003c/code\u003e doesn\u0026#39;t compile.\u003c/p\u003e\\n\u003cp\u003eA list of apples isn\u0026#39;t a list of fruit — you could add an orange to it.\u003c/p\u003e\\n\u003cp\u003eWildcards give back the flexibility, safely.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"tij-generics/fruit-and-wildcards/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;? extends Fruit\u0026gt; flist\u003c/code\u003e might be a list of any fruit. Tap the most specific type you can safely read out of it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhatever the list really holds, every element is some kind of Fruit.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Object\"},{\"name\":\"Fruit\"},{\"name\":\"Apple\"},{\"name\":\"Orange\"}],\"relations\":[{\"from\":\"Fruit\",\"to\":\"Object\",\"type\":\"extends\"},{\"from\":\"Apple\",\"to\":\"Fruit\",\"type\":\"extends\"},{\"from\":\"Orange\",\"to\":\"Fruit\",\"type\":\"extends\"}]},\"feedback\":{\"Apple\":\"The list might hold oranges.\",\"Orange\":\"The list might hold apples.\",\"Object\":\"That's safe, but Fruit is more specific.\"}},\"goal\":{\"select\":\"Fruit\"},\"question\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-generics/fruit-and-wildcards/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;? super Apple\u0026gt; alist\u003c/code\u003e might be a list of Apple, Fruit or Object. Tap the most general type you can safely add to it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAny list that holds Apples\u0026#39; supertypes can hold an Apple — and therefore a Jonathan too.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe variable might refer to a \u003ccode\u003eList\u0026lt;Apple\u0026gt;\u003c/code\u003e, a \u003ccode\u003eList\u0026lt;Fruit\u0026gt;\u003c/code\u003e or a \u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e, and the compiler doesn\u0026#39;t know which.\u003c/p\u003e\\n\u003cp\u003eAn \u003ccode\u003eApple\u003c/code\u003e fits in all three, and so does any subclass like \u003ccode\u003eJonathan\u003c/code\u003e, so adding one is always safe.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eFruit\u003c/code\u003e wouldn\u0026#39;t fit in a \u003ccode\u003eList\u0026lt;Apple\u0026gt;\u003c/code\u003e, so the compiler rejects it.\u003c/p\u003e\\n\u003cp\u003eReading is the opposite: the only thing you can be sure of is that an element is an \u003ccode\u003eObject\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Object\"},{\"name\":\"Fruit\"},{\"name\":\"Apple\"},{\"name\":\"Orange\"},{\"name\":\"Jonathan\"}],\"relations\":[{\"from\":\"Fruit\",\"to\":\"Object\",\"type\":\"extends\"},{\"from\":\"Apple\",\"to\":\"Fruit\",\"type\":\"extends\"},{\"from\":\"Orange\",\"to\":\"Fruit\",\"type\":\"extends\"},{\"from\":\"Jonathan\",\"to\":\"Apple\",\"type\":\"extends\"}]},\"feedback\":{\"Fruit\":\"If it's really a List\u003cApple\u003e, adding a plain Fruit — maybe an orange — would be wrong.\",\"Object\":\"The list might be a List\u003cApple\u003e, which can't hold any Object.\",\"Orange\":\"An Orange isn't an Apple.\",\"Jonathan\":\"You can add a Jonathan, but Apple is more general.\"}},\"goal\":{\"select\":\"Apple\"},\"question\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"tij-generics/fruit-and-wildcards/step-6\",\"prompt\":\"\u003cp\u003eMatch each declaration with what you may do.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eList\u0026lt;? extends Fruit\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;? super Apple\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;Fruit\u0026gt;\u003c/code\u003e\"],\"right\":[\"Read Fruit; add nothing but null\",\"Add Apple or Jonathan; read only Object\",\"Read and add any Fruit\"],\"rightOrder\":[2,1,0]}]},\"courseTitle\":\"Generics\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018}
