":\"generic-arrays-and-primitives\",\"courseId\":\"tij-generics\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-generics/generic-arrays-and-primitives\",\"title\":\"Generic arrays, primitives and casts\",\"summary\":\"Why generic arrays are awkward, what you can do instead, and the cost of no primitive type arguments.\",\"duration\":8,\"tags\":[\"java\",\"generics\",\"arrays\",\"primitives\",\"autoboxing\",\"casts\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 15, Arrays of generics; Issues\"}],\"requires\":[],\"steps\":14,\"stepKeys\":[\"tij-generics/generic-arrays-and-primitives/step-1\",\"tij-generics/generic-arrays-and-primitives/step-2\",\"tij-generics/generic-arrays-and-primitives/tij-generics-arrayofgenericreference\",\"tij-generics/generic-arrays-and-primitives/tij-generics-arrayofgeneric\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericarray\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericarray2\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericarraywithtypetoken\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericcast\",\"tij-generics/generic-arrays-and-primitives/tij-generics-listofint\",\"tij-generics/generic-arrays-and-primitives/tij-generics-byteset\",\"tij-generics/generic-arrays-and-primitives/tij-generics-primitivegenerictest\",\"tij-generics/generic-arrays-and-primitives/tij-generics-needcasting\",\"tij-generics/generic-arrays-and-primitives/tij-generics-classcasting\",\"tij-generics/generic-arrays-and-primitives/tij-generics-checkedlist\"],\"exercises\":[\"tij-generics/generic-arrays-and-primitives/tij-generics-arrayofgenericreference\",\"tij-generics/generic-arrays-and-primitives/tij-generics-arrayofgeneric\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericarray\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericarray2\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericarraywithtypetoken\",\"tij-generics/generic-arrays-and-primitives/tij-generics-genericcast\",\"tij-generics/generic-arrays-and-primitives/tij-generics-listofint\",\"tij-generics/generic-arrays-and-primitives/tij-generics-byteset\",\"tij-generics/generic-arrays-and-primitives/tij-generics-primitivegenerictest\",\"tij-generics/generic-arrays-and-primitives/tij-generics-needcasting\",\"tij-generics/generic-arrays-and-primitives/tij-generics-classcasting\",\"tij-generics/generic-arrays-and-primitives/tij-generics-checkedlist\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-generics/generic-arrays-and-primitives/step-1\",\"title\":\"Generic arrays\",\"body\":\"\u003cp\u003eYou can declare \u003ccode\u003eT[]\u003c/code\u003e, but not create one: \u003ccode\u003enew T[n]\u003c/code\u003e won\u0026#39;t compile.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e(T[])new Object[n]\u003c/code\u003e compiles with a warning, but the real array is an \u003ccode\u003eObject[]\u003c/code\u003e — returning it as \u003ccode\u003eInteger[]\u003c/code\u003e throws.\u003c/p\u003e\\n\u003cp\u003ePassing a \u003ccode\u003eClass\u0026lt;T\u0026gt;\u003c/code\u003e to \u003ccode\u003eArray.newInstance\u003c/code\u003e creates a true \u003ccode\u003eT[]\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-generics/generic-arrays-and-primitives/step-2\",\"title\":\"Primitives and casts\",\"body\":\"\u003cp\u003eType arguments can\u0026#39;t be primitives: use \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e, and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Autoboxing\\\" data-def=\\\"The compiler converting automatically between primitives and their boxed types — \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; ↔ \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eautoboxing\u003c/button\u003e converts.\u003c/p\u003e\\n\u003cp\u003eBut there\u0026#39;s no autoboxing of arrays: an \u003ccode\u003eint[]\u003c/code\u003e is not a \u003ccode\u003eT[]\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCasting to a generic type, like \u003ccode\u003e(List\u0026lt;Widget\u0026gt;)obj\u003c/code\u003e, is unchecked — \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eerasure\u003c/button\u003e means the cast can\u0026#39;t verify the element type.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-generics-arrayofgenericreference\",\"key\":\"tij-generics/generic-arrays-and-primitives/tij-generics-arrayofgenericreference\",\"prompt\":\"\u003cp\u003eCan you declare \u003ccode\u003estatic Generic\u0026lt;Integer\u0026gt;[] gia;\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"Yes — declaring the reference is fine; creating such an array is the problem\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"No\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-arrayofgeneric\",\"key\":\"tij-generics/generic-arrays-and-primitives/tij-generics-arrayofg vecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"The array was really created as \u003ccode\u003eObject[]\u003c/code\u003e; the cast to \u003ccode\u003eT[]\u003c/code\u003e was a lie that erasure hid\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It wouldn\u0026#39;t\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the \u003ccode\u003e//!\u003c/code\u003e line: \u003ccode\u003eClassCastException\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003erep()\u003c/code\u003e returns null\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt returns the array.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eErasure\u003c/button\u003e\"]},{\"id\":\"tij-generics-genericarray2\",\"key\":\"tij-generics/generic-arrays-and-primitives/tij-generics-genericarray2\",\"prompt\":\"\u003cp\u003eWhat is the last line printed?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback
