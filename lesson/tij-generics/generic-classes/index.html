shiki-dark:#B392F0\"\u003e main\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003eString\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e[] \u003c/span\u003e\u003cspan style=\"--shiki-light:#E36209;--shiki-dark:#FFAB70\"\u003eargs\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e) {\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e    System.out.\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003eprintln\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#D73A49;--shiki-dark:#F97583\"\u003enew\u003c/span\u003e\u003cspan style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\"\u003e Store\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e(\u003c/span\u003e\u003cspan style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"\u003e14\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e, \u003c/span\u003e\u003cspan style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"\u003e5\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e, \u003c/span\u003e\u003cspan style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"\u003e10\u003c/span\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e));\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e  }\u003c/span\u003e\u003c/span\u003e\n\u003cspan class=\"line\"\u003e\u003cspan style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"generic-classes\",\"courseId\":\"tij-generics\",\"topicId\":\"thinking-in-java\",\"key\":\"tij-generics/generic-classes\",\"title\":\"Generic classes, tuples and stacks\",\"summary\":\"From holding an Object to holding a T — and tuples, a linked stack and a random list built with type parameters.\",\"duration\":8,\"tags\":[\"java\",\"generics\",\"type parameters\",\"tuples\",\"stack\"],\"sources\":[{\"book\":\"thinking-in-java\",\"ref\":\"Chapter 15, Simple generics; A tuple library; A stack class\"}],\"requires\":[],\"steps\":15,\"stepKeys\":[\"tij-generics/generic-classes/step-1\",\"tij-generics/generic-classes/step-2\",\"tij-generics/generic-classes/tij-generics-holder1\",\"tij-generics/generic-classes/tij-generics-holder2\",\"tij-generics/generic-classes/tij-generics-holder3\",\"tij-generics/generic-classes/tij-generics-simpleholder\",\"tij-generics/generic-classes/tij-generics-genericholder\",\"tij-generics/generic-classes/tij-generics-tupletest\",\"tij-generics/generic-classes/tij-generics-tupletest2\",\"tij-generics/generic-classes/tij-generics-tuplelist\",\"tij-generics/generic-classes/tij-generics-linkedstack\",\"tij-generics/generic-classes/tij-generics-randomlist\",\"tij-generics/generic-classes/tij-generics-simplequeue\",\"tij-generics/generic-classes/tij-generics-listofgenerics\",\"tij-generics/generic-classes/tij-generics-store\"],\"exercises\":[\"tij-generics/generic-classes/tij-generics-holder1\",\"tij-generics/generic-classes/tij-generics-holder2\",\"tij-generics/generic-classes/tij-generics-holder3\",\"tij-generics/generic-classes/tij-generics-simpleholder\",\"tij-generics/generic-classes/tij-generics-genericholder\",\"tij-generics/generic-classes/tij-generics-tupletest\",\"tij-generics/generic-classes/tij-generics-tupletest2\",\"tij-generics/generic-classes/tij-generics-tuplelist\",\"tij-generics/generic-classes/tij-generics-linkedstack\",\"tij-generics/generic-classes/tij-generics-randomlist\",\"tij-generics/generic-classes/tij-generics-simplequeue\",\"tij-generics/generic-classes/tij-generics-listofgenerics\",\"tij-generics/generic-classes/tij-generics-store\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"tij-generics/generic-classes/step-1\",\"title\":\"From Object to T\",\"body\":\"\u003cp\u003eA holder of \u003ccode\u003eObject\u003c/code\u003e accepts anything, and every \u003ccode\u003eget()\u003c/code\u003e needs a cast that can fail at run time.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eHolder\u0026lt;T\u0026gt;\u003c/code\u003e fixes the type when you create it: the compiler rejects the wrong type, and \u003ccode\u003eget()\u003c/code\u003e needs no cast.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-generics/generic-classes/step-2\",\"title\":\"Tuples and containers\",\"body\":\"\u003cp\u003eA tuple groups several objects of different types: \u003ccode\u003eTwoTuple\u0026lt;A,B\u0026gt;\u003c/code\u003e with \u003ccode\u003efinal\u003c/code\u003e public fields \u003ccode\u003efirst\u003c/code\u003e and \u003ccode\u003esecond\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA generic class can wrap any storage — a linked list of nodes, an \u003ccode\u003eArrayList\u003c/code\u003e — and expose a typed interface.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-generics-holder1\",\"key\":\"tij-generics/generic-classes/tij-generics-holder1\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the limitation of \u003ccode\u003eHolder1\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"It can hold only an \u003ccode\u003eAutomobile\u003c/code\u003e — a new class is needed for each type\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It needs a cast on \u003ccode\u003eget()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eget()\u003c/code\u003e returns an \u003ccode\u003eAutomobile\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"It can\u0026#39;t hold anything\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt holds one \u003ccode\u003eAutomobile\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-holder2\",\"key\":\"tij-generics/generic-classes/tij-generics-holder2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eHolder2\u003c/code\u003e holds an \u003ccode\u003eObject\u003c/code\u003e. What\u0026#39;s the cost of that flexibility?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"It can\u0026#39;t hold primitives at all\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eh2.set(1)\u003c/code\u003e autoboxes to an \u003ccode\u003eInteger\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Every \u003ccode\u003eget()\u003c/code\u003e needs a cast, and putting in the wrong type is only caught when the cast fails at run time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"None\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe casts are unchecked until run time.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-holder3\",\"key\":\"tij-generics/generic-classes/tij-generics-holder3\",\"prompt\":\"\u003cp\u003eWhat happens with \u003ccode\u003eh3.set(\u0026quot;Not an Automobile\u0026quot;)\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"It works, storing a \u003ccode\u003eString\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eset\u003c/code\u003e takes a \u003ccode\u003eT\u003c/code\u003e, which is \u003ccode\u003eAutomobile\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Compile error — \u003ccode\u003eh3\u003c/code\u003e is a \u003ccode\u003eHolder3\u0026lt;Automobile\u0026gt;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eClassCastException\u003c/code\u003e at run time\",\"correct\":false,\"feedback\":\"\u003cp\u003eGenerics catch it at compile time.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-simpleholder\",\"key\":\"tij-generics/generic-classes/tij-generics-simpleholder\",\"prompt\":\"\u003cp\u003eWhy does \u003ccode\u003emain\u003c/code\u003e cast \u003ccode\u003eholder.get()\u003c/code\u003e to \u003ccode\u003eString\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"It\u0026#39;s optional\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout the cast, assigning to \u003ccode\u003eString s\u003c/code\u003e won\u0026#39;t compile.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eget()\u003c/code\u003e returns \u003ccode\u003eObject\u003c/code\u003e; the compiler doesn\u0026#39;t know it\u0026#39;s a \u003ccode\u003eString\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-generics-genericholder\",\"key\":\"tij-generics/generic-classes/tij-generics-genericholder\",\"prompt\":\"\u003cp\u003eAfter \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Erasure\\\" data-def=\\\"Generic type arguments are checked at compile time and then removed, so at run time a \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eerasure\u003c/button\u003e, how does the bytecode of \u003ccode\u003eGenericHolder\u0026lt;String\u0026gt;\u003c/code\u003e compare with \u003ccode\u003eSimpleHolder\u003c/code\u003e (which holds an \u003ccode\u003eObject\u003c/code\u003e)?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"\u003ccode\u003eGenericHolder\u003c/code\u003e stores a \u003ccode\u003eString\u003c/code\u003e field\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eT\u003c/code\u003e erases to \u003ccode\u003eObject\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eGenericHolder\u003c/code\u003e checks the type on \u003ccode\u003eset()\u003c/code\u003e at run time\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe check happens at compile time; at run time there\u0026#39;s just the inserted cast on the way out.\u003c/p\u003e\\n\"},{\"html\":\"Nearly identical — the compiler inserts the cast on \u003ccode\u003eget()\u003c/code\u003e for you\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"tij-generics-tupletest\",\"key\":\"tij-generics/generic-classes/tij-generics-tupletest\",\"prompt\":\"\u003cp\u003eTuples print as \u003ccode\u003e(a, b, …)\u003c/code\u003e using each element\u0026#39;s \u003ccode\u003etoString\u003c/code\u003e. What does \u003ccode\u003eSystem.out.println(f())\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003ettsi.first = \u0026quot;there\u0026quot;\u003c/code\u003e would fail: the fields are \u003ccode\u003epublic final\u003c/code\u003e, so readable but not writable.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"(hi, 47)\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"(String, Integer)\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt prints the values.\u003c/p\u003e\\n\"},{\"html\":\"TwoTuple@1b6d3586\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe tuple classes override \u003ccode\u003etoString\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-tupletest2\",\"key\":\"tij-generics/generic-classes/tij-generics-tupletest2\",\"prompt\":\"\u003cp\u003eHow does \u003ccode\u003etuple(\u0026quot;hi\u0026quot;, 47)\u003c/code\u003e build a \u003ccode\u003eTwoTuple\u0026lt;String,Integer\u0026gt;\u003c/code\u003e without spelling out the types?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"Reflection\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s ordinary \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Type inference\\\" data-def=\\\"The compiler working out type arguments for you, e.g. from the diamond \u0026lt;code\u0026gt;new ArrayList\u0026amp;lt;\u0026amp;gt;()\u0026lt;/code\u0026gt; or a generic method\u0026amp;#39;s arguments.\\\" data-book=\\\"Effective Java\\\"\u003etype inference\u003c/button\u003e.\u003c/p\u003e\\n\"},{\"html\":\"It returns a raw \u003ccode\u003eTwoTuple\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ef()\u003c/code\u003e returns a typed \u003ccode\u003eTwoTuple\u0026lt;String,Integer\u0026gt;\u003c/code\u003e; only \u003ccode\u003ef2\u003c/code\u003e uses the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Raw type\\\" data-def=\\\"A generic type used without type arguments, like \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt; instead of \u0026lt;code\u0026gt;List\u0026amp;lt;String\u0026amp;gt;\u0026lt;/code\u0026gt;. Exists only for compatibility; loses all type safety.\\\" data-book=\\\"Effective Java\\\"\u003eraw type\u003c/button\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etuple\u003c/code\u003e is an overloaded generic method; the compiler infers \u003ccode\u003eA\u003c/code\u003e and \u003ccode\u003eB\u003c/code\u003e from the arguments\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Generic method\\\" data-def=\\\"A method with its own type parameters, declared before the return type — \u0026lt;code\u0026gt;static \u0026amp;lt;E\u0026amp;gt; Set\u0026amp;lt;E\u0026amp;gt; union(Set\u0026amp;lt;E\u0026amp;gt; a, Set\u0026amp;lt;E\u0026amp;gt; b)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eGeneric method\u003c/button\u003e\"]},{\"id\":\"tij-generics-tuplelist\",\"key\":\"tij-generics/generic-classes/tij-generics-tuplelist\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eTupleList\u0026lt;A,B,C,D\u0026gt;\u003c/code\u003e extends \u003ccode\u003eArrayList\u0026lt;FourTuple\u0026lt;A,B,C,D\u0026gt;\u0026gt;\u003c/code\u003e. What does each printed line look like?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"\u003ccode\u003e[Vehicle, Amphibian, String, Integer]\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt prints the stored values.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e(Vehicle@…, Amphibian@…, hi, 47)\u003c/code\u003e — the classes don\u0026#39;t override \u003ccode\u003etoString\u003c/code\u003e, so hash codes appear\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e(Vehicle, Amphibian, hi, 47)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eVehicle\u003c/code\u003e and \u003ccode\u003eAmphibian\u003c/code\u003e use \u003ccode\u003eObject.toString\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003eHash code\u003c/button\u003e\"]},{\"id\":\"tij-generics-linkedstack\",\"key\":\"tij-generics/generic-classes/tij-generics-linkedstack\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe end sentinel node has \u003ccode\u003eitem == null\u003c/code\u003e, so \u003ccode\u003epop()\u003c/code\u003e returns \u003ccode\u003enull\u003c/code\u003e when the stack is empty.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$1b\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003estun!\\non\\nPhasers\\nnull\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe loop stops when \u003ccode\u003epop()\u003c/code\u003e returns \u003ccode\u003enull\u003c/code\u003e at the sentinel; it doesn\u0026#39;t print it.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003estun!\\non\\nPhasers\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003ePhasers\\non\\nstun!\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA stack pops the last pushed item first.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-generics-randomlist\",\"key\":\"tij-generics/generic-classes/tij-generics-randomlist\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003eselect()\u003c/code\u003e return?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1c\",\"options\":[{\"html\":\"And removes a random element\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eselect\u003c/code\u003e doesn\u0026#39;t remove anything.\u003c/p\u003e\\n\"},{\"html\":\"A random element of the stored list, typed as \u003ccode\u003eT\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The elements in order\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt uses \u003ccode\u003erand.nextInt(storage.size())\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-simplequeue\",\"key\":\"tij-generics/generic-classes/tij-generics-simplequeue\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eSimpleQueue\u0026lt;T\u0026gt;\u003c/code\u003e implements \u003ccode\u003eIterable\u0026lt;T\u0026gt;\u003c/code\u003e. What does that allow?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1d\",\"options\":[{\"html\":\"Adding elements with \u003ccode\u003eadd\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s its own method; \u003ccode\u003eIterable\u003c/code\u003e is about iteration.\u003c/p\u003e\\n\"},{\"html\":\"Using it in a foreach loop\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Treating it as a \u003ccode\u003eCollection\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt isn\u0026#39;t a \u003ccode\u003eCollection\u003c/code\u003e — it only provides \u003ccode\u003eiterator()\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-listofgenerics\",\"key\":\"tij-generics/generic-classes/tij-generics-listofgenerics\",\"prompt\":\"\u003cp\u003eWhy use a \u003ccode\u003eList\u0026lt;T\u0026gt;\u003c/code\u003e here instead of a \u003ccode\u003eT[]\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1e\",\"options\":[{\"html\":\"You can\u0026#39;t create a \u003ccode\u003eT[]\u003c/code\u003e; an \u003ccode\u003eArrayList\u0026lt;T\u0026gt;\u003c/code\u003e gives the same flexibility without that problem\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Lists are faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe point is that generic arrays can\u0026#39;t be created.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"tij-generics-store\",\"key\":\"tij-generics/generic-classes/tij-generics-store\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eStore\u003c/code\u003e is an \u003ccode\u003eArrayList\u0026lt;Aisle\u0026gt;\u003c/code\u003e, each \u003ccode\u003eAisle\u003c/code\u003e an \u003ccode\u003eArrayList\u0026lt;Shelf\u0026gt;\u003c/code\u003e, each \u003ccode\u003eShelf\u003c/code\u003e an \u003ccode\u003eArrayList\u0026lt;Product\u0026gt;\u003c/code\u003e. How many products does \u003ccode\u003enew Store(14, 5, 10)\u003c/code\u003e hold?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target
