t.\u003c/p\u003e\\n\u003cp\u003eIn Java: implement each interface and delegate to an implementation object, or wrap objects in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorators\u003c/button\u003e, or build a dynamic proxy that delegates per interface.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-generics/mixins-and-latent-typing/step-2\",\"title\":\"Latent typing\",\"body\":\"\u003cp\u003ePython or C++ templates accept anything that has the methods you call — latent (duck) typing.\u003c/p\u003e\\n\u003cp\u003eJava generics need an interface or bound instead.\u003c/p\u003e\\n\u003cp\u003eYou can simulate it with reflection (call by name), or with adapters to an interface like \u003ccode\u003eAddable\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-generics-mixins\",\"key\":\"tij-generics/mixins-and-latent-typing/tij-generics-mixins\",\"prompt\":\"\u003cp\u003eHow does \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Mixin\\\" data-def=\\\"A type a class implements in addition to its primary type, to declare an optional behavior — \u0026lt;code\u0026gt;Comparable\u0026lt;/code\u0026gt; is a mixin.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003eMixin\u003c/code\u003e\u003c/button\u003e get time stamps and serial numbers?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEach line prints the string, a timestamp and the serial number: \u003ccode\u003etest string 1 \u0026lt;time\u0026gt; 1\u003c/code\u003e, then \u003ccode\u003e… 2\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\
