\"sources\":[{\"book\":\"jcip\",\"ref\":\"§10.1.1–10.1.2, Lock-ordering Deadlocks; Dynamic Lock Order Deadlocks\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-liveness/lock-ordering-deadlocks/step-1\",\"jcip-liveness/lock-ordering-deadlocks/step-2\",\"jcip-liveness/lock-ordering-deadlocks/step-3\",\"jcip-liveness/lock-ordering-deadlocks/step-4\",\"jcip-liveness/lock-ordering-deadlocks/step-5\",\"jcip-liveness/lock-ordering-deadlocks/step-6\",\"jcip-liveness/lock-ordering-deadlocks/step-7\"],\"exercises\":[\"jcip-liveness/lock-ordering-deadlocks/step-2\",\"jcip-liveness/lock-ordering-deadlocks/step-4\",\"jcip-liveness/lock-ordering-deadlocks/step-6\",\"jcip-liveness/lock-ordering-deadlocks/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-1\",\"title\":\"The deadly embrace\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eleftRight\u003c/code\u003e locks \u003ccode\u003eleft\u003c/code\u003e, then \u003ccode\u003eright\u003c/code\u003e; \u003ccode\u003erightLeft\u003c/code\u003e locks \u003ccode\u003eright\u003c/code\u003e, then \u003ccode\u003eleft\u003c/code\u003e. Thread 1 runs \u003ccode\u003eleftRight\u003c/code\u003e; thread 2 runs \u003ccode\u003erightLeft\u003c/code\u003e. Locks \u003cstrong\u003eL\u003c/strong\u003e and \u003cstrong\u003eR\u003c/strong\u003e stand for \u003ccode\u003eleft\u003c/code\u003e and \u003ccode\u003eright\u003c/code\u003e.\\n\u003cstrong\u003eMake them \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\u003c/strong\u003e\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eT1 holds L and wants R; T2 holds R and wants L. Neither can ever proceed.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet each thread take its first lock before either takes its second.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock L\",\"lock R\",\"doSomething\",\"unlock R\",\"unlock L\"]},{\"name\":\"T2\",\"ops\":[\"lock R\",\"lock L\",\"doSomethingElse\",\"unlock L\",\"unlock R\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eIn the deadlock, what does each thread hold, and wait for?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"T1 holds L and waits for R; T2 holds R and waits for L\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"T1 holds both locks; T2 waits\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen T1 would just finish and release them.\u003c/p\u003e\\n\"},{\"html\":\"Both hold nothing and wait for L\",\"correct\":false,\"feedback\":\"\u003cp\u003eNobody waiting while holding nothing can\u0026#39;t deadlock — someone would get L.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-3\",\"title\":\"One global order\",\"body\":\"\u003cp\u003eIf every thread takes locks in the same order, no cycle can form.\u003c/p\u003e\\n\u003cp\u003eSo no \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-4\",\"prompt\":\"\u003cp\u003eThe fix: \u003cstrong\u003eevery thread acquires the locks in the same order\u003c/strong\u003e. Both methods now take L, then R.\\nTry to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e them — then run both to completion.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith a global \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock ordering\\\" data-def=\\\"Always acquiring multiple locks in the same global order, which makes lock-ordering deadlocks impossible.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock order\u003c/button\u003e, whoever gets L first also gets R; the other waits for L without holding anything.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock L\",\"lock R\",\"doSomething\",\"unlock R\",\"unlock L\"]},{\"name\":\"T2\",\"ops\":[\"lock L\",\"lock R\",\"doSomethingElse\",\"unlock R\",\"unlock L\"]}]},\"goal\":{\"finished\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhy can\u0026#39;t they deadlock any more?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"The locks are released sooner\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe release order didn\u0026#39;t change — the order of taking them did.\u003c/p\u003e\\n\"},{\"html\":\"Only one thread can run at a time now\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth threads still run; they just can\u0026#39;t form a cycle.\u003c/p\u003e\\n\"},{\"html\":\"Whoever gets L also gets R; the other waits for L while holding nothing\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-5\",\"title\":\"Order can hide in arguments\",\"body\":\"\u003cp\u003e\u003ccode\u003etransferMoney(a, b)\u003c/code\u003e locks \u003ccode\u003ea\u003c/code\u003e, then \u003ccode\u003eb\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003etransferMoney(b, a)\u003c/code\u003e locks \u003ccode\u003eb\u003c/code\u003e, then \u003ccode\u003ea\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eFix it by ordering locks by a unique key, like the account number.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003etransferMoney(a, b, 10)\u003c/code\u003e and \u003ccode\u003etransferMoney(b, a, 20)\u003c/code\u003e can \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e. How can \u003ccode\u003etransferMoney\u003c/code\u003e impose a consistent order?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003etransferMoney(a, b)\u003c/code\u003e locks the source then the destination, so two transfers in opposite directions lock the same pair in opposite orders and can deadlock.\u003c/p\u003e\\n\u003cp\u003eOrdering by a unique key — an account number, or \u003ccode\u003eSystem.identityHashCode\u003c/code\u003e with a tie-breaking lock for the rare collision — makes every thread take the two locks in the same order whatever the argument order.\u003c/p\u003e\\n\u003cp\u003eWith one global order, a cycle of waiting can\u0026#39;t form.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"Use \u003ccode\u003evolatile\u003c/code\u003e balances instead\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat removes \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomicity\u003c/button\u003e of the transfer, not the deadlock risk.\u003c/p\u003e\\n\"},{\"html\":\"Always lock \u003ccode\u003efrom\u003c/code\u003e first\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s exactly the bug — \u003ccode\u003efrom\u003c/code\u003e in one call is \u003ccode\u003eto\u003c/code\u003e in the other.\u003c/p\u003e\\n\"},{\"html\":\"Order the two locks by some unique key — such as account number, or \u003ccode\u003eSystem.identityHashCode\u003c/code\u003e with a tie-breaking lock\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"A program will be free of lock-ordering deadlocks if all threads acquire the locks they need in a fixed global \",\"html\":\"A program will be free of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock ordering\\\" data-def=\\\"Always acquiring multiple locks in the same global order, which makes lock-ordering deadlocks impossible.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock-ordering\u003c/button\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlocks\u003c/button\u003e if all threads acquire the locks they need in a fixed global \"},{\"answers\":[\"order\"],\"size\":5,\"choices\":[\"order\",\"open\",\"any\",\"blocked\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false}]},\"courseTitle\":\"Avoiding liveness hazards\",\"next\":{\"id\":\"open-calls\",\"courseId\":\"jcip-liveness\",\"topicId\":\"jcip\",\"key\":\"jcip-liveness/open-calls\",\"title\":\"Deadlocks between cooperating objects\",\"summary\":\"Calling an alien method while holding a lock can hide a lock-ordering deadlock across classes — use open calls.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"deadlock\",\"open calls\",\"alien methods\",\"resource deadlock\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§10.1.3–10.1.5, Deadlocks Between Cooperating Objects; Open Calls; Resource Deadlocks\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-liveness/open-calls/step-1\",\"jcip-liveness/open-calls/step-2\",\"jcip-liveness/open-calls/step-3\",\"jcip-liveness/open-calls/step-4\",\"jcip-liveness/open-calls/step-5\",\"jcip-liveness/open-calls/step-6\",\"jcip-liveness/open-calls/step-7\"],\"exercises\":[\"jcip-liveness/open-calls/step-2\",\"jcip-liveness/open-calls/step-4\",\"jcip-liveness/open-calls/step-6\",\"jcip-liveness/open-calls/step-7\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"author
