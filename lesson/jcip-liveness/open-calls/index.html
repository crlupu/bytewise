"step-2\",\"key\":\"jcip-liveness/open-calls/step-2\",\"prompt\":\"\u003cp\u003eA GPS update calls \u003ccode\u003esetLocation\u003c/code\u003e (Taxi lock \u003cstrong\u003eT\u003c/strong\u003e, then Dispatcher lock \u003cstrong\u003eD\u003c/strong\u003e). At the same time, the UI calls\\n\u003ccode\u003egetImage\u003c/code\u003e (D, then T). \u003cstrong\u003eFind the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\u003c/strong\u003e\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe same \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock ordering\\\" data-def=\\\"Always acquiring multiple locks in the same global order, which makes lock-ordering deadlocks impossible.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock-ordering\u003c/button\u003e deadlock — but spread across two classes, so neither class\u0026#39;s author could see it.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"GPS\",\"ops\":[\"lock T\",\"update location\",\"lock D\",\"notifyAvailable\",\"unlock D\",\"unlock T\"]},{\"name\":\"UI\",\"ops\":[\"lock D\",\"start image\",\"lock T\",\"getLocation\",\"unlock T\",\"unlock D\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhich waits form the deadlock?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Both threads want T while holding nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen one would get T and carry on.\u003c/p\u003e\\n\"},{\"html\":\"GPS holds both locks and UI waits\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen GPS would finish and release them.\u003c/p\u003e\\n\"},{\"html\":\"GPS holds T and wants D; UI holds D and wants T\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-liveness/open-calls/step-3\",\"title\":\"Call out without locks\",\"body\":\"\u003cp\u003eAn \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Open call\\\" data-def=\\\"Calling an alien method with no locks held. Makes deadlocks much easier to rule out.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eopen call\u003c/button\u003e is a call made with no locks held.\u003c/p\u003e\\n\u003cp\u003eUpdate your state inside the lock.\u003c/p\u003e\\n\u003cp\u003eCall other objects after releasing it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-liveness/open-calls/step-4\",\"prompt\":\"\u003cp\u003eWith \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Open call\\\" data-def=\\\"Calling an alien method with no locks held. Makes deadlocks much easier to rule out.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eopen calls\u003c/button\u003e\u003c/strong\u003e, each method releases its own lock before calling the other object. Run both threads to completion.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNo thread ever holds two locks at once, so no cycle of waiting can form.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"GPS\",\"ops\":[\"lock T\",\"update location\",\"unlock T\",\"lock D\",\"notifyAvailable\",\"unlock D\"]},{\"name\":\"UI\",\"ops\":[\"lock D\",\"copy taxi list\",\"unlock D\",\"lock T\",\"getLocation\",\"unlock T\"]}]},\"goal\":{\"finished\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhat removed the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"The locks are now taken in alphabetical order\",\"correct\":false,\"feedback\":\"\u003cp\u003eGPS still takes T first and UI takes D first — they just release before taking the next.\u003c/p\u003e\\n\"},{\"html\":\"There\u0026#39;s only one lock now\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth locks are still there.\u003c/p\u003e\\n\"},{\"html\":\"Neither thread holds its own lock while it asks for the other one\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-liveness/open-calls/step-5\",\"title\":\"Resources deadlock too\",\"body\":\"\u003cp\u003ePools of connections can \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e like locks.\u003c/p\u003e\\n\u003cp\u003eTwo threads, two pools, opposite orders.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-liveness/open-calls/step-6\",\"prompt\":\"\u003cp\u003eTwo threads each need connections from two different database pools of size 1, and take them in opposite orders. What can happen?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread starvation deadlock\\\" data-def=\\\"Tasks in a pool wait on other tasks queued in the same pool, but every worker is busy waiting — nobody can make progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread starvation deadlock\u003c/button\u003e in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread pool\\\" data-def=\\\"A set of worker threads that take tasks from a queue and run them, reusing threads instead of creating one per task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread pools\u003c/button\u003e is another kind of resource deadlock.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eDeadlock isn\u0026#39;t only about locks: any resource that threads hold while waiting for another can form a cycle.\u003c/p\u003e\\n\u003cp\u003eThread 1 holds the only connection of pool A and waits for pool B; thread 2 holds pool B\u0026#39;s only connection and waits for pool A.\u003c/p\u003e\\n\u003cp\u003eLarger pools make it rarer but not impossible. The cure is the same as for locks — acquire resources in a consistent order, or don\u0026#39;t hold one while waiting for another.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A \u003cstrong\u003eresource deadlock\u003c/strong\u003e — the same cycle of waiting, on pooled resources instead of locks\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — pools aren\u0026#39;t locks\",\"correct\":false,\"feedback\":\"\u003cp\u003eAnything a thread can wait for can take part in a deadlock.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"jcip-liveness/open-calls/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Strive to use \",\"html\":\"Strive to use \"},{\"answers\":[\"open\"],\"size\":4,\"choices\":[\"open\",\"atomic\",\"order\",\"blocked\"]},{\"text\":\" calls throughout your program — calling alien methods with no locks held.\",\"html\":\" calls throughout your program — calling \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Alien method\\\" data-def=\\\"A method whose behavior you don\u0026amp;#39;t control — overridable methods, or methods of objects passed in. Calling one while holding a lock invites deadlock.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ealien methods\u003c/button\u003e with no locks held.\"}],\"code\":false,\"caseSensitive\":false}]},\"courseTitle\":\"Avoiding liveness hazards\",\"next\":{\"id\":\"avoiding-deadlocks\",\"courseId\":\"jcip-liveness\",\"topicId\":\"jcip\",\"key\":\"jcip-liveness/avoiding-deadlocks\",\"title\":\"Avoiding and diagnosing deadlocks\",\"summary\":\"Fewer locks held at once, timed tryLock with back-off, and thread dumps when it happens anyway.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"deadlock\",\"trylock\",\"timeouts\",\"thread dumps\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§10.2, Avoiding and Diagnosing Deadlocks\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-liveness/avoiding-deadlocks/step-1\",\"jcip-liveness/avoiding-deadlocks/step-2\",\"jcip-liveness/avoiding-deadlocks/step-3\",\"jcip-liveness/avoiding-deadlocks/step-4\",\"jcip-liveness/avoiding-deadlocks/step-5\",\"jcip-liveness/avoiding-deadlocks/step-6\",\"jcip-liveness/avoiding-deadlocks/step-7\"],\"exercises\":[\"jcip-liveness/avoiding-deadlocks/step-3\",\"jcip-liveness/avoiding-deadlocks/step-5\",\"jcip-liveness/avoiding-deadlocks/step-6\",\"jcip-liveness/avoiding-deadlocks/step-7\"]},\"books\":{\"effect
