d\":\"step-2\",\"key\":\"tij-objects/aliasing/step-2\",\"title\":\"Assignment copies the reference\",\"body\":\"\u003cp\u003e\u003ccode\u003et1 = t2;\u003c/code\u003e copies the reference in \u003ccode\u003et2\u003c/code\u003e into \u003ccode\u003et1\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eNow both point at the second tank.\u003c/p\u003e\\n\u003cp\u003eThe first tank has no references left, so the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003egarbage collector\u003c/button\u003e can reclaim it.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-3\",\"key\":\"tij-objects/aliasing/step-3\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"9 47\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe assignment \u003ccode\u003et1.level = 27\u003c/code\u003e changes the shared tank.\u003c/p\u003e\\n\"},{\"html\":\"27 47\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003et1\u003c/code\u003e and \u003ccode\u003et2\u003c/code\u003e refer to the same tank now, so changing it through one shows through the other.\u003c/p\u003e\\n\"},{\"html\":\"27 27\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"tij-objects/aliasing/step-4\",\"title\":\"Method calls alias too\",\"body\":\"\u003cp\u003ePassing an object to a method copies the reference.\u003c/p\u003e\\n\u003cp\u003eThe parameter points at the caller\u0026#39;s object.\u003c/p\u003e\\n\u003cp\u003eSo the method can change it — but reassigning the parameter changes nothing outside.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-objects/aliasing/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eJava passes everything by value, but for objects the value is a reference.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ef\u003c/code\u003e gets a copy of the reference in \u003ccode\u003ex\u003c/code\u003e, so \u003ccode\u003ey\u003c/code\u003e points at the same \u003ccode\u003eLetter\u003c/code\u003e object.\u003c/p\u003e\\n\u003cp\u003eChanging \u003ccode\u003ey.c\u003c/code\u003e changes that shared object, so \u003ccode\u003ex.c\u003c/code\u003e is now \u003ccode\u003e\u0026#39;z\u0026#39;\u003c/code\u003e as well.\u003c/p\u003e\\n\u003cp\u003eThis is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Aliasing\\\" data-def=\\\"Two or more references pointing at the same object, so a change made through one is visible through the others.\\\" data-book=\\\"Thinking in Java\\\"\u003ealiasing\u003c/button\u003e through a method call: the method can change the object you passed, though never your variable.\u003c/p\u003e\\n\",\"diagram\":\"$16\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ez\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ea\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ey\u003c/code\u003e is a copy of the reference, but it points at the same object, so \u003ccode\u003ey.c = \u0026#39;z\u0026#39;\u003c/code\u003e changes \u003ccode\u003ex\u003c/code\u003e\u0026#39;s letter.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-6\",\"key\":\"tij-objects/aliasing/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003estatic void g(Letter y) { y = new Letter(); y.c = \u0026#39;q\u0026#39;; }\u003c/code\u003e — af
