cks, allocations, method samples — cheap enough to run in production.\\\" data-book=\\\"Java Performance\\\"\u003eJFR\u003c/button\u003e sample without waiting for safepoints and avoid this bias.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Profilers that sample only at safepoints attribute time to the wrong place; others, like async-profiler, don\u0026#39;t wait for safepoints\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"One of them must be broken\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth can be working as designed; they sample differently.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Safepoint\\\" data-def=\\\"A point in running code where a thread can be stopped safely for GC or deoptimization. Some profilers can only sample there.\\\" data-book=\\\"Java Performance\\\"\u003eSafepoint\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jperf-toolbox/profilers-and-jfr/step-4\",\"title\":\"Instrumented profilers and JFR\",\"body\":\"\u003cp\u003eInstrumented profilers add timing code to every method.\u003c/p\u003e\\n\u003cp\u003eThey count calls exactly, but slow small methods down and change what the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e does.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Java Flight Recorder\\\" data-def=\\\"An event recorder built into the JVM — GC, locks, allocations, method samples — cheap enough to run in production.\\\" data-book=\\\"Java Performance\\\"\u003eJava Flight Re
