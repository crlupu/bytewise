;t have methods\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can have fields, constructors and methods like any class.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-enums/enums-are-classes/step-3\",\"title\":\"Constants with their own behaviour\",\"body\":\"\u003cp\u003eA constant can have a body: \u003ccode\u003eWASH { void action() { ... } }\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThen it\u0026#39;s an instance of an anonymous subclass of the enum.\u003c/p\u003e\\n\u003cp\u003eEach constant overrides the method its own way.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-4\",\"key\":\"tij-enums/enums-are-classes/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eCycle c = Cycle.RINSE; c.action();\u003c/code\u003e — tap where the code that runs is defined.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRINSE is an instance of its own anonymous subclass, so its \u003ccode\u003eaction()\u003c/code\u003e runs — plain polymorphism.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen an enum constant has a body, the compiler makes it an anonymous subclass of the enum, with exactly one instance.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ec\u003c/code\u003e is declared as \u003ccode\u003eCycle\u003c/code\u003e, but the object it refers to belongs to that subclass, so \u003ccode\u003eaction()\u003c/code\u003e is late-bound to the method inside \u003ccode\u003eRINSE\u003c/code\u003e\u0026#39;s body.\u003c/p\u003e\\n\u003cp\u003eThis is the same polymorphism as with any class hierarchy, packed into a single enum declaration.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Cycle\",\"kind\":\"enum\",\"methods\":[\"action() {abstract}\"]},{\"name\":\"WASH { }\",\"methods\":[\"action()\"]},{\"name\":\"RINSE { }\",\"methods\":[\"action()\"]},{\"name\":\"SPIN { }\",\"methods\":[\"action()\"]}],\"relations\":[{\"from\":\"WASH { }\",\"to\":\"Cycle\",\"type\":\"extends\"},{\"from\":\"RINSE { }\",\"to\":\"Cycle\",\"type\":\"extends\"},{\"from\":\"SPIN { }\",\"to\":\"Cycle\",\"type\":\"extends\"}]},\"feedback\":{\"Cycle\":\"`action()` is abstract in Cycle — each constant supplies its own.\"}},\"goal\":{\"select\":\"RINSE { }\"},\"question\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-enums/enums-are-classes/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e2 1\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003evalueOf\u003c/code\u003e returns the constant, which prints as its name.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e2 YELLOW\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e3 YELLOW\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0026lt;code\u0026gt;ordinal()\u0026lt;/code\u0026gt;. Don\u0026amp;#39;t store meaning in it — reorder the constants and it changes.\\\" data-book=\\\"Effective Java\\\"\u003eOrdinals\u003c/button\u003e start at 0, so RED, the third constant, is 2.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-enumerated-enumclass\",\"key\":\"tij-enums/enums-are-classes/tij-enumerated-enumclass\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eShrubbery\u003c/code\u003e is \u003ccode\u003e{ GROUND, CRAWLING, HANGING }\u003c/code\u003e. For \u003ccode\u003eGROUND\u003c/code\u003e, what are the first two lines printed? (\u003ccode\u003eprint\u003c/code\u003e is \u003c \"Effective Java\\\"\u003eOrdinals\u003c/button\u003e start at 0.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-enumerated-burrito\",\"key\":\"tij-enums/enums-are-classes/tij-enumerated-burrito\",\"prompt\":\"\u003cp\u003eWith \u003ccode\u003eimport static enumerated.Spiciness.*\u003c/code\u003e, what does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$17\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eBurrito is NOT\\nBurrito is MEDIUM\\nBurrito is HOT\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile — \u003ccode\u003eNOT\u003c/code\u003e needs \u003ccode\u003eSpiciness.\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static import\\\" data-def=\\\"\u0026lt;code\u0026gt;import static java.lang.Math.PI;\u0026lt;/code\u0026gt; — lets you use a class\u0026amp;#39;s static members without the class name.\\\" data-book=\\\"Effective Java\\\"\u003estatic import\u003c/button\u003e lets you use the constants unqualified.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-enumerated-spiciness\",\"key\":\"tij-enums/enums-are-classes/tij-enumerated-spiciness\",\"prompt\":\"\u003cp\u003eWhat is \u003ccode\u003eSpiciness.valueOf(\u0026quot;HOT\u0026quot;)\u003c/code\u003e?\u003c/p\u003e\\n\",\"expla
