, YELLOW, RED }\u003c/code\u003e compiles to a class extending \u003ccode\u003eEnum\u0026lt;Signal\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe three constants are its only instances, created when the class loads.\u003c/p\u003e\\n\u003cp\u003eIt inherits \u003ccode\u003ename()\u003c/code\u003e, \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0026lt;code\u0026gt;ordinal()\u0026lt;/code\u0026gt;. Don\u0026amp;#39;t store meaning in it — reorder the constants and it changes.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003eordinal()\u003c/code\u003e\u003c/button\u003e and \u003ccode\u003ecompareTo()\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"tij-enums/enums-are-classes/step-2\",\"prompt\":\"\u003cp\u003eWhy can\u0026#39;t an enum extend another class?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It already extends \u003ccode\u003ejava.lang.Enum\u003c/code\u003e, and Java allows only one superclass\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Enums can\u0026#39;t have methods\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can have fields, constructors and methods like any class.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"tij-enums/enums-are-classes/step-3\",\"title\":\"Constants with their own behaviour\",\"body\":\"\u003cp\u003eA constant can have a body: \u003ccode\u003eWASH { void action() { ... } }\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThen it\u0026#39;s an instance of an anonymous subclass of the enum.\u003c/p\u003e\\n\u003cp\u003eEach constant overrides the method its own way.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-4\",\"key\":\"tij-enums/enums-are-classes/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eCycle c = Cycle.RINSE; c.action();\u003c/code\u003e — tap where the code that runs is defined.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRINSE is an instance of its own anonymous subclass, so its \u003ccode\u003eaction()\u003c/code\u003e runs — plain polymorphism.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen an enum constant has a body, the compiler makes it an anonymous subclass of the enum, with exactly one instance.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ec\u003c/code\u003e is declared as \u003ccode\u003eCycle\u003c/code\u003e, but the object it refers to belongs to that subclass, so \u003ccode\u003eaction()\u003c/code\u003e is late-bound to the method inside \u003ccode\u003eRINSE\u003c/code\u003e\u0026#39;s body.\u003c/p\u003e\\n\u003cp\u003eThis is the same polymorphism as with any class hierarchy, packed into a single enum declaration.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Cycle\",\"kind\":\"enum\",\"methods\":[\"action() {abstract}\"]},{\"name\":\"WASH { }\",\"methods\":[\"action()\"]},{\"name\":\"RINSE { }\",\"methods\":[\"action()\"]},{\"name\":\"SPIN { }\",\"methods\":[\"action()\"]}],\"relations\":[{\"from\":\"WASH { }\",\"to\":\"Cycle\",\"type\":\"extends\"},{\"from\":\"RINSE { }\",\"to\":\"Cycle\",\"type\":\"extends\"},{\"from\":\"SPIN { }\",\"to\":\"Cycle\",\"type\":\"extends\"}]},\"feedback\":{\"Cycle\":\"`action()` is abstract in Cycle — each constant supplies its own.\"}},\"goal\":{\"select\":\"RINSE { }\"},\"question\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"tij-enums/enums-are-classes/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e2 1\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003evalueOf\u003c/code\u003e returns the constant, which prints as its name.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e2 YELLOW\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e3 YELLOW\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0026lt;code\u0026gt;ordinal()\u0026lt;/code\u0026gt;. Don\u0026amp;#39;t store meaning in it — reorder the constants and it changes.\\\" data-book=\\\"Effective Java\\\"\u003eOrdinals\u003c/button\u003e start at 0, so RED, the third constant, is 2.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]}]},\"courseTitle\":\"Enumerated types\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url
