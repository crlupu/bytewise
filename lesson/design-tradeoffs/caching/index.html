\",\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"caching\",\"courseId\":\"design-tradeoffs\",\"topicId\":\"architecture\",\"key\":\"design-tradeoffs/caching\",\"title\":\"Caching a read-heavy service\",\"summary\":\"Cache-aside, write-through, replicas and CDNs — each buys speed with something else.\",\"duration\":9,\"tags\":[\"architecture\",\"caching\",\"trade-offs\",\"consistency\",\"latency\",\"cdn\"],\"sources\":[],\"requires\":[],\"steps\":8,\"stepKeys\":[\"design-tradeoffs/caching/step-1\",\"design-tradeoffs/caching/step-2\",\"design-tradeoffs/caching/step-3\",\"design-tradeoffs/caching/step-4\",\"design-tradeoffs/caching/step-5\",\"design-tradeoffs/caching/step-6\",\"design-tradeoffs/caching/step-7\",\"design-tradeoffs/caching/step-8\"],\"exercises\":[\"design-tradeoffs/caching/step-2\",\"design-tradeoffs/caching/step-4\",\"design-tradeoffs/caching/step-5\",\"design-tradeoffs/caching/step-6\",\"design-tradeoffs/caching/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"design-tradeoffs/caching/step-1\",\"title\":\"There's no free speed\",\"body\":\"\u003cp\u003eA product catalogue gets 95% reads, all hitting the database.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCaches\u003c/button\u003e, replicas and CDNs speed it up.\u003c/p\u003e\\n\u003cp\u003eEach costs freshness, money or complexity.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"design-tradeoffs/caching/step-2\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eProduct pages.\u003c/strong\u003e Get latency down to \u003cstrong\u003e3 or less\u003c/strong\u003e. Prices may be a little stale (staleness up to \u003cstrong\u003e5\u003c/strong\u003e),\\nbut your small team can\u0026#39;t run anything too intricate (complexity up to \u003cstrong\u003e7\u003c/strong\u003e).\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA cache alone gets you there. Adding replicas or a CDN on top would buy a little more speed at the price of\\nstaleness you\u0026#39;d then have to manage. More than one design passes — that\u0026#39;s normal.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe application cache is the biggest lever on latency.\u003c/p\u003e\\n\",\"\u003cp\u003eRead replicas and a CDN both add staleness. You may not need either.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"tradeoff\",\"config\":{\"metrics\":[{\"id\":\"latency\",\"label\":\"Latency\",\"start\":8,\"better\":\"lower\"},{\"id\":\"staleness\",\"label\":\"Staleness\",\"start\":0,\"better\":\"lower\"},{\"id\":\"cost\",\"label\":\"Cost\",\"start\":3,\"better\":\"lower\"},{\"id\":\"complexity\",\"label\":\"Complexity\",\"start\":2,\"better\":\"lower\"}],\"decisions\":[{\"id\":\"cache\",\"label\":\"Application cache\",\"options\":[{\"id\":\"none\",\"label\":\"No cache\",\"consequence\":\"Every page view queries the database; under load, latency stays high.\"},{\"id\":\"aside\",\"label\":\"Cache-aside, 60 s TTL\",\"effects\":{\"latency\":-5,\"staleness\":4,\"cost\":2,\"complexity\":2},\"consequence\":\"Most reads come from memory. A changed price can be up to a minute old.\"},{\"id\":\"through\",\"label\":\"Write-through\",\"effects\":{\"latency\":-5,\"staleness\":1,\"cost\":2,\"complexity\":4},\"consequence\":\"Writes update the cache as well, so it's rarely stale — but every write path must know about the cache.\"}]},{\"id\":\"db\",\"label\":\"Database\",\"options\":[{\"id\":\"single\",\"label\":\"Single primary\",\"consequence\":\"One place to read and write. Simple, and the obvious bottleneck.\"},{\"id\":\"replicas\",\"label\":\"Read replicas\",\"effects\":{\"latency\":-1,\"staleness\":2,\"cost\":3,\"complexity\":2},\"consequence\":\"Reads are spread out, but replicas lag the primary by a little.\"}]},{\"id\":\"edge\",\"label\":\"Edge\",\"options\":[{\"id\":\"none\",\"label\":\"No CDN\",\"consequence\":\"Every request reaches your servers.\"},{\"id\":\"cdn\",\"label\":\"CDN for pages\",\"effects\":{\"latency\":-2,\"staleness\":3,\"cost\":1,\"complexity\":1},\"consequence\":\"Pages are served close to users, but purging an old price everywhere takes time.\"}]}]},\"goal\":{\"require\":[{\"metric\":\"latency\",\"max\":3},{\"metric\":\"staleness\",\"max\":5},{\"metric\":\"complexity\",\"max\":7}]},\"question\":{\"prompt\":\"\u003cp\u003eWhich single choice did the most to cut latency?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Read replicas\",\"correct\":false,\"feedback\":\"\u003cp\u003eReplicas take only 1 off latency — the database is still on every request\u0026#39;s path.\u003c/p\u003e\\n\"},{\"html\":\"The CDN\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe CDN takes 2 off; the application cache takes 5.\u003c/p\u003e\\n\"},{\"html\":\"The application cache\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCache\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"design-tradeoffs/caching/step-3\",\"title\":\"Cache-aside\",\"body\":\"\u003cp\u003eCheck the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e first.\u003c/p\u003e\\n\u003cp\u003eOn a miss, read the database and fill the cache.\u003c/p\u003e\\n\u003cp\u003eA TTL limits how stale entries get.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"design-tradeoffs/caching/step-4\",\"prompt\":\"\u003cp\u003eHow does \u003cstrong\u003ecache-aside\u003c/strong\u003e work?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCache-aside keeps the cache dumb and the logic in the application, which makes it the most common pattern.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The app checks the cache; on a miss it reads the database and puts the result in the cache\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The cache sits in front of the database and fetches misses itself\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s \u003cem\u003eread-through\u003c/em\u003e. In cache-aside, the application does the fetching and filling.\u003c/p\u003e\\n\"},{\"html\":\"Every write goes to the cache first and is copied to the database later\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s \u003cem\u003ewrite-back\u003c/em\u003e (write-behind) — fast, but data can be lost if the cache fails.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCache\u003c/button\u003e\"]},{\"id\":\"step-5\",\"key\":\"design-tradeoffs/caching/step-5\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eA different product.\u003c/strong\u003e The checkout shows how many items are left in stock, and it\\nmust be nearly exact — staleness \u003cstrong\u003e1 or less\u003c/strong\u003e. Latency up to \u003cstrong\u003e4\u003c/strong\u003e is fine.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOnly write-through on a single primary, with no CDN, passes. The levers that were fine for product pages\\nare wrong here — the requirements, not the technology, decide.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhich \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e option keeps the cache in step with writes?\u003c/p\u003e\\n\",\"\u003cp\u003eEvery other lever adds staleness.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"tradeoff\",\"config\":{\"metrics\":\"$7:props:lesson:body:1:config:metrics\",\"decisions\":\"$7:props:lesson:body:1:config:decisions\"},\"goal\":{\"require\":[{\"metric\":\"staleness\",\"max\":1},{\"metric\":\"latency\",\"max\":4}]},\"question\":{\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t cache-aside with a 60-second TTL work for the stock count?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"A count can be up to a minute old, so staleness is far above 1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t reduce latency\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt cuts latency just as much as write-through; the problem is how stale the count can get.\u003c/p\u003e\\n\"},{\"html\":\"It\u0026#39;s too complex\",\"correct\":false,\"feedback\":\"\u003cp\u003eCache-aside is the simpler option. Staleness is what rules it out.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"id\":\"step-6\",\"key\":\"design-tradeoffs/caching/step-6\",\"prompt\":\"\u003cp\u003eMatch each choice to the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Trade-off\\\" data-def=\\\"Gaining one quality at the cost of another. In architecture there are no best answers, only trade-offs.\\\" data-book=\\\"Fundamentals of Software Architecture\\\"\u003etrade-off\u003c/button\u003e it makes.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Cache-aside with a TTL\",\"Write-through\",\"Read replicas\",\"CDN\"],\"right\":[\"Fast reads; data can be stale until the entry expires\",\"A fresher cache; slower writes, more coupling\",\"Scales reads; replicas lag the primary\",\"Fastest for distant users; hardest to invalidate\"],\"rightOrder\":[3,1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCache\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Coupling\\\" data-def=\\\"How much one part depends on another. Tightly coupled parts must change together.\\\" data-book=\\\"Fundamentals of Software Architecture\\\"\u003eCoupling\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-7\",\"key\":\"design-tradeoffs/caching/step-7\",\"title\":\"Cache stampedes\",\"body\":\"\u003cp\u003eA popular entry expires.\u003c/p\u003e\\n\u003cp\u003eA thousand requests miss at once and hit the database.\u003c/p\u003e\\n\u003cp\u003eLet one request recompute it.\u003c/p\u003e\\n\u003cp\u003eAdd random jitter to expiry times.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-8\",\"key\":\"design-tradeoffs/caching/step-8\",\"prompt\":\"\u003cp\u003eWhich of these reduce the risk of a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e stampede?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cem\u003eRequest coalescing\u003c/em\u003e (also called single-flight) and \u003cem\u003ejittered expiry\u003c/em\u003e are the standard fixes; refreshing hot\\nentries shortly before they expire is a third.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA cache stampede happens when a popular entry expires and many requests miss at the same moment, all hitting the database to recompute the same value.\u003c/p\u003e\\n\u003cp\u003eRequest coalescing lets the first request recompute while the others wait for its result.\u003c/p\u003e\\n\u003cp\u003eJittered TTLs stop many entries that were cached together from all expiring at the same time.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Let one request recompute a missing entry while the others wait for its result\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Add random jitter to TTLs so entries don\u0026#39;t expire together\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Use a shorter TTL\",\"correct\":false,\"feedback\":\"\u003cp\u003eShorter TTLs mean entries expire more often — more chances for a stampede, not fewer.\u003c/p\u003e\\n\"}],\"multiple\":true}]},\"courseTitle\":\"Design trade-offs\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"os
