 from)\u003c/code\u003e happily accepts its arguments swapped, because a \u003ccode\u003echar\u003c/code\u003e is an \u003ccode\u003eint\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"jm-050\",\"key\":\"jm-strings/formats-and-regex/jm-050\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 6, Strings — mismatched format arguments.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eAnn scored 92 points\\nMissingFormatArgumentException\\nIllegalFormatConversionException\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eExtra arguments are silently ignored: \u003ccode\u003epoints\u003c/code\u003e is never printed.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eAnn scored 92\\nMissingFormatArgumentException\\nIllegalFormatConversionException\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eAnn scored 92\\nBob scored 0%\\n7 items\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA missing argument and a \u003ccode\u003eString\u003c/code\u003e for \u003ccode\u003e%d\u003c/code\u003e both throw.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jm-051\",\"key\":\"jm-strings/formats-and-regex/jm-051\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It shows a mistake from \u003cem\u003e100 Java Mistakes and How to Avoid Them\u003c/em\u003e (Tagir Valeev), Chapter 6, Strings — unquoted regex special
