ality/step-1\",\"title\":\"Same object or same value?\",\"body\":\"$13\",\"diagram\":\"$14\"},{\"id\":\"step-2\",\"key\":\"java-core/string-equality/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eString literals are \u003cstrong\u003einterned\u003c/strong\u003e: the JVM keeps one shared \u003ccode\u003eString\u003c/code\u003e object per distinct literal.\\n\u003ccode\u003ea\u003c/code\u003e and \u003ccode\u003eb\u003c/code\u003e both point at it, so \u003ccode\u003e==\u003c/code\u003e is \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eComparing two references with \u003ccode\u003e==\u003c/code\u003e is always legal; it just might not mean what you expect.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would be right for two \u003ccode\u003enew String(...)\u003c/code\u003e objects. But these are \u003cstrong\u003eliterals\u003c/strong\u003e,\\nand the JVM keeps only one copy of each literal string.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"java-core/string-equality/step-3\",\"prompt\":\"\u003cp\u003eAnd this? Pick both lines of output.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003enew String(\u0026quot;hello\u0026quot;)\u003c/code\u003e makes a new object with the same characters, so \u003ccode\u003e==\u003c/code\u003e is \u003ccode\u003efalse\u003c/code\u003e,\\nwhile \u003ccode\u003eequals()\u003c/code\u003e compares content and is \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhat does \u003ccode\u003enew\u003c/code\u003e always do, whatever the class?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"true, then true\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003enew\u003c/code\u003e always creates a fresh object, so \u003ccode\u003eb\u003c/code\u003e is not the interned literal.\u003c/p\u003e\\n\"},{\"html\":\"true, then false\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e==\u003c/code\u003e compares references and \u003ccode\u003eequals\u003c/code\u003e compares characters — it\u0026#39;s the other way round.\u003c/p\u003e\\n\"},{\"html\":\"false, then false\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eequals()\u003c/code\u003e compares the characters, and they\u0026#39;re the same.\u003c/p\u003e\\n\"},{\"html\":\"false, then true\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"java-core/string-equality/step-4\",\"title\":\"When the compiler joins strings\",\"body\":\"$17\",\"diagram\":\"$18\"},{\"id\":\"step-5\",\"key\":\"java-core/string-equality/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003epart + \u0026quot;lo\u0026quot;\u003c/code\u003e is evaluated at run time and yields a new \u003ccode\u003eString\u003c/code\u003e. (Declare \u003ccode\u003epart\u003c/code\u003e as\\n\u003ccode\u003efinal String part = \u0026quot;hel\u0026quot;;\u003c/code\u003e and it becomes a constant — then the answer flips to \u003ccode\u003etrue\u003c/code\u003e.)\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe compiler folds expressions made only of constants into a single literal, so \u003ccode\u003e\u0026quot;hel\u0026quot; + \u0026quot;lo\u0026quot;\u003c/code\u003e becomes \u003ccode\u003e\u0026quot;hello\u0026quot;\u003c/code\u003e at compile time and points to the same interned object.\u003c/p\u003e\\n\u003cp\u003eA non-final variable isn\u0026#39;t a constant, so \u003ccode\u003epart + \u0026quot;lo\u0026quot;\u003c/code\u003e is evaluated at run time with a \u003ccode\u003eStringBuilder\u003c/code\u003e (or \u003ccode\u003einvokedynamic\u003c/code\u003e concatenation), which always produces a new \u003ccode\u003eString\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why the same text can be \u003ccode\u003e==\u003c/code\u003e in one place and not in another — and why \u003ccode\u003e==\u003c/code\u003e on strings is a bug waiting for the code around it to change.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003eequals\u003c/code\u003e for content; reserve \u003ccode\u003e==\u003c/code\u003e for checking whether two references are literally the same object.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eIs \u003ccode\u003epart\u003c/code\u003e a compile-time constant? It isn\u0026#39;t declared \u003ccode\u003efinal\u003c/code\u003e.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$19\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003epart\u003c/code\u003e is an ordinary variable, not a constant, so the concatenation happens at run time and makes a new object.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-6\",\"key\":\"java-core/string-equality/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Autoboxing\\\" data-def=\\\"The compiler converting automatically between primitives and their boxed types — \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; ↔ \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eAutoboxing\u003c/button\u003e calls \u003ccode\u003eInteger.valueOf\u003c/code\u003e, which returns cached objects for −128 to 127.\\n127 hits the cache (same object); 128 doesn\u0026#39;t (two objects). Compare boxed numbers with \u003ccode\u003eequals()\u003c/code\u003e,\\nor unbox them first.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eInteger x = 127\u003c/code\u003e compiles to \u003ccode\u003eInteger.valueOf(127)\u003c/code\u003e, and \u003ccode\u003evalueOf\u003c/code\u003e keeps a cache of \u003ccode\u003eInteger\u003c/code\u003e objects for -128 to 127.\u003c/p\u003e\\n\u003cp\u003eBoth variables get the same cached object, so \u003ccode\u003e==\u003c/code\u003e is true; 128 is outside the cache, so each \u003ccode\u003evalueOf\u003c/code\u003e call creates a new object and \u003ccode\u003e==\u003c/code\u003e compares two different references.\u003c/p\u003e\\n\u003cp\u003eThe cache\u0026#39;s upper bound can even be raised with \u003ccode\u003e-XX:AutoBoxCacheMax\u003c/code\u003e, so code relying on \u003ccode\u003e==\u003c/code\u003e may behave differently on another JVM configuration.\u003c/p\u003e\\n\u003cp\u003eCompare boxed numbers with \u003ccode\u003eequals\u003c/code\u003e, or unbox them to primitives first.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e\u003ccode\u003eInteger.valueOf\u003c/code\u003e keeps a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e of commonly used values.\u003c/p\u003e\\n\",\"\u003cp\u003eThe cache covers −128 to 127 by default.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$1a\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"false, then false\",\"correct\":false,\"feedback\":\"\u003cp\u003eSmall boxed values \u003cem\u003eare\u003c/em\u003e shared, so the first comparison sees the same object.\u003c/p\u003e\\n\"},{\"html\":\"true, then true\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly a limited range of boxed values is shared. 128 is just outside it.\u003c/p\u003e\\n\"},{\"html\":\"false, then true\",\"correct\":false,\"feedback\":\"\u003cp\u003e127 is inside the Integer cache; 128 isn\u0026#39;t.\u003c/p\u003e\\n\"},{\"html\":\"true, then false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-7\",\"key\":\"java-core/string-equality/step-7\",\"title\":\"Always compare with equals\",\"body\":\"\u003cp\u003e\u003ccode\u003eInteger\u003c/code\u003e has the same trap: small values are cached, big ones aren\u0026#39;t.\u003c/p\u003e\\n\u003cp\u003eCompare values with \u003ccode\u003eequals\u003c/code\u003e or \u003ccode\u003eObjects.equals\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eObjects.equals\u003c/code\u003e also handles \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-8\",\"key\":\"java-core/string-equality/step-8\",\"prompt\":\"\u003cp\u003eWhich of these safely compare two \u003ccode\u003eString\u003c/code\u003e values by content?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eequals\u003c/code\u003e, \u003ccode\u003eObjects.equals\u003c/code\u003e and \u003ccode\u003ecompareTo(...) == 0\u003c/code\u003e all compare characters.\\nOf these, \u003ccode\u003eObjects.equals(a, b)\u003c/code\u003e is the only one that is also safe when \u003ccode\u003ea\u003c/code\u003e is \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"\u003cpre class=\\\"shiki shiki-the
