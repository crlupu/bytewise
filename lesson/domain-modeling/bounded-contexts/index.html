:[\"architecture\",\"ddd\",\"domain-driven design\",\"bounded context\",\"ubiquitous language\",\"subdomains\",\"anticorruption layer\"],\"sources\":[{\"book\":\"learning-ddd\",\"ref\":\"Chapters 1–4, Strategic Design\"}],\"requires\":[],\"steps\":9,\"stepKeys\":[\"domain-modeling/bounded-contexts/step-1\",\"domain-modeling/bounded-contexts/step-2\",\"domain-modeling/bounded-contexts/step-3\",\"domain-modeling/bounded-contexts/step-4\",\"domain-modeling/bounded-contexts/step-5\",\"domain-modeling/bounded-contexts/step-6\",\"domain-modeling/bounded-contexts/step-7\",\"domain-modeling/bounded-contexts/step-8\",\"domain-modeling/bounded-contexts/step-9\"],\"exercises\":[\"domain-modeling/bounded-contexts/step-2\",\"domain-modeling/bounded-contexts/step-4\",\"domain-modeling/bounded-contexts/step-6\",\"domain-modeling/bounded-contexts/step-7\",\"domain-modeling/bounded-contexts/step-8\",\"domain-modeling/bounded-contexts/step-9\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"domain-modeling/bounded-contexts/step-1\",\"title\":\"One shared language\",\"body\":\"\u003cp\u003eMany bugs are translation errors.\u003c/p\u003e\\n\u003cp\u003eUse the business\u0026#39;s words in code, docs and conversation.\u003c/p\u003e\\n\u003cp\u003eThis is the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ubiquitous language\\\" data-def=\\\"One shared language between developers and domain experts, used in conversations, documents and the code itself.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003eubiquitous language\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"domain-modeling/bounded-contexts/step-2\",\"prompt\":\"\u003cp\u003eIn a CRM, Marketing calls someone a \u003cstrong\u003elead\u003c/strong\u003e once they download a whitepaper. Sales calls someone a lead only after a qualifying call. What should the model do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA language is only ubiquitous \u003cstrong\u003ewithin a boundary\u003c/strong\u003e. That boundary is a \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded context\\\" data-def=\\\"A boundary within which a model and its language are consistent. The same word can mean different things in different contexts.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003ebounded context\u003c/button\u003e\u003c/strong\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Add fields so one \u003ccode\u003eLead\u003c/code\u003e class can serve both meanings\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s how \u0026quot;god objects\u0026quot; are born — a class full of fields each department ignores.\u003c/p\u003e\\n\"},{\"html\":\"Accept that \u0026quot;lead\u0026quot; means different things in the two areas, and give each area its own model\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Agree one company-wide definition and make both departments use it\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe departments genuinely work differently; forcing one meaning makes the model wrong for at least one of them.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"domain-modeling/bounded-contexts/step-3\",\"title\":\"Bounded contexts\",\"body\":\"\u003cp\u003eA word can mean different things in different departments.\u003c/p\u003e\\n\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded context\\\" data-def=\\\"A boundary within which a model and its language are consistent. The same word can mean different things in different contexts.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003ebounded context\u003c/button\u003e is where one meaning holds.\u003c/p\u003e\\n\u003cp\u003eEach context gets its own model.\u003c/p\u003e\\n\u003cp\u003eIdeally, one team owns each context.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-4\",\"key\":\"domain-modeling/bounded-contexts/step-4\",\"prompt\":\"\u003cp\u003eMatch each kind of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Subdomain\\\" data-def=\\\"A part of the business. Core subdomains give competitive advantage, supporting ones are needed but simple, generic ones are solved problems.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003esubdomain\u003c/button\u003e to how to treat it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhere you invest design effort follows from which kind of subdomain you\u0026#39;re in.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Core subdomain\",\"Supporting subdomain\",\"Generic subdomain\"],\"right\":[\"What makes the company different — build in-house, invest the best people\",\"Needed, but no competitive edge — build simply, or outsource\",\"Solved problems everyone has, like auth or payments — buy or adopt\"],\"rightOrder\":[2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Core subdomain\\\" data-def=\\\"The part of the business that sets the company apart — where to invest the best people and the most careful design.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003eCore subdomain\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"domain-modeling/bounded-contexts/step-5\",\"title\":\"Connecting contexts\",\"body\":\"\u003cp\u003eTeams can partner, share a small kernel, or conform.\u003c/p\u003e\\n\u003cp\u003eAn \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Anticorruption layer\\\" data-def=\\\"A translation layer that protects your model from another system\u0026amp;#39;s model, converting between the two at the boundary.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003eanticorruption layer\u003c/button\u003e translates a foreign model into yours.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t split every \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Entity\\\" data-def=\\\"An object defined by its identity, which persists as its attributes change — a customer, an order.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003eentity\u003c/button\u003e into its own context.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"domain-modeling/bounded-contexts/step-6\",\"prompt\":\"\u003cp\u003eMatch each integration pattern between \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded context\\\" data-def=\\\"A boundary within which a model and its language are consistent. The same word can mean different things in different contexts.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003ebounded contexts\u003c/button\u003e to its description.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Partnership\",\"Shared kernel\",\"Conformist\",\"Anticorruption layer\",\"Open-host service\"],\"right\":[\"Two teams coordinate changes together, as equals\",\"Two contexts share a small, jointly owned part of the model\",\"The downstream team simply adopts the upstream model as it is\",\"The downstream team translates the upstream model into its own\",\"The upstream publishes a stable public protocol for all consumers\"],\"rightOrder\":[1,4,2,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Anticorruption layer\\\" data-def=\\\"A translation layer that protects your model from another system\u0026amp;#39;s model, converting between the two at the boundary.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003eAnticorruption layer\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"domain-modeling/bounded-contexts/step-7\",\"prompt\":\"\u003cp\u003eYour \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Core subdomain\\\" data-def=\\\"The part of the business that sets the company apart — where to invest the best people and the most careful design.\\\" data-book=\\\"Learning Domain-Driven Design\\\"\u003ecore subdomain\u003c/button\u003e must consume data from a messy legacy system you can\u0026#39;t change. Which pattern protects your model?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTranslate at the boundary, so the legacy concepts never leak into the model that matters most.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAn anticorruption layer sits between your model and the legacy system, translating its data and concepts into your own terms.\u003c/p\u003e\\n\u003cp\u003eYour core model never sees the legacy system\u0026#39;s awkward names or structures, so it can evolve independently.\u003c/p\u003e\\n\u003cp\u003eWhen the legacy system changes or is replaced, only the translation layer needs to change.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"An anticorruption layer\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Shared kernel\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat needs joint ownership — you can\u0026#39;t change the legacy system.\u003c/p\u003e\\n\"},{\"html\":\"Conformist\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen the legacy system\u0026#39;s mess becomes your core model\u0026#39;s mess.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term
