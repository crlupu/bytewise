\n\u003cp\u003eLonger waits mean more threads.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-3\",\"prompt\":\"\u003cp\u003eAn 8-core machine runs tasks that spend 90 ms waiting on a database for every 10 ms of computing.\\nAiming for full CPU utilisation, about how many threads should the pool have?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e8 × 1 × (1 + 90/10) = 80 threads.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe formula is threads = CPUs × target utilisation × (1 + wait time / compute time).\u003c/p\u003e\\n\u003cp\u003eEach task waits 90 ms for every 10 ms of computing, so a ratio of 9; with 8 CPUs at 100%: 8 × 1 × (1 + 9) = 80.\u003c/p\u003e\\n\u003cp\u003eIntuitively, each thread uses a CPU only a tenth of the time, so you need ten threads per core to keep it busy.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eW/C = 90 ÷ 10 = 9.\u003c/p\u003e\\n\",\"\u003cp\u003e8 × 1 × (1 + 9).\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"8\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s right for pure computation. These tasks spend 90% of their time waiting.\u003c/p\u003e\\n\"},{\"html\":\"9\",\"correct\":false,\"feedback\":\"\u003cp\u003eN + 1 is the rule for CPU-bound work. These tasks mostly wait.\u003c/p\u003e\\n\"},{\"html\":\"72\",\"correct\":false,\"feedback\":\"\u003cp\u003eClose — the formula multiplies by (1 + W/C), which is 10 here.\u003c/p\u003e\\n\"},{\"html\":\"80\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-4\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-4\",\"prompt\":\"\u003cp\u003eAn 8-core machine runs tasks that wait 90 ms on a database for every 10 ms of computing. You want the CPUs only \u003cstrong\u003e50%\u003c/strong\u003e busy, to leave headroom. How many threads?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e8 × 0.5 × 10 = 40.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"4\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat ignores the waiting time.\u003c/p\u003e\\n\"},{\"html\":\"20\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe formula is 8 × 0.5 × (1 + 9).\u003c/p\u003e\\n\"},{\"html\":\"40\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"80\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s for 100% utilisation; halve it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-5\",\"title\":\"Other limits\",\"body\":\"\u003cp\u003eDatabase connections, memory and files cap the pool too.\u003c/p\u003e\\n\u003cp\u003eMore threads than connections just means more waiting.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-6\",\"prompt\":\"\u003cp\u003eTasks spend most of their time waiting on a database, so the formula suggests 80 threads. They share a JDBC connection pool of 10 connections. Does a pool of 80 threads still make sense?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe formula assumes the waiting is free, but here tasks wait on a database pool of 10 connections.\u003c/p\u003e\\n\u003cp\u003eOnly 10 tasks can run their queries at once; the other 70 threads just queue for connections, consuming memory without adding \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Throughput\\\" data-def=\\\"How much work gets done per unit of time.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethroughput\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eWhen tasks depend on
