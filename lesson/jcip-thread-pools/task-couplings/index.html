s/task-couplings\",\"title\":\"Tasks and execution policies\",\"summary\":\"Some tasks can't run safely in just any pool — dependent tasks can deadlock a bounded one.\",\"duration\":5,\"tags\":[\"java\",\"concurrency\",\"thread pools\",\"thread starvation deadlock\",\"long-running tasks\",\"threadlocal\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§8.1, Implicit Couplings Between Tasks and Execution Policies\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jcip-thread-pools/task-couplings/step-1\",\"jcip-thread-pools/task-couplings/step-2\",\"jcip-thread-pools/task-couplings/step-3\",\"jcip-thread-pools/task-couplings/step-4\",\"jcip-thread-pools/task-couplings/step-5\",\"jcip-thread-pools/task-couplings/step-6\",\"jcip-thread-pools/task-couplings/step-7\"],\"exercises\":[\"jcip-thread-pools/task-couplings/step-3\",\"jcip-thread-pools/task-couplings/step-4\",\"jcip-thread-pools/task-couplings/step-6\",\"jcip-thread-pools/task-couplings/step-7\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-thread-pools/task-couplings/step-1\",\"title\":\"Some tasks depend on the policy\",\"body\":\"\u003cp\u003eTasks that wait for other tasks.\u003c/p\u003e\\n\u003cp\u003eTasks that rely on running on one thread.\u003c/p\u003e\\n\u003cp\u003eTasks that must respond quickly.\u003c/p\u003e\\n\u003cp\u003eThese all care how the pool runs them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-thread-pools/task-couplings/step-2\",\"title\":\"Pools can starve themselves\",\"body\":\"\u003cp\u003eA task waits for another task in the same pool.\u003c/p\u003e\\n\u003cp\u003eIf every thread is waiting, nothing can run.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread starvation deadlock\\\" data-def=\\\"Tasks in a pool wait on other tasks queued in the same pool, but every worker is busy waiting — nobody can make progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread starvation deadlock\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-thread-pools/task-couplings/step-3\",\"prompt\":\"\u003cp\u003eA pool has \u003cstrong\u003eone\u003c/strong\u003e thread. Task A is running in it and submits task B, then waits for B\u0026#39;s result. B sits in the\\nqueue, waiting for a free thread. Model it: the pool thread is lock \u003cstrong\u003eP\u003c/strong\u003e, and B\u0026#39;s result is lock \u003cstrong\u003eR\u003c/strong\u003e, which A\\ncan only take once B has released it. \u003cstrong\u003eFind the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\u003c/strong\u003e\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA holds the only thread and waits for B; B waits for a thread. That\u0026#39;s \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread starvation deadlock\\\" data-def=\\\"Tasks in a pool wait on other tasks queued in the same pool, but every worker is busy waiting — nobody can make progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread starvation deadlock\u003c/button\u003e\u003c/strong\u003e — no locks\\nin your code, yet nothing can ever move again.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet Task B hold R (its result isn\u0026#39;t ready) and Task A hold the only thread, P.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"Task A\",\"ops\":[\"lock P\",\"submit B\",\"lock R\",\"use result\",\"unlock R\",\"unlock P\"]},{\"name\":\"Task B\",\"ops\":[\"lock R\",\"lock P\",\"compute\",\"unlock P\",\"unlock R\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eHow could this deadlock be avoided?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Give task B a higher priority\",\"correct\":false,\"feedback\":\"\u003cp\u003eB can\u0026#39;t run at any priority — there\u0026#39;s no free thread.\u003c/p\u003e\\n\"},{\"html\":\"Give the pool enough threads for both tasks, or don\u0026#39;t make a task wait on another task in the same pool\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Use a bounded queue\",\"correct\":false,\"feedback\":\"\u003cp\u003eB is already queued; a bounded queue doesn\u0026#39;t give it a thread.\u003c/p\u003e\\n\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eBounded queue\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"jcip-thread-pools/task-couplings/step-4\",\"prompt\":\"\u003cp\u003eHow do you avoid \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread starvation deadlock\\\" data-def=\\\"Tasks in a pool wait on other tasks queued in the same pool, but every worker is busy waiting — nobody can make progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread starvation deadlock\u003c/button\u003e with dependent tasks?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThread starvation deadlock happens when tasks in a pool wait for other tasks in the same pool that can\u0026#39;t run because every thread is occupied by a waiting task.\u003c/p\u003e\\n\u003cp\u003eAn unbounded pool can always start the dependent task.\u003c/p\u003e\\n\u003cp\u
