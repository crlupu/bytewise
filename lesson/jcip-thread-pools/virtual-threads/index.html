\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"jcip-thread-pools/virtual-threads/step-2\",\"title\":\"Blocking becomes cheap\",\"body\":\"\u003cp\u003eA blocked \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Virtual thread\\\" data-def=\\\"A lightweight thread managed by the JVM rather than the OS (Java 21). Millions can exist; blocking one is cheap.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evirtual thread\u003c/button\u003e steps off its carrier thread.\u003c/p\u003e\\n\u003cp\u003eAnother runs in its place.\u003c/p\u003e\\n\u003cp\u003eGreat for I/O-heavy work. No need to pool them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"jcip-thread-pools/virtual-threads/step-3\",\"prompt\":\"\u003cp\u003eWhich workload benefits most from \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Virtual thread\\\" data-def=\\\"A lightweight thread managed by the JVM rather than the OS (Java 21). Millions can exist; blocking one is cheap.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evirtual threads\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Number-crunching that keeps every core busy\",\"correct\":false,\"feedback\":\"\u003cp\u003eCPU-bound work still needs one runnable thread per core; virtual threads don\u0026#39;t add CPUs.\u003c/p\u003e\\n\"},{\"html\":\"Thousands of concurrent requests that each spend most of their time waiting on I/O\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-4\",\"key\":\"jcip-thread-pools/virtual-threads/step-4\",\"prompt\":\"\u003cp\u003eShould you pool \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Virtual thread\\\" data-def=\\\"A lightweight thread managed by the JVM rather than the OS (Java 21). Millions can exist; blocking one is cheap.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evirtual threads\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTo limit access to a scarce resource, like a database, use a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Semaphore\\\" data-def=\\\"Manages a fixed number of permits. \u0026lt;code\u0026gt;acquire\u0026lt;/code\u0026gt; takes one (waiting if none are left), \u0026lt;code\u0026gt;release\u0026lt;/code\u0026gt; gives one back. Used to bound how many threads use a resource.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eSemaphore\u003c/code\u003e\u003c/button\u003e — not a small pool.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003ePooling exists to amortize the cost of creating expensive platform threads.\u003c/p\u003e\\n\u003cp\u003eVirtual threads cost about as much as a small object, so creating one per task is the intended model.\u003c/p\u003e\\n\u003cp\u003ePooling them would add complexity and limit concurrency for no benefit; when you need to limit access to something scarce, a \u003ccode\u003eSemaphore\u003c/code\u003e limits exactly that.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, like platform threads\",\"correct\":false,\"feedback\":\"\u003cp\u003ePooling exists to amortise expensive creation. Virtual threads aren\u0026#39;t expensive.\u003c/p\u003e\\n\"},{\"html\":\"No — they\u0026#39;re cheap to create; create one per task and let it end\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-thread-pools/virtual-threads/step-5\",\"title\":\"Same rules, one catch\",\"body\":\"\u003cp\u003e\u003cbutton typ
