,\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor\",\"title\":\"Configuring ThreadPoolExecutor\",\"summary\":\"Core and maximum size, the work queue, the saturation policy and the thread factory.\",\"duration\":6,\"tags\":[\"java\",\"concurrency\",\"threadpoolexecutor\",\"saturation policy\",\"work queue\",\"thread factory\"],\"sources\":[{\"book\":\"jcip\",\"ref\":\"§8.3, Configuring ThreadPoolExecutor\"}],\"requires\":[],\"steps\":15,\"stepKeys\":[\"jcip-thread-pools/configuring-threadpoolexecutor/step-1\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-2\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-3\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-4\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-5\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-6\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-7\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-8\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-2\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-3\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-4\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-5\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-6\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-7\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-8\"],\"exercises\":[\"jcip-thread-pools/configuring-threadpoolexecutor/step-2\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-4\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-6\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-7\",\"jcip-thread-pools/configuring-threadpoolexecutor/step-8\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-2\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-3\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-4\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-5\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-6\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-7\",\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-1\",\"title\":\"ThreadPoolExecutor's knobs\",\"body\":\"\u003cp\u003eCore size: threads kept even when idle.\u003c/p\u003e\\n\u003cp\u003eMaximum size: the upper limit.\u003c/p\u003e\\n\u003cp\u003eKeep-alive: when extra idle threads retire.\u003c/p\u003e\\n\u003cp\u003eWork queue: where tasks wait.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-2\",\"prompt\":\"\u003cp\u003eMatch each parameter to what it controls.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Core pool size\",\"Maximum pool size\",\"Keep-alive time\",\"Work queue\"],\"right\":[\"Threads kept alive even when idle — the target size\",\"The upper bound on threads at any one time\",\"How long an idle thread above the core size waits before it\u0026#39;s removed\",\"Where tasks wait when all threads are busy\"],\"rightOrder\":[2,1,3,0]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-3\",\"title\":\"Extra threads need a full queue\",\"body\":\"\u003cp\u003eThe pool grows past the core size only when the queue is full.\u003c/p\u003e\\n\u003cp\u003eAn unbounded queue is never full.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-4\",\"prompt\":\"\u003cp\u003eCore size 2, maximum size 10, and an \u003cstrong\u003eunbounded\u003c/strong\u003e \u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e. 100 slow tasks arrive at once. How many\\nthreads run?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA common configuration surprise. With an unbounded queue, the maximum pool size has no effect.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eThreadPoolExecutor\u003c/code\u003e starts threads up to the core size, then queues further tasks, and creates extra threads up to the maximum only when the queue is full.\u003c/p\u003e\\n\u003cp\u003eAn unbounded \u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e is never full, so the pool never grows beyond its 2 core threads, and 98 tasks wait in the queue.\u003c/p\u003e\\n\u003cp\u003eThe maximum of 10 has no effect. Use a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ebounded queue\u003c/button\u003e, or set the core size to the size you actually want.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Ten\",\"correct\":false,\"feedback\":\"\u003cp\u003eExtra threads beyond the core are only created when the queue is \u003cstrong\u003efull\u003c/strong\u003e — and an unbounded queue never is.\u003c/p\u003e\\n\"},{\"html\":\"Two\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-5\",\"title\":\"When the queue fills up\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Saturation policy\\\" data-def=\\\"What a thread pool does when its queue is full — abort with an exception, discard, or make the caller run the task itself (caller-runs).\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003esaturation policy\u003c/button\u003e decides what happens next.\u003c/p\u003e\\n\u003cp\u003eAbort, discard, or run it in the caller.\u003c/p\u003e\\n\u003cp\u003eCaller-runs slows the submitter, pushing back on load.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-6\",\"prompt\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ebounded queue\u003c/button\u003e is full. Match each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Saturation policy\\\" data-def=\\\"What a thread pool does when its queue is full — abort with an exception, discard, or make the caller run the task itself (caller-runs).\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003esaturation policy\u003c/button\u003e to what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Abort (the default)\",\"Discard\",\"Discard-oldest\",\"Caller-runs\"],\"right\":[\"Throws \u003ccode\u003eRejectedExecutionException\u003c/code\u003e to the submitter\",\"Silently drops the new task\",\"Drops the task that would run next, and retries\",\"Runs the task in the submitting thread — which slows the submitter down\"],\"rightOrder\":[3,2,0,1]},{\"id\":\"step-7\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-7\",\"prompt\":\"\u003cp\u003eWhy is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Saturation policy\\\" data-def=\\\"What a thread pool does when its queue is full — abort with an exception, discard, or make the caller run the task itself (caller-runs).\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecaller-runs\u003c/button\u003e a form of graceful degradation in a web server?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOverload moves from the pool to the work queue to the application to the TCP layer, and eventually to the client.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eUnder caller-runs, when the pool and queue are full, the thread that submits the task runs it itself.\u003c/p\u003e\\n\u003cp\u003eIn a server, that submitting thread is the one accepting connections, so while it runs the task it accepts none.\u003c/p\u003e\\n\u003cp\u003eNew requests queue up in the TCP backlog, and if that fills, clients are refused — overload is pushed outward step by step instead of crashing the server.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It makes tasks run faster\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"While the main thread runs a task, it doesn\u0026#39;t accept connections — new requests queue in the TCP layer, pushing the overload outward\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-8\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/step-8\",\"prompt\":\"\u003cp\u003eA custom thread factory can name threads and install an exception handler.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Thread t = new Thread(r, poolName + \\\"-\\\" + \"},{\"answers\":[\"threadNumber\"],\"size\":12,\"choices\":[\"availableProcessors\",\"invokeLater\",\"afterExecute\",\"threadNumber\"]},{\"text\":\".incrementAndGet());\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"listing-8-2\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-2\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 8.2\u003c/strong\u003e · Core 2, max 4, a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ebounded queue\u003c/button\u003e of 10. All threads are busy and the queue has room. A task is submitted. What does the pool do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA consequence: with an unbounded queue the pool never grows past core size.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"Queues it — extra threads beyond core are only created when the queue is full\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Starts a third thread right away\",\"correct\":false,\"feedback\":\"\u003cp\u003eAbove core size, the pool grows only once the queue rejects the offer.\u003c/p\u003e\\n\"},{\"html\":\"Rejects it\",\"correct\":false,\"feedback\":\"\u003cp\u003eRejection happens only when the queue is full and the pool is at max.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-8-3\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-3\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 8.3\u003c/strong\u003e · All 10 threads are busy and the queue is full. A task is submitted from a request thread. What happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"The submitting thread runs the task itself, which slows down new submissions\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The task is silently dropped\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s \u003ccode\u003eDiscardPolicy\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eRejectedExecutionException\u003c/code\u003e is thrown\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the default \u003ccode\u003eAbortPolicy\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"The oldest queued task is dropped\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s \u003ccode\u003eDiscardOldestPolicy\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-8-4\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-4\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 8.4\u003c/strong\u003e · \u003ccode\u003ebound\u003c/code\u003e is 5 and the underlying pool\u0026#39;s queue is unbounded. What does a sixth \u003ccode\u003esubmitTask\u003c/code\u003e call do while five tasks are still running?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIf \u003ccode\u003eexecute\u003c/code\u003e itself rejects the task, the permit is given back in the \u003ccode\u003ecatch\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Queues the task in the pool\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Semaphore\\\" data-def=\\\"Manages a fixed number of permits. \u0026lt;code\u0026gt;acquire\u0026lt;/code\u0026gt; takes one (waiting if none are left), \u0026lt;code\u0026gt;release\u0026lt;/code\u0026gt; gives one back. Used to bound how many threads use a resource.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003esemaphore\u003c/button\u003e stops it before it reaches \u003ccode\u003eexecute\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Blocks in \u003ccode\u003eacquire()\u003c/code\u003e until one of the five finishes\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Throws \u003ccode\u003eRejectedExecutionException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Semaphore\\\" data-def=\\\"Manages a fixed number of permits. \u0026lt;code\u0026gt;acquire\u0026lt;/code\u0026gt; takes one (waiting if none are left), \u0026lt;code\u0026gt;release\u0026lt;/code\u0026gt; gives one back. Used to bound how many threads use a resource.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003esemaphore\u003c/button\u003e blocks rather than rejecting.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-8-5\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-5\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 8.5\u003c/strong\u003e · What does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$16\",\"options\":[{\"html\":\"pool-1-thread-1 false\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the default factory\u0026#39;s name; the custom factory is used for every pool thread.\u003c/p\u003e\\n\"},{\"html\":\"worker true\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"worker false\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe factory marks the thread as daemon.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"id\":\"listing-8-6\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-6\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 8.6\u003c/strong\u003e · \u003ccode\u003eMyAppThread(r, name)\u003c/code\u003e names the thread \u003ccode\u003ename-\u0026lt;count\u0026gt;\u003c/code\u003e and installs a logging uncaught-exception handler. Which threads does a pool built with \u003ccode\u003enew MyThreadFactory(\u0026quot;crawler\u0026quot;)\u003c/code\u003e create?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"Exactly one thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe factory is called whenever the pool needs a new thread.\u003c/p\u003e\\n\"},{\"html\":\"Plain \u003ccode\u003eThread\u003c/code\u003es named \u003ccode\u003epool-1-thread-1\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe pool asks the factory for every thread it creates.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eMyAppThread\u003c/code\u003es named \u003ccode\u003ecrawler-1\u003c/code\u003e, \u003ccode\u003ecrawler-2\u003c/code\u003e, … with that handler\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"listing-8-7\",\"key\":\"jcip-thread-pools/configuring-threadpoolexecutor/listing-8-7\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eListing 8.7\u003c/strong\u003e · Why does \u003ccode\u003erun()\u003c/code\u003e copy \u003ccode\u003edebugLifecycle\u003c/code\u003e into a local first?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"Because reading a \u003ccode\u003evolatile\u003c/code\u003e field isn\u0026#39;t thread-safe\",\"correct\":false,\"feedback\":\"\u003cp\u003eReading it is safe; it may just change between reads.\u003c/p\u003e\\n\"},{\"html\":\"For speed only\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s for consistency between the two log lines.\u003c/p\u003e\\n\"},{\"html\":\"So the \u0026quot;Created\u0026quot; and \u0026quot;Exiting\u0026quot; logs use the same value even if the flag changes mid-run\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"fal
