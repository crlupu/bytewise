ps\":6,\"stepKeys\":[\"mja-async/futures-and-completable-futures/step-1\",\"mja-async/futures-and-completable-futures/step-2\",\"mja-async/futures-and-completable-futures/step-3\",\"mja-async/futures-and-completable-futures/step-4\",\"mja-async/futures-and-completable-futures/step-5\",\"mja-async/futures-and-completable-futures/step-6\"],\"exercises\":[\"mja-async/futures-and-completable-futures/step-3\",\"mja-async/futures-and-completable-futures/step-4\",\"mja-async/futures-and-completable-futures/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"mja-async/futures-and-completable-futures/step-1\",\"title\":\"Future blocks\",\"body\":\"\u003cp\u003e\u003ccode\u003eexecutor.submit(task)\u003c/code\u003e returns a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eFuture\u003c/code\u003e\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003efuture.get()\u003c/code\u003e blocks until the result is ready.\u003c/p\u003e\\n\u003cp\u003eYou can\u0026#39;t say \u0026quot;when it\u0026#39;s done, do this\u0026quot; without a waiting thread.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"mja-async/futures-and-completable-futures/step-2\",\"title\":\"CompletableFuture reacts\",\"body\":\"\u003cp\u003e\u003ccode\u003eCompletableFuture.supplyAsync(supplier)\u003c/code\u003e runs the supplier on a pool.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ethenApply\u003c/code\u003e, \u003ccode\u003ethenAccept\u003c/code\u003e and friends register what happens next.\u003c/p\u003e\\n\u003cp\u003eNo thread has to sit and wait.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"mja-async/futures-and-completable-futures/step-3\",\"prompt\":\"\u003cp\u003eStart a price lookup without blocking.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"CompletableFuture\u003cDouble\u003e price = CompletableFuture.\"},{\"answers\":[\"supplyAsync\"],\"size\":11,\"choices\":[\"exceptionally\",\"sum\",\"supplyAsync\",\"apply\"]},{\"text\":\"(() -\u003e shop.getPrice(product));\"}],\"code\":true,\"caseSensitive\":false},{\"id\":\"step-4\",\"key\":\"mja-async/futures-and-completable-futures/step-4\",\"prompt\":\"\u003cp\u003eWhere does \u003ccode\u003esupplyAsync(supplier)\u003c/code\u003e run the supplier, if you don\u0026#39;t pass an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eexecutor\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFor blocking I/O, pass your own executor sized for it — the common pool has only about one thread per core.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWithout an executor argument, async methods use \u003ccode\u003eForkJoinPool.commonPool()\u003c/code\u003e, which has about as many threads as there are CPU cores, minus one.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s right for CPU-bound work, but if tasks block on I/O, a handful of slow calls can tie up the whole pool — and with it, parallel streams and anything else sharing it.\u003c/p\u003e\\n\u003cp\u003eFor blocking calls, pass a dedicated executor sized for the expected concurrency.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"On a new thread each time\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt reuses the common pool\u0026#39;s threads.\u003c/p\u003e\\n\"},{\"html\":\"On the calling thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen it wouldn\u0026#39;t be asynchronous.\u003c/p\u003e\\n\"},{\"html\":\"On the common \u003ccode\u003eForkJoinPool\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fork/join\\\" data-def=\\\"Splitting a task into subtasks (fork), running them in parallel, and combining the results (join). The pool uses work stealing.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eFork/join\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"mja-async/futures-and-completable-futures/step-5\",\"title\":\"join or get\",\"body\":\"\u003cp\u003e\u003ccode\u003ejoin()\u003c/code\u003e waits like \u003ccode\u003eget()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIt throws an unchecked \u003ccode\u003eCompletionException\u003c/code\u003e instead of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003echecked exceptions\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eThat makes it easy to use inside \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003elambdas\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"mja-async/futures-and-completable-futures/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe supplier throws on a pool thread, and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"CompletableFuture\\\" data-def=\\\"A future you can complete, and chain work onto with \u0026lt;code\u0026gt;thenApply\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;thenCompose\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;thenCombine\u0026lt;/code\u0026gt;, so no thread has to block waiting for it.\\\" data-book=\\\"Modern Java in Action\\\"\u003e\u003ccode\u003eCompletableFuture\u003c/code\u003e\u003c/button\u003e catches it and completes exceptionally rather than letting the thread die.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ejoin()\u003c/code\u003e then rethrows it wrapped in an unchecked \u003ccode\u003eCompletionException\u003c/code\u003e, whose \u003ccode\u003egetCause()\u003c/code\u003e is the original \u003ccode\u003eIllegalStateException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eget()\u003c/code\u003e would wrap it in a checked \u003ccode\u003eExecutionException\u003c/code\u003e instead. Either way, the exception isn\u0026#39;t lost — it\u0026#39;s delivered to whoever waits for the result.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ejava.lang.IllegalStateException: boom\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing; the exception is lost on the other thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003efuture\u003c/button\u003e completes exceptionally, and \u003ccode\u003ejoin\u003c/code\u003e rethrows it wrapped in a \u003ccode\u003eCompletionException\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]}]},\"courseTitle\":\"Asynchronous and reactive programming\",\"next\":{\"id\":\"composing-futures\",\"courseId\":\"mja-async\",\"topicId\":\"modern-java\",\"key\":\"mja-async/composing-futures\",\"title\":\"Composing CompletableFutures\",\"summary\":\"`thenApply` transforms, `thenCompose` chains another async call, `thenCombine` joins two independent ones, and `exceptionally` recovers.\",\"duration\":6,\"tags\":[\"java\",\"modern java\",\"completablefuture\",\"thencompose\",\"thencombine\",\"asynchronous\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§16.4, Pipelining asynchronous tasks\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"mja-async/composing-futures/step-1\",\"mja-async/composing-futures/step-2\",\"mja-async/composing-futures/step-3\",\"mja-async/composing-futures/step-4\",\"mja-async/composing-futures/step-5\",\"mja-async/composing-futures/step-6\",\"mja-async/composing-futures/step-7\"],\"exercises\":[\"mja-async/composing-futures/step-2\",\"mja-async/composing-futures/step-4\",\"mja-async/composing-futures/step-6\",\"mja-async/composing-futures/step-7\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":200
