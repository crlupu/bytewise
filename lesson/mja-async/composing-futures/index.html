03eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e. Starting from \u003ccode\u003eCompletableFuture\u0026lt;String\u0026gt; idFuture\u003c/code\u003e, which gives \u003ccode\u003eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003ethenApply\u003c/code\u003e wraps whatever the function returns in a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003efuture\u003c/button\u003e, so a function returning \u003ccode\u003eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e gives \u003ccode\u003eCompletableFuture\u0026lt;CompletableFuture\u0026lt;User\u0026gt;\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ethenCompose\u003c/code\u003e expects a function that returns a future, and flattens the result to \u003ccode\u003eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e — just as \u003ccode\u003eflatMap\u003c/code\u003e flattens nested streams or optionals.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003ethenApply\u003c/code\u003e for plain transformations and \u003ccode\u003ethenCompose\u003c/code\u003e when the next step is itself asynchronous.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eidFuture.thenCompose(this::fetchUser)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eidFuture.thenApply(this::fetchUser)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat gives \u003ccode\u003eCompletableFuture\u0026lt;CompletableFuture\u0026lt;User\u0026gt;\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"mja-async/composing-futures/step-3\",\"title\":\"Combine independent work\",\"body\":\"\u003cp\u003e\u003ccode\u003ea.thenCombine(b, fn)\u003c/code\u003e waits for both \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003efutures\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eThen it applies \u003ccode\u003efn\u003c/code\u003e to the two results.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ea\u003c/code\u003e and \u003ccode\u003eb\u003c/code\u003e run at the same time.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"mja-async/composing-futures/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003esupplyAsync(() -\u0026gt; 20)\u003c/code\u003e produces 20, and \u003ccode\u003ethenApply(x -\u0026gt; x + 1)\u003c/code\u003e turns it into 21.\u003c/p\u003e\\n\u003cp\u003eMeanwhile the second \u003ccode\u003esupplyAsync\u003c/code\u003e produces 2 independently. \u003ccode\u003ethenCombine\u003c/code\u003e waits for both and applies \u003ccode\u003e(x, y) -\u0026gt; x * y\u003c/code\u003e to 21 and 2.\u003c/p\u003e\\n\u003cp\u003e21 × 2 = 42. The two suppliers can run at the same time; only the combining step waits for both.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"22\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ethenCombine\u003c/code\u003e multiplies t
