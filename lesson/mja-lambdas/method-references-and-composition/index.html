method-references-and-composition/step-1\",\"title\":\"Name the method instead\",\"body\":\"\u003cp\u003eWhen a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003elambda\u003c/button\u003e only calls one method, name that method.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003es -\u0026gt; s.length()\u003c/code\u003e becomes \u003ccode\u003eString::length\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e() -\u0026gt; new Apple()\u003c/code\u003e becomes \u003ccode\u003eApple::new\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"mja-lambdas/method-references-and-composition/step-2\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003elambda\u003c/button\u003e with its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Method reference\\\" data-def=\\\"A shorthand for a lambda that just calls a method — \u0026lt;code\u0026gt;Integer::parseInt\u0026lt;/code\u0026gt; for \u0026lt;code\u0026gt;s -\u0026amp;gt; Integer.parseInt(s)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003emethod reference\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003es -\u0026gt; Integer.parseInt(s)\u003c/code\u003e\",\"\u003ccode\u003es -\u0026gt; s.toUpperCase()\u003c/code\u003e\",\"\u003ccode\u003ex -\u0026gt; System.out.println(x)\u003c/code\u003e\",\"\u003ccode\u003e() -\u0026gt; new ArrayList\u0026lt;\u0026gt;()\u003c/code\u003e\"],\"right\":[\"\u003ccode\u003eInteger::parseInt\u003c/code\u003e\",\"\u003ccode\u003eString::toUpperCase\u003c/code\u003e\",\"\u003ccode\u003eSystem.out::println\u003c/code\u003e\",\"\u003ccode\u003eArrayList::new\u003c/code\u003e\"],\"rightOrder\":[1,2,0,3]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"mja-lambdas/method-references-and-composition/step-3\",\"title\":\"Build comparators from keys\",\"body\":\"\u003cp\u003e\u003ccode\u003ecomparing(Apple::weight)\u003c/code\u003e sorts by a key.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e.reversed()\u003c/code\u003e flips it.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e.thenComparing(Apple::country)\u003c/code\u003e breaks ties.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"mja-lambdas/method-references-and-composition/step-4\",\"prompt\":\"\u003cp\u003eSort heaviest first, then by country.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"inventory.sort(comparing(Apple::weight).\"},{\"answers\":[\"reversed\"],\"size\":8,\"choices\":[\"\u003e\",\"computeIfAbsent\",\"BinaryOperator\",\"reversed\"]},{\"text\":\"().thenComparing(Apple::country));\"}],\"code\":true,\"caseSensitive\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"mja-lambdas/method-references-and-composition/step-5\",\"title\":\"Compose functions\",\"body\":\"\u003cp\u003e\u003ccode\u003ef.andThen(g)\u003c/code\u003e applies \u003ccode\u003ef\u003c/code\u003e first, then \u003ccode\u003eg\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ef.compose(g)\u003c/code\u003e applies \u003ccode\u003eg\u003c/code\u003e first, then \u003ccode\u003ef\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003ePredicates combine with \u003ccode\u003eand\u003c/code\u003e, \u003ccode\u003eor\u003c/code\u003e and \u003ccode\u003enegate\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"mja-lambdas/method-references-and-composition/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003ef.andThen(g)\u003c/code\u003e applies \u003ccode\u003ef\u003c/code\u003e first, then \u003ccode\u003eg\u003c/code\u003e to the result: (1 + 1) × 2 = 4.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ef.compose(g)\u003c/code\u003e applies \u003ccode\u003eg\u003c/code\u003e first, then \u003ccode\u003ef\u003c/code\u003e: (1 × 2) + 1 = 3.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ecompose\u003c/code\u003e follows mathematical notation, f(g(x)), while \u003ccode\u003eandThen\u003c/code\u003e reads left to right like a pipeline.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"3 4\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eandThen\u003c/code\u003e runs \u003ccode\u003ef\u003c/code\u003e first: (1 + 1) × 2 = 4. \u003ccode\u003ecompose\u003c/code\u003e runs \u003ccode\u003eg\u003c/code\u003e first: 1 × 2 + 1 = 3.\u003c/p\u003e\\n\"},{\"html\":\"4 4\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe two methods apply the functions in opposite orders.\u003c/p\u003e\\n\"},{\"html\":\"4 3\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-7\",\"key\":\"mja-lambdas/method-references-and-composition/step-7\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eredApple\u003c/code\u003e and \u003ccode\u003eheavyApple\u003c/code\u003e are both \u003ccode\u
