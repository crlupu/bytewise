/p\u003e\\n\"},{\"html\":\"\u003ccode\u003es -\u0026gt; { return s.length(); }\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e(String s) -\u0026gt; s.length()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e() -\u0026gt; {}\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e(Integer i) -\u0026gt; return \u0026quot;Alan\u0026quot; + i;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ereturn\u003c/code\u003e is a statement, so it needs braces: \u003ccode\u003e(Integer i) -\u0026gt; { return \u0026quot;Alan\u0026quot; + i; }\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"mja-lambdas/lambda-syntax/step-3\",\"title\":\"The target type gives it meaning\",\"body\":\"$13\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"mja-lambdas/lambda-syntax/step-4\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t \u003ccode\u003eObject o = () -\u0026gt; System.out.println(\u0026quot;hi\u0026quot;);\u003c/code\u003e compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCast it to give it a target: \u003ccode\u003eObject o = (Runnable) () -\u0026gt; System.out.println(\u0026quot;hi\u0026quot;);\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eObject\u003c/code\u003e isn\u0026#39;t a functional interface, so the lambda has no target type\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Lambdas can\u0026#39;t print\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can do anything a method body can.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Functional interface\\\" data-def=\\\"An interface with exactly one abstract method, like \u0026lt;code\u0026gt;Runnable\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;Function\u0026amp;lt;T,R\u0026amp;gt;\u0026lt;/code\u0026gt;. A lambda or method reference can implement it.\\\" data-book=\\\"Effective Java\\\"\u003eFunctional interface\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003eLambda\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Target type\\\" data-def=\\\"The functional interface a lambda is converted to, taken from where the lambda appears — an assignment, an argument or a cast.\\\" data-book=\\\"Modern Java in Action\\\"\u003eTarget type\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"mja-lambdas/lambda-syntax/step-5\",\"title\":\"Captured variables must be effectively final\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003elambda\u003c/button\u003e can use local variables from the enclosing method.\u003c/p\u003e\\n\u003cp\u003eBut only if they\u0026#39;re never reassigned.\u003c/p\u003e\\n\u003cp\u003eIt captures a copy of the value, not the variable.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"mja-lambdas/lambda-syntax/step-6\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t this compile?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA lambda captures the value of a local variable, not the variable itself, so the variable must not change after capture — it must be effectively final.\u003c/p\u003e\\n\u003cp\u003eReassigning \u003ccode\u003eport\u003c/code\u003e after the lambda is created would make the captured copy and the variable disagree, so the compiler rejects it.\u003c/p\u003e\\n\u003cp\u003eFields aren\u0026#39;t subject to this rule, because the lambda captures \u003ccode\u003ethis\u003c/code\u003e and reads the field\u0026#39;s current value.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"\u003ccode\u003eport\u003c/code\u003e is reassigned, so it isn\u0026#39;t effectively final\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eRunnable\u003c/code\u003e can\u0026#39;t print\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eRunnable.run()\u003c/code\u003e can run any code.\u003c/p\u003e\\n\"},{\"html\":\"Lambdas can\u0026#39;t use local variables\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can, as long as the variables are effectively final.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Effectively final\\\" data-def=\\\"A local variable that\u0026amp;#39;s never reassigned after it\u0026amp;#39;s initialized, even without the \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; keyword. Lambdas and inner classes can only use such variables.\\\" data-book=\\\"Modern Java in Action\\\"\u003eEffectively final\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003eLambda\u003c/button\u003e\"]}]},\"courseTitle\":\"Behaviour parameterization and lambdas\",\"next\":{\"id\":\"functional-interfaces\",\"courseId\":\"mja-lambdas\",\"topicId\":\"modern-java\",\"key\":\"mja-lambdas/functional-interfaces\",\"title\":\"The standard functional interfaces\",\"summary\":\"`Predicate`, `Consumer`, `Function`, `Supplier` and their primitive versions cover most lambdas.\",\"duration\":5,\"tags\":[\"java\",\"modern java\",\"lambdas\",\"functional interfaces\",\"java util function\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§3.4, Using functional interfaces\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"mja-lambdas/functional-interfaces/step-1\",\"mja-lambdas/functional-interfaces/step-2\",\"mja-lambdas/functional-interfaces/step-3\",\"mja-lambdas/functional-interfaces/step-4\",\"mja-lambdas/functional-interfaces/step-5\",\"mja-lambdas/functional-interfaces/step-6\",\"mja-lambdas/functional-interfaces/step-7\"],\"exercises\":[\"mja-lambdas/functional-interfaces/step-2\",\"mja-lambdas/functional-interfaces/step-3\",\"mja-lambdas/functional-interfaces/step-5\",\"mja-lambdas/functional-interfaces/step-7\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016}
