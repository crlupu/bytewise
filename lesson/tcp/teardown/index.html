down/step-2\",\"prompt\":\"\u003cp\u003eThe connection is open. \u003cstrong\u003eClose it completely\u003c/strong\u003e, client first, until both sides are CLOSED.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFIN → \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eACK\u003c/button\u003e → FIN → ACK, then the client waited out TIME_WAIT. The server closed as soon as its FIN was acknowledged.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe client sends \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e first. What must the server do with it?\u003c/p\u003e\\n\",\"\u003cp\u003eAfter the server\u0026#39;s own FIN is acknowledged, the client still has to wait.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"tcp\",\"config\":{\"start\":\"established\",\"teardown\":true,\"clientIsn\":1000,\"serverIsn\":5000},\"goal\":{\"client\":\"CLOSED\",\"server\":\"CLOSED\"},\"question\":{\"prompt\":\"\u003cp\u003eWhich state did the client pass through just before CLOSED?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"CLOSE_WAIT\",\"correct\":false,\"feedback\":\"\u003cp\u003eCLOSE_WAIT is the server\u0026#39;s state after receiving the client\u0026#39;s FIN.\u003c/p\u003e\\n\"},{\"html\":\"LAST_ACK\",\"correct\":false,\"feedback\":\"\u003cp\u003eLAST_ACK is the server waiting for the ACK of its own FIN.\u003c/p\u003e\\n\"},{\"html\":\"TIME_WAIT\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"CLOSE_WAIT\\\" data-def=\\\"The state after receiving the other side\u0026amp;#39;s FIN but before your application calls close. Many of them usually mean a program forgot to close sockets.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eCLOSE_WAIT\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TIME_WAIT\\\" data-def=\\\"The state a TCP endpoint stays in after closing, for twice the maximum segment lifetime, so stray old packets can\u0026amp;#39;t confuse a new connection.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTIME_WAIT\u003c/button\u003e\"]},{\"id\":\"step-3\",\"key\":\"tcp/teardown/step-3\",\"prompt\":\"\u003cp\u003ePut a client-initiated close in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The client sends FIN\",\"The server acknowledges the client\u0026#39;s FIN\",\"The server sends its own FIN\",\"The client acknowledges the server\u0026#39;s FIN\",\"The client waits 2×MSL in TIME_WAIT, then closes\"],\"start\":[2,0,3,4,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TIME_WAIT\\\" data-def=\\\"The state a TCP endpoint stays in after closing, for twice the maximum segment lifetime, so stray old packets can\u0026amp;#39;t confuse a new connection.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTIME_WAIT\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"tcp/teardown/step-4\",\"prompt\":\"\u003cp\u003eThe server has acknowledged the client\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e, but hasn\u0026#39;t sent its own. Can the server still send data to the client?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s how a client can send a whole request, close its side, and still read the full response.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes — the connection is half-closed, and only the client\u0026#39;s direction is finished\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"No — once either side sends FIN, the connection is closed\",\"correct\":false,\"feedback\":\"\u003cp\u003eFIN closes only the sender\u0026#39;s direction. The other stream stays open until its own FIN.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"tcp/teardown/step-5\",\"title\":\"TIME_WAIT\",\"body\":\"\u003cp\u003eThe side that closed first waits twice the maximum \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Segment\\\" data-def=\\\"A TCP packet — a header plus a piece of the byte stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003esegment\u003c/button\u003e lifetime.\u003c/p\u003e\\n\u003cp\u003eIt can resend a lost final \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eACK\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eStray old packets die out before the port is reused.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"tcp/teardown/step-6\",\"prompt\":\"\u003cp\u003eWhy does the side that closed first wait in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TIME_WAIT\\\" data-def=\\\"The state a TCP endpoint stays in after closing, for twice the maximum segment lifetime, so stray old packets can\u0026amp;#39;t confuse a new connection.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTIME_WAIT\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIf the last ACK is lost, the other side resends its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e — someone has to be around to answer.\\nAnd waiting 2×MSL guarantees no old segment can be mistaken for part of a new connection.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIf the final ACK is lost, the other side retransmits its FIN; the side in TIME_WAIT is still there to acknowledge it, so both close cleanly.\u003c/p\u003e\\n\u003cp\u003eAnd segments from this connection may still be in the network. Waiting twice the maximum segment lifetime ensures they\u0026#39;ve expired before the same address and port pair can be reused, so they can\u0026#39;t be mistaken for part of a new connection.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"To give the application time to read the rest of the data\",\"correct\":false,\"feedback\":\"\u003cp\u003eAll the data has already been delivered by then; TIME_WAIT is about stray segments, not the application.\u003c/p\u003e\\n\"},{\"html\":\"So delayed segments from this connection die out before the same addresses and ports can be reused\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"To resend the final ACK if it gets lost\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Segment\\\" data-def=\\\"A TCP packet — a header plus a piece of the byte stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSegment\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eACK\u003c/button\u003e\"]},{\"id\":\"step-7\",\"key\":\"tcp/teardown/step-7\",\"prompt\":\"\u003cp\u003eMatch each state to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"FIN_WAIT_1\",\"FIN_WAIT_2\",\"CLOSE_WAIT\",\"LAST_ACK\",\"TIME_WAIT\"],\"right\":[\"Sent FIN, waiting for it to be acknowledged\",\"Our FIN is acknowledged; waiting for the other side\u0026#39;s FIN\",\"Received a FIN; our application hasn\u0026#39;t closed yet\",\"Sent our FIN after receiving one; waiting for the last ACK\",\"Everything\u0026#39;s acknowledged; waiting 2×MSL before closing\"],\"rightOrder\":[0,1,4,3,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"CLOSE_WAIT\\\" data-def=\\\"The state after receiving the other side\u0026amp;#39;s FIN but before your application calls close. Many of them usually mean a progr
