"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e (\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYN\u003c/button\u003e, then SYN-ACK) enough?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEach side needs proof the other has its number. Without the final \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eACK\u003c/button\u003e, a delayed duplicate SYN from an old\\nconnection could make the server open a connection nobody asked for.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWith only SYN and SYN-ACK, the server never learns that the client received its initial sequence number, so it can\u0026#39;t be sure both sides agree on numbering.\u003c/p\u003e\\n\u003cp\u003eWorse, a delayed duplicate SYN from an earlier connection could reach the server, which would reply and consider a connection open that the client never wanted.\u003c/p\u003e\\n\u003cp\u003eThe client\u0026#39;s final ACK confirms it\u0026#39;s live and has the server\u0026#39;s number; without it, the server discards the half-open connection.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Two segments can\u0026#39;t carry two sequence numbers\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe SYN-ACK alone carries one number and acknowledges the other. What\u0026#39;s missing is confirmation in the other direction.\u003c/p\u003e\\n\"},{\"html\":\"The server wouldn\u0026#39;t know the client received the server\u0026#39;s ISN\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The third segment carries the first data\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt may, but it doesn\u0026#39;t have to. Its job is acknowledging the server\u0026#39;s ISN.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Segment\\\" data-def=\\\"A TCP packet — a header plus a piece of the byte stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSegment\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sequence number\\\" data-def=\\\"The byte position of a segment\u0026amp;#39;s data in the stream. Lets the receiver reorder segments and spot gaps.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSequence number\u003c/button\u003e\"]},{\"id\":\"step-8\",\"key\":\"tcp/handshake/step-8\",\"prompt\":\"\u003cp\u003eMatch each state to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"LISTEN\",\"SYN_SENT\",\"SYN_RECEIVED\",\"ESTABLISHED\"],\"right\":[\"Server waiting for a SYN\",\"Client has sent SYN and awaits the reply\",\"Server got a SYN and has replied with SYN-ACK\",\"Handshake finished; data can flow\"],\"rightOrder\":[3,2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYN\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eThree-way handshake\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-9\",\"key\":\"tcp/handshake/step-9\",\"title\":\"SYN floods and cookies\",\"body\":\"\u003cp\u003eAttackers send \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYNs\u003c/button\u003e and never finish the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eHalf-open connections fill the server\u0026#39;s table.\u003c/p\u003e\\n\u003cp\u003eSYN cookies store nothing until the final \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eACK\u003c/button\u003e arrives.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"}]},\"courseTitle\":\"TCP connections\",\"next\":{\"id\":\"teardown\",\"courseId\":\"tcp\",\"topicId\":\"networking\",\"key\":\"tcp/teardown\",\"title\":\"Closing a connection\",\"summary\":\"Four segments, half-closes, and why TIME_WAIT hangs around.\",\"duration\":7,\"tags\":[\"networking\",\"tcp\",\"fin\",\"teardown\",\"time_wait\",\"close_wait\"],\"sources\":[{\"book\":\"kurose-ross\",\"ref\":\"§3.5.6, TCP Connection Management\"}]
