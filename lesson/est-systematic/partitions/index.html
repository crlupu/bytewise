ourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"partitions\",\"courseId\":\"est-systematic\",\"topicId\":\"software-testing\",\"key\":\"est-systematic/partitions\",\"title\":\"Partitioning the input\",\"summary\":\"Split each input into classes that the program should treat the same way, then test one value from each class and their combinations.\",\"duration\":6,\"tags\":[\"testing\",\"effective software testing\",\"specification based testing\",\"equivalence partitioning\"],\"sources\":[{\"book\":\"effective-software-testing\",\"ref\":\"Chapter 2, Specification-based testing\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"est-systematic/partitions/step-1\",\"est-systematic/partitions/step-2\",\"est-systematic/partitions/step-3\",\"est-systematic/partitions/step-4\",\"est-systematic/partitions/step-5\",\"est-systematic/partitions/step-6\"],\"exercises\":[\"est-systematic/partitions/step-3\",\"est-systematic/partitions/step-5\",\"est-systematic/partitions/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"est-systematic/partitions/step-1\",\"title\":\"Read the requirement\",\"body\":\"\u003cp\u003eStart from what the method should do, not from its code.\u003c/p\u003e\\n\u003cp\u003eList each input and what values it can take.\u003c/p\u003e\\n\u003cp\u003eNote the outputs and the rules connecting them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"est-systematic/partitions/step-2\",\"title\":\"Find the partitions\",\"body\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartition\u003c/button\u003e is a set of inputs the program should handle alike.\u003c/p\u003e\\n\u003cp\u003eFor a string: null, empty, one character, many characters.\u003c/p\u003e\\n\u003cp\u003eOne test per partition is usually enough.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"est-systematic/partitions/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003esubstringsBetween(str, open, close)\u003c/code\u003e returns the substrings between \u003ccode\u003eopen\u003c/code\u003e and \u003ccode\u003eclose\u003c/code\u003e tags. Which are distinct \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartitions\u003c/button\u003e of \u003ccode\u003estr\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e\u0026quot;abc\u0026quot;\u003c/code\u003e and \u003ccode\u003e\u0026quot;xyz\u0026quot;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth are strings without tags — the same partition, so one test covers both.\u003c/p\u003e\\n\"},{\"html\":\"A string with no tags in it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Empty string\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Null\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"est-systematic/partitions/step-4\",\"title\":\"Combine wisely\",\"body\":\"\u003cp\u003eTesting every combination of every \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartition\u003c/button\u003e explodes.\u003c/p\u003e\\n\u003cp\u003eTest exceptional values, like null, once, not combined with everything.\u003c/p\u003e\\n\u003cp\u003eCombine the partitions that interact.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"est-systematic/partitions/step-5\",\"prompt\":\"\u003cp\u003eA method takes \u003ccode\u003eage\u003c/code\u003e and \u003ccode\u003ecountry\u003c/code\u003e. You have 4 \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartitions\u003c/button\u003e for each. How should you combine them?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eTesting every combination of four partitions for each input means 16 tests, and it grows fast with more inputs.\u003c/p\u003e\\n\u003cp\u003eExceptional values like null or negative ages usually make the method fail the same way regardless of the other input, so one test each is enough.\u003c/p\u003e\\n\u003cp\u003eThen combine only the valid partitions that the rules actually connect — say, age groups with countries that have different age limits.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"All 16 combinations, always\",\"correct\":false,\"feedback\":\"\u003cp\u003eFor many inputs that grows too fast; exceptional values don\u0026#39;t need combining.\u003c/p\u003e\\n\"},{\"html\":\"Test null and invalid values on their own, then combine the valid partitions that the rules connect\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"est-systematic/partitions/step-6\",\"prompt\":\"\u003cp\u003eMatch each input with sensible \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartitions\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"A list\",\"A number of items to buy\",\"A file path\"],\"right\":[\"Null, empty, one element, many elements\",\"Negative, zero, positive\",\"Missing, empty file, readable file, unreadable file\"],\"rightOrder\":[1,2,0]}]},\"courseTitle\":\"Systematic testing\",\"next\":{\"id\":\"boundaries\",\"courseId\":\"est-systematic\",\"topicId\":\"software-testing\",\"key\":\"est-systematic/boundaries\",\"title\":\"Boundary testing\",\"summary\":\"Bugs cluster where one partition meets the next. Test the on point and the off point of every boundary.\",\"duration\":5,\"tags\":[\"testing\",\"effective software testing\",\"boundary testing\",\"off by one\"],\"sources\":[{\"book\":\"effective-software-testing\",\"ref\":\"§2.2, Boundary analysis\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"est-systematic/boundaries/step-1\",\"est-systematic/boundaries/step-2\",\"est-systematic/boundaries/step-3\",\"est-systematic/boundaries/step-4\",\"est-systematic/boundaries/step-5\",\"est-systematic/boundaries/step-6\"],\"exercises\":[\"est-systematic/boundaries/step-3\",\"est-systematic/boundaries/step-4\",\"est-systematic/boundaries/step-6\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-perfo
