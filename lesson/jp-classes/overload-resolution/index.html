d\":\"jp-classes\",\"topicId\":\"java-puzzlers\",\"key\":\"jp-classes/overload-resolution\",\"title\":\"Which overload gets null?\",\"summary\":\"The compiler picks the most specific applicable overload, at compile time, from the static types.\",\"duration\":5,\"tags\":[\"java\",\"puzzlers\",\"overloading\",\"null\",\"compile time\"],\"sources\":[{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 46, The Case of the Confusing Constructor\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jp-classes/overload-resolution/step-1\",\"jp-classes/overload-resolution/step-2\",\"jp-classes/overload-resolution/step-3\",\"jp-classes/overload-resolution/step-4\",\"jp-classes/overload-resolution/step-5\"],\"exercises\":[\"jp-classes/overload-resolution/step-2\",\"jp-classes/overload-resolution/step-4\",\"jp-classes/overload-resolution/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jp-classes/overload-resolution/step-1\",\"title\":\"The most specific overload wins\",\"body\":\"\u003cp\u003eThe compiler finds every overload that could accept the arguments.\u003c/p\u003e\\n\u003cp\u003eIt picks the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Most specific overload\\\" data-def=\\\"The rule the compiler uses to choose between overloads: if one\u0026amp;#39;s parameters could be passed to the other, it\u0026amp;#39;s more specific and wins.\\\" data-book=\\\"Java Puzzlers\\\"\u003emost specific\u003c/button\u003e one: the one whose parameters the others could also accept.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003edouble[]\u003c/code\u003e is more specific than \u003ccode\u003eObject\u003c/code\u003e, because every \u003ccode\u003edouble[]\u003c/code\u003e is an \u003ccode\u003eObject\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-classes/overload-resolution/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003enew Confusing(null)\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe compiler first finds every overload that could accept \u003ccode\u003enull\u003c/code\u003e: both \u003ccode\u003eObject\u003c/code\u003e and \u003ccode\u003edouble[]\u003c/code\u003e can.\u003c/p\u003e\\n\u003cp\u003eIt then picks the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Most specific overload\\\" data-def=\\\"The rule the compiler uses to choose between overloads: if one\u0026amp;#39;s parameters could be passed to the other, it\u0026amp;#39;s more specific and wins.\\\" data-book=\\\"Java Puzzlers\\\"\u003emost specific\u003c/button\u003e — one whose parameter type could be passed to the other. A \u003ccode\u003edouble[]\u003c/code\u003e can be passed where an \u003ccode\u003eObject\u003c/code\u003e is expected, but not the reverse, so \u003ccode\u003edouble[]\u003c/code\u003e wins.\u003c/p\u003e\\n\u003cp\u003eTo call the \u003ccode\u003eObject\u003c/code\u003e version, cast the argument: \u003ccode\u003enew Confusing((Object) null)\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s ambiguous and doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt would be ambiguous only if neither type were a subtype of the other.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003edouble array\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eObject\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003enull\u003c/code\u003e fits both, and \u003ccode\u003edouble[]\u003c/code\u003e is the more specific type.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jp-classes/overload-resolution/step-3\",\"title\":\"Overloads are chosen at compile time\",\"body\":\"\u003cp\u003eThe choice uses the arguments\u0026#39; declared types, not their runtime types.\u003c/p\u003e\\n\u003cp\u003eCast an argument to steer it: \u003ccode\u003enew Confusing((Object) null)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eBetter still, give the methods different names.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"jp-classes/overload-resolution/step-4\",\"prompt\":\"\u003cp\u003eWhich method runs?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003elist\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe object is an \u003ccode\u003eArrayList\u003c/code\u003e, but its declared type is \u003ccode\u003eCollection\u003c/code\u003e — and overloads are picked from declared types.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ecollection\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"jp-classes/overload-resolution/step-5\",\"prompt\":\"\u003cp\u003eTwo overloads take \u003ccode\u003eString\u003c/code\u003e and \u003ccode\u003eInteger\u003c/code\u003e. What does \u003ccode\u003ef(null)\u003c/code\u003e do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAvoid overloads with the same number of parameters when an argument could fit both.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile — neither type is more specific, so the call is ambiguous\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It calls the \u003ccode\u003eString\u003c/code\u003e version, declared first\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeclaration order never matters.\u003c/p\u003e\\n\"}],\"multiple\":false}]},\"courseTitle\":\"Classy puzzlers\",\"next\":{\"id\":\"static-is-not-polymorphic\",\"courseId\":\"jp-classes\",\"topicId\":\"java-puzzlers\",\"key\":\"jp-classes/static-is-not-polymorphic\",\"title\":\"Static methods don't override\",\"summary\":\"A static method is chosen by the declared type, even when called on an instance — or on null.\",\"duration\":4,\"tags\":[\"java\",\"puzzlers\",\"static\",\"hiding\",\"overriding\"],\"sources\":[{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 48, All I Get Is Static\"},{\"book\":\"java-puzzlers\",\"ref\":\"Puzzle 54, Null and Void\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jp-classes/static-is-not-polymorphic/step-1\",\"jp-classes/static-is-not-polymorphic/step-2\",\"jp-classes/static-is-not-polymorphic/step-3\",\"jp-classes/static-is-not-polymorphic/step-4\",\"jp-classes/static-is-not-polymorphic/step-5\"],\"exercises\":[\"jp-classes/static-is-not-polymorphic/step-2\",\"jp-classes/static-is-not-polymorphic/step-4\",\"jp-classes/static-is-not-polymorphic/step-5\"]},\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpac
