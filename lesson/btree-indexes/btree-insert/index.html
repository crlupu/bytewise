\",\"static/chunks/app/(focus)/lesson/%5BcourseId%5D/%5BlessonId%5D/page-7c74236c54eff835.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"btree-insert\",\"courseId\":\"btree-indexes\",\"topicId\":\"databases\",\"key\":\"btree-indexes/btree-insert\",\"title\":\"Inserting into a B-tree\",\"summary\":\"Watch nodes fill, split and push keys upward — and the tree grow only at the root.\",\"duration\":9,\"tags\":[\"databases\",\"b-tree\",\"insert\",\"split\",\"balanced tree\"],\"sources\":[{\"book\":\"database-internals\",\"ref\":\"Chapter 2, B-Tree Basics\"}],\"requires\":[\"btree-indexes/why-indexes\"],\"steps\":8,\"stepKeys\":[\"btree-indexes/btree-insert/step-1\",\"btree-indexes/btree-insert/step-2\",\"btree-indexes/btree-insert/step-3\",\"btree-indexes/btree-insert/step-4\",\"btree-indexes/btree-insert/step-5\",\"btree-indexes/btree-insert/step-6\",\"btree-indexes/btree-insert/step-7\",\"btree-indexes/btree-insert/step-8\"],\"exercises\":[\"btree-indexes/btree-insert/step-2\",\"btree-indexes/btree-insert/step-3\",\"btree-indexes/btree-insert/step-4\",\"btree-indexes/btree-insert/step-6\",\"btree-indexes/btree-insert/step-7\",\"btree-indexes/btree-insert/step-8\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"btree-indexes/btree-insert/step-1\",\"title\":\"The B-tree rules\",\"body\":\"\u003cp\u003eA node of order m holds at most m − 1 sorted keys.\u003c/p\u003e\\n\u003cp\u003eAll leaves sit at the same depth.\u003c/p\u003e\\n\u003cp\u003eNew keys go into a leaf.\u003c/p\u003e\\n\u003cp\u003eA full leaf \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003esplits\u003c/button\u003e, pushing its middle key up.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"btree-indexes/btree-insert/step-2\",\"prompt\":\"\u003cp\u003eAn empty \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e of order 3 — at most \u003cstrong\u003e2 keys\u003c/strong\u003e per node. Insert 10, 20 and 30 with the button or\\n\u003cstrong\u003eStep forward\u003c/strong\u003e, and watch what happens when a leaf gets a third key.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e[10, 20, 30] overflowed, so it \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003esplit\u003c/button\u003e around its middle key: 20 moved up into a new root,\\nwith [10] and [30] as its children.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"btree\",\"config\":{\"order\":3,\"sequence\":[10,20,30],\"custom\":false},\"goal\":{\"splits\":1},\"question\":{\"prompt\":\"\u003cp\u003eAfter inserting 30, which key is in the root?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"10\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"20\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"30\",\"correct\":false,\"feedback\":\"\u003cp\u003e30 went into a leaf. Look at which key moved \u003cem\u003eup\u003c/em\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"id\":\"step-3\",\"key\":\"btree-indexes/btree-insert/step-3\",\"prompt\":\"\u003cp\u003eStarting from that tree — root [20], leaves [10] and [30] — you insert \u003cstrong\u003e40\u003c/strong\u003e and then \u003cstrong\u003e50\u003c/strong\u003e.\\nWhich key moves up into the root?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e40 makes the leaf [30, 40]. 50 makes it [30, 40, 50] — too many — so it \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003esplits\u003c/button\u003e, and the middle\\nkey, 40, moves up. The root becomes [20, 40].\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAfter inserting 40, the right leaf is [30, 40], which fits. Inserting 50 makes it [30, 40, 50] — three keys in a node that holds at most two.\u003c/p\u003e\\n\u003cp\u003eThe leaf splits around its middle key: [30] stays left, [50] goes right, and 40 is pushed up to the parent, so the root becomes [20, 40] with three children.\u003c/p\u003e\\n\u003cp\u003ePushing the middle key up is what keeps every leaf at the same depth.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e40 joins the leaf [30]. Where does 50 go, and is that leaf now too full?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"30\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"40\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"50\",\"correct\":false,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-4\",\"key\":\"btree-indexes/btree-insert/step-4\",\"prompt\":\"\u003cp\u003eThis tree already holds 10–50. \u003cstrong\u003eMake it grow to three levels.\u003c/strong\u003e Use the keys offered, or type your own.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eInserting 70 split a leaf, which pushed 60 into the root, which then held three keys and split too.\\nA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e grows \u003cstrong\u003eat the root\u003c/strong\u003e, never at the leaves.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eInsert 60, then 70, and watch the root.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"btree\",\"config\":{\"order\":3,\"initial\":[10,20,30,40,50],\"sequence\":[60,70],\"custom\":true},\"goal\":{\"height\":3},\"question\":{\"prompt\":\"\u003cp\u003eWhat made the tree one level taller?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Inserting a key larger than all the others\",\"correct\":false,\"feedback\":\"\u003cp\u003eLarge keys go to the rightmost leaf like any other key; that alone doesn\u0026#39;t add a level.\u003c/p\u003e\\n\"},{\"html\":\"A leaf got a third key\",\"correct\":false,\"feedback\":\"\u003cp\u003eA leaf split only adds a key to its parent. Height changes only when the split reaches the top.\u003c/p\u003e\\n\"},{\"html\":\"The root split\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003eSplit\u003c/button\u003e\"]},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"btree-indexes/btree-insert/step-5\",\"title\":\"Always balanced\",\"body\":\"\u003cp\u003eNew levels only appear at the top, when the root \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003esplits\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eSo every leaf stays at the same depth.\u003c/p\u003e\\n\u003cp\u003eNo insertion order can make it lopsided.\u003c/p\u003e\\n\u003cp\u003eA search visits one node per level.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"btree-indexes/btree-insert/step-6\",\"prompt\":\"\u003cp\u003eHere\u0026#39;s an order-4 tree (up to 3 keys per node) holding ten keys. \u003cstrong\u003eSearch for 47\u003c/strong\u003e and look at the path it takes.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAt the root [19, 40, 61], 47 is between 40 and 61, so the search follows the third child — and finds 47 there.\\nOne node per level: two levels, two nodes.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"btree\",\"config\":{\"order\":4,\"initial\":[5,12,19,26,33,40,47,54,61,68],\"custom\":false,\"search\":true},\"goal\":{\"found\":47},\"question\":{\"prompt\":\"\u003cp\u003eHow many nodes did the search visit?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"1\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"2\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"3\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would be a scan. The search only follows one path from the root.\u003c/p\u003e\\n\"}],\"multiple\":false}},{\"id\":\"step-7\",\"key\":\"btree-indexes/btree-insert/step-7\",\"prompt\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e of order 100 holds 1,000,000 keys. Roughly how many nodes does a search visit?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e100³ = 1,000,000, so about three levels.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach node visited narrows the search to one of about 100 children.\u003c/p\u003e\\n\u003cp\u003eAfter one level you\u0026#39;re down to a hundredth of the keys, after two a ten-thousandth, and after three a millionth — that is, one key.\u003c/p\u003e\\n\u003cp\u003eSo the height is about log base 100 of a million, which is 3. Because the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fanout\\\" data-def=\\\"How many children each node of a tree has. High fanout means a shallow tree and fewer disk reads.\\\" data-book=\\\"Database Internals\\\"\u003efan-out\u003c/button\u003e is so high, even billions of keys need only four or five levels, and the top levels usually stay in memory.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"About 20\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s a binary search tree — \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fanout\\\" data-def=\\\"How many children each node of a tree has. High fanout means a shallow tree and fewer disk reads.\\\" data-book=\\\"Database Internals\\\"\u003efan-out\u003c/button\u003e 2. With fan-out 100, each level divides the range by 100.\u003c/p\u003e\\n\"},{\"html\":\"About 1,000\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"About 1,000,000\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"About 3\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-8\",\"key\":\"btree-indexes/btree-insert/step-8\",\"prompt\":\"\u003cp\u003ePut the steps of inserting a key into a full leaf in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined
