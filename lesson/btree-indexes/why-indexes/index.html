\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003eemail\u003c/code\u003e. In the worst case, how many rows does \u003ccode\u003eSELECT * FROM users WHERE email = \u0026#39;ada@example.com\u0026#39;\u003c/code\u003e examine?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith nothing sorted by \u003ccode\u003eemail\u003c/code\u003e, the only safe answer is to look at every row.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Just one\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe database can\u0026#39;t know where the row is without looking.\u003c/p\u003e\\n\"},{\"html\":\"About 24 — a binary search\",\"correct\":false,\"feedback\":\"\u003cp\u003eBinary search needs the rows sorted by \u003ccode\u003eemail\u003c/code\u003e. In a heap table they\u0026#39;re in insertion order.\u003c/p\u003e\\n\"},{\"html\":\"All 10 million\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"btree-indexes/why-indexes/step-3\",\"title\":\"An index is a sorted tree\",\"body\":\"\u003cp\u003eAn \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e keeps the column sorted, pointing to each row.\u003c/p\u003e\\n\u003cp\u003eDatabases store it as a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eEach node is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epage\u003c/button\u003e holding hundreds of keys.\u003c/p\u003e\\n\u003cp\u003eSo the tree is only a few levels deep.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"btree-indexes/why-indexes/step-4\",\"prompt\":\"\u003cp\u003eEach \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e node holds up to 500 keys, so it has up to about 500 children.\\n\u003cstrong\u003eHow many levels\u003c/strong\u003e are needed to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e 100 million keys?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e500³ = 125,000,000 ≥ 100 million, so three levels — three \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epage\u003c/button\u003e reads to find any row.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eOne level holds 500 keys; two levels hold about 500 × 500.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"2\",\"correct\":false,\"feedback\":\"\u003cp\u003eTwo levels reach about 500 × 500 = 250,000 keys. Not enough.\u003c/p\u003e\\n\"},{\"html\":\"3\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"4\",\"correct\":false,\"feedback\":\"\u003cp\u003eClose — but three levels already reach 500³ = 125 million.\u003c/p\u003e\\n\"},{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eThree levels already reach 125 million keys.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"btree-indexes/why-indexes/step-5\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Root\",\"Leaf\",\"Fan-out\",\"Order\"],\"right\":[\"The single node at the top, where every search starts\",\"A node with no children, at the bottom level\",\"How many children a node has\",\"The most children a node is allowed\"],\"rightOrder\":[1,2,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fanout\\\" data-def=\\\"How many children each node of a tree has. High fanout means a shallow tree and fewer disk reads.\\\" data-book=\\\"Database Internals\\\"\u003eFanout\u003c/button\u003e\"]},{\"id\":\"step-6\",\"key\":\"btree-indexes/why-indexes/step-6\",\"prompt\":\"\u003cp\u003eThere\u0026#39;s an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003elast_name\u003c/code\u003e. Which of these can use it?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEquality, prefix matches and sorting all follow the index\u0026#39;s order. A suffix match doesn\u0026#39;t,\\nso it falls back to scanning.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAn index on \u003ccode\u003elast_name\u003c/code\u003e stores names in sorted order, like a phone book.\u003c/p\u003e\\n\u003cp\u003eEquality finds one spot, a prefix like \u003ccode\u003e\u0026#39;Lov%\u0026#39;\u003c/code\u003e is a contiguous range starting at \u0026quot;Lov\u0026quot;, and \u003ccode\u003eORDER BY\u003c/code\u003e can read entries in order without sorting.\u003c/p\u003e\\n\u003cp\u003eA pattern like \u003ccode\u003e\u0026#39;%lace\u0026#39;\u003c/code\u003e matches names scattered all over the sorted order, so the database can\u0026#39;t jump to them and must scan.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe index helps when the sorted order narrows down where to look.\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eWHERE last_name LIKE \u0026#39;Lov%\u0026#39;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eWHERE last_name = \u0026#39;Lovelace\u0026#39;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eORDER BY last_name\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eWHERE last_name LIKE \u0026#39;%lace\u0026#39;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA leading wildcard means the match could start anywhere in the sorted order, so the tree can\u0026#39;t narrow it down.\u003c/p\u003e\\n\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-7\",\"key\":\"btree-indexes/why-indexes/step-7\",\"title\":\"Indexes cost writes\",\"body\":\"\u003cp\u003eEvery insert, update and delete must update the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e too.\u003c/p\u003e\\n\u003cp\u003eIndexes take disk space and memory.\u003c/p\u003e\\n\u003cp\u003eIndex the columns you search and sort by often.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-8\",\"key\":\"btree-indexes/why-indexes/step-8\",\"prompt\":\"\u003cp\u003eWhich of these are costs of adding an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIndexes trade write speed and space for read speed.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It takes extra disk space\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Writes to the table get slower\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Reads that use it get slower\",\"correct\":false,\"feedback\":\"\u003cp\u003eReads that use an index get faster — that\u0026#39;s the point. The costs land on writes and storage.\u003c/p\u003e\\n\"}],\"multiple\":true}]},\"courseTitle\":\"B-tree
