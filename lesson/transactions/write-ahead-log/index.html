f-apply data.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"transactions/write-ahead-log/step-2\",\"title\":\"Log first\",\"body\":\"\u003cp\u003eEvery change is appended to the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Write-ahead log\\\" data-def=\\\"Recording every change in an append-only log, and forcing it to disk, before changing the data pages. After a crash, the log is replayed.\\\" data-book=\\\"Database Internals\\\"\u003ewrite-ahead log\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eOn commit, the log is flushed to disk.\u003c/p\u003e\\n\u003cp\u003eSequential log writes are much cheaper than scattered \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epages\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-3\",\"key\":\"transactions/write-ahead-log/step-3\",\"prompt\":\"\u003cp\u003ePut the life of a committed update in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe log hits disk before the page does, and before the client hears \u0026quot;committed\u0026quot;.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The page is changed in the buffer pool\",\"A log record describing the change is appended to the WAL buffer\",\"On commit, the WAL is flushed to disk (fsync), and only then is commit acknowledged\",\"Later, the dirty page is written back to its place on disk\"],\"start\":[2,3,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003ePage\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Buffer pool\\\" data-def=\\\"The database\u0026amp;#39;s in-memory cache of disk pages.\\\" data-book=\\\"Database Internals\\\"\u003eBuffer pool\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Write-ahead log\\\" data-def=\\\"Recording every change in an append-only log, and forcing it to disk, before changing the data pages. After a crash, the log is replayed.\\\" data-book=\\\"Database Internals\\\"\u003eWrite-ahead log\u003c/button\u003e\"]},{\"id\":\"step-4\",\"key\":\"transactions/write-ahead-log/step-4\",\"prompt\":\"\u003cp\u003eWhy is flushing the log on commit much cheaper than flushing the changed \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epages\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSequential appends are fast on every kind of storage. Random page writes can wait and be combined.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The log is written sequentially at the end of one file; pages are scattered across the disk\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The log isn\u0026#39;t really flushed\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt must be — that\u0026#39;s what makes commit durable.\u003c/p\u003e\\n\"},{\"html\":\"Log records are compressed\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey may be, but the big win is sequential vs random writes.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-5\",\"key\":\"transactions/write-ahead-log/step-5\",\"title\":\"Recovery replays the log\",\"body\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Redo\\\" data-def=\\\"Reapplying logged changes of committed transactions that may not have reached the data pages before a crash.\\\" data-book=\\\"Database Internals\\\"\u003eRedo\u003c/button\u003e: reapply committed changes that missed the disk.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Undo\\\" data-def=\\\"Reverting changes made by transactions that hadn\u0026amp;#39;t committed when the system crashed.\\\" data-book=\\\"Database Internals\\\"\u003eUndo\u003c/button\u003e: reverse uncommitted changes that reached it.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checkpoint\\\" data-def=\\\"Periodically flushing dirty pages and noting it in the log, so recovery only needs to replay the log from that point.\\\" data-book=\\\"Database Internals\\\"\u003eCheckpoints\u003c/button\u003e limit how far back recovery must read.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"transactions/write-ahead-log/step-6\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Redo\",\"Undo\",\"Checkpoint\",\"Force at commit\"],\"right\":[\"Reapply logged changes of committed transactions\",\"Reverse changes of transactions that didn\u0026#39;t commit\",\"A marker that bounds how far back recovery must read\",\"Flushing the log — not the pages — before acknowledging\"],\"rightOrder\":[1,3,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Redo\\\" data-def=\\\"Reapplying logged changes
