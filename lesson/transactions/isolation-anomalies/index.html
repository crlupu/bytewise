es the first.\\\" data-book=\\\"Database Internals\\\"\u003elost update\u003c/button\u003e\u003c/strong\u003e, the same race as \u003ccode\u003ecount++\u003c/code\u003e in Java, now between transactions. Fixes: an atomic\\n\u003ccode\u003eUPDATE ... SET n = n + 1\u003c/code\u003e, \u003ccode\u003eSELECT ... FOR UPDATE\u003c/code\u003e, \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Optimistic locking\\\" data-def=\\\"No locks while reading; on update, check a version column hasn\u0026amp;#39;t changed and fail if it has. Good when conflicts are rare.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eoptimistic locking\u003c/button\u003e with a version column, or a stricter level.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBoth transactions read 10, both compute 11 in the application, and both write 11; the second write overwrites the first.\u003c/p\u003e\\n\u003cp\u003eRead committed only prevents reading uncommitted data — both reads saw the committed value 10 — so nothing stops this.\u003c/p\u003e\\n\u003cp\u003eFixes: let the database do the arithmetic, \u003ccode\u003eUPDATE counter SET n = n + 1\u003c/code\u003e; lock the row with \u003ccode\u003eSELECT ... FOR UPDATE\u003c/code\u003e; or use optimistic locking with a version column so the second write fails.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth transactions wrote 11; the value can\u0026#39;t stay at 10.\u003c/p\u003e\\n\"},{\"html\":\"12\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach transaction writes the value \u003cem\u003eit computed\u003c/em\u003e from its own read of 10.\u003c/p\u003e\\n\"},{\"html\":\"11\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The second transaction fails with an error\",\"correct\":false,\"feedback\":\"\u003cp\u003eAt read committed a plain write simply overwrites the first — silently.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-8\",\"key\":\"transactions/isolation-anomalies/step-8\",\"prompt\":\"\u003cp\u003eTwo doctors are on call; the rule is at least one must be. Each, in their own \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transaction\\\" data-def=\\\"A group of operations that succeed or fail together.\\\" data-book=\\\"Database Internals\\\"\u003etransaction\u003c/button\u003e, checks \u0026quot;two are on call\u0026quot;\\nand takes themselves off. Under \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Snapshot isolation\\\" data-def=\\\"Each transaction reads from a consistent snapshot of the database as of its start; concurrent writes to the same row conflict.\\\" data-book=\\\"Database Internals\\\"\u003esnapshot isolation\u003c/button\u003e both commit — no one is on call. What is this anomaly?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003eWrite skew\u003c/strong\u003e: each transaction\u0026#39;s read was true when made, but their writes together broke an invariant\\nspanning several rows. \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serializable\\\" data-def=\\\"The strongest isolation level — the outcome is as if transactions ran one at a time.\\\" data-book=\\\"Database Internals\\\"\u003eSerializable\u003c/button\u003e isolation (or explicit locks on the rows read) prevents it.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eUnder snapshot isolation, each transaction reads from a snapshot taken when it started, and only conflicting writes to the same row are detected.\u003c/p\u003e\\n\u003cp\u003eBoth doctors see two on call, and each updates a different row — their own — so there\u0026#39;s no write conflict and both commit.\u003c/p\u003e\\n\u003cp\u003eThe result breaks the rule \u0026quot;at least one on call\u0026quot;, which spans rows neither transaction wrote together.\u003c/p\u003e\\n\u003cp\u003eSerializable isolation, or explicitly locking the rows read, prevents this write skew.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Lost update\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey updated \u003cem\u003edifferent\u003c/em\u003e rows, so neither overwrote the other.\u003c/p\u003e\\n\"},{\"html\":\"Write skew\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Dirty read\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Read committed\\\" data-def=\\\"An isolation level where you only see committed data, but rereading a row may give a different answer if someone committed in between.\\\" data-book=\\\"Database Internals\\\"\u003eread committed\u003c/button\u003e data from their snapshots.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lost update\\\" data-def=\\\"Two transactions read the same value, both modify it, and the second write overwrites the first.\\\" data-book=\\\"Database Internals\\\"\u003eLost update\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Dirty read\\\" data-def=\\\"Reading data another transaction has written but not yet committed.\\\" data-book=\\\"Database Internals\\\"\u003eDirty read\u003c/button\u003e\"]},{\"id\":\"step-9\",\"key\":\"transactions/isolation-anomalies/step-9\",\"prompt\":\"\u003cp\u003eOrder the levels from weakest to strongest.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\"
