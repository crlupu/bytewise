elf.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"lesson\":{\"id\":\"local-dates-and-instants\",\"courseId\":\"mja-date-time\",\"topicId\":\"modern-java\",\"key\":\"mja-date-time/local-dates-and-instants\",\"title\":\"LocalDate, LocalDateTime and Instant\",\"summary\":\"java.time separates human dates and times from machine instants, and every object is immutable.\",\"duration\":5,\"tags\":[\"java\",\"modern java\",\"java time\",\"localdate\",\"instant\",\"immutability\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§12.1, LocalDate, LocalTime, LocalDateTime, Instant, Duration, and Period\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"mja-date-time/local-dates-and-instants/step-1\",\"mja-date-time/local-dates-and-instants/step-2\",\"mja-date-time/local-dates-and-instants/step-3\",\"mja-date-time/local-dates-and-instants/step-4\",\"mja-date-time/local-dates-and-instants/step-5\",\"mja-date-time/local-dates-and-instants/step-6\"],\"exercises\":[\"mja-date-time/local-dates-and-instants/step-2\",\"mja-date-time/local-dates-and-instants/step-4\",\"mja-date-time/local-dates-and-instants/step-5\",\"mja-date-time/local-dates-and-instants/step-6\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"mja-date-time/local-dates-and-instants/step-1\",\"title\":\"Pick the type for the meaning\",\"body\":\"\u003cp\u003e\u003ccode\u003eLocalDate\u003c/code\u003e is a date on a calendar, like a birthday.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eLocalDateTime\u003c/code\u003e adds a time, but no zone.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eInstant\u003c/code\u003e is a point on the timeline, in seconds since 1970 UTC.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"mja-date-time/local-dates-and-instants/step-2\",\"prompt\":\"\u003cp\u003eMatch each value with the type to store it in.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"A birthday\",\"The moment an order was placed\",\"A meeting at 10:00 in Paris\",\"Opening time of every store\"],\"right\":[\"\u003ccode\u003eLocalDate\u003c/code\u003e\",\"\u003ccode\u003eInstant\u003c/code\u003e\",\"\u003ccode\u003eZonedDateTime\u003c/code\u003e\",\"\u003ccode\u003eLocalTime\u003c/code\u003e\"],\"rightOrder\":[1,0,2,3]},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"mja-date-time/local-dates-and-instants/step-3\",\"title\":\"Immutable, so assign the result\",\"body\":\"\u003cp\u003e\u003ccode\u003eplusDays\u003c/code\u003e, \u003ccode\u003ewithMonth\u003c/code\u003e and friends return a new object.\u003c/p\u003e\\n\u003cp\u003eThe original is unchanged.\u003c/p\u003e\\n\u003cp\u003eForgetting to use the result is a common bug.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-4\",\"key\":\"mja-date-time/local-dates-and-instants/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eLocalDate\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e: \u003ccode\u003eplusDays(1)\u003c/code\u003e doesn\u0026#39;t change \u003ccode\u003ed\u003c/code\u003e but returns a new \u003ccode\u003eLocalDate\u003c/code\u003e for the next day.\u003c/p\u003e\\n\u003cp\u003eHere the result is ignored, so \u003ccode\u003ed\u003c/code\u003e still prints as 2026-10-07.\u003c/p\u003e\\n\u003cp\u003eThe fix is \u003ccode\u003ed = d.plusDays(1)\u003c/code\u003e. Immutability makes dates safe to share between threads and use as map keys, at the cost of this easy mistake.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e2026-10-08\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eplusDays\u003c/code\u003e returns a new date; \u003ccode\u003ed\u003c/code\u003e itself never changes.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e2026-10-07\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"mja-date-time/local-dates-and-instants/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eJanuary 31 plus one month would be February 31, which doesn\u0026#39;t exist.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ejava.time\u003c/code\u003e resolves this by clamping to the last valid day of the target month — February 29 in the leap year 2024.\u003c/p\u003e\\n\u003cp\u003eNote that this means \u003ccode\u003eplusMonths(1).minusMonths(1)\u003c/code\u003e doesn\u0026#39;t always return the starting date: January 31 → February 29 → January 29.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e2024-03-02\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ejava.time\u003c/code\u003e clamps to the last valid day rather than rolling over.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e2024-02-29\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws \u003ccode\u003eDateTimeException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eof(2024, 2, 31)\u003c/code\u003e would throw, but \u003ccode\u003eplusMonths\u003c/code\u003e adjusts to the end of the month.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-6\",\"key\":\"mja-date-time/local-dates-and-instants/step-6\",\"prompt\":\"\u003cp\u003eGet tomorrow\u0026#39;s date.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"LocalDate tomorrow = LocalDate.now().\"},{\"answers\":[\"plusDays\"],\"size\":8,\"choices\":[\"BinaryOperator\",\"lastDayOfMonth\",\"computeIfAbsent\",\"plusDays\"]},{\"text\":\"(1);\"}],\"code\":true,\"caseSensitive\":false}]},\"courseTitle\":\"The Date and Time API\",\"next\":{\"id\":\"durations-zones-and-adjusters\",\"courseId\":\"mja-date-time\",\"topicId\":\"modern-java\",\"key\":\"mja-date-time/durations-zones-and-adjusters\",\"title\":\"Durations, periods, adjusters and zones\",\"summary\":\"Duration measures time, Period measures calendar units, TemporalAdjusters find dates like \\\"last day of the month\\\", and ZonedDateTime handles daylight saving.\",\"duration\":6,\"tags\":[\"java\",\"modern java\",\"java time\",\"duration\",\"period\",\"time zones\",\"dst\"],\"sources\":[{\"book\":\"modern-java-in-action\",\"ref\":\"§12.2–12.3, Manipulating dates and Working with time zones\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"mja-date-time/durations-zones-and-adjusters/step-1\",\"mja-date-time/durations-zones-and-adjusters/step-2\",\"mja-date-time/durations-zones-and-adjusters/step-3\",\"mja-date-time/durations-zones-and-adjusters/step-4\",\"mja-date-time/durations-zones-and-adjusters/step-5\",\"mja-date-time/durations-zones-and-adjusters/step-6\",\"mja-date-time/durations-zones-and-adjusters/step-7\"],\"exercises\":[\"mja-date-time/durations-zones-and-adjusters/step-2\",\"mja-date-time/durations-zones-and-adjusters/step-4\",\"mja-date-time/durations-zones-and-adjusters/step-6\",\"mja-date-time/durations-zones-and-adjusters/step-7
