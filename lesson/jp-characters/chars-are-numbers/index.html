e-numbers/jpz-22\",\"jp-characters/chars-are-numbers/jpz-23\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jp-characters/chars-are-numbers/step-1\",\"title\":\"+ on chars adds\",\"body\":\"\u003cp\u003eA \u003ccode\u003echar\u003c/code\u003e is an unsigned 16-bit number.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e+\u003c/code\u003e between two chars adds their codes.\u003c/p\u003e\\n\u003cp\u003eOnly a \u003ccode\u003eString\u003c/code\u003e operand turns \u003ccode\u003e+\u003c/code\u003e into concatenation.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-2\",\"key\":\"jp-characters/chars-are-numbers/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eStart with an empty string to force concatenation: \u003ccode\u003e\u0026quot;\u0026quot; + \u0026#39;H\u0026#39; + \u0026#39;a\u0026#39;\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIn Java, \u003ccode\u003e+\u003c/code\u003e means string concatenation only if at least one operand is a \u003ccode\u003eString\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e\u0026#39;H\u0026#39;\u003c/code\u003e and \u003ccode\u003e\u0026#39;a\u0026#39;\u003c/code\u003e are \u003ccode\u003echar\u003c/code\u003es, which are numeric types, so they are promoted to \u003ccode\u003eint\u003c/code\u003e and added: 72 + 97 = 169.\u003c/p\u003e\\n\u003cp\u003eThe first line uses double quotes, so it concatenates. Prefix an empty string or use \u003ccode\u003eString.valueOf\u003c/code\u003e when you want characters joined.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"HaHa\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe second line has no \u003ccode\u003eString\u003c/code\u003e in it: \u0026#39;H\u0026#39; (72) + \u0026#39;a\u0026#39; (97) is 169.\u003c/p\u003e\\n\"},{\"html\":\"Ha169\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"169169\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first line uses double quotes — those are strings.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"jp-characters/chars-are-numbers/step-3\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"12, then 12\",\"correct\":false,\"feedback\":\"\u003cp\u003eIn the second line, \u003ccode\u003e1 + 2\u003c/code\u003e happens first, while both are still \u003ccode\u003eint\u003c/code\u003es.\u003c/p\u003e\\n\"},{\"html\":\"12, then 3\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"3, then 3\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e+\u003c/code\u003e is evaluated left to right. In the first line, \u003ccode\u003e\u0026quot;\u0026quot; + 1\u003c/code\u003e is already a string.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jp-characters/chars-are-numbers/step-4\",\"title\":\"char[] isn't a string\",\"body\":\"\u003cp\u003e\u003ccode\u003eprintln(char[])\u003c/code\u003e has its own overload, so it prints the characters.\u003c/p\u003e\\n\u003cp\u003eBut \u003ccode\u003e\u0026quot;…\u0026quot; + array\u003c/code\u003e calls the array\u0026#39;s \u003ccode\u003etoString\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThat gives something like \u003ccode\u003e[C@1b6d3586\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jp-characters/chars-are-numbers/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003echar[] numbers = {\u0026#39;1\u0026#39;, \u0026#39;2\u0026#39;, \u0026#39;3\u0026#39;};\u003c/code\u003e What does \u003ccode\u003eSystem.out.println(\u0026quot;easy as \u0026quot; + numbers);\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eString.valueOf(numbers)\u003c/code\u003e to turn a \u003ccode\u003echar[]\u003c/code\u003e into its text.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eeasy as \u003c/code\u003e followed by something like \u003ccode\u003e[C@1b6d3586\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eeasy as 123\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly \u003ccode\u003eprintln(char[])\u003c/code\u003e prints the characters. Concatenation uses \u003ccode\u003eObject.toString\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-6\",\"key\":\"jp-characters/chars-are-numbers/step-6\",\"title\":\"+ binds tighter than ==\",\"body\":\"\u003cp\u003e\u003ccode\u003e\u0026quot;a: \u0026quot; + x == y\u003c/code\u003e compares two strings.\u003c/p\u003e\\n\u003cp\u003eThe concatenation happens first, then \u003ccode\u003e==\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eParenthesize, and compare strings with \u003ccode\u003eequals\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-7\",\"key\":\"jp-characters/chars-are-numbers/step-7\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003e+\u003c/code\u003e has higher precedence than \u003ccode\u003e==\u003c/code\u003e, so the expression is \u003ccode\u003e(\u0026quot;Animals are equal: \u0026quot; + pig) == dog\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThat compares two different \u003ccode\u003eString\u003c/code\u003e objects by reference, which is false, and \u003ccode\u003eprintln\u003c/code\u003e prints just \u003ccode\u003efalse\u003c/code\u003e — the prefix never appears.\u003c/p\u003e\\n\u003cp\u003eEven with parentheses, \u003ccode\u003epig == dog\u003c/code\u003e would be false: \u003ccode\u003edog\u003c/code\u003e is built at run time, so it\u0026#39;s a different object from the interned \u003ccode\u003epig\u003c/code\u003e. Use \u003ccode\u003eequals\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Animals are equal: true\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e+\u003c/code\u003e runs before \u003ccode\u003e==\u003c/code\u003e, so the whole expression is a boolean: \u003ccode\u003e(\u0026quot;Animals are equal: \u0026quot; + pig) == dog\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Animals are equal: false\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe prefix is part of the comparison, so it never gets printed.\u003c/p\u003e\\n\"},{\"html\":\"false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-11\",\"key\":\"jp-characters/chars-are-numbers/jpz-11\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 11, The Last Laugh in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003eA+\\nA+\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eTwo \u003ccode\u003echar\u003c/code\u003es with \u003ccode\u003e+\u003c/code\u003e are added as numbers: 65 + 43.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e108\\n108\u003c/pre\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eStarting with \u003ccode\u003e\u0026quot;\u0026quot;\u003c/code\u003e makes the whole expression string concatenation.\u003c/p\u003e\\n\"},{\"html\":\"\u003cpre class=\\\"option__pre\\\"\u003e108\\nA+\u003c/pre\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-12\",\"key\":\"jp-characters/chars-are-numbers/jpz-12\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eString.valueOf(word)\u003c/code\u003e or \u003ccode\u003enew String(word)\u003c/code\u003e when concatenating.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 12, ABC in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"\u003ccode\u003e[C@…\u003c/code\u003e twice\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eprintln\u003c/code\u003e has a \u003ccode\u003echar[]\u003c/code\u003e overload that prints the contents.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eJava\u003c/code\u003e, then \u003ccode\u003eWord: [C@\u003c/code\u003e followed by a hash code\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eJava\u003c/code\u003e twice (with \u003ccode\u003eWord: \u003c/code\u003e on the second line)\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eprintln(char[])\u003c/code\u003e prints the characters, but string concatenation calls the array\u0026#39;s \u003ccode\u003etoString()\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003eHash code\u003c/button\u003e\"]},{\"id\":\"jpz-13\",\"key\":\"jp-characters/chars-are-numbers/jpz-13\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCompare strings with \u003ccode\u003eequals\u003c/code\u003e, and parenthesize mixed \u003ccode\u003e+\u003c/code\u003e/\u003ccode\u003e==\u003c/code\u003e expressions.\u003c/p\u003e\\n\u003cp\u003eOriginal program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 13, Animal Farm in \u003cem\u003eJava Puzzlers\u003c/em\u003e (Bloch \u0026amp; Gafter).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$18\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Same text: false\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e+\u003c/code\u003e binds tighter than \u003ccode\u003e==\u003c/code\u003e: the string \u003ccode\u003e\u0026quot;Same text: size: 4\u0026quot;\u003c/code\u003e is compared with \u003ccode\u003edog\u003c/code\u003e, and only \u003ccode\u003efalse\u003c/code\u003e is printed.\u003c/p\u003e\\n\"},{\"html\":\"false\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Same text: true\",\"correct\":false,\"feedback\":\"\u003cp\u003eEven with parentheses, \u003ccode\u003e==\u003c/code\u003e compares references, and \u003ccode\u003edog\u003c/code\u003e is built at run time.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"jpz-18\",\"key\":\"jp-characters/chars-are-numbers/jpz-18\",\"prompt\":\"\u003cp\u003eOn Java 21, what does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAlways pass a charset when converting between bytes and strings (\u003ccode\u003enew String(data, StandardCharsets.ISO_8859_1)\u003c/code\u003e).\u003c/p\u003e\\n\u003cp\u003
