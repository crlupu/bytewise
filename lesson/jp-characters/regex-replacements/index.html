eplaceAll\u003c/code\u003e treats its first argument as a regular expression, and in regex \u003ccode\u003e.\u003c/code\u003e matches any character.\u003c/p\u003e\\n\u003cp\u003eSo every one of the 19 characters in \u0026quot;com.javapuzzlers.Me\u0026quot; is replaced by a slash.\u003c/p\u003e\\n\u003cp\u003eTo match a literal dot, escape it as \u003ccode\u003e\u0026quot;\\\\\\\\.\u0026quot;\u003c/code\u003e, quote it with \u003ccode\u003ePattern.quote(\u0026quot;.\u0026quot;)\u003c/code\u003e, or use \u003ccode\u003ereplace\u003c/code\u003e, which works on plain text.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003eSystem.out.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eprintln\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e(\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\\\"\u003e\\\"com.javapuzzlers.Me\\\"\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003ereplaceAll\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e(\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\\\"\u003e\\\".\\\"\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e, \u003c/span\u003e\u003cspan style=\\\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\\\"\u003e\\\"/\\\"\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e));\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ecom/javapuzzlers/Me\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what \u003ccode\u003ereplace(\u0026quot;.\u0026quot;, \u0026quot;/\u0026quot;)\u003c/code\u003e would do — it replaces plain text.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e///////////////////\u003c/code\u003e — one slash per character\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws \u003ccode\u003ePatternSyntaxException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e.\u003c/code\u003e is a valid regex; it just means \u0026quot;any character\u0026quot;.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-3\",\"key\":\"jp-characters/regex-replacements/step-3\",\"prompt\":\"\u003cp\u003eWhich calls turn \u003ccode\u003ecom.javapuzzlers.Me\u003c/code\u003e into \u003ccode\u003ecom/javapuzzlers/Me\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003es.replace(\u0026quot;.\u0026quot;, \u0026quot;/\u0026quot;)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003es.replaceAll(\u0026quot;.\u0026quot;, \u0026quot;/\u0026quot;)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn unescaped dot matches every character.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003es.replaceAll(\u0026quot;\\\\\\\\.\u0026quot;, \u0026quot;/\u0026quot;)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003es.replaceAll(Pattern.quote(\u0026quot;.\u0026quot;), \u0026quot;/\u0026quot;)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},{\"type\":\"explanation\",\"id\":\"step-4\",\"key\":\"jp-characters/regex-replacements/step-4\",\"title\":\"The replacement is special too\",\"body\":\"\u003cp\u003eIn the replacement, \u003ccode\u003e\\\\\u003c/code\u003e and \u003ccode\u003e$\u003c/code\u003e have meaning.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003e$1\u003c/code\u003e inserts a group; a lone \u003ccode\u003e\\\\\u003c/code\u003e escapes the next character.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eMatcher.quoteReplacement\u003c/code\u003e makes any string literal.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-5\",\"key\":\"jp-characters/regex-replacements/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003es.replaceAll(\u0026quot;\\\\\\\\.\u0026quot;, File.separator)\u003c/code\u003e works on Linux. What happens on Windows, where the separator is \u003ccode\u003e\\\\\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eMatcher.quoteReplacement(File.separator)\u003c/code\u003e, or simply \u003ccode\u003es.replace(\u0026#39;.\u0026#39;, File.separatorChar)\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIn a replacement string, a backslash escapes the next character and \u003ccode\u003e$\u003c/code\u003e refers to a captured group.\u003c/p\u003e\\n\u003cp\u003eOn Windows, \u003ccode\u003eFile.separator\u003c/code\u003e is a single backslash with nothing after it to escape, so \u003ccode\u003ereplaceAll\u003c/code\u003e throws \u003ccode\u003eIllegalArgumentException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eMatcher.quoteReplacement(File.separator)\u003c/code\u003e escapes it properly; \u003ccode\u003es.replace(\u0026#39;.\u0026#39;, File.separatorChar)\u003c/code\u003e avoids regex entirely.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It works the same\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe replacement string is not plain text.\u003c/p\u003e\\n\"},{\"html\":\"It throws, because a lone backslash in a replacement escapes nothing\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},{\"id\":\"step-6\",\"key\":\"jp-characters/regex-replacements/step-6\",\"prompt\":\"\u003cp\u003eMatch each method with how it reads its first argument.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003ereplace\u003c/code\u003e\",\"\u003ccode\u003ereplaceAll\u003c/code\u003e\",\"\u003ccode\u003esplit\u003c/code\u003e\"],\"right\":[\"Plain text\",\"A regular expression\",\"A regular expression, too\"],\"rightOrder\":[0,2,1]}]},\"courseTitle\":\"Puzzlers with character\",\"next\":null,\"books\":{\"effective-java\":{\"id\":\"effective-java\",\"title\":\"Effective Java\",\"authors\":\"Joshua Bloch\",\"edition\":\"3rd ed.\",\"year\":2018},\"jcip\":{\"id\":\"jcip\",\"title\":\"Java Concurrency in Practice\",\"authors\":\"Brian Goetz, Tim Peierls, Joshua Bloch, Joseph Bowbeer, David Holmes \u0026 Doug Lea\",\"year\":2006},\"sql-performance-explained\":{\"id\":\"sql-performance-explained\",\"title\":\"SQL Performance Explained\",\"authors\":\"Markus Winand\",\"year\":2012,\"url\":\"https://use-the-index-luke.com/\"},\"hpjp\":{\"id\":\"hpjp\",\"title\":\"High-Performance Java Persistence\",\"authors\":\"Vlad Mihalcea\",\"year\":2016},\"database-internals\":{\"id\":\"database-internals\",\"title\":\"Database Internals\",\"authors\":\"Alex Petrov\",\"year\":2019},\"ostep\":{\"id\":\"ostep\",\"title\":\"Operating Systems: Three Easy Pieces\",\"authors\":\"Remzi H. Arpaci-Dusseau \u0026 Andrea C. Arpaci-Dusseau\",\"year\":2018,\"url\":\"https://pages.cs.wisc.edu/~remzi/OSTEP/\"},\"kurose-ross\":{\"id\":\"kurose-ross\",\"title\":\"Computer Networking: A Top-Down Approach\",\"authors\":\"James F. Kurose \u0026 Keith W. Ross\",\"edition\":\"8th ed.\",\"year\":2021},
