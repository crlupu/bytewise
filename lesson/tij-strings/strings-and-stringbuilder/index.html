tring and leave the original alone.\u003c/p\u003e\\n\u003cp\u003ePassing a string to a method can\u0026#39;t change the caller\u0026#39;s string.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"type\":\"explanation\",\"id\":\"step-2\",\"key\":\"tij-strings/strings-and-stringbuilder/step-2\",\"title\":\"StringBuilder\",\"body\":\"\u003cp\u003eThe compiler turns \u003ccode\u003ea + b + c\u003c/code\u003e into one \u003ccode\u003eStringBuilder\u003c/code\u003e — but \u003ccode\u003e+=\u003c/code\u003e in a loop creates a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Builder pattern\\\" data-def=\\\"A helper object that collects parameters through named, chainable methods and then calls \u0026lt;code\u0026gt;build()\u0026lt;/code\u0026gt; to create the real object. Readable like setters, safe like constructors.\\\" data-book=\\\"Effective Java\\\"\u003ebuilder\u003c/button\u003e each pass.\u003c/p\u003e\\n\u003cp\u003eIn a loop, append to one \u003ccode\u003eStringBuilder\u003c/code\u003e yourself.\u003c/p\u003e\\n\u003cp\u003eInside \u003ccode\u003etoString()\u003c/code\u003e, \u003ccode\u003e\u0026quot;…\u0026quot; + this\u003c/code\u003e calls \u003ccode\u003etoString()\u003c/code\u003e again: infinite recursion.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"tij-strings-immutable\",\"key\":\"tij-strings/strings-and-stringbuilder/tij-strings-immutable\",\"prompt\":\"\u003cp\u003eWhy does the last \u003ccode\u003eprint(q)\u003c/code\u003e still print \u003ccode\u003ehowdy\u003c/code\u003e, after \u003ccode\u003eupcase(q)\u003c/code\u003e? (\u003ccode\u003eprint\u003c/code\u003e is \u003ccode\u003eprintln\u003c/code\u003e.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https:// e\\n\"}],\"multiple\":false},{\"id\":\"tij-strings-concatenation\",\"key\":\"tij-strings/strings-and-stringbuilder/tij-strings-concatenation\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe compiler builds this with a single \u003ccode\u003eStringBuilder\u003c/code\u003e (or, since Java 9, \u003ccode\u003einvokedynamic\u003c/code\u003e string concatenation).\u003c/p\u003e\\n\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003eCC BY-NC-ND 4.0\u003c/a\u003e).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$14\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"abc + mango + def + 47\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003e+\u003c/code\u003e concatenates the values.\u003c/p\u003e\\n\"},{\"html\":\"abcmangodef47\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"abcmangodef 47\",\"correct\":false,\"feedback\":\"\u003cp\u003eNo space is added.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"tij-strings-whitherstringbuilder\",\"key\":\"tij-strings/strings-and-stringbuilder/tij-strings-whitherstringbuilder\",\"prompt\":\"\u003cp\u003eBoth methods join the fields. Why is \u003ccode\u003eexplicit\u003c/code\u003e better for many fields?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCode © Bruce Eckel, \u003cem\u003eThinking in Java\u003c/em\u003e, 4th ed. (\u003ca href=\\\"https://github.com/BruceEckel/tij4-code\\\" target=\\\"_blank\\\" rel=\\\"noreferrer\\\"\u003etij4-code\u003c/a\u003e, \u003ca href=\\\"https://creativecommons.org/licenses/by-nc-nd/4.0/\\\" target=\\\"_blan
