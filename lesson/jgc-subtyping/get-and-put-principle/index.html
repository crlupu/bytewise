ey\":\"jgc-subtyping/get-and-put-principle/step-5\",\"title\":\"Both? No wildcard\",\"body\":\"\u003cp\u003eIf a method both gets and puts, use the exact type, like \u003ccode\u003eList\u0026lt;T\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWildcards are for parameters, not return types.\u003c/p\u003e\\n\u003cp\u003eCallers shouldn\u0026#39;t have to deal with wildcards in what they get back.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\"},{\"id\":\"step-6\",\"key\":\"jgc-subtyping/get-and-put-principle/step-6\",\"prompt\":\"\u003cp\u003eMatch each method with its best parameter type.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003edouble sum(… numbers)\u003c/code\u003e — reads only\",\"\u003ccode\u003evoid fill(… target)\u003c/code\u003e — adds \u003ccode\u003eInteger\u003c/code\u003es only\",\"\u003ccode\u003evoid sortInPlace(… list)\u003c/code\u003e — reads and writes\"],\"right\":[\"\u003ccode\u003eCollection\u0026lt;? extends Number\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eCollection\u0026lt;? super Integer\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;T\u0026gt;\u003c/code\u003e\"],\"rightOrder\":[1,0,2]}]},\"courseTitle\":\"Subtyping, wildcards and bounds\",\"next\":{\"id\":\"comparison-and-bounds\",\"courseId\":\"jgc-subtyping\",\"topicId\":\"generics-collections\",\"key\":\"jgc-subtyping/comparison-and-bounds\",\"title\":\"Comparable and bounded type variables\",\"summary\":\"`\u003cT extends Comparable\u003c? super T\u003e\u003e` says T can be compared with itself — even when the comparison is inherited.\",\"duration\":6,\"tags\":[\"java\",\"generics\",\"comparable\",\"bounds\",\"comparator\"],\"sources\":[{\"book\":\"java-generics-collections\",\"ref\":\"Chapter 3, Comparison and bounds\"}],\"requires\":[],\"steps\":7,\"stepKeys\":[\"jgc-subtyping/comparison-and-bounds/step-1\",\"jgc-su
