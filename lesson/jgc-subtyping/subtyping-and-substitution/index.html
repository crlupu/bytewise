itle\":\"A List of Integer isn't a List of Number\",\"summary\":\"Generic types are invariant, unlike arrays — and that's what keeps them type-safe.\",\"duration\":5,\"tags\":[\"java\",\"generics\",\"subtyping\",\"invariance\",\"arrays\",\"covariance\"],\"sources\":[{\"book\":\"java-generics-collections\",\"ref\":\"§2.1–2.5, Subtyping and wildcards\"}],\"requires\":[],\"steps\":5,\"stepKeys\":[\"jgc-subtyping/subtyping-and-substitution/step-1\",\"jgc-subtyping/subtyping-and-substitution/step-2\",\"jgc-subtyping/subtyping-and-substitution/step-3\",\"jgc-subtyping/subtyping-and-substitution/step-4\",\"jgc-subtyping/subtyping-and-substitution/step-5\"],\"exercises\":[\"jgc-subtyping/subtyping-and-substitution/step-2\",\"jgc-subtyping/subtyping-and-substitution/step-4\",\"jgc-subtyping/subtyping-and-substitution/step-5\"],\"body\":[{\"type\":\"explanation\",\"id\":\"step-1\",\"key\":\"jgc-subtyping/subtyping-and-substitution/step-1\",\"title\":\"The Substitution Principle\",\"body\":\"\u003cp\u003eA value of a subtype can go wherever its supertype is expected.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eInteger\u003c/code\u003e is a subtype of \u003ccode\u003eNumber\u003c/code\u003e, so an \u003ccode\u003eInteger\u003c/code\u003e can be added to a \u003ccode\u003eList\u0026lt;Number\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eBut that doesn\u0026#39;t make \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e a subtype of \u003ccode\u003eList\u0026lt;Number\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$13\"},{\"id\":\"step-2\",\"key\":\"jgc-subtyping/subtyping-and-substitution/step-2\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t \u003ccode\u003eList\u0026lt;Number\u0026gt; nums = ints;\u003c/code\u003e compile, where \u003ccode\u003eints\u003c/code\u003e is a \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGeneric types are invariant: \u003ccode\u003eList\u0026lt;A\u0026gt;\u003c/code\u003e and \u003ccode\u003eList\u0026lt;B\u0026gt;\u003c/code\u003e are unrelated unless \u003ccode\u003eA\u003c/code\u003e and \u003ccode\u003eB\u003c/code\u003e are the same.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIf \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e were a subtype of \u003ccode\u003eList\u0026lt;Number\u0026gt;\u003c/code\u003e, you could assign \u003ccode\u003eints\u003c/code\u003e to \u003ccode\u003enums\u003c/code\u003e and then call \u003ccode\u003enums.add(3.14)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe list behind both variables would now contain a \u003ccode\u003eDouble\u003c/code\u003e, and code reading from \u003ccode\u003eints\u003c/code\u003e would get a \u003ccode\u003eClassCastException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eTo prevent that, generic types are invariant. Wildcards like \u003ccode\u003eList\u0026lt;? extends Number\u0026gt;\u003c/code\u003e give you the read-only flexibility safely.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Through \u003ccode\u003enums\u003c/code\u003e you could add a \u003ccode\u003eDouble\u003c/code\u003e to a list that must hold only \u003ccode\u003eInteger\u003c/code\u003es\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eInteger\u003c/code\u003e isn\u0026#39;t a subtype of \u003ccode\u003eNumber\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt is. The problem is what you could then put into the list.\u003c/p\u003e\\n\"}],\"multiple\":false},{\"type\":\"explanation\",\"id\":\"step-3\",\"key\":\"jgc-subtyping/subtyping-and-substitution/step-3\",\"title\":\"Arrays are covariant\",\"body\":\"\u003cp\u003e\u003ccode\u003eInteger[]\u003c/code\u003e is a subtype of \u003ccode\u003eNumber[]\u003c/code\u003e and \u003ccode\u003eObject[]\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eSo the bad store compiles.\u003c/p\u003e\\n\u003cp\u003eThe array checks each store at run time and throws \u003ccode\u003eArrayStoreException\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$14\"},{\"id\":\"step-4\",\"key\":\"jgc-subtyping/subtyping-and-substitution/step-4\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGenerics catch this at compile time instead. That\u0026#39;s one reason to prefer lists to arrays.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e, so the compiler allows it.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eArrayStoreException\u003c/code\u003e at run time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The array now holds a string\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn \u003ccode\u003eInteger[]\u003c/code\u003e knows its element type and refuses the string.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},{\"id\":\"step-5\",\"key\":\"jgc-subtyping/subtyping-and-substitution/step-5\",\"prompt\":\"\u003cp\u003eMatch each type relationship with whether it holds.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eInteger[]\u003c/code\u003e is a subtype of \u003ccode\u003eNumber[]\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e is a subtype of \u003ccode\u003eList\u0026lt;Number\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e is a subtype of \u003ccode\u003eList\u0026lt;? extends Number\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eArrayList\u0026lt;Integer\u0026gt;\u003c/code\u003e is a subtype of \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e\"],\"right\":[\"True — arrays are covariant\",\"False — generics are invariant\",\"True — that\u0026#39;s what wildcards are for\",\"True — the class hierarchy still applies\"],\"rightOrder\":[3,0,1,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003eCovariant\u003c/button\u003e\"]}]},\"courseTitle\":\"Subtyping, wildcards and bounds\",\"next\":{\"id\":\"get-and-put-principle\",\"courseId\":\"jgc-subtyping\",\"topicId\":\"generics-collections\",\"key\":\"jgc-subtyping/get-and-put-principle\",\"title\":\"The Get and Put Principle\",\"summary\":\"Use `? extends T` when you only get values out, `? super T` when you only put values in, and no wildcard when you do both.\",\"duration\":6,\"tags\":[\"java\",\"generics\",\"wildcards\",\"extends\",\"super\",\"pecs\"],\"sources\":[{\"book\":\"java-generics-collections\",\"ref\":\"§2.4, The Get and Put Principle\"},{\"book\":\"effective-java\",\"ref\":\"Item 31\"}],\"requires\":[],\"steps\":6,\"stepKeys\":[\"jgc-subtyping/get-and-put-principl
