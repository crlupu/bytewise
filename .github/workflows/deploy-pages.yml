name: Deploy to GitHub Pages

# Builds the static site and publishes it to the gh-pages branch, which
# GitHub Pages serves (Settings → Pages → Deploy from a branch → gh-pages).
# The branch holds only the built app — index.html at its root — so main
# keeps just the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      # The build reads and validates every lesson file; a bad one fails here
      # with the file and field named.
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      # Without this file, Pages runs Jekyll, which drops the _next folder.
      - run: touch out/.nojekyll
      - name: Publish to gh-pages
        working-directory: out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
