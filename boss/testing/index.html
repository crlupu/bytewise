ed\"},{\"html\":\"The software has no bugs\",\"correct\":false,\"feedback\":\"\u003cp\u003eTests only check what they check.\u003c/p\u003e\\n\"}],\"multiple\":false},\"est-systematic/partitions/step-3\":{\"id\":\"step-3\",\"key\":\"est-systematic/partitions/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003esubstringsBetween(str, open, close)\u003c/code\u003e returns the substrings between \u003ccode\u003eopen\u003c/code\u003e and \u003ccode\u003eclose\u003c/code\u003e tags. Which are distinct \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartitions\u003c/button\u003e of \u003ccode\u003estr\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e\u0026quot;abc\u0026quot;\u003c/code\u003e and \u003ccode\u003e\u0026quot;xyz\u0026quot;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth are strings without tags — the same partition, so one test covers both.\u003c/p\u003e\\n\"},{\"html\":\"A string with no tags in it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Empty string\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Null\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"est-systematic/partitions/step-5\":{\"id\":\"step-5\",\"key\":\"est-systematic/partitions/step-5\",\"prompt\":\"\u003cp\u003eA method takes \u003ccode\u003eage\u003c/code\u003e and \u003ccode\u003ecountry\u003c/code\u003e. You have 4 \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartitions\u003c/button\u003e for each. How should you combine them?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eTesting every combination of four partitions for each input means 16 tests, and it grows fast with more inputs.\u003c/p\u003e\\n\u003cp\u003eExceptional values like null or negative ages usually make the method fail the same way regardless of the other input, so one test each is enough.\u003c/p\u003e\\n\u003cp\u003eThen combine only the valid partitions that the rules actually connect — say, age groups with countries that have different age limits.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"All 16 combinations, always\",\"correct\":false,\"feedback\":\"\u003cp\u003eFor many inputs that grows too fast; exceptional values don\u0026#39;t need combining.\u003c/p\u003e\\n\"},{\"html\":\"Test null and invalid values on their own, then combine the valid partitions that the rules connect\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"est-systematic/partitions/step-6\":{\"id\":\"step-6\",\"key\":\"est-systematic/partitions/step-6\",\"prompt\":\"\u003cp\u003eMatch each input with sensible \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Partition\\\" data-def=\\\"A set of inputs the program should treat the same way. Testing one value per partition covers the class.\\\" data-book=\\\"Effective Software Testing\\\"\u003epartitions\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"A list\",\"A number of items to buy\",\"A file path\"],\"right\":[\"Null, empty, one element, many elements\",\"Negative, zero, positive\",\"Missing, empty file, readable file, unreadable file\"],\"rightOrder\":[1,2,0]},\"est-systematic/boundaries/step-3\":{\"id\":\"step-3\",\"key\":\"est-systematic/boundaries/step-3\",\"prompt\":\"\u003cp\u003eMatch each condition with its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"On point\\\" data-def=\\\"For a boundary, the on point is the value on it and the off point the nearest value on the other side — both deserve a test.\\\" data-book=\\\"Effective Software Testing\\\"\u003eon point\u003c/button\u003e and off point (integers).\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003ex \u0026gt;= 18\u003c/code\u003e\",\"\u003ccode\u003ex \u0026gt; 100\u003c/code\u003e\",\"\u003ccode\u003ex \u0026lt;= 0\u003c/code\u003e\"],\"right\":[\"18 and 17\",\"100 and 101\",\"0 and 1\"],\"rightOrder\":[1,0,2]},\"est-systematic/boundaries/step-4\":{\"id\":\"step-4\",\"key\":\"est-systematic/boundaries/step-4\",\"prompt\":\"\u003cp\u003eA shop gives free shipping for orders of 50 or more. The code says \u003ccode\u003etotal \u0026gt; 50\u003c/code\u003e. Which test catches the bug?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe requirement says 50 or more, so the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Boundary\\\" data-def=\\\"Where one partition meets the next, like 17 and 18 for \u0026amp;quot;adult if 18 or older\u0026amp;quot;. Off-by-one bugs live there.\\\" data-book=\\\"Effective Software Testing\\\"\u003eboundary\u003c/button\u003e is between 49 and 50.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003etotal \u0026gt; 50\u003c/code\u003e and \u003ccode\u003etotal \u0026gt;= 50\u003c/code\u003e agree for every other value: both give free shipping for 100 and both charge for 10.\u003c/p\u003e\\n\u003cp\u003
