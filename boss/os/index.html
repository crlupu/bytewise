akes a system feel interactive.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eresponse time\u003c/button\u003e, changes the picture again.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"That jobs never arrive at the same time\",\"correct\":false,\"feedback\":\"\u003cp\u003eSimultaneous arrivals are fine — ties are broken somehow.\u003c/p\u003e\\n\"},{\"html\":\"That the scheduler knows how long each job will run\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Scheduler\\\" data-def=\\\"The part of the OS that decides which ready process runs next, and for how long.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eScheduler\u003c/button\u003e\"]},\"cpu-scheduling/round-robin/step-2\":{\"id\":\"step-2\",\"key\":\"cpu-scheduling/round-robin/step-2\",\"prompt\":\"\u003cp\u003eThree jobs of 5 ticks arrive together. Compare \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SJF\\\" data-def=\\\"Run the shortest job first. Minimizes average turnaround if all jobs arrive at once.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eSJF\u003c/button\u003e with \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Round robin\\\" data-def=\\\"Each ready job runs for one time slice, then goes to the back of the queue. Good response time, poor turnaround.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eround robin\u003c/button\u003e\u003c/strong\u003e using a slice of 1, and get the average\\n\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Response time\\\" data-def=\\\"Time from when a job arrives until it first gets to run. What makes a system feel interactive.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eresponse time\u003c/button\u003e to \u003cstrong\u003e1 or less\u003c/strong\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRR: response 1, turnaround 14. SJF: response 5, turnaround 10. Spreading the CPU evenly makes every job wait\\nlonger to \u003cem\u003efinish\u003c/em\u003e — the trade-off at the heart of scheduling.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"scheduler\",\"config\":{\"jobs\":[{\"name\":\"A\",\"arrival\":0,\"burst\":5},{\"name\":\"B\",\"arrival\":0,\"burst\":5},{\"name\":\"C\",\"arrival\":0,\"burst\":5}],\"algorithms\":[\"SJF\",\"RR\"],\"quantum\":1},\"goal\":{\"algorithm\":\"RR\",\"avgResponseAtMost\":1},\"question\":{\"prompt\":\"\u003cp\u003eHow does RR\u0026#39;s average \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Turnaround time\\\" data-def=\\\"Time from when a job arrives until it completes.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eturnaround\u003c/button\u003e compare with SJF\u0026#39;s?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Worse — 14 against 10\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The same\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Better — 10 against 14\",\"correct\":false,\"feedback\":\"\u003cp\u003eCheck the averages row for each policy.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"cpu-scheduling/round-robin/step-3\":{\"id\":\"step-3\",\"key\":\"cpu-scheduling/round-robin/step-3\",\"prompt\":\"\u003cp\u003eThree jobs of 5 ticks arrive together. Try slices of 1, 2 and 5 under \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Round robin\\\" data-def=\\\"Each ready job runs for one time slice, then goes to the back of the queue. Good response time, po term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Time slice\\\" data-def=\\\"How long a job may run before the scheduler switches to another.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eTime slice\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"STCF\\\" data-def=\\\"When a new job arrives, run whichever job has the least time left, preempting if needed.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eSTCF\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Response time\\\" data-def=\\\"Time from when a job arrives until it first gets to run. What makes a system feel interactive.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eResponse time\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Round robin\\\" data-def=\\\"Each ready job runs for one time slice, then goes to the back of the queue. Good response time, poor turnaround.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eRound robin\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Turnaround time\\\" data-def=\\\"Time from when a job arrives until it completes.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eTurnaround time\u003c/button\u003e\"]},\"cpu-scheduling/round-robin/step-7\":{\"id\":\"step-7\",\"key\":\"cpu-scheduling/round-robin/step-7\",\"prompt\":\"\u003cp\u003eNeither \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SJF\\\" data-def=\\\"Run the shortest job first. Minimizes average turnaround if all jobs arrive at once.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eSJF\u003c/button\u003e/\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"STCF\\\" data-def=\\\"When a new job arrives, run whichever job has the least time left, preempting if needed.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eSTCF\u003c/button\u003e nor RR is best on both metrics. What does a real OS need, to get the best of both?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s exactly what the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"MLFQ\\\" data-def=\\\"Several priority queues; jobs that use their whole time slice drop to a lower priority, so interactive jobs stay high. Periodic boosts prevent starvation.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003emulti-level feedback queue\u003c/button\u003e does — next lesson.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A way to \u003cem\u003elearn\u003c/em\u003e which jobs are short or interactive from how they behave\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"A faster CPU\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth metrics scale with speed, but the trade-off between them remains.\u003c/p\u003e\\n\"}],\"multiple\":false},\"cpu-scheduling/mlfq/step-2\":{\"id\":\"step-2\",\"key\":\"cpu-scheduling/mlfq/step-2\",\"prompt\":\"\u003cp\u003eFollow a long, CPU-hungry job through \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"MLFQ\\\" data-def=\\\"Several priority queues; jobs that use their whole time slice drop to a lower priority, so interactive jobs stay high. Periodic boosts prevent starvation.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eMLFQ\u003c/button\u003e. Put its life in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Scheduler\\\" data-def=\\\"The part of the OS that decides which ready process runs next, and for how long.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003escheduler\u003c/button\u003e assumes every job might be short; jobs that prove otherwise drift down.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"It enters at the highest priority, like every new job\",\"It uses up its time allotment at that level\",\"It is moved down one queue\",\"It keeps sinking until it runs at the lowest priority\"],\"start\":[2,1,0,3]},\"cpu-scheduling/mlfq/step-4\":{\"id\":\"step-4\",\"key\":\"cpu-scheduling/mlfq/step-4\",\"prompt\":\"\u003cp\u003eAn editor waits for keystrokes, running for a millisecond each time. Where does it stay?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eInteractive jobs stay high and get the CPU quickly when they need it — good \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Response time\\\" data-def=\\\"Time from when a job arrives until it first gets to run. What makes a system feel interactive.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eresponse time\u003c/button\u003e without being told they\u0026#39;re interactive.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"At the bottom — it has been in the system the longest\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"MLFQ\\\" data-def=\\\"Several priority queues; jobs that use their whole time slice drop to a lower priority, so interactive jobs stay high. Periodic boosts prevent starvation.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eMLFQ\u003c/button\u003e judges by CPU use, not age.\u003c/p\u003e\\n\"},{\"html\":\"Near the top — it never uses up its allotment, so it isn\u0026#39;t demoted\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"cpu-scheduling/mlfq/step-6\":{\"id\":\"step-6\",\"key\":\"cpu-scheduling/mlfq/step-6\",\"prompt\":\"\u003cp\u003eMatch each rule to the problem it solves.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"New jobs start at the top\",\"Demote after using the allotment\",\"Periodic priority boost\",\"Count total CPU use at a level\"],\"right\":[\"Short jobs finish quickly without being identified in advance\",\"Long CPU-bound jobs stop hogging high priority\",\"Starvation of jobs at the bottom\",\"Gaming the scheduler with well-timed I/O\"],\"rightOrder\":[3,1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Priority boost\\\" data-def=\\\"Periodically moving all jobs back to the top queue in MLFQ, so long-running jobs aren\u0026amp;#39;t starved.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003ePriority boost\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Scheduler\\\" data-def=\\\"The part of the OS that decides which ready process runs next, and for how long.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eScheduler\u003c/button\u003e\"]},\"cpu-scheduling/mlfq/step-7\":{\"id\":\"step-7\",\"key\":\"cpu-scheduling/mlfq/step-7\",\"prompt\":\"\u003cp\u003eA job does compute-heavy work for a minute, then becomes interactive. Without the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" ar ,\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s FIFO\u0026#39;s count. Switch to the LRU tab.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"virtual-memory/page-replacement/step-5\":{\"id\":\"step-5\",\"key\":\"virtual-memory/page-replacement/step-5\",\"prompt\":\"\u003cp\u003eWhy don\u0026#39;t real operating systems use OPT?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOPT is a yardstick — run it afterwards on a recorded trace to see how close a real policy got.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eOPT evicts the page that won\u0026#39;t be used for the longest time, which requires knowing the program\u0026#39;s future accesses.\u003c/p\u003e\\n\u003cp\u003eAn OS only knows what has happened so far.\u003c/p\u003e\\n\u003cp\u003eSo OPT is used afterwards as a benchmark on recorded traces, while real systems approximate it with LRU-like policies, assuming the recent past predicts the near future.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It needs to know which pages the program will access in the future\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s too slow to compute\",\"correct\":false,\"feedback\":\"\u003cp\u003eSpeed isn\u0026#39;t the obstacle. The information it needs simply doesn\u0026#39;t exist yet.\u003c/p\u003e\\n\"},{\"html\":\"It suffers from Bélády\u0026#39;s anomaly\",\"correct\":false,\"feedback\":\"\u003cp\u003eOPT never does. You\u0026#39;ll meet the anomaly in a moment.\u003c/p\u003e\\n\"}],\"multiple\":false},\"virtual-memory/page-replacement/step-6\":{\"id\":\"step-6\",\"key\":\"virtual-memory/page-replacement/step-6\",\"prompt\":\"\u003cp\u003eMore memory should mean fewer faults. Run \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e on this string with \u003cstrong\u003e3 \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Frame\\\" data-def=\\\"A fixed-size slot of physical memory that holds one page.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eframes\u003c/button\u003e\u003c/strong\u003e, then with \u003cstrong\u003e4 frames\u003c/strong\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e9 faults with 3 frames, 10 with 4. That\u0026#39;s \u003cstrong\u003eBélády\u0026#39;s anomaly\u003c/strong\u003e: under FIFO, adding memory can make things worse.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003ePlay to the end with each setting and compare the fault counts in the bar.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"paging\",\"config\":{\"reference\":[1,2,3,4,1,2,5,1,2,3,4,5],\"frames\":3,\"frameChoices\":[3,4],\"algorithms\":[\"FIFO\"]},\"goal\":{\"frames\":4},\"question\":{\"prompt\":\"\u003cp\u003eWhat happened?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"4 frames had fewer faults, as expected\",\"correct\":false,\"feedback\":\"\u003cp\u003eCount again — 3 frames gives 9 faults, 4 frames gives 10.\u003c/p\u003e\\n\"},{\"html\":\"4 frames had \u003cstrong\u003emore\u003c/strong\u003e faults than 3\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They had the same number\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"virtual-memory/page-replacement/step-8\":{\"id\":\"step-8\",\"key\":\"virtual-memory/page-replacement/step-8\",\"prompt\":\"\u003cp\u003eMatch each policy to the page it evicts.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"FIFO\",\"LRU\",\"OPT\",\"Clock\"],\"right\":[\"The page that was loaded earliest\",\"The page that hasn\u0026#39;t been used for the longest\",\"The page that won\u0026#39;t be needed for the longest\",\"The first page the sweeping hand finds with its referenced bit clear\"],\"rightOrder\":[1,3,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIFO\\\" data-def=\\\"Run jobs in the order they arrive, each to completion.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eFIFO\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"LRU\\\" data-def=\\\"Evict the page that hasn\u0026amp;#39;t been used for the longest time. A good approximation of the optimal policy.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eLRU\u003c/button\u003e\"]},\"virtual-memory/page-replacement/step-9\":{\"id\":\"step-9\",\"key\":\"virtual-memory/page-replacement/step-9\",\"prompt\":\"\u003cp\u003eWhich policies can never suffer from Bélády\u0026#39;s anomaly?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eBoth are stack algorithms, so giving them more \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Frame\\\" data-def=\\\"A fixed-size slot of physical memory that holds one page.\\\" data-book=\\\"Operating Systems: Three Easy Pieces\\\"\u003eframes\u003c/button\u003e never adds faults.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eLRU and OPT are stack algorithms: the set of pages they\u0026#39;d keep with N frames is always a subset of what they\u0026#39;d keep with N + 1.\u003c/p\u003e\\n\u003cp\u003eAny access that hits with N frames therefore also hits with more frames, so more memory can never add faults.\u003c/p\u003e\\n\u003cp\u003eFIFO isn\u0026#39;t a stack algorithm — what it keeps depends on load order, not use — so adding frames can change which page is evicted for the worse.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\
