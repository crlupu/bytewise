ite \u003cem\u003eand\u003c/em\u003e the read, or by declaring the field \u003ccode\u003evolatile\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWithout synchronization, nothing guarantees that the background thread ever sees the main thread\u0026#39;s write to \u003ccode\u003estopRequested\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e may even hoist the read out of the loop, turning \u003ccode\u003ewhile (!stopRequested)\u003c/code\u003e into \u003ccode\u003eif (!stopRequested) while (true)\u003c/code\u003e — a legal optimization, called hoisting, because no other thread is supposed to change a non-volatile field.\u003c/p\u003e\\n\u003cp\u003eOn many JVMs the program runs forever.\u003c/p\u003e\\n\u003cp\u003eDeclaring the field \u003ccode\u003evolatile\u003c/code\u003e, or reading and writing it inside \u003ccode\u003esynchronized\u003c/code\u003e methods, guarantees the write becomes visible.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It may never terminate\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"About one second\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout synchronization, there\u0026#39;s no guarantee the background thread ever sees the write — and the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e may hoist the read out of the loop.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-concurrency/synchronize-shared-data/step-4\":{\"id\":\"step-4\",\"key\":\"ej-concurrency/synchronize-shared-data/step-4\",\"prompt\":\"\u003cp\u003eA background thread loops until a \u003ccode\u003eboolean stopRequested\u003c/code\u003e field is set. The fix synchronizes the method that writes \u003ccode\u003estopRequested\u003c/code\u003e, but not the one that reads it. Is that enough?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eVisibility needs both sides to use the same lock (or the field to be volatile).\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes — the write is what matters\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"No — synchronization has no effect unless both read and write operations are synchronized\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/synchronize-shared-data/step-5\":{\"id\":\"step-5\",\"key\":\"ej-concurrency/synchronize-shared-data/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003evolatile int nextSerialNumber\u003c/code\u003e is handed out with \u003ccode\u003ereturn nextSerialNumber++;\u003c/code\u003e. Every read is fresh — but can two\\ncallers get the \u003cstrong\u003esame\u003c/strong\u003e serial number? Run both threads so the counter ends at \u003cstrong\u003e1\u003c/strong\u003e, meaning both got 0.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e guarantees visibility, not atomicity: \u003ccode\u003e++\u003c/code\u003e is still read-add-write. Use \u003ccode\u003eAtomicLong\u003c/code\u003e and\\n\u003ccode\u003egetAndIncrement()\u003c/code\u003e, or synchronize the method.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e makes every thread see the latest value, but \u003ccode\u003enextSerialNumber++\u003c/code\u003e is still three steps: read the value, add one, write it back.\u003c/p\u003e\\n\u003cp\u003eTwo threads can both read 5, both compute 6 and both write 6, so two callers get the same serial number and one increment is lost.\u003c/p\u003e\\n\u003cp\u003eVisibility doesn\u0026#39;t make a compound operation atomic. \u003ccode\u003eAtomicLong.getAndIncrement()\u003c/code\u003e performs the read-add-write as one indivisible step using compare-and-swap.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet both threads read before either writes.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":2,\"increments\":1,\"variable\":\"nextSerialNumber\"},\"goal\":{\"count\":1},\"question\":{\"prompt\":\"\u003cp\u003eWhat makes handing out serial numbers safe?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Reading the field twice before incrementing\",\"correct\":false,\"feedback\":\"\u003cp\u003eMore reads don\u0026#39;t stop another thread slipping in between read and write.\u003c/p\u003e\\n\"},{\"html\":\"Making the field \u003ccode\u003efinal\u003c/code\u003e as well\",\"correct\":false,\"feedback\":\"\u003cp\u003eA \u003ccode\u003efinal\u003c/code\u003e field can\u0026#39;t be incremented at all.\u003c/p\u003e\\n\"},{\"html\":\"An \u003ccode\u003eAtomicInteger\u003c/code\u003e and \u003ccode\u003egetAndIncrement()\u003c/code\u003e, or a \u003ccode\u003esynchronized\u003c/code\u003e method\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"ej-concurrency/synchronize-shared-data/step-6\":{\"id\":\"step-6\",\"key\":\"ej-concurrency/synchronize-shared-data/step-6\",\"prompt\":\"\u003cp\u003eMatch each tool to what it guarantees.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003esynchronized\u003c/code\u003e (on both reads and writes)\",\"\u003ccode\u003evolatile\u003c/code\u003e\",\"\u003ccode\u003eAtomicLong\u003c/code\u003e\"],\"right\":[\"Mutual exclusion and visibility\",\"Visibility only\",\"Visibility and atomic read-modify-write on one variable\"],\"rightOrder\":[2,0,1]},\"ej-concurrency/synchronize-shared-data/step-8\":{\"id\":\"step-8\",\"key\":\"ej-concurrency/synchronize-shared-data/step-8\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the best way to avoid all these problems?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eObjects modified by one thread and then safely published become \u003cem\u003eeffectively immutable\u003c/em\u003e for others.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Don\u0026#39;t share mutable data — confine it to one thread, or share only immutable data\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Use \u003ccode\u003evolatile\u003c/code\u003e everywhere\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat fixes visibility but not compound actions like \u003ccode\u003e++\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]},\"ej-concurrency/excessive-synchronization/step-2\":{\"id\":\"step-2\",\"key\":\"ej-concurrency/excessive-synchronization/step-2\",\"prompt\":\"\u003cp\u003eAn observer\u0026#39;s \u003ccode\u003eadded\u003c/code\u003e method calls \u003ccode\u003eset.removeObserver(this)\u003c/code\u003e, which also locks \u003ccode\u003eobservers\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eJava\u0026#39;s locks are reentrant, so the same thread is allowed back in — and breaks the iteration.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$14\",\"options\":[{\"html\":\"\u003ccode\u003eConcurrentModificationException\u003c/code\u003e — the list is modified while the loop iterates over it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — it unsubscribes cleanly\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Deadlock\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the next scenario. Here the same thread already holds the lock, so it re-enters and modifies the list.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-concurrency/excessive-synchronization/step-3\":{\"id\":\"step-3\",\"key\":\"ej-concurrency/excessive-synchronization/step-3\",\"prompt\":\"\u003cp\u003eThis time the observer\u0026#39;s \u003ccode\u003eadded\u003c/code\u003e hands \u003ccode\u003eremoveObserver(this)\u003c/code\u003e to a background thread through an executor, and waits for it to finish. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eBoth failures share one cause — calling an alien method inside a synchronized region.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe main thread holds the \u003ccode\u003eobservers\u003c/code\u003e lock while it calls each observer\u0026#39;s \u003ccode\u003eadded\u003c/code\u003e method.\u003c/p\u003e\\n\u003cp\u003eThe observer submits the unsubscribe call to another thread and waits for it to finish, but that thread needs the same lock to remove the observer — and the main thread won\u0026#39;t release it until \u003ccode\u003eadded\u003c/code\u003e returns.\u003c/p\u003e\\n\u003cp\u003eEach waits for the other forever.\u003c/p\u003e\\n\u003cp\u003eCalling alien code — methods you don\u0026#39;t control, like callbacks — while holding a lock invites exactly this; take a snapshot of the list, release the lock, then notify.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$15\",\"options\":[{\"html\":\"Deadlock — the background thread waits for the lock the main thread holds, and the main thread waits for the background thread\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eConcurrentModificationException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/excessive-synchronization/step-5\":{\"id\":\"step-5\",\"key\":\"ej-concurrency/excessive-synchronization/step-5\",\"prompt\":\"\u003cp\u003eMatch each fix to how it works.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Snapshot the list, then notify outside the lock\",\"\u003ccode\u003eCopyOnWriteArrayList\u003c/code\u003e\",\"Do as little as possible inside synchronized regions\"],\"right\":[\"\u003ccode\u003esynchronized (observers) { snapshot = new ArrayList\u0026lt;\u0026gt;(observers); }\u003c/code\u003e then loop over the copy\",\"Every write copies the array, so iteration needs no lock at all\",\"Hold locks only to read or modify shared state, nothing more\"],\"rightOrder\":[1,2,0]},\"ej-concurrency/excessive-synchronization/step-7\":{\"id\":\"step-7\",\"key\":\"ej-concurrency/excessive-synchronization/step-7\",\"prompt\":\"\u003cp\u003eShould a general-purpose mutable class synchronize internally, like \u003ccode\u003eStringBuffer\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Usually not — leave it to clients, as \u003ccode\u003eStringBuilder\u003c/code\u003e does, unless internal synchronization gives much more concurrency\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always, to be safe\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eStringBuffer\u003c/code\u003e is almost always used by one thread, so its locking is pure overhead — hence \u003ccode\u003eStringBuilder\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-concurrency/executors-over-threads/step-3\":{\"id\":\"step-3\",\"key\":\"ej-concurrency/executors-over-threads/step-3\",\"prompt\":\"\u003cp\u003eMatch each need to the executor feature.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Wait for a particular task to finish\",\"Wait for any or all of a collection of tasks\",\"Run tasks at a set time or periodically\",\"Wait for the executor to terminate cleanly\"],\"right\":[\"\u003ccode\u003eFuture.get()\u003c/code\u003e on the result of \u003ccode\u003esubmit\u003c/code\u003e\",\"\u003ccode\u003einvokeAny\u003c/code\u003e or \u003ccode\u003einvokeAll\u003c/code\u003e\",\"\u003ccode\u003eScheduledThreadPoolExecutor\u003c/code\u003e\",\"\u003ccode\u003eawaitTermination\u003c/code\u003e\"],\"rightOrder\":[3,2,0,1]},\"ej-concurrency/executors-over-threads/step-5\":{\"id\":\"step-5\",\"key\":\"ej-concurrency/executors-over-threads/step-5\",\"prompt\":\"\u003cp\u003eWhich pool suits a heavily loaded production server?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA cached pool is fine for a small program or a lightly loaded server.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA cached thread pool creates a new thread whenever all existing ones are busy, with no upper limit.\u003c/p\u003e\\n\u003cp\u003eUnder heavy load, tasks arrive faster than they finish, so it keeps creating threads, each with its own stack, until the machine thrashes or runs out of memory.\u003c/p\u003e\\n\u003cp\u003eA fixed-size pool queues excess tasks instead, keeping the number of threads matched to what the CPUs and downstream resources can handle.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A fixed thread pool, or a \u003ccode\u003eThreadPoolExecutor\u003c/code\u003e configured directly for maximum control\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003enewCachedThreadPool\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eUnder heavy load a cached pool creates new threads for every queued task, making things worse.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-concurrency/executors-over-threads/step-6\":{\"id\":\"step-6\",\"key\":\"ej-concurrency/executors-over-threads/step-6\",\"prompt\":\"\u003cp\u003eWhat does a fork-join pool add?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eParallel streams are built on fork-join pools.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Unlimited threads\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Work stealing — idle threads take tasks from busy ones, keeping all cores busy on divide-and-conquer work\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/executors-over-threads/step-7\":{\"id\":\"step-7\",\"key\":\"ej-concurrency/executors-over-threads/step-7\",\"prompt\":\"\u003cp\u003eComplete the advice.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Refrain from working directly with \",\"html\":\"Refrain from working directly with \"},{\"answers\":[\"threads\"],\"size\":7,\"choices\":[\"threads\",\"portable\",\"task\",\"scheduler\"]},{\"text\":\"; the unit of work is the \",\"html\":\"; the unit of work is the \"},{\"answers\":[\"task\"],\"size\":4,\"choices\":[\"portable\",\"scheduler\",\"task\",\"threads\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"ej-concurrency/concurrency-utilities/step-2\":{\"id\":\"step-2\",\"key\":\"ej-concurrency/concurrency-utilities/step-2\",\"prompt\":\"\u003cp\u003eMatch each \u003ccode\u003ejava.util.concurrent\u003c/code\u003e category to an example.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Executor framework\",\"Concurrent collections\",\"Synchronizers\"],\"right\":[\"\u003ccode\u003eExecutorService\u003c/code\u003e\",\"\u003ccode\u003eConcurrentHashMap\u003c/code\u003e, \u003ccode\u003eBlockingQueue\u003c/code\u003e\",\"\u003ccode\u003eCountDownLatch\u003c/code\u003e, \u003ccode\u003eSemaphore\u003c/code\u003e, \u003ccode\u003ePhaser\u003c/code\u003e\"],\"rightOrder\":[1,2,0]},\"ej-concurrency/concurrency-utilities/step-4\":{\"id\":\"step-4\",\"key\":\"ej-concurrency/concurrency-utilities/step-4\",\"prompt\":\"\u003cp\u003eIntern strings concurrently, without an extra lookup in the common case.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eConcurrentHashMap\u003c/code\u003e is optimised for reads like \u003ccode\u003eget\u003c/code\u003e, and \u003ccode\u003eputIfAbsent\u003c/code\u003e is atomic.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"String result = map.get(s);\\nif (result == null) {\\n    result = map.\"},{\"answers\":[\"putIfAbsent\"],\"size\":11,\"choices\":[\"FieldHolder\",\"Lexicon\",\"lock\",\"putIfAbsent\"]},{\"text\":\"(s, s);\\n    if (result == null) result = s;\\n}\\nreturn result;\\n\"}],\"code\":true,\"caseSensitive\":false},\"ej-concurrency/concurrency-utilities/step-5\":{\"id\":\"step-5\",\"key\":\"ej-concurrency/concurrency-utilities/step-5\",\"prompt\":\"\u003cp\u003eWhy not wrap a \u003ccode\u003eHashMap\u003c/code\u003e with \u003ccode\u003eCollections.synchronizedMap\u003c/code\u003e instead?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eCollections.synchronizedMap\u003c/code\u003e puts one lock around every method, so only one thread at a time can read or write anything in the map.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eConcurrentHashMap\u003c/code\u003e lets reads proceed without locking and spreads writes across bins, so many threads can work at once.\u003c/p\u003e\\n\u003cp\u003eIt also provides atomic compound operations like \u003ccode\u003eputIfAbsent\u003c/code\u003e, \u003ccode\u003ecomputeIfAbsent\u003c/code\u003e and \u003ccode\u003emerge\u003c/code\u003e, which a synchronized wrapper can only offer if every client remembers to lock around the whole check-then-act.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Synchronized maps aren\u0026#39;t thread-safe\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey are, but slowly — and compound actions still need external locking.\u003c/p\u003e\\n\"},{\"html\":\"A concurrent map is much faster under contention — one global lock serialises every access\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/concurrency-utilities/step-7\":{\"id\":\"step-7\",\"key\":\"ej-concurrency/concurrency-utilities/step-7\",\"prompt\":\"\u003cp\u003eTo time an interval, which is right?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003enanoTime\u003c/code\u003e is more accurate and unaffected by adjustments to the system clock.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eSystem.currentTimeMillis()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s wall-clock time, which can jump when the clock is adjusted.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eSystem.nanoTime()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/document-thread-safety/step-2\":{\"id\":\"step-2\",\"key\":\"ej-concurrency/document-thread-safety/step-2\",\"prompt\":\"\u003cp\u003eMatch each level of thread safety to an example.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Immutable\",\"Unconditionally thread-safe\",\"Conditionally thread-safe\",\"Not thread-safe\",\"Thread-hostile\"],\"right\":[\"\u003ccode\u003eString\u003c/code\u003e, \u003ccode\u003eLong\u003c/code\u003e, \u003ccode\u003eBigInteger\u003c/code\u003e — no synchronization needed\",\"\u003ccode\u003eAtomicLong\u003c/code\u003e, \u003ccode\u003eConcurrentHashMap\u003c/code\u003e — internally synchronized\",\"\u003ccode\u003eCollections.synchronized\u003c/code\u003e wrappers — iterators need external locking\",\"\u003ccode\u003eArrayList\u003c/code\u003e, \u003ccode\u003eHashMap\u003c/code\u003e — clients must synchronize\",\"Unsafe even with external synchronization — usually by modifying static data\"],\"rightOrder\":[3,1,4,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]},\"ej-concurrency/document-thread-safety/step-4\":{\"id\":\"step-4\",\"key\":\"ej-concurrency/document-thread-safety/step-4\",\"prompt\":\"\u003cp\u003eIs the \u003ccode\u003esynchronized\u003c/code\u003e modifier in a method\u0026#39;s Javadoc enough to document thread safety?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes\",\"correct\":false,\"feedback\":\"\u003cp\u003eJavadoc doesn\u0026#39;t even include it; and thread safety isn\u0026#39;t all-or-nothing.\u003c/p\u003e\\n\"},{\"html\":\"No — it\u0026#39;s an implementation detail, not part of the API, and doesn\u0026#39;t say what level of safety the class offers\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/document-thread-safety/step-5\":{\"id\":\"step-5\",\"key\":\"ej-concurrency/document-thread-safety/step-5\",\"prompt\":\"\u003cp\u003eIterating over a \u003ccode\u003eCollections.synchronizedMap\u003c/code\u003e from several threads — what must the client do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eConditionally thread-safe classes must document which lock clients should hold for which sequences.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach method of the synchronized wrapper is atomic, but iteration is many calls: \u003ccode\u003eiterator()\u003c/code\u003e, then \u003ccode\u003ehasNext()\u003c/code\u003e and \u003ccode\u003enext()\u003c/code\u003e repeatedly.\u003c/p\u003e\\n\u003cp\u003eAnother thread can modify the map between those calls, causing \u003ccode\u003eConcurrentModificationException\u003c/code\u003e or skipped elements.\u003c/p\u003e\\n\u003cp\u003eThe wrapper uses the map object itself as its lock, so clients must hold \u003ccode\u003esynchronized (m)\u003c/code\u003e for the whole loop — not on the key set view, which is a different object.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why such classes are \u0026quot;conditionally thread-safe\u0026quot;: they\u0026#39;re safe only if callers follow documented locking rules.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$16\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Wrap the loop in \u003ccode\u003esynchronized (m) { ... }\u003c/code\u003e — locking the map, not the key set\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — the wrapper handles it\",\"correct\":false,\"feedback\":\"\u003cp\u003eIteration is a compound operation across many calls; the wrapper can\u0026#39;t lock around it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-concurrency/document-thread-safety/step-7\":{\"id\":\"step-7\",\"key\":\"ej-concurrency/document-thread-safety/step-7\",\"prompt\":\"\u003cp\u003eThe private lock object idiom.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eClients can\u0026#39;t reach the lock, so they can\u0026#39;t hold it forever — a denial-of-service that\u0026#39;s possible with a publicly accessible lock.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"private final Object \"},{\"answers\":[\"lock\"],\"size\":4,\"choices\":[\"lock\",\"current\",\"FieldHolder\",\"putIfAbsent\"]},{\"text\":\" = new Object();\\npublic void foo() { synchronized (\"},{\"answers\":[\"lock\"],\"size\":4,\"choices\":[\"putIfAbsent\",\"FieldHolder\",\"lock\",\"comparingInt\"]},{\"text\":\") { ... } }\\n\"}],\"code\":true,\"caseSensitive\":false},\"ej-concurrency/document-thread-safety/step-8\":{\"id\":\"step-8\",\"key\":\"ej-concurrency/document-thread-safety/step-8\",\"prompt\":\"\u003cp\u003eWhy should the lock field be \u003ccode\u003efinal\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s required by the compiler\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Changing it by accident would make different threads synchronize on different objects\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/lazy-initialization/step-3\":{\"id\":\"step-3\",\"key\":\"ej-concurrency/lazy-initialization/step-3\",\"prompt\":\"\u003cp\u003eMatch each lazy-initialization idiom to where it fits.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"A synchronized accessor\",\"Lazy initialization holder class\",\"Double-check idiom\"],\"right\":[\"Simple, for any field, when contention is low\",\"Static fields — the JVM initializes the holder on first use, with no synchronization on access\",\"Instance fields read often, where accessor synchronization would be costly\"],\"rightOrder\":[2,1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eAccessor method\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lazy initialization\\\" data-def=\\\"Delaying computing a field until it is first needed. Saves work if it\u0026amp;#39;s never used, but needs care with threads.\\\" data-book=\\\"Effective Java\\\"\u003eLazy initialization\u003c/button\u003e\"]},\"ej-concurrency/lazy-initialization/step-4\":{\"id\":\"step-4\",\"key\":\"ej-concurrency/lazy-initialization/step-4\",\"prompt\":\"\u003cp\u003eThe holder class idiom for a static field.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe class isn\u0026#39;t initialized until \u003ccode\u003egetField\u003c/code\u003e first touches it — and the JVM guarantees that\u0026#39;s thread-safe.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"private static class FieldHolder { static final FieldType field = computeFieldValue(); }\\nprivate static FieldType getField() { return \"},{\"answers\":[\"FieldHolder\"],\"size\":11,\"choices\":[\"final\",\"putIfAbsent\",\"FieldHolder\",\"lock\"]},{\"text\":\".field; }\\n\"}],\"code\":true,\"caseSensitive\":false},\"ej-concurrency/lazy-initialization/step-6\":{\"id\":\"step-6\",\"key\":\"ej-concurrency/lazy-initialization/step-6\",\"prompt\":\"\u003cp\u003eWhy is the field \u003ccode\u003evolatile\u003c/code\u003e in the double-check idiom?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe idiom was broken before Java 5\u0026#39;s memory model made \u003ccode\u003evolatile\u003c/code\u003e strong enough.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eCreating an object and assigning its reference are separate steps that the compiler and CPU may reorder.\u003c/p\u003e\\n\u003cp\u003eWithout \u003ccode\u003evolatile\u003c/code\u003e, another thread can see the field as non-null and use the object before its constructor\u0026#39;s writes are visible — reading default values from a \u0026quot;constructed\u0026quot; object.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e establishes a happens-before relationship: everything written before the volatile write is visible to any thread that reads the non-null value.\u003c/p\u003e\\n\u003cp\u003eFor static fields, the holder-class idiom gets the same safety from the JVM\u0026#39;s class-initialization lock with no \u003ccode\u003evolatile\u003c/code\u003e at all.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"To make the first check faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe local variable \u003ccode\u003eresult\u003c/code\u003e is what speeds things up, by reading the volatile field only once in the common case.\u003c/p\u003e\\n\"},{\"html\":\"Without it, another thread could see a non-null reference to a not-yet-fully-constructed object\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/thread-scheduler/step-3\":{\"id\":\"step-3\",\"key\":\"ej-concurrency/thread-scheduler/step-3\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s wrong with this latch?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eCountDownLatch\u003c/code\u003e, which blocks waiting threads.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe loop never blocks: it repeatedly takes the lock, checks \u003ccode\u003ecount\u003c/code\u003e and releases it, keeping a CPU core 100% busy while doing no work.\u003c/p\u003e\\n\u003cp\u003eThat stolen CPU time slows down the threads that would bring \u003ccode\u003ecount\u003c/code\u003e to zero, so the latch can make the whole program slower.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eCountDownLatch.await()\u003c/code\u003e parks the waiting thread until it\u0026#39;s needed, using no CPU while it waits.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$17\",\"options\":[{\"html\":\"It busy-waits, burning a CPU and slowing the threads that do useful work\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t synchronize\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt does — it\u0026#39;s just spinning instead of blocking.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-concurrency/thread-scheduler/step-4\":{\"id\":\"step-4\",\"key\":\"ej-concurrency/thread-scheduler/step-4\",\"prompt\":\"\u003cp\u003eA thread is starved of CPU time. Should you fix it with \u003ccode\u003eThread.yield()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRestructure the program to reduce the number of concurrently runnable threads instead.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, it\u0026#39;s the standard fix\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"No — \u003ccode\u003eyield\u003c/code\u003e has no testable semantics; it may help on one JVM and hurt on another\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/thread-scheduler/step-5\":{\"id\":\"step-5\",\"key\":\"ej-concurrency/thread-scheduler/step-5\",\"prompt\":\"\u003cp\u003eWhat about raising thread priorities?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFixing a serious liveness problem with priorities is unlikely to work — and won\u0026#39;t survive a platform change.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Priorities are among the least portable features of Java; at most, use them to tweak a program that already works\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s a reliable way to fix liveness problems\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-concurrency/thread-scheduler/step-6\":{\"id\":\"step-6\",\"key\":\"ej-concurrency/thread-scheduler/step-6\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Any program that relies on the thread \",\"html\":\"Any program that relies on the thread \"},{\"answers\":[\"scheduler\"],\"size\":9,\"choices\":[\"portable\",\"task\",\"scheduler\",\"threads\"]},{\"text\":\" for correctness or performance is likely to be non-\",\"html\":\" for correctness or performance is likely to be non-\"},{\"answers\":[\"portable\"],\"size\":8,\"choices\":[\"portable\",\"threads\",\"task\",\"scheduler\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"jcip-thread-safety/why-concurrency/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/why-concurrency/step-3\",\"prompt\":\"\u003cp\u003eMatch each kind of risk to what goes wrong.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Safety hazard\",\"Liveness hazard\",\"Performance hazard\"],\"right\":[\"Something bad happens — data is corrupted or a wrong result is returned\",\"Something good never happens — a thread waits forever, as in deadlock\",\"It happens, but too slowly — context switches, lock contention, poor scaling\"],\"rightOrder\":[1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Liveness\\\" data-def=\\\"\u0026amp;quot;Something good eventually happens.\u0026amp;quot; Deadlock, livelock and starvation are liveness failures.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLiveness\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Context switch\\\" data-def=\\\"The CPU stops one thread and starts another, saving and restoring registers and disturbing caches. Costs thousands of cycles.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContext switch\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e\"]},\"jcip-thread-safety/why-concurrency/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-thread-safety/why-concurrency/step-4\",\"prompt\":\"\u003cp\u003eA web framework calls your servlet\u0026#39;s \u003ccode\u003eservice\u003c/code\u003e method. How many threads might call it at the same time?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s why a servlet\u0026#39;s fields are shared mutable state, and why frameworks make your code concurrent whether you planned it or not.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Many — the container serves concurrent requests on different threads, through the same servlet instance\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"One — each servlet runs on its own thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe container shares one servlet instance between all request threads.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-thread-safety/why-concurrency/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-thread-safety/why-concurrency/step-6\",\"prompt\":\"\u003cp\u003eWhich is the real reason concurrency bugs are so costly?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They depend on timing, so they appear rarely, unpredictably and often only under production load\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Compilers report them as warnings that people ignore\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe compiler can\u0026#39;t detect most of them at all.\u003c/p\u003e\\n\"},{\"html\":\"They only happen in old versions of Java\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Java Memory Model\\\" data-def=\\\"The rules saying when a write by one thread is guaranteed to be visible to another, built on the happens-before relation.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eJava memory model\u003c/button\u003e makes them well-defined, but they still happen in every version.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-thread-safety/why-concurrency/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/why-concurrency/step-7\",\"prompt\":\"\u003cp\u003eComplete the summary of the risks.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Safety means nothing bad ever happens; \",\"html\":\"Safety means nothing bad ever happens; \"},{\"answers\":[\"liveness\"],\"size\":8,\"choices\":[\"modify\",\"liveness\",\"exception\",\"I/O\"]},{\"text\":\" means something good eventually happens.\",\"html\":\" means something good eventually happens.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-thread-safety/what-is-thread-safety/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/what-is-thread-safety/step-3\",\"prompt\":\"\u003cp\u003eIs this servlet \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread-safe\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003eStateless objects are always thread-safe.\u003c/strong\u003e\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe servlet has no fields; everything it touches lives in local variables, which are on each thread\u0026#39;s own stack.\u003c/p\u003e\\n\u003cp\u003eTwo threads running \u003ccode\u003eservice\u003c/code\u003e at the same time share nothing, so neither can see or affect the other.\u003c/p\u003e\\n\u003cp\u003eThread-safety problems only arise from shared mutable state, and a stateless object has none.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$18\",\"options\":[{\"html\":\"No — servlets are always called from many threads\",\"correct\":false,\"feedback\":\"\u003cp\u003eMany threads, yes — but they share nothing, so they can\u0026#39;t interfere.\u003c/p\u003e\\n\"},{\"html\":\"Yes — it has no fields; everything it uses lives in local variables on each thread\u0026#39;s own stack\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-thread-safety/what-is-thread-safety/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-thread-safety/what-is-thread-safety/step-5\",\"prompt\":\"\u003cp\u003eMatch each way of fixing shared mutable state with an example.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Don\u0026#39;t share it\",\"Make it immutable\",\"Synchronize access\"],\"right\":[\"Keep the value in a local variable instead of a field\",\"Replace a mutable holder with a final field of an immutable type\",\"Guard every read and write of the field with the same lock\"],\"rightOrder\":[1,2,0]},\"jcip-thread-safety/what-is-thread-safety/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-thread-safety/what-is-thread-safety/step-6\",\"prompt\":\"\u003cp\u003eWhen is it easiest to make a class \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread-safe\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"After it\u0026#39;s finished and tested single-threaded\",\"correct\":false,\"feedback\":\"\u003cp\u003eGood encapsulation and immutability make it easy early; adding locks later means re-examining every access.\u003c/p\u003e\\n\"},{\"html\":\"From the start — retrofitting thread safety onto an existing class is much harder\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-thread-safety/race-conditions/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-thread-safety/race-conditions/step-2\",\"prompt\":\"\u003cp\u003ePut the steps of \u003ccode\u003ecount++\u003c/code\u003e in the order a thread performs them.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRead, modify, write. Each step is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e on its own; the sequence as a whole is not.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Read: \u003ccode\u003etmp = count\u003c/code\u003e\",\"Add: \u003ccode\u003etmp = tmp + 1\u003c/code\u003e\",\"Write: \u003ccode\u003ecount = tmp\u003c/code\u003e\"],\"start\":[1,0,2]},\"jcip-thread-safety/race-conditions/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/race-conditions/step-3\",\"prompt\":\"\u003cp\u003eTwo threads each call \u003ccode\u003eincrement()\u003c/code\u003e once on a shared counter that starts at 0. Which final values of \u003ccode\u003ecount\u003c/code\u003e are possible?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e2 when the threads take turns. 1 when both read 0 before either writes — then both write 1,\\nand one update is lost. Let\u0026#39;s make that happen.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach \u003ccode\u003ecount++\u003c/code\u003e is read, add, write.\u003c/p\u003e\\n\u003cp\u003eIf one thread finishes before the other starts, the second reads 1 and writes 2.\u003c/p\u003e\\n\u003cp\u003eIf both read 0 before either writes, both compute 1 and both write 1: one increment is lost.\u003c/p\u003e\\n\u003cp\u003eNo other result is possible from two increments of 0, so the answers are 1 or 2.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhat if both threads read \u003ccode\u003ecount\u003c/code\u003e before either writes?\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"0\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach thread writes at least once, and every write stores a value of 1 or more.\u003c/p\u003e\\n\"},{\"html\":\"1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"2\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"3\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere are only two increments in total, so the value can\u0026#39;t exceed 2.\u003c/p\u003e\\n\"}],\"multiple\":true},\"jcip-thread-safety/race-conditions/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-thread-safety/race-conditions/step-4\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eLose an update.\u003c/strong\u003e Run the threads one instruction at a time, in any order, so that both finish\\nbut \u003ccode\u003ecount\u003c/code\u003e ends at \u003cstrong\u003e1\u003c/strong\u003e.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eBoth threads read 0, both computed 1, both wrote 1. The second write overwrote the first:\\na \u003cstrong\u003elost update\u003c/strong\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet T1 read \u003ccode\u003ecount\u003c/code\u003e first.\u003c/p\u003e\\n\",\"\u003cp\u003eBefore T1 writes, let T2 read \u003ccode\u003ecount\u003c/code\u003e too. Both now hold 0.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":2,\"increments\":1},\"goal\":{\"count\":1},\"question\":{\"prompt\":\"\u003cp\u003eWhat had to happen for the update to be lost?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Both threads wrote at exactly the same instant\",\"correct\":false,\"feedback\":\"\u003cp\u003eWrites take turns; the problem is that both wrote a value based on the same old read.\u003c/p\u003e\\n\"},{\"html\":\"One thread ran completely before the other started\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen the second thread reads 1 and writes 2 — nothing is lost.\u003c/p\u003e\\n\"},{\"html\":\"Both threads read \u003ccode\u003ecount\u003c/code\u003e before either wrote it back\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"jcip-thread-safety/race-conditions/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-thread-safety/race-conditions/step-5\",\"prompt\":\"\u003cp\u003e\u003cstrong\u003eThree threads.\u003c/strong\u003e Each increments once, so the right answer is 3. Can you make it end at \u003cstrong\u003e1\u003c/strong\u003e —\\nlosing two updates?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith \u003cem\u003en\u003c/em\u003e threads you can lose up to \u003cem\u003en − 1\u003c/em\u003e updates. Real programs increment millions of times,\\nso the final count can be far off — and different on every run.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eGet all three threads to read before any of them writes.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":3,\"increments\":1},\"goal\":{\"count\":1},\"question\":{\"prompt\":\"\u003cp\u003eFor \u003ccode\u003ecount\u003c/code\u003e to end at 1, what must be true of the last thread to write?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"It was the first thread to start\",\"correct\":false,\"feedback\":\"\u003cp\u003eStart order doesn\u0026#39;t matter — what matters is the value it read.\u003c/p\u003e\\n\"},{\"html\":\"It read \u003ccode\u003ecount\u003c/code\u003e as 0\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It ran after the other two had finished\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen it would read 2 and write 3.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"jcip-thread-safety/race-conditions/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/race-conditions/step-7\",\"prompt\":\"\u003cp\u003eWhich of these make \u003ccode\u003eincrement()\u003c/code\u003e safe for many threads?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eBoth fixes make the three steps behave as one: \u003ccode\u003esynchronized\u003c/code\u003e with a lock, \u003ccode\u003eAtomicInteger\u003c/code\u003e with\\na single hardware \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecompare-and-swap\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1a\",\"options\":[{\"html\":\"Declare \u003ccode\u003ecount\u003c/code\u003e as \u003ccode\u003evolatile\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003evolatile\u003c/code\u003e makes each read and write visible to other threads, but the read-add-write is\\nstill three separate steps. Two threads can still read the same value.\u003c/p\u003e\\n\"},{\"html\":\"Use an \u003ccode\u003eAtomicInteger\u003c/code\u003e and call \u003ccode\u003eincrementAndGet()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Run the program on a single-core machine\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe scheduler can still pause a thread between the read and the write, and switch to another.\u003c/p\u003e\\n\"},{\"html\":\"Declare the method \u003ccode\u003esynchronized\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic variable\\\" data-def=\\\"\u0026amp;quot;Better volatiles\u0026amp;quot;: classes like \u0026lt;code\u0026gt;AtomicInteger\u0026lt;/code\u0026gt; with atomic compound operations such as \u0026lt;code\u0026gt;incrementAndGet\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;compareAndSet\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic variable\u003c/button\u003e\"]},\"jcip-thread-safety/race-conditions/step-8\":{\"id\":\"step-8\",\"key\":\"jcip-thread-safety/race-conditions/step-8\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Race condition\",\"Atomic\",\"Critical section\",\"Lost update\"],\"right\":[\"The result depends on the timing of threads\",\"Happens all at once; no other thread sees it half-done\",\"Code that must not run in two threads at the same time\",\"One thread\u0026#39;s write silently overwrites another\u0026#39;s\"],\"rightOrder\":[1,3,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Race condition\\\" data-def=\\\"When the correctness of a result depends on the lucky timing or interleaving of threads.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eRace condition\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},\"jcip-thread-safety/race-conditions/step-9\":{\"id\":\"step-9\",\"key\":\"jcip-thread-safety/race-conditions/step-9\",\"prompt\":\"\u003cp\u003eComplete the sentence.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe middle step changes the value.\u003c/p\u003e\\n\"],\"type\":\"blank\",\"parts\":[{\"text\":\"`count++` is a read-\",\"html\":\"\u003ccode\u003ecount++\u003c/code\u003e is a read-\"},{\"answers\":[\"modify\"],\"size\":6,\"choices\":[\"I/O\",\"modify\",\"liveness\",\"releases\"]},{\"text\":\"-write sequence, so it is not \",\"html\":\"-write sequence, so it is not \"},{\"answers\":[\"atomic\"],\"size\":6,\"choices\":[\"liveness\",\"modify\",\"same\",\"atomic\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"jcip-thread-safety/race-conditions/step-11\":{\"id\":\"step-11\",\"key\":\"jcip-thread-safety/race-conditions/step-11\",\"prompt\":\"\u003cp\u003eTwo threads call \u003ccode\u003egetInstance()\u003c/code\u003e at the same moment on an object that\u0026#39;s not yet created. What can happen?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Check-then-act\\\" data-def=\\\"A race where you check a condition and then act on it, but the condition may change in between — e.g. \u0026lt;code\u0026gt;if (!map.containsKey(k)) map.put(k, v)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003echeck-then-act\u003c/button\u003e\u003c/strong\u003e, the other common race: you observe something (it\u0026#39;s null), then act on it — but the\\nobservation may be stale by the time you act.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBoth threads check \u003ccode\u003einstance == null\u003c/code\u003e before either assigns, so both create an \u003ccode\u003eExpensiveObject\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEach caller gets a different object, which matters when it\u0026#39;s meant to be a singleton — a registry, a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e, a connection.\u003c/p\u003e\\n\u003cp\u003eThis is check-then-act: the decision is based on an observation that may be out of date by the time you act. Synchronizing the method makes check and act \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"Nothing — the second thread always sees the first one\u0026#39;s object\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing makes the check and the assignment one step.\u003c/p\u003e\\n\"},{\"html\":\"Both see \u003ccode\u003enull\u003c/code\u003e, both create an object, and the callers end up with two different instances\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-thread-safety/intrinsic-locks/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-2\",\"prompt\":\"\u003cp\u003eTwo threads each run \u003ccode\u003ecount++\u003c/code\u003e, now inside \u003ccode\u003esynchronized\u003c/code\u003e. \u003cstrong\u003eTry to lose an update\u003c/strong\u003e — then run both threads to the end.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhile T1 holds the lock, T2 can\u0026#39;t start its read. By the time T2 reads, T1 has written —\\nso no interleaving can lose an update.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eRun T1 until it holds the lock, then try T2.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"threads\",\"config\":{\"threads\":2,\"increments\":1,\"synchronized\":true},\"goal\":{\"count\":2},\"question\":{\"prompt\":\"\u003cp\u003eWhat happens when one thread reaches \u003cem\u003eacquire lock\u003c/em\u003e while the other holds it?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"It skips the lock and carries on\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen the lock wouldn\u0026#39;t protect anything.\u003c/p\u003e\\n\"},{\"html\":\"It waits until the lock is released\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws an exception\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e for a lock is normal; the thread just blocks.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"jcip-thread-safety/intrinsic-locks/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-3\",\"prompt\":\"\u003cp\u003eIn an instance method declared \u003ccode\u003esynchronized\u003c/code\u003e, which lock does the thread take?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The lock of \u003ccode\u003ethis\u003c/code\u003e — the object the method was called on\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"One global lock shared by all synchronized code\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere is no global lock — that would make every program single-threaded.\u003c/p\u003e\\n\"},{\"html\":\"A lock belonging to the method itself\",\"correct\":false,\"feedback\":\"\u003cp\u003eMethods don\u0026#39;t have locks; objects do.\u003c/p\u003e\\n\"},{\"html\":\"The lock of the class\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what a \u003ccode\u003estatic synchronized\u003c/code\u003e method takes.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-thread-safety/intrinsic-locks/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-5\",\"prompt\":\"\u003cp\u003eAn \u003ccode\u003eAccount\u003c/code\u003e has \u003ccode\u003esynchronized void withdraw(int amt) { if (balance \u0026gt;= amt) balance -= amt; }\u003c/code\u003e\\nand a balance of 100. Two threads call \u003ccode\u003ewithdraw(80)\u003c/code\u003e on it at the same moment. What\u0026#39;s the final balance?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Check-then-act\\\" data-def=\\\"A race where you check a condition and then act on it, but the condition may change in between — e.g. \u0026lt;code\u0026gt;if (!map.containsKey(k)) map.put(k, v)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCheck-then-act\u003c/button\u003e\u003c/strong\u003e is another classic race. Holding the lock across both the check and the act\\nmakes them \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e together.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBecause \u003ccode\u003ewithdraw\u003c/code\u003e is synchronized, the check and the subtraction happen together under the lock.\u003c/p\u003e\\n\u003cp\u003eThe first thread checks 100 \u0026gt;= 80, withdraws, and leaves 20; the second then checks 20 \u0026gt;= 80, which fails, so nothing happens.\u003c/p\u003e\\n\u003cp\u003eWithout the lock, both could check 100 before either subtracts, leaving -60.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"20\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"−60\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat needs both threads to pass the \u003ccode\u003ebalance \u0026gt;= amt\u003c/code\u003e check before either subtracts. The lock makes\\ncheck and subtract one step, so the second thread sees 20 and does nothing.\u003c/p\u003e\\n\"},{\"html\":\"Either 20 or −60, depending on timing\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout \u003ccode\u003esynchronized\u003c/code\u003e that would be right — it\u0026#39;s a check-then-act race. The lock removes it.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-thread-safety/intrinsic-locks/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-7\",\"prompt\":\"\u003cp\u003eComplete the sentence.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eJava releases \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eintrinsic locks\u003c/button\u003e on every exit path, so an exception can\u0026#39;t leave a lock held.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe opposite of acquiring.\u003c/p\u003e\\n\"],\"type\":\"blank\",\"parts\":[{\"text\":\"A thread that leaves a synchronized block \",\"html\":\"A thread that leaves a synchronized block \"},{\"answers\":[\"releases\"],\"size\":8,\"choices\":[\"I/O\",\"exception\",\"modify\",\"releases\"]},{\"text\":\" the lock — even if it leaves by throwing an \",\"html\":\" the lock — even if it leaves by throwing an \"},{\"answers\":[\"exception\"],\"size\":9,\"choices\":[\"modify\",\"exception\",\"atomic\",\"liveness\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"jcip-thread-safety/intrinsic-locks/step-8\":{\"id\":\"step-8\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-8\",\"prompt\":\"\u003cp\u003eMatch each tool to when it fits best.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eAtomicInteger\u003c/code\u003e\",\"\u003ccode\u003esynchronized\u003c/code\u003e method\",\"\u003ccode\u003esynchronized (Counter.class)\u003c/code\u003e\",\"\u003ccode\u003evolatile\u003c/code\u003e\"],\"right\":[\"One counter, updated very often\",\"Several fields of one object that must change together\",\"A static field shared by every instance\",\"A flag one thread sets and others only read\"],\"rightOrder\":[3,0,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic variable\\\" data-def=\\\"\u0026amp;quot;Better volatiles\u0026amp;quot;: classes like \u0026lt;code\u0026gt;AtomicInteger\u0026lt;/code\u0026gt; with atomic compound operations such as \u0026lt;code\u0026gt;incrementAndGet\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;compareAndSet\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic variable\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\"]},\"jcip-thread-safety/intrinsic-locks/step-9\":{\"id\":\"step-9\",\"key\":\"jcip-thread-safety/intrinsic-locks/step-9\",\"prompt\":\"\u003cp\u003eA subclass overrides a \u003ccode\u003esynchronized\u003c/code\u003e method and calls the superclass version. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reentrancy\\\" data-def=\\\"A thread can reacquire a lock it already holds. Java\u0026amp;#39;s intrinsic locks and \u0026lt;code\u0026gt;ReentrantLock\u0026lt;/code\u0026gt; are reentrant, so a synchronized method can call another one.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eReentrancy\u003c/button\u003e\u003c/strong\u003e means locks are acquired per thre he condition may change in between — e.g. \u0026lt;code\u0026gt;if (!map.containsKey(k)) map.put(k, v)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCheck-then-act\u003c/button\u003e\"]},\"jcip-thread-safety/guarding-state/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-thread-safety/guarding-state/step-7\",\"prompt\":\"\u003cp\u003eMatch each practice to its purpose.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Annotating a field \u003ccode\u003e@GuardedBy(\u0026quot;this\u0026quot;)\u003c/code\u003e\",\"Keeping state private\",\"Holding the lock across read and write\"],\"right\":[\"Documents which lock protects it, for maintainers and tools\",\"Ensures only your code — which follows the locking rules — can touch it\",\"Makes a compound action atomic\"],\"rightOrder\":[1,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compound action\\\" data-def=\\\"A sequence of operations that must execute atomically to be correct, like check-then-act or read-modify-write.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompound action\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},\"jcip-thread-safety/guarding-state/step-8\":{\"id\":\"step-8\",\"key\":\"jcip-thread-safety/guarding-state/step-8\",\"prompt\":\"\u003cp\u003eDoes acquiring an object\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eintrinsic lock\u003c/button\u003e stop other threads from accessing that object\u0026#39;s fields?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eIntrinsic locks are purely cooperative: holding an object\u0026#39;s lock only stops other threads from acquiring that same lock.\u003c/p\u003e\\n\u003cp\u003eCode that reads or writes the fields without synchronizing isn\u0026#39;t affected at all.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread safety\u003c/button\u003e comes from every access to shared state using the same lock, consistently — which is why documenting the guarding lock matters.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — it only stops other threads from acquiring the same lock; fields are protected only if everyone agrees to take it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes — the object becomes inaccessible to other threads\",\"correct\":false,\"feedback\":\"\u003cp\u003eLocks are a convention. Unsynchronized code can still read and write the fields.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-thread-safety/liveness-and-performance/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-thread-safety/liveness-and-performance/step-3\",\"prompt\":\"\u003cp\u003eA servlet factors numbers and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecaches\u003c/button\u003e the last number and its factors. Locking the whole method makes requests queue up behind each other. Put the narrow-locking version in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOnly the parts that touch shared state are synchronized; the expensive computation runs in parallel.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Read the request\u0026#39;s number (no lock needed — a local variable)\",\"In a short synchronized block, check the cache and copy the cached factors if they match\",\"If there was no hit, factor the number with no lock held — the slow part\",\"In a second short synchronized block, store the new number and factors in the cache\"],\"start\":[1,2,3,0]},\"jcip-thread-safety/liveness-and-performance/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-thread-safety/liveness-and-performance/step-4\",\"prompt\":\"\u003cp\u003eHow small should synchronized blocks be?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSimplicity, safety and performance pull in different directions; resist sacrificing simplicity prematurely.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Small enough not to hold the lock during long work, but not so fragmented that the overhead of acquiring locks dominates\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"As small as possible — one statement each\",\"correct\":false,\"feedback\":\"\u003cp\u003eSplitting \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/ -term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003evolatile\u003c/code\u003e\u003c/button\u003e rules out the other two.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$1f\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Always \u003ccode\u003e0\u003c/code\u003e\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e42\u003c/code\u003e, or \u003ccode\u003e0\u003c/code\u003e, or nothing at all — it may loop forever\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always \u003ccode\u003e42\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe reader might never see \u003ccode\u003eready\u003c/code\u003e change, or might see it before it sees \u003ccode\u003enumber\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"jcip-sharing-objects/visibility/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-sharing-objects/visibility/step-4\",\"prompt\":\"\u003cp\u003eA getter for a field isn\u0026#39;t synchronized, but its setter is. What can a reader see?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A \u003cstrong\u003estale\u003c/strong\u003e value — out of date, possibly for a long time, and possibly stale for some fields but not others\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always the latest value, because the setter is synchronized\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Visibility\\\"  step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Only values that some thread actually wrote\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat \u0026quot;out-of-thin-air safety\u0026quot; holds for most variables, but the JVM may split 64-bit \u003ccode\u003elong\u003c/code\u003e and \u003ccode\u003edouble\u003c/code\u003e writes.\u003c/p\u003e\\n\"},{\"html\":\"A value no thread ever wrote — the high 32 bits from one write and the low 32 from another\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jcip-sharing-objects/visibility/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-sharing-objects/visibility/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Locking is not just about mutual exclusion; it is also about memory \",\"html\":\"Locking is not just about mutual exclusion; it is also about memory \"},{\"answers\":[\"visibility\"],\"size\":10,\"choices\":[\"common\",\"any\",\"safely\",\"visibility\"]},{\"text\":\". Reading and writing threads must synchronize on a \",\"html\":\". Reading and writing threads must synchronize on a \"},{\"answers\":[\"common\",\"the same\"],\"size\":8,\"choices\":[\"any\",\"visibility\",\"safely\",\"common\"]},{\"text\":\" lock.\",\"html\":\" lock.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-sharing-objects/visibility/step-8\":{\"id\":\"step-8\",\"key\":\"jcip-sharing-objects/visibility/step-8\",\"prompt\":\"\u003cp\u003eMatch each situation to the problem.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\" .\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA pool reuses its threads for many tasks, and a \u003ccode\u003eThreadLocal\u003c/code\u003e value lives as long as its thread.\u003c/p\u003e\\n\u003cp\u003eA value set by one task — a user ID, a transaction — is still there when the next unrelated task runs on that thread, leaking data between requests.\u003c/p\u003e\\n\u003cp\u003eIt also keeps objects alive for the pool\u0026#39;s lifetime. Clear thread-local values in a \u003ccode\u003efinally\u003c/code\u003e block at the end of each task.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Pool threads are reused, so values leak from one task to the next — and can keep objects alive — unless removed\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"There\u0026#39;s no danger\",\"correct\":false,\"feedback\":\"\u003cp\u003eValues live as long as the thread does; call \u003ccode\u003eremove()\u003c/code\u003e when the task is done.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-sharing-objects/immutability/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-sharing-objects/immutability/step-2\",\"prompt\":\"\u003cp\u003eThis class keeps a \u003ccode\u003eSet\u003c/code\u003e internally and the set is mutable. Can the class still be immutable?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eImmutability is about observable state, not whether internal objects could in principle change.\u003c/p\u003e\\n\u003cp\u003eThe set is filled in the constructor, the reference is \u003ccode\u003eprivate final\u003c/code\u003e, no method modifies it and it never escapes, so after construction no one can change it.\u003c/p\u003e\\n\u003cp\u003eThe \u003ccode\u003efinal\u003c/code\u003e field also guarantees that other threads see the set as constructed. That\u0026#39;s enough for the class to be immutable, and therefore \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread-safe\u003c/button\u003e without locks.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$20\",\"options\":[{\"html\":\"No — it uses a mutable object\",\"correct\":false,\"feedback\":\"\u003cp\u003eImmutability is about the object\u0026#39;s observable state, not the classes it uses internally.\u003c/p\u003e\\n\"},{\"html\":\"Yes — the set is never modified after construction and never escapes\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Escape\\\" data-def=\\\"An object published when it shouldn\u0026amp;#39;t be — for example before it\u0026amp;#39;s fully constructed.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eEscape\u003c/button\u003e\"]},\"jcip-sharing-objects/immutability/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-sharing-objects/immutability/step-4\",\"prompt\":\"\u003cp\u003eWhy does this need no lock?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA thread reading \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003e\u003ccode\u003ecache\u003c/code\u003e\u003c/button\u003e sees either the old pair or the new pair — never a mix.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003evolatile\u003c/code\u003e makes the methods ato
