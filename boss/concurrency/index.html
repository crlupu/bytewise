cers and consumers\u003c/button\u003e lost or duplicated nothing, without a lock that would hide the bugs?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOrder-insensitive checksums let threads run fully concurrently.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Collect every item into a shared synchronized list and compare\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe synchronized list would serialise the test and could mask the race you\u0026#39;re looking for.\u003c/p\u003e\\n\"},{\"html\":\"Each producer sums a checksum of what it puts, each consumer of what it takes; compare the totals at the end\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-testing/testing-correctness/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-testing/testing-correctness/step-5\",\"prompt\":\"\u003cp\u003eHow do you make sure all test threads really run at the same time?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Start them in a loop\",\"correct\":false,\"feedback\":\"\u003cp\u003eEarly threads may finish before later ones even start — little concurrency is actually tested.\u003c/p\u003e\\n\"},{\"html\":\"Release them together with a \u003ccode\u003eCountDownLatch\u003c/code\u003e or \u003ccode\u003eCyclicBarrier\u003c/code\u003e start gate\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latch\\\" data-def=\\\"A gate that stays closed until a count reaches zero, then opens for good. Lets threads wait until a set of events has happened.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLatch\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Barrier\\\" data-def=\\\"Makes a group of threads wait until all of them arrive, then releases them together. Reusable for step-by-step computations.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eBarrier\u003c/button\u003e\"]},\"jcip-testing/testing-correctness/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-testing/testing-correctness/step-6\",\"prompt\":\"\u003cp\u003eHow can a test increase the number of interleavings it explores?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eStatic analysis tools — like FindBugs/SpotBugs\u0026#39; concurrency checks — complement testing.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Run more threads than CPUs, test on multiprocessors and different systems, and occasionally call \u003ccode\u003eThread.yield()\u003c/code\u003e or \u003ccode\u003esleep(0)\u003c/code\u003e at key points\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Run the same test once on a fast machine\",\"correct\":false,\"feedback\":\"\u003cp\u003eConcurrency bugs are probabilistic; you need many varied runs.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-testing/testing-correctness/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-testing/testing-correctness/step-7\",\"prompt\":\"\u003cp\u003eComplete the advice.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Concurrency bugs are low-probability events, so tests must run many \",\"html\":\"Concurrency bugs are low-probability events, so tests must run many \"},{\"answers\":[\"iterations\"],\"size\":10,\"choices\":[\"open\",\"iterations\",\"order\",\"garbage\"]},{\"text\":\" to have a chance of finding them.\",\"html\":\" to have a chance of finding them.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-testing/testing-performance/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-testing/testing-performance/step-3\",\"prompt\":\"\u003cp\u003eMatch each benchmarking pitfall to its effect.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Garbage collection\",\"Dynamic compilation\",\"Unrealistic contention\",\"Dead-code elimination\"],\"right\":[\"A collection that happens in one run but not another skews the timing\",\"Early iterations run interpreted, then compiled — mixing both distorts results\",\"Real tasks do other work between locks; a tight loop exaggerates contention\",\"The compiler removes computation whose result is never used, timing nothing at all\"],\"rightOrder\":[2,1,0,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e\"]},\"jcip-testing/testing-performance/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-testing/testing-performance/step-4\",\"prompt\":\"\u003cp\u003eA benchmark computes \u003ccode\u003efib(30)\u003c/code\u003e in a loop but never uses the results. A new JVM makes it 1,000× faster. What happened?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eMake results observable cheaply — for example, compare a hash of the result with a random value, or use \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JMH\\\" data-def=\\\"The Java Microbenchmark Harness — the standard tool for writing benchmarks that the JIT can\u0026amp;#39;t fool.\\\"\u003eJMH\u003c/button\u003e\u0026#39;s \u003ccode\u003eBlackhole\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIf the result of \u003ccode\u003efib(30)\u003c/code\u003e is never used, the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e may prove the call has no effect and delete it, so the loop measures nothing.\u003c/p\u003e\\n\u003cp\u003eA newer JVM with a smarter optimizer made the \u0026quot;benchmark\u0026quot; 1,000 times faster without the code getting faster at all.\u003c/p\u003e\\n\u003cp\u003eBenchmarks must consume their results in a way the compiler can\u0026#39;t predict, which is what JMH\u0026#39;s \u003ccode\u003eBlackhole\u003c/code\u003e is for.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"The new JVM is 1,000× faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eReal improvements are rarely that large; suspect the benchmark.\u003c/p\u003e\\n\"},{\"html\":\"The optimizer saw the result was unused and eliminated the computation\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jcip-testing/testing-performance/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-testing/testing-performance/step-5\",\"prompt\":\"\u003cp\u003eHow do you avoid measuring the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT compiler\u003c/button\u003e at work?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003e-XX:+PrintCompilation\u003c/code\u003e shows when compilation happens. \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JMH\\\" data-def=\\\"The Java Microbenchmark Harness — the standard tool for writing benchmarks that the JIT can\u0026amp;#39;t fool.\\\"\u003eJMH\u003c/button\u003e automates warm-up and many other pitfalls.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Run long enough — or warm up first — so that compiled code dominates, and discard the warm-up\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Run the test exactly once\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-testing/testing-performance/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-testing/testing-performance/step-6\",\"prompt\":\"\u003cp\u003eComplete the advice.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Run tests long enough that \",\"html\":\"Run tests long enough that \"},{\"answers\":[\"garbage\"],\"size\":7,\"choices\":[\"any\",\"garbage\",\"iterations\",\"happens-before\"]},{\"text\":\" collection and compilation happen many times, rather than once by chance.\",\"html\":\" collection and compilation happen many times, rather than once by chance.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-explicit-locks/reentrantlock/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-explicit-locks/reentrantlock/step-2\",\"prompt\":\"\u003cp\u003eThe \u003ccode\u003efinally\u003c/code\u003e was forgotten. What happens if \u003ccode\u003eupdateState()\u003c/code\u003e throws?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThis is why explicit locks are more dangerous — a bug that\u0026#39;s easy to miss in review.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAn \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Intrinsic lock\\\" data-def=\\\"The lock built into every Java object, acquired by \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;. Released automatically when the block exits, even by an exception.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eintrinsic lock\u003c/button\u003e is released automatically when execution leaves the \u003ccode\u003esynchronized\u003c/code\u003e block, however it leaves.\u003c/p\u003e\\n\u003cp\u003eAn explicit \u003ccode\u003eLock\u003c/code\u003e is released only when \u003ccode\u003eunlock()\u003c/code\u003e is called. If an exception skips that call, the lock stays held forever, and every thread that later needs it blocks.\u003c/p\u003e\\n\u003cp\u003eThe program doesn\u0026#39;t crash; it hangs, often far from the cause. Always put \u003ccode\u003eunlock()\u003c/code\u003e in a \u003ccode\u003efinally\u003c/code\u003e block.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003elock.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003elock\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e();\u003c/span\u003e\u003c/span\u003e\\n\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eupdateState\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e();\u003c/span\u003e\u003c/span\u003e\\n\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003elock.\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\\\"\u003eunlock\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e();\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\",\"options\":[{\"html\":\"The JVM releases it automatically, as with synchronized\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the safety net \u003ccode\u003esynchronized\u003c/code\u003e gives you and \u003ccode\u003eLock\u003c/code\u003e doesn\u0026#39;t.\u003c/p\u003e\\n\"},{\"html\":\"The lock is never released — every later thread that needs it blocks forever\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-explicit-locks/reentrantlock/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-explicit-locks/reentrantlock/step-4\",\"prompt\":\"\u003cp\u003eMatch each acquisition method to its behaviour.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003elock()\u003c/code\u003e\",\"\u003ccode\u003etryLock()\u003c/code\u003e\",\"\u003ccode\u003etryLock(timeout, unit)\u003c/code\u003e\",\"\u003ccode\u003elockInterruptibly()\u003c/code\u003e\"],\"right\":[\"Wait as long as it takes, ignoring interrupts\",\"Take the lock if it\u0026#39;s free right now; otherwise return false at once\",\"Wait up to a time limit, then give up\",\"Wait, but stop with \u003ccode\u003eInterruptedException\u003c/code\u003e if interrupted\"],\"rightOrder\":[0,3,1,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"tryLock\\\" data-def=\\\"Acquire the lock only if it\u0026amp;#39;s free (optionally waiting up to a timeout); otherwise return \u0026lt;code\u0026gt;false\u0026lt;/code\u0026gt; so you can back off.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003etryLock\u003c/button\u003e\"]},\"jcip-explicit-locks/reentrantlock/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-explicit-locks/reentrantlock/step-5\",\"prompt\":\"\u003cp\u003eAlways release in finally.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"lock.lock();\\ntry {\\n    balance -= amount;\\n} \"},{\"answers\":[\"finally\"],\"size\":7,\"choices\":[\"shutdown\",\"finally\",\"unlock\",\"readLock\"]},{\"text\":\" {\\n    lock.\"},{\"answers\":[\"unlock\"],\"size\":6,\"choices\":[\"list\",\"finally\",\"readLock\",\"unlock\"]},{\"text\":\"();\\n}\\n\"}],\"code\":true,\"caseSensitive\":false},\"jcip-explicit-locks/reentrantlock/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-explicit-locks/reentrantlock/step-6\",\"prompt\":\"\u003cp\u003eA task should give up if it can\u0026#39;t send a message within its time budget. Which method fits?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003elock()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt could wait indefinitely and blow the budget.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etryLock(timeLeft, NANOSECONDS)\u003c/code\u003e — and report failure if it returns false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-explicit-locks/reentrantlock/step-8\":{\"id\":\"step-8\",\"key\":\"jcip-explicit-locks/reentrantlock/step-8\",\"prompt\":\"\u003cp\u003eWhy might you need hand-over-hand (\u0026quot;chained\u0026quot;) locking, as when traversing a linked list?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eExplicit locks can be acquired and released in different scopes, which enables patterns like this.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"To make locks reentrant\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"To lock the next node before releasing the current one — impossible with block-structured synchronized\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-explicit-locks/choosing-a-lock/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-3\",\"prompt\":\"\u003cp\u003eWhy is nonfair locking usually faster under \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtention\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIn JCIP\u0026#39;s benchmarks fair locks were dramatically slower — sometimes by two orders of magnitude.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen a lock is released, a fair lock hands it to the longest-waiting thread, which must first be woken by the OS — a delay of microseconds or more.\u003c/p\u003e\\n\u003cp\u003eA nonfair lock lets a thread that happens to be running and asking at that moment take it immediately, using the lock while the woken thread is still starting.\u003c/p\u003e\\n\u003cp\u003eThat barging fills the gap and greatly increases \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Throughput\\\" data-def=\\\"How much work gets done per unit of time.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethroughput\u003c/button\u003e, at the cost of no ordering guarantee.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Fair locks use more memory\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe cost is in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elatency\u003c/button\u003e between release and the next acquisition, not memory.\u003c/p\u003e\\n\"},{\"html\":\"Resuming a suspended thread takes time; letting an already-running thread barge in uses the lock during that gap\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fair lock\\\" data-def=\\\"A lock that grants access in the order threads asked. Nonfair locks allow barging and are much faster.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eFair lock\u003c/button\u003e\"]},\"jcip-explicit-locks/choosing-a-lock/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-4\",\"prompt\":\"\u003cp\u003eWhen does fairness matter?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"When locks are held relatively long, or requests arrive slowly enough that barging rarely helps — and starvation must be avoided\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always\",\"correct\":false,\"feedback\":\"\u003cp\u003eMost programs never need fairness, and pay for it heavily if they ask for it.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Starvation\\\" data-def=\\\"A thread is perpetually denied access to a resource it needs, such as CPU time or a lock, so it can\u0026amp;#39;t progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eStarvation\u003c/button\u003e\"]},\"jcip-explicit-locks/choosing-a-lock/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-6\",\"prompt\":\"\u003cp\u003eSynchronized or ReentrantLock?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Plain mutual exclusion around a block of code\",\"Timed or polled lock attempts\",\"Interruptible lock acquisition\",\"Non-block-structured locking, like hand-over-hand\"],\"right\":[\"\u003ccode\u003esynchronized\u003c/code\u003e — simpler, and impossible to forget to unlock\",\"\u003ccode\u003eReentrantLock.tryLock\u003c/code\u003e\",\"\u003ccode\u003eReentrantLock.lockInterruptibly\u003c/code\u003e\",\"\u003ccode\u003eReentrantLock\u003c/code\u003e — \u003ccode\u003elock\u003c/code\u003e and \u003ccode\u003eunlock\u003c/code\u003e in different scopes\"],\"rightOrder\":[3,1,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ReentrantLock\\\" data-def=\\\"An explicit lock with the same semantics as \u0026lt;code\u0026gt;synchronized\u0026lt;/code\u0026gt;, plus timed and interruptible acquisition, \u0026lt;code\u0026gt;tryLock\u0026lt;/code\u0026gt;, fairness and multiple conditions. Must be unlocked in a \u0026lt;code\u0026gt;finally\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eReentrantLock\u003c/button\u003e\"]},\"jcip-explicit-locks/choosing-a-lock/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-explicit-locks/choosing-a-lock/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSince Java 6, intrinsic locking performs about as well as ReentrantLock, so performance isn\u0026#39;t a reason to switch.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Use ReentrantLock only when you need something intrinsic locking doesn't provide; otherwise prefer \",\"html\":\"Use ReentrantLock only when you need something intrinsic locking doesn\u0026#39;t provide; otherwise prefer \"},{\"answers\":[\"synchronized\"],\"size\":12,\"choices\":[\"synchronized\",\"exception\",\"finalizers\",\"final\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"jcip-explicit-locks/read-write-locks/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-explicit-locks/read-write-locks/step-2\",\"prompt\":\"\u003cp\u003eWho can proceed?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Several threads want the read lock; no writer holds the lock\",\"A thread wants the write lock; two readers hold the read lock\",\"A thread wants the read lock; a writer holds the write lock\"],\"right\":[\"All of them, at the same time\",\"It waits until both readers release\",\"It waits until the writer releases\"],\"rightOrder\":[2,0,1]},\"jcip-explicit-locks/read-write-locks/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-explicit-locks/read-write-locks/step-4\",\"prompt\":\"\u003cp\u003eWhen does a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Read-write lock\\\" data-def=\\\"Allows many readers at once, or a single writer. Pays off for read-mostly data.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eread-write lock\u003c/button\u003e beat a plain lock?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"When data is read far more often than written, and reads take long enough to matter\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Always — it never hurts\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s more complex, so it\u0026#39;s slower when reads and writes are balanced or critical sections are tiny.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-explicit-locks/read-write-locks/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-explicit-locks/read-write-locks/step-5\",\"prompt\":\"\u003cp\u003eA thread holds the read lock and wants to update the data. Can \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Read-write lock\\\" data-def=\\\"Allows many readers at once, or a single writer. Pays off for read-mostly data.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eReentrantReadWriteLock\u003c/code\u003e\u003c/button\u003e upgrade it to the write lock?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDowngrading — taking the read lock while holding the write lock, then releasing the write lock — is allowed.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIf two threads each hold the read lock and both try to upgrade, each waits for the other to release its read lock before the write lock can be granted.\u003c/p\u003e\\n\u003cp\u003eNeither will, so they deadlock.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eReentrantReadWriteLock\u003c/code\u003e therefore doesn\u0026#39;t allow upgrading: release the read lock, acquire the write lock, and re-check the state, since it may have changed in between.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, call \u003ccode\u003ewriteLock().lock()\u003c/code\u003e while holding the read lock\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat deadlocks — the writer waits for all readers to leave, including itself.\u003c/p\u003e\\n\"},{\"html\":\"No — upgrading would deadlock if two readers tried it at once; release the read lock and acquire the write lock instead\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\"]},\"jcip-explicit-locks/read-write-locks/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-explicit-locks/read-write-locks/step-6\",\"prompt\":\"\u003cp\u003eGet the shared lock.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Lock r = rwl.\"},{\"answers\":[\"readLock\"],\"size\":8,\"choices\":[\"readLock\",\"finally\",\"unlock\",\"true\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false},\"jcip-custom-synchronizers/state-dependence/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-custom-synchronizers/state-dependence/step-3\",\"prompt\":\"\u003cp\u003eMatch each bounded-buffer design to its problem.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Throw an exception when empty\",\"Poll and sleep in a loop\",\"A condition queue (\u003ccode\u003ewait\u003c/code\u003e and \u003ccode\u003enotifyAll\u003c/code\u003e)\"],\"right\":[\"The caller has to retry — busy-waiting, or sleeping, in their own code\",\"Too short a sleep wastes CPU; too long adds latency\",\"The thread sleeps until woken — efficient and responsive\"],\"rightOrder\":[0,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Condition queue\\\" data-def=\\\"A set of threads waiting for some condition to become true. Each object\u0026amp;#39;s intrinsic lock has one, used by \u0026lt;code\u0026gt;wait\u0026lt;/code\u0026gt;/\u0026lt;code\u0026gt;notify\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCondition queue\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ewait\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"notifyAll\\\" data-def=\\\"Wakes every thread waiting on this object\u0026amp;#39;s condition queue. Safer than \u0026lt;code\u0026gt;notify\u0026lt;/code\u0026gt; when threads wait for different conditions.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003enotifyAll\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLatency\u003c/button\u003e\"]},\"jcip-custom-synchronizers/state-dependence/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-custom-synchronizers/state-dependence/step-4\",\"prompt\":\"\u003cp\u003eWhy must \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003ewait\u003c/code\u003e\u003c/button\u003e be called while holding the object\u0026#39;s lock?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCalling \u003ccode\u003ewait\u003c/code\u003e without holding the lock throws \u003ccode\u003eIllegalMonitorStateException\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe predicate — for example, \u0026quot;the buffer isn\u0026#39;t empty\u0026quot; — reads state guarded by the lock, so it must be checked while holding the lock.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ewait\u003c/code\u003e then releases that lock atomically as the thread goes to sleep, and reacquires it before returning.\u003c/p\u003e\\n\u003cp\u003eWithout the lock, another thread could make the predicate true and notify between your check and your \u003ccode\u003ewait\u003c/code\u003e, and you\u0026#39;d sleep through the signal forever.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The condition is part of object state guarded by that lock; checking it and starting to wait must be atomic, or a wake-up can be missed\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s just a Java rule with no reason\",\"correct\":false,\"feedback\":\"\u003cp\u003eWithout the lock, a notify could happen between your check and your wait — and you\u0026#39;d sleep forever.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Guarded by\\\" data-def=\\\"The lock that must be held to access a variable. Every access — read or write — must hold the same lock.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eGuarded by\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},\"jcip-custom-synchronizers/state-dependence/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-custom-synchronizers/state-dependence/step-5\",\"prompt\":\"\u003cp\u003eWait for a condition properly.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"while (isEmpty()) \"},{\"answers\":[\"wait\"],\"size\":4,\"choices\":[\"wait\",\"await\",\"newVirtualThreadPerTaskExecutor\",\"putIfAbsent\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false},\"jcip-custom-synchronizers/condition-queues/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-custom-synchronizers/condition-queues/step-3\",\"prompt\":\"\u003cp\u003eWhy must you test the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Condition predicate\\\" data-def=\\\"The test a thread waits on, like \u0026amp;quot;the queue is not empty\u0026amp;quot;. Always re-check it in a loop after waking.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econdition predicate\u003c/button\u003e in a \u003ccode\u003ewhile\u003c/code\u003e loop, not an \u003ccode\u003eif\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eReturning from \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003ewait\u003c/code\u003e\u003c/button\u003e is a hint that something changed, not a guarantee the predicate holds.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ewait\u003c/code\u003e can return for several reasons: the condition you wanted became true, another condition sharing the same queue changed, another thread already consumed what you were waiting for, or a spurious wakeup with no notification at all.\u003c/p\u003e\\n\u003cp\u003eSo waking up only means \u0026quot;something may have changed\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eRe-testing in a \u003ccode\u003ewhile\u003c/code\u003e loop makes the thread go back to waiting if the condition still isn\u0026#39;t true.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A woken thread may find the predicate false — another thread got there first, notifyAll woke everyone, or a spurious wakeup occurred\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Loops are faster than if statements\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Spurious wakeup\\\" data-def=\\\"A thread returns from \u0026lt;code\u0026gt;wait\u0026lt;/code\u0026gt; without being notified. That\u0026amp;#39;s allowed, so \u0026lt;code\u0026gt;wait\u0026lt;/code\u0026gt; must be called in a loop that re-checks the condition.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eSpurious wakeup\u003c/button\u003e\"]},\"jcip-custom-synchronizers/condition-queues/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-custom-synchronizers/condition-queues/step-4\",\"prompt\":\"\u003cp\u003eMatch each rule for using \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"wait\\\" data-def=\\\"Releases the object\u0026amp;#39;s lock and suspends the thread until notified (or interrupted), then reacquires the lock before returning.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003ewait\u003c/code\u003e\u003c/button\u003e to the bug it prevents.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Test the predicate before waiting\",\"Wait in a loop\",\"Hold the lock while testing and waiting\"],\"right\":[\"Sleeping when the condition is already true\",\"Proceeding when the condition is false after waking\",\"A missed signal between the test and the wait\"],\"rightOrder\":[2,1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Missed signal\\\" data-def=\\\"A thread starts waiting for a condition that already became true — and its notification was sent before it waited.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eMissed signal\u003c/button\u003e\"]},\"jcip-custom-synchronizers/condition-queues/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-custom-synchronizers/condition-queues/step-6\",\"prompt\":\"\u003cp\u003eSeveral threads wait on the same object, for \u003cstrong\u003edifferent\u003c/strong\u003e predicates (not-full and not-empty). Is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"notify\\\" data-def=\\\"Wakes one arbitrary thread waiting on this object\u0026amp;#39;s condition queue. Can wake the wrong one if waiters wait for different things.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003enotify\u003c/code\u003e\u003c/button\u003e safe?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003enotify\u003c/code\u003e only when all waiters wait for the same predicate and each notification enables exactly one of them. Otherwise, \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"notifyAll\\\" data-def=\\\"Wakes every thread waiting on this object\u0026amp;#39;s condition queue. Safer than \u0026lt;code\u0026gt;notify\u0026lt;/code\u0026gt; when threads wait for different conditions.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003enotifyAll\u003c/code\u003e\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"$2e\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — it wakes one arbitrary thread, which may be waiting for the other predicate; the right thread stays asleep\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, it\u0026#39;s more efficient than notifyAll\",\"correct\":false,\"feedback\":\"\u003cp\u003eMore efficient, but only correct under narrow conditions.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-custom-synchronizers/condition-queues/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-custom-synchronizers/condition-queues/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Whenever you wait on a condition, make sure someone will perform a \",\"html\":\"Whenever you wait on a condition, make sure someone will perform a \"},{\"answers\":[\"notification\"],\"size\":12,\"choices\":[\"notification\",\"exception\",\"synchronized\",\"int\"]},{\"text\":\" whenever the condition predicate becomes true.\",\"html\":\" whenever the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Condition predicate\\\" data-def=\\\"The test a thread waits on, like \u0026amp;quot;the queue is not empty\u0026amp;quot;. Always re-check it in a loop after waking.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econdition predicate\u003c/button\u003e becomes true.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-custom-synchronizers/explicit-conditions/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-custom-synchronizers/explicit-conditions/step-3\",\"prompt\":\"$2f\",\"explanation\":\"\u003cp\u003eFewer wake-ups means fewer \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Context switch\\\" data-def=\\\"The CPU stops one thread and starts another, saving and restoring registers and disturbing caches. Costs thousands of cycles.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtext switches\u003c/button\u003e and lock acquisitions.\u003c/p\u003e\ ":\"\u003cp\u003eThe count still ends at 2 — a failed CAS just means try again.\u003c/p\u003e\\n\"},{\"html\":\"Read \u003ccode\u003ecount\u003c/code\u003e again and retried, so no update was lost\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"jcip-atomics/compare-and-swap/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-atomics/compare-and-swap/step-4\",\"prompt\":\"\u003cp\u003eComplete a CAS-based increment — retry until the swap succeeds.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s essentially what \u003ccode\u003eincrementAndGet()\u003c/code\u003e does for you.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"int v;\\ndo {\\n    v = value.get();\\n} while (!value.\"},{\"answers\":[\"compareAndSet\"],\"size\":13,\"choices\":[\"putIfAbsent\",\"AtomicStampedReference\",\"compareAndSet\",\"invokeLater\"]},{\"text\":\"(v, v + 1));\\n\"}],\"code\":true,\"caseSensitive\":false},\"jcip-atomics/compare-and-swap/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-atomics/compare-and-swap/step-6\",\"prompt\":\"\u003cp\u003eUnder heavy \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtention\u003c/button\u003e, many threads \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e the same variable and most fail. Is that worse than locking?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eJCIP\u0026#39;s measurements found atomics scale better than locks at low and moderate contention, and locks only catch up at very high contention.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA lock makes losing threads sleep, which costs a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Context switch\\\" data-def=\\\"The CPU stops one thread and starts another, saving and restoring registers and disturbing caches. Costs thousands of cycles.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003econtext switch\u003c/button\u003e to suspend them and another to wake them.\u003c/p\u003e\\n\u003cp\u003eA failed CAS costs only a retry, done while the thread keeps running.\u003c/p\u003e\\n\u003cp\u003eAt moderate contention, retries are cheap and rare, so atomics win; at extreme contention, many threads burn CPU retrying the same location, and a lock\u0026#39;s queueing can catch up.\u003c/p\u003e\\n\u003cp\u003eReal programs mostly do other work between updates, which keeps contention in the range where atomics shine.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"CAS never fails\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt fails whenever another thread changed the value first.\u003c/p\u003e\\n\"},{\"html\":\"It can be at extreme contention, but at realistic levels atomics usually outperform locks — failed threads retry instead of being suspended\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\"]},\"jcip-atomics/compare-and-swap/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-atomics/compare-and-swap/step-7\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Compare-and-swap\",\"Optimistic concurrency\",\"Pessimistic concurrency\"],\"right\":[\"Atomically set a value only if it still equals an expected value\",\"Proceed hoping for no interference; detect it and retry if there was\",\"Prevent interference up front, by locking\"],\"rightOrder\":[2,1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompare-and-swap\u003c/button\u003e\"]},\"jcip-atomics/atomic-variables/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-atomics/atomic-variables/step-2\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic variable\\\" data-def=\\\"\u0026amp;quot;Better volatiles\u0026amp;quot;: classes like \u0026lt;code\u0026gt;AtomicInteger\u0026lt;/code\u0026gt; with atomic compound operations such as \u0026lt;code\u0026gt;incrementAndGet\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;compareAndSet\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eAtomicInteger\u003c/code\u003e\u003c/button\u003e method to what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eincrementAndGet()\u003c/code\u003e\",\"\u003ccode\u003egetAndIncrement()\u003c/code\u003e\",\"\u003ccode\u003ecompareAndSet(expect, update)\u003c/code\u003e\",\"\u003ccode\u003eupdateAndGet(fn)\u003c/code\u003e\"],\"right\":[\"Add one and return the new value\",\"Add one and return the old value\",\"Set to update only if the current value equals expect\",\"Apply a function atomically, retrying on contention\"],\"rightOrder\":[3,1,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Contention\\\" data-def=\\\"Several threads wanting the same lock at once. Contended locks cost context switches and serialize work.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eContention\u003c/button\u003e\"]},\"jcip-atomics/atomic-variables/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-atomics/atomic-variables/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eNumberRange\u003c/code\u003e must keep \u003ccode\u003elower \u0026lt;= upper\u003c/code\u003e. Why does this approach preserve the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Invariant\\\" data-def=\\\"A condition that must always hold for an object to be valid, e.g. \u0026lt;code\u0026gt;lower \u0026amp;lt;= upper\u0026lt;/code\u0026gt;. Variables in the same invariant must be updated atomically.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einvariant\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe invariant \u003ccode\u003elower \u0026lt;= upper\u003c/code\u003e involves two values, so updating them as two separate atomic variables leaves a moment where one has changed and the other hasn\u0026#39;t.\u003c/p\u003e\\n\u003cp\u003ePutting both bounds in one immutable object and holding it in a single \u003ccode\u003eAtomicReference\u003c/code\u003e makes the pair change in one step: a thread builds a new range, checks the invariant on it, and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCASes\u003c/button\u003e the reference.\u003c/p\u003e\\n\u003cp\u003eIf another thread changed the range in the meantime, the CAS fails and the thread retries with fresh values — no lock, and no half-updated state is ever visible.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$32\",\"options\":[{\"html\":\"Both bounds change together by swapping one reference, and the swap only succeeds if nobody changed the pair since it was read\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eAtomicReference\u003c/code\u003e locks both fields\",\"correct\":false,\"feedback\":\"\u003cp\u003eNo locks are involved; it\u0026#39;s a single \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCAS\u003c/button\u003e on a reference.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic variable\\\" data-def=\\\"\u0026amp;quot;Better volatiles\u0026amp;quot;: classes like \u0026lt;code\u0026gt;AtomicInteger\u0026lt;/code\u0026gt; with atomic compound operations such as \u0026lt;code\u0026gt;incrementAndGet\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;compareAndSet\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic variable\u003c/button\u003e\"]},\"jcip-atomics/atomic-variables/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-atomics/atomic-variables/step-6\",\"prompt\":\"\u003cp\u003eShould \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomic\u003c/button\u003e classes be used as keys in a \u003ccode\u003eHashMap\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, they\u0026#39;re thread-safe\",\"correct\":false,\"feedback\":\"\u003cp\u003eThread-safe doesn\u0026#39;t make them good keys; their identity-based equality and mutability do the opposite.\u003c/p\u003e\\n\"},{\"html\":\"No — they\u0026#39;re mutable and don\u0026#39;t override \u003ccode\u003eequals\u003c/code\u003e and \u003ccode\u003ehashCode\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread safety\u003c/button\u003e\"]},\"jcip-atomics/nonblocking-algorithms/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-2\",\"prompt\":\"\u003cp\u003ePut one attempt to \u003ccode\u003epop\u003c/code\u003e from a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Treiber stack\\\" data-def=\\\"A nonblocking stack that pushes and pops by CASing its top pointer.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eTreiber stack\u003c/button\u003e in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe whole operation is a single CAS on one reference, so there\u0026#39;s never a half-done state for others to see.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Read the current head into \u003ccode\u003eoldHead\u003c/code\u003e; return null if it\u0026#39;s empty\",\"Read \u003ccode\u003eoldHead.next\u003c/code\u003e into \u003ccode\u003enewHead\u003c/code\u003e\",\"CAS the top from \u003ccode\u003eoldHead\u003c/code\u003e to \u003ccode\u003enewHead\u003c/code\u003e\",\"If the CAS failed, another thread changed the top — start over\"],\"start\":[2,0,1,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompare-and-swap\u003c/button\u003e\"]},\"jcip-atomics/nonblocking-algorithms/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-4\",\"prompt\":\"\u003cp\u003eWhy is a linked queue harder than a stack?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe Michael–Scott queue handles it by letting any thread finish another thread\u0026#39;s half-done insert, helping it along.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA stack changes one reference per operation — the top — so a single CAS publishes the whole change.\u003c/p\u003e\\n\u003cp\u003eAdding to a linked queue changes two: the old tail\u0026#39;s \u003ccode\u003enext\u003c/code\u003e and the queue\u0026#39;s \u003ccode\u003etail\u003c/code\u003e pointer, and no CAS can update both at once.\u003c/p\u003e\\n\u003cp\u003eThe Michael–Scott algorithm lets the queue sit in an intermediate state where \u003ccode\u003enext\u003c/code\u003e is set but \u003ccode\u003etail\u003c/code\u003e lags; any thread that sees this state first helps finish the other thread\u0026#39;s insert by advancing \u003ccode\u003etail\u003c/code\u003e, then does its own work.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Adding a node updates two references — the old tail\u0026#39;s \u003ccode\u003enext\u003c/code\u003e and the tail pointer — which can\u0026#39;t be changed in one CAS\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Queues need locks by definition\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eConcurrentLinkedQueue\u003c/code\u003e is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock-free\\\" data-def=\\\"Some thread always makes progress, even though individual threads may have to retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock-free\u003c/button\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompare-and-swap\u003c/button\u003e\"]},\"jcip-atomics/nonblocking-algorithms/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-6\",\"prompt\":\"\u003cp\u003eWhy is \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ABA problem\\\" data-def=\\\"A value changes from A to B and back to A between your read and your CAS, so the CAS succeeds even though things changed. Fixed with a version stamp.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eABA\u003c/button\u003e rarely a problem in Java\u0026#39;s own \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Nonblocking algorithm\\\" data-def=\\\"An algorithm where a thread\u0026amp;#39;s failure or suspension can\u0026amp;#39;t stop others from progressing. Built on CAS instead of locks.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003enonblocking\u003c/button\u003e collections?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIn languages where nodes are freed and recycled manually, ABA is a classic source of bugs.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eABA happens when a thread reads value A, another thread changes it to B and back to A, and the first thread\u0026#39;s CAS succeeds because it only sees A again — even though the structure changed.\u003c/p\u003e\\n\u003cp\u003eIn C, a freed node\u0026#39;s memory can be reused for a new node at the same address, which is how this arises in practice.\u003c/p\u003e\\n\u003cp\u003eIn Java, a node can\u0026#39;t be reused while any thread still holds a reference to it, because the garbage collector won\u0026#39;t free it, so the classic ABA scenario can\u0026#39;t occur for references.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Garbage collection means a node can\u0026#39;t be reused while any thread still holds a reference to it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Java\u0026#39;s CAS checks the full history\",\"correct\":false,\"feedback\":\"\u003cp\u003eCAS only compares current values.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eCompare-and-swap\u003c/button\u003e\"]},\"jcip-atomics/nonblocking-algorithms/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-atomics/nonblocking-algorithms/step-7\",\"prompt\":\"\u003cp\u003eA reference paired with a version counter.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"AtomicStampedReference\u003cNode\u003e top = new \"},{\"answers\":[\"AtomicStampedReference\"],\"size\":22,\"choices\":[\"compareAndSet\",\"AtomicStampedReference\",\"withInitial\",\"threadNumber\"]},{\"text\":\"\u003c\u003e(null, 0);\"}],\"code\":true,\"caseSensitive\":false},\"jcip-memory-model/happens-before/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-memory-model/happens-before/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ea\u003c/code\u003e, \u003ccode\u003eb\u003c/code\u003e, \u003ccode\u003ex\u003c/code\u003e, \u003ccode\u003ey\u003c/code\u003e start at 0, with no synchronization. Can the result be x = 0 and y = 0?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEvery combination — (1, 0), (0, 1), (1, 1) and (0, 0) — is possible.\u003c/p\u003e\\n\",\"details\":\"$33\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"No — at least one write must happen first\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat reasoning assumes a single global order of operations. Without synchronization, there isn\u0026#39;t one.\u003c/p\u003e\\n\"},{\"html\":\"Yes — each thread\u0026#39;s two actions may be reordered, or its write may not yet be visible to the other\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jcip-memory-model/
