 Practice\\\"\u003evisibility\u003c/button\u003e, it\u0026#39;s good practice to make all fields \"},{\"answers\":[\"final\"],\"size\":5,\"choices\":[\"current\",\"safely\",\"invariants\",\"final\"]},{\"text\":\" unless they need to be mutable.\",\"html\":\" unless they need to be mutable.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-sharing-objects/immutability/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-sharing-objects/immutability/step-7\",\"prompt\":\"\u003cp\u003eAre immutable objects inefficient, since every change needs a new object?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, always\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Rarely — allocation is cheap, and immutability removes locking, defensive copies and generational GC costs\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\"]},\"jcip-sharing-objects/safe-publication/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-sharing-objects/safe-publication/step-2\",\"prompt\":\"\u003cp\u003eOne thread runs \u003ccode\u003eholder = new Holder(42);\u003c/code\u003e (a plain public field). Another calls \u003ccode\u003eholder.assertSanity()\u003c/code\u003e.\\nCan it throw?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe problem isn\u0026#39;t the \u003ccode\u003eHolder\u003c/code\u003e class; it\u0026#39;s how it was published.\u003c/p\u003e\\n\",\"details\":\"$21\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$22\",\"answers\":\"$undefined\",\"options\":[{\"html\":\" rency in Practice\\\"\u003eBlocking queue\u003c/button\u003e\"]},\"jcip-sharing-objects/safe-publication/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-sharing-objects/safe-publication/step-6\",\"prompt\":\"\u003cp\u003eYou put a \u003ccode\u003eDate\u003c/code\u003e into a \u003ccode\u003eCollections.synchronizedMap\u003c/code\u003e and nobody ever modifies it. Do readers need to lock the \u003ccode\u003eDate\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — it\u0026#39;s effectively immutable, and putting it in the synchronized map published it safely\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, always\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s only needed for objects that are still modified after \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Publication\\\" data-def=\\\"Making an object available to code outside its current scope — storing it in a shared field, returning it, passing it to another class.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003epublication\u003c/button\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Effectively immutable\\\" data-def=\\\"An object that is technically mutable but never modified after publication. Safe to use without locks once safely published.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eEffectively immutable\u003c/button\u003e\"]},\"jcip-sharing-objects/safe-publication/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-sharing-objects/safe-publication/step-7\",\"prompt\":\"\u003cp\u003eComplete the summary.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Immutable objects can be published through \",\"html\":\"Immutable objects can be published through \"},{\"answers\":[\"any\"],\"size\":3,\"choices\":[\"visibility\",\"any\",\"current\",\"common\"]},{\"text\":\" mechanism; effectively immutable objects must be \",\"html\":\" mechanism; \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Effectively immutable\\\" data-def=\\\"An object that is technically mutable but never modified after publication. Safe to use without locks once safely published.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eeffectively immutable\u003c/button\u003e objects must be \"},{\"answers\":[\"safely\"],\"size\":6,\"choices\":[\"invariants\",\"safely\",\"final\",\"common\"]},{\"text\":\" published.\",\"html\":\" published.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-sharing-objects/safe-publication/step-8\":{\"id\":\"step-8\",\"key\":\"jcip-sharing-objects/safe-publication/step-8\",\"prompt\":\"\u003cp\u003eMatch each sharing policy to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Thread-confined\",\"Shared read-only\",\"Shared thread-safe\",\"Guarded\"],\"right\":[\"Owned and modified by exactly one thread\",\"Accessed concurrently without synchronization, never modified\",\"Synchronizes internally; callers just use its public interface\",\"Accessed only with a specific lock held\"],\"rightOrder\":[1,0,3,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread confinement\\\" data-def=\\\"Only one thread ever accesses the data, so it needs no synchronization.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread confinement\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\ l\":\"\u003ccode\u003eConcurrentModificationException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Concurrent collection\\\" data-def=\\\"Collections designed for concurrent access, like \u0026lt;code\u0026gt;ConcurrentHashMap\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;CopyOnWriteArrayList\u0026lt;/code\u0026gt; — better scalability than synchronized collections.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eConcurrent collections\u003c/button\u003e\u0026#39; iterators never throw it.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Weakly consistent\\\" data-def=\\\"An iterator that tolerates concurrent modification — it may or may not reflect changes made after it was created, but never throws.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eWeakly consistent\u003c/button\u003e\"]},\"jcip-building-blocks/concurrent-collections/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-building-blocks/concurrent-collections/step-7\",\"prompt\":\"\u003cp\u003eWhich workload suits \u003ccode\u003eCopyOnWriteArrayList\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"An event-listener list — iterated on every event, modified only when listeners register or unregister\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"A queue of jobs added and removed thousands of times a second\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach write copies the whole array, so frequent writes are very expensive.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-building-blocks/blocking-queues/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-building-blocks/blocking-queues/step-3\",\"prompt\":\"\u003cp\u003eProducers suddenly generate work much faster than consumers can handle. What does a \u003cstrong\u003ebounded\u003c/strong\u003e queue do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eBounded queues\u003c/button\u003e are a powerful resource-management tool — they make overload visible early instead of exhausting memory.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWith an unbounded queue, producers keep adding work no matter how far behind consumers are; the queue grows until memory runs out, often long after the overload began.\u003c/p\u003e\\n\u003cp\u003eA bounded queue fills up and then makes \u003ccode\u003eput\u003c/code\u003e block, so producers automatically slow to the rate consumers can sustain.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s back-pressure: overload becomes visible and self-limiting, and you can choose how to handle it, for example with \u003ccode\u003eoffer\u003c/code\u003e and a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003etimeout\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Fills up, then blocks producers in \u003ccode\u003eput\u003c/code\u003e — slowing them to the consumers\u0026#39; pace\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Grows until memory runs out\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what an unbounded queue does.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-building-blocks/blocking-queues/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-building-blocks/blocking-queues/step-4\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Blocking queue\\\" data-def=\\\"A queue whose \u0026lt;code\u0026gt;put\u0026lt;/code\u0026gt; waits when full and \u0026lt;code\u0026gt;take\u0026lt;/code\u0026gt; waits when empty — the backbone of producer-consumer designs.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eBlockingQueue\u003c/code\u003e\u003c/button\u003e implementation to its behaviour.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eLinkedBlockingQueue\u003c/code\u003e / \u003ccode\u003eArrayBlockingQueue\u003c/code\u003e\",\"\u003ccode\u003ePriorityBlockingQueue\u003c/code\u003e\",\"\u003ccode\u003eSynchronousQueue\u003c/code\u003e\"],\"right\":[\"FIFO queues, bounded or unbounded\",\"Orders elements by priority instead of arrival\",\"No storage at all — each put waits for a take, a direct hand-off\"],\"rightOrder\":[0,2,1]},\"jcip-building-blocks/blocking-queues/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-building-blocks/blocking-queues/step-5\",\"prompt\":\"\u003cp\u003eA producer puts a mutable object into a queue and never touches it again; a consumer takes it. Does the object need its own locking?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — \u003cstrong\u003eserial thread confinement\u003c/strong\u003e; the queue publishes it safely and ownership passes to the consumer\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, always\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly "jcip-task-execution/tasks-and-threads/step-4\",\"prompt\":\"\u003cp\u003eWhich are real costs of unbounded thread creation?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Threads can\u0026#39;t share objects\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can; that\u0026#39;s what most of this book is about managing.\u003c/p\u003e\\n\"},{\"html\":\"There\u0026#39;s a limit on how many threads can be created; hitting it typically causes \u003ccode\u003eOutOfMemoryError\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Creating and tearing down threads takes time, adding latency to every request\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Idle threads use memory, and more runnable threads than processors means competition for CPUs\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Latency\\\" data-def=\\\"How long one piece of work takes from start to finish.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eLatency\u003c/button\u003e\"]},\"jcip-task-execution/tasks-and-threads/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-task-execution/tasks-and-threads/step-5\",\"prompt\":\"\u003cp\u003eThread-per-task works fine in testing with 10 users. What happens at a sudden 10,000?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe right answer is to bound the number of threads, which is what the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor framework\u003c/button\u003e is for.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach thread needs memory for its stack — often around a megabyte reserved — and the OS can only manage so many.\u003c/p\u003e\\n\u003cp\u003eA burst of 10,000 requests creates 10,000 threads; context-switching among them slows everything, memory runs short, and eventually thread creation fails with \u003ccode\u003eOutOfMemoryError\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe failure is abrupt rather than gradual. A bounded pool with a queue degrades gracefully instead.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It slows down gracefully\",\"correct\":false,\"feedback\":\"\u003cp\u003eGraceful degradation needs a bound on the work in progress — exactly what thread-per-task lacks.\u003c/p\u003e\\n\"},{\"html\":\"It may crash — throughput collapses well before that, with no graceful degradation\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Throughput\\\" data-def=\\\"How much work gets done per unit of time.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThroughput\u003c/button\u003e\"]},\"jcip-task-execution/tasks-and-threads/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-task-execution/tasks-and-threads/step-6\",\"prompt\":\"\u003cp\u003eComplete the summary.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Processing tasks \",\"html\":\"Processing tasks \"},{\"answers\":[\"sequentially\"],\"size\":12,\"choices\":[\"resource\",\"sequentially\",\"independent\",\"happens-before\"]},{\"text\":\" gives poor responsiveness; creating a thread per task gives poor \",\"html\":\" gives poor responsiveness; creating a thread per task gives poor \"},{\"answers\":[\"resource\"],\"size\":8,\"choices\":[\"uncontended\",\"open\",\"resource\",\"sequentially\"]},{\"text\":\" management.\",\"html\":\" management.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-task-execution/executor-framework/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-task-execution/executor-framework/step-2\",\"prompt\":\"\u003cp\u003eMatch each factory to the pool it builds.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003enewFixedThreadPool(n)\u003c/code\u003e\",\"\u003ccode\u003enewCachedThreadPool()\u003c/code\u003e\",\"\u003ccode\u003enewSingleThreadExecutor()\u003c/code\u003e\",\"\u003ccode\u003enewScheduledThreadPool(n)\u003c/code\u003e\"],\"right\":[\"Up to n threads; extra tasks wait in a queue\",\"Grows without limit, reusing idle threads\",\"One thread; tasks run one at a time, in order\",\"Runs tasks after a delay or periodically\"],\"rightOrder\":[3,2,1,0]},\"jcip-task-execution/executor-framework/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-task-execution/executor-framework/step-4\",\"prompt\":\"\u003cp\u003eA program creates an \u003ccode\u003eExecutorService\u003c/code\u003e but never shuts it down. What happens when \u003ccode\u003emain\u003c/code\u003e returns?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe JVM exits only when all non-daemon threads have finished.\u003c/p\u003e\\n\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor\u003c/button\u003e worker threads are non-daemon by default, and an idle pool keeps them waiting for new tasks.\u003c/p\u003e\\n\u003cp\u003eSo without \u003ccode\u003eshutdown()\u003c/code\u003e, \u003ccode\u003emain\u003c/code\u003e returns but the process lives on. Always shut down executors you create.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The JVM keeps running, because the pool\u0026#39;s non-daemon threads are still alive\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The JVM exits normally\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe JVM exits only when all non-daemon threads have finished — and idle pool threads never do.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-task-execution/executor-framework/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-task-execution/executor-framework/step-5\",\"prompt\":\"\u003cp\u003eWhy prefer \u003ccode\u003eScheduledThreadPoolExecutor\u003c/code\u003e over the old \u003ccode\u003ejava.util.Timer\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Timer is deprecated and removed\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s still there — it\u0026#39;s just poor at both timing accuracy and failure handling.\u003c/p\u003e\\n\"},{\"html\":\"A Timer has one thread, so a long task delays others; and an exception in one task kills the Timer for good\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-task-execution/executor-framework/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-task-execution/executor-framework/step-6\",\"prompt\":\"\u003cp\u003eStart a graceful shutdown.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"exec.\"},{\"answers\":[\"shutdown\"],\"size\":8,\"choices\":[\"readLock\",\"true\",\"shutdown\",\"NANOSECONDS\"]},{\"text\":\"(); exec.awaitTermination(30, TimeUnit.SECONDS);\"}],\"code\":true,\"caseSensitive\":false},\"jcip-task-execution/callable-and-future/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-task-execution/callable-and-future/step-3\",\"prompt\":\"\u003cp\u003eRendering text takes 1 s; downloading all images takes 10 s. How much does the background download save?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe real payoff comes from many independent, similar tasks — one per image, rendered as each arrives.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eRendering text (1 s) and downloading images (10 s) in parallel takes about 10 s, instead of 11 s sequentially — a saving of about 1 s.\u003c/p\u003e\\n\u003cp\u003eParallelizing two unequal tasks gains at most the shorter one\u0026#39;s time.\u003c/p\u003e\\n\u003cp\u003eThe big win comes from splitting the 10 s download into one task per image, running many at once and rendering each image as it arrives.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"About 10 s\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe page still can\u0026#39;t finish before the 10 s download does.\u003c/p\u003e\\n\"},{\"html\":\"Half the time\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"About 1 s — the tasks are very unequal, so running them in parallel gains little\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-task-execution/callable-and-future/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-task-execution/callable-and-future/step-5\",\"prompt\":\"\u003cp\u003eMatch each tool to its use.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"typ DS\",\"shutdown\"]},{\"text\":\");\"}],\"code\":true,\"caseSensitive\":false},\"jcip-cancellation/interruption/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-cancellation/interruption/step-2\",\"prompt\":\"\u003cp\u003eA producer checks a \u003ccode\u003ecancelled\u003c/code\u003e flag in its loop, but spends its time blocked in \u003ccode\u003equeue.put(p)\u003c/code\u003e because the queue is full and the consumer has stopped. You set \u003ccode\u003ecancelled = true\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s why \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Interruption\\\" data-def=\\\"A request to a thread to stop what it\u0026amp;#39;s doing. It sets a flag; blocking methods respond by throwing \u0026lt;code\u0026gt;InterruptedException\u0026lt;/code\u0026gt;. The thread decides how to react.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003einterruption\u003c/button\u003e is a better mechanism — blocking library methods respond to it.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cancellation\\\" data-def=\\\"Stopping a task before it finishes. In Java it\u0026amp;#39;s cooperative — the task must check and respond.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecancellation\u003c/button\u003e flag only works if the thread gets back to the code that checks it.\u003c/p\u003e\\n\u003cp\u003eThe producer is stuck inside \u003ccode\u003equeue.put\u003c/code\u003e, waiting for space that will never appear because the consumer stopped taking.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eput\u003c/code\u003e doesn\u0026#39;t know about your flag, so it waits forever. It does, however, respond to interruption — \u003ccode\u003einterrupt()\u003c/code\u003e makes it throw \u003ccode\u003eInterruptedException\u003c/code\u003e — which is why interruption is the rig \u003c/code\u003e, wrapped in an \u003ccode\u003eExecutionException\u003c/code\u003e. If no one does, it\u0026#39;s lost without a trace — a common reason background failures go unnoticed.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Yes, just as with \u003ccode\u003eexecute\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly tasks run with \u003ccode\u003eexecute\u003c/code\u003e reach the handler.\u003c/p\u003e\\n\"},{\"html\":\"No — \u003ccode\u003esubmit\u003c/code\u003e wraps the task, and the exception is stored in the \u003ccode\u003eFuture\u003c/code\u003e, rethrown from \u003ccode\u003eget\u003c/code\u003e as \u003ccode\u003eExecutionException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eFuture\u003c/button\u003e\"]},\"jcip-cancellation/abnormal-termination/step-5\":{\"id\":\"step-5\",\"key\":\"jcip-cancellation/abnormal-termination/step-5\",\"prompt\":\"\u003cp\u003eMatch each submission method to where a task\u0026#39;s exception goes.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eexecute(runnable)\u003c/code\u003e\",\"\u003ccode\u003esubmit(callable)\u003c/code\u003e\"],\"right\":[\"The thread\u0026#39;s uncaught exception handler\",\"The returned Future — thrown by \u003ccode\u003eget\u003c/code\u003e as \u003ccode\u003eExecutionException\u003c/code\u003e\"],\"rightOrder\":[1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eFuture\u003c/button\u003e\"]},\"jcip-cancellation/abnormal-termination/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-cancellation/abnormal-termination/step-6\",\"prompt\":\"\u003cp\u003eInstall a handler for a thread.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"t.\"},{\"answers\":[\"setUncaughtExceptionHandler\"],\"size\":27,\"choices\":[\"setUncaughtExceptionHandler\",\"shutdown\",\"true\",\"isInterrupted\"]},{\"text\":\"((thread, e) -\u003e log.severe(\\\"Thread \\\" + thread + \\\" died: \\\" + e));\"}],\"code\":true,\"caseSensitive\":false},\"jcip-cancellation/jvm-shutdown/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-cancellation/jvm-shutdown/step-2\",\"prompt\":\"\u003cp\u003eMatch each way the JVM can stop.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Orderly shutdown\",\"Abrupt shutdown\"],\"right\":[\"The last non-daemon thread ends, \u003ccode\u003eSystem.exit\u003c/code\u003e is called, or the process receives SIGINT (Ctrl-C)\",\"\u003ccode\u003eRuntime.halt\u003c/code\u003e is called, or the OS kills the process — no hooks run\"],\"rightOrder\":[1,0]},\"jcip-cancellation/jvm-shutdown/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-cancellation/jvm-shutdown/step-4\",\"prompt\":\"\u003cp\u003eTwo independent services each register a hook. One hook closes a log file the other hook writes to. What\u0026#39;s the risk?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA common fix is a single hook that shuts services down in a deliberate order.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"None — hooks run in registration order\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s no ordering guarantee between hooks.\u003c/p\u003e\\n\"},{\"html\":\"Hooks run concurrently, so one may close the file while the other still needs it\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-cancellation/jvm-shutdown/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-cancellation/jvm-shutdown/step-6\",\"prompt\":\"\u003cp\u003eWhat happens to \u003cstrong\u003edaemon\u003c/strong\u003e threads when the JVM exits?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Daemon thread\\\" data-def=\\\"A thread that doesn\u0026amp;#39;t stop the JVM from exiting. When only daemon threads remain, the JVM exits without running their \u0026lt;code\u0026gt;finally\u0026lt;/code\u0026gt; blocks.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edaemon threads\u003c/button\u003e sparingly, and never for tasks that perform I/O or must clean up.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They\u0026#39;re abandoned — no \u003ccode\u003efinally\u003c/code\u003e blocks run, and stacks aren\u0026#39;t unwound\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They finish their current task first\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe JVM doesn\u0026#39;t wait for daemon threads at all.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-cancellation/jvm-shutdown/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-cancellation/jvm-shutdown/step-7\",\"prompt\":\"\u003cp\u003eComplete the advice on finalizers.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Avoid \",\"html\":\"Avoid \"},{\"answers\":[\"finalizers\"],\"size\":10,\"choices\":[\"resource\",\"current\",\"finalizers\",\"notification\"]},{\"text\":\": in most cases `finally` blocks and explicit close methods manage resources better.\",\"html\":\": in most \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compare-and-swap\\\" data-def=\\\"An atomic CPU instruction: \u0026amp;quot;if the value is still X, set it to Y\u0026amp;quot;. Tells you whether it succeeded; on failure you usually retry.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ecases\u003c/button\u003e \u003ccode\u003efinally\u003c/code\u003e blocks and explicit close methods manage resources better.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-thread-pools/task-couplings/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-thread-pools/task-couplings/step-3\",\"prompt\":\"\u003cp\u003eA pool has \u003cstrong\u003eone\u003c/strong\u003e thread. Task A is running in it and submits task B, then waits for B\u0026#39;s result. B sits in the\\nqueue, waiting for a free thread. Model it: the pool thread is lock \u003cstrong\u003eP\u003c/strong\u003e, and B\u0026#39;s result is lock \u003cstrong\u003eR\u003c/strong\u003e, which A\\ncan only take once B has released it. \u003cstrong\u003eFind the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\u003c/strong\u003e\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA holds the only thread and waits for B; B waits for a thread. That\u0026#39;s \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread starvation deadlock\\\" data-def=\\\"Tasks in a pool wait on other tasks queued in the same pool, but every worker is busy waiting — nobody can make progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread starvation deadlock\u003c/button\u003e\u003c/strong\u003e — no locks\\nin your code, yet nothing can ever move again.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet Task B hold R (its result isn\u0026#39;t ready) and Task A hold the only thread, P.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"Task A\",\"ops\":[\"lock P\",\"submit B\",\"lock R\",\"use result\",\"unlock R\",\"unlock P\"]},{\"name\":\"Task B\",\"ops\":[\"lock R\",\"lock P\",\"compute\",\"unlock P\",\"unlock R\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eHow could this deadlock be avoided?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Give task B a higher priority\",\"correct\":false,\"feedback\":\"\u003cp\u003eB can\u0026#39;t run at any priority — there\u0026#39;s no free thread.\u003c/p\u003e\\n\"},{\"html\":\"Give the pool enough threads for both tasks, or don\u0026#39;t make a task wait on another task in the same pool\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Use a bounded queue\",\"correct\":false,\"feedback\":\"\u003cp\u003eB is already queued; a bounded queue doesn\u0026#39;t give it a thread.\u003c/p\u003e\\n\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Bounded queue\\\" data-def=\\\"A queue with a fixed capacity. When full, producers block — natural back-pressure that stops them from running out of memory.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eBounded queue\u003c/button\u003e\"]},\"jcip-thread-pools/task-couplings/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-thread-pools/task-couplings/step-4\",\"prompt\":\"\u003cp\u003eHow do you avoid \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread starvation deadlock\\\" data-def=\\\"Tasks in a pool wait on other tasks queued in the same pool, but every worker is busy waiting — nobody can make progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread starvation deadlock\u003c/button\u003e with dependent tasks?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThread starvation deadlock happens when tasks in a pool wait for other tasks in the same pool that can\u0026#39;t run because every thread is occupied by a waiting task.\u003c/p\u003e\\n\u003cp\u003eAn unbounded pool can always start the dependent task.\u003c/p\u003e\\n\u003cp\u003eWith a bounded pool, it must be big enough for the longest chain of dependencies, or dependent work must go to a separate pool.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Use an unbounded pool for them, or make the pool big enough for all the tasks that may wait on each other — and document the dependency\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Use a single-threaded executor\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the worst case — any dependent task \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlocks\u003c/button\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor\u003c/button\u003e\"]},\"jcip-thread-pools/task-couplings/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-thread-pools/task-couplings/step-6\",\"prompt\":\"\u003cp\u003eA pool mixes 50 ms requests with occasional 5-minute reports. What happens when several reports arrive at once?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse timed waits instead of unbounded blocking, and consider separate pools for different kinds of work.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They can tie up every thread, so short requests queue for minutes\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — the pool schedules fairly\",\"correct\":false,\"feedback\":\"\u003cp\u003eA pool thread runs a task to completion; it doesn\u0026#39;t preempt long tasks.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jcip-thread-pools/task-couplings/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-thread-pools/task-couplings/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Whenever you submit to an Executor tasks that are not \",\"html\":\"Whenever you submit to an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eExecutor\u003c/button\u003e tasks that are not \"},{\"answers\":[\"independent\"],\"size\":11,\"choices\":[\"any\",\"independent\",\"releases\",\"starvation\"]},{\"text\":\", be aware of the possibility of thread \",\"html\":\", be aware of the possibility of thread \"},{\"answers\":[\"starvation\"],\"size\":10,\"choices\":[\"independent\",\"exception\",\"resource\",\"starvation\"]},{\"text\":\" deadlock.\",\"html\":\" \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-thread-pools/sizing-thread-pools/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-3\",\"prompt\":\"\u003cp\u003eAn 8-core machine runs tasks that spend 90 ms waiting on a database for every 10 ms of computing.\\nAiming for full CPU utilisation, about how many threads should the pool have?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e8 × 1 × (1 + 90/10) = 80 threads.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe formula is threads = CPUs × target utilisation × (1 + wait time / compute time).\u003c/p\u003e\\n\u003cp\u003eEach task waits 90 ms for every 10 ms of computing, so a ratio of 9; with 8 CPUs at 100%: 8 × 1 × (1 + 9) = 80.\u003c/p\u003e\\n\u003cp\u003eIntuitively, each thread uses a CPU only a tenth of the time, so you need ten threads per core to keep it busy.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eW/C = 90 ÷ 10 = 9.\u003c/p\u003e\\n\",\"\u003cp\u003e8 × 1 × (1 + 9).\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"8\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s right for pure computation. These tasks spend 90% of their time waiting.\u003c/p\u003e\\n\"},{\"html\":\"9\",\"correct\":false,\"feedback\":\"\u003cp\u003eN + 1 is the rule for CPU-bound work. These tasks mostly wait.\u003c/p\u003e\\n\"},{\"html\":\"72\",\"correct\":false,\"feedback\":\"\u003cp\u003eClose — the formula multiplies by (1 + W/C), which is 10 here.\u003c/p\u003e\\n\"},{\"html\":\"80\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jcip-thread-pools/sizing-thread-pools/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-4\",\"prompt\":\"\u003cp\u003eAn 8-core machine runs tasks that wait 90 ms on a database for every 10 ms of computing. You want the CPUs only \u003cstrong\u003e50%\u003c/strong\u003e busy, to leave headroom. How many threads?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e8 × 0.5 × 10 = 40.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"4\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat ignores the waiting time.\u003c/p\u003e\\n\"},{\"html\":\"20\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe formula is 8 × 0.5 × (1 + 9).\u003c/p\u003e\\n\"},{\"html\":\"40\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"80\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s for 100% utilisation; halve it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"jcip-thread-pools/sizing-thread-pools/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-6\",\"prompt\":\"\u003cp\u003eTasks spend most of their time waiting on a database, so the formula suggests 80 threads. They share a JDBC connection pool of 10 connections. Does a pool of 80 threads still make sense?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe formula assumes the waiting is free, but here tasks wait on a database pool of 10 connections.\u003c/p\u003e\\n\u003cp\u003eOnly 10 tasks can run their queries at once; the other 70 threads just queue for connections, consuming memory without adding \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Throughput\\\" data-def=\\\"How much work gets done per unit of time.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethroughput\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eWhen tasks depend on a limited resource, the resource\u0026#39;s size bounds useful concurrency.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, CPU is all that matters\",\"correct\":false,\"feedback\":\"\u003cp\u003eMemory, file handles, sockets and database connections all limit how much concurrency helps.\u003c/p\u003e\\n\"},{\"html\":\"No — at most 10 tasks can use the database at once; other resources cap the useful pool size too\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-thread-pools/sizing-thread-pools/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-thread-pools/sizing-thread-pools/step-7\",\"prompt\":\"\u003cp\u003eFind the number of processors at run time.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"int nCpus = Runtime.getRuntime().\"},{\"answers\":[\"availableProcessors\"],\"size\":19,\"choices\":[\"threadNumber\",\"invokeLater\",\"newVirtualThreadPerTaskExecutor\",\"availableProcessors\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false},\"jcip-thread-pools/configuring-threadpoolexecutor/step-2\":{\"id\":\"step-2 ails\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Number-crunching that keeps every core busy\",\"correct\":false,\"feedback\":\"\u003cp\u003eCPU-bound work still needs one runnable thread per core; virtual threads don\u0026#39;t add CPUs.\u003c/p\u003e\\n\"},{\"html\":\"Thousands of concurrent requests that each spend most of their time waiting on I/O\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jcip-thread-pools/virtual-threads/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-thread-pools/virtual-threads/step-4\",\"prompt\":\"\u003cp\u003eShould you pool \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Virtual thread\\\" data-def=\\\"A lightweight thread managed by the JVM rather than the OS (Java 21). Millions can exist; blocking one is cheap.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evirtual threads\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eTo limit access to a scarce resource, like a database, use a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Semaphore\\\" data-def=\\\"Manages a fixed number of permits. \u0026lt;code\u0026gt;acquire\u0026lt;/code\u0026gt; takes one (waiting if none are left), \u0026lt;code\u0026gt;release\u0026lt;/code\u0026gt; gives one back. Used to bound how many threads use a resource.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003e\u003ccode\u003eSemaphore\u003c/code\u003e\u003c/button\u003e — not a small pool.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003ePooling exists to amortize the cost of creating expensive platform threads.\u003c/p\u003e\\n\u003cp\u003eVirtual threads cost about as much as a small object, so creating one per task is the intended model.\u003c/p\u003e\\n\u003cp\u003ePooling them would add complexity and limit concurrency for no benefit; when you ne ot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlocks\u003c/button\u003e and visibility work exactly as before.\u003c/p\u003e\\n\"},{\"html\":\"Thread safety, visibility, atomicity and the memory model — they\u0026#39;re still threads sharing memory\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread safety\\\" data-def=\\\"A class is thread-safe if it behaves correctly when used from multiple threads, however their execution is interleaved, with no extra synchronization by the caller.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread safety\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Visibility\\\" data-def=\\\"Whether a write by one thread is seen by another. Without synchronization there\u0026amp;#39;s no guarantee it ever will be.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eVisibility\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAtomic\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Java Memory Model\\\" data-def=\\\"The rules saying when a write by one thread is guaranteed to be visible to another, built on the happens-before relation.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eJava Memory Model\u003c/button\u003e\"]},\"jcip-thread-pools/virtual-threads/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-thread-pools/virtual-threads/step-7\",\"prompt\":\"\u003cp\u003eCreate an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eexecutor\u003c/button\u003e that starts a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Virtual thread\\\" data-def=\\\"A lightweight thread managed by the JVM rather than the OS (Java 21). Millions can exist; blocking one is cheap.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evirtual thread\u003c/button\u003e per task.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"var exec = Executors.\"},{\"answers\":[\"newVirtualThreadPerTaskExecutor\"],\"size\":31,\"choices\":[\"afterExecute\",\"availableProcessors\",\"invokeLater\",\"newVirtualThreadPerTaskExecutor\"]},{\"text\":\"();\"}],\"code\":true,\"caseSensitive\":false},\"jcip-liveness/lock-ordering-deadlocks/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eleftRight\u003c/code\u003e locks \u003ccode\u003eleft\u003c/code\u003e, then \u003ccode\u003eright\u003c/code\u003e; \u003ccode\u003erightLeft\u003c/code\u003e locks \u003ccode\u003eright\u003c/code\u003e, then \u003ccode\u003eleft\u003c/code\u003e. Thread 1 runs \u003ccode\u003eleftRight\u003c/code\u003e; thread 2 runs \u003ccode\u003erightLeft\u003c/code\u003e. Locks \u003cstrong\u003eL\u003c/strong\u003e and \u003cstrong\u003eR\u003c/strong\u003e stand for \u003ccode\u003eleft\u003c/code\u003e and \u003ccode\u003eright\u003c/code\u003e.\\n\u003cstrong\u003eMake them \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\u003c/strong\u003e\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eT1 holds L and wants R; T2 holds R and wants L. Neither can ever proceed.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet each thread take its first lock before either takes its second.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock L\",\"lock R\",\"doSomething\",\"unlock R\",\"unlock L\"]},{\"name\":\"T2\",\"ops\":[\"lock R\",\"lock L\",\"doSomethingElse\",\"unlock L\",\"unlock R\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eIn the deadlock, what does each thread hold, and wait for?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"T1 holds L and waits for R; T2 holds R and waits for L\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"T1 holds both locks; T2 waits\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen T1 would just finish and release them.\u003c/p\u003e\\n\"},{\"html\":\"Both hold nothing and wait for L\",\"correct\":false,\"feedback\":\"\u003cp\u003eNobody waiting while holding nothing can\u0026#39;t deadlock — someone would get L.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"jcip-liveness/lock-ordering-deadlocks/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-4\",\"prompt\":\"\u003cp\u003eThe fix: \u003cstrong\u003eevery thread acquires the locks in the same order\u003c/strong\u003e. Both methods now take L, then R.\\nTry to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e them — then run both to completion.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith a global \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock ordering\\\" data-def=\\\"Always acquiring multiple locks in the same global order, which makes lock-ordering deadlocks impossible.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock order\u003c/button\u003e, whoever gets L first also gets R; the other waits for L without holding anything.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock L\",\"lock R\",\"doSomething\",\"unlock R\",\"unlock L\"]},{\"name\":\"T2\",\"ops\":[\"lock L\",\"lock R\",\"doSomethingElse\",\"unlock R\",\"unlock L\"]}]},\"goal\":{\"finished\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhy can\u0026#39;t they deadlock any more?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"The locks are released sooner\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe release order didn\u0026#39;t change — the order of taking them did.\u003c/p\u003e\\n\"},{\"html\":\"Only one thread can run at a time now\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth threads still run; they just can\u0026#39;t form a cycle.\u003c/p\u003e\\n\"},{\"html\":\"Whoever gets L also gets R; the other waits for L while holding nothing\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"jcip-liveness/lock-ordering-deadlocks/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003etransferMoney(a, b, 10)\u003c/code\u003e and \u003ccode\u003etransferMoney(b, a, 20)\u003c/code\u003e can \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e. How can \u003ccode\u003etransferMoney\u003c/code\u003e impose a consistent order?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003etransferMoney(a, b)\u003c/code\u003e locks the source then the destination, so two transfers in opposite directions lock the same pair in opposite orders and can deadlock.\u003c/p\u003e\\n\u003cp\u003eOrdering by a unique key — an account number, or \u003ccode\u003eSystem.identityHashCode\u003c/code\u003e with a tie-breaking lock for the rare collision — makes every thread take the two locks in the same order whatever the argument order.\u003c/p\u003e\\n\u003cp\u003eWith one global order, a cycle of waiting can\u0026#39;t form.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$2b\",\"options\":[{\"html\":\"Use \u003ccode\u003evolatile\u003c/code\u003e balances instead\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat removes \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Atomic\\\" data-def=\\\"Happening as a single indivisible step — other threads see it either not started or completely done.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eatomicity\u003c/button\u003e of the transfer, not the deadlock risk.\u003c/p\u003e\\n\"},{\"html\":\"Always lock \u003ccode\u003efrom\u003c/code\u003e first\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s exactly the bug — \u003ccode\u003efrom\u003c/code\u003e in one call is \u003ccode\u003eto\u003c/code\u003e in the other.\u003c/p\u003e\\n\"},{\"html\":\"Order the two locks by some unique key — such as account number, or \u003ccode\u003eSystem.identityHashCode\u003c/code\u003e with a tie-breaking lock\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"volatile\\\" data-def=\\\"A field modifier guaranteeing visibility — every read sees the most recent write — and ordering. Doesn\u0026amp;#39;t make compound actions like \u0026lt;code\u0026gt;count++\u0026lt;/code\u0026gt; atomic.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003evolatile\u003c/button\u003e\"]},\"jcip-liveness/lock-ordering-deadlocks/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-liveness/lock-ordering-deadlocks/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"A program will be free of lock-ordering deadlocks if all threads acquire the locks they need in a fixed global \",\"html\":\"A program will be free of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock ordering\\\" data-def=\\\"Always acquiring multiple locks in the same global order, which makes lock-ordering deadlocks impossible.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock-ordering\u003c/button\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlocks\u003c/button\u003e if all threads acquire the locks they need in a fixed global \"},{\"answers\":[\"order\"],\"size\":5,\"choices\":[\"order\",\"open\",\"any\",\"blocked\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"jcip-liveness/open-calls/step-2\":{\"id\":\"step-2\",\"key\":\"jcip-liveness/open-calls/step-2\",\"prompt\":\"\u003cp\u003eA GPS update calls \u003ccode\u003esetLocation\u003c/code\u003e (Taxi lock \u003cstrong\u003eT\u003c/strong\u003e, then Dispatcher lock \u003cstrong\u003eD\u003c/strong\u003e). At the same time, the UI calls\\n\u003ccode\u003egetImage\u003c/code\u003e (D, then T). \u003cstrong\u003eFind the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e.\u003c/strong\u003e\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe same \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lock ordering\\\" data-def=\\\"Always acquiring multiple locks in the same global order, which makes lock-ordering deadlocks impossible.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003elock-ordering\u003c/button\u003e deadlock — but spread across two classes, so neither class\u0026#39;s author could see it.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"GPS\",\"ops\":[\"lock T\",\"update location\",\"lock D\",\"notifyAvailable\",\"unlock D\",\"unlock T\"]},{\"name\":\"UI\",\"ops\":[\"lock D\",\"start image\",\"lock T\",\"getLocation\",\"unlock T\",\"unlock D\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhich waits form the deadlock?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Both threads want T while holding nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen one would get T and carry on.\u003c/p\u003e\\n\"},{\"html\":\"GPS holds both locks and UI waits\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen GPS would finish and release them.\u003c/p\u003e\\n\"},{\"html\":\"GPS holds T and wants D; UI holds D and wants T\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"jcip-liveness/open-calls/step-4\":{\"id\":\"step-4\",\"key\":\"jcip-liveness/open-calls/step-4\",\"prompt\":\"\u003cp\u003eWith \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Open call\\\" data-def=\\\"Calling an alien method with no locks held. Makes deadlocks much easier to rule out.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eopen calls\u003c/button\u003e\u003c/strong\u003e, each method releases its own lock before calling the other object. Run both threads to completion.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNo thread ever holds two locks at once, so no cycle of waiting can form.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"GPS\",\"ops\":[\"lock T\",\"update location\",\"unlock T\",\"lock D\",\"notifyAvailable\",\"unlock D\"]},{\"name\":\"UI\",\"ops\":[\"lock D\",\"copy taxi list\",\"unlock D\",\"lock T\",\"getLocation\",\"unlock T\"]}]},\"goal\":{\"finished\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhat removed the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"The locks are now taken in alphabetical order\",\"correct\":false,\"feedback\":\"\u003cp\u003eGPS still takes T first and UI takes D first — they just release before taking the next.\u003c/p\u003e\\n\"},{\"html\":\"There\u0026#39;s only one lock now\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth locks are still there.\u003c/p\u003e\\n\"},{\"html\":\"Neither thread holds its own lock while it asks for the other one\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"jcip-liveness/open-calls/step-6\":{\"id\":\"step-6\",\"key\":\"jcip-liveness/open-calls/step-6\",\"prompt\":\"\u003cp\u003eTwo threads each need connections from two different database pools of size 1, and take them in opposite orders. What can happen?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread starvation deadlock\\\" data-def=\\\"Tasks in a pool wait on other tasks queued in the same pool, but every worker is busy waiting — nobody can make progress.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eThread starvation deadlock\u003c/button\u003e in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread pool\\\" data-def=\\\"A set of worker threads that take tasks from a queue and run them, reusing threads instead of creating one per task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ethread pools\u003c/button\u003e is another kind of resource deadlock.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eDeadlock isn\u0026#39;t only about locks: any resource that threads hold while waiting for another can form a cycle.\u003c/p\u003e\\n\u003cp\u003eThread 1 holds the only connection of pool A and waits for pool B; thread 2 holds pool B\u0026#39;s only connection and waits for pool A.\u003c/p\u003e\\n\u003cp\u003eLarger pools make it rarer but not impossible. The cure is the same as for locks — acquire resources in a consistent order, or don\u0026#39;t hold one while waiting for another.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A \u003cstrong\u003eresource deadlock\u003c/strong\u003e — the same cycle of waiting, on pooled resources instead of locks\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — pools aren\u0026#39;t locks\",\"correct\":false,\"feedback\":\"\u003cp\u003eAnything a thread can wait for can take part in a deadlock.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\"]},\"jcip-liveness/open-calls/step-7\":{\"id\":\"step-7\",\"key\":\"jcip-liveness/open-calls/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Strive to use \",\"html\":\"Strive to use \"},{\"answers\":[\"open\"],\"size\":4,\"choices\":[\"open\",\"atomic\",\"order\",\"blocked\"]},{\"text\":\" calls throughout your program — calling alien methods with no locks held.\",\"html\":\" calls throughout your program — calling \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Alien method\\\" data-def=\\\"A method whose behavior you don\u0026amp;#39;t control — overridable methods, or methods of objects passed in. Calling one while holding a lock invites deadlock.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003ealien methods\u003c/button\u003e with no locks held.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-liveness/avoiding-deadlocks/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-liveness/avoiding-deadlocks/step-3\",\"prompt\":\"\u003cp\u003eBoth threads take their first lock, then \u003cstrong\u003etry\u003c/strong\u003e the second. If it\u0026#39;s taken, \u003ccode\u003etrylock\u003c/code\u003e releases everything the\\nthread holds and starts over. Run both to completion — e html\":\", still cannot make progress because it keeps retrying an operation that will always fail.\"}],\"code\":false,\"caseSensitive\":false},\"jcip-performance/amdahls-law/step-3\":{\"id\":\"step-3\",\"key\":\"jcip-performance/amdahls-law/step-3\",\"prompt\":\"\u003cp\u003e10% of a program is serial. What\u0026#39;s the maximum speed-up on 10 processors? (Round to one decimal place.)\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1 / 0.19 ≈ 5.3 — barely half the ideal, with only 10% serial.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Amdahl\u0026#39;s law\\\" data-def=\\\"The speed-up from N processors is at most 1 / (F + (1 − F) / N), where F is the serial fraction. With 10% serial, you can never go more than 10× faster.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eAmdahl\u0026#39;s law\u003c/button\u003e gives speed-up = 1 / (F + (1 − F) / N), where F is the serial fraction and N the number of processors.\u003c/p\u003e\\n\u003cp\u003eWith F = 0.1 and N = 10: 1 / (0.1 + 0.9 / 10) = 1 / 0.19 ≈ 5.3.\u003c/p\u003e\\n\u003cp\u003eEven a small serial part halves the benefit of ten cores, and as N grows the serial part dominates; that\u0026#39;s why reducing serialization matters more than adding processors.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e1 / (0.1 + 0.09)\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1.1\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the speed-up from the serial part alone. Use 1 / (F + (1 − F) / N).\u003c/p\u003e\\n\"},{\"html\":\"5.3\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"9\",\"correct\":false,\"feedback\":\"\u003cp\u003eUse the formula — 1 / (0.1 + 0.9 / 10).\u003c/p\u003e\\n\"},{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would need a 0% seri
