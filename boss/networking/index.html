ens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eThree-way handshake\u003c/button\u003e\"]},\"application-layer/http/step-2\":{\"id\":\"step-2\",\"key\":\"application-layer/http/step-2\",\"prompt\":\"\u003cp\u003eA page is one HTML file plus 10 images, all small. With \u003cstrong\u003enon-persistent\u003c/strong\u003e connections — a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e connection\\nper object, fetched one after another — about how many \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTTs\u003c/button\u003e does it take?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e11 objects × 2 RTTs = 22.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach object needs its own TCP connection: one RTT for the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e (\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYN\u003c/button\u003e, SYN-ACK), then one RTT to send the request and receive the response.\u003c/p\u003e\\n\u003cp\u003eSo each object costs 2 RTTs, and 11 objects fetched one after another cost 22.\u003c/p\u003e\\n\u003cp\u003eTransfer time is ignored here because the objects are small; with a 100 ms RTT, that\u0026#39;s 2.2 seconds of pure waiting.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e11 objects, 2 RTTs each.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"11\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat counts one RTT per object. Each also needs its own \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e.\u003c/p\u003e\\n\"},{\"html\":\"12\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s the persistent-connection answer — try it next.\u003c/p\u003e\\n\"},{\"html\":\"22\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"application-layer/http/step-3\":{\"id\":\"step-3\",\"key\":\"application-layer/http/step-3\",\"prompt\":\"\u003cp\u003eA page is one HTML file plus 10 small images, fetched over one \u003cstrong\u003epersistent\u003c/strong\u003e connection (HTTP/1.1\u0026#39;s default), requests sent one at a time. About how many \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTTs\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1 RTT for the handshake + 11 request–response round trips = 12.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eOne \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e, then one RTT per object.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"11\",\"correct\":false,\"feedback\":\"\u003cp\u003eDon\u0026#39;t forget the one handshake at the start.\u003c/p\u003e\\n\"},{\"html\":\"12\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"22\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Persistent connection\\\" data-def=\\\"Keeping a TCP connection open for several HTTP requests, saving a handshake for each.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003epersistent connection\u003c/button\u003e, the handshake happens only once.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"application-layer/http/step-5\":{\"id\":\"step-5\",\"key\":\"application-layer/http/step-5\",\"prompt\":\"\u003cp\u003eMatch each status code to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"200 OK\",\"301 Moved Permanently\",\"304 Not Modified\",\"404 Not Found\",\"503 Service Unavailable\"],\"right\":[\"Here\u0026#39;s what you asked for\",\"It\u0026#39;s at a different URL now — use that from now on\",\"Your cached copy is still good\",\"There\u0026#39;s nothing at this URL\",\"The server can\u0026#39;t handle it right now — try later\"],\"rightOrder\":[4,2,3,1,0]},\"application-layer/http/step-7\":{\"id\":\"step-7\",\"key\":\"application-layer/http/step-7\",\"prompt\":\"\u003cp\u003eHTTP/1.1 sends requests on a connection one at a time. A slow response blocks everything queued behind it. What did HTTP/2 change?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Multiplexing\\\" data-def=\\\"Carrying several independent streams over one connection, interleaved.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eMultiplexing\u003c/button\u003e removes HTTP-level \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Head-of-line blocking\\\" data-def=\\\"One slow or lost item at the front of a queue holding up everything behind it.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehead-of-line blocking\u003c/button\u003e. One lost TCP \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Segment\\\" data-def=\\\"A TCP packet — a header plus a piece of the byte stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003esegment\u003c/button\u003e still stalls every stream, though…\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eHTTP/1.1 sends requests one at a time on a connection, so a slow response blocks those behind it; browsers work around this with several parallel connections.\u003c/p\u003e\\n\u003cp\u003eHTTP/2 splits each request and response into frames labelled with a stream ID and interleaves them on one connection, so a slow response no longer blocks the others at the HTTP level.\u003c/p\u003e\\n\u003cp\u003eTCP still delivers bytes in order, though, so one lost packet stalls all streams until it\u0026#39;s retransmitted.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\": d its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTT\u003c/button\u003e\"]},\"application-layer/http/step-9\":{\"id\":\"step-9\",\"key\":\"application-layer/http/step-9\",\"prompt\":\"\u003cp\u003eComplete the summary.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Fetching one object over a new TCP connection takes about \",\"html\":\"Fetching one object over a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TCP\\\" data-def=\\\"The Internet\u0026amp;#39;s reliable, ordered byte-stream protocol. Sets up a connection, retransmits lost data, and controls its sending rate.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTCP\u003c/button\u003e connection takes about \"},{\"answers\":[\"2\",\"two\"],\"size\":3,\"choices\":[\"2\",\"doubles\",\"1\",\"persistent\"]},{\"text\":\" RTTs; a \",\"html\":\" \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTTs\u003c/button\u003e; a \"},{\"answers\":[\"persistent\"],\"size\":10,\"choices\":[\"1\",\"persistent\",\"doubles\",\"2\"]},{\"text\":\" connection saves the handshake for every object after the first.\",\"html\":\" connection saves the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e for every object after the first.\"}],\"code\":false,\"caseSensitive\ /p\u003e\\n\"},{\"html\":\"5000\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe server\u0026#39;s ISN is 5000; the ACK names the next byte expected, one more.\u003c/p\u003e\\n\"},{\"html\":\"5001\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"tcp/handshake/step-5\":{\"id\":\"step-5\",\"key\":\"tcp/handshake/step-5\",\"prompt\":\"\u003cp\u003eThe client\u0026#39;s ISN is \u003cstrong\u003e1000\u003c/strong\u003e and the server\u0026#39;s is \u003cstrong\u003e5000\u003c/strong\u003e. What \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eacknowledgment\u003c/button\u003e number\u003c/strong\u003e does the server\\nput in its SYN-ACK?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYN\u003c/button\u003e flag counts as one byte of sequence space, so the next expected number is 1000 + 1.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe acknowledgment number is the next \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sequence number\\\" data-def=\\\"The byte position of a segment\u0026amp;#39;s data in the stream. Lets the receiver reorder segments and spot gaps.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003esequence number\u003c/button\u003e the receiver expects.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1000\",\"correct\":false,\ tcp/handshake/step-7\":{\"id\":\"step-7\",\"key\":\"tcp/handshake/step-7\",\"prompt\":\"\u003cp\u003eWhy isn\u0026#39;t a two-way \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003ehandshake\u003c/button\u003e (\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYN\u003c/button\u003e, then SYN-ACK) enough?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEach side needs proof the other has its number. Without the final \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eACK\u003c/button\u003e, a delayed duplicate SYN from an old\\nconnection could make the server open a connection nobody asked for.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWith only SYN and SYN-ACK, the server never learns that the client received its initial sequence number, so it can\u0026#39;t be sure both sides agree on numbering.\u003c/p\u003e\\n\u003cp\u003eWorse, a delayed duplicate SYN from an earlier connection could reach the server, which would reply and consider a connection open that the client never wanted.\u003c/p\u003e\\n\u003cp\u003eThe client\u0026#39;s final ACK confirms it\u0026#39;s live and has the server\u0026#39;s number; without it, the server discards the half-open connection.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Two segments can\u0026#39;t carry two sequence numbers\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe SYN-ACK alone carries one number and acknowledges the other. What\u0026#39;s missing is confirmation in the other direction.\u003c/p\u003e\\n\"},{\"html\":\"The server wouldn\u0026#39;t know the client received the server\u0026#39;s ISN\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The third segment carries the first data\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt may, but it doesn\u0026#39;t have to. Its job is acknowledging the server\u0026#39;s ISN.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Segment\\\" data-def=\\\"A TCP packet — a header plus a piece of the byte stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSegment\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sequence number\\\" data-def=\\\"The byte position of a segment\u0026amp;#39;s data in the stream. Lets the receiver reorder segments and spot gaps.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSequence number\u003c/button\u003e\"]},\"tcp/handshake/step-8\":{\"id\":\"step-8\",\"key\":\"tcp/handshake/step-8\",\"prompt\":\"\u003cp\u003eMatch each state to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"LISTEN\",\"SYN_SENT\",\"SYN_RECEIVED\",\"ESTABLISHED\"],\"right\":[\"Server waiting for a SYN\",\"Client has sent SYN and awaits the reply\",\"Server got a SYN and has replied with SYN-ACK\",\"Handshake finished; data can flow\"],\"rightOrder\":[3,2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"SYN\\\" data-def=\\\"The TCP flag that opens a connection and carries the initial sequence number.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSYN\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Three-way handshake\\\" data-def=\\\"How TCP opens a connection: the client sends SYN, the server replies SYN-ACK, the client sends ACK. Costs one round trip.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eThree-way handshake\u003c/button\u003e\"]},\"tcp/teardown/step-2\":{\"id\":\"step-2\",\"key\":\"tcp/teardown/step-2\",\"prompt\":\"\u003cp\u003eThe connection is open. \u003cstrong\u003eClose it completely\u003c/strong\u003e, client first, until both sides are CLOSED.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFIN → \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ACK\\\" data-def=\\\"An acknowledgement — the receiver telling the sender which bytes it has received.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eACK\u003c/button\u003e → FIN → ACK, then the client waited out TIME_WAIT. The server closed as soon as its FIN was acknowledged.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe client sends \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e first. What must the server do with it?\u003c/p\u003e\\n\",\"\u003cp\u003eAfter the server\u0026#39;s own FIN is acknowledged, the client still has to wait.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"tcp\",\"config\":{\"start\":\"established\",\"teardown\":true,\"clientIsn\":1000,\"serverIsn\":5000},\"goal\":{\"client\":\"CLOSED\",\"server\":\"CLOSED\"},\"question\":{\"prompt\":\"\u003cp\u003eWhich state did the client pass through just before CLOSED?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"CLOSE_WAIT\",\"correct\":false,\"feedback\":\"\u003cp\u003eCLOSE_WAIT is the server\u0026#39;s state after receiving the client\u0026#39;s FIN.\u003c/p\u003e\\n\"},{\"html\":\"LAST_ACK\",\"correct\":false,\"feedback\":\"\u003cp\u003eLAST_ACK is the server waiting for the ACK of its own FIN.\u003c/p\u003e\\n\"},{\"html\":\"TIME_WAIT\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"CLOSE_WAIT\\\" data-def=\\\"The state after receiving the other side\u0026amp;#39;s FIN but before your application calls close. Many of them usually mean a program forgot to close sockets.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eCLOSE_WAIT\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TIME_WAIT\\\" data-def=\\\"The state a TCP endpoint stays in after closing, for twice the maximum segment lifetime, so stray old packets can\u0026amp;#39;t confuse a new connection.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTIME_WAIT\u003c/button\u003e\"]},\"tcp/teardown/step-3\":{\"id\":\"step-3\",\"key\":\"tcp/teardown/step-3\",\"prompt\":\"\u003cp\u003ePut a client-initiated close in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The client sends FIN\",\"The server acknowledges the client\u0026#39;s FIN\",\"The server sends its own FIN\",\"The client acknowledges the server\u0026#39;s FIN\",\"The client waits 2×MSL in TIME_WAIT, then closes\"],\"start\":[2,0,3,4,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TIME_WAIT\\\" data-def=\\\"The state a TCP endpoint stays in after closing, for twice the maximum segment lifetime, so stray old packets can\u0026amp;#39;t confuse a new connection.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTIME_WAIT\u003c/button\u003e\"]},\"tcp/teardown/step-4\":{\"id\":\"step-4\",\"key\":\"tcp/teardown/step-4\",\"prompt\":\"\u003cp\u003eThe server has acknowledged the client\u0026#39;s \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e, but hasn\u0026#39;t sent its own. Can the server still send data to the client?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s how a client can send a whole request, close its side, and still read the full response.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes — the connection is half-closed, and only the client\u0026#39;s direction is finished\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"No — once either side sends FIN, the connection is closed\",\"correct\":false,\"feedback\":\"\u003cp\u003eFIN closes only the sender\u0026#39;s direction. The other stream stays open until its own FIN.\u003c/p\u003e\\n\"}],\"multiple\":false},\"tcp/teardown/step-6\":{\"id\":\"step-6\",\"key\":\"tcp/teardown/step-6\",\"prompt\":\"\u003cp\u003eWhy does the side that closed first wait in \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TIME_WAIT\\\" data-def=\\\"The state a TCP endpoint stays in after closing, for twice the maximum segment lifetime, so stray old packets can\u0026amp;#39;t confuse a new connection.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eTIME_WAIT\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIf the last ACK is lost, the other side resends its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"FIN\\\" data-def=\\\"The TCP flag that says \u0026amp;quot;I\u0026amp;#39;ve finished sending\u0026amp;quot;. Each side sends its own when closing.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eFIN\u003c/button\u003e — someone has to be around to answer.\\nAnd waiting 2×MSL guarantees no old segment can be mistaken for part of a new connection.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eIf the final ACK is lost, the other side retransmits its FIN; the side in TIME_WAIT is still there to acknowledge it, so both close cleanly.\u003c/p\u003e\\n\u003cp\u003eAnd segments from this connection may still be in the network. Waiting twice the maximum segment lifetime ensures they\u0026#39;ve expired before the same address and port pair can be reused, so they can\u0026#39;t be mistaken for part of a new connection.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"To give the application time to read the rest of the data\",\"correct\":false,\"feedback\":\"\u003cp\u003eAll the data has already been delivered by then; TIME_WAIT is about stray segments, not the application.\u003c/p\u003e\\n\"},{\"html\":\"So delayed segments from this connection die out before the same addresses and ports \\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Slow start\\\" data-def=\\\"TCP\u0026amp;#39;s start-up phase — the congestion window doubles every round trip until it reaches the threshold or a loss happens.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSlow start\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Congestion avoidance\\\" data-def=\\\"The phase after slow start where the window grows by one segment per round trip, probing gently for more bandwidth.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eCongestion avoidance\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Duplicate ACK\\\" data-def=\\\"A repeat of the last acknowledgement, sent when a segment arrives out of order — a hint that an earlier one was lost.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eDuplicate ACK\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Timeout\\\" data-def=\\\"Giving up on waiting after a set time. In TCP, a retransmission timeout is the strongest sign of congestion.\\\"\u003eTimeout\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Segment\\\" data-def=\\\"A TCP packet — a header plus a piece of the byte stream.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eSegment\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"RTT\\\" data-def=\\\"Round-trip time — how long it takes a packet to reach the other side and its reply to come back.\\\" data-book=\\\"Computer Networking: A Top-Down Approach\\\"\u003eRTT\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ssthresh\\\" data-d
