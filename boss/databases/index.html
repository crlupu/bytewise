ipt>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"skillId\":\"databases\",\"steps\":{\"btree-indexes/why-indexes/step-2\":{\"id\":\"step-2\",\"key\":\"btree-indexes/why-indexes/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eusers\u003c/code\u003e has 10 million rows and no \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003eemail\u003c/code\u003e. In the worst case, how many rows does \u003ccode\u003eSELECT * FROM users WHERE email = \u0026#39;ada@example.com\u0026#39;\u003c/code\u003e examine?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith nothing sorted by \u003ccode\u003eemail\u003c/code\u003e, the only safe answer is to look at every row.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Just one\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe database can\u0026#39;t know where the row is without looking.\u003c/p\u003e\\n\"},{\"html\":\"About 24 — a binary search\",\"correct\":false,\"feedback\":\"\u003cp\u003eBinary search needs the rows sorted by \u003ccode\u003eemail\u003c/code\u003e. In a heap table they\u0026#39;re in insertion order.\u003c/p\u003e\\n\"},{\"html\":\"All 10 million\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"btree-indexes/why-indexes/step-4\":{\"id\":\"step-4\",\"key\":\"btree-indexes/why-indexes/step-4\",\"prompt\":\"\u003cp\u003eEach \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e node holds up to 500 keys, so it has up to about 500 children.\\n\u003cstrong\u003eHow many levels\u003c/strong\u003e are needed to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e 100 million keys?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e500³ = 125,000,000 ≥ 100 million, so three levels — three \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epage\u003c/button\u003e reads to find any row.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eOne level holds 500 keys; two levels hold about 500 × 500.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"2\",\"correct\":false,\"feedback\":\"\u003cp\u003eTwo levels reach about 500 × 500 = 250,000 keys. Not enough.\u003c/p\u003e\\n\"},{\"html\":\"3\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"4\",\"correct\":false,\"feedback\":\"\u003cp\u003eClose — but three levels already reach 500³ = 125 million.\u003c/p\u003e\\n\"},{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eThree levels already reach 125 million keys.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"btree-indexes/why-indexes/step-5\":{\"id\":\"step-5\",\"key\":\"btree-indexes/why-indexes/step-5\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Root\",\"Leaf\",\"Fan-out\",\"Order\"],\"right\":[\"The single node at the top, where every search starts\",\"A node with no children, at the bottom level\",\"How many children a node has\",\"The most children a node is allowed\"],\"rightOrder\":[1,2,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fanout\\\" data-def=\\\"How many children each node of a tree has. High fanout means a shallow tree and fewer disk reads.\\\" data-book=\\\"Database Internals\\\"\u003eFanout\u003c/button\u003e\"]},\"btree-indexes/why-indexes/step-6\":{\"id\":\"step-6\",\"key\":\"btree-indexes/why-indexes/step-6\",\"prompt\":\"\u003cp\u003eThere\u0026#39;s an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003elast_name\u003c/code\u003e. Which of these can use it?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEquality, prefix matches and sorting all follow the index\u0026#39;s order. A suffix match doesn\u0026#39;t,\\nso it falls back to scanning.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAn index on \u003ccode\u003elast_name\u003c/code\u003e stores names in sorted order, like a phone book.\u003c/p\u003e\\n\u003cp\u003eEquality finds one spot, a prefix like \u003ccode\u003e\u0026#39;Lov%\u0026#39;\u003c/code\u003e is a contiguous range starting at \u0026quot;Lov\u0026quot;, and \u003ccode\u003eORDER BY\u003c/code\u003e can read entries in order without sorting.\u003c/p\u003e\\n\u003cp\u003eA pattern like \u003ccode\u003e\u0026#39;%lace\u0026#39;\u003c/code\u003e matches names scattered all over the sorted order, so the database can\u0026#39;t jump to them and must scan.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eThe index helps when the sorted order narrows down where to look.\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eWHERE last_name LIKE \u0026#39;Lov%\u0026#39;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eWHERE last_name = \u0026#39;Lovelace\u0026#39;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eORDER BY last_name\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eWHERE last_name LIKE \u0026#39;%lace\u0026#39;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA leading wildcard means the match could start anywhere in the sorted order, so the tree can\u0026#39;t narrow it down.\u003c/p\u003e\\n\"}],\"multiple\":true},\"btree-indexes/why-indexes/step-8\":{\"id\":\"step-8\",\"key\":\"btree-indexes/why-indexes/step-8\",\"prompt\":\"\u003cp\u003eWhich of these are costs of adding an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIndexes trade write speed and space for read speed.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It takes extra disk space\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Writes to the table get slower\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Reads that use it get slower\",\"correct\":false,\"feedback\":\"\u003cp\u003eReads that use an index get faster — that\u0026#39;s the point. The costs land on writes and storage.\u003c/p\u003e\\n\"}],\"multiple\":true},\"btree-indexes/btree-insert/step-2\":{\"id\":\"step-2\",\"key\":\"btree-indexes/btree-insert/step-2\",\"prompt\":\"\u003cp\u003eAn empty \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e of order 3 — at most \u003cstrong\u003e2 keys\u003c/strong\u003e per node. Insert 10, 20 and 30 with the button or\\n\u003cstrong\u003eStep forward\u003c/strong\u003e, and watch what happens when a leaf gets a third key.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e[10, 20, 30] overflowed, so it \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003esplit\u003c/button\u003e around its middle key: 20 moved up into a new root,\\nwith [10] and [30] as its children.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"btree\",\"config\":{\"order\":3,\"sequence\":[10,20,30],\"custom\":false},\"goal\":{\"splits\":1},\"question\":{\"prompt\":\"\u003cp\u003eAfter inserting 30, which key is in the root?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"10\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"20\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"30\",\"correct\":false,\"feedback\":\"\u003cp\u003e30 went into a leaf. Look at which key moved \u003cem\u003eup\u003c/em\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"btree-indexes/btree-insert/step-3\":{\"id\":\"step-3\",\"key\":\"btree-indexes/btree-insert/step-3\",\"prompt\":\"\u003cp\u003eStarting from that tree — root [20], leaves [10] and [30] — you insert \u003cstrong\u003e40\u003c/strong\u003e and then \u003cstrong\u003e50\u003c/strong\u003e.\\nWhich key moves up into the root?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e40 makes the leaf [30, 40]. 50 makes it [30, 40, 50] — too many — so it \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003esplits\u003c/button\u003e, and the middle\\nkey, 40, moves up. The root becomes [20, 40].\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAfter inserting 40, the right leaf is [30, 40], which fits. Inserting 50 makes it [30, 40, 50] — three keys in a node that holds at most two.\u003c/p\u003e\\n\u003cp\u003eThe leaf splits around its middle key: [30] stays left, [50] goes right, and 40 is pushed up to the parent, so the root becomes [20, 40] with three children.\u003c/p\u003e\\n\u003cp\u003ePushing the middle key up is what keeps every leaf at the same depth.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e40 joins the leaf [30]. Where does 50 go, and is that leaf now too full?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"30\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"40\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"50\",\"correct\":false,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"btree-indexes/btree-insert/step-4\":{\"id\":\"step-4\",\"key\":\"btree-indexes/btree-insert/step-4\",\"prompt\":\"\u003cp\u003eThis tree already holds 10–50. \u003cstrong\u003eMake it grow to three levels.\u003c/strong\u003e Use the keys offered, or type your own.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eInserting 70 split a leaf, which pushed 60 into the root, which then held three keys and split too.\\nA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e grows \u003cstrong\u003eat the root\u003c/strong\u003e, never at the leaves.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eInsert 60, then 70, and watch the root.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"btree\",\"config\":{\"order\":3,\"initial\":[10,20,30,40,50],\"sequence\":[60,70],\"custom\":true},\"goal\":{\"height\":3},\"question\":{\"prompt\":\"\u003cp\u003eWhat made the tree one level taller?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"Inserting a key larger than all the others\",\"correct\":false,\"feedback\":\"\u003cp\u003eLarge keys go to the rightmost leaf like any other key; that alone doesn\u0026#39;t add a level.\u003c/p\u003e\\n\"},{\"html\":\"A leaf got a third key\",\"correct\":false,\"feedback\":\"\u003cp\u003eA leaf split only adds a key to its parent. Height changes only when the split reaches the top.\u003c/p\u003e\\n\"},{\"html\":\"The root split\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003eSplit\u003c/button\u003e\"]},\"btree-indexes/btree-insert/step-6\":{\"id\":\"step-6\",\"key\":\"btree-indexes/btree-insert/step-6\",\"prompt\":\"\u003cp\u003eHere\u0026#39;s an order-4 tree (up to 3 keys per node) holding ten keys. \u003cstrong\u003eSearch for 47\u003c/strong\u003e and look at the path it takes.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAt the root [19, 40, 61], 47 is between 40 and 61, so the search follows the third child — and finds 47 there.\\nOne node per level: two levels, two nodes.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"btree\",\"config\":{\"order\":4,\"initial\":[5,12,19,26,33,40,47,54,61,68],\"custom\":false,\"search\":true},\"goal\":{\"found\":47},\"question\":{\"prompt\":\"\u003cp\u003eHow many nodes did the search visit?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"1\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"2\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"3\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would be a scan. The search only follows one path from the root.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"btree-indexes/btree-insert/step-7\":{\"id\":\"step-7\",\"key\":\"btree-indexes/btree-insert/step-7\",\"prompt\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"B-tree\\\" data-def=\\\"A balanced tree of sorted pages. Every lookup walks the same small number of levels from root to leaf, so it stays fast even for billions of rows.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eB-tree\u003c/button\u003e of order 100 holds 1,000,000 keys. Roughly how many nodes does a search visit?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e100³ = 1,000,000, so about three levels.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEach node visited narrows the search to one of about 100 children.\u003c/p\u003e\\n\u003cp\u003eAfter one level you\u0026#39;re down to a hundredth of the keys, after two a ten-thousandth, and after three a millionth — that is, one key.\u003c/p\u003e\\n\u003cp\u003eSo the height is about log base 100 of a million, which is 3. Because the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fanout\\\" data-def=\\\"How many children each node of a tree has. High fanout means a shallow tree and fewer disk reads.\\\" data-book=\\\"Database Internals\\\"\u003efan-out\u003c/button\u003e is so high, even billions of keys need only four or five levels, and the top levels usually stay in memory.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"About 20\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s a binary search tree — \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fanout\\\" data-def=\\\"How many children each node of a tree has. High fanout means a shallow tree and fewer disk reads.\\\" data-book=\\\"Database Internals\\\"\u003efan-out\u003c/button\u003e 2. With fan-out 100, each level divides the range by 100.\u003c/p\u003e\\n\"},{\"html\":\"About 1,000\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"About 1,000,000\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"About 3\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"btree-indexes/btree-insert/step-8\":{\"id\":\"step-8\",\"key\":\"btree-indexes/btree-insert/step-8\",\"prompt\":\"\u003cp\u003ePut the steps of inserting a key into a full leaf in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Search down from the root to the leaf where the key belongs\",\"Add the key to the leaf in sorted position\",\"The leaf now has too many keys, so split it in two\",\"Move the middle key up into the parent\",\"If the parent now overflows, split it too — possibly up to the root\"],\"start\":[2,3,1,4,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Split\\\" data-def=\\\"When a B-tree node is full, it is divided into two and the middle key moves up to the parent.\\\" data-book=\\\"Database Internals\\\"\u003eSplit\u003c/button\u003e\"]},\"sql-performance/concatenated-indexes/step-2\":{\"id\":\"step-2\",\"key\":\"sql-performance/concatenated-indexes/step-2\",\"prompt\":\"\u003cp\u003eWith an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003e(subsidiary_id, employee_id)\u003c/code\u003e, which \u003ccode\u003eWHERE\u003c/code\u003e clauses can use it to find rows directly?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAn index serves queries on a \u003cstrong\u003eleading\u003c/strong\u003e prefix of its columns — the first column, the first two, and so on.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA two-column index sorts entries by \u003ccode\u003esubsidiary_id\u003c/code\u003e first, and by \u003ccode\u003eemployee_id\u003c/code\u003e only within each subsidiary — like a phone book sorted by surname, then first name.\u003c/p\u003e\\n\u003cp\u003eYou can quickly find a subsidiary, or a subsidiary and employee, because those are contiguous ranges.\u003c/p\u003e\\n\u003cp\u003eSearching by \u003ccode\u003eemployee_id\u003c/code\u003e alone is like finding everyone named \u0026quot;Ada\u0026quot; in a phone book: the matches are scattered, so the index can\u0026#39;t narrow the search.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eCan you find everyone called \u003cem\u003eSarah\u003c/em\u003e quickly in a phone book sorted by surname?\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eWHERE employee_id = 9\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEmployee 9 could be in any subsidiary, so the database would have to read the whole index (or the table).\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eWHERE subsidiary_id = 20 AND employee_id = 9\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eWHERE subsidiary_id = 20\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"sql-performance/concatenated-indexes/step-3\":{\"id\":\"step-3\",\"key\":\"sql-performance/concatenated-indexes/step-3\",\"prompt\":\"\u003cp\u003eMost queries filter on \u003ccode\u003eemployee_id\u003c/code\u003e alone; a few filter on both columns. Which single \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e serves them all?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003ePut the column that is queried on its own first. One well-ordered index often replaces several.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e(subsidiary_id, employee_id)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eQueries on \u003ccode\u003eemployee_id\u003c/code\u003e alone can\u0026#39;t use it — it isn\u0026#39;t the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Leftmost prefix\\\" data-def=\\\"A composite index can only be searched using its first column(s), like a phone book sorted by last name, then first name.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eleading column\u003c/button\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e(employee_id, subsidiary_id)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e(employee_id)\u003c/code\u003e and \u003ccode\u003e(subsidiary_id)\u003c/code\u003e as two separate indexes\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat works, but costs two indexes to maintain where one would do.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"sql-performance/concatenated-indexes/step-5\":{\"id\":\"step-5\",\"key\":\"sql-performance/concatenated-indexes/step-5\",\"prompt\":\"\u003cp\u003eWhich \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e serves this query best?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eIndex for \u003cstrong\u003eequality first, then for ranges.\u003c/strong\u003e Columns after a range can only filter, not narrow the scan.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe query filters on \u003ccode\u003esubsidiary_id = ?\u003c/code\u003e and a range of \u003ccode\u003edate_of_birth\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWith \u003ccode\u003e(subsidiary_id, date_of_birth)\u003c/code\u003e, the index jumps to the subsidiary and then reads one contiguous range of birthdays within it.\u003c/p\u003e\\n\u003cp\u003eWith the columns reversed, the range on birthdays comes first and covers entries for every subsidiary, so the database must read the whole range and filter out other subsidiaries.\u003c/p\u003e\\n\u003cp\u003eHence: equality columns first, the range column last.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$13\",\"options\":[{\"html\":\"\u003ccode\u003e(subsidiary_id, date_of_birth)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e(date_of_birth, subsidiary_id)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe range on the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Leftmost prefix\\\" data-def=\\\"A composite index can only be searched using its first column(s), like a phone book sorted by last name, then first name.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eleading column\u003c/button\u003e means scanning every subsidiary\u0026#39;s entries for those dates.\u003c/p\u003e\\n\"}],\"multiple\":false},\"sql-performance/concatenated-indexes/step-7\":{\"id\":\"step-7\",\"key\":\"sql-performance/concatenated-indexes/step-7\",\"prompt\":\"\u003cp\u003eMatch each part of the search to its role.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Access predicate\",\"Index filter predicate\",\"Table-level filter\",\"Leading column\"],\"right\":[\"Narrows where the index scan starts and stops\",\"Checked on each index entry during the scan, without narrowing it\",\"Checked only after fetching the row from the table\",\"The first column of a concatenated index\"],\"rightO should come \",\"html\":\" subset of its columns, and range conditions should come \"},{\"answers\":[\"last\"],\"size\":4,\"choices\":[\"leading\",\"query\",\"last\",\"log\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"sql-performance/concatenated-indexes/step-9\":{\"id\":\"step-9\",\"key\":\"sql-performance/concatenated-indexes/step-9\",\"prompt\":\"\u003cp\u003eWhy not simply \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e every column combination you might ever query?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAim for the fewest indexes that serve your real queries — choosing column order well is how.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Every index slows down inserts, updates and deletes, and takes space\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Databases allow only one index per table\",\"correct\":false,\"feedback\":\"\u003cp\u003eMost allow many. The cost is in maintenance, not in a limit.\u003c/p\u003e\\n\"}],\"multiple\":false},\"sql-performance/indexes-and-functions/step-2\":{\"id\":\"step-2\",\"key\":\"sql-performance/indexes-and-functions/step-2\",\"prompt\":\"\u003cp\u003eThere\u0026#39;s an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003elast_name\u003c/code\u003e. How do you make case-insensitive search by \u003ccode\u003eUPPER(last_name)\u003c/code\u003e use an index?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA \u003cstrong\u003efunction-based\u003c/strong\u003e (or expression) index stores \u003ccode\u003eUPPER(last_name)\u003c/code\u003e already computed and sorted.\\nThe query must then use exactly the same expression.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Wrap the search value in \u003ccode\u003eUPPER\u003c/code\u003e too\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe search value isn\u0026#39;t the problem. The function on the \u003cem\u003ecolumn\u003c/em\u003e is.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — the optimizer will apply \u003ccode\u003eUPPER\u003c/code\u003e to the existing index\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe index is sorted by the original values; \u003ccode\u003eUPPER\u003c/code\u003e can reorder them.\u003c/p\u003e\\n\"},{\"html\":\"Create an index on the expression itself — \u003ccode\u003eCREATE INDEX ... ON employees (UPPER(last_name))\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"sql-performance/indexes-and-functions/step-3\":{\"id\":\"step-3\",\"key\":\"sql-performance/indexes-and-functions/step-3\",\"prompt\":\"\u003cp\u003eWhich of these can use a plain \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e on \u003ccode\u003esale_date\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eExpress conditions as a range on the \u003cstrong\u003ebare column\u003c/strong\u003e. That\u0026#39;s what \u0026quot;\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Sargable\\\" data-def=\\\"A condition the database can use an index for. Wrapping the indexed column in a function, like \u0026lt;code\u0026gt;YEAR(date) = 2026\u0026lt;/code\u0026gt;, usually makes it non-sargable.\\\" data-book=\\\"SQL Performance Explained\\\"\u003esargable\u003c/button\u003e\u0026quot; (search-argument-able) means.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAn index on \u003ccode\u003esale_date\u003c/code\u003e is sorted by the raw column value.\u003c/p\u003e\\n\u003cp\u003eA condition like \u003ccode\u003eDATE(sale_date) = \u0026#39;2026-10-04\u0026#39;\u003c/code\u003e or \u003ccode\u003eTRUNC(sale_date)\u003c/code\u003e applies a function to every row\u0026#39;s value, and the index isn\u0026#39;t sorted by the function\u0026#39;s result, so it can\u0026#39;t be used.\u003c/p\u003e\\n\u003cp\u003eWriting the condition as a half-open range on the bare column — from midnight up to, but not including, the next midnight — reads exactly one slice of the index.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLeave the column bare, and move the work to the other side of the comparison.\u003c/p\u003e\\n\"],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eWHERE EXTRACT(YEAR FROM sale_date) = 2026\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eRewrite it as a range on \u003ccode\u003esale_date\u003c/code\u003e itself instead.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eWHERE CAST(sale_date AS DATE) = \u0026#39;2026-10-04\u0026#39;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA function on the column hides it from the index — even a harmless-looking cast.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eWHERE sale_date \u0026gt;= \u0026#39;2026-10-04\u0026#39; AND sale_date \u0026lt; \u0026#39;2026-10-05\u0026#39;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"sql-performance/indexes-and-functions/step-5\":{\"id\":\"step-5\",\"key\":\"sql-performance/indexes-and-functions/step-5\",\"prompt\":\"\u003cp\u003eOrder these patterns from most selective \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e use to least.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe longer the prefix before the first \u003ccode\u003e%\u003c/code\u003e, the narrower the slice of the index that has to be read.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"\u003ccode\u003eLIKE \u0026#39;WINAND%\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eLIKE \u0026#39;WIN%\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eLIKE \u0026#39;W%\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eLIKE \u0026#39;%NAND\u0026#39;\u003c/code\u003e\"],\"start\":[1,3,0,2]},\"sql-performance/indexes-and-functions/step-7\":{\"id\":\"step-7\",\"key\":\"sql-performance/indexes-and-functions/step-7\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ephone\u003c/code\u003e is a \u003ccode\u003eVARCHAR\u003c/code\u003e column with an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eindex\u003c/button\u003e. Why might \u003ccode\u003eWHERE phone = 4155550100\u003c/code\u003e (a number, no quotes) ignore the index?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAn implicit conversion is a hidden function on the column. Compare with a value of the column\u0026#39;s own type — \u003ccode\u003e\u0026#39;4155550100\u0026#39;\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen you compare a text column to a number, the database must convert one side.\u003c/p\u003e\\n\u003cp\u003eMost convert the column, effectively evaluating \u003ccode\u003eTO_NUMBER(phone)\u003c/code\u003e for every row, which hides the column inside a function and rules out the index.\u003c/p\u003e\\n\u003cp\u003eIt can also fail on values that aren\u0026#39;t numeric. Comparing with a string literal, \u003ccode\u003e\u0026#39;4155550100\u0026#39;\u003c/code\u003e, keeps the column bare.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Indexes don\u0026#39;t work on long values\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Numbers can\u0026#39;t be compared with strings\",\"correct\":false,\"feedback\":\"\u003cp\u003eMany databases allow it — by converting implicitly, which is the problem.\u003c/p\u003e\\n\"},{\"html\":\"The database converts every \u003ccode\u003ephone\u003c/code\u003e value to a number to compare it — a function on the column\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"sql-performance/indexes-and-functions/step-8\":{\"id\":\"step-8\",\"key\":\"sql-performance/indexes-and-functions/step-8\",\"prompt\":\"\u003cp\u003eMatch each slow condition to its index-friendly rewrite.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eUPPER(name) = \u0026#39;ADA\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eYEAR(created) = 2026\u003c/code\u003e\",\"\u003ccode\u003eprice * 1.2 \u0026gt; 100\u003c/code\u003e\",\"\u003ccode\u003ecode = 42\u003c/code\u003e on a text column\"],\"right\":[\"An index on \u003ccode\u003eUPPER(name)\u003c/code\u003e\",\"\u003ccode\u003ecreated \u0026gt;= \u0026#39;2026-01-01\u0026#39; AND created \u0026lt; \u0026#39;2027-01-01\u0026#39;\u003c/code\u003e\",\"\u003ccode\u003eprice \u0026gt; 100 / 1.2\u003c/code\u003e\",\"\u003ccode\u003ecode = \u0026#39;42\u0026#39;\u003c/code\u003e\"],\"rightOrder\":[1,0,2,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Index\\\" data-def=\\\"A separate, sorted structure over some columns that points to the table\u0026amp;#39;s rows, so a query can find rows without reading the whole table.\\\" data-book=\\\"SQL Performance Explained\\\"\u003eIndex\u003c/button\u003e\"]},\"java-persistence/n-plus-one/step-2\":{\"id\":\"step-2\",\"key\":\"java-persistence/n-plus-one/step-2\",\"prompt\":\"\u003cp\u003eHow many SQL queries does that code run, if there are 50 posts?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e1 + 50 = 51 — hence the name \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"N+1 query problem\\\" data-def=\\\"Loading a list with one query, then running one more query per item to fetch its related data — N extra round trips where one join would do.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eN+1\u003c/button\u003e\u003c/strong\u003e. Each is a network round trip, so the cost grows with the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epage\u003c/button\u003e size.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe first query loads the 50 posts. Their \u003ccode\u003ecomments\u003c/code\u003e collections are lazy, so each is a prox ce Java Persistence\\\"\u003eN+1\u003c/button\u003e so easy to miss?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith small test data it\u0026#39;s invisible. Log SQL in development, and consider asserting statement counts in\\nintegration tests.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"JDBC drivers hide it from the logs\",\"correct\":false,\"feedback\":\"\u003cp\u003eLogging SQL (or counting statements in tests) shows it clearly.\u003c/p\u003e\\n\"},{\"html\":\"It only happens in production databases\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt happens everywhere — but a test with three rows doesn\u0026#39;t make it slow.\u003c/p\u003e\\n\"},{\"html\":\"The code looks like plain object navigation; the queries are hidden behind getters\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"java-persistence/n-plus-one/step-5\":{\"id\":\"step-5\",\"key\":\"java-persistence/n-plus-one/step-5\",\"prompt\":\"\u003cp\u003eMatch each fix to what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eJOIN FETCH\u003c/code\u003e\",\"Batch fetching\",\"DTO projection\",\"Entity graph\"],\"right\":[\"Loads the parents and their children in the same query\",\"Loads children for many parents at once with \u003ccode\u003eIN (...)\u003c/code\u003e\",\"Selects just the needed columns into a read-only object\",\"Declares per use case which associations to load eagerly\"],\"rightOrder\":[0,1,3,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Join fetch\\\" data-def=\\\"Telling the ORM to load an association in the same query with a SQL join, avoiding extra queries.\\\" data-book=\\\"High-Performance Java Persisten ata-book=\\\"Database Internals\\\"\u003eLost update\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Dirty read\\\" data-def=\\\"Reading data another transaction has written but not yet committed.\\\" data-book=\\\"Database Internals\\\"\u003eDirty read\u003c/button\u003e\"]},\"transactions/isolation-anomalies/step-5\":{\"id\":\"step-5\",\"key\":\"transactions/isolation-anomalies/step-5\",\"prompt\":\"\u003cp\u003eAt \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Read committed\\\" data-def=\\\"An isolation level where you only see committed data, but rereading a row may give a different answer if someone committed in between.\\\" data-book=\\\"Database Internals\\\"\u003eread committed\u003c/button\u003e\u003c/strong\u003e, which of these can still happen?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRead committed only promises that what you read was committed — not that it stays the same.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Non-repeatable reads\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Dirty reads\",\"correct\":false,\"feedback\":\"\u003cp\u003eRead committed exists precisely to rule these out.\u003c/p\u003e\\n\"},{\"html\":\"Phantom reads\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Dirty read\\\" data-def=\\\"Reading data another transaction has written but not yet committed.\\\" data-book=\\\"Database Internals\\\"\u003eDirty read\u003c/button\u003e\"]},\"transactions/isolation-anomalies/step-7\":{\"id\":\"step-7\",\"key\":\"transactions/isolation-anomalies/step-7\",\"prompt\":\"\u003cp\u003eTwo \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transaction\\\" data-def=\\\"A group of operations that succeed or fail together.\\\" data-book=\\\"Database Internals\\\"\u003etransactions\u003c/button\u003e both read a counter as 10, add one, and write it back — at \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Read committed\\\" data-def=\\\"An isolation level where you only see committed data, but rereading a row may give a different answer if someone committed in between.\\\" data-book=\\\"Database Internals\\\"\u003eread committed\u003c/button\u003e, with plain\\n\u003ccode\u003eSELECT\u003c/code\u003e then \u003ccode\u003eUPDATE ... SET n = 11\u003c/code\u003e. What\u0026#39;s the final value?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e11 — a \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lost update\\\" data-def=\\\"Two transactions read the same value, both modify it, and the second write overwrites the first.\\\" data-book=\\\"Database Internals\\\"\u003elost update\u003c/button\u003e\u003c/strong\u003e, the same race as \u003ccode\u003ecount++\u003c/code\u003e in Java, now between transactions. Fixes: an atomic\\n\u003ccode\u003eUPDATE ... SET n = n + 1\u003c/code\u003e, \u003ccode\u003eSELECT ... FOR UPDATE\u003c/code\u003e, \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Optimistic locking\\\" data-def=\\\"No locks while reading; on update, check a version column hasn\u0026amp;#39;t changed and fail if it has. Good when conflicts are rare.\\\" data-book=\\\"High-Performance Java Persistence\\\"\u003eoptimistic locking\u003c/button\u003e with a version column, or a stricter level.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBoth transactions read 10, both compute 11 in the application, and both write 11; the second write overwrites the first.\u003c/p\u003e\\n\u003cp\u003eRead committed only prevents reading uncommitted data — both reads saw the committed value 10 — so nothing stops this.\u003c/p\u003e\\n\u003cp\u003eFixes: let the database do the arithmetic, \u003ccode\u003eUPDATE counter SET n = n + 1\u003c/code\u003e; lock the row with \u003ccode\u003eSELECT ... FOR UPDATE\u003c/code\u003e; or use optimistic locking with a version column so the second write fails.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"10\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth transactions wrote 11; the value can\u0026#39;t stay at 10.\u003c/p\u003e\\n\"},{\"html\":\"12\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach transaction writes the value \u003cem\u003eit computed\u003c/em\u003e from its own read of 10.\u003c/p\u003e\\n\"},{\"html\":\"11\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The second transaction fails with an error\",\"correct\":false,\"feedback\":\"\u003cp\u003eAt read committed a plain write simply overwrites the first — silently.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"transactions/isolation-anomalies/step-8\":{\"id\":\"step-8\",\"key\":\"transactions/isolation-anomalies/step-8\",\"prompt\":\"\u003cp\u003eTwo doctors are on call; the rule is at least one must be. Each, in their own \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transaction\\\" data-def=\\\"A group of operations that succeed or fail together.\\\" data-book=\\\"Database Internals\\\"\u003etransaction\u003c/button\u003e, checks \u0026quot;two are on call\u0026quot;\\nand takes themselves off. Under \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Snapshot isolation\\\" data-def=\\\"Each transaction reads from a consistent snapshot of the database as of its start; concurrent writes to the same row conflict.\\\" data-book=\\\"Database Internals\\\"\u003esnapshot isolation\u003c/button\u003e both commit — no one is on call. What is this anomaly?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cstrong\u003eWrite skew\u003c/strong\u003e: each transaction\u0026#39;s read was true when made, but their writes together broke an invariant\\nspanning several rows. \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serializable\\\" data-def=\\\"The strongest isolation level — the outcome is as if transactions ran one at a time.\\\" data-book=\\\"Database Internals\\\"\u003eSerializable\u003c/button\u003e isolation (or explicit locks on the rows read) prevents it.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eUnder snapshot isolation, each transaction reads from a snapshot taken when it started, and only conflicting writes to the same row are detected.\u003c/p\u003e\\n\u003cp\u003eBoth doctors see two on call, and each updates a different row — their own — so there\u0026#39;s no write conflict and both commit.\u003c/p\u003e\\n\u003cp\u003eThe result breaks the rule \u0026quot;at least one on call\u0026quot;, which spans rows neither transaction wrote together.\u003c/p\u003e\\n\u003cp\u003eSerializable isolation, or explicitly locking the rows read, prevents this write skew.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Lost update\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey updated \u003cem\u003edifferent\u003c/em\u003e rows, so neither overwrote the other.\u003c/p\u003e\\n\"},{\"html\":\"Write skew\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Dirty read\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Read committed\\\" data-def=\\\"An isolation level where you only see committed data, but rereading a row may give a different answer if someone committed in between.\\\" data-book=\\\"Database Internals\\\"\u003eread committed\u003c/button\u003e data from their snapshots.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lost update\\\" data-def=\\\"Two transactions read the same value, both modify it, and the second write overwrites the first.\\\" data-book=\\\"Database Internals\\\"\u003eLost update\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Dirty read\\\" data-def=\\\"Reading data another transaction has written but not yet committed.\\\" data-book=\\\"Database Internals\\\"\u003eDirty read\u003c/button\u003e\"]},\"transactions/isolation-anomalies/step-9\":{\"id\":\"step-9\",\"key\":\"transactions/isolation-anomalies/step-9\",\"prompt\":\"\u003cp\u003eOrder the levels from weakest to strongest.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Read uncommitted\",\"Read committed\",\"Repeatable read\",\"Serializable\"],\"start\":[2,1,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Read committed\\\" data-def=\\\"An isolation level where you only see committed data, but rereading a row may give a different answer if someone committed in between.\\\" data-book=\\\"Database Internals\\\"\u003eRead committed\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Repeatable read\\\" data-def=\\\"An isolation level where rows you\u0026amp;#39;ve read don\u0026amp;#39;t change under you for the rest of the transaction.\\\" data-book=\\\"Database Internals\\\"\u003eRepeatable read\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serializable\\\" data-def=\\\"The strongest isolation level — the outcome is as if transactions ran one at a time.\\\" data-book=\\\"Database Internals\\\"\u003eSerializable\u003c/button\u003e\"]},\"transactions/write-ahead-log/step-3\":{\"id\":\"step-3\",\"key\":\"transactions/write-ahead-log/step-3\",\"prompt\":\"\u003cp\u003ePut the life of a committed update in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe log hits disk before the page does, and before the client hears \u0026quot;committed\u0026quot;.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The page is changed in the buffer pool\",\"A log record describing the change is appended to the WAL buffer\",\"On commit, the WAL is flushed to disk (fsync), and only then is commit acknowledged\",\"Later, the dirty page is written back to its place on disk\"],\"start\":[2,3,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003ePage\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Buffer pool\\\" data-def=\\\"The database\u0026amp;#39;s in-memory cache of disk pages.\\\" data-book=\\\"Database Internals\\\"\u003eBuffer pool\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Write-ahead log\\\" data-def=\\\"Recording every change in an append-only log, and forcing it to disk, before changing the data pages. After a crash, the log is replayed.\\\" data-book=\\\"Database Internals\\\"\u003eWrite-ahead log\u003c/button\u003e\"]},\"transactions/write-ahead-log/step-4\":{\"id\":\"step-4\",\"key\":\"transactions/write-ahead-log/step-4\",\"prompt\":\"\u003cp\u003eWhy is flushing the log on commit much cheaper than flushing the changed \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epages\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSequential appends are fast on every kind of storage. Random page writes can wait and be combined.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The log is written sequentially at the end of one file; pages are scattered across the disk\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The log isn\u0026#39;t really flushed\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt must be — that\u0026#39;s what makes commit durable.\u003c/p\u003e\\n\"},{\"html\":\"Log records are compressed\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey may be, but the big win is sequential vs random writes.\u003c/p\u003e\\n\"}],\"multiple\":false},\"transactions/write-ahead-log/step-6\":{\"id\":\"step-6\",\"key\":\"transactions/write-ahead-log/step-6\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Redo\",\"Undo\",\"Checkpoint\",\"Force at commit\"],\"right\":[\"Reapply logged changes of committed transactions\",\"Reverse changes of transactions that didn\u0026#39;t commit\",\"A marker that bounds how far back recovery must read\",\"Flushing the log — not the pages — before acknowledging\"],\"rightOrder\":[1,3,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Redo\\\" data-def=\\\"Reapplying logged changes of committed transactions that may not have reached the data pages before a crash.\\\" data-book=\\\"Database Internals\\\"\u003eRedo\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Undo\\\" data-def=\\\"Reverting changes made by transactions that hadn\u0026amp;#39;t committed when the system crashed.\\\" data-book=\\\"Database Internals\\\"\u003eUndo\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checkpoint\\\" data-def=\\\"Periodically flushing dirty pages and noting it in the log, so recovery only needs to replay the log from that point.\\\" data-book=\\\"Database Internals\\\"\u003eCheckpoint\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transaction\\\" data-def=\\\"A group of operations that succeed or fail together.\\\" data-book=\\\"Database Internals\\\"\u003eTransaction\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003ePage\u003c/button\u003e\"]},\"transactions/write-ahead-log/step-7\":{\"id\":\"step-7\",\"key\":\"transactions/write-ahead-log/step-7\",\"prompt\":\"\u003cp\u003eThe database lets dirty \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epages\u003c/button\u003e of \u003cstrong\u003euncommitted\u003c/strong\u003e \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transaction\\\" data-def=\\\"A group of operations that succeed or fail together.\\\" data-book=\\\"Database Internals\\\"\u003etransactions\u003c/button\u003e be written to disk (a \u0026quot;steal\u0026quot; policy). What does recovery need because of that?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSteal → undo, no-force → redo. Most databases choose steal/no-force for speed, so they need both — which is what \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"ARIES\\\" data-def=\\\"The classic recovery algorithm — analysis, redo (repeat history), then undo of uncommitted transactions — used by most databases.\\\" data-book=\\\"Database Internals\\\"\u003eARIES\u003c/button\u003e provides.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWith a steal policy, a page holding changes from a transaction that hasn\u0026#39;t committed can be written to disk to free buffer space.\u003c/p\u003e\\n\u003cp\u003eIf the system crashes before that transaction commits, the data files contain changes that must not survive.\u003c/p\u003e\\n\u003cp\u003eThe log has the before-images of those changes, and recovery uses them to undo uncommitted work. With no-force, committed changes may be missing from the data files, which is why redo is needed too.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Redo\",\"correct\":false,\"feedback\":\"\u003cp\u003eRedo is needed because committed pages may \u003cem\u003enot\u003c/em\u003e have been written (a \u0026quot;no-force\u0026quot; policy).\u003c/p\u003e\\n\"},{\"html\":\"Undo\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing extra\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Redo\\\" data-def=\\\"Reapplying logged changes of committed transactions that may not have reached the data pages before a crash.\\\" data-book=\\\"Database Internals\\\"\u003eRedo\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Undo\\\" data-def=\\\"Reverting changes made by transactions that hadn\u0026amp;#39;t committed when the system crashed.\\\" data-book=\\\"Database Internals\\\"\u003eUndo\u003c/button\u003e\"]},\"transactions/write-ahead-log/step-8\":{\"id\":\"step-8\",\"key\":\"transactions/write-ahead-log/step-8\",\"prompt\":\"\u003cp\u003eComplete the rule that gives the log its name.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"A change must be recorded in the \",\"html\":\"A change must be recorded in the \"},{\"answers\":[\"log\"],\"size\":3,\"choices\":[\"last\",\"page\",\"LAZY\",\"log\"]},{\"text\":\" on disk before the changed \",\"html\":\" on disk before the changed \"},{\"answers\":[\"page\"],\"size\":4,\"choices\":[\"log\",\"page\",\"query\",\"leading\"]},{\"text\":\" is written to disk.\",\"html\":\" is written to disk.\"}],\"code\":false,\"caseSensitive\":false},\"transactions/write-ahead-log/step-9\":{\"id\":\"step-9\",\"key\":\"transactions/write-ahead-log/step-9\",\"prompt\":\"\u003cp\u003eWithout \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checkpoint\\\" data-def=\\\"Periodically flushing dirty pages and noting it in the log, so recovery only needs to replay the log from that point.\\\" data-book=\\\"Database Internals\\\"\u003echeckpoints\u003c/button\u003e, what would happen to recovery time?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA checkpoint records which \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Page\\\" data-def=\\\"The fixed-size block (often 4–16 KB) that a database reads and writes as a unit.\\\" data-book=\\\"Database Internals\\\"\u003epages\u003c/button\u003e were dirty and which \u003
