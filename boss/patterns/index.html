 that puts each variant of an algorithm in its own class behind a shared interface, so the client can swap them.\\\" data-book=\\\"Head First Design Patterns\\\"\u003eStrategy\u003c/button\u003e differ?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eIn Template Method, a superclass fixes the algorithm\u0026#39;s skeleton and subclasses supply steps by \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overriding\\\" data-def=\\\"A subclass redefining an inherited method. Which one runs is decided at run time from the object\u0026amp;#39;s actual class.\\\" data-book=\\\"Effective Java\\\"\u003eoverriding\u003c/button\u003e methods — the variation is chosen at compile time, by which subclass you instantiate.\u003c/p\u003e\\n\u003cp\u003eIn Strategy, the whole algorithm lives in a separate object behind an interface, which can be swapped at run time.\u003c/p\u003e\\n\u003cp\u003eTemplate Method reuses more code; Strategy is more flexible and avoids inheritance.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Template Method varies steps through inheritance; Strategy varies a whole algorithm through composition\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They\u0026#39;re the same pattern\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth vary behaviour, but by different mechanisms.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003eComposition\u003c/button\u003e\"]},\"hfdp-algorithms-collections/iterator-and-composite/step-2\":{\"id\":\"step-2\",\"key\":\"hfdp-algor
