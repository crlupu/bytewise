n \u003ccode\u003eHashSet.addAll\u003c/code\u003e calls the overridden \u003ccode\u003eadd\u003c/code\u003e for each, counting them again. How should the subclass be fixed?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFixes that depend on the superclass\u0026#39;s internals are just new fragile bets.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$25\",\"options\":[{\"html\":\"Stop overriding \u003ccode\u003eaddAll\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat works today, but only because of how \u003ccode\u003eHashSet.addAll\u003c/code\u003e happens to be written — a future release could change it.\u003c/p\u003e\\n\"},{\"html\":\"Don\u0026#39;t extend \u003ccode\u003eHashSet\u003c/code\u003e; wrap a \u003ccode\u003eSet\u003c/code\u003e and forward calls to it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Subtract \u003ccode\u003ec.size()\u003c/code\u003e in \u003ccode\u003eaddAll\u003c/code\u003e after calling \u003ccode\u003esuper\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eSame fragility, in reverse.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overriding\\\" data-def=\\\"A subclass redefining an inherited method. Which one runs is decided at run time from the object\u0026amp;#39;s actual class.\\\" data-book=\\\"Effective Java\\\"\u003eOverriding\u003c/button\u003e\"]},\"ej-classes/composition-over-inheritance/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/composition-over-inheritance/step-5\",\"prompt\":\"\u003cp\u003eMatch each term to its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Composition\",\"Forwarding\",\"Wrapper (decorator)\",\"Fragile base class\"],\"right\":[\"The new class holds an instance of the existing one in a field\",\"Each method calls the same method on the held instance\",\"A class that adds behavior around another instance of the same interface\",\"A superclass change silently breaking subclasses\"],\"rightOrder\":[2,1,0,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003eComposition\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Forwarding\\\" data-def=\\\"A method that simply calls the same method on a contained object and returns its result.\\\" data-book=\\\"Effective Java\\\"\u003eForwarding\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eDecorator\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fragile base class\\\" data-def=\\\"When a subclass breaks because its superclass changes internally — e.g. one of its methods starts calling another overridable method.\\\" data-book=\\\"Effective Java\\\"\u003eFragile base class\u003c/button\u003e\"]},\"ej-classes/composition-over-inheritance/step-7\":{\"id\":\"step-7\",\"key\":\"ej-classes/composition-over-inheritance/step-7\",\"prompt\":\"\u003cp\u003eWhen is inheritance the right tool?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eInheritance is safe inside a package under one team\u0026#39;s control, or for classes explicitly designed for it.\\nAcross package boundaries, prefer \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003ecomposition\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInheritance creates the tightest possible coupling: the subclass depends on how the superclass is implemented, not just on what it promises.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s acceptable when one team controls both classes and evolves them together, or when the superclass documents its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Self-use\\\" data-def=\\\"A class calling its own overridable methods. Subclasses that override them can be surprised, so it must be documented.\\\" data-book=\\\"Effective Java\\\"\u003eself-use\u003c/button\u003e precisely and is designed for extension.\u003c/p\u003e\\n\u003cp\u003eFor everything else — especially extending classes from another library — composition gives you the same reuse while depending only on the public API.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Whenever it saves code\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe saved lines are paid back later in fragility.\u003c/p\u003e\\n\"},{\"html\":\"Whenever B needs most of A\u0026#39;s methods\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Forwarding\\\" data-def=\\\"A method that simply calls the same method on a contained object and returns its result.\\\" data-book=\\\"Effective Java\\\"\u003eforwarding\u003c/button\u003e gives you, without inheriting A\u0026#39;s implementation details.\u003c/p\u003e\\n\"},{\"html\":\"When B truly \u003cem\u003eis an\u003c/em\u003e A, and A was designed and documented for extension\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-classes/design-for-inheritance/step-3\":{\"id\":\"step-3\",\"key\":\"ej-classes/design-for-inheritance/step-3\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eConstructors must not call overridable methods — directly or indirectly. The same goes for \u003ccode\u003eclone\u003c/code\u003e and \u003ccode\u003ereadObject\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eJava runs constructors from the top of the hierarchy down, and fields of \u003ccode\u003eSub\u003c/code\u003e are only assigned after \u003ccode\u003esuper()\u003c/code\u003e returns.\u003c/p\u003e\\n\u003cp\u003eBut virtual method calls dispatch to the subclass even during construction, so \u003ccode\u003eSuper()\u003c/code\u003e runs \u003ccode\u003eSub.overrideMe()\u003c/code\u003e while \u003ccode\u003einstant\u003c/code\u003e is still \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eIt prints \u003ccode\u003enull\u003c/code\u003e once, then the real instant after construction; if \u003ccode\u003eoverrideMe\u003c/code\u003e called a method on \u003ccode\u003einstant\u003c/code\u003e, it would throw \u003ccode\u003eNullPointerException\u003c/code\u003e instead.\u003c/p\u003e\\n\u003cp\u003eA constructor may only call methods that are private, final or static — those can\u0026#39;t be overridden.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$26\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003enull\u003c/code\u003e — the superclass constructor calls the override before \u003ccode\u003eSub\u003c/code\u003e\u0026#39;s fields are set\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"The current time\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eSub\u003c/code\u003e\u0026#39;s constructor body hasn\u0026#39;t run yet when \u003ccode\u003eSuper()\u003c/code\u003e calls \u003ccode\u003eoverrideMe\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-classes/design-for-inheritance/step-4\":{\"id\":\"step-4\",\"key\":\"ej-classes/design-for-inheritance/step-4\",\"prompt\":\"\u003cp\u003eHow should you test a class designed for inheritance?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWriting subclasses reveals missing protected hooks — and hooks nobody needs.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Write several subclasses before releasing it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Unit-test the class on its own\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat checks behaviour, not whether the protected hooks you chose are the right ones.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-classes/design-for-inheritance/step-6\":{\"id\":\"step-6\",\"key\":\"ej-classes/design-for-inheritance/step-6\",\"prompt\":\"\u003cp\u003eA class isn\u0026#39;t designed or documented for subclassing. What should you do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eProhibiting inheritance for ordinary concrete classes is the safe default.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Prohibit it — declare the class \u003ccode\u003efinal\u003c/code\u003e, or make constructors private with static factories\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Leave it open just in case\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery subclass then depends on undocumented internals.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003eStatic factory method\u003c/button\u003e\"]},\"ej-classes/design-for-inheritance/step-7\":{\"id\":\"step-7\",\"key\":\"ej-classes/design-for-inheritance/step-7\",\"prompt\":\"\u003cp\u003eProhibit subclassing.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"public \"},{\"answers\":[\"final\"],\"size\":5,\"choices\":[\"permits\",\"record\",\"Date\",\"final\"]},{\"text\":\" class Money { ... }\"}],\"code\":true,\"caseSensitive\":false},\"ej-classes/interfaces-over-abstract-classes/step-2\":{\"id\":\"step-2\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-2\",\"prompt\":\"\u003cp\u003eWhich are advantages of interfaces over abstract classes?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They can hold instance fields\",\"correct\":false,\"feedback\":\"\u003cp\u003eInterfaces can\u0026#39;t have instance fields; that\u0026#39;s an abstract class\u0026#39;s advantage.\u003c/p\u003e\\n\"},{\"html\":\"They\u0026#39;re ideal for mixins — optional behaviour like \u003ccode\u003eComparable\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They allow non-hierarchical types, such as a \u003ccode\u003eSingerSongwriter\u003c/code\u003e that is both a \u003ccode\u003eSinger\u003c/code\u003e and a \u003ccode\u003eSongwriter\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Existing classes can be retrofitted to implement them\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Mixin\\\" data-def=\\\"A type a class implements in addition to its primary type, to declare an optional behavior — \u0026lt;code\u0026gt;Comparable\u0026lt;/code\u0026gt; is a mixin.\\\" data-book=\\\"Effective Java\\\"\u003eMixin\u003c/button\u003e\"]},\"ej-classes/interfaces-over-abstract-classes/step-4\":{\"id\":\"step-4\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-4\",\"prompt\":\"\u003cp\u003eMatch each interface to its \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Skeletal implementation\\\" data-def=\\\"An abstract class that implements most of an interface in terms of a few primitive methods, like \u0026lt;code\u0026gt;AbstractList\u0026lt;/code\u0026gt;. Combines the flexibility of interfaces with code reuse.\\\" data-book=\\\"Effective Java\\\"\u003eskeletal implementation\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eList\u003c/code\u003e\",\"\u003ccode\u003eSet\u003c/code\u003e\",\"\u003ccode\u003eMap\u003c/code\u003e\",\"\u003ccode\u003eCollection\u003c/code\u003e\"],\"right\":[\"\u003ccode\u003eAbstractList\u003c/code\u003e\",\"\u003ccode\u003eAbstractSet\u003c/code\u003e\",\"\u003ccode\u003eAbstractMap\u003c/code\u003e\",\"\u003ccode\u003eAbstractCollection\u003c/code\u003e\"],\"rightOrder\":[3,2,0,1]},\"ej-classes/interfaces-over-abstract-classes/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/interfaces-over-abstract-classes/step-5\",\"prompt\":\"\u003cp\u003eWhy not just put all the shared code into \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003edefault methods\u003c/button\u003e on the interface?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDefaults help, but the skeletal class can hold fields and override \u003ccode\u003eObject\u003c/code\u003e\u0026#39;s methods.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInterfaces can\u0026#39;t declare instance fields, so any shared behaviour needing state has to live elsewhere.\u003c/p\u003e\\n\u003cp\u003eAnd an interface may not provide default implementations of \u003ccode\u003eequals\u003c/code\u003e, \u003ccode\u003ehashCode\u003c/code\u003e or \u003ccode\u003etoString\u003c/code\u003e — \u003ccode\u003eObject\u003c/code\u003e\u0026#39;s versions always win.\u003c/p\u003e\\n\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Skeletal implementation\\\" data-def=\\\"An abstract class that implements most of an interface in terms of a few primitive methods, like \u0026lt;code\u0026gt;AbstractList\u0026lt;/code\u0026gt;. Combines the flexibility of interfaces with code reuse.\\\" data-book=\\\"Effective Java\\\"\u003eskeletal implementation\u003c/button\u003e class like \u003ccode\u003eAbstractList\u003c/code\u003e fills that gap: implementers extend it to get state and the \u003ccode\u003eObject\u003c/code\u003e methods for free, while the interface still defines the type.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Interfaces can\u0026#39;t have method bodies\",\"correct\":false,\"feedback\":\"\u003cp\u003eSince Java 8 they can — default and static methods.\u003c/p\u003e\\n\"},{\"html\":\"Default methods can\u0026#39;t have state, and can\u0026#39;t provide \u003ccode\u003eequals\u003c/code\u003e, \u003ccode\u003ehashCode\u003c/code\u003e or \u003ccode\u003etoString\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003eHash code\u003c/button\u003e\"]},\"ej-classes/interfaces-for-posterity/step-2\":{\"id\":\"step-2\",\"key\":\"ej-classes/interfaces-for-posterity/step-2\",\"prompt\":\"\u003cp\u003eA synchronized collection wrapper locks a mutex in every method. What happens when someone calls the inherited \u003ccode\u003eremoveIf\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe default can\u0026#39;t preserve invariants it didn\u0026#39;t know existed. Apache Commons\u0026#39; \u003ccode\u003eSynchronizedCollection\u003c/code\u003e was a real victim.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003eDefault methods\u003c/button\u003e are written without knowledge of the classes that will inherit them.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eremoveIf\u003c/code\u003e iterates and removes using the collection\u0026#39;s own methods, but the synchronized wrapper\u0026#39;s invariant is \u0026quot;every access holds the mutex\u0026quot; — and the default doesn\u0026#39;t take it.\u003c/p\u003e\\n\u003cp\u003eSo the wrapper silently becomes thread-unsafe for one method, with no compile error and no test failure until a race happens in production.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why adding a default method to a widely implemented interface is risky: each existing implementation must be checked, and you can\u0026#39;t check implementations you don\u0026#39;t know about.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt compiles fine — that\u0026#39;s what makes it dangerous.\u003c/p\u003e\\n\"},{\"html\":\"It takes the lock automatically\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003edefault method\u003c/button\u003e knows nothing about the wrapper\u0026#39;s locking.\u003c/p\u003e\\n\"},{\"html\":\"It runs without taking the lock, so concurrent use can corrupt the collection\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-classes/interfaces-for-posterity/step-4\":{\"id\":\"step-4\",\"key\":\"ej-classes/interfaces-for-posterity/step-4\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s the lesson for designing an interface?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Get it right before release — write several implementations and clients; you may not be able to fix it later\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Ship quickly, and add default methods to fix it later\",\"correct\":false,\"feedback\":\"\u003cp\u003eDefaults are a last resort for evolution, not a design tool.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003eDefault method\u003c/button\u003e\"]},\"ej-classes/interfaces-for-posterity/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/interfaces-for-posterity/step-5\",\"prompt\":\"\u003cp\u003eComplete the warning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Existing implementations may compile without error or warning, yet \",\"html\":\"Existing implementations may compile without error or warning, yet \"},{\"answers\":[\"fail\"],\"size\":4,\"choices\":[\"fail\",\"default\",\"top-level\",\"source\"]},{\"text\":\" at run time when a new \",\"html\":\" at run time when a new \"},{\"answers\":[\"default\"],\"size\":7,\"choices\":[\"thread-safe\",\"default\",\"top-level\",\"source\"]},{\"text\":\" method is added.\",\"html\":\" method is added.\"}],\"code\":false,\"caseSensitive\":false},\"ej-classes/interfaces-for-posterity/step-6\":{\"id\":\"step-6\",\"key\":\"ej-classes/interfaces-for-posterity/step-6\",\"prompt\":\"\u003cp\u003eWhen are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Default method\\\" data-def=\\\"An interface method with a body (\u0026lt;code\u0026gt;default\u0026lt;/code\u0026gt;), available to every implementation unless overridden. Lets interfaces gain methods — but can break existing implementations.\\\" data-book=\\\"Effective Java\\\"\u003edefault methods\u003c/button\u003e safe and appropriate?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"To remove methods from an interface\",\"correct\":false,\"feedback\":\"\u003cp\u003eDefaults can\u0026#39;t remove methods.\u003c/p\u003e\\n\"},{\"html\":\"When designing a new interface, to provide standard implementations alongside it\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-classes/interfaces-define-types/step-2\":{\"id\":\"step-2\",\"key\":\"ej-classes/interfaces-define-types/step-2\",\"prompt\":\"\u003cp\u003eWhy is the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Constant interface\\\" data-def=\\\"An interface with only constants, implemented to use them unqualified. An anti-pattern — use a utility class or enum and \u0026lt;code\u0026gt;import static\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003econstant interface\u003c/button\u003e a poor use of interfaces?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWorse, all subclasses inherit the namespace pollution, and the class can never stop implementing it without breaking compatibility.\u003c/p\u003e\\n\",\"details\":\"$27\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Using constants is an implementation detail, but implementing the interface makes it part of the class\u0026#39;s public API\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s slower\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Interfaces can\u0026#39;t hold constants\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can — that\u0026#39;s why the antipattern exists.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-classes/interfaces-define-types/step-4\":{\"id\":\"step-4\",\"key\":\"ej-classes/interfaces-define-types/step-4\",\"prompt\":\"\u003cp\u003eMatch each kind of constant to its better home.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Constants tied to an existing class\",\"A fixed set of related values\",\"Miscellaneous constants\"],\"right\":[\"Add them to that class (like \u003ccode\u003eInteger.MAX_VALUE\u003c/code\u003e)\",\"An enum\",\"A noninstantiable utility class\"],\"rightOrder\":[2,0,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Noninstantiable class\\\" data-def=\\\"A class of only static members, like \u0026lt;code\u0026gt;Math\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;Collections\u0026lt;/code\u0026gt;. Gets a private constructor so no one can create an instance.\\\" data-book=\\\"Effective Java\\\"\u003eNoninstantiable class\u003c/button\u003e\"]},\"ej-classes/interfaces-define-types/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/interfaces-define-types/step-5\",\"prompt\":\"\u003cp\u003eAvoid the qualifier without implementing anything.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static import\\\" data-def=\\\"\u0026lt;code\u0026gt;import static java.lang.Math.PI;\u0026lt;/code\u0026gt; — lets you use a class\u0026amp;#39;s static members without the class name.\\\" data-book=\\\"Effective Java\\\"\u003estatic import\u003c/button\u003e gives the short names, without making them part of any API.\u003c hies/step-5\",\"prompt\":\"\u003cp\u003eA tagged \u003ccode\u003eFigure\u003c/code\u003e class has become an abstract \u003ccode\u003eFigure\u003c/code\u003e with a subclass per shape. What happens if someone adds \u003ccode\u003eTriangle\u003c/code\u003e but forgets to implement \u003ccode\u003earea()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eIn a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Tagged class\\\" data-def=\\\"One class with a \u0026amp;quot;tag\u0026amp;quot; field saying which kind of thing an instance is, plus a switch everywhere. Replace with a class hierarchy.\\\" data-book=\\\"Effective Java\\\"\u003etagged class\u003c/button\u003e, \u003ccode\u003earea()\u003c/code\u003e is a switch over the tag, and nothing forces a new tag value to get a case — the gap only shows up at run time, often as a default branch throwing an exception.\u003c/p\u003e\\n\u003cp\u003eIn a hierarchy, \u003ccode\u003earea()\u003c/code\u003e is abstract in the root, so a new subclass that doesn\u0026#39;t implement it is rejected by the compiler.\u003c/p\u003e\\n\u003cp\u003eThe type system now tracks which flavours exist and what each must provide, which is exactly the bookkeeping the tagged class left to discipline.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It throws \u003ccode\u003eAssertionError\u003c/code\u003e when \u003ccode\u003earea()\u003c/code\u003e is called\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat was the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Tagged class\\\" data-def=\\\"One class with a \u0026amp;quot;tag\u0026amp;quot; field saying which kind of thing an instance is, plus a switch everywhere. Replace with a class hierarchy.\\\" data-book=\\\"Effective Java\\\"\u003etagged class\u003c/button\u003e\u0026#39;s behaviour. The hierarchy catches it at compile time.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile — the abstract method must be implemented\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-classes/class-hierarchies/step-6\":{\"id\":\"step-6\",\"key\":\"ej-classes/class-hierarchies/step-6\",\"prompt\":\"\u003cp\u003eIn modern Java you can also close the hierarchy to known subtypes.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eSealed classes (Java 17) also let \u003ccode\u003eswitch\u003c/code\u003e check that every subtype is handled.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"abstract \"},{\"answers\":[\"sealed\"],\"size\":6,\"choices\":[\"permits\",\"record\",\"Date\",\"sealed\"]},{\"text\":\" class Figure \"},{\"answers\":[\"permits\"],\"size\":7,\"choices\":[\"permits\",\"sealed\",\"Date\",\"static\"]},{\"text\":\" Rectangle, Circle { abstract double area(); }\"}],\"code\":true,\"caseSensitive\":false},\"ej-classes/static-member-classes/step-2\":{\"id\":\"step-2\",\"key\":\"ej-classes/static-member-classes/step-2\",\"prompt\":\"\u003cp\u003eMatch each kind of nested class to its description.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Static member class\",\"Nonstatic member class (inner class)\",\"Anonymous class\",\"Local class\"],\"right\":[\"Declared with \u003ccode\u003estatic\u003c/code\u003e inside another class; no link to an enclosing instance\",\"Each instance is tied to an instance of the enclosing class\",\"Declared and instantiated at one point in an expression, without a name\",\"Declared inside a method body, with a name\"],\"rightOrder\":[0,3,2,1],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static member class\\\" data-def=\\\"A nested class declared \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt; — an ordinary class that happens to live inside another. Doesn\u0026amp;#39;t hold a reference to an outer instance.\\\" data-book=\\\"Effective Java\\\"\u003eStatic member class\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003eInner class\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Anonymous class\\\" data-def=\\\"A class declared and instantiated in one expression, without a name. Mostly replaced by lambdas.\\\" data-book=\\\"Effective Java\\\"\u003eAnonymous class\u003c/button\u003e\"]},\"ej-classes/static-member-classes/step-4\":{\"id\":\"step-4\",\"key\":\"ej-classes/static-member-classes/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eMap\u003c/code\u003e implementations keep one \u003ccode\u003eEntry\u003c/code\u003e object per key. Should \u003ccode\u003eEntry\u003c/code\u003e be static or nonstatic?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe rule — \u003cstrong\u003eif a member class doesn\u0026#39;t need access to an enclosing instance, always make it static.\u003c/strong\u003e\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Nonstatic — entries belong to the map\",\"correct\":false,\"feedback\":\"\u003cp\u003eBelonging isn\u0026#39;t the test; needing the enclosing \u003cem\u003einstance\u003c/em\u003e is.\u003c/p\u003e\\n\"},{\"html\":\"Static — entries never use the enclosing map, and a reference per entry would waste space\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-classes/static-member-classes/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/static-member-classes/step-5\",\"prompt\":\"\u003cp\u003eAn inner (nonstatic) class instance is stored in a long-lived \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e after its enclosing object is otherwise unused.\\nWhat happens to the enclosing object?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA classic \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Memory leak\\\" data-def=\\\"In Java, objects that are no longer needed but stay reachable — from a cache, a listener list, or a stale array slot — so the garbage collector can never free them.\\\" data-book=\\\"Effective Java\\\"\u003ememory leak\u003c/button\u003e — and an invisible one, since the reference doesn\u0026#39;t appear in the source.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eEvery instance of a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003enonstatic member class\u003c/button\u003e carries a hidden reference to its enclosing instance, so it can call the outer object\u0026#39;s methods.\u003c/p\u003e\\n\u003cp\u003eAs long as the inner object is reachable — say, from a long-lived cache — the outer object stays reachable too, along with everything it holds.\u003c/p\u003e\\n\u003cp\u003eNothing in the source shows this reference, which makes the leak hard to spot in a heap dump.\u003c/p\u003e\\n\u003cp\u003eIf the nested class doesn\u0026#39;t need the outer instance, declaring it \u003ccode\u003estatic\u003c/code\u003e removes the reference and the leak.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It can\u0026#39;t be garbage collected, because the inner instance references it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s collected normally\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe hidden reference keeps it reachable.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-classes/static-member-classes/step-6\":{\"id\":\"step-6\",\"key\":\"ej-classes/static-member-classes/step-6\",\"prompt\":\"\u003cp\u003eDeclare a nested class with no link to the outer instance.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"private \"},{\"answers\":[\"static\"],\"size\":6,\"choices\":[\"static\",\"record\",\"final\",\"Date\"]},{\"text\":\" class Node\u003cE\u003e { E item; Node\u003cE\u003e next; }\"}],\"code\":true,\"caseSensitive\":false},\"ej-classes/one-top-level-class/step-2\":{\"id\":\"step-2\",\"key\":\"ej-classes/one-top-level-class/step-2\",\"prompt\":\"\u003cp\u003eTwo source files both define \u003ccode\u003eUtensil\u003c/code\u003e and \u003ccode\u003eDessert\u003c/code\u003e. You compile with \u003ccode\u003ejavac Main.java Utensil.java\u003c/code\u003e. What does \u003ccode\u003eMain\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003epancake\u003c/code\u003e. With \u003ccode\u003ejavac Main.java Dessert.java\u003c/code\u003e, compilation fails with duplicate classes; with \u003ccode\u003ejavac Dessert.java Main.java\u003c/code\u003e, it prints \u003ccode\u003epotpie\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eMain.java\u003c/code\u003e refers to \u003ccode\u003eUtensil\u003c/code\u003e and \u003ccode\u003eDessert\u003c/code\u003e, and both \u003ccode\u003eUtensil.java\u003c/code\u003e and \u003ccode\u003eDessert.java\u003c/code\u003e define classes with those names but different content.\u003c/p\u003e\\n\u003cp\u003eWhichever file the compiler sees first defines the classes; \u003ccode\u003ejavac Main.java Utensil.java\u003c/code\u003e compiles \u003ccode\u003eUtensil.java\u003c/code\u003e\u0026#39;s versions, which print \u003ccode\u003epancake\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eSwap the file order and you get \u003ccode\u003epotpie\u003c/code\u003e, or a duplicate-class error — the program\u0026#39;s meaning depends on the build command.\u003c/p\u003e\\n\u003cp\u003eOne top-level class per file, named after the file, makes this impossible.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhen \u003ccode\u003eMain\u003c/code\u003e refers to \u003ccode\u003eUtensil\u003c/code\u003e, the compiler finds \u003ccode\u003eUtensil.java\u003c/code\u003e, which defines both classes.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$28\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"potpie\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eUtensil.java\u003c/code\u003e is listed, so its definitions are compiled first — \u003ccode\u003eDessert.java\u003c/code\u003e isn\u0026#39;t even read.\u003c/p\u003e\\n\"},{\"html\":\"A compile error: duplicate class\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat happens with \u003ccode\u003ejavac Main.java Dessert.java\u003c/code\u003e; with Utensil.java listed, Dessert.java is never read.\u003c/p\u003e\\n\"},{\"html\":\"pancake\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-classes/one-top-level-class/step-4\":{\"id\":\"step-4\",\"key\":\"ej-classes/one-top-level-class/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eUtensil.java\u003c/code\u003e and \u003ccode\u003eDessert.java\u003c/code\u003e each define both \u003ccode\u003eUtensil\u003c/code\u003e and \u003ccode\u003eDessert\u003c/code\u003e, differently. What\u0026#39;s the real problem?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Java doesn\u0026#39;t allow two classes per file\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt does — that\u0026#39;s exactly why the trap exists.\u003c/p\u003e\\n\"},{\"html\":\"The program\u0026#39;s behaviour depends on the order source files are passed to the compiler\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The program is slower\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-classes/one-top-level-class/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/one-top-level-class/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eUtensil\u003c/code\u003e and \u003ccode\u003eDessert\u003c/code\u003e share one source file. What\u0026#39;s the fix if the classes really belong together?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eOtherwise, one top-level class per file, named after the file.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Make them static member classes of one top-level class\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Put them in one file and remember the compile order\",\"correct\":false,\"feedback\":\"\u003cp\u003eRelying on compile order is the bug.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static member class\\\" data-def=\\\"A nested cla ,\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eList\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;?\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;String\u0026gt;\u003c/code\u003e\"],\"right\":[\"Raw — opted out of type checking\",\"A list that can hold any object, checked by the compiler\",\"A list of some unknown type — you can read, but not add (except null)\",\"A list of strings, checked by the compiler\"],\"rightOrder\":[2,1,3,0]},\"ej-generics/raw-types/step-5\":{\"id\":\"step-5\",\"key\":\"ej-generics/raw-types/step-5\",\"prompt\":\"\u003cp\u003eYou want a method that counts elements common to two sets of unknown element type. Which signature?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unbounded wildcard\\\" data-def=\\\"\u0026lt;code\u0026gt;List\u0026amp;lt;?\u0026amp;gt;\u0026lt;/code\u0026gt; — a list of some unknown type. Safe to read as \u0026lt;code\u0026gt;Object\u0026lt;/code\u0026gt;; you can\u0026amp;#39;t add anything except \u0026lt;code\u0026gt;null\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eunbounded wildcard\u003c/button\u003e \u003ccode\u003e?\u003c/code\u003e is the safe version of \u0026quot;any type\u0026quot;.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eSet\u0026lt;?\u0026gt;\u003c/code\u003e means \u0026quot;a set of some type I don\u0026#39;t know\u0026quot;. You can read elements as \u003ccode\u003eObject\u003c/code\u003e and call methods like \u003ccode\u003econtains\u003c/code\u003e and \u003ccode\u003esize\u003c/code\u003e, but you can\u0026#39;t add anything except \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s exactly what counting common elements needs, and the restriction is what keeps it type-safe.\u003c/p\u003e\\n\u003cp\u003eA raw \u003ccode\u003eSet\u ;String\u0026amp;gt;\u0026lt;/code\u0026gt; is just a \u0026lt;code\u0026gt;List\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eerased\u003c/button\u003e at run time, so \u003ccode\u003eList\u0026lt;String\u0026gt;.class\u003c/code\u003e doesn\u0026#39;t exist.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"In method parameters, for flexibility\",\"correct\":false,\"feedback\":\"\u003cp\u003eUse \u003ccode\u003e?\u003c/code\u003e there instead.\u003c/p\u003e\\n\"},{\"html\":\"Class literals, like \u003ccode\u003eList.class\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"With \u003ccode\u003einstanceof\u003c/code\u003e, like \u003ccode\u003eo instanceof Set\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Type token\\\" data-def=\\\"A \u0026lt;code\u0026gt;Class\u0026lt;/code\u0026gt; object like \u0026lt;code\u0026gt;String.class\u0026lt;/code\u0026gt; passed around to convey type information at run time.\\\" data-book=\\\"Effective Java\\\"\u003eType token\u003c/button\u003e\"]},\"ej-generics/unchecked-warnings/step-3\":{\"id\":\"step-3\",\"key\":\"ej-generics/unchecked-warnings/step-3\",\"prompt\":\"\u003cp\u003eYou can\u0026#39;t eliminate a warning, but you\u0026#39;ve proved the cast is safe. What should you do?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eEach \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Unchecked warning\\\" data-def=\\\"The compiler saying it can\u0026amp;#39;t verify type safety at this point. Eliminate them, or prove safety and suppress with \u0026lt;code\u0026gt;@SuppressWarnings(\u0026amp;quot;unchecked\u0026amp;quot;)\u0026lt;/code\u0026gt; on the smallest scope.\\\" data-book=\\\"Effective Java\\\"\u003eunchecked warning\u003c/button\u003e marks a place where a \u003ccode\u003eClassCastException\u003c/code\u003e could happen at run time.\u003c/p\u003e\\n\u003cp\u003eIf you\u0026#39;ve proved one can\u0026#39;t, suppress it — but on the smallest scope, so that new warnings elsewhere in the method still show up.\u003c/p\u003e\\n\u003cp\u003eSuppressing on a whole class hides future mistakes; leaving proven-safe warnings unsuppressed buries real ones in noise.\u003c/p\u003e\\n\u003cp\u003eThe comment explaining why it\u0026#39;s safe helps the next reader and forces you to actually make the argument.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Leave the warning\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen real problems get lost among warnings you know are harmless.\u003c/p\u003e\\n\"},{\"html\":\"Put \u003ccode\u003e@SuppressWarnings(\u0026quot;unchecked\u0026quot;)\u003c/code\u003e on the class\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would hide future, genuinely dangerous warnings in the whole class.\u003c/p\u003e\\n\"},{\"html\":\"Add \u003ccode\u003e@SuppressWarnings(\u0026quot;unchecked\u0026quot;)\u003c/code\u003e on the smallest possible scope, with a comment saying why it\u0026#39;s safe\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-generics/unchecked-warnings/step-4\":{\"id\":\"step-4\",\"key\":\"ej-generics/unchecked-warnings/step-4\",\"prompt\":\"\u003cp\u003eOrder these scopes from narrowest (best) to widest.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEven a \u003ccode\u003ereturn\u003c/code\u003e statement can be split into a local variable declaration so the annotation covers just it.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"A local variable declaration\",\"A method\",\"A class\"],\"start\":[0,2,1]},\"ej-generics/unchecked-warnings/step-5\":{\"id\":\"step-5\",\"key\":\"ej-generics/unchecked-warnings/step-5\",\"prompt\":\"\u003cp\u003eNarrow the suppression to one declaration.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"@SuppressWarnings(\\\"\"},{\"answers\":[\"unchecked\"],\"size\":9,\"choices\":[\"unchecked\",\"E\",\"SafeVarargs\",\"Class\"]},{\"text\":\"\\\")\\nT[] result = (T[]) Arrays.copyOf(elements, size, a.getClass());\\n\"}],\"code\":true,\"caseSensitive\":false},\"ej-generics/unchecked-warnings/step-6\":{\"id\":\"step-6\",\"key\":\"ej-generics/unchecked-warnings/step-6\",\"prompt\":\"\u003cp\u003eWhy add a comment next to every suppression?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It explains why it\u0026#39;s safe, so others don\u0026#39;t \u0026quot;fix\u0026quot; it — and it forces you to check your reasoning\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The compiler requires it\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-generics/lists-over-arrays/step-2\":{\"id\":\"step-2\",\"key\":\"ej-generics/lists-over-arrays/step-2\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eArrays check element types at run time — they\u0026#39;re \u003cstrong\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Reified\\\" data-def=\\\"Type information that exists at run time. Arrays know their element type; generic types don\u0026amp;#39;t — it\u0026amp;#39;s erased.\\\" data-book=\\\"Effective Java\\\"\u003ereified\u003c/button\u003e\u003c/strong\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$2a\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It compiles, then throws \u003ccode\u003eArrayStoreException\u003c/code\u003e at run time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It works, storing a String in a Long array\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"It fails to compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e — a \u003ccode\u003eLong[]\u003c/code\u003e is an \u003ccode\u003eObject[]\u003c/code\u003e — so the first line is legal.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-generics/lists-over-arrays/step-3\":{\"id\":\"step-3\",\"key\":\"ej-generics/lists-over-arrays/step-3\",\"prompt\":\"\u003cp\u003eAnd this?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGenerics are \u003cstrong\u003einvariant\u003c/strong\u003e — a \u003ccode\u003eList\u0026lt;Long\u0026gt;\u003c/code\u003e is not a \u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e — so the mistake is caught at compile time.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eGenerics are invariant: \u003ccode\u003eList\u0026lt;Long\u0026gt;\u003c/code\u003e is not a subtype of \u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e, so the assignment on the first line doesn\u0026#39;t compile.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s the poin /button\u003e\"]},\"ej-generics/heterogeneous-containers/step-6\":{\"id\":\"step-6\",\"key\":\"ej-generics/heterogeneous-containers/step-6\",\"prompt\":\"\u003cp\u003eComplete the type-token signature.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"public \u003cT\u003e T getFavorite(\"},{\"answers\":[\"Class\"],\"size\":5,\"choices\":[\"SafeVarargs\",\"unchecked\",\"Class\",\"E\"]},{\"text\":\"\u003cT\u003e type)\"}],\"code\":true,\"caseSensitive\":false},\"ej-enums/enums-not-int-constants/step-3\":{\"id\":\"step-3\",\"key\":\"ej-enums/enums-not-int-constants/step-3\",\"prompt\":\"\u003cp\u003eWhich are advantages of a Java \u003ccode\u003eenum\u003c/code\u003e over int constants?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Readable \u003ccode\u003etoString\u003c/code\u003e output, and \u003ccode\u003evalues()\u003c/code\u003e to iterate over all constants\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They use less memory than ints\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach constant is an object; memory isn\u0026#39;t the point.\u003c/p\u003e\\n\"},{\"html\":\"Constants can be added or reordered without recompiling clients\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Compile-time type safety — an \u003ccode\u003eApple\u003c/code\u003e parameter accepts only \u003ccode\u003eApple\u003c/code\u003e values\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"ej-enums/enums-not-int-constants/step-5\":{\"id\":\"step-5\",\"key\":\"ej-enums/enums-not-int-constants/step-5\",\"prompt\":\"\u003cp\u003ePayroll: weekdays and weekends compute overtime differently. Instead of a switch in \u003ccode\u003ePayrollDay\u003c/code\u003e, what\u0026#39;s the more robust design?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe day must choose a pay type when it\u0026#39;s declared, so a new constant can\u0026#39;t forget it.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWith a switch over the day in a method, adding a new constant compiles fine even if you forget to add a case — the day silently gets the default pay.\u003c/p\u003e\\n\u003cp\u003eIn the strategy enum, each \u003ccode\u003ePayrollDay\u003c/code\u003e constant passes a \u003ccode\u003ePayType\u003c/code\u003e (\u003ccode\u003eWEEKDAY\u003c/code\u003e or \u003ccode\u003eWEEKEND\u003c/code\u003e) to its constructor, and the pay calculation is delegated to it.\u003c/p\u003e\\n\u003cp\u003eA new constant can\u0026#39;t be declared without choosing a pay type, so the compiler forces the decision. It\u0026#39;s safer, though a little more verbose, than a switch.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A switch with a default case\",\"correct\":false,\"feedback\":\"\u003cp\u003eA new day (a holiday, say) would silently get the default pay.\u003c/p\u003e\\n\"},{\"html\":\"One constant-specific method per day, copying the code\",\"correct\":false,\"feedback\":\"\u003cp\u003eDuplicates the weekday logic five times.\u003c/p\u003e\\n\"},{\"html\":\"A strategy enum — each day is constructed with a private \u003ccode\u003ePayType\u003c/code\u003e enum (WEEKDAY or WEEKEND) that holds the calculation\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Constant-specific method implementation\\\" data-def=\\\"Each enum constant overriding an abstract method with its own body, instead of a \u0026lt;code\u0026gt;switch\u0026lt;/code\u0026gt; on \u0026lt;code\u0026gt;this\u0026lt;/code\u0026gt;.\\\" data-boo ype\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"There\u0026#39;s no built-in way to create an \u003cem\u003eimmutable\u003c/em\u003e EnumSet — wrap it with \u003ccode\u003eCollections.unmodifiableSet\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s slower than a HashSet\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s much faster.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e\"]},\"ej-enums/enummap/step-3\":{\"id\":\"step-3\",\"key\":\"ej-enums/enummap/step-3\",\"prompt\":\"\u003cp\u003eThe EnumMap version.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe constructor takes the key type\u0026#39;s \u003ccode\u003eClass\u003c/code\u003e object — a bounded \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Type token\\\" data-def=\\\"A \u0026lt;code\u0026gt;Class\u0026lt;/code\u0026gt; object like \u0026lt;code\u0026gt;String.class\u0026lt;/code\u0026gt; passed around to convey type information at run time.\\\" data-book=\\\"Effective Java\\\"\u003etype token\u003c/button\u003e — so the map knows its keys at run time.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Map\u003cLifeCycle, Set\u003cPlant\u003e\u003e byLifeCycle = new \"},{\"answers\":[\"EnumMap\"],\"size\":7,\"choices\":[\"Operation\",\"values\",\"EnumMap\",\"isAnnotationPresent\"]},{\"text\":\"\u003c\u003e(LifeCycle.class);\\nfor (LifeCycle lc : LifeCycle.values()) byLifeCycle.put(lc, new HashSet\u003c\u003e());\\nfor (Plant p : garden) byLifeCycle.get(p.lifeCycle).add(p);\\n\"}],\"code\":true,\"caseSensitive\":false},\"ej-enums/enummap/step-4\":{\"id\":\"step-4\",\"key\":\"ej-enums/enummap/step-4\",\"prompt\":\"\u003cp\u003eWhy is EnumMap about as fast as the ordinal-indexed array?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eEnumMap\u003c/code\u003e stores its values in an array indexed by each key\u0026#39;s \u003ccode\u003eordinal()\u003c/code\u003e, which is exactly what a hand-written ordinal-indexed array does.\u003c/p\u003e\\n\u003cp\u003eThe difference is safety: the map\u0026#39;s keys are typed, so you can\u0026#39;t index with the wrong enum or an arbitrary int, and you never touch \u003ccode\u003eordinal()\u003c/code\u003e yourself.\u003c/p\u003e\\n\u003cp\u003eIt also prints readably and works with the \u003ccode\u003eMap\u003c/code\u003e API. You get the speed of the array without its fragility.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Internally it \u003cem\u003eis\u003c/em\u003e an array indexed by ordinal — the danger is hidden behind a type-safe Map\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It uses hashing with perfect hash codes\",\"correct\":false,\"feedback\":\"\u003cp\u003eNo hashing at all; that\u0026#39;s part of why it\u0026#39;s fast.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0026lt;code\u0026gt;ordinal()\u0026lt;/code\u0026gt;. Don\u0026amp;#39;t store meaning in it — reorder the constants and it changes.\\\" data-book=\\\"Effective Java\\\"\u003eOrdinal\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003eHash code\u003c/button\u003e\"]},\"ej-enums/enummap/step-5\":{\"id\":\"step-5\",\"key\":\"ej-enums/enummap/step-5\",\"prompt\":\"\u003cp\u003eEach \u003ccode\u003ePlant\u003c/code\u003e has a \u003ccode\u003elifeCycle\u003c/code\u003e field of the enum \u003ccode\u003eLifeCycle\u003c/code\u003e. Grouping with streams, \u003ccode\u003eCollectors.groupingBy(p -\u0026gt; p.lifeCycle)\u003c/code\u003e returns a \u003ccode\u003eHashMap\u003c/code\u003e. How do you get an \u003ccode\u003eEnumMap\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003egroupingBy(classifier, mapFactory, downstream)\u003c/code\u003e lets you choose the map implementation.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Use the three-argument \u003ccode\u003egroupingBy\u003c/code\u003e, passing \u003ccode\u003e() -\u0026gt; new EnumMap\u0026lt;\u0026gt;(LifeCycle.class)\u003c/code\u003e as the map factory\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"You can\u0026#39;t — streams always produce HashMaps\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-enums/enummap/step-6\":{\"id\":\"step-6\",\"key\":\"ej-enums/enummap/step-6\",\"prompt\":\"\u003cp\u003ePhase transitions — SOLID to LIQUID is MELT, and so on — are stored in a 2-D array indexed by two \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Ordinal\\\" data-def=\\\"An enum constant\u0026amp;#39;s position in its declaration, from \u0 thods, like \u0026lt;code\u0026gt;AbstractList\u0026lt;/code\u0026gt;. Combines the flexibility of interfaces with code reuse.\\\" data-book=\\\"Effective Java\\\"\u003eSkeletal implementation\u003c/button\u003e\"]},\"ej-lambdas/collection-return-types/step-6\":{\"id\":\"step-6\",\"key\":\"ej-lambdas/collection-return-types/step-6\",\"prompt\":\"\u003cp\u003eEvery Collection can be streamed.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"list.\"},{\"answers\":[\"stream\"],\"size\":6,\"choices\":[\"groupingBy\",\"String::toLowerCase\",\"stream\",\"FunctionalInterface\"]},{\"text\":\"().filter(...)\"}],\"code\":true,\"caseSensitive\":false},\"ej-lambdas/parallel-streams/step-2\":{\"id\":\"step-2\",\"key\":\"ej-lambdas/parallel-streams/step-2\",\"prompt\":\"\u003cp\u003eSomeone adds \u003ccode\u003e.parallel()\u003c/code\u003e to this pipeline, hoping for a speed-up on a 4-core machine. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe library can\u0026#39;t split \u003ccode\u003eStream.iterate\u003c/code\u003e, and \u003ccode\u003elimit\u003c/code\u003e makes threads compute extra, ever-more-expensive elements\\nthat will be thrown away.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe pipeline generates Mersenne primes from \u003ccode\u003eStream.iterate\u003c/code\u003e, whose elements each depend on the previous one, so the work can\u0026#39;t be split into independent chunks.\u003c/p\u003e\\n\u003cp\u003eWith \u003ccode\u003elimit(20)\u003c/code\u003e, parallel threads speculatively compute primes beyond the ones needed, and each next candidate is far more expensive than the last.\u003c/p\u003e\\n\u003cp\u003eThe result is all cores busy on work that will be thrown away, and no output for a very long time.\u003c/p\u003e\\n\u003cp\u003eParallelism pays off only for sources that split cleanly, like arrays, \u003ccode\u003eArrayList\u003c/code\u003e or \u003ccode\u003eIntStream.range\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It prints nothing and keeps the CPUs busy for a very long time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It runs about 4× faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe source and the operations are the worst possible case for parallelism.\u003c/p\u003e\\n\"},{\"html\":\"It throws an exception\",\"correct\":false,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-lambdas/parallel-streams/step-4\":{\"id\":\"step-4\",\"key\":\"ej-lambdas/parallel-streams/step-4\",\"prompt\":\"\u003cp\u003eGood or poor for parallel streams?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eArrayList\u003c/code\u003e, arrays, \u003ccode\u003eIntStream.range\u003c/code\u003e\",\"\u003ccode\u003eStream.iterate\u003c/code\u003e\",\"\u003ccode\u003elimit\u003c/code\u003e\",\"\u003ccode\u003ecount\u003c/code\u003e, \u003ccode\u003esum\u003c/code\u003e, \u003ccode\u003eanyMatch\u003c/code\u003e\"],\"right\":[\"Good — cheaply split, with good locality of reference\",\"Poor — each element depends on the previous one\",\"Poor — may compute and discard extra elements\",\"Good terminal operations — they combine cheaply\"],\"rightOrder\":[2,1,0,3]},\"ej-lambdas/parallel-streams/step-5\":{\"id\":\"step-5\",\"key\":\"ej-lambdas/parallel-streams/step-5\",\"prompt\":\"\u003cp\u003eBesides being slow, how else can parallel streams go wrong?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eparallel()\u003c/code\u003e only after measuring a real speed-up on realistic data — and keep correctness requirements in mind.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe library splits the data, processes chunks independently and combines the partial results, assuming your functions don\u0026#39;t care about order.\u003c/p\u003e\\n\u003cp\u003eIf a reduction isn\u0026#39;t associative, like subtraction, or a lambda reads or writes shared state, results can differ from run to run.\u003c/p\u003e\\n\u003cp\u003eThese bugs don\u0026#39;t throw; they silently give wrong answers. Sequential and parallel results should be identical — check that before trusting a parallel pipeline.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They can give wrong results if functions aren\u0026#39;t associative, non-interfering and stateless\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They never go wrong, only slow\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-methods/check-parameters/step-3\":{\"id\":\"step-3\",\"key\":\"ej-methods/check-parameters/step-3\",\"prompt\":\"\u003cp\u003eMatch each built-in helper to its job.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eObjects.requireNonNull(x, \u0026quot;x\u0026quot;)\u003c/code\u003e\",\"\u003ccode\u003eObjects.checkIndex(i, n)\u003c/code\u003e\",\"\u003ccode\u003eassert x \u0026gt; 0;\u003c/code\u003e\"],\"right\":[\"Throw a \u003ccode\u003eNullPointerException\u003c/code\u003e with a message if x is null; otherwise return x\",\"Throw \u003ccode\u003eIndexOutOfBoundsException\u003c/code\u003e unless 0 ≤ i \u0026lt; n\",\"Check a precondition of a private method, only when assertions are enabled\"],\"rightOrder\":[2,1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Precondition\\\" data-def=\\\"What must be ds/check-parameters/step-6\",\"prompt\":\"\u003cp\u003eValidate and assign in one line.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"this.strategy = Objects.\"},{\"answers\":[\"requireNonNull\"],\"size\":14,\"choices\":[\"firstArg\",\"toArray\",\"emptyList\",\"requireNonNull\"]},{\"text\":\"(strategy, \\\"strategy\\\");\"}],\"code\":true,\"caseSensitive\":false},\"ej-methods/defensive-copies/step-2\":{\"id\":\"step-2\",\"key\":\"ej-methods/defensive-copies/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e stores the two \u003ccode\u003eDate\u003c/code\u003es it was given in \u003ccode\u003eprivate final\u003c/code\u003e fields and checks \u003ccode\u003estart\u003c/code\u003e is before \u003ccode\u003eend\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe caller changed the period\u0026#39;s internals — and now \u003ccode\u003eend\u003c/code\u003e isn\u0026#39;t after \u003ccode\u003estart\u003c/code\u003e, breaking the invariant.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003e\u003ccode\u003efinal\u003c/code\u003e stops the field pointing elsewhere. Does it stop the \u003ccode\u003eDate\u003c/code\u003e itself changing?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$38\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1000\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e kept a reference to the caller\u0026#39;s \u003ccode\u003eDate\u003c/code\u003e — and \u003ccode\u003eDate\u003c/code\u003e is mutable.\u003c/p\u003e\\n\"},{\"html\":\"0\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws \u003ccode\u003eIllegalArgumentException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe constructor checked the dates before the caller changed one — nothing checks again.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-methods/defensive-copies/step-4\":{\"id\":\"step-4\",\"key\":\"ej-methods/defensive-copies/step-4\",\"prompt\":\"\u003cp\u003ePut a defensive constructor\u0026#39;s work in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eValidating the originals leaves a window in which another thread can change them after the check — a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"TOCTOU\\\" data-def=\\\"Time-of-check/time-of-use — another thread changes a value between when you validate it and when you use it. Defensive copies must be made before checking.\\\" data-book=\\\"Effective Java\\\"\u003etime-of-check/time-of-use\u003c/button\u003e attack.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eSuppose you check \u003ccode\u003estart\u003c/code\u003e and \u003ccode\u003eend\u003c/code\u003e first, then copy them.\u003c/p\u003e\\n\u003cp\u003eBetween the check and the copy, another thread holding the originals can change them — a time-of-check to time-of-use (TOCTOU) attack.\u003c/p\u003e\\n\u003cp\u003eYour copies then hold values that never passed validation. Copying first and validating the copies leaves no such window, because only your code can reach the copies.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Copy each mutable parameter\",\"Validate the copies, not the originals\",\"Assign the copies to the fields\"],\"start\":[1,0,2]},\"ej-methods/defensive-copies/step-5\":{\"id\":\"step-5\",\"key\":\"ej-methods/defensive-copies/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e\u0026#39;s constructor takes two \u003ccode\u003ejava.util.Date\u003c/code\u003es and stores copies of them. Why not make the copy with \u003ccode\u003estart.clone()\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDon\u0026#39;t use \u003ccode\u003eclone\u003c/code\u003e to copy a parameter whose type can be subclassed by untrusted parties.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eDate\u003c/code\u003e isn\u0026#39;t final, so the argument might be a subclass written by an attacker.\u003c/p\u003e\\n\u003cp\u003eIts \u003ccode\u003eclone\u003c/code\u003e could return an instance of that subclass that records a reference to itself in a static list, letting the attacker mutate your \u0026quot;copy\u0026quot; later.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003enew Date(start.getTime())\u003c/code\u003e creates an instance of exactly \u003ccode\u003eDate\u003c/code\u003e, whatever was passed in.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003eclone\u003c/code\u003e only on types you trust, such as arrays or final classes.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eDate\u003c/code\u003e isn\u0026#39;t final, so the argument could be a malicious subclass whose \u003ccode\u003eclone\u003c/code\u003e returns an instance it still controls\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eclone\u003c/code\u003e is too slow\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-methods/defensive-copies/step-6\":{\"id\":\"step-6\",\"key\":\"ej-methods/defensive-copies/step-6\",\"prompt\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessor\u003c/button\u003e must not leak the internal object either.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\": al recurses through the list\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The internal node structure becomes part of the exported API forever\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"ej-serialization/custom-serialized-form/step-4\":{\"id\":\"step-4\",\"key\":\"ej-serialization/custom-serialized-form/step-4\",\"prompt\":\"\u003cp\u003eExclude a field from the default serialized form.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eMark every field transient unless its value is part of the object\u0026#39;s logical state.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"private \"},{\"answers\":[\"transient\"],\"size\":9,\"choices\":[\"InvalidObjectException\",\"transient\",\"serialVersionUID\",\"enum\"]},{\"text\":\" Entry head = null;\"}],\"code\":true,\"caseSensitive\":false},\"ej-serialization/custom-serialized-form/step-5\":{\"id\":\"step-5\",\"key\":\"ej-serialization/custom-serialized-form/step-5\",\"prompt\":\"\u003cp\u003eA class with a custom serialized form marks all its fields \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"transient\\\" data-def=\\\"Marks a field to be left out of the serialized form.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003etransient\u003c/code\u003e\u003c/button\u003e and writes its data in \u003ccode\u003ewriteObject\u003c/code\u003e. Why still call \u003ccode\u003edefaultWriteObject\u003c/code\u003e and \u003ccode\u003edefaultReadObject\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eserialization\u003c/
