03e picks a small or large implementation depending on the enum\u0026#39;s size.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Be called without naming the class\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth are called through the class — \u003ccode\u003enew Foo()\u003c/code\u003e and \u003ccode\u003eFoo.of()\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Return an existing, cached instance instead of a new one\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Return an object of a subtype, even a non-public one\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Have a descriptive name, like \u003ccode\u003efromString\u003c/code\u003e or \u003ccode\u003eprobablePrime\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"ej-objects/static-factories/step-4\":{\"id\":\"step-4\",\"key\":\"ej-objects/static-factories/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBoolean.valueOf\u003c/code\u003e returns \u003ccode\u003eBoolean.TRUE\u003c/code\u003e or \u003ccode\u003eBoolean.FALSE\u003c/code\u003e, so both variables hold the very same object.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eBoolean.valueOf(String)\u003c/code\u003e parses the string case-insensitively and returns one of two pre-made constants, \u003ccode\u003eBoolean.TRUE\u003c/code\u003e or \u003ccode\u003eBoolean.FALSE\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eBoth calls return \u003ccode\u003eBoolean.TRUE\u003c/code\u003e, so \u003ccode\u003ea\u003c/code\u003e and \u003ccode\u003eb\u003c/code\u003e refer to the same object and \u003ccode\u003e==\u003c/code\u003e is true.\u003c/p\u003e\\n\u003cp\u003eThis is a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003estatic factory\u003c/button\u003e\u0026#39;s caching at work: no new objects, ever. \u003ccode\u003enew Boolean(\u0026quot;true\u0026quot;)\u003c/code\u003e — now deprecated — would have created a new object on every call.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003evalueOf\u003c/code\u003e doesn\u0026#39;t create objects — it returns one of two shared constants.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-objects/static-factories/step-6\":{\"id\":\"step-6\",\"key\":\"ej-objects/static-factories/step-6\",\"prompt\":\"\u003cp\u003eMatch each conventional factory name to what it signals.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003efrom\u003c/code\u003e\",\"\u003ccode\u003eof\u003c/code\u003e\",\"\u003ccode\u003egetInstance\u003c/code\u003e\",\"\u003ccode\u003enewInstance\u003c/code\u003e\"],\"right\":[\"Converts a single argument of another type\",\"Aggregates several values into one instance\",\"Returns an instance that may be shared\",\"Guarantees a fresh instance on every call\"],\"rightOrder\":[3,0,2,1]},\"ej-objects/static-factories/step-7\":{\"id\":\"step-7\",\"key\":\"ej-objects/static-factories/step-7\",\"prompt\":\"\u003cp\u003eWhat are the costs of providing only \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003estatic factories\u003c/button\u003e, with private constructors?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe subclassing limit is often a blessing — it nudges towards \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003ecomposition\u003c/button\u003e. Naming conventions fix discoverability.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The class can\u0026#39;t be subclassed\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They are slower to call than constructors\",\"correct\":false,\"feedback\":\"\u003cp\u003eA static call is as cheap as a constructor call; often cheaper, when it avoids allocation.\u003c/p\u003e\\n\"},{\"html\":\"Factories are harder to find in API documentation than constructors\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"ej-objects/builders/step-3\":{\"id\":\"step-3\",\"key\":\"ej-objects/builders/step-3\",\"prompt\":\"\u003cp\u003eMatch each approach to its main weakness.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eTelescoping constructors force callers to pass values by position, so \u003ccode\u003enew NutritionFacts(240, 8, 100, ctly once. Usually a single-element \u0026lt;code\u0026gt;enum\u0026lt;/code\u0026gt;, a \u0026lt;code\u0026gt;public static final\u0026lt;/code\u0026gt; field, or a static factory returning one instance.\\\" data-book=\\\"Effective Java\\\"\u003esingleton\u003c/button\u003e that must extend a superclass other than \u003ccode\u003eEnum\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The JVM guarantees one instance, even against reflection and serialization, for free\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Enums are faster than classes\",\"correct\":false,\"feedback\":\"\u003cp\u003eSpeed isn\u0026#39;t the point; the guarantees are.\u003c/p\u003e\\n\"},{\"html\":\"Enums can extend any superclass\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe opposite — an enum can\u0026#39;t extend a class, which is this approach\u0026#39;s one limitation.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Serialization\\\" data-def=\\\"Java\u0026amp;#39;s built-in mechanism for turning objects into bytes and back. A source of security bugs — prefer JSON or protobuf.\\\" data-book=\\\"Effective Java\\\"\u003eSerialization\u003c/button\u003e\"]},\"ej-objects/singletons/step-5\":{\"id\":\"step-5\",\"key\":\"ej-objects/singletons/step-5\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s an advantage of the static-factory approach over the public field?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eA method hides the decision; a public field commits to it forever.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s the only one that\u0026#39;s thread-safe\",\"correct\":false,\"f sary \u003ccode\u003eLong\u003c/code\u003e objects. Prefer primitives to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Boxed primitive\\\" data-def=\\\"The object version of a primitive — \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt; for \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt;. Has identity, can be \u0026lt;code\u0026gt;null\u0026lt;/code\u0026gt;, and may cost an allocation.\\\" data-book=\\\"Effective Java\\\"\u003eboxed primitives\u003c/button\u003e, and watch for unintended \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Autoboxing\\\" data-def=\\\"The compiler converting automatically between primitives and their boxed types — \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; ↔ \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eautoboxing\u003c/button\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003esum\u003c/code\u003e is declared as \u003ccode\u003eLong\u003c/code\u003e with a capital L, a boxed type, while \u003ccode\u003ei\u003c/code\u003e is a primitive \u003ccode\u003elong\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eEvery \u003ccode\u003esum += i\u003c/code\u003e unboxes \u003ccode\u003esum\u003c/code\u003e, adds, and boxes the result into a brand-new \u003ccode\u003eLong\u003c/code\u003e object — about 2^31 allocations.\u003c/p\u003e\\n\u003cp\u003eChanging one character, \u003ccode\u003eLong\u003c/code\u003e to \u003ccode\u003elong\u003c/code\u003e, makes the loop several times faster.\u003c/p\u003e\\n\u003cp\u003eUnintended autoboxing is easy to miss because the code compiles and gives the right answer.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e+=\u003c/code\u003e on a \u003ccode\u003elong\u003c/code\u003e is slow in Java\",\"corr e disk fails. \u003ccode\u003eread\u003c/code\u003e throws, and then \u003ccode\u003eclose\u003c/code\u003e in the \u003ccode\u003efinally\u003c/code\u003e throws too. Which exception does the caller see?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe first exception — the one explaining what went wrong — is the one that vanishes.\u003c/p\u003e\\n\",\"details\":\"$18\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$19\",\"options\":[{\"html\":\"The one from \u003ccode\u003eclose\u003c/code\u003e — it replaces the original, which is lost\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Both, combined\",\"correct\":false,\"feedback\":\"\u003cp\u003ePlain try-finally has no way to combine them.\u003c/p\u003e\\n\"},{\"html\":\"The one from \u003ccode\u003eread\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn exception thrown in \u003ccode\u003efinally\u003c/code\u003e replaces the one in flight.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-objects/try-with-resources/step-4\":{\"id\":\"step-4\",\"key\":\"ej-objects/try-with-resources/step-4\",\"prompt\":\"$1a\",\"explanation\":\"\u003cp\u003eReverse order of declaration, and the original exception wins.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"\u003ccode\u003etransferTo\u003c/code\u003e throws exception A\",\"\u003ccode\u003eout\u003c/code\u003e is closed first — the last resource opened\",\"\u003ccode\u003ein\u003c/code\u003e is closed; if its \u003ccode\u003eclose()\u003c/code\u003e throws B, B is attached to A as a suppressed exception\",\"A reaches the caller, with B available from \u003ccode\u003eA.getSuppressed()\u003c/code\u003e\"],\"start\":[1,3,2,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Suppressed exception\\\" data-def=\\\"An exception thrown while closing a resource after another exception already happened. \u0026lt;code\u0026gt;try\u0026lt;/code\u0026gt;-with-resources keeps the first and attaches the others, retrievable with \u0026lt;code\u0026gt;getSuppressed()\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eSuppressed exception\u003c/button\u003e\"]},\"ej-objects/try-with-resources/step-5\":{\"id\":\"step-5\",\"key\":\"ej-objects/try-with-resources/step-5\",\"prompt\":\"\u003cp\u003eComplete the header.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe resource must implement \u003ccode\u003eAutoCloseable\u003c/code\u003e. A \u003ccode\u003ecatch\u003c/code\u003e clause can follow, as with an ordinary try.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"answers\":[\"try\"],\"size\":3,\"choices\":[\"INSTANCE\",\"null\",\"private\",\"try\"]},{\"text\":\" (BufferedReader br = new BufferedReader(new FileReader(path))) { return br.readLine(); }\"}],\"code\":true,\"caseSensitive\":false},\"ej-common-methods/equals-contract/step-3\":{\"id\":\"step-3\",\"key\":\"ej-common-methods/equals-contract/step-3\",\"prompt\":\"\u003cp\u003eMatch each property to an example of it being broken.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Symmetry\",\"Transitivity\",\"Consistency\",\"Non-nullity\"],\"right\":[\"\u003ccode\u003ea.equals(b)\u003c/code\u003e is true but \u003ccode\u003eb.equals(a)\u003c/code\u003e is false\",\"\u003ccode\u003ea\u003c/code\u003e equals \u003ccode\u003eb\u003c/code\u003e, \u003ccode\u003eb\u003c/code\u003e equals \u003ccode\u003ec\u003c/code\u003e, but \u003ccode\u003ea\u003c/code\u003e doesn\u0026#39;t equal \u003ccode\u003ec\u003c/code\u003e\",\"The answer changes because \u003ccode\u003eequals\u003c/code\u003e reads a remote resource\",\"\u003ccode\u003ex.equals(null)\u003c/code\u003e throws a \u003ccode\u003eNullPointerException\u003c/code\u003e\"],\"rightOrder\":[1,0,2,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Symmetric\\\" data-def=\\\"If \u0026lt;code\u0026gt;x.equals(y)\u0026lt;/code\u0026gt; then \u0026lt;code\u0026gt;y.equals(x)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eSymmetric\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Transitive\\\" data-def=\\\"If \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;y\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;x\u0026lt;/code\u0026gt; equals \u0026lt;code\u0026gt;z\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eTransitive\u003c/button\u003e\"]},\"ej-common-methods/equals-contract/step-4\":{\"id\":\"step-4\",\"key\":\"ej-common-methods/equals-contract/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eCaseInsensitiveString.equals\u003c/code\u003e returns true for an ordinary \u003ccode\u003eString\u003c/code\u003e with the same letters in any case.\\nWhat\u0026#39;s wrong with that?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eDon\u0026#39;t try to make \u003ccode\u003eequals\u003c/code\u003e interoperate with a class you don\u0026#39;t control.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003ecis.equals(s)\u003c/code\u003e is true because \u003ccode\u003eCaseInsensitiveString\u003c/code\u003e knows about \u003ccode\u003eString\u003c/code\u003e, but \u003ccode\u003eString.equals\u003c/code\u003e only accepts other \u003ccode\u003eString\u003c/code\u003es, so \u003ccode\u003es.equals(cis)\u003c/code\u003e is false.\u003c/p\u003e\\n\u003cp\u003eAsymmetric \u003ccode\u003eequals\u003c/code\u003e breaks collections in unpredictable ways: whether \u003ccode\u003elist.contains(cis)\u003c/code\u003e is true depends on which object\u0026#39;s \u003ccode\u003eequals\u003c/code\u003e the implementation happens to call.\u003c/p\u003e\\n\u003cp\u003eThe fix is to compare only with other \u003ccode\u003eCaseInsensitiveString\u003c/code\u003es — one class can\u0026#39;t unilaterally declare itself equal to a type it doesn\u0026#39;t control.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$1b\",\"options\":[{\"html\":\"It breaks reflexivity\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ecis.equals(cis)\u003c/code\u003e is still true. The problem appears between two different classes.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — it\u0026#39;s a sensible convenience\",\"correct\":false,\"feedback\":\"\u003cp\u003ePut both in a \u003ccode\u003eList\u003c/code\u003e and \u003ccode\u003econtains\u003c/code\u003e could answer either way depending on the implementation.\u003c/p\u003e\\n\"},{\"html\":\"It breaks symmetry — \u003ccode\u003eString.equals\u003c/code\u003e knows nothing about the new class and returns false\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Symmetric\\\" data-def=\\\"If \u0026lt;code\u0026gt;x.equals(y)\u0026lt;/code\u0026gt; then \u0026lt;code\u0026gt;y.equals(x)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eSymmetric\u003c/button\u003e\"]},\"ej-common-methods/equals-contract/step-5\":{\"id\":\"step-5\",\"key\":\"ej-common-methods/equals-contract/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eColorPoint extends Point\u003c/code\u003e adds a color, and you want \u003ccode\u003eequals\u003c/code\u003e to compare it too. What\u0026#39;s the catch?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGive \u003ccode\u003eColorPoint\u003c/code\u003e a private \u003ccode\u003ePoint\u003c/code\u003e field and an \u003ccode\u003easPoint()\u003c/code\u003e view, rather than extending \u003ccode\u003ePoint\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$1c\",\"diagram\":\"$1d\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Just compare \u003ccode\u003egetClass()\u003c/code\u003e instead of using \u003ccode\u003einstanceof\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat keeps the contract but breaks substitutability — a \u003ccode\u003ePoint\u003c/code\u003e subclass could never equal a \u003ccode\u003ePoint\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"There\u0026#39;s no way to extend an instantiable class with a value field and keep the equals contract — use composition instead\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Ignore the color in \u003ccode\u003eColorPoint.equals\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen two points of different colors are \u0026quot;equal\u0026quot;, which isn\u0026#39;t what you wanted.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Composition\\\" data-def=\\\"Building a class by giving it a private field holding another object and forwarding to it, rather than extending that object\u0026amp;#39;s class.\\\" data-book=\\\"Effective Java\\\"\u003eComposition\u003c/button\u003e\"]},\"ej-common-methods/equals-contract/step-7\":{\"id\":\"step-7\",\"key\":\"ej-common-methods/equals-contract/step-7\",\"prompt\":\"\u003cp\u003ePut the steps of a high-quality \u003ccode\u003eequals\u003c/code\u003e in order.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eif (!(o instanceof Point p)) return false;\u003c/code\u003e does the check and cast in one line with pattern matching.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Return true if the argument is \u003ccode\u003ethis\u003c/code\u003e (a cheap shortcut)\",\"Use \u003ccode\u003einstanceof\u003c/code\u003e to check the type — it also returns false for null\",\"Cast the argument to the right type\",\"Compare each significant field\"],\"start\":[1,3,2,0]},\"ej-common-methods/equals-contract/step-8\":{\"id\":\"step-8\",\"key\":\"ej-common-methods/equals-contract/step-8\",\"prompt\":\"\u003cp\u003eWhich is a sound way to compare \u003ccode\u003edouble\u003c/code\u003e fields in \u003ccode\u003eequals\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eFloat.compare\u003c/code\u003e and \u003ccode\u003eDouble.compare\u003c/code\u003e for floating-point fields; for records, the compiler does this for you.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eDouble.compare(a, b) == 0\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ea == b\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eNaN == NaN\u003c/code\u003e is false and \u003ccode\u003e-0.0 == 0.0\u003c/code\u003e is true — both wrong for equality of values.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-common-methods/hashcode/step-2\":{\"id\":\"step-2\",\"key\":\"ej-common-methods/hashcode/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePoint\u003c/code\u003e overrides \u003ccode\u003eequals\u003c/code\u003e to compare \u003ccode\u003ex\u003c/code\u003e and \u003ccode\u003ey\u003c/code\u003e, but not \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAlmost certainly \u003ccode\u003enull\u003c/code\u003e. (Occasionally the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Identity\\\" data-def=\\\"Whether two references point to the very same object — what \u0026lt;code\u0026gt;==\u0026lt;/code\u0026gt; compares for objects.\\\"\u003eidentity\u003c/button\u003e hashes collide — making the bug intermittent, which is worse.)\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eHashMap.get\u003c/code\u003e first computes the key\u0026#39;s hash code to pick a bucket, and only then calls \u003ccode\u003eequals\u003c/code\u003e on keys in that bucket.\u003c/p\u003e\\n\u003cp\u003eWithout an override, \u003ccode\u003ehashCode\u003c/code\u003e comes from \u003ccode\u003eObject\u003c/code\u003e and is based on identity, so two equal points almost always get different codes and land in different buckets.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eget\u003c/code\u003e looks in the wrong bucket, never calls \u003ccode\u003eequals\u003c/code\u003e, and returns \u003ccode\u003enull\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWhenever you override \u003ccode\u003eequals\u003c/code\u003e, override \u003ccode\u003ehashCode\u003c/code\u003e from the same fields.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhich method does \u003ccode\u003eHashMap.get\u003c/code\u003e call first?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$1e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"null\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"home\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe two \u003ccode\u003ePoint\u003c/code\u003es are equal, but their inherited hash codes differ, so \u003ccode\u003eget\u003c/code\u003e searches another bucket.\u003c/p\u003e\\n\"},{\"html\":\"A \u003ccode\u003eNullPointerException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eget\u003c/code\u003e returns null for a missing key; it doesn\u0026#39;t throw.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-common-methods/hashcode/step-4\":{\"id\":\"step-4\",\"key\":\"ej-common-methods/hashcode/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePoint\u003c/code\u003e has \u003ccode\u003eint\u003c/code\u003e fields \u003ccode\u003ex\u003c/code\u003e and \u003ccode\u003ey\u003c/code\u003e, and \u003ccode\u003eequals\u003c/code\u003e compares both. Which \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e implementations are legal?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003ereturn 42\u003c/code\u003e is \u003cem\u003elegal\u003c/em\u003e but every point lands in one bucket and the map degrades into a list. \u003ccode\u003eObjects.hash\u003c/code\u003e is\\nconcise but allocates an array per call; the hand-written form is fastest.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe only hard rule is that equal objects must return equal hash codes, so even \u003ccode\u003ereturn 42\u003c/code\u003e is legal — it just sends every point to one bucket and turns lookups from constant time into a linear scan.\u003c/p\u003e\\n\u003cp\u003eA good hash spreads unequal objects across many values. Multiplying by 31 mixes the fields so that \u003ccode\u003e(1, 2)\u003c/code\u003e and \u003ccode\u003e(2, 1)\u003c/code\u003e usually differ.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eObjects.hash(x, y)\u003c/code\u003e gives the same quality in one line, at the cost of an array allocation and boxing per call — fine unless the method is very hot.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ereturn System.identityHashCode(this);\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eTwo equal points would get different values — exactly the bug we just saw.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ereturn Objects.hash(x, y);\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ereturn 31 * Integer.hashCode(x) + Integer.hashCode(y);\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ereturn 42;\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"ej-common-methods/hashcode/step-5\":{\"id\":\"step-5\",\"key\":\"ej-common-methods/hashcode/step-5\",\"prompt\":\"\u003cp\u003eComplete the contract.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUnequal objects \u003cem\u003emay\u003c/em\u003e share a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003ehash code\u003c/button\u003e — that\u0026#39;s a collision, and costs only performance.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"If two objects are \",\"html\":\"If two objects are \"},{\"answers\":[\"equal\"],\"size\":5,\"choices\":[\"fail\",\"hashCode\",\"persistent\",\"equal\"]},{\"text\":\" according to `equals`, they must have the same \",\"html\":\" according to \u003ccode\u003eequals\u003c/code\u003e, they must have the same \"},{\"answers\":[\"hashCode\",\"hash code\"],\"size\":9,\"choices\":[\"danger\",\"equal\",\"hashCode\",\"source\"]},{\"text\":\". The reverse need not hold.\",\"html\":\". The reverse need not hold.\"}],\"code\":false,\"caseSensitive\":false},\"ej-common-methods/hashcode/step-6\":{\"id\":\"step-6\",\"key\":\"ej-common-methods/hashcode/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePerson\u003c/code\u003e uses \u003ccode\u003ename\u003c/code\u003e in both \u003ccode\u003eequals\u003c/code\u003e and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e, and has a setter for \u003ccode\u003ename\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eMutating a field \u003ccode\u003ehashCode\u003c/code\u003e uses, while the object sits in a hash collection, strands it in the wrong bucket.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen \u003ccode\u003ep\u003c/code\u003e was added, the set stored it in the bucket for the hash code of \u0026quot;Ada\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eChanging the name changes the hash code, so \u003ccode\u003econtains(p)\u003c/code\u003e looks in the bucket for \u0026quot;Grace\u0026quot;, finds nothing and returns \u003ccode\u003efalse\u003c/code\u003e — even though the very same object is in the set.\u003c/p\u003e\\n\u003cp\u003eThe object is stranded: it can\u0026#39;t be found or removed, and iterating still shows it.\u003c/p\u003e\\n\u003cp\u003eDon\u0026#39;t mutate fields used by \u003ccode\u003eequals\u003c/code\u003e and \u003ccode\u003ehashCode\u003c/code\u003e while an object is a key or element of a hash-based collection; \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e keys avoid this entirely.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$1f\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ep\u003c/code\u003e is still in the set — but filed in the bucket for its \u003cem\u003eold\u003c/em\u003e hash code.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-common-methods/hashcode/step-7\":{\"id\":\"step-7\",\"key\":\"ej-common-methods/hashcode/step-7\",\"prompt\":\"\u003cp\u003eMay you leave a significant field out of \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003e\u003ccode\u003ehashCode\u003c/code\u003e\u003c/button\u003e to make it faster?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFields excluded from \u003ccode\u003eequals\u003c/code\u003e \u003cem\u003emust\u003c/em\u003e be excluded from \u003ccode\u003ehashCode\u003c/code\u003e, or equal objects could hash differently.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Yes, always — fewer fields means a faster hash\",\"correct\":false,\"feedback\":\"\u003cp\u003eLeaving out important fields can make hash tables unusably slow.\u003c/p\u003e\\n\"},{\"html\":\"Only if you accept more collisions — and never include a field that \u003ccode\u003eequals\u003c/code\u003e ignores\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-common-methods/tostring/step-2\":{\"id\":\"step-2\",\"key\":\"ej-common-methods/tostring/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ePhoneNumber\u003c/code\u003e doesn\u0026#39;t override \u003ccode\u003etoString\u003c/code\u003e. What does \u003ccode\u003eSystem.out.println(new PhoneNumber(707, 867, 5309))\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eObject.toString\u003c/code\u003e gives the class name, \u003ccode\u003e@\u003c/code\u003e, and the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Hash code\\\" data-def=\\\"An \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; summary of an object used by hash tables to pick a bucket. Equal objects must have equal hash codes; unequal ones ideally differ.\\\" data-book=\\\"Effective Java\\\"\u003ehash code\u003c/button\u003e in hex — rarely useful.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Something like \u003ccode\u003ePhoneNumber@163b91\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e707-867-5309\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s what you\u0026#39;d want — but \u003ccode\u003eObject.toString\u003c/code\u003e doesn\u0026#39;t know your fields.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — it fails to compile\",\"correct\":false,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-common-methods/tostring/step-4\":{\"id\":\"step-4\",\"key\":\"ej-common-methods/tostring/step-4\",\"prompt\":\"\u003cp\u003eShould you document the exact format of \u003ccode\u003etoString\u003c/code\u003e\u0026#39;s output?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eEither way, say in the docs whether the format is guaranteed, and offer \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessors\u003c/button\u003e so no one has to parse the string.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eSpecifying the format turns \u003ccode\u003etoString\u003c/code\u003e into a parsing contract: clients will write code that reads it, and you can never change it without breaking them.\u003c/p\u003e\\n\u003cp\u003eFor value classes like phone numbers, a standard, documented format is useful and often paired with a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static factory method\\\" data-def=\\\"A static method that returns an instance, like \u0026lt;code\u0026gt;Integer.valueOf(42)\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;List.of()\u0026lt;/code\u0026gt;. Unlike a constructor it has a name, can return a cached object, and can return a subtype.\\\" data-book=\\\"Effective Java\\\"\u003estatic factory\u003c/button\u003e that parses it.\u003c/p\u003e\\n\u003cp\u003eFor other classes, leave it unspecified and say so in the docs.\u003c/p\u003e\\n\u003cp\u003eEither way, provide accessors for every value in the string, so no one needs to parse it to get them.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Never — it\u0026#39;s for debugging only\",\"correct\":false,\"feedback\":\"\u003cp\u003eEither choice is reasonable; what matters is stating the intent clearly.\u003c/p\u003e\\n\"},{\"html\":\"For value classes it can help — but once specified, you\u0026#39;re stuck with that format forever\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Value class\\\" data-def=\\\"A class whose instances represent a value, like \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;LocalDate\u0026lt;/code\u0026gt;, where two instances with the same contents should be equal.\\\" data-book=\\\"Effective Java\\\"\u003eValue class\u003c/button\u003e\"]},\"ej-common-methods/tostring/step-5\":{\"id\":\"step-5\",\"key\":\"ej-common-methods/tostring/step-5\",\"prompt\":\"\u003cp\u003eWhy provide \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003egetters\u003c/button\u003e for the values that appear in \u003ccode\u003etoString\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Because \u003ccode\u003etoString\u003c/code\u003e can\u0026#39;t access private fields\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s inside the class, so it can.\u003c/p\u003e\\n\"},{\"html\":\"Otherwise clients parse the string to get them, making the format a de facto API\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-common-methods/tostring/step-6\":{\"id\":\"step-6\",\"key\":\"ej-common-methods/tostring/step-6\",\"prompt\":\"\u003cp\u003eComplete the override.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"@Override public \"},{\"answers\":[\"String\"],\"size\":6,\"choices\":[\"comparingInt\",\"String\",\"thenComparingInt\",\"toString\"]},{\"text\":\" \"},{\"answers\":[\"toString\"],\"size\":8,\"choices\":[\"thenComparingInt\",\"toString\",\"comparingInt\",\"String\"]},{\"text\":\"() { return \\\"Point[x=\\\" + x + \\\", y=\\\" + y + \\\"]\\\"; }\"}],\"code\":true,\"caseSensitive\":false},\"ej-common-methods/clone/step-2\":{\"id\":\"step-2\",\"key\":\"ej-common-methods/clone/step-2\",\"prompt\":\"\u003cp\u003eA \u003ccode\u003eStack\u003c/code\u003e with an \u003ccode\u003eObject[] elements\u003c/code\u003e field overrides \u003ccode\u003eclone\u003c/code\u003e as just \u003ccode\u003ereturn (Stack) super.clone();\u003c/code\u003e. What\u0026#39;s wrong?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe fix is \u003ccode\u003eresult.elements = elements.clone();\u003c/code\u003e — and mutable fields must not be \u003ccode\u003efinal\u003c/code\u003e, or you can\u0026#39;t reassign them.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eObject.clone\u003c/code\u003e makes a shallow, field-by-field copy, so the clone\u0026#39;s \u003ccode\u003eelements\u003c/code\u003e field points to the very same array as the original.\u003c/p\u003e\\n\u003cp\u003ePush onto the clone and you overwrite the original\u0026#39;s slots; pop from one and the other\u0026#39;s \u003ccode\u003esize\u003c/code\u003e no longer matches its contents.\u003c/p\u003e\\n\u003cp\u003eA correct \u003ccode\u003eclone\u003c/code\u003e must deep-copy mutable state: \u003ccode\u003eresult.elements = elements.clone()\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThis is one of the many traps that make copy constructors or static copy factories a better choice for most classes.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"The clone shares the same array as the original, so pushing onto one corrupts the other\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It throws \u003ccode\u003eCloneNotSupportedException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eOnly if \u003ccode\u003eStack\u003c/code\u003e doesn\u0026#39;t implement \u003ccode\u003eCloneable\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — \u003ccode\u003esuper.clone()\u003c/code\u003e copies everything\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt copies the \u003cem\u003ereference\u003c/em\u003e to the array, not the array.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-common-methods/clone/step-4\":{\"id\":\"step-4\",\"key\":\"ej-common-methods/clone/step-4\",\"prompt\":\"\u003cp\u003eWhich are advantages of copy constructors over \u003ccode\u003eclone\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"They work with \u003ccode\u003efinal\u003c/code\u003e fields\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They don\u0026#39;t throw a checked exception or need a cast\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They can accept an interface, converting between implementations\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They perform a deep copy automatically\",\"correct\":false,\"feedback\":\"\u003cp\u003eNeither approach copies deeply on its own; you write that logic either way.\u003c/p\u003e\\n\"}],\"multiple\":true,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Checked exception\\\" data-def=\\\"An exception the compiler forces you to catch or declare (\u0026lt;code\u0026gt;throws\u0026lt;/code\u0026gt;), e.g. \u0026lt;code\u0026gt;IOException\u0026lt;/code\u0026gt;. For conditions the caller can reasonably recover from.\\\" data-book=\\\"Effective Java\\\"\u003eChecked exception\u003c/button\u003e\"]},\"ej-common-methods/clone/step-5\":{\"id\":\"step-5\",\"key\":\"ej-common-methods/clone/step-5\",\"prompt\":\"\u003cp\u003eWhere is \u003ccode\u003eclone\u003c/code\u003e still the best choice?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Copying any new class you design\",\"correct\":false,\"feedback\":\"\u003cp\u003eFor new classes, prefer copy constructors or factories.\u003c/p\u003e\\n\"},{\"html\":\"Copying arrays — \u003ccode\u003earray.clone()\u003c/code\u003e is concise and correct\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-common-methods/comparable/step-2\":{\"id\":\"step-2\",\"key\":\"ej-common-methods/comparable/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eBigDecimal(\u0026quot;1.0\u0026quot;)\u003c/code\u003e and \u003ccode\u003eBigDecimal(\u0026quot;1.00\u0026quot;)\u003c/code\u003e are not \u003ccode\u003eequals\u003c/code\u003e (different scale), but \u003ccode\u003ecompareTo\u003c/code\u003e says they\u0026#39;re equal.\\nAdd both to a \u003ccode\u003eHashSet\u003c/code\u003e and to a \u003ccode\u003eTreeSet\u003c/code\u003e. How many elements does each hold?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eHashSet uses \u003ccode\u003eequals\u003c/code\u003e; TreeSet uses \u003ccode\u003ecompareTo\u003c/code\u003e. An ordering inconsistent with equals makes sorted collections behave differently.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA \u003ccode\u003eHashSet\u003c/code\u003e decides whether two elements are duplicates with \u003ccode\u003eequals\u003c/code\u003e, and \u003ccode\u003eBigDecimal.equals\u003c/code\u003e compares both value and scale, so \u003ccode\u003e1.0\u003c/code\u003e and \u003ccode\u003e1.00\u003c/code\u003e are different.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eTreeSet\u003c/code\u003e decides with \u003ccode\u003ecompareTo\u003c/code\u003e, which compares only the numeric value, so it sees them as the same and keeps one.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eComparable\u003c/code\u003e\u0026#39;s contract strongly recommends that \u003ccode\u003ecompareTo\u003c/code\u003e be consistent with \u003ccode\u003eequals\u003c/code\u003e precisely to avoid this; \u003ccode\u003eBigDecimal\u003c/code\u003e is the famous exception, and its documentation warns about it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"HashSet 1, TreeSet 2\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"HashSet 2, TreeSet 1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Both 2\",\"correct\":false,\"feedback\":\"\u003cp\u003eTreeSet uses \u003ccode\u003ecompareTo\u003c/code\u003e, which treats them as equal.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-common-methods/comparable/step-4\":{\"id\":\"step-4\",\"key\":\"ej-common-methods/comparable/step-4\",\"prompt\":\"\u003cp\u003eWhat\u0026#39;s wrong with this comparator?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eInteger.compare(o1.hashCode(), o2.hashCode())\u003c/code\u003e, or \u003ccode\u003eComparator.comparingInt(Object::hashCode)\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$20\",\"options\":[{\"html\":\"The subtraction can overflow for large values of opposite sign, giving the wrong sign\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — subtraction is the standard trick\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt\u0026#39;s a well-known bug. Use \u003ccode\u003eInteger.compare\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"Comparators can\u0026#39;t be lambdas\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-common-methods/comparable/step-5\":{\"id\":\"step-5\",\"key\":\"ej-common-methods/comparable/step-5\",\"prompt\":\"\u003cp\u003eBuild a comparator for phone numbers by area code, then prefix.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eComparator construction methods read clearly and avoid hand-written arithmetic.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Comparator.\"},{\"answers\":[\"comparingInt\"],\"size\":12,\"choices\":[\"thenComparingInt\",\"comparingInt\",\"String\",\"toString\"]},{\"text\":\"((PhoneNumber pn) -\u003e pn.areaCode).\"},{\"answers\":[\"thenComparingInt\"],\"size\":16,\"choices\":[\"String\",\"thenComparingInt\",\"toString\",\"comparingInt\"]},{\"text\":\"(pn -\u003e pn.prefix)\"}],\"code\":true,\"caseSensitive\":false},\"ej-common-methods/comparable/step-6\":{\"id\":\"step-6\",\"key\":\"ej-common-methods/comparable/step-6\",\"prompt\":\"\u003cp\u003eInside \u003ccode\u003ecompareTo\u003c/code\u003e, how should you compare two \u003ccode\u003eint\u003c/code\u003e fields?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ea - b\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eOverflow, as above.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ea \u0026lt; b\u003c/code\u003e and \u003ccode\  making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessor\u003c/button\u003e has the same problem.\u003c/p\u003e\\n\u003cp\u003eThe fixes either hand out a read-only view, \u003ccode\u003eCollections.unmodifiableList(Arrays.asList(PRIVATE_VALUES))\u003c/code\u003e, or a fresh copy on each call; \u003ccode\u003eList.copyOf\u003c/code\u003e or \u003ccode\u003eList.of\u003c/code\u003e work just as well in modern Java.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"\u003cpre class=\\\"shiki shiki-themes github-light github-dark\\\" style=\\\"--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e\\\" tabindex=\\\"0\\\"\u003e\u003ccode\u003e\u003cspan class=\\\"line\\\"\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003epublic\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e static\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e final\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e Thing\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e[] VALUES \u003c/span\u003e\u003cspan style=\\\"--shiki-light:#D73A49;--shiki-dark:#F97583\\\"\u003e=\u003c/span\u003e\u003cspan style=\\\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\\\"\u003e { ... };\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"The array is mutable — anyone can replace its elements, even though the field is final\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing — it\u0026#39;s \u003ccode\u003efinal\u003c/code\u003e, so it can\u0026#39;t change\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003efinal\u003c/code\u003e stops the field pointing at another array; the array\u0026#39;s contents are still writable.\u003c/p\u003e\\n\"},{\"html\":\"Arrays can\u0026#39;t be static\",\"correct\":false,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-classes/minimize-accessibility/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/minimize-accessibility/step-5\",\"prompt\":\"\u003cp\u003eA method overrides one from a superclass. Can it be less accessible than the original?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThat\u0026#39;s the one rule that forces wider access than you\u0026#39;d choose.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No — the compiler forbids it, so instances of the subclass are usable wherever the superclass is\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, any level is allowed\",\"correct\":false,\"feedback\":\"$undefined\"}],\"multiple\":false},\"ej-classes/minimize-accessibility/step-6\":{\"id\":\"step-6\",\"key\":\"ej-classes/minimize-accessibility/step-6\",\"prompt\":\"\u003cp\u003eIs it fine to make a private field package-private so a test can read it?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Package-private for testing is acceptable; going further, to protected or public, is not\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Make it public — tests matter more\",\"correct\":false,\"feedback\":\"\u003cp\u003eTests can live in the same package; public would make the field part of your API.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-classes/minimize-accessibility/step-7\":{\"id\":\"step-7\",\"key\":\"ej-classes/minimize-accessibility/step-7\",\"prompt\":\"\u003cp\u003eComplete the rule.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"Instance fields of public classes should rarely be \",\"html\":\"Instance fields of public classes should rarely be \"},{\"answers\":[\"public\"],\"size\":6,\"choices\":[\"default\",\"public\",\"top-level\",\"fail\"]},{\"text\":\"; classes with public mutable fields are generally not \",\"html\":\"; classes with public mutable fields are generally not \"},{\"answers\":[\"thread-safe\",\"thread safe\"],\"size\":11,\"choices\":[\"fail\",\"top-level\",\"thread-safe\",\"public\"]},{\"text\":\".\",\"html\":\".\"}],\"code\":false,\"caseSensitive\":false},\"ej-classes/accessor-methods/step-2\":{\"id\":\"step-2\",\"key\":\"ej-classes/accessor-methods/step-2\",\"prompt\":\"\u003cp\u003eWhich problems do public fields cause in a \u003cstrong\u003epublic\u003c/strong\u003e class?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA public field is part of the class\u0026#39;s contract forever: every client reads and writes it directly, so you can\u0026#39;t later store the value differently, compute it on demand or validate a new value.\u003c/p\u003e\\n\u003cp\u003eWith an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessor\u003c/button\u003e, the field is an implementation detail behind a method, so you can change the representation, add checks, log access or make it lazy without breaking anyone.\u003c/p\u003e\\n\u003cp\u003eThis only matters where clients outside your control exist — that is, in public classes. Inside a package or a private nested class, you can fix every user yourself.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"No action can be taken when a field is accessed\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The representation can never change without breaking clients\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Invariants can\u0026#39;t be enforced\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They make the class slower\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eAccessors\u003c/button\u003e are inlined by the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"JIT\\\" data-def=\\\"The JVM\u0026amp;#39;s just-in-time compiler — turns frequently run bytecode into optimized machine code while the program runs.\\\"\u003eJIT\u003c/button\u003e; speed isn\u0026#39;t the issue.\u003c/p\u003e\\n\"}],\"multiple\":true},\"ej-classes/accessor-methods/step-4\":{\"id\":\"step-4\",\"key\":\"ej-classes/accessor-methods/step-4\",\"prompt\":\"\u003cp\u003eWhen is exposing fields directly acceptable?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eChanges then stay within the package, so you can fix every client at once.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"In package-private or private nested classes, where all clients are under your control\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Never\",\"correct\":false,\"feedback\":\"\u003cp\u003eInside a package or a nested class, it can be the clearest code.\u003c/p\u003e\\n\"},{\"html\":\"Whenever the fields are \u003ccode\u003efinal\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eImmutable\u003c/button\u003e public fields are less harmful, but still fix the representation forever.\u003c/p\u003e\\n\"}],\"multiple\":false},\"ej-classes/accessor-methods/step-5\":{\"id\":\"step-5\",\"key\":\"ej-classes/accessor-methods/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003ejava.awt.Point\u003c/code\u003e and \u003ccode\u003eDimension\u003c/code\u003e expose public fields. What\u0026#39;s the lasting consequence?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThey\u0026#39;re cautionary examples in the platform itself.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$undefined\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Nothing, since they\u0026#39;re simple\",\"correct\":false,\"feedback\":\"$undefined\"},{\"html\":\"Their representation is frozen in the public API, and the performance problems they cause can\u0026#39;t be fixed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"ej-classes/accessor-methods/step-6\":{\"id\":\"step-6\",\"key\":\"ej-classes/accessor-methods/step-6\",\"prompt\":\"\u003cp\u003eModern Java offers a concise \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u002
