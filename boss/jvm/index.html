e\",\"code\":\"$undefined\",\"options\":[{\"html\":\"An order ID\",\"correct\":false,\"feedback\":\"\u003cp\u003eIdentifiers like this are exactly what investigations need.\u003c/p\u003e\\n\"},{\"html\":\"A user\u0026#39;s password\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"An access token\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"tsj-profiling/resource-consumption/step-2\":{\"id\":\"step-2\",\"key\":\"tsj-profiling/resource-consumption/step-2\",\"prompt\":\"\u003cp\u003eMatch each pattern with what it suggests.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Heap low points rise after every GC\",\"CPU at 100% while no requests arrive\",\"Thread count climbs steadily\",\"CPU low, responses slow\"],\"right\":[\"A memory leak\",\"A busy loop or a runaway background task\",\"Threads created but never ended\",\"Threads waiting — on locks, I/O or other services\"],\"rightOrder\":[1,2,0,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\"]},\"tsj-profiling/resource-consumption/step-4\":{\"id\":\"step-4\",\"key\":\"tsj-profiling/resource-consumption/step-4\",\"prompt\":\"\u003cp\u003eThe heap graph is a steady sawtooth that returns to the same low point. What does that mean?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A memory leak\",\"correct\":false,\"feedback\":\"\u003cp\u003eA leak shows as low points that keep rising.\u003c/p\u003e\\n\"},{\"html\":\"Normal behaviour — objects are allocated and collected\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"tsj-profiling/resource-consumption/step-6\":{\"id\":\"step-6\",\"key\":\"tsj-profiling/resource-consumption/step-6\",\"prompt\":\"\u003cp\u003eThe CPU is at 100% with no traffic. What do you look at first in the profiler?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The CPU sampler\u0026#39;s hottest methods and their threads\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The heap histogram\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s for memory. Start with where the CPU time goes.\u003c/p\u003e\\n\"}],\"multiple\":false},\"tsj-profiling/sampling-and-instrumenting/step-3\":{\"id\":\"step-3\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-3\",\"prompt\":\"\u003cp\u003ePut the profiling workflow in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"Sample the whole app to find the slow area\",\"Instrument just the packages in that area\",\"Read exact call counts and durations\",\"Change the code and measure again\"],\"start\":[3,2,0,1]},\"tsj-profiling/sampling-and-instrumenting/step-5\":{\"id\":\"step-5\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-5\",\"prompt\":\"\u003cp\u003eThe profiler shows \u003ccode\u003eSELECT * FROM item WHERE order_id = ?\u003c/code\u003e ran 1,000 times for one page load. What\u0026#39;s wrong?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eRunning the same query once per order means the code loaded the orders, then looped over them and fetched each order\u0026#39;s items separately — usually through a lazy association.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s 1 + N queries, each paying a network round trip.\u003c/p\u003e\\n\u003cp\u003eA join fetch, batch fetching or a single \u003ccode\u003eIN\u003c/code\u003e query loads all the items at once. Profilers that list SQL statements make this pattern obvious.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"An N+1 query — items are loaded lazily, one query per order, instead of in one query\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The database needs a bigger cache\",\"correct\":false,\"feedback\":\"\u003cp\u003eEach query may be fast; the problem is running a thousand of them.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCache\u003c/button\u003e\"]},\"tsj-profiling/sampling-and-instrumenting/step-6\":{\"id\":\"step-6\",\"key\":\"tsj-profiling/sampling-and-instrumenting/step-6\",\"prompt\":\"\u003cp\u003eMatch each question with sampling or \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Instrumentation\\\" data-def=\\\"Adding measuring code to methods so a profiler can count every call exactly, at a cost in speed.\\\" data-book=\\\"Troubleshooting Java\\\"\u003einstrumenting\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Which part of the app is slow?\",\"How many times is \u003ccode\u003ecalculateTax\u003c/code\u003e called per request?\",\"Is it slow everywhere or in one module?\"],\"right\":[\"Sampling\",\"Instrumenting\",\"Sampling, too\"],\"rightOrder\":[1,2,0]},\"tsj-profiling/flame-graphs/step-3\":{\"id\":\"step-3\",\"key\":\"tsj-profiling/flame-graphs/step-3\",\"prompt\":\"\u003cp\u003eIn a CPU \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Flame graph\\\" data-def=\\\"A chart of stack samples where each box is a method, its width the share of time it appeared in, and the boxes above it what it called.\\\" data-book=\\\"Troubleshooting Java\\\"\u003eflame graph\u003c/button\u003e, which box deserves attention first?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eIn a flame graph, a box\u0026#39;s width is the share of samples in which that method appeared anywhere on the stack.\u003c/p\u003e\\n\u003cp\u003eA wide box at the top, with nothing above it, means the CPU was executing that method\u0026#39;s own code in many samples: it\u0026#39;s where time is actually spent.\u003c/p\u003e\\n\u003cp\u003eA wide box lower down only means time was spent somewhere beneath it; follow it up to find the plateau.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The tallest, narrowest tower\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeep stacks aren\u0026#39;t expensive if they\u0026#39;re narrow.\u003c/p\u003e\\n\"},{\"html\":\"A wide box at the top of a stack, with nothing above it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"The leftmost box\",\"correct\":false,\"feedback\":\"\u003cp\u003eHorizontal order is alphabetical; it doesn\u0026#39;t mean \u0026quot;first\u0026quot;.\u003c/p\u003e\\n\"}],\"multiple\":false},\"tsj-profiling/flame-graphs/step-4\":{\"id\":\"step-4\",\"key\":\"tsj-profiling/flame-graphs/step-4\",\"prompt\":\"\u003cp\u003eMatch each feature of a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Flame graph\\\" data-def=\\\"A chart of stack samples where each box is a method, its width the share of time it appeared in, and the boxes above it what it called.\\\" data-book=\\\"Troubleshooting Java\\\"\u003eflame graph\u003c/button\u003e with its meaning.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Width of a box\",\"Height of a stack\",\"A box\u0026#39;s children\",\"Horizontal position\"],\"right\":[\"Share of samples containing that method\",\"Call depth\",\"The methods it called\",\"Alphabetical, to merge identical stacks\"],\"rightOrder\":[1,3,0,2]},\"tsj-profiling/flame-graphs/step-6\":{\"id\":\"step-6\",\"key\":\"tsj-profiling/flame-graphs/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eJSON.serialize\u003c/code\u003e is 40% wide, and almost all of that is its child \u003ccode\u003eReflection.getFields\u003c/code\u003e. What\u0026#39;s the likely fix?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Cache the field metadata so reflection isn\u0026#39;t repeated for every object\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Buy a faster CPU\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe graph points at a specific, avoidable cost.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003eCache\u003c/button\u003e\"]},\"tsj-threads-and-memory/investigating-locks/step-2\":{\"id\":\"step-2\",\"key\":\"tsj-threads-and-memory/investigating-locks/step-2\",\"prompt\":\"\u003cp\u003eMatch each situation with the thread state you\u0026#39;d see.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Waiting to enter a \u003ccode\u003esynchronized\u003c/code\u003e method another thread is in\",\"Called \u003ccode\u003equeue.take()\u003c/code\u003e on an empty queue\",\"Called \u003ccode\u003eThread.sleep(1000)\u003c/code\u003e\",\"Computing a hash\"],\"right\":[\"BLOCKED\",\"WAITING\",\"TIMED_WAITING\",\"RUNNABLE\"],\"rightOrder\":[2,3,0,1]},\"tsj-threads-and-memory/investigating-locks/step-4\":{\"id\":\"step-4\",\"key\":\"tsj-threads-and-memory/investigating-locks/step-4\",\"prompt\":\"\u003cp\u003eFifty threads are BLOCKED on the same lock. The owner is RUNNABLE inside a \u003ccode\u003esynchronized\u003c/code\u003e method, calling a remote service. What\u0026#39;s the problem?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe owner isn\u0026#39;t stuck — it\u0026#39;s RUNNABLE — but it holds the lock while waiting for a slow remote service.\u003c/p\u003e\\n\u003cp\u003eEvery other thread that needs the lock is BLOCKED behind it, so the whole application runs at the speed of that one remote call.\u003c/p\u003e\\n\u003cp\u003eIt isn\u0026#39;t a deadlock, because the owner will eventually finish. The fix is to make the call outside the lock.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"A deadlock\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe owner is making progress; it\u0026#39;s just slow. In a deadlock, the owners wait for each other.\u003c/p\u003e\\n\"},{\"html\":\"Slow I/O while holding a lock — everyone waits for the network call\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eDeadlock\u003c/button\u003e\"]},\"tsj-threads-and-memory/investigating-locks/step-6\":{\"id\":\"step-6\",\"key\":\"tsj-threads-and-memory/investigating-locks/step-6\",\"prompt\":\"\u003cp\u003eHow do you fix a lock held during a slow remote call?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Add more threads\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey\u0026#39;d all queue on the same lock.\u003c/p\u003e\\n\"},{\"html\":\"Make the call outside the lock, and lock only to update shared state\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-3\":{\"id\":\"step-3\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-3\",\"prompt\":\"\u003cp\u003eA transfer locks the source account, then the destination. T1 transfers from \u003cstrong\u003eA\u003c/strong\u003e to \u003cstrong\u003eB\u003c/strong\u003e; T2 from \u003cstrong\u003eB\u003c/strong\u003e to \u003cstrong\u003eA\u003c/strong\u003e.\\n\u003cstrong\u003eMake them \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e\u003c/strong\u003e, as they did in production.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThis is what the thread dump would show: T1 holds A and waits for B, T2 holds B and waits for A.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eLet each thread take its first lock before either takes its second.\u003c/p\u003e\\n\"],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock A\",\"lock B\",\"transfer\",\"unlock B\",\"unlock A\"]},{\"name\":\"T2\",\"ops\":[\"lock B\",\"lock A\",\"transfer\",\"unlock A\",\"unlock B\"]}]},\"goal\":{\"deadlock\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhat would a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread dump\\\" data-def=\\\"A snapshot of every thread in a JVM — its state, its stack, the locks it holds and the lock it\u0026amp;#39;s waiting for.\\\" data-book=\\\"Troubleshooting Java\\\"\u003ethread dump\u003c/button\u003e report now?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"An OutOfMemoryError\",\"correct\":false,\"feedback\":\"\u003cp\u003eNothing is allocating — the threads are simply stuck.\u003c/p\u003e\\n\"},{\"html\":\"A Java-level deadlock — T1 waiting for B held by T2, and T2 waiting for A held by T1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Both threads RUNNABLE\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeadlocked threads are BLOCKED, waiting for a monitor.\u003c/p\u003e\\n\"}],\"multiple\":false}},\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-4\":{\"id\":\"step-4\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-4\",\"prompt\":\"\u003cp\u003eIn a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Thread dump\\\" data-def=\\\"A snapshot of every thread in a JVM — its state, its stack, the locks it holds and the lock it\u0026amp;#39;s waiting for.\\\" data-book=\\\"Troubleshooting Java\\\"\u003ethread dump\u003c/button\u003e, how do you find a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Look for threads that are RUNNABLE\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeadlocked threads are BLOCKED or WAITING, not running.\u003c/p\u003e\\n\"},{\"html\":\"Look for \u0026quot;Found one Java-level deadlock\u0026quot;, which lists each thread, the lock it holds and the lock it waits for\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-6\":{\"id\":\"step-6\",\"key\":\"tsj-threads-and-memory/deadlocks-in-thread-dumps/step-6\",\"prompt\":\"\u003cp\u003eThe fix: both transfers lock the account with the \u003cstrong\u003elower ID first\u003c/strong\u003e — here always A, then B.\\nTry to \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Deadlock\\\" data-def=\\\"Two or more threads each wait forever for a lock another holds — a cycle in the \u0026amp;quot;waits for\u0026amp;quot; graph.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003edeadlock\u003c/button\u003e them, then run both to completion.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhoever gets A first also gets B; the other waits for A while holding nothing.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"locks\",\"config\":{\"threads\":[{\"name\":\"T1\",\"ops\":[\"lock A\",\"lock B\",\"transfer\",\"unlock B\",\"unlock A\"]},{\"name\":\"T2\",\"ops\":[\"lock A\",\"lock B\",\"transfer\",\"unlock B\",\"unlock A\"]}]},\"goal\":{\"finished\":true},\"question\":{\"prompt\":\"\u003cp\u003eWhile T1 holds A, what can T2 be holding?\u003c/p\u003e\\n\",\"options\":[{\"html\":\"B\",\"correct\":false,\"feedback\":\"\u003cp\u003eT2 can only take B after A, and A is held by T1.\u003c/p\u003e\\n\"},{\"html\":\"Both A and B\",\"correct\":false,\"feedback\":\"\u003cp\u003eA is held by T1.\u003c/p\u003e\\n\"},{\"html\":\"Nothing — it\u0026#39;s waiting for A, the first lock both take\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false}},\"tsj-threads-and-memory/memory-issues/step-2\":{\"id\":\"step-2\",\"key\":\"tsj-threads-and-memory/memory-issues/step-2\",\"prompt\":\"\u003cp\u003eMatch each \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"OutOfMemoryError\\\" data-def=\\\"Thrown when the JVM can\u0026amp;#39;t allocate memory. Its message says which area ran out — heap, metaspace, or native threads.\\\" data-book=\\\"Troubleshooting Java\\\"\u003e\u003ccode\u003eOutOfMemoryError\u003c/code\u003e\u003c/button\u003e message with a likely cause.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Java heap space\",\"Metaspace\",\"unable to create native thread\",\"GC overhead limit exceeded\"],\"right\":[\"Too many live objects — a leak, or the heap is too small\",\"Classes loaded over and over, often by redeploys or generated proxies\",\"Too many threads for the OS or the container\",\"The JVM spends almost all its time collecting and freeing almost nothing\"],\"rightOrder\":[1,2,3,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Metaspace\\\" data-def=\\\"Native memory holding class metadata. It grows as classes are loaded.\\\" data-book=\\\"Java Performance\\\"\u003eMetaspace\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003eGarbage collection\u003c/button\u003e\"]},\"tsj-threads-and-memory/memory-issues/step-5\":{\"id\":\"step-5\",\"key\":\"tsj-threads-and-memory/memory-issues/step-5\",\"prompt\":\"\u003cp\u003eThe dump shows a static \u003ccode\u003eMap\u003c/code\u003e in a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e class retaining 2 GB of \u003ccode\u003eSession\u003c/code\u003e objects. What\u0026#39;s the likely bug?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA static field lives as long as its class is loaded — usually the whole run — so anything in that map stays reachable.\u003c/p\u003e\\n\u003cp\u003eIf sessions are put in but never removed when they end, the map grows with every user, and the heap eventually fills.\u003c/p\u003e\\n\u003cp\u003eThe fix is eviction: remove entries when sessions end, bound the cache with a size or expiry, or hold entries through \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Weak reference\\\" data-def=\\\"A reference that doesn\u0026amp;#39;t keep its object alive; once nothing stronger refers to it, it\u0026amp;#39;s freed at the next GC.\\\" data-book=\\\"Java Performance\\\"\u003eweak references\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"The heap is too small for normal operation\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe static map keeps growing because nothing removes entries — a bigger heap only delays the crash.\u003c/p\u003e\\n\"},{\"html\":\"Sessions are added to the cache but never removed\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"tsj-threads-and-memory/memory-issues/step-6\":{\"id\":\"step-6\",\"key\":\"tsj-threads-and-memory/memory-issues/step-6\",\"prompt\":\"\u003cp\u003eWhy must \u003cbutton
