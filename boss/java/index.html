dler matches, so it runs before \u003ccode\u003efinally\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etry catch\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003efinally\u003c/code\u003e runs after the handler, too.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etry catch finally\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-type-information/class-objects/step-2\":{\"id\":\"step-2\",\"key\":\"tij-type-information/class-objects/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$79\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s only one \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Class object\\\" data-def=\\\"The single object of type \u0026lt;code\u0026gt;Class\u0026lt;/code\u0026gt; the JVM creates for each loaded class. \u0026lt;code\u0026gt;getClass()\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;Circle.class\u0026lt;/code\u0026gt; return it.\\\" data-book=\\\"Thinking in Java\\\"\u003eClass object\u003c/button\u003e for Circle, so both return the same reference.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-type-information/class-objects/step-4\":{\"id\":\"step-4\",\"key\":\"tij-type-information/class-objects/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eObject x = new Derived();\u003c/code\u003e What does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003einstanceof\u003c/code\u003e asks \u0026quot;is this object of this type or a subtype?\u0026quot;, so a \u003ccode\u003eDerived\u003c/code\u003e is an instance of \u003ccode\u003eBase\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003egetClass()\u003c/code\u003e returns the object\u0026#39;s exact class, and there is only one \u003ccode\u003eClass\u003c/code\u003e object per class, so \u003ccode\u003e==\u003c/code\u003e compares exact classes.\u003c/p\u003e\\n\u003cp\u003eThe object\u0026#39;s class is \u003ccode\u003eDerived\u003c/code\u003e, not \u003ccode\u003eBase\u003c/code\u003e, so the second test is false and the third is true.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003einstanceof\u003c/code\u003e when you care about what an object can do, and compare \u003ccode\u003eClass\u003c/code\u003e objects only when you need the exact type.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$7a\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etrue true true\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003egetClass()\u003c/code\u003e returns the exact class, \u003ccode\u003eDerived\u003c/code\u003e — not its superclass.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etrue false true\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003efalse false true\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003einstanceof\u003c/code\u003e accepts subclasses, so a \u003ccode\u003eDerived\u003c/code\u003e is an instance of \u003ccode\u003eBase\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-type-information/class-objects/step-5\":{\"id\":\"step-5\",\"key\":\"tij-type-information/class-objects/step-5\",\"prompt\":\"\u003cp\u003eMatch each way of getting a \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Class object\\\" data-def=\\\"The single object of type \u0026lt;code\u0026gt;Class\u0026lt;/code\u0026gt; the JVM creates for each loaded class. \u0026lt;code\u0026gt;getClass()\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;Circle.class\u0026lt;/code\u0026gt; return it.\\\" data-book=\\\"Thinking in Java\\\"\u003eClass object\u003c/button\u003e.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eCircle.class\u003c/code\u003e\",\"\u003ccode\u003eobj.getClass()\u003c/code\u003e\",\"\u003ccode\u003eClass.forName(\u0026quot;shapes.Circle\u0026quot;)\u003c/code\u003e\"],\"right\":[\"A class literal, checked at compile time\",\"The exact class of an object\",\"Loads a class by name at run time\"],\"rightOrder\":[2,1,0],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Type token\\\" data-def=\\\"A \u0026lt;code\u0026gt;Class\u0026lt;/code\u0026gt; object like \u0026lt;code\u0026gt;String.class\u0026lt;/code\u0026gt; passed around to convey type information at run time.\\\" data-book=\\\"Effective Java\\\"\u003eType token\u003c/button\u003e\"]},\"tij-generics/fruit-and-wildcards/step-2\":{\"id\":\"step-2\",\"key\":\"tij-generics/fruit-and-wildcards/step-2\",\"prompt\":\"\u003cp\u003eWhat happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e: an \u003ccode\u003eApple[]\u003c/code\u003e is a subtype of \u003ccode\u003eFruit[]\u003c/code\u003e, so the first line compiles.\u003c/p\u003e\\n\u003cp\u003eThe array object still knows at run time that it\u0026#39;s really an \u003ccode\u003eApple[]\u003c/code\u003e, and every store into it is checked.\u003c/p\u003e\\n\u003cp\u003eStoring an \u003ccode\u003eOrange\u003c/code\u003e fails that check, so the JVM throws \u003ccode\u003eArrayStoreException\u003c/code\u003e — an error the compiler couldn\u0026#39;t catch.\u003c/p\u003e\\n\u003cp\u003eGeneric lists avoid this by making \u003ccode\u003eList\u0026lt;Apple\u0026gt;\u003c/code\u003e not a \u003ccode\u003eList\u0026lt;Fruit\u0026gt;\u003c/code\u003e, which moves the error to compile time.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$7b\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It compiles, then the third line throws \u003ccode\u003eArrayStoreException\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It works; the array now holds an Orange\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe array knows it\u0026#39;s an \u003ccode\u003eApple[]\u003c/code\u003e and refuses the Orange at run time.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eArrays are \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Covariant\\\" data-def=\\\"If \u0026lt;code\u0026gt;Sub\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super\u0026lt;/code\u0026gt;, then \u0026lt;code\u0026gt;Sub[]\u0026lt;/code\u0026gt; is a subtype of \u0026lt;code\u0026gt;Super[]\u0026lt;/code\u0026gt;. Arrays are covariant; generics are not (they\u0026amp;#39;re invariant).\\\" data-book=\\\"Effective Java\\\"\u003ecovariant\u003c/button\u003e — an \u003ccode\u003eApple[]\u003c/code\u003e is a \u003ccode\u003eFruit[]\u003c/code\u003e — so the compiler accepts it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-generics/fruit-and-wildcards/step-4\":{\"id\":\"step-4\",\"key\":\"tij-generics/fruit-and-wildcards/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;? extends Fruit\u0026gt; flist\u003c/code\u003e might be a list of any fruit. Tap the most specific type you can safely read out of it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWhatever the list really holds, every element is some kind of Fruit.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Object\"},{\"name\":\"Fruit\"},{\"name\":\"Apple\"},{\"name\":\"Orange\"}],\"relations\":[{\"from\":\"Fruit\",\"to\":\"Object\",\"type\":\"extends\"},{\"from\":\"Apple\",\"to\":\"Fruit\",\"type\":\"extends\"},{\"from\":\"Orange\",\"to\":\"Fruit\",\"type\":\"extends\"}]},\"feedback\":{\"Apple\":\"The list might hold oranges.\",\"Orange\":\"The list might hold apples.\",\"Object\":\"That's safe, but Fruit is more specific.\"}},\"goal\":{\"select\":\"Fruit\"},\"question\":\"$undefined\"},\"tij-generics/fruit-and-wildcards/step-5\":{\"id\":\"step-5\",\"key\":\"tij-generics/fruit-and-wildcards/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;? super Apple\u0026gt; alist\u003c/code\u003e might be a list of Apple, Fruit or Object. Tap the most general type you can safely add to it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAny list that holds Apples\u0026#39; supertypes can hold an Apple — and therefore a Jonathan too.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe variable might refer to a \u003ccode\u003eList\u0026lt;Apple\u0026gt;\u003c/code\u003e, a \u003ccode\u003eList\u0026lt;Fruit\u0026gt;\u003c/code\u003e or a \u003ccode\u003eList\u0026lt;Object\u0026gt;\u003c/code\u003e, and the compiler doesn\u0026#39;t know which.\u003c/p\u003e\\n\u003cp\u003eAn \u003ccode\u003eApple\u003c/code\u003e fits in all three, and so does any subclass like \u003ccode\u003eJonathan\u003c/code\u003e, so adding one is always safe.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eFruit\u003c/code\u003e wouldn\u0026#39;t fit in a \u003ccode\u003eList\u0026lt;Apple\u0026gt;\u003c/code\u003e, so the compiler rejects it.\u003c/p\u003e\\n\u003cp\u003eReading is the opposite: the only thing you can be sure of is that an element is an \u003ccode\u003eObject\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Object\"},{\"name\":\"Fruit\"},{\"name\":\"Apple\"},{\"name\":\"Orange\"},{\"name\":\"Jonathan\"}],\"relations\":[{\"from\":\"Fruit\",\"to\":\"Object\",\"type\":\"extends\"},{\"from\":\"Apple\",\"to\":\"Fruit\",\"type\":\"extends\"},{\"from\":\"Orange\",\"to\":\"Fruit\",\"type\":\"extends\"},{\"from\":\"Jonathan\",\"to\":\"Apple\",\"type\":\"extends\"}]},\"feedback\":{\"Fruit\":\"If it's really a List\u003cApple\u003e, adding a plain Fruit — maybe an orange — would be wrong.\",\"Object\":\"The list might be a List\u003cApple\u003e, which can't hold any Object.\",\"Orange\":\"An Orange isn't an Apple.\",\"Jonathan\":\"You can add a Jonathan, but Apple is more general.\"}},\"goal\":{\"select\":\"Apple\"},\"question\":\"$undefined\"},\"tij-generics/fruit-and-wildcards/step-6\":{\"id\":\"step-6\",\"key\":\"tij-generics/fruit-and-wildcards/step-6\",\"prompt\":\"\u003cp\u003eMatch each declaration with what you may do.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003eList\u0026lt;? extends Fruit\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;? super Apple\u0026gt;\u003c/code\u003e\",\"\u003ccode\u003eList\u0026lt;Fruit\u0026gt;\u003c/code\u003e\"],\"right\":[\"Read Fruit; add nothing but null\",\"Add Apple or Jonathan; read only Object\",\"Read and add any Fruit\"],\"rightOrder\":[2,1,0]},\"tij-io/io-decorators/step-3\":{\"id\":\"step-3\",\"key\":\"tij-io/io-decorators/step-3\",\"prompt\":\"\u003cp\u003eReading one byte at a time from a file is slow. Tap the class that fixes that when you wrap the file stream in it.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBufferedInputStream\u003c/code\u003e reads big blocks from the file and hands out bytes from its buffer.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"InputStream\",\"kind\":\"abstract\"},{\"name\":\"FileInputStream\"},{\"name\":\"FilterInputStream\"},{\"name\":\"BufferedInputStream\"},{\"name\":\"DataInputStream\"}],\"relations\":[{\"from\":\"FileInputStream\",\"to\":\"InputStream\",\"type\":\"extends\"},{\"from\":\"FilterInputStream\",\"to\":\"InputStream\",\"type\":\"extends\"},{\"from\":\"BufferedInputStream\",\"to\":\"FilterInputStream\",\"type\":\"extends\"},{\"from\":\"DataInputStream\",\"to\":\"FilterInputStream\",\"type\":\"extends\"}]},\"feedback\":{\"DataInputStream\":\"It reads typed values like ints, but doesn't buffer.\",\"FilterInputStream\":\"It's the base for wrappers; on its own it adds nothing.\",\"FileInputStream\":\"That's the slow source itself.\",\"InputStream\":\"That's the abstract base.\"}},\"goal\":{\"select\":\"BufferedInputStream\"},\"question\":\"$undefined\"},\"tij-io/io-decorators/step-4\":{\"id\":\"step-4\",\"key\":\"tij-io/io-decorators/step-4\",\"prompt\":\"\u003cp\u003ePut the wrapping in order, from the source outwards.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"\u003ccode\u003enew FileInputStream(\u0026quot;data.bin\u0026quot;)\u003c/code\u003e\",\"\u003ccode\u003enew BufferedInputStream(...)\u003c/code\u003e\",\"\u003ccode\u003enew DataInputStream(...)\u003c/code\u003e\"],\"start\":[0,2,1]},\"tij-io/io-decorators/step-5\":{\"id\":\"step-5\",\"key\":\"tij-io/io-decorators/step-5\",\"prompt\":\"\u003cp\u003eWhy \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Decorator\\\" data-def=\\\"Adding behavior to an object by wrapping it in another object with the same interface, e.g. \u0026lt;code\u0026gt;Collections.unmodifiableList(list)\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003edecorators\u003c/button\u003e, rather than one class per combination like \u003ccode\u003eBufferedDataFileInputStream\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Features combine freely — n wrappers instead of a class for every combination\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Decorators are faster\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe benefit is flexibility; each layer adds a small call overhead if anything.\u003c/p\u003e\\n\"}],\"multiple\":false},\"tij-enums/enums-are-classes/step-2\":{\"id\":\"step-2\",\"key\":\"tij-enums/enums-are-classes/step-2\",\"prompt\":\"\u003cp\u003eWhy can\u0026#39;t an enum extend another class?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It already extends \u003ccode\u003ejava.lang.Enum\u003c/code\u003e, and Java allows only one superclass\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Enums can\u0026#39;t have methods\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can have fields, constructors and methods like any class.\u003c/p\u003e\\n\"}],\"multiple\":false},\"tij-enums/enums-are-classes/step-4\":{\"id\":\"step-4\",\"key\":\"tij-enums/enums-are-classes/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eCycle c = Cycle.RINSE; c.action();\u003c/code\u003e — tap where the code that runs is defined.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eRINSE is an instance of its own anonymous subclass, so its \u003ccode\u003eaction()\u003c/code\u003e runs — plain polymorphism.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWhen an enum constant has a body, the compiler makes it an anonymous subclass of the enum, with exactly one instance.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ec\u003c/code\u003e is declared as \u003ccode\u003eCycle\u003c/code\u003e, but the object it refers to belongs to that subclass, so \u003ccode\u003eaction()\u003c/code\u003e is late-bound to the method inside \u003ccode\u003eRINSE\u003c/code\u003e\u0026#39;s body.\u003c/p\u003e\\n\u003cp\u003eThis is the same polymorphism as with any class hierarchy, packed into a single enum declaration.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Cycle\",\"kind\":\"enum\",\"methods\":[\"action() {abstract}\"]},{\"name\":\"WASH { }\",\"methods\":[\"action()\"]},{\"name\":\"RINSE { }\",\"methods\":[\"action()\"]},{\"name\":\"SPIN { }\",\"methods\":[\"action()\"]}],\"relations\":[{\"from\":\"WASH { }\",\"to\":\"Cycle\",\"type\":\"extends\"},{\"from\":\"RINSE { }\",\"to\":\"Cycle\",\"type\":\"extends\"},{\"from\":\"SPIN { }\",\"to\":\"Cycle\",\"type\":\"extends\"}]},\"feedback\":{\"Cycle\":\"`action()` is abstract in Cycle — each constant supplies its own.\"}},\"goal\":{\"select\":\"RINSE { }\"},\"question\":\"$undefined\"},\"tij-enums/enums-are-classes/step-5\":{\"id\":\"step-5\",\"key\":\"tij-enums/enums-are-classes/step-5\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explan ; repeating it adds noise.\u003c/p\u003e\\n\"},{\"html\":\"When the initializer doesn\u0026#39;t make the type obvious, like \u003ccode\u003evar result = service.process(x);\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"wgj-modern-language/records/step-2\":{\"id\":\"step-2\",\"key\":\"wgj-modern-language/records/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$7d\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ePoint@1b6d3586 false 1\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eRecords generate \u003ccode\u003etoString\u003c/code\u003e and value-based \u003ccode\u003eequals\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile — there\u0026#39;s no \u003ccode\u003egetX()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eRecord \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Accessor method\\\" data-def=\\\"A method that returns the value of a field — the public way in, instead of making the field itself public.\\\" data-book=\\\"Effective Java\\\"\u003eaccessors\u003c/button\u003e are named after the components: \u003ccode\u003ex()\u003c/code\u003e, not \u003ccode\u003egetX()\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ePoint[x=1, y=2] true 1\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"wgj-modern-language/records/step-4\":{\"id\":\"step-4\",\"key\":\"wgj-modern-language/records/step-4\",\"prompt\":\"\u003cp\u003eReject negative coordinates.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"record Point(int x, int y) {\\n  \"},{\"answers\":[\"Point\"],\"size\":5,\"choices\":[\"MaxRAMPercentage\",\"instanceof\",\"yield\",\"Point\"]},{\"text\":\" {\\n    if (x \u003c 0 || y \u003c 0) throw new IllegalArgumentException();\\n  }\\n}\\n\"}],\"code\":true,\"caseSensitive\":true},\"wgj-modern-language/records/step-5\":{\"id\":\"step-5\",\"key\":\"wgj-modern-language/records/step-5\",\"prompt\":\"\u003cp\u003eWhich are true of records?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Their fields are final\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"They can declare extra instance fields\",\"correct\":false,\"feedback\":\"\u003cp\u003eAll state must be in the component list. Static fields are allowed.\u003c/p\u003e\\n\"},{\"html\":\"They can extend another class\",\"correct\":false,\"feedback\":\"\u003cp\u003eRecords implicitly extend \u003ccode\u003ejava.lang.Record\u003c/code\u003e, so they can\u0026#39;t extend anything else.\u003c/p\u003e\\n\"},{\"html\":\"They can implement interfaces and have extra methods\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":true},\"wgj-modern-language/records/step-6\":{\"id\":\"step-6\",\"key\":\"wgj-modern-language/records/step-6\",\"prompt\":\"\u003cp\u003eA record has a \u003ccode\u003eList\u0026lt;String\u0026gt; tags\u003c/code\u003e component. Is the record deeply \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Immutable\\\" data-def=\\\"An object whose state can\u0026amp;#39;t change after construction. Simple, thread-safe, freely shareable. Make fields \u0026lt;code\u0026gt;final\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;private\u0026lt;/code\u0026gt;, provide no setters, and don\u0026amp;#39;t let the class be extended.\\\" data-book=\\\"Effective Java\\\"\u003eimmutable\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA record\u0026#39;s fields are final, but \u003ccode\u003efinal\u003c/code\u003e only fixes the reference. If the caller passes an \u003ccode\u003eArrayList\u003c/code\u003e and keeps a reference to it, they can still add or remove tags.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003etags = List.copyOf(tags)\u003c/code\u003e in the compact constructor stores an immutable copy that the caller can\u0026#39;t reach.\u003c/p\u003e\\n\u003cp\u003eRecords give shallow immutability for free; deep immutability still takes \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Defensive copy\\\" data-def=\\\"Copying a mutable argument when it comes in, or a mutable field when it goes out, so callers can\u0026amp;#39;t change your object\u0026amp;#39;s internals behind your back.\\\" data-book=\\\"Effective Java\\\"\u003edefensive copies\u003c/button\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Not unless you copy it, for example with \u003ccode\u003etags = List.copyOf(tags);\u003c/code\u003e in the compact constructor\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, records are always immutable\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe reference is final, but the list it points to can still change.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Compact constructor\\\" data-def=\\\"A record constructor written without a parameter list, used to validate or normalize arguments before the fields are assigned.\\\" data-book=\\\"The Well-Grounded Java Developer\\\"\u003eCompact constructor\u003c/button\u003e\"]},\"wgj-modern-language/sealed-types-and-pattern-matching/step-3\":{\"id\":\"step-3\",\"key\":\"wgj-modern-language/sealed-types-and-pattern-matching/step-3\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003ekind(42) + \u0026quot;, \u0026quot; + kind(7) + \u0026quot;, \u0026quot; + kind(\u0026quot;hey\u0026quot;)\u003c/code\u003e give?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA pattern-matching switch tries cases in order and takes the first match.\u003c/p\u003e\\n\u003cp\u003e42 is an \u003ccode\u003eInteger\u003c/code\u003e and 42 \u0026gt; 10, so the guarded case matches: \u0026quot;big int\u0026quot;. 7 is an \u003ccode\u003eInteger\u003c/code\u003e but fails the guard, so it falls to \u003ccode\u003ecase Integer i\u003c/code\u003e: \u0026quot;int\u0026quot;.\u003c/p\u003e\\n\u003cp\u003e\u0026quot;hey\u0026quot; is a \u003ccode\u003eString\u003c/code\u003e with length 3: \u0026quot;string 3\u0026quot;. The compiler also rejects a case that can never match because an earlier one covers it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$7e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ebig int, int, string 3\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eint, int, string 3\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eCases are tried in order. 42 matches the guarded case first.\u003c/p\u003e\\n\"},{\"html\":\"It doesn\u0026#39;t compile — two cases for \u003ccode\u003eInteger\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first is guarded by \u003ccode\u003ewhen\u003c/code\u003e, so the second still matters.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"wgj-modern-language/sealed-types-and-pattern-matching/step-5\":{\"id\":\"step-5\",\"key\":\"wgj-modern-language/sealed-types-and-pattern-matching/step-5\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eShape\u003c/code\u003e is sealed with \u003ccode\u003eCircle\u003c/code\u003e and \u003ccode\u003e
