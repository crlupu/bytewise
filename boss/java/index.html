g literals are \u003cstrong\u003einterned\u003c/strong\u003e: the JVM keeps one shared \u003ccode\u003eString\u003c/code\u003e object per distinct literal.\\n\u003ccode\u003ea\u003c/code\u003e and \u003ccode\u003eb\u003c/code\u003e both point at it, so \u003ccode\u003e==\u003c/code\u003e is \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$13\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eComparing two references with \u003ccode\u003e==\u003c/code\u003e is always legal; it just might not mean what you expect.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat would be right for two \u003ccode\u003enew String(...)\u003c/code\u003e objects. But these are \u003cstrong\u003eliterals\u003c/strong\u003e,\\nand the JVM keeps only one copy of each literal string.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"java-core/string-equality/step-3\":{\"id\":\"step-3\",\"key\":\"java-core/string-equality/step-3\",\"prompt\":\"\u003cp\u003eAnd this? Pick both lines of output.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003enew String(\u0026quot;hello\u0026quot;)\u003c/code\u003e makes a new object with the same characters, so \u003ccode\u003e==\u003c/code\u003e is \u003ccode\u003efalse\u003c/code\u003e,\\nwhile \u003ccode\u003eequals()\u003c/code\u003e compares content and is \u003ccode\u003etrue\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eWhat does \u003ccode\u003enew\u003c/code\u003e always do, whatever the class?\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$ edynamic\u003c/code\u003e concatenation), which always produces a new \u003ccode\u003eString\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s why the same text can be \u003ccode\u003e==\u003c/code\u003e in one place and not in another — and why \u003ccode\u003e==\u003c/code\u003e on strings is a bug waiting for the code around it to change.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003eequals\u003c/code\u003e for content; reserve \u003ccode\u003e==\u003c/code\u003e for checking whether two references are literally the same object.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[\"\u003cp\u003eIs \u003ccode\u003epart\u003c/code\u003e a compile-time constant? It isn\u0026#39;t declared \u003ccode\u003efinal\u003c/code\u003e.\u003c/p\u003e\\n\"],\"type\":\"predict\",\"code\":\"$15\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003etrue\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003epart\u003c/code\u003e is an ordinary variable, not a constant, so the concatenation happens at run time and makes a new object.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003efalse\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"java-core/string-equality/step-6\":{\"id\":\"step-6\",\"key\":\"java-core/string-equality/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Autoboxing\\\" data-def=\\\"The compiler converting automatically between primitives and their boxed types — \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; ↔ \u0026lt;code\u0026gt;Integer\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Effective Java\\\"\u003eAutoboxing\u003c/button\u003e calls \u003ccode\u003eInteger.valueOf\u003c/code\u003e, which returns cached objects for −128 to 127.\\n127 hits the cache (same object) ":{\"id\":\"step-2\",\"key\":\"jp-expressions/silent-overflow/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e86,400,000,000 doesn\u0026#39;t fit in an \u003ccode\u003eint\u003c/code\u003e; it wraps to 500,654,080, and 500,654,080 / 86,400,000 is 5.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eAll the literals are \u003ccode\u003eint\u003c/code\u003e, so \u003ccode\u003e24 * 60 * 60 * 1000 * 1000\u003c/code\u003e is computed in 32-bit arithmetic before being assigned to the \u003ccode\u003elong\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe true value, 86,400,000,000, exceeds \u003ccode\u003eInteger.MAX_VALUE\u003c/code\u003e (about 2.1 billion), so it wraps to 500,654,080.\u003c/p\u003e\\n\u003cp\u003eDividing that by 86,400,000 gives 5. \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Widening conversion\\\" data-def=\\\"Converting to a type with more bits, like \u0026lt;code\u0026gt;int\u0026lt;/code\u0026gt; to \u0026lt;code\u0026gt;long\u0026lt;/code\u0026gt;. The value is kept; integers are sign- or zero-extended.\\\" data-book=\\\"Java Puzzlers\\\"\u003eWidening\u003c/button\u003e happens only at the assignment, after the damage is done.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$18\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"5\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eJava doesn\u0026#39;t reject constant expressions that \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overflow\\\" data-def=\\\"A result too big for its type. Java\u0026amp;#39;s integer arithmetic wraps around silently, so \u0026lt;code\u0026gt;Integer.MAX_VALUE + 1\u0026lt;/code\u0026gt; is \u0026lt;code\u0026gt;Integer.MIN_VALUE\u0026lt;/code\u0026gt;.\\\" data 3cp\u003eWhat does \u003ccode\u003enew Confusing(null)\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe compiler first finds every overload that could accept \u003ccode\u003enull\u003c/code\u003e: both \u003ccode\u003eObject\u003c/code\u003e and \u003ccode\u003edouble[]\u003c/code\u003e can.\u003c/p\u003e\\n\u003cp\u003eIt then picks the \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Most specific overload\\\" data-def=\\\"The rule the compiler uses to choose between overloads: if one\u0026amp;#39;s parameters could be passed to the other, it\u0026amp;#39;s more specific and wins.\\\" data-book=\\\"Java Puzzlers\\\"\u003emost specific\u003c/button\u003e — one whose parameter type could be passed to the other. A \u003ccode\u003edouble[]\u003c/code\u003e can be passed where an \u003ccode\u003eObject\u003c/code\u003e is expected, but not the reverse, so \u003ccode\u003edouble[]\u003c/code\u003e wins.\u003c/p\u003e\\n\u003cp\u003eTo call the \u003ccode\u003eObject\u003c/code\u003e version, cast the argument: \u003ccode\u003enew Confusing((Object) null)\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$2e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It\u0026#39;s ambiguous and doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt would be ambiguous only if neither type were a subtype of the other.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003edouble array\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eObject\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003enull\u003c/code\u003e fits both, and \u003ccode\u003edouble[]\u003c/code\u003e is the more specific type.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-classes/overload-resolution/step-4\":{\"id\":\"step-4\",\"key\":\"jp-classes/overload-resolution/step-4\",\"prompt\":\"\u003cp\u003eWhich method runs?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$2f\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003elist\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe object is an \u003ccode\u003eArrayList\u003c/code\u003e, but its declared type is \u003ccode\u003eCollection\u003c/code\u003e — and overloads are picked from declared types.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ecollection\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-classes/overload-resolution/step-5\":{\"id\":\"step-5\",\"key\":\"jp-classes/overload-resolution/step-5\",\"prompt\":\"\u003cp\u003eTwo overloads take \u003ccode\u003eString\u003c/code\u003e and \u003ccode\u003eInteger\u003c/code\u003e. What does \u003ccode\u003ef(null)\u003c/code\u003e do?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAvoid overloads with the same number of parameters when an argument could fit both.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile — neither type is more specific, so the call is ambiguous\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It calls the \u003ccode\u003eString\u003c/code\u003e version, declared first\",\"correct\":false,\"feedback\":\"\u003cp\u003eDeclaration order never matters.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jp-classes/static-is-not-polymorphic/step-2\":{\"id\":\"step-2\",\"key\":\"jp-classes/static-is-not-polymorphic/step-2\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eAlways call static methods through the class name, \u003ccode\u003eDog.bark()\u003c/code\u003e, so nothing looks polymorphic.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eStatic methods belong to classes, not objects, so there is no dynamic dispatch.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003enipper.bark()\u003c/code\u003e is compiled as \u003ccode\u003eDog.bark()\u003c/code\u003e because \u003ccode\u003enipper\u003c/code\u003e is declared as a \u003ccode\u003eDog\u003c/code\u003e; the fact that it refers to a \u003ccode\u003eBasenji\u003c/code\u003e is ignored.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eBasenji.bark()\u003c/code\u003e only hides \u003ccode\u003eDog.bark()\u003c/code\u003e. Calling static methods through instances is legal but misleading — most IDEs warn about it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$30\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ewoof \u003c/code\u003e once\",\"correct\":false,\"feedback\":\"\u003cp\u003eBoth variables are declared as \u003ccode\u003eDog\u003c/code\u003e, so both calls go to \u003ccode\u003eDog.bark()\u003c/code\u003e. Basenjis do bark, here.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ewoof woof \u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-classes/static-is-not-polymorphic/step-4\":{\"id\":\"step-4\",\"key\":\"jp-classes/static-is-not-polymorphic/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$31\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"It throws \u003ccode\u003eNullPointerException\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe call is resolved to \u003ccode\u003eNull.greet()\u003c/code\u003e from the type; the null is never dereferenced.\u003c/p\u003e\\n\"},{\"html\":\"\u003 03e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$32\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e-1930\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e96\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eINSTANCE\u003c/code\u003e is created first, while \u003ccode\u003eCURRENT_YEAR\u003c/code\u003e is still 0.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-classes/initialization-order/step-3\":{\"id\":\"step-3\",\"key\":\"jp-classes/initialization-order/step-3\",\"prompt\":\"\u003cp\u003eWhy isn\u0026#39;t \u003ccode\u003eCURRENT_YEAR\u003c/code\u003e a compile-time constant here, set before anything runs?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$33\",\"options\":[{\"html\":\"Because it\u0026#39;s private\",\"correct\":false,\"feedback\":\"\u003cp\u003eAccess doesn\u0026#39;t matter. \u003ccode\u003estatic final int X = 42;\u003c/code\u003e would be a constant and already set.\u003c/p\u003e\\n\"},{\"html\":\"Its value comes from a method call, so it\u0026#39;s computed when the class initializes\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jp-classes/initialization-order/step-5\":{\"id\":\"step-5\",\"key\":\"jp-classes/initialization-order/step-5\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003enew ColorPoint(\u0026quot;red\u0026quot;)\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCompute such values lazily, in \u003ccode\u003etoString\u003c/code\u003e, or make the class or method \u003ccode\u003efinal\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003enew ColorPoint(\u0026quot;red\u0026quot;)\u003c/code\u003e first runs \u003ccode\u003ePoint()\u003c/code\u003e, before \ \",\"code\":\"$3a\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ei - 1\u003c/code\u003e is an \u003ccode\u003eint\u003c/code\u003e, so \u003ccode\u003eremove\u003c/code\u003e looks for an \u003ccode\u003eInteger\u003c/code\u003e and finds nothing.\u003c/p\u003e\\n\"},{\"html\":\"100\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-library/boxed-collections/step-4\":{\"id\":\"step-4\",\"key\":\"jp-library/boxed-collections/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e has two \u003ccode\u003eremove\u003c/code\u003e methods: \u003ccode\u003eremove(int index)\u003c/code\u003e and \u003ccode\u003eremove(Object o)\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eWith the argument \u003ccode\u003e1\u003c/code\u003e, an \u003ccode\u003eint\u003c/code\u003e, \u003ccode\u003eremove(int)\u003c/code\u003e applies without boxing, and overload resolution prefers it, so the element at index 1 — the value 2 — is removed.\u003c/p\u003e\\n\u003cp\u003eTo remove the value 1, call \u003ccode\u003elist.remove(Integer.valueOf(1))\u003c/code\u003e.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$3b\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e[3, 2]\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eremove(int)\u003c/code\u003e is chosen over \u003ccode\u003eremove(Object)\u003c/code\u003e because it needs no boxing — so it removes index 1.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003e[3, 1]\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-library/boxed-collections/step-5\":{\"id\":\"step-5\",\"key\":\"jp-library/boxed-collections/step-5\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t \u003ccode\u003eSet\u0026lt;E\u0026gt;.remove\u003c/code\u003e take an \u003ccode\u003eE\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"Because sets can only hold objects\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat\u0026#39;s true of all collections, but it doesn\u0026#39;t explain the parameter type.\u003c/p\u003e\\n\"},{\"html\":\"It was declared as \u003ccode\u003eremove(Object)\u003c/code\u003e for compatibility and flexibility, so the compiler accepts any type\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jp-names/obscuring-and-shadowing/step-2\":{\"id\":\"step-2\",\"key\":\"jp-names/obscuring-and-shadowing/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003eSystem.out.println(X.Y.Z)\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eIn \u003ccode\u003eX.Y.Z\u003c/code\u003e, \u003ccode\u003eX.Y\u003c/code\u003e could refer to the nested class \u003ccode\u003eY\u003c/code\u003e or to the static field \u003ccode\u003eY\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe Java Language Specification says that when a name could be a variable or a type, the variable is chosen.\u003c/p\u003e\\n\u003cp\u003eSo \u003ccode\u003eX.Y\u003c/code\u003e is the field of type \u003ccode\u003eC\u003c/code\u003e, and \u003ccode\u003eX.Y.Z\u003c/code\u003e is its instance field \u0026quot;White\u0026quot;. This is called \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Obscuring\\\" data-def=\\\"When a name could mean a variable or a type, Java takes the variable. Following the naming conventions avoids it.\\\" data-book=\\\"Java Puzzlers\\\"\u003eobscuring\u003c/button\u003e, and following naming conventions prevents it.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$3c\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eWhite\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It\u0026#39;s ambiguous and doesn\u0026#39;t compile\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe language has a rule for it — the variable is preferred.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eBlack\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eX.Y\u003c/code\u003e could be the nested class or the field. The field wins.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-names/obscuring-and-shadowing/step-4\":{\"id\":\"step-4\",\"key\":\"jp-names/obscuring-and-shadowing/step-4\",\"prompt\":\"\u003cp\u003eA file declares its own \u003ccode\u003eclass String { ... }\u003c/code\u003e and \u003ccode\u003epublic static void main(String[] args)\u003c/code\u003e. What happens when you run it?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eNever name your classes after ones in \u003ccode\u003ejava.lang\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It runs normally\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe parameter type is now the local \u003ccode\u003eString\u003c/code\u003e, so this isn\u0026#39;t the \u003ccode\u003emain(java.lang.String[])\u003c/code\u003e the JVM looks for.\u003c/p\u003e\\n\"},{\"html\":\"The JVM reports that the main method isn\u0026#39;t found\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"jp-names/obscuring-and-shadowing/step-6\":{\"id\":\"step-6\",\"key\":\"jp-names/obscuring-and-shadowing/step-6\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t this compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWrite \u003ccode\u003eArrays.toString(args)\u003c/code\u003e — use static imports sparingly.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eInside \u003ccode\u003eImportDuty\u003c/code\u003e, the simple name \u003ccode\u003etoString\u003c/code\u003e first finds members of the class itself, including the \u003ccode\u003etoString()\u003c/code\u003e inherited from \u003ccode\u003eObject\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eMembers always shadow static imports, so the call resolves to \u003ccode\u003eObject.toString()\u003c/code\u003e, which takes no arguments, and fails to compile.\u003c/p\u003e\\n\u003cp\u003eWriting \u003ccode\u003eArrays.toString(args)\u003c/code\u003e sidesteps name lookup entirely.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$3d\",\"options\":[{\"html\":\"Static imports of overloaded methods are illegal\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey\u0026#39;re legal; the problem is name lookup inside the class.\u003c/p\u003e\\n\"},{\"html\":\"The inherited \u003ccode\u003eObject.toString()\u003c/code\u003e shadows the import, and it takes no arguments\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static import\\\" data-def=\\\"\u0026lt;code\u0026gt;import static java.lang.Math.PI;\u0026lt;/code\u0026gt; — lets you use a class\u0026amp;#39;s static members without the class name.\\\" data-book=\\\"Effective Java\\\"\u003eStatic import\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Shadowing\\\" data-def=\\\"A declaration that makes an outer one with the same name unreachable by its simple name — a local variable over a field, or your own \u0026lt;code\u0026gt;String\u0026lt;/code\u0026gt; class over \u0026lt;code\u0026gt;java.lang.String\u0026lt;/code\u0026gt;.\\\" data-book=\\\"Java Puzzlers\\\"\u003eShadowing\u003c/button\u003e\"]},\"jp-names/not-really-overriding/step-2\":{\"id\":\"step-2\",\"key\":\"jp-names/not-really-overriding/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003enew TypeIt.ClickIt().doIt()\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eWith \u003ccode\u003e@Override\u003c/code\u003e on \u003ccode\u003eClickIt.printMessage\u003c/code\u003e, the compiler would have caught it.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003e\u003ccode\u003eprintMessage\u003c/code\u003e has no access modifier, so it\u0026#39;s package-private in \u003ccode\u003eclick\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eA class in another package, like \u003ccode\u003ehack\u003c/code\u003e, can\u0026#39;t see it, and therefore can\u0026#39;t override it: \u003ccode\u003eClickIt.printMessage\u003c/code\u003e is a brand-new method that happens to share the name.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003edoIt\u003c/code\u003e calls \u003ccode\u003eCodeTalk.printMessage\u003c/code\u003e, which prints \u0026quot;Click\u0026quot;. \u003ccode\u003e@Override\u003c/code\u003e on the subclass method would have flagged the mistake.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$3e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eClick\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eHack\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eprintMessage\u003c/code\u003e is package-private in \u003ccode\u003eclick\u003c/code\u003e, so \u003ccode\u003eClickIt\u003c/code\u003e\u0026#39;s method in \u003ccode\u003ehack\u003c/code\u003e doesn\u0026#39;t override it.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-names/not-really-overriding/step-4\":{\"id\":\"step-4\",\"key\":\"jp-names/not-really-overriding/step-4\",\"prompt\":\"\u003cp\u003eWhat ng\u0026quot;.\u003c/p\u003e\\n\u003cp\u003eThen \u0026quot;Ping\u0026quot; is printed. Only \u003ccode\u003estart()\u003c/code\u003e creates a new thread.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$40\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"Either, depending on scheduling\",\"correct\":false,\"feedback\":\"\u003cp\u003eThere\u0026#39;s only one thread here. \u003ccode\u003erun()\u003c/code\u003e doesn\u0026#39;t start one.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003ePongPing\u003c/code\u003e, every time\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003ePingPong\u003c/code\u003e, every time\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith \u003ccode\u003estart()\u003c/code\u003e, the new thread would wait for main\u0026#39;s lock and print second. But \u003ccode\u003erun()\u003c/code\u003e is a plain call in the main thread.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-threads-and-generics/thread-puzzlers/step-4\":{\"id\":\"step-4\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eUse \u003ccode\u003eThread.currentThread().isInterrupted()\u003c/code\u003e to check without clearing.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$41\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eInterrupted: true\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first call returned \u003ccode\u003etrue\u003c/code\u003e and cleared the flag.\u003c/p\u003e\\n\"},{\"html\":\"Nothing\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe first call sees the interrupt, so the block runs.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eInterrupted: false\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"jp-threads-and-generics/thread-puzzlers/step-6\":{\"id\":\"step-6\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-6\",\"prompt\":\"\u003cp\u003eA static initializer starts a thread that sets a static field of the same class, then calls \u003ccode\u003ejoin()\u003c/code\u003e. What happens?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eKeep static initializers simple, and never wait on other threads in them.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eThe main thread holds the class-initialization lock while running the static initializer.\u003c/p\u003e\\n\u003cp\u003eThe new thread touches a static field of that class, which requires the class to be initialized, so it waits for the lock.\u003c/p\u003e\\n\u003cp\u003eThe main thread then calls \u003ccode\u003ejoin()\u003c/code\u003e, waiting for the new thread to finish — and neither can proceed.\u003c/p\u003e\\n\u003cp\u003eClass initialization is a hidden lock, and static initializers shouldn\u0026#39;t wait for other threads.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It deadlocks — the thread waits for initialization to finish, and initialization waits for the thread\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"It works; the thread just sets the field\",\"correct\":false,\"feedback\":\"\u003cp\u003eTouching the class from another thread blocks until initialization completes.\u003c/p\u003e\\n\"}],\"multiple\":false},\"jp-threads-and-generics/thread-puzzlers/step-7\":{\"id\":\"step-7\",\"key\":\"jp-threads-and-generics/thread-puzzlers/step-7\",\"prompt\":\"\u003cp\u003eMatch each call with what it does.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003et.start()\u003c/code\u003e\",\" ndefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"One method per criterion\",\"A flag per criterion\",\"An anonymous class per criterion\",\"A lambda per criterion\"],\"right\":[\"Duplicated loops\",\"Unreadable calls\",\"Verbose\",\"Hardly any — that\u0026#39;s the point\"],\"rightOrder\":[2,0,1,3],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Anonymous class\\\" data-def=\\\"A class declared and instantiated in one expression, without a name. Mostly replaced by lambdas.\\\" data-book=\\\"Effective Java\\\"\u003eAnonymous class\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003eLambda\u003c/button\u003e\"]},\"mja-lambdas/lambda-syntax/step-2\":{\"id\":\"step-2\",\"key\":\"mja-lambdas/lambda-syntax/step-2\",\"prompt\":\"\u003cp\u003eWhich of these are valid \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003elambdas\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003es -\u0026gt; { \u0026quot;Iron Man\u0026quot;; }\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eA block needs statements; a bare string isn\u0026#39;t one. Write \u003ccode\u003es -\u0026gt; \u0026quot;Iron Man\u0026quot;\u003c/code\u003e or add \u003ccode\u003ereturn\u003c/code\u003e.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003es -\u0026gt; { return s.length(); }\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e(String s) -\u0026gt; s.length()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e() -\u0026gt; {}\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003e(Integer i) -\u0026gt; return \u0026quot;Alan\u0026quot; + i;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ereturn\u003c/code\u003e is a statement, so it needs braces: \u003ccode\u003e(Integer i) -\u0026gt; { return \u0026quot;Alan\u0026quot; + i; }\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":true},\"mja-lambdas/lambda-syntax/step-4\":{\"id\":\"step-4\",\"key\":\"mja-lambdas/lambda-syntax/step-4\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t \u003ccode\u003eObject o = () -\u0026gt; System.out.println(\u0026quot;hi\u0026quot;);\u003c/code\u003e compile?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eCast it to give it a target: \u003ccode\u003eObject o = (Runnable) () -\u0026gt; System.out.println(\u0026quot;hi\u0026quot;);\u003c/code\u003e.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eObject\u003c/code\u003e isn\u0026#39;t a functional interface, so the lambda has no target type\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Lambdas can\u0026#39;t print\",\"correct\":false,\"feedback\":\"\u003cp\u003eThey can do anything a method body can.\u003c/p\u003e\\n\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Functional interface\\\" data-def=\\\"An interface with exactly one abstract method, like \u0026lt;code\u0026gt;Runnable\u0026lt;/code\u0026gt; or \u0026lt;code\u0026gt;Function\u0026amp;lt;T,R\u0026amp;gt;\u0026lt;/code\u0026gt;. A lambda or method reference can implement it.\\\" data-book=\\\"Effective Java\\\"\u003eFunctional interface\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Lambda\\\" data-def=\\\"An anonymous function: parameters, an arrow and a body, like \u0026lt;code\u0026gt;a -\u0026amp;gt; a.weight() \u0026amp;gt; 150\u0026lt;/code\u0026gt;. It can be passed wherever a functional interface is expected.\\\" data-book=\\\"Modern Java in Action\\\"\u003eLambda\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Target type\\\" data-def=\\\"The functional interface a lambda is converted to, taken from where the lambda appears — an assignment, an argument or a cast.\\\" data-book=\\\"Modern Java in Action\\\"\u003eTarget type\u003c/button\u003e\"]},\"mja-lambdas/lambda-syntax/step-6\":{\"id\":\"step-6\",\"key\":\"mja-lambdas/lambda-syntax/step-6\",\"prompt\":\"\u003cp\u003eWhy doesn\u0026#39;t this compile?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eA lambda captures the value of a local variable, not the variable itself, so the variable must not change after capture — it must be effectively final.\u003c/p\u003e\\n\u003cp\u003eReassigning \u003ccode\u003eport\u003c/code\u003e after the lambda is created would make the captured copy and the variable disagree, so the compiler rejects it.\u003c/p\u003e\\n\u003cp\u003eFields aren\u0026#39;t subject to this rule, because the lambda captures \u003ccode\u003ethis\u003c/code\u003e and reads the field\u0026#39;s current value.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choic ,\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Yes, it\u0026#39;s public\",\"correct\":false,\"feedback\":\"\u003cp\u003eWith modules, \u003ccode\u003epublic\u003c/code\u003e means public within the module unless the package is exported.\u003c/p\u003e\\n\"}],\"multiple\":false},\"mja-default-methods-and-modules/module-system/step-6\":{\"id\":\"step-6\",\"key\":\"mja-default-methods-and-modules/module-system/step-6\",\"prompt\":\"\u003cp\u003eWhy does a library like Hibernate need \u003ccode\u003eopens\u003c/code\u003e rather than \u003ccode\u003eexports\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It compiles against your classes\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt doesn\u0026#39;t compile against them; it accesses them reflectively.\u003c/p\u003e\\n\"},{\"html\":\"It reflects into private fields at run time, which \u003ccode\u003eexports\u003c/code\u003e doesn\u0026#39;t allow\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"mja-async/futures-and-completable-futures/step-3\":{\"id\":\"step-3\",\"key\":\"mja-async/futures-and-completable-futures/step-3\",\"prompt\":\"\u003cp\u003eStart a price lookup without blocking.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"CompletableFuture\u003cDouble\u003e price = CompletableFuture.\"},{\"answers\":[\"supplyAsync\"],\"size\":11,\"choices\":[\"exceptionally\",\"sum\",\"supplyAsync\",\"apply\"]},{\"text\":\"(() -\u003e shop.getPrice(product));\"}],\"code\":true,\"caseSensitive\":false},\"mja-async/futures-and-completable-futures/step-4\":{\"id\":\"step-4\",\"key\":\"mja-async/futures-and-completable-futures/step-4\",\"prompt\":\"\u003cp\u003eWhere does \u003ccode\u003esupplyAsync(supplier)\u003c/code\u003e run the supplier, if you don\u0026#39;t pass an \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Executor\\\" data-def=\\\"An object that runs submitted tasks, decoupling \u0026lt;em\u0026gt;what\u0026lt;/em\u0026gt; to run from \u0026lt;em\u0026gt;how\u0026lt;/em\u0026gt; — on which thread, when, in what order.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eexecutor\u003c/button\u003e?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eFor blocking I/O, pass your own executor sized for it — the common pool has only about one thread per core.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eWithout an executor argument, async methods use \u003ccode\u003eForkJoinPool.commonPool()\u003c/code\u003e, which has about as many threads as there are CPU cores, minus one.\u003c/p\u003e\\n\u003cp\u003eThat\u0026#39;s right for CPU-bound work, but if tasks block on I/O, a handful of slow calls can tie up the whole pool — and with it, parallel streams and anything else sharing it.\u003c/p\u003e\\n\u003cp\u003eFor blocking calls, pass a dedicated executor sized for the expected concurrency.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"On a new thread each time\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt reuses the common pool\u0026#39;s threads.\u003c/p\u003e\\n\"},{\"html\":\"On the calling thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThen it wouldn\u0026#39;t be asynchronous.\u003c/p\u003e\\n\"},{\"html\":\"On the common \u003ccode\u003eForkJoinPool\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false,\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Fork/join\\\" data-def=\\\"Splitting a task into subtasks (fork), running them in parallel, and combining the results (join). The pool uses work stealing.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eFork/join\u003c/button\u003e\"]},\"mja-async/futures-and-completable-futures/step-6\":{\"id\":\"step-6\",\"key\":\"mja-async/futures-and-completable-futures/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eThe supplier throws on a pool thread, and \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"CompletableFuture\\\" data-def=\\\"A future you can complete, and chain work onto with \u0026lt;code\u0026gt;thenApply\u0026lt;/code\u0026gt;, \u0026lt;code\u0026gt;thenCompose\u0026lt;/code\u0026gt; and \u0026lt;code\u0026gt;thenCombine\u0026lt;/code\u0026gt;, so no thread has to block waiting for it.\\\" data-book=\\\"Modern Java in Action\\\"\u003e\u003ccode\u003eCompletableFuture\u003c/code\u003e\u003c/button\u003e catches it and completes exceptionally rather than letting the thread die.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ejoin()\u003c/code\u003e then rethrows it wrapped in an unchecked \u003ccode\u003eCompletionException\u003c/code\u003e, whose \u003ccode\u003egetCause()\u003c/code\u003e is the original \u003ccode\u003eIllegalStateException\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eget()\u003c/code\u003e would wrap it in a checked \u003ccode\u003eExecutionException\u003c/code\u003e instead. Either way, the exception isn\u0026#39;t lost — it\u0026#39;s delivered to whoever waits for the result.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$5e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003ejava.lang.IllegalStateException: boom\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"Nothing; the exception is lost on the other thread\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003efuture\u003c/button\u003e completes exceptionally, and \u003ccode\u003ejoin\u003c/code\u003e rethrows it wrapped in a \u003ccode\u003eCompletionException\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"mja-async/composing-futures/step-2\":{\"id\":\"step-2\",\"key\":\"mja-async/composing-futures/step-2\",\"prompt\":\"\u003cp\u003e\u003ccode\u003efetchUser(id)\u003c/code\u003e returns \u003ccode\u003eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e. Starting from \u003ccode\u003eCompletableFuture\u0026lt;String\u0026gt; idFuture\u003c/code\u003e, which gives \u003ccode\u003eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003ethenApply\u003c/code\u003e wraps whatever the function returns in a new \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003efuture\u003c/button\u003e, so a function returning \u003ccode\u003eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e gives \u003ccode\u003eCompletableFuture\u0026lt;CompletableFuture\u0026lt;User\u0026gt;\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ethenCompose\u003c/code\u003e expects a function that returns a future, and flattens the result to \u003ccode\u003eCompletableFuture\u0026lt;User\u0026gt;\u003c/code\u003e — just as \u003ccode\u003eflatMap\u003c/code\u003e flattens nested streams or optionals.\u003c/p\u003e\\n\u003cp\u003eUse \u003ccode\u003ethenApply\u003c/code\u003e for plain transformations and \u003ccode\u003ethenCompose\u003c/code\u003e when the next step is itself asynchronous.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eidFuture.thenCompose(this::fetchUser)\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eidFuture.thenApply(this::fetchUser)\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThat gives \u003ccode\u003eCompletableFuture\u0026lt;CompletableFuture\u0026lt;User\u0026gt;\u0026gt;\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},\"mja-async/composing-futures/step-4\":{\"id\":\"step-4\",\"key\":\"mja-async/composing-futures/step-4\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003esupplyAsync(() -\u0026gt; 20)\u003c/code\u003e produces 20, and \u003ccode\u003ethenApply(x -\u0026gt; x + 1)\u003c/code\u003e turns it into 21.\u003c/p\u003e\\n\u003cp\u003eMeanwhile the second \u003ccode\u003esupplyAsync\u003c/code\u003e produces 2 independently. \u003ccode\u003ethenCombine\u003c/code\u003e waits for both and applies \u003ccode\u003e(x, y) -\u0026gt; x * y\u003c/code\u003e to 21 and 2.\u003c/p\u003e\\n\u003cp\u003e21 × 2 = 42. The two suppliers can run at the same time; only the combining step waits for both.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$5f\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"22\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ethenCombine\u003c/code\u003e multiplies the two results.\u003c/p\u003e\\n\"},{\"html\":\"40\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003ethenApply\u003c/code\u003e adds one first: (20 + 1) × 2.\u003c/p\u003e\\n\"},{\"html\":\"42\",\"correct\":true,\"feedback\":\"$undefined\"}],\"caseSensitive\":false,\"wrong\":[]},\"mja-async/composing-futures/step-6\":{\"id\":\"step-6\",\"key\":\"mja-async/composing-futures/step-6\",\"prompt\":\"\u003cp\u003eMatch each method with its use.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003ethenApply\u003c/code\u003e\",\"\u003ccode\u003ethenCompose\u003c/code\u003e\",\"\u003ccode\u003ethenCombine\u003c/code\u003e\",\"\u003ccode\u003eexceptionally\u003c/code\u003e\",\"\u003ccode\u003eallOf\u003c/code\u003e\"],\"right\":[\"Transform the result\",\"Start a dependent async call\",\"Merge two independent results\",\"Supply a fallback on failure\",\"Wait for a whole list of futures\"],\"rightOrder\":[1,0,3,4,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Future\\\" data-def=\\\"A handle to a task\u0026amp;#39;s eventual result. \u0026lt;code\u0026gt;get()\u0026lt;/code\u0026gt; waits for it; \u0026lt;code\u0026gt;cancel()\u0026lt;/code\u0026gt; tries to stop the task.\\\" data-book=\\\"Java Concurrency in Practice\\\"\u003eFuture\u003c/button\u003e\"]},\"mja-async/composing-futures/step-7\":{\"id\":\"step-7\",\"key\":\"mja-async/composing-futures/step-7\",\"prompt\":\"\u003cp\u003eFall back to -1 if the lookup fails.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"blank\",\"parts\":[{\"text\":\"price.\"},{\"answers\":[\"exceptionally\"],\"size\":13,\"choices\":[\"exceptionally\",\"lastDayOfMonth\",\"supplyAsync\",\"0\"]},{\"text\":\"(t -\u003e -1.0)\"}],\"code\":true,\"caseSensitive\":false},\"mja-async/reactive-streams/step-3\":{\"id\":\"step-3\",\"key\":\"mja-async/reactive-streams/step-3\",\"prompt\":\"\u003cp\u003ePut the reactive-streams handshake in order.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"order\",\"items\":[\"The subscriber calls \u003ccode\u003epublisher.subscribe(subscriber)\u003c/code\u003e\",\"The publisher calls \u003ccode\u003eonSubscribe(subscription)\u003c/code\u003e\",\"The subscriber calls \u003ccode\u003esubscription.request(n)\u003c/code\u003e\",\"The publisher calls \u003ccode\u003eonNext(item)\u003c/code\u003e up to n times\",\"The publisher calls \u003ccode\u003eonComplete()\u003c/code\u003e or \u003ccode\u003eonError(e)\u003c/code\u003e\"],\"start\":[3,1,0,2,4]},\"mja-async/reactive-streams/step-4\":{\"id\":\"step-4\",\"key\":\"mja-async/reactive-streams/step-4\",\"prompt\":\"\u003cp\u003eMatch each Flow interface with its role.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"\u003ccode\u003ePublisher\u003c/code\u003e\",\"\u003ccode\u003eSubscriber\u003c/code\u003e\",\"\u003ccode\u003eSubscription\u003c/code\u003e\",\"\u003ccode\u003eProcessor\u003c/code\u003e\"],\"right\":[\"Produces items\",\"Consumes items\",\"The link that carries \u003ccode\u003erequest\u003c/code\u003e and \u003ccode\u003ecancel\u003c/code\u003e\",\"Both a subscriber and a publisher, in the middle\"],\"rightOrder\":[2,0,3,1]},\"mja-async/reactive-streams/step-5\":{\"id\":\"step-5\",\"key\":\"mja-async/reactive-streams/step-5\",\"prompt\":\"\u003cp\u003eHow does a slow subscriber avoid being overwhelmed?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eJava\u0026#39;s \u003ccode\u003eFlow\u003c/code\u003e only defines the interfaces; libraries like Reactor and RxJava implement them.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefin ode\u003e changes \u003ccode\u003ex\u003c/code\u003e\u0026#39;s letter.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-objects/aliasing/step-6\":{\"id\":\"step-6\",\"key\":\"tij-objects/aliasing/step-6\",\"prompt\":\"\u003cp\u003e\u003ccode\u003estatic void g(Letter y) { y = new Letter(); y.c = \u0026#39;q\u0026#39;; }\u003c/code\u003e — after \u003ccode\u003eg(x)\u003c/code\u003e, what is \u003ccode\u003ex.c\u003c/code\u003e, if it was \u003ccode\u003e\u0026#39;a\u0026#39;\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003e\u003ccode\u003ey\u003c/code\u003e is a copy of the reference held by \u003ccode\u003ex\u003c/code\u003e, so at first both point at the same object.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003ey = new Letter()\u003c/code\u003e only changes the copy, pointing it at a new object; \u003ccode\u003ex\u003c/code\u003e still points at the original.\u003c/p\u003e\\n\u003cp\u003eSetting \u003ccode\u003ey.c\u003c/code\u003e then changes the new object, which is thrown away when \u003ccode\u003eg\u003c/code\u003e returns.\u003c/p\u003e\\n\u003cp\u003eA method can change what an argument\u0026#39;s object holds, but it can never make the caller\u0026#39;s variable refer to something else.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003e\u0026#39;q\u0026#39;\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eReassigning the parameter only changes the method\u0026#39;s copy of the reference.\u003c/p\u003e\\n\"},{\"html\":\"Still \u003ccode\u003e\u0026#39;a\u0026#39;\u003c/code\u003e — \u003ccode\u003ey\u003c/code\u003e was pointed at a new object; \u003ccode\u003ex\u003c/code\u003e wasn\u0026#39;t touched\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"tij-objects/aliasing/step-7\":{\"id\":\"step-7\",\"key\":\"tij-objects/aliasing/step-7\", nceof Square) ((Square) o).draw(); }\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eEvery new shape needs another branch — the switch polymorphism removes.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003evoid render(Circle c) { c.draw(); }\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eIt only accepts circles; a Hexagon can\u0026#39;t be passed in.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003evoid render(Shape s) { s.draw(); }\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"}],\"multiple\":false},\"tij-polymorphism/method-lookup/step-3\":{\"id\":\"step-3\",\"key\":\"tij-polymorphism/method-lookup/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eInstrument i = new Brass(); i.play(Note.C);\u003c/code\u003e — tap the class whose \u003ccode\u003eplay\u003c/code\u003e runs.\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003e\u003ccode\u003eBrass\u003c/code\u003e has no \u003ccode\u003eplay\u003c/code\u003e, so the JVM moves up to \u003ccode\u003eWind\u003c/code\u003e, which has one.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA call like \u003ccode\u003ei.play(...)\u003c/code\u003e is late-bound: at run time, the JVM looks at the object\u0026#39;s real class, \u003ccode\u003eBrass\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eBrass\u003c/code\u003e doesn\u0026#39;t define \u003ccode\u003eplay\u003c/code\u003e, so the lookup moves up to its superclass \u003ccode\u003eWind\u003c/code\u003e, which does.\u003c/p\u003e\\n\u003cp\u003eThe declared type, \u003ccode\u003eInstrument\u003c/code\u003e, only decides whether the call compiles; it plays no part in choosing which code runs.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Instrument\",\"methods\":[\"+ play(Note)\",\"+ adjust()\"]},{\"name\":\"Wind\",\"methods\":[\"+ play(Note)\"]},{\"name\":\"Percussion\",\"methods\":[\"+ play(Note)\"]},{\"name\":\"Brass\",\"methods\":[\"+ adjust()\"]},{\"name\":\"Woodwind\",\"methods\":[\"+ play(Note)\"]}],\"relations\":[{\"from\":\"Wind\",\"to\":\"Instrument\",\"type\":\"extends\"},{\"from\":\"Percussion\",\"to\":\"Instrument\",\"type\":\"extends\"},{\"from\":\"Brass\",\"to\":\"Wind\",\"type\":\"extends\"},{\"from\":\"Woodwind\",\"to\":\"Wind\",\"type\":\"extends\"}]},\"feedback\":{\"Brass\":\"`Brass` doesn't define `play`, so the search moves up to its parent.\",\"Instrument\":\"The search stops at the first class that defines `play` — before reaching `Instrument`.\",\"Woodwind\":\"Woodwind is a sibling of Brass, not an ancestor.\",\"Percussion\":\"Percussion isn't on Brass's path to the root.\"}},\"goal\":{\"select\":\"Wind\"},\"question\":\"$undefined\"},\"tij-polymorphism/method-lookup/step-4\":{\"id\":\"step-4\",\"key\":\"tij-polymorphism/method-lookup/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eInstrument i = new Brass(); i.adjust();\u003c/code\u003e — whose \u003ccode\u003eadjust\u003c/code\u003e runs?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe object\u0026#39;s own class defines \u003ccode\u003eadjust\u003c/code\u003e, so that one runs.\u003c/p\u003e\\n\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"widget\",\"widget\":\"hierarchy\",\"config\":{\"diagram\":{\"classes\":[{\"name\":\"Instrument\",\"methods\":[\"+ play(Note)\",\"+ adjust()\"]},{\"name\":\"Wind\",\"methods\":[\"+ play(Note)\"]},{\"name\":\"Brass\",\"methods\":[\"+ adjust()\"]},{\"name\":\"Woodwind\",\"methods\":[\"+ play(Note)\"]}],\"relations\":[{\"from\":\"Wind\",\"to\":\"Instrument\",\"type\":\"extends\"},{\"from\":\"Brass\",\"to\":\"Wind\",\"type\":\"extends\"},{\"from\":\"Woodwind\",\"to\":\"Wind\",\"type\":\"extends\"}]},\"feedback\":{\"Instrument\":\"`Brass` overrides `adjust` itself, so the search never gets this far.\",\"Wind\":\"`Wind` doesn't define `adjust` — and `Brass`, below it, does.\"}},\"goal\":{\"select\":\"Brass\"},\"question\":\"$undefined\"},\"tij-polymorphism/method-lookup/step-6\":{\"id\":\"step-6\",\"key\":\"tij-polymorphism/method-lookup/step-6\",\"prompt\":\"\u003cp\u003eYou add \u003ccode\u003eclass Saxophone extends Woodwind\u003c/code\u003e that overrides nothing. What does \u003ccode\u003etune(new Saxophone())\u003c/code\u003e play?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$6c\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"It doesn\u0026#39;t compile until Saxophone overrides \u003ccode\u003eplay\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eplay\u003c/code\u003e isn\u0026#39;t abstract, so Saxophone inherits a working version.\u003c/p\u003e\\n\"},{\"html\":\"\u003ccode\u003eWoodwind.play\u003c/code\u003e, the nearest definition above it\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eInstrument.play\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe search stops at the first class up the chain that defines \u003ccode\u003eplay\u003c/code\u003e — \u003ccode\u003eWoodwind\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"multiple\":false},\"tij-polymorphism/not-polymorphic/step-2\":{\"id\":\"step-2\",\"key\":\"tij-polymorphism/not-polymorphic/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003emain\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eGive subclass methods different names from private base methods, and use \u003ccode\u003e@Override\u003c/code\u003e to catch the mistake.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eA \u003ccode\u003eprivate\u003c/code\u003e method is invisible outside its class, so a method with the same name in a subclass doesn\u0026#39;t override it — it\u0026#39;s a brand-new, unrelated method.\u003c/p\u003e\\n\u003cp\u003eThe call \u003ccode\u003epo.f()\u003c/code\u003e is compiled inside \u003ccode\u003ePrivateOverride\u003c/code\u003e, where the variable\u0026#39;s type is \u003ccode\u003ePrivateOverride\u003c/code\u003e, so it binds to the private \u003ccode\u003ef()\u003c/code\u003e directly, with no \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Late binding\\\" data-def=\\\"Choosing which method body to run at run time, from the object\u0026amp;#39;s actual class, rather than at compile time from the variable\u0026amp;#39;s type.\\\" data-book=\\\"Thinking in Java\\\"\u003elate binding\u003c/button\u003e.\u003c/p\u003e\\n\u003cp\u003eAdding \u003ccode\u003e@Override\u003c/code\u003e to the subclass method would make the compiler reject it, which is exactly why the annotation is worth writing.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$6d\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eprivate f()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003epublic f()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003eDerived.f\u003c/code\u003e doesn\u0026#39;t override a private method — it can\u0026#39;t see it. The call through \u003ccode\u003ePrivateOverride\u003c/code\u003e binds to the private \u003ccode\u003ef\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-polymorphism/not-polymorphic/step-4\":{\"id\":\"step-4\",\"key\":\"tij-polymorphism/not-polymorphic/step-4\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eSuper\u003c/code\u003e has \u003ccode\u003efield = 0\u003c/code\u003e and \u003ccode\u003egetField()\u003c/code\u003e; \u003ccode\u003eSub\u003c/code\u003e has its own \u003ccode\u003efield = 1\u003c/code\u003e and overrides \u003ccode\u003egetField()\u003c/code\u003e. What does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eFields are never polymorphic: \u003ccode\u003esup.field\u003c/code\u003e is resolved at compile time from the variable\u0026#39;s declared type, \u003ccode\u003eSuper\u003c/code\u003e, so it reads \u003ccode\u003eSuper\u003c/code\u003e\u0026#39;s field, which is 0.\u003c/p\u003e\\n\u003cp\u003eA \u003ccode\u003eSub\u003c/code\u003e object actually holds two fields named \u003ccode\u003efield\u003c/code\u003e, one from each class, and the subclass one only hides the other.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003egetField()\u003c/code\u003e is an instance method, so \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Late binding\\\" data-def=\\\"Choosing which method body to run at run time, from the object\u0026amp;#39;s actual class, rather than at compile time from the variable\u0026amp;#39;s type.\\\" data-book=\\\"Thinking in Java\\\"\u003elate binding\u003c/button\u003e picks \u003ccode\u003eSub.getField()\u003c/code\u003e, which returns \u003ccode\u003eSub\u003c/code\u003e\u0026#39;s field, 1.\u003c/p\u003e\\n\u003cp\u003eKeep fields private and expose them through methods, and this confusion can\u0026#39;t arise.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$6e\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"1 1\",\"correct\":false,\"feedback\":\"\u003cp\u003eThe field access uses the declared type, \u003ccode\u003eSuper\u003c/code\u003e; only the method call is late-bound.\u003c/p\u003e\\n\"},{\"html\":\"0 1\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"0 0\",\"correct\":false,\"feedback\":\"\u003cp\u003e\u003ccode\u003egetField()\u003c/code\u003e is overridden, so \u003ccode\u003eSub\u003c/code\u003e\u0026#39;s version runs and returns its own field.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-polymorphism/not-polymorphic/step-6\":{\"id\":\"step-6\",\"key\":\"tij-polymorphism/not-polymorphic/step-6\",\"prompt\":\"\u003cp\u003eWhat does this print?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eStatic methods belong to the class, not to an object, so a call through a variable is resolved at compile time from its declared type, \u003ccode\u003eStaticSuper\u003c/code\u003e.\u003c/p\u003e\\n\u003cp\u003eThe static method in the subclass hides the base one rather than \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Overriding\\\" data-def=\\\"A subclass redefining an inherited method. Which one runs is decided at run time from the object\u0026amp;#39;s actual class.\\\" data-book=\\\"Effective Java\\\"\u003eoverriding\u003c/button\u003e it, so \u003ccode\u003estaticGet()\u003c/code\u003e gives the base version.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003edynamicGet()\u003c/code\u003e is an ordinary instance method, so it\u0026#39;s late-bound to the object\u0026#39;s real class and gives the derived version.\u003c/p\u003e\\n\u003cp\u003eCall static methods through the class name, never through a reference, so the code says what actually happens.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$6f\",\"answers\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eBase staticGet()\u003c/code\u003e, then \u003ccode\u003eDerived dynamicGet()\u003c/code\u003e\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003eDerived staticGet()\u003c/code\u003e, then \u003ccode\u003eDerived dynamicGet()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eStatic methods are bound to the declared type, \u003ccode\u003eStaticSuper\u003c/code\u003e.\u003c/p\u003e\\n\"}],\"caseSensitive\":false,\"wrong\":[]},\"tij-polymorphism/not-polymorphic/step-7\":{\"id\":\"step-7\",\"key\":\"tij-polymorphism/not-polymorphic/step-7\",\"prompt\":\"\u003cp\u003eMatch each member with how a call to it is resolved.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Public instance method\",\"Private method\",\"Field\",\"Static method\"],\"right\":[\"The object\u0026#39;s class, at run time\",\"The class that declares it — never overridden\",\"The variable\u0026#39;s declared type\",\"The declared type, at compile time\"],\"rightOrder\":[3,1,0,2]},\"tij-polymorphism/constructors-and-polymorphism/step-2\":{\"id\":\"step-2\",\"key\":\"tij-polymorphism/constructors-and-polymorphism/step-2\",\"prompt\":\"\u003cp\u003eWhat does \u003ccode\u003enew RoundGlyph(5)\u003c/code\u003e print?\u003c/p\u003e\\n\",\"explanation\":\"\u003cp\u003eThe rule — do as little as possible in a constructor, and call only \u003ccode\u003efinal\u003c/code\u003e or \u003ccode\u003eprivate\u003c/code\u003e methods there.\u003c/p\u003e\\n\",\"details\":\"\u003cp\u003eBefore any constructor runs, the whole object\u0026#39;s memory is zeroed, so \u003ccode\u003eradius\u003c/code\u003e already exists with the value 0.\u003c/p\u003e\\n\u003cp\u003e\u003ccode\u003eGlyph()\u003c/code\u003e runs first and calls \u003ccode\u003edraw()\u003c/code\u003e, which is late-bound like any other call, so it reaches \u003ccode\u003eRoundGlyph.draw\u003c/code\u003e even though \u003ccode\u003eRoundGlyph\u003c/code\u003e\u0026#39;s part isn\u0026#39;t initialized yet.\u003c/p\u003e\\n\u003cp\u003eOnly after \u003ccode\u003eGlyph()\u003c/code\u003e returns do \u003ccode\u003eRoundGlyph\u003c/code\u003e\u0026#39;s field initializers and constructor body run, setting \u003ccode\u003eradius\u003c/code\u003e to 5.\u003c/p\u003e\\n\u003cp\u003eA base-class constructor that calls an overridable method lets a subclass see itself half-built — a bug the compiler won\u0026#39;t warn you about.\u003c/p\u003e\\n\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"predict\",\"code\":\"$70\",\"answers\":\"$undefine e\u003e\",\"\u003ccode\u003eFilter\u003c/code\u003e\",\"\u003ccode\u003eFilterAdapter\u003c/code\u003e\"],\"rightOrder\":[0,2,1]},\"tij-inner-classes/inner-objects/step-3\":{\"id\":\"step-3\",\"key\":\"tij-inner-classes/inner-objects/step-3\",\"prompt\":\"\u003cp\u003e\u003ccode\u003eSequenceSelector\u003c/code\u003e is an inner (non-static) class of \u003ccode\u003eSequence\u003c/code\u003e, and \u003ccode\u003eseq\u003c/code\u003e is a \u003ccode\u003eSequence\u003c/code\u003e. How do you create a \u003ccode\u003eSequenceSelector\u003c/code\u003e from outside \u003ccode\u003eSequence\u003c/code\u003e?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"choice\",\"code\":\"$undefined\",\"options\":[{\"html\":\"\u003ccode\u003eSequence.SequenceSelector sel = seq.new SequenceSelector();\u003c/code\u003e — through an outer object\",\"correct\":true,\"feedback\":\"$undefined\"},{\"html\":\"\u003ccode\u003enew Sequence.SequenceSelector()\u003c/code\u003e\",\"correct\":false,\"feedback\":\"\u003cp\u003eAn inner object needs an outer object to link to, so there\u0026#39;s nothing to attach it to here.\u003c/p\u003e\\n\"}],\"multiple\":false},\"tij-inner-classes/inner-objects/step-5\":{\"id\":\"step-5\",\"key\":\"tij-inner-classes/inner-objects/step-5\",\"prompt\":\"\u003cp\u003eMatch each kind of nested class with what it can reach.\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"$undefined\",\"diagram\":\"$undefined\",\"feedback\":\"$undefined\",\"hints\":[],\"type\":\"match\",\"left\":[\"Inner class\",\"Static nested class\",\"Local class in a method\"],\"right\":[\"The outer object\u0026#39;s fields, through \u003ccode\u003eOuter.this\u003c/code\u003e\",\"Only static members of the outer class\",\"Outer fields, plus effectively final locals of the method\"],\"rightOrder\":[1,0,2],\"terms\":[\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Inner class\\\" data-def=\\\"A nested class without \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt;. Each instance secretly holds a reference to its enclosing instance, which costs memory and can cause leaks.\\\" data-book=\\\"Effective Java\\\"\u003eInner class\u003c/button\u003e\",\"\u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Static member class\\\" data-def=\\\"A nested class declared \u0026lt;code\u0026gt;static\u0026lt;/code\u0026gt; — an ordinary class that happens to live inside another. Doesn\u0026amp;#39;t hold a reference to an outer instance.\\\" data-book=\\\"Effective Java\\\"\u003eStatic member class\u003c/button\u003e\"]},\"tij-inner-classes/inner-objects/step-6\":{\"id\":\"step-6\",\"key\":\"tij-inner-classes/inner-objects/step-6\",\"prompt\":\"\u003cp\u003eA long-lived \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Cache\\\" data-def=\\\"Keeping copies of data somewhere faster to reach, to avoid recomputing or refetching it.\\\"\u003ecache\u003c/button\u003e holds inner-class objects. Their outer objects are otherwise unused. What happens?\u003c/p\u003e\\n\",\"explanation\":\"$undefined\",\"details\":\"\u003cp\u003eEvery non-static inner object holds a hidden reference to the outer object that created it.\u003c/p\u003e\\n\u003cp\u003eWhile the cache keeps the inner objects reachable, that hidden reference keeps each outer object reachable too, along with everything it holds.\u003c/p\u003e\\n\u003cp\u003eThe \u003cbutton type=\\\"button\\\" class=\\\"term\\\" aria-expanded=\\\"false\\\" data-term=\\\"Garbage collection\\\" data-def=\\\"The JVM automatically finding objects that are no longer reachable and reclaiming their memory.\\\"\u003egarbage collector\u003c/button\u003e only frees unreachable objects, so the memory stays in use for as long as the cache does.\u003c/p\u003e\\n\u003cp\u003eIf a nested class doesn\u
