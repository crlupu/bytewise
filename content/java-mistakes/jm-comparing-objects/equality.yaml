  - { book: java-mistakes, ref: "Chapter 7, Comparing objects — equals that doesn't compare contents" }
  - { book: java-mistakes, ref: "Chapter 7, Comparing objects — BigDecimals with different scales" }
  - { book: java-mistakes, ref: "Chapter 7, Comparing objects — equals on unrelated types" }
  - { book: java-mistakes, ref: "Chapter 7, Comparing objects — a malformed equals" }
