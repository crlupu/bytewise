steps:
  - type: explanation
    title: "What equals compares"
    body: |
      `==` on objects compares references: `Integer`s are cached only from −128 to 127.
      Arrays and `StringBuilder` don't override `equals`; use `Arrays.equals` or compare `toString()`.
      `BigDecimal.equals` compares scale: `1.0` and `1.00` are different. `Long.equals(Integer)` is always false.

  - type: explanation
    title: "The contracts"
    body: |
      `equals` must be reflexive, symmetric and transitive; mixing subclasses with extra state usually breaks symmetry.
      Equal objects must have equal hash codes, and a record with an array field compares the array by reference.
      Never mutate an object while it's a key in a hash-based collection.

  - type: predict
    id: jm-057
    prompt: |
      What does this print?
    code: |
      import java.util.*;

      public class Scores {
          public static void main(String[] args) {
              Map<String, Integer> a = Map.of("ann", 100, "bob", 1000);
              Map<String, Integer> b = Map.of("ann", 100, "bob", 1000);
              System.out.println(a.get("ann") == b.get("ann"));
              System.out.println(a.get("bob") == b.get("bob"));
          }
      }
    language: java
    options:
      - text: "true\nfalse"
        correct: true
      - text: "true\ntrue"
        feedback: "`Integer.valueOf` caches −128…127 only; two separate 1000s are different objects."
    explanation: |
      Compare boxed numbers with `equals`.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 7, Comparing objects — reference equality for wrappers.

  - type: predict
    id: jm-058
    prompt: |
      What does this print?
    code: |
      import java.util.Arrays;

      public class Contents {
          public static void main(String[] args) {
              int[] a = {1, 2}, b = {1, 2};
              System.out.println(a.equals(b) + " " + Arrays.equals(a, b));
              StringBuilder x = new StringBuilder("hi"), y = new StringBuilder("hi");
              System.out.println(x.equals(y) + " " + (x.compareTo(y) == 0));
          }
      }
    language: java
    options:
      - text: "false true\nfalse true"
        correct: true
      - text: "true true\ntrue true"
        feedback: "Arrays and `StringBuilder` inherit `Object.equals`, which compares identity."
    explanation: |
      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 7, Comparing objects — equals that doesn't compare contents.

  - type: predict
    id: jm-059
    prompt: |
      What does this print?
    code: |
      import java.math.BigDecimal;

      public class Money {
          public static void main(String[] args) {
              BigDecimal a = new BigDecimal("2.50");
              BigDecimal b = new BigDecimal("2.5");
              System.out.println(a.equals(b));
              System.out.println(a.compareTo(b) == 0);
          }
      }
    language: java
    options:
