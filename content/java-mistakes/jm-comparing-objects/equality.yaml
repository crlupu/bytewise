  - type: predict
    id: jm-060
    prompt: |
      What does this print?
    code: |
      import java.util.*;

      public class Lookup {
          public static void main(String[] args) {
              Map<Long, String> users = new HashMap<>();
              users.put(7L, "ann");
              int id = 7;
              System.out.println(users.get(id));
              System.out.println(Long.valueOf(7).equals(7));
          }
      }
    language: java
    options:
      - text: "null\nfalse"
        correct: true
      - text: "ann\ntrue"
        feedback: "`id` is boxed to an `Integer`, and `Long.equals(Integer)` is always false."
    explanation: |
      `Map.get` takes `Object`, so the compiler doesn't complain. IDE inspections do.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 7, Comparing objects — equals on unrelated types.

  - type: predict
    id: jm-061
    prompt: |
      What does this print?
    code: |
      public class Symmetry {
          static class Point {
              final int x, y;
              Point(int x, int y) { this.x = x; this.y = y; }
              @Override public boolean equals(Object o) {
                  return o instanceof Point p && p.x == x && p.y == y;
              }
              @Override public int hashCode() { return 31 * x + y; }
          }
          static class ColorPoint extends Point {
              final String color;
              ColorPoint(int x, int y, String color) { super(x, y); this.color = color; }
              @Override public boolean equals(Object o) {
                  return o instanceof ColorPoint c && super.equals(c) && c.color.equals(color);
              }
          }

          public static void main(String[] args) {
              Point p = new Point(1, 2);
              ColorPoint cp = new ColorPoint(1, 2, "red");
              System.out.println(p.equals(cp) + " " + cp.equals(p));
          }
      }
    language: java
    options:
      - text: "true false"
        correct: true
      - text: "false false"
        feedback: "`Point.equals` accepts any `Point`, including a `ColorPoint`, so the first comparison is true."
    explanation: |
      `equals` isn't symmetric here. Prefer composition (a `ColorPoint` that has a `Point`), or records.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 7, Comparing objects — a malformed equals.

  - type: predict
    id: jm-062
    prompt: |
      What does this print?
    code: |
      import java.util.*;

      public class Keys {
          record Key(String table, int[] columns) { }

          public static void main(String[] args) {
              Set<Key> seen = new HashSet<>();
              seen.add(new Key("users", new int[] {1, 2}));
              System.out.println(seen.contains(new Key("users", new int[] {1, 2})));
          }
      }
    language: java
    options:
      - text: "false"
        correct: true
      - text: "true"
        feedback: "A record's generated `equals` and `hashCode` use the array's own, which compare identity."
    explanation: |
      Use a `List<Integer>`, or override `equals`/`hashCode` with `Arrays.equals`/`Arrays.hashCode`.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 7, Comparing objects — arrays in equals and hashCode.

  - type: predict
    id: jm-063
    prompt: |
      What does this print?
    code: |
      import java.util.*;

      public class MutableKey {
          public static void main(String[] args) {
              List<String> tags = new ArrayList<>(List.of("java"));
              Set<List<String>> set = new HashSet<>();
              set.add(tags);
              tags.add("jvm");
              System.out.println(set.contains(tags));
              System.out.println(set.size() + " " + set.iterator().next().equals(tags));
          }
      }
    language: java
    options:
      - text: "false\n1 true"
        correct: true
      - text: "true\n1 true"
        feedback: "The list's hash code changed after it was stored, so the set looks in the wrong bucket."
    explanation: |
      Never mutate an object that's a key in a hash-based collection; use immutable keys.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 7, Comparing objects — mutating a hash key.
