steps:
  - type: explanation
    title: "Order and modification"
    body: |
      `HashMap` and `HashSet` iteration order is unspecified, and `Set.of`/`Map.of` order changes from run to run.
      Changing a collection while a for-each loop iterates over it throws `ConcurrentModificationException`; use `removeIf` or an explicit iterator.

  - type: explanation
    title: "Views"
    body: |
      `subList`, `keySet`, `values` and `entrySet` are views: changes go both ways, and a structural change to the backing list invalidates a `subList`.
      A mapping function passed to `computeIfAbsent` must not modify the same map.

  - type: choice
    id: jm-078
    prompt: |
      The test expects `[red, green, blue]`. Can this program be relied on to print that?
    code: |
      import java.util.*;

      public class Colors {
          public static void main(String[] args) {
              Set<String> colors = Set.of("red", "green", "blue");
              System.out.println(colors);
          }
      }
    language: java
    options:
      - text: "No: `Set.of` iteration order is unspecified and deliberately changes from one JVM run to the next"
        correct: true
      - text: "Yes: sets keep insertion order"
        feedback: "Only `LinkedHashSet` (and sorted sets) promise an order."
    explanation: |
      Use `List.of`, a `LinkedHashSet` or a `TreeSet` when order matters — and compare sets as sets in tests.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 8, Collections and maps — relying on iteration order.

  - type: choice
    id: jm-079
    prompt: |
      Remove the empty strings. What happens?
    code: |
      import java.util.*;

      public class Clean {
          public static void main(String[] args) {
              List<String> xs = new ArrayList<>(List.of("a", "", "b", "", "c"));
              for (String x : xs)
                  if (x.isEmpty()) xs.remove(x);
              System.out.println(xs);
          }
      }
    language: java
    options:
      - text: "`ConcurrentModificationException`: the for-each iterator notices the list changed under it"
        correct: true
      - text: "It prints `[a, b, c]`"
        feedback: "That's what `xs.removeIf(String::isEmpty)` does."
    explanation: |
      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 8, Collections and maps — modifying a collection while iterating.

  - type: predict
    id: jm-080
    prompt: |
      Remove the value 1 from the list. What does this print?
    code: |
      import java.util.*;

      public class RemoveOne {
          public static void main(String[] args) {
              List<Integer> xs = new ArrayList<>(List.of(1, 5, 7));
              xs.remove(1);
              System.out.println(xs);
              Set<Integer> s = new HashSet<>(List.of(1, 5, 7));
              s.remove(1);
              System.out.println(s.contains(1));
          }
      }
    language: java
    options:
      - text: "[1, 7]\nfalse"
        correct: true
      - text: "[5, 7]\nfalse"
        feedback: "`List.remove(int)` removes by index: index 1 holds 5. `Set` has no index, so its `remove(1)` boxes the value."
      - text: "[1, 5, 7]\ntrue"
        feedback: "Both calls remove something; just not the same thing."
    explanation: |
      Write `xs.remove(Integer.valueOf(1))` to remove the value from a `List<Integer>`.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 8, Collections and maps — remove(int) versus remove(Object).

  - type: choice
    id: jm-081
    prompt: |
      What happens?
    code: |
      import java.util.*;

      public class Window {
          public static void main(String[] args) {
              List<Integer> xs = new ArrayList<>(List.of(1, 2, 3, 4, 5));
              List<Integer> firstTwo = xs.subList(0, 2);
              xs.add(6);
              System.out.println(firstTwo);
          }
      }
    language: java
    options:
      - text: "`ConcurrentModificationException`: a `subList` is a view, and a structural change to the backing list invalidates it"
        correct: true
      - text: "It prints `[1, 2]`"
        feedback: "The view is checked on every access."
    explanation: |
      Copy it if you need it later: `new ArrayList<>(xs.subList(0, 2))`.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 8, Collections and maps — using a subList after modifying the list.

  - type: predict
    id: jm-082
    prompt: |
      What does this print?
    code: |
      import java.util.*;

      public class Prune {
          public static void main(String[] args) {
              Map<String, Integer> stock = new HashMap<>(Map.of("a", 0, "b", 3));
              Collection<Integer> counts = stock.values();
              counts.remove(0);
              System.out.println(stock);
          }
      }
    language: java
    options:
      - text: "{b=3}"
        correct: true
      - text: "{a=0, b=3}"
        feedback: "`values()` is a view: removing from it removes the whole entry from the map."
    explanation: |
      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 8, Collections and maps — views that write through.

  - type: choice
    id: jm-083
    prompt: |
      A memoized Fibonacci uses `computeIfAbsent` recursively. What happens on Java 21?
    code: |
      import java.util.*;

      public class Fib {
          static final Map<Integer, Long> memo = new HashMap<>();

          static long fib(int n) {
              if (n < 2) return n;
              return memo.computeIfAbsent(n, k -> fib(k - 1) + fib(k - 2));
          }

          public static void main(String[] args) {
              System.out.println(fib(30));
          }
      }
    language: java
    options:
      - text: "`ConcurrentModificationException`: since Java 9, `HashMap` detects a mapping function that adds to the same map"
        correct: true
      - text: "It prints `832040`"
        feedback: "The recursive calls insert into `memo` while the outer `computeIfAbsent` is still running."
    explanation: |
      Compute the value first, then `put` it — or use a plain loop.

      Original program written for Bytewise, run on Java 21. It shows a mistake from *100 Java Mistakes and How to Avoid Them* (Tagir Valeev), Chapter 8, Collections and maps — a computeIfAbsent function that modifies the map.
