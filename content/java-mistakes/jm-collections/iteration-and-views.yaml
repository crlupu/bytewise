title: "Iteration, order and views"
summary: "Mutable keys, iteration order you shouldn't rely on, modifying while iterating, stale subList views and recursive computeIfAbsent."
duration: 7
tags: [java, mistakes, collections, ConcurrentModificationException, HashMap]
sources:
  - { book: java-mistakes, ref: "Chapter 8, Collections and maps" }
  - { book: java-mistakes, ref: "Chapter 8, Collections and maps — relying on iteration order" }
  - { book: java-mistakes, ref: "Chapter 8, Collections and maps — modifying a collection while iterating" }
  - { book: java-mistakes, ref: "Chapter 8, Collections and maps — remove(int) versus remove(Object)" }
  - { book: java-mistakes, ref: "Chapter 8, Collections and maps — using a subList after modifying the list" }
  - { book: java-mistakes, ref: "Chapter 8, Collections and maps — views that write through" }
