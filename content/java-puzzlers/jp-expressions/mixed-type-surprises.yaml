title: Mixed types and sign extension
summary: Hex literals can be negative, casts sign-extend or zero-extend, and the conditional operator picks a type.
duration: 6
tags: [java, puzzlers, sign extension, casts, conditional operator, hex]
sources:
  - { book: java-puzzlers, ref: "Puzzle 5, The Joy of Hex" }
  - { book: java-puzzlers, ref: "Puzzle 6, Multicast" }
  - { book: java-puzzlers, ref: "Puzzle 8, Dos Equis" }
  - { book: java-puzzlers, ref: "Puzzle 75, Heads or Tails?" }
steps:
  - type: explanation
    title: Widening copies the sign bit
    body: |
      `0xcafebabe` is an `int` with its top bit set, so it's negative.
      Widening a negative `int` to `long` fills the new bits with ones.
      That's sign extension.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println(Long.toHexString(0x100000000L + 0xcafebabe));
    language: java
    options:
      - text: "cafebabe"
        correct: true
      - text: "1cafebabe"
        feedback: "`0xcafebabe` is a negative `int`. Widened, it becomes `0xffffffffcafebabe`, and adding `0x100000000` carries out the leading ones."
      - text: It doesn't compile
        feedback: Mixing `int` and `long` is legal; the `int` is widened.
    explanation: Write `0xcafebabeL` to get the positive `long` you meant. Better still, avoid mixing types in one expression.
    details: |
      `0xcafebabe` is an `int` literal, and its top bit is set, so its value is negative: -889,275,714.
      Adding it to a `long` widens it with sign extension, giving `0xffffffffcafebabe`.
      Adding `0x100000000` makes the high `ffffffff` overflow back to zero, leaving `0x00000000cafebabe` — so the 1 you expected disappears.

  - type: explanation
    title: char is unsigned
    body: |
      Casting from `byte` to `char` sign-extends first.
      Casting from `char` to `int` zero-extends, because `char` is unsigned.
      So a chain of casts can change the value.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println((int) (char) (byte) -1);
    language: java
    options:
      - text: "65535"
        correct: true
      - text: "-1"
        feedback: "`char` can't be negative. `(char) -1` is `\\uffff`, and widening a `char` fills with zeros."
      - text: "255"
        feedback: The `byte` is sign-extended to 16 bits on its way to `char`, so all 16 bits are set.
    details: |
      `(byte) -1` is all 8 bits set. Casting a `byte` to `char` first sign-extends it to 16 bits set, `\uffff`.
      Casting the `char` to `int` zero-extends, because `char` is unsigned, giving 0x0000ffff, which is 65,535.
      Whether a widening fills with ones or zeros depends on the source type being signed — an easy thing to forget in a chain of casts.

  - type: explanation
    title: The conditional operator picks one type
    body: |
      `cond ? a : b` has a single type for both branches.
      `char` and a constant `int` that fits gives `char`.
      `char` and an `int` variable gives `int`.

  - type: predict
    prompt: What does this print?
    code: |
      char x = 'X';
      int i = 0;
      System.out.print(true ? x : 0);
      System.out.print(false ? i : x);
    language: java
    options:
      - text: "X88"
        correct: true
      - text: "XX"
        feedback: "In the second expression the other operand is an `int` variable, so the result is `int` — 88, the code of 'X'."
      - text: "8888"
        feedback: "In the first expression `0` is a constant that fits in a `char`, so the result stays a `char`."
    explanation: Give both branches of a conditional the same type.
    details: |
      A conditional expression has one type for both branches.
      In `true ? x : 0`, one operand is `char` and the other a constant `int` that fits in a `char`, so the result type is `char` and prints `X`.
      In `false ? i : x`, `i` is an `int` variable, not a constant, so the result is promoted to `int`, and `'X'` prints as its code, 88.

  - type: match
    prompt: Match each conversion with what it does to the bits.
    pairs:
      - left: "`int` → `long`"
        right: Sign-extends
      - left: "`char` → `int`"
        right: Zero-extends
      - left: "`int` → `byte`"
        right: Keeps the low 8 bits

  - type: predict
    id: jpz-05
    prompt: |
      What does this print?
    code: |
      public class HexSum {
          public static void main(String[] args) {
              System.out.println(Long.toHexString(0x300000000L + 0x80000000));
          }
      }
    language: java
    options:
      - text: "280000000"
        correct: true
      - text: "380000000"
        feedback: "`0x80000000` is a negative `int`; it's sign-extended to `0xffffffff80000000` before the addition."
    explanation: |
      Hex and octal `int` literals with the top bit set are negative. Write `0x80000000L` to get the positive value.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 5, The Joy of Hex in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-06
    prompt: |
      What does this print?
    code: |
      public class Casts {
          public static void main(String[] args) {
              byte b = -2;
              System.out.println((int) (char) b);
          }
      }
    language: java
    options:
      - text: "65534"
        correct: true
      - text: "-2"
        feedback: "`char` is unsigned: `(char) -2` is `\\uFFFE`, and widening a `char` to `int` zero-extends."
      - text: "254"
        feedback: "The byte is first sign-extended to 16 bits, not 8."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 6, Multicast in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-08
    prompt: |
      What does this print?
    code: |
      public class Ternaries {
          public static void main(String[] args) {
              char c = 'Y';
              int zero = 0;
              System.out.print(true ? c : 0);
              System.out.print(false ? zero : c);
              System.out.println();
          }
      }
    language: java
    options:
      - text: "Y89"
        correct: true
      - text: "YY"
        feedback: "In the second expression the other operand is an `int` variable, not a constant, so the result type is `int`."
      - text: "8989"
        feedback: "In the first, `0` is a constant that fits in `char`, so the result type is `char`."
    explanation: |
      Give both operands of `?:` the same type.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 8, Dos Equis in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-75
    prompt: |
      Does this compile on Java 21, and what type does the conditional have?
    code: |
      import java.util.Random;

      public class Coin {
          static class Side { }
          static class Heads extends Side { public String toString() { return "heads"; } }
          static class Tails extends Side { public String toString() { return "tails"; } }

          public static void main(String[] args) {
              Random rnd = new Random(1);
              Side s = rnd.nextBoolean() ? new Heads() : new Tails();
              System.out.println(s);
          }
      }
    language: java
    options:
      - text: "Yes: the conditional's type is the least upper bound of `Heads` and `Tails`, which is `Side`"
        correct: true
      - text: "No: the operands have different types"
        feedback: "That was the rule before Java 5, when the book's puzzle was set."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 75, Heads or Tails? in *Java Puzzlers* (Bloch & Gafter).
