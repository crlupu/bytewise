title: When methods don't override
summary: Package-private methods can't be overridden from another package, and fields are hidden, never overridden.
duration: 5
tags: [java, puzzlers, overriding, hiding, package private, fields]
sources:
  - { book: java-puzzlers, ref: "Puzzle 70, Package Deal" }
  - { book: java-puzzlers, ref: "Puzzle 66, A Private Matter" }
  - { book: java-puzzlers, ref: "Puzzle 72, Final Jeopardy" }
  - { book: java-puzzlers, ref: "Puzzle 73, Your Privates Are Showing" }
  - { book: java-puzzlers, ref: "Puzzle 74, Identity Crisis" }
steps:
  - type: explanation
    title: Package-private stays in the package
    body: |
      A package-private method is invisible outside its package.
      A subclass elsewhere can declare one with the same name.
      It doesn't override; it's a separate method.
    diagram:
      classes:
        - { name: click.CodeTalk, methods: ["+ doIt()", "~ printMessage()"] }
        - { name: hack.ClickIt, methods: ["~ printMessage()"] }
      relations:
        - { from: hack.ClickIt, to: click.CodeTalk, type: extends }
      caption: "~ is package-private: the two printMessage() methods can't see each other."

  - type: predict
    prompt: What does `new TypeIt.ClickIt().doIt()` print?
    code: |
      package click;
      public class CodeTalk {
        public void doIt() { printMessage(); }
        void printMessage() { System.out.println("Click"); }
      }

      package hack;
      public class TypeIt {
        static class ClickIt extends click.CodeTalk {
          void printMessage() { System.out.println("Hack"); }
        }
      }
    language: java
    options:
      - text: "`Click`"
        correct: true
      - text: "`Hack`"
        feedback: "`printMessage` is package-private in `click`, so `ClickIt`'s method in `hack` doesn't override it."
    explanation: With `@Override` on `ClickIt.printMessage`, the compiler would have caught it.
    details: |
      `printMessage` has no access modifier, so it's package-private in `click`.
      A class in another package, like `hack`, can't see it, and therefore can't override it: `ClickIt.printMessage` is a brand-new method that happens to share the name.
      `doIt` calls `CodeTalk.printMessage`, which prints "Click". `@Override` on the subclass method would have flagged the mistake.

  - type: explanation
    title: Fields are hidden
    body: |
      A subclass field with the same name hides the parent's field.
      Which one you get depends on the declared type.
      Only methods are chosen at runtime.

  - type: predict
    prompt: What does this print?
    code: |
      class Base { String name = "base"; }
      class Derived extends Base { String name = "derived"; }

      Base b = new Derived();
      System.out.println(b.name);
    language: java
    options:
      - text: "`base`"
        correct: true
      - text: "`derived`"
        feedback: Field access uses the declared type, `Base`.

  - type: match
    prompt: Match each case with what happens.
    pairs:
      - left: Public instance method, same signature in a subclass
        right: Overrides
      - left: Static method, same signature in a subclass
        right: Hides the method — chosen by declared type
      - left: Field with the same name in a subclass
        right: Hides the field — chosen by declared type, too
      - left: Package-private method, subclass in another package
        right: Neither — they're unrelated

  - type: choice
    id: jpz-66
    prompt: |
      Does this compile?
    code: |
      public class Hiding {
          static class Base {
              public String name = "base";
          }
          static class Derived extends Base {
              private String name = "derived";
          }

          public static void main(String[] args) {
              System.out.println(new Derived().name);
          }
      }
    language: java
    options:
      - text: "Yes, and it prints `derived`: `main` is inside the same top-level class, so it may see the private field"
        correct: true
      - text: "No: `name` is private in `Derived`"
        feedback: "Private access is per top-level class; nested classes share it."
      - text: "Yes, and it prints `base`"
        feedback: "`Derived.name` hides `Base.name`; the private one is accessible here."
    explanation: |
      From another top-level class, `new Derived().name` wouldn't compile — the hiding field is private — while `((Base) new Derived()).name` would print `base`. Fields are hidden, not overridden.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 66, A Private Matter in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-70
    prompt: |
      `Base.describe()` has no access modifier. What does this print?
    code: |
      // lib/Base.java
      package lib;

      public class Base {
          public void show() { System.out.println(describe()); }
          String describe() { return "lib.Base"; }
      }

      // app/Main.java
      package app;

      public class Main extends lib.Base {
          String describe() { return "app.Main"; }

          public static void main(String[] args) {
              new Main().show();
          }
      }
    language: java
    options:
      - text: "lib.Base"
        correct: true
      - text: "app.Main"
        feedback: "A package-private method can't be overridden from another package; `Main.describe` is a new method."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 70, Package Deal in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-72
    prompt: |
      What does this print?
    code: |
      public class Prizes {
          static class Game {
              public static final String PRIZE = "a car";
          }
          static class SequelGame extends Game {
              public static final String PRIZE = "a pen";
          }

          public static void main(String[] args) {
              System.out.println(SequelGame.PRIZE);
          }
      }
    language: java
    options:
      - text: "a pen"
        correct: true
      - text: "It doesn't compile: `PRIZE` is final"
        feedback: "`final` stops reassignment and overriding, not hiding: a subclass may declare a field with the same name."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 72, Final Jeopardy in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-73
    prompt: |
      A library class later adds a private field with the same name as a public one in its superclass. Does the client still compile?
    code: |
      // lib/Api.java
      package lib;

      public class Api {
          public static class Base {
              public static String version = "1.0";
          }
          public static class Impl extends Base {
              private static String version = "2.0-internal";
          }
      }

      // client/Client.java
      package client;

      import lib.Api;

      public class Client {
          public static void main(String[] args) {
              System.out.println(Api.Impl.version);
          }
      }
    language: java
    options:
      - text: "No: the private field hides the public one, so `Api.Impl.version` is now inaccessible"
        correct: true
      - text: "Yes, it prints `1.0`"
        feedback: "Hiding happens even though the new field is private."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 73, Your Privates Are Showing in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-74
    prompt: |
      What does this print?
    code: |
      public class Enigma {
          public boolean equals(Enigma other) {
              return false;
          }

          public static void main(String[] args) {
              Enigma e = new Enigma();
              Object o = e;
              System.out.println(e.equals(e) + " " + o.equals(o) + " " + e.equals(o));
          }
      }
    language: java
    options:
      - text: "false true true"
        correct: true
      - text: "false false false"
        feedback: "The overload is chosen by the argument's static type: `Object` arguments use `Object.equals`, which is identity."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 74, Identity Crisis in *Java Puzzlers* (Bloch & Gafter).
