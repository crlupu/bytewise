title: Loops at the edge of a type
summary: A loop variable can't exceed its type's maximum, and shift distances wrap around.
duration: 5
tags: [java, puzzlers, loops, overflow, byte, shifts]
sources:
  - { book: java-puzzlers, ref: "Puzzle 24, A Big Delight in Every Byte" }
  - { book: java-puzzlers, ref: "Puzzle 26, In the Loop" }
  - { book: java-puzzlers, ref: "Puzzle 27, Shifty i's" }
steps:
  - type: explanation
    title: Comparing byte with int
    body: |
      `b == 0x90` compares a `byte` with the `int` 144.
      A `byte` only goes from -128 to 127.
      The `byte` is widened with its sign, so the test is never true.

  - type: predict
    prompt: How many times does this print `Joy!`?
    code: |
      for (byte b = Byte.MIN_VALUE; b < Byte.MAX_VALUE; b++) {
        if (b == 0x90) System.out.print("Joy!");
      }
    language: java
    options:
      - text: Never
        correct: true
      - text: Once
        feedback: "`0x90` is the `int` 144. No `byte` equals 144; the `byte` with those bits is -112."
      - text: It doesn't compile
        feedback: Comparing a `byte` with an `int` is legal; the `byte` is widened.
    explanation: "Compare like with like: `b == (byte) 0x90`."
    details: |
      `0x90` is the `int` 144. Comparing it with a `byte` promotes the `byte` to `int` with sign extension.
      A `byte` ranges from -128 to 127, so no `byte` ever equals 144; the byte with bits `0x90` is -112.
      The comparison is always false, and the loop prints nothing.

  - type: explanation
    title: i <= MAX_VALUE is always true
    body: |
      Every `int` is less than or equal to `Integer.MAX_VALUE`.
      When `i` reaches it, `i++` wraps to `MIN_VALUE`.
      So a loop up to and including `MAX_VALUE` never ends.

  - type: predict
    prompt: What does this do?
    code: |
      int count = 0;
      for (int i = Integer.MAX_VALUE - 100; i <= Integer.MAX_VALUE; i++) count++;
      System.out.println(count);
    language: java
    options:
      - text: Loops forever
        correct: true
      - text: "Prints `101`"
        feedback: "`i <= Integer.MAX_VALUE` can never be false."
    explanation: Use a `long` loop variable, or test with `<` and handle the last value separately.
    details: |
      `i <= Integer.MAX_VALUE` is true for every `int`.
      When `i` reaches `MAX_VALUE` and the body runs, `i++` overflows to `Integer.MIN_VALUE`, which is still less than `MAX_VALUE`, so the loop continues forever.
      Use a `long` loop variable, or test `i < MAX_VALUE` and handle the last value after the loop.

  - type: explanation
    title: Shift distances are masked
    body: |
      For an `int`, only the low five bits of the shift distance count.
      So `x << 32` is `x << 0`.
      A loop waiting for `-1 << i` to reach zero never ends.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println(-1 << 32);
    language: java
    options:
      - text: "-1"
        correct: true
      - text: "0"
        feedback: An `int` shift uses `32 & 31`, which is 0 — so nothing moves.
    explanation: "For a `long`, the low six bits count, so `1L << 64` is `1L` too."
    details: |
      For `int` shifts, Java uses only the low five bits of the shift distance, so the distance is taken modulo 32.
      `-1 << 32` is therefore `-1 << 0`, which is -1.
      That's why a loop that keeps shifting until the value becomes 0 can run forever: at a distance of 32 it starts over.

  - type: blank
    prompt: Compare the `byte` with a `byte` constant.
    template: "if (b == ([[byte]]) 0x90)"
    code: true

  - type: choice
    id: jpz-24
    prompt: |
      What does this print?
    code: |
      public class ByteScan {
          public static void main(String[] args) {
              int hits = 0;
              for (byte b = Byte.MIN_VALUE; b < Byte.MAX_VALUE; b++)
                  if (b == 0xA0)
                      hits++;
              System.out.println("hits = " + hits);
          }
      }
    language: java
    options:
      - text: "`hits = 0` — `0xA0` is the `int` 160, which no `byte` can equal"
        correct: true
      - text: "`hits = 1`"
        feedback: "`b` is promoted to `int` (−128…127) for the comparison; 160 is out of range. Compare with `(byte) 0xA0`."
      - text: "It loops forever"
        feedback: "The loop stops at 127; it just never counts."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 24, A Big Delight in Every Byte in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-26
    prompt: |
      What does this do?
    code: |
      public class Tail {
          static final int END = Integer.MAX_VALUE;
          static final int START = END - 10;

          public static void main(String[] args) {
              int count = 0;
              for (int i = START; i <= END; i++)
                  count++;
              System.out.println(count);
          }
      }
    language: java
    options:
      - text: "It never ends: every `int` is `<= Integer.MAX_VALUE`, and `i++` wraps to `MIN_VALUE`"
        correct: true
      - text: "Prints `11`"
        feedback: "That needs `i` to exceed `END`, which an `int` can't."
      - text: "Prints `10`"
        feedback: "It never prints anything."
    explanation: |
      Use a `long` loop variable, or loop with `i < END` and handle the last value separately.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 26, In the Loop in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-27
    prompt: |
      What does this do?
    code: |
      public class Shifts {
          public static void main(String[] args) {
              int shifts = 0;
              while ((-1 << shifts) != 0)
                  shifts++;
              System.out.println(shifts);
          }
      }
    language: java
    options:
      - text: "It never ends: an `int` shift distance is taken mod 32, so `-1 << 32` is `-1`"
        correct: true
      - text: "Prints `32`"
        feedback: "That would need `-1 << 32` to be 0; the distance 32 becomes 0."
      - text: "Prints `31`"
        feedback: "`-1 << 31` is `Integer.MIN_VALUE`, still not 0."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 27, Shifty i's in *Java Puzzlers* (Bloch & Gafter).
