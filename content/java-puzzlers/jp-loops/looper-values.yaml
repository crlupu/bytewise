title: Values that break loops
summary: "`i == i + 1`, `i != i` and `i == -i` can all be true. Which values make them so?"
duration: 6
tags: [java, puzzlers, loops, nan, infinity, boxing, min value]
sources:
  - { book: java-puzzlers, ref: "Puzzles 28–33, Looper and friends" }
  - { book: java-puzzlers, ref: "Puzzle 28, Looper" }
  - { book: java-puzzlers, ref: "Puzzle 29, Bride of Looper" }
  - { book: java-puzzlers, ref: "Puzzle 30, Son of Looper" }
  - { book: java-puzzlers, ref: "Puzzle 31, Ghost of Looper" }
  - { book: java-puzzlers, ref: "Puzzle 32, Curse of Looper" }
  - { book: java-puzzlers, ref: "Puzzle 33, Looper Meets the Wolfman" }
steps:
  - type: explanation
    title: Floating point has odd values
    body: |
      Infinity plus one is still infinity.
      Huge doubles are spaced wider than 1, so adding 1 changes nothing.
      `NaN` is not equal to anything, not even itself.

  - type: match
    prompt: Match each loop condition with a declaration of `i` that makes it loop forever.
    pairs:
      - left: "`while (i == i + 1)`"
        right: "`double i = Double.POSITIVE_INFINITY;`"
      - left: "`while (i != i)`"
        right: "`double i = Double.NaN;`"
      - left: "`while (i != i + 0)`"
        right: "`String i = \"\";`"
    explanation: "For the last one, `i + 0` is string concatenation: `\"\" + 0` is `\"0\"`."

  - type: predict
    prompt: What does this print?
    code: |
      double big = 1e16;
      System.out.println(big == big + 1);
    language: java
    options:
      - text: "true"
        correct: true
      - text: "false"
        feedback: At 10^16, neighbouring doubles are 2 apart. `big + 1` rounds back to `big`.
    details: |
      A `double` has 53 bits of precision. Around 10^16, that's not enough to represent every integer: adjacent doubles are 2 apart.
      `big + 1` lies exactly halfway between two representable values, and rounds to `big` itself.
      So `big == big + 1` is true, and a loop like `while (i != i + 1)` would end immediately for such values — or never, if the condition is flipped.

  - type: explanation
    title: Two's complement isn't symmetric
    body: |
      There's one more negative `int` than positive.
      `-Integer.MIN_VALUE` overflows back to `MIN_VALUE`.
      So `Math.abs(Integer.MIN_VALUE)` is negative.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println(Math.abs(Integer.MIN_VALUE));
    language: java
    options:
      - text: "-2147483648"
        correct: true
      - text: "2147483648"
        feedback: That doesn't fit in an `int`.
      - text: It throws
        feedback: "`Math.abs` doesn't check; `Math.absExact` (Java 15+) does."

  - type: explanation
    title: Boxed values compare identity
    body: |
      `<=` and `>=` unbox and compare values.
      `==` and `!=` on two `Integer`s compare references.
      So `i <= j && j <= i && i != j` can be true.

  - type: predict
    prompt: What does this print?
    code: |
      Integer a = 127, b = 127, c = 128, d = 128;
      System.out.println((a == b) + " " + (c == d));
    language: java
    options:
      - text: "true false"
        correct: true
      - text: "true true"
        feedback: Only values from -128 to 127 are cached. 128 is boxed into two different objects.
      - text: "false false"
        feedback: Small values come from the cache, so `a` and `b` are the same object.
    explanation: Compare boxed numbers with `equals`, or unbox them first.

  - type: choice
    id: jpz-28
    prompt: |
      Can `x == x + 1` ever be true? What does this print?
    code: |
      public class Looper1 {
          public static void main(String[] args) {
              double x = 1e17;
              System.out.println(x == x + 1);
          }
      }
    language: java
    options:
      - text: "`true` — at 10¹⁷, adjacent `double` values are 16 apart, so adding 1 rounds back to `x`"
        correct: true
      - text: "`false` — `x + 1` is always bigger"
        feedback: "Floating-point numbers have gaps; 1 is smaller than half the gap here."
    explanation: |
      `Double.POSITIVE_INFINITY` works too: infinity plus one is infinity.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 28, Looper in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-29
    prompt: |
      What does this print?
    code: |
      public class Looper2 {
          public static void main(String[] args) {
              double x = 0.0 / 0.0;
              System.out.println(x != x);
              System.out.println(x == Double.NaN);
              System.out.println(Double.isNaN(x));
          }
      }
    language: java
    options:
      - text: "true\nfalse\ntrue"
        correct: true
      - text: "false\ntrue\ntrue"
        feedback: "NaN isn't equal to anything, itself included."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 29, Bride of Looper in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-30
    prompt: |
      What does this print?
    code: |
      public class Looper3 {
          public static void main(String[] args) {
              String x = "7";
              System.out.println(x != x + 0);
              System.out.println(x + 0);
          }
      }
    language: java
    options:
      - text: "true\n70"
        correct: true
      - text: "false\n7"
        feedback: "With a `String`, `+ 0` concatenates: `\"70\"` is a new string."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 30, Son of Looper in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-31
    prompt: |
      What does this do?
    code: |
      public class Looper4 {
          public static void main(String[] args) {
              short x = -1;
              int steps = 0;
              while (x != 0) {
                  x >>>= 1;
                  steps++;
              }
              System.out.println(steps);
          }
      }
    language: java
    options:
      - text: "It never ends: `x` is widened to `int`, shifted, then cast back to `short` — which gives `-1` again"
        correct: true
      - text: "Prints `16`"
        feedback: "That's what you'd get with a 16-bit unsigned shift, but the shift happens on 32 bits and the cast keeps the low 16 bits, all ones."
      - text: "Prints `32`"
        feedback: "The cast back to `short` undoes each shift."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 31, Ghost of Looper in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-32
    prompt: |
      What does this print?
    code: |
      public class Looper5 {
          public static void main(String[] args) {
              Integer a = Integer.valueOf(1000);
              Integer b = Integer.valueOf(1000);
              System.out.println(a <= b && b <= a);
              System.out.println(a == b);
          }
      }
    language: java
    options:
      - text: "true\nfalse"
        correct: true
      - text: "true\ntrue"
        feedback: "`<=` unboxes, but `==` on two `Integer`s compares references. 1000 is outside the cache (−128…127)."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 32, Curse of Looper in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-33
    prompt: |
      What does this print?
    code: |
      public class Looper6 {
          public static void main(String[] args) {
              int x = Integer.MIN_VALUE;
              System.out.println(x != 0 && x == -x);
              System.out.println(Math.abs(x));
          }
      }
    language: java
    options:
      - text: "true\n-2147483648"
        correct: true
      - text: "false\n2147483648"
        feedback: "`-Integer.MIN_VALUE` overflows back to `MIN_VALUE`, and `Math.abs` can't return 2147483648 as an `int`."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 33, Looper Meets the Wolfman in *Java Puzzlers* (Bloch & Gafter).
