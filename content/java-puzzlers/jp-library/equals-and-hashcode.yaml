title: equals needs hashCode, and the right signature
summary: Override `equals` without `hashCode` and hash sets can't find your objects; overload it by mistake and nothing calls it.
duration: 5
tags: [java, puzzlers, equals, hashcode, hashset, overriding]
sources:
  - { book: java-puzzlers, ref: "Puzzle 57, What's in a Name?" }
  - { book: java-puzzlers, ref: "Puzzle 58, Making a Hash of It" }
  - { book: effective-java, ref: "Items 10–11" }
  - { book: java-puzzlers, ref: "Puzzle 62, The Name Game" }
  - { book: java-puzzlers, ref: "Puzzle 63, More of the Same" }
steps:
  - type: explanation
    title: Hash collections look at hashCode first
    body: |
      A `HashSet` uses `hashCode` to pick a bucket.
      It only calls `equals` on objects in that bucket.
      Equal objects with different hash codes are never compared.

  - type: predict
    prompt: "`Name` overrides `equals` to compare first and last names, but not `hashCode`. What does this print?"
    code: |
      Set<Name> s = new HashSet<>();
      s.add(new Name("Mickey", "Mouse"));
      System.out.println(s.contains(new Name("Mickey", "Mouse")));
    language: java
    options:
      - text: "`false` (almost always)"
        correct: true
      - text: "`true`"
        feedback: The two objects have identity hash codes, which almost never match, so they land in different buckets.
    explanation: Whenever you override `equals`, override `hashCode` so equal objects have equal hash codes.
    details: |
      `HashSet.contains` computes the hash code of the argument to choose a bucket, then compares with `equals` inside that bucket.
      Without an override, `hashCode` comes from `Object` and is based on identity, so two equal names almost certainly hash differently.
      The lookup checks the wrong bucket and never calls your `equals`. Equal objects must have equal hash codes.

  - type: explanation
    title: equals takes an Object
    body: |
      `equals(Name n)` doesn't override `equals(Object o)`.
      It overloads it.
      Collections call `equals(Object)`, which still compares identity.

  - type: predict
    prompt: "This time `Name` has a correct `hashCode`, but declares `public boolean equals(Name n)`. What does this print?"
    code: |
      Set<Name> s = new HashSet<>();
      s.add(new Name("Donald", "Duck"));
      System.out.println(s.contains(new Name("Donald", "Duck")));
    language: java
    options:
      - text: "`false`"
        correct: true
      - text: "`true`"
        feedback: "`HashSet` calls `equals(Object)`, which this class doesn't override."
    explanation: Put `@Override` on every overriding method. Here it would turn the bug into a compile error.
    details: |
      `equals(Name n)` takes a `Name`, so it overloads `Object.equals(Object)` instead of overriding it.
      `HashSet` calls `equals(Object)`, which is still `Object`'s identity test, so two distinct `Name` objects are never equal even though the hash codes match.
      `@Override` on the method would have turned this into a compile error.

  - type: blank
    prompt: Make the compiler check that you're overriding.
    template: "[[@Override]] public boolean equals(Object o) { ... }"
    code: true
    caseSensitive: true

  - type: choice
    prompt: Since Java 16, what's the easiest way to get correct `equals` and `hashCode` for a value class like `Name`?
    options:
      - text: Declare it as a `record`
        correct: true
      - text: Extend `HashSet`
        feedback: That would make it a set, not a name.

  - type: predict
    id: jpz-57
    prompt: |
      What does this print?
    code: |
      import java.util.HashSet;
      import java.util.Set;

      public class Points {
          final int x, y;
          Points(int x, int y) { this.x = x; this.y = y; }

          @Override
          public boolean equals(Object o) {
              return o instanceof Points p && p.x == x && p.y == y;
          }

          public static void main(String[] args) {
              Set<Points> set = new HashSet<>();
              set.add(new Points(1, 2));
              System.out.println(set.contains(new Points(1, 2)));
          }
      }
    language: java
    options:
      - text: "false"
        correct: true
      - text: "true"
        feedback: "Without `hashCode`, equal objects almost always land in different buckets, so `contains` never calls `equals`."
    explanation: |
      Override `hashCode` whenever you override `equals` — or use a `record`.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 57, What's in a Name? in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-58
    prompt: |
      What does this print?
    code: |
      import java.util.HashSet;
      import java.util.Set;

      public class Tag {
          final String name;
          Tag(String name) { this.name = name; }

          public boolean equals(Tag other) {
              return name.equals(other.name);
          }

          @Override
          public int hashCode() { return name.hashCode(); }

          public static void main(String[] args) {
              Set<Tag> tags = new HashSet<>();
              tags.add(new Tag("java"));
              System.out.println(tags.contains(new Tag("java")));
          }
      }
    language: java
    options:
      - text: "false"
        correct: true
      - text: "true"
        feedback: "`equals(Tag)` overloads `equals(Object)`; `HashSet` calls the `Object` version, which compares identity."
    explanation: |
      Use `@Override` on `equals`: it would have caught this.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 58, Making a Hash of It in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-62
    prompt: |
      What does this print?
    code: |
      import java.util.IdentityHashMap;
      import java.util.Map;

      public class Identity {
          public static void main(String[] args) {
              Map<String, Integer> m = new IdentityHashMap<>();
              m.put("key", 1);
              m.put("key", 2);
              m.put(new String("key"), 3);
              System.out.println(m.size());
          }
      }
    language: java
    options:
      - text: "2"
        correct: true
      - text: "3"
        feedback: "String literals are interned: both `\"key\"` literals are the same object."
      - text: "1"
        feedback: "`new String(...)` creates a distinct object, which is a different key in an identity map."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 62, The Name Game in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-63
    prompt: |
      What does this print?
    code: |
      import java.util.HashMap;
      import java.util.Map;

      public class Registry {
          private final Map<String, String> m = new HashMap<>();

          public void Registry() {
              m.put("a", "alpha");
              m.put("b", "beta");
          }

          public static void main(String[] args) {
              System.out.println(new Registry().m.size());
          }
      }
    language: java
    options:
      - text: "0"
        correct: true
      - text: "2"
        feedback: "`void Registry()` is a method, not a constructor, and nothing calls it."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 63, More of the Same in *Java Puzzlers* (Bloch & Gafter).
