title: Constructors and resources that leak
summary: An instance initializer that builds its own class recurses forever, and closing two streams in one finally can leak one.
duration: 5
tags: [java, puzzlers, exceptions, constructors, resources, try with resources]
sources:
  - { book: java-puzzlers, ref: "Puzzle 40, The Reluctant Constructor" }
  - { book: java-puzzlers, ref: "Puzzle 41, Field and Stream" }
steps:
  - type: explanation
    title: Field initializers run in every constructor
    body: |
      Instance field initializers run before the constructor body.
      If one creates another instance of the same class, that one does too.
      The recursion ends in `StackOverflowError`.

  - type: predict
    prompt: What happens on `new Reluctant()`?
    code: |
      class Reluctant {
        private Reluctant internal = new Reluctant();
        public Reluctant() throws Exception {
          throw new Exception("I'm not coming out");
        }
      }
    language: java
    options:
      - text: "`StackOverflowError`"
        correct: true
      - text: "It throws `Exception: I'm not coming out`"
        feedback: The field initializer runs before the constructor body, so the body is never reached.
    details: |
      Instance field initializers run as part of every constructor, before its body.
      So creating a `Reluctant` first creates another `Reluctant` for `internal`, which creates another, and so on, without ever reaching the `throw`.
      The recursion ends with `StackOverflowError`, which is an `Error`, not the `Exception` the constructor declares.

  - type: explanation
    title: One close per try
    body: |
      Closing two streams in one `finally` is fragile.
      If the first `close` throws, the second never runs.
      Try-with-resources closes each one, in reverse order.

  - type: choice
    prompt: What's wrong with this?
    code: |
      } finally {
        if (in != null) in.close();
        if (out != null) out.close();
      }
    language: java
    options:
      - text: If `in.close()` throws, `out` is never closed
        correct: true
      - text: Nothing; `finally` always runs
        feedback: It runs, but it can stop part way through like any other block.

  - type: blank
    prompt: Let Java close both streams.
    template: "[[try]] (InputStream in = open(src); OutputStream out = create(dst)) { in.transferTo(out); }"
    code: true

  - type: order
    prompt: With two resources in try-with-resources, put the events in order.
    items:
      - Open `in`
      - Open `out`
      - Run the block
      - Close `out`
      - Close `in`

  - type: choice
    id: jpz-40
    prompt: |
      What happens?
    code: |
      public class Node {
          private Node next = new Node();

          public Node() throws Exception {
              throw new Exception("never built");
          }

          public static void main(String[] args) {
              try {
                  new Node();
                  System.out.println("Built");
              } catch (Exception e) {
                  System.out.println("Caught: " + e.getMessage());
              }
          }
      }
    language: java
    options:
      - text: "`StackOverflowError`: field initializers run before the constructor body, and each `Node` makes another `Node`"
        correct: true
      - text: "`Caught: never built`"
        feedback: "The constructor body is never reached."
      - text: "It doesn't compile"
        feedback: "It compiles: a field initializer may call a constructor that throws, since the constructor declares it."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 40, The Reluctant Constructor in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-41
    prompt: |
      `close()` on the first resource throws. What happens to the second one?
    code: |
      public class Closing {
          static class Res implements AutoCloseable {
              final String name;
              final boolean fail;
              Res(String name, boolean fail) { this.name = name; this.fail = fail; }
              public void close() {
                  System.out.println("closing " + name);
                  if (fail) throw new IllegalStateException(name + " failed");
              }
          }

          public static void main(String[] args) {
              Res in = null, out = null;
              try {
                  in = new Res("in", true);
                  out = new Res("out", false);
              } finally {
                  if (in != null) in.close();
                  if (out != null) out.close();
              }
          }
      }
    language: java
    options:
      - text: "It's never closed: the exception from `in.close()` leaves the `finally` before `out.close()` runs"
        correct: true
      - text: "It's closed after `in`"
        feedback: "Only `closing in` is printed."
    explanation: |
      Use try-with-resources: it closes every resource, and adds later exceptions as suppressed ones.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 41, Field and Stream in *Java Puzzlers* (Bloch & Gafter).
