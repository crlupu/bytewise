title: A raw type loses all its generics
summary: Use a generic class raw and every generic type in its members is erased — even ones unrelated to the missing type argument.
duration: 4
tags: [java, puzzlers, generics, raw types, erasure]
sources:
  - { book: java-puzzlers, ref: "Puzzle 88, Raw Deal" }
  - { book: effective-java, ref: "Item 26" }
  - { book: java-puzzlers, ref: "Puzzle 89, Generic Drugs" }
  - { book: java-puzzlers, ref: "Puzzle 90, It's Absurd, It's a Pain, It's Superclass!" }
steps:
  - type: explanation
    title: Raw means erased
    body: |
      A raw type is a generic class used without type arguments, like `Pair`.
      All of its members lose their generic types.
      A method returning `List<String>` returns raw `List`.

  - type: predict
    prompt: Does this compile?
    code: |
      class Pair<V> {
        List<String> stringList() { return List.of("a"); }
      }

      Pair p = new Pair<Object>();
      for (String s : p.stringList()) System.out.println(s);
    language: java
    options:
      - text: No — through the raw `Pair`, `stringList()` returns a raw `List` of `Object`
        correct: true
      - text: Yes — `stringList` doesn't use `V`
        feedback: Erasure applies to every member of a raw type, not just those that mention `V`.
    explanation: "Declare `Pair<Object> p` or `Pair<?> p` and it compiles."
    details: |
      When a generic class is used as a raw type, every generic type in its members is erased — not just the ones involving `V`.
      So through a raw `Pair`, `stringList()` returns a raw `List`, whose elements are `Object`.
      The for-each loop then can't assign them to `String`. Declaring `p` as `Pair<?>` or `Pair<Object>` keeps `List<String>`.

  - type: explanation
    title: Raw types exist for old code
    body: |
      Raw types were kept so pre-Java-5 code still compiles.
      They switch off type checking.
      Use `<?>` when you don't know or care about the type.

  - type: choice
    prompt: You need a method that accepts any `Set`, whatever its element type. Which signature?
    options:
      - text: "`void f(Set<?> s)`"
        correct: true
      - text: "`void f(Set s)`"
        feedback: That's the raw type — it compiles, but you lose type safety and can insert anything.
      - text: "`void f(Set<Object> s)`"
        feedback: "A `Set<String>` is not a `Set<Object>`, so callers couldn't pass one."

  - type: blank
    prompt: Accept a list of anything without using a raw type.
    template: "static int count(List<[[?]]> items) { return items.size(); }"
    code: true

  - type: choice
    id: jpz-88
    prompt: |
      Does this compile?
    code: |
      import java.util.List;

      public class Raw {
          static class Box<T> {
              List<String> labels() { return List.of("a", "b"); }
          }

          public static void main(String[] args) {
              Box box = new Box<Integer>();
              for (String s : box.labels())
                  System.out.println(s);
          }
      }
    language: java
    options:
      - text: "No: on a raw `Box`, every generic type in its members is erased — `labels()` returns a raw `List` of `Object`"
        correct: true
      - text: "Yes: `labels()` doesn't use `T`"
        feedback: "Raw types erase all generic information in instance members, even unrelated type arguments."
    explanation: |
      Declare `Box<?> box` or `Box<Integer> box`.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 88, Raw Deal in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-89
    prompt: |
      Does this compile?
    code: |
      public class Chain<E> {
          private Node<E> head;

          private class Node<E> {
              E value;
              Node<E> next;
          }

          public void push(E e) {
              Node<E> n = new Node<>();
              n.value = e;
              n.next = head;
              head = n;
          }

          public static void main(String[] args) {
              Chain<String> c = new Chain<>();
              c.push("x");
              System.out.println(c.head.value);
          }
      }
    language: java
    options:
      - text: "Yes, and it prints `x` — but `Node<E>` declares a new `E` that shadows `Chain`'s, which is confusing and easy to get wrong"
        correct: true
      - text: "No: `E` is declared twice"
        feedback: "A nested generic class may declare its own type parameter with the same name; it shadows the outer one."
    explanation: |
      Make `Node` a `static` nested class with its own parameter, or a non-generic inner class that uses the outer `E`.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 89, Generic Drugs in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-90
    prompt: |
      Does this compile?
    code: |
      public class Outer {
          class Inner1 extends Outer { }
          class Inner2 extends Inner1 { }

          public static void main(String[] args) {
              System.out.println("ok");
          }
      }
    language: java
    options:
      - text: "Yes — `Inner2`'s implicit `super()` call uses `Outer.this` as `Inner1`'s enclosing instance; but which instance that is gets confusing fast"
        correct: true
      - text: "No: `Inner1` needs an enclosing instance"
        feedback: "Inside `Outer`, the current `Outer.this` is supplied implicitly."
    explanation: |
      The book's version compiled too, but picked a surprising enclosing instance. Prefer static nested classes.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 90, It's Absurd, It's a Pain, It's Superclass! in *Java Puzzlers* (Bloch & Gafter).
