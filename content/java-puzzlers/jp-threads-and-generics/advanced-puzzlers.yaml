  - type: predict
    id: jpz-95b
    prompt: |
      What does this print?
    code: |
      import java.util.*;

      public class Bread {
          public static void main(String[] args) {
              Integer[] xs = {3, 1, 4, 1, 5, 9, 2, 6};
              Arrays.sort(xs, (a, b) -> a < b ? -1 : (b > a ? 1 : 0));
              System.out.println(Arrays.toString(xs));
          }
      }
    language: java
    options:
      - text: "[1, 1, 2, 3, 4, 5, 6, 9]"
        correct: true
      - text: "[3, 1, 4, 1, 5, 9, 2, 6]"
        feedback: "That's what the book saw on Java 5, whose merge sort only moved elements when `compare` returned a positive number — which this comparator never does. Java 7+'s TimSort only asks whether the result is negative, so it happens to work."
      - text: "It throws `IllegalArgumentException: Comparison method violates its general contract!`"
        feedback: "TimSort only detects broken comparators in some cases, mostly on larger arrays."
    explanation: |
      `b > a` is the same test as `a < b`, so the comparator never returns 1: `compare(5, 3)` is 0 but `compare(3, 5)` is -1, which breaks the contract. Java 21 sorts this array correctly by luck. Use `Integer::compare`.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 95, Just Desserts in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-95c
    prompt: |
      What does this print?
    code: |
      public class Cake {
          public static void main(String[] args) {
              System.out.println(true ? false : true == true ? false : true);
          }
      }
    language: java
    options:
      - text: "false"
        correct: true
      - text: "true"
        feedback: "`?:` is right-associative and `==` binds tighter: it's `true ? false : ((true == true) ? false : true)`, which is `false`."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 95, Just Desserts in *Java Puzzlers* (Bloch & Gafter).
