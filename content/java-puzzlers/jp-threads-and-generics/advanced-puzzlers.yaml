  - { book: java-puzzlers, ref: "Puzzle 86, Poison-Paren Litter" }
  - { book: java-puzzlers, ref: "Puzzle 87, Strained Relations" }
  - { book: java-puzzlers, ref: "Puzzle 91, Serial Killer" }
  - { book: java-puzzlers, ref: "Puzzle 92, Twisted Pair" }
  - { book: java-puzzlers, ref: "Puzzle 93, Class Warfare" }
