steps:
  - type: explanation
    title: "Rules at the edges"
    body: |
      `-2147483648` is a valid literal only without parentheses, because the minus sign and the digits are read together.
      `==` on primitives isn't reflexive for NaN, and mixing `int`, `long` and `float` loses precision, so it isn't transitive either.
      Private members are never inherited: an inner class calling a private method reaches the enclosing instance's copy.

  - type: explanation
    title: "Compilation and randomness"
    body: |
      `static final` constants with constant values are copied into the classes that use them; recompiling only the defining class leaves stale copies.
      A shuffle that swaps each element with any random position is biased; swap with a random position from the part not yet shuffled (Fisher–Yates), or call `Collections.shuffle`.

  - type: choice
    id: jpz-86
    prompt: |
      Which line stops this from compiling?
    code: |
      public class Literals {
          public static void main(String[] args) {
              int a = -2147483648;
              int b = -(2147483648);
              System.out.println(a + b);
          }
      }
    language: java
    options:
      - text: "`int b = -(2147483648);` — 2147483648 is only legal as the operand of a unary minus, and the parentheses separate them"
        correct: true
      - text: "`int a = -2147483648;` — the literal is too large"
        feedback: "`-2147483648` is allowed: it's `Integer.MIN_VALUE`."
      - text: "Neither: it prints `0`"
        feedback: "The parenthesized form doesn't compile."
    explanation: |
      Parentheses around a literal can change whether it compiles. Prefer `Integer.MIN_VALUE`.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 86, Poison-Paren Litter in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-87a
    prompt: |
      Is `==` reflexive? What does this print?
    code: |
      public class Reflexive {
          public static void main(String[] args) {
              double x = Double.NaN;
              System.out.println(x == x);
          }
      }
    language: java
    options:
      - text: "false"
        correct: true
      - text: "true"
        feedback: "NaN is the one value not equal to itself."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 87, Strained Relations in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-87b
    prompt: |
      Is `==` transitive across numeric types? What does this print?
    code: |
      public class Transitive {
          public static void main(String[] args) {
              long x = Long.MAX_VALUE;
              double y = (double) Long.MAX_VALUE;
              long z = Long.MAX_VALUE - 1;
              System.out.println((x == y) + " " + (y == z) + " " + (x == z));
          }
      }
    language: java
    options:
      - text: "true true false"
        correct: true
      - text: "true false false"
        feedback: "Both `x` and `z` convert to the same `double` (2⁶³), so both compare equal to `y`."
    explanation: |
      Mixed-type comparisons widen to `double`, which loses precision for large `long` values.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 87, Strained Relations in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-87c
