title: "Advanced puzzlers"
summary: "Literal limits, == that isn't an equivalence, serialization order, private members in inner classes, inlined constants, biased shuffles and a few last desserts."
duration: 8
tags: [java, puzzlers, constants, serialization, inner classes, shuffle]
sources:
