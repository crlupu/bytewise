  - type: choice
    id: jpz-91
    prompt: |
      `Sub`'s constructor adds the object to its own set. After a serialization round trip, does the set still contain it?
    code: |
      import java.io.*;
      import java.util.*;

      public class SerialCopy {
          static class Base implements Serializable {
              final Set<Base> set = new HashSet<>();
          }
          static final class Sub extends Base {
              private final int id;
              Sub(int id) { this.id = id; set.add(this); }
              @Override public int hashCode() { return id; }
              @Override public boolean equals(Object o) { return o instanceof Sub s && s.id == id; }
          }

          public static void main(String[] args) throws Exception {
              Sub original = new Sub(42);
              ByteArrayOutputStream bytes = new ByteArrayOutputStream();
              new ObjectOutputStream(bytes).writeObject(original);
              Sub copy = (Sub) new ObjectInputStream(
                      new ByteArrayInputStream(bytes.toByteArray())).readObject();
              System.out.println(original.set.contains(original) + " " + copy.set.contains(copy));
          }
      }
    language: java
    options:
      - text: "No — it prints `true false`: `Base`'s set is rebuilt first, hashing `copy` while its `id` is still 0"
        correct: true
      - text: "Yes — `true true`"
        feedback: "Superclass fields deserialize before subclass fields, so the hash was taken too early."
    explanation: |
      Don't let `hashCode` depend on subclass state in a class that serializes a hash set containing itself.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 91, Serial Killer in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-92
    prompt: |
      What does this print?
    code: |
      public class Twisted {
          private final String name;
          Twisted(String name) { this.name = name; }
          private String name() { return name; }

          void spawn() {
              new Twisted("child") {
                  void show() { System.out.println(name()); }
              }.show();
          }

          public static void main(String[] args) {
              new Twisted("parent").spawn();
          }
      }
    language: java
    options:
      - text: "parent"
        correct: true
      - text: "child"
        feedback: "Private methods aren't inherited, so the anonymous subclass has no `name()` of its own: the call goes to the enclosing instance."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 92, Twisted Pair in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-93
    prompt: |
      Both classes are compiled. Then `Words` is changed to `FIRST = "the"` and `SECOND = null`, and only `Words.java` is recompiled. What does `PrintWords` print?
    code: |
      // Words.java
      public class Words {
          public static final String FIRST = "the";
          public static final String SECOND = "fat";
          public static final String THIRD = "cat";
          private Words() { }
      }

      // PrintWords.java
      public class PrintWords {
          public static void main(String[] args) {
              System.out.println(Words.FIRST + " " + Words.SECOND + " " + Words.THIRD);
          }
      }
    language: java
    options:
      - text: "the fat cat"
        correct: true
      - text: "the null set"
        feedback: "Constant fields are copied into `PrintWords` when it's compiled; recompiling `Words` alone doesn't change those copies."
    explanation: |
      The new `Words` also changed `THIRD` to `"set"`, and that doesn't show either. Only real constants (primitives and strings) are inlined: an API should make values that may change non-constant, e.g. with a static method.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 93, Class Warfare in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-94
    prompt: |
      This shuffles `[0, 1, 2]` a million times and counts how often each ordering appears. Is the shuffle fair?
    code: |
      import java.util.*;

      public class Shuffle {
          static void shuffle(int[] a, Random rnd) {
              for (int i = 0; i < a.length; i++) {
                  int j = rnd.nextInt(a.length);
                  int t = a[i]; a[i] = a[j]; a[j] = t;
              }
          }

          public static void main(String[] args) {
              Random rnd = new Random(7);
              Map<String, Integer> counts = new TreeMap<>();
              for (int n = 0; n < 1_000_000; n++) {
                  int[] a = {0, 1, 2};
                  shuffle(a, rnd);
                  counts.merge(Arrays.toString(a), 1, Integer::sum);
              }
              System.out.println(counts);
          }
      }
    language: java
    options:
      - text: "No: 27 equally likely swap sequences can't spread evenly over 6 orderings, so some appear about 148,000 times and others about 185,000"
        correct: true
      - text: "Yes: each ordering appears about 166,667 times"
        feedback: "27 isn't divisible by 6."
    explanation: |
      Fisher–Yates swaps `a[i]` with a random index in `i..length-1`. Use `Collections.shuffle`.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 94, Lost in the Shuffle in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
