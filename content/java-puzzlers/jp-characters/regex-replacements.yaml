title: replaceAll takes a regex
summary: The first argument of `replaceAll` is a regular expression, and the replacement has its own escape rules.
duration: 5
tags: [java, puzzlers, regex, strings, replaceAll]
sources:
  - { book: java-puzzlers, ref: "Puzzle 20, What's My Class?" }
  - { book: java-puzzlers, ref: "Puzzle 21, What's My Class, Take 2" }
steps:
  - type: explanation
    title: The dot matches anything
    body: |
      `replaceAll(regex, replacement)` reads its first argument as a pattern.
      In a regex, `.` matches any character.
      So `replaceAll(".", "/")` replaces every character.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println("com.javapuzzlers.Me".replaceAll(".", "/"));
    language: java
    options:
      - text: "`///////////////////` — one slash per character"
        correct: true
      - text: "`com/javapuzzlers/Me`"
        feedback: "That's what `replace(\".\", \"/\")` would do — it replaces plain text."
      - text: It throws `PatternSyntaxException`
        feedback: "`.` is a valid regex; it just means \"any character\"."
    details: |
      `replaceAll` treats its first argument as a regular expression, and in regex `.` matches any character.
      So every one of the 19 characters in "com.javapuzzlers.Me" is replaced by a slash.
      To match a literal dot, escape it as `"\\."`, quote it with `Pattern.quote(".")`, or use `replace`, which works on plain text.

  - type: choice
    prompt: Which calls turn `com.javapuzzlers.Me` into `com/javapuzzlers/Me`?
    options:
      - text: "`s.replace(\".\", \"/\")`"
        correct: true
      - text: "`s.replaceAll(\"\\\\.\", \"/\")`"
        correct: true
      - text: "`s.replaceAll(Pattern.quote(\".\"), \"/\")`"
        correct: true
      - text: "`s.replaceAll(\".\", \"/\")`"
        feedback: An unescaped dot matches every character.

  - type: explanation
    title: The replacement is special too
    body: |
      In the replacement, `\` and `$` have meaning.
      `$1` inserts a group; a lone `\` escapes the next character.
      `Matcher.quoteReplacement` makes any string literal.

  - type: choice
    prompt: "`s.replaceAll(\"\\\\.\", File.separator)` works on Linux. What happens on Windows, where the separator is `\\`?"
    options:
      - text: It throws, because a lone backslash in a replacement escapes nothing
        correct: true
      - text: It works the same
        feedback: The replacement string is not plain text.
    explanation: "Use `Matcher.quoteReplacement(File.separator)`, or simply `s.replace('.', File.separatorChar)`."
    details: |
      In a replacement string, a backslash escapes the next character and `$` refers to a captured group.
      On Windows, `File.separator` is a single backslash with nothing after it to escape, so `replaceAll` throws `IllegalArgumentException`.
      `Matcher.quoteReplacement(File.separator)` escapes it properly; `s.replace('.', File.separatorChar)` avoids regex entirely.

  - type: match
    prompt: Match each method with how it reads its first argument.
    pairs:
      - left: "`replace`"
        right: Plain text
      - left: "`replaceAll`"
        right: A regular expression
      - left: "`split`"
        right: A regular expression, too

  - type: predict
    id: jpz-20
    prompt: |
      What does this print?
    code: |
      // app/model/Order.java
      package app.model;

      public class Order {
          public static void main(String[] args) {
              System.out.println(Order.class.getName().replaceAll(".", "/") + ".class");
          }
      }
    language: java
    options:
      - text: "///////////////.class"
        correct: true
      - text: "app/model/Order.class"
        feedback: "`replaceAll` takes a regex, and `.` matches every character."
    explanation: |
      Use `replace('.', '/')`, which isn't a regex.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 20, What's My Class? in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-21
    prompt: |
      This uses `\\.` to match a literal dot, then replaces it with the platform's file separator. Where does it break?
    code: |
      // app/model/Order.java
      package app.model;

      import java.io.File;

      public class Order {
          public static void main(String[] args) {
              String path = Order.class.getName().replaceAll("\\.", File.separator);
              System.out.println(path + ".class");
          }
      }
    language: java
    options:
      - text: "On Windows: the replacement `\\` is special in `replaceAll`'s replacement string, so it throws. On Linux it prints `app/model/Order.class`"
        correct: true
      - text: "Nowhere — `\\\\.` fixes the bug"
        feedback: "The pattern is fixed, but the replacement string is interpreted too."
      - text: "Everywhere: it prints slashes for every character"
        feedback: "The dot is escaped now, so only dots match."
    explanation: |
      Wrap replacements in `Matcher.quoteReplacement(...)`, or use `replace` for literal text.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 21, What's My Class, Take 2 in *Java Puzzlers* (Bloch & Gafter).
