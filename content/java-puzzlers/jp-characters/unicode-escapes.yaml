title: Unicode escapes run first
summary: The compiler turns `\u0022` into a quote before it reads your program — even inside strings and comments.
duration: 4
tags: [java, puzzlers, unicode, escapes, compiler]
sources:
  - { book: java-puzzlers, ref: "Puzzle 14, Escape Rout" }
  - { book: java-puzzlers, ref: "Puzzle 16, Line Printer" }
  - { book: java-puzzlers, ref: "Puzzle 15, Hello Whirled" }
  - { book: java-puzzlers, ref: "Puzzle 17, Huh?" }
  - { book: java-puzzlers, ref: "Puzzle 19, Classy Fire" }
steps:
  - type: explanation
    title: Escapes are translated before parsing
    body: |
      `\uXXXX` is replaced by its character before the compiler sees tokens.
      So `\u0022` is a real double quote, not a character in a string.
      It can end a string literal early.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println("a\u0022.length() + \u0022b".length());
    language: java
    options:
      - text: "2"
        correct: true
      - text: "26"
        feedback: "`\\u0022` is a quote, so the code is really `\"a\".length() + \"b\".length()`."
      - text: "16"
        feedback: The escapes aren't characters inside the string; they end and start strings.
    details: |
      The compiler turns `\u0022` into a double quote before it tokenizes the source.
      So the line really reads `"a".length() + "b".length()` — two string literals with code between them — which is 1 + 1 = 2.
      Unicode escapes are processed everywhere, including inside string literals and comments, which is why they should be reserved for characters you can't otherwise write.

  - type: explanation
    title: Even comments aren't safe
    body: |
      `\u000A` is a line break.
      Inside a `//` comment, it ends the comment.
      The rest of the line becomes code.

  - type: choice
    prompt: "What happens to a line comment containing `\\u000A`, like `// see c:\\unix\\u000A files`?"
    options:
      - text: It fails to compile — `\unix` isn't a valid escape, and `\u000A` would end the comment anyway
        correct: true
      - text: Nothing; comments are ignored
        feedback: Unicode escapes are processed before comments are recognized.
    explanation: In source code, use `\n`, `\t` and `\"` escapes, which work inside literals only, and keep `\u` for characters you can't type.

  - type: choice
    prompt: When are Unicode escapes the right tool?
    options:
      - text: For characters that can't be typed or shown in the source file's encoding, like `\u00e9` in an ASCII-only file
        correct: true
      - text: For quotes and line breaks inside string literals
        feedback: Use `\"` and `\n` — those are processed as part of the literal, not before parsing.

  - type: predict
    id: jpz-14
    prompt: |
      What does this print?
    code: |
      public class Escapes {
          public static void main(String[] args) {
              System.out.println("x\u0022.length() + \u0022y".length());
          }
      }
    language: java
    options:
      - text: "2"
        correct: true
      - text: "16"
        feedback: "`\\u0022` is a quote, translated before parsing: the code is `\"x\".length() + \"y\".length()`."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 14, Escape Rout in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-15
    prompt: |
      What happens when you compile this?
    code: |
      public class Paths {
          /**
           * Reads the settings from c:\users\config.
           */
          public static void main(String[] args) {
              System.out.println("Loaded");
          }
      }
    language: java
    options:
      - text: "Compile error: illegal unicode escape — `\\users` in the comment starts with `\\u`"
        correct: true
      - text: "It compiles and prints `Loaded`; comments are ignored"
        feedback: "Unicode escapes are processed before comments are recognised."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 15, Hello Whirled in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-16
    prompt: |
      What happens when you compile this?
    code: |
      public class Separator {
          public static void main(String[] args) {
              char newline = '\u000a';
              System.out.print("a" + newline + "b");
          }
      }
    language: java
    options:
      - text: "Compile error: `\\u000a` becomes a real line break inside the character literal"
        correct: true
      - text: "It prints `a` and `b` on two lines"
        feedback: "That's what `'\\n'` would do."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 16, Line Printer in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-17
    prompt: |
      Every character on the marked line is written as a Unicode escape. What does this print?
    code: |
      public class Hidden {
          public static void main(String[] args) {
              // the next line is all escapes:
              \u0053\u0079\u0073\u0074\u0065\u006d\u002e\u006f\u0075\u0074\u002e\u0070\u0072\u0069\u006e\u0074\u006c\u006e\u0028\u0022\u0048\u0069\u0021\u0022\u0029\u003b
          }
      }
    language: java
    options:
      - text: "Hi!"
        correct: true
      - text: "Nothing — it doesn't compile"
        feedback: "Escapes are legal anywhere in the source, so the line is an ordinary statement."
    explanation: |
      Never write code like this: escapes are for characters you can't otherwise type.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 17, Huh? in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-19
    prompt: |
      Someone comments out the regex line with `/* … */`. What happens?
    code: |
      public class Pattern1 {
          public static void main(String[] args) {
              /*
              String pattern = "[a-z]*/";
              */
              System.out.println("done");
          }
      }
    language: java
    options:
      - text: "Compile error: the `*/` inside the string literal ends the comment early"
        correct: true
      - text: "It prints `done`"
        feedback: "Block comments don't know about string literals."
    explanation: |
      Comment out code with `//` on each line, or delete it.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 19, Classy Fire in *Java Puzzlers* (Bloch & Gafter).
