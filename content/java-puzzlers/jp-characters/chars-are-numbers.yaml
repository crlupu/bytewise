title: A char is a number
summary: "`'H' + 'a'` is 169, and string concatenation only starts once a `String` is involved."
duration: 5
tags: [java, puzzlers, char, strings, concatenation, precedence]
sources:
  - { book: java-puzzlers, ref: "Puzzle 11, The Last Laugh" }
  - { book: java-puzzlers, ref: "Puzzle 12, ABC" }
  - { book: java-puzzlers, ref: "Puzzle 13, Animal Farm" }
steps:
  - type: explanation
    title: + on chars adds
    body: |
      A `char` is an unsigned 16-bit number.
      `+` between two chars adds their codes.
      Only a `String` operand turns `+` into concatenation.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.print("H" + "a");
      System.out.print('H' + 'a');
    language: java
    options:
      - text: "Ha169"
        correct: true
      - text: "HaHa"
        feedback: "The second line has no `String` in it: 'H' (72) + 'a' (97) is 169."
      - text: "169169"
        feedback: "The first line uses double quotes — those are strings."
    explanation: "Start with an empty string to force concatenation: `\"\" + 'H' + 'a'`."

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println("" + 1 + 2);
      System.out.println(1 + 2 + "");
    language: java
    options:
      - text: "12, then 3"
        correct: true
      - text: "3, then 3"
        feedback: "`+` is evaluated left to right. In the first line, `\"\" + 1` is already a string."
      - text: "12, then 12"
        feedback: "In the second line, `1 + 2` happens first, while both are still `int`s."

  - type: explanation
    title: char[] isn't a string
    body: |
      `println(char[])` has its own overload, so it prints the characters.
      But `"…" + array` calls the array's `toString`.
      That gives something like `[C@1b6d3586`.

  - type: choice
    prompt: "`char[] numbers = {'1', '2', '3'};` What does `System.out.println(\"easy as \" + numbers);` print?"
    options:
      - text: "`easy as ` followed by something like `[C@1b6d3586`"
        correct: true
      - text: "`easy as 123`"
        feedback: "Only `println(char[])` prints the characters. Concatenation uses `Object.toString`."
    explanation: Use `String.valueOf(numbers)` to turn a `char[]` into its text.

  - type: explanation
    title: + binds tighter than ==
    body: |
      `"a: " + x == y` compares two strings.
      The concatenation happens first, then `==`.
      Parenthesize, and compare strings with `equals`.

  - type: predict
    prompt: What does this print?
    code: |
      final String pig = "length: 10";
      final String dog = "length: " + pig.length();
      System.out.println("Animals are equal: " + pig == dog);
    language: java
    options:
      - text: "false"
        correct: true
      - text: "Animals are equal: true"
        feedback: "`+` runs before `==`, so the whole expression is a boolean: `(\"Animals are equal: \" + pig) == dog`."
      - text: "Animals are equal: false"
        feedback: The prefix is part of the comparison, so it never gets printed.
