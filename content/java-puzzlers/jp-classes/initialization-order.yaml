title: Initialization order traps
summary: Static fields initialize in order, so an instance can see a constant before it's set; constructors that call overridable methods see unset fields.
duration: 6
tags: [java, puzzlers, initialization, static, constructors, overriding]
sources:
  - { book: java-puzzlers, ref: "Puzzle 49, Larger Than Life" }
  - { book: java-puzzlers, ref: "Puzzle 51, What's the Point?" }
  - { book: java-puzzlers, ref: "Puzzle 52, Sum Fun" }
  - { book: java-puzzlers, ref: "Puzzle 53, Do Your Thing" }
steps:
  - type: explanation
    title: Static initializers run top to bottom
    body: |
      Static fields are set in the order they're written.
      Before that, every field holds its default: 0, false or null.
      Creating an instance early lets its constructor see those defaults.

  - type: predict
    prompt: In 2026, what does `Elvis.INSTANCE.beltSize()` return?
    code: |
      class Elvis {
        public static final Elvis INSTANCE = new Elvis();
        private static final int CURRENT_YEAR =
            Calendar.getInstance().get(Calendar.YEAR);
        private final int beltSize;
        private Elvis() { beltSize = CURRENT_YEAR - 1930; }
        public int beltSize() { return beltSize; }
      }
    language: java
    options:
      - text: "`-1930`"
        correct: true
      - text: "`96`"
        feedback: "`INSTANCE` is created first, while `CURRENT_YEAR` is still 0."
    explanation: Declare `INSTANCE` after the fields its constructor uses — or avoid constructors that depend on other static state.
    details: |
      Static fields are initialized in the order they appear. `INSTANCE` comes first, so its constructor runs while `CURRENT_YEAR` still holds its default, 0.
      The constructor computes `0 - 1930` and stores `-1930` in the final field `beltSize`; setting `CURRENT_YEAR` afterwards doesn't change it.
      If `CURRENT_YEAR` were a compile-time constant like `2026`, it would be inlined and the bug wouldn't appear — which makes it even more surprising when it does.

  - type: choice
    prompt: |
      Why isn't `CURRENT_YEAR` a compile-time constant here, set before anything runs?
    code: |
      class Elvis {
        public static final Elvis INSTANCE = new Elvis();
        private static final int CURRENT_YEAR =
            Calendar.getInstance().get(Calendar.YEAR);
        private final int beltSize;
        private Elvis() { beltSize = CURRENT_YEAR - 1930; }
      }
    language: java
    options:
      - text: Its value comes from a method call, so it's computed when the class initializes
        correct: true
      - text: Because it's private
        feedback: "Access doesn't matter. `static final int X = 42;` would be a constant and already set."

  - type: explanation
    title: Constructors calling overridable methods
    body: |
      The superclass constructor runs before the subclass's fields are set.
      If it calls a method the subclass overrides, that method sees null and 0.
      Never call overridable methods from a constructor.

  - type: predict
    prompt: What does `new ColorPoint("red")` print?
    code: |
      class Point {
        final int x; final String name;
        Point() { x = 1; name = makeName(); }
        String makeName() { return "[" + x + "]"; }
        public String toString() { return name; }
      }
      class ColorPoint extends Point {
        final String color;
        ColorPoint(String color) { super(); this.color = color; }
        @Override String makeName() { return super.makeName() + ":" + color; }
      }
      System.out.println(new ColorPoint("red"));
    language: java
    options:
      - text: "`[1]:null`"
        correct: true
      - text: "`[1]:red`"
        feedback: "`makeName` runs inside `super()`, before `this.color = color`."
    explanation: Compute such values lazily, in `toString`, or make the class or method `final`.
    details: |
      `new ColorPoint("red")` first runs `Point()`, before `ColorPoint`'s constructor body has assigned `color`.
      `Point()` calls `makeName()`, which dispatches to the subclass override, which reads `color` — still `null`.
      The name "[1]:null" is stored in a final field and never recomputed. That's why constructors must not call overridable methods.

  - type: order
    prompt: |
      Put the steps of `new ColorPoint("red")` in order.

      ```java
      class Point {
        final int x; final String name;
        Point() { x = 1; name = makeName(); }
        String makeName() { return "[" + x + "]"; }
      }
      class ColorPoint extends Point {
        final String color;
        ColorPoint(String color) { super(); this.color = color; }
        @Override String makeName() { return super.makeName() + ":" + color; }
      }
      ```
    items:
      - Fields hold their defaults (`color` is null)
      - "`Point()` runs and calls `makeName()`"
      - "`ColorPoint.makeName()` reads `color`"
      - "`this.color = \"red\"` runs"

  - type: predict
    id: jpz-49
    prompt: |
      What does this print?
    code: |
      public class Tariff {
          public static final Tariff INSTANCE = new Tariff();
          private final int price;
          private static final int BASE = Integer.parseInt("100");

          private Tariff() {
              price = BASE + 20;
          }

          public static void main(String[] args) {
              System.out.println("Price: " + INSTANCE.price);
          }
      }
    language: java
    options:
      - text: "Price: 20"
        correct: true
      - text: "Price: 120"
        feedback: "Static fields initialize in order: `INSTANCE` is built while `BASE` is still 0."
    explanation: |
      `BASE` isn't a compile-time constant (it calls a method), so it still holds 0 when the constructor runs. Declare `INSTANCE` last.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 49, Larger Than Life in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-51
    prompt: |
      What does this print?
    code: |
      public class Labels {
          static class Shape {
              final String label;
              Shape() { label = describe(); }
              String describe() { return "shape"; }
          }
          static class Circle extends Shape {
              final String color;
              Circle(String color) { super(); this.color = color; }
              @Override String describe() { return color + " circle"; }
          }

          public static void main(String[] args) {
              System.out.println(new Circle("red").label);
          }
      }
    language: java
    options:
      - text: "null circle"
        correct: true
      - text: "red circle"
        feedback: "`Shape`'s constructor calls the override before `Circle`'s constructor has set `color`."
      - text: "shape"
        feedback: "The call is virtual even inside a constructor, so `Circle.describe` runs."
    explanation: |
      Never call overridable methods from a constructor.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 51, What's the Point? in *Java Puzzlers* (Bloch & Gafter).

  - type: predict
    id: jpz-52
    prompt: |
      Two classes read each other's static fields while initializing. What does this print?
    code: |
      public class Cycle {
          static class A {
              static final int VALUE = B.VALUE + 1;
          }
          static class B {
              static final int VALUE = A.VALUE + 10;
          }

          public static void main(String[] args) {
              System.out.println(A.VALUE + " " + B.VALUE);
          }
      }
    language: java
    options:
      - text: "11 10"
        correct: true
      - text: "11 21"
        feedback: "`A` starts first and asks for `B.VALUE`; `B` then reads `A.VALUE` while `A` is still initializing, sees 0, and sets its own value to 10."
      - text: "It doesn't compile: the definitions are circular"
        feedback: "They aren't compile-time constants (each reads another class), so the compiler allows it."
    explanation: |
      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 52, Sum Fun in *Java Puzzlers* (Bloch & Gafter).

  - type: choice
    id: jpz-53
    prompt: |
      `Widget` needs to pass a computed value to its superclass and also keep it. Does this compile on Java 21?
    code: |
      public class Widget extends Base {
          private final int size;

          public Widget() {
              this.size = compute();
              super(size);
          }

          static int compute() { return 42; }

          public static void main(String[] args) {
              System.out.println(new Widget().size);
          }
      }

      class Base {
          Base(int size) { }
      }
    language: java
    options:
      - text: "No: `super(...)` must be the first statement (Java 21 has no statements before it)"
        correct: true
      - text: "Yes, and it prints `42`"
        feedback: "Statements before `super(...)` arrived only as a preview in later releases."
    explanation: |
      The fix is the private constructor capture idiom: `public Widget() { this(compute()); }` and `private Widget(int size) { super(size); this.size = size; }`.

      Original program written for Bytewise, run on Java 21. It sets the same trap as Puzzle 53, Do Your Thing in *Java Puzzlers* (Bloch & Gafter).
