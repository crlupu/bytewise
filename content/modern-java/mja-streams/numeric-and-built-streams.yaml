title: Numeric streams and making streams
summary: "`IntStream` avoids boxing and adds `sum` and ranges; `Stream.of`, `iterate` and `generate` create streams from values or functions."
duration: 5
tags: [java, modern java, streams, intstream, iterate, generate]
sources:
  - { book: modern-java-in-action, ref: "§5.7–5.8, Numeric streams and building streams" }
steps:
  - type: explanation
    title: Primitive streams
    body: |
      `IntStream`, `LongStream` and `DoubleStream` hold primitives.
      They have `sum`, `average` and `max` built in.
      `mapToInt` gets one; `boxed` goes back.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println(IntStream.rangeClosed(1, 5).sum() + " " + IntStream.range(1, 5).count());
    language: java
    options:
      - text: "15 4"
        correct: true
      - text: "15 5"
        feedback: "`range` excludes its end; `rangeClosed` includes it."
      - text: "10 4"
        feedback: "`rangeClosed(1, 5)` includes 5: 1 + 2 + 3 + 4 + 5 = 15."

  - type: blank
    prompt: Total the calories without boxing.
    template: "int total = menu.stream().[[mapToInt]](Dish::calories).sum();"
    code: true

  - type: explanation
    title: Streams from functions
    body: |
      `Stream.iterate(seed, next)` applies a function again and again.
      It's infinite unless you pass a condition or limit it.
      `Stream.generate(supplier)` calls a supplier for each element.

  - type: predict
    prompt: What does this print?
    code: |
      System.out.println(Stream.iterate(1, n -> n < 20, n -> n * 3).toList());
    language: java
    options:
      - text: "`[1, 3, 9]`"
        correct: true
      - text: "`[1, 3, 9, 27]`"
        feedback: 27 fails `n < 20`, so iteration stops before it.
      - text: It runs forever
        feedback: The three-argument `iterate` (Java 9+) takes a stop condition, like a `for` loop.
    details: |
      The three-argument `Stream.iterate(seed, hasNext, next)` works like a `for` loop: start at 1, continue while `n < 20`, step with `n * 3`.
      It produces 1, 3 and 9; the next value, 27, fails the condition, so the stream ends.
      The two-argument version has no condition and is infinite, so it needs a `limit` or a short-circuiting terminal operation.

  - type: choice
    prompt: Which of these never terminates?
    options:
      - text: "`Stream.generate(Math::random).forEach(System.out::println)`"
        correct: true
      - text: "`Stream.generate(Math::random).limit(5).forEach(System.out::println)`"
        feedback: "`limit(5)` makes it finite."
      - text: "`Stream.iterate(0, n -> n + 2).findFirst()`"
        feedback: "`findFirst` only needs one element."
