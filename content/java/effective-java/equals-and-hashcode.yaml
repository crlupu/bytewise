title: equals and hashCode
summary: The contract both methods must keep, and the bugs you get when they don't.
duration: 9
tags: [java, effective java, equals, hashcode, hashmap, hashset, collections]
sources:
  - { book: effective-java, ref: "Items 10 and 11" }
steps:
  - type: explanation
    title: The equals contract
    body: |
      When you override `equals`, collections and every other library will trust it to behave like equality.
      It must be:

      - **reflexive** — `x.equals(x)` is true;
      - **symmetric** — `x.equals(y)` exactly when `y.equals(x)`;
      - **transitive** — if `x.equals(y)` and `y.equals(z)`, then `x.equals(z)`;
      - **consistent** — repeated calls give the same answer while the objects don't change;
      - and `x.equals(null)` is always false.

      Often the right choice is not to override `equals` at all: instance identity is fine for most classes.

  - type: match
    prompt: Match each property to an example of it being broken.
    pairs:
      - left: Symmetry
        right: "`a.equals(b)` is true but `b.equals(a)` is false"
      - left: Transitivity
        right: "`a` equals `b`, `b` equals `c`, but `a` doesn't equal `c`"
      - left: Consistency
        right: The answer changes because `equals` reads a remote resource
      - left: Non-nullity
        right: "`x.equals(null)` throws a `NullPointerException`"

  - type: choice
    prompt: |
      `CaseInsensitiveString.equals` returns true for an ordinary `String` with the same letters in any case.
      What's wrong with that?
    code: |
      CaseInsensitiveString cis = new CaseInsensitiveString("Polish");
      String s = "polish";
      cis.equals(s); // true
      s.equals(cis); // ?
    language: java
    options:
      - text: It breaks symmetry — `String.equals` knows nothing about the new class and returns false
        correct: true
      - text: It breaks reflexivity
        feedback: "`cis.equals(cis)` is still true. The problem appears between two different classes."
      - text: Nothing — it's a sensible convenience
        feedback: Put both in a `List` and `list.contains(s)` could return either answer depending on the implementation.
    explanation: Don't try to make `equals` interoperate with a class you don't control.

  - type: explanation
    title: Override hashCode too
    body: |
      Hash-based collections find an object by its `hashCode` first and only then call `equals`. So the rule is:

      > **Equal objects must have equal hash codes.**

      Override `equals` without `hashCode`, and two equal objects will usually have different (identity-based)
      hash codes — a `HashMap` will look in the wrong bucket and never find your key.

  - type: predict
    prompt: "`Point` overrides `equals` to compare `x` and `y`, but doesn't override `hashCode`. What does this print?"
    code: |
      Map<Point, String> names = new HashMap<>();
      names.put(new Point(1, 2), "home");
      System.out.println(names.get(new Point(1, 2)));
    language: java
    answer: ["null"]
    wrong:
      - answer: "home"
        feedback: The two `Point`s are equal, but their inherited hash codes differ, so `get` searches a different bucket.
    hints:
      - Which method does `HashMap.get` call first?
    explanation: |
      Almost certainly `null`. The second `Point` hashes to a different bucket, so `equals` is never even called.
      (Rarely the identity hashes collide by chance — which makes the bug intermittent, and worse.)

  - type: choice
    prompt: Which `hashCode` implementations are legal for that `Point`?
    options:
      - text: "`return Objects.hash(x, y);`"
        correct: true
      - text: "`return 31 * Integer.hashCode(x) + Integer.hashCode(y);`"
        correct: true
      - text: "`return 42;`"
        correct: true
      - text: "`return System.identityHashCode(this);`"
        feedback: Two equal points would get different values — exactly the bug we just saw.
    explanation: |
      `return 42` is *legal* — equal objects do get equal hashes — but every point lands in one bucket and the map
      degrades to a linked list. Legal and good aren't the same.

  - type: blank
    prompt: Complete the contract.
    template: "If two objects are [[equal]] according to `equals`, they must have the same [[hashCode|hash code]]. The reverse need not hold."
    explanation: Unequal objects *may* share a hash code — that's a collision, and it only costs performance.

  - type: predict
    prompt: |
      A `Person` record-like class uses `name` in both `equals` and `hashCode`, and has a setter for `name`.
      What does this print?
    code: |
      Set<Person> people = new HashSet<>();
      Person p = new Person("Ada");
      people.add(p);
      p.setName("Grace");
      System.out.println(people.contains(p));
    language: java
    options:
      - text: "`true`"
        feedback: "`p` is still in the set — but stored in the bucket for the *old* hash code."
      - text: "`false`"
        correct: true
    explanation: |
      Mutating a field that `hashCode` uses, while the object sits in a hash collection, strands it in the wrong
      bucket. Another argument for immutable value objects — the next lesson.
