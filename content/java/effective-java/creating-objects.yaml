title: Creating objects well
summary: Static factories, builders, and not making objects you don't need.
duration: 8
tags: [java, effective java, static factory, builder, object creation, autoboxing]
sources:
  - { book: effective-java, ref: "Items 1, 2 and 6" }
steps:
  - type: explanation
    title: Constructors have limits
    body: |
      A constructor always has the class's name, always creates a new object, and always returns exactly that class.
      A **static factory method** — an ordinary static method that returns an instance — has none of those limits:

      ```java
      Boolean.valueOf(true);          // returns a shared instance; no allocation
      List.of(1, 2, 3);               // returns some List implementation
      BigInteger.probablePrime(64, rnd); // a name that says what you get
      ```

      Bloch's advice is to *consider* a static factory before reaching for a public constructor.

  - type: choice
    prompt: Which of these can a static factory method do that a constructor can't?
    options:
      - text: Have a descriptive name, like `fromString` or `probablePrime`
        correct: true
      - text: Return an existing, cached instance instead of a new one
        correct: true
      - text: Return an object of a subtype, even a non-public one
        correct: true
      - text: Be called without the class name
        feedback: Both are called through the class — `new Foo()` and `Foo.of()`.
    explanation: |
      Naming, caching and returning subtypes are the three big advantages. The cost: a class with only private
      constructors can't be subclassed, and factories are harder to spot in API docs than constructors — hence
      naming conventions like `of`, `from`, `valueOf` and `getInstance`.

  - type: match
    prompt: Match each conventional factory name to what it signals.
    pairs:
      - left: "`from`"
        right: Converts a single argument of another type
      - left: "`of`"
        right: Aggregates several values into one instance
      - left: "`getInstance`"
        right: Returns an instance that may be shared
      - left: "`newInstance`"
        right: Guarantees a fresh instance on every call

  - type: explanation
    title: Too many constructor parameters
    body: |
      With many optional parameters, constructors become a guessing game:

      ```java
      new NutritionFacts(240, 8, 100, 0, 35, 27); // which number is which?
      ```

      The **builder** pattern names each argument, keeps the finished object immutable, and validates once in `build()`:

      ```java
      NutritionFacts cola = new NutritionFacts.Builder(240, 8)
          .calories(100)
          .sodium(35)
          .carbohydrate(27)
          .build();
      ```

      The alternative — a no-arg constructor plus setters (the *JavaBeans* style) — lets the object exist half-built
      and rules out immutability.

  - type: order
    prompt: Put the steps of using a builder in order.
    items:
      - Call the builder's constructor with the required parameters
      - Call a setter-like method for each optional parameter you want
      - Call `build()`, which checks the values and creates the immutable object
    explanation: Required values up front, optional ones by name, validation in one place.

  - type: choice
    prompt: A class has 2 required and 8 optional parameters. Which is the best fit?
    options:
      - text: A builder
        correct: true
      - text: Telescoping constructors — one for each number of parameters
        feedback: That's eight-plus constructors, and callers still pass long runs of unnamed numbers.
      - text: A public no-arg constructor and setters
        feedback: The object is mutable and can be used before it's fully set up.
    explanation: Builders shine when there are more than a handful of parameters, especially optional ones.

  - type: predict
    prompt: This sums the integers from 0 to `Integer.MAX_VALUE`. Why is it several times slower than it should be?
    code: |
      Long sum = 0L;
      for (long i = 0; i <= Integer.MAX_VALUE; i++) {
          sum += i;
      }
    language: java
    options:
      - text: "`sum` is a `Long`, so every `+=` unboxes it and boxes a new `Long` object"
        correct: true
      - text: The loop variable should be an `int`
        feedback: An `int` would overflow before reaching `Integer.MAX_VALUE + 1` — the `long` is right.
      - text: "`+=` on a `long` is slow in Java"
        feedback: Primitive `long` addition is a single instruction. The problem is the capital L.
    explanation: |
      About 2³¹ unnecessary `Long` objects get created. Prefer primitives to boxed primitives, and watch for
      unintended autoboxing.

  - type: blank
    prompt: Complete the rule of thumb.
    template: "Prefer [[primitives|primitive types]] to boxed primitives, and reuse [[immutable]] objects instead of creating equivalent ones."
    hints:
      - "`long` versus `Long`."
      - Objects that can't change are safe to share.
