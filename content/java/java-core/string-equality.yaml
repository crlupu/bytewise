title: String and Integer equality
summary: Why == sometimes works on strings and boxed numbers — and why you shouldn't rely on it.
duration: 7
tags: [java, strings, equality, interning, autoboxing]
steps:
  - type: explanation
    title: Same object or same value?
    body: |
      `==` asks: are these the same object?
      `equals()` asks: do they hold the same value?

      ```java
      StringBuilder a = new StringBuilder("hi");
      StringBuilder b = new StringBuilder("hi");
      a == b; // false: two separate objects
      ```

      With strings, `==` sometimes looks like it works.
    diagram:
      kind: objects
      vars:
        - { name: a, to: x }
        - { name: b, to: y }
      objects:
        - { id: x, type: StringBuilder, fields: [{ name: value, value: "\"hi\"" }] }
        - { id: y, type: StringBuilder, fields: [{ name: value, value: "\"hi\"" }] }
      caption: "Same value, two objects — so a == b is false."

  - type: predict
    prompt: What does this print?
    code: |
      String a = "hello";
      String b = "hello";
      System.out.println(a == b);
    language: java
    options:
      - text: "`true`"
        correct: true
      - text: "`false`"
        feedback: |
          That would be right for two `new String(...)` objects. But these are **literals**,
          and the JVM keeps only one copy of each literal string.
      - text: It doesn't compile
        feedback: Comparing two references with `==` is always legal; it just might not mean what you expect.
    explanation: |
      String literals are **interned**: the JVM keeps one shared `String` object per distinct literal.
      `a` and `b` both point at it, so `==` is `true`.

  - type: predict
    prompt: And this? Pick both lines of output.
    code: |
      String a = "hello";
      String b = new String("hello");
      System.out.println(a == b);
      System.out.println(a.equals(b));
    language: java
    options:
      - text: "false, then true"
        correct: true
      - text: "true, then true"
        feedback: "`new` always creates a fresh object, so `b` is not the interned literal."
      - text: "false, then false"
        feedback: "`equals()` compares the characters, and they're the same."
      - text: "true, then false"
        feedback: "`==` compares references and `equals` compares characters — it's the other way round."
    hints:
      - What does `new` always do, whatever the class?
    explanation: |
      `new String("hello")` makes a new object with the same characters, so `==` is `false`,
      while `equals()` compares content and is `true`.

  - type: explanation
    title: When the compiler joins strings
    body: |
      Constants joined at compile time become one shared literal.

      ```java
      String s = "hel" + "lo";   // the same object as "hello"
      String part = "hel";
      String t = part + "lo";    // a new object, built at run time
      ```

      `intern()` returns the shared copy.
    diagram:
      kind: objects
      vars:
        - { name: "\"hello\"", to: p }
        - { name: s, to: p }
        - { name: t, to: n }
      objects:
        - { id: p, type: "String (pooled)", fields: [{ name: value, value: "\"hello\"" }] }
        - { id: n, type: String, fields: [{ name: value, value: "\"hello\"" }] }
      caption: "s is the literal itself; t was built at run time."

  - type: predict
    prompt: What does this print?
    code: |
      String part = "hel";
      String a = part + "lo";
      System.out.println(a == "hello");
    language: java
    options:
      - text: "`true`"
        feedback: |
          `part` is an ordinary variable, not a constant, so the concatenation happens at run time and makes a new object.
      - text: "`false`"
        correct: true
    hints:
      - Is `part` a compile-time constant? It isn't declared `final`.
    explanation: |
      `part + "lo"` is evaluated at run time and yields a new `String`. (Declare `part` as
      `final String part = "hel";` and it becomes a constant — then the answer flips to `true`.)
    details: |
      The compiler folds expressions made only of constants into a single literal, so `"hel" + "lo"` becomes `"hello"` at compile time and points to the same interned object.
      A non-final variable isn't a constant, so `part + "lo"` is evaluated at run time with a `StringBuilder` (or `invokedynamic` concatenation), which always produces a new `String`.
      That's why the same text can be `==` in one place and not in another — and why `==` on strings is a bug waiting for the code around it to change.
      Use `equals` for content; reserve `==` for checking whether two references are literally the same object.

  - type: predict
    prompt: Autoboxing has the same trap. What does this print?
    code: |
      Integer x = 127, y = 127;
      Integer p = 128, q = 128;
      System.out.println(x == y);
      System.out.println(p == q);
    language: java
    options:
      - text: "true, then false"
        correct: true
      - text: "true, then true"
        feedback: "Only a limited range of boxed values is shared. 128 is just outside it."
      - text: "false, then false"
        feedback: "Small boxed values *are* shared, so the first comparison sees the same object."
      - text: "false, then true"
        feedback: "127 is inside the Integer cache; 128 isn't."
    hints:
      - "`Integer.valueOf` keeps a cache of commonly used values."
      - The cache covers −128 to 127 by default.
    explanation: |
      Autoboxing calls `Integer.valueOf`, which returns cached objects for −128 to 127.
      127 hits the cache (same object); 128 doesn't (two objects). Compare boxed numbers with `equals()`,
      or unbox them first.
    details: |
      `Integer x = 127` compiles to `Integer.valueOf(127)`, and `valueOf` keeps a cache of `Integer` objects for -128 to 127.
      Both variables get the same cached object, so `==` is true; 128 is outside the cache, so each `valueOf` call creates a new object and `==` compares two different references.
      The cache's upper bound can even be raised with `-XX:AutoBoxCacheMax`, so code relying on `==` may behave differently on another JVM configuration.
      Compare boxed numbers with `equals`, or unbox them to primitives first.

  - type: explanation
    title: Always compare with equals
    body: |
      `Integer` has the same trap: small values are cached, big ones aren't.
      Compare values with `equals` or `Objects.equals`.
      `Objects.equals` also handles `null`.

  - type: choice
    prompt: Which of these safely compare two `String` values by content?
    code: |
      String a = readName();
      String b = expectedName();
    language: java
    options:
      - text: "`a.equals(b)`"
        correct: true
      - text: "`Objects.equals(a, b)`"
        correct: true
      - text: "`a == b`"
        feedback: "`==` compares references. It only *happens* to work when both strings are interned."
      - text: "`a.compareTo(b) == 0`"
        correct: true
    explanation: |
      `equals`, `Objects.equals` and `compareTo(...) == 0` all compare characters.
      Of these, `Objects.equals(a, b)` is the only one that is also safe when `a` is `null`.

  - type: blank
    prompt: Complete the statement.
    template: "`a.equals(b)` throws a [[NullPointerException|NPE]] when `a` is null, while `Objects.equals(a, b)` returns [[false]] when exactly one of them is null."
    hints:
      - Calling any method on a null reference throws the same exception.
    explanation: "`Objects.equals` checks for null first, so it's the safer default for values that may be missing."

  - type: match
    prompt: Match each expression to its result.
    pairs:
      - left: '`"ab" == "a" + "b"`'
        right: "`true` — folded into one literal at compile time"
      - left: '`new String("ab") == "ab"`'
        right: "`false` — `new` always makes a fresh object"
      - left: '`new String("ab").intern() == "ab"`'
        right: "`true` — `intern()` returns the shared copy"
      - left: "`Integer.valueOf(1000) == Integer.valueOf(1000)`"
        right: "`false` — outside the Integer cache"
    explanation: The rule behind all four is the same — `==` asks whether two references point at one object.
