title: Visibility and volatile
summary: Why one thread may never see another's write, and what volatile does — and doesn't — fix.
duration: 8
tags: [java, threads, visibility, volatile, memory model, happens-before, publication]
sources:
  - { book: jcip, ref: "Chapter 3, Sharing Objects" }
steps:
  - type: explanation
    title: Writes aren't automatically seen
    body: |
      Locking does two jobs. You've seen the first — **atomicity**, no interleaving inside a critical section.
      The second is **visibility**: making sure a value one thread wrote is the value another thread reads.

      Without synchronization, the compiler, the JIT and the CPU may keep values in registers or caches, and may
      reorder operations, as long as *the thread doing them* can't tell. Other threads can.

      ```java
      class Worker {
          boolean stopped = false;
          void run()  { while (!stopped) { doWork(); } }
          void stop() { stopped = true; }   // called from another thread
      }
      ```

  - type: choice
    prompt: One thread runs `run()`; later another calls `stop()`. What can happen?
    options:
      - text: The loop may never end — the running thread is allowed never to see the new value
        correct: true
      - text: The loop always stops within one iteration
        feedback: Nothing forces the write out of the other thread's cache, or the read out of a hoisted register.
      - text: It throws a `ConcurrentModificationException`
        feedback: That's a collections error. Plain fields fail silently.
    explanation: |
      The JIT may even hoist the read out of the loop — turning it into `if (!stopped) while (true)` — because
      within that one thread, nothing changes `stopped`.

  - type: explanation
    title: volatile
    body: |
      Declaring the field `volatile` guarantees that every read sees the most recent write by any thread, and stops
      the reordering of other memory operations across it:

      ```java
      volatile boolean stopped = false;
      ```

      Formally, a write to a volatile field **happens-before** every later read of it. Everything the writing thread
      did before the write is visible to the thread that reads it.

  - type: choice
    prompt: Which of these is `volatile` alone enough for?
    options:
      - text: A stop flag one thread sets and others read
        correct: true
      - text: Publishing a reference to a fully built, immutable object
        correct: true
      - text: A counter several threads increment with `count++`
        feedback: Every read is fresh, but the read-add-write is still three steps that can interleave.
      - text: Checking a balance and then withdrawing
        feedback: Check-then-act needs both steps to be atomic together — that needs a lock.
    explanation: |
      Use `volatile` when writes don't depend on the current value and the variable isn't part of an invariant with others.
      Otherwise, lock (or use an atomic class).

  - type: match
    prompt: Match each guarantee to what provides it.
    pairs:
      - left: Visibility only
        right: "`volatile`"
      - left: Visibility and atomicity for one variable
        right: "`AtomicInteger`, `AtomicReference`"
      - left: Visibility and atomicity for several variables
        right: "`synchronized` (one lock guarding them all)"
      - left: Visibility for free, after construction
        right: "`final` fields of a properly constructed object"

  - type: explanation
    title: Safe publication
    body: |
      Handing an object to another thread is **publication**, and it can go wrong too: another thread may see the
      reference but not the values written in the constructor. Ways to publish safely:

      - store it in a `volatile` field or an `AtomicReference`;
      - store it in a field guarded by a lock;
      - put it in a thread-safe collection (`ConcurrentHashMap`, `BlockingQueue`);
      - initialise it from a static initializer;
      - make it immutable — `final` fields are visible once the constructor finishes, however the reference travels.

      And never let `this` escape during construction (for example by starting a thread in the constructor).

  - type: blank
    prompt: Complete the rule.
    template: "Locking guarantees both [[atomicity]] and [[visibility]]; `volatile` guarantees only the second."
    hints:
      - The first is about interleaving; the second is about seeing the latest write.

  - type: choice
    prompt: A thread builds a `Config` with plain (non-final) fields and stores it in a plain static field. Another thread reads it. What's the risk?
    options:
      - text: The reader may see the reference but default values (null, 0) in some fields
        correct: true
      - text: None — assigning a reference is atomic
        feedback: Assigning the reference is atomic; seeing the writes that happened *before* it is not guaranteed.
      - text: The JVM will throw an `IllegalStateException`
    explanation: Make the fields `final`, or publish through a volatile field or a lock.
