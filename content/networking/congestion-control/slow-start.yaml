title: Slow start and congestion avoidance
summary: How a TCP sender probes for bandwidth — exponentially, then carefully.
duration: 8
tags: [networking, tcp, congestion control, cwnd, slow start, ssthresh, congestion avoidance]
sources:
  - { book: kurose-ross, ref: "§3.6–3.7, Congestion Control" }
steps:
  - type: explanation
    title: The sender must guess the speed
    body: |
      Flow control protects the receiver.
      Congestion control protects the network.
      ACKs mean "it got through". Losses mean "too much".
      The congestion window, `cwnd`, limits data in flight.

  - type: explanation
    title: Slow start, then avoidance
    body: |
      Slow start: `cwnd` doubles every round trip.
      At `ssthresh`, switch to congestion avoidance.
      Then grow by just one segment per round trip.

  - type: widget
    widget: congestion
    prompt: |
      `ssthresh` starts at 8. Play rounds where everything is acknowledged — **All ACKed**, or Step forward —
      until the window reaches **12**.
    config:
      variant: reno
      ssthresh: 8
    goal:
      cwndAtLeast: 12
    question:
      prompt: In which round did the window stop doubling?
      options:
        - text: Round 4, when it reached 8 — the threshold
          correct: true
        - text: Round 2
        - text: It never stopped doubling
          feedback: Look at the bars after 8 — 9, 10, 11, 12.
    explanation: 1, 2, 4, 8 — doubling — then 9, 10, 11, 12, one more per round once `cwnd` reached `ssthresh`.

  - type: predict
    prompt: "`cwnd` starts at 1 and `ssthresh` is 64. How many RTTs of slow start until `cwnd` is 32?"
    options:
      - text: "5"
        correct: true
      - text: "6"
        feedback: "Count the doublings — 1→2 is the first RTT."
      - text: "32"
        feedback: "That would be linear growth. Slow start doubles."
      - text: "4"
        feedback: "Four doublings of 1 give 16."
    hints:
      - 1 → 2 → 4 → 8 → 16 → 32.
    explanation: 2⁵ = 32, so five round trips.

  - type: choice
    prompt: Why does TCP switch from doubling to adding one at `ssthresh`?
    options:
      - text: "`ssthresh` marks roughly where congestion happened last time, so the sender approaches it carefully"
        correct: true
      - text: The receiver's buffer is full at that point
        feedback: That's flow control — the receive window — a separate limit.
      - text: Doubling past a threshold would overflow the sequence numbers
    explanation: "`ssthresh` is set from the window at the last loss — the sender's memory of where trouble began."
    details: |
      `ssthresh` is set to half the window at the last loss, an estimate of how much the network could take.
      Below it, doubling quickly reclaims capacity that's probably available. Near it, doubling would overshoot and cause another loss.
      So the sender switches to adding one segment per RTT, cautiously probing for more capacity.

  - type: match
    prompt: Match each term to its meaning.
    pairs:
      - left: cwnd
        right: How many unacknowledged segments the sender allows itself
      - left: ssthresh
        right: The window size where slow start hands over to congestion avoidance
      - left: Slow start
        right: Window doubles every round trip
      - left: Congestion avoidance
        right: Window grows by one segment every round trip

  - type: blank
    prompt: Complete the rule.
    template: "Below ssthresh the window [[doubles]] each RTT; at or above it, the window grows by [[one|1]] segment each RTT."

  - type: choice
    prompt: A sender's effective window is the smaller of `cwnd` and what else?
    options:
      - text: The receive window advertised by the other side
        correct: true
      - text: ssthresh
        feedback: ssthresh only decides how `cwnd` grows; it isn't a cap on sending.
      - text: The MSS
        feedback: The MSS is the size of one segment, the unit the window is counted in.
    explanation: The network's limit (`cwnd`) and the receiver's limit (`rwnd`) both apply; the smaller wins.
