title: Closing a connection
summary: Four segments, half-closes, and why TIME_WAIT hangs around.
duration: 7
tags: [networking, tcp, fin, teardown, time_wait, close_wait]
sources:
  - { book: kurose-ross, ref: "§3.5.6, TCP Connection Management" }
steps:
  - type: explanation
    title: Each direction closes separately
    body: |
      FIN means "I've finished sending".
      Each side sends its own FIN, and ACKs the other's.
      In between, the connection is half-closed.

  - type: widget
    widget: tcp
    prompt: |
      The connection is open. **Close it completely**, client first, until both sides are CLOSED.
    config:
      start: established
      teardown: true
      clientIsn: 1000
      serverIsn: 5000
    goal:
      client: CLOSED
      server: CLOSED
    hints:
      - The client sends FIN first. What must the server do with it?
      - After the server's own FIN is acknowledged, the client still has to wait.
    explanation: |
      FIN → ACK → FIN → ACK, then the client waited out TIME_WAIT. The server closed as soon as its FIN was acknowledged.

  - type: order
    prompt: Put a client-initiated close in order.
    items:
      - The client sends FIN
      - The server acknowledges the client's FIN
      - The server sends its own FIN
      - The client acknowledges the server's FIN
      - The client waits 2×MSL in TIME_WAIT, then closes

  - type: choice
    prompt: The server has acknowledged the client's FIN, but hasn't sent its own. Can the server still send data to the client?
    options:
      - text: Yes — the connection is half-closed, and only the client's direction is finished
        correct: true
      - text: No — once either side sends FIN, the connection is closed
        feedback: FIN closes only the sender's direction. The other stream stays open until its own FIN.
    explanation: That's how a client can send a whole request, close its side, and still read the full response.

  - type: explanation
    title: TIME_WAIT
    body: |
      The side that closed first waits twice the maximum segment lifetime.
      It can resend a lost final ACK.
      Stray old packets die out before the port is reused.

  - type: choice
    prompt: Why does the side that closed first wait in TIME_WAIT?
    options:
      - text: To resend the final ACK if it gets lost
        correct: true
      - text: So delayed segments from this connection die out before the same addresses and ports can be reused
        correct: true
      - text: To give the application time to read the rest of the data
        feedback: All the data has already been delivered by then; TIME_WAIT is about stray segments, not the application.
    explanation: |
      If the last ACK is lost, the other side resends its FIN — someone has to be around to answer.
      And waiting 2×MSL guarantees no old segment can be mistaken for part of a new connection.
    details: |
      If the final ACK is lost, the other side retransmits its FIN; the side in TIME_WAIT is still there to acknowledge it, so both close cleanly.
      And segments from this connection may still be in the network. Waiting twice the maximum segment lifetime ensures they've expired before the same address and port pair can be reused, so they can't be mistaken for part of a new connection.

  - type: match
    prompt: Match each state to its meaning.
    pairs:
      - left: FIN_WAIT_1
        right: Sent FIN, waiting for it to be acknowledged
      - left: FIN_WAIT_2
        right: Our FIN is acknowledged; waiting for the other side's FIN
      - left: CLOSE_WAIT
        right: Received a FIN; our application hasn't closed yet
      - left: LAST_ACK
        right: Sent our FIN after receiving one; waiting for the last ACK
      - left: TIME_WAIT
        right: Everything's acknowledged; waiting 2×MSL before closing

  - type: explanation
    title: Reading socket states
    body: |
      Many `CLOSE_WAIT` sockets: your app forgot to close them. A bug.
      Many `TIME_WAIT` on a busy client: normal.
      Reuse connections if you run out of ports.
