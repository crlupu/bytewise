title: Sorting, searching and shuffling
summary: "`Collections` has the algorithms: sort is stable, binarySearch needs a sorted list, and the result of a miss encodes where the element would go."
duration: 5
tags: [java, collections, sort, binarysearch, algorithms]
sources:
  - { book: java-generics-collections, ref: "§17.1, Generic Algorithms" }
steps:
  - type: explanation
    title: Stable sort
    body: |
      `Collections.sort` and `List.sort` are stable.
      Equal elements keep their relative order.
      So you can sort by one key, then by another.

  - type: choice
    prompt: You sort employees by name, then sort the result by department. What's the order within each department?
    options:
      - text: By name, because the sort is stable
        correct: true
      - text: Unspecified
        feedback: Java's object sorts are guaranteed stable.
    details: |
      A stable sort keeps elements that compare as equal in the order they already had.
      Sorting by name first puts everyone in name order; sorting by department then reorders only between departments, and within a department everyone compares equal, so the name order survives.
      This lets you build multi-key orderings from simple sorts. `Comparator.comparing(dept).thenComparing(name)` does it in one pass.

  - type: explanation
    title: binarySearch needs sorted input
    body: |
      `binarySearch` halves the list each step.
      On an unsorted list the result is meaningless.
      A miss returns `-(insertion point) - 1`.

  - type: predict
    prompt: What does this print?
    code: |
      List<Integer> l = List.of(1, 3, 5, 7);
      System.out.println(Collections.binarySearch(l, 5) + " " + Collections.binarySearch(l, 4));
    language: java
    options:
      - text: "2 -3"
        correct: true
      - text: "2 -1"
        feedback: "4 would go at index 2, so the miss returns -(2) - 1 = -3."
      - text: "3 -1"
        feedback: Indexes start at 0, so 5 is at index 2.
    details: |
      5 is at index 2, so the first search returns 2.
      4 isn't in the list; it would belong at index 2, between 3 and 5. A miss returns `-(insertionPoint) - 1`, which is -3.
      The minus one makes sure a miss is always negative, even when the insertion point is 0. And all of this assumes a sorted list — on an unsorted one, the answer is meaningless.

  - type: match
    prompt: Match each method with what it does.
    pairs:
      - left: "`Collections.shuffle(list)`"
        right: Randomly permutes
      - left: "`Collections.reverse(list)`"
        right: Reverses in place
      - left: "`Collections.frequency(c, x)`"
        right: Counts occurrences of x
      - left: "`Collections.max(c)`"
        right: Finds the largest by natural order
