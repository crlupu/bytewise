title: HashMap, LinkedHashMap and TreeMap
summary: The map counterparts of the three sets — plus LinkedHashMap's access order, which makes an LRU cache in a few lines.
duration: 6
tags: [java, collections, map, hashmap, linkedhashmap, treemap, lru cache]
sources:
  - { book: java-generics-collections, ref: "§16.1–16.3, Map implementations" }
steps:
  - type: explanation
    title: Same orders as the sets
    body: |
      `HashMap` has no order.
      `LinkedHashMap` keeps insertion order.
      `TreeMap` keeps keys sorted, with navigation like `TreeSet`.
    diagram:
      classes:
        - { name: "Map<K, V>", kind: interface }
        - { name: HashMap }
        - { name: LinkedHashMap }
        - { name: "SortedMap<K, V>", kind: interface }
        - { name: "NavigableMap<K, V>", kind: interface }
        - { name: TreeMap }
      relations:
        - { from: HashMap, to: "Map<K, V>", type: implements }
        - { from: LinkedHashMap, to: HashMap, type: extends }
        - { from: "SortedMap<K, V>", to: "Map<K, V>", type: extends }
        - { from: "NavigableMap<K, V>", to: "SortedMap<K, V>", type: extends }
        - { from: TreeMap, to: "NavigableMap<K, V>", type: implements }
      caption: LinkedHashMap is a HashMap that also links its entries in order.

  - type: predict
    prompt: What does this print?
    code: |
      TreeMap<String, Integer> m = new TreeMap<>(Map.of("b", 2, "a", 1, "c", 3));
      System.out.println(m.firstKey() + " " + m.headMap("c"));
    language: java
    options:
      - text: "`a {a=1, b=2}`"
        correct: true
      - text: "`b {b=2, a=1}`"
        feedback: A `TreeMap` sorts its keys, whatever order they came in.

  - type: explanation
    title: Access order makes an LRU cache
    body: |
      `new LinkedHashMap<>(16, 0.75f, true)` orders entries by last access.
      Override `removeEldestEntry` to evict when it's too big.
      That's a least-recently-used cache.

  - type: predict
    prompt: What does this print?
    code: |
      Map<String, Integer> lru = new LinkedHashMap<>(16, 0.75f, true) {
        protected boolean removeEldestEntry(Map.Entry<String, Integer> e) {
          return size() > 2;
        }
      };
      lru.put("a", 1);
      lru.put("b", 2);
      lru.get("a");
      lru.put("c", 3);
      System.out.println(lru.keySet());
    language: java
    options:
      - text: "`[a, c]`"
        correct: true
      - text: "`[b, c]`"
        feedback: "Reading `a` made it the most recently used, so `b` is evicted."
      - text: "`[a, b, c]`"
        feedback: "`removeEldestEntry` keeps the size at 2."
    details: |
      The third constructor argument, `true`, switches the map from insertion order to access order: every `get` moves the entry to the end.
      After `put(a)`, `put(b)` and `get(a)`, the order is b, a. Adding c makes the size 3, so `removeEldestEntry` returns true, and the eldest — the least recently used, b — is removed.
      That leaves [a, c]: a complete least-recently-used cache in a few lines.

  - type: blank
    prompt: Create a map ordered by access instead of insertion.
    template: "new LinkedHashMap<>(16, 0.75f, [[true]])"
    code: true
