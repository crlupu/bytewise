title: How one slow service takes everything down
summary: Integration points, blocked threads and cascading failures — and why slow is worse than down.
duration: 8
tags: [architecture, resilience, stability, cascading failure, integration points, timeouts, thread pools]
sources:
  - { book: release-it, ref: "Chapter 4, Stability Antipatterns" }
steps:
  - type: explanation
    title: Slow is worse than down
    body: |
      Every call to another system is an integration point.
      A dead dependency fails fast.
      A slow one holds your threads while you wait.

  - type: predict
    prompt: |
      Your service handles requests on a pool of **200** threads. A dependency starts hanging — no response, no error —
      and your code has no timeout. **20** requests per second need that dependency. About how many seconds until every
      thread is stuck?
    options:
      - text: "10"
        correct: true
      - text: "200"
        feedback: "Threads are consumed at 20 a second, not one."
      - text: "20"
        feedback: "20 is the arrival rate. How long until 200 threads are used up at that rate?"
      - text: "5"
        feedback: "Twice too fast — 200 threads at 20 a second last 10 seconds."
    hints:
      - Each request holds one thread forever; 20 arrive every second.
    explanation: |
      200 ÷ 20 = 10 seconds. After that, your service can't answer *anything* — even requests that never touch the
      broken dependency. Your callers then start waiting on you.
    details: |
      Each request that calls the hanging dependency holds a thread forever, because without a timeout it never returns.
      At 20 such requests per second, the 200 threads are used up in 200 / 20 = 10 seconds.
      After that, every new request waits for a thread that never frees up — including requests that don't use the broken dependency at all.

  - type: explanation
    title: Failures cascade
    body: |
      Your threads block on the slow dependency.
      Your pool runs out, and you stop answering.
      Then your callers block on you.
      A timeout breaks the chain.

  - type: order
    prompt: Put the steps of a cascading failure in order.
    items:
      - A downstream dependency becomes slow
      - Your threads block waiting on it, without a timeout
      - Your thread pool is exhausted; you stop responding to everything
      - Your callers' threads block waiting on you
      - The failure spreads up through every layer that calls you
    explanation: A **cascading failure** jumps from one layer to the next through blocked threads — the crack spreads up.

  - type: match
    prompt: Match each antipattern to its description.
    pairs:
      - left: Integration point
        right: Any call out to another system — each one a way to fail
      - left: Blocked threads
        right: Threads stuck waiting on a resource that never answers
      - left: Cascading failure
        right: A failure in one layer causing failures in the layers that call it
      - left: Unbounded result set
        right: A query that returns far more rows than expected and exhausts memory

  - type: choice
    prompt: Which single change most directly stops the 10-second exhaustion above?
    options:
      - text: A timeout on the call to the dependency
        correct: true
      - text: A bigger thread pool
        feedback: 400 threads only buys 20 seconds instead of 10. The leak is still there.
      - text: Retrying the call when it fails
        feedback: The call doesn't fail — it hangs. And retries add load to a dependency that's already struggling.
    explanation: |
      A **timeout** turns "wait forever" into "fail after a bounded time", so blocked threads come back. Every integration
      point needs one.

  - type: blank
    prompt: Complete Nygard's warning.
    template: "A [[slow]] response is worse than no response, because it ties up [[resources|threads]] in the caller."

  - type: choice
    prompt: Why don't integration-point failures show up in most test suites?
    options:
      - text: Tests stub dependencies to respond quickly and correctly; production dependencies hang, reset connections and return nonsense
        correct: true
      - text: They only happen with high traffic
        feedback: Traffic makes them worse, but a hung connection blocks a thread at any load.
    explanation: Nygard recommends a **test harness** — a fake dependency that misbehaves on purpose — to see how your code copes.
