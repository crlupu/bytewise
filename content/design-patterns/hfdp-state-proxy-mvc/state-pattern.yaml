title: The State pattern
summary: Give each state its own class, and let the object delegate to its current state — no more giant conditionals.
duration: 6
tags: [design patterns, head first, state, state machine, behavioral]
sources:
  - { book: head-first-design-patterns, ref: "Chapter 10, The State Pattern" }
steps:
  - type: explanation
    title: Conditionals everywhere
    body: |
      A gumball machine has states: no coin, has coin, sold, sold out.
      Every action — insert, eject, turn crank — becomes an `if` per state.
      Adding a state touches every method.

  - type: explanation
    title: A class per state
    body: |
      `NoCoinState`, `HasCoinState` and the others implement a `State` interface.
      The machine holds its current state and delegates each action to it.
      States switch the machine to the next state.
    diagram:
      classes:
        - { name: GumballMachine, methods: ["insertCoin()", "turnCrank()"] }
        - { name: State, kind: interface, methods: ["insertCoin()", "ejectCoin()", "turnCrank()"] }
        - { name: NoCoinState }
        - { name: HasCoinState }
        - { name: SoldState }
      relations:
        - { from: GumballMachine, to: State, type: has, label: current }
        - { from: NoCoinState, to: State, type: implements }
        - { from: HasCoinState, to: State, type: implements }
        - { from: SoldState, to: State, type: implements }
      caption: SoldOutState and any new state plug in the same way.

  - type: predict
    prompt: The machine is in `NoCoinState`. What happens on `turnCrank()`?
    code: |
      class NoCoinState implements State {
        public void insertCoin() { machine.setState(machine.getHasCoinState()); }
        public void turnCrank() { System.out.println("You turned, but there's no coin"); }
      }
    language: java
    options:
      - text: It prints "You turned, but there's no coin", and the state doesn't change
        correct: true
      - text: It dispenses a gumball
        feedback: Only `HasCoinState.turnCrank()` moves towards dispensing.

  - type: order
    prompt: Put a successful purchase's state changes in order.
    items:
      - "`NoCoinState`"
      - "`HasCoinState`, after inserting a coin"
      - "`SoldState`, after turning the crank"
      - "`NoCoinState` again, after dispensing"

  - type: explanation
    title: State versus Strategy
    body: |
      Both delegate to an object behind an interface.
      In Strategy, the client usually picks the behaviour.
      In State, the states change themselves as things happen.

  - type: choice
    prompt: What's the main difference between State and Strategy?
    options:
      - text: In State, the object's state objects swap themselves as events occur; in Strategy, the client sets the behaviour
        correct: true
      - text: State uses inheritance and Strategy uses composition
        feedback: Both use composition.
    details: |
      Both patterns delegate behaviour to an object behind an interface, so their class diagrams look identical.
      The difference is intent: in Strategy, the client chooses the behaviour, and it rarely changes.
      In State, the state objects themselves switch the context to the next state as events happen, encoding a state machine.
