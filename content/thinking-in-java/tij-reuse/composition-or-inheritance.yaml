title: Composition or inheritance?
summary: Use inheritance when the new class is a kind of the old one and you'll upcast; use composition to reuse what a class does without being one.
duration: 5
tags: [java, thinking in java, composition, inheritance, delegation, design]
sources:
  - { book: thinking-in-java, ref: "Chapter 7, Reusing Classes — Choosing composition vs. inheritance" }
steps:
  - type: explanation
    title: Ask whether you'll upcast
    body: |
      Inheritance is for "is a": a `Wind` is an `Instrument`.
      The test: will you treat the new class as the old one, through upcasting?
      If not, composition is usually the better choice.
    diagram:
      classes:
        - { name: Instrument, methods: ["+ play()"] }
        - { name: Wind, methods: ["+ play()"] }
        - { name: Music, methods: ["+ tune(Instrument)"] }
      relations:
        - { from: Wind, to: Instrument, type: extends }
        - { from: Music, to: Instrument, type: uses }

  - type: explanation
    title: Delegation, in between
    body: |
      A `SpaceShip` isn't really a kind of `SpaceShipControls`.
      Delegation holds a controls object and forwards chosen calls to it.
      You expose only what you want, unlike inheritance which exposes everything.
    diagram:
      classes:
        - { name: SpaceShipDelegation, methods: ["+ forward(int)", "+ back(int)"] }
        - { name: SpaceShipControls, methods: ["+ forward(int)", "+ back(int)", "+ turboBoost()"] }
      relations:
        - { from: SpaceShipDelegation, to: SpaceShipControls, type: has, label: delegates }

  - type: match
    prompt: Inheritance, composition or delegation?
    pairs:
      - left: A `Stack` built on a list, exposing only push and pop
        right: Composition or delegation
      - left: "`Circle` passed wherever a `Shape` is expected"
        right: Inheritance
      - left: A `Car` with an `Engine`
        right: Composition

  - type: choice
    prompt: A `Stack extends ArrayList` would work. Why is that a poor design?
    options:
      - text: Clients could call `add(0, x)` or `remove(3)` and break stack behaviour — inheritance exposes the whole list interface
        correct: true
      - text: It would be slower
        feedback: Speed isn't the issue; the exposed interface is.

  - type: choice
    prompt: What's the usual default when you're unsure?
    options:
      - text: Composition — it's more flexible, and you can switch parts at run time
        correct: true
      - text: Inheritance — it saves typing
        feedback: Inheritance ties you to the base class's interface and implementation for good.

  - type: choice
    id: tij-reusing-spaceship
    prompt: |
      `SpaceShipControls` is shown below. What's questionable about `SpaceShip extends SpaceShipControls`?
    code: |
      //: reusing/SpaceShip.java

      public class SpaceShip extends SpaceShipControls {
        private String name;
        public SpaceShip(String name) { this.name = name; }
        public String toString() { return name; }
        public static void main(String[] args) {
          SpaceShip protector = new SpaceShip("NSEA Protector");
          protector.forward(100);
        }
      }

      //: reusing/SpaceShipControls.java

      public class SpaceShipControls {
        void up(int velocity) {}
        void down(int velocity) {}
        void left(int velocity) {}
        void right(int velocity) {}
        void forward(int velocity) {}
        void back(int velocity) {}
        void turboBoost() {}
      }
    language: java
    options:
      - text: "A spaceship isn't a kind of control panel; inheriting exposes all the controls' methods as its own"
        correct: true
      - text: "It doesn't compile"
        feedback: "It compiles and runs, printing nothing."
      - text: "Nothing — inheritance is always preferred"
        feedback: "\"Is-a\" doesn't hold here, so delegation or composition fits better."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-reusing-wind
    prompt: |
      `Instrument.tune` takes an `Instrument`. Why can it be passed a `Wind`?
    code: |
      //: reusing/Wind.java
      // Inheritance & upcasting.

      class Instrument {
        public void play() {}
        static void tune(Instrument i) {
          // ...
          i.play();
        }
      }

      // Wind objects are instruments
      // because they have the same interface:
      public class Wind extends Instrument {
        public static void main(String[] args) {
          Wind flute = new Wind();
          Instrument.tune(flute); // Upcasting
        }
      }
    language: java
    options:
      - text: "A `Wind` is an `Instrument` — upcasting is automatic and safe"
        correct: true
      - text: "It can't; a cast is required"
        feedback: "Upcasting needs no cast."
      - text: "Because `Wind` overrides `play`"
        feedback: "It doesn't override anything; inheritance alone makes it an `Instrument`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
