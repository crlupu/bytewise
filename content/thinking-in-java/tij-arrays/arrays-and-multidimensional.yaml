  - type: choice
    id: tij-arrays-raggedarray
    prompt: |
      What can `Arrays.deepToString(a)` show for one of the inner arrays?
    code: |
      //: arrays/RaggedArray.java
      import java.util.*;

      public class RaggedArray {
        public static void main(String[] args) {
          Random rand = new Random(47);
          // 3-D array with varied-length vectors:
          int[][][] a = new int[rand.nextInt(7)][][];
          for(int i = 0; i < a.length; i++) {
            a[i] = new int[rand.nextInt(5)][];
            for(int j = 0; j < a[i].length; j++)
              a[i][j] = new int[rand.nextInt(5)];
          }
          System.out.println(Arrays.deepToString(a));
        }
      }
    language: java
    options:
      - text: "`[]` — a level can have length 0, and each sub-array has its own random length"
        correct: true
      - text: "`null` — the inner arrays aren't created"
        feedback: "Each level is created with `new`."
      - text: "Always the same length at each level"
        feedback: "That's what \"ragged\" means: lengths vary."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

