      // Multidimensional arrays of "wrapper" objects.
      import java.util.*;

      public class MultiDimWrapperArray {
        public static void main(String[] args) {
          Integer[][] a1 = { // Autoboxing
            { 1, 2, 3, },
            { 4, 5, 6, },
          };
          Double[][][] a2 = { // Autoboxing
            { { 1.1, 2.2 }, { 3.3, 4.4 } },
