      //: arrays/FillingArrays.java
      // Using Arrays.fill()
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class FillingArrays {
        public static void main(String[] args) {
          int size = 6;
          boolean[] a1 = new boolean[size];
          byte[] a2 = new byte[size];
          char[] a3 = new char[size];
          short[] a4 = new short[size];
          int[] a5 = new int[size];
          long[] a6 = new long[size];
          float[] a7 = new float[size];
          double[] a8 = new double[size];
          String[] a9 = new String[size];
          Arrays.fill(a1, true);
          print("a1 = " + Arrays.toString(a1));
          Arrays.fill(a2, (byte)11);
          print("a2 = " + Arrays.toString(a2));
          Arrays.fill(a3, 'x');
          print("a3 = " + Arrays.toString(a3));
          Arrays.fill(a4, (short)17);
          print("a4 = " + Arrays.toString(a4));
          Arrays.fill(a5, 19);
          print("a5 = " + Arrays.toString(a5));
          Arrays.fill(a6, 23);
          print("a6 = " + Arrays.toString(a6));
          Arrays.fill(a7, 29);
          print("a7 = " + Arrays.toString(a7));
          Arrays.fill(a8, 47);
          print("a8 = " + Arrays.toString(a8));
          Arrays.fill(a9, "Hello");
          print("a9 = " + Arrays.toString(a9));
          // Manipulating ranges:
          Arrays.fill(a9, 3, 5, "World");
          print("a9 = " + Arrays.toString(a9));
        }
      }
    language: java
    options:
      - text: "a9 = [Hello, Hello, Hello, Hello, Hello, Hello]\na9 = [Hello, Hello, Hello, World, World, Hello]"
        correct: true
      - text: "a9 = [Hello, Hello, Hello, Hello, Hello, Hello]\na9 = [Hello, Hello, Hello, World, World, World]"
        feedback: "The range 3 to 5 excludes index 5."
      - text: "a9 = [Hello, Hello, Hello, Hello, Hello, Hello]\na9 = [Hello, Hello, World, World, World, Hello]"
        feedback: "The range starts at index 3."
