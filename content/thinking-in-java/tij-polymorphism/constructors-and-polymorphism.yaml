  - type: predict
    id: tij-polymorphism-frog
    prompt: |
      What are the last four lines printed? (`print` is `println`.)
    code: |
      //: polymorphism/Frog.java
      // Cleanup and inheritance.
      package polymorphism;
      import static net.mindview.util.Print.*;

      class Characteristic {
        private String s;
        Characteristic(String s) {
          this.s = s;
          print("Creating Characteristic " + s);
        }
        protected void dispose() {
          print("disposing Characteristic " + s);
        }
      }

      class Description {
        private String s;
        Description(String s) {
          this.s = s;
          print("Creating Description " + s);
        }
        protected void dispose() {
          print("disposing Description " + s);
        }
      }

      class LivingCreature {
        private Characteristic p =
          new Characteristic("is alive");
        private Description t =
          new Description("Basic Living Creature");
        LivingCreature() {
          print("LivingCreature()");
        }
        protected void dispose() {
          print("LivingCreature dispose");
          t.dispose();
          p.dispose();
        }
      }

      class Animal extends LivingCreature {
        private Characteristic p =
          new Characteristic("has heart");
        private Description t =
          new Description("Animal not Vegetable");
        Animal() { print("Animal()"); }
        protected void dispose() {
          print("Animal dispose");
          t.dispose();
          p.dispose();
          super.dispose();
        }
      }

      class Amphibian extends Animal {
        private Characteristic p =
          new Characteristic("can live in water");
        private Description t =
          new Description("Both water and land");
        Amphibian() {
          print("Amphibian()");
        }
        protected void dispose() {
          print("Amphibian dispose");
          t.dispose();
          p.dispose();
          super.dispose();
        }
      }

      public class Frog extends Amphibian {
        private Characteristic p = new Characteristic("Croaks");
        private Description t = new Description("Eats Bugs");
        public Frog() { print("Frog()"); }
        protected void dispose() {
          print("Frog dispose");
          t.dispose();
          p.dispose();
          super.dispose();
        }
        public static void main(String[] args) {
          Frog frog = new Frog();
          print("Bye!");
          frog.dispose();
        }
      }
    language: java
    options:
      - text: "LivingCreature dispose\ndisposing Characteristic is alive\ndisposing Description Basic Living Creature\nBye!"
        feedback: "`Bye!` prints before `dispose()` is called, and each `dispose` releases `t` before `p`."
      - text: "disposing Characteristic has heart\nLivingCreature dispose\ndisposing Description Basic Living Creature\ndisposing Characteristic is alive"
        correct: true
      - text: "Frog dispose\ndisposing Description Eats Bugs\ndisposing Characteristic Croaks\nAmphibian dispose"
        feedback: "Each `dispose` ends with `super.dispose()`, so the root class disposes last."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-polymorphism-referencecounting
    prompt: |
      When is `Disposing Shared 0` printed? (`print` is `println`.)
    code: |
      //: polymorphism/ReferenceCounting.java
      // Cleaning up shared member objects.
      import static net.mindview.util.Print.*;

      class Shared {
        private int refcount = 0;
        private static long counter = 0;
        private final long id = counter++;
        public Shared() {
          print("Creating " + this);
        }
        public void addRef() { refcount++; }
        protected void dispose() {
          if(--refcount == 0)
            print("Disposing " + this);
        }
        public String toString() { return "Shared " + id; }
      }

      class Composing {
        private Shared shared;
        private static long counter = 0;
        private final long id = counter++;
        public Composing(Shared shared) {
          print("Creating " + this);
          this.shared = shared;
          this.shared.addRef();
        }
        protected void dispose() {
          print("disposing " + this);
          shared.dispose();
        }
        public String toString() { return "Composing " + id; }
      }

      public class ReferenceCounting {
        public static void main(String[] args) {
          Shared shared = new Shared();
          Composing[] composing = { new Composing(shared),
            new Composing(shared), new Composing(shared),
            new Composing(shared), new Composing(shared) };
          for(Composing c : composing)
            c.dispose();
        }
      }
    language: java
    options:
      - text: "Once, after the fifth `Composing` is disposed — when the reference count reaches zero"
        correct: true
      - text: "After the first `Composing` is disposed"
        feedback: "The count starts at 5; each dispose decrements it."
      - text: "Never"
        feedback: "The fifth decrement makes it 0."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
