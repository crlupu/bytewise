title: Upcasting and late binding
summary: A Circle can be treated as a Shape, and calling draw() on it still runs Circle's version.
duration: 5
tags: [java, thinking in java, polymorphism, upcasting, late binding, inheritance]
sources:
  - { book: thinking-in-java, ref: "Chapter 8, Polymorphism" }
steps:
  - type: explanation
    title: A Circle is a Shape
    body: |
      `Circle`, `Square` and `Triangle` all extend `Shape`.
      So anywhere a `Shape` is expected, any of them will do.
      Treating a subclass as its base class is called upcasting — up the diagram.
    diagram:
      classes:
        - { name: Shape, methods: ["+ draw()", "+ erase()"] }
        - { name: Circle, methods: ["+ draw()", "+ erase()"] }
        - { name: Square, methods: ["+ draw()", "+ erase()"] }
        - { name: Triangle, methods: ["+ draw()", "+ erase()"] }
      relations:
        - { from: Circle, to: Shape, type: extends }
        - { from: Square, to: Shape, type: extends }
        - { from: Triangle, to: Shape, type: extends }

  - type: explanation
    title: The object decides
    body: |
      `Shape s = new Circle();` declares a `Shape` but creates a `Circle`.
      Calling `s.draw()` runs `Circle.draw()`.
      Java picks the method at run time from the object's real class — late binding.
    diagram:
      kind: objects
      vars:
        - { name: "Shape s", to: c }
      objects:
        - { id: c, type: Circle, fields: [{ name: radius, value: "2.0" }] }
      caption: The variable's type is Shape; the object is a Circle.

  - type: widget
    widget: hierarchy
    prompt: "`Shape s = new Square(); s.draw();` — tap the class whose `draw()` runs."
    config:
      diagram:
        classes:
          - { name: Shape, methods: ["+ draw()"] }
          - { name: Circle, methods: ["+ draw()"] }
          - { name: Square, methods: ["+ draw()"] }
          - { name: Triangle, methods: ["+ draw()"] }
        relations:
          - { from: Circle, to: Shape, type: extends }
          - { from: Square, to: Shape, type: extends }
          - { from: Triangle, to: Shape, type: extends }
      feedback:
        Shape: The variable's type is Shape, but the call goes to the object's own class.
        Circle: The object is a Square.
        Triangle: The object is a Square.
    goal:
      select: Square
    explanation: Late binding uses the object's class, `Square`, whatever type the variable has.

  - type: widget
    widget: hierarchy
    prompt: "`Triangle` doesn't override `erase()`. `Shape s = new Triangle(); s.erase();` — whose `erase()` runs?"
    config:
      diagram:
        classes:
          - { name: Shape, methods: ["+ draw()", "+ erase()"] }
          - { name: Circle, methods: ["+ draw()", "+ erase()"] }
          - { name: Triangle, methods: ["+ draw()"] }
        relations:
          - { from: Circle, to: Shape, type: extends }
          - { from: Triangle, to: Shape, type: extends }
      feedback:
        Triangle: "`Triangle` has no `erase()` of its own, so the search continues upwards."
        Circle: Circle is a sibling, not an ancestor — it's never searched.
    goal:
      select: Shape
    explanation: The JVM starts at the object's class and walks up until it finds the method — here, in `Shape`.

  - type: explanation
    title: Code that talks to the base class
    body: |
      Write methods against `Shape`, not each subclass.
      Then adding a `Hexagon` needs no change to them.
      That's the payoff: new types plug into old code.

  - type: choice
    prompt: Which method keeps working, unchanged, when you add a new `Hexagon` subclass?
    options:
      - text: "`void render(Shape s) { s.draw(); }`"
        correct: true
      - text: "`void render(Circle c) { c.draw(); }`"
        feedback: It only accepts circles; a Hexagon can't be passed in.
      - text: "`void render(Object o) { if (o instanceof Circle) ((Circle) o).draw(); else if (o instanceof Square) ((Square) o).draw(); }`"
        feedback: Every new shape needs another branch — the switch polymorphism removes.

  - type: choice
    id: tij-polymorphism-shapes
    prompt: |
      `gen.next()` returns a random `Circle`, `Square` or `Triangle`, upcast to `Shape`. Each subclass overrides `draw()` to print its own name. What does the second loop print?
    code: |
      //: polymorphism/Shapes.java
      // Polymorphism in Java.
      import polymorphism.shape.*;

      public class Shapes {
        private static RandomShapeGenerator gen =
          new RandomShapeGenerator();
        public static void main(String[] args) {
          Shape[] s = new Shape[9];
          // Fill up the array with shapes:
          for(int i = 0; i < s.length; i++)
            s[i] = gen.next();
          // Make polymorphic method calls:
          for(Shape shp : s)
            shp.draw();
        }
      }
    language: java
    options:
      - text: "Each shape's own `draw()`, like `Triangle.draw()` or `Circle.draw()`, chosen at run time"
        correct: true
      - text: "`Shape.draw()` nine times — the array's type is `Shape`"
        feedback: "Calls are bound late, to the actual object's method."
      - text: "It doesn't compile — `gen.next()` returns a `Shape`, not a specific shape"
        feedback: "Storing subclasses as `Shape` is the point of upcasting."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-polymorphism-transmogrify
    prompt: |
      What does this print? (`print` is `println`.)
    code: |
      //: polymorphism/Transmogrify.java
      // Dynamically changing the behavior of an object
      // via composition (the "State" design pattern).
      import static net.mindview.util.Print.*;

      class Actor {
        public void act() {}
      }

      class HappyActor extends Actor {
        public void act() { print("HappyActor"); }
      }

      class SadActor extends Actor {
        public void act() { print("SadActor"); }
      }

      class Stage {
        private Actor actor = new HappyActor();
        public void change() { actor = new SadActor(); }
        public void performPlay() { actor.act(); }
      }

      public class Transmogrify {
        public static void main(String[] args) {
          Stage stage = new Stage();
          stage.performPlay();
          stage.change();
          stage.performPlay();
        }
      }
    language: java
    options:
      - text: "HappyActor\nSadActor"
        correct: true
      - text: "HappyActor\nHappyActor"
        feedback: "`change()` swaps the `actor` reference, so the next call reaches a `SadActor`."
      - text: "Nothing — `Actor.act()` is empty"
        feedback: "The field holds a subclass object, whose `act` overrides the empty one."
    explanation: |
      Changing a field to a different subclass changes behavior at run time — the State pattern. You can't change an object's class, but you can change what it's composed of.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-polymorphism-music-music
    prompt: |
      `Instrument.play` prints `Instrument.play()`; `Wind` (shown below) overrides it. `Note` is `enum Note { MIDDLE_C, C_SHARP, B_FLAT }`. What does this print?
    code: |
      //: polymorphism/music/Music.java
      // Inheritance & upcasting.
      package polymorphism.music;

      public class Music {
        public static void tune(Instrument i) {
          // ...
          i.play(Note.MIDDLE_C);
        }
        public static void main(String[] args) {
          Wind flute = new Wind();
          tune(flute); // Upcasting
        }
      }

      //: polymorphism/music/Wind.java
      package polymorphism.music;

      // Wind objects are instruments
      // because they have the same interface:
      public class Wind extends Instrument {
        // Redefine interface method:
        public void play(Note n) {
          System.out.println("Wind.play() " + n);
        }
      }
    language: java
    options:
      - text: "Wind.play() MIDDLE_C"
        correct: true
      - text: "Instrument.play()"
        feedback: "`tune` takes an `Instrument`, but the object is a `Wind`, so `Wind.play` runs."
      - text: "Wind.play() 0"
        feedback: "An enum prints its name."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-polymorphism-music-instrument
    prompt: |
      `Wind extends Instrument` and overrides `play(Note)`. A method takes an `Instrument` parameter. What can you pass it? (`print` is `println`.)
    code: |
      //: polymorphism/music/Instrument.java
      package polymorphism.music;
      import static net.mindview.util.Print.*;

      class Instrument {
        public void play(Note n) {
          print("Instrument.play()");
        }
      }
    language: java
    options:
      - text: "An `Instrument` or any subclass, such as a `Wind`"
        correct: true
      - text: "Only an `Instrument`"
        feedback: "A subclass object can always be used where its base class is expected."
      - text: "Only classes in the same package"
        feedback: "Access to the class matters, but any subclass object is an `Instrument`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-polymorphism-music-note
    prompt: |
      What does `System.out.println(Note.B_FLAT)` print?
    code: |
      //: polymorphism/music/Note.java
      // Notes to play on musical instruments.
      package polymorphism.music;

      public enum Note {
          MIDDLE_C, C_SHARP, B_FLAT; // Etc.
      }
    language: java
    options:
      - text: "B_FLAT"
        correct: true
      - text: "2"
        feedback: "That's its `ordinal()`."
      - text: "Note.B_FLAT"
        feedback: "An enum's `toString()` is just its name."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-polymorphism-music-music2
    prompt: |
      What's the drawback of writing a `tune` overload for every instrument type? (`print` is `println`.)
    code: |
      //: polymorphism/music/Music2.java
      // Overloading instead of upcasting.
      package polymorphism.music;
      import static net.mindview.util.Print.*;

      class Stringed extends Instrument {
        public void play(Note n) {
          print("Stringed.play() " + n);
        }
      }

      class Brass extends Instrument {
        public void play(Note n) {
          print("Brass.play() " + n);
        }
      }

      public class Music2 {
        public static void tune(Wind i) {
          i.play(Note.MIDDLE_C);
        }
        public static void tune(Stringed i) {
          i.play(Note.MIDDLE_C);
        }
        public static void tune(Brass i) {
          i.play(Note.MIDDLE_C);
        }
        public static void main(String[] args) {
          Wind flute = new Wind();
          Stringed violin = new Stringed();
          Brass frenchHorn = new Brass();
          tune(flute); // No upcasting
          tune(violin);
          tune(frenchHorn);
        }
      }
    language: java
    options:
      - text: "Every new instrument needs a new `tune` method; with one `tune(Instrument)`, new types just work"
        correct: true
      - text: "It prints the wrong output"
        feedback: "It prints `Wind.play() MIDDLE_C`, `Stringed.play() MIDDLE_C`, `Brass.play() MIDDLE_C` — correct, just repetitive."
      - text: "It doesn't compile — overloads can't differ only by subclass"
        feedback: "Overloading on different parameter classes is fine."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-polymorphism-music3-music3
    prompt: |
      What are the last two lines printed? (`print` is `println`.)
    code: |
      //: polymorphism/music3/Music3.java
      // An extensible program.
      package polymorphism.music3;
      import polymorphism.music.Note;
      import static net.mindview.util.Print.*;

      class Instrument {
        void play(Note n) { print("Instrument.play() " + n); }
        String what() { return "Instrument"; }
        void adjust() { print("Adjusting Instrument"); }
      }

      class Wind extends Instrument {
        void play(Note n) { print("Wind.play() " + n); }
        String what() { return "Wind"; }
        void adjust() { print("Adjusting Wind"); }
      }

      class Percussion extends Instrument {
        void play(Note n) { print("Percussion.play() " + n); }
        String what() { return "Percussion"; }
        void adjust() { print("Adjusting Percussion"); }
      }

      class Stringed extends Instrument {
        void play(Note n) { print("Stringed.play() " + n); }
        String what() { return "Stringed"; }
        void adjust() { print("Adjusting Stringed"); }
      }

      class Brass extends Wind {
        void play(Note n) { print("Brass.play() " + n); }
        void adjust() { print("Adjusting Brass"); }
      }

      class Woodwind extends Wind {
        void play(Note n) { print("Woodwind.play() " + n); }
        String what() { return "Woodwind"; }
      }

      public class Music3 {
        // Doesn't care about type, so new types
        // added to the system still work right:
        public static void tune(Instrument i) {
          // ...
          i.play(Note.MIDDLE_C);
        }
        public static void tuneAll(Instrument[] e) {
          for(Instrument i : e)
            tune(i);
        }
        public static void main(String[] args) {
          // Upcasting during addition to the array:
          Instrument[] orchestra = {
            new Wind(),
            new Percussion(),
            new Stringed(),
            new Brass(),
            new Woodwind()
          };
          tuneAll(orchestra);
        }
      }
    language: java
    options:
      - text: "Brass.play() MIDDLE_C\nWoodwind.play() MIDDLE_C"
        correct: true
      - text: "Wind.play() MIDDLE_C\nWind.play() MIDDLE_C"
        feedback: "`Brass` and `Woodwind` override `play` themselves."
      - text: "Instrument.play() MIDDLE_C\nInstrument.play() MIDDLE_C"
        feedback: "The array holds subclass objects; the most-derived `play` runs."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-polymorphism-shape-randomshapegenerator
    prompt: |
      What does `next()` return, and as what type?
    code: |
      //: polymorphism/shape/RandomShapeGenerator.java
      // A "factory" that randomly creates shapes.
      package polymorphism.shape;
      import java.util.*;

      public class RandomShapeGenerator {
        private Random rand = new Random(47);
        public Shape next() {
          switch(rand.nextInt(3)) {
            default:
            case 0: return new Circle();
            case 1: return new Square();
            case 2: return new Triangle();
          }
        }
      }
    language: java
    options:
      - text: "A random `Circle`, `Square` or `Triangle`, upcast to `Shape`"
        correct: true
      - text: "Always a `Circle` — `default` comes first"
        feedback: "`default` only matches values other than 0, 1 and 2; it falls through to `case 0`."
      - text: "It doesn't compile — no `return` after the switch"
        feedback: "Every path through the switch returns."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-polymorphism-shape-circle
    prompt: |
      `Shape s = new Circle(); s.draw();` — what's printed? (`Shape.draw()` is empty.) (`print` is `println`.)
    code: |
      //: polymorphism/shape/Circle.java
      package polymorphism.shape;
      import static net.mindview.util.Print.*;

      public class Circle extends Shape {
        public void draw() { print("Circle.draw()"); }
        public void erase() { print("Circle.erase()"); }
      }

      //: polymorphism/shape/Shape.java
      package polymorphism.shape;

      public class Shape {
        public void draw() {}
        public void erase() {}
      }
    language: java
    options:
      - text: "Circle.draw()"
        correct: true
      - text: "Nothing — `Shape.draw()` is empty"
        feedback: "The call is bound at run time to `Circle`'s override."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
