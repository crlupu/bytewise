  - type: choice
    id: tij-concurrency-fixeddiningphilosophers
    prompt: |
      The last philosopher is given `(sticks[0], sticks[i])` instead of `(sticks[i], sticks[0])`. Why does that prevent deadlock? (`print` is `println`.)
    code: |
      //: concurrency/FixedDiningPhilosophers.java
      // Dining philosophers without deadlock.
      import java.util.concurrent.*;

      public class FixedDiningPhilosophers {
        public static void main(String[] args) throws Exception {
          int ponder = 5;
          if(args.length > 0)
            ponder = Integer.parseInt(args[0]);
          int size = 5;
          if(args.length > 1)
            size = Integer.parseInt(args[1]);
          ExecutorService exec = Executors.newCachedThreadPool();
          Chopstick[] sticks = new Chopstick[size];
          for(int i = 0; i < size; i++)
            sticks[i] = new Chopstick();
          for(int i = 0; i < size; i++)
            if(i < (size-1))
              exec.execute(new Philosopher(
                sticks[i], sticks[i+1], i, ponder));
            else
              exec.execute(new Philosopher(
                sticks[0], sticks[i], i, ponder));
          if(args.length == 3 && args[2].equals("timeout"))
            TimeUnit.SECONDS.sleep(5);
          else {
            System.out.println("Press 'Enter' to quit");
            System.in.read();
          }
          exec.shutdownNow();
        }
      }

