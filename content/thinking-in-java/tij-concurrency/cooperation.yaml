  - type: choice
    id: tij-concurrency-chopstick
    prompt: |
      Why does `take()` use `while(taken) wait();` rather than `if`?
    code: |
      //: concurrency/Chopstick.java
      // Chopsticks for dining philosophers.

      public class Chopstick {
        private boolean taken = false;
        public synchronized
        void take() throws InterruptedException {
          while(taken)
            wait();
          taken = true;
        }
        public synchronized void drop() {
          taken = false;
          notifyAll();
        }
      }
    language: java
    options:
      - text: "`drop()` calls `notifyAll()`, so several waiters may wake, but only one gets the chopstick — the others must check again"
        correct: true
      - text: "`if` doesn't compile with `wait()`"
        feedback: "It compiles; it's just wrong."
      - text: "To spin without releasing the lock"
        feedback: "`wait()` releases the lock while waiting."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-philosopher
    prompt: |
      In what order does a philosopher pick up the chopsticks, and when does it release them? (`print` is `println`.)
    code: |
      //: concurrency/Philosopher.java
      // A dining philosopher
      import java.util.concurrent.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class Philosopher implements Runnable {
        private Chopstick left;
        private Chopstick right;
        private final int id;
        private final int ponderFactor;
        private Random rand = new Random(47);
        private void pause() throws InterruptedException {
          if(ponderFactor == 0) return;
          TimeUnit.MILLISECONDS.sleep(
            rand.nextInt(ponderFactor * 250));
        }
        public Philosopher(Chopstick left, Chopstick right,
          int ident, int ponder) {
          this.left = left;
          this.right = right;
          id = ident;
          ponderFactor = ponder;
        }
        public void run() {
          try {
            while(!Thread.interrupted()) {
              print(this + " " + "thinking");
              pause();
              // Philosopher becomes hungry
              print(this + " " + "grabbing right");
              right.take();
              print(this + " " + "grabbing left");
              left.take();
              print(this + " " + "eating");
              pause();
              right.drop();
              left.drop();
            }
          } catch(InterruptedException e) {
            print(this + " " + "exiting via interrupt");
          }
        }
        public String toString() { return "Philosopher " + id; }
      }

      //: concurrency/Chopstick.java
      // Chopsticks for dining philosophers.

      public class Chopstick {
        private boolean taken = false;
        public synchronized
