  - type: choice
    id: tij-concurrency-serialnumberchecker
    prompt: |
      With no argument, ten checkers call `nextSerialNumber()` in a loop. What happens?
    code: |
      //: concurrency/SerialNumberChecker.java
      // Operations that may seem safe are not,
      // when threads are present.
      import java.util.concurrent.*;

      // Reuses storage so we don't run out of memory:
      class CircularSet {
        private int[] array;
        private int len;
        private int index = 0;
        public CircularSet(int size) {
          array = new int[size];
          len = size;
          // Initialize to a value not produced
          // by the SerialNumberGenerator:
          for(int i = 0; i < size; i++)
            array[i] = -1;
        }
        public synchronized void add(int i) {
          array[index] = i;
          // Wrap index and write over old elements:
          index = ++index % len;
        }
        public synchronized boolean contains(int val) {
          for(int i = 0; i < len; i++)
            if(array[i] == val) return true;
          return false;
        }
      }

      public class SerialNumberChecker {
        private static final int SIZE = 10;
        private static CircularSet serials =
          new CircularSet(1000);
        private static ExecutorService exec =
          Executors.newCachedThreadPool();
        static class SerialChecker implements Runnable {
          public void run() {
            while(true) {
              int serial =
                SerialNumberGenerator.nextSerialNumber();
              if(serials.contains(serial)) {
                System.out.println("Duplicate: " + serial);
                System.exit(0);
              }
              serials.add(serial);
            }
          }
        }
        public static void main(String[] args) throws Exception {
          for(int i = 0; i < SIZE; i++)
            exec.execute(new SerialChecker());
          // Stop after n seconds if there's an argument:
          if(args.length > 0) {
            TimeUnit.SECONDS.sleep(new Integer(args[0]));
            System.out.println("No duplicates detected");
            System.exit(0);
          }
        }
      }

      //: concurrency/SerialNumberGenerator.java

      public class SerialNumberGenerator {
        private static volatile int serialNumber = 0;
        public static int nextSerialNumber() {
          return serialNumber++; // Not thread-safe
        }
      }
    language: java
    options:
      - text: "Soon one or more `Duplicate: N` lines, then the program exits"
        correct: true
      - text: "It runs forever: serial numbers are unique"
        feedback: "Two threads can read the same value before either writes it back."
      - text: "`No duplicates detected`"
        feedback: "That's printed only with an argument, and only if no duplicate was found in time."
    explanation: |
      On a Java 21 run several checkers each printed a duplicate (like `Duplicate: 4103`) before `System.exit` took effect.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-atomicintegertest
    prompt: |
      This is `AtomicityTest` rewritten with an `AtomicInteger`. What happens?
    code: |
      //: concurrency/AtomicIntegerTest.java
      import java.util.concurrent.*;
      import java.util.concurrent.atomic.*;
      import java.util.*;

      public class AtomicIntegerTest implements Runnable {
        private AtomicInteger i = new AtomicInteger(0);
        public int getValue() { return i.get(); }
        private void evenIncrement() { i.addAndGet(2); }
        public void run() {
          while(true)
            evenIncrement();
        }
        public static void main(String[] args) {
          new Timer().schedule(new TimerTask() {
            public void run() {
              System.err.println("Aborting");
              System.exit(0);
            }
          }, 5000);
          ExecutorService exec = Executors.newCachedThreadPool();
          AtomicIntegerTest ait = new AtomicIntegerTest();
          exec.execute(ait);
          while(true) {
            int val = ait.getValue();
            if(val % 2 != 0) {
              System.out.println(val);
              System.exit(0);
            }
          }
        }
      }
    language: java
    options:
      - text: "No odd value is ever seen; after 5 seconds the timer prints `Aborting` to stderr and exits"
        correct: true
      - text: "It prints an odd number, like `AtomicityTest`"
        feedback: "`addAndGet(2)` is one atomic step, so there's never an in-between value."
      - text: "It runs forever"
        feedback: "The `Timer` calls `System.exit(0)` after 5 seconds."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

