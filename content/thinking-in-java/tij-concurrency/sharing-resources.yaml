  - type: choice
    id: tij-concurrency-atomicitytest
    prompt: |
      `evenIncrement()` is `synchronized`, so `i` changes by 2 at a time. What does this program do?
    code: |
      //: concurrency/AtomicityTest.java
      import java.util.concurrent.*;

      public class AtomicityTest implements Runnable {
        private int i = 0;
        public int getValue() { return i; }
        private synchronized void evenIncrement() { i++; i++; }
        public void run() {
          while(true)
            evenIncrement();
        }
        public static void main(String[] args) {
          ExecutorService exec = Executors.newCachedThreadPool();
          AtomicityTest at = new AtomicityTest();
          exec.execute(at);
          while(true) {
            int val = at.getValue();
            if(val % 2 != 0) {
              System.out.println(val);
              System.exit(0);
            }
          }
        }
      }
    language: java
    options:
      - text: "Prints an odd number and exits — `getValue()` isn't synchronized, so it can read `i` between the two increments"
        correct: true
      - text: "Runs forever; `i` is always even"
        feedback: "Only writers hold the lock; the reader doesn't."
      - text: "Deadlocks"
        feedback: "There's only one lock, and the reader never takes it."
    explanation: |
      On a Java 21 run it printed `1` straight away.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

