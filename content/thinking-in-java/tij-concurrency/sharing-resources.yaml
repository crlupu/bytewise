title: "Sharing resources"
summary: "Race conditions, synchronized and Lock, atomicity and visibility, atomic classes, critical sections and ThreadLocal."
duration: 8
tags: [java, concurrency, synchronized, ReentrantLock, atomicity, volatile, AtomicInteger, ThreadLocal]
sources:
  - { book: thinking-in-java, ref: "Chapter 21, Sharing resources" }
steps:
  - type: explanation
    title: "Locks"
    body: |
      When threads share mutable state, every access — reads included — must hold the same lock.
      `synchronized` methods lock `this`; a `synchronized(obj)` block locks `obj`; a `ReentrantLock` must be unlocked in `finally`, but can also `tryLock()` and give up.
      Two different locks protect nothing from each other.

  - type: explanation
    title: "Atomicity and visibility"
    body: |
      `i++` is several bytecode steps (read, add, write), so two threads can lose updates.
      `volatile` makes writes visible to other threads but doesn't make `i++` atomic.
      `AtomicInteger.addAndGet()` is atomic; a `ThreadLocal` gives each thread its own copy, so nothing is shared at all.

  - type: choice
    id: tij-concurrency-intgenerator
    prompt: |
      Why is `canceled` declared `volatile`?
    code: |
      //: concurrency/IntGenerator.java

      public abstract class IntGenerator {
        private volatile boolean canceled = false;
        public abstract int next();
        // Allow this to be canceled:
        public void cancel() { canceled = true; }
        public boolean isCanceled() { return canceled; }
      }
    language: java
    options:
      - text: "So a `cancel()` on one thread is seen by the other threads checking `isCanceled()`"
        correct: true
      - text: "To make `next()` atomic"
        feedback: "`volatile` affects only the `canceled` field, and only visibility."
      - text: "It's required for `abstract` classes"
        feedback: "No such rule."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-evenchecker
    prompt: |
      `test(gp)` starts ten `EvenChecker`s. What do they share?
    code: |
      //: concurrency/EvenChecker.java
      import java.util.concurrent.*;

      public class EvenChecker implements Runnable {
        private IntGenerator generator;
        private final int id;
        public EvenChecker(IntGenerator g, int ident) {
          generator = g;
          id = ident;
        }
        public void run() {
          while(!generator.isCanceled()) {
            int val = generator.next();
            if(val % 2 != 0) {
              System.out.println(val + " not even!");
              generator.cancel(); // Cancels all EvenCheckers
            }
          }
        }
        // Test any type of IntGenerator:
        public static void test(IntGenerator gp, int count) {
          System.out.println("Press Control-C to exit");
          ExecutorService exec = Executors.newCachedThreadPool();
          for(int i = 0; i < count; i++)
            exec.execute(new EvenChecker(gp, i));
          exec.shutdown();
        }
        // Default value for count:
        public static void test(IntGenerator gp) {
          test(gp, 10);
        }
      }

      //: concurrency/IntGenerator.java

      public abstract class IntGenerator {
        private volatile boolean canceled = false;
        public abstract int next();
        // Allow this to be canceled:
        public void cancel() { canceled = true; }
        public boolean isCanceled() { return canceled; }
      }
    language: java
    options:
      - text: "The single generator `gp` — all ten call `next()` on it concurrently"
        correct: true
      - text: "Nothing; each checker makes its own generator"
        feedback: "They're all given the same `gp`."
      - text: "Only the `id`"
        feedback: "Each has its own `id`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

