    id: tij-concurrency-atomicity
    prompt: |
      `javap -c Atomicity` shows `f1()`'s bytecode. Is `i++` atomic?
    code: |
      //: concurrency/Atomicity.java

      public class Atomicity {
        int i;
        void f1() { i++; }
        void f2() { i += 3; }
      }
    language: java
    options:
      - text: "No — it's a `getfield`, an add, and a `putfield`; another thread can run between them"
        correct: true
      - text: "Yes — it's a single statement"
        feedback: "One statement can be several bytecode steps."
      - text: "Yes, because `int` writes are atomic"
        feedback: "Each read and write is atomic, but the read-add-write sequence isn't."
    explanation: |
