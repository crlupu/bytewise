  - type: choice
    id: tij-concurrency-mutexevengenerator
    prompt: |
      Why is the `return` inside the `try`, before `unlock()` in `finally`?
    code: |
      //: concurrency/MutexEvenGenerator.java
      // Preventing thread collisions with mutexes.
      import java.util.concurrent.locks.*;

      public class MutexEvenGenerator extends IntGenerator {
        private int currentEvenValue = 0;
        private Lock lock = new ReentrantLock();
        public int next() {
          lock.lock();
          try {
            ++currentEvenValue;
            Thread.yield();
            ++currentEvenValue;
            return currentEvenValue;
          } finally {
            lock.unlock();
          }
        }
        public static void main(String[] args) {
          EvenChecker.test(new MutexEvenGenerator());
        }
      }

      //: concurrency/IntGenerator.java

      public abstract class IntGenerator {
        private volatile boolean canceled = false;
        public abstract int next();
        // Allow this to be canceled:
        public void cancel() { canceled = true; }
        public boolean isCanceled() { return canceled; }
      }

      //: concurrency/EvenChecker.java
      import java.util.concurrent.*;

      public class EvenChecker implements Runnable {
        private IntGenerator generator;
        private final int id;
        public EvenChecker(IntGenerator g, int ident) {
          generator = g;
          id = ident;
        }
        public void run() {
          while(!generator.isCanceled()) {
            int val = generator.next();
            if(val % 2 != 0) {
              System.out.println(val + " not even!");
              generator.cancel(); // Cancels all EvenCheckers
            }
          }
        }
        // Test any type of IntGenerator:
        public static void test(IntGenerator gp, int count) {
          System.out.println("Press Control-C to exit");
          ExecutorService exec = Executors.newCachedThreadPool();
          for(int i = 0; i < count; i++)
            exec.execute(new EvenChecker(gp, i));
          exec.shutdown();
        }
        // Default value for count:
        public static void test(IntGenerator gp) {
          test(gp, 10);
        }
      }
    language: java
    options:
      - text: "So the value is read while the lock is still held — `finally` runs after the return value is computed"
        correct: true
      - text: "Because `return` can't come after a `finally`"
        feedback: "It could, but then it would read `currentEvenValue` without the lock."
      - text: "It makes no difference"
        feedback: "Reading after unlocking would let another thread change the value first."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-attemptlocking
    prompt: |
      The book expects the last two calls to print `false`. What do they really print?
    code: |
      //: concurrency/AttemptLocking.java
      // Locks in the concurrent library allow you
      // to give up on trying to acquire a lock.
      import java.util.concurrent.*;
      import java.util.concurrent.locks.*;

      public class AttemptLocking {
        private ReentrantLock lock = new ReentrantLock();
        public void untimed() {
          boolean captured = lock.tryLock();
          try {
            System.out.println("tryLock(): " + captured);
          } finally {
            if(captured)
              lock.unlock();
          }
        }
        public void timed() {
          boolean captured = false;
          try {
            captured = lock.tryLock(2, TimeUnit.SECONDS);
          } catch(InterruptedException e) {
            throw new RuntimeException(e);
          }
          try {
            System.out.println("tryLock(2, TimeUnit.SECONDS): " +
              captured);
          } finally {
            if(captured)
              lock.unlock();
          }
        }
        public static void main(String[] args) {
          final AttemptLocking al = new AttemptLocking();
          al.untimed();
          al.timed();
          // Now create a separate task to grab the lock:
          new Thread() {
            { setDaemon(true); }
            public void run() {
              al.lock.lock();
              System.out.println("acquired");
            }
          }.start();
          Thread.yield(); // Give the 2nd task a chance
          al.untimed();
          al.timed();
        }
      }
    language: java
    options:
      - text: "It depends on timing: if the new thread hasn't called `lock()` yet, they print `true`; `yield()` guarantees nothing"
        correct: true
      - text: "Always `false` — `yield()` lets the new thread run first"
        feedback: "`yield()` is only a hint."
      - text: "`untimed` prints `false`, and `timed` waits forever"
        feedback: "`tryLock(2, SECONDS)` gives up after 2 seconds."
    explanation: |
      On a Java 21 run all four printed `true`, and `acquired` came last — the daemon took the lock only after `main` was done with it.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

