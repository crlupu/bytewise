title: "Tasks, threads and executors"
summary: "Runnable tasks, Thread, the three classic executors, Callable and Future, sleep, priorities and the ways to write a thread."
duration: 8
tags: [java, concurrency, Runnable, Thread, ExecutorService, Callable, Future]
sources:
  - { book: thinking-in-java, ref: "Chapter 21, Basic threading" }
steps:
  - type: explanation
    title: "Tasks and threads"
    body: |
      A task is a `Runnable`: its `run()` is just a method, and calling it directly runs it on the current thread.
      To run it concurrently, hand it to a `Thread` and call `start()`, which returns at once while the new thread runs `run()`.
      The interleaving of several threads is decided by the scheduler, so it changes from run to run.

  - type: explanation
    title: "Executors"
    body: |
      `Executors.newCachedThreadPool()` makes threads as needed; `newFixedThreadPool(n)` uses at most n; `newSingleThreadExecutor()` runs tasks one at a time, in submission order.
      `shutdown()` stops new submissions but lets queued tasks finish.
      A `Callable<T>` returns a value; `submit()` gives back a `Future<T>` whose `get()` blocks until the result is ready.

  - type: choice
    id: tij-concurrency-liftoff
    prompt: |
      Each `LiftOff` gets an `id` from the static `taskCount`. What does one `LiftOff` print as it counts down from the default 10?
    code: |
      //: concurrency/LiftOff.java
      // Demonstration of the Runnable interface.

      public class LiftOff implements Runnable {
        protected int countDown = 10; // Default
        private static int taskCount = 0;
        private final int id = taskCount++;
        public LiftOff() {}
        public LiftOff(int countDown) {
          this.countDown = countDown;
        }
        public String status() {
          return "#" + id + "(" +
            (countDown > 0 ? countDown : "Liftoff!") + "), ";
        }
        public void run() {
          while(countDown-- > 0) {
            System.out.print(status());
            Thread.yield();
          }
        }
      }
    language: java
    options:
      - text: "`#0(9), #0(8), … #0(1), #0(Liftoff!), ` — nine numbers then `Liftoff!`"
        correct: true
      - text: "`#0(10), #0(9), … #0(1), ` — ten numbers, no `Liftoff!`"
        feedback: "`countDown--` is post-decrement: the test sees 10, then `status()` sees 9; the last pass sees 0 and prints `Liftoff!`."
      - text: "Nothing — a `Runnable` needs a `Thread` to run"
        feedback: "It prints when someone calls `run()`, on whatever thread that is."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

