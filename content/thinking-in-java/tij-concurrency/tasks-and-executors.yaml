  - type: choice
    id: tij-concurrency-basicthreads
    prompt: |
      What comes out first?
    code: |
      //: concurrency/BasicThreads.java
      // The most basic use of the Thread class.

      public class BasicThreads {
        public static void main(String[] args) {
          Thread t = new Thread(new LiftOff());
          t.start();
          System.out.println("Waiting for LiftOff");
        }
      }

      //: concurrency/LiftOff.java
      // Demonstration of the Runnable interface.

      public class LiftOff implements Runnable {
        protected int countDown = 10; // Default
        private static int taskCount = 0;
        private final int id = taskCount++;
        public LiftOff() {}
        public LiftOff(int countDown) {
          this.countDown = countDown;
        }
        public String status() {
          return "#" + id + "(" +
            (countDown > 0 ? countDown : "Liftoff!") + "), ";
        }
        public void run() {
          while(countDown-- > 0) {
            System.out.print(status());
            Thread.yield();
          }
        }
      }
    language: java
    options:
      - text: "Usually `Waiting for LiftOff` — `start()` returns at once, before the new thread gets going"
        correct: true
      - text: "Always the countdown — `start()` waits for `run()` to finish"
        feedback: "`start()` doesn't wait; that's what makes it concurrent."
      - text: "Only `Waiting for LiftOff` — `main` ends before the thread runs"
        feedback: "A normal (non-daemon) thread keeps the JVM alive until it finishes."
    explanation: |
      On a Java 21 run, `Waiting for LiftOff` came first, then the whole countdown. The order isn't guaranteed.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

