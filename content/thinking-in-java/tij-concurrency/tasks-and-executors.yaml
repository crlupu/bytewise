  - type: choice
    id: tij-concurrency-cachedthreadpool
    prompt: |
      What does `exec.shutdown()` do here?
    code: |
      //: concurrency/CachedThreadPool.java
      import java.util.concurrent.*;

      public class CachedThreadPool {
        public static void main(String[] args) {
          ExecutorService exec = Executors.newCachedThreadPool();
          for(int i = 0; i < 5; i++)
            exec.execute(new LiftOff());
          exec.shutdown();
        }
      }

      //: concurrency/LiftOff.java
      // Demonstration of the Runnable interface.

      public class LiftOff implements Runnable {
        protected int countDown = 10; // Default
        private static int taskCount = 0;
        private final int id = taskCount++;
        public LiftOff() {}
        public LiftOff(int countDown) {
          this.countDown = countDown;
        }
        public String status() {
          return "#" + id + "(" +
            (countDown > 0 ? countDown : "Liftoff!") + "), ";
        }
        public void run() {
          while(countDown-- > 0) {
            System.out.print(status());
            Thread.yield();
          }
        }
      }
    language: java
    options:
      - text: "Stops new tasks from being submitted; the five already submitted still run to completion"
        correct: true
      - text: "Interrupts the five tasks right away"
        feedback: "That's `shutdownNow()`."
      - text: "Waits for the tasks to finish before returning"
        feedback: "That's `awaitTermination()`; `shutdown()` returns immediately."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

