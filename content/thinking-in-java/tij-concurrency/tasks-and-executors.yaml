  - type: choice
    id: tij-concurrency-simplepriorities
    prompt: |
      Five threads run at `MIN_PRIORITY` and one at `MAX_PRIORITY`. What can you rely on?
    code: |
      //: concurrency/SimplePriorities.java
      // Shows the use of thread priorities.
      import java.util.concurrent.*;

      public class SimplePriorities implements Runnable {
        private int countDown = 5;
        private volatile double d; // No optimization
        private int priority;
        public SimplePriorities(int priority) {
          this.priority = priority;
        }
        public String toString() {
          return Thread.currentThread() + ": " + countDown;
        }
        public void run() {
          Thread.currentThread().setPriority(priority);
          while(true) {
            // An expensive, interruptable operation:
            for(int i = 1; i < 100000; i++) {
              d += (Math.PI + Math.E) / (double)i;
              if(i % 1000 == 0)
                Thread.yield();
            }
            System.out.println(this);
            if(--countDown == 0) return;
          }
        }
        public static void main(String[] args) {
          ExecutorService exec = Executors.newCachedThreadPool();
          for(int i = 0; i < 5; i++)
            exec.execute(
              new SimplePriorities(Thread.MIN_PRIORITY));
          exec.execute(
              new SimplePriorities(Thread.MAX_PRIORITY));
          exec.shutdown();
        }
      }
    language: java
    options:
      - text: "Very little — priority is a hint to the OS scheduler; the high-priority thread may tend to finish first, but the order isn't guaranteed"
        correct: true
      - text: "The MAX_PRIORITY thread prints all five lines before any other thread prints"
        feedback: "On a Java 21 run, low-priority threads printed between its lines."
      - text: "Low-priority threads never run while a high-priority one is runnable"
        feedback: "Java doesn't promise strict priority scheduling."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-simplethread
    prompt: |
      What's a drawback of calling `start()` inside the constructor, as `SimpleThread` does?
    code: |
      //: concurrency/SimpleThread.java
      // Inheriting directly from the Thread class.

      public class SimpleThread extends Thread {
        private int countDown = 5;
        private static int threadCount = 0;
        public SimpleThread() {
          // Store the thread name:
          super(Integer.toString(++threadCount));
          start();
        }
        public String toString() {
          return "#" + getName() + "(" + countDown + "), ";
        }
        public void run() {
          while(true) {
            System.out.print(this);
            if(--countDown == 0)
              return;
          }
        }
        public static void main(String[] args) {
          for(int i = 0; i < 5; i++)
            new SimpleThread();
        }
      }
    language: java
    options:
      - text: "The thread can start running before the constructor (and any subclass constructor) has finished, so it may see a half-built object"
        correct: true
      - text: "It doesn't compile"
        feedback: "It compiles and runs."
      - text: "The thread runs on the caller's thread"
        feedback: "`start()` always creates a new thread."
    explanation: |
      The book recommends executors over starting threads in constructors for exactly this reason.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

