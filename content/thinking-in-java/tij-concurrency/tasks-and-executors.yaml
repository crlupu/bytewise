  - type: predict
    id: tij-concurrency-callabledemo
    prompt: |
      Ten `TaskWithResult` tasks are submitted to a cached pool and may finish in any order. What does this print?
    code: |
      //: concurrency/CallableDemo.java
      import java.util.concurrent.*;
      import java.util.*;

      class TaskWithResult implements Callable<String> {
        private int id;
        public TaskWithResult(int id) {
          this.id = id;
        }
        public String call() {
          return "result of TaskWithResult " + id;
        }
      }

      public class CallableDemo {
        public static void main(String[] args) {
          ExecutorService exec = Executors.newCachedThreadPool();
          ArrayList<Future<String>> results =
            new ArrayList<Future<String>>();
          for(int i = 0; i < 10; i++)
            results.add(exec.submit(new TaskWithResult(i)));
          for(Future<String> fs : results)
            try {
              // get() blocks until completion:
              System.out.println(fs.get());
            } catch(InterruptedException e) {
              System.out.println(e);
              return;
            } catch(ExecutionException e) {
              System.out.println(e);
            } finally {
              exec.shutdown();
            }
        }
      }
    language: java
    options:
      - text: "result of TaskWithResult 0\nresult of TaskWithResult 1\nresult of TaskWithResult 2\nresult of TaskWithResult 3\nresult of TaskWithResult 4\nresult of TaskWithResult 5\nresult of TaskWithResult 6\nresult of TaskWithResult 7\nresult of TaskWithResult 8\nresult of TaskWithResult 9"
        correct: true
      - text: "The ten results in whatever order the tasks finished"
        feedback: "The loop walks the `Future`s in submission order, and `get()` waits for each one."
      - text: "java.util.concurrent.RejectedExecutionException"
        feedback: "`shutdown()` in the `finally` stops new submissions, but every task was already submitted before the loop."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
