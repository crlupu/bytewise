      //: concurrency/SelfManaged.java
      // A Runnable containing its own driver Thread.

      public class SelfManaged implements Runnable {
        private int countDown = 5;
        private Thread t = new Thread(this);
        public SelfManaged() { t.start(); }
        public String toString() {
          return Thread.currentThread().getName() +
            "(" + countDown + "), ";
        }
        public void run() {
          while(true) {
            System.out.print(this);
            if(--countDown == 0)
              return;
          }
        }
        public static void main(String[] args) {
          for(int i = 0; i < 5; i++)
            new SelfManaged();
        }
      }
    language: java
    options:
      - text: "The name of the thread running the task (`Thread-0`…`Thread-4`) and the current count"
        correct: true
      - text: "Always `main`"
        feedback: "`run()` executes on the thread `t`, so `currentThread()` is that thread."
      - text: "The object's hash code"
        feedback: "`toString()` is overridden."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-threadvariations
    prompt: |
      Five classes each create a thread that prints its name and a count from 5 down to 1, sleeping 10 ms between prints. What does the output look like? (`print` is `println`.)
    code: |
      //: concurrency/ThreadVariations.java
      // Creating threads with inner classes.
      import java.util.concurrent.*;
      import static net.mindview.util.Print.*;

      // Using a named inner class:
      class InnerThread1 {
        private int countDown = 5;
        private Inner inner;
        private class Inner extends Thread {
          Inner(String name) {
            super(name);
            start();
          }
          public void run() {
            try {
              while(true) {
                print(this);
                if(--countDown == 0) return;
                sleep(10);
              }
            } catch(InterruptedException e) {
              print("interrupted");
            }
          }
          public String toString() {
            return getName() + ": " + countDown;
          }
        }
        public InnerThread1(String name) {
          inner = new Inner(name);
        }
      }

      // Using an anonymous inner class:
      class InnerThread2 {
        private int countDown = 5;
        private Thread t;
        public InnerThread2(String name) {
          t = new Thread(name) {
            public void run() {
              try {
                while(true) {
                  print(this);
                  if(--countDown == 0) return;
                  sleep(10);
                }
              } catch(InterruptedException e) {
                print("sleep() interrupted");
              }
            }
            public String toString() {
              return getName() + ": " + countDown;
            }
          };
          t.start();
        }
      }

      // Using a named Runnable implementation:
      class InnerRunnable1 {
        private int countDown = 5;
        private Inner inner;
        private class Inner implements Runnable {
          Thread t;
          Inner(String name) {
            t = new Thread(this, name);
            t.start();
          }
          public void run() {
            try {
              while(true) {
                print(this);
                if(--countDown == 0) return;
                TimeUnit.MILLISECONDS.sleep(10);
              }
            } catch(InterruptedException e) {
              print("sleep() interrupted");
            }
          }
          public String toString() {
            return t.getName() + ": " + countDown;
          }
        }
        public InnerRunnable1(String name) {
          inner = new Inner(name);
        }
      }

      // Using an anonymous Runnable implementation:
      class InnerRunnable2 {
        private int countDown = 5;
        private Thread t;
        public InnerRunnable2(String name) {
          t = new Thread(new Runnable() {
            public void run() {
              try {
                while(true) {
                  print(this);
                  if(--countDown == 0) return;
                  TimeUnit.MILLISECONDS.sleep(10);
                }
              } catch(InterruptedException e) {
                print("sleep() interrupted");
              }
            }
            public String toString() {
              return Thread.currentThread().getName() +
                ": " + countDown;
            }
          }, name);
          t.start();
        }
      }

      // A separate method to run some code as a task:
      class ThreadMethod {
        private int countDown = 5;
        private Thread t;
        private String name;
        public ThreadMethod(String name) { this.name = name; }
        public void runTask() {
          if(t == null) {
            t = new Thread(name) {
              public void run() {
                try {
                  while(true) {
                    print(this);
                    if(--countDown == 0) return;
                    sleep(10);
                  }
                } catch(InterruptedException e) {
                  print("sleep() interrupted");
                }
              }
              public String toString() {
                return getName() + ": " + countDown;
              }
            };
            t.start();
          }
        }
      }

      public class ThreadVariations {
        public static void main(String[] args) {
          new InnerThread1("InnerThread1");
          new InnerThread2("InnerThread2");
          new InnerRunnable1("InnerRunnable1");
          new InnerRunnable2("InnerRunnable2");
          new ThreadMethod("ThreadMethod").runTask();
        }
      }
