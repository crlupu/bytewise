  - type: choice
    id: tij-concurrency-listcomparisons
    prompt: |
      Readers call `get()` and writers call `set()`. Which list is fast for readers, and when does it get slow?
    code: |
      //: concurrency/ListComparisons.java
      // Rough comparison of thread-safe List performance.
      import java.util.concurrent.*;
      import java.util.*;
      import net.mindview.util.*;

      abstract class ListTest extends Tester<List<Integer>> {
        ListTest(String testId, int nReaders, int nWriters) {
          super(testId, nReaders, nWriters);
        }
        class Reader extends TestTask {
          long result = 0;
          void test() {
            for(long i = 0; i < testCycles; i++)
              for(int index = 0; index < containerSize; index++)
                result += testContainer.get(index);
          }
          void putResults() {
            readResult += result;
            readTime += duration;
          }
        }
        class Writer extends TestTask {
          void test() {
            for(long i = 0; i < testCycles; i++)
              for(int index = 0; index < containerSize; index++)
                testContainer.set(index, writeData[index]);
          }
          void putResults() {
            writeTime += duration;
          }
        }
        void startReadersAndWriters() {
          for(int i = 0; i < nReaders; i++)
            exec.execute(new Reader());
          for(int i = 0; i < nWriters; i++)
            exec.execute(new Writer());
        }
      }

      class SynchronizedArrayListTest extends ListTest {
        List<Integer> containerInitializer() {
          return Collections.synchronizedList(
            new ArrayList<Integer>(
              new CountingIntegerList(containerSize)));
        }
        SynchronizedArrayListTest(int nReaders, int nWriters) {
          super("Synched ArrayList", nReaders, nWriters);
        }
      }

      class CopyOnWriteArrayListTest extends ListTest {
        List<Integer> containerInitializer() {
          return new CopyOnWriteArrayList<Integer>(
            new CountingIntegerList(containerSize));
        }
        CopyOnWriteArrayListTest(int nReaders, int nWriters) {
          super("CopyOnWriteArrayList", nReaders, nWriters);
        }
      }

      public class ListComparisons {
        public static void main(String[] args) {
          Tester.initMain(args);
          new SynchronizedArrayListTest(10, 0);
          new SynchronizedArrayListTest(9, 1);
          new SynchronizedArrayListTest(5, 5);
          new CopyOnWriteArrayListTest(10, 0);
          new CopyOnWriteArrayListTest(9, 1);
          new CopyOnWriteArrayListTest(5, 5);
          Tester.exec.shutdown();
        }
      }
    language: java
    options:
      - text: "`CopyOnWriteArrayList`: reads take no lock, but each write copies the whole array, so it slows down with many writers"
        correct: true
      - text: "The synchronized `ArrayList` — it's fastest in every case"
        feedback: "Every read on it takes the lock."
      - text: "They perform the same"
        feedback: "In the book's run, synchronized reads were hundreds of times slower."
    explanation: |
