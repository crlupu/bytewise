    id: tij-concurrency-readerwriterlist
    prompt: |
      `get()` prints `getReadLockCount()` whenever it's above 1. What do the printed numbers show? (`print` is `println`.)
    code: |
      //: concurrency/ReaderWriterList.java
      import java.util.concurrent.*;
      import java.util.concurrent.locks.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class ReaderWriterList<T> {
        private ArrayList<T> lockedList;
        // Make the ordering fair:
        private ReentrantReadWriteLock lock =
          new ReentrantReadWriteLock(true);
        public ReaderWriterList(int size, T initialValue) {
          lockedList = new ArrayList<T>(
            Collections.nCopies(size, initialValue));
        }
        public T set(int index, T element) {
          Lock wlock = lock.writeLock();
          wlock.lock();
          try {
            return lockedList.set(index, element);
          } finally {
            wlock.unlock();
          }
        }
        public T get(int index) {
          Lock rlock = lock.readLock();
          rlock.lock();
          try {
            // Show that multiple readers
            // may acquire the read lock:
            if(lock.getReadLockCount() > 1)
              print(lock.getReadLockCount());
            return lockedList.get(index);
          } finally {
            rlock.unlock();
          }
        }
        public static void main(String[] args) throws Exception {
          new ReaderWriterListTest(30, 1);
        }
      }

      class ReaderWriterListTest {
        ExecutorService exec = Executors.newCachedThreadPool();
        private final static int SIZE = 100;
        private static Random rand = new Random(47);
        private ReaderWriterList<Integer> list =
          new ReaderWriterList<Integer>(SIZE, 0);
        private class Writer implements Runnable {
          public void run() {
            try {
              for(int i = 0; i < 20; i++) { // 2 second test
                list.set(i, rand.nextInt());
                TimeUnit.MILLISECONDS.sleep(100);
              }
            } catch(InterruptedException e) {
              // Acceptable way to exit
            }
            print("Writer finished, shutting down");
            exec.shutdownNow();
          }
        }
        private class Reader implements Runnable {
          public void run() {
            try {
              while(!Thread.interrupted()) {
                for(int i = 0; i < SIZE; i++) {
                  list.get(i);
                  TimeUnit.MILLISECONDS.sleep(1);
                }
              }
            } catch(InterruptedException e) {
              // Acceptable way to exit
            }
          }
        }
        public ReaderWriterListTest(int readers, int writers) {
          for(int i = 0; i < readers; i++)
            exec.execute(new Reader());
          for(int i = 0; i < writers; i++)
            exec.execute(new Writer());
        }
      }
    language: java
    options:
      - text: "That several readers hold the read lock at once — the write lock alone is exclusive"
        correct: true
      - text: "How many writers are waiting"
        feedback: "It counts read-lock holds."
      - text: "Nothing is printed — a read lock is exclusive"
        feedback: "Read locks are shared; on Java 21 it printed over 2,000 counts."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-activeobjectdemo
    prompt: |
      Why is `results` a `CopyOnWriteArrayList`? (`print` is `println`.)
    code: |
      //: concurrency/ActiveObjectDemo.java
      // Can only pass constants, immutables, "disconnected
      // objects," or other active objects as arguments
      // to asynch methods.
      import java.util.concurrent.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class ActiveObjectDemo {
        private ExecutorService ex =
          Executors.newSingleThreadExecutor();
        private Random rand = new Random(47);
        // Insert a random delay to produce the effect
        // of a calculation time:
        private void pause(int factor) {
          try {
            TimeUnit.MILLISECONDS.sleep(
              100 + rand.nextInt(factor));
          } catch(InterruptedException e) {
            print("sleep() interrupted");
          }
        }
        public Future<Integer>
        calculateInt(final int x, final int y) {
          return ex.submit(new Callable<Integer>() {
            public Integer call() {
              print("starting " + x + " + " + y);
              pause(500);
              return x + y;
            }
          });
        }
        public Future<Float>
        calculateFloat(final float x, final float y) {
          return ex.submit(new Callable<Float>() {
            public Float call() {
              print("starting " + x + " + " + y);
              pause(2000);
              return x + y;
            }
          });
        }
        public void shutdown() { ex.shutdown(); }
        public static void main(String[] args) {
          ActiveObjectDemo d1 = new ActiveObjectDemo();
          List<Future<?>> results =
            new CopyOnWriteArrayList<Future<?>>();
          for(float f = 0.0f; f < 1.0f; f += 0.2f)
            results.add(d1.calculateFloat(f, f));
          for(int i = 0; i < 5; i++)
            results.add(d1.calculateInt(i, i));
          print("All asynch calls made");
          while(results.size() > 0) {
            for(Future<?> f : results)
              if(f.isDone()) {
                try {
                  print(f.get());
                } catch(Exception e) {
                  throw new RuntimeException(e);
                }
                results.remove(f);
              }
          }
          d1.shutdown();
        }
      }
    language: java
    options:
      - text: "The loop removes finished futures while iterating over the list; a copy-on-write list iterates over a snapshot, so that's safe"
        correct: true
      - text: "Because the executor's thread adds to it"
        feedback: "Only `main` touches `results`."
      - text: "To keep the results in order"
        feedback: "Any `List` keeps insertion order."
    explanation: |
      All calls run on one thread of a single-thread executor, so the calculations happen one at a time, in the order they were made. That's the point of an active object.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
