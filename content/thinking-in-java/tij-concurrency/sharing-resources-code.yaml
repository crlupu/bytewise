  - type: choice
    id: tij-concurrency-syncobject
    prompt: |
      `f()` is `synchronized` (locks `ds`), and `g()` locks `syncObject`. Can their output interleave? (`print` is `println`.)
    code: |
      //: concurrency/SyncObject.java
      // Synchronizing on another object.
      import static net.mindview.util.Print.*;

      class DualSynch {
        private Object syncObject = new Object();
        public synchronized void f() {
          for(int i = 0; i < 5; i++) {
            print("f()");
            Thread.yield();
          }
        }
        public void g() {
          synchronized(syncObject) {
            for(int i = 0; i < 5; i++) {
              print("g()");
              Thread.yield();
            }
          }
        }
      }

      public class SyncObject {
        public static void main(String[] args) {
          final DualSynch ds = new DualSynch();
          new Thread() {
            public void run() {
              ds.f();
            }
          }.start();
          ds.g();
        }
      }
    language: java
    options:
      - text: "Yes — they hold different locks, so both can run at once"
        correct: true
      - text: "No — all of `f()`'s lines come before or after all of `g()`'s"
        feedback: "That would need both to lock the same object."
    explanation: |
      On a Java 21 run: `g() g() f() f() f() f() f() g() g() g()`.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-threadlocalvariableholder
    prompt: |
      Five threads call `increment()` on the static `value`. Do they interfere with each other?
    code: |
      //: concurrency/ThreadLocalVariableHolder.java
      // Automatically giving each thread its own storage.
      import java.util.concurrent.*;
      import java.util.*;

      class Accessor implements Runnable {
        private final int id;
        public Accessor(int idn) { id = idn; }
        public void run() {
          while(!Thread.currentThread().isInterrupted()) {
            ThreadLocalVariableHolder.increment();
            System.out.println(this);
            Thread.yield();
          }
        }
        public String toString() {
          return "#" + id + ": " +
            ThreadLocalVariableHolder.get();
        }
      }

      public class ThreadLocalVariableHolder {
        private static ThreadLocal<Integer> value =
          new ThreadLocal<Integer>() {
            private Random rand = new Random(47);
            protected synchronized Integer initialValue() {
              return rand.nextInt(10000);
            }
          };
        public static void increment() {
          value.set(value.get() + 1);
        }
        public static int get() { return value.get(); }
        public static void main(String[] args) throws Exception {
          ExecutorService exec = Executors.newCachedThreadPool();
          for(int i = 0; i < 5; i++)
            exec.execute(new Accessor(i));
          TimeUnit.SECONDS.sleep(3);  // Run for a while
          exec.shutdownNow();         // All Accessors will quit
        }
      }
    language: java
    options:
      - text: "No — `ThreadLocal` keeps a separate value per thread; each thread counts up from its own random start"
        correct: true
      - text: "Yes — `value` is static, so they share one counter"
        feedback: "The `ThreadLocal` object is shared, but each thread sees its own value."
      - text: "They would without `synchronized` on `increment()`"
        feedback: "Nothing is shared, so nothing needs locking."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
