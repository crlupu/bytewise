  - type: choice
    id: tij-concurrency-pool
    prompt: |
      What does the `Semaphore` add on top of the `synchronized` `getItem()`?
    code: |
      //: concurrency/Pool.java
      // Using a Semaphore inside a Pool, to restrict
      // the number of tasks that can use a resource.
      import java.util.concurrent.*;
      import java.util.*;

      public class Pool<T> {
        private int size;
        private List<T> items = new ArrayList<T>();
        private volatile boolean[] checkedOut;
        private Semaphore available;
        public Pool(Class<T> classObject, int size) {
          this.size = size;
          checkedOut = new boolean[size];
          available = new Semaphore(size, true);
          // Load pool with objects that can be checked out:
          for(int i = 0; i < size; ++i)
            try {
              // Assumes a default constructor:
              items.add(classObject.newInstance());
            } catch(Exception e) {
              throw new RuntimeException(e);
            }
        }
        public T checkOut() throws InterruptedException {
          available.acquire();
          return getItem();
        }
        public void checkIn(T x) {
          if(releaseItem(x))
            available.release();
        }
        private synchronized T getItem() {
          for(int i = 0; i < size; ++i)
            if(!checkedOut[i]) {
              checkedOut[i] = true;
              return items.get(i);
            }
          return null; // Semaphore prevents reaching here
        }
        private synchronized boolean releaseItem(T item) {
          int index = items.indexOf(item);
          if(index == -1) return false; // Not in the list
          if(checkedOut[index]) {
            checkedOut[index] = false;
            return true;
          }
          return false; // Wasn't checked out
        }
      }
    language: java
    options:
      - text: "It makes `checkOut()` block when every item is checked out, until one is checked back in"
        correct: true
      - text: "Mutual exclusion inside `getItem()`"
        feedback: "`synchronized` already provides that; the semaphore counts free items."
      - text: "Nothing; it's redundant"
        feedback: "Without it, `getItem()` would return `null` when the pool is empty."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-semaphoredemo
    prompt: |
      `main` checks out all 25 `Fat` objects, then a task calls `pool.checkOut()` once more. What happens to that task? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: concurrency/SemaphoreDemo.java
      // Testing the Pool class
      import java.util.concurrent.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      // A task to check a resource out of a pool:
      class CheckoutTask<T> implements Runnable {
        private static int counter = 0;
        private final int id = counter++;
        private Pool<T> pool;
        public CheckoutTask(Pool<T> pool) {
          this.pool = pool;
        }
        public void run() {
          try {
            T item = pool.checkOut();
            print(this + "checked out " + item);
            TimeUnit.SECONDS.sleep(1);
            print(this +"checking in " + item);
            pool.checkIn(item);
          } catch(InterruptedException e) {
            // Acceptable way to terminate
          }
        }
        public String toString() {
          return "CheckoutTask " + id + " ";
        }
      }

      public class SemaphoreDemo {
        final static int SIZE = 25;
        public static void main(String[] args) throws Exception {
          final Pool<Fat> pool =
            new Pool<Fat>(Fat.class, SIZE);
          ExecutorService exec = Executors.newCachedThreadPool();
          for(int i = 0; i < SIZE; i++)
            exec.execute(new CheckoutTask<Fat>(pool));
          print("All CheckoutTasks created");
          List<Fat> list = new ArrayList<Fat>();
          for(int i = 0; i < SIZE; i++) {
            Fat f = pool.checkOut();
            printnb(i + ": main() thread checked out ");
            f.operation();
            list.add(f);
          }
          Future<?> blocked = exec.submit(new Runnable() {
            public void run() {
              try {
                // Semaphore prevents additional checkout,
                // so call is blocked:
                pool.checkOut();
              } catch(InterruptedException e) {
                print("checkOut() Interrupted");
              }
            }
          });
          TimeUnit.SECONDS.sleep(2);
          blocked.cancel(true); // Break out of blocked call
          print("Checking in objects in " + list);
          for(Fat f : list)
            pool.checkIn(f);
          for(Fat f : list)
            pool.checkIn(f); // Second checkIn ignored
          exec.shutdown();
        }
      }
    language: java
    options:
      - text: "It blocks in `acquire()` until `cancel(true)` interrupts it — `checkOut() Interrupted`"
        correct: true
      - text: "It gets `null`"
        feedback: "The semaphore blocks before `getItem()` is reached."
      - text: "It gets a second reference to a checked-out object"
        feedback: "`checkedOut[]` prevents that."
    explanation: |
      The second loop of `checkIn` calls is ignored: `releaseItem` returns `false` for items that aren't checked out, so no extra permits are released.

