title: "The java.util.concurrent toolkit"
summary: "CountDownLatch, CyclicBarrier, DelayQueue, PriorityBlockingQueue, scheduled executors, Semaphore and Exchanger."
duration: 8
tags: [java, concurrency, CountDownLatch, CyclicBarrier, DelayQueue, Semaphore, Exchanger]
sources:
  - { book: thinking-in-java, ref: "Chapter 21, New library components" }
steps:
  - type: explanation
    title: "Synchronizers"
    body: |
      A `CountDownLatch(n)` lets tasks `await()` until `countDown()` has been called n times; it can't be reset.
      A `CyclicBarrier(n, action)` makes n tasks wait for each other, runs the action, then resets for the next round.
      A `Semaphore(n)` hands out n permits; `acquire()` blocks when none are left.
      An `Exchanger` swaps objects between two tasks.

  - type: explanation
    title: "Special queues and scheduling"
    body: |
      A `DelayQueue` hands out an element only after its delay has expired, soonest first.
      A `PriorityBlockingQueue` hands out the element that `compareTo` puts first.
      A `ScheduledThreadPoolExecutor` runs tasks once after a delay (`schedule`) or repeatedly (`scheduleAtFixedRate`).

  - type: choice
    id: tij-concurrency-countdownlatchdemo
    prompt: |
      Ten `WaitingTask`s `await()` a latch of 100; each of 100 `TaskPortion`s sleeps randomly, prints `completed`, and counts down. When do the `Latch barrier passed` lines appear? (`print` is `println`.)
    code: |
      //: concurrency/CountDownLatchDemo.java
      import java.util.concurrent.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      // Performs some portion of a task:
      class TaskPortion implements Runnable {
        private static int counter = 0;
        private final int id = counter++;
        private static Random rand = new Random(47);
        private final CountDownLatch latch;
        TaskPortion(CountDownLatch latch) {
          this.latch = latch;
        }
        public void run() {
          try {
            doWork();
            latch.countDown();
          } catch(InterruptedException ex) {
            // Acceptable way to exit
          }
        }
        public void doWork() throws InterruptedException {
          TimeUnit.MILLISECONDS.sleep(rand.nextInt(2000));
          print(this + "completed");
        }
        public String toString() {
          return String.format("%1$-3d ", id);
        }
      }

      // Waits on the CountDownLatch:
      class WaitingTask implements Runnable {
        private static int counter = 0;
        private final int id = counter++;
        private final CountDownLatch latch;
        WaitingTask(CountDownLatch latch) {
          this.latch = latch;
        }
        public void run() {
          try {
            latch.await();
            print("Latch barrier passed for " + this);
          } catch(InterruptedException ex) {
            print(this + " interrupted");
          }
        }
        public String toString() {
          return String.format("WaitingTask %1$-3d ", id);
        }
      }

      public class CountDownLatchDemo {
        static final int SIZE = 100;
        public static void main(String[] args) throws Exception {
          ExecutorService exec = Executors.newCachedThreadPool();
          // All must share a single CountDownLatch object:
          CountDownLatch latch = new CountDownLatch(SIZE);
          for(int i = 0; i < 10; i++)
            exec.execute(new WaitingTask(latch));
          for(int i = 0; i < SIZE; i++)
            exec.execute(new TaskPortion(latch));
          print("Launched all tasks");
          exec.shutdown(); // Quit when all tasks complete
        }
      }
    language: java
    options:
      - text: "Only after all 100 `completed` lines"
        correct: true
      - text: "Mixed in among the `completed` lines"
        feedback: "`await()` blocks until the count reaches zero."
      - text: "Never — `shutdown()` stops the waiting tasks"
        feedback: "`shutdown()` lets running tasks finish."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-horserace
    prompt: |
      Each horse adds 0–2 strides, then calls `barrier.await()`. When does the barrier action (drawing the track) run? (`print` is `println`.)
    code: |
      //: concurrency/HorseRace.java
      // Using CyclicBarriers.
      import java.util.concurrent.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      class Horse implements Runnable {
        private static int counter = 0;
        private final int id = counter++;
        private int strides = 0;
        private static Random rand = new Random(47);
        private static CyclicBarrier barrier;
        public Horse(CyclicBarrier b) { barrier = b; }
        public synchronized int getStrides() { return strides; }
        public void run() {
          try {
            while(!Thread.interrupted()) {
              synchronized(this) {
                strides += rand.nextInt(3); // Produces 0, 1 or 2
              }
              barrier.await();
            }
          } catch(InterruptedException e) {
            // A legitimate way to exit
          } catch(BrokenBarrierException e) {
            // This one we want to know about
            throw new RuntimeException(e);
          }
        }
        public String toString() { return "Horse " + id + " "; }
        public String tracks() {
          StringBuilder s = new StringBuilder();
          for(int i = 0; i < getStrides(); i++)
            s.append("*");
          s.append(id);
          return s.toString();
        }
      }

      public class HorseRace {
        static final int FINISH_LINE = 75;
        private List<Horse> horses = new ArrayList<Horse>();
        private ExecutorService exec =
          Executors.newCachedThreadPool();
        private CyclicBarrier barrier;
        public HorseRace(int nHorses, final int pause) {
          barrier = new CyclicBarrier(nHorses, new Runnable() {
            public void run() {
              StringBuilder s = new StringBuilder();
              for(int i = 0; i < FINISH_LINE; i++)
                s.append("="); // The fence on the racetrack
              print(s);
              for(Horse horse : horses)
                print(horse.tracks());
              for(Horse horse : horses)
                if(horse.getStrides() >= FINISH_LINE) {
                  print(horse + "won!");
                  exec.shutdownNow();
                  return;
                }
              try {
                TimeUnit.MILLISECONDS.sleep(pause);
              } catch(InterruptedException e) {
                print("barrier-action sleep interrupted");
              }
            }
          });
          for(int i = 0; i < nHorses; i++) {
            Horse horse = new Horse(barrier);
            horses.add(horse);
            exec.execute(horse);
          }
        }
        public static void main(String[] args) {
          int nHorses = 7;
          int pause = 200;
          if(args.length > 0) { // Optional argument
            int n = new Integer(args[0]);
            nHorses = n > 0 ? n : nHorses;
          }
          if(args.length > 1) { // Optional argument
            int p = new Integer(args[1]);
            pause = p > -1 ? p : pause;
          }
          new HorseRace(nHorses, pause);
        }
      }
    language: java
    options:
      - text: "Each time all seven horses have reached `await()` — once per round, before any of them takes the next step"
        correct: true
      - text: "After each horse's step"
        feedback: "The action runs once, when the last of the 7 arrives."
      - text: "Only at the end of the race"
        feedback: "The barrier resets and its action runs every round."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-delayqueuedemo
    prompt: |
      Twenty tasks are queued with random delays, plus an `EndSentinel` at 5000 ms. In what order does the consumer run them? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: concurrency/DelayQueueDemo.java
      import java.util.concurrent.*;
      import java.util.*;
      import static java.util.concurrent.TimeUnit.*;
      import static net.mindview.util.Print.*;

      class DelayedTask implements Runnable, Delayed {
        private static int counter = 0;
        private final int id = counter++;
        private final int delta;
        private final long trigger;
        protected static List<DelayedTask> sequence =
          new ArrayList<DelayedTask>();
        public DelayedTask(int delayInMilliseconds) {
          delta = delayInMilliseconds;
          trigger = System.nanoTime() +
            NANOSECONDS.convert(delta, MILLISECONDS);
          sequence.add(this);
        }
        public long getDelay(TimeUnit unit) {
          return unit.convert(
            trigger - System.nanoTime(), NANOSECONDS);
        }
        public int compareTo(Delayed arg) {
          DelayedTask that = (DelayedTask)arg;
          if(trigger < that.trigger) return -1;
          if(trigger > that.trigger) return 1;
          return 0;
        }
        public void run() { printnb(this + " "); }
        public String toString() {
          return String.format("[%1$-4d]", delta) +
            " Task " + id;
        }
        public String summary() {
          return "(" + id + ":" + delta + ")";
        }
        public static class EndSentinel extends DelayedTask {
          private ExecutorService exec;
          public EndSentinel(int delay, ExecutorService e) {
            super(delay);
            exec = e;
          }
          public void run() {
            for(DelayedTask pt : sequence) {
              printnb(pt.summary() + " ");
            }
            print();
            print(this + " Calling shutdownNow()");
            exec.shutdownNow();
          }
        }
      }

      class DelayedTaskConsumer implements Runnable {
        private DelayQueue<DelayedTask> q;
        public DelayedTaskConsumer(DelayQueue<DelayedTask> q) {
          this.q = q;
        }
        public void run() {
          try {
            while(!Thread.interrupted())
              q.take().run(); // Run task with the current thread
          } catch(InterruptedException e) {
            // Acceptable way to exit
          }
          print("Finished DelayedTaskConsumer");
        }
      }

      public class DelayQueueDemo {
        public static void main(String[] args) {
          Random rand = new Random(47);
          ExecutorService exec = Executors.newCachedThreadPool();
          DelayQueue<DelayedTask> queue =
            new DelayQueue<DelayedTask>();
          // Fill with tasks that have random delays:
          for(int i = 0; i < 20; i++)
            queue.put(new DelayedTask(rand.nextInt(5000)));
          // Set the stopping point
          queue.add(new DelayedTask.EndSentinel(5000, exec));
          exec.execute(new DelayedTaskConsumer(queue));
        }
      }
    language: java
    options:
      - text: "By delay, shortest first — `[128 ] Task 11`, `[200 ] Task 7`, … — and the sentinel runs last and calls `shutdownNow()`"
        correct: true
      - text: "In the order they were added, Task 0 first"
        feedback: "`take()` returns only expired elements, soonest-expiring first."
      - text: "Longest delay first"
        feedback: "`compareTo` puts the earliest trigger time first."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-priorityblockingqueuedemo
    prompt: |
      `compareTo` returns 1 when this task's priority is lower. Which task does `take()` hand out? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: concurrency/PriorityBlockingQueueDemo.java
      import java.util.concurrent.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      class PrioritizedTask implements
      Runnable, Comparable<PrioritizedTask>  {
        private Random rand = new Random(47);
        private static int counter = 0;
        private final int id = counter++;
        private final int priority;
        protected static List<PrioritizedTask> sequence =
          new ArrayList<PrioritizedTask>();
        public PrioritizedTask(int priority) {
          this.priority = priority;
          sequence.add(this);
        }
        public int compareTo(PrioritizedTask arg) {
          return priority < arg.priority ? 1 :
            (priority > arg.priority ? -1 : 0);
        }
        public void run() {
          try {
            TimeUnit.MILLISECONDS.sleep(rand.nextInt(250));
          } catch(InterruptedException e) {
            // Acceptable way to exit
          }
          print(this);
        }
        public String toString() {
          return String.format("[%1$-3d]", priority) +
            " Task " + id;
        }
        public String summary() {
          return "(" + id + ":" + priority + ")";
        }
        public static class EndSentinel extends PrioritizedTask {
          private ExecutorService exec;
          public EndSentinel(ExecutorService e) {
            super(-1); // Lowest priority in this program
            exec = e;
          }
          public void run() {
            int count = 0;
            for(PrioritizedTask pt : sequence) {
              printnb(pt.summary());
              if(++count % 5 == 0)
                print();
            }
            print();
            print(this + " Calling shutdownNow()");
            exec.shutdownNow();
          }
        }
      }

      class PrioritizedTaskProducer implements Runnable {
        private Random rand = new Random(47);
        private Queue<Runnable> queue;
        private ExecutorService exec;
        public PrioritizedTaskProducer(
          Queue<Runnable> q, ExecutorService e) {
          queue = q;
          exec = e; // Used for EndSentinel
        }
        public void run() {
          // Unbounded queue; never blocks.
          // Fill it up fast with random priorities:
          for(int i = 0; i < 20; i++) {
            queue.add(new PrioritizedTask(rand.nextInt(10)));
            Thread.yield();
          }
          // Trickle in highest-priority jobs:
          try {
            for(int i = 0; i < 10; i++) {
              TimeUnit.MILLISECONDS.sleep(250);
              queue.add(new PrioritizedTask(10));
            }
            // Add jobs, lowest priority first:
            for(int i = 0; i < 10; i++)
              queue.add(new PrioritizedTask(i));
            // A sentinel to stop all the tasks:
            queue.add(new PrioritizedTask.EndSentinel(exec));
          } catch(InterruptedException e) {
            // Acceptable way to exit
          }
          print("Finished PrioritizedTaskProducer");
        }
      }

      class PrioritizedTaskConsumer implements Runnable {
        private PriorityBlockingQueue<Runnable> q;
        public PrioritizedTaskConsumer(
          PriorityBlockingQueue<Runnable> q) {
          this.q = q;
        }
        public void run() {
          try {
            while(!Thread.interrupted())
              // Use current thread to run the task:
              q.take().run();
          } catch(InterruptedException e) {
            // Acceptable way to exit
          }
          print("Finished PrioritizedTaskConsumer");
        }
      }

      public class PriorityBlockingQueueDemo {
        public static void main(String[] args) throws Exception {
          Random rand = new Random(47);
          ExecutorService exec = Executors.newCachedThreadPool();
          PriorityBlockingQueue<Runnable> queue =
            new PriorityBlockingQueue<Runnable>();
          exec.execute(new PrioritizedTaskProducer(queue, exec));
          exec.execute(new PrioritizedTaskConsumer(queue));
        }
      }
    language: java
    options:
      - text: "The highest priority waiting at that moment — 9s before 8s, the 10s as they trickle in, and the −1 sentinel last"
        correct: true
      - text: "The lowest priority first"
        feedback: "The comparison is reversed, so higher priority comes first."
      - text: "Strictly in priority order across the whole run"
        feedback: "Only what's in the queue at the moment counts: on a Java 21 run, a 0 ran before the later 10s arrived."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-concurrency-greenhousescheduler
    prompt: |
      Why does `Terminate` start a new `Thread` to print the collected data?
    code: |
      //: concurrency/GreenhouseScheduler.java
      // Rewriting innerclasses/GreenhouseController.java
      // to use a ScheduledThreadPoolExecutor.
      import java.util.concurrent.*;
      import java.util.*;

      public class GreenhouseScheduler {
        private volatile boolean light = false;
        private volatile boolean water = false;
        private String thermostat = "Day";
        public synchronized String getThermostat() {
          return thermostat;
        }
        public synchronized void setThermostat(String value) {
          thermostat = value;
        }
        ScheduledThreadPoolExecutor scheduler =
          new ScheduledThreadPoolExecutor(10);
        public void schedule(Runnable event, long delay) {
          scheduler.schedule(event,delay,TimeUnit.MILLISECONDS);
        }
        public void
        repeat(Runnable event, long initialDelay, long period) {
          scheduler.scheduleAtFixedRate(
            event, initialDelay, period, TimeUnit.MILLISECONDS);
        }
        class LightOn implements Runnable {
          public void run() {
            // Put hardware control code here to
            // physically turn on the light.
            System.out.println("Turning on lights");
            light = true;
          }
        }
        class LightOff implements Runnable {
          public void run() {
            // Put hardware control code here to
            // physically turn off the light.
            System.out.println("Turning off lights");
            light = false;
          }
        }
        class WaterOn implements Runnable {
          public void run() {
            // Put hardware control code here.
            System.out.println("Turning greenhouse water on");
            water = true;
          }
        }
        class WaterOff implements Runnable {
          public void run() {
            // Put hardware control code here.
            System.out.println("Turning greenhouse water off");
            water = false;
          }
        }
        class ThermostatNight implements Runnable {
          public void run() {
            // Put hardware control code here.
            System.out.println("Thermostat to night setting");
            setThermostat("Night");
          }
        }
        class ThermostatDay implements Runnable {
          public void run() {
            // Put hardware control code here.
            System.out.println("Thermostat to day setting");
            setThermostat("Day");
          }
        }
        class Bell implements Runnable {
          public void run() { System.out.println("Bing!"); }
        }
        class Terminate implements Runnable {
          public void run() {
            System.out.println("Terminating");
            scheduler.shutdownNow();
            // Must start a separate task to do this job,
            // since the scheduler has been shut down:
            new Thread() {
              public void run() {
                for(DataPoint d : data)
                  System.out.println(d);
              }
            }.start();
          }
        }
        // New feature: data collection
        static class DataPoint {
          final Calendar time;
          final float temperature;
          final float humidity;
          public DataPoint(Calendar d, float temp, float hum) {
            time = d;
            temperature = temp;
            humidity = hum;
          }
          public String toString() {
            return time.getTime() +
              String.format(
                " temperature: %1$.1f humidity: %2$.2f",
                temperature, humidity);
          }
        }
        private Calendar lastTime = Calendar.getInstance();
        { // Adjust date to the half hour
          lastTime.set(Calendar.MINUTE, 30);
          lastTime.set(Calendar.SECOND, 00);
        }
        private float lastTemp = 65.0f;
        private int tempDirection = +1;
        private float lastHumidity = 50.0f;
        private int humidityDirection = +1;
        private Random rand = new Random(47);
        List<DataPoint> data = Collections.synchronizedList(
          new ArrayList<DataPoint>());
        class CollectData implements Runnable {
          public void run() {
            System.out.println("Collecting data");
            synchronized(GreenhouseScheduler.this) {
              // Pretend the interval is longer than it is:
              lastTime.set(Calendar.MINUTE,
                lastTime.get(Calendar.MINUTE) + 30);
              // One in 5 chances of reversing the direction:
              if(rand.nextInt(5) == 4)
                tempDirection = -tempDirection;
              // Store previous value:
              lastTemp = lastTemp +
                tempDirection * (1.0f + rand.nextFloat());
              if(rand.nextInt(5) == 4)
                humidityDirection = -humidityDirection;
              lastHumidity = lastHumidity +
                humidityDirection * rand.nextFloat();
              // Calendar must be cloned, otherwise all
              // DataPoints hold references to the same lastTime.
              // For a basic object like Calendar, clone() is OK.
              data.add(new DataPoint((Calendar)lastTime.clone(),
                lastTemp, lastHumidity));
            }
          }
        }
        public static void main(String[] args) {
          GreenhouseScheduler gh = new GreenhouseScheduler();
          gh.schedule(gh.new Terminate(), 5000);
          // Former "Restart" class not necessary:
          gh.repeat(gh.new Bell(), 0, 1000);
          gh.repeat(gh.new ThermostatNight(), 0, 2000);
          gh.repeat(gh.new LightOn(), 0, 200);
          gh.repeat(gh.new LightOff(), 0, 400);
          gh.repeat(gh.new WaterOn(), 0, 600);
          gh.repeat(gh.new WaterOff(), 0, 800);
          gh.repeat(gh.new ThermostatDay(), 0, 1400);
          gh.repeat(gh.new CollectData(), 500, 500);
        }
      }
    language: java
    options:
      - text: "It has just called `scheduler.shutdownNow()`, so it can't hand more work to the scheduler"
        correct: true
      - text: "Printing is not allowed on scheduler threads"
        feedback: "Any thread can print."
      - text: "To make the data printing faster"
        feedback: "It's about the scheduler being shut down."
    explanation: |
      On a Java 21 run, the nine data points printed after `Terminating`, half an hour apart, starting from the run's own date.

