  - type: choice
    id: tij-concurrency-exchangerdemo
    prompt: |
      `BasicGenerator.create(Fat.class)` makes new `Fat` objects with the no-argument constructor. Why are the lists `CopyOnWriteArrayList`s?
    code: |
      //: concurrency/ExchangerDemo.java
      import java.util.concurrent.*;
      import java.util.*;
      import net.mindview.util.*;

      class ExchangerProducer<T> implements Runnable {
        private Generator<T> generator;
        private Exchanger<List<T>> exchanger;
        private List<T> holder;
        ExchangerProducer(Exchanger<List<T>> exchg,
        Generator<T> gen, List<T> holder) {
          exchanger = exchg;
          generator = gen;
          this.holder = holder;
        }
        public void run() {
          try {
            while(!Thread.interrupted()) {
              for(int i = 0; i < ExchangerDemo.size; i++)
                holder.add(generator.next());
              // Exchange full for empty:
              holder = exchanger.exchange(holder);
            }
          } catch(InterruptedException e) {
            // OK to terminate this way.
          }
        }
      }

      class ExchangerConsumer<T> implements Runnable {
        private Exchanger<List<T>> exchanger;
        private List<T> holder;
        private volatile T value;
        ExchangerConsumer(Exchanger<List<T>> ex, List<T> holder){
          exchanger = ex;
          this.holder = holder;
        }
        public void run() {
          try {
            while(!Thread.interrupted()) {
              holder = exchanger.exchange(holder);
              for(T x : holder) {
                value = x; // Fetch out value
                holder.remove(x); // OK for CopyOnWriteArrayList
              }
            }
          } catch(InterruptedException e) {
            // OK to terminate this way.
          }
          System.out.println("Final value: " + value);
        }
      }

      public class ExchangerDemo {
        static int size = 10;
        static int delay = 5; // Seconds
        public static void main(String[] args) throws Exception {
          if(args.length > 0)
            size = new Integer(args[0]);
          if(args.length > 1)
            delay = new Integer(args[1]);
          ExecutorService exec = Executors.newCachedThreadPool();
          Exchanger<List<Fat>> xc = new Exchanger<List<Fat>>();
          List<Fat>
            producerList = new CopyOnWriteArrayList<Fat>(),
            consumerList = new CopyOnWriteArrayList<Fat>();
          exec.execute(new ExchangerProducer<Fat>(xc,
            BasicGenerator.create(Fat.class), producerList));
          exec.execute(
            new ExchangerConsumer<Fat>(xc,consumerList));
          TimeUnit.SECONDS.sleep(delay);
          exec.shutdownNow();
        }
      }

      //: concurrency/Fat.java
      // Objects that are expensive to create.

      public class Fat {
        private volatile double d; // Prevent optimization
        private static int counter = 0;
        private final int id = counter++;
        public Fat() {
          // Expensive, interruptible operation:
          for(int i = 1; i < 10000; i++) {
            d += (Math.PI + Math.E) / (double)i;
          }
        }
        public void operation() { System.out.println(this); }
        public String toString() { return "Fat id: " + id; }
      }
    language: java
    options:
      - text: "The consumer removes items while iterating with for-each; a copy-on-write list iterates over a snapshot, so there's no `ConcurrentModificationException`"
        correct: true
      - text: "Because the two tasks use the same list at the same time"
        feedback: "The `Exchanger` swaps the lists; each is used by one task at a time."
      - text: "For speed"
        feedback: "Copy-on-write makes each `remove` copy the whole array."
    explanation: |
      On a Java 21 run with the default 5-second delay, it printed `Final value: Fat id: 55019`.

