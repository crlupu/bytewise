title: "EnumSet, EnumMap and constant-specific methods"
summary: "Fast sets and maps keyed by enums, methods that differ per constant, and enums as state machines and chains of responsibility."
duration: 8
tags: [java, enum, EnumSet, EnumMap, constant-specific methods, state machine]
sources:
  - { book: thinking-in-java, ref: "Chapter 19, Using EnumSet instead of flags; Using EnumMap; Constant-specific methods" }
steps:
  - type: explanation
    title: "EnumSet and EnumMap"
    body: |
      An `EnumSet` is a compact bit vector of enum constants, always iterated in declaration order.
      `EnumSet.of`, `range`, `allOf`, `noneOf` and `complementOf` build them.
      An `EnumMap` is a map keyed by enum constants, backed by an array, also in declaration order.

  - type: explanation
    title: "Constant-specific methods"
    body: |
      Each constant can have its own body overriding an (often abstract) method of the enum.
      That gives polymorphic behavior per constant — good for chains of responsibility and state machines.
      The constants aren't separate classes you can name, though.

  - type: choice
    id: tij-enumerated-alarmpoints
    prompt: |
      What is `EnumSet.range(OFFICE1, OFFICE4)`?
    code: |
      //: enumerated/AlarmPoints.java
      package enumerated;
      public enum AlarmPoints {
        STAIR1, STAIR2, LOBBY, OFFICE1, OFFICE2, OFFICE3,
        OFFICE4, BATHROOM, UTILITY, KITCHEN
      }
    language: java
    options:
      - text: "OFFICE1, OFFICE2, OFFICE3 and OFFICE4 — inclusive"
        correct: true
      - text: "OFFICE1 to OFFICE3"
        feedback: "`EnumSet.range` includes both ends."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-enumerated-enumsets
    prompt: |
      `AlarmPoints` is `STAIR1, STAIR2, LOBBY, OFFICE1 … OFFICE4, BATHROOM, UTILITY, KITCHEN`. After adding BATHROOM, then `addAll(EnumSet.of(STAIR1, STAIR2, KITCHEN))`, what's printed? (`print` is `println`.)
    code: |
      //: enumerated/EnumSets.java
      // Operations on EnumSets
      package enumerated;
      import java.util.*;
      import static enumerated.AlarmPoints.*;
      import static net.mindview.util.Print.*;

      public class EnumSets {
        public static void main(String[] args) {
          EnumSet<AlarmPoints> points =
            EnumSet.noneOf(AlarmPoints.class); // Empty set
          points.add(BATHROOM);
          print(points);
          points.addAll(EnumSet.of(STAIR1, STAIR2, KITCHEN));
          print(points);
          points = EnumSet.allOf(AlarmPoints.class);
          points.removeAll(EnumSet.of(STAIR1, STAIR2, KITCHEN));
          print(points);
          points.removeAll(EnumSet.range(OFFICE1, OFFICE4));
          print(points);
          points = EnumSet.complementOf(points);
          print(points);
        }
      }
    language: java
    options:
      - text: "[STAIR1, STAIR2, BATHROOM, KITCHEN]"
        correct: true
      - text: "[BATHROOM, STAIR1, STAIR2, KITCHEN]"
        feedback: "An `EnumSet` iterates in declaration order, not insertion order."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-enumerated-bigenumset
    prompt: |
      `Big` has 76 constants — more than the 64 bits in a `long`. Does `EnumSet.allOf` work?
    code: |
      //: enumerated/BigEnumSet.java
      import java.util.*;

      public class BigEnumSet {
        enum Big { A0, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10,
          A11, A12, A13, A14, A15, A16, A17, A18, A19, A20, A21,
          A22, A23, A24, A25, A26, A27, A28, A29, A30, A31, A32,
          A33, A34, A35, A36, A37, A38, A39, A40, A41, A42, A43,
          A44, A45, A46, A47, A48, A49, A50, A51, A52, A53, A54,
          A55, A56, A57, A58, A59, A60, A61, A62, A63, A64, A65,
          A66, A67, A68, A69, A70, A71, A72, A73, A74, A75 }
        public static void main(String[] args) {
          EnumSet<Big> bigEnumSet = EnumSet.allOf(Big.class);
          System.out.println(bigEnumSet);
        }
      }
    language: java
    options:
      - text: "Yes — `EnumSet` switches to a larger bit vector (`JumboEnumSet`) as needed"
        correct: true
      - text: "No — `EnumSet` is limited to 64 constants"
        feedback: "It prints all 76."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-enumerated-enummaps
    prompt: |
      KITCHEN and BATHROOM were put in that order. In what order does the loop print them, and what happens at `em.get(UTILITY).action()`? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: enumerated/EnumMaps.java
      // Basics of EnumMaps.
      package enumerated;
      import java.util.*;
      import static enumerated.AlarmPoints.*;
      import static net.mindview.util.Print.*;

      interface Command { void action(); }

      public class EnumMaps {
        public static void main(String[] args) {
          EnumMap<AlarmPoints,Command> em =
            new EnumMap<AlarmPoints,Command>(AlarmPoints.class);
          em.put(KITCHEN, new Command() {
            public void action() { print("Kitchen fire!"); }
          });
          em.put(BATHROOM, new Command() {
            public void action() { print("Bathroom alert!"); }
          });
          for(Map.Entry<AlarmPoints,Command> e : em.entrySet()) {
            printnb(e.getKey() + ": ");
            e.getValue().action();
          }
          try { // If there's no value for a particular key:
            em.get(UTILITY).action();
          } catch(Exception e) {
            print(e);
          }
        }
      }
    language: java
    options:
      - text: "BATHROOM first (declaration order); then a `NullPointerException`, since UTILITY has no value"
        correct: true
      - text: "KITCHEN first; then it prints nothing"
        feedback: "`EnumMap` follows declaration order, and a missing key gives `null`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-enumerated-constantspecificmethod
    prompt: |
      What does the second line print when `CLASSPATH` isn't set?
    code: |
      //: enumerated/ConstantSpecificMethod.java
      import java.util.*;
      import java.text.*;

      public enum ConstantSpecificMethod {
        DATE_TIME {
          String getInfo() {
            return
              DateFormat.getDateInstance().format(new Date());
          }
        },
        CLASSPATH {
          String getInfo() {
            return System.getenv("CLASSPATH");
          }
        },
        VERSION {
          String getInfo() {
            return System.getProperty("java.version");
          }
        };
        abstract String getInfo();
        public static void main(String[] args) {
          for(ConstantSpecificMethod csm : values())
            System.out.println(csm.getInfo());
        }
      }
    language: java
    options:
      - text: "null"
        correct: true
      - text: "An empty line"
        feedback: "`getenv` returns `null` for a missing variable, and `println` prints `null`."
      - text: "It throws"
        feedback: "No exception; just `null`."
    explanation: |
      The first line is today's date, the third the Java version, like `21.0.11`.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-enumerated-notclasses
    prompt: |
      Why can't you write `void f1(LikeClasses.WINKEN instance)`? (`print` is `println`.)
    code: |
      //: enumerated/NotClasses.java
      import static net.mindview.util.Print.*;

      enum LikeClasses {
        WINKEN { void behavior() { print("Behavior1"); } },
        BLINKEN { void behavior() { print("Behavior2"); } },
        NOD { void behavior() { print("Behavior3"); } };
        abstract void behavior();
      }

      public class NotClasses {
        // void f1(LikeClasses.WINKEN instance) {} // Nope
      }
    language: java
    options:
      - text: "Constants with bodies are instances of anonymous subclasses, not types you can name"
        correct: true
      - text: "`WINKEN` is private"
        feedback: "Enum constants are public."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-enumerated-carwash
    prompt: |
      `cycles` starts as {BASIC, RINSE}; BLOWDRY (twice), RINSE and HOTWAX are added. What is the second `print(wash)`? (`print` is `println`.)
    code: |
      //: enumerated/CarWash.java
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class CarWash {
        public enum Cycle {
          UNDERBODY {
            void action() { print("Spraying the underbody"); }
          },
          WHEELWASH {
            void action() { print("Washing the wheels"); }
          },
          PREWASH {
            void action() { print("Loosening the dirt"); }
          },
          BASIC {
            void action() { print("The basic wash"); }
          },
          HOTWAX {
            void action() { print("Applying hot wax"); }
          },
          RINSE {
            void action() { print("Rinsing"); }
          },
          BLOWDRY {
            void action() { print("Blowing dry"); }
          };
          abstract void action();
        }
        EnumSet<Cycle> cycles =
          EnumSet.of(Cycle.BASIC, Cycle.RINSE);
        public void add(Cycle cycle) { cycles.add(cycle); }
        public void washCar() {
          for(Cycle c : cycles)
            c.action();
        }
        public String toString() { return cycles.toString(); }
        public static void main(String[] args) {
          CarWash wash = new CarWash();
          print(wash);
          wash.washCar();
          // Order of addition is unimportant:
          wash.add(Cycle.BLOWDRY);
          wash.add(Cycle.BLOWDRY); // Duplicates ignored
          wash.add(Cycle.RINSE);
          wash.add(Cycle.HOTWAX);
          print(wash);
          wash.washCar();
        }
      }
    language: java
    options:
      - text: "[BASIC, HOTWAX, RINSE, BLOWDRY]"
        correct: true
      - text: "[BASIC, RINSE, BLOWDRY, BLOWDRY, RINSE, HOTWAX]"
        feedback: "A set ignores duplicates."
      - text: "[BASIC, RINSE, BLOWDRY, HOTWAX]"
        feedback: "An `EnumSet` follows declaration order: HOTWAX is declared before RINSE."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

