  - type: choice
    id: tij-enumerated-postoffice
    prompt: |
      `handle(m)` tries each `MailHandler` in order. Mail 0 is not general delivery, is unscannable, readable with a good address. What happens? (`print` is `println`.)
    code: |
      //: enumerated/PostOffice.java
      // Modeling a post office.
      import java.util.*;
      import net.mindview.util.*;
      import static net.mindview.util.Print.*;

      class Mail {
        // The NO's lower the probability of random selection:
        enum GeneralDelivery {YES,NO1,NO2,NO3,NO4,NO5}
        enum Scannability {UNSCANNABLE,YES1,YES2,YES3,YES4}
        enum Readability {ILLEGIBLE,YES1,YES2,YES3,YES4}
        enum Address {INCORRECT,OK1,OK2,OK3,OK4,OK5,OK6}
        enum ReturnAddress {MISSING,OK1,OK2,OK3,OK4,OK5}
        GeneralDelivery generalDelivery;
        Scannability scannability;
        Readability readability;
        Address address;
        ReturnAddress returnAddress;
        static long counter = 0;
        long id = counter++;
        public String toString() { return "Mail " + id; }
        public String details() {
          return toString() +
            ", General Delivery: " + generalDelivery +
            ", Address Scanability: " + scannability +
            ", Address Readability: " + readability +
            ", Address Address: " + address +
            ", Return address: " + returnAddress;
        }
        // Generate test Mail:
        public static Mail randomMail() {
          Mail m = new Mail();
          m.generalDelivery= Enums.random(GeneralDelivery.class);
          m.scannability = Enums.random(Scannability.class);
          m.readability = Enums.random(Readability.class);
          m.address = Enums.random(Address.class);
          m.returnAddress = Enums.random(ReturnAddress.class);
          return m;
        }
        public static Iterable<Mail> generator(final int count) {
          return new Iterable<Mail>() {
            int n = count;
            public Iterator<Mail> iterator() {
              return new Iterator<Mail>() {
                public boolean hasNext() { return n-- > 0; }
                public Mail next() { return randomMail(); }
                public void remove() { // Not implemented
                  throw new UnsupportedOperationException();
                }
              };
            }
          };
        }
      }

      public class PostOffice {
        enum MailHandler {
          GENERAL_DELIVERY {
            boolean handle(Mail m) {
              switch(m.generalDelivery) {
                case YES:
                  print("Using general delivery for " + m);
                  return true;
                default: return false;
              }
            }
          },
          MACHINE_SCAN {
            boolean handle(Mail m) {
              switch(m.scannability) {
                case UNSCANNABLE: return false;
                default:
                  switch(m.address) {
                    case INCORRECT: return false;
                    default:
                      print("Delivering "+ m + " automatically");
                      return true;
                  }
              }
            }
          },
          VISUAL_INSPECTION {
            boolean handle(Mail m) {
              switch(m.readability) {
                case ILLEGIBLE: return false;
                default:
                  switch(m.address) {
                    case INCORRECT: return false;
                    default:
                      print("Delivering " + m + " normally");
                      return true;
                  }
              }
            }
          },
          RETURN_TO_SENDER {
            boolean handle(Mail m) {
              switch(m.returnAddress) {
                case MISSING: return false;
                default:
                  print("Returning " + m + " to sender");
                  return true;
              }
            }
          };
          abstract boolean handle(Mail m);
        }
        static void handle(Mail m) {
          for(MailHandler handler : MailHandler.values())
            if(handler.handle(m))
              return;
          print(m + " is a dead letter");
        }
        public static void main(String[] args) {
          for(Mail mail : Mail.generator(10)) {
            print(mail.details());
            handle(mail);
            print("*****");
          }
        }
      }
    language: java
    options:
      - text: "`Delivering Mail 0 normally` — VISUAL_INSPECTION is the first handler that accepts it"
        correct: true
      - text: "`Delivering Mail 0 automatically`"
        feedback: "MACHINE_SCAN rejects unscannable mail."
      - text: "`Mail 0 is a dead letter`"
        feedback: "Visual inspection succeeds."
    explanation: |
      A Chain of Responsibility built from constant-specific methods.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-enumerated-input
    prompt: |
      Why does `randomSelection()` use `values().length - 1`?
    code: |
      //: enumerated/Input.java
      package enumerated;
      import java.util.*;

      public enum Input {
        NICKEL(5), DIME(10), QUARTER(25), DOLLAR(100),
        TOOTHPASTE(200), CHIPS(75), SODA(100), SOAP(50),
        ABORT_TRANSACTION {
          public int amount() { // Disallow
            throw new RuntimeException("ABORT.amount()");
          }
        },
        STOP { // This must be the last instance.
          public int amount() { // Disallow
            throw new RuntimeException("SHUT_DOWN.amount()");
          }
        };
        int value; // In cents
        Input(int value) { this.value = value; }
        Input() {}
        int amount() { return value; }; // In cents
        static Random rand = new Random(47);
        public static Input randomSelection() {
          // Don't include STOP:
          return values()[rand.nextInt(values().length - 1)];
        }
      }
    language: java
    options:
      - text: "To exclude `STOP`, the last constant"
        correct: true
      - text: "Because arrays are 1-based"
        feedback: "They're 0-based; it's to leave out `STOP`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-enumerated-vendingmachine
    prompt: |
      Run with no file argument, inputs are random and never `STOP`. When does it halt? (`print` is `println`.)
    code: |
      //: enumerated/VendingMachine.java
      package enumerated;
      import java.util.*;
      import net.mindview.util.*;
      import static enumerated.Input.*;
      import static net.mindview.util.Print.*;

      enum Category {
        MONEY(NICKEL, DIME, QUARTER, DOLLAR),
        ITEM_SELECTION(TOOTHPASTE, CHIPS, SODA, SOAP),
        QUIT_TRANSACTION(ABORT_TRANSACTION),
        SHUT_DOWN(STOP);
        private Input[] values;
        Category(Input... types) { values = types; }
        private static EnumMap<Input,Category> categories =
          new EnumMap<Input,Category>(Input.class);
        static {
          for(Category c : Category.class.getEnumConstants())
            for(Input type : c.values)
              categories.put(type, c);
        }
        public static Category categorize(Input input) {
          return categories.get(input);
        }
      }

      public class VendingMachine {
        private static State state = State.RESTING;
        private static int amount = 0;
        private static Input selection = null;
        enum StateDuration { TRANSIENT } // Tagging enum
        enum State {
          RESTING {
            void next(Input input) {
              switch(Category.categorize(input)) {
                case MONEY:
                  amount += input.amount();
                  state = ADDING_MONEY;
                  break;
                case SHUT_DOWN:
                  state = TERMINAL;
                default:
              }
            }
          },
          ADDING_MONEY {
            void next(Input input) {
              switch(Category.categorize(input)) {
                case MONEY:
                  amount += input.amount();
                  break;
                case ITEM_SELECTION:
                  selection = input;
                  if(amount < selection.amount())
                    print("Insufficient money for " + selection);
                  else state = DISPENSING;
                  break;
                case QUIT_TRANSACTION:
                  state = GIVING_CHANGE;
                  break;
                case SHUT_DOWN:
                  state = TERMINAL;
                default:
              }
            }
          },
          DISPENSING(StateDuration.TRANSIENT) {
            void next() {
              print("here is your " + selection);
              amount -= selection.amount();
              state = GIVING_CHANGE;
            }
          },
          GIVING_CHANGE(StateDuration.TRANSIENT) {
            void next() {
              if(amount > 0) {
                print("Your change: " + amount);
                amount = 0;
              }
              state = RESTING;
            }
          },
          TERMINAL { void output() { print("Halted"); } };
          private boolean isTransient = false;
          State() {}
          State(StateDuration trans) { isTransient = true; }
          void next(Input input) {
            throw new RuntimeException("Only call " +
              "next(Input input) for non-transient states");
          }
          void next() {
            throw new RuntimeException("Only call next() for " +
              "StateDuration.TRANSIENT states");
          }
          void output() { print(amount); }
        }
        static void run(Generator<Input> gen) {
          while(state != State.TERMINAL) {
            state.next(gen.next());
            while(state.isTransient)
              state.next();
            state.output();
          }
        }
        public static void main(String[] args) {
          Generator<Input> gen = new RandomInputGenerator();
          if(args.length == 1)
            gen = new FileInputGenerator(args[0]);
          run(gen);
        }
      }

      // For a basic sanity check:
      class RandomInputGenerator implements Generator<Input> {
        public Input next() { return Input.randomSelection(); }
      }

      // Create Inputs from a file of ';'-separated strings:
      class FileInputGenerator implements Generator<Input> {
        private Iterator<String> input;
        public FileInputGenerator(String fileName) {
          input = new TextFile(fileName, ";").iterator();
        }
        public Input next() {
          if(!input.hasNext())
            return null;
          return Enum.valueOf(Input.class, input.next().trim());
        }
      }
    language: java
    options:
      - text: "Never — only `STOP` leads to `TERMINAL`, and the random generator excludes it"
        correct: true
      - text: "After one sale"
        feedback: "The machine returns to RESTING and keeps going."
    explanation: |
      With the input file, the last input is `STOP`, and it prints `Halted`.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
