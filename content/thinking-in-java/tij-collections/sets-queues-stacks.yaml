title: "Sets, queues and stacks"
summary: "Sets drop duplicates, TreeSet sorts, queues hand out elements first-in-first-out, priority queues smallest-first, and stacks last-in-first-out."
duration: 8
tags: [java, collections, Set, TreeSet, Queue, PriorityQueue, Stack]
sources:
  - { book: thinking-in-java, ref: "Chapter 11, Stack; Set; Queue; PriorityQueue" }
steps:
  - type: explanation
    title: "Sets"
    body: |
      A `Set` holds each value at most once.
      `HashSet` has no defined order; `TreeSet` keeps elements sorted, by natural order or a `Comparator`.
      `containsAll`, `removeAll` and `addAll` give subset, difference and union.

  - type: explanation
    title: "Queues and stacks"
    body: |
      A `Queue` gives elements back in insertion order: `offer` to add, `peek` to look, `poll`/`remove` to take.
      A `PriorityQueue` always gives the smallest (or, with a reverse comparator, the largest) next.
      A stack gives back the most recent element first.

  - type: predict
    id: tij-holding-stacktest
    prompt: |
      `net.mindview.util.Stack` is a simple LIFO stack built on `LinkedList`. What does this print?
    code: |
      //: holding/StackTest.java
      import net.mindview.util.*;

      public class StackTest {
        public static void main(String[] args) {
          Stack<String> stack = new Stack<String>();
          for(String s : "My dog has fleas".split(" "))
            stack.push(s);
          while(!stack.empty())
            System.out.print(stack.pop() + " ");
        }
      }
    language: java
    options:
      - text: "fleas has dog My "
        correct: true
      - text: "My dog has fleas "
        feedback: "A stack pops the last pushed element first."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-holding-stackcollision
    prompt: |
      Why are both stacks written with full package names?
    code: |
      //: holding/StackCollision.java
      import net.mindview.util.*;

      public class StackCollision {
        public static void main(String[] args) {
          net.mindview.util.Stack<String> stack =
            new net.mindview.util.Stack<String>();
          for(String s : "My dog has fleas".split(" "))
            stack.push(s);
          while(!stack.empty())
            System.out.print(stack.pop() + " ");
          System.out.println();
          java.util.Stack<String> stack2 =
            new java.util.Stack<String>();
          for(String s : "My dog has fleas".split(" "))
            stack2.push(s);
          while(!stack2.empty())
            System.out.print(stack2.pop() + " ");
        }
      }
    language: java
    options:
      - text: "`import net.mindview.util.*` brings in a `Stack`, and `java.util` has one too; full names make it unambiguous"
        correct: true
      - text: "Generic classes always need full names"
        feedback: "Normally the short name is fine."
      - text: "They behave differently"
        feedback: "Both print `fleas has dog My `."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-holding-setofinteger
    prompt: |
      10,000 random numbers from 0 to 29 go into the `HashSet`. How many elements does it end up with?
    code: |
      //: holding/SetOfInteger.java
      import java.util.*;

      public class SetOfInteger {
        public static void main(String[] args) {
          Random rand = new Random(47);
          Set<Integer> intset = new HashSet<Integer>();
          for(int i = 0; i < 10000; i++)
            intset.add(rand.nextInt(30));
          System.out.println(intset);
        }
      }
    language: java
    options:
      - text: "30 — duplicates are dropped"
        correct: true
      - text: "10,000"
        feedback: "A set keeps each value once."
      - text: "Fewer than 30, unpredictably"
        feedback: "With 10,000 draws, every value from 0 to 29 appears."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

