title: The Collection hierarchy
summary: List, Set and Queue all extend Collection; each implementation promises a different order and speed.
duration: 6
tags: [java, thinking in java, collections, list, set, queue, hierarchy]
sources:
  - { book: thinking-in-java, ref: "Chapter 11, Holding Your Objects" }
  - { book: thinking-in-java, ref: "Chapter 17, Containers in Depth" }
steps:
  - type: explanation
    title: The interfaces
    body: |
      Everything you can loop over with for-each is `Iterable`.
      `Collection` adds size, add and remove.
      `List` keeps order, `Set` forbids duplicates, `Queue` hands elements out in turn.
    diagram:
      classes:
        - { name: Iterable, kind: interface }
        - { name: Collection, kind: interface }
        - { name: List, kind: interface }
        - { name: Set, kind: interface }
        - { name: Queue, kind: interface }
      relations:
        - { from: Collection, to: Iterable, type: extends }
        - { from: List, to: Collection, type: extends }
        - { from: Set, to: Collection, type: extends }
        - { from: Queue, to: Collection, type: extends }

  - type: explanation
    title: The implementations
    body: |
      Each interface has several classes behind it.
      They differ in order and in cost.
      Declare the interface; choose the class where you call `new`.
    diagram:
      classes:
        - { name: List, kind: interface }
        - { name: Set, kind: interface }
        - { name: ArrayList }
        - { name: LinkedList }
        - { name: HashSet }
        - { name: TreeSet }
      relations:
        - { from: ArrayList, to: List, type: implements }
        - { from: LinkedList, to: List, type: implements }
        - { from: HashSet, to: Set, type: implements }
        - { from: TreeSet, to: Set, type: implements }

  - type: widget
    widget: hierarchy
    prompt: You need a set that always iterates in sorted order. Tap it.
    config:
      diagram:
        classes:
          - { name: Set, kind: interface }
          - { name: HashSet }
          - { name: TreeSet }
          - { name: LinkedHashSet }
        relations:
          - { from: HashSet, to: Set, type: implements }
          - { from: TreeSet, to: Set, type: implements }
          - { from: LinkedHashSet, to: HashSet, type: extends }
      feedback:
        HashSet: HashSet has no defined order.
        LinkedHashSet: LinkedHashSet keeps insertion order, not sorted order.
        Set: Set is the interface; it promises no order.
    goal:
      select: TreeSet
    explanation: "`TreeSet` keeps its elements in a red-black tree, so iteration is always sorted."

  - type: widget
    widget: hierarchy
    prompt: You need fast `get(i)` by index. Tap the best list.
    config:
      diagram:
        classes:
          - { name: List, kind: interface }
          - { name: ArrayList }
          - { name: LinkedList }
        relations:
          - { from: ArrayList, to: List, type: implements }
          - { from: LinkedList, to: List, type: implements }
      feedback:
        LinkedList: A linked list must walk from one end to reach index i.
        List: List is the interface — pick an implementation.
    goal:
      select: ArrayList
    explanation: "`ArrayList` is backed by an array, so `get(i)` is a direct index."

  - type: choice
    prompt: "Which declaration does Eckel recommend?"
    options:
      - text: "`List<Apple> apples = new ArrayList<>();`"
        correct: true
      - text: "`ArrayList<Apple> apples = new ArrayList<>();`"
        feedback: Declaring the interface lets you switch to another implementation by changing one line.

  - type: match
    prompt: Match each class with its order.
    pairs:
      - left: "`HashSet`"
        right: No defined order
      - left: "`LinkedHashSet`"
        right: Insertion order
      - left: "`TreeSet`"
        right: Sorted order
      - left: "`ArrayList`"
        right: Index order, as you added or placed them

  - type: predict
    id: tij-holding-printingcontainers
    prompt: |
      What are the `HashSet`, `TreeSet` and `LinkedHashSet` lines (lines 3–5)? (`print` is `println`.)
    code: |
      //: holding/PrintingContainers.java
      // Containers print themselves automatically.
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class PrintingContainers {
        static Collection fill(Collection<String> collection) {
          collection.add("rat");
          collection.add("cat");
          collection.add("dog");
          collection.add("dog");
          return collection;
        }
        static Map fill(Map<String,String> map) {
          map.put("rat", "Fuzzy");
          map.put("cat", "Rags");
          map.put("dog", "Bosco");
          map.put("dog", "Spot");
          return map;
        }
        public static void main(String[] args) {
          print(fill(new ArrayList<String>()));
          print(fill(new LinkedList<String>()));
          print(fill(new HashSet<String>()));
          print(fill(new TreeSet<String>()));
          print(fill(new LinkedHashSet<String>()));
          print(fill(new HashMap<String,String>()));
          print(fill(new TreeMap<String,String>()));
          print(fill(new LinkedHashMap<String,String>()));
        }
      }
    language: java
    options:
      - text: "[rat, cat, dog]\n[cat, dog, rat]\n[rat, cat, dog]"
        correct: true
      - text: "[rat, cat, dog, dog]\n[cat, dog, dog, rat]\n[rat, cat, dog, dog]"
        feedback: "Sets keep one `dog`."
      - text: "[cat, dog, rat]\n[cat, dog, rat]\n[cat, dog, rat]"
        feedback: "Only `TreeSet` sorts; `LinkedHashSet` keeps insertion order."
    explanation: |
      `HashSet` order isn't guaranteed — here it happens to match insertion order.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-holding-containermethods
    prompt: |
      This lists the methods each container interface and class adds. On Java 21, what does it report that `List` extends?
    code: |
      //: holding/ContainerMethods.java
      import net.mindview.util.*;

      public class ContainerMethods {
        public static void main(String[] args) {
          ContainerMethodDifferences.main(args);
        }
      }
    language: java
    options:
      - text: "`SequencedCollection` — added in Java 21, with `getFirst`, `addLast`, `reversed` and friends"
        correct: true
      - text: "`Collection` only, as in Java 6"
        feedback: "Java 21's sequenced collections slot in between."
      - text: "`Iterable` directly"
        feedback: "`List` extends a `Collection` subtype."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
