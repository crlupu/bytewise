title: Maps and their views
summary: Map is a separate hierarchy from Collection. You loop over a map through its views — keys, values or entries.
duration: 5
tags: [java, thinking in java, map, hashmap, treemap, views, iterator]
sources:
  - { book: thinking-in-java, ref: "Chapter 11, Holding Your Objects — Map" }
steps:
  - type: explanation
    title: Map stands apart
    body: |
      A `Map` links keys to values; it isn't a `Collection`.
      `HashMap` has no order, `LinkedHashMap` keeps insertion order, `TreeMap` sorts its keys.
    diagram:
      classes:
        - { name: Map, kind: interface, methods: ["put(K, V)", "get(K): V"] }
        - { name: HashMap }
        - { name: TreeMap }
        - { name: LinkedHashMap }
      relations:
        - { from: HashMap, to: Map, type: implements }
        - { from: TreeMap, to: Map, type: implements }
        - { from: LinkedHashMap, to: HashMap, type: extends }

  - type: choice
    prompt: "Can you write `for (String k : map)` with a `Map<String, Integer> map`?"
    options:
      - text: No — a `Map` isn't `Iterable`; loop over `map.keySet()` or `map.entrySet()`
        correct: true
      - text: Yes, it loops over the keys
        feedback: "`Map` doesn't extend `Iterable` or `Collection`."

  - type: explanation
    title: Three views
    body: |
      `keySet()`, `values()` and `entrySet()` return collections backed by the map.
      They're views, not copies.
      Remove a key from the key set, and it's gone from the map.
    diagram:
      kind: objects
      vars:
        - { name: "Map map", to: m }
        - { name: "Set keys", to: ks }
      objects:
        - { id: m, type: HashMap, fields: [{ name: '"apple"', value: "3" }, { name: '"pear"', value: "5" }] }
        - { id: ks, type: KeySet, fields: [{ name: backing map, to: m }] }

  - type: predict
    prompt: What does this print?
    code: |
      Map<String, Integer> map = new HashMap<>(Map.of("apple", 3, "pear", 5));
      Set<String> keys = map.keySet();
      keys.remove("apple");
      System.out.println(map);
    language: java
    options:
      - text: "`{pear=5}`"
        correct: true
      - text: "`{apple=3, pear=5}`"
        feedback: The key set is a view backed by the map, so removing from it changes the map.
    details: |
      `keySet()` doesn't copy the keys: it returns a view backed by the map itself.
      Removing a key from the view removes the whole entry from the map.
      The same is true of `values()` and `entrySet()`, which is why they are cheap to create.
      If you want an independent copy, write `new HashSet<>(map.keySet())`.

  - type: blank
    prompt: Loop over keys and values together.
    template: "for (Map.Entry<String, Integer> e : map.[[entrySet]]()) print(e.getKey() + \"=\" + e.getValue());"
    code: true

  - type: predict
    id: tij-holding-petmap
    prompt: |
      What are the last three lines printed? (`print` is `println`.)
    code: |
      //: holding/PetMap.java
      import typeinfo.pets.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class PetMap {
        public static void main(String[] args) {
          Map<String,Pet> petMap = new HashMap<String,Pet>();
          petMap.put("My Cat", new Cat("Molly"));
          petMap.put("My Dog", new Dog("Ginger"));
          petMap.put("My Hamster", new Hamster("Bosco"));
          print(petMap);
          Pet dog = petMap.get("My Dog");
          print(dog);
          print(petMap.containsKey("My Dog"));
          print(petMap.containsValue(dog));
        }
      }
    language: java
    options:
      - text: "Dog Ginger\ntrue\ntrue"
        correct: true
      - text: "My Dog\ntrue\ntrue"
        feedback: "`get` returns the value, not the key."
      - text: "Dog Ginger\ntrue\nfalse"
        feedback: "`dog` is the very object stored, so `containsValue` finds it."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-holding-statistics
    prompt: |
      What does the map hold at the end?
    code: |
      //: holding/Statistics.java
      // Simple demonstration of HashMap.
      import java.util.*;

      public class Statistics {
        public static void main(String[] args) {
          Random rand = new Random(47);
          Map<Integer,Integer> m =
            new HashMap<Integer,Integer>();
          for(int i = 0; i < 10000; i++) {
            // Produce a number between 0 and 20:
            int r = rand.nextInt(20);
            Integer freq = m.get(r);
            m.put(r, freq == null ? 1 : freq + 1);
          }
          System.out.println(m);
        }
      }
    language: java
    options:
      - text: "Each number 0–19 mapped to how often it came up — about 500 each"
        correct: true
      - text: "Ten thousand entries"
        feedback: "Keys repeat; each `put` updates the count for that key."
      - text: "It throws `NullPointerException` the first time a number appears"
        feedback: "The `freq == null ? 1` check handles a missing key."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-holding-mapoflist
    prompt: |
      In what order are the people printed? (`print` is `println`.)
    code: |
      //: holding/MapOfList.java
      package holding;
      import typeinfo.pets.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class MapOfList {
        public static Map<Person, List<? extends Pet>>
          petPeople = new HashMap<Person, List<? extends Pet>>();
        static {
          petPeople.put(new Person("Dawn"),
            Arrays.asList(new Cymric("Molly"),new Mutt("Spot")));
          petPeople.put(new Person("Kate"),
            Arrays.asList(new Cat("Shackleton"),
              new Cat("Elsie May"), new Dog("Margrett")));
          petPeople.put(new Person("Marilyn"),
            Arrays.asList(
             new Pug("Louie aka Louis Snorkelstein Dupree"),
             new Cat("Stanford aka Stinky el Negro"),
             new Cat("Pinkola")));
          petPeople.put(new Person("Luke"),
            Arrays.asList(new Rat("Fuzzy"), new Rat("Fizzy")));
          petPeople.put(new Person("Isaac"),
            Arrays.asList(new Rat("Freckly")));
        }
        public static void main(String[] args) {
          print("People: " + petPeople.keySet());
          print("Pets: " + petPeople.values());
          for(Person person : petPeople.keySet()) {
            print(person + " has:");
            for(Pet pet : petPeople.get(person))
              print("    " + pet);
          }
        }
      }
    language: java
    options:
      - text: "`HashMap` order — determined by hashing, not by insertion (here Marilyn, Dawn, Luke, Isaac, Kate)"
        correct: true
      - text: "Insertion order: Dawn, Kate, Marilyn, Luke, Isaac"
        feedback: "That would need a `LinkedHashMap`."
      - text: "Alphabetical"
        feedback: "That would need a `TreeMap`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
