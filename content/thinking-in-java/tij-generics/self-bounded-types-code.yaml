title: "Self-bounded types: in code"
summary: "More examples for self-bounded types, one question each."
duration: 3
tags: [java, generics, self-bounding, CRTP, covariant return]
sources:
  - { book: thinking-in-java, ref: "Chapter 15, Self-bounded types" }
steps:
  - type: explanation
    title: "Recap: The curiously recurring generic"
    body: |
      `class Subtype extends BasicHolder<Subtype>` makes the base class use the subclass as its type argument.
      The base class's methods then take and return the subclass type exactly.

  - type: explanation
    title: "Recap: Self-bounding"
    body: |
      `class SelfBounded<T extends SelfBounded<T>>` forces `T` to be such a class.
      It makes method arguments vary with the subclass (covariant arguments) — normally a subclass method with a narrower parameter only overloads.
      An interface like `Comparable` can only be implemented with one type argument per class.

  - type: choice
    id: tij-generics-comparablepet
    prompt: |
      `ComparablePet implements Comparable<ComparablePet>`. What can a subclass `Cat` compare itself to?
    code: |
      //: generics/ComparablePet.java

      public class ComparablePet
      implements Comparable<ComparablePet> {
        public int compareTo(ComparablePet arg) { return 0; }
      }
    language: java
    options:
      - text: "Any `ComparablePet` — it can't switch to `Comparable<Cat>`"
        correct: true
      - text: "Only `Cat`s"
        feedback: "The base class fixed the type argument."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-generics-hijackedinterface
    prompt: |
      Why won't `class Cat extends ComparablePet implements Comparable<Cat>` compile?
    code: |
      //: generics/HijackedInterface.java

      class Cat extends ComparablePet implements Comparable<Cat>{
        public int compareTo(Cat arg) { return 0; }
      }
    language: java
    options:
      - text: "`Comparable` can't be inherited with two different arguments, `<ComparablePet>` and `<Cat>`"
        correct: true
      - text: "`compareTo(Cat)` is the wrong name"
        feedback: "The name's fine; the two parameterizations clash."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-generics-restrictedcomparablepets
    prompt: |
      What can a subclass of `ComparablePet` do about `Comparable`?
    code: |
      //: generics/RestrictedComparablePets.java

      class Hamster extends ComparablePet
      implements Comparable<ComparablePet> {
        public int compareTo(ComparablePet arg) { return 0; }
      }

      // Or just:

      class Gecko extends ComparablePet {
        public int compareTo(ComparablePet arg) { return 0; }
      }
    language: java
    options:
      - text: "Repeat `implements Comparable<ComparablePet>` (or nothing) and override `compareTo(ComparablePet)`"
        correct: true
      - text: "Implement `Comparable<Hamster>`"
        feedback: "That's the clash."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
