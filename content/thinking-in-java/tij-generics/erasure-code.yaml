title: "Erasure and its workarounds: in code"
summary: "More examples for erasure and its workarounds, one question each."
duration: 3
tags: [java, generics, erasure, type token, factory]
sources:
  - { book: thinking-in-java, ref: "Chapter 15, The mystery of erasure; Compensating for erasure" }
steps:
  - type: explanation
    title: "Recap: Erasure"
    body: |
      At run time `ArrayList<String>` and `ArrayList<Integer>` are the same class; `T` is erased to its bound, or to `Object`.
      So inside a generic class you can't call methods on `T` (unless bounded), test `instanceof T`, or write `new T()`.

  - type: explanation
    title: "Recap: Working around it"
    body: |
      A bound like `<T extends HasF>` erases to `HasF`, so you can call its methods.
      Pass a `Class<T>` type token to test types and create instances, or pass a factory object for things without a no-arg constructor.

  - type: predict
    id: tij-generics-instantiategenerictype
    prompt: |
      What does this print? (`print` is `println`.)
    code: |
      //: generics/InstantiateGenericType.java
      import static net.mindview.util.Print.*;

      class ClassAsFactory<T> {
        T x;
        public ClassAsFactory(Class<T> kind) {
          try {
            x = kind.newInstance();
          } catch(Exception e) {
            throw new RuntimeException(e);
          }
        }
      }

      class Employee {}

      public class InstantiateGenericType {
        public static void main(String[] args) {
          ClassAsFactory<Employee> fe =
            new ClassAsFactory<Employee>(Employee.class);
          print("ClassAsFactory<Employee> succeeded");
          try {
            ClassAsFactory<Integer> fi =
              new ClassAsFactory<Integer>(Integer.class);
          } catch(Exception e) {
            print("ClassAsFactory<Integer> failed");
          }
        }
      }
    language: java
    options:
      - text: "ClassAsFactory<Employee> succeeded\nClassAsFactory<Integer> failed"
        correct: true
      - text: "ClassAsFactory<Employee> succeeded"
        feedback: "`Integer` has no no-arg constructor, so `newInstance` throws."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-generics-factoryconstraint
    prompt: |
      Why use a factory object instead of `Class<T>.newInstance()`?
    code: |
      //: generics/FactoryConstraint.java

      interface FactoryI<T> {
        T create();
      }

      class Foo2<T> {
        private T x;
        public <F extends FactoryI<T>> Foo2(F factory) {
          x = factory.create();
        }
        // ...
      }

      class IntegerFactory implements FactoryI<Integer> {
        public Integer create() {
          return new Integer(0);
        }
      }

      class Widget {
        public static class Factory implements FactoryI<Widget> {
          public Widget create() {
            return new Widget();
          }
        }
      }

      public class FactoryConstraint {
        public static void main(String[] args) {
          new Foo2<Integer>(new IntegerFactory());
          new Foo2<Widget>(new Widget.Factory());
        }
      }
    language: java
    options:
      - text: "The compiler checks the factory, and it works for types like `Integer` with no no-arg constructor"
        correct: true
      - text: "It's faster"
        feedback: "The main gain is compile-time checking."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-generics-creatorgeneric
    prompt: |
      What does this print?
    code: |
      //: generics/CreatorGeneric.java

      abstract class GenericWithCreate<T> {
        final T element;
        GenericWithCreate() { element = create(); }
        abstract T create();
      }

      class X {}

      class Creator extends GenericWithCreate<X> {
        X create() { return new X(); }
        void f() {
          System.out.println(element.getClass().getSimpleName());
        }
      }

      public class CreatorGeneric {
        public static void main(String[] args) {
          Creator c = new Creator();
          c.f();
        }
      }
    language: java
    options:
      - text: "X"
        correct: true
      - text: "T"
        feedback: "`element` is an `X`, created by `Creator.create()`."
      - text: "null"
        feedback: "The base constructor calls `create()`, which the subclass implements."
    explanation: |
      That's the Template Method pattern: the base class decides when, the subclass decides what.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
