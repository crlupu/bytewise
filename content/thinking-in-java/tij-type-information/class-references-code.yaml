title: "Class references, counting and factories: in code"
summary: "More examples for class references, counting and factories, one question each."
duration: 3
tags: [java, Class, generics, instanceof, isInstance, factory]
sources:
  - { book: thinking-in-java, ref: "Chapter 14, Generic class references; Checking before a cast; Registered factories" }
steps:
  - type: explanation
    title: "Recap: Class references"
    body: |
      `Class<Integer>` can only hold `Integer.class` (or `int.class`, which is the same type parameter); `Class<?>` holds any class; `Class<? extends Number>` any Number type.
      `type.newInstance()` creates an object with the no-arg constructor (deprecated since Java 9 in favor of `getDeclaredConstructor().newInstance()`).

  - type: explanation
    title: "Recap: Asking an object its type"
    body: |
      `x instanceof Dog` is true for a `Dog` or any subclass.
      `Dog.class.isInstance(x)` does the same with a `Class` object, so you can loop over a list of types instead of writing a chain of `instanceof`s.
      A registered factory list lets the base class create random subclass objects without naming them in code.

  - type: choice
    id: tij-typeinfo-pets-manx
    prompt: |
      `Cymric extends Manx`, and every pet class has a name and a no-name constructor like this one. Why the no-arg one?
    code: |
      //: typeinfo/pets/Manx.java
      package typeinfo.pets;

      public class Manx extends Cat {
        public Manx(String name) { super(name); }
        public Manx() { super(); }
      }
    language: java
    options:
      - text: "`Class.newInstance()` needs a no-arg constructor to create random pets"
        correct: true
      - text: "Java requires one in every class"
        feedback: "Only if you want to create objects without arguments."
      - text: "To set a default name"
        feedback: "It calls `super()`, leaving the name null."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-typeinfo-registeredfactories
    prompt: |
      How does `Part.createRandom()` create a random part type?
    code: |
      //: typeinfo/RegisteredFactories.java
      // Registering Class Factories in the base class.
      import typeinfo.factory.*;
      import java.util.*;

      class Part {
        public String toString() {
          return getClass().getSimpleName();
        }
        static List<Factory<? extends Part>> partFactories =
          new ArrayList<Factory<? extends Part>>();
        static {
          // Collections.addAll() gives an "unchecked generic
          // array creation ... for varargs parameter" warning.
          partFactories.add(new FuelFilter.Factory());
          partFactories.add(new AirFilter.Factory());
          partFactories.add(new CabinAirFilter.Factory());
          partFactories.add(new OilFilter.Factory());
          partFactories.add(new FanBelt.Factory());
          partFactories.add(new PowerSteeringBelt.Factory());
          partFactories.add(new GeneratorBelt.Factory());
        }
        private static Random rand = new Random(47);
        public static Part createRandom() {
          int n = rand.nextInt(partFactories.size());
          return partFactories.get(n).create();
        }
      }

      class Filter extends Part {}

      class FuelFilter extends Filter {
        // Create a Class Factory for each specific type:
        public static class Factory
        implements typeinfo.factory.Factory<FuelFilter> {
          public FuelFilter create() { return new FuelFilter(); }
        }
      }

      class AirFilter extends Filter {
        public static class Factory
        implements typeinfo.factory.Factory<AirFilter> {
          public AirFilter create() { return new AirFilter(); }
        }
      }

      class CabinAirFilter extends Filter {
        public static class Factory
        implements typeinfo.factory.Factory<CabinAirFilter> {
          public CabinAirFilter create() {
            return new CabinAirFilter();
          }
        }
      }

      class OilFilter extends Filter {
        public static class Factory
        implements typeinfo.factory.Factory<OilFilter> {
          public OilFilter create() { return new OilFilter(); }
        }
      }

      class Belt extends Part {}

      class FanBelt extends Belt {
        public static class Factory
        implements typeinfo.factory.Factory<FanBelt> {
          public FanBelt create() { return new FanBelt(); }
        }
      }

      class GeneratorBelt extends Belt {
        public static class Factory
        implements typeinfo.factory.Factory<GeneratorBelt> {
          public GeneratorBelt create() {
            return new GeneratorBelt();
          }
        }
      }

      class PowerSteeringBelt extends Belt {
        public static class Factory
        implements typeinfo.factory.Factory<PowerSteeringBelt> {
          public PowerSteeringBelt create() {
            return new PowerSteeringBelt();
          }
        }
      }

      public class RegisteredFactories {
        public static void main(String[] args) {
          for(int i = 0; i < 10; i++)
            System.out.println(Part.createRandom());
        }
      }
    language: java
    options:
      - text: "It picks a random factory from the registered list and calls its `create()`"
        correct: true
      - text: "With reflection on `Class` objects"
        feedback: "Each type has its own `Factory` class; no reflection is used."
      - text: "It always creates a `Filter` or a `Belt`"
        feedback: "Only the leaf types have factories registered."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-typeinfo-factory-factory
    prompt: |
      What does a `Factory<FuelFilter>` return from `create()`?
    code: |
      //: typeinfo/factory/Factory.java
      package typeinfo.factory;
      public interface Factory<T> { T create(); }
    language: java
    options:
      - text: "A `FuelFilter`, statically typed — no cast needed"
        correct: true
      - text: "An `Object`"
        feedback: "The type parameter `T` is `FuelFilter`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
