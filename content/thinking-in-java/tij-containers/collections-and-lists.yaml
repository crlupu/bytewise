title: "Filling containers, Collection and List"
summary: "Ways to fill containers with test data, the operations every Collection supports, optional operations, and legacy containers."
duration: 8
tags: [java, containers, Collection, List, unsupported operations, Vector, BitSet]
sources:
  - { book: thinking-in-java, ref: "Chapter 17, Filling containers; Collection functionality; Optional operations; List functionality; Holding references; Java 1.0/1.1 containers" }
steps:
  - type: explanation
    title: "Collection operations"
    body: |
      Every `Collection` can `add`, `addAll`, `remove`, `removeAll`, `retainAll`, `contains`, `containsAll`, `clear`, `size` and `toArray`.
      `Collections.nCopies` and `Collections.fill` fill lists — with the same object reference in every slot.

  - type: explanation
    title: "Optional operations"
    body: |
      Some implementations don't support every operation and throw `UnsupportedOperationException`.
      `Arrays.asList` is fixed-size: `set` works, but nothing that changes the size.
      An unmodifiable wrapper rejects every change.

  - type: choice
    id: tij-containers-collectiondatatest
    prompt: |
      Both adds use 15 words from a generator over `"strange women lying in ponds distributing swords is no basis for a system of government"`. Why does the set print each word once?
    code: |
      //: containers/CollectionDataTest.java
      import java.util.*;
      import net.mindview.util.*;

      class Government implements Generator<String> {
        String[] foundation = ("strange women lying in ponds " +
          "distributing swords is no basis for a system of " +
          "government").split(" ");
        private int index;
        public String next() { return foundation[index++]; }
      }

      public class CollectionDataTest {
        public static void main(String[] args) {
          Set<String> set = new LinkedHashSet<String>(
            new CollectionData<String>(new Government(), 15));
          // Using the convenience method:
          set.addAll(CollectionData.list(new Government(), 15));
          System.out.println(set);
        }
      }
    language: java
    options:
      - text: "It's a `LinkedHashSet`: the second batch only repeats words already present, and insertion order is kept"
        correct: true
      - text: "The second add fails"
        feedback: "It succeeds; sets just ignore duplicates."
      - text: "`CollectionData` removes duplicates"
        feedback: "The set does."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

