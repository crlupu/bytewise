    id: tij-containers-randombounds
    prompt: |
      Run as `java RandomBounds upper` — what happens? (`print` is `println`.)
    code: |
      //: containers/RandomBounds.java
      // Does Math.random() produce 0.0 and 1.0?
      import static net.mindview.util.Print.*;

      public class RandomBounds {
        static void usage() {
          print("Usage:");
          print("\tRandomBounds lower");
          print("\tRandomBounds upper");
          System.exit(1);
        }
        public static void main(String[] args) {
          if(args.length != 1) usage();
          if(args[0].equals("lower")) {
            while(Math.random() != 0.0)
              ; // Keep trying
            print("Produced 0.0!");
          }
          else if(args[0].equals("upper")) {
            while(Math.random() != 1.0)
              ; // Keep trying
            print("Produced 1.0!");
          }
          else
            usage();
        }
      }
    language: java
    options:
      - text: "It loops forever: `Math.random()` returns values in [0, 1), never 1.0"
        correct: true
      - text: "It eventually prints `Produced 1.0!`"
        feedback: "1.0 is excluded."
    explanation: |
      `lower` could in theory print `Produced 0.0!`, but in practice it would take astronomically long.

