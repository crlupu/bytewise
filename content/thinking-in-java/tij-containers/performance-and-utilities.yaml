title: "Performance and the Collections utilities"
summary: "Timing containers, choosing between implementations, and the static helpers in Collections — sorting, searching, read-only and synchronized wrappers."
duration: 8
tags: [java, containers, performance, Collections, unmodifiable, synchronized, fail-fast]
sources:
  - { book: thinking-in-java, ref: "Chapter 17, Choosing an implementation; Utilities" }
steps:
  - type: explanation
    title: "Choosing an implementation"
    body: |
      `ArrayList` is fast for random access, slow to insert in the middle; `LinkedList` the reverse.
      `HashMap`/`HashSet` are the fast general choice; `TreeMap`/`TreeSet` keep order at some cost; `LinkedHash…` keep insertion order cheaply.

  - type: explanation
    title: "Collections utilities"
    body: |
      `Collections` has `sort`, `binarySearch`, `max`, `min`, `reverse`, `rotate`, `shuffle`, `swap`, `fill`, `frequency` and more.
      `unmodifiable…` wrappers make read-only views; `synchronized…` wrappers lock every call.
      Iterators are fail-fast: changing a collection outside its iterator causes `ConcurrentModificationException`.

  - type: choice
