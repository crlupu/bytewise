title: "Hashing and hash codes"
summary: "Why a key needs both hashCode and equals, how a hashed map works inside, writing a good hashCode, and weak references."
duration: 8
tags: [java, containers, hashCode, equals, HashMap, WeakHashMap, references]
sources:
  - { book: thinking-in-java, ref: "Chapter 17, Hashing and hash codes; Holding references" }
steps:
  - type: explanation
    title: "hashCode and equals"
    body: |
      A `HashMap` uses `hashCode()` to pick a bucket, then `equals()` to find the key in it.
      `Object`'s versions use identity, so two "equal" objects you create are different keys — unless you override both, consistently.

  - type: explanation
    title: "Inside a hash map"
    body: |
      The hash code, modulo the table size, selects a bucket; each bucket is a short list of entries.
      A good `hashCode` spreads values evenly: start with a constant like 17 and fold in each significant field with `37 * result + field`.
      A `WeakHashMap` lets its keys be garbage-collected when nothing else refers to them.

  - type: choice
    id: tij-containers-groundhog
    prompt: |
      Two `new Groundhog(3)` objects — are they the same `HashMap` key?
    code: |
      //: containers/Groundhog.java
      // Looks plausible, but doesn't work as a HashMap key.

      public class Groundhog {
        protected int number;
        public Groundhog(int n) { number = n; }
        public String toString() {
          return "Groundhog #" + number;
        }
      }
    language: java
    options:
      - text: "No — `Groundhog` inherits `Object`'s identity-based `hashCode` and `equals`"
        correct: true
      - text: "Yes — they have the same number"
        feedback: "Nothing compares `number`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-containers-groundhog2
    prompt: |
      Why does `equals` check `o instanceof Groundhog2`?
    code: |
      //: containers/Groundhog2.java
      // A class that's used as a key in a HashMap
      // must override hashCode() and equals().

      public class Groundhog2 extends Groundhog {
        public Groundhog2(int n) { super(n); }
        public int hashCode() { return number; }
        public boolean equals(Object o) {
          return o instanceof Groundhog2 &&
            (number == ((Groundhog2)o).number);
        }
      }
    language: java
    options:
      - text: "`equals` takes any `Object`; it must return false for other types (and for `null`)"
        correct: true
      - text: "For speed"
        feedback: "It's for correctness."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

