  - type: choice
    id: tij-containers-mapentry
    prompt: |
      Why does `MapEntry.hashCode` combine the key's and value's hash codes with `^`?
    code: |
      //: containers/MapEntry.java
      // A simple Map.Entry for sample Map implementations.
      import java.util.*;

      public class MapEntry<K,V> implements Map.Entry<K,V> {
        private K key;
        private V value;
        public MapEntry(K key, V value) {
          this.key = key;
          this.value = value;
        }
        public K getKey() { return key; }
        public V getValue() { return value; }
        public V setValue(V v) {
          V result = value;
          value = v;
          return result;
        }
        public int hashCode() {
          return (key==null ? 0 : key.hashCode()) ^
            (value==null ? 0 : value.hashCode());
        }
        public boolean equals(Object o) {
          if(!(o instanceof MapEntry)) return false;
          MapEntry me = (MapEntry)o;
          return
            (key == null ?
             me.getKey() == null : key.equals(me.getKey())) &&
            (value == null ?
             me.getValue()== null : value.equals(me.getValue()));
        }
        public String toString() { return key + "=" + value; }
      }
    language: java
    options:
      - text: "That's the contract for `Map.Entry`: equal entries (same key and value) must have equal hash codes"
        correct: true
      - text: "For speed only"
        feedback: "It follows the `Map.Entry` specification."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-containers-slowmap
    prompt: |
      Why is `SlowMap` slow?
    code: |
      //: containers/SlowMap.java
      // A Map implemented with ArrayLists.
      import java.util.*;
      import net.mindview.util.*;

      public class SlowMap<K,V> extends AbstractMap<K,V> {
        private List<K> keys = new ArrayList<K>();
        private List<V> values = new ArrayList<V>();
        public V put(K key, V value) {
          V oldValue = get(key); // The old value or null
          if(!keys.contains(key)) {
            keys.add(key);
            values.add(value);
          } else
            values.set(keys.indexOf(key), value);
          return oldValue;
        }
        public V get(Object key) { // key is type Object, not K
          if(!keys.contains(key))
            return null;
          return values.get(keys.indexOf(key));
        }
        public Set<Map.Entry<K,V>> entrySet() {
          Set<Map.Entry<K,V>> set= new HashSet<Map.Entry<K,V>>();
          Iterator<K> ki = keys.iterator();
          Iterator<V> vi = values.iterator();
          while(ki.hasNext())
            set.add(new MapEntry<K,V>(ki.next(), vi.next()));
          return set;
        }
        public static void main(String[] args) {
          SlowMap<String,String> m= new SlowMap<String,String>();
          m.putAll(Countries.capitals(15));
          System.out.println(m);
          System.out.println(m.get("BULGARIA"));
          System.out.println(m.entrySet());
        }
      }
    language: java
    options:
      - text: "`get` searches the key list linearly — O(n) per lookup"
        correct: true
      - text: "It copies the lists on every `put`"
        feedback: "The search is the cost."
    explanation: |
      `m.get("BULGARIA")` prints `null`: it isn't among the 15 countries.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-containers-simplehashmap
    prompt: |
      How does `put` find where a key goes?
    code: |
      //: containers/SimpleHashMap.java
      // A demonstration hashed Map.
      import java.util.*;
      import net.mindview.util.*;

      public class SimpleHashMap<K,V> extends AbstractMap<K,V> {
        // Choose a prime number for the hash table
        // size, to achieve a uniform distribution:
        static final int SIZE = 997;
        // You can't have a physical array of generics,
        // but you can upcast to one:
        @SuppressWarnings("unchecked")
        LinkedList<MapEntry<K,V>>[] buckets =
          new LinkedList[SIZE];
        public V put(K key, V value) {
          V oldValue = null;
          int index = Math.abs(key.hashCode()) % SIZE;
          if(buckets[index] == null)
            buckets[index] = new LinkedList<MapEntry<K,V>>();
          LinkedList<MapEntry<K,V>> bucket = buckets[index];
          MapEntry<K,V> pair = new MapEntry<K,V>(key, value);
          boolean found = false;
          ListIterator<MapEntry<K,V>> it = bucket.listIterator();
          while(it.hasNext()) {
            MapEntry<K,V> iPair = it.next();
            if(iPair.getKey().equals(key)) {
              oldValue = iPair.getValue();
              it.set(pair); // Replace old with new
              found = true;
              break;
            }
          }
          if(!found)
            buckets[index].add(pair);
          return oldValue;
        }
        public V get(Object key) {
          int index = Math.abs(key.hashCode()) % SIZE;
          if(buckets[index] == null) return null;
          for(MapEntry<K,V> iPair : buckets[index])
            if(iPair.getKey().equals(key))
              return iPair.getValue();
          return null;
        }
        public Set<Map.Entry<K,V>> entrySet() {
          Set<Map.Entry<K,V>> set= new HashSet<Map.Entry<K,V>>();
          for(LinkedList<MapEntry<K,V>> bucket : buckets) {
            if(bucket == null) continue;
            for(MapEntry<K,V> mpair : bucket)
              set.add(mpair);
          }
          return set;
        }
        public static void main(String[] args) {
          SimpleHashMap<String,String> m =
            new SimpleHashMap<String,String>();
          m.putAll(Countries.capitals(25));
          System.out.println(m);
          System.out.println(m.get("ERITREA"));
          System.out.println(m.entrySet());
        }
      }
    language: java
    options:
      - text: "`Math.abs(key.hashCode()) % SIZE` picks a bucket; then it searches that bucket's list with `equals`"
        correct: true
      - text: "It searches every bucket"
        feedback: "Only the one bucket the hash selects."
      - text: "It sorts the keys"
        feedback: "No sorting — that's a `TreeMap`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

