  - type: choice
    id: tij-containers-countedstring
    prompt: |
      Five `CountedString("hi")` objects get ids 1–5. Why does each lookup find its own value? (`print` is `println`.)
    code: |
      //: containers/CountedString.java
      // Creating a good hashCode().
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class CountedString {
        private static List<String> created =
          new ArrayList<String>();
        private String s;
        private int id = 0;
        public CountedString(String str) {
          s = str;
          created.add(s);
          // id is the total number of instances
          // of this string in use by CountedString:
          for(String s2 : created)
            if(s2.equals(s))
              id++;
        }
        public String toString() {
          return "String: " + s + " id: " + id +
            " hashCode(): " + hashCode();
        }
        public int hashCode() {
          // The very simple approach:
          // return s.hashCode() * id;
          // Using Joshua Bloch's recipe:
          int result = 17;
          result = 37 * result + s.hashCode();
          result = 37 * result + id;
          return result;
        }
        public boolean equals(Object o) {
          return o instanceof CountedString &&
            s.equals(((CountedString)o).s) &&
            id == ((CountedString)o).id;
        }
        public static void main(String[] args) {
          Map<CountedString,Integer> map =
            new HashMap<CountedString,Integer>();
          CountedString[] cs = new CountedString[5];
          for(int i = 0; i < cs.length; i++) {
            cs[i] = new CountedString("hi");
            map.put(cs[i], i); // Autobox int -> Integer
          }
          print(map);
          for(CountedString cstring : cs) {
            print("Looking up " + cstring);
            print(map.get(cstring));
          }
        }
      }
    language: java
    options:
      - text: "`hashCode` and `equals` both use the string and the id, so each is a distinct, findable key"
        correct: true
      - text: "They all collide on one entry"
        feedback: "The id makes each key different."
      - text: "`HashMap` compares by identity"
        feedback: "It uses `hashCode` and `equals`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-containers-canonicalmapping
    prompt: |
      Every third key is kept in `keys[]`. After `System.gc()`, which entries can the `WeakHashMap` drop?
    code: |
      //: containers/CanonicalMapping.java
      // Demonstrates WeakHashMap.
      import java.util.*;

      class Element {
        private String ident;
        public Element(String id) { ident = id; }
        public String toString() { return ident; }
        public int hashCode() { return ident.hashCode(); }
        public boolean equals(Object r) {
          return r instanceof Element &&
            ident.equals(((Element)r).ident);
        }
        protected void finalize() {
          System.out.println("Finalizing " +
            getClass().getSimpleName() + " " + ident);
        }
      }

      class Key extends Element {
        public Key(String id) { super(id); }
      }

      class Value extends Element {
        public Value(String id) { super(id); }
      }

      public class CanonicalMapping {
        public static void main(String[] args) {
          int size = 1000;
          // Or, choose size via the command line:
          if(args.length > 0)
            size = new Integer(args[0]);
          Key[] keys = new Key[size];
          WeakHashMap<Key,Value> map =
            new WeakHashMap<Key,Value>();
          for(int i = 0; i < size; i++) {
            Key k = new Key(Integer.toString(i));
            Value v = new Value(Integer.toString(i));
            if(i % 3 == 0)
              keys[i] = k; // Save as "real" references
            map.put(k, v);
          }
          System.gc();
        }
      }
    language: java
    options:
      - text: "Those whose keys aren't stored in `keys[]` — nothing else refers to them"
        correct: true
      - text: "All of them"
        feedback: "Keys still referenced from `keys[]` stay."
      - text: "None — maps hold strong references"
        feedback: "A `WeakHashMap` holds its keys weakly."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-containers-references
    prompt: |
      Which reference type is cleared most readily by the garbage collector?
    code: |
      //: containers/References.java
      // Demonstrates Reference objects
      import java.lang.ref.*;
      import java.util.*;

      class VeryBig {
        private static final int SIZE = 10000;
        private long[] la = new long[SIZE];
        private String ident;
        public VeryBig(String id) { ident = id; }
        public String toString() { return ident; }
        protected void finalize() {
          System.out.println("Finalizing " + ident);
        }
      }

      public class References {
        private static ReferenceQueue<VeryBig> rq =
          new ReferenceQueue<VeryBig>();
        public static void checkQueue() {
          Reference<? extends VeryBig> inq = rq.poll();
          if(inq != null)
            System.out.println("In queue: " + inq.get());
        }
        public static void main(String[] args) {
          int size = 10;
          // Or, choose size via the command line:
          if(args.length > 0)
            size = new Integer(args[0]);
          LinkedList<SoftReference<VeryBig>> sa =
            new LinkedList<SoftReference<VeryBig>>();
          for(int i = 0; i < size; i++) {
            sa.add(new SoftReference<VeryBig>(
              new VeryBig("Soft " + i), rq));
            System.out.println("Just created: " + sa.getLast());
            checkQueue();
          }
          LinkedList<WeakReference<VeryBig>> wa =
            new LinkedList<WeakReference<VeryBig>>();
          for(int i = 0; i < size; i++) {
            wa.add(new WeakReference<VeryBig>(
              new VeryBig("Weak " + i), rq));
            System.out.println("Just created: " + wa.getLast());
            checkQueue();
          }
          SoftReference<VeryBig> s =
            new SoftReference<VeryBig>(new VeryBig("Soft"));
          WeakReference<VeryBig> w =
            new WeakReference<VeryBig>(new VeryBig("Weak"));
          System.gc();
          LinkedList<PhantomReference<VeryBig>> pa =
            new LinkedList<PhantomReference<VeryBig>>();
          for(int i = 0; i < size; i++) {
            pa.add(new PhantomReference<VeryBig>(
              new VeryBig("Phantom " + i), rq));
            System.out.println("Just created: " + pa.getLast());
            checkQueue();
          }
        }
      }
    language: java
    options:
      - text: "`WeakReference` (and `PhantomReference`, which never lets you `get` the object at all)"
        correct: true
      - text: "`SoftReference`"
        feedback: "Soft references are kept until memory runs low."
      - text: "A normal reference"
        feedback: "Strong references are never cleared while reachable."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
