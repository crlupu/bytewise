  - type: predict
    id: tij-containers-springdetector
    prompt: |
      The map has keys `Groundhog #0` … `#9`. A new `Groundhog(3)` is looked up. What is the last line printed? (`print` is `println`.)
    code: |
      //: containers/SpringDetector.java
      // What will the weather be?
      import java.lang.reflect.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class SpringDetector {
        // Uses a Groundhog or class derived from Groundhog:
        public static <T extends Groundhog>
        void detectSpring(Class<T> type) throws Exception {
          Constructor<T> ghog = type.getConstructor(int.class);
          Map<Groundhog,Prediction> map =
            new HashMap<Groundhog,Prediction>();
          for(int i = 0; i < 10; i++)
            map.put(ghog.newInstance(i), new Prediction());
          print("map = " + map);
          Groundhog gh = ghog.newInstance(3);
          print("Looking up prediction for " + gh);
          if(map.containsKey(gh))
            print(map.get(gh));
          else
            print("Key not found: " + gh);
        }
        public static void main(String[] args) throws Exception {
          detectSpring(Groundhog.class);
        }
      }
    language: java
    options:
      - text: "Key not found: Groundhog #3"
        correct: true
      - text: "Early Spring!"
        feedback: "`Groundhog` doesn't override `hashCode`/`equals`, so the new object matches no key."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

