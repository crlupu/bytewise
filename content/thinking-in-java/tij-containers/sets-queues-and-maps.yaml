  - type: predict
    id: tij-containers-linkedhashmapdemo
    prompt: |
      The access-ordered map holds keys 0–8. After `get(0)` … `get(5)`, what does it print? (`print` is `println`.)
    code: |
      //: containers/LinkedHashMapDemo.java
      // What you can do with a LinkedHashMap.
      import java.util.*;
      import net.mindview.util.*;
      import static net.mindview.util.Print.*;

      public class LinkedHashMapDemo {
        public static void main(String[] args) {
          LinkedHashMap<Integer,String> linkedMap =
            new LinkedHashMap<Integer,String>(
              new CountingMapData(9));
          print(linkedMap);
          // Least-recently-used order:
          linkedMap =
            new LinkedHashMap<Integer,String>(16, 0.75f, true);
          linkedMap.putAll(new CountingMapData(9));
          print(linkedMap);
          for(int i = 0; i < 6; i++) // Cause accesses:
            linkedMap.get(i);
          print(linkedMap);
          linkedMap.get(0);
          print(linkedMap);
        }
      }
    language: java
    options:
      - text: "{6=G0, 7=H0, 8=I0, 0=A0, 1=B0, 2=C0, 3=D0, 4=E0, 5=F0}"
        correct: true
      - text: "{0=A0, 1=B0, 2=C0, 3=D0, 4=E0, 5=F0, 6=G0, 7=H0, 8=I0}"
        feedback: "With access order, accessed entries move to the end."
      - text: "{5=F0, 4=E0, 3=D0, 2=C0, 1=B0, 0=A0, 6=G0, 7=H0, 8=I0}"
        feedback: "Least recently used come first; the accessed ones follow in access order."
