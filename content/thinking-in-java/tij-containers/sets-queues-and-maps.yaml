title: "Sets, queues and maps in detail"
summary: "What your class needs for each kind of Set, sorted sets and maps, deques, priority queues, and the map implementations."
duration: 8
tags: [java, containers, Set, SortedSet, Deque, PriorityQueue, Map, TreeMap, LinkedHashMap]
sources:
  - { book: thinking-in-java, ref: "Chapter 17, Sets and storage order; Queues; Understanding Maps" }
steps:
  - type: explanation
    title: "Requirements"
    body: |
      Any `Set` needs `equals`; a `HashSet`/`LinkedHashSet` also needs a matching `hashCode`; a `TreeSet` needs `Comparable` (or a `Comparator`).
      Break those rules and you get duplicates, or a `ClassCastException`.

  - type: explanation
    title: "Sorted and ordered"
    body: |
      `TreeSet`/`TreeMap` keep keys sorted and offer `first`/`last`, `subSet`/`subMap`, `headSet`/`headMap` and `tailSet`/`tailMap` — `head` excludes its bound, `tail` includes it.
      `LinkedHashMap` keeps insertion order — or, with `accessOrder` true, least-recently-used order.

  - type: choice
    id: tij-containers-typesforsets
    prompt: |
      `SetType` overrides `equals` but not `hashCode`. What happens when 0–9 are added three times to a `HashSet<SetType>`?
    code: |
      //: containers/TypesForSets.java
      // Methods necessary to put your own type in a Set.
      import java.util.*;

      class SetType {
        int i;
        public SetType(int n) { i = n; }
        public boolean equals(Object o) {
          return o instanceof SetType && (i == ((SetType)o).i);
        }
        public String toString() { return Integer.toString(i); }
      }

      class HashType extends SetType {
        public HashType(int n) { super(n); }
        public int hashCode() { return i; }
      }

      class TreeType extends SetType
      implements Comparable<TreeType> {
        public TreeType(int n) { super(n); }
        public int compareTo(TreeType arg) {
          return (arg.i < i ? -1 : (arg.i == i ? 0 : 1));
        }
      }

      public class TypesForSets {
        static <T> Set<T> fill(Set<T> set, Class<T> type) {
          try {
            for(int i = 0; i < 10; i++)
                set.add(
                  type.getConstructor(int.class).newInstance(i));
          } catch(Exception e) {
            throw new RuntimeException(e);
          }
          return set;
        }
        static <T> void test(Set<T> set, Class<T> type) {
          fill(set, type);
          fill(set, type); // Try to add duplicates
          fill(set, type);
          System.out.println(set);
        }
        public static void main(String[] args) {
          test(new HashSet<HashType>(), HashType.class);
          test(new LinkedHashSet<HashType>(), HashType.class);
          test(new TreeSet<TreeType>(), TreeType.class);
          // Things that don't work:
          test(new HashSet<SetType>(), SetType.class);
          test(new HashSet<TreeType>(), TreeType.class);
          test(new LinkedHashSet<SetType>(), SetType.class);
          test(new LinkedHashSet<TreeType>(), TreeType.class);
          try {
            test(new TreeSet<SetType>(), SetType.class);
          } catch(Exception e) {
            System.out.println(e.getMessage());
          }
          try {
            test(new TreeSet<HashType>(), HashType.class);
          } catch(Exception e) {
            System.out.println(e.getMessage());
          }
        }
      }
    language: java
    options:
      - text: "30 elements — equal objects land in different buckets, so duplicates aren't found"
        correct: true
      - text: "10 elements"
        feedback: "Without a matching `hashCode`, `equals` is never consulted."
      - text: "`ClassCastException`"
        feedback: "That's for a `TreeSet` without `Comparable`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-containers-sortedsetdemo
    prompt: |
      The sorted set is `[eight, five, four, one, seven, six, three, two]`; `low` = `one`, `high` = `two`. What do `subSet(low, high)` and `headSet(high)` print? (`print` is `println`.)
    code: |
      //: containers/SortedSetDemo.java
      // What you can do with a TreeSet.
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class SortedSetDemo {
        public static void main(String[] args) {
          SortedSet<String> sortedSet = new TreeSet<String>();
          Collections.addAll(sortedSet,
            "one two three four five six seven eight"
              .split(" "));
          print(sortedSet);
          String low = sortedSet.first();
          String high = sortedSet.last();
          print(low);
          print(high);
          Iterator<String> it = sortedSet.iterator();
          for(int i = 0; i <= 6; i++) {
            if(i == 3) low = it.next();
            if(i == 6) high = it.next();
            else it.next();
          }
          print(low);
          print(high);
          print(sortedSet.subSet(low, high));
          print(sortedSet.headSet(high));
          print(sortedSet.tailSet(low));
        }
      }
    language: java
    options:
      - text: "[one, seven, six, three]\n[eight, five, four, one, seven, six, three]"
        correct: true
      - text: "[one, seven, six, three, two]\n[eight, five, four, one, seven, six, three, two]"
        feedback: "The upper bound is exclusive."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-containers-queuebehavior
    prompt: |
      `one` … `ten` are offered in order. What does the `PriorityQueue` print?
    code: |
      //: containers/QueueBehavior.java
      // Compares the behavior of some of the queues
      import java.util.concurrent.*;
      import java.util.*;
      import net.mindview.util.*;

      public class QueueBehavior {
        private static int count = 10;
        static <T> void test(Queue<T> queue, Generator<T> gen) {
          for(int i = 0; i < count; i++)
            queue.offer(gen.next());
          while(queue.peek() != null)
            System.out.print(queue.remove() + " ");
          System.out.println();
        }
        static class Gen implements Generator<String> {
          String[] s = ("one two three four five six seven " +
            "eight nine ten").split(" ");
          int i;
          public String next() { return s[i++]; }
        }
        public static void main(String[] args) {
          test(new LinkedList<String>(), new Gen());
          test(new PriorityQueue<String>(), new Gen());
          test(new ArrayBlockingQueue<String>(count), new Gen());
          test(new ConcurrentLinkedQueue<String>(), new Gen());
          test(new LinkedBlockingQueue<String>(), new Gen());
          test(new PriorityBlockingQueue<String>(), new Gen());
        }
      }
    language: java
    options:
      - text: "eight five four nine one seven six ten three two "
        correct: true
      - text: "one two three four five six seven eight nine ten "
        feedback: "A priority queue removes the smallest first — alphabetically for strings."
      - text: "ten nine eight seven six five four three two one "
        feedback: "Smallest first, not reverse insertion."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-containers-dequetest
    prompt: |
      20–26 are added with `addFirst`, then 50–54 with `addLast`. What does `print(di)` show? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: containers/DequeTest.java
      import net.mindview.util.*;
      import static net.mindview.util.Print.*;

      public class DequeTest {
        static void fillTest(Deque<Integer> deque) {
          for(int i = 20; i < 27; i++)
            deque.addFirst(i);
          for(int i = 50; i < 55; i++)
            deque.addLast(i);
        }
        public static void main(String[] args) {
          Deque<Integer> di = new Deque<Integer>();
          fillTest(di);
          print(di);
          while(di.size() != 0)
            printnb(di.removeFirst() + " ");
          print();
          fillTest(di);
          while(di.size() != 0)
            printnb(di.removeLast() + " ");
        }
      }
    language: java
    options:
      - text: "[26, 25, 24, 23, 22, 21, 20, 50, 51, 52, 53, 54]"
        correct: true
      - text: "[20, 21, 22, 23, 24, 25, 26, 50, 51, 52, 53, 54]"
        feedback: "Each `addFirst` puts the new number in front."
    explanation: |
