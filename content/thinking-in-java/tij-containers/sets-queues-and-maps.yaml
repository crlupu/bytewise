  - type: predict
    id: tij-containers-todolist
    prompt: |
      Items compare by priority letter, then number. What are the first two removed?
    code: |
      //: containers/ToDoList.java
      // A more complex use of PriorityQueue.
      import java.util.*;

      class ToDoList extends PriorityQueue<ToDoList.ToDoItem> {
        static class ToDoItem implements Comparable<ToDoItem> {
          private char primary;
          private int secondary;
          private String item;
          public ToDoItem(String td, char pri, int sec) {
            primary = pri;
            secondary = sec;
            item = td;
          }
          public int compareTo(ToDoItem arg) {
            if(primary > arg.primary)
              return +1;
            if(primary == arg.primary)
              if(secondary > arg.secondary)
                return +1;
              else if(secondary == arg.secondary)
                return 0;
            return -1;
          }
          public String toString() {
            return Character.toString(primary) +
              secondary + ": " + item;
          }
        }
        public void add(String td, char pri, int sec) {
          super.add(new ToDoItem(td, pri, sec));
        }
        public static void main(String[] args) {
          ToDoList toDoList = new ToDoList();
          toDoList.add("Empty trash", 'C', 4);
          toDoList.add("Feed dog", 'A', 2);
          toDoList.add("Feed bird", 'B', 7);
          toDoList.add("Mow lawn", 'C', 3);
          toDoList.add("Water lawn", 'A', 1);
          toDoList.add("Feed cat", 'B', 1);
          while(!toDoList.isEmpty())
            System.out.println(toDoList.remove());
        }
      }
    language: java
    options:
      - text: "A1: Water lawn\nA2: Feed dog"
        correct: true
      - text: "C4: Empty trash\nA2: Feed dog"
        feedback: "A priority queue hands out the smallest first, not insertion order."
      - text: "A2: Feed dog\nA1: Water lawn"
        feedback: "Within A, 1 comes before 2."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-containers-associativearray
    prompt: |
      The array holds 6 pairs; a 7th `put` throws. What are the first two lines printed? (`print` is `println`.)
    code: |
      //: containers/AssociativeArray.java
      // Associates keys with values.
      import static net.mindview.util.Print.*;

      public class AssociativeArray<K,V> {
        private Object[][] pairs;
        private int index;
        public AssociativeArray(int length) {
          pairs = new Object[length][2];
        }
        public void put(K key, V value) {
          if(index >= pairs.length)
            throw new ArrayIndexOutOfBoundsException();
          pairs[index++] = new Object[]{ key, value };
        }
        @SuppressWarnings("unchecked")
        public V get(K key) {
          for(int i = 0; i < index; i++)
            if(key.equals(pairs[i][0]))
              return (V)pairs[i][1];
          return null; // Did not find key
        }
        public String toString() {
          StringBuilder result = new StringBuilder();
          for(int i = 0; i < index; i++) {
            result.append(pairs[i][0].toString());
            result.append(" : ");
            result.append(pairs[i][1].toString());
            if(i < index - 1)
              result.append("\n");
          }
          return result.toString();
        }
        public static void main(String[] args) {
          AssociativeArray<String,String> map =
            new AssociativeArray<String,String>(6);
          map.put("sky", "blue");
          map.put("grass", "green");
          map.put("ocean", "dancing");
          map.put("tree", "tall");
          map.put("earth", "brown");
          map.put("sun", "warm");
          try {
            map.put("extra", "object"); // Past the end
          } catch(ArrayIndexOutOfBoundsException e) {
            print("Too many objects!");
          }
          print(map);
          print(map.get("ocean"));
        }
      }
    language: java
    options:
      - text: "Too many objects!\nsky : blue"
        correct: true
      - text: "sky : blue\ngrass : green"
        feedback: "The failed `put` is caught first, printing `Too many objects!`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-containers-maps
    prompt: |
      `map.keySet().removeAll(map.keySet())` — what happens to the map? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: containers/Maps.java
      // Things you can do with Maps.
      import java.util.concurrent.*;
      import java.util.*;
      import net.mindview.util.*;
      import static net.mindview.util.Print.*;

      public class Maps {
        public static void printKeys(Map<Integer,String> map) {
          printnb("Size = " + map.size() + ", ");
          printnb("Keys: ");
          print(map.keySet()); // Produce a Set of the keys
        }
        public static void test(Map<Integer,String> map) {
          print(map.getClass().getSimpleName());
          map.putAll(new CountingMapData(25));
          // Map has 'Set' behavior for keys:
          map.putAll(new CountingMapData(25));
          printKeys(map);
          // Producing a Collection of the values:
          printnb("Values: ");
          print(map.values());
          print(map);
          print("map.containsKey(11): " + map.containsKey(11));
          print("map.get(11): " + map.get(11));
          print("map.containsValue(\"F0\"): "
            + map.containsValue("F0"));
          Integer key = map.keySet().iterator().next();
          print("First key in map: " + key);
          map.remove(key);
          printKeys(map);
          map.clear();
          print("map.isEmpty(): " + map.isEmpty());
          map.putAll(new CountingMapData(25));
          // Operations on the Set change the Map:
          map.keySet().removeAll(map.keySet());
          print("map.isEmpty(): " + map.isEmpty());
        }
        public static void main(String[] args) {
          test(new HashMap<Integer,String>());
          test(new TreeMap<Integer,String>());
          test(new LinkedHashMap<Integer,String>());
          test(new IdentityHashMap<Integer,String>());
          test(new ConcurrentHashMap<Integer,String>());
          test(new WeakHashMap<Integer,String>());
        }
      }
    language: java
    options:
      - text: "It's emptied: the key set is a view, so removing keys removes their entries"
        correct: true
      - text: "Nothing — `keySet()` is a copy"
        feedback: "It's a live view."
      - text: "`ConcurrentModificationException`"
        feedback: "The output shows `map.isEmpty(): true`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-containers-sortedmapdemo
    prompt: |
      Keys are 0–9; `low` = 3 and `high` = 7. What does `subMap(low, high)` print? (`print` is `println`.)
    code: |
      //: containers/SortedMapDemo.java
      // What you can do with a TreeMap.
      import java.util.*;
      import net.mindview.util.*;
      import static net.mindview.util.Print.*;

      public class SortedMapDemo {
        public static void main(String[] args) {
          TreeMap<Integer,String> sortedMap =
            new TreeMap<Integer,String>(new CountingMapData(10));
          print(sortedMap);
          Integer low = sortedMap.firstKey();
          Integer high = sortedMap.lastKey();
          print(low);
          print(high);
          Iterator<Integer> it = sortedMap.keySet().iterator();
          for(int i = 0; i <= 6; i++) {
            if(i == 3) low = it.next();
            if(i == 6) high = it.next();
            else it.next();
          }
          print(low);
          print(high);
          print(sortedMap.subMap(low, high));
          print(sortedMap.headMap(high));
          print(sortedMap.tailMap(low));
        }
      }
    language: java
    options:
      - text: "{3=D0, 4=E0, 5=F0, 6=G0}"
        correct: true
      - text: "{3=D0, 4=E0, 5=F0, 6=G0, 7=H0}"
        feedback: "The upper bound is exclusive."
      - text: "{4=E0, 5=F0, 6=G0}"
        feedback: "The lower bound is inclusive."
