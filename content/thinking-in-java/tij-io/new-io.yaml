title: "New I/O — channels and buffers"
summary: "FileChannel and ByteBuffer, views as other types, byte order, character sets, memory-mapped files and file locks."
duration: 8
tags: [java, nio, FileChannel, ByteBuffer, memory-mapped, FileLock, charset]
sources:
  - { book: thinking-in-java, ref: "Chapter 18, New I/O" }
steps:
  - type: explanation
    title: "Channels and buffers"
    body: |
      A `FileChannel` moves bytes between a file and a `ByteBuffer`.
      Before reading the bytes you've put in a buffer, call `flip()`; to fill it again, `clear()`.
      A buffer can be viewed as chars, ints or doubles — in big-endian order unless you change it.

  - type: explanation
    title: "Mapping and locking"
    body: |
      `channel.map(…)` maps a file into memory, so you can treat a huge file like an array.
      `channel.lock()`/`tryLock()` lock a file or a region of it against other processes.

  - type: predict
    id: tij-io-getchannel
    prompt: |
      What does this print?
    code: |
      //: io/GetChannel.java
      // Getting channels from streams
      import java.nio.*;
      import java.nio.channels.*;
      import java.io.*;

      public class GetChannel {
        private static final int BSIZE = 1024;
        public static void main(String[] args) throws Exception {
          // Write a file:
          FileChannel fc =
            new FileOutputStream("data.txt").getChannel();
          fc.write(ByteBuffer.wrap("Some text ".getBytes()));
          fc.close();
          // Add to the end of the file:
          fc =
            new RandomAccessFile("data.txt", "rw").getChannel();
          fc.position(fc.size()); // Move to the end
          fc.write(ByteBuffer.wrap("Some more".getBytes()));
          fc.close();
          // Read the file:
          fc = new FileInputStream("data.txt").getChannel();
          ByteBuffer buff = ByteBuffer.allocate(BSIZE);
          fc.read(buff);
          buff.flip();
          while(buff.hasRemaining())
            System.out.print((char)buff.get());
        }
      }
    language: java
    options:
      - text: "Some text Some more"
        correct: true
      - text: "Some more"
        feedback: "The second channel positions itself at the end before writing."
      - text: "Some text "
        feedback: "`position(fc.size())` appends."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-io-channelcopy
    prompt: |
      Why `flip()` before writing and `clear()` after?
    code: |
      //: io/ChannelCopy.java
      // Copying a file using channels and buffers
      import java.nio.*;
      import java.nio.channels.*;
      import java.io.*;

      public class ChannelCopy {
        private static final int BSIZE = 1024;
        public static void main(String[] args) throws Exception {
          if(args.length != 2) {
            System.out.println("arguments: sourcefile destfile");
            System.exit(1);
          }
          FileChannel
            in = new FileInputStream(args[0]).getChannel(),
            out = new FileOutputStream(args[1]).getChannel();
          ByteBuffer buffer = ByteBuffer.allocate(BSIZE);
          while(in.read(buffer) != -1) {
            buffer.flip(); // Prepare for writing
            out.write(buffer);
            buffer.clear();  // Prepare for reading
          }
        }
      }
    language: java
    options:
      - text: "`flip` sets the limit to what was read and rewinds, so `write` sends just that; `clear` resets for the next read"
        correct: true
      - text: "They aren't needed"
        feedback: "Without `flip`, `write` would send nothing — the position would be at the end."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-io-transferto
    prompt: |
      What does `in.transferTo(0, in.size(), out)` do?
    code: |
      //: io/TransferTo.java
      // Using transferTo() between channels
      import java.nio.channels.*;
      import java.io.*;

      public class TransferTo {
        public static void main(String[] args) throws Exception {
          if(args.length != 2) {
            System.out.println("arguments: sourcefile destfile");
            System.exit(1);
          }
          FileChannel
            in = new FileInputStream(args[0]).getChannel(),
            out = new FileOutputStream(args[1]).getChannel();
          in.transferTo(0, in.size(), out);
          // Or:
          // out.transferFrom(in, 0, in.size());
        }
      }
    language: java
    options:
      - text: "Copies the whole file from one channel to another directly, without your own buffer"
        correct: true
      - text: "Moves the file"
        feedback: "It copies the contents."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-io-buffertotext
    prompt: |
      Why does the first `buff.asCharBuffer()` print gibberish?
    code: |
      //: io/BufferToText.java
      // Converting text to and from ByteBuffers
      import java.nio.*;
      import java.nio.channels.*;
      import java.nio.charset.*;
      import java.io.*;

      public class BufferToText {
        private static final int BSIZE = 1024;
        public static void main(String[] args) throws Exception {
          FileChannel fc =
            new FileOutputStream("data2.txt").getChannel();
          fc.write(ByteBuffer.wrap("Some text".getBytes()));
          fc.close();
          fc = new FileInputStream("data2.txt").getChannel();
          ByteBuffer buff = ByteBuffer.allocate(BSIZE);
          fc.read(buff);
          buff.flip();
          // Doesn't work:
          System.out.println(buff.asCharBuffer());
          // Decode using this system's default Charset:
          buff.rewind();
          String encoding = System.getProperty("file.encoding");
          System.out.println("Decoded using " + encoding + ": "
            + Charset.forName(encoding).decode(buff));
          // Or, we could encode with something that will print:
          fc = new FileOutputStream("data2.txt").getChannel();
          fc.write(ByteBuffer.wrap(
            "Some text".getBytes("UTF-16BE")));
          fc.close();
          // Now try reading again:
          fc = new FileInputStream("data2.txt").getChannel();
          buff.clear();
          fc.read(buff);
          buff.flip();
          System.out.println(buff.asCharBuffer());
          // Use a CharBuffer to write through:
          fc = new FileOutputStream("data2.txt").getChannel();
          buff = ByteBuffer.allocate(24); // More than needed
          buff.asCharBuffer().put("Some text");
          fc.write(buff);
          fc.close();
          // Read and display:
          fc = new FileInputStream("data2.txt").getChannel();
          buff.clear();
          fc.read(buff);
          buff.flip();
          System.out.println(buff.asCharBuffer());
        }
      }
    language: java
    options:
      - text: "The bytes were written in the platform encoding, but `asCharBuffer` reads them as UTF-16 pairs"
        correct: true
      - text: "The file is empty"
        feedback: "It has the bytes of \"Some text\"."
    explanation: |
      Decoding with the right `Charset`, or writing with `UTF-16BE`, fixes it.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-io-availablecharsets
    prompt: |
      What does this print? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: io/AvailableCharSets.java
      // Displays Charsets and aliases
      import java.nio.charset.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class AvailableCharSets {
        public static void main(String[] args) {
          SortedMap<String,Charset> charSets =
            Charset.availableCharsets();
          Iterator<String> it = charSets.keySet().iterator();
          while(it.hasNext()) {
            String csName = it.next();
            printnb(csName);
            Iterator aliases =
              charSets.get(csName).aliases().iterator();
            if(aliases.hasNext())
              printnb(": ");
            while(aliases.hasNext()) {
              printnb(aliases.next());
              if(aliases.hasNext())
                printnb(", ");
            }
            print();
          }
        }
      }
    language: java
    options:
      - text: "Every character set the JVM supports, each with its aliases"
        correct: true
      - text: "The default charset only"
        feedback: "It loops over `availableCharsets()`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-io-getdata
    prompt: |
      `(short)471142` is stored then read back. What is the third line printed? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: io/GetData.java
      // Getting different representations from a ByteBuffer
      import java.nio.*;
      import static net.mindview.util.Print.*;

      public class GetData {
        private static final int BSIZE = 1024;
        public static void main(String[] args) {
          ByteBuffer bb = ByteBuffer.allocate(BSIZE);
          // Allocation automatically zeroes the ByteBuffer:
          int i = 0;
          while(i++ < bb.limit())
            if(bb.get() != 0)
              print("nonzero");
          print("i = " + i);
          bb.rewind();
          // Store and read a char array:
          bb.asCharBuffer().put("Howdy!");
          char c;
          while((c = bb.getChar()) != 0)
            printnb(c + " ");
          print();
          bb.rewind();
          // Store and read a short:
          bb.asShortBuffer().put((short)471142);
          print(bb.getShort());
          bb.rewind();
          // Store and read an int:
          bb.asIntBuffer().put(99471142);
          print(bb.getInt());
          bb.rewind();
          // Store and read a long:
          bb.asLongBuffer().put(99471142);
          print(bb.getLong());
          bb.rewind();
          // Store and read a float:
          bb.asFloatBuffer().put(99471142);
          print(bb.getFloat());
          bb.rewind();
          // Store and read a double:
          bb.asDoubleBuffer().put(99471142);
          print(bb.getDouble());
          bb.rewind();
        }
      }
    language: java
    options:
      - text: "12390"
        correct: true
      - text: "471142"
        feedback: "471142 doesn't fit in 16 bits; the cast keeps the low 16 bits, 12390."
    explanation: |
      The float line shows `9.9471144E7`: a float can't represent 99471142 exactly.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-io-viewbuffers
    prompt: |
      The 8 bytes are `0 0 0 0 0 0 0 97`. What does the `Int Buffer` line print? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: io/ViewBuffers.java
      import java.nio.*;
      import static net.mindview.util.Print.*;

      public class ViewBuffers {
        public static void main(String[] args) {
          ByteBuffer bb = ByteBuffer.wrap(
            new byte[]{ 0, 0, 0, 0, 0, 0, 0, 'a' });
          bb.rewind();
          printnb("Byte Buffer ");
          while(bb.hasRemaining())
            printnb(bb.position()+ " -> " + bb.get() + ", ");
          print();
          CharBuffer cb =
            ((ByteBuffer)bb.rewind()).asCharBuffer();
          printnb("Char Buffer ");
          while(cb.hasRemaining())
            printnb(cb.position() + " -> " + cb.get() + ", ");
          print();
          FloatBuffer fb =
            ((ByteBuffer)bb.rewind()).asFloatBuffer();
          printnb("Float Buffer ");
          while(fb.hasRemaining())
            printnb(fb.position()+ " -> " + fb.get() + ", ");
          print();
          IntBuffer ib =
            ((ByteBuffer)bb.rewind()).asIntBuffer();
          printnb("Int Buffer ");
          while(ib.hasRemaining())
            printnb(ib.position()+ " -> " + ib.get() + ", ");
          print();
          LongBuffer lb =
            ((ByteBuffer)bb.rewind()).asLongBuffer();
          printnb("Long Buffer ");
          while(lb.hasRemaining())
            printnb(lb.position()+ " -> " + lb.get() + ", ");
          print();
          ShortBuffer sb =
            ((ByteBuffer)bb.rewind()).asShortBuffer();
          printnb("Short Buffer ");
          while(sb.hasRemaining())
            printnb(sb.position()+ " -> " + sb.get() + ", ");
          print();
          DoubleBuffer db =
            ((ByteBuffer)bb.rewind()).asDoubleBuffer();
          printnb("Double Buffer ");
          while(db.hasRemaining())
            printnb(db.position()+ " -> " + db.get() + ", ");
        }
      }
    language: java
    options:
      - text: "Int Buffer 0 -> 0, 1 -> 97, "
        correct: true
      - text: "Int Buffer 0 -> 0, 1 -> 0, 2 -> 0, 3 -> 97, "
        feedback: "Each int takes 4 bytes; 8 bytes make two ints."
      - text: "Int Buffer 0 -> 97, "
        feedback: "Big-endian: the first 4 bytes are all zero."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-io-endians
    prompt: |
      What does the little-endian line show for `"abcdef"`? (`print` is `println`.)
    code: |
      //: io/Endians.java
      // Endian differences and data storage.
      import java.nio.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class Endians {
        public static void main(String[] args) {
          ByteBuffer bb = ByteBuffer.wrap(new byte[12]);
          bb.asCharBuffer().put("abcdef");
          print(Arrays.toString(bb.array()));
          bb.rewind();
          bb.order(ByteOrder.BIG_ENDIAN);
          bb.asCharBuffer().put("abcdef");
          print(Arrays.toString(bb.array()));
          bb.rewind();
          bb.order(ByteOrder.LITTLE_ENDIAN);
          bb.asCharBuffer().put("abcdef");
          print(Arrays.toString(bb.array()));
        }
      }
    language: java
    options:
      - text: "[97, 0, 98, 0, 99, 0, 100, 0, 101, 0, 102, 0]"
        correct: true
      - text: "[0, 97, 0, 98, 0, 99, 0, 100, 0, 101, 0, 102]"
        feedback: "That's big-endian, the default."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-io-intbufferdemo
    prompt: |
      After `ib.put(3, 1811)` and `flip()`, what's printed by the loop?
    code: |
      //: io/IntBufferDemo.java
      // Manipulating ints in a ByteBuffer with an IntBuffer
      import java.nio.*;

      public class IntBufferDemo {
        private static final int BSIZE = 1024;
        public static void main(String[] args) {
          ByteBuffer bb = ByteBuffer.allocate(BSIZE);
          IntBuffer ib = bb.asIntBuffer();
          // Store an array of int:
          ib.put(new int[]{ 11, 42, 47, 99, 143, 811, 1016 });
          // Absolute location read and write:
          System.out.println(ib.get(3));
          ib.put(3, 1811);
          // Setting a new limit before rewinding the buffer.
          ib.flip();
          while(ib.hasRemaining()) {
            int i = ib.get();
            System.out.println(i);
          }
        }
      }
    language: java
    options:
      - text: "11, 42, 47, 1811, 143, 811, 1016 — one per line"
        correct: true
      - text: "11, 42, 47, 99, 143, 811, 1016"
        feedback: "The absolute `put` replaced element 3."
      - text: "Nothing — the position is at the end"
        feedback: "`flip` sets the limit to the current position and rewinds to 0."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-io-usingbuffers
    prompt: |
      `symmetricScramble` swaps each pair of characters. What does this print? (`print` is `println`.)
    code: |
      //: io/UsingBuffers.java
      import java.nio.*;
      import static net.mindview.util.Print.*;

      public class UsingBuffers {
        private static void symmetricScramble(CharBuffer buffer){
          while(buffer.hasRemaining()) {
            buffer.mark();
            char c1 = buffer.get();
            char c2 = buffer.get();
            buffer.reset();
            buffer.put(c2).put(c1);
          }
        }
        public static void main(String[] args) {
          char[] data = "UsingBuffers".toCharArray();
          ByteBuffer bb = ByteBuffer.allocate(data.length * 2);
          CharBuffer cb = bb.asCharBuffer();
          cb.put(data);
          print(cb.rewind());
          symmetricScramble(cb);
          print(cb.rewind());
          symmetricScramble(cb);
          print(cb.rewind());
        }
      }
    language: java
    options:
      - text: "UsingBuffers\nsUniBgfuefsr\nUsingBuffers"
        correct: true
      - text: "UsingBuffers\nsreffuBgnisU\nUsingBuffers"
        feedback: "It swaps adjacent pairs, not the whole string."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-io-mappedio
    prompt: |
      Which is typically much faster with memory mapping?
    code: |
      //: io/MappedIO.java
      import java.nio.*;
      import java.nio.channels.*;
      import java.io.*;

      public class MappedIO {
        private static int numOfInts = 4000000;
        private static int numOfUbuffInts = 200000;
        private abstract static class Tester {
          private String name;
          public Tester(String name) { this.name = name; }
          public void runTest() {
            System.out.print(name + ": ");
            try {
              long start = System.nanoTime();
              test();
              double duration = System.nanoTime() - start;
              System.out.format("%.2f\n", duration/1.0e9);
            } catch(IOException e) {
              throw new RuntimeException(e);
            }
          }
          public abstract void test() throws IOException;
        }
        private static Tester[] tests = {
          new Tester("Stream Write") {
            public void test() throws IOException {
              DataOutputStream dos = new DataOutputStream(
                new BufferedOutputStream(
                  new FileOutputStream(new File("temp.tmp"))));
              for(int i = 0; i < numOfInts; i++)
                dos.writeInt(i);
              dos.close();
            }
          },
          new Tester("Mapped Write") {
            public void test() throws IOException {
              FileChannel fc =
                new RandomAccessFile("temp.tmp", "rw")
                .getChannel();
              IntBuffer ib = fc.map(
                FileChannel.MapMode.READ_WRITE, 0, fc.size())
                .asIntBuffer();
              for(int i = 0; i < numOfInts; i++)
                ib.put(i);
              fc.close();
            }
          },
          new Tester("Stream Read") {
            public void test() throws IOException {
              DataInputStream dis = new DataInputStream(
                new BufferedInputStream(
                  new FileInputStream("temp.tmp")));
              for(int i = 0; i < numOfInts; i++)
                dis.readInt();
              dis.close();
            }
          },
          new Tester("Mapped Read") {
            public void test() throws IOException {
              FileChannel fc = new FileInputStream(
                new File("temp.tmp")).getChannel();
              IntBuffer ib = fc.map(
                FileChannel.MapMode.READ_ONLY, 0, fc.size())
                .asIntBuffer();
              while(ib.hasRemaining())
                ib.get();
              fc.close();
            }
          },
          new Tester("Stream Read/Write") {
            public void test() throws IOException {
              RandomAccessFile raf = new RandomAccessFile(
                new File("temp.tmp"), "rw");
              raf.writeInt(1);
              for(int i = 0; i < numOfUbuffInts; i++) {
                raf.seek(raf.length() - 4);
                raf.writeInt(raf.readInt());
              }
              raf.close();
            }
          },
          new Tester("Mapped Read/Write") {
            public void test() throws IOException {
              FileChannel fc = new RandomAccessFile(
                new File("temp.tmp"), "rw").getChannel();
              IntBuffer ib = fc.map(
                FileChannel.MapMode.READ_WRITE, 0, fc.size())
                .asIntBuffer();
              ib.put(0);
              for(int i = 1; i < numOfUbuffInts; i++)
                ib.put(ib.get(i - 1));
              fc.close();
            }
          }
        };
        public static void main(String[] args) {
          for(Tester test : tests)
            test.runTest();
        }
      }
    language: java
    options:
      - text: "Read/write in place — `RandomAccessFile` seeks and reads each int, while the mapped buffer is just memory"
        correct: true
      - text: "Nothing — mapping only saves memory"
        feedback: "It's often dramatically faster, especially for random access."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
