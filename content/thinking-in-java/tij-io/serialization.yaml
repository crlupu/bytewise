title: "Object serialization"
summary: "Turning objects into bytes and back — webs of objects, Externalizable, transient, writeObject/readObject, and what isn't saved."
duration: 8
tags: [java, io, serialization, Serializable, Externalizable, transient]
sources:
  - { book: thinking-in-java, ref: "Chapter 18, Object serialization; Preferences" }
steps:
  - type: explanation
    title: "Serializable"
    body: |
      Implementing `Serializable` lets `ObjectOutputStream` write an object — and everything it refers to.
      Reading it back doesn't call the class's constructor, but the class must be available.
      `transient` fields aren't saved, and static fields belong to the class, not the object.

  - type: explanation
    title: "Taking control"
    body: |
      `Externalizable` makes you write and read every field yourself, and calls the public no-arg constructor on reading.
      Or keep `Serializable` and add private `writeObject`/`readObject` methods that call `defaultWriteObject`/`defaultReadObject`.

  - type: choice
    id: tij-io-worm
    prompt: |
      Deserializing `w2` — is any `Worm` constructor called? (`print` is `println`.)
    code: |
      //: io/Worm.java
      // Demonstrates object serialization.
      import java.io.*;
      import java.util.*;
      import static net.mindview.util.Print.*;

      class Data implements Serializable {
        private int n;
        public Data(int n) { this.n = n; }
        public String toString() { return Integer.toString(n); }
      }

      public class Worm implements Serializable {
        private static Random rand = new Random(47);
        private Data[] d = {
          new Data(rand.nextInt(10)),
          new Data(rand.nextInt(10)),
          new Data(rand.nextInt(10))
        };
        private Worm next;
        private char c;
        // Value of i == number of segments
        public Worm(int i, char x) {
          print("Worm constructor: " + i);
          c = x;
          if(--i > 0)
            next = new Worm(i, (char)(x + 1));
        }
        public Worm() {
          print("Default constructor");
        }
        public String toString() {
          StringBuilder result = new StringBuilder(":");
          result.append(c);
          result.append("(");
          for(Data dat : d)
            result.append(dat);
          result.append(")");
          if(next != null)
            result.append(next);
          return result.toString();
        }
        public static void main(String[] args)
        throws ClassNotFoundException, IOException {
          Worm w = new Worm(6, 'a');
          print("w = " + w);
          ObjectOutputStream out = new ObjectOutputStream(
            new FileOutputStream("worm.out"));
          out.writeObject("Worm storage\n");
          out.writeObject(w);
          out.close(); // Also flushes output
          ObjectInputStream in = new ObjectInputStream(
            new FileInputStream("worm.out"));
          String s = (String)in.readObject();
          Worm w2 = (Worm)in.readObject();
          print(s + "w2 = " + w2);
          ByteArrayOutputStream bout =
            new ByteArrayOutputStream();
          ObjectOutputStream out2 = new ObjectOutputStream(bout);
          out2.writeObject("Worm storage\n");
          out2.writeObject(w);
          out2.flush();
          ObjectInputStream in2 = new ObjectInputStream(
            new ByteArrayInputStream(bout.toByteArray()));
          s = (String)in2.readObject();
          Worm w3 = (Worm)in2.readObject();
          print(s + "w3 = " + w3);
        }
      }
    language: java
    options:
      - text: "No — the objects are rebuilt from the bytes; only the original `new Worm(6, 'a')` printed constructor lines"
        correct: true
      - text: "Yes, the default constructor for each segment"
        feedback: "`Serializable` objects aren't constructed when read."
    explanation: |
      `w2` and `w3` print the same chain as `w`: `:a(853):b(119)…`.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-io-alien
    prompt: |
      `Alien` has no methods. What does `implements Serializable` do?
    code: |
      //: io/Alien.java
      // A serializable class.
      import java.io.*;
      public class Alien implements Serializable {}
    language: java
    options:
