title: Handler order, finally, and overriding
summary: Put specific handlers before general ones, use finally for cleanup, and never let an override throw broader checked exceptions.
duration: 6
tags: [java, thinking in java, exceptions, catch order, finally, overriding]
sources:
  - { book: thinking-in-java, ref: "Chapter 12, Error Handling with Exceptions — Exception restrictions and matching" }
steps:
  - type: explanation
    title: Specific first
    body: |
      Handlers are tried top to bottom.
      A handler for a superclass placed first would catch everything below it.
      The compiler rejects a handler that can never be reached.
    diagram:
      classes:
        - { name: Annoyance, kind: class }
        - { name: Sneeze }
      relations:
        - { from: Sneeze, to: Annoyance, type: extends }

  - type: choice
    prompt: |
      `Sneeze` extends `Annoyance`, which extends `Exception`. Which handler order compiles?
    options:
      - text: "`catch (Sneeze s) { ... } catch (Annoyance a) { ... }`"
        correct: true
      - text: "`catch (Annoyance a) { ... } catch (Sneeze s) { ... }`"
        feedback: "Every `Sneeze` is an `Annoyance`, so the second handler is unreachable — a compile error."
    diagram:
      classes:
        - { name: Exception }
        - { name: Annoyance }
        - { name: Sneeze }
      relations:
        - { from: Annoyance, to: Exception, type: extends }
        - { from: Sneeze, to: Annoyance, type: extends }

  - type: explanation
    title: finally always runs
    body: |
      Code in `finally` runs whether the `try` succeeds, throws, or returns.
      Use it to release locks, close files and restore state.
      Try-with-resources does the closing for you.

  - type: explanation
    title: Overrides can't throw more
    body: |
      Code calling `Inning.atBat()` handles only what `Inning` declares.
      So an override may throw fewer checked exceptions, or subclasses of them — never new or broader ones.
      Otherwise code written for the base class would break.
    diagram:
      classes:
        - { name: Inning, methods: ["+ atBat() throws Strike, Foul"] }
        - { name: StormyInning, methods: ["+ atBat() throws PopFoul"] }
        - { name: Foul }
        - { name: PopFoul }
      relations:
        - { from: StormyInning, to: Inning, type: extends }
        - { from: PopFoul, to: Foul, type: extends }

  - type: choice
    prompt: |
      `Inning.atBat()` declares `throws Strike, Foul`, and `PopFoul` extends `Foul`. Which overrides of `atBat()` in `StormyInning` compile?
    options:
      - text: "`void atBat() throws PopFoul` — PopFoul is a Foul"
        correct: true
      - text: "`void atBat()` — throwing nothing is fine"
        correct: true
      - text: "`void atBat() throws RainedOut` — a new checked exception"
        feedback: Callers of `Inning.atBat()` aren't prepared for RainedOut.
    diagram:
      classes:
        - { name: Inning, methods: ["atBat() throws Strike, Foul"] }
        - { name: StormyInning }
        - { name: Exception }
        - { name: Strike }
        - { name: Foul }
        - { name: RainedOut }
        - { name: PopFoul }
      relations:
        - { from: StormyInning, to: Inning, type: extends }
        - { from: Strike, to: Exception, type: extends }
        - { from: Foul, to: Exception, type: extends }
        - { from: RainedOut, to: Exception, type: extends }
        - { from: PopFoul, to: Foul, type: extends }
    details: |
      Code that calls `atBat()` through an `Inning` reference only knows to handle `Strike` and `Foul`.
      An override can therefore throw those exceptions, any of their subclasses, or nothing, since none of these surprise the caller.
      Throwing a new checked exception, or a broader one, would escape the caller's handlers, so the compiler rejects it.
      The rule makes a subclass safe to use wherever its base class is expected.

  - type: predict
    prompt: What does this print?
    code: |
      try {
        System.out.print("try ");
        throw new IllegalStateException();
      } catch (IllegalStateException e) {
        System.out.print("catch ");
      } finally {
        System.out.print("finally");
      }
    language: java
    options:
      - text: "`try catch finally`"
        correct: true
      - text: "`try catch`"
        feedback: "`finally` runs after the handler, too."
      - text: "`try finally`"
        feedback: The handler matches, so it runs before `finally`.

  - type: choice
    id: tij-exceptions-stormyinning
    prompt: |
      In the second `try`, `i` is declared as `Inning`, though the object is a `StormyInning` whose `atBat()` throws only `PopFoul`. Why must it catch `Strike`?
    code: |
      //: exceptions/StormyInning.java
      // Overridden methods may throw only the exceptions
      // specified in their base-class versions, or exceptions
      // derived from the base-class exceptions.

      class BaseballException extends Exception {}
      class Foul extends BaseballException {}
      class Strike extends BaseballException {}

      abstract class Inning {
        public Inning() throws BaseballException {}
        public void event() throws BaseballException {
          // Doesn't actually have to throw anything
        }
        public abstract void atBat() throws Strike, Foul;
        public void walk() {} // Throws no checked exceptions
      }

      class StormException extends Exception {}
      class RainedOut extends StormException {}
      class PopFoul extends Foul {}

      interface Storm {
        public void event() throws RainedOut;
        public void rainHard() throws RainedOut;
      }

      public class StormyInning extends Inning implements Storm {
        // OK to add new exceptions for constructors, but you
        // must deal with the base constructor exceptions:
        public StormyInning()
          throws RainedOut, BaseballException {}
        public StormyInning(String s)
          throws Foul, BaseballException {}
        // Regular methods must conform to base class:
      //! void walk() throws PopFoul {} //Compile error
        // Interface CANNOT add exceptions to existing
        // methods from the base class:
      //! public void event() throws RainedOut {}
        // If the method doesn't already exist in the
        // base class, the exception is OK:
        public void rainHard() throws RainedOut {}
        // You can choose to not throw any exceptions,
        // even if the base version does:
        public void event() {}
        // Overridden methods can throw inherited exceptions:
        public void atBat() throws PopFoul {}
        public static void main(String[] args) {
          try {
            StormyInning si = new StormyInning();
            si.atBat();
          } catch(PopFoul e) {
            System.out.println("Pop foul");
          } catch(RainedOut e) {
            System.out.println("Rained out");
          } catch(BaseballException e) {
            System.out.println("Generic baseball exception");
          }
          // Strike not thrown in derived version.
          try {
            // What happens if you upcast?
            Inning i = new StormyInning();
            i.atBat();
            // You must catch the exceptions from the
            // base-class version of the method:
          } catch(Strike e) {
            System.out.println("Strike");
          } catch(Foul e) {
            System.out.println("Foul");
          } catch(RainedOut e) {
            System.out.println("Rained out");
          } catch(BaseballException e) {
            System.out.println("Generic baseball exception");
          }
        }
      }
    language: java
    options:
      - text: "The compiler checks against `Inning.atBat()`, which declares `Strike` and `Foul`"
        correct: true
      - text: "Because `StormyInning.atBat()` might throw `Strike` after all"
        feedback: "It can't; but the compiler only knows the static type `Inning`."
      - text: "It doesn't have to"
        feedback: "A checked exception declared by the called method must be caught or declared."
    explanation: |
      An override may throw fewer or narrower exceptions, never new ones — so code written for the base class still works.

