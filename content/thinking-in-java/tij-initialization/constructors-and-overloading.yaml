title: "Constructors, overloading and this"
summary: "Constructors with and without arguments, overloading on parameter types and order, primitive promotion, and the two uses of this."
duration: 8
tags: [java, constructors, overloading, this, promotion]
sources:
  - { book: thinking-in-java, ref: "Chapter 5, Guaranteed initialization with the constructor; Method overloading; The this keyword" }
steps:
  - type: explanation
    title: "Constructors and overloading"
    body: |
      A constructor has the class's name and runs on `new`.
      If you write no constructor, Java adds a no-arg one — but not once you've written any.
      Overloads differ by parameter types or order, never by return type alone.

  - type: explanation
    title: "Promotion and this"
    body: |
      A primitive argument with no exact match is widened to the nearest larger type.
      A wider one must be cast down explicitly.
      `this` is the current object; `this(...)` calls another constructor, and only as the first statement.

  - type: predict
    id: tij-initialization-simpleconstructor
    prompt: |
      What does this print?
    code: |
      //: initialization/SimpleConstructor.java
      // Demonstration of a simple constructor.

      class Rock {
        Rock() { // This is the constructor
          System.out.print("Rock ");
        }
      }

      public class SimpleConstructor {
        public static void main(String[] args) {
          for(int i = 0; i < 10; i++)
            new Rock();
        }
      }
    language: java
    options:
      - text: "Rock Rock Rock Rock Rock Rock Rock Rock Rock Rock "
        correct: true
      - text: "Rock "
        feedback: "The loop calls `new Rock()` ten times; each construction prints."
      - text: "Nothing — the objects aren't stored"
        feedback: "The constructor runs whether or not the reference is kept."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

