title: "Loops, labels and switch"
summary: "if-else, while, for and foreach, break and continue — labeled and not — and switch with fall-through."
duration: 8
tags: [java, control flow, loops, foreach, labels, switch]
sources:
  - { book: thinking-in-java, ref: "Chapter 4, Controlling Execution" }
steps:
  - type: explanation
    title: "Loops"
    body: |
      `for(init; test; step)` can declare and step several variables, separated by commas.
      Foreach `for(x : array)` visits every element in order.

  - type: explanation
    title: "break, continue and labels"
    body: |
      `break` leaves the innermost loop; `continue` starts its next iteration.
      With a label, `break outer` leaves the labeled loop, and `continue outer` starts its next iteration.
      In a `switch`, cases fall through until a `break`.

  - type: predict
    id: tij-control-ifelse
    prompt: |
      What does this print? (`print` is `println`.)
    code: |
      //: control/IfElse.java
      import static net.mindview.util.Print.*;

      public class IfElse {
        static int result = 0;
        static void test(int testval, int target) {
          if(testval > target)
            result = +1;
          else if(testval < target)
            result = -1;
          else
            result = 0; // Match
        }
        public static void main(String[] args) {
          test(10, 5);
          print(result);
          test(5, 10);
          print(result);
          test(5, 5);
          print(result);
        }
      }
    language: java
    options:
      - text: "1\n-1\n0"
        correct: true
      - text: "-1\n1\n0"
        feedback: "10 > 5 sets `result` to +1."
      - text: "1\n-1\n-1"
        feedback: "Equal values reach the final `else`, which sets 0."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-control-ifelse2
    prompt: |
      How does this differ from a version that stores the answer in a static `result` field? (`print` is `println`.)
    code: |
      //: control/IfElse2.java
      import static net.mindview.util.Print.*;

      public class IfElse2 {
        static int test(int testval, int target) {
          if(testval > target)
            return +1;
          else if(testval < target)
            return -1;
          else
            return 0; // Match
        }
        public static void main(String[] args) {
          print(test(10, 5));
          print(test(5, 10));
          print(test(5, 5));
        }
      }
    language: java
    options:
      - text: "It returns straight out of each branch, so no field or `else` chain is needed after a return — the output is the same: 1, −1, 0"
        correct: true
      - text: "It prints different numbers"
        feedback: "Same logic, same answers."
      - text: "It doesn't compile — a method must have a single `return`"
        feedback: "Java allows any number of returns."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-control-whiletest
    prompt: |
      `Math.random()` returns a random double in [0, 1). What does the program print?
    code: |
      //: control/WhileTest.java
      // Demonstrates the while loop.

      public class WhileTest {
        static boolean condition() {
          boolean result = Math.random() < 0.99;
          System.out.print(result + ", ");
          return result;
        }
        public static void main(String[] args) {
          while(condition())
            System.out.println("Inside 'while'");
          System.out.println("Exited 'while'");
        }
      }
    language: java
    options:
      - text: "A random number of `true, Inside 'while'` lines, then `false, Exited 'while'`"
        correct: true
      - text: "Exactly 99 `Inside 'while'` lines"
        feedback: "Each test has a 1% chance of being false, so the count varies."
      - text: "`Exited 'while'` only"
        feedback: "The condition is true 99% of the time."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

