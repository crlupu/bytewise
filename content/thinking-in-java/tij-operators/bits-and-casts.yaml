      //: operators/RoundingNumbers.java
      // Rounding floats and doubles.
      import static net.mindview.util.Print.*;

      public class RoundingNumbers {
        public static void main(String[] args) {
          double above = 0.7, below = 0.4;
          float fabove = 0.7f, fbelow = 0.4f;
          print("Math.round(above): " + Math.round(above));
          print("Math.round(below): " + Math.round(below));
          print("Math.round(fabove): " + Math.round(fabove));
          print("Math.round(fbelow): " + Math.round(fbelow));
        }
      }
    language: java
    options:
      - text: "Math.round(above): 1\nMath.round(below): 0\nMath.round(fabove): 1\nMath.round(fbelow): 0"
        correct: true
      - text: "Math.round(above): 0\nMath.round(below): 0\nMath.round(fabove): 0\nMath.round(fbelow): 0"
        feedback: "`Math.round` rounds to the nearest whole number."
      - text: "Math.round(above): 1.0\nMath.round(below): 0.0\nMath.round(fabove): 1.0\nMath.round(fbelow): 0.0"
        feedback: "`Math.round` returns a `long` (or `int` for a `float`), not a floating-point value."
    explanation: |
