title: "Operators and precedence"
summary: "Arithmetic, increment, string +, the ternary and short-circuit logic."
duration: 8
tags: [java, operators, precedence, short-circuit, ternary]
sources:
  - { book: thinking-in-java, ref: "Chapter 3, Operators" }
steps:
  - type: explanation
    title: "Arithmetic and precedence"
    body: |
      `*`, `/` and `%` bind tighter than `+` and `-`.
      Integer division drops the remainder.
      `++i` changes `i` then yields it; `i++` yields the old value.

  - type: explanation
    title: "Strings, ternaries and short-circuits"
    body: |
      Once a `String` is involved, `+` concatenates, left to right.
      `a ? b : c` is an expression that yields `b` or `c`.
      `&&` and `||` stop evaluating as soon as the result is known.

  - type: predict
    id: tij-operators-autoinc
    prompt: |
      What does this print? (`print` is `println`.)
    code: |
      //: operators/AutoInc.java
      // Demonstrates the ++ and -- operators.
      import static net.mindview.util.Print.*;

      public class AutoInc {
        public static void main(String[] args) {
          int i = 1;
          print("i : " + i);
          print("++i : " + ++i); // Pre-increment
          print("i++ : " + i++); // Post-increment
          print("i : " + i);
          print("--i : " + --i); // Pre-decrement
          print("i-- : " + i--); // Post-decrement
          print("i : " + i);
        }
      }
    language: java
    options:
      - text: "i : 1\n++i : 2\ni++ : 2\ni : 3\n--i : 2\ni-- : 2\ni : 1"
        correct: true
      - text: "i : 1\n++i : 2\ni++ : 3\ni : 3\n--i : 2\ni-- : 1\ni : 1"
        feedback: "Post-increment yields the old value: `i++` prints 2, then `i` becomes 3."
      - text: "i : 1\n++i : 1\ni++ : 2\ni : 3\n--i : 3\ni-- : 2\ni : 1"
        feedback: "Pre-increment changes `i` first and yields the new value."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-operators-mathops
    prompt: |
      `rand` gives `j = 59` and `k = 56`. What are the lines for `k / j` and `k % j`? (`print` is `println`.)
    code: |
      //: operators/MathOps.java
      // Demonstrates the mathematical operators.
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class MathOps {
        public static void main(String[] args) {
          // Create a seeded random number generator:
          Random rand = new Random(47);
          int i, j, k;
          // Choose value from 1 to 100:
          j = rand.nextInt(100) + 1;
          print("j : " + j);
          k = rand.nextInt(100) + 1;
          print("k : " + k);
          i = j + k;
          print("j + k : " + i);
          i = j - k;
          print("j - k : " + i);
          i = k / j;
          print("k / j : " + i);
          i = k * j;
          print("k * j : " + i);
          i = k % j;
          print("k % j : " + i);
          j %= k;
          print("j %= k : " + j);
          // Floating-point number tests:
          float u, v, w; // Applies to doubles, too
          v = rand.nextFloat();
          print("v : " + v);
          w = rand.nextFloat();
          print("w : " + w);
          u = v + w;
          print("v + w : " + u);
          u = v - w;
          print("v - w : " + u);
          u = v * w;
          print("v * w : " + u);
          u = v / w;
          print("v / w : " + u);
          // The following also works for char,
          // byte, short, int, long, and double:
          u += v;
          print("u += v : " + u);
          u -= v;
          print("u -= v : " + u);
          u *= v;
          print("u *= v : " + u);
          u /= v;
          print("u /= v : " + u);
        }
      }
    language: java
    options:
      - text: "k / j : 0  and  k % j : 56"
        correct: true
      - text: "k / j : 0.949  and  k % j : 0"
        feedback: "`int` division truncates, and the remainder of 56 / 59 is 56."
      - text: "k / j : 1  and  k % j : 3"
        feedback: "56 / 59 is less than 1, so the integer quotient is 0."
    explanation: |
      The actual output has `k / j : 0` and `k % j : 56`.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-operators-precedence
    prompt: |
      What does this print?
    code: |
      //: operators/Precedence.java

      public class Precedence {
        public static void main(String[] args) {
          int x = 1, y = 2, z = 3;
          int a = x + y - 2/2 + z;           // (1)
          int b = x + (y - 2)/(2 + z);       // (2)
          System.out.println("a = " + a + " b = " + b);
        }
      }
    language: java
    options:
      - text: "a = 5 b = 1"
        correct: true
      - text: "a = 2 b = 1"
        feedback: "`2/2` is evaluated first, then left to right: 1 + 2 − 1 + 3 = 5."
      - text: "a = 5 b = 0"
        feedback: "`(y − 2)/(2 + z)` is 0 / 5 = 0, and `x +` that is 1."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

