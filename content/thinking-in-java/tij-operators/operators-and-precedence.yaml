    id: tij-operators-stringoperators
    prompt: |
      What does this print? (`print` is `println`.)
    code: |
      //: operators/StringOperators.java
      import static net.mindview.util.Print.*;

      public class StringOperators {
        public static void main(String[] args) {
          int x = 0, y = 1, z = 2;
          String s = "x, y, z ";
          print(s + x + y + z);
          print(x + " " + s); // Converts x to a String
          s += "(summed) = "; // Concatenation operator
          print(s + (x + y + z));
          print("" + x); // Shorthand for Integer.toString()
        }
      }
    language: java
    options:
      - text: "x, y, z 012\n0 x, y, z \nx, y, z (summed) = 3\n0"
        correct: true
      - text: "x, y, z 3\n0 x, y, z \nx, y, z (summed) = 3\n0"
        feedback: "Once `s` is on the left, each `+` concatenates: 0, then 1, then 2."
      - text: "x, y, z 012\n0 x, y, z \nx, y, z (summed) = 012\n0"
        feedback: "The parentheses make `x + y + z` add integers first."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-operators-ternaryifelse
    prompt: |
      What does this print? (`print` is `println`.)
    code: |
      //: operators/TernaryIfElse.java
      import static net.mindview.util.Print.*;

      public class TernaryIfElse {
        static int ternary(int i) {
          return i < 10 ? i * 100 : i * 10;
        }
        static int standardIfElse(int i) {
          if(i < 10)
            return i * 100;
          else
            return i * 10;
        }
        public static void main(String[] args) {
          print(ternary(9));
          print(ternary(10));
          print(standardIfElse(9));
          print(standardIfElse(10));
        }
      }
    language: java
    options:
      - text: "900\n100\n900\n100"
        correct: true
      - text: "900\n1000\n900\n1000"
        feedback: "10 is not less than 10, so it's `i * 10`."
      - text: "90\n100\n90\n100"
        feedback: "Below 10 it multiplies by 100."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-operators-bool
    prompt: |
      `rand` gives `i = 58` and `j = 55`. What are the last two lines? (`print` is `println`.)
    code: |
      //: operators/Bool.java
      // Relational and logical operators.
      import java.util.*;
      import static net.mindview.util.Print.*;

      public class Bool {
        public static void main(String[] args) {
          Random rand = new Random(47);
          int i = rand.nextInt(100);
          int j = rand.nextInt(100);
          print("i = " + i);
          print("j = " + j);
          print("i > j is " + (i > j));
          print("i < j is " + (i < j));
          print("i >= j is " + (i >= j));
          print("i <= j is " + (i <= j));
          print("i == j is " + (i == j));
          print("i != j is " + (i != j));
          // Treating an int as a boolean is not legal Java:
      //! print("i && j is " + (i && j));
      //! print("i || j is " + (i || j));
      //! print("!i is " + !i);
          print("(i < 10) && (j < 10) is "
             + ((i < 10) && (j < 10)) );
          print("(i < 10) || (j < 10) is "
             + ((i < 10) || (j < 10)) );
        }
      }
    language: java
    options:
      - text: "(i < 10) && (j < 10) is false\n(i < 10) || (j < 10) is false"
        correct: true
      - text: "(i < 10) && (j < 10) is false\n(i < 10) || (j < 10) is true"
        feedback: "Neither 58 nor 55 is below 10."
      - text: "It doesn't compile because of `i && j`"
        feedback: "Those lines start with `//!` — they're comments."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-operators-shortcircuit
    prompt: |
      What does this print? (`print` is `println`.)
    code: |
      //: operators/ShortCircuit.java
      // Demonstrates short-circuiting behavior
      // with logical operators.
      import static net.mindview.util.Print.*;

      public class ShortCircuit {
        static boolean test1(int val) {
          print("test1(" + val + ")");
          print("result: " + (val < 1));
          return val < 1;
        }
        static boolean test2(int val) {
          print("test2(" + val + ")");
          print("result: " + (val < 2));
          return val < 2;
        }
        static boolean test3(int val) {
          print("test3(" + val + ")");
          print("result: " + (val < 3));
          return val < 3;
        }
        public static void main(String[] args) {
          boolean b = test1(0) && test2(2) && test3(2);
          print("expression is " + b);
        }
      }
    language: java
    options:
      - text: "test1(0)\nresult: true\ntest2(2)\nresult: false\nexpression is false"
        correct: true
      - text: "test1(0)\nresult: true\ntest2(2)\nresult: false\ntest3(2)\nresult: true\nexpression is false"
        feedback: "Once `test2` returns false, `&&` knows the answer and skips `test3`."
      - text: "test1(0)\nresult: true\nexpression is true"
        feedback: "`test1` is true, so `&&` has to evaluate `test2`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

