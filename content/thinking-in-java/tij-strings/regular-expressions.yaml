title: "Regular expressions"
summary: "matches, split and replace, Pattern and Matcher, find and groups, flags, and appendReplacement."
duration: 8
tags: [java, regex, Pattern, Matcher, groups, split, replaceAll]
sources:
  - { book: thinking-in-java, ref: "Chapter 13, Regular expressions" }
steps:
  - type: explanation
    title: "Patterns"
    body: |
      `\\d` is a digit, `\\w` a word character, `\\W` a non-word one, `\\s` whitespace; `+` means one or more, `*` zero or more, `?` optional.
      In Java source, each backslash is doubled: `"\\d+"`.
      `String.matches`, `split`, `replaceFirst` and `replaceAll` take a regex.

  - type: explanation
    title: "Pattern and Matcher"
    body: |
      `Pattern.compile(regex).matcher(input)` gives a `Matcher`.
      `find()` finds the next match; `group()` is the match, `group(n)` the nth parenthesized group, and `start()`/`end()` its position.
      `matches()` must match the whole input; `lookingAt()` only the beginning.

  - type: predict
    id: tij-strings-integermatch
    prompt: |
      What does this print?
    code: |
      //: strings/IntegerMatch.java

      public class IntegerMatch {
        public static void main(String[] args) {
          System.out.println("-1234".matches("-?\\d+"));
          System.out.println("5678".matches("-?\\d+"));
          System.out.println("+911".matches("-?\\d+"));
          System.out.println("+911".matches("(-|\\+)?\\d+"));
        }
      }
    language: java
    options:
      - text: "true\ntrue\nfalse\ntrue"
        correct: true
      - text: "true\ntrue\ntrue\ntrue"
        feedback: "`-?\\\\d+` allows only an optional minus sign; `+911` doesn't match."
      - text: "true\nfalse\nfalse\ntrue"
        feedback: "`-?` makes the minus optional, so `5678` matches."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-strings-splitting
    prompt: |
      `knights` is `"Then, when you have found the shrubbery, you must cut down the mightiest tree in the forest... with... a herring!"`. What does `split("n\\W+")` print?
    code: |
      //: strings/Splitting.java
      import java.util.*;

      public class Splitting {
        public static String knights =
          "Then, when you have found the shrubbery, you must " +
          "cut down the mightiest tree in the forest... " +
          "with... a herring!";
        public static void split(String regex) {
          System.out.println(
            Arrays.toString(knights.split(regex)));
        }
        public static void main(String[] args) {
          split(" "); // Doesn't have to contain regex chars
          split("\\W+"); // Non-word characters
          split("n\\W+"); // 'n' followed by non-word characters
        }
      }
    language: java
    options:
      - text: "[The, whe, you have found the shrubbery, you must cut dow, the mightiest tree i, the forest... with... a herring!]"
        correct: true
      - text: "[Then, when, you, have, found, the, shrubbery, you, must, cut, down, the, mightiest, tree, in, the, forest, with, a, herring]"
        feedback: "That's `\\\\W+`. Here the delimiter is an `n` followed by non-word characters."
      - text: "[The, whe, you have fou, d the shrubbery, you must cut dow, the mightiest tree i, the forest... with... a herri, g!]"
        feedback: "`found` and `herring` have an `n` followed by a letter, which isn't `\\\\W`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-strings-replacing
    prompt: |
      `s` is `"Then, when you have found the shrubbery, you must cut down the mightiest tree in the forest... with... a herring!"`. What does `s.replaceFirst("f\\w+", "located")` give? (`print` is `println`.)
    code: |
      //: strings/Replacing.java
      import static net.mindview.util.Print.*;

      public class Replacing {
        static String s = Splitting.knights;
        public static void main(String[] args) {
          print(s.replaceFirst("f\\w+", "located"));
          print(s.replaceAll("shrubbery|tree|herring","banana"));
        }
      }
    language: java
    options:
      - text: "Then, when you have located the shrubbery, you must cut down the mightiest tree in the forest... with... a herring!"
        correct: true
      - text: "Then, when you have located the shrubbery, you must cut down the mightiest tree in the located... with... a herring!"
        feedback: "`replaceFirst` only replaces the first match."
      - text: "Then, when you have locatedound the shrubbery, you must cut down the mightiest tree in the forest... with... a herring!"
        feedback: "`\\\\w+` extends the match over the whole word."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

