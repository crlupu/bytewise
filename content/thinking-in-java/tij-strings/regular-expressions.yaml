  - type: choice
    id: tij-strings-thereplacements
    prompt: |
      After `replaceFirst("[aeiou]", "(VOWEL1)")`, the loop uses `appendReplacement` with `m.group().toUpperCase()`. What does the second printed block start with? (`print` is `println`.)
    code: |
      //: strings/TheReplacements.java
      import java.util.regex.*;
      import net.mindview.util.*;
      import static net.mindview.util.Print.*;

      /*! Here's a block of text to use as input to
          the regular expression matcher. Note that we'll
          first extract the block of text by looking for
          the special delimiters, then process the
          extracted block. !*/

      public class TheReplacements {
        public static void main(String[] args) throws Exception {
          String s = TextFile.read("TheReplacements.java");
          // Match the specially commented block of text above:
          Matcher mInput =
            Pattern.compile("/\\*!(.*)!\\*/", Pattern.DOTALL)
              .matcher(s);
          if(mInput.find())
            s = mInput.group(1); // Captured by parentheses
          // Replace two or more spaces with a single space:
          s = s.replaceAll(" {2,}", " ");
          // Replace one or more spaces at the beginning of each
          // line with no spaces. Must enable MULTILINE mode:
          s = s.replaceAll("(?m)^ +", "");
          print(s);
          s = s.replaceFirst("[aeiou]", "(VOWEL1)");
          StringBuffer sbuf = new StringBuffer();
          Pattern p = Pattern.compile("[aeiou]");
          Matcher m = p.matcher(s);
          // Process the find information as you
          // perform the replacements:
          while(m.find())
            m.appendReplacement(sbuf, m.group().toUpperCase());
          // Put in the remainder of the text:
          m.appendTail(sbuf);
          print(sbuf);
        }
      }
    language: java
    options:
      - text: "`H(VOWEL1)rE's A blOck Of tExt…` — the first vowel was replaced, every remaining vowel uppercased"
        correct: true
      - text: "`HErE's A blOck…`"
        feedback: "`replaceFirst` already turned the first `e` into `(VOWEL1)`."
      - text: "`H(VOWEL1)r(VOWEL1)'s (VOWEL1) bl(VOWEL1)ck…`"
        feedback: "Only the first vowel gets `(VOWEL1)`; the loop uppercases the rest."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-strings-resetting
    prompt: |
      What does this print?
    code: |
      //: strings/Resetting.java
      import java.util.regex.*;

      public class Resetting {
        public static void main(String[] args) throws Exception {
          Matcher m = Pattern.compile("[frb][aiu][gx]")
            .matcher("fix the rug with bags");
          while(m.find())
            System.out.print(m.group() + " ");
          System.out.println();
          m.reset("fix the rig with rags");
          while(m.find())
            System.out.print(m.group() + " ");
        }
      }
    language: java
    options:
      - text: "fix rug bag \nfix rig rag "
        correct: true
      - text: "fix rug bag \n"
        feedback: "`reset(input)` points the matcher at new input and starts again."
      - text: "fix rug bag \nfix rug bag "
        feedback: "The second search runs on `fix the rig with rags`."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-strings-jgrep
    prompt: |
      Run as `java JGrep JGrep.java "\\b[Ssct]\\w+"`. What does each output line show?
    code: |
      //: strings/JGrep.java
      // A very simple version of the "grep" program.
      import java.util.regex.*;
      import net.mindview.util.*;

      public class JGrep {
        public static void main(String[] args) throws Exception {
          if(args.length < 2) {
            System.out.println("Usage: java JGrep file regex");
            System.exit(0);
          }
          Pattern p = Pattern.compile(args[1]);
          // Iterate through the lines of the input file:
          int index = 0;
          Matcher m = p.matcher("");
          for(String line : new TextFile(args[0])) {
            m.reset(line);
            while(m.find())
              System.out.println(index++ + ": " +
                m.group() + ": " + m.start());
          }
        }
      }
    language: java
    options:
      - text: "A running count, a word starting with S, s, c or t, and its column in its line — like `0: strings: 4`"
        correct: true
      - text: "Each line of the file that contains a match"
        feedback: "It prints each match, not each line."
      - text: "Only the first match per line"
        feedback: "`while(m.find())` reports every match."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).
