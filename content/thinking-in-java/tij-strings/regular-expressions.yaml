    code: |
      //: strings/ReFlags.java
      import java.util.regex.*;

      public class ReFlags {
        public static void main(String[] args) {
          Pattern p =  Pattern.compile("^java",
            Pattern.CASE_INSENSITIVE | Pattern.MULTILINE);
          Matcher m = p.matcher(
            "java has regex\nJava has regex\n" +
            "JAVA has pretty good regular expressions\n" +
            "Regular expressions are in Java");
          while(m.find())
            System.out.println(m.group());
        }
      }
    language: java
    options:
      - text: "java\nJava\nJAVA"
        correct: true
      - text: "java"
        feedback: "With `MULTILINE`, `^` matches at the start of every line."
      - text: "java\nJava\nJAVA\nJava"
        feedback: "The last `Java` isn't at the start of its line."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

