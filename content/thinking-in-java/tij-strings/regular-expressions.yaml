  - type: predict
    id: tij-strings-testregularexpression
    prompt: |
      Run with `abcabcabcdefabc "abc+" "(abc)+" "(abc){2,}"`. What are the matches for `(abc)+`? (`print` is `println`.)
    code: |
      //: strings/TestRegularExpression.java
      // Allows you to easily try out regular expressions.
      import java.util.regex.*;
      import static net.mindview.util.Print.*;

      public class TestRegularExpression {
        public static void main(String[] args) {
          if(args.length < 2) {
            print("Usage:\njava TestRegularExpression " +
              "characterSequence regularExpression+");
            System.exit(0);
          }
          print("Input: \"" + args[0] + "\"");
          for(String arg : args) {
            print("Regular expression: \"" + arg + "\"");
            Pattern p = Pattern.compile(arg);
            Matcher m = p.matcher(args[0]);
            while(m.find()) {
              print("Match \"" + m.group() + "\" at positions " +
                m.start() + "-" + (m.end() - 1));
            }
          }
        }
      }
    language: java
    options:
      - text: "Match \"abcabcabc\" at positions 0-8\nMatch \"abc\" at positions 12-14"
        correct: true
      - text: "Match \"abc\" at positions 0-2\nMatch \"abc\" at positions 3-5\nMatch \"abc\" at positions 6-8\nMatch \"abc\" at positions 12-14"
        feedback: "That's `abc+` — the `+` there only repeats the `c`. `(abc)+` repeats the whole group, greedily."
      - text: "Match \"abcabcabc\" at positions 0-8"
        feedback: "The final `abc` after `def` is a separate match."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-strings-finding
    prompt: |
      What is the first line printed? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: strings/Finding.java
      import java.util.regex.*;
      import static net.mindview.util.Print.*;

      public class Finding {
        public static void main(String[] args) {
          Matcher m = Pattern.compile("\\w+")
            .matcher("Evening is full of the linnet's wings");
          while(m.find())
            printnb(m.group() + " ");
          print();
          int i = 0;
          while(m.find(i)) {
            printnb(m.group() + " ");
            i++;
          }
        }
      }
    language: java
    options:
      - text: "Evening is full of the linnet s wings "
        correct: true
      - text: "Evening is full of the linnet's wings "
        feedback: "`\\\\w+` doesn't include the apostrophe, so `linnet's` is two matches."
    explanation: |
      The second loop calls `find(i)`, restarting the search at each position — so it prints `vening`, `ening` and so on.

      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: predict
    id: tij-strings-groups
    prompt: |
      For the line `Twas brillig, and the slithy toves`, the pattern `(?m)(\\S+)\\s+((\\S+)\\s+(\\S+))$` matches the last three words. What does the loop print for it (groups 0 to 4)? (`print` is `println`, `printnb` is `print`.)
    code: |
      //: strings/Groups.java
      import java.util.regex.*;
      import static net.mindview.util.Print.*;

      public class Groups {
        static public final String POEM =
          "Twas brillig, and the slithy toves\n" +
          "Did gyre and gimble in the wabe.\n" +
          "All mimsy were the borogoves,\n" +
          "And the mome raths outgrabe.\n\n" +
          "Beware the Jabberwock, my son,\n" +
          "The jaws that bite, the claws that catch.\n" +
          "Beware the Jubjub bird, and shun\n" +
          "The frumious Bandersnatch.";
        public static void main(String[] args) {
          Matcher m =
            Pattern.compile("(?m)(\\S+)\\s+((\\S+)\\s+(\\S+))$")
              .matcher(POEM);
          while(m.find()) {
            for(int j = 0; j <= m.groupCount(); j++)
              printnb("[" + m.group(j) + "]");
            print();
          }
        }
      }
    language: java
    options:
      - text: "[the slithy toves][the][slithy toves][slithy][toves]"
        correct: true
      - text: "[the slithy toves][the][slithy][toves]"
        feedback: "Group 2 wraps groups 3 and 4: `slithy toves`."
      - text: "[Twas brillig, and the slithy toves][Twas][brillig,][and][the]"
        feedback: "`$` anchors the match to the end of the line."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

  - type: choice
    id: tij-strings-startend
    prompt: |
      For the input `Targathian baby cries out, wherever a distress` and regex `T\\w+`, why is a `lookingAt()` line printed but no `matches()` line? (`print` is `println`.)
    code: |
      //: strings/StartEnd.java
      import java.util.regex.*;
      import static net.mindview.util.Print.*;

      public class StartEnd {
        public static String input =
          "As long as there is injustice, whenever a\n" +
          "Targathian baby cries out, wherever a distress\n" +
          "signal sounds among the stars ... We'll be there.\n" +
          "This fine ship, and this fine crew ...\n" +
          "Never give up! Never surrender!";
        private static class Display {
          private boolean regexPrinted = false;
          private String regex;
          Display(String regex) { this.regex = regex; }
          void display(String message) {
            if(!regexPrinted) {
              print(regex);
              regexPrinted = true;
            }
            print(message);
          }
        }
        static void examine(String s, String regex) {
          Display d = new Display(regex);
          Pattern p = Pattern.compile(regex);
          Matcher m = p.matcher(s);
          while(m.find())
            d.display("find() '" + m.group() +
              "' start = "+ m.start() + " end = " + m.end());
          if(m.lookingAt()) // No reset() necessary
            d.display("lookingAt() start = "
              + m.start() + " end = " + m.end());
          if(m.matches()) // No reset() necessary
            d.display("matches() start = "
              + m.start() + " end = " + m.end());
        }
        public static void main(String[] args) {
          for(String in : input.split("\n")) {
            print("input : " + in);
            for(String regex : new String[]{"\\w*ere\\w*",
              "\\w*ever", "T\\w+", "Never.*?!"})
              examine(in, regex);
          }
        }
      }
    language: java
    options:
      - text: "`lookingAt` only needs a match at the start (`Targathian`); `matches` needs the whole line to match"
        correct: true
      - text: "`matches` was never called"
        feedback: "It's called; it returns false."
      - text: "Because `find()` already consumed the match"
        feedback: "`lookingAt` and `matches` start from the beginning regardless."
    explanation: |
      Code © Bruce Eckel, *Thinking in Java*, 4th ed. ([tij4-code](https://github.com/BruceEckel/tij4-code), [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)).

