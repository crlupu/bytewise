title: Using condition queues
summary: Condition predicates, waiting in a loop, missed signals, and notifyAll versus notify.
duration: 6
tags: [java, concurrency, condition queues, wait, notifyall, missed signals, spurious wakeup]
sources:
  - { book: jcip, ref: "§14.2, Using Condition Queues" }
steps:
  - type: explanation
    title: Lock, predicate, queue
    body: |
      The condition predicate is what a thread waits for, like "not empty".
      The lock guards the state the predicate reads.
      The same object is the condition queue.

  - type: explanation
    title: Always wait in a loop
    body: |
      Check the predicate before waiting.
      Check it again after waking.
      Hold the lock throughout.

  - type: choice
    prompt: Why must you test the condition predicate in a `while` loop, not an `if`?
    options:
      - text: A woken thread may find the predicate false — another thread got there first, notifyAll woke everyone, or a spurious wakeup occurred
        correct: true
      - text: Loops are faster than if statements
    explanation: "Returning from `wait` is a hint that something changed, not a guarantee the predicate holds."
    details: |
      `wait` can return for several reasons: the condition you wanted became true, another condition sharing the same queue changed, another thread already consumed what you were waiting for, or a spurious wakeup with no notification at all.
      So waking up only means "something may have changed".
      Re-testing in a `while` loop makes the thread go back to waiting if the condition still isn't true.

  - type: match
    prompt: Match each rule for using `wait` to the bug it prevents.
    pairs:
      - left: Test the predicate before waiting
        right: Sleeping when the condition is already true
      - left: Wait in a loop
        right: Proceeding when the condition is false after waking
      - left: Hold the lock while testing and waiting
        right: A missed signal between the test and the wait

  - type: explanation
    title: notify can wake the wrong thread
    body: |
      Waiters for different predicates share one queue.
      `notify` wakes one of them, maybe the wrong one.
      `notifyAll` is safer. Optimize only once it works.

  - type: choice
    prompt: Several threads wait on the same object, for **different** predicates (not-full and not-empty). Is `notify` safe?
    options:
      - text: No — it wakes one arbitrary thread, which may be waiting for the other predicate; the right thread stays asleep
        correct: true
      - text: Yes, it's more efficient than notifyAll
        feedback: More efficient, but only correct under narrow conditions.
    explanation: Use `notify` only when all waiters wait for the same predicate and each notification enables exactly one of them. Otherwise, `notifyAll`.
    details: |
      With a single intrinsic condition queue, producers waiting for "not full" and consumers waiting for "not empty" wait on the same object.
      `notify` wakes one arbitrary waiter; if it wakes a producer when the event was "item added", the producer re-waits and the consumer that should have woken stays asleep — a missed signal that can stall the program.
      `notifyAll` wakes everyone so the right thread is among them; explicit `Condition` objects avoid the problem by giving each predicate its own queue.

  - type: blank
    prompt: Complete the rule.
    template: "Whenever you wait on a condition, make sure someone will perform a [[notification]] whenever the condition predicate becomes true."

  - type: choice
    id: listing-14-6
    prompt: |
      **Listing 14.6** · Why `while (isFull()) wait();` rather than `if`?
    code: |
      public synchronized void put(V v) throws InterruptedException {
          while (isFull())
              wait();
          doPut(v);
          notifyAll();
      }

      public synchronized V take() throws InterruptedException {
          while (isEmpty())
              wait();
          V v = doTake();
          notifyAll();
          return v;
      }
    language: java
    options:
      - text: "A woken thread must recheck: another may have refilled the buffer first, or the wakeup may be spurious"
        correct: true
      - text: "`if` would not compile"
        feedback: "It compiles; it's just wrong."
      - text: "`while` makes it faster"
        feedback: "It's about correctness."
    explanation: |
      One condition queue serves both "not full" and "not empty" waiters, which is also why it uses `notifyAll`.

  - type: choice
    id: listing-14-7
    prompt: |
      **Listing 14.7** · Which rule does this canonical form NOT follow?
    code: |
      void stateDependentMethod() throws InterruptedException {
          // condition predicate must be guarded by lock
          synchronized (lock) {
              while (!conditionPredicate())
                  lock.wait();
              // object is now in desired state
          }
      }
    language: java
    options:
      - text: "None — it holds the lock, tests in a loop and waits on the lock it holds"
        correct: true
      - text: "It should call `wait()` outside the lock"
        feedback: "`wait` without holding the lock throws `IllegalMonitorStateException`."
      - text: "It should use `if` instead of `while`"
        feedback: "Always recheck after waking."

  - type: choice
    id: listing-14-8
    prompt: |
      **Listing 14.8** · When does this `put` call `notifyAll()`?
    code: |
      public synchronized void put(V v) throws InterruptedException {
          while (isFull())
              wait();
          boolean wasEmpty = isEmpty();
          doPut(v);
          if (wasEmpty)
              notifyAll();
      }
    language: java
    options:
      - text: "Only when the buffer goes from empty to non-empty — the only time takers can be waiting"
        correct: true
      - text: "After every put"
        feedback: "It's conditional on `wasEmpty`."
      - text: "Never — `take` wakes itself"
        feedback: "Waiting takers need a notification."
    explanation: |
      Conditional notification is an optimization that's easy to get wrong; use it with care.

  - type: choice
    id: listing-14-9
    prompt: |
      **Listing 14.9** · The gate is opened then quickly closed again before a waiting thread gets to run. Does the waiter pass?
    code: |
      public class ThreadGate {
          @GuardedBy("this") private boolean isOpen;
          @GuardedBy("this") private int generation;

          public synchronized void close() {
              isOpen = false;
          }

          public synchronized void open() {
              ++generation;
              isOpen = true;
              notifyAll();
          }

          public synchronized void await() throws InterruptedException {
              int arrivalGeneration = generation;
              while (!isOpen && arrivalGeneration == generation)
                  wait();
          }
      }
    language: java
    options:
      - text: "Yes — `generation` changed since it arrived"
        correct: true
      - text: "No — the gate is closed when it rechecks"
        feedback: "The predicate also accepts a newer generation."
      - text: "It waits forever"
        feedback: "`generation > arrivalGeneration` lets it out."
