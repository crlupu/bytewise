title: Managing state dependence
summary: Waiting until a condition holds — from failing, to sleeping in a loop, to condition queues.
duration: 6
tags: [java, concurrency, state dependence, bounded buffer, condition queues, wait, notify]
sources:
  - { book: jcip, ref: "§14.1, Managing State Dependence" }
steps:
  - type: explanation
    title: "Wait until it's possible"
    body: |
      `take` on a bounded buffer needs it to be non-empty.
      Another thread may add something soon.
      So `take` can wait instead of failing.

  - type: explanation
    title: Condition queues
    body: |
      Any object can be a condition queue.
      `wait` releases its lock and sleeps until woken.

      ```java
      public synchronized V take() throws InterruptedException {
          while (isEmpty()) wait();
          V v = doTake();
          notifyAll();
          return v;
      }
      ```

      You must hold the lock to call `wait`.

  - type: match
    prompt: Match each bounded-buffer design to its problem.
    pairs:
      - left: Throw an exception when empty
        right: The caller has to retry — busy-waiting, or sleeping, in their own code
      - left: Poll and sleep in a loop
        right: Too short a sleep wastes CPU; too long adds latency
      - left: A condition queue (`wait` and `notifyAll`)
        right: The thread sleeps until woken — efficient and responsive

  - type: choice
    prompt: Why must `wait` be called while holding the object's lock?
    options:
      - text: The condition is part of object state guarded by that lock; checking it and starting to wait must be atomic, or a wake-up can be missed
        correct: true
      - text: It's just a Java rule with no reason
        feedback: Without the lock, a notify could happen between your check and your wait — and you'd sleep forever.
    explanation: Calling `wait` without holding the lock throws `IllegalMonitorStateException`.
    details: |
      The predicate — for example, "the buffer isn't empty" — reads state guarded by the lock, so it must be checked while holding the lock.
      `wait` then releases that lock atomically as the thread goes to sleep, and reacquires it before returning.
      Without the lock, another thread could make the predicate true and notify between your check and your `wait`, and you'd sleep through the signal forever.

  - type: blank
    prompt: Wait for a condition properly.
    template: "while (isEmpty()) [[wait]]();"
    code: true

  - type: choice
    id: listing-14-1
    prompt: |
      **Listing 14.1** · Why must the precondition be tested while holding the lock?
    code: |
      void blockingAction() throws InterruptedException {
          acquire lock on object state
          while (precondition does not hold) {
              release lock
              wait until precondition might hold
              optionally fail if interrupted or timeout expires
              reacquire lock
          }
          perform action
      }
    language: java
    options:
      - text: "The state it tests is shared; another thread could change it between the test and the action"
        correct: true
      - text: "Waiting is only allowed without the lock"
        feedback: "You must release the lock to let others change the state."
      - text: "It doesn't need to be"
        feedback: "Otherwise it's a check-then-act race."

  - type: choice
    id: listing-14-2
    prompt: |
      **Listing 14.2** · Capacity 3. After `doPut(a)`, `doPut(b)`, `doTake()`, `doPut(c)`, `doPut(d)`, what are `head`, `tail` and `count`?
    code: |
      protected synchronized final void doPut(V v) {
          buf[tail] = v;
          if (++tail == buf.length)
              tail = 0;
          ++count;
      }

      protected synchronized final V doTake() {
          V v = buf[head];
          buf[head] = null;
          if (++head == buf.length)
              head = 0;
          --count;
          return v;
      }
    language: java
    options:
      - text: "head 1, tail 1, count 3"
        correct: true
      - text: "head 1, tail 4, count 3"
        feedback: "`tail` wraps to 0 when it reaches the length."
      - text: "head 0, tail 1, count 4"
        feedback: "One take moved head to 1, and count is puts minus takes."

  - type: choice
    id: listing-14-3
    prompt: |
      **Listing 14.3** · What does `GrumpyBoundedBuffer.take()` do when the buffer is empty?
    code: |
      public synchronized V take() throws BufferEmptyException {
          if (isEmpty())
              throw new BufferEmptyException();
          return doTake();
      }
    language: java
    options:
      - text: "Throws at once — the caller must handle retrying"
        correct: true
      - text: "Waits for an item"
        feedback: "It balks rather than blocks."
      - text: "Returns `null`"
        feedback: "It throws `BufferEmptyException`."

  - type: choice
    id: listing-14-4
    prompt: |
      **Listing 14.4** · `buffer.take()` throws `BufferEmptyException` when empty. What's wrong with this client?
    code: |
      while (true) {
          try {
              String item = buffer.take();
              // use item
              break;
          } catch (BufferEmptyException e) {
              Thread.sleep(SLEEP_GRANULARITY);
          }
      }
    language: java
    options:
      - text: "Every caller must write this retry loop, and it trades responsiveness (sleep) against CPU (spin)"
        correct: true
      - text: "It never gets an item"
        feedback: "It gets one once something is put."
      - text: "It deadlocks"
        feedback: "It holds no lock while sleeping."

  - type: choice
    id: listing-14-5
    prompt: |
      **Listing 14.5** · `SleepyBoundedBuffer.take()` sleeps 60 ms between checks. An item arrives 1 ms after a check. How long until `take()` returns it?
    code: |
      public V take() throws InterruptedException {
          while (true) {
              synchronized (this) {
                  if (!isEmpty())
                      return doTake();
              }
              Thread.sleep(SLEEP_GRANULARITY);
          }
      }
    language: java
    options:
      - text: "About 59 ms — it notices only at the next check"
        correct: true
      - text: "Immediately"
        feedback: "Nothing wakes the sleeping thread."
      - text: "Never — it sleeps holding the lock"
        feedback: "It sleeps outside the `synchronized` block."
