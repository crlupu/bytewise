title: Managing state dependence
summary: Waiting until a condition holds — from failing, to sleeping in a loop, to condition queues.
duration: 6
tags: [java, concurrency, state dependence, bounded buffer, condition queues, wait, notify]
sources:
  - { book: jcip, ref: "§14.1, Managing State Dependence" }
steps:
  - type: explanation
    title: "Wait until it's possible"
    body: |
      `take` on a bounded buffer needs it to be non-empty.
      Another thread may add something soon.
      So `take` can wait instead of failing.

  - type: explanation
    title: Condition queues
    body: |
      Any object can be a condition queue.
      `wait` releases its lock and sleeps until woken.

      ```java
      public synchronized V take() throws InterruptedException {
          while (isEmpty()) wait();
          V v = doTake();
          notifyAll();
          return v;
      }
      ```

      You must hold the lock to call `wait`.

  - type: match
    prompt: Match each bounded-buffer design to its problem.
    pairs:
      - left: Throw an exception when empty
        right: The caller has to retry — busy-waiting, or sleeping, in their own code
      - left: Poll and sleep in a loop
        right: Too short a sleep wastes CPU; too long adds latency
      - left: A condition queue (`wait` and `notifyAll`)
        right: The thread sleeps until woken — efficient and responsive

  - type: choice
    prompt: Why must `wait` be called while holding the object's lock?
    options:
      - text: The condition is part of object state guarded by that lock; checking it and starting to wait must be atomic, or a wake-up can be missed
        correct: true
      - text: It's just a Java rule with no reason
        feedback: Without the lock, a notify could happen between your check and your wait — and you'd sleep forever.
    explanation: Calling `wait` without holding the lock throws `IllegalMonitorStateException`.
    details: |
      The predicate — for example, "the buffer isn't empty" — reads state guarded by the lock, so it must be checked while holding the lock.
      `wait` then releases that lock atomically as the thread goes to sleep, and reacquires it before returning.
      Without the lock, another thread could make the predicate true and notify between your check and your `wait`, and you'd sleep through the signal forever.

  - type: blank
    prompt: Wait for a condition properly.
    template: "while (isEmpty()) [[wait]]();"
    code: true
