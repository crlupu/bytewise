title: Reducing lock contention
summary: Hold locks for less time, split them, or stripe them — so fewer threads compete for the same lock.
duration: 6
tags: [java, concurrency, performance, lock contention, lock splitting, lock striping]
sources:
  - { book: jcip, ref: "§11.4.1–11.4.3, Narrowing Lock Scope; Lock Splitting; Lock Striping" }
steps:
  - type: explanation
    title: Less often, less long
    body: |
      Contention depends on how often a lock is taken.
      And on how long it's held.
      Shrink either, or use something other than a lock.

  - type: explanation
    title: Hold locks briefly
    body: |
      Lock only the lines that touch shared state.
      Build strings and match patterns outside the lock.

  - type: choice
    prompt: "`synchronized userLocationMatches(name, regexp)` builds a key string, looks it up in a map, then runs a regex match. Which part needs the lock?"
    options:
      - text: Only the map lookup — the string building and the regex match touch no shared state
        correct: true
      - text: The whole method
        feedback: Holding the lock during the regex match makes every other thread wait for work that doesn't need protecting.
    explanation: "**Narrowing lock scope** — get in, get out."

  - type: explanation
    title: Split and stripe
    body: |
      Lock splitting gives independent variables their own locks.
      Lock striping uses many locks over parts of one structure.
      Bucket n of a map might use lock n mod 16.
      Operations on the whole structure must take every stripe.

  - type: predict
    prompt: In a hash map striped with 16 locks, thread A updates bucket 3 and thread B updates bucket 19. Do they contend?
    options:
      - text: Yes — 19 mod 16 = 3, so both buckets share lock 3
        correct: true
      - text: No — different buckets, different locks
        feedback: With 16 stripes, buckets 3 and 19 map to the same stripe.
    explanation: Striping reduces contention by about the number of stripes, assuming keys spread evenly.
    details: |
      Lock striping assigns bucket `n` to lock `n mod 16`.
      Buckets 3 and 19 both map to lock 3, so the two threads contend even though they touch different buckets.
      With keys spread evenly, any two operations collide on a stripe only about one time in sixteen, which is why striping cuts contention roughly by the number of stripes.

  - type: choice
    prompt: What's the cost of lock striping?
    options:
      - text: Operations that need the whole collection — resizing, `size()` done exactly — must acquire every stripe
        correct: true
      - text: Nothing
    explanation: That's why exclusive access to a `ConcurrentHashMap` isn't offered.

  - type: blank
    prompt: Complete the advice.
    template: "Lock splitting works when a lock guards several [[independent]] state variables."

  - type: choice
    id: listing-11-4
    prompt: |
      **Listing 11.4** · Which part of `userLocationMatches` actually needs the lock?
    code: |
      public class AttributeStore {
          @GuardedBy("this") private final Map<String, String>
                  attributes = new HashMap<String, String>();

          public synchronized boolean userLocationMatches(String name,
                                                          String regexp) {
              String key = "users." + name + ".location";
              String location = attributes.get(key);
              if (location == null)
                  return false;
              else
                  return Pattern.matches(regexp, location);
          }
      }
    language: java
    options:
      - text: "Only `attributes.get(key)`"
        correct: true
      - text: "All of it"
        feedback: "Building the key and matching the regex touch no shared state."
      - text: "None — `HashMap.get` is safe"
        feedback: "The map is shared and mutable, so reads need the lock."

  - type: choice
    id: listing-11-5
    prompt: |
      **Listing 11.5** · Is this version still thread-safe?
    code: |
      public class BetterAttributeStore {
          @GuardedBy("this") private final Map<String, String>
                  attributes = new HashMap<String, String>();

          public boolean userLocationMatches(String name, String regexp) {
              String key = "users." + name + ".location";
              String location;
              synchronized (this) {
                  location = attributes.get(key);
              }
              if (location == null)
                  return false;
              else
                  return Pattern.matches(regexp, location);
          }
      }
    language: java
    options:
      - text: "Yes — the only shared state, the map, is still read under the lock"
        correct: true
      - text: "No — `location` is read outside the lock"
        feedback: "`location` is a local, and `String` is immutable."
    explanation: |
      Shorter lock hold times mean less contention. Delegating to a `ConcurrentHashMap` would remove the lock entirely.

  - type: choice
    id: listing-11-6
    prompt: |
      **Listing 11.6** · Users and queries are independent sets. What's the scalability problem?
    code: |
      public class ServerStatusBeforeSplit {
          @GuardedBy("this") public final Set<String> users;
          @GuardedBy("this") public final Set<String> queries;

          public ServerStatusBeforeSplit() {
              users = new HashSet<String>();
              queries = new HashSet<String>();
          }

          public synchronized void addUser(String u) {
              users.add(u);
          }

          public synchronized void addQuery(String q) {
              queries.add(q);
          }

          public synchronized void removeUser(String u) {
              users.remove(u);
          }

          public synchronized void removeQuery(String q) {
              queries.remove(q);
          }
      }
    language: java
    options:
      - text: "One lock guards both, so adding a user waits for a query update and vice versa"
        correct: true
      - text: "The sets aren't thread-safe"
        feedback: "Every access is synchronized."
      - text: "None"
        feedback: "Independent state sharing one lock causes needless contention."

  - type: choice
    id: listing-11-7
    prompt: |
      **Listing 11.7** · What does splitting the lock change?
    code: |
      public class ServerStatusAfterSplit {
          @GuardedBy("users") public final Set<String> users;
          @GuardedBy("queries") public final Set<String> queries;
          ...
          public void addUser(String u) {
              synchronized (users) { users.add(u); }
          }
          public void addQuery(String q) {
              synchronized (queries) { queries.add(q); }
          }
          public void removeUser(String u) {
              synchronized (users) { users.remove(u); }
          }
          public void removeQuery(String q) {
              synchronized (queries) { queries.remove(q); }
          }
      }
    language: java
    options:
      - text: "User and query updates no longer block each other"
        correct: true
      - text: "It risks deadlock"
        feedback: "No method holds both locks."
      - text: "Nothing — it's the same lock"
        feedback: "Each set is now locked separately."

  - type: choice
    id: listing-11-8
    prompt: |
      **Listing 11.8** · `StripedMap` uses 16 locks for its buckets: `buckets[n]` is guarded by `locks[n % 16]`. How many threads can call `get` on different stripes at once, and what does `clear()` cost?
    code: |
      public Object get(Object key) {
          int hash = hash(key);
          synchronized (locks[hash % N_LOCKS]) {
              for (Node m = buckets[hash]; m != null; m = m.next)
                  if (m.key.equals(key))
                      return m.value;
          }
          return null;
      }

      public void clear() {
          for (int i = 0; i < buckets.length; i++) {
              synchronized (locks[i % N_LOCKS]) {
                  buckets[i] = null;
              }
          }
      }
    language: java
    options:
      - text: "Up to 16; `clear` takes each stripe lock in turn, so it isn't atomic"
        correct: true
      - text: "One; `clear` is atomic"
        feedback: "Different stripes have different locks."
      - text: "Unlimited; `clear` must take all 16 locks at once"
        feedback: "Here it takes them one at a time; an atomic clear would need all of them."
