title: Performance, scalability and Amdahl's law
summary: The serial fraction of a program caps its speed-up, no matter how many processors you add.
duration: 6
tags: [java, concurrency, performance, scalability, amdahl's law, speedup]
sources:
  - { book: jcip, ref: "§11.1–11.2, Thinking About Performance; Amdahl's Law" }
steps:
  - type: explanation
    title: How fast versus how much
    body: |
      Latency is how fast one request finishes.
      Scalability is how much more you handle with more CPUs.
      Concurrent programs usually aim for scalability.
      Make it right first. Optimize only after measuring.

  - type: explanation
    title: "Amdahl's law"
    body: |
      Some part of every program runs serially.
      That part limits the speed-up.
      With serial fraction F on N CPUs: speedup ≤ 1 / (F + (1 − F) / N).
      However many CPUs you add, it never beats 1 / F.

  - type: predict
    prompt: 10% of a program is serial. What's the maximum speed-up on 10 processors? (Round to one decimal place.)
    options:
      - text: "5.3"
        correct: true
      - text: "10"
        feedback: "That would need a 0% serial part."
      - text: "9"
        feedback: "Use the formula — 1 / (0.1 + 0.9 / 10)."
      - text: "1.1"
        feedback: "That's the speed-up from the serial part alone. Use 1 / (F + (1 − F) / N)."
    hints:
      - 1 / (0.1 + 0.09)
    explanation: 1 / 0.19 ≈ 5.3 — barely half the ideal, with only 10% serial.
    details: |
      Amdahl's law gives speed-up = 1 / (F + (1 − F) / N), where F is the serial fraction and N the number of processors.
      With F = 0.1 and N = 10: 1 / (0.1 + 0.9 / 10) = 1 / 0.19 ≈ 5.3.
      Even a small serial part halves the benefit of ten cores, and as N grows the serial part dominates; that's why reducing serialization matters more than adding processors.

  - type: predict
    prompt: 10% of a program is serial. With unlimited processors, What's the ceiling on its speed-up?
    options:
      - text: "10"
        correct: true
      - text: "Unlimited"
        feedback: "The serial 10% never speeds up, so the ceiling is 1 / 0.1."
      - text: "100"
        feedback: "The ceiling is 1 / F."
    hints:
      - As N grows, (1 − F) / N approaches 0.
    explanation: 1 / F = 1 / 0.1 = 10. No number of cores beats it.

  - type: explanation
    title: Serial parts hide in shared data
    body: |
      A shared queue or counter makes threads take turns.
      A single lock turns parallel work serial.
      Concurrent data structures shrink that serial part.

  - type: choice
    prompt: Where do serial fractions hide in a "fully parallel" program?
    options:
      - text: Shared data structures — a single work queue, a synchronized collection, a counter every thread updates
        correct: true
      - text: Nowhere, if the tasks are independent
        feedback: Coordination among them — fetching tasks, merging results — is serial.

  - type: choice
    prompt: "A `synchronizedList` work queue scales poorly as threads are added; a `ConcurrentLinkedQueue` scales much better. Why?"
    options:
      - text: The synchronized queue serialises every access behind one lock; the concurrent one lets only the actual pointer updates contend
        correct: true
      - text: The concurrent one uses less memory
    explanation: Reducing the serialised fraction is what scalability work is about.
