title: Lock and ReentrantLock
summary: The same mutual exclusion as synchronized, plus timed, polled and interruptible acquisition — at the price of unlocking yourself.
duration: 6
tags: [java, concurrency, lock, reentrantlock, trylock, lockinterruptibly]
sources:
  - { book: jcip, ref: "§13.1, Lock and ReentrantLock" }
steps:
  - type: explanation
    title: An explicit lock
    body: |
      `ReentrantLock` works like `synchronized`, with more options.

      ```java
      lock.lock();
      try { /* update state */ }
      finally { lock.unlock(); }
      ```

      Always unlock in `finally`.

  - type: choice
    prompt: |
      The `finally` was forgotten. What happens if `updateState()` throws?
    code: |
      lock.lock();
      updateState();
      lock.unlock();
    language: java
    options:
      - text: The lock is never released — every later thread that needs it blocks forever
        correct: true
      - text: The JVM releases it automatically, as with synchronized
        feedback: That's the safety net `synchronized` gives you and `Lock` doesn't.
    explanation: This is why explicit locks are more dangerous — a bug that's easy to miss in review.
    details: |
      An intrinsic lock is released automatically when execution leaves the `synchronized` block, however it leaves.
      An explicit `Lock` is released only when `unlock()` is called. If an exception skips that call, the lock stays held forever, and every thread that later needs it blocks.
      The program doesn't crash; it hangs, often far from the cause. Always put `unlock()` in a `finally` block.

  - type: explanation
    title: Ways to acquire
    body: |
      `lock()` waits as long as it takes.
      `tryLock()` gives up at once if the lock is taken.
      `tryLock(timeout)` waits up to a limit.
      `lockInterruptibly()` can be interrupted while waiting.
    diagram:
      classes:
        - { name: Lock, kind: interface, methods: ["lock()", "tryLock()", "tryLock(timeout)", "lockInterruptibly()", "unlock()", "newCondition()"] }
        - { name: ReentrantLock, methods: ["isHeldByCurrentThread()"] }
      relations:
        - { from: ReentrantLock, to: Lock, type: implements }

  - type: match
    prompt: Match each acquisition method to its behaviour.
    pairs:
      - left: "`lock()`"
        right: Wait as long as it takes, ignoring interrupts
      - left: "`tryLock()`"
        right: Take the lock if it's free right now; otherwise return false at once
      - left: "`tryLock(timeout, unit)`"
        right: Wait up to a time limit, then give up
      - left: "`lockInterruptibly()`"
        right: Wait, but stop with `InterruptedException` if interrupted

  - type: blank
    prompt: Always release in finally.
    template: |
      lock.lock();
      try {
          balance -= amount;
      } [[finally]] {
          lock.[[unlock]]();
      }
    code: true

  - type: choice
    prompt: A task should give up if it can't send a message within its time budget. Which method fits?
    options:
      - text: "`tryLock(timeLeft, NANOSECONDS)` — and report failure if it returns false"
        correct: true
      - text: "`lock()`"
        feedback: It could wait indefinitely and blow the budget.

  - type: explanation
    title: Locks across scopes
    body: |
      `synchronized` must release in the same block.
      An explicit lock can be released elsewhere.
      That allows hand-over-hand locking along a list.

  - type: choice
    prompt: Why might you need hand-over-hand ("chained") locking, as when traversing a linked list?
    options:
      - text: To lock the next node before releasing the current one — impossible with block-structured synchronized
        correct: true
      - text: To make locks reentrant
    explanation: Explicit locks can be acquired and released in different scopes, which enables patterns like this.

  - type: choice
    id: listing-13-1
    prompt: |
      **Listing 13.1** · Which of these can intrinsic locks (`synchronized`) not do?
    code: |
      public interface Lock {
          void lock();
          void lockInterruptibly() throws InterruptedException;
          boolean tryLock();
          boolean tryLock(long timeout, TimeUnit unit)
              throws InterruptedException;
          void unlock();
          Condition newCondition();
      }
    language: java
    options:
      - text: "Give up waiting — after a timeout, at once, or on interrupt"
        correct: true
      - text: "Be reentrant"
        feedback: "Intrinsic locks are reentrant too."
      - text: "Guarantee visibility"
        feedback: "Both give the same memory semantics."

  - type: choice
    id: listing-13-2
    prompt: |
      **Listing 13.2** · What's the danger in this code?
    code: |
      Lock lock = new ReentrantLock();
      ...
      lock.lock();
      updateObjectState();
      lock.unlock();
    language: java
    options:
      - text: "If `updateObjectState()` throws, the lock is never released"
        correct: true
      - text: "None"
        feedback: "Unlike `synchronized`, an explicit lock isn't released automatically on exception."
      - text: "`ReentrantLock` must be locked twice"
        feedback: "One `lock()` and one `unlock()` match."
    explanation: |
      Always `lock(); try { ... } finally { unlock(); }`.

  - type: choice
    id: listing-13-3
    prompt: |
      **Listing 13.3** · Two threads transfer money in opposite directions between the same accounts with this method. Can they deadlock?
    code: |
      while (true) {
          if (fromAcct.lock.tryLock()) {
              try {
                  if (toAcct.lock.tryLock()) {
                      try {
                          if (fromAcct.getBalance().compareTo(amount) < 0)
                              throw new InsufficientFundsException();
                          else {
                              fromAcct.debit(amount);
                              toAcct.credit(amount);
                              return true;
                          }
                      } finally {
                          toAcct.lock.unlock();
                      }
                  }
              } finally {
                  fromAcct.lock.unlock();
              }
          }
          if (System.nanoTime() > stopTime)
              return false;
          NANOSECONDS.sleep(fixedDelay + rnd.nextLong() % randMod);
      }
    language: java
    options:
      - text: "No — a thread that can't get both locks releases what it has and retries after a random delay"
        correct: true
      - text: "Yes — the locks are taken in opposite orders"
        feedback: "`tryLock` never waits, so no thread holds one lock while waiting for another."
      - text: "No, but they can livelock forever"
        feedback: "The random back-off makes repeated collisions unlikely, and the deadline stops it."

  - type: choice
    id: listing-13-4
    prompt: |
      **Listing 13.4** · The lock is held by another thread for longer than `nanosToLock`. What does this return?
    code: |
      public boolean trySendOnSharedLine(String message,
                                         long timeout, TimeUnit unit)
              throws InterruptedException {
          long nanosToLock = unit.toNanos(timeout)
                  - estimatedNanosToSend(message);
          if (!lock.tryLock(nanosToLock, NANOSECONDS))
              return false;
          try {
              return sendOnSharedLine(message);
          } finally {
              lock.unlock();
          }
      }
    language: java
    options:
      - text: "`false`, as soon as the time budget runs out"
        correct: true
      - text: "It waits for the lock, however long"
        feedback: "Timed `tryLock` gives up after the timeout."
      - text: "Throws `TimeoutException`"
        feedback: "`tryLock` returns `false` on timeout."

  - type: choice
    id: listing-13-5
    prompt: |
      **Listing 13.5** · A thread is waiting to acquire the lock and gets interrupted. What happens?
    code: |
      public boolean sendOnSharedLine(String message)
              throws InterruptedException {
          lock.lockInterruptibly();
          try {
              return cancellableSendOnSharedLine(message);
          } finally {
              lock.unlock();
          }
      }
    language: java
    options:
      - text: "`lockInterruptibly` throws `InterruptedException`; the lock is never acquired"
        correct: true
      - text: "It keeps waiting"
        feedback: "That's plain `lock()` — and `synchronized`."
      - text: "`unlock()` throws `IllegalMonitorStateException`"
        feedback: "The exception is thrown before the `try`, so `finally` isn't reached."
