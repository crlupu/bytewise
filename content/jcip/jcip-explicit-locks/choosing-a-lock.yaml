title: Fairness, and synchronized vs ReentrantLock
summary: Fair locks cost throughput; ReentrantLock is for when you need its extra features — otherwise use synchronized.
duration: 5
tags: [java, concurrency, fairness, reentrantlock, synchronized, performance]
sources:
  - { book: jcip, ref: "§13.2–13.4, Performance Considerations; Fairness; Choosing Between Synchronized and ReentrantLock" }
steps:
  - type: explanation
    title: Fair or nonfair
    body: |
      A fair lock serves threads in arrival order.
      A nonfair lock lets a newcomer barge in when it's free.
      Nonfair is the default.

  - type: explanation
    title: Nonfair is faster
    body: |
      Waking a waiting thread takes time.
      A running thread can use the lock in that gap.
      Choose fairness only when starvation matters.

  - type: choice
    prompt: Why is nonfair locking usually faster under contention?
    options:
      - text: Resuming a suspended thread takes time; letting an already-running thread barge in uses the lock during that gap
        correct: true
      - text: Fair locks use more memory
        feedback: The cost is in latency between release and the next acquisition, not memory.
    explanation: In JCIP's benchmarks fair locks were dramatically slower — sometimes by two orders of magnitude.
    details: |
      When a lock is released, a fair lock hands it to the longest-waiting thread, which must first be woken by the OS — a delay of microseconds or more.
      A nonfair lock lets a thread that happens to be running and asking at that moment take it immediately, using the lock while the woken thread is still starting.
      That barging fills the gap and greatly increases throughput, at the cost of no ordering guarantee.

  - type: choice
    prompt: When does fairness matter?
    options:
      - text: When locks are held relatively long, or requests arrive slowly enough that barging rarely helps — and starvation must be avoided
        correct: true
      - text: Always
        feedback: Most programs never need fairness, and pay for it heavily if they ask for it.

  - type: explanation
    title: Prefer synchronized
    body: |
      `synchronized` is simpler, and can't be left locked.
      Use `ReentrantLock` only for timeouts, interrupts or unusual structures.

  - type: match
    prompt: Synchronized or ReentrantLock?
    pairs:
      - left: Plain mutual exclusion around a block of code
        right: "`synchronized` — simpler, and impossible to forget to unlock"
      - left: Timed or polled lock attempts
        right: "`ReentrantLock.tryLock`"
      - left: Interruptible lock acquisition
        right: "`ReentrantLock.lockInterruptibly`"
      - left: Non-block-structured locking, like hand-over-hand
        right: "`ReentrantLock` — `lock` and `unlock` in different scopes"

  - type: blank
    prompt: Complete the rule.
    template: "Use ReentrantLock only when you need something intrinsic locking doesn't provide; otherwise prefer [[synchronized]]."
    explanation: Since Java 6, intrinsic locking performs about as well as ReentrantLock, so performance isn't a reason to switch.
