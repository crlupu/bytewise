title: Blocking and interruptible methods
summary: When a method throws InterruptedException, you must propagate it or restore the interrupt — never swallow it.
duration: 5
tags: [java, concurrency, interruption, interruptedexception, blocking]
sources:
  - { book: jcip, ref: "§5.4, Blocking and Interruptible Methods" }
steps:
  - type: explanation
    title: Blocking methods can be interrupted
    body: |
      A method that throws `InterruptedException` may block.
      Interrupting a thread asks it to stop waiting.
      It's a request, not a command.

  - type: explanation
    title: Never swallow an interrupt
    body: |
      Propagate `InterruptedException` if you can.
      If you can't, restore the flag:

      ```java
      Thread.currentThread().interrupt();
      ```

      Catching the exception clears the flag otherwise.

  - type: choice
    prompt: Your code calls `queue.take()`, which throws `InterruptedException`. Which responses are acceptable?
    options:
      - text: Propagate it — declare `throws InterruptedException` and let callers deal with it
        correct: true
      - text: Catch it and restore the status with `Thread.currentThread().interrupt()`, so code higher up sees it
        correct: true
      - text: Catch it and do nothing
        feedback: That destroys the evidence that interruption happened — the code that asked for it never finds out.
    explanation: Only code that implements a thread's interruption policy — usually the code that owns the thread — may swallow it.

  - type: blank
    prompt: Restore the interrupt in a `Runnable`, which can't throw `InterruptedException`.
    template: |
      try {
          processTask(queue.take());
      } catch (InterruptedException e) {
          Thread.currentThread().[[interrupt]]();
      }
    code: true

  - type: choice
    prompt: Why does catching `InterruptedException` clear the thread's interrupt status?
    options:
      - text: The exception itself carries the signal — so if you don't propagate it or set the status again, it's gone
        correct: true
      - text: It doesn't
        feedback: Methods that throw it clear the status first; that's why restoring it matters.
    details: |
      Interruption is a single flag per thread. When a blocking method like `take` notices it, it clears the flag and throws `InterruptedException` instead.
      The information now lives only in the exception, so if you catch it and do nothing, the request to stop is lost — code further up the stack, which might own the thread and need to exit, never learns about it.
      That's why you either rethrow, or call `Thread.currentThread().interrupt()` to put the flag back.

  - type: explanation
    title: Not everything is interruptible
    body: |
      `sleep`, `take` and `wait` respond to interrupts.
      Waiting for a `synchronized` lock does not.
      Neither does old-style socket I/O.

  - type: match
    prompt: Match each method to whether it responds to interruption.
    pairs:
      - left: "`Thread.sleep`, `BlockingQueue.take`, `Object.wait`"
        right: Throw `InterruptedException` when interrupted
      - left: Waiting to enter a `synchronized` block
        right: Not interruptible — the thread keeps waiting
      - left: Classic blocking socket I/O in `java.io`
        right: Not interruptible — closing the socket is the usual workaround

  - type: choice
    id: listing-5-10
    prompt: |
      **Listing 5.10** · The thread running this task is interrupted while waiting in `take()`. What happens?
    code: |
      public class TaskRunnable implements Runnable {
          BlockingQueue<Task> queue;

          public void run() {
              try {
                  processTask(queue.take());
              } catch (InterruptedException e) {
                  // restore interrupted status
                  Thread.currentThread().interrupt();
              }
          }

          void processTask(Task task) {
              // Handle the task
          }

          interface Task {
          }
      }
    language: java
    options:
      - text: "The wait ends, and the interrupt flag is set again so callers higher up can see it"
        correct: true
      - text: "The interrupt is swallowed and lost"
        feedback: "`interrupt()` in the catch restores the status that throwing cleared."
      - text: "The task keeps waiting"
        feedback: "`take()` responds to interruption by throwing."
