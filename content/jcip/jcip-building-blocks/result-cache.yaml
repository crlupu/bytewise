title: Building an efficient result cache
summary: Four versions of a memoizer — from slow and safe to fast and correct — combining everything in the chapter.
duration: 7
tags: [java, concurrency, memoization, cache, concurrenthashmap, futuretask, putifabsent]
sources:
  - { book: jcip, ref: "§5.6, Building an Efficient, Scalable Result Cache" }
steps:
  - type: explanation
    title: Caching expensive results
    body: |
      A memoizer wraps an expensive function and caches results.
      The goal: thread-safe, and still fast under load.

  - type: explanation
    title: Cache futures, not values
    body: |
      Put a `Future` in the map before computing.
      Other threads find it and wait for the result.
      `putIfAbsent` makes sure only one future wins.

  - type: match
    prompt: Match each version to its problem.
    pairs:
      - left: "`HashMap` cache, `compute` method `synchronized`"
        right: Safe, but only one thread can compute at a time — sometimes slower than no cache
      - left: "`ConcurrentHashMap` of results, check then compute"
        right: Two threads can compute the same value at once, since neither sees the other's work in progress
      - left: "`ConcurrentHashMap` of `Future`s, check then put"
        right: A small window remains — two threads can both miss and both put
      - left: "`ConcurrentHashMap` of `Future`s with atomic `putIfAbsent`"
        right: None of the above — each value is computed once

  - type: choice
    prompt: Why cache `Future`s instead of results?
    options:
      - text: A second thread asking for a value that's being computed finds the future and waits for it, instead of computing it again
        correct: true
      - text: Futures take less memory
    explanation: The map records "computation started", not just "computation finished".
    details: |
      If the map holds only finished results, a second thread asking for a value still being computed finds nothing and starts the same expensive computation again.
      Storing a `Future` records that the computation has started: the second thread finds the future and simply waits on `get()` for the first thread's result.
      The remaining race — two threads both inserting a future for the same key — is closed with `putIfAbsent`, so only one future ever runs.

  - type: explanation
    title: Clean up failures
    body: |
      Remove cancelled futures, or the cache keeps bad results.
      A real cache also needs expiry and eviction.

  - type: choice
    prompt: Why does `Memoizer`, which caches `Future`s, remove a cancelled future from the cache?
    options:
      - text: Otherwise every later request for that argument would get the cancelled result — cache pollution
        correct: true
      - text: To save memory
    explanation: The `while (true)` loop then retries the computation.

  - type: blank
    prompt: "`Memoizer` checks the cache, then adds a new `Future` — two threads could both add one. The atomic operation that closes that window:"
    template: "f = cache.[[putIfAbsent]](arg, ft);"
    code: true

  - type: choice
    prompt: "`Memoizer` caches `Future`s in a `ConcurrentHashMap` with `putIfAbsent`, and removes cancelled ones. What's still missing for a production cache?"
    options:
      - text: Expiration and eviction — this cache grows forever
        correct: true
      - text: Thread safety
        feedback: That's solved; what's left is a policy for when entries leave.

  - type: choice
    id: listing-5-16
    prompt: |
      **Listing 5.16** · Is `Memoizer1` thread-safe, and how does it perform?
    code: |
      public class Memoizer1 <A, V> implements Computable<A, V> {
          @GuardedBy("this") private final Map<A, V> cache = new HashMap<A, V>();
          private final Computable<A, V> c;

          public Memoizer1(Computable<A, V> c) {
              this.c = c;
          }

          public synchronized V compute(A arg) throws InterruptedException {
              V result = cache.get(arg);
              if (result == null) {
                  result = c.compute(arg);
                  cache.put(arg, result);
              }
              return result;
          }
      }

      interface Computable <A, V> {
          V compute(A arg) throws InterruptedException;
      }

      class ExpensiveFunction
              implements Computable<String, BigInteger> {
          public BigInteger compute(String arg) {
              // after deep thought...
              return new BigInteger(arg);
          }
      }
    language: java
    options:
      - text: "It's thread-safe"
        correct: true
      - text: "Only one thread can compute at a time, even for different arguments"
        correct: true
      - text: "Two threads can compute the same value"
        feedback: "The whole method is synchronized."

  - type: choice
    id: listing-5-17
    prompt: |
      **Listing 5.17** · What's the remaining problem with `Memoizer2`?
    code: |
      public class Memoizer2 <A, V> implements Computable<A, V> {
          private final Map<A, V> cache = new ConcurrentHashMap<A, V>();
          private final Computable<A, V> c;

          public Memoizer2(Computable<A, V> c) {
              this.c = c;
          }

          public V compute(A arg) throws InterruptedException {
              V result = cache.get(arg);
              if (result == null) {
                  result = c.compute(arg);
                  cache.put(arg, result);
              }
              return result;
          }
      }
    language: java
    options:
      - text: "Two threads can compute the same value at the same time"
        correct: true
      - text: "It isn't thread-safe — the map can be corrupted"
        feedback: "`ConcurrentHashMap` handles concurrent `get` and `put`."
      - text: "Only one thread can compute at a time"
        feedback: "There's no lock around the computation anymore."

  - type: choice
    id: listing-5-18
    prompt: |
      **Listing 5.18** · What's the remaining problem with `Memoizer3`?
    code: |
      public class Memoizer3<A, V> implements Computable<A, V> {
          private final Map<A, Future<V>> cache
                  = new ConcurrentHashMap<A, Future<V>>();
          private final Computable<A, V> c;

          public Memoizer3(Computable<A, V> c) { this.c = c; }

          public V compute(final A arg) throws InterruptedException {
              Future<V> f = cache.get(arg);
              if (f == null) {
                  Callable<V> eval = new Callable<V>() {
                      public V call() throws InterruptedException {
                          return c.compute(arg);
                      }
                  };
                  FutureTask<V> ft = new FutureTask<V>(eval);
                  f = ft;
                  cache.put(arg, ft);
                  ft.run(); // call to c.compute happens here
              }
              try {
                  return f.get();
              } catch (ExecutionException e) {
                  throw launderThrowable(e.getCause());
              }
          }
      }
    language: java
    options:
      - text: "A small window remains: two threads can both miss, both put, and both compute"
        correct: true
      - text: "Threads asking for a value already being computed compute it again"
        feedback: "They find the `Future` and wait on it — that's what this version fixed."
      - text: "None — it's the final version"
        feedback: "`get`, then `put`, is still check-then-act."

  - type: choice
    id: listing-5-19
    prompt: |
      **Listing 5.19** · Is each value computed only once, and what happens if a computation is cancelled?
    code: |
      public class Memoizer <A, V> implements Computable<A, V> {
          private final ConcurrentMap<A, Future<V>> cache
                  = new ConcurrentHashMap<A, Future<V>>();
          private final Computable<A, V> c;

          public Memoizer(Computable<A, V> c) {
              this.c = c;
          }

          public V compute(final A arg) throws InterruptedException {
              while (true) {
                  Future<V> f = cache.get(arg);
                  if (f == null) {
                      Callable<V> eval = new Callable<V>() {
                          public V call() throws InterruptedException {
                              return c.compute(arg);
                          }
                      };
                      FutureTask<V> ft = new FutureTask<V>(eval);
                      f = cache.putIfAbsent(arg, ft);
                      if (f == null) {
                          f = ft;
                          ft.run();
                      }
                  }
                  try {
                      return f.get();
                  } catch (CancellationException e) {
                      cache.remove(arg, f);
                  } catch (ExecutionException e) {
                      throw LaunderThrowable.launderThrowable(e.getCause());
                  }
              }
          }
      }
    language: java
    options:
      - text: "Each value is computed once — `putIfAbsent` lets only one future in"
        correct: true
      - text: "A cancelled future is removed, and the loop tries again"
        correct: true
      - text: "Cached values expire after a while"
        feedback: "There's no expiry or eviction — the cache only grows."

  - type: choice
    id: listing-5-20
    prompt: |
      **Listing 5.20** · Two requests ask to factor the same number at the same moment. What happens?
    code: |
      public class Factorizer extends GenericServlet implements Servlet {
          private final Computable<BigInteger, BigInteger[]> c =
                  new Computable<BigInteger, BigInteger[]>() {
                      public BigInteger[] compute(BigInteger arg) {
                          return factor(arg);
                      }
                  };
          private final Computable<BigInteger, BigInteger[]> cache
                  = new Memoizer<BigInteger, BigInteger[]>(c);

          public void service(ServletRequest req,
                              ServletResponse resp) {
              try {
                  BigInteger i = extractFromRequest(req);
                  encodeIntoResponse(resp, cache.compute(i));
              } catch (InterruptedException e) {
                  encodeError(resp, "factorization interrupted");
              }
          }

          void encodeError(ServletResponse resp, String errorString) {
          }
      }
    language: java
    options:
      - text: "It's factored once; both requests get the result"
        correct: true
      - text: "It's factored twice"
        feedback: "The `Memoizer` makes the second request wait on the first's `Future`."
      - text: "The second request gets an error"
        feedback: "It simply waits for the result."
