title: Semaphores and barriers
summary: Bound how many threads use a resource, or make a group of threads wait for each other.
duration: 5
tags: [java, concurrency, semaphore, cyclicbarrier, exchanger, synchronizers]
sources:
  - { book: jcip, ref: "§5.5.3–5.5.4, Semaphores and Barriers" }
steps:
  - type: explanation
    title: Semaphores hand out permits
    body: |
      `acquire()` takes a permit, waiting if none are left.
      `release()` gives one back.
      This set allows at most `bound` elements:

      ```java
      public boolean add(T o) throws InterruptedException {
          sem.acquire();
          boolean wasAdded = false;
          try { wasAdded = set.add(o); return wasAdded; }
          finally { if (!wasAdded) sem.release(); }
      }
      ```

  - type: predict
    prompt: |
      `BoundedHashSet` is built with a bound of 2. You add "a", "b", then "a" again. Does the third `add` block?
    code: |
      // sem = new Semaphore(bound)
      public boolean add(T o) throws InterruptedException {
          sem.acquire();
          boolean wasAdded = false;
          try { wasAdded = set.add(o); return wasAdded; }
          finally { if (!wasAdded) sem.release(); }
      }
    language: java
    options:
      - text: No — "a" is already in the set, so `add` just returns false
        feedback: "`add` acquires a permit *before* checking the set, and both permits are already taken."
      - text: Yes — it blocks in `acquire()` until something is removed, even though "a" is already present
        correct: true
    explanation: The permit is taken before checking membership. If the add then fails because "a" exists, the permit is given back — but only after `acquire` succeeded.
    details: |
      `BoundedHashSet.add` acquires a permit before it even tries to add, because it can't know in advance whether the element is new.
      With both permits taken by "a" and "b", the third call blocks in `acquire()` — even though adding "a" again wouldn't grow the set.
      If it got a permit, the failed add would release it again. This conservative design keeps the bound simple and safe at the cost of an occasional unnecessary wait.

  - type: choice
    prompt: What's a binary semaphore (one permit)?
    options:
      - text: A non-reentrant mutex — whoever holds the permit holds the lock
        correct: true
      - text: A semaphore that can only be acquired twice
    explanation: Unlike intrinsic locks, a semaphore permit isn't tied to a thread — any thread can release it.

  - type: explanation
    title: Barriers wait for each other
    body: |
      A barrier waits for a group of threads to arrive.
      When the last one comes, all go on together.
      `CyclicBarrier` then resets for the next round.

  - type: match
    prompt: Match each synchronizer to its job.
    pairs:
      - left: "`CountDownLatch`"
        right: Wait for events to happen; one-shot
      - left: "`Semaphore`"
        right: Limit the number of threads using a resource
      - left: "`CyclicBarrier`"
        right: Make a group of threads wait for each other, repeatedly
      - left: "`Exchanger`"
        right: Two threads swap objects at a meeting point

  - type: choice
    id: listing-5-14
    prompt: |
      **Listing 5.14** · With `bound` = 2, what happens to a third `add` of a new element while two are present?
    code: |
      public class BoundedHashSet <T> {
          private final Set<T> set;
          private final Semaphore sem;

          public BoundedHashSet(int bound) {
              this.set = Collections.synchronizedSet(new HashSet<T>());
              sem = new Semaphore(bound);
          }

          public boolean add(T o) throws InterruptedException {
              sem.acquire();
              boolean wasAdded = false;
              try {
                  wasAdded = set.add(o);
                  return wasAdded;
              } finally {
                  if (!wasAdded)
                      sem.release();
              }
          }

          public boolean remove(Object o) {
              boolean wasRemoved = set.remove(o);
              if (wasRemoved)
                  sem.release();
              return wasRemoved;
          }
      }
    language: java
    options:
      - text: "It blocks in `acquire()` until another element is removed"
        correct: true
      - text: "It throws `IllegalStateException`"
        feedback: "`acquire()` waits for a permit."
      - text: "It succeeds and the set holds three"
        feedback: "There are only two permits."

  - type: choice
    id: listing-5-15
    prompt: |
      **Listing 5.15** · When is `commitNewValues()` run?
    code: |
      public class CellularAutomata {
          private final Board mainBoard;
          private final CyclicBarrier barrier;
          private final Worker[] workers;

          public CellularAutomata(Board board) {
              this.mainBoard = board;
              int count = Runtime.getRuntime().availableProcessors();
              this.barrier = new CyclicBarrier(count,
                      new Runnable() {
                          public void run() {
                              mainBoard.commitNewValues();
                          }});
              this.workers = new Worker[count];
              for (int i = 0; i < count; i++)
                  workers[i] = new Worker(mainBoard.getSubBoard(count, i));
          }

          private class Worker implements Runnable {
              private final Board board;

              public Worker(Board board) { this.board = board; }
              public void run() {
                  while (!board.hasConverged()) {
                      for (int x = 0; x < board.getMaxX(); x++)
                          for (int y = 0; y < board.getMaxY(); y++)
                              board.setNewValue(x, y, computeValue(x, y));
                      try {
                          barrier.await();
                      } catch (InterruptedException ex) {
                          return;
                      } catch (BrokenBarrierException ex) {
                          return;
                      }
                  }
              }

              private int computeValue(int x, int y) {
                  // Compute the new value that goes in (x,y)
                  return 0;
              }
          }

          public void start() {
              for (int i = 0; i < workers.length; i++)
                  new Thread(workers[i]).start();
              mainBoard.waitForConvergence();
          }

          interface Board {
              int getMaxX();
              int getMaxY();
              int getValue(int x, int y);
              int setNewValue(int x, int y, int value);
              void commitNewValues();
              boolean hasConverged();
              void waitForConvergence();
              Board getSubBoard(int numPartitions, int index);
          }
      }
    language: java
    options:
      - text: "Once per step, after every worker has reached the barrier"
        correct: true
      - text: "By each worker after its own part is done"
        feedback: "The barrier action runs once, when the last thread arrives."
      - text: "Only once, at the end"
        feedback: "`CyclicBarrier` resets and runs its action every time all threads arrive."
