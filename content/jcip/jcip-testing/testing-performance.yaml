title: Testing performance — and its pitfalls
summary: Garbage collection, JIT compilation, unrealistic workloads and dead-code elimination can all make benchmarks lie.
duration: 5
tags: [java, concurrency, benchmarking, jit, garbage collection, dead code elimination, jmh]
sources:
  - { book: jcip, ref: "§12.2–12.4, Testing for Performance; Avoiding Performance Testing Pitfalls" }
steps:
  - type: explanation
    title: Measure realistic workloads
    body: |
      Measure throughput and latency end to end.
      See how they change with threads and buffer sizes.
      Comparing implementations is often most useful.

  - type: explanation
    title: Benchmarks lie easily
    body: |
      Garbage collection skews single runs.
      Early iterations run before the JIT compiles.
      Unused results get optimized away entirely.
      Warm up, run long, and use every result.

  - type: match
    prompt: Match each benchmarking pitfall to its effect.
    pairs:
      - left: Garbage collection
        right: A collection that happens in one run but not another skews the timing
      - left: Dynamic compilation
        right: Early iterations run interpreted, then compiled — mixing both distorts results
      - left: Unrealistic contention
        right: Real tasks do other work between locks; a tight loop exaggerates contention
      - left: Dead-code elimination
        right: The compiler removes computation whose result is never used, timing nothing at all

  - type: predict
    prompt: A benchmark computes `fib(30)` in a loop but never uses the results. A new JVM makes it 1,000× faster. What happened?
    options:
      - text: The optimizer saw the result was unused and eliminated the computation
        correct: true
      - text: The new JVM is 1,000× faster
        feedback: Real improvements are rarely that large; suspect the benchmark.
    explanation: Make results observable cheaply — for example, compare a hash of the result with a random value, or use JMH's `Blackhole`.

  - type: choice
    prompt: How do you avoid measuring the JIT compiler at work?
    options:
      - text: Run long enough — or warm up first — so that compiled code dominates, and discard the warm-up
        correct: true
      - text: Run the test exactly once
    explanation: "`-XX:+PrintCompilation` shows when compilation happens. JMH automates warm-up and many other pitfalls."

  - type: blank
    prompt: Complete the advice.
    template: "Run tests long enough that [[garbage]] collection and compilation happen many times, rather than once by chance."
