title: Testing performance — and its pitfalls
summary: Garbage collection, JIT compilation, unrealistic workloads and dead-code elimination can all make benchmarks lie.
duration: 5
tags: [java, concurrency, benchmarking, jit, garbage collection, dead code elimination, jmh]
sources:
  - { book: jcip, ref: "§12.2–12.4, Testing for Performance; Avoiding Performance Testing Pitfalls" }
steps:
  - type: explanation
    title: Measure realistic workloads
    body: |
      Measure throughput and latency end to end.
      See how they change with threads and buffer sizes.
      Comparing implementations is often most useful.

  - type: explanation
    title: Benchmarks lie easily
    body: |
      Garbage collection skews single runs.
      Early iterations run before the JIT compiles.
      Unused results get optimized away entirely.
      Warm up, run long, and use every result.

  - type: match
    prompt: Match each benchmarking pitfall to its effect.
    pairs:
      - left: Garbage collection
        right: A collection that happens in one run but not another skews the timing
      - left: Dynamic compilation
        right: Early iterations run interpreted, then compiled — mixing both distorts results
      - left: Unrealistic contention
        right: Real tasks do other work between locks; a tight loop exaggerates contention
      - left: Dead-code elimination
        right: The compiler removes computation whose result is never used, timing nothing at all

  - type: predict
    prompt: A benchmark computes `fib(30)` in a loop but never uses the results. A new JVM makes it 1,000× faster. What happened?
    options:
      - text: The optimizer saw the result was unused and eliminated the computation
        correct: true
      - text: The new JVM is 1,000× faster
        feedback: Real improvements are rarely that large; suspect the benchmark.
    explanation: Make results observable cheaply — for example, compare a hash of the result with a random value, or use JMH's `Blackhole`.
    details: |
      If the result of `fib(30)` is never used, the JIT may prove the call has no effect and delete it, so the loop measures nothing.
      A newer JVM with a smarter optimizer made the "benchmark" 1,000 times faster without the code getting faster at all.
      Benchmarks must consume their results in a way the compiler can't predict, which is what JMH's `Blackhole` is for.

  - type: choice
    prompt: How do you avoid measuring the JIT compiler at work?
    options:
      - text: Run long enough — or warm up first — so that compiled code dominates, and discard the warm-up
        correct: true
      - text: Run the test exactly once
    explanation: "`-XX:+PrintCompilation` shows when compilation happens. JMH automates warm-up and many other pitfalls."

  - type: blank
    prompt: Complete the advice.
    template: "Run tests long enough that [[garbage]] collection and compilation happen many times, rather than once by chance."

  - type: choice
    id: listing-12-11
    prompt: |
      **Listing 12.11** · This is the barrier action of a `CyclicBarrier`. When the barrier trips twice, what does `getTime()` return?
    code: |
      public class BarrierTimer implements Runnable {
          private boolean started;
          private long startTime, endTime;

          public synchronized void run() {
              long t = System.nanoTime();
              if (!started) {
                  started = true;
                  startTime = t;
              } else
                  endTime = t;
          }

          public synchronized void clear() {
              started = false;
          }

          public synchronized long getTime() {
              return endTime - startTime;
          }
      }
    language: java
    options:
      - text: "The time between the two trips"
        correct: true
      - text: "The time since the timer was created"
        feedback: "The first trip records the start."
      - text: "Zero"
        feedback: "The second trip records the end."

  - type: choice
    id: listing-12-12
    prompt: |
      **Listing 12.12** · Why measure with the barrier action rather than timing inside each thread?
    code: |
      public TimedPutTakeTest(int cap, int pairs, int trials) {
          super(cap, pairs, trials);
          barrier = new CyclicBarrier(nPairs * 2 + 1, timer);
      }

      public void test() {
          try {
              timer.clear();
              for (int i = 0; i < nPairs; i++) {
                  pool.execute(new PutTakeTest.Producer());
                  pool.execute(new PutTakeTest.Consumer());
              }
              barrier.await();
              barrier.await();
              long nsPerItem = timer.getTime() / (nPairs * (long) nTrials);
              System.out.print("Throughput: " + nsPerItem + " ns/item");
              assertEquals(putSum.get(), takeSum.get());
          } catch (Exception e) {
              throw new RuntimeException(e);
          }
      }
    language: java
    options:
      - text: "It times the whole run, from when all threads start to when all finish"
        correct: true
      - text: "It's more precise than `System.nanoTime`"
        feedback: "It uses `nanoTime` too."
      - text: "Threads can't read the clock"
        feedback: "They can; per-thread times just don't add up to the total."

  - type: choice
    id: listing-12-13
    prompt: |
      **Listing 12.13** · This driver runs each configuration twice, with a 1 s sleep between. Why the second run?
    code: |
      public static void main(String[] args) throws Exception {
          int tpt = 100000; // trials per thread
          for (int cap = 1; cap <= 1000; cap *= 10) {
              System.out.println("Capacity: " + cap);
              for (int pairs = 1; pairs <= 128; pairs *= 2) {
                  TimedPutTakeTest t = new TimedPutTakeTest(cap, pairs, tpt);
                  System.out.print("Pairs: " + pairs + "\t");
                  t.test();
                  System.out.print("\t");
                  Thread.sleep(1000);
                  t.test();
                  System.out.println();
                  Thread.sleep(1000);
              }
          }
          PutTakeTest.pool.shutdown();
      }
    language: java
    options:
      - text: "The first run includes warm-up — JIT compilation and thread creation; the second is steadier"
        correct: true
      - text: "To average away randomness"
        feedback: "Two runs are printed side by side, not averaged."
      - text: "The first run always fails"
        feedback: "Both runs assert the same checksum."
    explanation: |
      Typically capacity 1 is slowest, and throughput drops as the number of pairs exceeds the CPUs.
