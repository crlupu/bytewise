title: "After the book: virtual threads"
summary: Java 21's virtual threads (JEP 444) make thread-per-task affordable again for I/O-bound work.
duration: 6
tags: [java, concurrency, virtual threads, jep 444, loom, thread per task]
sources:
  - { book: jcip, ref: "Follow-up to Chapters 6 and 8 — see JEP 444" }
steps:
  - type: explanation
    title: Virtual threads are cheap
    body: |
      Classic threads are OS threads: costly and limited.
      Virtual threads, in Java 21, are managed by the JVM.
      You can run millions.

      ```java
      try (var exec = Executors.newVirtualThreadPerTaskExecutor()) {
          for (Request r : requests) exec.submit(() -> handle(r));
      }
      ```

  - type: explanation
    title: Blocking becomes cheap
    body: |
      A blocked virtual thread steps off its carrier thread.
      Another runs in its place.
      Great for I/O-heavy work. No need to pool them.

  - type: choice
    prompt: Which workload benefits most from virtual threads?
    options:
      - text: Thousands of concurrent requests that each spend most of their time waiting on I/O
        correct: true
      - text: Number-crunching that keeps every core busy
        feedback: CPU-bound work still needs one runnable thread per core; virtual threads don't add CPUs.

  - type: choice
    prompt: Should you pool virtual threads?
    options:
      - text: No — they're cheap to create; create one per task and let it end
        correct: true
      - text: Yes, like platform threads
        feedback: Pooling exists to amortise expensive creation. Virtual threads aren't expensive.
    explanation: To limit access to a scarce resource, like a database, use a `Semaphore` — not a small pool.

  - type: explanation
    title: Same rules, one catch
    body: |
      Thread safety and visibility work exactly the same.
      Before Java 24, blocking inside `synchronized` pinned the carrier.

  - type: choice
    prompt: Which of the book's lessons still apply unchanged to virtual threads?
    options:
      - text: Thread safety, visibility, atomicity and the memory model — they're still threads sharing memory
        correct: true
      - text: None — virtual threads are a different model
        feedback: Data races, deadlocks and visibility work exactly as before.

  - type: blank
    prompt: Create an executor that starts a new virtual thread per task.
    template: "var exec = Executors.[[newVirtualThreadPerTaskExecutor]]();"
    code: true
