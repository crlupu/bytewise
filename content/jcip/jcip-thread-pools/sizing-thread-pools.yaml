title: Sizing thread pools
summary: Too big wastes memory and CPU on switching; too small leaves processors idle. The right size depends on the work.
duration: 5
tags: [java, concurrency, thread pools, pool sizing, cpu-bound, io-bound]
sources:
  - { book: jcip, ref: "§8.2, Sizing Thread Pools" }
steps:
  - type: explanation
    title: Size depends on the work
    body: |
      For pure computation, use about one thread per core, plus one.
      Tasks that wait on I/O need more threads.
      Get the core count with `availableProcessors()`.

  - type: explanation
    title: The sizing formula
    body: |
      threads = cores × target CPU use × (1 + wait time / compute time)
      Longer waits mean more threads.

  - type: predict
    prompt: |
      An 8-core machine runs tasks that spend 90 ms waiting on a database for every 10 ms of computing.
      Aiming for full CPU utilisation, about how many threads should the pool have?
    options:
      - text: "80"
        correct: true
      - text: "8"
        feedback: "That's right for pure computation. These tasks spend 90% of their time waiting."
      - text: "9"
        feedback: "N + 1 is the rule for CPU-bound work. These tasks mostly wait."
      - text: "72"
        feedback: "Close — the formula multiplies by (1 + W/C), which is 10 here."
    hints:
      - W/C = 90 ÷ 10 = 9.
      - 8 × 1 × (1 + 9).
    explanation: 8 × 1 × (1 + 90/10) = 80 threads.
    details: |
      The formula is threads = CPUs × target utilisation × (1 + wait time / compute time).
      Each task waits 90 ms for every 10 ms of computing, so a ratio of 9; with 8 CPUs at 100%: 8 × 1 × (1 + 9) = 80.
      Intuitively, each thread uses a CPU only a tenth of the time, so you need ten threads per core to keep it busy.

  - type: predict
    prompt: Same tasks, but you only want the CPUs **50%** busy, to leave headroom. How many threads?
    options:
      - text: "40"
        correct: true
      - text: "80"
        feedback: "That's for 100% utilisation; halve it."
      - text: "20"
        feedback: "The formula is 8 × 0.5 × (1 + 9)."
      - text: "4"
        feedback: "That ignores the waiting time."
    explanation: 8 × 0.5 × 10 = 40.

  - type: explanation
    title: Other limits
    body: |
      Database connections, memory and files cap the pool too.
      More threads than connections just means more waiting.

  - type: choice
    prompt: The tasks share a JDBC connection pool of 10 connections. Does a pool of 80 threads still make sense?
    options:
      - text: No — at most 10 tasks can use the database at once; other resources cap the useful pool size too
        correct: true
      - text: Yes, CPU is all that matters
        feedback: Memory, file handles, sockets and database connections all limit how much concurrency helps.
    details: |
      The formula assumes the waiting is free, but here tasks wait on a database pool of 10 connections.
      Only 10 tasks can run their queries at once; the other 70 threads just queue for connections, consuming memory without adding throughput.
      When tasks depend on a limited resource, the resource's size bounds useful concurrency.

  - type: blank
    prompt: Find the number of processors at run time.
    template: "int nCpus = Runtime.getRuntime().[[availableProcessors]]();"
    code: true
