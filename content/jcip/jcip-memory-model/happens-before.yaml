title: Happens-before
summary: The Java Memory Model's partial ordering — the only thing that guarantees one thread sees another's writes.
duration: 7
tags: [java, concurrency, memory model, jmm, happens-before, reordering, data race]
sources:
  - { book: jcip, ref: "§16.1, What Is a Memory Model, and Why Would I Want One?" }
steps:
  - type: explanation
    title: Reordering is everywhere
    body: |
      Compilers, CPUs and caches reorder operations.
      One thread can't tell. Other threads can.

      ```java
      // Thread one     // Thread two
      a = 1;            b = 1;
      x = b;            y = a;
      ```

  - type: predict
    prompt: "`a`, `b`, `x`, `y` start at 0, with no synchronization. Can the result be x = 0 and y = 0?"
    options:
      - text: Yes — each thread's two actions may be reordered, or its write may not yet be visible to the other
        correct: true
      - text: No — at least one write must happen first
        feedback: That reasoning assumes a single global order of operations. Without synchronization, there isn't one.
    explanation: Every combination — (1, 0), (0, 1), (1, 1) and (0, 0) — is possible.
    details: |
      Without synchronization, the compiler and CPU may reorder independent actions, and writes can sit in a processor's store buffer before other cores see them.
      Thread A may effectively read `b` before its own write to `a` is visible, and thread B likewise — so both read the initial 0s.
      Only a happens-before relationship, created by locks, `volatile`, thread start and join and the like, rules out such outcomes.

  - type: explanation
    title: Happens-before
    body: |
      If A happens-before B, B sees everything A did.
      Unordered reads and writes to one variable are a data race.

  - type: explanation
    title: The rules
    body: |
      Program order within a thread.
      An unlock before the next lock of the same lock.
      A volatile write before later reads.
      Thread start and join. And it's transitive.

  - type: match
    prompt: Match each rule to what it orders.
    pairs:
      - left: Program order
        right: Each action in a thread happens-before every later action in that thread
      - left: Monitor lock
        right: An unlock happens-before every later lock of the same monitor
      - left: Volatile variable
        right: A write happens-before every later read of the same field
      - left: Thread start
        right: "`Thread.start` happens-before every action in the started thread"
      - left: Thread termination
        right: Every action in a thread happens-before another thread detects it ended, via `join` or `isAlive`
      - left: Transitivity
        right: If A happens-before B, and B before C, then A happens-before C

  - type: blank
    prompt: Complete the definition.
    template: "A data race occurs when a variable is read by more than one thread and written by at least one, and the reads and writes are not ordered by [[happens-before]]."
