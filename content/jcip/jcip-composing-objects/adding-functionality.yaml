title: Adding functionality to thread-safe classes
summary: Extending, client-side locking and composition — and the "wrong lock" bug that client-side locking invites.
duration: 6
tags: [java, concurrency, client-side locking, composition, putifabsent, synchronized collections]
sources:
  - { book: jcip, ref: "§4.4, Adding Functionality to Existing Thread-safe Classes" }
steps:
  - type: explanation
    title: Adding put-if-absent
    body: |
      Put-if-absent must check and add as one atomic step.
      The safest place is the original class.
      If you can't change it, you can extend it, lock from outside, or wrap it.

  - type: predict
    prompt: Is this helper's `putIfAbsent` atomic?
    code: |
      public class ListHelper<E> {
          public List<E> list = Collections.synchronizedList(new ArrayList<>());

          public synchronized boolean putIfAbsent(E x) {
              boolean absent = !list.contains(x);
              if (absent) list.add(x);
              return absent;
          }
      }
    language: java
    options:
      - text: No — it locks the `ListHelper`, but the list's other methods lock the list itself
        correct: true
      - text: Yes — the method is synchronized
        feedback: Synchronized on the wrong lock. Another thread calling `list.add` doesn't take the `ListHelper` lock.
    explanation: An illusion of synchronization — the classic client-side locking mistake.
    details: |
      `putIfAbsent` is synchronized on the `ListHelper` object, but the list's own methods synchronize on the list.
      Two different locks don't exclude each other, so another thread can call `list.add(x)` between `contains` and `add` here.
      The method looks atomic but isn't. To join the list's own locking, the helper must synchronize on the list itself, as `Collections.synchronizedList` documents.

  - type: explanation
    title: Use the right lock
    body: |
      Client-side locking must use the object's own lock.
      Locking your helper instead protects nothing.

  - type: blank
    prompt: |
      `ListHelper.putIfAbsent` is `synchronized`, so it locks the helper — but `list` is a `Collections.synchronizedList`, which locks on itself. Fix it by locking the lock the list actually uses.
    template: |
      public boolean putIfAbsent(E x) {
          synchronized ([[list]]) {
              boolean absent = !list.contains(x);
              if (absent) list.add(x);
              return absent;
          }
      }
    code: true
    explanation: "`Collections.synchronizedList` documents that it locks on the wrapper — so clients can join in."

  - type: explanation
    title: Wrapping is the most robust
    body: |
      A wrapper has its own lock and its own rules.
      It doesn't depend on how the inner list locks.
      The extra layer of locking costs very little.
    diagram:
      classes:
        - { name: List<E>, kind: interface, methods: ["add(e)", "contains(o)"] }
        - { name: ImprovedList<E>, fields: ["- list: List<E>"], methods: ["synchronized putIfAbsent(x)", "synchronized add(e)"] }
      relations:
        - { from: ImprovedList<E>, to: List<E>, type: implements }
        - { from: ImprovedList<E>, to: List<E>, type: has, label: wraps }
      caption: "The wrapper's own lock guards every call."

  - type: match
    prompt: Match each approach to its weakness.
    pairs:
      - left: Subclassing (`BetterVector extends Vector`)
        right: Depends on the superclass's synchronization policy staying the same
      - left: Client-side locking
        right: Spreads one class's locking policy into unrelated classes
      - left: Composition (wrap a `List` in your own class)
        right: Adds a layer of locking — usually a negligible cost

  - type: choice
    prompt: Why is composition the most robust?
    options:
      - text: The wrapper has its own lock and its own policy, and doesn't care whether the wrapped list is thread-safe
        correct: true
      - text: It's the fastest
        feedback: It's slightly slower, but it doesn't break when someone else changes their locking.
    explanation: "`ImprovedList<T> implements List<T>` wrapping a list, with every method synchronized on itself."
