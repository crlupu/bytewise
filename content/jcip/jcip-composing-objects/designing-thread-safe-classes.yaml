title: Designing a thread-safe class
summary: Identify the state, the invariants that constrain it, and the policy that protects it.
duration: 5
tags: [java, concurrency, class design, invariants, state, synchronization policy]
sources:
  - { book: jcip, ref: "§4.1, Designing a Thread-safe Class" }
steps:
  - type: explanation
    title: Three steps to a thread-safe class
    body: |
      Find the variables that make up the state.
      Find the invariants that constrain them.
      Decide how concurrent access will be managed.

  - type: order
    prompt: Put the three basic steps of designing a thread-safe class in order.
    items:
      - Identify the variables that form the object's state
      - Identify the invariants that constrain the state variables
      - Establish a policy for managing concurrent access to the state
    explanation: The **synchronization policy** says how the class combines immutability, confinement and locking — and which lock guards which variable.

  - type: explanation
    title: Invariants need atomic updates
    body: |
      An invariant is a rule that must always hold, like `lower <= upper`.
      If it spans several variables, update them together, under one lock.
      Otherwise another thread sees them half-changed.

  - type: choice
    prompt: A counter's state is a `long`, with the invariant "never negative". What does the invariant tell you about the design?
    options:
      - text: Every operation that could violate it — like decrement at zero — must check and update atomically
        correct: true
      - text: Nothing about concurrency — invariants are just for documentation
        feedback: Invariants are exactly what synchronization exists to protect.

  - type: explanation
    title: Some operations must wait
    body: |
      You can't take from an empty queue.
      Alone, that would just fail.
      With threads, you can wait until another thread adds something.
      Blocking queues and semaphores do this for you.

  - type: match
    prompt: Match each concept to an example.
    pairs:
      - left: Invariant
        right: "`lower <= upper` must always hold for a range"
      - left: Postcondition
        right: After `increment`, the counter is one more than before
      - left: State-based precondition
        right: "`take` from a queue needs the queue to be non-empty"

  - type: choice
    prompt: Who owns the state of a `HashMap` stored in a private field of your class?
    options:
      - text: Your class — the map's state is part of your object's state, so your synchronization policy covers it
        correct: true
      - text: The `HashMap` — it manages its own state
        feedback: An object you encapsulate is part of your state. Collections hand out shared ownership only through what they return.
    explanation: Ownership is a design decision; documenting it tells others who is responsible for locking.
