title: Delegating thread safety
summary: A class built from thread-safe parts is thread-safe — unless an invariant ties the parts together.
duration: 6
tags: [java, concurrency, delegation, invariants, concurrenthashmap, atomic]
sources:
  - { book: jcip, ref: "§4.3, Delegating Thread Safety" }
steps:
  - type: explanation
    title: Let thread-safe parts do the work
    body: |
      A class built from thread-safe parts may need no locks.

      ```java
      private final ConcurrentMap<String, Point> locations; // Point is immutable
      ```

      The concurrent map and immutable points carry the safety.
    diagram:
      kind: objects
      vars:
        - { name: tracker, to: t }
      objects:
        - { id: t, type: VehicleTracker, fields: [{ name: locations, to: m }] }
        - { id: m, type: ConcurrentHashMap, fields: [{ name: "\"car1\"", to: p1 }, { name: "\"car2\"", to: p2 }] }
        - { id: p1, type: Point, fields: [{ name: x, value: "3" }, { name: y, value: "4" }] }
        - { id: p2, type: Point, fields: [{ name: x, value: "7" }, { name: y, value: "1" }] }
      caption: "A thread-safe map of immutable points — the tracker needs no lock."

  - type: choice
    prompt: A class has two **independent** thread-safe state variables — keyboard listeners and mouse listeners, each a `CopyOnWriteArrayList`. Is the class thread-safe?
    options:
      - text: Yes — the variables are independent, so delegating to each is enough
        correct: true
      - text: No — it needs a lock over both
        feedback: Nothing relates the two lists, so there's no invariant to protect.

  - type: explanation
    title: Only if the parts are independent
    body: |
      Two safe parts can still break a shared invariant.
      `lower` and `upper` can each be atomic, yet end up `lower > upper`.
      Linked variables need one lock around both.

  - type: predict
    prompt: |
      `NumberRange` keeps `lower` and `upper` in two `AtomicInteger`s, with the invariant `lower <= upper`. `setLower`
      checks `i <= upper.get()` then sets `lower`. Range is (0, 10). One thread calls `setLower(5)`, another `setUpper(4)`, at the same time. Can the range end up (5, 4)?
    options:
      - text: Yes — each check passes against the old value, then both sets happen
        correct: true
      - text: No — the atomic variables prevent it
        feedback: Each variable is safe on its own; the check-then-act across both isn't.
    explanation: |
      When state variables are **not** independent, delegation isn't enough. The class needs its own lock around
      operations involving both.
    details: |
      `setLower(5)` checks `5 <= upper` while upper is still 10; at the same time `setUpper(4)` checks `4 >= lower` while lower is still 0.
      Both checks pass, both sets happen, and the range ends up as (5, 4) — violating the invariant.
      Each `AtomicInteger` is thread-safe on its own, but the invariant links them, so the check and the update must happen together under one lock.

  - type: blank
    prompt: Complete the rule.
    template: "A class can delegate thread safety to its state variables only if they're thread-safe, [[independent]], and no operation has invalid state transitions."

  - type: choice
    prompt: When can a class safely **publish** a delegated state variable to its callers?
    options:
      - text: When it's thread-safe, takes part in no invariants, and has no prohibited state transitions
        correct: true
      - text: Never
        feedback: Publishing a thread-safe, unconstrained variable is fine — callers can't put it into an invalid state.

  - type: choice
    id: listing-4-6
    prompt: |
      **Listing 4.6** · Can a `Point` be shared freely between threads?
    code: |
      public class Point {
          public final int x, y;

          public Point(int x, int y) {
              this.x = x;
              this.y = y;
          }
      }
    language: java
    options:
      - text: "Yes — it's immutable, with `final` fields"
        correct: true
      - text: "No — its fields are public"
        feedback: "Public `final` fields can't be changed, so there's nothing to protect."

  - type: choice
    id: listing-4-7
    prompt: |
      **Listing 4.7** · Is `DelegatingVehicleTracker` thread-safe, with no locks of its own?
    code: |
      public class DelegatingVehicleTracker {
          private final ConcurrentMap<String, Point> locations;
          private final Map<String, Point> unmodifiableMap;

          public DelegatingVehicleTracker(Map<String, Point> points) {
              locations = new ConcurrentHashMap<String, Point>(points);
              unmodifiableMap = Collections.unmodifiableMap(locations);
          }

          public Map<String, Point> getLocations() {
              return unmodifiableMap;
          }

          public Point getLocation(String id) {
              return locations.get(id);
          }

          public void setLocation(String id, int x, int y) {
              if (locations.replace(id, new Point(x, y)) == null)
                  throw new IllegalArgumentException("invalid vehicle name: " + id);
          }
      }
    language: java
    options:
      - text: "Yes — it delegates to a `ConcurrentHashMap` of immutable `Point`s"
        correct: true
      - text: "`getLocations` returns a live view that reflects later changes"
        correct: true
      - text: "No — `setLocation` checks then acts"
        feedback: "`replace` is a single atomic operation."

  - type: choice
    id: listing-4-8
    prompt: |
      **Listing 4.8** · How does this `getLocations` differ from returning `Collections.unmodifiableMap(locations)`?
    code: |
      public Map<String, Point> getLocations() {
          return Collections.unmodifiableMap(
                  new HashMap<String, Point>(locations));
      }
    language: java
    options:
      - text: "It returns a snapshot that won't change as vehicles move"
        correct: true
      - text: "It returns a live view of the current locations"
        feedback: "It copies the map first, so later updates don't show."
      - text: "It's no longer thread-safe"
        feedback: "Copying a `ConcurrentHashMap` is safe; the copy is never shared mutably."

  - type: choice
    id: listing-4-9
    prompt: |
      **Listing 4.9** · Is `VisualComponent` thread-safe, with no locks of its own?
    code: |
      public class VisualComponent {
          private final List<KeyListener> keyListeners
                  = new CopyOnWriteArrayList<KeyListener>();
          private final List<MouseListener> mouseListeners
                  = new CopyOnWriteArrayList<MouseListener>();

          public void addKeyListener(KeyListener listener) {
              keyListeners.add(listener);
          }

          public void addMouseListener(MouseListener listener) {
              mouseListeners.add(listener);
          }

          public void removeKeyListener(KeyListener listener) {
              keyListeners.remove(listener);
          }

          public void removeMouseListener(MouseListener listener) {
              mouseListeners.remove(listener);
          }
      }
    language: java
    options:
      - text: "Yes — the two lists are independent and each is thread-safe"
        correct: true
      - text: "No — adding to both lists needs one lock"
        feedback: "No invariant ties the two lists together, so each can be safe on its own."

  - type: choice
    id: listing-4-10
    prompt: |
      **Listing 4.10** · Range (0, 10). One thread calls `setLower(5)` while another calls `setUpper(4)`. What can happen?
    code: |
      public class NumberRange {
          // INVARIANT: lower <= upper
          private final AtomicInteger lower = new AtomicInteger(0);
          private final AtomicInteger upper = new AtomicInteger(0);

          public void setLower(int i) {
              if (i > upper.get())
                  throw new IllegalArgumentException("can't set lower to " + i + " > upper");
              lower.set(i);
          }

          public void setUpper(int i) {
              if (i < lower.get())
                  throw new IllegalArgumentException("can't set upper to " + i + " < lower");
              upper.set(i);
          }

          public boolean isInRange(int i) {
              return (i >= lower.get() && i <= upper.get());
          }
      }
    language: java
    options:
      - text: "Both succeed, leaving the invalid range (5, 4)"
        correct: true
      - text: "One of them always throws"
        feedback: "Each check reads the other bound before the other thread has written it."
      - text: "It's safe — each bound is an `AtomicInteger`"
        feedback: "The invariant links the two variables, so each check-then-act must be atomic across both."

  - type: choice
    id: listing-4-11
    prompt: |
      **Listing 4.11** · Why does `SafePoint` have a `get()` returning both coordinates, and a private constructor taking an array?
    code: |
      public class SafePoint {
          @GuardedBy("this") private int x, y;

          private SafePoint(int[] a) {
              this(a[0], a[1]);
          }

          public SafePoint(SafePoint p) {
              this(p.get());
          }

          public SafePoint(int x, int y) {
              this.set(x, y);
          }

          public synchronized int[] get() {
              return new int[]{x, y};
          }

          public synchronized void set(int x, int y) {
              this.x = x;
              this.y = y;
          }
      }
    language: java
    options:
      - text: "So a copy reads x and y together, under one lock"
        correct: true
      - text: "Separate `getX()` and `getY()` would let a copy mix an old x with a new y"
        correct: true
      - text: "Arrays are faster than two fields"
        feedback: "It's about reading both values atomically."
    explanation: |
      The private array constructor avoids the race that `this(p.x, p.y)` would have — the private constructor capture idiom.

  - type: choice
    id: listing-4-12
    prompt: |
      **Listing 4.12** · Is `PublishingVehicleTracker` thread-safe?
    code: |
      public class PublishingVehicleTracker {
          private final Map<String, SafePoint> locations;
          private final Map<String, SafePoint> unmodifiableMap;

          public PublishingVehicleTracker(Map<String, SafePoint> locations) {
              this.locations = new ConcurrentHashMap<String, SafePoint>(locations);
              this.unmodifiableMap = Collections.unmodifiableMap(this.locations);
          }

          public Map<String, SafePoint> getLocations() {
              return unmodifiableMap;
          }

          public SafePoint getLocation(String id) {
              return locations.get(id);
          }

          public void setLocation(String id, int x, int y) {
              if (!locations.containsKey(id))
                  throw new IllegalArgumentException("invalid vehicle name: " + id);
              locations.get(id).set(x, y);
          }
      }
    language: java
    options:
      - text: "Yes — the map is concurrent and each `SafePoint` is thread-safe"
        correct: true
      - text: "Callers can move vehicles through the points they get back"
        correct: true
      - text: "No — the `SafePoint`s are mutable"
        feedback: "Mutable is fine when they're thread-safe and publishing them is part of the design."
