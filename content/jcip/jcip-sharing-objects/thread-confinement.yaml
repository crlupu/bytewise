title: Thread confinement
summary: Data that only one thread ever touches needs no synchronization — confine it on purpose.
duration: 5
tags: [java, concurrency, thread confinement, threadlocal, stack confinement, jdbc]
sources:
  - { book: jcip, ref: "§3.3, Thread Confinement" }
steps:
  - type: explanation
    title: "Don't share"
    body: |
      Data used by only one thread needs no locks.
      This is thread confinement.
      Swing keeps all components on one thread.

  - type: explanation
    title: Three ways to confine
    body: |
      Ad hoc: by convention only. Fragile.
      Stack: only local variables can reach it.
      `ThreadLocal`: each thread gets its own copy.
    diagram:
      kind: objects
      objects:
        - { id: t1, type: Thread A, fields: [{ name: "holder.get()", to: c1 }] }
        - { id: t2, type: Thread B, fields: [{ name: "holder.get()", to: c2 }] }
        - { id: c1, type: Connection }
        - { id: c2, type: Connection }
      caption: "One ThreadLocal, a separate value for each thread."

  - type: match
    prompt: Match each kind of confinement to how it works.
    pairs:
      - left: Ad hoc confinement
        right: Left to the implementation — nothing in the language enforces it, so it's fragile
      - left: Stack confinement
        right: The object is reachable only through local variables, which live on one thread's stack
      - left: "`ThreadLocal`"
        right: Each thread gets its own separate copy of a value

  - type: choice
    prompt: Is a local `int` variable ever shared between threads?
    options:
      - text: Never — primitives in local variables can't be referenced from elsewhere, so they're always stack-confined
        correct: true
      - text: Yes, if two threads call the method
        feedback: Each call has its own stack frame with its own copy.
    explanation: A local *reference* is confined too — as long as the object it points to never escapes.

  - type: blank
    prompt: Give each thread its own database connection.
    template: |
      private static ThreadLocal<Connection> connectionHolder =
          ThreadLocal.[[withInitial]](() -> DriverManager.getConnection(DB_URL));
    code: true
    explanation: Each thread calling `connectionHolder.get()` gets its own connection, created on first use.

  - type: explanation
    title: ThreadLocal in pools
    body: |
      Pool threads are reused.
      Values left in a `ThreadLocal` leak into the next task.
      Remove them when the task ends.

  - type: choice
    prompt: What's the danger of `ThreadLocal` in a thread pool?
    options:
      - text: Pool threads are reused, so values leak from one task to the next — and can keep objects alive — unless removed
        correct: true
      - text: There's no danger
        feedback: Values live as long as the thread does; call `remove()` when the task is done.
    explanation: "`ThreadLocal`s are like global variables: use them sparingly."
    details: |
      A pool reuses its threads for many tasks, and a `ThreadLocal` value lives as long as its thread.
      A value set by one task — a user ID, a transaction — is still there when the next unrelated task runs on that thread, leaking data between requests.
      It also keeps objects alive for the pool's lifetime. Clear thread-local values in a `finally` block at the end of each task.

  - type: choice
    id: listing-3-9
    prompt: |
      **Listing 3.9** · Many threads call `loadTheArk` at once on one `Animals` object. Is the `animals` set safe, though it's a plain `TreeSet`?
    code: |
      public class Animals {
          Ark ark;
          Species species;
          Gender gender;

          public int loadTheArk(Collection<Animal> candidates) {
              SortedSet<Animal> animals;
              int numPairs = 0;
              Animal candidate = null;

              // animals confined to method, don't let them escape!
              animals = new TreeSet<Animal>(new SpeciesGenderComparator());
              animals.addAll(candidates);
              for (Animal a : animals) {
                  if (candidate == null || !candidate.isPotentialMate(a))
                      candidate = a;
                  else {
                      ark.load(new AnimalPair(candidate, a));
                      ++numPairs;
                      candidate = null;
                  }
              }
              return numPairs;
          }

          class Animal {
              Species species;
              Gender gender;

              public boolean isPotentialMate(Animal other) {
                  return species == other.species && gender != other.gender;
              }
          }

          enum Species {
              AARDVARK, BENGAL_TIGER, CARIBOU, DINGO, ELEPHANT, FROG, GNU, HYENA,
              IGUANA, JAGUAR, KIWI, LEOPARD, MASTADON, NEWT, OCTOPUS,
              PIRANHA, QUETZAL, RHINOCEROS, SALAMANDER, THREE_TOED_SLOTH,
              UNICORN, VIPER, WEREWOLF, XANTHUS_HUMMINBIRD, YAK, ZEBRA
          }

          enum Gender {
              MALE, FEMALE
          }

          class AnimalPair {
              private final Animal one, two;

              public AnimalPair(Animal one, Animal two) {
                  this.one = one;
                  this.two = two;
              }
          }

          class SpeciesGenderComparator implements Comparator<Animal> {
              public int compare(Animal one, Animal two) {
                  int speciesCompare = one.species.compareTo(two.species);
                  return (speciesCompare != 0)
                          ? speciesCompare
                          : one.gender.compareTo(two.gender);
              }
          }

          class Ark {
              private final Set<AnimalPair> loadedAnimals = new HashSet<AnimalPair>();

              public void load(AnimalPair pair) {
                  loadedAnimals.add(pair);
              }
          }
      }
    language: java
    options:
      - text: "Yes — it's a local variable that never escapes, so each thread has its own"
        correct: true
      - text: "No — `TreeSet` isn't thread-safe"
        feedback: "That only matters if it's shared. Here only one thread can ever reach it."
      - text: "Only if the method is `synchronized`"
        feedback: "Stack confinement makes it safe without a lock."

  - type: choice
    id: listing-3-10
    prompt: |
      **Listing 3.10** · Several threads call `getConnection()`. What do they get?
    code: |
      public class ConnectionDispenser {
          static String DB_URL = "jdbc:mysql://localhost/mydatabase";

          private ThreadLocal<Connection> connectionHolder
                  = new ThreadLocal<Connection>() {
                      public Connection initialValue() {
                          try {
                              return DriverManager.getConnection(DB_URL);
                          } catch (SQLException e) {
                              throw new RuntimeException("Unable to acquire Connection, e");
                          }
                      };
                  };

          public Connection getConnection() {
              return connectionHolder.get();
          }
      }
    language: java
    options:
      - text: "Each thread gets its own connection, created on its first call"
        correct: true
      - text: "They all share one connection"
        feedback: "`ThreadLocal` keeps a separate value per thread."
      - text: "A new connection on every call"
        feedback: "`initialValue` runs once per thread; later calls return the same one."
