title: Immutability
summary: Immutable objects are always thread-safe — and a volatile reference to an immutable holder can replace a lock.
duration: 6
tags: [java, concurrency, immutability, final, volatile, publication]
sources:
  - { book: jcip, ref: "§3.4, Immutability" }
steps:
  - type: explanation
    title: Immutable objects are always safe
    body: |
      State that can't change can't be corrupted.
      An immutable object has all fields `final`.
      Nothing changes after construction.
      And `this` never escapes while it's built.

  - type: choice
    prompt: "This class keeps a `Set` internally and the set is mutable. Can the class still be immutable?"
    code: |
      public final class ThreeStooges {
          private final Set<String> stooges = new HashSet<>();
          public ThreeStooges() {
              stooges.add("Moe"); stooges.add("Larry"); stooges.add("Curly");
          }
          public boolean isStooge(String name) { return stooges.contains(name); }
      }
    language: java
    options:
      - text: Yes — the set is never modified after construction and never escapes
        correct: true
      - text: No — it uses a mutable object
        feedback: Immutability is about the object's observable state, not the classes it uses internally.
    details: |
      Immutability is about observable state, not whether internal objects could in principle change.
      The set is filled in the constructor, the reference is `private final`, no method modifies it and it never escapes, so after construction no one can change it.
      The `final` field also guarantees that other threads see the set as constructed. That's enough for the class to be immutable, and therefore thread-safe without locks.

  - type: explanation
    title: "Replace, don't modify"
    body: |
      Put related values in one immutable holder.
      To change them, swap in a new holder.

      ```java
      private volatile OneValueCache cache;
      cache = new OneValueCache(i, factors);
      ```

      `volatile` makes the new holder visible at once.

  - type: choice
    prompt: Why does this need no lock?
    options:
      - text: The number and its factors change together, by replacing one immutable object, and `volatile` makes the new one visible at once
        correct: true
      - text: "`volatile` makes the methods atomic"
        feedback: It only makes the reference visible; atomicity comes from the pair living in one immutable object.
    explanation: A thread reading `cache` sees either the old pair or the new pair — never a mix.

  - type: explanation
    title: Make fields final by default
    body: |
      Make every field `final` unless it must change.
      Allocation is cheap.
      Immutability saves locks and copies.

  - type: blank
    prompt: Complete the rule.
    template: "Just as it's good practice to make all fields private unless they need more visibility, it's good practice to make all fields [[final]] unless they need to be mutable."

  - type: choice
    prompt: Are immutable objects inefficient, since every change needs a new object?
    options:
      - text: Rarely — allocation is cheap, and immutability removes locking, defensive copies and generational GC costs
        correct: true
      - text: Yes, always
