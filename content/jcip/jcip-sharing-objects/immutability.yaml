title: Immutability
summary: Immutable objects are always thread-safe — and a volatile reference to an immutable holder can replace a lock.
duration: 6
tags: [java, concurrency, immutability, final, volatile, publication]
sources:
  - { book: jcip, ref: "§3.4, Immutability" }
steps:
  - type: explanation
    title: Immutable objects are always safe
    body: |
      State that can't change can't be corrupted.
      An immutable object has all fields `final`.
      Nothing changes after construction.
      And `this` never escapes while it's built.

  - type: choice
    prompt: "This class keeps a `Set` internally and the set is mutable. Can the class still be immutable?"
    code: |
      public final class ThreeStooges {
          private final Set<String> stooges = new HashSet<>();
          public ThreeStooges() {
              stooges.add("Moe"); stooges.add("Larry"); stooges.add("Curly");
          }
          public boolean isStooge(String name) { return stooges.contains(name); }
      }
    language: java
    options:
      - text: Yes — the set is never modified after construction and never escapes
        correct: true
      - text: No — it uses a mutable object
        feedback: Immutability is about the object's observable state, not the classes it uses internally.
    details: |
      Immutability is about observable state, not whether internal objects could in principle change.
      The set is filled in the constructor, the reference is `private final`, no method modifies it and it never escapes, so after construction no one can change it.
      The `final` field also guarantees that other threads see the set as constructed. That's enough for the class to be immutable, and therefore thread-safe without locks.

  - type: explanation
    title: "Replace, don't modify"
    body: |
      Put related values in one immutable holder.
      To change them, swap in a new holder.

      ```java
      private volatile OneValueCache cache;
      cache = new OneValueCache(i, factors);
      ```

      `volatile` makes the new holder visible at once.
    diagram:
      kind: objects
      vars:
        - { name: cache, to: c2 }
      objects:
        - { id: c1, type: OneValueCache, fields: [{ name: lastNumber, value: "12" }, { name: lastFactors, value: "[2, 2, 3]" }] }
        - { id: c2, type: OneValueCache, fields: [{ name: lastNumber, value: "15" }, { name: lastFactors, value: "[3, 5]" }] }
      highlight: [c2]
      caption: "A reader sees the old pair or the new one — never 15 with [2, 2, 3]."

  - type: choice
    prompt: Why does this need no lock?
    options:
      - text: The number and its factors change together, by replacing one immutable object, and `volatile` makes the new one visible at once
        correct: true
      - text: "`volatile` makes the methods atomic"
        feedback: It only makes the reference visible; atomicity comes from the pair living in one immutable object.
    explanation: A thread reading `cache` sees either the old pair or the new pair — never a mix.

  - type: explanation
    title: Make fields final by default
    body: |
      Make every field `final` unless it must change.
      Allocation is cheap.
      Immutability saves locks and copies.

  - type: blank
    prompt: Complete the rule.
    template: "Just as it's good practice to make all fields private unless they need more visibility, it's good practice to make all fields [[final]] unless they need to be mutable."

  - type: choice
    prompt: Are immutable objects inefficient, since every change needs a new object?
    options:
      - text: Rarely — allocation is cheap, and immutability removes locking, defensive copies and generational GC costs
        correct: true
      - text: Yes, always

  - type: choice
    id: listing-3-11
    prompt: |
      **Listing 3.11** · Is `ThreeStooges` immutable, though it holds a mutable `HashSet`?
    code: |
      public final class ThreeStooges {
          private final Set<String> stooges = new HashSet<String>();

          public ThreeStooges() {
              stooges.add("Moe");
              stooges.add("Larry");
              stooges.add("Curly");
          }

          public boolean isStooge(String name) {
              return stooges.contains(name);
          }

          public String getStoogeNames() {
              List<String> stooges = new Vector<String>();
              stooges.add("Moe");
              stooges.add("Larry");
              stooges.add("Curly");
              return stooges.toString();
          }
      }
    language: java
    options:
      - text: "Yes — the set is filled in the constructor, never changed after and never escapes"
        correct: true
      - text: "No — any class holding a mutable object is mutable"
        feedback: "Immutability is about the object's state never changing after construction, not the types of its fields."
      - text: "Only if the set were a `ConcurrentHashMap`-backed set"
        feedback: "No thread-safe collection is needed: the set is only read after construction."

  - type: choice
    id: listing-3-12
    prompt: |
      **Listing 3.12** · Why does `OneValueCache` copy the factors array, both in and out?
    code: |
      public class OneValueCache {
          private final BigInteger lastNumber;
          private final BigInteger[] lastFactors;

          public OneValueCache(BigInteger i,
                               BigInteger[] factors) {
              lastNumber = i;
              lastFactors = Arrays.copyOf(factors, factors.length);
          }

          public BigInteger[] getFactors(BigInteger i) {
              if (lastNumber == null || !lastNumber.equals(i))
                  return null;
              else
                  return Arrays.copyOf(lastFactors, lastFactors.length);
          }
      }
    language: java
    options:
      - text: "So no caller can change the cached array — the holder stays immutable"
        correct: true
      - text: "It doesn't need to; the fields are `final`"
        feedback: "`final` stops the field being reassigned, not the array's contents being changed."
      - text: "To make it faster"
        feedback: "Copying costs time; it's done for safety."

  - type: choice
    id: listing-3-13
    prompt: |
      **Listing 3.13** · Many requests call `service` at once. What's true?
    code: |
      public class VolatileCachedFactorizer extends GenericServlet implements Servlet {
          private volatile OneValueCache cache = new OneValueCache(null, null);

          public void service(ServletRequest req, ServletResponse resp) {
              BigInteger i = extractFromRequest(req);
              BigInteger[] factors = cache.getFactors(i);
              if (factors == null) {
                  factors = factor(i);
                  cache = new OneValueCache(i, factors);
              }
              encodeIntoResponse(resp, factors);
          }
      }
    language: java
    options:
      - text: "It's thread-safe without any locking"
        correct: true
      - text: "A request always sees a matching number and factors"
        correct: true
      - text: "Two requests can overwrite each other's cache, but that's harmless"
        correct: true
      - text: "The cache can hold one request's number with another's factors"
        feedback: "Both are in one immutable object, swapped in with a single volatile write."
