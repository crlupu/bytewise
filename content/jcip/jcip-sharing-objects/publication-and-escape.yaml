title: Publication and escape
summary: Making an object reachable from other code publishes it — and an object that escapes too early is visible half-built.
duration: 6
tags: [java, concurrency, publication, escape, this escape, constructors]
sources:
  - { book: jcip, ref: "§3.2, Publication and Escape" }
steps:
  - type: explanation
    title: Publishing and escaping
    body: |
      Publishing makes an object reachable by other code.
      An object that's published by mistake has escaped.

      ```java
      public String[] getStates() { return states; } // private array escapes
      ```
    diagram:
      kind: objects
      vars:
        - { name: "String[] s", to: arr }
        - { name: unsafe, to: us }
      objects:
        - { id: us, type: UnsafeStates, fields: [{ name: private states, to: arr }] }
        - { id: arr, type: "String[]", fields: [{ name: "[0]", value: "\"AK\"" }, { name: "[1]", value: "\"AL\"" }] }
      highlight: [arr]
      caption: "After getStates(), any caller can write into the private array."

  - type: choice
    prompt: "`getStates()` returns the private array. What's the problem?"
    options:
      - text: Any caller can now modify the array — the "private" state has escaped
        correct: true
      - text: Nothing, since the field is private
        feedback: "Private stops code naming the field. It doesn't stop code holding a reference from changing the array."

  - type: explanation
    title: "Don't let this escape"
    body: |
      A constructor that registers a listener publishes `this` early.
      Other threads may use a half-built object.
      Construct first, then register, in a factory method.
      Creating a thread in a constructor is fine. Starting it isn't.

  - type: choice
    prompt: Why is publishing `this` from a constructor dangerous?
    options:
      - text: Other threads may see — and call methods on — an object whose constructor hasn't finished
        correct: true
      - text: It isn't dangerous if it's the constructor's last statement
        feedback: Even as the last statement, the JVM doesn't guarantee other threads see a fully constructed object.
    explanation: An object is only in a predictable, consistent state after its constructor returns.
    details: |
      Registering a listener or starting a thread in the constructor hands `this` to other code before the constructor has finished.
      Another thread can then call methods on an object whose fields aren't all set yet, and even `final` fields lose their visibility guarantee.
      The object only becomes consistent when the constructor returns. A factory method that constructs first, then registers, avoids the escape.

  - type: order
    prompt: |
      A constructor that registers a listener with an event source lets `this` escape before the object is built. Put the safe alternative — a private constructor and a factory method — in order.
    items:
      - The factory calls the private constructor, which only initialises fields
      - The constructor returns a fully built object
      - The factory registers the listener with the event source
      - The factory returns the object
    explanation: Starting a thread or registering a listener after construction keeps `this` from escaping early.

  - type: choice
    prompt: Is it safe to *create* a thread in a constructor?
    options:
      - text: Creating is fine; starting it from the constructor isn't — it can see the object before construction completes
        correct: true
      - text: Neither is safe
      - text: Both are safe
    explanation: Provide a `start()` or `initialize()` method, or use a factory.

  - type: choice
    id: listing-3-5
    prompt: |
      **Listing 3.5** · After `initialize()`, what's true of the set in `knownSecrets`?
    code: |
      class Secrets {
          public static Set<Secret> knownSecrets;

          public void initialize() {
              knownSecrets = new HashSet<Secret>();
          }
      }

      class Secret {
      }
    language: java
    options:
      - text: "It's published — any code can reach it, and any `Secret` added to it"
        correct: true
      - text: "It's confined to the `Secrets` object"
        feedback: "It's a public static field, reachable from anywhere."
      - text: "It's safe to modify from several threads"
        feedback: "It's a plain `HashSet`; publishing it doesn't make it thread-safe."

  - type: choice
    id: listing-3-6
    prompt: |
      **Listing 3.6** · What's the problem with `getStates()`?
    code: |
      class UnsafeStates {
          private String[] states = new String[]{
              "AK", "AL" /*...*/
          };

          public String[] getStates() {
              return states;
          }
      }
    language: java
    options:
      - text: "The private array escapes — any caller can change its contents"
        correct: true
      - text: "Nothing — the field is `private`"
        feedback: "The method returns the array itself, not a copy."
      - text: "The array is copied on every call, which is slow"
        feedback: "It isn't copied at all."

  - type: choice
    id: listing-3-7
    prompt: |
      **Listing 3.7** · What can go wrong in this constructor?
    code: |
      public class ThisEscape {
          public ThisEscape(EventSource source) {
              source.registerListener(new EventListener() {
                  public void onEvent(Event e) {
                      doSomething(e);
                  }
              });
          }

          void doSomething(Event e) {
          }

          interface EventSource {
              void registerListener(EventListener e);
          }

          interface EventListener {
              void onEvent(Event e);
          }

          interface Event {
          }
      }
    language: java
    options:
      - text: "`this` escapes: the source can call `doSomething` on a partly built object"
        correct: true
      - text: "Another thread can see the object before the constructor finishes"
        correct: true
      - text: "Nothing — the listener is only registered"
        feedback: "The anonymous class holds a hidden reference to `ThisEscape.this`."

  - type: choice
    id: listing-3-8
    prompt: |
      **Listing 3.8** · How does `SafeListener` avoid the problem of registering a listener in its constructor?
    code: |
      public class SafeListener {
          private final EventListener listener;

          private SafeListener() {
              listener = new EventListener() {
                  public void onEvent(Event e) {
                      doSomething(e);
                  }
              };
          }

          public static SafeListener newInstance(EventSource source) {
              SafeListener safe = new SafeListener();
              source.registerListener(safe.listener);
              return safe;
          }

          void doSomething(Event e) {
          }

          interface EventSource {
              void registerListener(EventListener e);
          }

          interface EventListener {
              void onEvent(Event e);
          }

          interface Event {
          }
      }
    language: java
    options:
      - text: "The constructor only builds the listener; the factory registers it once the object is complete"
        correct: true
      - text: "It doesn't — `this` still escapes from the constructor"
        feedback: "The constructor never passes the listener (or `this`) to anyone."
      - text: "Making the constructor private makes it thread-safe"
        feedback: "The private constructor just forces callers through the factory, which registers after construction."
