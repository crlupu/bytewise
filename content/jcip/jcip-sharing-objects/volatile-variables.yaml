title: Volatile variables
summary: A weaker form of synchronization — visibility without locking — and the narrow cases where it's enough.
duration: 5
tags: [java, concurrency, volatile, visibility, flags]
sources:
  - { book: jcip, ref: "§3.1.4, Volatile Variables" }
steps:
  - type: explanation
    title: volatile means always fresh
    body: |
      A `volatile` field is never cached out of sight.
      Every read sees the latest write.
      Writes before it become visible too.

      ```java
      volatile boolean asleep;
      while (!asleep) countSomeSheep();
      ```

  - type: choice
    prompt: Which of these is `volatile` alone enough for?
    options:
      - text: A completion, interruption or status flag one thread sets and others read
        correct: true
      - text: Publishing a reference to a fully built, immutable object
        correct: true
      - text: A counter several threads increment with `count++`
        feedback: Every read is fresh, but the read-add-write is still three steps that can interleave.
      - text: An invariant over two variables
        feedback: Volatile can't make updates to two variables atomic together.
    details: |
      `volatile` guarantees each read sees the latest write, and that writes before a volatile write are visible after a volatile read.
      That's enough for a flag one thread sets and others check, and for publishing a reference to an object that won't change.
      It isn't enough when the new value depends on the old one, like `count++`, or when several variables must change together — those need atomicity, which only locks or atomic classes give.

  - type: explanation
    title: Visible, but not atomic
    body: |
      `count++` on a `volatile` still races.
      Use `volatile` for simple flags and published references.
      Use locks or atomics for read-modify-write.

  - type: widget
    widget: threads
    prompt: |
      `count` is now `volatile`, so every read sees the latest write. **Still lose an update**: run both threads so
      `count` ends at **1**.
    config:
      threads: 2
      increments: 1
    goal:
      count: 1
    hints:
      - Visibility doesn't help if both threads read before either writes.
    explanation: Visibility guarantees each read is fresh *when it happens* — but the gap between read and write is still there.
    question:
      prompt: "Why didn't `volatile` stop the lost update?"
      options:
        - text: "Every read is fresh, but read, add and write are still three steps another thread can slip between"
          correct: true
        - text: "`volatile` only works for `boolean` fields"
          feedback: "It works for any field. It gives visibility, not atomicity."
        - text: "The writes weren't visible to the other thread"
          feedback: "They were visible — the other thread had just read too early."

  - type: blank
    prompt: Complete the rules for when volatile is enough.
    template: "Writes must not depend on the variable's [[current]] value, the variable must not take part in [[invariants]] with other state, and locking must not be needed for any other reason while it's accessed."

  - type: choice
    prompt: How do locking and volatile compare?
    options:
      - text: Locking guarantees both visibility and atomicity; volatile guarantees only visibility
        correct: true
      - text: Volatile is a faster lock
        feedback: It provides no mutual exclusion at all.
