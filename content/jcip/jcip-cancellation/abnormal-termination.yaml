title: Handling abnormal thread termination
summary: A RuntimeException silently kills the thread it's thrown in — unless something is watching.
duration: 5
tags: [java, concurrency, exceptions, uncaughtexceptionhandler, thread pools]
sources:
  - { book: jcip, ref: "§7.3, Handling Abnormal Thread Termination" }
steps:
  - type: explanation
    title: Threads can die silently
    body: |
      An uncaught exception kills its thread.
      The trace goes to a console nobody reads.
      A pool quietly shrinks, or a GUI freezes.

  - type: explanation
    title: Catch and report
    body: |
      Wrap code you don't control in `try`/`catch (Throwable)`.
      An `UncaughtExceptionHandler` can log dying threads.
      With `submit`, the exception goes into the `Future` instead.

  - type: choice
    prompt: What does `Thread.UncaughtExceptionHandler` provide?
    options:
      - text: A hook that's called when a thread is about to die from an uncaught exception — typically to log it
        correct: true
      - text: A way to stop exceptions from killing the thread
        feedback: The thread still dies; the handler just gets to report it.
    explanation: Set a handler via a `ThreadFactory` so every pool thread has one.

  - type: predict
    prompt: A task submitted with `executor.submit(task)` throws a `RuntimeException`. Does the uncaught exception handler see it?
    options:
      - text: No — `submit` wraps the task, and the exception is stored in the `Future`, rethrown from `get` as `ExecutionException`
        correct: true
      - text: Yes, just as with `execute`
        feedback: Only tasks run with `execute` reach the handler.
    explanation: If nobody ever calls `get`, the exception disappears without a trace.
    details: |
      `submit` wraps the task in a `FutureTask`, which catches everything the task throws and stores it as the future's outcome.
      The worker thread itself never sees an uncaught exception, so the uncaught-exception handler isn't called.
      The exception reappears only when someone calls `get()`, wrapped in an `ExecutionException`. If no one does, it's lost without a trace — a common reason background failures go unnoticed.

  - type: match
    prompt: Match each submission method to where a task's exception goes.
    pairs:
      - left: "`execute(runnable)`"
        right: The thread's uncaught exception handler
      - left: "`submit(callable)`"
        right: The returned Future — thrown by `get` as `ExecutionException`

  - type: blank
    prompt: Install a handler for a thread.
    template: "t.[[setUncaughtExceptionHandler]]((thread, e) -> log.severe(\"Thread \" + thread + \" died: \" + e));"
    code: true

  - type: choice
    id: listing-7-23
    prompt: |
      **Listing 7.23** · `runTask` throws a `RuntimeException`. What happens?
    code: |
      public void run() {
          Throwable thrown = null;
          try {
              while (!isInterrupted())
                  runTask(getTaskFromWorkQueue());
          } catch (Throwable e) {
              thrown = e;
          } finally {
              threadExited(this, thrown);
          }
      }
    language: java
    options:
      - text: "The worker exits and tells the pool via `threadExited`, which can replace it"
        correct: true
      - text: "The exception is swallowed and the worker takes the next task"
        feedback: "The catch is outside the loop, so the loop ends."
      - text: "The JVM exits"
        feedback: "An uncaught exception only ends that thread."

  - type: choice
    id: listing-7-24
    prompt: |
      **Listing 7.24** · What does this print?
    code: |
      Thread t = new Thread(() -> { throw new IllegalStateException("boom"); });
      t.setUncaughtExceptionHandler((th, e) ->
          System.out.println("caught " + e.getMessage()));
      t.start();
      t.join();
      System.out.println("main done");
    language: java
    options:
      - text: "caught boom, then main done"
        correct: true
      - text: "A stack trace, then main done"
        feedback: "The handler replaces the default stack trace printing."
      - text: "main done only"
        feedback: "The handler runs in the dying thread before `join` returns."
      - text: "The exception propagates to main"
        feedback: "Exceptions don't cross threads; `join` just waits."

  - type: choice
    id: listing-7-25
    prompt: |
      **Listing 7.25** · A task submitted with `ExecutorService.submit` throws. Does this handler see it?
    code: |
      public class UEHLogger implements Thread.UncaughtExceptionHandler {
          public void uncaughtException(Thread t, Throwable e) {
              Logger logger = Logger.getAnonymousLogger();
              logger.log(Level.SEVERE, "Thread terminated with exception: " + t.getName(), e);
          }
      }
    language: java
    options:
      - text: "No — `submit` captures it in the `Future`; `get()` rethrows it in an `ExecutionException`"
        correct: true
      - text: "Yes — every exception in a pool thread reaches the handler"
        feedback: "Only tasks run with `execute` let the exception escape the thread."
      - text: "Yes, but only for checked exceptions"
        feedback: "`submit` captures both checked and unchecked."
