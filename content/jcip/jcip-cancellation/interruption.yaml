title: Cancellation and interruption
summary: Java has no safe way to stop a thread — only cooperative cancellation, and interruption is the best mechanism for it.
duration: 6
tags: [java, concurrency, cancellation, interruption, interruption policy]
sources:
  - { book: jcip, ref: "§7.1.1–7.1.3, Task Cancellation and Interruption" }
steps:
  - type: explanation
    title: A flag works until the task blocks
    body: |
      The simplest way to cancel: a `volatile boolean cancelled`.
      The task checks it in its loop.
      But a task stuck in a blocking call never gets back to check.

  - type: predict
    prompt: A producer checks a `cancelled` flag in its loop, but spends its time blocked in `queue.put(p)` because the queue is full and the consumer has stopped. You set `cancelled = true`. What happens?
    options:
      - text: Nothing — the producer stays blocked in `put` and never gets back to the flag check
        correct: true
      - text: It notices the flag immediately
        feedback: A thread blocked in `put` isn't checking anything.
    explanation: That's why interruption is a better mechanism — blocking library methods respond to it.
    details: |
      A cancellation flag only works if the thread gets back to the code that checks it.
      The producer is stuck inside `queue.put`, waiting for space that will never appear because the consumer stopped taking.
      `put` doesn't know about your flag, so it waits forever. It does, however, respond to interruption — `interrupt()` makes it throw `InterruptedException` — which is why interruption is the right way to cancel threads that may block.

  - type: explanation
    title: Interruption reaches blocked threads
    body: |
      `t.interrupt()` sets the thread's interrupted flag.
      Blocking methods notice, and throw `InterruptedException`.
      It's a polite request to stop, not a forced kill.
      It's the best way to cancel.

  - type: match
    prompt: Match each `Thread` method to what it does.
    pairs:
      - left: "`t.interrupt()`"
        right: Sets thread t's interrupted status
      - left: "`t.isInterrupted()`"
        right: Reads thread t's status without changing it
      - left: "`Thread.interrupted()`"
        right: Reads **and clears** the current thread's status

  - type: explanation
    title: "Respect the owner's policy"
    body: |
      Your task doesn't own the pool thread it runs on.
      So never swallow an interrupt.
      Propagate it, or restore the flag.

  - type: choice
    prompt: Your task runs in a pool thread it doesn't own. It catches `InterruptedException`. What must it do?
    options:
      - text: Propagate it, or restore the status — the pool's interruption policy needs to see it
        correct: true
      - text: Swallow it and carry on — the task is the one being interrupted
        feedback: The interrupt might be for the *thread*, for instance to shut the pool down.
    explanation: Only code that implements a thread's **interruption policy** — usually its owner — may swallow an interrupt.

  - type: blank
    prompt: Loop until interrupted.
    template: "while (!Thread.currentThread().[[isInterrupted]]()) queue.put(p = p.nextProbablePrime());"
    code: true

  - type: choice
    id: listing-7-3
    prompt: |
      **Listing 7.3** · The queue is bounded and the consumer has stopped taking from it. The consumer then calls `cancel()`. What happens?
    code: |
      class BrokenPrimeProducer extends Thread {
          private final BlockingQueue<BigInteger> queue;
          private volatile boolean cancelled = false;

          BrokenPrimeProducer(BlockingQueue<BigInteger> queue) {
              this.queue = queue;
          }

          public void run() {
              try {
                  BigInteger p = BigInteger.ONE;
                  while (!cancelled)
                      queue.put(p = p.nextProbablePrime());
              } catch (InterruptedException consumed) {
              }
          }

          public void cancel() {
              cancelled = true;
          }
      }
    language: java
    options:
      - text: "The producer may never stop — it is blocked in `put()` and never rechecks `cancelled`"
        correct: true
      - text: "The producer stops at once — `cancelled` is `volatile`"
        feedback: "Visibility doesn't help a thread that is blocked and never reads the flag."
      - text: "`put()` throws `InterruptedException` and the producer exits"
        feedback: "Nothing interrupts the thread; setting a flag isn't an interrupt."

  - type: choice
    id: listing-7-4
    prompt: |
      **Listing 7.4** · What does this print?
    code: |
      Thread t = Thread.currentThread();
      t.interrupt();
      System.out.println(t.isInterrupted());
      System.out.println(Thread.interrupted());
      System.out.println(Thread.interrupted());
    language: java
    options:
      - text: "true, true, false"
        correct: true
      - text: "true, true, true"
        feedback: "The static `Thread.interrupted()` clears the status as it reads it."
      - text: "true, false, false"
        feedback: "`isInterrupted()` doesn't clear the flag, so the first `interrupted()` still sees it."
      - text: "false, true, false"
        feedback: "`interrupt()` sets the status straight away on the current thread."
    explanation: |
      `isInterrupted()` only reads the status; the static `Thread.interrupted()` reads and clears it — the only way to clear it.

  - type: choice
    id: listing-7-5
    prompt: |
      **Listing 7.5** · Another thread calls `cancel()` while the producer is blocked in `queue.put(...)` on a full queue. What happens?
    code: |
      public class PrimeProducer extends Thread {
          private final BlockingQueue<BigInteger> queue;

          PrimeProducer(BlockingQueue<BigInteger> queue) {
              this.queue = queue;
          }

          public void run() {
              try {
                  BigInteger p = BigInteger.ONE;
                  while (!Thread.currentThread().isInterrupted())
                      queue.put(p = p.nextProbablePrime());
              } catch (InterruptedException consumed) {
                  /* Allow thread to exit */
              }
          }

          public void cancel() {
              interrupt();
          }
      }
    language: java
    options:
      - text: "`put` throws `InterruptedException` and the thread exits"
        correct: true
      - text: "The producer stays blocked until the queue has room"
        feedback: "Blocking library methods like `put` respond to interruption by throwing."
      - text: "The loop checks `isInterrupted()` and exits without exceptions"
        feedback: "The thread is inside `put`, not at the loop test; `put` throws."

  - type: choice
    id: listing-7-6
    prompt: |
      **Listing 7.6** · A library method can't handle interruption itself. Which version is right?
    code: |
      // A
      BlockingQueue<Task> queue;
      public Task getNextTask() throws InterruptedException {
          return queue.take();
      }

      // B
      public Task getNextTask() {
          try {
              return queue.take();
          } catch (InterruptedException e) {
              return null;
          }
      }
    language: java
    options:
      - text: "A — propagate `InterruptedException` to the caller"
        correct: true
      - text: "B — it keeps callers free of a checked exception"
        feedback: "B swallows the interrupt: the code up the stack never learns it was asked to stop."
      - text: "Both are fine"
        feedback: "Only code that owns the thread may swallow an interrupt."

  - type: choice
    id: listing-7-7
    prompt: |
      **Listing 7.7** · The thread is interrupted while waiting in `take()`. What does `getNextTask` do?
    code: |
      public class NoncancelableTask {
          public Task getNextTask(BlockingQueue<Task> queue) {
              boolean interrupted = false;
              try {
                  while (true) {
                      try {
                          return queue.take();
                      } catch (InterruptedException e) {
                          interrupted = true;
                          // fall through and retry
                      }
                  }
              } finally {
                  if (interrupted)
                      Thread.currentThread().interrupt();
              }
          }

          interface Task {
          }
      }
    language: java
    options:
      - text: "Keeps waiting for a task, then re-sets the interrupt status before returning"
        correct: true
      - text: "Returns `null` straight away"
        feedback: "It retries `take()` until it gets a task."
      - text: "Spins at 100% CPU forever"
        feedback: "It records the interrupt and retries; the interrupt is only restored on the way out, so `take()` blocks normally."
      - text: "Loses the interrupt"
        feedback: "The `finally` block calls `interrupt()` again."
    explanation: |
      Restoring the interrupt inside the loop would make `take()` throw at once every time — a spin. So it's saved and restored at the end.
