title: Cancelling tasks
summary: Cancel through a Future, handle blocking that ignores interruption, and never interrupt threads you don't own.
duration: 6
tags: [java, concurrency, future, cancel, timeouts, non-interruptible blocking]
sources:
  - { book: jcip, ref: "§7.1.4–7.1.7, Example: Timed Run; Cancellation via Future" }
steps:
  - type: explanation
    title: Cancel through the Future
    body: |
      Don't interrupt a pool thread directly.
      It may be running some other task by then.
      Call `future.cancel(true)` instead.

  - type: explanation
    title: A timed run
    body: |
      Submit the task, then wait with a timeout.

      ```java
      Future<?> task = taskExec.submit(r);
      try { task.get(timeout, unit); }
      finally { task.cancel(true); }
      ```

      Cancelling a finished task does nothing.

  - type: choice
    prompt: What does `cancel(true)` do if the task is running?
    options:
      - text: Interrupts the thread running it — appropriate because the executor's threads use an interruption policy that permits it
        correct: true
      - text: Stops the thread immediately
        feedback: Nothing stops a thread immediately; it delivers an interrupt.
      - text: Nothing
        feedback: "`cancel(false)` does nothing to a running task; `cancel(true)` interrupts it."
    details: |
      The executor owns its worker threads, and its policy is that interrupting one means "cancel what you're running".
      So `cancel(true)` can interrupt the thread safely: the task is expected to stop, and the pool knows how to handle an interrupted worker.
      You shouldn't interrupt a thread you don't own this way, because you don't know what its interruption policy is.

  - type: explanation
    title: Some blocking ignores interrupts
    body: |
      Socket reads ignore interrupts. Close the socket instead.
      Waiting for a `synchronized` lock can't be interrupted.
      A custom `Future` can wrap the right kind of cancel.

  - type: match
    prompt: Some blocking doesn't respond to interruption. Match each to the workaround.
    pairs:
      - left: Synchronous socket I/O in `java.io`
        right: Close the socket — blocked reads and writes throw `SocketException`
      - left: Waiting for an intrinsic lock
        right: No workaround — use explicit `Lock.lockInterruptibly` instead
      - left: Interruptible NIO channels
        right: Interruption itself closes the channel and throws `ClosedByInterruptException`
      - left: "`Selector.select`"
        right: Call `wakeup` or close the selector

  - type: choice
    prompt: |
      Why does `timedRun` cancel the task in `finally`?
    code: |
      public static void timedRun(Runnable r, long timeout, TimeUnit unit)
              throws InterruptedException {
          Future<?> task = taskExec.submit(r);
          try {
              task.get(timeout, unit);
          } catch (TimeoutException e) {
              // the task is cancelled below
          } catch (ExecutionException e) {
              throw launderThrowable(e.getCause());
          } finally {
              task.cancel(true);
          }
      }
    language: java
    options:
      - text: So the task is cancelled however `get` ended — timeout or interruption — and cancelling a finished task is harmless
        correct: true
      - text: Java requires it
    explanation: Cleaning up in `finally` is a standard way to avoid leaving tasks running that nobody cares about any more.

  - type: blank
    prompt: Cancel a task, interrupting it if it's running.
    template: "task.cancel([[true]]);"
    code: true

  - type: choice
    id: listing-7-1
    prompt: |
      **Listing 7.1** · Another thread calls `cancel()`. Will the generator stop?
    code: |
      public class PrimeGenerator implements Runnable {
          @GuardedBy("this")
          private final List<BigInteger> primes = new ArrayList<>();
          private volatile boolean cancelled;

          public void run() {
              BigInteger p = BigInteger.ONE;
              while (!cancelled) {
                  p = p.nextProbablePrime();
                  synchronized (this) {
                      primes.add(p);
                  }
              }
          }

          public void cancel() { cancelled = true; }

          public synchronized List<BigInteger> get() {
              return new ArrayList<>(primes);
          }
      }
    language: java
    options:
      - text: "Yes — it sees the flag on its next loop check, because the flag is `volatile`"
        correct: true
      - text: "Maybe never — the flag isn't guarded by a lock"
        feedback: "`volatile` guarantees the write becomes visible; a lock isn't needed for a single flag."
      - text: "Yes, immediately, even in the middle of `nextProbablePrime()`"
        feedback: "Cooperative cancellation: the task only notices at its next check of the flag."

  - type: choice
    id: listing-7-2
    prompt: |
      **Listing 7.2** · `PrimeGenerator` stops when its `volatile boolean cancelled` flag is set. Why is `cancel()` in a `finally` block here?
    code: |
      static List<BigInteger> aSecondOfPrimes() throws InterruptedException {
          PrimeGenerator generator = new PrimeGenerator();
          exec.execute(generator);
          try {
              SECONDS.sleep(1);
          } finally {
              generator.cancel();
          }
          return generator.get();
      }
    language: java
    options:
      - text: "So the generator is stopped even if `sleep` is interrupted — otherwise it would run forever"
        correct: true
      - text: "It's required for `volatile` writes to be visible"
        feedback: "Visibility doesn't depend on `finally`."
      - text: "So `get()` returns an empty list on interrupt"
        feedback: "If `sleep` throws, `get()` isn't reached at all; `finally` only guarantees the cancel."

  - type: choice
    id: listing-7-8
    prompt: |
      **Listing 7.8** · `timedRun` is called from an arbitrary caller's thread. What's wrong with it?
    code: |
      public class TimedRun1 {
          private static final ScheduledExecutorService cancelExec = Executors.newScheduledThreadPool(1);

          public static void timedRun(Runnable r,
                                      long timeout, TimeUnit unit) {
              final Thread taskThread = Thread.currentThread();
              cancelExec.schedule(new Runnable() {
                  public void run() {
                      taskThread.interrupt();
                  }
              }, timeout, unit);
              r.run();
          }
      }
    language: java
    options:
      - text: "It interrupts a thread it doesn't own — possibly after `r` finished, while the caller does something else"
        correct: true
      - text: "Nothing — it's a clean way to bound `r`'s run time"
        feedback: "The scheduled interrupt can land on whatever the caller runs next."
      - text: "`r` runs in a different thread"
        feedback: "`r.run()` runs right there in the caller's thread."
    explanation: |
      And if `r` ignores interruption, `timedRun` won't return on time either.

  - type: choice
    id: listing-7-9
    prompt: |
      **Listing 7.9** · How does this version improve on scheduling an interrupt on the caller's thread?
    code: |
      public class TimedRun2 {
          private static final ScheduledExecutorService cancelExec = newScheduledThreadPool(1);

          public static void timedRun(final Runnable r,
                                      long timeout, TimeUnit unit)
                  throws InterruptedException {
              class RethrowableTask implements Runnable {
                  private volatile Throwable t;

                  public void run() {
                      try {
                          r.run();
                      } catch (Throwable t) {
                          this.t = t;
                      }
                  }

                  void rethrow() {
                      if (t != null)
                          throw launderThrowable(t);
                  }
              }

              RethrowableTask task = new RethrowableTask();
              final Thread taskThread = new Thread(task);
              taskThread.start();
              cancelExec.schedule(new Runnable() {
                  public void run() {
                      taskThread.interrupt();
                  }
              }, timeout, unit);
              taskThread.join(unit.toMillis(timeout));
              task.rethrow();
          }
      }
    language: java
    options:
      - text: "It interrupts a thread it created, and the timed `join` returns on time even if the task ignores interruption"
        correct: true
      - text: "It guarantees the task stops at the timeout"
        feedback: "It interrupts; a task that ignores interruption keeps running."
      - text: "It's flawless"
        feedback: "After `join` returns you can't tell if it timed out or the task finished."
    explanation: |
      It still relies on a timed `join`, so the caller can't distinguish a normal finish from a timeout.

  - type: choice
    id: listing-7-10
    prompt: |
      **Listing 7.10** · The task finishes normally before the timeout. What does `task.cancel(true)` in `finally` do?
    code: |
      public class TimedRun {
          private static final ExecutorService taskExec = Executors.newCachedThreadPool();

          public static void timedRun(Runnable r,
                                      long timeout, TimeUnit unit)
                  throws InterruptedException {
              Future<?> task = taskExec.submit(r);
              try {
                  task.get(timeout, unit);
              } catch (TimeoutException e) {
                  // task will be cancelled below
              } catch (ExecutionException e) {
                  // exception thrown in task; rethrow
                  throw launderThrowable(e.getCause());
              } finally {
                  // Harmless if task already completed
                  task.cancel(true); // interrupt if running
              }
          }
      }
    language: java
    options:
      - text: "Nothing — cancelling a completed task has no effect"
        correct: true
      - text: "Interrupts the pool thread now running another task"
        feedback: "`cancel` on a completed future does nothing, so it can't hit a later task."
      - text: "Throws `CancellationException`"
        feedback: "Only `get()` on a cancelled future throws that."

  - type: choice
    id: listing-7-11
    prompt: |
      **Listing 7.11** · Why override `interrupt()` here?
    code: |
      public class ReaderThread extends Thread {
          private static final int BUFSZ = 512;
          private final Socket socket;
          private final InputStream in;

          public ReaderThread(Socket socket) throws IOException {
              this.socket = socket;
              this.in = socket.getInputStream();
          }

          public void interrupt() {
              try {
                  socket.close();
              } catch (IOException ignored) {
              } finally {
                  super.interrupt();
              }
          }

          public void run() {
              try {
                  byte[] buf = new byte[BUFSZ];
                  while (true) {
                      int count = in.read(buf);
                      if (count < 0)
                          break;
                      else if (count > 0)
                          processBuffer(buf, count);
                  }
              } catch (IOException e) { /* Allow thread to exit */
              }
          }

          public void processBuffer(byte[] buf, int count) {
          }
      }
    language: java
    options:
      - text: "Socket reads ignore interruption; closing the socket makes `read` throw so the thread can exit"
        correct: true
      - text: "To stop the thread from being interrupted"
        feedback: "It still calls `super.interrupt()`."
      - text: "`InputStream.read` throws `InterruptedException` that must be caught"
        feedback: "Classic socket I/O doesn't respond to interruption at all."

  - type: choice
    id: listing-7-12
    prompt: |
      **Listing 7.12** · A `SocketUsingTask` is submitted to `CancellingExecutor`, and its `Future` is cancelled. What happens?
    code: |
      public abstract class SocketUsingTask <T> implements CancellableTask<T> {
          @GuardedBy("this") private Socket socket;

          protected synchronized void setSocket(Socket s) {
              socket = s;
          }

          public synchronized void cancel() {
              try {
                  if (socket != null)
                      socket.close();
              } catch (IOException ignored) {
              }
          }

          public RunnableFuture<T> newTask() {
              return new FutureTask<T>(this) {
                  public boolean cancel(boolean mayInterruptIfRunning) {
                      try {
                          SocketUsingTask.this.cancel();
                      } finally {
                          return super.cancel(mayInterruptIfRunning);
                      }
                  }
              };
          }
      }

      interface CancellableTask <T> extends Callable<T> {
          void cancel();

          RunnableFuture<T> newTask();
      }

      class CancellingExecutor extends ThreadPoolExecutor {
          public CancellingExecutor(int corePoolSize, int maximumPoolSize, long keepAliveTime, TimeUnit unit, BlockingQueue<Runnable> workQueue) {
              super(corePoolSize, maximumPoolSize, keepAliveTime, unit, workQueue);
          }

          public CancellingExecutor(int corePoolSize, int maximumPoolSize, long keepAliveTime, TimeUnit unit, BlockingQueue<Runnable> workQueue, ThreadFactory threadFactory) {
              super(corePoolSize, maximumPoolSize, keepAliveTime, unit, workQueue, threadFactory);
          }

          public CancellingExecutor(int corePoolSize, int maximumPoolSize, long keepAliveTime, TimeUnit unit, BlockingQueue<Runnable> workQueue, RejectedExecutionHandler handler) {
              super(corePoolSize, maximumPoolSize, keepAliveTime, unit, workQueue, handler);
          }

          public CancellingExecutor(int corePoolSize, int maximumPoolSize, long keepAliveTime, TimeUnit unit, BlockingQueue<Runnable> workQueue, ThreadFactory threadFactory, RejectedExecutionHandler handler) {
              super(corePoolSize, maximumPoolSize, keepAliveTime, unit, workQueue, threadFactory, handler);
          }

          protected <T> RunnableFuture<T> newTaskFor(Callable<T> callable) {
              if (callable instanceof CancellableTask)
                  return ((CancellableTask<T>) callable).newTask();
              else
                  return super.newTaskFor(callable);
          }
      }
    language: java
    options:
      - text: "The socket is closed and the future is cancelled, so a blocked read stops"
        correct: true
      - text: "Only the thread is interrupted; a blocked read keeps waiting"
        feedback: "`newTaskFor` returns a `FutureTask` whose `cancel` closes the socket first."
      - text: "Nothing — `cancel` is ignored for custom tasks"
        feedback: "The overridden `cancel` runs the task's own cancellation, then the standard one."
