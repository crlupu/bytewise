title: "Stopping thread-based services: in code"
summary: "More examples for stopping thread-based services, one question each."
duration: 3
tags: [java, concurrency, shutdown, poison pill, logging service, lifecycle]
sources:
  - { book: jcip, ref: "§7.2, Stopping a Thread-based Service" }
steps:
  - type: explanation
    title: "Recap: Services own their threads"
    body: |
      Whoever creates a thread owns it.
      Your app owns the service, not its threads.
      So services need methods to start and stop them.

  - type: explanation
    title: "Recap: Stopping a logger cleanly"
    body: |
      A logger queues messages; a background thread writes them.
      Stopping it means: refuse new messages.
      Finish the queued ones.
      Don't leave anyone blocked on a full queue.

  - type: choice
    id: listing-7-20
    prompt: |
      **Listing 7.20** · Why use an `AtomicBoolean` instead of a local `boolean`?
    code: |
      public class CheckForMail {
          public boolean checkMail(Set<String> hosts, long timeout, TimeUnit unit)
                  throws InterruptedException {
              ExecutorService exec = Executors.newCachedThreadPool();
              final AtomicBoolean hasNewMail = new AtomicBoolean(false);
              try {
                  for (final String host : hosts)
                      exec.execute(new Runnable() {
                          public void run() {
                              if (checkMail(host))
                                  hasNewMail.set(true);
                          }
                      });
              } finally {
                  exec.shutdown();
                  exec.awaitTermination(timeout, unit);
              }
              return hasNewMail.get();
          }

          private boolean checkMail(String host) {
              // Check for mail
              return false;
          }
      }
    language: java
    options:
      - text: "The anonymous tasks can only capture final locals, and the flag is written from several threads"
        correct: true
      - text: "`AtomicBoolean` makes `checkMail` faster"
        feedback: "It's for capture and thread-safety, not speed."
      - text: "It's not needed — a local would work"
        feedback: "A local can't be assigned from inside an inner class."
    explanation: |
      The executor's lifetime is bounded by the method: `shutdown` + `awaitTermination` in `finally`.

  - type: choice
    id: listing-7-21
    prompt: |
      **Listing 7.21** · When is a task added to `tasksCancelledAtShutdown`?
    code: |
      public class TrackingExecutor extends AbstractExecutorService {
          private final ExecutorService exec;
          private final Set<Runnable> tasksCancelledAtShutdown =
                  Collections.synchronizedSet(new HashSet<Runnable>());

          public TrackingExecutor(ExecutorService exec) {
              this.exec = exec;
          }

          public void shutdown() {
              exec.shutdown();
          }

          public List<Runnable> shutdownNow() {
              return exec.shutdownNow();
          }

          public boolean isShutdown() {
              return exec.isShutdown();
          }

          public boolean isTerminated() {
              return exec.isTerminated();
          }

          public boolean awaitTermination(long timeout, TimeUnit unit)
                  throws InterruptedException {
              return exec.awaitTermination(timeout, unit);
          }

          public List<Runnable> getCancelledTasks() {
              if (!exec.isTerminated())
                  throw new IllegalStateException(/*...*/);
              return new ArrayList<Runnable>(tasksCancelledAtShutdown);
          }

          public void execute(final Runnable runnable) {
              exec.execute(new Runnable() {
                  public void run() {
                      try {
                          runnable.run();
                      } finally {
                          if (isShutdown()
                                  && Thread.currentThread().isInterrupted())
                              tasksCancelledAtShutdown.add(runnable);
                      }
                  }
              });
          }
      }
    language: java
    options:
      - text: "When it ends while the executor is shut down and its thread is interrupted"
        correct: true
      - text: "Whenever it throws an exception"
        feedback: "The condition checks shutdown and interruption, not exceptions."
      - text: "When it was never started"
        feedback: "Never-started tasks come back from `shutdownNow()`, not this set."
    explanation: |
      There's an unavoidable race: a task that finished just as shutdown happened can be counted as cancelled — so tasks must be idempotent.

  - type: choice
    id: listing-7-22
    prompt: |
      **Listing 7.22** · Which URLs does `stop()` save for the next run?
    code: |
      public abstract class WebCrawler {
          private volatile TrackingExecutor exec;
          @GuardedBy("this") private final Set<URL> urlsToCrawl = new HashSet<URL>();

          private final ConcurrentMap<URL, Boolean> seen = new ConcurrentHashMap<URL, Boolean>();
          private static final long TIMEOUT = 500;
          private static final TimeUnit UNIT = MILLISECONDS;

          public WebCrawler(URL startUrl) {
              urlsToCrawl.add(startUrl);
          }

          public synchronized void start() {
              exec = new TrackingExecutor(Executors.newCachedThreadPool());
              for (URL url : urlsToCrawl) submitCrawlTask(url);
              urlsToCrawl.clear();
          }

          public synchronized void stop() throws InterruptedException {
              try {
                  saveUncrawled(exec.shutdownNow());
                  if (exec.awaitTermination(TIMEOUT, UNIT))
                      saveUncrawled(exec.getCancelledTasks());
              } finally {
                  exec = null;
              }
          }

          protected abstract List<URL> processPage(URL url);

          private void saveUncrawled(List<Runnable> uncrawled) {
              for (Runnable task : uncrawled)
                  urlsToCrawl.add(((CrawlTask) task).getPage());
          }

          private void submitCrawlTask(URL u) {
              exec.execute(new CrawlTask(u));
          }

          private class CrawlTask implements Runnable {
              private final URL url;

              CrawlTask(URL url) {
                  this.url = url;
              }

              private int count = 1;

              boolean alreadyCrawled() {
                  return seen.putIfAbsent(url, true) != null;
              }

              void markUncrawled() {
                  seen.remove(url);
                  System.out.printf("marking %s uncrawled%n", url);
              }

              public void run() {
                  for (URL link : processPage(url)) {
                      if (Thread.currentThread().isInterrupted())
                          return;
                      submitCrawlTask(link);
                  }
              }

              public URL getPage() {
                  return url;
              }
          }
      }
    language: java
    options:
      - text: "Tasks that never started (from `shutdownNow`) and tasks interrupted mid-run"
        correct: true
      - text: "Only tasks that never started"
        feedback: "It also adds `exec.getCancelledTasks()` once terminated."
      - text: "None — URLs are discarded on stop"
        feedback: "`saveUncrawled` puts them back into `urlsToCrawl` for `start()`."
