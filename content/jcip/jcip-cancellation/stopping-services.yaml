title: Stopping thread-based services
summary: A service that owns threads must offer lifecycle methods — and shut down without losing or hanging on work.
duration: 6
tags: [java, concurrency, shutdown, poison pill, logging service, lifecycle]
sources:
  - { book: jcip, ref: "§7.2, Stopping a Thread-based Service" }
steps:
  - type: explanation
    title: Services own their threads
    body: |
      Whoever creates a thread owns it.
      Your app owns the service, not its threads.
      So services need methods to start and stop them.

  - type: explanation
    title: Stopping a logger cleanly
    body: |
      A logger queues messages; a background thread writes them.
      Stopping it means: refuse new messages.
      Finish the queued ones.
      Don't leave anyone blocked on a full queue.

  - type: choice
    prompt: The stop method just interrupts the writer thread. What goes wrong?
    options:
      - text: Messages still in the queue are lost, and producers blocked in `put` on a full queue hang forever
        correct: true
      - text: Nothing
        feedback: Shutdown must also deal with work in flight and with producers.
    explanation: The fix is a shutdown flag plus a count of reservations, checked atomically when logging — or simply delegating to an `ExecutorService`.
    details: |
      Interrupting the writer stops it, but messages already queued are never written, and producers blocked in `put` because the queue is full stay blocked forever.
      And producers that call `log` after shutdown keep adding to a queue nobody reads.
      A correct shutdown refuses new messages, lets the writer drain what's already queued, and then stops — which is precisely what delegating to an `ExecutorService` with `shutdown()` gives you.

  - type: explanation
    title: Poison pills and shutdown
    body: |
      A poison pill is a special item that means "stop here".
      Consumers finish everything before it.
      Executors offer `shutdown()`, then `awaitTermination`, then `shutdownNow()`.

  - type: choice
    prompt: "`shutdownNow` returns the tasks that never started. What about tasks that were *running* when it was called?"
    options:
      - text: They're interrupted, and there's no general way to know which ones were — you need extra tracking if it matters
        correct: true
      - text: They're returned too
        feedback: Only never-started tasks are returned; running ones are just interrupted.
    explanation: A tracking executor can record the tasks that were cancelled mid-run, so they can be retried later.

  - type: order
    prompt: Put a clean shutdown of an `ExecutorService`-based service in order.
    items:
      - Call `shutdown()` so no new tasks are accepted
      - Call `awaitTermination` to let queued and running tasks finish within a time limit
      - If they don't finish in time, call `shutdownNow()` to interrupt them
