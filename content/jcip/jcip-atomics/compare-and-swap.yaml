title: Compare-and-swap
summary: The hardware primitive behind atomic classes — optimistic updates that retry instead of blocking.
duration: 7
tags: [java, concurrency, cas, compare-and-swap, atomic, nonblocking, optimistic concurrency]
sources:
  - { book: jcip, ref: "§15.1–15.2, Disadvantages of Locking; Hardware Support for Concurrency" }
steps:
  - type: explanation
    title: Locking is pessimistic
    body: |
      A lock assumes the worst: another thread might interfere, so keep it out. When a thread can't get the lock it's
      suspended, and resuming it costs context switches. A thread holding a lock that gets delayed — page fault,
      preemption — delays everyone waiting.

      Modern processors offer an **optimistic** alternative: **compare-and-swap** (CAS). "Set this variable to *new*,
      but only if it still holds *expected*; tell me whether it worked." If another thread got there first, nothing is
      changed and you can retry.

  - type: widget
    widget: threads
    prompt: |
      Two threads increment `count` with CAS: read, add one, then `CAS count: old → tmp`. Interleave them so that a CAS
      **fails at least once** — and check the final count.
    config:
      threads: 2
      increments: 1
      cas: true
    goal:
      count: 2
      retries: 1
    hints:
      - Let both threads read 0. Let one CAS succeed; then the other's CAS expects 0 but finds 1.
    explanation: |
      The losing thread wasn't blocked — it was told it lost, re-read and retried. No update was lost: the count is 2,
      whatever the interleaving.

  - type: blank
    prompt: Complete a CAS-based increment — retry until the swap succeeds.
    template: |
      int v;
      do {
          v = value.get();
      } while (!value.[[compareAndSet]](v, v + 1));
    code: true
    explanation: That's essentially what `incrementAndGet()` does for you.

  - type: choice
    prompt: Under heavy contention, many threads CAS the same variable and most fail. Is that worse than locking?
    options:
      - text: It can be at extreme contention, but at realistic levels atomics usually outperform locks — failed threads retry instead of being suspended
        correct: true
      - text: CAS never fails
        feedback: It fails whenever another thread changed the value first.
    explanation: JCIP's measurements found atomics scale better than locks at low and moderate contention, and locks only catch up at very high contention.

  - type: match
    prompt: Match each term to its meaning.
    pairs:
      - left: Compare-and-swap
        right: Atomically set a value only if it still equals an expected value
      - left: Optimistic concurrency
        right: Proceed hoping for no interference; detect it and retry if there was
      - left: Pessimistic concurrency
        right: Prevent interference up front, by locking
