title: Atomic variable classes
summary: AtomicInteger, AtomicReference and friends — better volatile variables, and lock-free updates to immutable holders.
duration: 5
tags: [java, concurrency, atomicinteger, atomicreference, volatile, cas]
sources:
  - { book: jcip, ref: "§15.3, Atomic Variable Classes" }
steps:
  - type: explanation
    title: Better volatiles
    body: |
      Atomic classes read and write like `volatile`.
      Plus atomic updates built on CAS.
      `AtomicInteger`, `AtomicLong`, `AtomicReference` and more.

  - type: match
    prompt: Match each `AtomicInteger` method to what it does.
    pairs:
      - left: "`incrementAndGet()`"
        right: Add one and return the new value
      - left: "`getAndIncrement()`"
        right: Add one and return the old value
      - left: "`compareAndSet(expect, update)`"
        right: Set to update only if the current value equals expect
      - left: "`updateAndGet(fn)`"
        right: Apply a function atomically, retrying on contention

  - type: explanation
    title: Atomic pairs
    body: |
      Two atomics can't keep an invariant between them.
      Put both values in one immutable object.
      Swap it with `compareAndSet` on an `AtomicReference`.

  - type: choice
    prompt: Why does the CAS-on-immutable-holder approach preserve the invariant?
    options:
      - text: Both bounds change together by swapping one reference, and the swap only succeeds if nobody changed the pair since it was read
        correct: true
      - text: "`AtomicReference` locks both fields"
        feedback: No locks are involved; it's a single CAS on a reference.
    details: |
      The invariant `lower <= upper` involves two values, so updating them as two separate atomic variables leaves a moment where one has changed and the other hasn't.
      Putting both bounds in one immutable object and holding it in a single `AtomicReference` makes the pair change in one step: a thread builds a new range, checks the invariant on it, and CASes the reference.
      If another thread changed the range in the meantime, the CAS fails and the thread retries with fresh values — no lock, and no half-updated state is ever visible.

  - type: explanation
    title: Not for map keys
    body: |
      Atomics are mutable.
      They don't override `equals` or `hashCode`.

  - type: choice
    prompt: Should atomic classes be used as keys in a `HashMap`?
    options:
      - text: No — they're mutable and don't override `equals` and `hashCode`
        correct: true
      - text: Yes, they're thread-safe
        feedback: Thread-safe doesn't make them good keys; their identity-based equality and mutability do the opposite.
