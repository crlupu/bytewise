title: Atomic variable classes
summary: AtomicInteger, AtomicReference and friends — better volatile variables, and lock-free updates to immutable holders.
duration: 5
tags: [java, concurrency, atomicinteger, atomicreference, volatile, cas]
sources:
  - { book: jcip, ref: "§15.3, Atomic Variable Classes" }
steps:
  - type: explanation
    title: Better volatiles
    body: |
      Atomic classes read and write like `volatile`.
      Plus atomic updates built on CAS.
      `AtomicInteger`, `AtomicLong`, `AtomicReference` and more.

  - type: match
    prompt: Match each `AtomicInteger` method to what it does.
    pairs:
      - left: "`incrementAndGet()`"
        right: Add one and return the new value
      - left: "`getAndIncrement()`"
        right: Add one and return the old value
      - left: "`compareAndSet(expect, update)`"
        right: Set to update only if the current value equals expect
      - left: "`updateAndGet(fn)`"
        right: Apply a function atomically, retrying on contention

  - type: explanation
    title: Atomic pairs
    body: |
      Two atomics can't keep an invariant between them.
      Put both values in one immutable object.
      Swap it with `compareAndSet` on an `AtomicReference`.

  - type: choice
    prompt: |
      `NumberRange` must keep `lower <= upper`. Why does this approach preserve the invariant?
    code: |
      private record IntPair(int lower, int upper) {}
      private final AtomicReference<IntPair> values = new AtomicReference<>(new IntPair(0, 0));

      public void setLower(int i) {
          while (true) {
              IntPair old = values.get();
              if (i > old.upper()) throw new IllegalArgumentException();
              if (values.compareAndSet(old, new IntPair(i, old.upper()))) return;
          }
      }
    language: java
    options:
      - text: Both bounds change together by swapping one reference, and the swap only succeeds if nobody changed the pair since it was read
        correct: true
      - text: "`AtomicReference` locks both fields"
        feedback: No locks are involved; it's a single CAS on a reference.
    details: |
      The invariant `lower <= upper` involves two values, so updating them as two separate atomic variables leaves a moment where one has changed and the other hasn't.
      Putting both bounds in one immutable object and holding it in a single `AtomicReference` makes the pair change in one step: a thread builds a new range, checks the invariant on it, and CASes the reference.
      If another thread changed the range in the meantime, the CAS fails and the thread retries with fresh values — no lock, and no half-updated state is ever visible.

  - type: explanation
    title: Not for map keys
    body: |
      Atomics are mutable.
      They don't override `equals` or `hashCode`.

  - type: choice
    prompt: Should atomic classes be used as keys in a `HashMap`?
    options:
      - text: No — they're mutable and don't override `equals` and `hashCode`
        correct: true
      - text: Yes, they're thread-safe
        feedback: Thread-safe doesn't make them good keys; their identity-based equality and mutability do the opposite.

  - type: choice
    id: listing-15-3
    prompt: |
      **Listing 15.3** · The range is (0, 10). One thread calls `setLower(5)` while another calls `setUpper(4)`. Can the range end up (5, 4)?
    code: |
      public class CasNumberRange {
          private static class IntPair {
              final int lower;  // lower <= upper
              final int upper;
              IntPair(int lower, int upper) { this.lower = lower; this.upper = upper; }
          }

          private final AtomicReference<IntPair> values =
                  new AtomicReference<IntPair>(new IntPair(0, 0));

          public void setLower(int i) {
              while (true) {
                  IntPair oldv = values.get();
                  if (i > oldv.upper)
                      throw new IllegalArgumentException("Can't set lower to " + i + " > upper");
                  IntPair newv = new IntPair(i, oldv.upper);
                  if (values.compareAndSet(oldv, newv))
                      return;
              }
          }

          public void setUpper(int i) {
              while (true) {
                  IntPair oldv = values.get();
                  if (i < oldv.lower)
                      throw new IllegalArgumentException("Can't set upper to " + i + " < lower");
                  IntPair newv = new IntPair(oldv.lower, i);
                  if (values.compareAndSet(oldv, newv))
                      return;
              }
          }
      }
    language: java
    options:
      - text: "No — whichever CAS loses retries against the new pair and then throws"
        correct: true
      - text: "Yes — each check passes against (0, 10)"
        feedback: "Both checks pass, but only one CAS on the old pair can succeed."
      - text: "Yes, unless the fields are volatile"
        feedback: "The pair is immutable and swapped as a whole."

  - type: choice
    id: listing-15-4
    prompt: |
      **Listing 15.4** · What does this `nextInt(n)` guarantee under contention?
    code: |
      public class ReentrantLockPseudoRandom extends PseudoRandom {
          private final Lock lock = new ReentrantLock(false);
          private int seed;

          ReentrantLockPseudoRandom(int seed) {
              this.seed = seed;
          }

          public int nextInt(int n) {
              lock.lock();
              try {
                  int s = seed;
                  seed = calculateNext(s);
                  int remainder = s % n;
                  return remainder > 0 ? remainder : remainder + n;
              } finally {
                  lock.unlock();
              }
          }
      }
    language: java
    options:
      - text: "Each seed is used once; threads take turns on the lock"
        correct: true
      - text: "Threads may get the same number"
        feedback: "The lock makes read-and-update of `seed` atomic."
      - text: "Nothing — `seed` isn't volatile"
        feedback: "Lock acquisition and release give visibility."

  - type: choice
    id: listing-15-5
    prompt: |
      **Listing 15.5** · Compared with the `ReentrantLock` version, how does this perform?
    code: |
      public class AtomicPseudoRandom extends PseudoRandom {
          private AtomicInteger seed;

          AtomicPseudoRandom(int seed) {
              this.seed = new AtomicInteger(seed);
          }

          public int nextInt(int n) {
              while (true) {
                  int s = seed.get();
                  int nextSeed = calculateNext(s);
                  if (seed.compareAndSet(s, nextSeed)) {
                      int remainder = s % n;
                      return remainder > 0 ? remainder : remainder + n;
                  }
              }
          }
      }
    language: java
    options:
      - text: "Better at low to moderate contention; under extreme contention locks can win, as CAS failures cause retries"
        correct: true
      - text: "Always worse"
        feedback: "Realistic contention favors atomics."
      - text: "Always better"
        feedback: "Under very high contention, retries thrash while a lock queues threads."
