title: Nonblocking algorithms
summary: The Treiber stack, the Michael–Scott queue, and the ABA problem.
duration: 6
tags: [java, concurrency, nonblocking, lock-free, treiber stack, aba problem, cas]
sources:
  - { book: jcip, ref: "§15.4, Nonblocking Algorithms" }
steps:
  - type: explanation
    title: No thread can block another
    body: |
      Nonblocking: one slow thread can't stop the others.
      Lock-free: some thread always makes progress.
      Treiber's stack pushes with a CAS loop:

      ```java
      do {
          oldHead = top.get();
          newHead.next = oldHead;
      } while (!top.compareAndSet(oldHead, newHead));
      ```
    diagram:
      kind: objects
      vars:
        - { name: newHead, to: n3 }
        - { name: top, to: ar }
      objects:
        - { id: n3, type: Node, fields: [{ name: item, value: "\"c\"" }, { name: next, to: n2 }] }
        - { id: ar, type: AtomicReference, fields: [{ name: value, to: n2 }] }
        - { id: n2, type: Node, fields: [{ name: item, value: "\"b\"" }, { name: next, to: n1 }] }
        - { id: n1, type: Node, fields: [{ name: item, value: "\"a\"" }, { name: next }] }
      caption: "The CAS swings top from b to c — only if top still points at b."

  - type: order
    prompt: Put one attempt to `pop` from a Treiber stack in order.
    items:
      - Read the current head into `oldHead`; return null if it's empty
      - Read `oldHead.next` into `newHead`
      - CAS the top from `oldHead` to `newHead`
      - If the CAS failed, another thread changed the top — start over
    explanation: The whole operation is a single CAS on one reference, so there's never a half-done state for others to see.

  - type: explanation
    title: Queues are harder
    body: |
      A stack changes one reference.
      A queue must change two: the last node and the tail.
      One CAS can't do both.

  - type: choice
    prompt: Why is a linked queue harder than a stack?
    options:
      - text: Adding a node updates two references — the old tail's `next` and the tail pointer — which can't be changed in one CAS
        correct: true
      - text: Queues need locks by definition
        feedback: "`ConcurrentLinkedQueue` is lock-free."
    explanation: The Michael–Scott queue handles it by letting any thread finish another thread's half-done insert, helping it along.
    details: |
      A stack changes one reference per operation — the top — so a single CAS publishes the whole change.
      Adding to a linked queue changes two: the old tail's `next` and the queue's `tail` pointer, and no CAS can update both at once.
      The Michael–Scott algorithm lets the queue sit in an intermediate state where `next` is set but `tail` lags; any thread that sees this state first helps finish the other thread's insert by advancing `tail`, then does its own work.

  - type: explanation
    title: The ABA problem
    body: |
      A value can change from A to B and back to A.
      CAS can't tell anything happened.
      Add a version number, as `AtomicStampedReference` does.

  - type: choice
    prompt: Why is ABA rarely a problem in Java's own nonblocking collections?
    options:
      - text: Garbage collection means a node can't be reused while any thread still holds a reference to it
        correct: true
      - text: Java's CAS checks the full history
        feedback: CAS only compares current values.
    explanation: In languages where nodes are freed and recycled manually, ABA is a classic source of bugs.
    details: |
      ABA happens when a thread reads value A, another thread changes it to B and back to A, and the first thread's CAS succeeds because it only sees A again — even though the structure changed.
      In C, a freed node's memory can be reused for a new node at the same address, which is how this arises in practice.
      In Java, a node can't be reused while any thread still holds a reference to it, because the garbage collector won't free it, so the classic ABA scenario can't occur for references.

  - type: blank
    prompt: A reference paired with a version counter.
    template: "AtomicStampedReference<Node> top = new [[AtomicStampedReference]]<>(null, 0);"
    code: true
