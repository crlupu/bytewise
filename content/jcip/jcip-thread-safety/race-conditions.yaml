title: Race conditions
summary: Why count++ isn't safe when two threads share it, seen one instruction at a time.
duration: 8
tags: [java, threads, concurrency, race condition, lost update]
sources:
  - { book: jcip, ref: "§2.2, Atomicity" }
steps:
  - type: explanation
    title: One line, three steps
    body: |
      Several threads share this counter:

      ```java
      class Counter {
          int count = 0;
          void increment() { count++; }
      }
      ```

      `count++` is really three steps: read, add one, write back.
      A thread can be paused between any two.

  - type: order
    prompt: Put the steps of `count++` in the order a thread performs them.
    items:
      - "Read: `tmp = count`"
      - "Add: `tmp = tmp + 1`"
      - "Write: `count = tmp`"
    explanation: Read, modify, write. Each step is atomic on its own; the sequence as a whole is not.

  - type: choice
    prompt: |
      Two threads each call `increment()` once on a shared counter that starts at 0. Which final values of `count` are possible?
    code: |
      class Counter {
          int count = 0;
          void increment() { count++; }
      }
    language: java
    options:
      - text: "0"
        feedback: Each thread writes at least once, and every write stores a value of 1 or more.
      - text: "1"
        correct: true
      - text: "2"
        correct: true
      - text: "3"
        feedback: There are only two increments in total, so the value can't exceed 2.
    hints:
      - What if both threads read `count` before either writes?
    explanation: |
      2 when the threads take turns. 1 when both read 0 before either writes — then both write 1,
      and one update is lost. Let's make that happen.
    details: |
      Each `count++` is read, add, write.
      If one thread finishes before the other starts, the second reads 1 and writes 2.
      If both read 0 before either writes, both compute 1 and both write 1: one increment is lost.
      No other result is possible from two increments of 0, so the answers are 1 or 2.

  - type: widget
    widget: threads
    prompt: |
      **Lose an update.** Run the threads one instruction at a time, in any order, so that both finish
      but `count` ends at **1**.
    config:
      threads: 2
      increments: 1
    goal:
      count: 1
    hints:
      - Let T1 read `count` first.
      - Before T1 writes, let T2 read `count` too. Both now hold 0.
    explanation: |
      Both threads read 0, both computed 1, both wrote 1. The second write overwrote the first:
      a **lost update**.
    question:
      prompt: "What had to happen for the update to be lost?"
      options:
        - text: "Both threads read `count` before either wrote it back"
          correct: true
        - text: "One thread ran completely before the other started"
          feedback: "Then the second thread reads 1 and writes 2 — nothing is lost."
        - text: "Both threads wrote at exactly the same instant"
          feedback: "Writes take turns; the problem is that both wrote a value based on the same old read."

  - type: widget
    widget: threads
    prompt: |
      **Three threads.** Each increments once, so the right answer is 3. Can you make it end at **1** —
      losing two updates?
    config:
      threads: 3
      increments: 1
    goal:
      count: 1
    hints:
      - Get all three threads to read before any of them writes.
    explanation: |
      With *n* threads you can lose up to *n − 1* updates. Real programs increment millions of times,
      so the final count can be far off — and different on every run.
    question:
      prompt: "For `count` to end at 1, what must be true of the last thread to write?"
      options:
        - text: "It read `count` as 0"
          correct: true
        - text: "It ran after the other two had finished"
          feedback: "Then it would read 2 and write 3."
        - text: "It was the first thread to start"
          feedback: "Start order doesn't matter — what matters is the value it read."

  - type: explanation
    title: Race conditions
    body: |
      When the result depends on timing, it's a race condition.
      Code that must not interleave is a critical section.
      Races are rare and hard to reproduce in tests.
      So design them out instead.

  - type: choice
    prompt: |
      Which of these make `increment()` safe for many threads?
    code: |
      class Counter {
          int count = 0;
          void increment() { count++; }
      }
    language: java
    options:
      - text: Declare the method `synchronized`
        correct: true
      - text: Use an `AtomicInteger` and call `incrementAndGet()`
        correct: true
      - text: Declare `count` as `volatile`
        feedback: |
          `volatile` makes each read and write visible to other threads, but the read-add-write is
          still three separate steps. Two threads can still read the same value.
      - text: Run the program on a single-core machine
        feedback: The scheduler can still pause a thread between the read and the write, and switch to another.
    explanation: |
      Both fixes make the three steps behave as one: `synchronized` with a lock, `AtomicInteger` with
      a single hardware compare-and-swap.

  - type: match
    prompt: Match each term to its meaning.
    pairs:
      - left: Race condition
        right: The result depends on the timing of threads
      - left: Atomic
        right: Happens all at once; no other thread sees it half-done
      - left: Critical section
        right: Code that must not run in two threads at the same time
      - left: Lost update
        right: One thread's write silently overwrites another's

  - type: blank
    prompt: Complete the sentence.
    template: "`count++` is a read-[[modify]]-write sequence, so it is not [[atomic]]."
    hints:
      - The middle step changes the value.

  - type: explanation
    title: Check-then-act races too
    body: |
      "If it's null, create it" is two steps.
      Two threads can both see `null`.
      Then both create an object.

  - type: choice
    prompt: Two threads call `getInstance()` at the same moment on an object that's not yet created. What can happen?
    code: |
      public class LazyInitRace {
          private ExpensiveObject instance = null;
          public ExpensiveObject getInstance() {
              if (instance == null)
                  instance = new ExpensiveObject();
              return instance;
          }
      }
    language: java
    options:
      - text: Both see `null`, both create an object, and the callers end up with two different instances
        correct: true
      - text: Nothing — the second thread always sees the first one's object
        feedback: Nothing makes the check and the assignment one step.
    explanation: |
      That's **check-then-act**, the other common race: you observe something (it's null), then act on it — but the
      observation may be stale by the time you act.
    details: |
      Both threads check `instance == null` before either assigns, so both create an `ExpensiveObject`.
      Each caller gets a different object, which matters when it's meant to be a singleton — a registry, a cache, a connection.
      This is check-then-act: the decision is based on an observation that may be out of date by the time you act. Synchronizing the method makes check and act atomic.
