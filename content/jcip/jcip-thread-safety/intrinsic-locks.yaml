title: Intrinsic locks
summary: How an intrinsic lock turns read-add-write into one step, and what it does and doesn't protect.
duration: 8
tags: [java, threads, synchronized, locks, monitor, atomic]
sources:
  - { book: jcip, ref: "§2.3, Locking" }
steps:
  - type: explanation
    title: Every object has a lock
    body: |
      `synchronized` takes the object's built-in lock.

      ```java
      synchronized void increment() { count++; }
      ```

      Only one thread can hold it at a time.
      Others block until it's released.

  - type: widget
    widget: threads
    prompt: |
      Same two threads, now with `synchronized`. **Try to lose an update** — then run both threads to the end.
    config:
      threads: 2
      increments: 1
      synchronized: true
    goal:
      count: 2
    question:
      prompt: What happens when one thread reaches *acquire lock* while the other holds it?
      options:
        - text: It waits until the lock is released
          correct: true
        - text: It skips the lock and carries on
          feedback: Then the lock wouldn't protect anything.
        - text: It throws an exception
          feedback: Contention for a lock is normal; the thread just blocks.
    hints:
      - Run T1 until it holds the lock, then try T2.
    explanation: |
      While T1 holds the lock, T2 can't start its read. By the time T2 reads, T1 has written —
      so no interleaving can lose an update.

  - type: choice
    prompt: In an instance method declared `synchronized`, which lock does the thread take?
    options:
      - text: The lock of `this` — the object the method was called on
        correct: true
      - text: A lock belonging to the method itself
        feedback: Methods don't have locks; objects do.
      - text: The lock of the class
        feedback: That's what a `static synchronized` method takes.
      - text: One global lock shared by all synchronized code
        feedback: There is no global lock — that would make every program single-threaded.

  - type: explanation
    title: The lock belongs to the object
    body: |
      Two different objects have two different locks.
      Threads using them don't block each other.
      Shared static data needs a shared lock, like `Counter.class`.

  - type: choice
    prompt: |
      An `Account` has `synchronized void withdraw(int amt) { if (balance >= amt) balance -= amt; }`
      and a balance of 100. Two threads call `withdraw(80)` on it at the same moment. What's the final balance?
    options:
      - text: "20"
        correct: true
      - text: "−60"
        feedback: |
          That needs both threads to pass the `balance >= amt` check before either subtracts. The lock makes
          check and subtract one step, so the second thread sees 20 and does nothing.
      - text: Either 20 or −60, depending on timing
        feedback: Without `synchronized` that would be right — it's a check-then-act race. The lock removes it.
    explanation: |
      **Check-then-act** is another classic race. Holding the lock across both the check and the act
      makes them atomic together.
    details: |
      Because `withdraw` is synchronized, the check and the subtraction happen together under the lock.
      The first thread checks 100 >= 80, withdraws, and leaves 20; the second then checks 20 >= 80, which fails, so nothing happens.
      Without the lock, both could check 100 before either subtracts, leaving -60.

  - type: explanation
    title: Atomics need no lock
    body: |
      `AtomicInteger.incrementAndGet()` updates one value safely.
      It uses the CPU's compare-and-swap instruction.
      Use locks when several fields must change together.

  - type: blank
    prompt: Complete the sentence.
    template: "A thread that leaves a synchronized block [[releases]] the lock — even if it leaves by throwing an [[exception]]."
    hints:
      - The opposite of acquiring.
    explanation: Java releases intrinsic locks on every exit path, so an exception can't leave a lock held.

  - type: match
    prompt: Match each tool to when it fits best.
    pairs:
      - left: "`AtomicInteger`"
        right: One counter, updated very often
      - left: "`synchronized` method"
        right: Several fields of one object that must change together
      - left: "`synchronized (Counter.class)`"
        right: A static field shared by every instance
      - left: "`volatile`"
        right: A flag one thread sets and others only read

  - type: predict
    prompt: A subclass overrides a `synchronized` method and calls the superclass version. What happens?
    code: |
      public class Widget {
          public synchronized void doSomething() { ... }
      }
      public class LoggingWidget extends Widget {
          @Override public synchronized void doSomething() {
              System.out.println(toString() + ": calling doSomething");
              super.doSomething();
          }
      }
    language: java
    options:
      - text: It works — intrinsic locks are reentrant, so a thread can take a lock it already holds
        correct: true
      - text: It deadlocks — the thread waits for a lock it already holds
        feedback: That would happen if Java's locks weren't reentrant. They count acquisitions per owning thread instead.
    explanation: |
      **Reentrancy** means locks are acquired per thread, not per call. The JVM keeps an owner and a count; the lock is
      released when the count returns to zero.
    details: |
      Calling `super.doSomething()` from the subclass's synchronized method needs the same lock — `this` — that the thread already holds.
      Intrinsic locks are reentrant: the JVM records the owning thread and a count, so the owner can acquire the lock again and it's released only when the count returns to zero.
      Without reentrancy, this ordinary pattern would deadlock against itself.
