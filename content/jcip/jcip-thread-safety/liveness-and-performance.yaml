title: Liveness and performance of locking
summary: Synchronizing a whole method serialises everyone — narrow the lock to what must be atomic, and never hold it during slow work.
duration: 5
tags: [java, concurrency, synchronized, performance, liveness, lock scope]
sources:
  - { book: jcip, ref: "§2.5, Liveness and Performance" }
steps:
  - type: explanation
    title: Too much locking is slow
    body: |
      Locking the whole request handler is correct.
      But then only one request runs at a time.
      Every other core sits idle.

  - type: explanation
    title: Lock only shared state
    body: |
      Take the lock just to read or update shared data.
      Do the slow work without it.
      But don't split locks so finely that overhead dominates.

  - type: order
    prompt: |
      A servlet factors numbers and caches the last number and its factors. Locking the whole method makes requests queue up behind each other. Put the narrow-locking version in order.
    items:
      - Read the request's number (no lock needed — a local variable)
      - In a short synchronized block, check the cache and copy the cached factors if they match
      - If there was no hit, factor the number with no lock held — the slow part
      - In a second short synchronized block, store the new number and factors in the cache
    explanation: Only the parts that touch shared state are synchronized; the expensive computation runs in parallel.

  - type: choice
    prompt: How small should synchronized blocks be?
    options:
      - text: Small enough not to hold the lock during long work, but not so fragmented that the overhead of acquiring locks dominates
        correct: true
      - text: As small as possible — one statement each
        feedback: Splitting atomic operations breaks correctness, and too many tiny blocks add overhead.
      - text: As large as possible, for safety
        feedback: Safe, but it can destroy concurrency.
    explanation: Simplicity, safety and performance pull in different directions; resist sacrificing simplicity prematurely.

  - type: explanation
    title: Never wait while holding a lock
    body: |
      Don't hold a lock during I/O or long computations.
      If that call hangs, every thread needing the lock hangs too.

  - type: blank
    prompt: Complete the rule.
    template: "Avoid holding locks during lengthy computations or operations at risk of not completing quickly, such as network or console [[I/O|IO|io]]."

  - type: choice
    prompt: A thread holds a lock while waiting for a reply from a remote service, which never comes. What else stops?
    options:
      - text: Every other thread that needs the same lock — a liveness failure spreading from one slow call
        correct: true
      - text: Nothing — only the waiting thread is affected
        feedback: Every thread queued on that lock waits too.

  - type: choice
    id: listing-2-6
    prompt: |
      **Listing 2.6** · Is this servlet thread-safe, and how does it behave under load?
    code: |
      public class SynchronizedFactorizer extends GenericServlet implements Servlet {
          @GuardedBy("this") private BigInteger lastNumber;
          @GuardedBy("this") private BigInteger[] lastFactors;

          public synchronized void service(ServletRequest req,
                                           ServletResponse resp) {
              BigInteger i = extractFromRequest(req);
              if (i.equals(lastNumber))
                  encodeIntoResponse(resp, lastFactors);
              else {
                  BigInteger[] factors = factor(i);
                  lastNumber = i;
                  lastFactors = factors;
                  encodeIntoResponse(resp, factors);
              }
          }
      }
    language: java
    options:
      - text: "It's thread-safe"
        correct: true
      - text: "Only one request is served at a time, even while factoring"
        correct: true
      - text: "It can return mismatched factors"
        feedback: "Every access to the cache is under the same lock."
      - text: "It can deadlock"
        feedback: "There's only one lock."

  - type: choice
    id: listing-2-8
    prompt: |
      **Listing 2.8** · Many requests call `service` at once. What's true?
    code: |
      public class CachedFactorizer extends GenericServlet implements Servlet {
          @GuardedBy("this") private BigInteger lastNumber;
          @GuardedBy("this") private BigInteger[] lastFactors;
          @GuardedBy("this") private long hits;
          @GuardedBy("this") private long cacheHits;

          public synchronized long getHits() {
              return hits;
          }

          public synchronized double getCacheHitRatio() {
              return (double) cacheHits / (double) hits;
          }

          public void service(ServletRequest req, ServletResponse resp) {
              BigInteger i = extractFromRequest(req);
              BigInteger[] factors = null;
              synchronized (this) {
                  ++hits;
                  if (i.equals(lastNumber)) {
                      ++cacheHits;
                      factors = lastFactors.clone();
                  }
              }
              if (factors == null) {
                  factors = factor(i);
                  synchronized (this) {
                      lastNumber = i;
                      lastFactors = factors.clone();
                  }
              }
              encodeIntoResponse(resp, factors);
          }
      }
    language: java
    options:
      - text: "It's thread-safe"
        correct: true
      - text: "Requests can factor different numbers at the same time"
        correct: true
      - text: "`hits` can lose increments"
        feedback: "`++hits` happens inside `synchronized (this)`."
      - text: "A request can get another number's factors"
        feedback: "The check of `lastNumber` and the copy of `lastFactors` happen under one lock, and so does the update."
    explanation: |
      Only the short reads and writes of shared state are locked; the slow `factor` call runs with no lock held.
