title: Avoiding and diagnosing deadlocks
summary: Fewer locks held at once, timed tryLock with back-off, and thread dumps when it happens anyway.
duration: 6
tags: [java, concurrency, deadlock, trylock, timeouts, thread dumps]
sources:
  - { book: jcip, ref: "§10.2, Avoiding and Diagnosing Deadlocks" }
steps:
  - type: explanation
    title: Design lock order in
    body: |
      Code that takes one lock at a time can't lock-order deadlock.
      Where you need several, keep those places few.
      Make them all use one order.

  - type: explanation
    title: Back off with tryLock
    body: |
      `tryLock` gives up instead of waiting forever.
      Release what you hold, then retry after a random delay.

  - type: widget
    widget: locks
    prompt: |
      Both threads take their first lock, then **try** the second. If it's taken, `trylock` releases everything the
      thread holds and starts over. Run both to completion — even if you first steer them into a collision.
    config:
      threads:
        - { name: T1, ops: [lock L, trylock R, transfer, unlock R, unlock L] }
        - { name: T2, ops: [lock R, trylock L, transfer, unlock L, unlock R] }
    goal:
      finished: true
    hints:
      - If both try at once, both back off. Then let one thread get ahead before the other starts again.
    explanation: Back-off turns a permanent deadlock into a temporary delay — at the risk of livelock if both keep retrying in step.
    question:
      prompt: "When a thread's `trylock` fails, what happens?"
      options:
        - text: "It releases the lock it holds and starts over, so the other thread can finish"
          correct: true
        - text: "It waits for the lock forever"
          feedback: "That's what plain `lock` does — and why it can deadlock."
        - text: "It throws an exception and stops"
          feedback: "It backs off and retries; both threads still finish."

  - type: explanation
    title: Diagnose with thread dumps
    body: |
      A thread dump shows every thread's stack and locks.
      It reports deadlock cycles.
      Use `jstack` or `jcmd <pid> Thread.print`.

  - type: choice
    prompt: How do you find out which threads are deadlocked in a running JVM?
    options:
      - text: Take a thread dump (`jstack`, `jcmd <pid> Thread.print` or Ctrl-\ / Ctrl-Break) — it shows each thread's stack, the locks it holds and the lock it's waiting for, and reports deadlock cycles
        correct: true
      - text: Restart the JVM with more memory
        feedback: Deadlocked threads don't need memory; they need different lock ordering.

  - type: choice
    prompt: Why do thread dumps show less for `ReentrantLock`s than for intrinsic locks in older JVMs?
    options:
      - text: Explicit locks were implemented in library code, so early JVMs couldn't associate them with stack frames
        correct: true
      - text: Explicit locks can't deadlock
        feedback: They can, just as intrinsic locks can.

  - type: blank
    prompt: Try a lock, giving up after a timeout.
    template: "if (lock.[[tryLock]](1, TimeUnit.SECONDS)) { try { ... } finally { lock.unlock(); } }"
    code: true

  - type: choice
    id: listing-10-3
    prompt: |
      **Listing 10.3** · `transferMoney` locks both accounts, picking the order by `System.identityHashCode`. Why is there a third branch with `tieLock`?
    code: |
      int fromHash = System.identityHashCode(fromAcct);
      int toHash = System.identityHashCode(toAcct);

      if (fromHash < toHash) {
          synchronized (fromAcct) {
              synchronized (toAcct) { new Helper().transfer(); }
          }
      } else if (fromHash > toHash) {
          synchronized (toAcct) {
              synchronized (fromAcct) { new Helper().transfer(); }
          }
      } else {
          synchronized (tieLock) {
              synchronized (fromAcct) {
                  synchronized (toAcct) { new Helper().transfer(); }
              }
          }
      }
    language: java
    options:
      - text: "Two different objects can have the same identity hash; the tie lock makes such pairs take turns"
        correct: true
      - text: "For transfers from an account to itself"
        feedback: "Locks are reentrant, so that case is fine either way; the issue is two distinct accounts with equal hashes."
      - text: "To make transfers faster"
        feedback: "It serializes tied transfers; it's rare enough not to matter."
    explanation: |
      If accounts have a unique, comparable key such as an account number, ordering by it avoids the tie lock altogether.

  - type: choice
    id: listing-10-7
    prompt: |
      **Listing 10.7** · What does this thread dump excerpt show?
    code: |
      "Thread-1":
        waiting to lock monitor 0x080f0cdc (a MumbleDBConnection),
        which is held by "Thread-0"
      "Thread-0":
        waiting to lock monitor 0x080f0ed4 (a MumbleDBCallableStatement),
        which is held by "Thread-1"
    language: java
    options:
      - text: "A deadlock: each thread holds the lock the other is waiting for"
        correct: true
      - text: "Lock contention that will resolve once Thread-0 finishes"
        feedback: "Thread-0 can't finish — it's waiting on Thread-1."
      - text: "A livelock"
        feedback: "Livelocked threads keep running; these are blocked."
    explanation: |
      The JVM finds such cycles itself; `jstack` prints "Found one Java-level deadlock".
