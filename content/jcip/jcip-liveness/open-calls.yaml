title: Deadlocks between cooperating objects
summary: Calling an alien method while holding a lock can hide a lock-ordering deadlock across classes — use open calls.
duration: 6
tags: [java, concurrency, deadlock, open calls, alien methods, resource deadlock]
sources:
  - { book: jcip, ref: "§10.1.3–10.1.5, Deadlocks Between Cooperating Objects; Open Calls; Resource Deadlocks" }
steps:
  - type: explanation
    title: Hidden second locks
    body: |
      Each method takes one lock, then calls the other object:

      ```java
      class Taxi {
          synchronized void setLocation(Point loc) {
              this.location = loc;
              if (loc.equals(destination)) dispatcher.notifyAvailable(this);
          }
      }
      class Dispatcher {
          synchronized Image getImage() {
              for (Taxi t : taxis) image.drawMarker(t.getLocation());
          }
      }
      ```

  - type: widget
    widget: locks
    prompt: |
      A GPS update calls `setLocation` (Taxi lock **T**, then Dispatcher lock **D**). At the same time, the UI calls
      `getImage` (D, then T). **Find the deadlock.**
    config:
      threads:
        - { name: GPS, ops: [lock T, update location, lock D, notifyAvailable, unlock D, unlock T] }
        - { name: UI, ops: [lock D, start image, lock T, getLocation, unlock T, unlock D] }
    goal:
      deadlock: true
    explanation: The same lock-ordering deadlock — but spread across two classes, so neither class's author could see it.
    question:
      prompt: "Which waits form the deadlock?"
      options:
        - text: "GPS holds T and wants D; UI holds D and wants T"
          correct: true
        - text: "Both threads want T while holding nothing"
          feedback: "Then one would get T and carry on."
        - text: "GPS holds both locks and UI waits"
          feedback: "Then GPS would finish and release them."

  - type: explanation
    title: Call out without locks
    body: |
      An open call is a call made with no locks held.
      Update your state inside the lock.
      Call other objects after releasing it.

  - type: widget
    widget: locks
    prompt: With **open calls**, each method releases its own lock before calling the other object. Run both threads to completion.
    config:
      threads:
        - { name: GPS, ops: [lock T, update location, unlock T, lock D, notifyAvailable, unlock D] }
        - { name: UI, ops: [lock D, copy taxi list, unlock D, lock T, getLocation, unlock T] }
    goal:
      finished: true
    explanation: No thread ever holds two locks at once, so no cycle of waiting can form.
    question:
      prompt: "What removed the deadlock?"
      options:
        - text: "Neither thread holds its own lock while it asks for the other one"
          correct: true
        - text: "The locks are now taken in alphabetical order"
          feedback: "GPS still takes T first and UI takes D first — they just release before taking the next."
        - text: "There's only one lock now"
          feedback: "Both locks are still there."

  - type: explanation
    title: Resources deadlock too
    body: |
      Pools of connections can deadlock like locks.
      Two threads, two pools, opposite orders.

  - type: choice
    prompt: Two threads each need connections from two different database pools of size 1, and take them in opposite orders. What can happen?
    options:
      - text: A **resource deadlock** — the same cycle of waiting, on pooled resources instead of locks
        correct: true
      - text: Nothing — pools aren't locks
        feedback: Anything a thread can wait for can take part in a deadlock.
    explanation: Thread starvation deadlock in thread pools is another kind of resource deadlock.
    details: |
      Deadlock isn't only about locks: any resource that threads hold while waiting for another can form a cycle.
      Thread 1 holds the only connection of pool A and waits for pool B; thread 2 holds pool B's only connection and waits for pool A.
      Larger pools make it rarer but not impossible. The cure is the same as for locks — acquire resources in a consistent order, or don't hold one while waiting for another.

  - type: blank
    prompt: Complete the rule.
    template: "Strive to use [[open]] calls throughout your program — calling alien methods with no locks held."

  - type: choice
    id: listing-10-5
    prompt: |
      **Listing 10.5** · One thread calls `taxi.setLocation(dest)` (reaching its destination) while another calls `dispatcher.getImage()`. What can happen?
    code: |
      public class CooperatingDeadlock {
          class Taxi {
              @GuardedBy("this") private Point location, destination;
              private final Dispatcher dispatcher;

              public Taxi(Dispatcher dispatcher) {
                  this.dispatcher = dispatcher;
              }

              public synchronized Point getLocation() {
                  return location;
              }

              public synchronized void setLocation(Point location) {
                  this.location = location;
                  if (location.equals(destination))
                      dispatcher.notifyAvailable(this);
              }

              public synchronized Point getDestination() {
                  return destination;
              }

              public synchronized void setDestination(Point destination) {
                  this.destination = destination;
              }
          }

          class Dispatcher {
              @GuardedBy("this") private final Set<Taxi> taxis;
              @GuardedBy("this") private final Set<Taxi> availableTaxis;

              public Dispatcher() {
                  taxis = new HashSet<Taxi>();
                  availableTaxis = new HashSet<Taxi>();
              }

              public synchronized void notifyAvailable(Taxi taxi) {
                  availableTaxis.add(taxi);
              }

              public synchronized Image getImage() {
                  Image image = new Image();
                  for (Taxi t : taxis)
                      image.drawMarker(t.getLocation());
                  return image;
              }
          }

          class Image {
              public void drawMarker(Point p) {
              }
          }
      }
    language: java
    options:
      - text: "Deadlock — setLocation holds the taxi and wants the dispatcher; getImage holds the dispatcher and wants the taxi"
        correct: true
      - text: "Nothing — no method takes two locks explicitly"
        feedback: "Calling a synchronized method while holding a lock acquires a second lock."
      - text: "`ConcurrentModificationException` in `getImage`"
        feedback: "`taxis` is guarded by the dispatcher's lock."

  - type: choice
    id: listing-10-6
    prompt: |
      **Listing 10.6** · Can these two methods still deadlock with each other?
    code: |
      // Taxi
      public void setLocation(Point location) {
          boolean reachedDestination;
          synchronized (this) {
              this.location = location;
              reachedDestination = location.equals(destination);
          }
          if (reachedDestination)
              dispatcher.notifyAvailable(this);
      }

      // Dispatcher
      public Image getImage() {
          Set<Taxi> copy;
          synchronized (this) {
              copy = new HashSet<Taxi>(taxis);
          }
          Image image = new Image();
          for (Taxi t : copy)
              image.drawMarker(t.getLocation());
          return image;
      }
    language: java
    options:
      - text: "No — each calls the other object with no lock held (open calls)"
        correct: true
      - text: "Yes — they still take both locks"
        feedback: "Never at the same time: each lock is released before the outside call."
    explanation: |
      The price: `getImage` is no longer an atomic snapshot of all taxis.
