title: Deadlocks between cooperating objects
summary: Calling an alien method while holding a lock can hide a lock-ordering deadlock across classes — use open calls.
duration: 6
tags: [java, concurrency, deadlock, open calls, alien methods, resource deadlock]
sources:
  - { book: jcip, ref: "§10.1.3–10.1.5, Deadlocks Between Cooperating Objects; Open Calls; Resource Deadlocks" }
steps:
  - type: explanation
    title: Hidden second locks
    body: |
      Each method takes one lock, then calls the other object:

      ```java
      class Taxi {
          synchronized void setLocation(Point loc) {
              this.location = loc;
              if (loc.equals(destination)) dispatcher.notifyAvailable(this);
          }
      }
      class Dispatcher {
          synchronized Image getImage() {
              for (Taxi t : taxis) image.drawMarker(t.getLocation());
          }
      }
      ```

  - type: widget
    widget: locks
    prompt: |
      A GPS update calls `setLocation` (Taxi lock **T**, then Dispatcher lock **D**). At the same time, the UI calls
      `getImage` (D, then T). **Find the deadlock.**
    config:
      threads:
        - { name: GPS, ops: [lock T, update location, lock D, notifyAvailable, unlock D, unlock T] }
        - { name: UI, ops: [lock D, start image, lock T, getLocation, unlock T, unlock D] }
    goal:
      deadlock: true
    explanation: The same lock-ordering deadlock — but spread across two classes, so neither class's author could see it.

  - type: explanation
    title: Call out without locks
    body: |
      An open call is a call made with no locks held.
      Update your state inside the lock.
      Call other objects after releasing it.

  - type: widget
    widget: locks
    prompt: With **open calls**, each method releases its own lock before calling the other object. Run both threads to completion.
    config:
      threads:
        - { name: GPS, ops: [lock T, update location, unlock T, lock D, notifyAvailable, unlock D] }
        - { name: UI, ops: [lock D, copy taxi list, unlock D, lock T, getLocation, unlock T] }
    goal:
      finished: true
    explanation: No thread ever holds two locks at once, so no cycle of waiting can form.

  - type: explanation
    title: Resources deadlock too
    body: |
      Pools of connections can deadlock like locks.
      Two threads, two pools, opposite orders.

  - type: choice
    prompt: Two threads each need connections from two different database pools of size 1, and take them in opposite orders. What can happen?
    options:
      - text: A **resource deadlock** — the same cycle of waiting, on pooled resources instead of locks
        correct: true
      - text: Nothing — pools aren't locks
        feedback: Anything a thread can wait for can take part in a deadlock.
    explanation: Thread starvation deadlock in thread pools is another kind of resource deadlock.
    details: |
      Deadlock isn't only about locks: any resource that threads hold while waiting for another can form a cycle.
      Thread 1 holds the only connection of pool A and waits for pool B; thread 2 holds pool B's only connection and waits for pool A.
      Larger pools make it rarer but not impossible. The cure is the same as for locks — acquire resources in a consistent order, or don't hold one while waiting for another.

  - type: blank
    prompt: Complete the rule.
    template: "Strive to use [[open]] calls throughout your program — calling alien methods with no locks held."
