title: Starvation, poor responsiveness and livelock
summary: Threads can fail to make progress without deadlocking — never running, running too slowly, or busily getting nowhere.
duration: 5
tags: [java, concurrency, liveness, starvation, livelock, thread priorities]
sources:
  - { book: jcip, ref: "§10.3, Other Liveness Hazards" }
steps:
  - type: explanation
    title: Four liveness hazards
    body: |
      Deadlock: threads wait for each other forever.
      Starvation: a thread never gets what it needs.
      Poor responsiveness: users wait too long.
      Livelock: threads stay busy but make no progress.

  - type: match
    prompt: Match each liveness hazard to its description.
    pairs:
      - left: Deadlock
        right: Threads wait for each other forever, holding what the others need
      - left: Starvation
        right: A thread is perpetually denied a resource it needs — like CPU time
      - left: Poor responsiveness
        right: Things work, but users wait — long tasks compete with the UI thread
      - left: Livelock
        right: Threads aren't blocked, but keep repeating an operation that always fails

  - type: explanation
    title: "Priorities don't fix starvation"
    body: |
      Thread priorities behave differently on each system.
      Changing them usually causes new problems.

  - type: choice
    prompt: Is raising a thread's priority a good way to fix starvation?
    options:
      - text: No — priorities map to OS priorities differently on each platform; tweaking them usually causes more problems than it solves
        correct: true
      - text: Yes, it's the standard fix
    explanation: "Avoid the temptation to use thread priorities, since they increase platform dependence and can cause liveness problems."

  - type: explanation
    title: Livelock
    body: |
      A message that always fails gets retried forever.
      Polite threads keep stepping aside for each other.
      Random retry delays break the cycle.

  - type: choice
    prompt: Two threads with `tryLock` back-off keep retrying in exact lockstep, colliding every time. What's the remedy?
    options:
      - text: Introduce randomness into the retry delay, so they fall out of step
        correct: true
      - text: Retry immediately, faster
        feedback: That keeps them perfectly in step.
    explanation: Ethernet uses the same idea — randomised exponential back-off after collisions.
    details: |
      Both threads detect the conflict at the same moment, back off for the same time, and try again in step — so they collide again, forever.
      Neither is blocked, so it's livelock rather than deadlock.
      A random component in the wait breaks the symmetry: one thread retries a little earlier, gets through, and the other then succeeds.

  - type: blank
    prompt: Complete the definition.
    template: "Livelock is a failure of liveness where a thread, while not [[blocked]], still cannot make progress because it keeps retrying an operation that will always fail."
