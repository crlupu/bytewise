title: Lock-ordering deadlocks
summary: Two threads taking the same locks in different orders can wait for each other forever — find it, then fix it.
duration: 7
tags: [java, concurrency, deadlock, lock ordering, liveness]
sources:
  - { book: jcip, ref: "§10.1.1–10.1.2, Lock-ordering Deadlocks; Dynamic Lock Order Deadlocks" }
steps:
  - type: explanation
    title: The deadly embrace
    body: |
      ```java
      public class LeftRightDeadlock {
          private final Object left = new Object();
          private final Object right = new Object();

          public void leftRight() {
              synchronized (left) { synchronized (right) { doSomething(); } }
          }
          public void rightLeft() {
              synchronized (right) { synchronized (left) { doSomethingElse(); } }
          }
      }
      ```

      Each method is fine on its own. Called concurrently, they can **deadlock**: each thread holds one lock and waits
      forever for the other.

  - type: widget
    widget: locks
    prompt: |
      Thread 1 runs `leftRight`; thread 2 runs `rightLeft`. Locks **L** and **R** stand for `left` and `right`.
      **Make them deadlock.**
    config:
      threads:
        - { name: T1, ops: [lock L, lock R, doSomething, unlock R, unlock L] }
        - { name: T2, ops: [lock R, lock L, doSomethingElse, unlock L, unlock R] }
    goal:
      deadlock: true
    hints:
      - Let each thread take its first lock before either takes its second.
    explanation: T1 holds L and wants R; T2 holds R and wants L. Neither can ever proceed.

  - type: widget
    widget: locks
    prompt: |
      The fix: **every thread acquires the locks in the same order**. Both methods now take L, then R.
      Try to deadlock them — then run both to completion.
    config:
      threads:
        - { name: T1, ops: [lock L, lock R, doSomething, unlock R, unlock L] }
        - { name: T2, ops: [lock L, lock R, doSomethingElse, unlock R, unlock L] }
    goal:
      finished: true
    explanation: With a global lock order, whoever gets L first also gets R; the other waits for L without holding anything.

  - type: explanation
    title: Dynamic lock order
    body: |
      Sometimes the order depends on the arguments:

      ```java
      public void transferMoney(Account from, Account to, DollarAmount amount) {
          synchronized (from) {
              synchronized (to) { ... }
          }
      }
      ```

      `transferMoney(a, b, 10)` and `transferMoney(b, a, 20)` at the same time take the same two locks in opposite
      orders — the same deadlock, hidden behind parameters.

  - type: choice
    prompt: How can `transferMoney` impose a consistent order?
    options:
      - text: Order the two locks by some unique key — such as account number, or `System.identityHashCode` with a tie-breaking lock
        correct: true
      - text: Always lock `from` first
        feedback: That's exactly the bug — `from` in one call is `to` in the other.
      - text: Use `volatile` balances instead
        feedback: That removes atomicity of the transfer, not the deadlock risk.

  - type: blank
    prompt: Complete the rule.
    template: "A program will be free of lock-ordering deadlocks if all threads acquire the locks they need in a fixed global [[order]]."
