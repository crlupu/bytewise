title: Finding exploitable parallelism
summary: Callable and Future for results, CompletionService for results as they arrive, time limits for budgets.
duration: 6
tags: [java, concurrency, callable, future, completionservice, invokeall, timeouts]
sources:
  - { book: jcip, ref: "§6.3, Finding Exploitable Parallelism" }
steps:
  - type: explanation
    title: Callable returns a result
    body: |
      A `Callable` returns a value and can throw.
      Submitting one gives you a `Future`.
      `get()` waits for the result only when you need it.
    diagram:
      classes:
        - { name: Future<V>, kind: interface, methods: ["get()", "get(timeout)", "cancel(b)"] }
        - { name: Runnable, kind: interface, methods: ["run()"] }
        - { name: FutureTask<V> }
        - { name: Callable<V>, kind: interface, methods: ["call()"] }
      relations:
        - { from: FutureTask<V>, to: Future<V>, type: implements }
        - { from: FutureTask<V>, to: Runnable, type: implements }
        - { from: FutureTask<V>, to: Callable<V>, type: has, label: task }
      caption: "A pool thread calls run(); your thread waits in get()."

  - type: explanation
    title: Parallelism needs balanced tasks
    body: |
      Two tasks of 1 s and 10 s gain little in parallel.
      Split the work into many similar tasks instead.
      A `CompletionService` hands back results as each finishes.

  - type: choice
    prompt: Rendering text takes 1 s; downloading all images takes 10 s. How much does the background download save?
    options:
      - text: About 1 s — the tasks are very unequal, so running them in parallel gains little
        correct: true
      - text: About 10 s
        feedback: The page still can't finish before the 10 s download does.
      - text: Half the time
    explanation: The real payoff comes from many independent, similar tasks — one per image, rendered as each arrives.
    details: |
      Rendering text (1 s) and downloading images (10 s) in parallel takes about 10 s, instead of 11 s sequentially — a saving of about 1 s.
      Parallelizing two unequal tasks gains at most the shorter one's time.
      The big win comes from splitting the 10 s download into one task per image, running many at once and rendering each image as it arrives.

  - type: explanation
    title: Time budgets
    body: |
      `get(timeout)` stops waiting after a deadline.
      Then cancel the task, so it stops using resources.

  - type: match
    prompt: Match each tool to its use.
    pairs:
      - left: "`Future.get()`"
        right: Wait for one specific result
      - left: "`Future.get(timeout, unit)`"
        right: Wait at most a time budget, then give up and use a default
      - left: "`CompletionService.take()`"
        right: Get whichever result finishes next
      - left: "`invokeAll(tasks, timeout, unit)`"
        right: Run many tasks, wait for all — cancelling those still running when time is up

  - type: choice
    prompt: An ad must appear within 2 s, or the page shows a default. What happens to the ad task after `get` times out?
    options:
      - text: You should cancel it with `future.cancel(true)` — otherwise it keeps using resources computing a result nobody will use
        correct: true
      - text: It stops automatically
        feedback: A timed `get` only stops *waiting*. The task carries on unless cancelled.

  - type: blank
    prompt: Wait for a result with a time budget.
    template: "ad = f.get(timeLeftNanos, TimeUnit.[[NANOSECONDS]]);"
    code: true

  - type: choice
    id: listing-6-10
    prompt: |
      **Listing 6.10** · What's slow about rendering the page this way?
    code: |
      public abstract class SingleThreadRenderer {
          void renderPage(CharSequence source) {
              renderText(source);
              List<ImageData> imageData = new ArrayList<ImageData>();
              for (ImageInfo imageInfo : scanForImageInfo(source))
                  imageData.add(imageInfo.downloadImage());
              for (ImageData data : imageData)
                  renderImage(data);
          }

          interface ImageData {
          }

          interface ImageInfo {
              ImageData downloadImage();
          }

          abstract void renderText(CharSequence s);
          abstract List<ImageInfo> scanForImageInfo(CharSequence s);
          abstract void renderImage(ImageData i);
      }
    language: java
    options:
      - text: "All images download one after another, after the text, with the CPU mostly idle"
        correct: true
      - text: "It renders text twice"
        feedback: "Text is rendered once, before any image is downloaded."
      - text: "It isn't thread-safe"
        feedback: "It's single-threaded."

  - type: choice
    id: listing-6-11
    prompt: |
      **Listing 6.11** · What can a `Callable` do that a `Runnable` can't?
    code: |
      public interface Callable<V> {
          V call() throws Exception;
      }

      public interface Future<V> {
          boolean cancel(boolean mayInterruptIfRunning);
          boolean isCancelled();
          boolean isDone();
          V get() throws InterruptedException, ExecutionException,
                         CancellationException;
          V get(long timeout, TimeUnit unit)
              throws InterruptedException, ExecutionException,
                     CancellationException, TimeoutException;
      }
    language: java
    options:
      - text: "Return a result"
        correct: true
      - text: "Throw a checked exception"
        correct: true
      - text: "Run on a thread"
        feedback: "Both can be run on threads or executors."

  - type: choice
    id: listing-6-12
    prompt: |
      **Listing 6.12** · `submit(task)` on a `ThreadPoolExecutor` calls this. What does `submit` return?
    code: |
      protected <T> RunnableFuture<T> newTaskFor(Callable<T> task) {
          return new FutureTask<T>(task);
      }
    language: java
    options:
      - text: "The `FutureTask`, which is both the task the pool runs and the `Future` the caller waits on"
        correct: true
      - text: "A new thread"
        feedback: "It's a task object; the pool decides the thread."
      - text: "The `Callable` itself"
        feedback: "It's wrapped in a `FutureTask`."

  - type: choice
    id: listing-6-13
    prompt: |
      **Listing 6.13** · How much faster is this than rendering sequentially, if downloading images takes far longer than rendering text?
    code: |
      public abstract class FutureRenderer {
          private final ExecutorService executor = Executors.newCachedThreadPool();

          void renderPage(CharSequence source) {
              final List<ImageInfo> imageInfos = scanForImageInfo(source);
              Callable<List<ImageData>> task =
                      new Callable<List<ImageData>>() {
                          public List<ImageData> call() {
                              List<ImageData> result = new ArrayList<ImageData>();
                              for (ImageInfo imageInfo : imageInfos)
                                  result.add(imageInfo.downloadImage());
                              return result;
                          }
                      };

              Future<List<ImageData>> future = executor.submit(task);
              renderText(source);

              try {
                  List<ImageData> imageData = future.get();
                  for (ImageData data : imageData)
                      renderImage(data);
              } catch (InterruptedException e) {
                  // Re-assert the thread's interrupted status
                  Thread.currentThread().interrupt();
                  // We don't need the result, so cancel the task too
                  future.cancel(true);
              } catch (ExecutionException e) {
                  throw launderThrowable(e.getCause());
              }
          }

          interface ImageData {
          }

          interface ImageInfo {
              ImageData downloadImage();
          }

          abstract void renderText(CharSequence s);

          abstract List<ImageInfo> scanForImageInfo(CharSequence s);

          abstract void renderImage(ImageData i);
      }
    language: java
    options:
      - text: "Only a little — text renders while images download, but the images still come one after another"
        correct: true
      - text: "Much faster — all images download in parallel"
        feedback: "One task downloads all the images, sequentially."
      - text: "Slower"
        feedback: "Text rendering now overlaps the downloads."

  - type: choice
    id: listing-6-14
    prompt: |
      **Listing 6.14** · How does `ExecutorCompletionService` hand back results as they finish?
    code: |
      private class QueueingFuture<V> extends FutureTask<V> {
          QueueingFuture(Callable<V> c) { super(c); }
          QueueingFuture(Runnable t, V r) { super(t, r); }

          protected void done() {
              completionQueue.add(this);
          }
      }
    language: java
    options:
      - text: "Each task's `done()` puts it on a queue, which `take()` reads from"
        correct: true
      - text: "It polls each future in turn"
        feedback: "Completion pushes the future onto the queue; nothing polls."
      - text: "Results come back in submission order"
        feedback: "They come back in completion order."

  - type: choice
    id: listing-6-15
    prompt: |
      **Listing 6.15** · In what order are the images rendered?
    code: |
      public abstract class Renderer {
          private final ExecutorService executor;

          Renderer(ExecutorService executor) {
              this.executor = executor;
          }

          void renderPage(CharSequence source) {
              final List<ImageInfo> info = scanForImageInfo(source);
              CompletionService<ImageData> completionService =
                      new ExecutorCompletionService<ImageData>(executor);
              for (final ImageInfo imageInfo : info)
                  completionService.submit(new Callable<ImageData>() {
                      public ImageData call() {
                          return imageInfo.downloadImage();
                      }
                  });

              renderText(source);

              try {
                  for (int t = 0, n = info.size(); t < n; t++) {
                      Future<ImageData> f = completionService.take();
                      ImageData imageData = f.get();
                      renderImage(imageData);
                  }
              } catch (InterruptedException e) {
                  Thread.currentThread().interrupt();
              } catch (ExecutionException e) {
                  throw launderThrowable(e.getCause());
              }
          }

          interface ImageData {
          }

          interface ImageInfo {
              ImageData downloadImage();
          }

          abstract void renderText(CharSequence s);

          abstract List<ImageInfo> scanForImageInfo(CharSequence s);

          abstract void renderImage(ImageData i);
      }
    language: java
    options:
      - text: "As each finishes downloading, in whatever order that is"
        correct: true
      - text: "In the order they appear in the page"
        feedback: "`completionService.take()` returns whichever task finished next."
      - text: "All at once, after every download finishes"
        feedback: "Each is rendered as soon as it's ready."

  - type: choice
    id: listing-6-16
    prompt: |
      **Listing 6.16** · The ad takes longer than the time budget. What happens?
    code: |
      public class RenderWithTimeBudget {
          private static final Ad DEFAULT_AD = new Ad();
          private static final long TIME_BUDGET = 1000;
          private static final ExecutorService exec = Executors.newCachedThreadPool();

          Page renderPageWithAd() throws InterruptedException {
              long endNanos = System.nanoTime() + TIME_BUDGET;
              Future<Ad> f = exec.submit(new FetchAdTask());
              // Render the page while waiting for the ad
              Page page = renderPageBody();
              Ad ad;
              try {
                  // Only wait for the remaining time budget
                  long timeLeft = endNanos - System.nanoTime();
                  ad = f.get(timeLeft, NANOSECONDS);
              } catch (ExecutionException e) {
                  ad = DEFAULT_AD;
              } catch (TimeoutException e) {
                  ad = DEFAULT_AD;
                  f.cancel(true);
              }
              page.setAd(ad);
              return page;
          }

          Page renderPageBody() { return new Page(); }

          static class Ad {
          }

          static class Page {
              public void setAd(Ad ad) { }
          }

          static class FetchAdTask implements Callable<Ad> {
              public Ad call() {
                  return new Ad();
              }
          }
      }
    language: java
    options:
      - text: "The page gets the default ad, and the ad task is cancelled"
        correct: true
      - text: "The page waits for the ad"
        feedback: "`get` waits only for the time left."
      - text: "The ad task keeps running in the background"
        feedback: "`f.cancel(true)` interrupts it."

  - type: choice
    id: listing-6-17
    prompt: |
      **Listing 6.17** · Some companies don't answer within the time limit. What do they contribute to the list?
    code: |
      public class TimeBudget {
          private static ExecutorService exec = Executors.newCachedThreadPool();

          public List<TravelQuote> getRankedTravelQuotes(TravelInfo travelInfo, Set<TravelCompany> companies,
                                                         Comparator<TravelQuote> ranking, long time, TimeUnit unit)
                  throws InterruptedException {
              List<QuoteTask> tasks = new ArrayList<QuoteTask>();
              for (TravelCompany company : companies)
                  tasks.add(new QuoteTask(company, travelInfo));

              List<Future<TravelQuote>> futures = exec.invokeAll(tasks, time, unit);

              List<TravelQuote> quotes =
                      new ArrayList<TravelQuote>(tasks.size());
              Iterator<QuoteTask> taskIter = tasks.iterator();
              for (Future<TravelQuote> f : futures) {
                  QuoteTask task = taskIter.next();
                  try {
                      quotes.add(f.get());
                  } catch (ExecutionException e) {
                      quotes.add(task.getFailureQuote(e.getCause()));
                  } catch (CancellationException e) {
                      quotes.add(task.getTimeoutQuote(e));
                  }
              }

              Collections.sort(quotes, ranking);
              return quotes;
          }
      }

      class QuoteTask implements Callable<TravelQuote> {
          private final TravelCompany company;
          private final TravelInfo travelInfo;

          public QuoteTask(TravelCompany company, TravelInfo travelInfo) {
              this.company = company;
              this.travelInfo = travelInfo;
          }

          TravelQuote getFailureQuote(Throwable t) {
              return null;
          }

          TravelQuote getTimeoutQuote(CancellationException e) {
              return null;
          }

          public TravelQuote call() throws Exception {
              return company.solicitQuote(travelInfo);
          }
      }

      interface TravelCompany {
          TravelQuote solicitQuote(TravelInfo travelInfo) throws Exception;
      }

      interface TravelQuote {
      }

      interface TravelInfo {
      }
    language: java
    options:
      - text: "A timeout quote — `invokeAll` cancels them, and `get` throws `CancellationException`"
        correct: true
      - text: "Nothing — they're left out"
        feedback: "Every task has a future; cancelled ones get a timeout quote."
      - text: "The method waits for them anyway"
        feedback: "`invokeAll` with a timeout returns when the time is up."
