title: Why indexes exist
summary: From scanning every row to finding one in three page reads.
duration: 6
tags: [databases, indexes, b-tree, sql, performance]
sources:
  - { book: sql-performance-explained, ref: "Chapter 1, Anatomy of an Index" }
steps:
  - type: explanation
    title: Without an index, read everything
    body: |
      A table is stored as pages, rows in no order.

      ```sql
      SELECT * FROM users WHERE email = 'ada@example.com';
      ```

      With no index, the database checks every row.
      That's a full table scan.

  - type: choice
    prompt: "`users` has 10 million rows and no index on `email`. In the worst case, how many rows does the query above examine?"
    options:
      - text: All 10 million
        correct: true
      - text: About 24 — a binary search
        feedback: Binary search needs the rows sorted by `email`. In a heap table they're in insertion order.
      - text: Just one
        feedback: The database can't know where the row is without looking.
    explanation: With nothing sorted by `email`, the only safe answer is to look at every row.

  - type: explanation
    title: An index is a sorted tree
    body: |
      An index keeps the column sorted, pointing to each row.
      Databases store it as a B-tree.
      Each node is a page holding hundreds of keys.
      So the tree is only a few levels deep.

  - type: predict
    prompt: |
      Each B-tree node holds up to 500 keys, so it has up to about 500 children.
      **How many levels** are needed to index 100 million keys?
    options:
      - text: "3"
        correct: true
      - text: "2"
        feedback: "Two levels reach about 500 × 500 = 250,000 keys. Not enough."
      - text: "4"
        feedback: "Close — but three levels already reach 500³ = 125 million."
      - text: "10"
        feedback: "Three levels already reach 125 million keys."
    hints:
      - One level holds 500 keys; two levels hold about 500 × 500.
    explanation: "500³ = 125,000,000 ≥ 100 million, so three levels — three page reads to find any row."

  - type: match
    prompt: Match each B-tree term to its meaning.
    pairs:
      - left: Root
        right: The single node at the top, where every search starts
      - left: Leaf
        right: A node with no children, at the bottom level
      - left: Fan-out
        right: How many children a node has
      - left: Order
        right: The most children a node is allowed

  - type: choice
    prompt: There's an index on `last_name`. Which of these can use it?
    options:
      - text: "`WHERE last_name = 'Lovelace'`"
        correct: true
      - text: "`WHERE last_name LIKE 'Lov%'`"
        correct: true
      - text: "`WHERE last_name LIKE '%lace'`"
        feedback: A leading wildcard means the match could start anywhere in the sorted order, so the tree can't narrow it down.
      - text: "`ORDER BY last_name`"
        correct: true
    hints:
      - The index helps when the sorted order narrows down where to look.
    explanation: |
      Equality, prefix matches and sorting all follow the index's order. A suffix match doesn't,
      so it falls back to scanning.
    details: |
      An index on `last_name` stores names in sorted order, like a phone book.
      Equality finds one spot, a prefix like `'Lov%'` is a contiguous range starting at "Lov", and `ORDER BY` can read entries in order without sorting.
      A pattern like `'%lace'` matches names scattered all over the sorted order, so the database can't jump to them and must scan.

  - type: explanation
    title: Indexes cost writes
    body: |
      Every insert, update and delete must update the index too.
      Indexes take disk space and memory.
      Index the columns you search and sort by often.

  - type: choice
    prompt: Which of these are costs of adding an index?
    options:
      - text: Writes to the table get slower
        correct: true
      - text: It takes extra disk space
        correct: true
      - text: Reads that use it get slower
        feedback: Reads that use an index get faster — that's the point. The costs land on writes and storage.
    explanation: Indexes trade write speed and space for read speed.
