title: Multi-column indexes
summary: Why column order in a concatenated index decides which queries it can serve.
duration: 8
tags: [databases, sql, indexes, concatenated index, composite index, column order, range]
sources:
  - { book: sql-performance-explained, ref: "Chapter 2, The Where Clause — Concatenated Keys and Ranges" }
steps:
  - type: explanation
    title: Sorted like a phone book
    body: |
      A multi-column index sorts by the first column.
      Then by the second, within equal first values.

      ```sql
      CREATE INDEX emp_sub_id ON employees (subsidiary_id, employee_id);
      ```

      | subsidiary_id | employee_id |
      |---|---|
      | 10 | 3 |
      | 10 | 17 |
      | 20 | 1 |
      | 20 | 9 |

      `employee_id` alone is not sorted across the index.

  - type: choice
    prompt: "With an index on `(subsidiary_id, employee_id)`, which `WHERE` clauses can use it to find rows directly?"
    options:
      - text: "`WHERE subsidiary_id = 20`"
        correct: true
      - text: "`WHERE subsidiary_id = 20 AND employee_id = 9`"
        correct: true
      - text: "`WHERE employee_id = 9`"
        feedback: Employee 9 could be in any subsidiary, so the database would have to read the whole index (or the table).
    hints:
      - Can you find everyone called *Sarah* quickly in a phone book sorted by surname?
    explanation: An index serves queries on a **leading** prefix of its columns — the first column, the first two, and so on.
    details: |
      A two-column index sorts entries by `subsidiary_id` first, and by `employee_id` only within each subsidiary — like a phone book sorted by surname, then first name.
      You can quickly find a subsidiary, or a subsidiary and employee, because those are contiguous ranges.
      Searching by `employee_id` alone is like finding everyone named "Ada" in a phone book: the matches are scattered, so the index can't narrow the search.

  - type: predict
    prompt: |
      Most queries filter on `employee_id` alone; a few filter on both columns. Which single index serves them all?
    options:
      - text: "`(employee_id, subsidiary_id)`"
        correct: true
      - text: "`(subsidiary_id, employee_id)`"
        feedback: Queries on `employee_id` alone can't use it — it isn't the leading column.
      - text: "`(employee_id)` and `(subsidiary_id)` as two separate indexes"
        feedback: That works, but costs two indexes to maintain where one would do.
    explanation: Put the column that is queried on its own first. One well-ordered index often replaces several.

  - type: explanation
    title: Equality first, ranges last
    body: |
      This query has a range and an equality:

      ```sql
      SELECT * FROM employees
       WHERE date_of_birth BETWEEN '1971-01-01' AND '1971-01-09'
         AND subsidiary_id = 27;
      ```

      Put the equality column first.
      Then the range reads only one subsidiary's rows.

  - type: choice
    prompt: Which index serves that query best?
    options:
      - text: "`(subsidiary_id, date_of_birth)`"
        correct: true
      - text: "`(date_of_birth, subsidiary_id)`"
        feedback: The range on the leading column means scanning every subsidiary's entries for those dates.
    explanation: Index for **equality first, then for ranges.** Columns after a range can only filter, not narrow the scan.
    details: |
      The query filters on `subsidiary_id = ?` and a range of `date_of_birth`.
      With `(subsidiary_id, date_of_birth)`, the index jumps to the subsidiary and then reads one contiguous range of birthdays within it.
      With the columns reversed, the range on birthdays comes first and covers entries for every subsidiary, so the database must read the whole range and filter out other subsidiaries.
      Hence: equality columns first, the range column last.

  - type: explanation
    title: Use leading columns
    body: |
      An index helps only through its leading columns.
      Every extra index slows down writes.
      So choose column order to serve many queries.

  - type: match
    prompt: Match each part of the search to its role.
    pairs:
      - left: Access predicate
        right: Narrows where the index scan starts and stops
      - left: Index filter predicate
        right: Checked on each index entry during the scan, without narrowing it
      - left: Table-level filter
        right: Checked only after fetching the row from the table
      - left: Leading column
        right: The first column of a concatenated index

  - type: blank
    prompt: Complete the rule.
    template: "A concatenated index can only be used for a [[leading|left]] subset of its columns, and range conditions should come [[last]]."

  - type: choice
    prompt: Why not simply index every column combination you might ever query?
    options:
      - text: Every index slows down inserts, updates and deletes, and takes space
        correct: true
      - text: Databases allow only one index per table
        feedback: Most allow many. The cost is in maintenance, not in a limit.
    explanation: Aim for the fewest indexes that serve your real queries — choosing column order well is how.
