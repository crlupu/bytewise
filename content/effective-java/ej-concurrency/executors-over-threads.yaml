title: Executors, tasks and streams over threads
summary: Think in tasks; let an executor service manage the threads.
duration: 4
tags: [java, effective java, concurrency, executor, thread pool, fork-join]
sources:
  - { book: effective-java, ref: "Item 80" }
steps:
  - type: explanation
    title: Tasks, not threads
    body: |
      A task is the work: a `Runnable` or `Callable`.
      An executor decides how and when it runs.

      ```java
      ExecutorService exec = Executors.newSingleThreadExecutor();
      exec.execute(task);
      exec.shutdown();
      ```

  - type: explanation
    title: Executors do the hard parts
    body: |
      You can wait for one task, any task, or all of them.
      You can schedule tasks for later, or repeat them.
      You can shut everything down cleanly.

  - type: match
    prompt: Match each need to the executor feature.
    pairs:
      - left: Wait for a particular task to finish
        right: "`Future.get()` on the result of `submit`"
      - left: Wait for any or all of a collection of tasks
        right: "`invokeAny` or `invokeAll`"
      - left: Run tasks at a set time or periodically
        right: "`ScheduledThreadPoolExecutor`"
      - left: Wait for the executor to terminate cleanly
        right: "`awaitTermination`"

  - type: explanation
    title: Choose the right pool
    body: |
      Under heavy load, use a fixed-size pool.
      For divide-and-conquer work, use a fork-join pool.
      Its idle threads steal tasks from busy ones.

  - type: choice
    prompt: Which pool suits a heavily loaded production server?
    options:
      - text: A fixed thread pool, or a `ThreadPoolExecutor` configured directly for maximum control
        correct: true
      - text: "`newCachedThreadPool`"
        feedback: Under heavy load a cached pool creates new threads for every queued task, making things worse.
    explanation: A cached pool is fine for a small program or a lightly loaded server.
    details: |
      A cached thread pool creates a new thread whenever all existing ones are busy, with no upper limit.
      Under heavy load, tasks arrive faster than they finish, so it keeps creating threads, each with its own stack, until the machine thrashes or runs out of memory.
      A fixed-size pool queues excess tasks instead, keeping the number of threads matched to what the CPUs and downstream resources can handle.

  - type: choice
    prompt: What does a fork-join pool add?
    options:
      - text: Work stealing — idle threads take tasks from busy ones, keeping all cores busy on divide-and-conquer work
        correct: true
      - text: Unlimited threads
    explanation: Parallel streams are built on fork-join pools.

  - type: blank
    prompt: Complete the advice.
    template: "Refrain from working directly with [[threads]]; the unit of work is the [[task]]."
