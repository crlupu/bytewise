title: Override clone judiciously
summary: Cloneable is a broken mixin; copy constructors and copy factories are almost always better.
duration: 5
tags: [java, effective java, clone, cloneable, copy constructor, deep copy]
sources:
  - { book: effective-java, ref: "Item 13" }
steps:
  - type: explanation
    title: clone is a strange mechanism
    body: |
      `Cloneable` has no methods.
      It just changes what `Object.clone` does.
      The copy is shallow: references are shared, not copied.

  - type: predict
    prompt: "A `Stack` with an `Object[] elements` field overrides `clone` as just `return (Stack) super.clone();`. What's wrong?"
    options:
      - text: The clone shares the same array as the original, so pushing onto one corrupts the other
        correct: true
      - text: Nothing — `super.clone()` copies everything
        feedback: It copies the *reference* to the array, not the array.
      - text: It throws `CloneNotSupportedException`
        feedback: Only if `Stack` doesn't implement `Cloneable`.
    explanation: The fix is `result.elements = elements.clone();` — and mutable fields must not be `final`, or you can't reassign them.

  - type: explanation
    title: Prefer copy constructors
    body: |
      A copy constructor or copy factory is plain Java.

      ```java
      public Yum(Yum yum) { ... }
      ```

      It works with `final` fields and needs no cast.
      It can even convert types: `new TreeSet<>(hashSet)`.
      For arrays, `clone()` is still the neatest way.

  - type: choice
    prompt: Which are advantages of copy constructors over `clone`?
    options:
      - text: They work with `final` fields
        correct: true
      - text: They can accept an interface, converting between implementations
        correct: true
      - text: They don't throw a checked exception or need a cast
        correct: true
      - text: They perform a deep copy automatically
        feedback: Neither approach copies deeply on its own; you write that logic either way.

  - type: choice
    prompt: Where is `clone` still the best choice?
    options:
      - text: Copying arrays — `array.clone()` is concise and correct
        correct: true
      - text: Copying any new class you design
        feedback: For new classes, prefer copy constructors or factories.
