title: Override hashCode with equals
summary: Equal objects must have equal hash codes — or hash-based collections can't find them.
duration: 5
tags: [java, effective java, hashcode, equals, hashmap, hashset]
sources:
  - { book: effective-java, ref: "Item 11" }
steps:
  - type: explanation
    title: Equal objects need equal hash codes
    body: |
      A `HashMap` finds the bucket by `hashCode` first.
      Only then does it call `equals`.
      Override `equals` without `hashCode`, and lookups miss.

  - type: predict
    prompt: "`Point` overrides `equals` to compare `x` and `y`, but not `hashCode`. What does this print?"
    code: |
      Map<Point, String> names = new HashMap<>();
      names.put(new Point(1, 2), "home");
      System.out.println(names.get(new Point(1, 2)));
    language: java
    options:
      - text: "null"
        correct: true
      - text: "home"
        feedback: "The two `Point`s are equal, but their inherited hash codes differ, so `get` searches another bucket."
      - text: "A `NullPointerException`"
        feedback: "`get` returns null for a missing key; it doesn't throw."
    hints:
      - Which method does `HashMap.get` call first?
    explanation: Almost certainly `null`. (Occasionally the identity hashes collide — making the bug intermittent, which is worse.)
    details: |
      `HashMap.get` first computes the key's hash code to pick a bucket, and only then calls `equals` on keys in that bucket.
      Without an override, `hashCode` comes from `Object` and is based on identity, so two equal points almost always get different codes and land in different buckets.
      `get` looks in the wrong bucket, never calls `equals`, and returns `null`.
      Whenever you override `equals`, override `hashCode` from the same fields.

  - type: explanation
    title: Writing hashCode
    body: |
      `Objects.hash(x, y)` is the easy way.
      Use exactly the fields that `equals` uses.
      And don't change those fields while the object is in a set or map.

  - type: choice
    prompt: Which `hashCode` implementations are legal for that `Point`?
    options:
      - text: "`return Objects.hash(x, y);`"
        correct: true
      - text: "`return 31 * Integer.hashCode(x) + Integer.hashCode(y);`"
        correct: true
      - text: "`return 42;`"
        correct: true
      - text: "`return System.identityHashCode(this);`"
        feedback: Two equal points would get different values — exactly the bug we just saw.
    explanation: |
      `return 42` is *legal* but every point lands in one bucket and the map degrades into a list. `Objects.hash` is
      concise but allocates an array per call; the hand-written form is fastest.
    details: |
      The only hard rule is that equal objects must return equal hash codes, so even `return 42` is legal — it just sends every point to one bucket and turns lookups from constant time into a linear scan.
      A good hash spreads unequal objects across many values. Multiplying by 31 mixes the fields so that `(1, 2)` and `(2, 1)` usually differ.
      `Objects.hash(x, y)` gives the same quality in one line, at the cost of an array allocation and boxing per call — fine unless the method is very hot.

  - type: blank
    prompt: Complete the contract.
    template: "If two objects are [[equal]] according to `equals`, they must have the same [[hashCode|hash code]]. The reverse need not hold."
    explanation: Unequal objects *may* share a hash code — that's a collision, and costs only performance.

  - type: predict
    prompt: "`Person` uses `name` in both `equals` and `hashCode`, and has a setter for `name`. What does this print?"
    code: |
      Set<Person> people = new HashSet<>();
      Person p = new Person("Ada");
      people.add(p);
      p.setName("Grace");
      System.out.println(people.contains(p));
    language: java
    options:
      - text: "`true`"
        feedback: "`p` is still in the set — but filed in the bucket for its *old* hash code."
      - text: "`false`"
        correct: true
    explanation: Mutating a field `hashCode` uses, while the object sits in a hash collection, strands it in the wrong bucket.
    details: |
      When `p` was added, the set stored it in the bucket for the hash code of "Ada".
      Changing the name changes the hash code, so `contains(p)` looks in the bucket for "Grace", finds nothing and returns `false` — even though the very same object is in the set.
      The object is stranded: it can't be found or removed, and iterating still shows it.
      Don't mutate fields used by `equals` and `hashCode` while an object is a key or element of a hash-based collection; immutable keys avoid this entirely.

  - type: choice
    prompt: May you leave a significant field out of `hashCode` to make it faster?
    options:
      - text: Only if you accept more collisions — and never include a field that `equals` ignores
        correct: true
      - text: Yes, always — fewer fields means a faster hash
        feedback: Leaving out important fields can make hash tables unusably slow.
    explanation: Fields excluded from `equals` *must* be excluded from `hashCode`, or equal objects could hash differently.
