title: Eliminate unchecked warnings
summary: Each one is a potential ClassCastException. Fix it, or prove it safe and suppress it as narrowly as possible.
duration: 4
tags: [java, effective java, generics, warnings, suppresswarnings]
sources:
  - { book: effective-java, ref: "Item 27" }
steps:
  - type: explanation
    title: Fix every warning you can
    body: |
      Unchecked warnings mean a possible `ClassCastException`.
      Many are easy: `new HashSet<>()` instead of `new HashSet()`.
      With none left, your generic code is type-safe.

  - type: explanation
    title: "Suppress only what's proven"
    body: |
      If you prove a cast is safe, suppress the warning.
      Use the smallest scope, like one declaration.
      Add a comment saying why it's safe.

  - type: choice
    prompt: You can't eliminate a warning, but you've proved the cast is safe. What should you do?
    options:
      - text: Add `@SuppressWarnings("unchecked")` on the smallest possible scope, with a comment saying why it's safe
        correct: true
      - text: Put `@SuppressWarnings("unchecked")` on the class
        feedback: That would hide future, genuinely dangerous warnings in the whole class.
      - text: Leave the warning
        feedback: Then real problems get lost among warnings you know are harmless.
    details: |
      Each unchecked warning marks a place where a `ClassCastException` could happen at run time.
      If you've proved one can't, suppress it — but on the smallest scope, so that new warnings elsewhere in the method still show up.
      Suppressing on a whole class hides future mistakes; leaving proven-safe warnings unsuppressed buries real ones in noise.
      The comment explaining why it's safe helps the next reader and forces you to actually make the argument.

  - type: order
    prompt: Order these scopes from narrowest (best) to widest.
    items:
      - A local variable declaration
      - A method
      - A class
    explanation: Even a `return` statement can be split into a local variable declaration so the annotation covers just it.

  - type: blank
    prompt: Narrow the suppression to one declaration.
    template: |
      @SuppressWarnings("[[unchecked]]")
      T[] result = (T[]) Arrays.copyOf(elements, size, a.getClass());
    code: true

  - type: choice
    prompt: Why add a comment next to every suppression?
    options:
      - text: It explains why it's safe, so others don't "fix" it — and it forces you to check your reasoning
        correct: true
      - text: The compiler requires it
