title: Typesafe heterogeneous containers
summary: Key a map by Class objects, and one container can hold values of many types — still type-safe.
duration: 5
tags: [java, effective java, generics, type token, class literal, containers]
sources:
  - { book: effective-java, ref: "Item 33" }
steps:
  - type: explanation
    title: One container, many types
    body: |
      Key the map by `Class<T>`, a type token.

      ```java
      public <T> void putFavorite(Class<T> type, T instance)
      public <T> T getFavorite(Class<T> type)
      ```

      Each key decides the type of its value.

  - type: predict
    prompt: What does this print?
    code: |
      Favorites f = new Favorites();
      f.putFavorite(String.class, "Java");
      f.putFavorite(Integer.class, 0xcafebabe);
      String s = f.getFavorite(String.class);
      int i = f.getFavorite(Integer.class);
      System.out.printf("%s %x%n", s, i);
    language: java
    options:
      - text: "Java cafebabe"
        correct: true
      - text: "Java 3405691582"
        feedback: "`%x` prints in hexadecimal."
      - text: "A `ClassCastException`"
        feedback: "`Class.cast` checks each value against its own type token, and both match."
    hints:
      - "`%x` prints an int in hex."
    explanation: Each value comes back with its own type, and no casts are needed in the client.

  - type: explanation
    title: Class.cast keeps it safe
    body: |
      `type.cast(obj)` is checked at run time.
      There's no `List<String>.class`, though.
      So only reifiable types work as keys.

  - type: choice
    prompt: Why does `getFavorite` call `type.cast(...)` instead of `(T) ...`?
    options:
      - text: "`Class.cast` is checked at run time, so it's type-safe — an unchecked `(T)` cast would only produce a warning"
        correct: true
      - text: Casts don't work on generics
    explanation: The map's values are `Object`, but the `Class` key remembers the true type.
    details: |
      An unchecked cast `(T) obj` is erased to nothing at run time, so a wrong value would slip out and fail later.
      `Class.cast` actually checks that the object is an instance of the class and throws immediately if not.
      Since the `Class<T>` key carries the real type, the container can guarantee every value it returns matches what was asked for.

  - type: choice
    prompt: Can you store a favourite `List<String>` this way?
    options:
      - text: No — there's no `List<String>.class`; only reifiable types have class literals
        correct: true
      - text: Yes, with `List.class`
        feedback: Then `List<String>` and `List<Integer>` would share one key.
    explanation: That's the pattern's main limitation.

  - type: blank
    prompt: Complete the type-token signature.
    template: "public <T> T getFavorite([[Class]]<T> type)"
    code: true
