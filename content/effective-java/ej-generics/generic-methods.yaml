title: Favor generic methods
summary: Static utility methods are perfect candidates — type parameters make them safe and cast-free.
duration: 5
tags: [java, effective java, generics, generic methods, type inference, recursive bound]
sources:
  - { book: effective-java, ref: "Item 30" }
steps:
  - type: explanation
    title: Methods can be generic too
    body: |
      Declare type parameters before the return type.

      ```java
      public static <E> Set<E> union(Set<E> s1, Set<E> s2)
      ```

      Callers don't name `E`. The compiler infers it.

  - type: blank
    prompt: Put the type parameter list in the right place.
    template: "public static [[<E>]] Set<E> union(Set<E> s1, Set<E> s2)"
    code: true

  - type: explanation
    title: Recursive type bounds
    body: |
      `<E extends Comparable<E>>` means "E can be compared with itself".
      So `max` can compare any two elements.
      A stateless generic object can be shared across all types.

  - type: choice
    prompt: What does `<E extends Comparable<E>>` guarantee inside `max`?
    options:
      - text: Any element can call `compareTo` on any other element
        correct: true
      - text: E is exactly `Comparable`
      - text: The collection is sorted
        feedback: It only guarantees elements can be compared, not their order.

  - type: choice
    prompt: "An immutable identity function is stateless. How can one instance serve every type?"
    options:
      - text: A generic singleton factory — one object, cast to `UnaryOperator<T>` for any T, safe because it never touches the type
        correct: true
      - text: Create a new instance per type
        feedback: Works, but wasteful; erasure lets one instance be shared.
    explanation: "`Collections.reverseOrder()` and `Collections.emptySet()` use the same trick."
