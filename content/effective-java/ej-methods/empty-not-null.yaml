title: Return empty collections, not null
summary: Returning null forces every caller to special-case "nothing" — and the one who forgets crashes.
duration: 4
tags: [java, effective java, "null", collections, api design]
sources:
  - { book: effective-java, ref: "Item 54" }
steps:
  - type: explanation
    title: null forces checks everywhere
    body: |
      Returning `null` for "nothing" means every caller must check.
      Forget once, and it crashes on the rare empty case.

  - type: explanation
    title: Return empty instead
    body: |
      An empty list or array works everywhere.
      A loop over it just runs zero times.
      Share one immutable empty instance if allocation worries you.

  - type: choice
    prompt: The usual argument for returning null is that it avoids allocating an empty list. Why doesn't it hold?
    options:
      - text: The allocation is negligible, and if it ever matters you can return the same immutable empty collection every time
        correct: true
      - text: Allocation is always free
        feedback: Not free — just rarely significant, and avoidable anyway.

  - type: blank
    prompt: Return a shared, immutable empty list.
    template: "return cheesesInStock.isEmpty() ? Collections.[[emptyList]]() : new ArrayList<>(cheesesInStock);"
    code: true

  - type: blank
    prompt: |
      Return an empty array without allocating a new one each time — use a shared zero-length constant.
    template: |
      private static final Cheese[] EMPTY_CHEESE_ARRAY = new Cheese[0];
      return cheesesInStock.[[toArray]](EMPTY_CHEESE_ARRAY);
    code: true
    explanation: "A zero-length array is immutable, so it can be shared freely."

  - type: choice
    prompt: "Does `for (Cheese c : shop.getCheeses())` work if `getCheeses()` returns an empty list?"
    options:
      - text: Yes — the loop simply runs zero times
        correct: true
      - text: No — it throws
        feedback: That's what happens with `null`.
    explanation: Empty collections flow through loops and streams without any special code.
