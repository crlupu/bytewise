title: Use varargs judiciously
summary: Varargs suit "zero or more" — when at least one argument is required, say so in the signature.
duration: 4
tags: [java, effective java, varargs, api design, performance]
sources:
  - { book: effective-java, ref: "Item 53" }
steps:
  - type: explanation
    title: Varargs takes zero or more
    body: |
      `int... args` accepts any number of arguments as an array — even none.
      This `min` needs at least one:

      ```java
      static int min(int... args) {
          if (args.length == 0)
              throw new IllegalArgumentException("Too few arguments");
          int min = args[0];
          for (int i = 1; i < args.length; i++)
              if (args[i] < min) min = args[i];
          return min;
      }
      ```

  - type: choice
    prompt: |
      What's the problem with this `min`?
    code: |
      static int min(int... args) {
          if (args.length == 0)
              throw new IllegalArgumentException("Too few arguments");
          int min = args[0];
          for (int i = 1; i < args.length; i++)
              if (args[i] < min) min = args[i];
          return min;
      }
    language: java
    options:
      - text: Calling it with no arguments compiles, and fails only at run time
        correct: true
      - text: Varargs can't be used with primitives
        feedback: "`int...` is fine."
    explanation: It's also clumsy — `args[0]` must be handled separately.

  - type: explanation
    title: Require one, then the rest
    body: |
      `min(int firstArg, int... remainingArgs)` needs at least one.
      Each varargs call allocates an array.
      Fast APIs add overloads for the common small counts.

  - type: blank
    prompt: Require at least one argument in the signature.
    template: "static int min(int [[firstArg]], int... remainingArgs)"
    code: true
    explanation: Now `min()` doesn't compile.

  - type: choice
    prompt: Each varargs call allocates an array. How do performance-critical APIs like `EnumSet.of` avoid that?
    options:
      - text: Overloads for the common cases — zero to three or so parameters — plus a varargs version for the rest
        correct: true
      - text: They don't use varargs at all
    explanation: If most calls pass three or fewer arguments, the array is needed only in the rare long calls.

  - type: predict
    prompt: How many arrays does `EnumSet.of(Style.BOLD, Style.ITALIC)` allocate for its arguments?
    options:
      - text: None — a two-argument overload exists
        correct: true
      - text: One
        feedback: The varargs overload is only used beyond the fixed-arity ones.
