title: Use overloading judiciously
summary: Overloads are chosen at compile time, overrides at run time — and that difference surprises people.
duration: 6
tags: [java, effective java, overloading, overriding, autoboxing, api design]
sources:
  - { book: effective-java, ref: "Item 52" }
steps:
  - type: explanation
    title: Which overload runs?
    body: |
      Three overloads, and three different collections:

      ```java
      static String classify(Set<?> s)        { return "Set"; }
      static String classify(List<?> lst)     { return "List"; }
      static String classify(Collection<?> c) { return "Unknown Collection"; }

      Collection<?>[] collections = { new HashSet<String>(),
          new ArrayList<BigInteger>(), new HashMap<String, String>().values() };
      for (Collection<?> c : collections)
          System.out.println(classify(c));
      ```

  - type: predict
    prompt: What does it print?
    options:
      - text: "`Unknown Collection`, three times"
        correct: true
      - text: "`Set`, `List`, `Unknown Collection`"
        feedback: That's what the author hoped. But which overload runs is decided by the *compile-time* type of `c`.
    explanation: "`c` is declared as `Collection<?>`, so the compiler picks `classify(Collection<?>)` every time."
    details: |
      Overloading is resolved at compile time from the declared types of the arguments.
      In the loop, the variable `c` is declared as `Collection<?>`, so the compiler chooses `classify(Collection<?>)` for every call — the run-time classes `HashSet` and `ArrayList` never matter.
      Overriding is the opposite: the method runs based on the object's run-time class.
      Code that needs run-time dispatch should use a single method with `instanceof` checks or a pattern-matching switch.

  - type: explanation
    title: Chosen at compile time
    body: |
      Overloads are picked from the declared types.
      Overrides are picked from the actual object.
      So overloading can surprise you.

  - type: match
    prompt: Overloading or overriding?
    pairs:
      - left: Which method runs is chosen at compile time, from the declared types of the arguments
        right: Overloading
      - left: Which method runs is chosen at run time, from the actual class of the object
        right: Overriding

  - type: predict
    prompt: What do the set and the list contain afterwards?
    code: |
      Set<Integer> set = new TreeSet<>();
      List<Integer> list = new ArrayList<>();
      for (int i = -3; i < 3; i++) { set.add(i); list.add(i); }
      for (int i = 0; i < 3; i++) { set.remove(i); list.remove(i); }
    language: java
    options:
      - text: "set `[-3, -2, -1]`, list `[-2, 0, 2]`"
        correct: true
      - text: "Both `[-3, -2, -1]`"
        feedback: "`list.remove(i)` with an `int` picks `remove(int index)`, removing by position, not by value."
    explanation: "Fix it with `list.remove((Integer) i)` — and the confusion came from autoboxing plus an overload."
    details: |
      `Set` has only `remove(Object)`, so `i` is boxed and the set removes the values 0, 1 and 2, leaving `[-3, -2, -1]`.
      `List` has two overloads, `remove(int index)` and `remove(Object o)`, and the compiler prefers `remove(int)` because it needs no boxing.
      So the list removes the elements at indexes 0, 1 and 2 as it shrinks: first -3, then -1 (now at index 1), then 1 (now at index 2), leaving `[-2, 0, 2]`.
      Casting with `remove((Integer) i)` selects the object overload.

  - type: explanation
    title: Use different names
    body: |
      Avoid overloads with the same number of parameters.
      Name them differently, like `writeInt` and `writeLong`.

  - type: choice
    prompt: What's a safe, conservative policy?
    options:
      - text: Never export two overloadings with the same number of parameters — give the methods different names instead, like `writeInt` and `writeLong`
        correct: true
      - text: Overload freely; the compiler sorts it out
        feedback: The compiler's choice may not be the one readers expect.
    explanation: For constructors, where names can't differ, consider static factories instead.
