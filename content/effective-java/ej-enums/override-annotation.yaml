title: Always use @Override
summary: The annotation turns "I meant to override" into something the compiler checks.
duration: 4
tags: [java, effective java, annotations, override, overloading, equals]
sources:
  - { book: effective-java, ref: "Item 40" }
steps:
  - type: explanation
    title: A missed override
    body: |
      A bigram is a pair of letters. This set should hold 26 of them.

      ```java
      public class Bigram {
          private final char first, second;
          public Bigram(char first, char second) { this.first = first; this.second = second; }
          public boolean equals(Bigram b) { return b.first == first && b.second == second; }
          public int hashCode() { return 31 * first + second; }
      }

      Set<Bigram> s = new HashSet<>();
      for (int i = 0; i < 10; i++)
          for (char ch = 'a'; ch <= 'z'; ch++)
              s.add(new Bigram(ch, ch));
      System.out.println(s.size());
      ```

      Look closely at the parameter type of `equals`.

  - type: predict
    prompt: What does it print?
    options:
      - text: "260"
        correct: true
      - text: "26"
        feedback: "That's what the author intended. Look closely at the parameter type of `equals`."
      - text: "52"
        feedback: "Every one of the 260 objects is distinct to the set."
    hints:
      - "`HashSet` calls `equals(Object)`. Which method did `Bigram` define?"
    explanation: "`equals(Bigram)` **overloads** `equals(Object)` rather than overriding it, so the set uses identity — all 260 objects are distinct."

  - type: explanation
    title: "@Override catches it"
    body: |
      Put `@Override` on every method meant to override.
      If nothing is overridden, the compiler reports an error.
      It costs nothing and prevents silent bugs.

  - type: choice
    prompt: How would `@Override` have helped?
    options:
      - text: "`@Override public boolean equals(Bigram b)` fails to compile — there's no such method to override"
        correct: true
      - text: It would make the method override automatically
        feedback: Annotations don't change the method; they let the compiler check your intent.

  - type: blank
    prompt: The fixed signature.
    template: "@Override public boolean equals([[Object]] o)"
    code: true

  - type: choice
    prompt: Where can you skip `@Override`?
    options:
      - text: In a concrete class overriding an abstract method — the compiler already complains if it's missing
        correct: true
      - text: Anywhere the method is short
    explanation: Even there it does no harm; using it everywhere is the simplest habit.
