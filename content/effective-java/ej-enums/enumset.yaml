title: EnumSet instead of bit fields
summary: The speed of bit flags with the clarity and safety of a Set.
duration: 4
tags: [java, effective java, enums, enumset, bit fields, flags]
sources:
  - { book: effective-java, ref: "Item 36" }
steps:
  - type: explanation
    title: Bit fields combine flags
    body: |
      Each flag is a power of two.

      ```java
      static final int STYLE_BOLD      = 1 << 0; // 1
      static final int STYLE_ITALIC    = 1 << 1; // 2
      static final int STYLE_UNDERLINE = 1 << 2; // 4
      ```

      OR them together to make a set.
      But the result prints as a mystery number.

  - type: predict
    prompt: |
      What does `STYLE_BOLD | STYLE_UNDERLINE` evaluate to?
    code: |
      static final int STYLE_BOLD      = 1 << 0;
      static final int STYLE_ITALIC    = 1 << 1;
      static final int STYLE_UNDERLINE = 1 << 2;
    language: java
    options:
      - text: "5"
        correct: true
      - text: "4"
        feedback: "That's STYLE_UNDERLINE alone; `|` sets both bits."
      - text: "1"
        feedback: "That's STYLE_BOLD alone; `|` sets both bits."
      - text: "3"
        feedback: "That would be BOLD | ITALIC (1 | 2)."
    hints:
      - 1 | 4 in binary is 001 | 100.
    explanation: 101 in binary — 5. Readable to a computer, not to a person reading a log.
    details: |
      Each style constant is a power of two — `BOLD = 1 << 0` is 1, `UNDERLINE = 1 << 2` is 4 — so each occupies its own bit.
      OR-ing them sets both bits, giving binary 101, which is 5.
      It's compact and fast, but a 5 in a log or debugger tells you nothing, and nothing stops passing an unrelated int.
      `EnumSet` stores the same bits internally while giving you readable output and type safety.

  - type: explanation
    title: EnumSet is the modern way
    body: |
      `EnumSet.of(BOLD, ITALIC)` reads clearly.
      Inside, it's a bit field — just as fast.
      Accept a `Set<Style>` in your API.

  - type: blank
    prompt: The EnumSet version.
    template: "text.applyStyles([[EnumSet]].of(Style.BOLD, Style.ITALIC));"
    code: true
    explanation: Internally, an EnumSet of up to 64 constants is a single `long` bit vector — as fast as the hand-written version.

  - type: choice
    prompt: |
      `Text.applyStyles` takes the set of styles to apply, where `Style` is an enum (`BOLD`, `ITALIC`, …). What should its parameter type be?
    options:
      - text: "`Set<Style>` — clients usually pass an EnumSet, but other sets work too"
        correct: true
      - text: "`EnumSet<Style>`"
        feedback: Accepting the interface is more flexible and costs nothing.
    explanation: Accept interfaces, not implementations (Item 64).

  - type: choice
    prompt: What's EnumSet's one notable weakness?
    options:
      - text: There's no built-in way to create an *immutable* EnumSet — wrap it with `Collections.unmodifiableSet`
        correct: true
      - text: It's slower than a HashSet
        feedback: It's much faster.
