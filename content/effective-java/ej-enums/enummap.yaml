title: EnumMap instead of ordinal indexing
summary: Arrays indexed by ordinal() are unchecked and fragile — EnumMap is the safe, equally fast alternative.
duration: 5
tags: [java, effective java, enums, enummap, arrays, ordinal]
sources:
  - { book: effective-java, ref: "Item 37" }
steps:
  - type: explanation
    title: "Don't index arrays by ordinal"
    body: |
      `array[e.ordinal()]` looks efficient.
      But the compiler can't check the index.
      Use the wrong one, and you silently get wrong data.

  - type: explanation
    title: EnumMap is safe and fast
    body: |
      `EnumMap` is a map keyed by enum constants.
      Inside, it's an array indexed by ordinal.
      So it's just as fast — with type safety.
      For two-level lookups, nest `EnumMap`s.

  - type: blank
    prompt: The EnumMap version.
    template: |
      Map<LifeCycle, Set<Plant>> byLifeCycle = new [[EnumMap]]<>(LifeCycle.class);
      for (LifeCycle lc : LifeCycle.values()) byLifeCycle.put(lc, new HashSet<>());
      for (Plant p : garden) byLifeCycle.get(p.lifeCycle).add(p);
    code: true
    explanation: The constructor takes the key type's `Class` object — a bounded type token — so the map knows its keys at run time.

  - type: choice
    prompt: Why is EnumMap about as fast as the ordinal-indexed array?
    options:
      - text: Internally it *is* an array indexed by ordinal — the danger is hidden behind a type-safe Map
        correct: true
      - text: It uses hashing with perfect hash codes
        feedback: No hashing at all; that's part of why it's fast.
    details: |
      `EnumMap` stores its values in an array indexed by each key's `ordinal()`, which is exactly what a hand-written ordinal-indexed array does.
      The difference is safety: the map's keys are typed, so you can't index with the wrong enum or an arbitrary int, and you never touch `ordinal()` yourself.
      It also prints readably and works with the `Map` API. You get the speed of the array without its fragility.

  - type: choice
    prompt: "Grouping with streams: `Collectors.groupingBy(p -> p.lifeCycle)` returns a HashMap. How do you get an EnumMap?"
    options:
      - text: Use the three-argument `groupingBy`, passing `() -> new EnumMap<>(LifeCycle.class)` as the map factory
        correct: true
      - text: You can't — streams always produce HashMaps
    explanation: "`groupingBy(classifier, mapFactory, downstream)` lets you choose the map implementation."

  - type: choice
    prompt: "Phase transitions — SOLID to LIQUID is MELT, and so on — are stored in a 2-D array indexed by two ordinals. What's the better representation?"
    options:
      - text: "A nested `EnumMap<Phase, EnumMap<Phase, Transition>>`, built from the transitions' own from/to fields"
        correct: true
      - text: A bigger array
        feedback: Adding a phase means getting a larger, error-prone table exactly right.
    explanation: Adding a new phase (PLASMA, say) then means adding a constant and its transitions — nothing else.
