title: Enums instead of int constants
summary: Enums are type-safe, printable, and full classes — with fields, methods and constant-specific behaviour.
duration: 6
tags: [java, effective java, enums, constants, strategy, type safety]
sources:
  - { book: effective-java, ref: "Item 34" }
steps:
  - type: explanation
    title: int constants are unsafe
    body: |
      `APPLE_FUJI = 0` and `ORANGE_NAVEL = 0` are both just `int`s.
      Nothing stops you passing an orange as an apple.
      They print as bare numbers.

  - type: explanation
    title: Enums are real types
    body: |
      An `Apple` parameter accepts only `Apple` values.
      Enums print their names.
      `values()` lists every constant.

  - type: choice
    prompt: Which are advantages of a Java `enum` over int constants?
    options:
      - text: Compile-time type safety — an `Apple` parameter accepts only `Apple` values
        correct: true
      - text: Readable `toString` output, and `values()` to iterate over all constants
        correct: true
      - text: Constants can be added or reordered without recompiling clients
        correct: true
      - text: They use less memory than ints
        feedback: Each constant is an object; memory isn't the point.

  - type: explanation
    title: Enums can carry behaviour
    body: |
      Each constant can have data and its own method body.

      ```java
      PLUS("+") { double apply(double x, double y) { return x + y; } },
      ```

      Make the method abstract, and every constant must implement it.

  - type: choice
    prompt: "Payroll: weekdays and weekends compute overtime differently. Instead of a switch in `PayrollDay`, what's the more robust design?"
    options:
      - text: A strategy enum — each day is constructed with a private `PayType` enum (WEEKDAY or WEEKEND) that holds the calculation
        correct: true
      - text: One constant-specific method per day, copying the code
        feedback: Duplicates the weekday logic five times.
      - text: A switch with a default case
        feedback: A new day (a holiday, say) would silently get the default pay.
    explanation: The day must choose a pay type when it's declared, so a new constant can't forget it.

  - type: blank
    prompt: Iterate over every constant.
    template: "for (Planet p : Planet.[[values]]()) System.out.println(p);"
    code: true

  - type: choice
    prompt: When should you use enums?
    options:
      - text: Whenever you need a set of constants whose members are known at compile time
        correct: true
      - text: Only for the days of the week and similar natural sets
        feedback: Menu choices, operation codes, command-line flags — anything known at compile time qualifies.
    explanation: The set doesn't have to stay fixed forever — enums are designed to evolve compatibly.
