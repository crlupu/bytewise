title: Instance fields, not ordinals
summary: Never derive a value from an enum constant's position — store it in a field.
duration: 4
tags: [java, effective java, enums, ordinal, fields]
sources:
  - { book: effective-java, ref: "Item 35" }
steps:
  - type: explanation
    title: ordinal is just a position
    body: |
      `ordinal()` is a constant's position in the declaration.
      Deriving meaning from it is fragile.
      Reorder the constants, and the meaning changes.

  - type: choice
    prompt: |
      What's wrong with deriving the number of musicians from the ordinal, like this?
    code: |
      public enum Ensemble {
          SOLO, DUET, TRIO, QUARTET, QUINTET, SEXTET, SEPTET, OCTET, NONET, DECTET;
          public int numberOfMusicians() { return ordinal() + 1; }
      }
    language: java
    options:
      - text: Reordering the constants breaks it
        correct: true
      - text: You can't add a second constant with the same count, like a DOUBLE_QUARTET alongside OCTET
        correct: true
      - text: You can't add a value without filling every gap — a TRIPLE_QUARTET (12) needs constants for 9, 10 and 11
        correct: true
      - text: "`ordinal()` is slow"
        feedback: It's just a field read; the problem is meaning, not speed.
    details: |
      `ordinal()` returns the constant's position in the declaration, so `numberOfMusicians()` written as `ordinal() + 1` silently depends on the order of the source code.
      Reorder constants and every count changes; two ensembles with eight musicians can't both exist, since positions are unique; and a 12-musician ensemble needs dummy constants for 9 to 11.
      Storing the count in a constructor parameter and a `final` field makes each constant say what it means, independent of order.

  - type: explanation
    title: Store values in fields
    body: |
      Give the enum a field, set in its constructor.

      ```java
      SOLO(1), DUET(2), OCTET(8);
      ```

      Leave `ordinal()` to `EnumSet` and `EnumMap`.

  - type: blank
    prompt: |
      Give the `Ensemble` enum a musician count stored in a field, instead of deriving it from `ordinal()`.
    template: |
      SOLO(1), DUET(2), TRIO(3), QUARTET(4), QUINTET(5), OCTET(8), DOUBLE_QUARTET(8);
      private final int [[numberOfMusicians]];
      Ensemble(int size) { this.numberOfMusicians = size; }
    code: true

  - type: choice
    prompt: What is `ordinal()` actually for?
    options:
      - text: General-purpose enum-based data structures like `EnumSet` and `EnumMap`
        correct: true
      - text: Assigning numbers to constants for your own logic
        feedback: That's precisely the misuse.
    explanation: Most programmers will never need to call it.

  - type: predict
    prompt: |
      What does `Ensemble.TRIO.ordinal()` return?
    code: |
      enum Ensemble {
          SOLO(1), DUET(2), TRIO(3), QUARTET(4), OCTET(8);
          private final int numberOfMusicians;
          Ensemble(int size) { this.numberOfMusicians = size; }
      }
    language: java
    options:
      - text: "2"
        correct: true
      - text: "3"
        feedback: "Ordinals start at 0 — SOLO is 0."
      - text: "1"
        feedback: "Ordinals start at 0, so DUET is 1 and TRIO is 2."
    explanation: SOLO 0, DUET 1, TRIO 2 — which is exactly why "+ 1" logic is so easy to get wrong.
