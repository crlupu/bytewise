title: Prefer alternatives to Java serialization
summary: Deserializing untrusted bytes can run attacker-chosen code paths — the safest serialization is none at all.
duration: 5
tags: [java, effective java, serialization, security, deserialization, json, protobuf]
sources:
  - { book: effective-java, ref: "Item 85" }
steps:
  - type: explanation
    title: Deserialization is dangerous
    body: |
      `readObject` can create almost any class on the classpath.
      Attackers chain innocent methods into exploits.
      Small streams can even take forever to read.

  - type: choice
    prompt: Besides gadget chains, what else can a malicious stream do?
    options:
      - text: A **deserialization bomb** — a small stream, like deeply nested `HashSet`s, that takes effectively forever to deserialize
        correct: true
      - text: Nothing, as long as the classes are from the JDK
        feedback: Bombs can be built from JDK classes alone.
    explanation: A stream of about 5,700 bytes built from nested HashSets can keep `hashCode` computations running practically forever.
    details: |
      Deserializing a `HashSet` calls `hashCode` on every element to rebuild the hash table.
      A stream can describe sets nested inside each other many levels deep in very few bytes, and computing the hash code of such a structure repeats work exponentially.
      A small input can therefore keep a server's CPU busy practically forever — a denial-of-service with no exploit code at all.
      This is why the safest policy is not to deserialize untrusted data.

  - type: explanation
    title: Use something else
    body: |
      Use JSON or Protocol Buffers instead.
      Never deserialize untrusted data.
      If you must, allow-list the classes.

  - type: choice
    prompt: What's the best way to avoid serialization exploits?
    options:
      - text: Never deserialize anything — use a cross-platform structured format such as JSON or Protocol Buffers instead
        correct: true
      - text: Only deserialize data from your own database
        feedback: Trusting the source helps, but data stores can be compromised; avoiding Java serialization removes the risk.
    explanation: Those formats are much simpler, and support only data, not arbitrary object graphs and their behaviour.

  - type: match
    prompt: Match each defence to how it helps.
    pairs:
      - left: Use JSON or protobuf
        right: Removes the attack surface entirely
      - left: Never deserialize untrusted data
        right: Keeps attackers' bytes away from `readObject`
      - left: "`ObjectInputFilter` (Java 9)"
        right: Allow-lists the classes a stream may contain

  - type: blank
    prompt: Complete the advice.
    template: "If you can't avoid Java serialization, use an [[allowlist|whitelist|allow-list]] of classes, not a blocklist."
    explanation: A blocklist only stops the dangers already known.
