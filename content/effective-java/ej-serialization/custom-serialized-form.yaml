title: Consider a custom serialized form
summary: Accept the default form only when an object's physical representation is its logical content.
duration: 5
tags: [java, effective java, serialization, transient, writeobject, readobject]
sources:
  - { book: effective-java, ref: "Item 87" }
steps:
  - type: explanation
    title: The default form copies internals
    body: |
      The default form writes every non-transient field.
      Fine when the fields are the logical data, like a name.
      Bad for a linked list, which writes every node and link.
    diagram:
      kind: objects
      vars:
        - { name: list, to: l }
      objects:
        - { id: l, type: StringList, fields: [{ name: size, value: "3" }, { name: head, to: n1 }] }
        - { id: n1, type: Entry, fields: [{ name: data, value: "\"a\"" }, { name: next, to: n2 }] }
        - { id: n2, type: Entry, fields: [{ name: data, value: "\"b\"" }, { name: next, to: n3 }] }
        - { id: n3, type: Entry, fields: [{ name: data, value: "\"c\"" }, { name: next }] }
      caption: "The default form writes every Entry and every link — the data is just \"a\", \"b\", \"c\"."

  - type: choice
    prompt: Which are disadvantages of using the default form for that linked list?
    options:
      - text: The internal node structure becomes part of the exported API forever
        correct: true
      - text: It uses more space and time than needed
        correct: true
      - text: It can overflow the stack — the default traversal recurses through the list
        correct: true
      - text: It can't be serialized at all
        feedback: It can — that's what makes the poor choice easy to make.
    details: |
      The default serialized form records every field of every object reachable from the list, so the internal doubly linked nodes become part of the class's permanent format.
      Changing to a different internal structure later would break compatibility with saved data.
      The form also wastes space on links that are recomputable, and serializing a long list walks it recursively, which can overflow the stack.
      A custom form that writes just the size and the strings avoids all three.

  - type: explanation
    title: Write the logical data
    body: |
      Mark internal fields `transient`.
      In `writeObject`, write just the size and the strings.
      In `readObject`, rebuild the list from them.
      Still call the default methods, for future fields.

  - type: blank
    prompt: Exclude a field from the default serialized form.
    template: "private [[transient]] Entry head = null;"
    code: true
    explanation: Mark every field transient unless its value is part of the object's logical state.

  - type: choice
    prompt: |
      A class with a custom serialized form marks all its fields `transient` and writes its data in `writeObject`. Why still call `defaultWriteObject` and `defaultReadObject`?
    options:
      - text: It lets later versions add non-transient fields while staying compatible in both directions
        correct: true
      - text: It's required by the compiler
    explanation: The serialization spec requires them anyway, and they keep the form flexible.
