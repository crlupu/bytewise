title: Serialization proxies
summary: Serialize a simple stand-in for the logical state, and rebuild the real object through its public API.
duration: 5
tags: [java, effective java, serialization, proxy, writereplace, readresolve]
sources:
  - { book: effective-java, ref: "Item 90" }
steps:
  - type: explanation
    title: Serialize a proxy instead
    body: |
      A small private class holds the logical state.
      `writeReplace` swaps it in on serialization.
      Its `readResolve` rebuilds the real object.
    diagram:
      classes:
        - { name: Period, kind: final, fields: ["- final start", "- final end"], methods: ["writeReplace()"] }
        - { name: SerializationProxy, fields: [start, end], methods: ["readResolve()"] }
      relations:
        - { from: Period, to: SerializationProxy, type: inner, label: private static }
      caption: "The proxy is written instead; readResolve calls new Period(start, end)."

  - type: match
    prompt: Match each method to its role.
    pairs:
      - left: "`writeReplace` in the enclosing class"
        right: Swaps in a proxy whenever an instance is serialized
      - left: "`readObject` in the enclosing class"
        right: Throws, so a forged stream of the real class is rejected
      - left: "`readResolve` in the proxy"
        right: Rebuilds the real object using only its public API

  - type: explanation
    title: Built through the constructor
    body: |
      The real object is always made by its normal constructor.
      So all its checks run.
      It doesn't suit classes that clients extend.

  - type: choice
    prompt: |
      In the serialization proxy pattern, `writeReplace` writes a small proxy holding the logical state, and the proxy's `readResolve` rebuilds the object. Why is this safer than a defensive `readObject`?
    options:
      - text: Instances are always created through the ordinary constructor or factory, so invariants are checked by the code that already checks them
        correct: true
      - text: The proxy is encrypted
    explanation: And the real class's fields can stay `final`.
    details: |
      With a serialization proxy, the serialized form is a simple private nested class holding just the logical state.
      On deserialization, its `readResolve` rebuilds the real object through the public constructor or factory, so every invariant check and defensive copy runs as usual.
      No instance of the real class is ever created from raw bytes, and its fields can stay `final`.
      Forged streams aimed at the real class are rejected, because its `readObject` simply throws.

  - type: choice
    prompt: "`EnumSet` uses this pattern. What does it gain?"
    options:
      - text: An EnumSet serialized as a small set can be deserialized as a large-set implementation, if the enum has grown
        correct: true
      - text: Nothing in particular
    explanation: The proxy records just the element type and elements; `EnumSet.noneOf` picks the right implementation on the way back.

  - type: choice
    prompt: Where does the proxy pattern not fit?
    options:
      - text: Classes that clients extend, and object graphs with cycles
        correct: true
      - text: Immutable classes
        feedback: Those are its ideal use.
    explanation: It's also somewhat slower than defensive copying.
