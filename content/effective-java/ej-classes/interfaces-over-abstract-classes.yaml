title: Prefer interfaces to abstract classes
summary: Interfaces allow mixins and non-hierarchical types; a skeletal implementation gives you the convenience of both.
duration: 5
tags: [java, effective java, interfaces, abstract classes, mixins, skeletal implementation]
sources:
  - { book: effective-java, ref: "Item 20" }
steps:
  - type: explanation
    title: Interfaces are more flexible
    body: |
      A class can extend only one abstract class.
      It can implement any number of interfaces.
      So existing classes are easy to retrofit with an interface.
      Interfaces are ideal for mixins like `Comparable`.

  - type: choice
    prompt: Which are advantages of interfaces over abstract classes?
    options:
      - text: Existing classes can be retrofitted to implement them
        correct: true
      - text: They're ideal for mixins — optional behaviour like `Comparable`
        correct: true
      - text: They allow non-hierarchical types, such as a `SingerSongwriter` that is both a `Singer` and a `Songwriter`
        correct: true
      - text: They can hold instance fields
        feedback: Interfaces can't have instance fields; that's an abstract class's advantage.

  - type: explanation
    title: Add a skeletal implementation
    body: |
      Pair the interface with an abstract class that does most of the work.
      By convention it's named `AbstractList`, `AbstractSet` and so on.
      Implementers write just a few primitive methods.

      ```java
      new AbstractList<Integer>() {
          public Integer get(int i) { return a[i]; }
          public int size() { return a.length; }
      };
      ```

  - type: match
    prompt: Match each interface to its skeletal implementation.
    pairs:
      - left: "`List`"
        right: "`AbstractList`"
      - left: "`Set`"
        right: "`AbstractSet`"
      - left: "`Map`"
        right: "`AbstractMap`"
      - left: "`Collection`"
        right: "`AbstractCollection`"

  - type: choice
    prompt: Why not just put all the shared code into default methods on the interface?
    options:
      - text: Default methods can't have state, and can't provide `equals`, `hashCode` or `toString`
        correct: true
      - text: Interfaces can't have method bodies
        feedback: Since Java 8 they can — default and static methods.
    explanation: Defaults help, but the skeletal class can hold fields and override `Object`'s methods.
    details: |
      Interfaces can't declare instance fields, so any shared behaviour needing state has to live elsewhere.
      And an interface may not provide default implementations of `equals`, `hashCode` or `toString` — `Object`'s versions always win.
      A skeletal implementation class like `AbstractList` fills that gap: implementers extend it to get state and the `Object` methods for free, while the interface still defines the type.
