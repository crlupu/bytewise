title: Design interfaces for posterity
summary: Default methods let you add to an interface — but not without risk to every existing implementation.
duration: 4
tags: [java, effective java, interfaces, default methods, api evolution, compatibility]
sources:
  - { book: effective-java, ref: "Item 21" }
steps:
  - type: explanation
    title: Adding to an interface
    body: |
      Before Java 8, adding a method to an interface broke every implementation. Default methods made it possible — the
      new method gets a body every implementation inherits.

      But the default is written without knowing the implementations. Java 8 added `removeIf` to `Collection`:

      ```java
      default boolean removeIf(Predicate<? super E> filter) {
          boolean result = false;
          for (Iterator<E> it = iterator(); it.hasNext(); ) {
              if (filter.test(it.next())) { it.remove(); result = true; }
          }
          return result;
      }
      ```

  - type: choice
    prompt: A synchronized collection wrapper locks a mutex in every method. What happens when someone calls the inherited `removeIf`?
    options:
      - text: It runs without taking the lock, so concurrent use can corrupt the collection
        correct: true
      - text: It takes the lock automatically
        feedback: The default method knows nothing about the wrapper's locking.
      - text: It doesn't compile
        feedback: It compiles fine — that's what makes it dangerous.
    explanation: The default can't preserve invariants it didn't know existed. Apache Commons' `SynchronizedCollection` was a real victim.

  - type: choice
    prompt: What's the lesson for designing an interface?
    options:
      - text: Get it right before release — write several implementations and clients; you may not be able to fix it later
        correct: true
      - text: Ship quickly, and add default methods to fix it later
        feedback: Defaults are a last resort for evolution, not a design tool.

  - type: blank
    prompt: Complete the warning.
    template: "Existing implementations may compile without error or warning, yet [[fail]] at run time when a new [[default]] method is added."

  - type: choice
    prompt: When are default methods safe and appropriate?
    options:
      - text: When designing a new interface, to provide standard implementations alongside it
        correct: true
      - text: To remove methods from an interface
        feedback: Defaults can't remove methods.
