title: Class hierarchies over tagged classes
summary: A tag field that switches behaviour is a poor imitation of subtypes.
duration: 5
tags: [java, effective java, tagged class, inheritance, sealed, polymorphism]
sources:
  - { book: effective-java, ref: "Item 23" }
steps:
  - type: explanation
    title: Tagged classes do too much
    body: |
      A tagged class uses a field to say which kind it is.

      ```java
      enum Shape { RECTANGLE, CIRCLE }
      final Shape shape;
      double length, width, radius; // only some are used
      ```

      Every method switches on the tag.
      Every instance carries fields it doesn't need.

  - type: choice
    prompt: Which are problems with tagged classes?
    options:
      - text: Irrelevant fields in every instance, which can't all be `final` or properly initialised
        correct: true
      - text: Adding a flavour means editing every switch — and forgetting one fails only at run time
        correct: true
      - text: The type of an instance gives no clue to its flavour
        correct: true
      - text: They can't be immutable at all
        feedback: They can be — just awkwardly.

  - type: explanation
    title: Use a class hierarchy instead
    body: |
      Make an abstract root with abstract methods.
      Give each kind its own subclass, with only its own fields.
      Forget to implement a method, and it won't compile.
      `sealed` lets you list the allowed subclasses.
    diagram:
      classes:
        - { name: Figure, kind: abstract, methods: ["abstract area()"] }
        - { name: Rectangle, fields: [length, width], methods: ["area()"] }
        - { name: Circle, fields: [radius], methods: ["area()"] }
        - { name: Square }
      relations:
        - { from: Rectangle, to: Figure, type: extends }
        - { from: Circle, to: Figure, type: extends }
        - { from: Square, to: Rectangle, type: extends }
      caption: Each class carries only the fields it needs.

  - type: order
    prompt: Put the steps of converting a tagged class into a hierarchy in order.
    items:
      - Make an abstract root class with an abstract method for each tag-dependent behaviour
      - Move code that doesn't depend on the tag, and shared fields, into the root
      - Make a concrete subclass per flavour, with only the fields it needs
      - Implement each abstract method in each subclass

  - type: choice
    prompt: A tagged `Figure` class has become an abstract `Figure` with a subclass per shape. What happens if someone adds `Triangle` but forgets to implement `area()`?
    options:
      - text: It doesn't compile — the abstract method must be implemented
        correct: true
      - text: It throws `AssertionError` when `area()` is called
        feedback: That was the tagged class's behaviour. The hierarchy catches it at compile time.
    details: |
      In a tagged class, `area()` is a switch over the tag, and nothing forces a new tag value to get a case — the gap only shows up at run time, often as a default branch throwing an exception.
      In a hierarchy, `area()` is abstract in the root, so a new subclass that doesn't implement it is rejected by the compiler.
      The type system now tracks which flavours exist and what each must provide, which is exactly the bookkeeping the tagged class left to discipline.

  - type: blank
    prompt: In modern Java you can also close the hierarchy to known subtypes.
    template: "abstract [[sealed]] class Figure [[permits]] Rectangle, Circle { abstract double area(); }"
    code: true
    explanation: Sealed classes (Java 17) also let `switch` check that every subtype is handled.
