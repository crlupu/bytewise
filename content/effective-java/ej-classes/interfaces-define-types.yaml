title: Use interfaces only to define types
summary: The constant interface antipattern leaks implementation details into your API — use classes or enums for constants.
duration: 4
tags: [java, effective java, interfaces, constants, static import]
sources:
  - { book: effective-java, ref: "Item 22" }
steps:
  - type: explanation
    title: An interface is a type
    body: |
      Implementing an interface says what clients can do with you.
      A constant interface says nothing of the kind.

      ```java
      public interface PhysicalConstants {
          double AVOGADROS_NUMBER = 6.022_140_857e23;
      }
      ```

      Classes implement it only to skip the prefix.

  - type: choice
    prompt: Why is the constant interface a poor use of interfaces?
    options:
      - text: Using constants is an implementation detail, but implementing the interface makes it part of the class's public API
        correct: true
      - text: Interfaces can't hold constants
        feedback: They can — that's why the antipattern exists.
      - text: It's slower
    explanation: Worse, all subclasses inherit the namespace pollution, and the class can never stop implementing it without breaking compatibility.

  - type: explanation
    title: Better homes for constants
    body: |
      Put a constant in the class it belongs to.
      Use an enum for a fixed set of values.
      Use a utility class for the rest.
      `import static` removes the prefix without implementing anything.

  - type: match
    prompt: Match each kind of constant to its better home.
    pairs:
      - left: Constants tied to an existing class
        right: Add them to that class (like `Integer.MAX_VALUE`)
      - left: A fixed set of related values
        right: An enum
      - left: Miscellaneous constants
        right: A noninstantiable utility class

  - type: blank
    prompt: Avoid the qualifier without implementing anything.
    template: "import [[static]] com.example.PhysicalConstants.*;"
    code: true
    explanation: A static import gives the short names, without making them part of any API.

  - type: choice
    prompt: In a numeric literal like `6.022_140_857e23`, what are the underscores?
    options:
      - text: Digit separators, ignored by the compiler and allowed since Java 7
        correct: true
      - text: A syntax error
