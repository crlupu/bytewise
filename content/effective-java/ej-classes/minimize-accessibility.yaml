title: Minimize accessibility
summary: Make every class and member as inaccessible as possible — encapsulation is what lets you change things later.
duration: 5
tags: [java, effective java, encapsulation, access modifiers, information hiding, modules]
sources:
  - { book: effective-java, ref: "Item 15" }
steps:
  - type: explanation
    title: Hide everything you can
    body: |
      Hidden internals can change without breaking anyone.
      Everything public is a promise you keep forever.
      So make each class and member as inaccessible as possible.

  - type: order
    prompt: Order the access levels from most restrictive to least.
    items:
      - "`private` — only the top-level class that declares it"
      - package-private (no modifier) — any class in the same package
      - "`protected` — the package, plus subclasses anywhere"
      - "`public` — everywhere"

  - type: explanation
    title: Watch for leaks through fields
    body: |
      A `public static final` array is still mutable.
      Anyone can change its elements.
      Return a copy, or an unmodifiable list, instead.
      Public instance fields also make a class unsafe for threads.

  - type: predict
    prompt: What's the flaw here?
    code: |
      public static final Thing[] VALUES = { ... };
    language: java
    options:
      - text: The array is mutable — anyone can replace its elements, even though the field is final
        correct: true
      - text: Nothing — it's `final`, so it can't change
        feedback: "`final` stops the field pointing at another array; the array's contents are still writable."
      - text: Arrays can't be static
    explanation: Expose `Collections.unmodifiableList(Arrays.asList(PRIVATE_VALUES))`, or return a copy from a method.
    details: |
      `final` only stops the field from pointing to a different array. The array's elements can still be overwritten, so any client can do `VALUES[0] = null` and corrupt every other user.
      Returning a nonzero-length array from a public accessor has the same problem.
      The fixes either hand out a read-only view, `Collections.unmodifiableList(Arrays.asList(PRIVATE_VALUES))`, or a fresh copy on each call; `List.copyOf` or `List.of` work just as well in modern Java.

  - type: choice
    prompt: A method overrides one from a superclass. Can it be less accessible than the original?
    options:
      - text: No — the compiler forbids it, so instances of the subclass are usable wherever the superclass is
        correct: true
      - text: Yes, any level is allowed
    explanation: That's the one rule that forces wider access than you'd choose.

  - type: choice
    prompt: Is it fine to make a private field package-private so a test can read it?
    options:
      - text: Package-private for testing is acceptable; going further, to protected or public, is not
        correct: true
      - text: Make it public — tests matter more
        feedback: Tests can live in the same package; public would make the field part of your API.

  - type: blank
    prompt: Complete the rule.
    template: "Instance fields of public classes should rarely be [[public]]; classes with public mutable fields are generally not [[thread-safe|thread safe]]."
