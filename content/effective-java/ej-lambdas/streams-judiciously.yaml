title: Use streams judiciously
summary: Streams make some code beautiful and other code unreadable — knowing which is the skill.
duration: 6
tags: [java, effective java, streams, readability, iteration]
sources:
  - { book: effective-java, ref: "Item 45" }
steps:
  - type: explanation
    title: How a pipeline works
    body: |
      A source, then intermediate steps like `map` and `filter`.
      Then one terminal step, like `collect`.
      Nothing runs until the terminal step.

  - type: predict
    prompt: What does this print?
    code: |
      "Hello world!".chars().forEach(System.out::print);
    language: java
    options:
      - text: "`721011081081113211911111410810033`"
        correct: true
      - text: "`Hello world!`"
        feedback: "`chars()` returns an `IntStream`, so `print(int)` is chosen — each character prints as its number."
      - text: It doesn't compile
    explanation: Fix it with `forEach(x -> System.out.print((char) x))` — or, better, avoid streams for processing `char` values.
    details: |
      `String.chars()` returns an `IntStream`, so each character is passed to `print(int)`, which prints its numeric code: 72 for H, 101 for e, and so on.
      Nothing warns you, because the method reference is a valid `IntConsumer`.
      It's a reminder that Java has no `CharStream`; to print characters, cast — `forEach(c -> System.out.print((char) c))` — or don't use a stream for char processing.

  - type: explanation
    title: "Streams can't do everything"
    body: |
      A lambda can't change local variables.
      It can't `return`, `break` or `continue` an outer loop.
      It can't throw checked exceptions.

  - type: choice
    prompt: Which of these can a code block do, but a lambda in a stream can't?
    options:
      - text: Modify a local variable of the enclosing method
        correct: true
      - text: Return from the enclosing method, or `break`/`continue` an enclosing loop
        correct: true
      - text: Throw a checked exception declared by the method
        correct: true
      - text: Transform each element
        feedback: That's exactly what streams are good at.

  - type: explanation
    title: Use them where they shine
    body: |
      Streams are great for transforming, filtering and grouping.
      Complex loops with early exits read better as loops.
      Name lambda parameters carefully.

  - type: match
    prompt: Streams are a good fit when you want to…
    pairs:
      - left: Uniformly transform sequences of elements
        right: "`map`"
      - left: Keep only some elements
        right: "`filter`"
      - left: Combine elements with one operation
        right: "`reduce`, `sum`, `max`"
      - left: Gather elements into a collection, perhaps grouped
        right: "`collect`"
      - left: Find an element satisfying some criterion
        right: "`anyMatch`, `findFirst`"

  - type: choice
    prompt: A loop with several nested conditions and early exits is hard to express as a stream. What should you do?
    options:
      - text: Keep the loop — or combine both, a stream calling well-named helper methods
        correct: true
      - text: Rewrite it as a stream anyway, for consistency
        feedback: There's no rule that all loops become streams. Use whichever reads better.
    explanation: When in doubt, try both and keep the clearer one.

  - type: blank
    prompt: Complete the advice.
    template: "In stream pipelines, careful naming of [[lambda]] parameters is essential, and helper [[methods]] help readability even more than in iterative code."
