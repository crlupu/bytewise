title: Caution with parallel streams
summary: .parallel() can make a pipeline slower, wrong, or hang — it helps only with the right sources and operations.
duration: 5
tags: [java, effective java, streams, parallel, performance, concurrency]
sources:
  - { book: effective-java, ref: "Item 48" }
steps:
  - type: explanation
    title: "parallel() isn't a free speed-up"
    body: |
      This prints the first 20 Mersenne primes:

      ```java
      primes().map(p -> TWO.pow(p.intValueExact()).subtract(ONE))
          .filter(mersenne -> mersenne.isProbablePrime(50))
          .limit(20)
          .forEach(System.out::println);
      ```

      Here `primes()` is `Stream.iterate(TWO, BigInteger::nextProbablePrime)`.

  - type: predict
    prompt: Someone adds `.parallel()` to this pipeline, hoping for a speed-up on a 4-core machine. What happens?
    options:
      - text: It prints nothing and keeps the CPUs busy for a very long time
        correct: true
      - text: It runs about 4× faster
        feedback: The source and the operations are the worst possible case for parallelism.
      - text: It throws an exception
    explanation: |
      The library can't split `Stream.iterate`, and `limit` makes threads compute extra, ever-more-expensive elements
      that will be thrown away.
    details: |
      The pipeline generates Mersenne primes from `Stream.iterate`, whose elements each depend on the previous one, so the work can't be split into independent chunks.
      With `limit(20)`, parallel threads speculatively compute primes beyond the ones needed, and each next candidate is far more expensive than the last.
      The result is all cores busy on work that will be thrown away, and no output for a very long time.
      Parallelism pays off only for sources that split cleanly, like arrays, `ArrayList` or `IntStream.range`.

  - type: explanation
    title: What parallelizes well
    body: |
      Sources that split cheaply: arrays, `ArrayList`, ranges.
      Terminal operations that combine cheaply: `sum`, `count`.
      `Stream.iterate` and `limit` parallelize badly.

  - type: match
    prompt: Good or poor for parallel streams?
    pairs:
      - left: "`ArrayList`, arrays, `IntStream.range`"
        right: Good — cheaply split, with good locality of reference
      - left: "`Stream.iterate`"
        right: Poor — each element depends on the previous one
      - left: "`limit`"
        right: Poor — may compute and discard extra elements
      - left: "`count`, `sum`, `anyMatch`"
        right: Good terminal operations — they combine cheaply

  - type: choice
    prompt: Besides being slow, how else can parallel streams go wrong?
    options:
      - text: They can give wrong results if functions aren't associative, non-interfering and stateless
        correct: true
      - text: They never go wrong, only slow
    explanation: Use `parallel()` only after measuring a real speed-up on realistic data — and keep correctness requirements in mind.
    details: |
      The library splits the data, processes chunks independently and combines the partial results, assuming your functions don't care about order.
      If a reduction isn't associative, like subtraction, or a lambda reads or writes shared state, results can differ from run to run.
      These bugs don't throw; they silently give wrong answers. Sequential and parallel results should be identical — check that before trusting a parallel pipeline.

  - type: explanation
    title: Measure, and stay correct
    body: |
      Functions must be stateless and non-interfering.
      Otherwise results can be wrong, not just slow.
      Counting primes in a range does speed up well.
      Always measure before keeping `.parallel()`.
