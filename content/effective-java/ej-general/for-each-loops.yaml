title: Prefer for-each loops
summary: No index or iterator to get wrong — especially in nested loops.
duration: 4
tags: [java, effective java, for-each, iterators, loops]
sources:
  - { book: effective-java, ref: "Item 58" }
steps:
  - type: explanation
    title: Index loops invite mistakes
    body: |
      Iterators and indexes add variables you can misuse.
      Calling `next()` in the wrong loop is a classic bug.

  - type: predict
    prompt: "`Face` is an enum with 6 values. How many lines does this print?"
    code: |
      Collection<Face> faces = EnumSet.allOf(Face.class);
      for (Iterator<Face> i = faces.iterator(); i.hasNext(); )
          for (Iterator<Face> j = faces.iterator(); j.hasNext(); )
              System.out.println(i.next() + " " + j.next());
    language: java
    options:
      - text: "6"
        correct: true
      - text: "36"
        feedback: "That was the intent. But `i.next()` is called inside the inner loop, once per inner iteration."
      - text: "It throws `NoSuchElementException`"
        feedback: "Not with equal-sized collections — but it would if the outer one were shorter."
    hints:
      - How many times is `i.next()` called per pass of the inner loop?
    explanation: It prints only the six "doubles" (ONE ONE … SIX SIX) — `i` advances along with `j`. With unequal collections, it would throw `NoSuchElementException`.

  - type: explanation
    title: for-each hides the iterator
    body: |
      `for (Face f : faces)` has nothing to get wrong.
      It works on arrays and anything `Iterable`.
      It's just as fast as an indexed loop.

  - type: blank
    prompt: The for-each version, which can't make that mistake.
    template: |
      for ([[Face]] f1 : faces)
          for (Face f2 : faces)
              System.out.println(f1 + " " + f2);
    code: true

  - type: explanation
    title: "When you can't use it"
    body: |
      Removing elements while looping: use `removeIf`.
      Replacing elements: use an index or list iterator.
      Walking two collections together: use explicit iterators.

  - type: match
    prompt: Where can't you use for-each? Match each case to its alternative.
    pairs:
      - left: Removing selected elements while iterating
        right: "`Collection.removeIf`, or an explicit iterator's `remove`"
      - left: Replacing elements of a list or array
        right: A list iterator or array index, to set each element
      - left: Iterating over several collections in lockstep
        right: Explicit iterators or indexes, advanced together

  - type: choice
    prompt: What does for-each work on?
    options:
      - text: Arrays, and any object implementing `Iterable`
        correct: true
      - text: Only collections
        feedback: Arrays and any `Iterable` work, including your own types.
    explanation: If your type represents a group of elements, consider implementing `Iterable` even if you don't implement `Collection`.

  - type: choice
    prompt: Is for-each slower than an indexed loop over an array?
    options:
      - text: No — it compiles to essentially the same code
        correct: true
      - text: Yes, noticeably
