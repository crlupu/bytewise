title: Minimize the scope of local variables
summary: Declare variables where they're first used — and prefer for loops, which keep their variables to themselves.
duration: 4
tags: [java, effective java, local variables, scope, loops, readability]
sources:
  - { book: effective-java, ref: "Item 57" }
steps:
  - type: explanation
    title: Keep variables close to their use
    body: |
      Declare a variable where you first need it.
      Initialize it in the declaration.
      The less code can see it, the fewer chances to misuse it.

  - type: explanation
    title: Loops limit scope
    body: |
      A `for` loop's variable exists only inside the loop.
      Copy-paste a loop and reuse a name by mistake, and it won't compile.
      A `while` loop's iterator lives on after the loop.

  - type: predict
    prompt: How many times does `doSomethingElse` run, if `c2` has 5 elements?
    code: |
      Iterator<Element> i = c.iterator();
      while (i.hasNext()) doSomething(i.next());

      Iterator<Element> i2 = c2.iterator();
      while (i.hasNext()) doSomethingElse(i2.next());   // copy-paste bug
    language: java
    options:
      - text: "0"
        correct: true
      - text: "5"
        feedback: "Look at the second loop's condition — it tests `i`, which is already exhausted."
      - text: "10"
        feedback: "Look at the second loop's condition — it tests `i`."
    explanation: Zero — the loop silently does nothing. No error, no warning; the bug can go unnoticed for a long time.

  - type: choice
    prompt: |
      How would `for` loops have prevented the bug in this code?
    code: |
      Iterator<Element> i = c.iterator();
      while (i.hasNext()) doSomething(i.next());

      Iterator<Element> i2 = c2.iterator();
      while (i.hasNext()) doSomethingElse(i2.next());   // copy-paste bug
    language: java
    options:
      - text: Each loop's iterator would be scoped to its own loop, so using `i` in the second loop wouldn't compile
        correct: true
      - text: "`for` loops check iterators automatically"
    explanation: "`for (Iterator<Element> i = c.iterator(); i.hasNext(); )` — and in most cases, for-each is even better."

  - type: blank
    prompt: Complete the idiom that keeps a loop's bound in its own scope.
    template: "for (int i = 0, [[n]] = expensiveComputation(); i < n; i++) { ... }"
    code: true
    explanation: The bound is computed once and can't leak out of the loop.

  - type: choice
    prompt: Where should `int total = 0;` go in a 60-line method that uses it only in the last 10 lines?
    options:
      - text: Just before those 10 lines — or better, extract them into their own method
        correct: true
      - text: At the top, so all declarations are together
        feedback: That's a C89 habit; in Java it only widens the scope.
