title: Classes that shouldn't be instantiated
summary: Utility classes need a private constructor — making them abstract doesn't work.
duration: 4
tags: [java, effective java, utility class, constructors]
sources:
  - { book: effective-java, ref: "Item 4" }
steps:
  - type: explanation
    title: Some classes are just static methods
    body: |
      `Math`, `Arrays` and `Collections` only group static methods.
      An instance of them would be meaningless.
      But with no constructor written, Java adds a public default one.

  - type: explanation
    title: A private constructor blocks instances
    body: |
      Declare a private constructor, and no one outside can call it.

      ```java
      private UtilityClass() { throw new AssertionError(); }
      ```

      The `AssertionError` catches accidental calls from inside.
      As a side effect, the class can't be subclassed either.

  - type: choice
    prompt: Why not just make the utility class `abstract`?
    options:
      - text: It can still be subclassed, and the subclass instantiated — and it misleadingly suggests subclassing is intended
        correct: true
      - text: Abstract classes can't have static methods
        feedback: They can.
      - text: It works fine — that's the standard approach
        feedback: It's a common mistake rather than the standard.
    explanation: A private constructor also prevents subclassing, because every subclass constructor must call a superclass one.
    details: |
      An abstract class can't be instantiated directly, but anyone can write `class MyUtils extends Utils {}` and instantiate that.
      Worse, `abstract` tells readers the class is meant to be subclassed — the opposite of the intent.
      A private constructor prevents both: no one outside can call it, and no subclass can exist, because a subclass's constructor must call a superclass constructor it can't see.

  - type: predict
    prompt: A class has no constructors written in it. Is `new Helper()` legal from another package?
    options:
      - text: Yes — the compiler supplies a public default constructor (for a public class)
        correct: true
      - text: No — no constructor means no instances
        feedback: Java adds a default constructor whenever none is declared.
    explanation: That invisible constructor is exactly what the private one suppresses.

  - type: choice
    prompt: |
      Why does a utility class's private constructor throw `AssertionError`?
    code: |
      public class UtilityClass {
          private UtilityClass() { throw new AssertionError(); }
          // static methods only
      }
    language: java
    options:
      - text: To catch accidental calls from inside the class itself
        correct: true
      - text: Private constructors must throw something
        feedback: They don't have to — it's a safety net.
    explanation: Outside code can't reach it anyway; the throw guards against the class's own code.

  - type: blank
    prompt: Complete the declaration.
    template: "[[private]] Arrays() {}"
    code: true
